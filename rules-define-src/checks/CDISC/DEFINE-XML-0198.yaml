# CodeList[@Name]/CodeListItem[@CodedValue] placeholders are carried by the
# finding's xpath.
Message: "Child element Decode is provided more than once for the CodeListItem element."
Check:
  kind: "cardinality_at_most"
  target: "Decode"
  max: 1
