Rule_Id: "DEFINE-XML-0172"
Sheet_Rule_Identifier: "172"
Rule_Set: "CDISC"
Element: "CodeList"
Attribute: "Name"
Applicable_Versions: ["2.1"]
Source_Type: "Specification"
Plain_Text_Rule: "Name attribute value must be unique within the set of Codelist elements."
# "The set of CodeList elements" is the CodeLists of one MetaDataVersion — their
# shared parent — so unique_among_siblings is the exact scope.
Message: "There is more than one Codelist with Name [${value}]."
Check:
  kind: "unique_among_siblings"
  attribute: "Name"
