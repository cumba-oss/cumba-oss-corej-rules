Rule_Id: "DEFINE-XML-0071"
Sheet_Rule_Identifier: "71"
Rule_Set: "CDISC"
Element: "ItemGroupDef/ItemRef"
Attribute: "KeySequence"
Applicable_Versions: ["2.0", "2.1"]
Source_Type: "Schema"
Plain_Text_Rule: "KeySequence attribute values in ItemGroupDef must be unique."
# unique_among_siblings groups by parent, so the uniqueness scope is one
# ItemGroupDef exactly as the sheet demands; the parent-qualified selector keeps
# def:ValueListDef/ItemRef out (the sheet's XPaths list ItemGroupDef only).
# Every occurrence after the first of a value is flagged.
Message: "KeySequence attribute has non-unique value [${value}] in the ItemGroupDef."
Check:
  kind: "unique_among_siblings"
  attribute: "KeySequence"
