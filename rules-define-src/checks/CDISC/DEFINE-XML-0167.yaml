Rule_Id: "DEFINE-XML-0167"
Sheet_Rule_Identifier: "167"
Rule_Set: "CDISC"
Element: "CodeList"
Attribute: "IsNonStandard"
Applicable_Versions: ["2.1"]
Source_Type: "Specification"
Plain_Text_Rule: "The value of the def:IsNonStandard attribute must be \"Yes\"."
# Value check fires only on a present def:IsNonStandard (conditional presence
# is sheet id 153, deferred to the P5 CT-gated batch).
Message: "The value of def:IsNonStandard [${value}] is not \"Yes\" for the CodeList element."
Check:
  kind: "one_of"
  attribute: "IsNonStandard"
  values: ["Yes"]
