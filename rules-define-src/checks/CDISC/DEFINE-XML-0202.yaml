Rule_Id: "DEFINE-XML-0202"
Sheet_Rule_Identifier: "202"
Rule_Set: "CDISC"
Element: "CodeListItem"
Attribute: "ExtendedValue"
Applicable_Versions: ["2.1"]
Source_Type: "Specification"
Requires: "ct"
Plain_Text_Rule: "Attribute @def:ExtendedValue must not be present when a CodeList is non-extensible."
# CodeListItem twin of DEFINE-XML-0187 (see there).
Message: "CodeListItem[@CodedValue] [${value}] has a def:ExtendedValue attribute but the CodeList[@Name]/Alias[@Name] is non-extensible."
Check:
  kind: "extended_value_marking"
  mode: "forbidden"
