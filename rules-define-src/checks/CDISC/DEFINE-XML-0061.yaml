Rule_Set: "CDISC"
Element: "Description"
Attribute: null
Applicable_Versions: ["2.0", "2.1"]
Source_Type: "Schema"
Plain_Text_Rule: "The Description element must have at least one TranslatedText child element"
# Sheet duplicate of id 60 (same normative text, different Rule Message); authored per its
# own Plain Text Rule, so both fire on a TranslatedText-less Description. The sheet's
# XPaths column additionally lists Decode/TranslatedText, but the normative rule text
# scopes to Description; the Decode half is id 62's own rule.
Message: "Description/TranslatedText not found."
Check:
  kind: "exists"
  target: "TranslatedText"
