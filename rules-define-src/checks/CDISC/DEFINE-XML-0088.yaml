Rule_Id: "DEFINE-XML-0088"
Sheet_Rule_Identifier: "88"
Rule_Set: "CDISC"
Element: "RangeCheck"
Attribute: "SoftHard"
Applicable_Versions: ["2.0", "2.1"]
Source_Type: "Schema"
Plain_Text_Rule: "The value of the SoftHard attribute must be one of \"Soft\", \"Hard\"."
# Enumeration verified against spec §5.3.10.1. Value check fires only on a present
# SoftHard (presence is sheet id 89); the "for def:WhereClauseDef[@OID]" tail is
# carried by the finding's xpath.
Message: "The value of SoftHard [${value}] is not one of \"Soft\", \"Hard\"."
Check:
  kind: "one_of"
  attribute: "SoftHard"
  values: ["Soft", "Hard"]
