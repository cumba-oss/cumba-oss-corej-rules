Rule_Id: "PMDA-DD0034-B"
Sheet_Rule_Identifier: "DD0034"
Rule_Set: "PMDA"
Element: "CodeListItem/Alias"
Attribute: "Name"
Applicable_Versions: ["2.0", "2.1"]
Severity: "Error"
Requires: "ct"
Plain_Text_Rule: "NCI Code for Codelist Term must exist in CDISC Controlled Terminology. Define-XML specification represents Term as CodedValue attribute on either EnumeratedItem or CodeListItem elements within CodeList element. NCI Code is represented as Name attribute on Alias element when Context attribute is \"nci:ExtCodeID\"."
# CodeListItem leg of PMDA-DD0034 (see there).
Message: "Unknown NCI Code value ${value} for Term in Codelist"
Check:
  kind: "nci_code_known"
  level: "term"
