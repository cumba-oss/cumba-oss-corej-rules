Rule_Id: "PMDA-DD0032-B"
Sheet_Rule_Identifier: "DD0032"
Rule_Set: "PMDA"
Element: "CodeListItem"
Attribute: "CodedValue"
Applicable_Versions: ["2.0", "2.1"]
Severity: "Error"
Requires: "ct"
Plain_Text_Rule: "NCI Code is required for each Codelist Term that is defined in CDISC Controlled Terminology. Define-XML specification represents Term as CodedValue attribute on either EnumeratedItem or CodeListItem elements within CodeList element. NCI Code is represented as Name attribute on Alias element when Context attribute is \"nci:ExtCodeID\"."
# CodeListItem leg of PMDA-DD0032 (see there).
Message: "Missing NCI Code for Term ${value} in Codelist"
Check:
  kind: "nci_alias_required"
  level: "term"
