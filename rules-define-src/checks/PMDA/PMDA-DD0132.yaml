Rule_Id: "PMDA-DD0132"
Sheet_Rule_Identifier: "DD0132"
Rule_Set: "PMDA"
Element: "EnumeratedItem"
Attribute: "ExtendedValue"
Applicable_Versions: ["2.1"]
Severity: "Error"
Requires: "ct"
Plain_Text_Rule: "For codelists that are non-extensible, the def:ExtendedValue attribute is not applicable and must not be included."
# CT-gated, EnumeratedItem leg (-B: CodeListItem). PMDA twin of CDISC 187/202.
# Fires when the parent CodeList resolves (via its nci:ExtCodeID alias) to a
# NON-EXTENSIBLE CT codelist yet the item carries def:ExtendedValue="Yes".
Message: "Invalid use of def:ExtendedValue attribute on CodedValue [${value}]"
Check:
  kind: "extended_value_marking"
  mode: "forbidden"
