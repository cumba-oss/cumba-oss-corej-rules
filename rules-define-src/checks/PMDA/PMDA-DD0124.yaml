Rule_Id: "PMDA-DD0124"
Sheet_Rule_Identifier: "DD0124"
Rule_Set: "PMDA"
Element: "ItemGroupDef/ItemRef"
Applicable_Versions: ["2.1"]
Severity: "Error"
Requires: "library"
Plain_Text_Rule: "Variables defined in a Standard with a Controlled Terminology requirement must have a codelist. Define-XML defines codelists using the CodeList element and references to those using CodeListRef elements."
# Library-gated; 2.1-only per the sheet. "Has a CT requirement" is the
# LibraryProvider's variableCodelistCCode answering non-empty for the variable
# (any standard the provider knows - the sheet says "a Standard", so no
# SDTMIG/SENDIG family filter here); the finding is the dereferenced ItemDef
# carrying no CodeListRef child. Variables the library does not know are out
# of reach.
Message: "Expected Codelist is missing [${value}]"
# Rule round 2026-10-12 (owner, DCE-1: "I would define a value-level codelist
# satisfies. This is likely a sheet issue."): a variable whose CT is attached at
# value level - its ItemDef's def:ValueListRef names a ValueListDef with at least
# one value-level ItemDef carrying a CodeListRef - is out of reach. CDISC's own MSG
# v2 example does this for RACE, DSDECOD, LBORRESU, LBSTRESC, LBSTRESU, RSSTRESC,
# VSORRESU, VSSTRESU. A ValueListRef whose value-level ItemDefs carry no
# CodeListRef still fires.
Check:
  kind: "library_codelist_ref_required"
  when:
    path: "@ItemOID->ItemDef@OID/ValueListRef/@ValueListOID->ValueListDef@OID/ItemRef/@ItemOID->ItemDef@OID/CodeListRef/@CodeListOID"
    exists: false
