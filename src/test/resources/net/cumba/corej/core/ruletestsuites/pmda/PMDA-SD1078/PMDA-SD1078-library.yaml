# Production-faithful CDISC-Library metadata for the PMDA-SD1078 scenarios.
#
# - "variables" (IG level, get_dataset_filtered_variables source) carry core:
#   AESEV is Permissible in SDTMIG 3.4 AE (verified: api_mdr_sdtmig_3-4, AE.AESEV core=Perm).
# - "model-variables" (SDTM Model level, get_model_filtered_variables source) carry NO core
#   attribute, exactly like the real SDTM Model metadata (verified: api_mdr_sdtm_2-0 —
#   class/dataset variables have name/label/role/simpleDatatype/ordinal, never core).
standard: sdtmig
version: "3-4"
domains:
  AE:
    variables:
      - { name: STUDYID, role: Identifier, core: Req }
      - { name: DOMAIN,  role: Identifier, core: Req }
      - { name: USUBJID, role: Identifier, core: Req }
      - { name: AESEQ,   role: Identifier, core: Req }
      - { name: AETERM,  role: Topic,      core: Req }
      - { name: AESEV,   role: "Record Qualifier", core: Perm }
    model-variables:
      - { name: STUDYID, role: Identifier }
      - { name: DOMAIN,  role: Identifier }
      - { name: USUBJID, role: Identifier }
      - { name: AESEQ,   role: Identifier }
      - { name: AETERM,  role: Topic }
      - { name: AESEV,   role: "Record Qualifier" }
  XX:
    # A sponsor domain the IG does not define (PLAN-unserved-key-name-skip): the production
    # dataset walk serves its observation class's SDTM Model rows, which carry NO core. So
    # key_name=core is unserved here and the rule SKIPs (CDW-F1), never a silent pass.
    variables:
      - { name: STUDYID, role: Identifier }
      - { name: DOMAIN,  role: Identifier }
      - { name: USUBJID, role: Identifier }
      - { name: XXSEQ,   role: Identifier }
      - { name: XXTERM,  role: Topic }
      - { name: XXSEV,   role: "Record Qualifier" }
