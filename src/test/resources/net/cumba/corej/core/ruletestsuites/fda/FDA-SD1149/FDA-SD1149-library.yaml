# Production-faithful synthetic metadata for FDA-SD1149.
#
# The CDISC *IG* dataset variables carry the core (Req/Exp/Perm) attribute; the
# SDTM *model* class variables do NOT (verified: zero `core` keys across every
# api_mdr_sdtm_* model version in /data/cdisc.metadata.library-cache). The rule
# reads `get_dataset_filtered_variables(key_name="core", key_value="Exp")`, the
# IG level ("variables" below); a model-level read of core would never match.
# This sidecar models both sides faithfully.
standard: sdtmig
version: "3-4"
domains:
  AE:
    variables:
      - { name: STUDYID, role: Identifier, core: Req }
      - { name: DOMAIN,  role: Identifier, core: Req }
      - { name: USUBJID, role: Identifier, core: Req }
      - { name: AESEQ,   role: Identifier, core: Req }
      - { name: AETERM,  role: Topic, core: Req }
      - { name: AESER,   role: "Record Qualifier", core: Exp }
    model-variables:
      - { name: STUDYID, role: Identifier }
      - { name: DOMAIN,  role: Identifier }
      - { name: USUBJID, role: Identifier }
      - { name: "--SEQ",  role: Identifier }
      - { name: "--TERM", role: Topic }
      - { name: "--SER",  role: "Record Qualifier" }
  XX:
    # A sponsor domain the IG does not define (PLAN-unserved-key-name-skip): the production
    # dataset walk serves its observation class's SDTM Model rows, which carry NO core. So
    # key_name=core is unserved here and the rule SKIPs (CDW-F1), never a silent pass.
    variables:
      - { name: STUDYID, role: Identifier }
      - { name: DOMAIN,  role: Identifier }
      - { name: USUBJID, role: Identifier }
      - { name: XXSEQ,   role: Identifier }
      - { name: XXTERM,  role: Topic }
      - { name: XXSEV,   role: "Record Qualifier" }
