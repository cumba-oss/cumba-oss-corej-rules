Core:
  Id: "FDA-SE2331"
  Status: "Published"
  Version: "1"
Description: "Raise an error when the Trial Summary (TS) dataset does not contain\
  \ a record where TSPARMCD equals 'GLPFL' (Good Laboratory Practice Flag)."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "TS"
Bindings:
- name: "$glpfl_count"
  expression: "record_count(filter=filter(TSPARMCD=\"GLPFL\"))"
Check:
  expression: >-
    $glpfl_count == 0
Outcome:
  Message: "Missing GLPFL Trial Summary Parameter: a 'Good Laboratory Practice Flag'\
    \ (GLPFL) record must be present in the Trial Summary (TS) domain."
  Output_Variables:
  - "$glpfl_count"
Source:
  FDA_Validator_Rule_Message: "Missing GLPFL Trial Summary Parameter"
  FDA_Validator_Rule_Description: "'Good Laboratory Practice Flag' (GLPFL) record\
    \ should be populated in Trial Summary (TS) domain."
  Domains: "TS"
