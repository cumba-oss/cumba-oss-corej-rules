Core:
  Id: "FDA-SD0011"
  Status: "Published"
  Version: "1"
Description: "Raise an error when Description of Planned Arm (ARM) is not 'Screen\
  \ Failure' while Planned Arm Code (ARMCD) equals 'SCRNFAIL'."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "DM"
    - "TA"
Requirements:
  Variables:
    All:
    - "ARMCD"
    - "ARM"
Check:
  expression: >-
    upper(ARMCD) == "SCRNFAIL" and upper(ARM) != "SCREEN FAILURE"
Outcome:
  Message: "ARM is not 'Screen Failure' when ARMCD equals 'SCRNFAIL'."
  Output_Variables:
  - "ARMCD"
  - "ARM"
Source:
  FDA_Validator_Rule_Message: "ARM is not 'Screen Failure', when ARMCD equals 'SCRNFAIL',\
    \ or vice versa"
  FDA_Validator_Rule_Description: "Description of Arm (ARM) must equal 'Screen Failure',\
    \  when Arm Code (ARMCD) is 'SCRNFAIL', and vice versa."
  Domains: "DM, TA"
Standards:
