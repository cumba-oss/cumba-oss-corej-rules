Core:
  Id: "FDA-SD2018"
  Status: "Published"
  Version: "1"
Description: "Raise an error when both the Parameter Value (TSVAL) and the Parameter\
  \ Null Flavor (TSVALNF) variables are populated."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "TS"
Requirements:
  Variables:
    All:
    - "TSVALNF"
Check:
  expression: >-
    not empty(TSVAL) and not empty(TSVALNF)
Outcome:
  Message: "Both TSVAL and TSVALNF variables are populated"
  Output_Variables:
  - "TSVAL"
  - "TSVALNF"
Source:
  FDA_Validator_Rule_Message: "Both --VAL and --VALNF variables are populated"
  FDA_Validator_Rule_Description: "Value for Parameter Null Flavor (--VALNF) variable\
    \ should be NULL, when Parameter Value (--VAL) variable value can be populated."
  Domains: "TS"
