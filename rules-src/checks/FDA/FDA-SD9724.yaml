Core:
  Id: "FDA-SD9724"
  Status: "Published"
  Version: "1"
Description: "Raise an error when neither an End Date/Time of Adverse Event (AEENDTC)\
  \ nor a Duration of Adverse Event (AEDUR) variable is present in the dataset although\
  \ a record reports the Outcome of Adverse Event (AEOUT) as 'RECOVERED/RESOLVED'."
Sensitivity: "Dataset"
Executability: "Partially Executable - Possible Overreporting"
Scope:
  Domains:
    Include:
    - "AE"
Requirements:
  Variables:
    None:
    - "AEENDTC"
    - "AEDUR"
    All:
    - "AEOUT"
Check:
  expression: >-
    AEOUT == "RECOVERED/RESOLVED"
Outcome:
  Message: "Neither AEENDTC nor AEDUR is present in the dataset although AEOUT is\
    \ equal to RECOVERED/RESOLVED."
Source_Proposed:
  Sheet_Issue: "#197"
  FDA_Validator_Rule_Message: "Neither an end date (AEENDTC) nor a collected duration\
    \ (AEDUR) variable is present in the dataset when AEOUT = RECOVERED/RESOLVED"
  FDA_Validator_Rule_Description: "At least one of the End Date/Time of Adverse Event\
    \ (AEENDTC) or Duration of Adverse Event (AEDUR) variables must be present in\
    \ the dataset when the Outcome of Adverse Event (AEOUT) variable is populated\
    \ with the value RECOVERED/RESOLVED."
  Domains: "AE"
Standards:
- Organization: "FDA"
  Standards:
  - Name: "SDTMIG"
    Version: "3.4"
  - Name: "SDTMIG"
    Version: "3.3"
  - Name: "SDTMIG"
    Version: "3.2"
  - Name: "SDTMIG"
    Version: "3.1.3"
  - Name: "SDTMIG"
    Version: "3.1.2"
