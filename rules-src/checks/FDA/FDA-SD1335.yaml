Core:
  Id: "FDA-SD1335"
  Status: "Published"
  Version: "1"
Description: "Raise an error when the Date/Time of Informed Consent (RFICDTC) is after\
  \ the Date/Time of First Study Treatment (RFXSTDTC)."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "DM"
Requirements:
  Variables:
    All:
    - "RFXSTDTC"
Check:
  expression: >-
    not empty(RFICDTC) and date(RFICDTC) > date(RFXSTDTC)
Outcome:
  Message: "RFICDTC is after RFXSTDTC"
  Output_Variables:
  - "RFXSTDTC"
  - "RFICDTC"
Source:
  FDA_Validator_Rule_Message: "RFICDTC is after RFXSTDTC"
  FDA_Validator_Rule_Description: "Date/Time of Informed Consent (RFICDTC) should\
    \ not be after Date/Time of First Study Treatment (RFXSTDTC)."
  Domains: "DM"
