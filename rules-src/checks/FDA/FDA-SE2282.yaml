Core:
  Id: "FDA-SE2282"
  Status: "Published"
  Version: "1"
Description: "Raise an error when more than one record exists for the same USUBJID\
  \ within a POOLID in the Pool Definition (POOLDEF) domain."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "POOLDEF"
Requirements:
  Variables:
    All:
    - "USUBJID"
Check:
  expression: >-
    not empty(POOLID) and not is_unique_set([USUBJID, POOLID])
Outcome:
  Message: "USUBJID is not unique within POOLID in the Pool Definition (POOLDEF) domain."
Source:
  FDA_Validator_Rule_Message: "Duplicate USUBJID within a POOLID"
  FDA_Validator_Rule_Description: "There should be only one record per subject (USUBJID)\
    \ within Pool Identifier (POOLID) in the Pool Definition (POOLDEF) domain."
  Domains: "POOLDEF"
