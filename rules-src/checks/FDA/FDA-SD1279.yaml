Core:
  Id: "FDA-SD1279"
  Status: "Published"
  Version: "1"
Description: "Raise an error when ECDOSE is missing, ECOCCUR is not equal to 'N',\
  \ ECSTAT does not equal 'NOT DONE', and ECDOSTXT is empty."
Executability: "Partially Executable - Possible Underreporting"
Scope:
  Domains:
    Include:
    - "EC"
Check:
  expression: >-
    empty(ECDOSE) and (not var_exists("ECOCCUR") or ECOCCUR != "N") and ECSTAT != "NOT DONE" and
    empty(ECDOSTXT)
Outcome:
  Message: "ECDOSTXT is empty when ECDOSE is missing, ECOCCUR does not equal 'N' and\
    \ ECSTAT does not equal 'NOT DONE'."
  Message_Folded: "ECDOSTXT is absent or empty although ECDOSE is missing, ECOCCUR\
    \ does not equal 'N' and ECSTAT does not equal 'NOT DONE'."
  Keep_Row_Findings:
  - "ECSTAT"
Source:
  FDA_Validator_Rule_Message: "ECDOSTXT is null when ECDOSE is null and ECOCCUR does\
    \ not equal 'N'"
  FDA_Validator_Rule_Description: "Dose Description (ECDOSTXT) should be populated\
    \ when Dose (ECDOSE) is null, ECOCCUR does not equal 'N', and ECSTAT does not\
    \ equal 'NOT DONE'."
  Domains: "EC"
