Core:
  Id: "FDA-SD1397"
  Status: "Published"
  Version: "1"
Description: "Raise an error when Start Date/Time of Observation (--STDTC) and Date/Time\
  \ of First Challenge Agent Admin (RFCSTDTC) are both populated as complete dates\
  \ but Start Day of Obs Rel to Challenge Agent (--CHSTDY) is missing."
Executability: "Fully Executable"
Scope:
  Classes:
    Include:
    - "INTERVENTIONS"
    - "EVENTS"
    - "FINDINGS"
    - "FINDINGS ABOUT"
Requirements:
  Variables:
    All:
    - "--CHSTDY"
    - "--STDTC"
    - "STUDYID"
    - "USUBJID"
    All_Or_None:
    - - "STUDYID"
      - "DM.STUDYID"
    - - "USUBJID"
      - "DM.USUBJID"
Match_Datasets:
- Keys:
  - "STUDYID"
  - "USUBJID"
  Cardinality: "n:1"
  Name: "DM"
Check:
  expression: >-
    not empty(--STDTC) and is_complete_date(--STDTC) and not empty(DM.RFCSTDTC) and
    is_complete_date(DM.RFCSTDTC) and empty(--CHSTDY)
Outcome:
  Message: "Start Day of Obs Rel to Challenge Agent (--CHSTDY) is missing when --STDTC\
    \ and RFCSTDTC are both populated complete dates."
  Message_Folded: "--CHSTDY not populated in any record of the dataset, and at least\
    \ one record meets the rest of the condition: Start Day of Obs Rel to Challenge\
    \ Agent (--CHSTDY) is missing when --STDTC and RFCSTDTC are both populated complete\
    \ dates."
  Output_Variables:
  - "!--CHSTDY"
Source:
  FDA_Validator_Rule_Message: "--CHSTDY variable value is not populated"
  FDA_Validator_Rule_Description: "Start Day of Obs Rel to Challenge Agent (--CHSTDY)\
    \ variable value should be populated, when Start Date/Time of Observation (--STDTC)\
    \ and Date/Time of First Challenge Agent Admin (RFCSTDTC) variables values are\
    \ provided, and both of them include complete date parts."
  Domains: "INTERVENTIONS, FINDINGS, EVENTS, FINDINGS ABOUT"
Standards:
- Organization: "FDA"
  Standards:
  - Name: "SENDIG-AR"
    Version: "1.0"
    References:
    - Origin: "FDA Validator Rules"
      Rule_Identifier:
        Id: "SD1397"
        Version: "1"
      Version: "1.6"
