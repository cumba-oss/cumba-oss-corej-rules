Core:
  Id: "FDA-SD1396"
  Status: "Published"
  Version: "1"
Description: "Raise an error when Date/Time of Collection (--DTC) and Date/Time of\
  \ First Challenge Agent Admin (RFCSTDTC) are both populated as complete dates but\
  \ Day of Obs Rel to Challenge Agent (--CHDY) is missing."
Executability: "Fully Executable"
Scope:
  Classes:
    Include:
    - "INTERVENTIONS"
    - "EVENTS"
    - "FINDINGS"
    - "FINDINGS ABOUT"
Requirements:
  Variables:
    All:
    - "--CHDY"
    - "--DTC"
    - "STUDYID"
    - "USUBJID"
    All_Or_None:
    - - "STUDYID"
      - "DM.STUDYID"
    - - "USUBJID"
      - "DM.USUBJID"
Match_Datasets:
- Keys:
  - "STUDYID"
  - "USUBJID"
  Cardinality: "n:1"
  Name: "DM"
Check:
  expression: >-
    not empty(--DTC) and is_complete_date(--DTC) and not empty(DM.RFCSTDTC) and
    is_complete_date(DM.RFCSTDTC) and empty(--CHDY)
Outcome:
  Message: "Day of Obs Rel to Challenge Agent (--CHDY) is missing when --DTC and RFCSTDTC\
    \ are both populated complete dates."
  Message_Folded: "--CHDY not populated in any record of the dataset, and at least\
    \ one record meets the rest of the condition: Day of Obs Rel to Challenge Agent\
    \ (--CHDY) is missing when --DTC and RFCSTDTC are both populated complete dates."
  Output_Variables:
  - "!--CHDY"
Source:
  FDA_Validator_Rule_Message: "--CHDY variable value is not populated"
  FDA_Validator_Rule_Description: "Day of Obs Rel to Challenge Agent (--CHDY) variable\
    \ value should be populated, when Date/Time of Collection (--DTC) and Date/Time\
    \ of First Challenge Agent Admin (RFCSTDTC) variables values are provided, and\
    \ both of them include complete date parts."
  Domains: "INTERVENTIONS, FINDINGS, EVENTS, FINDINGS ABOUT"
Standards:
- Organization: "FDA"
  Standards:
  - Name: "SENDIG-AR"
    Version: "1.0"
    References:
    - Origin: "FDA Validator Rules"
      Rule_Identifier:
        Id: "SD1396"
        Version: "1"
      Version: "1.6"
