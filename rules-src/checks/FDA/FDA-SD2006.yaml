Core:
  Id: "FDA-SD2006"
  Status: "Published"
  Version: "1"
Description: "Raise an error when the Qualifier Variable Name (QNAM) in a supplemental\
  \ qualifier dataset names a MedDRA coding variable (a domain-prefixed --LLT, --LLTCD,\
  \ --DECOD, --PTCD, --HLT, --HLTCD, --HLGT, --HLGTCD, --BODSYS, --BDSYCD, --SOC or\
  \ --SOCCD variable)."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "SUPP--"
    - "SQ--"
Requirements:
  Variables:
    All:
    - "QNAM"
Check:
  expression: >-
    QNAM =~ /^[A-Z]{2}(LLT|LLTCD|DECOD|PTCD|HLT|HLTCD|HLGT|HLGTCD|BODSYS|BDSYCD|SOC|SOCCD)$/
Outcome:
  Message: "MedDRA coding variable (QNAM) submitted in a SUPPQUAL dataset instead\
    \ of the Events General Observation Class dataset."
Source:
  FDA_Validator_Rule_Message: "Unexpected MedDRA coding in the SUPPQUAL domain"
  FDA_Validator_Rule_Description: "MedDRA coding info should be populated using variables\
    \ in the Events General Observation Class, but not in SUPPQUAL domains."
  Domains: "SUPPQUAL"
