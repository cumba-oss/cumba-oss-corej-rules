Core:
  Id: "FDA-SD2221"
  Status: "Published"
  Version: "1"
Description: "Raise an error when the Trial Summary (TS) dataset does not contain\
  \ a record where TSPARMCD equals 'REGID' (Registry Identifier)."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "TS"
Bindings:
- name: "$regid_count"
  expression: "record_count(filter=filter(TSPARMCD=\"REGID\"))"
Check:
  expression: >-
    $regid_count == 0
Outcome:
  Message: "Missing REGID Trial Summary Parameter: a 'Registry Identifier' (REGID)\
    \ record is expected to be present in the Trial Summary (TS) domain."
  Output_Variables:
  - "$regid_count"
Source:
  FDA_Validator_Rule_Message: "Missing REGID Trial Summary Parameter"
  FDA_Validator_Rule_Description: "'Registry Identifier' (REGID) record may be populated\
    \ in Trial Summary (TS) domain. It is expected for SDTM IG v3.1.2 data and all\
    \ more recent SDTM versions."
  Domains: "TS"
Standards:
