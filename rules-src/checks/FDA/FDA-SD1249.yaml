Core:
  Id: "FDA-SD1249"
  Status: "Published"
  Version: "1"
Description: "Raise an error when EXTRT equals 'PLACEBO' but EXDOSE does not equal\
  \ 0."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "EX"
Requirements:
  Variables:
    All:
    - "EXTRT"
Check:
  expression: >-
    EXTRT == "PLACEBO" and EXDOSE != 0
Outcome:
  Message: "EXDOSE does not equal 0 when EXTRT equals 'PLACEBO'."
Source:
  FDA_Validator_Rule_Message: "EXDOSE does not equal 0 when EXTRT = 'PLACEBO'"
  FDA_Validator_Rule_Description: "EXDOSE must be equal to 0 when EXTRT = 'PLACEBO'."
  Domains: "EX"
