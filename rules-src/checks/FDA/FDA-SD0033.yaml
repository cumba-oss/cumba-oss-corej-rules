Core:
  Id: "FDA-SD0033"
  Status: "Published"
  Version: "1"
Description: "Raise an error when Planned Time Point Number (--TPTNUM) is missing\
  \ while Planned Time Point Name (--TPT) is populated."
Executability: "Partially Executable - Possible Underreporting"
Scope:
  Classes:
    Include:
    - "INTERVENTIONS"
    - "EVENTS"
    - "FINDINGS"
    - "FINDINGS ABOUT"
Requirements:
  Variables:
    All:
    - "--TPT"
    - "--TPTNUM"
Check:
  expression: >-
    not empty(--TPT) and empty(--TPTNUM)
Outcome:
  Message: "--TPTNUM is missing when --TPT is populated."
  Message_Folded: "--TPTNUM not populated in any record of the dataset, and at least\
    \ one record meets the rest of the condition: --TPTNUM is missing when --TPT is\
    \ populated."
Source:
  FDA_Validator_Rule_Message: "Missing value for --TPTNUM, when --TPT is provided"
  FDA_Validator_Rule_Description: "Planned Time Point Number (--TPTNUM) should not\
    \ be NULL, when Planned Time Point Name (--TPT) is populated."
  Domains: "CO, INTERVENTIONS, EVENTS, FINDINGS, FINDINGS ABOUT"
