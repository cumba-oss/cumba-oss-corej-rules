Core:
  Id: "FDA-SD1201"
  Status: "Published"
  Version: "1"
Description: "Raise an error when an Events class domain contains more than one record\
  \ for the same subject (USUBJID) with the same --TERM, --DECOD, --CAT, --SCAT, --OCCUR,\
  \ --LOC, --LAT, --DIR, --SEV, --TOXGR, VISITNUM, VISITDY, --STTPT, and --STDTC values."
Executability: "Fully Executable"
Scope:
  Classes:
    Include:
    - "EVENTS"
Requirements:
  Variables:
    All:
    - "--TERM"
Check:
  expression: >-
    not is_unique_set([--TERM, USUBJID, --DECOD, --CAT, --SCAT, --OCCUR, --LOC, --LAT, --DIR, --SEV,
    --TOXGR, VISITNUM, VISITDY, --STTPT, --STDTC])
Outcome:
  Message: "Duplicate records in domain: more than one Event record exists for the\
    \ subject with the same key values."
Source:
  FDA_Validator_Rule_Message: "Duplicate records in domain"
  FDA_Validator_Rule_Description: "The structure of Events class domains should be\
    \ one records per Event per subject. No Events with the same Collected Term (--TERM),\
    \ Decoded Term (--DECOD), Category (--CAT), Subcategory (--SCAT), Occurrence (--OCCUR),\
    \ Location (--LOC), Laterality (--LAT), Directionality (--DIR), Severity (--SEV),\
    \ Toxicity Grade (--TOXGR), Visit Number (VISITNUM), Visit Day (VISITDY), and\
    \ Start Reference Time Point (--STTPT) values for the same Subject (USUBJID) and\
    \ the same Start Date (--STDTC) are expected."
  Domains: "EVENTS"
