Core:
  Id: "FDA-SE2230"
  Status: "Published"
  Version: "1"
Description: "Raise an error when SET (Set Description) has more than one value for\
  \ a given SETCD (Set Code); all SET values should be the same within a SETCD."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "TX"
Check:
  expression: >-
    not empty(SET) and not empty(SETCD) and has_multiple_values_for(SET, SETCD)
Outcome:
  Message: "SET has more than one value for a given SETCD; all SET values should be\
    \ the same within a SETCD."
Source:
  FDA_Validator_Rule_Message: "Inconsistent value for SET within SETCD"
  FDA_Validator_Rule_Description: "All values of Set Description (SET) should be the\
    \ same for a given value of Set Code (SETCD)."
  Domains: "TX"
