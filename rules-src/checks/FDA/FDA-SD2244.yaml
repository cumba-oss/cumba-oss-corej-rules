Core:
  Id: "FDA-SD2244"
  Status: "Published"
  Version: "1"
Description: "Raise an error when TSVCDREF is not equal to 'ISO 3166' for a record\
  \ where TSPARMCD equals 'FCNTRY' (Planned Country of Investigational Sites)."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "TS"
Requirements:
  Variables:
    All:
    - "TSPARMCD"
    - "TSVCDREF"
Check:
  expression: >-
    TSPARMCD == "FCNTRY" and TSVCDREF != "ISO 3166"
Outcome:
  Message: "Invalid TSVCDREF value for FCNTRY: TSVCDREF must equal 'ISO 3166' when\
    \ TSPARMCD equals 'FCNTRY'."
Source:
  FDA_Validator_Rule_Message: "Invalid TSVCDREF value for FCNTRY"
  FDA_Validator_Rule_Description: "TSVCDREF variable value must be 'ISO 3166', when\
    \ TSPARMCD='FCNTRY'."
  Domains: "TS"
