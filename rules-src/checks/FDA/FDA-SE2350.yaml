Core:
  Id: "FDA-SE2350"
  Status: "Published"
  Version: "1"
Description: "Raise an error when --LLOQ is populated but --STRESU is empty or not\
  \ present."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "PC"
Check:
  expression: >-
    not empty(--LLOQ) and empty(--STRESU)
Outcome:
  Message: "--STRESU is empty when --LLOQ is populated."
  Message_Folded: "--STRESU absent or not populated in any record of the dataset,\
    \ and at least one record meets the rest of the condition: --STRESU is empty when\
    \ --LLOQ is populated."
Source:
  FDA_Validator_Rule_Message: "Missing value for --STRESU, when --LLOQ is provided"
  FDA_Validator_Rule_Description: "Lower Limit of Quantitation (--LLOQ) should be\
    \ presented using the same units as those presented in Standard Units (--STRESU).\
    \ When --LLOQ is provided, --STRESU should also be populated."
  Domains: "PC"
Standards:
- Organization: "FDA"
  Standards:
