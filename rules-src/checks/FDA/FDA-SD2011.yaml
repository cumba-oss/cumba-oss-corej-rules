Core:
  Id: "FDA-SD2011"
  Status: "Published"
  Version: "1"
Description: "Raise an error when a High Level Term Code (--HLTCD) value is not a\
  \ valid High Level Term code in the MedDRA dictionary."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "AE"
    - "CE"
    - "MH"
Requirements:
  Variables:
    All:
    - "--HLTCD"
Bindings:
- name: "$hltcd_valid"
  expression: "valid_external_dictionary_code(--HLTCD, external_dictionary_type=\"\
    meddra\", dictionary_term_type=\"HLTCD\")"
Check:
  expression: >-
    $hltcd_valid == false
Outcome:
  Message: "High Level Term Code (--HLTCD) is not a valid MedDRA High Level Term code."
Source:
  FDA_Validator_Rule_Message: "Value for --HLTCD not found in MedDRA dictionary"
  FDA_Validator_Rule_Description: "Value for High Level Term Code (--HLTCD) variable\
    \ must be populated using a High Level Term Code of the MedDRA dictionary of a\
    \ version specified in the define.xml."
  Domains: "AE, CE, MH"
Standards:
