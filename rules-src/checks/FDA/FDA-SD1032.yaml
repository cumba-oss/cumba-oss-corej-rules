Core:
  Id: "FDA-SD1032"
  Status: "Published"
  Version: "1"
Description: "Raise an error when a subject in the Demographics (DM) dataset whose\
  \ Planned Arm Code (ARMCD) equals 'SCRNFAIL' has no record in the Inclusion/Exclusion\
  \ Criteria Not Met (IE) dataset."
Executability: "Partially Executable - Possible Overreporting"
Scope:
  Domains:
    Include:
    - "DM"
Requirements:
  Variables:
    All:
    - "ARMCD"
Grouping:
  Variables:
  - "USUBJID"
Bindings:
- name: "$ie_record_count"
  expression: "record_count(domain=\"IE\", group=[USUBJID])"
Check:
  expression: >-
    ARMCD == "SCRNFAIL" and $ie_record_count < 1
Outcome:
  Message: "No Inclusion/Exclusion Criteria Not Met (IE) record is present for the\
    \ screen-failure (ARMCD equals 'SCRNFAIL') subject."
  Output_Variables:
  - "ARMCD"
  - "$ie_record_count"
Source:
  FDA_Validator_Rule_Message: "No records for 'SCRNFAIL' subject are found in IE domain"
  FDA_Validator_Rule_Description: "All subjects with Planned Arm Code (ARMCD) equals\
    \ 'SCRNFAIL' should have records in the Inclusion/Exclusion Criteria Not Met (IE)\
    \ domain."
  Domains: "DM"
Standards:
- Organization: "FDA"
  Standards:
  - Name: "SDTMIG"
    Version: "3.2"
    References:
    - Origin: "FDA Validator Rules"
      Rule_Identifier:
