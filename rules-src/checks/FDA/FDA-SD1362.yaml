Core:
  Id: "FDA-SD1362"
  Status: "Published"
  Version: "1"
Description: "Raise an error when Description of Actual Arm (ACTARM) is populated\
  \ but Actual Arm Code (ACTARMCD) is empty; both must be populated together."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "DM"
Requirements:
  Variables:
    All:
    - "ACTARMCD"
    - "ACTARM"
Check:
  expression: >-
    empty(ACTARMCD) and not empty(ACTARM)
Outcome:
  Message: "ACTARM is populated but ACTARMCD is empty."
  Output_Variables:
  - "ACTARMCD"
  - "ACTARM"
Source:
  FDA_Validator_Rule_Message: "ACTARM is populated, but ACTARMCD is null, or vice\
    \ versa"
  FDA_Validator_Rule_Description: "Description of Actual Arm (ACTARM) must be populated,\
    \ when Actual Arm Code (ACTARMCD) is populated, and vice versa."
  Domains: "DM"
Standards:
- Organization: "FDA"
  Standards:
  - Name: "SDTMIG"
    Version: "3.4"
    References:
    - Origin: "FDA Validator Rules"
      Rule_Identifier:
        Id: "SD1362"
        Version: "1"
      Version: "1.6"
  - Name: "SDTMIG"
    Version: "3.3"
    References:
    - Origin: "FDA Validator Rules"
      Rule_Identifier:
        Id: "SD1362"
        Version: "1"
      Version: "1.6"
- Organization: "CDISC"
  Standards:
  - Name: "SDTMIG"
    Version: "3.4"
    References:
