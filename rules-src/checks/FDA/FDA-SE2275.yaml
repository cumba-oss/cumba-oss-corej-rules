Core:
  Id: "FDA-SE2275"
  Status: "Published"
  Version: "1"
Description: "Raise an error when the Trial Summary (TS) dataset contains more than\
  \ one record where TSPARMCD equals 'STDIR' (Study Director)."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "TS"
Bindings:
- name: "$stdir_count"
  expression: "record_count(filter=(TSPARMCD == \"STDIR\"))"
Check:
  expression: >-
    $stdir_count > 1
Outcome:
  Message: "Multiple STDIR records: the Trial Summary (TS) domain must contain only\
    \ one record for the 'STDIR' (Study Director) parameter."
  Output_Variables:
  - "$stdir_count"
Source:
  FDA_Validator_Rule_Message: "Multiple STDIR records"
  FDA_Validator_Rule_Description: "Trial Summary (TS) domain must contain only one\
    \ record for the 'STDIR' parameter."
  Domains: "TS"
