Core:
  Id: "FDA-SD1259"
  Status: "Published"
  Version: "1"
Description: "Raise an error when the length of SETCD is greater than 8 characters."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "DM"
Check:
  expression: >-
    len(SETCD) > 8
Outcome:
  Message: "SETCD value length is greater than 8 characters."
Source:
  FDA_Validator_Rule_Message: "Invalid value for SETCD"
  FDA_Validator_Rule_Description: "The value of Set Code (SETCD) should be no more\
    \ than 8 characters in length."
  Domains: "DM"
