Core:
  Id: "FDA-SD1266"
  Status: "Published"
  Version: "1"
Description: "Raise an error when ETCD is equal to 'UNPLAN' and SEUPDES is not populated."
Executability: "Partially Executable - Possible Underreporting"
Scope:
  Domains:
    Include:
    - "SE"
Requirements:
  Variables:
    All:
    - "ETCD"
Check:
  expression: >-
    empty(SEUPDES) and ETCD == "UNPLAN"
Outcome:
  Message: "ETCD is equal to 'UNPLAN' when SEUPDES is empty."
  Message_Folded: "SEUPDES is absent or empty although ETCD is equal to 'UNPLAN'."
Source:
  FDA_Validator_Rule_Message: "ETCD equals 'UNPLAN' when SEUPDES is null"
  FDA_Validator_Rule_Description: "When the Description of Unplanned Element (SEUPDES)\
    \ is not populated, the Element Code (ETCD) should not be equal to 'UNPLAN'."
  Domains: "SE"
