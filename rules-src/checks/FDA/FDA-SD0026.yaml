Core:
  Id: "FDA-SD0026"
  Status: "Published"
  Version: "1"
Description: "Raise an error when --ORRES (Result or Finding in Original Units) is\
  \ populated with a numeric result but --ORRESU (Original Units) is empty."
Executability: "Partially Executable - Possible Underreporting"
Scope:
  Classes:
    Include:
    - "FINDINGS"
    - "FINDINGS ABOUT"
Requirements:
  Variables:
    All:
    - "--ORRES"
Check:
  expression: >-
    not empty(--ORRES) and --ORRES =~ /^-?[0-9]+(\\.[0-9]+)?$/ and empty(--ORRESU)
Outcome:
  Message: "Missing value for --ORRESU, when --ORRES is provided"
  Message_Folded: "--ORRES has at least one non-empty value but --ORRESU is absent\
    \ or empty."
  Output_Variables:
  - "--TESTCD"
  - "!--ORRESU"
Source:
  FDA_Validator_Rule_Message: "Missing value for --ORRESU, when --ORRES is provided"
  FDA_Validator_Rule_Description: "Original Units (--ORRESU) should not be NULL, when\
    \ Result or Finding in Original Units (--ORRES) is provided is a numeric result."
  Domains: "FINDINGS, FINDINGS ABOUT"
