Core:
  Id: "FDA-SD1045"
  Status: "Published"
  Version: "1"
Description: "Raise an error when I/E Criterion Original Result (IEORRES) does not\
  \ equal 'Y' while Inclusion/Exclusion Category (IECAT) is 'EXCLUSION'."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "IE"
Requirements:
  Variables:
    All:
    - "IECAT"
    - "IEORRES"
Check:
  expression: >-
    IECAT == "EXCLUSION" and IEORRES != "Y"
Outcome:
  Message: "IEORRES does not equal 'Y' when IECAT is 'EXCLUSION'."
  Output_Variables:
  - "IECAT"
  - "IEORRES"
Source:
  FDA_Validator_Rule_Message: "Inconsistent values for IEORRES/IECAT"
  FDA_Validator_Rule_Description: "I/E Criterion Original Result (IEORRES) must equal\
    \ 'Y', when Inclusion/Exclusion Category (IECAT) is 'EXCLUSION'."
  Domains: "IE"
