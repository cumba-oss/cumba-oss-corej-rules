Core:
  Id: "FDA-SE1127"
  Status: "Published"
  Version: "1"
Description: "Raise an error when --TPTNUM and --TPT are populated but --TPTNUM does\
  \ not have the same value across records that share the same DOMAIN, --TPT, --DY,\
  \ and (if present) --CAT and --SCAT."
Executability: "Fully Executable"
Scope:
  Classes:
    Include:
    - "FINDINGS"
Check:
  expression: >-
    not empty(--TPTNUM) and not empty(--TPT) and is_inconsistent_across_dataset(--TPTNUM,
    keys=[DOMAIN, --TPT, --DY, --CAT, --SCAT])
Outcome:
  Message: "Inconsistent value for --TPTNUM: it is not the same across records sharing\
    \ the same --TPT, --DY, and (if present) --CAT/--SCAT."
Source:
  FDA_Validator_Rule_Message: "Inconsistent value for --TPTNUM within --TPT, --DY,\
    \ --CAT and/or --SCAT"
  FDA_Validator_Rule_Description: "All values of Planned Time Point Number (--TPTNUM)\
    \ variable should be the same for a given value of Planned Time Point Name (--TPT)\
    \ variable. Uniqueness for these time points is determined by a combination of\
    \ the domain, Study Day (--DY), and, if present, category and/or subcategory (--CAT/--SCAT)."
  Domains: "FINDINGS"
