Core:
  Id: "FDA-SD1123"
  Status: "Published"
  Version: "1"
Description: "Raise an error when Status (--STAT) is equal to 'NOT DONE' but the Original\
  \ Result (--ORRES) is populated."
Executability: "Fully Executable"
Scope:
  Classes:
    Include:
    - "FINDINGS"
    - "FINDINGS ABOUT"
Requirements:
  Variables:
    All:
    - "--STAT"
Check:
  expression: >-
    --STAT == "NOT DONE" and not empty(--ORRES)
Outcome:
  Message: "--ORRES is populated when --STAT is equal to 'NOT DONE'."
Source:
  FDA_Validator_Rule_Message: "--ORRES value is populated, when --STAT is 'NOT DONE'"
  FDA_Validator_Rule_Description: "Value of Original Result (--ORRES) variable is\
    \ expected to be missing, when observation was not performed (Status (--STAT)\
    \ is 'NOT DONE')."
  Domains: "FINDINGS, FINDINGS ABOUT"
