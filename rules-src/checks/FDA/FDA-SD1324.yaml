Core:
  Id: "FDA-SD1324"
  Status: "Published"
  Version: "1"
Description: "Raise an error when the variable label in the submitted dataset does\
  \ not match the variable label declared in the Define-XML."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "ALL"
Check:
  expression: >-
    not empty(var_name("DEFINE")) and var_label("DATA") != var_label("DEFINE")
Outcome:
  Message: "The variable label in the dataset does not match the variable label in\
    \ the Define-XML."
  Output_Variables:
  - "variable_label"
  - "define_variable_label"
Source:
  FDA_Validator_Rule_Message: "Define.xml/dataset variable label mismatch"
  FDA_Validator_Rule_Description: "Variable Label in define.xml must match variable\
    \ Label in dataset."
  Domains: "ALL"
