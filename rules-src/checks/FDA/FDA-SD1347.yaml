Core:
  Id: "FDA-SD1347"
  Status: "Published"
  Version: "1"
Description: "Raise an error when a fatal Adverse Event (AEOUT equals 'FATAL') has\
  \ an End Date/Time of Adverse Event (AEENDTC) that is not equal to the subject's\
  \ Date/Time of Death (DM.DTHDTC)."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "AE"
Requirements:
  Variables:
    All:
    - "AEOUT"
    - "STUDYID"
    - "USUBJID"
    All_Or_None:
    - - "STUDYID"
      - "DM.STUDYID"
    - - "USUBJID"
      - "DM.USUBJID"
Match_Datasets:
- Keys:
  - "STUDYID"
  - "USUBJID"
  Cardinality: "n:1"
  Name: "DM"
Check:
  expression: >-
    AEOUT == "FATAL" and not empty(AEENDTC) and not empty(DM.DTHDTC) and date(AEENDTC) !=
    date(DM.DTHDTC)
Outcome:
  Message: "AEENDTC for a fatal Adverse Event (AEOUT equals 'FATAL') is not the same\
    \ as the subject's Date/Time of Death (DM.DTHDTC)."
Source:
  FDA_Validator_Rule_Message: "AEENDTC for fatal AE is not the same as DM.DTHDTC"
  FDA_Validator_Rule_Description: "Fatal Adverse Event records (AEOUT = 'FATAL') in\
    \ the Adverse Events (AE) domain should have End Date/Time of Adverse Event (AEENDTC)\
    \ equal to subject's Date/Time of Death (DTHDTC) populated in the Demographics\
    \ (DM) domain. Subject's Date/Time of Death info should be consistent across all\
    \ domains."
  Domains: "AE"
Standards:
- Organization: "FDA"
  Standards:
  - Name: "SDTMIG"
    Version: "3.4"
    References:
    - Origin: "FDA Validator Rules"
      Rule_Identifier:
