Core:
  Id: "FDA-SD0043"
  Status: "Published"
  Version: "1"
Description: "Raise an error when --VAMT (Treatment Vehicle Amount) is populated but\
  \ --TRTV (Treatment Vehicle) is empty."
Executability: "Fully Executable"
Scope:
  Classes:
    Include:
    - "INTERVENTIONS"
Requirements:
  Variables:
    All:
    - "--TRTV"
    - "--VAMT"
Check:
  expression: >-
    not empty(--VAMT) and empty(--TRTV)
Outcome:
  Message: "--TRTV is empty when --VAMT is populated."
Source:
  FDA_Validator_Rule_Message: "Missing value for --TRTV, when --VAMT is not NULL"
  FDA_Validator_Rule_Description: "Treatment Vehicle (--TRTV) should be provided,\
    \ when Treatment Vehicle Amount (--VAMT) is specified."
  Domains: "INTERVENTIONS"
