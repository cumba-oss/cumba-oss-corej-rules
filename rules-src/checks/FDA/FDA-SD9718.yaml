Core:
  Id: "FDA-SD9718"
  Status: "Published"
  Version: "1"
Description: "Raise an error when none of the variables Start Date/Time (--STDTC),\
  \ Collection Date/Time (--DTC) and Start Study Day (--STDY) is present in the dataset."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "DS"
Check:
  expression: >-
    not var_exists("--STDTC") and not var_exists("--DTC") and not var_exists("--STDY")
Outcome:
  Message: "None of --STDTC, --DTC and --STDY is present in the dataset."
Source_Proposed:
  Sheet_Issue: "#181"
  FDA_Validator_Rule_Message: "Neither --STDTC, --DTC nor --STDY is present in the\
    \ dataset"
  FDA_Validator_Rule_Description: "At least one of the three variables Start Date/Time\
    \ (--STDTC), Collection Date/Time (--DTC) or Start Study Day (--STDY) must be\
    \ present in the dataset."
  Domains: "DS"
Standards:
- Organization: "FDA"
  Standards:
  - Name: "SDTMIG"
    Version: "3.4"
  - Name: "SDTMIG"
    Version: "3.3"
  - Name: "SDTMIG"
    Version: "3.2"
  - Name: "SDTMIG"
    Version: "3.1.3"
  - Name: "SDTMIG"
    Version: "3.1.2"
  - Name: "SENDIG"
    Version: "3.1.1"
  - Name: "SENDIG"
    Version: "3.1"
  - Name: "SENDIG-AR"
    Version: "1.0"
  - Name: "SENDIG-DART"
    Version: "1.1"
