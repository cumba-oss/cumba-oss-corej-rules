Core:
  Id: "FDA-SD1008"
  Status: "Published"
  Version: "1"
Description: "Raise an error when Date/Time of Comment (CODTC) is populated for a\
  \ comment that is related to a specific parent record or group of parent records\
  \ (RDOMAIN, IDVAR and IDVARVAL are populated)."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "CO"
Requirements:
  Variables:
    All:
    - "CODTC"
    - "IDVAR"
    - "IDVARVAL"
    - "RDOMAIN"
Check:
  expression: >-
    not empty(RDOMAIN) and not empty(IDVAR) and not empty(IDVARVAL) and not empty(CODTC)
Outcome:
  Message: "CODTC is populated when the comment is related to a parent record (RDOMAIN,\
    \ IDVAR and IDVARVAL are populated)."
Source:
  FDA_Validator_Rule_Message: "CODTC is populated, when comment is a child record\
    \ of another domain"
  FDA_Validator_Rule_Description: "The value of Date/Time of Comment (CODTC) should\
    \ be NULL, when comments are related to a specific parent record or group of parent\
    \ records in a domain (RDOMAIN, IDVAR and IDVARVAL are populated)."
  Domains: "CO"
