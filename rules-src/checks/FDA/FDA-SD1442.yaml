Core:
  Id: "FDA-SD1442"
  Status: "Published"
  Version: "1"
Description: "Raise an error when --TERM is present and --HLGT is present and --HLGT\
  \ does not have the same value across records with the same value of --TERM."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "AE"
    - "CE"
    - "MH"
Requirements:
  Variables:
    All:
    - "--HLGT"
    - "--TERM"
Check:
  expression: >-
    is_inconsistent_across_dataset(--HLGT, keys=[--TERM])
Outcome:
  Message: "Inconsistent value for --HLGT within --TERM"
Source:
  FDA_Validator_Rule_Message: "Inconsistent value for --HLGT within --TERM"
  FDA_Validator_Rule_Description: "MedDRA coding High Level Group Term (--HLGT) should\
    \ be consistent for the same collected term (--TERM)"
  Domains: "AE, CE, MH"
