Core:
  Id: "FDA-SD1017"
  Status: "Published"
  Version: "1"
Description: "Raise an error when SVUPDES is not populated and VISITNUM is not equal\
  \ to a VISITNUM present in the TV dataset."
Executability: "Partially Executable"
Scope:
  Domains:
    Include:
    - "SV"
Requirements:
  Variables:
    All:
    - "VISITNUM"
    - "TV.VISITNUM"
    - "SVUPDES"
Operations:
- id: "$tv_visitnum"
  expression: "distinct(VISITNUM, domain=\"TV\")"
Check:
  expression: >-
    not empty(VISITNUM) and empty(SVUPDES) and VISITNUM not in $tv_visitnum
Outcome:
  Message: "SVUPDES is not populated, but the VISITNUM is not equal to a VISITNUM\
    \ present in the TV dataset."
  Output_Variables:
  - "VISITNUM"
  - "VISIT"
  - "SVUPDES"
  - "$tv_visitnum"
Source:
  FDA_Validator_Rule_Message: "VISITNUM value does not match TV domain data"
  FDA_Validator_Rule_Description: "Visit Number (VISITNUM) values should match entries\
    \ in the Trial Visits (TV) dataset, when they are planned visits (SVUPDES = NULL)."
  Domains: "SV"
