Core:
  Id: "FDA-SD0085"
  Status: "Published"
  Version: "1"
Description: "Raise an error when IEORRES and IESTRESC do not have the same value."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "IE"
Requirements:
  Variables:
    All:
    - "IESTRESC"
    - "IEORRES"
Check:
  expression: >-
    IESTRESC != IEORRES
Outcome:
  Message: "Mismatch between IEORRES and IESTRESC values."
Source:
  FDA_Validator_Rule_Message: "Mismatch between IEORRES and IESTRESC values"
  FDA_Validator_Rule_Description: "I/E Criterion Original Result (IEORRES) and I/E\
    \ Criterion Result in Std Format (IESTRESC) should have the same value."
  Domains: "IE"
