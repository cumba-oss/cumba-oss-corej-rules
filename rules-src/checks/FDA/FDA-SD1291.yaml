Core:
  Id: "FDA-SD1291"
  Status: "Published"
  Version: "1"
Description: "Raise an error when --ENTPT is populated but --ENRTPT is empty."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "ALL"
Requirements:
  Variables:
    All:
    - "--ENRTPT"
    - "--ENTPT"
Check:
  expression: >-
    not empty(--ENTPT) and empty(--ENRTPT)
Outcome:
  Message: "--ENRTPT is empty when --ENTPT is populated."
Source:
  FDA_Validator_Rule_Message: "Missing value for --ENRTPT, when --ENTPT is populated"
  FDA_Validator_Rule_Description: "End Relative to Reference Time Point (--ENRTPT)\
    \ must be populated when End Reference Time Point (--ENTPT) is populated."
  Domains: "ALL"
