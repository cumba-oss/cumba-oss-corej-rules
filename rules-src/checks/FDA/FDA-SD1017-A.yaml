Core:
  Id: "FDA-SD1017-A"
  Status: "Published"
  Version: "1"
Description: "Raise an error when the Subject Visits (SV) dataset carries no SVUPDES\
  \ variable and VISITNUM is populated for a visit whose VISIT name does not mark\
  \ it unscheduled or unplanned, but its value does not match any VISITNUM value in\
  \ the Trial Visits (TV) dataset."
Executability: "Partially Executable - Possible Overreporting"
Scope:
  Domains:
    Include:
    - "SV"
Requirements:
  Variables:
    All:
    - "VISITNUM"
    - "TV.VISITNUM"
Operations:
- id: "$tv_visitnum"
  expression: "distinct(VISITNUM, domain=\"TV\")"
Check:
  expression: >-
    not var_exists("SVUPDES") and not empty(VISITNUM) and not empty(VISIT) and not
    contains(upper(VISIT), upper("UNSCHEDUL")) and not contains(upper(VISIT), upper("UNPLAN")) and
    VISITNUM not in $tv_visitnum
Outcome:
  Message: "SVUPDES is not available, and VISITNUM for a visit whose VISIT name does\
    \ not mark it unscheduled or unplanned does not match any VISITNUM value in the\
    \ TV dataset."
  Output_Variables:
  - "VISITNUM"
  - "VISIT"
  - "$tv_visitnum"
Source_Proposed:
  Sheet_Issue: "#208"
  FDA_Validator_Rule_Message: "VISITNUM value does not match TV domain data"
  FDA_Validator_Rule_Description: "Visit Number (VISITNUM) values should match entries\
    \ in the Trial Visits (TV) dataset when the SVUPDES variable is not present in\
    \ the dataset and the Visit Name (VISIT) does not identify the visit as unscheduled\
    \ or unplanned."
  Domains: "SV"
Source:
  FDA_Validator_Rule_Message: "VISITNUM value does not match TV domain data"
  FDA_Validator_Rule_Description: "Visit Number (VISITNUM) values should match entries\
    \ in the Trial Visits (TV) dataset, when they are planned visits (SVUPDES = NULL)."
  Domains: "SV"
