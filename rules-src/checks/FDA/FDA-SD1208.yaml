Core:
  Id: "FDA-SD1208"
  Status: "Published"
  Version: "1"
Description: "Raise an error when RFXSTDTC is after RFXENDTC."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "DM"
Requirements:
  Variables:
    All:
    - "RFXENDTC"
Check:
  expression: >-
    not empty(RFXSTDTC) and not empty(RFXENDTC) and date(RFXSTDTC) > date(RFXENDTC)
Outcome:
  Message: "Date/Time of First Study Treatment (RFXSTDTC) is after Date/Time of Last\
    \ Study Treatment (RFXENDTC)."
Source:
  FDA_Validator_Rule_Message: "RFXSTDTC date is after RFXENDTC"
  FDA_Validator_Rule_Description: "Date/Time of First Study Treatment (RFXSTDTC) variable\
    \ value must be less than or equal to Date/Time of Last Study Treatment (RFXENDTC)."
  Domains: "DM"
