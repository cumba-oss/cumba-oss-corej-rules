Core:
  Id: "FDA-SD1343"
  Status: "Published"
  Version: "1"
Description: "Raise an error when RFXSTDTC is empty for a treated subject, that is\
  \ a subject whose ACTARMCD is populated and is not equal to 'SCRNFAIL', 'NOTTRT'\
  \ or 'NOTASSGN'."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "DM"
Requirements:
  Variables:
    All:
    - "RFXSTDTC"
    - "ACTARMCD"
Check:
  expression: >-
    not empty(ACTARMCD) and upper(ACTARMCD) not in ["SCRNFAIL", "NOTTRT", "NOTASSGN"] and
    empty(RFXSTDTC)
Outcome:
  Message: "RFXSTDTC is empty for a treated subject (ACTARMCD is populated and not\
    \ equal to 'SCRNFAIL', 'NOTTRT' or 'NOTASSGN')."
  Output_Variables:
  - "RFXSTDTC"
  - "ACTARMCD"
Source:
  FDA_Validator_Rule_Message: "Missing value for RFXSTDTC, when subject is treated"
  FDA_Validator_Rule_Description: "Date/Time of First Study Treatment (RFXSTDTC) variable\
    \ must be populated, when subject is treated (ACTARMCD is not 'SCRNFAIL', 'NOTTRT',\
    \ 'NOTASSGN', or null)."
  Domains: "DM"
