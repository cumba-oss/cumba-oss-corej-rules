Core:
  Id: "FDA-SD2264"
  Status: "Published"
  Version: "1"
Description: "Raise an error when the Parameter Value Code (TSVALCD) for a PCLAS trial-summary\
  \ parameter is not a valid MED-RT (or legacy NDF-RT) code."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "TS"
Requirements:
  Variables:
    All:
    - "TSPARMCD"
Bindings:
- name: "$pclas_code_valid"
  expression: "valid_external_dictionary_code(TSVALCD, external_dictionary_type=\"\
    medrt\", dictionary_term_type=\"MEDRTCD\")"
Check:
  expression: >-
    TSPARMCD == "PCLAS" and $pclas_code_valid == false
Outcome:
  Message: "TSVALCD is not a valid MED-RT (or legacy NDF-RT) code for the PCLAS parameter."
Source:
  FDA_Validator_Rule_Message: "Invalid TSVALCD value for PCLAS"
  FDA_Validator_Rule_Description: "TSVALCD for PCLAS record must be a valid code from\
    \ MED-RT or NDF-RT (Note: Any version 2018-02-05 or earlier uses NDF-RT, and any\
    \ version after is MED-RT)."
  Domains: "TS"
Standards:
- Organization: "FDA"
