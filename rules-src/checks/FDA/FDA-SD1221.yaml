Core:
  Id: "FDA-SD1221"
  Status: "Published"
  Version: "1"
Description: "Raise an error when TSVAL is not a numeric integer for a record where\
  \ TSPARMCD equals 'PLANSUB' (Planned Number of Subjects)."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "TS"
Requirements:
  Variables:
    All:
    - "TSVAL"
    - "TSPARMCD"
Check:
  expression: >-
    var_exists("TSVAL") and TSPARMCD == "PLANSUB" and not is_integer(TSVAL)
Outcome:
  Message: "Invalid TSVAL value for PLANSUB: TSVAL must be a numeric (integer) value\
    \ when TSPARMCD equals 'PLANSUB' (Planned Number of Subjects)."
Source:
  FDA_Validator_Rule_Message: "Invalid TSVAL value for PLANSUB"
  FDA_Validator_Rule_Description: "TSVAL for PLANSUB record must be numeric."
  Domains: "TS"
