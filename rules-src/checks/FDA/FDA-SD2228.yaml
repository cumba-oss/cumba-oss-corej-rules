Core:
  Id: "FDA-SD2228"
  Status: "Published"
  Version: "1"
Description: "Raise an error when the study type equals 'INTERVENTIONAL' and the Trial\
  \ Summary (TS) dataset does not contain a record where TSPARMCD equals 'INTMODEL'\
  \ (Intervention Model)."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "TS"
Bindings:
- name: "$intmodel_count"
  expression: "record_count(filter=(TSPARMCD == \"INTMODEL\"))"
- name: "$stype_interventional_count"
  expression: "record_count(filter=(TSPARMCD == \"STYPE\" and TSVAL == \"INTERVENTIONAL\"\
    ))"
Check:
  expression: >-
    $stype_interventional_count >= 1 and $intmodel_count == 0
Outcome:
  Message: "Missing INTMODEL Trial Summary Parameter: a 'Intervention Model' (INTMODEL)\
    \ record must be present in the Trial Summary (TS) domain."
Source:
  FDA_Validator_Rule_Message: "Missing INTMODEL Trial Summary Parameter"
  FDA_Validator_Rule_Description: "'Intervention Model' (INTMODEL) record must be\
    \ populated in Trial Summary (TS) domain, when study type is 'INTERVENTIONAL'.\
    \ It is expected for SDTM IG v3.1.2 data and required for data in all more recent\
    \ SDTM versions."
  Domains: "TS"
Standards:
