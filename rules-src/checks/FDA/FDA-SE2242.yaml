Core:
  Id: "FDA-SE2242"
  Status: "Published"
  Version: "1"
Description: "Raise an error when Macroscopic Examination Short Name (--TESTCD) equals\
  \ 'GROSPATH' but Specimen Material Type (--SPEC) is empty."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "MA"
Requirements:
  Variables:
    All:
    - "--TESTCD"
Check:
  expression: >-
    --TESTCD == "GROSPATH" and empty(--SPEC)
Outcome:
  Message: "Specimen Material Type (--SPEC) is empty when --TESTCD equals 'GROSPATH'."
  Output_Variables:
  - "!--SPEC"
Source:
  FDA_Validator_Rule_Message: "Missing value for --SPEC, when --TESTCD equals 'GROSPATH'"
  FDA_Validator_Rule_Description: "Specimen Material Type (MASPEC) is required to\
    \ be populated when Macroscopic Examination Short Name (MATESTCD)/Macroscopic\
    \ Examination Name (MATEST) = 'GROSPATH'/'Gross Pathological Observation'."
  Domains: "MA"
Standards:
- Organization: "FDA"
  Standards:
