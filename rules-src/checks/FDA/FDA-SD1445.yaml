Core:
  Id: "FDA-SD1445"
  Status: "Published"
  Version: "1"
Description: "Raise an error when a subject has more than one record with Last Observation\
  \ Before Exposure Flag (--LOBXFL) equal to 'Y' for the same assessment (the same\
  \ combination of --TESTCD, --CAT, --SCAT, --POS, --METHOD, --SPEC, --LOC and --LAT)."
Executability: "Fully Executable"
Scope:
  Classes:
    Include:
    - "FINDINGS"
    - "FINDINGS ABOUT"
Requirements:
  Variables:
    All:
    - "--LOBXFL"
    - "--TESTCD"
Check:
  expression: >-
    --LOBXFL == "Y" and not is_unique_set([--LOBXFL, USUBJID, --TESTCD, --CAT, --SCAT, --POS,
    --METHOD, --SPEC, --LOC, --LAT])
Outcome:
  Message: "Multiple --LOBXFL records for the same test"
Source:
  FDA_Validator_Rule_Message: "Multiple --LOBXFL records for the same test"
  FDA_Validator_Rule_Description: "By its definition Last Observation Before Exposure\
    \ Flag (--LOBXFL) should have only a single record for the same test for subject.\
    \ Therefore, each subject (USUBJID) should have no more than one record with \
    \ Last Observation Before Exposure Flag (--LOBXFL) equals 'Y' for the same assessment\
    \ which is defined by Test (--TESTCD), Category (--CAT), Subcategory (--SCAT),\
    \ Position of Subject During Observation (--POS), Method (--METHOD), Specimen\
    \ (--SPEC), Location (--LOC) and Laterality (--LAT)."
  Domains: "FINDINGS, FINDINGS ABOUT"
Standards:
- Organization: "FDA"
  Standards:
  - Name: "SDTMIG"
    Version: "3.4"
