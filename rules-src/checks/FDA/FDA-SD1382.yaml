Core:
  Id: "FDA-SD1382"
  Status: "Published"
  Version: "1"
Description: "Raise an error when Start Day of Obs Relative to Exposure (--XSTDY)\
  \ is populated and both the date portion of --STDTC and the date portion of RFXSTDTC\
  \ are complete dates, but --XSTDY does not equal the value computed by the study\
  \ day algorithm relative to the Date/Time of First Study Treatment (RFXSTDTC)."
Executability: "Fully Executable"
Scope:
  Classes:
    Include:
    - "INTERVENTIONS"
    - "EVENTS"
    - "FINDINGS"
    - "FINDINGS ABOUT"
Requirements:
  Variables:
    All:
    - "--XSTDY"
    - "--STDTC"
    - "USUBJID"
    All_Or_None:
    - - "USUBJID"
      - "DM.USUBJID"
Match_Datasets:
- Keys:
  - "USUBJID"
  Name: "DM"
Bindings:
- name: "$value_xstdy_algorithm"
  expression: "dy(--STDTC, reference=\"RFXSTDTC\")"
Check:
  expression: >-
    not empty(--XSTDY) and is_complete_date(--STDTC) and is_complete_date(DM.RFXSTDTC) and --XSTDY
    != $value_xstdy_algorithm
Outcome:
  Message: "Start Day of Obs Relative to Exposure (--XSTDY) does not equal the value\
    \ derived by the study day algorithm against RFXSTDTC even though the date portions\
    \ of --STDTC and RFXSTDTC are complete dates and --XSTDY is populated."
  Output_Variables:
  - "$value_xstdy_algorithm"
  - "--STDTC"
  - "--XSTDY"
  - "DM.RFXSTDTC"
Source:
  FDA_Validator_Rule_Message: "Incorrect value for --XSTDY variable"
  FDA_Validator_Rule_Description: "Start Day of Obs Relative to Exposure (--XSTDY)\
    \ variable value should be populated as defined by CDISC standards: --XSTDY =\
    \ (date portion of --STDTC) - (date portion of RFXSTDTC) +1 if --STDTC is on or\
    \ after RFXSTDTC; --XSTDY = (date portion of --STDTC) - (date portion of RFXSTDTC)\
    \ if --STDTC precedes RFXSTDTC."
  Domains: "INTERVENTIONS, FINDINGS, EVENTS, FINDINGS ABOUT"
Standards:
- Organization: "FDA"
  Standards:
  - Name: "SENDIG-AR"
    Version: "1.0"
    References:
    - Origin: "FDA Validator Rules"
      Rule_Identifier:
        Id: "SD1382"
        Version: "1"
      Version: "1.6"
