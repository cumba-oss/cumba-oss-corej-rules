Core:
  Id: "FDA-SE2229"
  Status: "Published"
  Version: "1"
Description: "Raise an error when a neoplasm Result in Standard Format (--STRESC)\
  \ term does not agree with the malignancy status in --RESCAT for records where --RESCAT\
  \ is 'BENIGN' or 'MALIGNANT'."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "MI"
    - "TF"
Requirements:
  Variables:
    All:
    - "--RESCAT"
Bindings:
- name: "$neoplasm_aligned"
  expression: "valid_external_dictionary_code_term_pair(--STRESC, --RESCAT, external_dictionary_type=\"\
    neoplasm\")"
Check:
  expression: >-
    --RESCAT in ["BENIGN", "MALIGNANT"] and $neoplasm_aligned == false
Outcome:
  Message: "Neoplasm --STRESC term does not align with the --RESCAT malignancy status."
  Output_Variables:
  - "--STRESC"
  - "--RESCAT"
Source:
  FDA_Validator_Rule_Message: "--STRESC/--RESCAT mismatch when --RESCAT = 'BENIGN'\
    \ or 'MALIGNANT'"
  FDA_Validator_Rule_Description: "Result or Finding in Standard Format (--STRESC)\
    \ values from (NEOPLASM) CT codelist should align with the malignancy status in\
    \ Result Category (--RESCAT) when --RESCAT = 'BENIGN' or 'MALIGNANT'."
  Domains: "MI, TF"
Standards:
- Organization: "FDA"
  Standards:
  - Name: "SENDIG"
    Version: "3.1.1"
