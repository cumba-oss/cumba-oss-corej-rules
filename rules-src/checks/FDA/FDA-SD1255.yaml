Core:
  Id: "FDA-SD1255"
  Status: "Published"
  Version: "1"
Description: "Raise an error when AESDTH in the AE dataset equals 'Y' but DTHFL in\
  \ the DM dataset does not equal 'Y' for the corresponding subject."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "DM"
Requirements:
  Variables:
    All:
    - "DTHFL"
    - "AE.AESDTH"
Match_Datasets:
- Keys:
  - "USUBJID"
  Name: "AE"
Check:
  expression: >-
    AE.AESDTH == "Y" and DTHFL != "Y"
Outcome:
  Message: "DTHFL does not equal 'Y' when AESDTH in the AE dataset equals 'Y'."
  Output_Variables:
  - "DTHFL"
  - "AE.AESDTH"
Source:
  FDA_Validator_Rule_Message: "DTHFL does not equal 'Y' when AE.AESDTH = 'Y'"
  FDA_Validator_Rule_Description: "DTHFL must equal 'Y' when there is a record in\
    \ the Adverse Events (AE) domain with AESDTH = 'Y'."
  Domains: "AE"
Standards:
- Organization: "FDA"
  Standards:
  - Name: "SDTMIG"
    Version: "3.4"
    References:
    - Origin: "FDA Validator Rules"
      Rule_Identifier:
