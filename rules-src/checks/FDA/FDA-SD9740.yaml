Core:
  Id: "FDA-SD9740"
  Status: "Published"
  Version: "1"
Description: "Raise an error when Planned End of Assessment Interval (--ENINT) is\
  \ populated but Time Point Reference (--TPTREF) is empty."
Executability: "Fully Executable"
Scope:
  Classes:
    Include:
    - "INTERVENTIONS"
    - "EVENTS"
    - "FINDINGS"
Requirements:
  Variables:
    All:
    - "--ENINT"
    - "--TPTREF"
Check:
  expression: >-
    not empty(--ENINT) and empty(--TPTREF)
Outcome:
  Message: "--ENINT is populated, but --TPTREF is empty."
  Output_Variables:
  - "--TPTREF"
  - "--ENINT"
Source_Proposed:
  Sheet_Issue: "#262"
  FDA_Validator_Rule_Message: "--TPTREF is not populated although --ENINT is populated"
  FDA_Validator_Rule_Description: "When the Planned End of Assessment Interval (--ENINT)\
    \ is populated, the Time Point Reference (--TPTREF) must also be populated."
  Domains: "INTERVENTIONS, EVENTS, FINDINGS"
