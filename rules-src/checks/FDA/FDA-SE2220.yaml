Core:
  Id: "FDA-SE2220"
  Status: "Published"
  Version: "1"
Description: "Raise an error when the Trial Summary (TS) dataset does not contain\
  \ a record where TSPARMCD equals 'SSTYP' (Study Type)."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "TS"
Bindings:
- name: "$sstyp_count"
  expression: "record_count(filter=(TSPARMCD == \"SSTYP\"))"
Check:
  expression: >-
    $sstyp_count == 0
Outcome:
  Message: "Missing SSTYP Trial Summary Parameter: a 'Study Type' (SSTYP) record must\
    \ be present in the Trial Summary (TS) domain."
  Output_Variables:
  - "$sstyp_count"
Source:
  FDA_Validator_Rule_Message: "Missing SSTYP Trial Summary Parameter"
  FDA_Validator_Rule_Description: "'Study Type' (SSTYP) record should be populated\
    \ in Trial Summary (TS) domain."
  Domains: "TS"
Standards:
- Organization: "FDA"
  Standards:
  - Name: "SENDIG"
    Version: "3.1.1"
    References:
    - Origin: "FDA Validator Rules"
      Rule_Identifier:
        Id: "SE2220"
        Version: "1"
      Version: "1.6"
