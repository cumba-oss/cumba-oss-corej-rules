Core:
  Id: "FDA-SD0070"
  Status: "Published"
  Version: "1"
Description: "Raise an error when a subject in the Demographics (DM) dataset, other\
  \ than a screen-failure subject (ARMCD equals 'SCRNFAIL'), a not-assigned subject\
  \ (ARMCD equals 'NOTASSGN'), or a not-treated subject (ACTARMCD equals 'NOTTRT'),\
  \ has no record in the Exposure (EX) dataset."
Executability: "Partially Executable - Possible Overreporting"
Scope:
  Domains:
    Include:
    - "DM"
Requirements:
  Variables:
    All:
    - "ARMCD"
Grouping:
  Variables:
  - "USUBJID"
Bindings:
- name: "$ex_record_count"
  expression: "record_count(domain=\"EX\", group=[USUBJID])"
Check:
  expression: >-
    ARMCD != "SCRNFAIL" and ARMCD != "NOTASSGN" and (not var_exists("ACTARMCD") or ACTARMCD !=
    "NOTTRT") and $ex_record_count < 1
Outcome:
  Message: "No Exposure (EX) record is present for the subject."
  Output_Variables:
  - "ARMCD"
  - "ACTARMCD"
  - "$ex_record_count"
Source:
  FDA_Validator_Rule_Message: "No Exposure record found for subject"
  FDA_Validator_Rule_Description: "All Demographics (DM) subjects (USUBJID) participating\
    \ in a study that includes investigational product should have at least one record\
    \ in the Exposure (EX) domain, except for subjects who failed screening (ARMCD\
    \ = 'SCRNFAIL'), were not fully assigned to an Arm (ARMCD = 'NOTASSGN'), or did\
    \ not receive study treatment (ACTARMCD = 'NOTTRT')."
  Domains: "DM"
Standards:
- Organization: "FDA"
