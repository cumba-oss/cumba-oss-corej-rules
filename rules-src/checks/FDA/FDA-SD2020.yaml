Core:
  Id: "FDA-SD2020"
  Status: "Published"
  Version: "1"
Description: "Raise an error when both Age (AGE) and Age Range (AGETXT) values are\
  \ populated for the same subject. Only one of AGE or AGETXT should be provided."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "DM"
Requirements:
  Variables:
    All:
    - "AGETXT"
Check:
  expression: >-
    not empty(AGE) and not empty(AGETXT)
Outcome:
  Message: "Both AGE and AGETXT values are populated for the same subject."
Source:
  FDA_Validator_Rule_Message: "Both AGE and AGETXT variables values are populated"
  FDA_Validator_Rule_Description: "Age (AGE) and Age Range (AGETXT) variables should\
    \ never both be populated for the same subject."
  Domains: "DM"
