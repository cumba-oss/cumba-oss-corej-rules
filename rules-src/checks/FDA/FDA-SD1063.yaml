Core:
  Id: "FDA-SD1063"
  Status: "Published"
  Version: "1"
Description: "Raise an error when a dataset in the study is not described in the Define-XML."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "ALL"
Bindings:
- name: "$define_datasets"
  expression: "define_dataset_names()"
Check:
  expression: >-
    ds_name("DATA") not in $define_datasets
Outcome:
  Message: "This dataset is not described in the Define-XML."
  Output_Variables:
  - "dataset_name"
Source:
  FDA_Validator_Rule_Message: "Dataset is not present in define.xml"
  FDA_Validator_Rule_Description: "Datasets included in study data must be described\
    \ in the data definition document (define.xml)."
  Domains: "ALL"
