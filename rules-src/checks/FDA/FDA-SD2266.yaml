Core:
  Id: "FDA-SD2266"
  Status: "Published"
  Version: "1"
Description: "Raise an error when TSVCDREF does not equal 'SNOMED' for a record where\
  \ TSPARMCD equals 'TDIGRP' (Diagnosis Group)."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "TS"
Requirements:
  Variables:
    All:
    - "TSPARMCD"
    - "TSVCDREF"
Check:
  expression: >-
    TSPARMCD == "TDIGRP" and TSVCDREF != "SNOMED"
Outcome:
  Message: "Invalid TSVCDREF value for TDIGRP: TSVCDREF must equal 'SNOMED' when TSPARMCD\
    \ equals 'TDIGRP' (Diagnosis Group)."
Source:
  FDA_Validator_Rule_Message: "Invalid TSVCDREF value for TDIGRP"
  FDA_Validator_Rule_Description: "TSVCDREF variable value must be 'SNOMED', when\
    \ TSPARAMCD='TDIGRP'."
  Domains: "TS"
