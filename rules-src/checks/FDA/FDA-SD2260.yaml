Core:
  Id: "FDA-SD2260"
  Status: "Published"
  Version: "1"
Description: "Raise an error when the Parameter Value (TSVAL) for a TRT (Investigational\
  \ Therapy or Treatment) trial-summary parameter is not a valid preferred term in\
  \ the FDA Substance Registration System (SRS)."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "TS"
Requirements:
  Variables:
    All:
    - "TSPARMCD"
Bindings:
- name: "$trt_term_valid"
  expression: "valid_external_dictionary_value(TSVAL, external_dictionary_type=\"\
    unii\", dictionary_term_type=\"SRS\")"
Check:
  expression: >-
    TSPARMCD == "TRT" and $trt_term_valid == false
Outcome:
  Message: "TSVAL is not a valid FDA-SRS preferred term for the TRT parameter."
Source:
  FDA_Validator_Rule_Message: "Invalid TSVAL value for TRT"
  FDA_Validator_Rule_Description: "TSVAL for TRT record must be a valid preferred\
    \ term from FDA Substance Registration System (SRS)."
  Domains: "TS"
