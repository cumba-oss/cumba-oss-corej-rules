Core:
  Id: "FDA-SE1074"
  Status: "Published"
  Version: "1"
Description: "Raise an error when a variable that may be used only in SDTM human studies\
  \ is present in the SEND dataset."
Executability: "Partially Executable - Possible Underreporting"
Scope:
  Domains:
    Include:
    - "ALL"
Check:
  expression: >-
    upper(varname()) in ["ACTARM", "ACTARMCD", "COUNTRY", "DTHDTC", "DTHFL", "ETHNIC", "INVID",
    "INVNAM", "RACE", "RFICDTC", "RFPENDTC"]
Outcome:
  Message: "A variable that may be used only in SDTM human studies is present in the\
    \ SEND dataset."
Source:
  FDA_Validator_Rule_Message: "Variable which can be used only in SDTM"
  FDA_Validator_Rule_Description: "Variables designed only for SDTM human studies\
    \ must be not included in the SEND dataset."
  Domains: "ALL"
Standards:
- Organization: "FDA"
  Standards:
  - Name: "SENDIG"
    Version: "3.1.1"
    References:
