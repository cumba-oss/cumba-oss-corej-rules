Core:
  Id: "FDA-SE2235"
  Status: "Published"
  Version: "1"
Description: "Raise an error when the Trial Summary (TS) dataset contains more than\
  \ one record where TSPARMCD equals 'SNDIGVER' (SEND Implementation Guide Version)."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "TS"
Bindings:
- name: "$sndigver_count"
  expression: "record_count(filter=filter(TSPARMCD=\"SNDIGVER\"))"
Check:
  expression: >-
    $sndigver_count > 1
Outcome:
  Message: "Multiple SNDIGVER records: the Trial Summary (TS) domain must contain\
    \ only one record for the 'SNDIGVER' (SEND Implementation Guide Version) parameter."
  Output_Variables:
  - "$sndigver_count"
Source:
  FDA_Validator_Rule_Message: "Multiple SNDIGVER records"
  FDA_Validator_Rule_Description: "Trial Summary (TS) domain must contain only one\
    \ record for the 'SNDIGVER' parameter."
  Domains: "TS"
