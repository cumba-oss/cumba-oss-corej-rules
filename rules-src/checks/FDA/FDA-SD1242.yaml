Core:
  Id: "FDA-SD1242"
  Status: "Published"
  Version: "1"
Description: "Raise an error when --BDSYCD and --BODSYS do not have a one-to-one relationship."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "AE"
    - "CE"
    - "MH"
Requirements:
  Variables:
    All:
    - "--BDSYCD"
    - "--BODSYS"
Check:
  expression: >-
    not is_unique_relationship(--BDSYCD, --BODSYS)
Outcome:
  Message: "--BDSYCD and --BODSYS do not have a one-to-one relationship."
Source:
  FDA_Validator_Rule_Message: "Inconsistent value for --BODSYS within --BDSYCD"
  FDA_Validator_Rule_Description: "All values of Body System or Organ Class (--BODSYS)\
    \ should be the same for a given value of Body System or Organ Class Code (--BDSYCD)."
  Domains: "AE, CE, MH"
