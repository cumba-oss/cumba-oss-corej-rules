Core:
  Id: "FDA-SD1301"
  Status: "Published"
  Version: "1"
Description: "Raise an error when Offset from the Anchor (TDSTOFF) is populated with\
  \ a value that is not 0 and is not a positive value in ISO 8601 duration format."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "TD"
Requirements:
  Variables:
    All:
    - "TDSTOFF"
Check:
  expression: >-
    not empty(TDSTOFF) and TDSTOFF != "0" and invalid_duration(TDSTOFF, negative=false)
Outcome:
  Message: "TDSTOFF is populated with a value that is not 0 and not a positive value\
    \ in ISO 8601 duration format."
  Output_Variables:
  - "TDSTOFF"
Source:
  FDA_Validator_Rule_Message: "Invalid value for TDSTOFF variable"
  FDA_Validator_Rule_Description: "Offset from the Anchor (TDSTOFF) variable value\
    \ must be either 0, ISO 8601 format for duration (e.g. P80Y), or null."
  Domains: "TD"
