Core:
  Id: "FDA-SD0049"
  Status: "Published"
  Version: "1"
Description: "Raise an error when --STRTPT (Start Relative to Reference Time Point)\
  \ is populated but --STTPT (Start Reference Time Point) is empty."
Executability: "Partially Executable - Possible Underreporting"
Scope:
  Domains:
    Include:
    - "ALL"
Requirements:
  Variables:
    All:
    - "--STRTPT"
    - "--STTPT"
Check:
  expression: >-
    not empty(--STRTPT) and empty(--STTPT)
Outcome:
  Message: "--STTPT is empty when --STRTPT is populated."
  Output_Variables:
  - "--STRTPT"
  - "--STTPT"
Source:
  FDA_Validator_Rule_Message: "Missing value for --STTPT, when --STRTPT is populated"
  FDA_Validator_Rule_Description: "Start Reference Time Point (--STTPT) must not be\
    \ NULL, when Start Relative to Reference Time Point (--STRTPT) is provided."
  Domains: "SE, SM, SV, INTERVENTIONS, EVENTS, FINDINGS, FINDINGS ABOUT"
