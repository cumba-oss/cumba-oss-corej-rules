Core:
  Id: "FDA-SD0022"
  Status: "Published"
  Version: "1"
Description: "Raise an error when no Start Time-Point variable (--STDTC, --STRF, or\
  \ --STRTPT) is populated and the event/intervention is not excepted by --OCCUR equals\
  \ 'N' or a populated --STAT."
Executability: "Partially Executable - Possible Underreporting"
Scope:
  Classes:
    Include:
    - "INTERVENTIONS"
    - "EVENTS"
Requirements:
  Variables:
    Any:
    - "--STDTC"
    - "--STRF"
    - "--STRTPT"
Check:
  expression: >-
    empty(--STDTC) and empty(--STRF) and empty(--STRTPT) and --OCCUR != "N" and empty(--STAT)
Outcome:
  Message: "No Start Time-Point variable (--STDTC, --STRF, or --STRTPT) is populated."
  Output_Variables:
  - "!--STDTC"
  - "!--STRF"
  - "!--STRTPT"
  - "--OCCUR"
  - "!--STAT"
Source:
  FDA_Validator_Rule_Message: "Missing Start Time-Point value"
  FDA_Validator_Rule_Description: "One Start Time-Point variable is expected to be\
    \ populated when an event or intervention occurred. (E.g., Start Date/Time of\
    \ Event or Intervention (--STDTC), or Start Relative to Reference Period (--STRF),\
    \ or Start Relative to Reference Period (--STRTPT) should not be missing, or Occurrence\
    \ (--OCCUR) = 'N' or Completion Status (--STAT) != '')."
  Domains: "INTERVENTIONS, EVENTS"
