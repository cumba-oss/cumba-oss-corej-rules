Core:
  Id: "FDA-SD1390"
  Status: "Published"
  Version: "1"
Description: "Raise an error when Day of Obs Rel to Challenge Agent (--CHDY) is populated\
  \ but the date portion of Date/Time of Collection (--DTC) or of Date/Time of First\
  \ Challenge Agent Admin (RFCSTDTC) is not a complete date, i.e. empty, invalid,\
  \ or only partially specified, indicating the study day value was imputed."
Executability: "Fully Executable"
Scope:
  Classes:
    Include:
    - "INTERVENTIONS"
    - "EVENTS"
    - "FINDINGS"
    - "FINDINGS ABOUT"
Requirements:
  Variables:
    All:
    - "--CHDY"
    - "--DTC"
    - "USUBJID"
    All_Or_None:
    - - "USUBJID"
      - "DM.USUBJID"
Match_Datasets:
- Keys:
  - "USUBJID"
  Name: "DM"
Check:
  expression: >-
    not empty(--CHDY) and (not is_complete_date_part(--DTC) or not
    is_complete_date_part(DM.RFCSTDTC))
Outcome:
  Message: "Day of Obs Rel to Challenge Agent (--CHDY) is populated but --DTC and/or\
    \ RFCSTDTC is empty or an incomplete date; the value appears imputed."
  Output_Variables:
  - "--DTC"
  - "--CHDY"
  - "DM.RFCSTDTC"
Source:
  FDA_Validator_Rule_Message: "--CHDY variable value is imputed"
  FDA_Validator_Rule_Description: "Day of Obs Rel to Challenge Agent (--CHDY) variable\
    \ value should not be imputed. It may only be populated, when both Date/Time of\
    \ Collection (--DTC) and Date/Time of First Challenge Agent Admin (RFCSTDTC) variables\
    \ values are provided and both of them include complete date parts."
  Domains: "INTERVENTIONS, FINDINGS, EVENTS, FINDINGS ABOUT"
Standards:
- Organization: "FDA"
  Standards:
  - Name: "SENDIG-AR"
    Version: "1.0"
    References:
    - Origin: "FDA Validator Rules"
      Rule_Identifier:
        Id: "SD1390"
        Version: "1"
      Version: "1.6"
