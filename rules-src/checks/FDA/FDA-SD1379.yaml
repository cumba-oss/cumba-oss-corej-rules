Core:
  Id: "FDA-SD1379"
  Status: "Published"
  Version: "1"
Description: "Raise an error when an Element Code (ETCD) value defined in Trial Elements\
  \ (TE) is not assigned to any subject in the Subject Elements (SE) dataset."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "TE"
Operations:
- id: "$se_etcd"
  expression: "distinct(ETCD, domain=\"SE\")"
Check:
  expression: >-
    not empty(ETCD) and ETCD not in $se_etcd
Outcome:
  Message: "ETCD value not present in SE"
  Output_Variables:
  - "ETCD"
  - "$se_etcd"
Source:
  FDA_Validator_Rule_Message: "ETCD value not present in SE"
  FDA_Validator_Rule_Description: "Element Code (ETCD) values defined in Trial Elements\
    \ (TE) should be assigned to at least one subject (USUBJID) in Subject Elements\
    \ (SE)."
  Domains: "TE"
