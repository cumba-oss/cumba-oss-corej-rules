Core:
  Id: "FDA-SE2273"
  Status: "Published"
  Version: "1"
Description: "Raise an error when the Trial Summary (TS) dataset contains more than\
  \ one record where TSPARMCD equals 'STCAT' (Study Category)."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "TS"
Bindings:
- name: "$stcat_count"
  expression: "record_count(filter=(TSPARMCD == \"STCAT\"))"
Check:
  expression: >-
    $stcat_count > 1
Outcome:
  Message: "Multiple STCAT records: the Trial Summary (TS) domain must contain only\
    \ one record for the 'STCAT' (Study Category) parameter."
Source:
  FDA_Validator_Rule_Message: "Multiple STCAT records"
  FDA_Validator_Rule_Description: "Trial Summary (TS) domain must contain only one\
    \ record for the 'STCAT' parameter."
  Domains: "TS"
