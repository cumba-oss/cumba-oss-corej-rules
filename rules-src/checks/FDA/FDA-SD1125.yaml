Core:
  Id: "FDA-SD1125"
  Status: "Published"
  Version: "1"
Description: "Raise an error when --TPT and --ELTM are populated but --ELTM does not\
  \ have the same value across records that share the same value of Planned Time Point\
  \ Name (--TPT), Time Point Reference (--TPTREF), and/or Visit Number (VISITNUM)."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "ALL"
Requirements:
  Variables:
    All:
    - "--ELTM"
    - "--TPT"
Check:
  expression: >-
    is_inconsistent_across_dataset(--ELTM, keys=[VISITNUM, --TPTREF, --TPT])
Outcome:
  Message: "Inconsistent value for --ELTM: it is not the same value across records\
    \ with the same --TPT, --TPTREF, and/or VISITNUM."
Source:
  FDA_Validator_Rule_Message: "Inconsistent value for  --ELTM within --TPT, --TPTREF\
    \ and/or VISITNUM"
  FDA_Validator_Rule_Description: "All values of Planned Elapsed Time (--ELTM) variable\
    \ should be the same for a given value of Planned Time Point Name (--TPT) variable,\
    \ Time Point Reference (--TPTREF) and/or Visit Number (VISITNUM)"
  Domains: "CO, INTERVENTIONS, EVENTS, FINDINGS, FINDINGS ABOUT"
