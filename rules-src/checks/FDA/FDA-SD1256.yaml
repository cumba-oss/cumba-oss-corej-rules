Core:
  Id: "FDA-SD1256"
  Status: "Published"
  Version: "1"
Description: "Raise an error when DSDECOD in the DS dataset is equal to 'DEATH' and\
  \ DTHFL does not equal 'Y'."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "DM"
Requirements:
  Variables:
    All:
    - "DTHFL"
    - "USUBJID"
    All_Or_None:
    - - "USUBJID"
      - "DS.USUBJID"
Match_Datasets:
- Keys:
  - "USUBJID"
  Name: "DS"
Check:
  expression: >-
    DS.DSDECOD == "DEATH" and DTHFL != "Y"
Outcome:
  Message: "DTHFL does not equal 'Y' when DSDECOD in the DS dataset is equal to 'DEATH'."
Source:
  FDA_Validator_Rule_Message: "DTHFL does not equal 'Y' when DS.DSDECOD = 'DEATH'"
  FDA_Validator_Rule_Description: "DTHFL must equal 'Y' when there is a record in\
    \ the Disposition (DS) domain with DSDECOD = 'DEATH'."
  Domains: "DS"
Standards:
- Organization: "FDA"
  Standards:
  - Name: "SDTMIG"
    Version: "3.4"
    References:
    - Origin: "FDA Validator Rules"
