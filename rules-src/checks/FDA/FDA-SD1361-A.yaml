Core:
  Id: "FDA-SD1361-A"
  Status: "Published"
  Version: "1"
Description: "Raise an error when Planned Arm Code (ARMCD) is populated but Description\
  \ of Planned Arm (ARM) is empty; both must be populated together."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "DM"
Requirements:
  Variables:
    All:
    - "ARMCD"
    - "ARM"
Check:
  expression: >-
    not empty(ARMCD) and empty(ARM)
Outcome:
  Message: "ARMCD is populated but ARM is empty."
  Output_Variables:
  - "ARMCD"
  - "ARM"
Source_Proposed:
  Sheet_Issue: "#220"
  FDA_Validator_Rule_Message: "ARMCD is populated, but ARM is null"
  FDA_Validator_Rule_Description: "Description of Planned Arm (ARM) must be populated,\
    \ when Planned Arm Code (ARMCD) is populated."
  Domains: "DM"
Source:
  FDA_Validator_Rule_Message: "ARM is populated, but ARMCD is null, or vice versa"
  FDA_Validator_Rule_Description: "Description of Planned Arm (ARM) must be populated,\
    \ when Planned Arm Code (ARMCD) is populated, and vice versa."
  Domains: "DM"
