Core:
  Id: "FDA-SD2262"
  Status: "Published"
  Version: "1"
Description: "Raise an error when the Parameter Value (TSVAL) and its code (TSVALCD)\
  \ for a TRT trial-summary parameter are not the decode and code of the same FDA-SRS\
  \ (UNII) substance record."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "TS"
Requirements:
  Variables:
    All:
    - "TSPARMCD"
Bindings:
- name: "$trt_pair_valid"
  expression: "valid_external_dictionary_code_term_pair(TSVALCD, TSVAL, external_dictionary_type=\"\
    unii\")"
Check:
  expression: >-
    TSPARMCD == "TRT" and $trt_pair_valid == false
Outcome:
  Message: "TSVAL and TSVALCD do not reference the same FDA-SRS record for the TRT\
    \ parameter."
  Output_Variables:
  - "TSVAL"
Source:
  FDA_Validator_Rule_Message: "TSVAL/TSVALCD value mismatch for TRT"
  FDA_Validator_Rule_Description: "TSVAL and TSVALCD values must be populated from\
    \ the same name record in FDA Substance Registration System (SRS)."
  Domains: "TS"
Standards:
- Organization: "FDA"
