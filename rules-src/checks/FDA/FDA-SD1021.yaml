Core:
  Id: "FDA-SD1021"
  Status: "Published"
  Version: "1"
Description: "Raise an error when a character variable value has a leading space,\
  \ contains a carriage return, or consists entirely of a period ('.'), excluding\
  \ the COVALn and TSVALn variables."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "ALL"
Check:
  expression: >-
    var_type("DATA") == "Char" and upper(varname()) !~ /^(COVAL[0-9]*|TSVAL[0-9]*)$/ and value() =~
    /^ |.*\\r|^\\.$/
Outcome:
  Message: "Character variable value has a leading space, a carriage return, or is\
    \ a single period."
  Output_Variables:
  - "variable_name"
  - "variable_data_type"
  - "variable_value"
Source:
  FDA_Validator_Rule_Message: "Unexpected character value in variable"
  FDA_Validator_Rule_Description: "Character values should not have leading space\
    \ ' ' characters, carriage returns, or '.' as an entire value. The only exceptions\
    \ are COVALn and TSVALn variables."
  Domains: "ALL"
