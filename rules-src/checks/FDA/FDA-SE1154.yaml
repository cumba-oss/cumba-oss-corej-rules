Core:
  Id: "FDA-SE1154"
  Status: "Published"
  Version: "1"
Description: "Raise an error when no record with TXPARMCD equal to 'PLANFSUB' ('Planned\
  \ Number of Female Subjects') is present for a SETCD in the Trial Sets (TX) domain."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "TX"
Grouping:
  Variables:
  - "SETCD"
Bindings:
- name: "$planfsub_count"
  expression: "record_count(domain=\"TX\", group=[SETCD], filter=(TXPARMCD == \"PLANFSUB\"\
    ))"
Check:
  expression: >-
    $planfsub_count == 0
Outcome:
  Message: "Missing PLANFSUB Trial Set Parameter: no 'Planned Number of Female Subjects'\
    \ (PLANFSUB) record is present for this SETCD in the Trial Sets (TX) domain."
  Output_Variables:
  - "$planfsub_count"
  - "SETCD"
Source:
  FDA_Validator_Rule_Message: "Missing PLANFSUB Trial Set Parameter within SETCD"
  FDA_Validator_Rule_Description: "'Planned Number of Female Subjects' (PLANFSUB)\
    \ records should be populated for each SETCD in Trial Sets (TX) domain."
  Domains: "TX"
Standards:
- Organization: "FDA"
