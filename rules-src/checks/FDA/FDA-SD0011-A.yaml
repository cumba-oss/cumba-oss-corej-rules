Core:
  Id: "FDA-SD0011-A"
  Status: "Published"
  Version: "1"
Description: "Raise an error when Planned Arm Code (ARMCD) is not 'SCRNFAIL' while\
  \ Description of Planned Arm (ARM) equals 'Screen Failure'."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "DM"
    - "TA"
Requirements:
  Variables:
    All:
    - "ARMCD"
    - "ARM"
Check:
  expression: >-
    upper(ARM) == "SCREEN FAILURE" and upper(ARMCD) != "SCRNFAIL"
Outcome:
  Message: "ARMCD is not 'SCRNFAIL' when ARM equals 'Screen Failure'."
  Output_Variables:
  - "ARMCD"
  - "ARM"
Source_Proposed:
  Sheet_Issue: "#222"
  FDA_Validator_Rule_Message: "ARMCD is not 'SCRNFAIL', when ARM equals 'Screen Failure'"
  FDA_Validator_Rule_Description: "Arm Code (ARMCD) must equal 'SCRNFAIL', when Description\
    \ of Arm (ARM) is 'Screen Failure'."
  Domains: "DM, TA"
Source:
  FDA_Validator_Rule_Message: "ARM is not 'Screen Failure', when ARMCD equals 'SCRNFAIL',\
    \ or vice versa"
  FDA_Validator_Rule_Description: "Description of Arm (ARM) must equal 'Screen Failure',\
    \  when Arm Code (ARMCD) is 'SCRNFAIL', and vice versa."
  Domains: "DM, TA"
