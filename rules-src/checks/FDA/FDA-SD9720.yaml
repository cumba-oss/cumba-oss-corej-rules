Core:
  Id: "FDA-SD9720"
  Status: "Published"
  Version: "1"
Description: "Raise an error when none of the Start Time-Point variables (--STDTC,\
  \ --STRF, --STRTPT) is present in the dataset although a record demands a start\
  \ point (not excepted by --OCCUR equals 'N' or a populated --STAT, or carrying a\
  \ populated end timepoint)."
Sensitivity: "Dataset"
Executability: "Partially Executable - Possible Overreporting"
Scope:
  Classes:
    Include:
    - "INTERVENTIONS"
    - "EVENTS"
    - "SPECIAL PURPOSE"
  Domains:
    Exclude:
    - "CO"
    - "DM"
Requirements:
  Variables:
    None:
    - "--STDTC"
    - "--STRF"
    - "--STRTPT"
Check:
  expression: >-
    --OCCUR != "N" and empty(--STAT) or not empty(--ENDTC) or not empty(--ENRF) or not
    empty(--ENRTPT)
Outcome:
  Message: "None of --STDTC, --STRF or --STRTPT is present in the dataset although\
    \ a record demands a Start Time-Point."
Source_Proposed:
  Sheet_Issue: "#185"
  FDA_Validator_Rule_Message: "No Start Time-Point variable (--STDTC, --STRF, --STRTPT)\
    \ is present in the dataset"
  FDA_Validator_Rule_Description: "At least one of the Start Time-Point variables\
    \ (Start Date/Time of Event or Intervention (--STDTC), Start Relative to Reference\
    \ Period (--STRF), Start Relative to Reference Time Point (--STRTPT)) must be\
    \ present in the dataset when a record is not excepted by Occurrence (--OCCUR)\
    \ = 'N' or a populated Completion Status (--STAT), or carries a populated end\
    \ timepoint (--ENDTC, --ENRF or --ENRTPT)."
  Domains: "SE, SM, SV, INTERVENTIONS, EVENTS"
Standards:
- Organization: "FDA"
  Standards:
  - Name: "SDTMIG"
    Version: "3.4"
  - Name: "SDTMIG"
    Version: "3.3"
  - Name: "SDTMIG"
    Version: "3.2"
  - Name: "SDTMIG"
    Version: "3.1.3"
  - Name: "SDTMIG"
    Version: "3.1.2"
  - Name: "SENDIG-AR"
    Version: "1.0"
