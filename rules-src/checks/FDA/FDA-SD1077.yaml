Core:
  Id: "FDA-SD1077"
  Status: "Published"
  Version: "1"
Description: "Raise an error when the expected variable EPOCH is not present in a\
  \ subject-level observation-class dataset."
Executability: "Partially Executable - Possible Underreporting"
Scope:
  Classes:
    Include:
    - "INTERVENTIONS"
    - "FINDINGS"
    - "EVENTS"
  Domains:
    Exclude:
    - "DD"
Check:
  expression: >-
    not var_exists("EPOCH")
Outcome:
  Message: "EPOCH is not present."
Source:
  FDA_Validator_Rule_Message: "Regulatory Expected variable not found"
  FDA_Validator_Rule_Description: "Variables requested by the relevant regulatory\
    \ agency in policy documents should be included in the dataset. E.g., EPOCH."
  Domains: "ALL"
