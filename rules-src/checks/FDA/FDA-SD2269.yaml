Core:
  Id: "FDA-SD2269"
  Status: "Published"
  Version: "1"
Description: "Raise an error when the Parameter Value (TSVAL) and its code (TSVALCD)\
  \ for a TDIGRP trial-summary parameter are not the term and concept ID of the same\
  \ SNOMED CT concept."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "TS"
Requirements:
  Variables:
    All:
    - "TSPARMCD"
Bindings:
- name: "$tdigrp_pair_valid"
  expression: "valid_external_dictionary_code_term_pair(TSVALCD, TSVAL, external_dictionary_type=\"\
    snomed\")"
Check:
  expression: >-
    TSPARMCD == "TDIGRP" and $tdigrp_pair_valid == false
Outcome:
  Message: "TSVAL and TSVALCD do not reference the same SNOMED CT concept for the\
    \ TDIGRP parameter."
  Output_Variables:
  - "TSPARMCD"
  - "TSVAL"
  - "TSVALCD"
Source:
  FDA_Validator_Rule_Message: "TSVAL/TSVALCD value mismatch for TDIGRP"
  FDA_Validator_Rule_Description: "TSVAL and TSVALCD values must be populated from\
    \ the same concept description record in SNOMED CT."
  Domains: "TS"
Standards:
- Organization: "FDA"
