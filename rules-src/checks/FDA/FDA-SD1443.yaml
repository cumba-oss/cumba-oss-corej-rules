Core:
  Id: "FDA-SD1443"
  Status: "Published"
  Version: "1"
Description: "Raise an error when --TERM is present and --BODSYS is present and --BODSYS\
  \ does not have the same value across records with the same value of --TERM."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "AE"
    - "CE"
    - "MH"
Requirements:
  Variables:
    All:
    - "--BODSYS"
Check:
  expression: >-
    var_exists("--TERM") and is_inconsistent_across_dataset(--BODSYS, keys=[--TERM])
Outcome:
  Message: "Inconsistent value for --BODSYS within --TERM"
Source:
  FDA_Validator_Rule_Message: "Inconsistent value for --BODSYS within --TERM"
  FDA_Validator_Rule_Description: "Body System (--BODSYS) should be consistent for\
    \ the same collected term (--TERM)"
  Domains: "AE, CE, MH"
