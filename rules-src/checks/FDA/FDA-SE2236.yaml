Core:
  Id: "FDA-SE2236"
  Status: "Published"
  Version: "1"
Description: "Raise an error when the Trial Summary (TS) dataset contains more than\
  \ one record where TSPARMCD equals 'SNDCTVER' (SEND Controlled Terminology Version)."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "TS"
Bindings:
- name: "$sndctver_count"
  expression: "record_count(filter=(TSPARMCD == \"SNDCTVER\"))"
Check:
  expression: >-
    $sndctver_count > 1
Outcome:
  Message: "Multiple SNDCTVER records: the Trial Summary (TS) domain must contain\
    \ only one record for the 'SNDCTVER' (SEND Controlled Terminology Version) parameter."
Source:
  FDA_Validator_Rule_Message: "Multiple SNDCTVER records"
  FDA_Validator_Rule_Description: "Trial Summary (TS) domain must contain only one\
    \ record for the 'SNDCTVER' parameter."
  Domains: "TS"
