Core:
  Id: "FDA-SD1010"
  Status: "Published"
  Version: "1"
Description: "Raise an error when ELEMENT is populated and ETCD is equal to 'UNPLAN'."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "SE"
Requirements:
  Variables:
    All:
    - "ELEMENT"
    - "ETCD"
Check:
  expression: >-
    ETCD == "UNPLAN" and not empty(ELEMENT)
Outcome:
  Message: "ELEMENT is populated when ETCD is equal to 'UNPLAN'."
Source:
  FDA_Validator_Rule_Message: "ELEMENT value is populated, when ETCD= 'UNPLAN'"
  FDA_Validator_Rule_Description: "Description of Element (ELEMENT) should be NULL,\
    \ when subject's experience for a particular period of time is represented as\
    \ an unplanned Element, where Element Code (ETCD) is equal to 'UNPLAN'."
  Domains: "SE"
