Core:
  Id: "FDA-SD1114"
  Status: "Published"
  Version: "1"
Description: "Raise an error when a Body System or Organ Class (--BODSYS) value is\
  \ not a valid System Organ Class in the MedDRA dictionary."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "AE"
    - "CE"
    - "MH"
Requirements:
  Variables:
    All:
    - "--BODSYS"
Bindings:
- name: "$bodsys_valid"
  expression: "valid_external_dictionary_value(--BODSYS, external_dictionary_type=\"\
    meddra\", dictionary_term_type=\"SOC\", case_sensitive=false)"
Check:
  expression: >-
    $bodsys_valid == false
Outcome:
  Message: "Body System or Organ Class (--BODSYS) is not a valid MedDRA System Organ\
    \ Class."
Source:
  FDA_Validator_Rule_Message: "Value for --BODSYS not found in MedDRA dictionary"
  FDA_Validator_Rule_Description: "Value for Body System or Organ Class (--BODSYS)\
    \ variable must be populated using a System Organ Class of the MedDRA dictionary\
    \ of a version specified in the define.xml (Case-insensitive)."
  Domains: "AE, CE, MH"
