Core:
  Id: "FDA-SE2248"
  Status: "Published"
  Version: "1"
Description: "Raise an error when the Subject Repro Stages (SJ) dataset is not present\
  \ in the study (expected for nonclinical Developmental and Reproductive Toxicology\
  \ studies)."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "ALL"
Check:
  expression: >-
    not ds_exists("SJ")
Outcome:
  Message: "The Subject Repro Stages (SJ) dataset is not present in the study."
Source:
  FDA_Validator_Rule_Message: "Missing SJ dataset"
  FDA_Validator_Rule_Description: "Subject Repro Stages (SJ) dataset should be included\
    \ for nonclinical Developmental and Reproductive Toxicology (DART) studies."
  Domains: "SJ"
Standards:
- Organization: "FDA"
  Standards:
  - Name: "SENDIG-DART"
    Version: "1.1"
    References:
    - Origin: "FDA Validator Rules"
      Rule_Identifier:
        Id: "SE2248"
        Version: "1"
      Version: "1.6"
    - Origin: "FDA Business Rules"
      Rule_Identifier:
        Id: "FDAB011"
        Version: "1"
      Version: "1.5"
