Core:
  Id: "FDA-SD0007"
  Status: "Published"
  Version: "1"
Description: "Raise an error when Standard Units (--STRESU) are inconsistent across\
  \ records that share the same --TESTCD, --OBJ, --TSTDTL, --CAT, --SCAT, --SPEC and\
  \ --METHOD values."
Executability: "Fully Executable"
Scope:
  Classes:
    Include:
    - "FINDINGS"
    - "FINDINGS ABOUT"
Requirements:
  Variables:
    All:
    - "--STRESU"
Check:
  expression: >-
    is_inconsistent_across_dataset(--STRESU, keys=[--TESTCD, --OBJ, --TSTDTL, --CAT, --SCAT, --SPEC,
    --METHOD])
Outcome:
  Message: "Standard Units (--STRESU) are inconsistent across records with the same\
    \ --TESTCD, --OBJ, --TSTDTL, --CAT, --SCAT, --SPEC and --METHOD."
Source:
  FDA_Validator_Rule_Message: "Inconsistent value for Standard Units"
  FDA_Validator_Rule_Description: "Standard Units (--STRESU) must be consistent for\
    \ all records with the same Short Name of Measurement, Test or Examination (--TESTCD),\
    \ Object of the Observation (--OBJ), Measurement,Test, or Examination Detail (--TSTDTL),\
    \ Category (--CAT), Subcategory (--SCAT), Specimen Type (--SPEC) and Method of\
    \ Test or Examination (--METHOD)."
  Domains: "FINDINGS, FINDINGS ABOUT"
