Core:
  Id: "FDA-SD1241"
  Status: "Published"
  Version: "1"
Description: "Raise an error when --BDSYCD is populated but --BODSYS is empty."
Executability: "Partially Executable - Possible Underreporting"
Scope:
  Domains:
    Include:
    - "AE"
    - "CE"
    - "MH"
Requirements:
  Variables:
    All:
    - "--BDSYCD"
    - "--BODSYS"
Check:
  expression: >-
    not empty(--BDSYCD) and empty(--BODSYS)
Outcome:
  Message: "--BODSYS is empty when --BDSYCD is populated."
Source:
  FDA_Validator_Rule_Message: "--BODSYS is not populated when --BDSYCD is populated"
  FDA_Validator_Rule_Description: "Body System or Organ Class (--BODSYS) must be populated\
    \ when Body System or Organ Class Code (--BDSYCD) is populated."
  Domains: "AE, CE, MH"
