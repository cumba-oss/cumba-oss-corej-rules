Core:
  Id: "FDA-SD9721"
  Status: "Published"
  Version: "1"
Description: "Raise an error when none of the Start Time-Point variables (--STDTC,\
  \ --STRF, --STRTPT) is present in the dataset although an end timepoint (--ENDTC,\
  \ --ENRF or --ENRTPT) is populated."
Sensitivity: "Dataset"
Executability: "Partially Executable - Possible Overreporting"
Scope:
  Classes:
    Include:
    - "INTERVENTIONS"
    - "EVENTS"
    - "SPECIAL PURPOSE"
  Domains:
    Exclude:
    - "CO"
    - "DM"
Requirements:
  Variables:
    None:
    - "--STDTC"
    - "--STRF"
    - "--STRTPT"
Check:
  expression: >-
    not empty(--ENDTC) or not empty(--ENRF) or not empty(--ENRTPT)
Outcome:
  Message: "None of --STDTC, --STRF or --STRTPT is present in the dataset although\
    \ an end timepoint is populated."
  Output_Variables:
  - "--ENDTC"
  - "--ENRF"
  - "--ENRTPT"
Source_Proposed:
  Sheet_Issue: "#187"
  FDA_Validator_Rule_Message: "No Start Time-Point variable (--STDTC, --STRF, --STRTPT)\
    \ is present in the dataset while an end timepoint is populated"
  FDA_Validator_Rule_Description: "At least one of the Start Time-Point variables\
    \ (Start Date/Time of Observation (--STDTC), Start Relative to Reference Period\
    \ (--STRF), Start Relative to Reference Time Point (--STRTPT)) must be present\
    \ in the dataset when End Date/Time of Observation (--ENDTC), End Relative to\
    \ Reference Period (--ENRF) or End Relative to Reference Time Period (--ENRTPT)\
    \ is populated."
  Domains: "SE, INTERVENTIONS, EVENTS"
Standards:
- Organization: "FDA"
  Standards:
  - Name: "SENDIG"
    Version: "3.1.1"
  - Name: "SENDIG"
    Version: "3.1"
  - Name: "SENDIG"
    Version: "3.0"
  - Name: "SENDIG-DART"
    Version: "1.1"
