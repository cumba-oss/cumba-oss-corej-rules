Core:
  Id: "FDA-SD0092"
  Status: "Published"
  Version: "1"
Description: "Raise an error when ETCD is equal to 'UNPLAN' but SEUPDES is empty."
Executability: "Partially Executable - Possible Underreporting"
Scope:
  Domains:
    Include:
    - "SE"
Requirements:
  Variables:
    All:
    - "ETCD"
    - "SEUPDES"
Check:
  expression: >-
    ETCD == "UNPLAN" and empty(SEUPDES)
Outcome:
  Message: "SEUPDES is empty when ETCD is equal to 'UNPLAN'."
Source:
  FDA_Validator_Rule_Message: "Missing value for SEUPDES, when ETCD='UNPLAN'"
  FDA_Validator_Rule_Description: "Description of Unplanned Element (SEUPDES) should\
    \ be populated, when subject's experience for a particular period of time is represented\
    \ as an unplanned Element, where Element Code (ETCD) is equal to 'UNPLAN'."
  Domains: "SE"
