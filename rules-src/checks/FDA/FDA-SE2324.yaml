Core:
  Id: "FDA-SE2324"
  Status: "Published"
  Version: "1"
Description: "Raise an error when --VAL is populated with a non-numeric value for\
  \ a record where --PARMCD equals 'PLANMSUB' (Planned Number of Male Subjects). Applies\
  \ to the TS and TX domains (TSVAL/TSPARMCD and TXVAL/TXPARMCD)."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "TS"
    - "TX"
Requirements:
  Variables:
    All:
    - "--PARMCD"
Check:
  expression: >-
    --PARMCD == "PLANMSUB" and not empty(--VAL) and not is_numeric(--VAL)
Outcome:
  Message: "Invalid --VAL value for PLANMSUB: --VAL must be numeric when --PARMCD\
    \ equals 'PLANMSUB' (Planned Number of Male Subjects)."
Source:
  FDA_Validator_Rule_Message: "Invalid --VAL value for PLANMSUB"
  FDA_Validator_Rule_Description: "TSVAL/TXVAL must be numeric when TSPARMCD/TXPARMCD\
    \ = 'PLANMSUB'."
  Domains: "TS, TX"
