Core:
  Id: "FDA-SD1231"
  Status: "Published"
  Version: "1"
Description: "Raise an error when the length of a value exceeds the value-level length\
  \ declared for the applicable value-level condition (Define-XML ValueListDef / WhereClauseDef)."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "ALL"
Check:
  expression: >-
    not empty(value()) and vlm_value_length(variable_name) > vlm_length(variable_name)
Outcome:
  Message: "The value is longer than the value-level length declared in the Define-XML."
  Output_Variables:
  - "variable_name"
  - "variable_value"
Source:
  FDA_Validator_Rule_Message: "Variable value is longer than defined max length %Variable.@Clause.Length%\
    \ when value-level condition occurs"
  FDA_Validator_Rule_Description: "Value level length must not exceed the length as\
    \ specified define.xml."
  Domains: "ALL"
