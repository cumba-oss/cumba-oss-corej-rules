Core:
  Id: "FDA-SD1340"
  Status: "Published"
  Version: "1"
Description: "Raise an error when an Exposure (EX) record, other than a run-in record\
  \ (EPOCH equals 'RUN-IN'), is present for a subject who is not treated (DM.ACTARMCD\
  \ equals 'NOTTRT' or is empty)."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "EX"
Requirements:
  Variables:
    All:
    - "STUDYID"
    - "USUBJID"
    All_Or_None:
    - - "STUDYID"
      - "DM.STUDYID"
    - - "USUBJID"
      - "DM.USUBJID"
Match_Datasets:
- Keys:
  - "STUDYID"
  - "USUBJID"
  Cardinality: "n:1"
  Name: "DM"
Check:
  expression: >-
    (not var_exists("EPOCH") or EPOCH != "RUN-IN") and var_exists(DM.ACTARMCD) and
    (upper(DM.ACTARMCD) == "NOTTRT" or empty(DM.ACTARMCD))
Outcome:
  Message: "An Exposure (EX) record is present for a subject who is not treated (ACTARMCD\
    \ equals 'NOTTRT' or is empty)."
  Message_Folded: "EPOCH not present in the dataset, and at least one record meets\
    \ the rest of the condition: An Exposure (EX) record is present for a subject\
    \ who is not treated (ACTARMCD equals 'NOTTRT' or is empty)."
Source:
  FDA_Validator_Rule_Message: "EX record is present, when subject is not treated"
  FDA_Validator_Rule_Description: "Subjects that are not treated (ACTARMCD='NOTTRT'\
    \ or null) should not have any Exposure records. Run-in records (EPOCH='RUN-IN')\
    \ are excluded from firing for this validation rule."
  Domains: "EX"
Standards:
