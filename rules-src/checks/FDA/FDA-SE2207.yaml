Core:
  Id: "FDA-SE2207"
  Status: "Published"
  Version: "1"
Description: "Raise an error when the Trial Summary (TS) dataset does not contain\
  \ a record where TSPARMCD equals 'GLPTYP' (Good Laboratory Practice Type)."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "TS"
Bindings:
- name: "$glptyp_count"
  expression: "record_count(filter=filter(TSPARMCD=\"GLPTYP\"))"
Check:
  expression: >-
    $glptyp_count == 0
Outcome:
  Message: "Missing GLPTYP Trial Summary Parameter: a 'Good Laboratory Practice Type'\
    \ (GLPTYP) record must be present in the Trial Summary (TS) domain."
  Output_Variables:
  - "$glptyp_count"
Source:
  FDA_Validator_Rule_Message: "Missing GLPTYP Trial Summary Parameter"
  FDA_Validator_Rule_Description: "'Good Laboratory Practice Type' (GLPTYP) record\
    \ should be populated in Trial Summary (TS) domain."
  Domains: "TS"
Standards:
- Organization: "FDA"
  Standards:
  - Name: "SENDIG"
    Version: "3.0"
    References:
    - Origin: "FDA Validator Rules"
      Rule_Identifier:
        Id: "SE2207"
        Version: "1"
      Version: "1.6"
    - Origin: "FDA Business Rules"
      Rule_Identifier:
        Id: "FDAB011"
        Version: "1"
      Version: "1.5"
