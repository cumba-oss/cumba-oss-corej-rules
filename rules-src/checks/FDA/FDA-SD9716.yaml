Core:
  Id: "FDA-SD9716"
  Status: "Published"
  Version: "1"
Description: "Raise an error when Body System or Organ Class (--BODSYS) is not present\
  \ in the dataset although Body System or Organ Class Code (--BDSYCD) is populated."
Sensitivity: "Dataset"
Executability: "Partially Executable - Possible Overreporting"
Scope:
  Domains:
    Include:
    - "AE"
    - "CE"
    - "MH"
Requirements:
  Variables:
    None:
    - "--BODSYS"
    All:
    - "--BDSYCD"
Check:
  expression: >-
    not empty(--BDSYCD)
Outcome:
  Message: "--BODSYS is not present in the dataset although --BDSYCD is populated."
Source_Proposed:
  Sheet_Issue: "#177"
  FDA_Validator_Rule_Message: "Body System or Organ Class (--BODSYS) is not present\
    \ in the dataset when --BDSYCD is populated"
  FDA_Validator_Rule_Description: "The Body System or Organ Class (--BODSYS) variable\
    \ must be present in the dataset when the Body System or Organ Class Code (--BDSYCD)\
    \ variable is populated."
  Domains: "AE, CE, MH"
Standards:
- Organization: "FDA"
  Standards:
  - Name: "SDTMIG"
    Version: "3.4"
  - Name: "SDTMIG"
    Version: "3.3"
  - Name: "SDTMIG"
    Version: "3.2"
  - Name: "SDTMIG"
    Version: "3.1.3"
  - Name: "SDTMIG"
    Version: "3.1.2"
  - Name: "SENDIG-AR"
    Version: "1.0"
