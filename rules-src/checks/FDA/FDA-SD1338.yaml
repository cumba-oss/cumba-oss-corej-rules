Core:
  Id: "FDA-SD1338"
  Status: "Published"
  Version: "1"
Description: "Raise an error when an RSLNKGRP value in the RS domain is not present\
  \ as a TRLNKGRP value in the TR domain for the same subject."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "RS"
Requirements:
  Variables:
    All:
    - "RSLNKGRP"
Bindings:
- name: "$tr_lnkgrp"
  expression: "distinct(TRLNKGRP, domain=\"TR\", group=[USUBJID])"
Check:
  expression: >-
    not empty(RSLNKGRP) and RSLNKGRP not in $tr_lnkgrp
Outcome:
  Message: "RSLNKGRP does not match any TRLNKGRP value in the TR domain for the subject."
  Output_Variables:
  - "$tr_lnkgrp"
Source:
  FDA_Validator_Rule_Message: "RSLNKGRP value does not exist in TR domain"
  FDA_Validator_Rule_Description: "A Link Group (RSLNKGRP) value for a response assessment\
    \ that is referenced in the Disease Response (RS) domain for a subject must also\
    \ be present in the Tumor Results (TR) domain for the appropriate measurement\
    \ records for that subject."
  Domains: "RS"
