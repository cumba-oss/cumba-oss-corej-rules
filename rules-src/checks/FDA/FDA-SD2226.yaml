Core:
  Id: "FDA-SD2226"
  Status: "Published"
  Version: "1"
Description: "Raise an error when the Trial Summary (TS) dataset does not contain\
  \ a record where TSPARMCD equals 'DCUTDTC' (Data Cutoff Date)."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "TS"
Bindings:
- name: "$dcutdtc_count"
  expression: "record_count(filter=(TSPARMCD == \"DCUTDTC\"))"
Check:
  expression: >-
    $dcutdtc_count == 0
Outcome:
  Message: "Missing DCUTDTC Trial Summary Parameter: a 'Data Cutoff Date' (DCUTDTC)\
    \ record must be present in the Trial Summary (TS) domain."
  Output_Variables:
  - "$dcutdtc_count"
Source:
  FDA_Validator_Rule_Message: "Missing DCUTDTC Trial Summary Parameter"
  FDA_Validator_Rule_Description: "'Data Cutoff Date' (DCUTDTC) record must be populated\
    \ in Trial Summary (TS) domain. It is expected for SDTM IG v3.1.2 data and required\
    \ for data in all more recent SDTM versions."
  Domains: "TS"
