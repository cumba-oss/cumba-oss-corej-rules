Core:
  Id: "FDA-SD1327"
  Status: "Published"
  Version: "1"
Description: "Raise an error when the Related Subject or Pool Identifier (RSUBJID)\
  \ is populated and equal to the Pool Identifier (POOLID)."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "RELSUB"
Requirements:
  Variables:
    All:
    - "RSUBJID"
    - "POOLID"
Check:
  expression: >-
    not empty(RSUBJID) and RSUBJID == POOLID
Outcome:
  Message: "RSUBJID is equal to POOLID."
Source:
  FDA_Validator_Rule_Message: "RSUBJID is equal to POOLID"
  FDA_Validator_Rule_Description: "The Related Subject or Pool Identifier (RSUBJID)\
    \ value should not be equal to Pool Identifier (POOLID)."
  Domains: "RELSUB"
