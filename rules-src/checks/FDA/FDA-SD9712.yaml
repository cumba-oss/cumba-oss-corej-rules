Core:
  Id: "FDA-SD9712"
  Status: "Published"
  Version: "1"
Description: "Raise an error when VISIT is not populated."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "TV"
Requirements:
  Variables:
    All:
    - "VISIT"
Check:
  expression: >-
    empty(VISIT)
Outcome:
  Message: "VISIT is not populated."
  Message_Folded: "VISIT not populated in any record of the dataset: VISIT is not\
    \ populated."
Source_Proposed:
  FDA_Validator_Rule_Message: "Missing value for VISIT"
  FDA_Validator_Rule_Description: "VISIT should be populated."
  Domains: "TV"
Source:
  FDA_Validator_Rule_Message: "NULL value in variable marked as Required"
  FDA_Validator_Rule_Description: "Required variables (where Core attribute is 'Req')\
    \ cannot be NULL for any records."
  Domains: "ALL"
