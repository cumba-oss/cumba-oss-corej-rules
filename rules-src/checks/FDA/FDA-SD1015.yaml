Core:
  Id: "FDA-SD1015"
  Status: "Published"
  Version: "1"
Description: "Raise an error when EPOCH is populated but does not match any EPOCH\
  \ value in the TA dataset."
Executability: "Fully Executable"
Scope:
  Domains:
    Exclude:
    - "TA"
Requirements:
  Variables:
    All:
    - "EPOCH"
Bindings:
- name: "$ta_epoch"
  expression: "distinct(EPOCH, domain=\"TA\")"
Check:
  expression: >-
    EPOCH not in $ta_epoch and not empty(EPOCH)
Outcome:
  Message: "EPOCH value does not match any EPOCH value in the TA dataset."
  Output_Variables:
  - "EPOCH"
  - "$ta_epoch"
Source:
  FDA_Validator_Rule_Message: "Invalid EPOCH"
  FDA_Validator_Rule_Description: "Epoch (EPOCH) values should match entries in the\
    \ Trial Arms (TA) dataset."
  Domains: "SE, SM, SV, INTERVENTIONS, FINDINGS, FINDINGS ABOUT, EVENTS, STUDY REFERENCE"
