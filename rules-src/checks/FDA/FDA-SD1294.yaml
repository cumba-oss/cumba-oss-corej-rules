Core:
  Id: "FDA-SD1294"
  Status: "Published"
  Version: "1"
Description: "Raise an error when Pre-Specified (--PRESP) is not present in the dataset\
  \ but Completion Status (--STAT) is present in the dataset."
Executability: "Fully Executable"
Scope:
  Classes:
    Include:
    - "EVENTS"
    - "INTERVENTIONS"
  Domains:
    Exclude:
    - "DS"
    - "DV"
    - "EX"
Check:
  expression: >-
    not var_exists("--PRESP") and var_exists("--STAT")
Outcome:
  Message: "--STAT is present when --PRESP is not present."
  Output_Variables:
  - "--STAT"
Source:
  FDA_Validator_Rule_Message: "--STAT variable is present when --PRESP variable is\
    \ missing"
  FDA_Validator_Rule_Description: "Completion Status (--STAT) variable should not\
    \ be present in the domain, when the Pre-specified (--PRESP) variable is missing."
  Domains: "INTERVENTIONS, EVENTS, NOT(DS, DV, EX)"
