Core:
  Id: "FDA-SE2318"
  Status: "Published"
  Version: "1"
Description: "Raise an error when neither VISITDY nor PPNOMDY is present and populated\
  \ in PP; at least one required timing variable must be populated."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "PP"
Check:
  expression: >-
    empty(VISITDY) and empty(PPNOMDY)
Outcome:
  Message: "Neither VISITDY nor PPNOMDY is populated; at least one required timing\
    \ variable must be present and populated."
  Message_Folded: "PPNOMDY and VISITDY absent or not populated in any record of the\
    \ dataset, and at least one record meets the rest of the condition: Neither VISITDY\
    \ nor PPNOMDY is populated; at least one required timing variable must be present\
    \ and populated."
Source:
  FDA_Validator_Rule_Message: "Missing values for all required set(s) of timing variables:\
    \ VISITDY or --NOMDY"
  FDA_Validator_Rule_Description: "At least one of these variables or sets of variables\
    \ must be present and populated in PP: VISITDY or PPNOMDY. These are the required\
    \ timing variables for identification of the day on which group summaries (Group\
    \ Means and Incidences) are calculated for pharmacokinetic parameters."
  Domains: "PP"
