Core:
  Id: "FDA-SD2273"
  Status: "Published"
  Version: "1"
Description: "Raise an error when the Trial Summary (TS) dataset does not contain\
  \ a record where TSPARMCD equals 'EXTTIND' (Extension Trial Indicator)."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "TS"
Bindings:
- name: "$exttind_count"
  expression: "record_count(filter=(TSPARMCD == \"EXTTIND\"))"
Check:
  expression: >-
    $exttind_count == 0
Outcome:
  Message: "Missing EXTTIND Trial Summary Parameter: an 'Extension Trial Indicator'\
    \ (EXTTIND) record must be present in the Trial Summary (TS) domain."
Source:
  FDA_Validator_Rule_Message: "Missing EXTTIND Trial Summary Parameter"
  FDA_Validator_Rule_Description: "'Extension Trial Indicator' (EXTTIND) record must\
    \ be populated in Trial Summary (TS) domain. It is an 'FDA Desired' parameter\
    \ listed in the Technical Conformance Guide (TCG)."
  Domains: "TS"
