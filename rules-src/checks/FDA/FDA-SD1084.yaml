Core:
  Id: "FDA-SD1084"
  Status: "Published"
  Version: "1"
Description: "Raise an error when --DTC is a complete date and the reference start\
  \ date DM.RFSTDTC is a complete date, but --DY value is not populated."
Executability: "Fully Executable"
Scope:
  Classes:
    Include:
    - "INTERVENTIONS"
    - "EVENTS"
    - "FINDINGS"
    - "FINDINGS ABOUT"
Requirements:
  Variables:
    All:
    - "--DTC"
    - "--DY"
    - "USUBJID"
    All_Or_None:
    - - "USUBJID"
      - "DM.USUBJID"
Match_Datasets:
- Name: "DM"
  Keys:
  - "USUBJID"
Check:
  expression: >-
    not empty(--DTC) and is_complete_date(--DTC) and not empty(DM.RFSTDTC) and
    is_complete_date(DM.RFSTDTC) and empty(--DY)
Outcome:
  Message: "Collection study day (--DY) value is not populated when collection date\
    \ (--DTC) and reference start date (RFSTDTC) are complete dates."
  Output_Variables:
  - "!--DY"
Source:
  FDA_Validator_Rule_Message: "--DY variable value is not populated"
  FDA_Validator_Rule_Description: "Collection Study Day (--DY) variable value should\
    \ be populated, when Collection Study Date/Time (--DTC) and Subject Reference\
    \ Start Date/Time (RFSTDTC) variables values are provided, and both of them include\
    \ complete date part."
  Domains: "INTERVENTIONS, EVENTS, FINDINGS, FINDINGS ABOUT"
