Core:
  Id: "FDA-SD1365"
  Status: "Published"
  Version: "1"
Description: "Raise an error when an ADSL population flag (such as COMPLT, FASFL/FULLSET,\
  \ ITT, PPROTFL/PPROT, SAFFL/SAFETY) is present as a supplemental qualifier for DM."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "SUPP--"
    - "SQ--"
Requirements:
  Variables:
    All:
    - "RDOMAIN"
    - "QNAM"
Check:
  expression: >-
    upper(RDOMAIN) == "DM" and QNAM in ["ENRFL", "SAFFL", "EFFFL", "ITTFL", "PPROTFL", "COMPLFL",
    "FASFL", "COMPLT", "FULLSET", "ITT", "PPROT", "SAFETY"]
Outcome:
  Message: "ADSL population flag is present in SUPPDM."
Source:
  FDA_Validator_Rule_Message: "ADSL Population Flags provided in SDTM"
  FDA_Validator_Rule_Description: "ADSL Population Flags, which had standard Supplemental\
    \ Qualifiers included in previous versions of the SDTMIG (COMPLT, FASFL/FULLSET,\
    \ ITT, PPROTFL/PPROT, SAFFL/SAFETY, etc.) should no longer be used in SDTM."
  Domains: "SUPPQUAL"
Standards:
- Organization: "FDA"
  Standards:
  - Name: "SDTMIG"
    Version: "3.4"
    References:
    - Origin: "FDA Validator Rules"
      Rule_Identifier:
        Id: "SD1365"
        Version: "1"
      Version: "1.6"
  - Name: "SDTMIG"
    Version: "3.3"
    References:
    - Origin: "FDA Validator Rules"
      Rule_Identifier:
        Id: "SD1365"
        Version: "1"
      Version: "1.6"
- Organization: "CDISC"
  Standards:
  - Name: "SDTMIG"
    Version: "3.4"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0528"
        Version: "1"
      Version: "2.0"
  - Name: "SDTMIG"
    Version: "3.3"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0528"
        Version: "1"
      Version: "2.0"
