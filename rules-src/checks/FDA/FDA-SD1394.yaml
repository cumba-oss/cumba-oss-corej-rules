Core:
  Id: "FDA-SD1394"
  Status: "Published"
  Version: "1"
Description: "Raise an error when Start Date/Time of Observation (--STDTC) and Date/Time\
  \ of First Study Treatment (RFXSTDTC) are both populated as complete dates but Start\
  \ Day of Obs Relative to Exposure (--XSTDY) is missing."
Executability: "Fully Executable"
Scope:
  Classes:
    Include:
    - "INTERVENTIONS"
    - "EVENTS"
    - "FINDINGS"
    - "FINDINGS ABOUT"
Requirements:
  Variables:
    All:
    - "--XSTDY"
    - "--STDTC"
    - "STUDYID"
    - "USUBJID"
    All_Or_None:
    - - "STUDYID"
      - "DM.STUDYID"
    - - "USUBJID"
      - "DM.USUBJID"
Match_Datasets:
- Keys:
  - "STUDYID"
  - "USUBJID"
  Cardinality: "n:1"
  Name: "DM"
Check:
  expression: >-
    not empty(--STDTC) and is_complete_date(--STDTC) and not empty(DM.RFXSTDTC) and
    is_complete_date(DM.RFXSTDTC) and empty(--XSTDY)
Outcome:
  Message: "Start Day of Obs Relative to Exposure (--XSTDY) is missing when --STDTC\
    \ and RFXSTDTC are both populated complete dates."
  Message_Folded: "--XSTDY not populated in any record of the dataset, and at least\
    \ one record meets the rest of the condition: Start Day of Obs Relative to Exposure\
    \ (--XSTDY) is missing when --STDTC and RFXSTDTC are both populated complete dates."
  Output_Variables:
  - "!--XSTDY"
Source:
  FDA_Validator_Rule_Message: "--XSTDY variable value is not populated"
  FDA_Validator_Rule_Description: "Start Day of Obs Relative to Exposure (--XSTDY)\
    \ variable value should be populated, when Start Date/Time of Observation (--STDTC)\
    \ and Date/Time of First Study Treatment (RFXSTDTC) variables values are provided,\
    \ and both of them include complete date parts."
  Domains: "INTERVENTIONS, FINDINGS, EVENTS, FINDINGS ABOUT"
Standards:
- Organization: "FDA"
  Standards:
  - Name: "SENDIG-AR"
    Version: "1.0"
    References:
    - Origin: "FDA Validator Rules"
      Rule_Identifier:
        Id: "SD1394"
        Version: "1"
      Version: "1.6"
