Core:
  Id: "FDA-SD1070"
  Status: "Published"
  Version: "1"
Description: "Raise an error when the value of --PARMCD is not the same across all\
  \ records that share the same value of --PARM."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "DI"
    - "TS"
    - "TX"
Requirements:
  Variables:
    All:
    - "--PARMCD"
Check:
  expression: >-
    var_exists("--PARM") and is_inconsistent_across_dataset(--PARMCD, keys=[--PARM])
Outcome:
  Message: "Value of --PARMCD is not consistent for a given value of --PARM."
Source:
  FDA_Validator_Rule_Message: "Inconsistent value for --PARMCD within --PARM"
  FDA_Validator_Rule_Description: "All values of a Parameter Short Name (--PARMCD)\
    \ variables should be the same for a given value of a Parameter (--PARM) variables."
  Domains: "DI, TS, TX"
