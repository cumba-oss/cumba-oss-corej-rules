Core:
  Id: "FDA-SD2240"
  Status: "Published"
  Version: "1"
Description: "Raise an error when TSPARMCD equals 'INDIC' but the Name of the Reference\
  \ Terminology (TSVCDREF) is not equal to 'SNOMED'."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "TS"
Requirements:
  Variables:
    All:
    - "TSPARMCD"
    - "TSVCDREF"
Check:
  expression: >-
    TSPARMCD == "INDIC" and TSVCDREF != "SNOMED"
Outcome:
  Message: "TSVCDREF does not equal 'SNOMED' when TSPARMCD equals 'INDIC'."
Source:
  FDA_Validator_Rule_Message: "Invalid TSVCDREF value for INDIC"
  FDA_Validator_Rule_Description: "TSVCDREF variable value must be 'SNOMED', when\
    \ TSPARAMCD='INDIC'."
  Domains: "TS"
