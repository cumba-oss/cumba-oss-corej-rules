Core:
  Id: "FDA-SD2214"
  Status: "Published"
  Version: "1"
Description: "Raise an error when the Trial Summary (TS) dataset does not contain\
  \ a record where TSPARMCD equals 'TPHASE' (Trial Phase Classification)."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "TS"
Bindings:
- name: "$tphase_count"
  expression: "record_count(filter=filter(TSPARMCD=\"TPHASE\"))"
Check:
  expression: >-
    $tphase_count == 0
Outcome:
  Message: "Missing TPHASE Trial Summary Parameter: a 'Trial Phase Classification'\
    \ (TPHASE) record must be present in the Trial Summary (TS) domain."
  Output_Variables:
  - "$tphase_count"
Source:
  FDA_Validator_Rule_Message: "Missing TPHASE Trial Summary Parameter"
  FDA_Validator_Rule_Description: "'Trial Phase Classification' (TPHASE) record must\
    \ be populated in Trial Summary (TS) domain. It is expected for SDTM IG v3.1.2\
    \ data and required for data in all more recent SDTM versions."
  Domains: "TS"
