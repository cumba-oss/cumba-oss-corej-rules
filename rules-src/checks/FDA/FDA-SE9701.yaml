Core:
  Id: "FDA-SE9701"
  Status: "Published"
  Version: "1"
Description: "Raise an error when --SPEC is not populated."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "MI"
    - "OM"
    - "PC"
    - "TF"
Requirements:
  Variables:
    All:
    - "--SPEC"
Check:
  expression: >-
    empty(--SPEC)
Outcome:
  Message: "--SPEC is not populated."
  Message_Folded: "--SPEC not populated in any record of the dataset: --SPEC is not\
    \ populated."
Source_Proposed:
  FDA_Validator_Rule_Message: "Missing value for --SPEC"
  FDA_Validator_Rule_Description: "--SPEC should be populated."
  Domains: "MI, OM, PC, TF"
Source:
  FDA_Validator_Rule_Message: "NULL value in variable marked as Required"
  FDA_Validator_Rule_Description: "Required variables (where Core attribute is 'Req')\
    \ cannot be NULL for any records."
  Domains: "ALL"
