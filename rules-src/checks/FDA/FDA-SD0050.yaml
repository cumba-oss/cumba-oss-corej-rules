Core:
  Id: "FDA-SD0050"
  Status: "Published"
  Version: "1"
Description: "Raise an error when --ENRTPT (End Relative to Reference Time Point)\
  \ is populated but --ENTPT (End Reference Time Point) is empty."
Executability: "Partially Executable - Possible Underreporting"
Scope:
  Domains:
    Include:
    - "ALL"
Requirements:
  Variables:
    All:
    - "--ENRTPT"
    - "--ENTPT"
Check:
  expression: >-
    not empty(--ENRTPT) and empty(--ENTPT)
Outcome:
  Message: "--ENTPT is empty when --ENRTPT is populated."
  Message_Folded: "--ENTPT not populated in any record of the dataset, and at least\
    \ one record meets the rest of the condition: --ENTPT is empty when --ENRTPT is\
    \ populated."
Source:
  FDA_Validator_Rule_Message: "Missing value for --ENTPT, when --ENRTPT is populated"
  FDA_Validator_Rule_Description: "End Reference Time Point (--ENTPT) must not be\
    \ NULL, when End Relative to Reference Time Point (--ENRTPT) is provided."
  Domains: "SE, SM, SV, INTERVENTIONS, EVENTS, FINDINGS, FINDINGS ABOUT"
