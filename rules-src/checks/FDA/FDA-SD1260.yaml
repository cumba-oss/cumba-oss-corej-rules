Core:
  Id: "FDA-SD1260"
  Status: "Published"
  Version: "1"
Description: "Raise an error when the Reference Terminology (TSVCDREF) is populated\
  \ but the Version of the Reference Terminology (TSVCDVER) is empty."
Executability: "Partially Executable - Possible Overreporting"
Scope:
  Domains:
    Include:
    - "TS"
Check:
  expression: >-
    not empty(TSVCDREF) and empty(TSVCDVER) and upper(TSVCDREF) not in ["ISO 8601",
    "ISO 3166-1 ALPHA-3", "UNII", "CLINICALTRIALS.GOV", "ISO 3166", "ISO 3166 ALPHA-3", "EUDRACT",
    "EUDRAC", "DUNS", "D-U-N-S", "ISO 21090"]
Outcome:
  Message: "TSVCDVER is empty when Reference Terminology is versioned: TSVCDVER should\
    \ be populated when the Reference Terminology (TSVCDREF) is versioned."
  Output_Variables:
  - "TSPARMCD"
Source:
  FDA_Validator_Rule_Message: "TSVCDVER is null when Reference Terminology is versioned"
  FDA_Validator_Rule_Description: "The Version of the Reference Terminology variable\
    \ (TSVCDVER) should be populated with the version number of the Reference Terminology,\
    \ when that Reference Terminology is versioned."
  Domains: "TS"
