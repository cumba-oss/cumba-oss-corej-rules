Core:
  Id: "FDA-SE2303"
  Status: "Published"
  Version: "1"
Description: "Raise an error when no record with TXPARMCD equal to 'TRTDOS' ('Dose\
  \ Level') is present for a SETCD in the Trial Sets (TX) domain."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "TX"
Grouping:
  Variables:
  - "SETCD"
Bindings:
- name: "$trtdos_count"
  expression: "record_count(domain=\"TX\", group=[SETCD], filter=(TXPARMCD == \"TRTDOS\"\
    ))"
Check:
  expression: >-
    $trtdos_count == 0
Outcome:
  Message: "Missing TRTDOS Trial Set Parameter: no 'Dose Level' (TRTDOS) record is\
    \ present for this SETCD in the Trial Sets (TX) domain."
  Output_Variables:
  - "SETCD"
Source:
  FDA_Validator_Rule_Message: "Missing TRTDOS Trial Set Parameter within SETCD"
  FDA_Validator_Rule_Description: "'Dose Level' (TRTDOS) records should be populated\
    \ for each SETCD in Trial Sets (TX) domain."
  Domains: "TX"
Standards:
- Organization: "FDA"
  Standards:
