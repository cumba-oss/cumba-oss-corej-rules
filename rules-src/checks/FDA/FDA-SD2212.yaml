Core:
  Id: "FDA-SD2212"
  Status: "Published"
  Version: "1"
Description: "Raise an error when the study type is 'INTERVENTIONAL' and the Trial\
  \ Summary (TS) dataset does not contain a record where TSPARMCD equals 'TINDTP'\
  \ (Trial Indication Type)."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "TS"
Bindings:
- name: "$stype_interventional_count"
  expression: "record_count(filter=filter(TSPARMCD=\"STYPE\", TSVAL=\"INTERVENTIONAL\"\
    ))"
- name: "$tindtp_count"
  expression: "record_count(filter=filter(TSPARMCD=\"TINDTP\"))"
Check:
  expression: >-
    $stype_interventional_count >= 1 and $tindtp_count == 0
Outcome:
  Message: "Missing TINDTP Trial Summary Parameter: a 'Trial Indication Type' (TINDTP)\
    \ record must be present in the Trial Summary (TS) domain."
  Output_Variables:
  - "$tindtp_count"
Source:
  FDA_Validator_Rule_Message: "Missing TINDTP Trial Summary Parameter"
  FDA_Validator_Rule_Description: "'Trial Indication Type' (TINDTP) record must be\
    \ populated in Trial Summary (TS) domain, when study type is 'INTERVENTIONAL'.\
    \ It is expected for SDTM IG v3.1.2 data and required for data in all more recent\
    \ SDTM versions."
  Domains: "TS"
