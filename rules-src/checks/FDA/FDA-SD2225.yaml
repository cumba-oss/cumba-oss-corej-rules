Core:
  Id: "FDA-SD2225"
  Status: "Published"
  Version: "1"
Description: "Raise an error when the Trial Summary (TS) dataset does not contain\
  \ a record where TSPARMCD equals 'ADAPT' (Adaptive Design)."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "TS"
Bindings:
- name: "$adapt_count"
  expression: "record_count(filter=(TSPARMCD == \"ADAPT\"))"
Check:
  expression: >-
    $adapt_count == 0
Outcome:
  Message: "Missing ADAPT Trial Summary Parameter: a 'Adaptive Design' (ADAPT) record\
    \ must be present in the Trial Summary (TS) domain."
  Output_Variables:
  - "$adapt_count"
Source:
  FDA_Validator_Rule_Message: "Missing ADAPT Trial Summary Parameter"
  FDA_Validator_Rule_Description: "'Adaptive Design' (ADAPT) record must be populated\
    \ in Trial Summary (TS) domain. It is expected for SDTM IG v3.1.2 data and required\
    \ for data in all more recent SDTM versions."
  Domains: "TS"
