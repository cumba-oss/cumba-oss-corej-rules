Core:
  Id: "FDA-SD9730"
  Status: "Published"
  Version: "1"
Description: "Raise an error when neither the Rule for End of Repro Stage (TTENRL)\
  \ nor the Planned Duration of Repro Stage (TTDUR) variable is present in the Trial\
  \ Repro Stages (TT) dataset; at least one of the two must be populated for each\
  \ Repro Stage."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "TT"
Check:
  expression: >-
    not var_exists("TTENRL") and not var_exists("TTDUR")
Outcome:
  Message: "Neither the TTENRL nor the TTDUR variable is present in the dataset."
Source_Proposed:
  Sheet_Issue: "#215"
  FDA_Validator_Rule_Message: "Neither the TTENRL nor the TTDUR variable is present\
    \ in the dataset"
  FDA_Validator_Rule_Description: "At least one of Rule for End of Repro Stage (TTENRL)\
    \ or Planned Duration of Repro Stage (TTDUR) must be present in the dataset so\
    \ that one of them can be populated for each Repro Stage."
  Domains: "TT"
Standards:
- Organization: "FDA"
  Standards:
  - Name: "SENDIG-DART"
    Version: "1.1"
