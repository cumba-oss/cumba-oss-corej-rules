Core:
  Id: "FDA-SD1393"
  Status: "Published"
  Version: "1"
Description: "Raise an error when Date/Time of Collection (--DTC) and Date/Time of\
  \ First Study Treatment (RFXSTDTC) are both populated as complete dates but Day\
  \ of Obs Relative to Exposure (--XDY) is missing."
Executability: "Fully Executable"
Scope:
  Classes:
    Include:
    - "INTERVENTIONS"
    - "EVENTS"
    - "FINDINGS"
    - "FINDINGS ABOUT"
Requirements:
  Variables:
    All:
    - "--XDY"
    - "--DTC"
    - "STUDYID"
    - "USUBJID"
    All_Or_None:
    - - "STUDYID"
      - "DM.STUDYID"
    - - "USUBJID"
      - "DM.USUBJID"
Match_Datasets:
- Keys:
  - "STUDYID"
  - "USUBJID"
  Cardinality: "n:1"
  Name: "DM"
Check:
  expression: >-
    not empty(--DTC) and is_complete_date(--DTC) and not empty(DM.RFXSTDTC) and
    is_complete_date(DM.RFXSTDTC) and empty(--XDY)
Outcome:
  Message: "Day of Obs Relative to Exposure (--XDY) is missing when --DTC and RFXSTDTC\
    \ are both populated complete dates."
  Output_Variables:
  - "!--XDY"
Source:
  FDA_Validator_Rule_Message: "--XDY variable value is not populated"
  FDA_Validator_Rule_Description: "Day of Obs Relative to Exposure (--XDY) variable\
    \ value should be populated, when Date/Time of Collection (--DTC) and Date/Time\
    \ of First Study Treatment (RFXSTDTC) variables values are provided, and both\
    \ of them include complete date parts."
  Domains: "INTERVENTIONS, FINDINGS, EVENTS, FINDINGS ABOUT"
Standards:
- Organization: "FDA"
  Standards:
  - Name: "SENDIG-AR"
    Version: "1.0"
    References:
    - Origin: "FDA Validator Rules"
      Rule_Identifier:
        Id: "SD1393"
        Version: "1"
      Version: "1.6"
