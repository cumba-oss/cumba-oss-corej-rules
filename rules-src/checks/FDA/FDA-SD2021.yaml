Core:
  Id: "FDA-SD2021"
  Status: "Published"
  Version: "1"
Description: "Raise an error when Age Units (AGEU) is populated but neither Age (AGE)\
  \ nor Age Range (AGETXT) is provided (AGE is missing and AGETXT is empty or not\
  \ present in the dataset)."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "DM"
Check:
  expression: >-
    not empty(AGEU) and empty(AGE) and empty(AGETXT)
Outcome:
  Message: "AGEU is populated, but AGE is missing and AGETXT is empty or not present\
    \ in the dataset."
  Message_Folded: "AGE or AGETXT absent or not populated in any record of the dataset,\
    \ and at least one record meets the rest of the condition: AGEU is populated,\
    \ but AGE is missing and AGETXT is empty or not present in the dataset."
Source:
  FDA_Validator_Rule_Message: "Missing values for both AGE and AGETXT, when AGEU is\
    \ provided"
  FDA_Validator_Rule_Description: "Either of Age (AGE) or Age Range (AGETXT) variable\
    \ values should be provided, when Age Units (AGEU) are populated."
  Domains: "DM"
