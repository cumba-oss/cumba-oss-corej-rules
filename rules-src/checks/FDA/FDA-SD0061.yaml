Core:
  Id: "FDA-SD0061"
  Status: "Published"
  Version: "1"
Description: "Raise an error when a domain declared in the Define-XML has no corresponding\
  \ dataset in the study."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "ALL"
Bindings:
- name: "$study_datasets"
  expression: "dataset_names()"
- name: "$define_datasets"
  expression: "define_dataset_names()"
- name: "$missing_datasets"
  expression: "minus($define_datasets, subtract=$study_datasets)"
Check:
  expression: >-
    not contains_all($study_datasets, $define_datasets)
Outcome:
  Message: "A domain referenced in the Define-XML is not present in the study."
Source:
  FDA_Validator_Rule_Message: "Domain referenced in define.xml but dataset is missing"
  FDA_Validator_Rule_Description: "Domains referenced in data definition document\
    \ (define.xml) should be included in the submission."
  Domains: "ALL"
