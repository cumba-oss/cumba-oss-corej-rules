Core:
  Id: "FDA-SD1238"
  Status: "Published"
  Version: "1"
Description: "Raise an error when --RFTDTC is populated but --TPTREF is not populated,\
  \ since --RFTDTC is the fixed reference time point defined by --TPTREF."
Executability: "Partially Executable - Possible Underreporting"
Scope:
  Domains:
    Include:
    - "ALL"
Requirements:
  Variables:
    All:
    - "--RFTDTC"
    - "--TPTREF"
Check:
  expression: >-
    not empty(--RFTDTC) and empty(--TPTREF)
Outcome:
  Message: "--RFTDTC is populated when --TPTREF is not populated."
Source:
  FDA_Validator_Rule_Message: "--RFTDTC is populated when --TPTREF is not populated"
  FDA_Validator_Rule_Description: "--RFTDTC is defined as the Date/time for a fixed\
    \ reference time point defined by --TPTREF, therefore --RFTDTC should only be\
    \ populated when --TPTREF is populated."
  Domains: "ALL"
