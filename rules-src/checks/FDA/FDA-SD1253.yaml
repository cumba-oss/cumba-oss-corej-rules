Core:
  Id: "FDA-SD1253"
  Status: "Published"
  Version: "1"
Description: "Raise an error when a record is present in the DD domain but DTHFL in\
  \ the DM dataset does not equal 'Y' for the corresponding subject."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "DM"
Requirements:
  Variables:
    All:
    - "DTHFL"
    - "USUBJID"
Bindings:
- name: "$usubjids_in_dd"
  expression: "distinct(USUBJID, domain=\"DD\")"
Check:
  expression: >-
    DTHFL != "Y" and USUBJID in $usubjids_in_dd
Outcome:
  Message: "DTHFL does not equal 'Y' when a record is present in the DD domain for\
    \ the subject."
Source:
  FDA_Validator_Rule_Message: "DTHFL does not equal 'Y' when DD record is present"
  FDA_Validator_Rule_Description: "DTHFL must equal 'Y' when there is a record in\
    \ the Death Details (DD) domain."
  Domains: "DD"
Standards:
- Organization: "FDA"
  Standards:
  - Name: "SDTMIG"
    Version: "3.4"
    References:
    - Origin: "FDA Validator Rules"
      Rule_Identifier:
