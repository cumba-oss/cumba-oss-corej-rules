Core:
  Id: "FDA-SD2216"
  Status: "Published"
  Version: "1"
Description: "Raise an error when ADDON is 'Y' and the Trial Summary (TS) dataset\
  \ does not contain a record where TSPARMCD equals 'CURTRT' (Current Therapy or Treatment)."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "TS"
Bindings:
- name: "$addon_y_count"
  expression: "record_count(filter=filter(TSPARMCD=\"ADDON\", TSVAL=\"Y\"))"
- name: "$curtrt_count"
  expression: "record_count(filter=filter(TSPARMCD=\"CURTRT\"))"
Check:
  expression: >-
    $addon_y_count >= 1 and $curtrt_count == 0
Outcome:
  Message: "Missing CURTRT Trial Summary Parameter: a 'Current Therapy or Treatment'\
    \ (CURTRT) record must be present in the Trial Summary (TS) domain."
  Output_Variables:
  - "$curtrt_count"
Source:
  FDA_Validator_Rule_Message: "Missing CURTRT Trial Summary Parameter"
  FDA_Validator_Rule_Description: "'Current Therapy or Treatment' (CURTRT) record\
    \ must be populated in Trial Summary (TS) domain, when ADDON is 'Y'. It is expected\
    \ for SDTM IG v3.1.2 data and required for data in all more recent SDTM versions."
  Domains: "TS"
