Core:
  Id: "FDA-SE2216"
  Status: "Published"
  Version: "1"
Description: "Raise an error when the Trial Summary (TS) dataset does not contain\
  \ a record where TSPARMCD equals 'STDIR' (Study Director)."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "TS"
Bindings:
- name: "$stdir_count"
  expression: "record_count(filter=filter(TSPARMCD=\"STDIR\"))"
Check:
  expression: >-
    $stdir_count == 0
Outcome:
  Message: "Missing STDIR Trial Summary Parameter: a 'Study Director' (STDIR) record\
    \ must be present in the Trial Summary (TS) domain."
  Output_Variables:
  - "$stdir_count"
Source:
  FDA_Validator_Rule_Message: "Missing STDIR Trial Summary Parameter"
  FDA_Validator_Rule_Description: "'Study Director' (STDIR) record should be populated\
    \ in Trial Summary (TS) domain."
  Domains: "TS"
