Core:
  Id: "FDA-SE0063"
  Status: "Published"
  Version: "1"
Description: "Raise an error when the label of a variable defined in the SEND IG does\
  \ not match the variable label given in the Implementation Guide library metadata."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "ALL"
Check:
  expression: >-
    equalsIgnoreCase(varname(), var_name("LIBRARY")) and not empty(var_label("LIBRARY")) and
    var_label() != var_label("LIBRARY")
Outcome:
  Message: "The variable label in the dataset does not match the variable label described\
    \ in the SEND IG."
Source:
  FDA_Validator_Rule_Message: "SEND/dataset variable label mismatch"
  FDA_Validator_Rule_Description: "Variable Label in the dataset should match the\
    \ variable label described in SEND IG. When creating a new domain Variable Labels\
    \ could be adjusted as appropriate to properly convey the meaning in the context\
    \ of the data being submitted."
  Domains: "ALL"
Standards:
- Organization: "FDA"
  Standards:
  - Name: "SENDIG"
    Version: "3.1.1"
    References:
    - Origin: "FDA Validator Rules"
      Rule_Identifier:
        Id: "SE0063"
        Version: "1"
      Version: "1.6"
  - Name: "SENDIG"
    Version: "3.1"
