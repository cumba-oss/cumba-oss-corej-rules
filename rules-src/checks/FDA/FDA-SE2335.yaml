Core:
  Id: "FDA-SE2335"
  Status: "Published"
  Version: "1"
Description: "Raise an error when the Trial Summary (TS) dataset does not contain\
  \ a record where TSPARMCD equals 'TRTUNII' (Primary Treatment Unique Ingredient\
  \ ID)."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "TS"
Operations:
- id: "$trtunii_count"
  expression: "record_count(filter=filter(TSPARMCD=\"TRTUNII\"))"
Check:
  expression: >-
    $trtunii_count == 0
Outcome:
  Message: "Missing TRTUNII Trial Summary Parameter: a 'Primary Treatment Unique Ingredient\
    \ ID' (TRTUNII) record must be present in the Trial Summary (TS) domain."
  Output_Variables:
  - "$trtunii_count"
Source:
  FDA_Validator_Rule_Message: "Missing TRTUNII Trial Summary Parameter"
  FDA_Validator_Rule_Description: "'Primary Treatment Unique Ingredient ID' (TRTUNII)\
    \ record must be populated in Trial Summary (TS) domain."
  Domains: "TS"
