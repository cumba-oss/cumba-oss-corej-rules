Core:
  Id: "FDA-SD2247"
  Status: "Published"
  Version: "1"
Description: "Raise an error when, for a record where TSPARMCD equals 'SSTDTC' (Study\
  \ Start Date), TSVAL is neither a valid ISO 8601 date/time nor an SDTM masked date,\
  \ in which an unknown component is written as a hyphen placeholder."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "TS"
Requirements:
  Variables:
    All:
    - "TSPARMCD"
Check:
  expression: >-
    TSPARMCD == "SSTDTC" and invalid_date(TSVAL)
Outcome:
  Message: "Invalid TSVAL value for SSTDTC: TSVAL must be a valid ISO 8601 date/time\
    \ or an SDTM masked date when TSPARMCD equals 'SSTDTC' (Study Start Date)."
Source:
  FDA_Validator_Rule_Message: "Invalid TSVAL value for SSTDTC"
  FDA_Validator_Rule_Description: "TSVAL variable value must be in ISO 8601 format,\
    \ when TSPARMCD='SSTDTC'."
  Domains: "TS"
