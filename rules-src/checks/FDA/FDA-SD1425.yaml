Core:
  Id: "FDA-SD1425"
  Status: "Published"
  Version: "1"
Description: "Raise an error when the Challenge Agent Characterization (AC) dataset\
  \ contains a record where ACPARMCD equals 'CAGTCAT' and ACVAL equals 'CHEMICAL',\
  \ but does not contain a record where ACPARMCD equals 'CHAGNAM' (Chemical Agent\
  \ Name)."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "AC"
Bindings:
- name: "$cat_count"
  expression: "record_count(filter=(ACPARMCD == \"CAGTCAT\" and ACVAL == \"CHEMICAL\"\
    ))"
- name: "$parm_count"
  expression: "record_count(filter=(ACPARMCD == \"CHAGNAM\"))"
Check:
  expression: >-
    $cat_count >= 1 and $parm_count < 1
Outcome:
  Message: "A 'Chemical Agent Name' (CHAGNAM) record is not present in the AC domain\
    \ when a record exists with ACPARMCD equal to 'CAGTCAT' and ACVAL equal to 'CHEMICAL'."
Source:
  FDA_Validator_Rule_Message: "Missing CHAGNAM Challenge Agent Parameter when ACPARMCD\
    \ = 'CAGTCAT' and ACVAL = 'CHEMICAL'"
  FDA_Validator_Rule_Description: "'Chemical Agent Name' (CHAGNAM) record is expected\
    \ in the Challenge Agent Characterization (AC) domain when the Parameter Value\
    \ (ACVAL) for the 'Challenge Agent Category' (CAGTCAT) parameter is 'CHEMICAL'."
  Domains: "AC"
Standards:
- Organization: "FDA"
  Standards:
  - Name: "SENDIG-AR"
    Version: "1.0"
    References:
    - Origin: "FDA Validator Rules"
      Rule_Identifier:
        Id: "SD1425"
        Version: "1"
      Version: "1.6"
