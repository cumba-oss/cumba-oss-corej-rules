Core:
  Id: "FDA-SD1094"
  Status: "Published"
  Version: "1"
Description: "Raise an error when the populated Study Day of End of Observation (--ENDY)\
  \ does not equal the study day computed from --ENDTC and DM.RFSTDTC: the date part\
  \ of --ENDTC minus the date part of DM.RFSTDTC, plus one when --ENDTC is on or after\
  \ DM.RFSTDTC, otherwise the plain difference (no day zero)."
Executability: "Fully Executable"
Scope:
  Classes:
    Include:
    - "INTERVENTIONS"
    - "EVENTS"
    - "FINDINGS"
    - "FINDINGS ABOUT"
    - "SPECIAL PURPOSE"
  Domains:
    Exclude:
    - "CO"
    - "DM"
Requirements:
  Variables:
    All:
    - "--ENDTC"
    - "--ENDY"
    - "STUDYID"
    - "USUBJID"
    All_Or_None:
    - - "STUDYID"
      - "DM.STUDYID"
    - - "USUBJID"
      - "DM.USUBJID"
Match_Datasets:
- Keys:
  - "STUDYID"
  - "USUBJID"
  Cardinality: "n:1"
  Name: "DM"
Bindings:
- name: "$val_endy"
  expression: "dy(--ENDTC, DM.RFSTDTC)"
Check:
  expression: >-
    not empty(--ENDY) and is_complete_date(--ENDTC) and is_complete_date(DM.RFSTDTC) and --ENDY !=
    $val_endy
Outcome:
  Message: "--ENDY does not equal the study day computed from --ENDTC and DM.RFSTDTC."
Source:
  FDA_Validator_Rule_Message: "Incorrect value for --ENDY variable"
  FDA_Validator_Rule_Description: "Study Day of End (--ENDY) variable value should\
    \ be populated as defined by CDISC standards: --ENDY = (date portion of --ENDTC)\
    \ - (date portion of RFSTDTC) +1 if --ENDTC is on or after RFSTDTC; --ENDY = (date\
    \ portion of --ENDTC) - (date portion of RFSTDTC) if --ENDTC precedes RFSTDTC."
  Domains: "SE, SM, SV, INTERVENTIONS, EVENTS, FINDINGS, FINDINGS ABOUT"
