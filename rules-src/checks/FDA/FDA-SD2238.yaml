Core:
  Id: "FDA-SD2238"
  Status: "Published"
  Version: "1"
Description: "Raise an error when --STTPT does not have the same value across records\
  \ with the same values of USUBJID and --STDTC."
Executability: "Fully Executable"
Scope:
  Classes:
    Include:
    - "INTERVENTIONS"
    - "EVENTS"
Requirements:
  Variables:
    All:
    - "--STTPT"
    - "--STDTC"
Check:
  expression: >-
    var_exists("USUBJID") and is_inconsistent_across_dataset(--STTPT, keys=[USUBJID, --STDTC])
Outcome:
  Message: "Inconsistent value for --STTPT within USUBJID and --STDTC"
Source:
  FDA_Validator_Rule_Message: "Inconsistent value for --STTPT"
  FDA_Validator_Rule_Description: "Start Reference Time Point (--STTPT) value must\
    \ be consistent for all records with same Subject (USUBJID) and Start Date/Time\
    \ (--STDTC) values."
  Domains: "INTERVENTIONS, EVENTS"
