Core:
  Id: "FDA-SD2257"
  Status: "Published"
  Version: "1"
Description: "Raise an error when the Parameter Value (TSVAL) for an INDIC trial-summary\
  \ parameter is not a valid SNOMED CT term."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "TS"
Requirements:
  Variables:
    All:
    - "TSPARMCD"
Bindings:
- name: "$indic_term_valid"
  expression: "valid_external_dictionary_value(TSVAL, external_dictionary_type=\"\
    snomed\", dictionary_term_type=\"SNOMED\")"
Check:
  expression: >-
    TSPARMCD == "INDIC" and $indic_term_valid == false
Outcome:
  Message: "TSVAL is not a valid SNOMED CT term for the INDIC parameter."
  Output_Variables:
  - "TSPARMCD"
  - "TSVAL"
Source:
  FDA_Validator_Rule_Message: "Invalid TSVAL value for INDIC"
  FDA_Validator_Rule_Description: "TSVAL for INDIC record must be a valid term from\
    \ SNOMED CT."
  Domains: "TS"
