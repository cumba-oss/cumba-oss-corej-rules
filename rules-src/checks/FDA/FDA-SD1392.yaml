Core:
  Id: "FDA-SD1392"
  Status: "Published"
  Version: "1"
Description: "Raise an error when End Day of Obs Rel to Challenge Agent (--CHENDY)\
  \ is populated but the date portion of End Date/Time of Observation (--ENDTC) or\
  \ of Date/Time of First Challenge Agent Admin (RFCSTDTC) is not a complete date,\
  \ i.e. empty, invalid, or only partially specified, indicating the study day value\
  \ was imputed."
Executability: "Fully Executable"
Scope:
  Classes:
    Include:
    - "INTERVENTIONS"
    - "EVENTS"
    - "FINDINGS"
    - "FINDINGS ABOUT"
Requirements:
  Variables:
    All:
    - "--CHENDY"
    - "STUDYID"
    - "USUBJID"
    All_Or_None:
    - - "STUDYID"
      - "DM.STUDYID"
    - - "USUBJID"
      - "DM.USUBJID"
Match_Datasets:
- Keys:
  - "STUDYID"
  - "USUBJID"
  Cardinality: "n:1"
  Name: "DM"
Check:
  expression: >-
    not empty(--CHENDY) and (not var_exists("--ENDTC") or not is_complete_date_part(--ENDTC) or not
    is_complete_date_part(DM.RFCSTDTC))
Outcome:
  Message: "End Day of Obs Rel to Challenge Agent (--CHENDY) is populated but --ENDTC\
    \ and/or RFCSTDTC is empty or an incomplete date; the value appears imputed."
Source:
  FDA_Validator_Rule_Message: "--CHENDY variable value is imputed"
  FDA_Validator_Rule_Description: "End Day of Obs Rel to Challenge Agent (--CHENDY)\
    \ variable value should not be imputed. It may only be populated, when both End\
    \ Date/Time of Observation (--ENDTC) and Date/Time of First Challenge Agent Admin\
    \ (RFCSTDTC) variables values are provided and both of them include complete date\
    \ parts."
  Domains: "INTERVENTIONS, FINDINGS, EVENTS, FINDINGS ABOUT"
Standards:
- Organization: "FDA"
  Standards:
  - Name: "SENDIG-AR"
    Version: "1.0"
    References:
    - Origin: "FDA Validator Rules"
      Rule_Identifier:
        Id: "SD1392"
        Version: "1"
      Version: "1.6"
