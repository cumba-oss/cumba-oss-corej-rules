      Rule_Identifier:
        Id: "SD1262"
        Version: "1"
      Version: "1.6"
  - Name: "SDTMIG"
    Version: "3.2"
    References:
    - Origin: "FDA Validator Rules"
      Rule_Identifier:
        Id: "SD1262"
        Version: "1"
      Version: "1.6"
