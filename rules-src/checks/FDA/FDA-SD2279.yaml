Core:
  Id: "FDA-SD2279"
  Status: "Published"
  Version: "1"
Description: "Raise an error when the Trial Summary (TS) dataset does not contain\
  \ a record where TSPARMCD equals 'RDIND' (Rare Disease Indicator)."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "TS"
Bindings:
- name: "$rdind_count"
  expression: "record_count(filter=(TSPARMCD == \"RDIND\"))"
Check:
  expression: >-
    $rdind_count == 0
Outcome:
  Message: "Missing RDIND Trial Summary Parameter: a 'Rare Disease Indicator' (RDIND)\
    \ record must be present in the Trial Summary (TS) domain."
Source:
  FDA_Validator_Rule_Message: "Missing RDIND Trial Summary Parameter"
  FDA_Validator_Rule_Description: "'Rare Disease Indicator' (RDIND) record must be\
    \ populated in Trial Summary (TS) domain. It is an 'FDA Desired' parameter listed\
    \ in the Technical Conformance Guide (TCG)."
  Domains: "TS"
