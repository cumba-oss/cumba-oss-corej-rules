Core:
  Id: "FDA-SD1073"
  Status: "Published"
  Version: "1"
Description: "Raise an error for each of the IG-prohibited qualifiers AEOCCUR, AESTAT\
  \ and AEREASND that is present in the AE dataset."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "AE"
Check:
  expression: >-
    varname() in ["AEOCCUR", "AESTAT", "AEREASND"]
Outcome:
  Message: "The variable is prohibited in the AE dataset: AEOCCUR, AESTAT and AEREASND\
    \ are IG-prohibited qualifiers."
  Output_Variables:
  - "variable_name"
Source:
  FDA_Validator_Rule_Message: "Variable prohibited for use in SDTM"
  FDA_Validator_Rule_Description: "Variables described in IG as inappropriate for\
    \ usage must be not included in the dataset."
  Domains: "ALL"
