Core:
  Id: "FDA-CT2003"
  Status: "Published"
  Version: "1"
Description: "Raise an error when a coded value and its paired decoded value do not\
  \ map to the same term (Codelist Code) of the CDISC controlled terminology codelist\
  \ the CDISC Library defines for the variable. Paired variables such as --TESTCD/--TEST\
  \ must be populated with terms that share the same Codelist Code."
Executability: "Partially Executable"
Scope:
  Domains:
    Include:
    - "ALL"
Check:
  expression: >-
    not empty(value()) and library_variable_code_pair_matches(variable_name) == false
Outcome:
  Message: "The coded value and its decode do not map to the same term of the CDISC\
    \ controlled terminology codelist the CDISC Library defines for the paired variables."
  Output_Variables:
  - "variable_value"
Source:
  FDA_Validator_Rule_Message: "Coded and Decoded values do not have the same Code\
    \ in CDISC CT"
  FDA_Validator_Rule_Description: "Paired variables such as TEST/TESTCD must be populated\
    \ using terms with the same Codelist Code value in CDISC control terminology.\
    \ There is one-to-one relationship between paired variable values defined in CDISC\
    \ control terminology by Codelist Code value."
  Domains: "ALL"
