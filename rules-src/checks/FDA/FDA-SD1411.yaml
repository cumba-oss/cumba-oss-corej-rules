Core:
  Id: "FDA-SD1411"
  Status: "Published"
  Version: "1"
Description: "Raise an error when the Challenge Agent Characterization (AC) dataset\
  \ contains a record where ACPARMCD equals 'CAGTCAT' and ACVAL equals 'BIOLOGICAL',\
  \ but does not contain a record where ACPARMCD equals 'BAMTIDCD' (Biological Agent\
  \ Material Ident Code)."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "AC"
Bindings:
- name: "$cat_count"
  expression: "record_count(filter=(ACPARMCD == \"CAGTCAT\" and ACVAL == \"BIOLOGICAL\"\
    ))"
- name: "$parm_count"
  expression: "record_count(filter=(ACPARMCD == \"BAMTIDCD\"))"
Check:
  expression: >-
    $cat_count >= 1 and $parm_count < 1
Outcome:
  Message: "A 'Biological Agent Material Ident Code' (BAMTIDCD) record is not present\
    \ in the AC domain when a record exists with ACPARMCD equal to 'CAGTCAT' and ACVAL\
    \ equal to 'BIOLOGICAL'."
  Output_Variables:
  - "$cat_count"
  - "$parm_count"
Source:
  FDA_Validator_Rule_Message: "Missing BAMTIDCD Challenge Agent Parameter when ACPARMCD\
    \ = 'CAGTCAT' and ACVAL = 'BIOLOGICAL'"
  FDA_Validator_Rule_Description: "'Biological Agent Material Ident Code' (BAMTIDCD)\
    \ record is expected in the Challenge Agent Characterization (AC) domain when\
    \ the Parameter Value (ACVAL) for the 'Challenge Agent Category' (CAGTCAT) parameter\
    \ is 'BIOLOGICAL'."
  Domains: "AC"
Standards:
- Organization: "FDA"
  Standards:
  - Name: "SENDIG-AR"
    Version: "1.0"
    References:
    - Origin: "FDA Validator Rules"
      Rule_Identifier:
        Id: "SD1411"
        Version: "1"
      Version: "1.6"
