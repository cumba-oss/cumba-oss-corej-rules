Core:
  Id: "FDA-SD0042"
  Status: "Published"
  Version: "1"
Description: "Raise an error when --PRESP is equal to 'Y' and --OCCUR is empty but\
  \ --STAT is not equal to 'NOT DONE'."
Executability: "Fully Executable"
Scope:
  Classes:
    Include:
    - "EVENTS"
    - "INTERVENTIONS"
Requirements:
  Variables:
    All:
    - "--PRESP"
    - "--OCCUR"
    - "--STAT"
Check:
  expression: >-
    --PRESP == "Y" and empty(--OCCUR) and --STAT != "NOT DONE"
Outcome:
  Message: "--STAT does not equal 'NOT DONE' when --PRESP equals 'Y' and --OCCUR is\
    \ empty."
  Output_Variables:
  - "!--OCCUR"
Source:
  FDA_Validator_Rule_Message: "--STAT does not equal 'NOT DONE', when --PRESP='Y'\
    \ and --OCCUR is NULL"
  FDA_Validator_Rule_Description: "When no response is provided for Occurrence (--OCCUR)\
    \ for a pre-specified Intervention or Event (--PRESP = 'Y'), then Status (--STAT)\
    \ should be set to 'NOT DONE'."
  Domains: "INTERVENTIONS, EVENTS"
