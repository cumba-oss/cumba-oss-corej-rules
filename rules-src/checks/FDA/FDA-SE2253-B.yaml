Core:
  Id: "FDA-SE2253-B"
  Status: "Published"
  Version: "1"
Description: "Raise an error when the Rule for End of Repro Stage (TTENRL) variable\
  \ is not present in the Trial Repro Stages (TT) dataset and TTDUR is not populated;\
  \ with no TTENRL column, TTDUR must be populated for each Repro Stage."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "TT"
Requirements:
  Variables:
    None:
    - "TTENRL"
    All:
    - "TTDUR"
Check:
  expression: >-
    empty(TTDUR)
Outcome:
  Message: "TTENRL is not present in the dataset and TTDUR is not populated."
  Message_Folded: "TTDUR not populated in any record of the dataset: TTENRL is not\
    \ present in the dataset and TTDUR is not populated."
Source_Proposed:
  Sheet_Issue: "#215"
  FDA_Validator_Rule_Message: "Missing values for TTENRL and TTDUR"
  FDA_Validator_Rule_Description: "Planned Duration of Repro Stage (TTDUR) should\
    \ be populated when the Rule for End of Repro Stage (TTENRL) variable is not present\
    \ in the dataset."
  Domains: "TT"
Source:
  FDA_Validator_Rule_Message: "Missing values for TTENRL and TTDUR"
  FDA_Validator_Rule_Description: "At least one of Rule for End of Repro Stage (TTENRL)\
    \ or Planned Duration of Repro Stage (TTDUR) should be populated."
  Domains: "TT"
Standards:
- Organization: "FDA"
  Standards:
  - Name: "SENDIG-DART"
    Version: "1.1"
    References:
    - Origin: "FDA Validator Rules"
      Rule_Identifier:
        Id: "SE2253"
        Version: "1"
      Version: "1.6"
