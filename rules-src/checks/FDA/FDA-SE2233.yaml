Core:
  Id: "FDA-SE2233"
  Status: "Published"
  Version: "1"
Description: "Raise an error when Result Category (--RESCAT) is populated but --STRESC\
  \ is empty or equal to 'NORMAL' or 'UNREMARKABLE'."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "MI"
Requirements:
  Variables:
    All:
    - "--RESCAT"
Check:
  expression: >-
    not empty(--RESCAT) and (empty(--STRESC) or var_exists("--STRESC") and --STRESC in ["NORMAL",
    "UNREMARKABLE"])
Outcome:
  Message: "--RESCAT is populated when --STRESC is empty or equal to 'NORMAL' or 'UNREMARKABLE'."
Source:
  FDA_Validator_Rule_Message: "--RESCAT should not be populated, when --STRESC is\
    \ 'NORMAL', 'UNREMARKABLE', or NULL (--STAT = 'NOT DONE')"
  FDA_Validator_Rule_Description: "Result Category (--RESCAT) should not be populated\
    \ when Result or Finding in Standard Format (--STRESC) is 'NORMAL', 'UNREMARKABLE'\
    \  or missing (Completion Status (--STAT) = 'NOT DONE')."
  Domains: "MI"
