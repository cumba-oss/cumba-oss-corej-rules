Core:
  Id: "FDA-SE1151"
  Status: "Published"
  Version: "1"
Description: "Raise an error when End Date/Time of Treatment (EXENDTC) is populated\
  \ and is later than the Experimental End Date (EXPENDTC)."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "EX"
Requirements:
  Variables:
    All:
    - "EXENDTC"
Bindings:
- name: "$exp_end"
  expression: "read_value(TSVAL, domain=TS, filter=(TSPARMCD==\"EXPENDTC\"), mode=\"\
    FIRST\")"
Check:
  expression: >-
    not empty(EXENDTC) and not empty($exp_end) and date(EXENDTC) > date($exp_end)
Outcome:
  Message: "EXENDTC is populated and is later than the Experimental End Date (TS EXPENDTC)."
  Output_Variables:
  - "EXENDTC"
  - "$exp_end"
Source:
  FDA_Validator_Rule_Message: "EXENDTC date is after EXPENDTC in TS domain"
  FDA_Validator_Rule_Description: "End Date/Time of Treatment (EXENDTC) variable value\
    \ must be less than or equal to Date/Time of Experimental End Date (EXPENDTC)\
    \ in Trial Summary (TS) domain."
  Domains: "INTERVENTIONS"
