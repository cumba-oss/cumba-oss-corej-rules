Core:
  Id: "FDA-SD1240"
  Status: "Published"
  Version: "1"
Description: "Raise an error when a DM subject has no Informed Consent record (DSDECOD\
  \ equals 'INFORMED CONSENT OBTAINED') in the Disposition (DS) domain."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "DM"
Bindings:
- name: "$ds_ic_usubjid"
  expression: "distinct(USUBJID, domain=\"DS\", filter=filter(DSDECOD=\"INFORMED CONSENT\
    \ OBTAINED\"))"
Check:
  expression: >-
    USUBJID not in $ds_ic_usubjid
Outcome:
  Message: "No Informed Consent Obtained record is present in the DS domain for the\
    \ subject."
  Output_Variables:
  - "$ds_ic_usubjid"
Source:
  FDA_Validator_Rule_Message: "No Informed Consent Obtained record in DS domain for\
    \ subject"
  FDA_Validator_Rule_Description: "All subjects should have an Informed Consent record\
    \ in the Disposition domain."
  Domains: "DM"
