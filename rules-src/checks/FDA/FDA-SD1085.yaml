Core:
  Id: "FDA-SD1085"
  Status: "Published"
  Version: "1"
Description: "Raise an error when Collection Study Day (--DY) is populated but the\
  \ date portion of Collection Study Date/Time (--DTC) or Subject Reference Start\
  \ Date/Time (RFSTDTC) is not a complete date, i.e. empty, invalid, or only partially\
  \ specified."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "ALL"
Requirements:
  Variables:
    All:
    - "--DY"
    - "USUBJID"
    All_Or_None:
    - - "USUBJID"
      - "DM.USUBJID"
Match_Datasets:
- Keys:
  - "USUBJID"
  Name: "DM"
Check:
  expression: >-
    (var_exists("--DTC") and not is_complete_date_part(--DTC) or not
    is_complete_date_part(DM.RFSTDTC)) and not empty(--DY)
Outcome:
  Message: "--DY is populated when the date portion of --DTC or RFSTDTC is incomplete."
  Output_Variables:
  - "--DTC"
  - "--DY"
  - "DM.RFSTDTC"
Source:
  FDA_Validator_Rule_Message: "--DY variable value is imputed"
  FDA_Validator_Rule_Description: "Collection Study Day (--DY) variable value should\
    \ not be imputed. It may be only populated, when both Collection Study Date/Time\
    \ (--DTC) and Subject Reference Start Date/Time (RFSTDTC) variables values are\
    \ provided and both of them include complete date part."
  Domains: "CO, DI, DM, DR, SE, SM, SV, INTERVENTIONS, EVENTS, FINDINGS, FINDINGS\
    \ ABOUT"
