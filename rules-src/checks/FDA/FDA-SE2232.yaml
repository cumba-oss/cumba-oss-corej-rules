Core:
  Id: "FDA-SE2232"
  Status: "Published"
  Version: "1"
Description: "Raise an error when TXVAL for a TXPARMCD equal to 'ARMCD' (a Planned\
  \ Arm Code) does not match an ARMCD value in the Trial Arms (TA) dataset."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "TX"
Requirements:
  Variables:
    All:
    - "TXPARMCD"
Bindings:
- name: "$ta_armcd"
  expression: "distinct(ARMCD, domain=\"TA\")"
Check:
  expression: >-
    TXPARMCD == "ARMCD" and not empty(TXVAL) and TXVAL not in $ta_armcd
Outcome:
  Message: "TXVAL (TXPARMCD equal to 'ARMCD') does not match an ARMCD value in the\
    \ Trial Arms (TA) dataset."
  Output_Variables:
  - "TXPARMCD"
  - "TXVAL"
  - "$ta_armcd"
Source:
  FDA_Validator_Rule_Message: "Invalid TXVAL for ARMCD"
  FDA_Validator_Rule_Description: "Planned Arm Code (ARMCD) values in TXVAL (TXPARMCD\
    \ = 'ARMCD') should match entries in the Trial Arms (TA) dataset."
  Domains: "TX"
Standards:
- Organization: "FDA"
