Core:
  Id: "FDA-SD2016"
  Status: "Published"
  Version: "1"
Description: "Raise an error when a System Organ Class Code (--SOCCD) value is not\
  \ a valid System Organ Class code in the MedDRA dictionary."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "AE"
    - "CE"
    - "MH"
Requirements:
  Variables:
    All:
    - "--SOCCD"
Bindings:
- name: "$soccd_valid"
  expression: "valid_external_dictionary_code(--SOCCD, external_dictionary_type=\"\
    meddra\", dictionary_term_type=\"SOCCD\")"
Check:
  expression: >-
    $soccd_valid == false
Outcome:
  Message: "System Organ Class Code (--SOCCD) is not a valid MedDRA System Organ Class\
    \ code."
  Output_Variables:
  - "--SOCCD"
Source:
  FDA_Validator_Rule_Message: "Value for --SOCCD not found in MedDRA dictionary"
  FDA_Validator_Rule_Description: "Value for System Organ Class Code (--SOCCD) variable\
    \ must be populated using a System Organ Class Code of the MedDRA dictionary of\
    \ a version specified in the define.xml."
  Domains: "AE, CE, MH"
Standards:
- Organization: "FDA"
  Standards:
  - Name: "SDTMIG"
    Version: "3.4"
    References:
    - Origin: "FDA Validator Rules"
      Rule_Identifier:
