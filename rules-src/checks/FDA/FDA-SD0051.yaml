Core:
  Id: "FDA-SD0051"
  Status: "Published"
  Version: "1"
Description: "Raise an error when VISIT does not have the same value across all records\
  \ that share the same value of VISITNUM."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "ALL"
Requirements:
  Variables:
    All:
    - "VISIT"
Check:
  expression: >-
    var_exists("VISITNUM") and is_inconsistent_across_dataset(VISIT, keys=[VISITNUM])
Outcome:
  Message: "VISIT is not the same value across records with the same value of VISITNUM."
Source:
  FDA_Validator_Rule_Message: "Inconsistent value for VISIT within VISITNUM"
  FDA_Validator_Rule_Description: "All values of Visit Name (VISIT) should be the\
    \ same for a given value of Visit Number (VISITNUM)."
  Domains: "CO, SV, INTERVENTIONS, EVENTS, FINDINGS, FINDINGS ABOUT, TV"
