Core:
  Id: "FDA-SD0052"
  Status: "Published"
  Version: "1"
Description: "Raise an error when VISITNUM does not have the same value across all\
  \ records that share the same value of VISIT."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "ALL"
Requirements:
  Variables:
    All:
    - "VISITNUM"
Check:
  expression: >-
    var_exists("VISIT") and is_inconsistent_across_dataset(VISITNUM, keys=[VISIT])
Outcome:
  Message: "VISITNUM is not the same value across records with the same value of VISIT."
Source:
  FDA_Validator_Rule_Message: "Inconsistent value for VISITNUM within VISIT"
  FDA_Validator_Rule_Description: "All values of Visit Number (VISITNUM) should be\
    \ the same for a given value of Visit Name (VISIT)."
  Domains: "CO, SV, INTERVENTIONS, EVENTS, FINDINGS, FINDINGS ABOUT, TV"
