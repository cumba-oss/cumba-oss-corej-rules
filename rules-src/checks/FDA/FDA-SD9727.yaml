Core:
  Id: "FDA-SD9727"
  Status: "Published"
  Version: "1"
Description: "Raise an error when none of the subject identifier variables Unique\
  \ Subject Identifier (USUBJID), Associated Persons Identifier (APID), Sponsor Device\
  \ Identifier (SPDEVID) and Pool Identifier (POOLID) is present in the dataset."
Executability: "Fully Executable"
Scope:
  Classes:
    Include:
    - "EVENTS"
    - "INTERVENTIONS"
    - "FINDINGS"
    - "FINDINGS ABOUT"
    - "SPECIAL PURPOSE"
    - "RELATIONSHIP"
  Domains:
    Exclude:
    - "RELREC"
    - "DM"
    - "SE"
    - "SM"
Check:
  expression: >-
    not var_exists("USUBJID") and not var_exists("APID") and not var_exists("SPDEVID") and not
    var_exists("POOLID")
Outcome:
  Message: "None of USUBJID, APID, SPDEVID and POOLID is present in the dataset."
Source_Proposed:
  Sheet_Issue: "#203"
  FDA_Validator_Rule_Message: "No subject identifier variable is present in the dataset"
  FDA_Validator_Rule_Description: "At least one of the subject identifier variables\
    \ Unique Subject Identifier (USUBJID), Associated Persons Identifier (APID), Sponsor\
    \ Device Identifier (SPDEVID) or Pool Identifier (POOLID) must be present in the\
    \ dataset."
  Domains: "CO, SV, INTERVENTIONS, EVENTS, FINDINGS, FINDINGS ABOUT, RELSUB, SUPPQUAL"
Standards:
- Organization: "FDA"
  Standards:
  - Name: "SDTMIG"
    Version: "3.4"
  - Name: "SDTMIG"
    Version: "3.3"
  - Name: "SDTMIG"
    Version: "3.2"
  - Name: "SDTMIG"
    Version: "3.1.3"
