Core:
  Id: "FDA-SD1361"
  Status: "Published"
  Version: "1"
Description: "Raise an error when Description of Planned Arm (ARM) is populated but\
  \ Planned Arm Code (ARMCD) is empty; both must be populated together."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "DM"
Requirements:
  Variables:
    All:
    - "ARMCD"
    - "ARM"
Check:
  expression: >-
    empty(ARMCD) and not empty(ARM)
Outcome:
  Message: "ARM is populated but ARMCD is empty."
  Message_Folded: "ARMCD not populated in any record of the dataset, and at least\
    \ one record meets the rest of the condition: ARM is populated but ARMCD is empty."
Source:
  FDA_Validator_Rule_Message: "ARM is populated, but ARMCD is null, or vice versa"
  FDA_Validator_Rule_Description: "Description of Planned Arm (ARM) must be populated,\
    \ when Planned Arm Code (ARMCD) is populated, and vice versa."
  Domains: "DM"
Standards:
- Organization: "FDA"
  Standards:
  - Name: "SDTMIG"
    Version: "3.4"
    References:
    - Origin: "FDA Validator Rules"
      Rule_Identifier:
        Id: "SD1361"
        Version: "1"
      Version: "1.6"
  - Name: "SDTMIG"
    Version: "3.3"
    References:
    - Origin: "FDA Validator Rules"
      Rule_Identifier:
        Id: "SD1361"
        Version: "1"
      Version: "1.6"
- Organization: "CDISC"
  Standards:
