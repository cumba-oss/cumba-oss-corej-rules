Core:
  Id: "FDA-SD1351"
  Status: "Published"
  Version: "1"
Description: "Raise an error when --ENINT (Planned End of Assessment Interval) is\
  \ populated but --STINT (Planned Start of Assessment Interval) is empty."
Executability: "Partially Executable - Possible Underreporting"
Scope:
  Domains:
    Include:
    - "PP"
Requirements:
  Variables:
    All:
    - "--ENINT"
    - "--STINT"
Check:
  expression: >-
    not empty(--ENINT) and empty(--STINT)
Outcome:
  Message: "Missing value for --STINT, when --ENINT is provided"
  Output_Variables:
  - "--TESTCD"
Source:
  FDA_Validator_Rule_Message: "Missing value for --STINT, when --ENINT is provided"
  FDA_Validator_Rule_Description: "Planned Start of Assessment Interval (--STINT)\
    \ should not be NULL, when Planned End of Assessment Interval (--ENINT) is populated."
  Domains: "PP"
