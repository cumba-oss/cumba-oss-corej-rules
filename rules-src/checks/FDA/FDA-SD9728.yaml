Core:
  Id: "FDA-SD9728"
  Status: "Published"
  Version: "1"
Description: "Raise an error when Related Domain Abbreviation (RDOMAIN) is not present\
  \ in the dataset although a record populates Identifying Variable (IDVAR) or Identifying\
  \ Variable Value (IDVARVAL)."
Sensitivity: "Dataset"
Executability: "Partially Executable - Possible Overreporting"
Scope:
  Domains:
    Include:
    - "CO"
Requirements:
  Variables:
    None:
    - "RDOMAIN"
    Any:
    - "IDVAR"
    - "IDVARVAL"
Check:
  expression: >-
    not empty(IDVAR) or not empty(IDVARVAL)
Outcome:
  Message: "RDOMAIN is not present in the dataset although IDVAR or IDVARVAL is populated."
  Output_Variables:
  - "IDVAR"
  - "IDVARVAL"
Source_Proposed:
  Sheet_Issue: "#206"
  FDA_Validator_Rule_Message: "The RDOMAIN variable is not present in the dataset\
    \ when IDVAR or IDVARVAL is populated"
  FDA_Validator_Rule_Description: "The Related Domain Abbreviation (RDOMAIN) variable\
    \ must be present in the dataset when the value of the Identifying Variable (IDVAR)\
    \ or Identifying Variable Value (IDVARVAL) variable is populated."
  Domains: "CO"
Standards:
- Organization: "FDA"
  Standards:
  - Name: "SDTMIG"
    Version: "3.4"
  - Name: "SDTMIG"
    Version: "3.3"
  - Name: "SDTMIG"
    Version: "3.2"
  - Name: "SDTMIG"
    Version: "3.1.3"
  - Name: "SDTMIG"
    Version: "3.1.2"
  - Name: "SENDIG"
    Version: "3.1.1"
  - Name: "SENDIG"
    Version: "3.1"
  - Name: "SENDIG"
    Version: "3.0"
  - Name: "SENDIG-AR"
    Version: "1.0"
  - Name: "SENDIG-DART"
    Version: "1.1"
