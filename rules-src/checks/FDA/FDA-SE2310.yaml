Core:
  Id: "FDA-SE2310"
  Status: "Published"
  Version: "1"
Description: "Raise an error when Standardized Result in Character Format (--STRESC)\
  \ is populated while Status (--STAT) equals 'NOT DONE'."
Executability: "Fully Executable"
Scope:
  Classes:
    Include:
    - "FINDINGS"
Requirements:
  Variables:
    All:
    - "--STAT"
Check:
  expression: >-
    not empty(--STRESC) and --STAT == "NOT DONE"
Outcome:
  Message: "--STRESC is populated when --STAT equals 'NOT DONE'."
Source:
  FDA_Validator_Rule_Message: "Value for --STRESC is populated, when --STAT is 'NOT\
    \ DONE'"
  FDA_Validator_Rule_Description: "Status (--STAT) should be NULL, when Standardized\
    \ Result in Character Format (--STRESC ) is provided."
  Domains: "FINDINGS"
