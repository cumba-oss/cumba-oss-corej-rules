Core:
  Id: "FDA-SD2012"
  Status: "Published"
  Version: "1"
Description: "Raise an error when a High Level Group Term (--HLGT) value is not a\
  \ valid High Level Group Term in the MedDRA dictionary."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "AE"
    - "CE"
    - "MH"
Requirements:
  Variables:
    All:
    - "--HLGT"
Bindings:
- name: "$hlgt_valid"
  expression: "valid_external_dictionary_value(--HLGT, external_dictionary_type=\"\
    meddra\", dictionary_term_type=\"HLGT\", case_sensitive=false)"
Check:
  expression: >-
    $hlgt_valid == false
Outcome:
  Message: "High Level Group Term (--HLGT) is not a valid MedDRA High Level Group\
    \ Term."
  Output_Variables:
  - "--HLGT"
Source:
  FDA_Validator_Rule_Message: "Value for --HLGT not found in MedDRA dictionary"
  FDA_Validator_Rule_Description: "Value for High Level Group Term (--HLGT) variable\
    \ must be populated using a High Level Group Term of the MedDRA dictionary of\
    \ a version specified in the define.xml (Case-insensitive)."
  Domains: "AE, CE, MH"
Standards:
- Organization: "FDA"
