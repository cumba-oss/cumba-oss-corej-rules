Core:
  Id: "FDA-SD1033"
  Status: "Published"
  Version: "1"
Description: "Raise an error when ARMCD is present and ARM is present and ARM does\
  \ not have the same value across records with the same value of ARMCD."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "DM"
    - "TA"
    - "TV"
Requirements:
  Variables:
    All:
    - "ARM"
Check:
  expression: >-
    var_exists("ARMCD") and is_inconsistent_across_dataset(ARM, keys=[ARMCD])
Outcome:
  Message: "Inconsistent value for ARM within ARMCD"
Source:
  FDA_Validator_Rule_Message: "Inconsistent value for ARM"
  FDA_Validator_Rule_Description: "A value for Description of Planned Arm (ARM) must\
    \ have a unique value for Planned Arm Code (ARMCD) with the domain."
  Domains: "DM, TA, TV"
