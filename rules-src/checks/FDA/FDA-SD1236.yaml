Core:
  Id: "FDA-SD1236"
  Status: "Published"
  Version: "1"
Description: "Raise an error when the value of Sequence Number (--SEQ) is not unique\
  \ within a domain for a given combination of Sponsor Device Identifier (SPDEVID)\
  \ and Unique Subject Identifier (USUBJID) values."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "DX"
    - "DO"
    - "DU"
    - "DE"
    - "DT"
Requirements:
  Variables:
    All:
    - "--SEQ"
Check:
  expression: >-
    not is_unique_set([--SEQ, DOMAIN, SPDEVID, USUBJID])
Outcome:
  Message: "--SEQ value is not unique within the domain for the combination of SPDEVID\
    \ and USUBJID."
Source:
  FDA_Validator_Rule_Message: "Duplicate value for --SEQ variable"
  FDA_Validator_Rule_Description: "The value of Sequence Number (--SEQ) variable must\
    \ be unique for each record within a domain and within each combination of Sponsor\
    \ Device Identifier (SPDEVID) and Unique Subject Identifier (USUBJID) variables'\
    \ values."
  Domains: "DX, DO, DU, DE, DT"
