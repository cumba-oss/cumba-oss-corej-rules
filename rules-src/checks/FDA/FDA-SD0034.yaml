Core:
  Id: "FDA-SD0034"
  Status: "Published"
  Version: "1"
Description: "Raise an error when --ELTM (Planned Elapsed Time from Time Point Reference)\
  \ is populated but --TPTREF (Time Point Reference) is empty."
Executability: "Partially Executable - Possible Underreporting"
Scope:
  Domains:
    Include:
    - "ALL"
Requirements:
  Variables:
    All:
    - "--ELTM"
    - "--TPTREF"
Check:
  expression: >-
    not empty(--ELTM) and empty(--TPTREF)
Outcome:
  Message: "--TPTREF is empty when --ELTM is populated."
Source:
  FDA_Validator_Rule_Message: "Missing value for --TPTREF, when --ELTM is provided"
  FDA_Validator_Rule_Description: "Time Point Reference (--TPTREF) should not be NULL,\
    \ when Planned Elapsed Time from Time Point Ref (--ELTM) is populated."
  Domains: "CO, INTERVENTIONS, EVENTS, FINDINGS, FINDINGS ABOUT"
