Core:
  Id: "FDA-SD1098"
  Status: "Published"
  Version: "1"
Description: "Raise an error when Subcategory (--SCAT) is populated but Category (--CAT)\
  \ is not populated."
Executability: "Partially Executable - Possible Underreporting"
Scope:
  Classes:
    Include:
    - "INTERVENTIONS"
    - "EVENTS"
    - "FINDINGS"
    - "FINDINGS ABOUT"
Requirements:
  Variables:
    All:
    - "--SCAT"
    - "--CAT"
Check:
  expression: >-
    not empty(--SCAT) and empty(--CAT)
Outcome:
  Message: "--CAT is not populated when --SCAT is populated."
Source:
  FDA_Validator_Rule_Message: "Missing --CAT value, when --SCAT value is populated"
  FDA_Validator_Rule_Description: "Value for Category (--CAT) variable should be populated,\
    \ when value for Subcategory (--SCAT) variable is populated."
  Domains: "INTERVENTIONS, EVENTS, FINDINGS, FINDINGS ABOUT"
