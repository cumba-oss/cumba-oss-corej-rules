Core:
  Id: "FDA-SD1268"
  Status: "Published"
  Version: "1"
Description: "Raise an error when TSVCDREF is not populated and TSVCDVER is populated."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "TS"
Check:
  expression: >-
    not empty(TSVCDVER) and empty(TSVCDREF)
Outcome:
  Message: "TSVCDREF is empty when TSVCDVER is populated."
  Message_Folded: "TSVCDREF absent or not populated in any record of the dataset,\
    \ and at least one record meets the rest of the condition: TSVCDREF is empty when\
    \ TSVCDVER is populated."
Source:
  FDA_Validator_Rule_Message: "TSVCDREF is null when TSVCDVER is populated"
  FDA_Validator_Rule_Description: "The Name of the Reference Terminology (TSVCDREF)\
    \ must be populated when the Version of the Reference Terminology (TSVCDVER) is\
    \ populated."
  Domains: "TS"
