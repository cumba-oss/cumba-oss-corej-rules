Core:
  Id: "FDA-SD2007"
  Status: "Published"
  Version: "1"
Description: "Raise an error when a Preferred Term Code (--PTCD) value is not a valid\
  \ Preferred Term code in the MedDRA dictionary."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "AE"
    - "CE"
    - "MH"
Requirements:
  Variables:
    All:
    - "--PTCD"
Bindings:
- name: "$ptcd_valid"
  expression: "valid_external_dictionary_code(--PTCD, external_dictionary_type=\"\
    meddra\", dictionary_term_type=\"PTCD\")"
Check:
  expression: >-
    $ptcd_valid == false
Outcome:
  Message: "Preferred Term Code (--PTCD) is not a valid MedDRA Preferred Term code."
Source:
  FDA_Validator_Rule_Message: "Value for --PTCD not found in MedDRA dictionary"
  FDA_Validator_Rule_Description: "Value for Preferred Term Code (--PTCD) variable\
    \ must be populated using a Preferred Term Code of the MedDRA dictionary of a\
    \ version specified in the define.xml."
  Domains: "AE, CE, MH"
