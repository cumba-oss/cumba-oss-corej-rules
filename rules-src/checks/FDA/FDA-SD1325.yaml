Core:
  Id: "FDA-SD1325"
  Status: "Published"
  Version: "1"
Description: "Raise an error when the dataset label in the submitted dataset does\
  \ not match the dataset description declared in the Define-XML."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "ALL"
Check:
  expression: >-
    not empty(ds_label("DEFINE")) and ds_label() != ds_label("DEFINE")
Outcome:
  Message: "The dataset label does not match the dataset description in the Define-XML."
Source:
  FDA_Validator_Rule_Message: "Define.xml/dataset description mismatch"
  FDA_Validator_Rule_Description: "Dataset Description in define.xml must match dataset\
    \ Description."
  Domains: "ALL"
