Core:
  Id: "FDA-SD0063A"
  Status: "Published"
  Version: "1"
Description: "Raise an error when the label of a standard variable does not match\
  \ the variable label specified for that variable in the SDTM Implementation Guide."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "ALL"
Check:
  expression: >-
    equalsIgnoreCase(varname(), var_name("LIBRARY")) and not empty(var_label("LIBRARY")) and
    var_label() != var_label("LIBRARY")
Outcome:
  Message: "The variable label does not match the variable label specified in the\
    \ SDTMIG."
Source:
  FDA_Validator_Rule_Message: "SDTM/dataset variable label mismatch"
  FDA_Validator_Rule_Description: "Variable Label in the dataset should match the\
    \ variable label described in SDTM IG. When creating a new domain Variable Labels\
    \ could be adjusted as appropriate to properly convey the meaning in the context\
    \ of the data being submitted."
  Domains: "ALL"
Standards:
