Core:
  Id: "FDA-SD2278"
  Status: "Published"
  Version: "1"
Description: "Raise an error when the Trial Summary (TS) dataset does not contain\
  \ a record where TSPARMCD equals 'PIPIND' (Pediatric Investigation Plan Indicator)."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "TS"
Bindings:
- name: "$pipind_count"
  expression: "record_count(filter=(TSPARMCD == \"PIPIND\"))"
Check:
  expression: >-
    $pipind_count == 0
Outcome:
  Message: "Missing PIPIND Trial Summary Parameter: a 'Pediatric Investigation Plan\
    \ Indicator' (PIPIND) record must be present in the Trial Summary (TS) domain."
Source:
  FDA_Validator_Rule_Message: "Missing PIPIND Trial Summary Parameter"
  FDA_Validator_Rule_Description: "'Pediatric Investigation Plan Indicator' (PIPIND)\
    \ record must be populated in Trial Summary (TS) domain. It is an 'FDA Desired'\
    \ parameter listed in the Technical Conformance Guide (TCG)."
  Domains: "TS"
