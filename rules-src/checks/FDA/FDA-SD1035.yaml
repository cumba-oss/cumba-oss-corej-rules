Core:
  Id: "FDA-SD1035"
  Status: "Published"
  Version: "1"
Description: "Raise an error when Category for Disposition Event (DSCAT) is not populated."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "DS"
Requirements:
  Variables:
    All:
    - "DSCAT"
Check:
  expression: >-
    empty(DSCAT)
Outcome:
  Message: "DSCAT is empty."
Source:
  FDA_Validator_Rule_Message: "Missing value for DSCAT"
  FDA_Validator_Rule_Description: "Category for Disposition Event (DSCAT) should be\
    \ populated."
  Domains: "DS"
