Core:
  Id: "FDA-SD0044"
  Status: "Published"
  Version: "1"
Description: "Raise an error when --VAMT (Treatment Vehicle Amount) is populated but\
  \ --VAMTU (Treatment Vehicle Amount Units) is not present or is empty."
Executability: "Fully Executable"
Scope:
  Classes:
    Include:
    - "INTERVENTIONS"
Requirements:
  Variables:
    All:
    - "--VAMT"
Check:
  expression: >-
    not empty(--VAMT) and empty(--VAMTU)
Outcome:
  Message: "--VAMTU is empty when --VAMT is populated."
Source:
  FDA_Validator_Rule_Message: "Missing value for --VAMTU, when --VAMT is populated"
  FDA_Validator_Rule_Description: "Treatment Vehicle Amount Units (--VAMTU) should\
    \ not be NULL,  when Treatment Vehicle Amount (--VAMT) is populated."
  Domains: "INTERVENTIONS"
