Core:
  Id: "FDA-SE2281-A"
  Status: "Published"
  Version: "1"
Description: "Raise an error when a PC record does not have the required timing variable\
  \ PCELTM populated."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "PC"
Requirements:
  Variables:
    All:
    - "PCELTM"
Check:
  expression: >-
    empty(PCELTM)
Outcome:
  Message: "PCELTM, a required timing variable, is not populated in PC."
  Message_Folded: "PCELTM not populated in any record of the dataset: PCELTM, a required\
    \ timing variable, is not populated in PC."
Source_Proposed:
  Sheet_Issue: "#238"
  FDA_Validator_Rule_Message: "Missing value for required timing variable: --ELTM"
  FDA_Validator_Rule_Description: "For PC records contributing to a time concentration\
    \ profile, PCELTM must be present and populated. It is a required timing variable\
    \ for identification of the day on which group summaries (Group Means and Incidences)\
    \ are calculated for pharmacokinetic concentrations."
  Domains: "PC"
Source:
  FDA_Validator_Rule_Message: "Missing values for required timing variables: --NOMDY,\
    \ --ELTM, and --TPTREF"
  FDA_Validator_Rule_Description: "For PC records contributing to a time concentration\
    \ profile, PCNOMDY, PCELTM and PCTPTREF must be present and populated. These are\
    \ the required timing variables for identification of the day on which group summaries\
    \ (Group Means and Incidences) are calculated for pharmacokinetic concentrations."
  Domains: "PC"
Standards:
- Organization: "FDA"
  Standards:
  - Name: "SENDIG"
    Version: "3.1.1"
    References:
    - Origin: "FDA Validator Rules"
      Rule_Identifier:
        Id: "SE2281"
        Version: "1"
      Version: "1.6"
    - Origin: "FDA Business Rules"
      Rule_Identifier:
        Id: "FDAB047"
        Version: "1"
      Version: "1.5"
