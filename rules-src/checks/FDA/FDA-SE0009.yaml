Core:
  Id: "FDA-SE0009"
  Status: "Published"
  Version: "1"
Description: "Raise an error when both Date/Time of Observation (--DTC) and Study\
  \ Day of Observation (--DY) are not populated in a Findings-class record."
Executability: "Fully Executable"
Scope:
  Classes:
    Include:
    - "FINDINGS"
  Domains:
    Exclude:
    - "PP"
Check:
  expression: >-
    empty(--DTC) and empty(--DY)
Outcome:
  Message: "Both Date/Time of Observation (--DTC) and Study Day of Observation (--DY)\
    \ are not populated; at least one should be populated."
  Message_Folded: "--DTC or --DY absent or not populated in any record of the dataset,\
    \ and at least one record meets the rest of the condition: Both Date/Time of Observation\
    \ (--DTC) and Study Day of Observation (--DY) are not populated; at least one\
    \ should be populated."
Source:
  FDA_Validator_Rule_Message: "Missing values for both --DTC and --DY variables"
  FDA_Validator_Rule_Description: "Date/Time of Observation (--DTC) or Study Day of\
    \ Observation (--DY) should be populated in the Findings observation class where\
    \ data are usually collected at multiple study days."
  Domains: "FINDINGS"
