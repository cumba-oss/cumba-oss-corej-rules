Core:
  Id: "FDA-SE0056"
  Status: "Published"
  Version: "1"
Description: "Raise an error when a variable described as Required in the SEND IG\
  \ is not present in the dataset."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "ALL"
Bindings:
- name: "$required_variables"
  expression: "required_variables()"
- name: "$required_variables_upper"
  expression: "upper($required_variables)"
- name: "$dataset_variables"
  expression: "get_column_order_from_dataset()"
- name: "$dataset_variables_upper"
  expression: "upper($dataset_variables)"
- name: "$required_variables_absent_upper"
  expression: "minus($required_variables, subtract=$dataset_variables_upper)"
- name: "$missing_required_variables"
  expression: "minus($required_variables_absent_upper, subtract=$dataset_variables)"
Check:
  expression: >-
    not contains_all($dataset_variables_upper, $required_variables_upper)
Outcome:
  Message: "A variable marked as Required in the SEND IG is not present in the dataset."
  Output_Variables:
  - "$missing_required_variables"
  - "!$dataset_variables_upper"
  - "!$required_variables_upper"
  - "!$required_variables_absent_upper"
Source:
  FDA_Validator_Rule_Message: "SEND Required variable not found"
  FDA_Validator_Rule_Description: "Variables described in SEND IG as Required must\
    \ be included in the dataset."
  Domains: "ALL"
Standards:
- Organization: "FDA"
  Standards:
  - Name: "SENDIG"
    Version: "3.1.1"
    References:
    - Origin: "FDA Validator Rules"
      Rule_Identifier:
        Id: "SE0056"
        Version: "1"
      Version: "1.6"
  - Name: "SENDIG"
    Version: "3.1"
    References:
    - Origin: "FDA Validator Rules"
      Rule_Identifier:
        Id: "SE0056"
        Version: "1"
      Version: "1.6"
  - Name: "SENDIG"
    Version: "3.0"
    References:
    - Origin: "FDA Validator Rules"
      Rule_Identifier:
        Id: "SE0056"
        Version: "1"
      Version: "1.6"
  - Name: "SENDIG-AR"
    Version: "1.0"
    References:
    - Origin: "FDA Validator Rules"
      Rule_Identifier:
        Id: "SE0056"
