Core:
  Id: "FDA-SD1213"
  Status: "Published"
  Version: "1"
Description: "Raise an error when RFSTDTC is empty for a treated subject, that is\
  \ a subject whose ACTARMCD is populated and is not equal to 'SCRNFAIL', 'NOTTRT'\
  \ or 'NOTASSGN'."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "DM"
Requirements:
  Variables:
    All:
    - "ACTARMCD"
Check:
  expression: >-
    not empty(ACTARMCD) and upper(ACTARMCD) not in ["SCRNFAIL", "NOTTRT", "NOTASSGN"] and
    empty(RFSTDTC)
Outcome:
  Message: "RFSTDTC is empty for a treated subject (ACTARMCD is populated and not\
    \ equal to 'SCRNFAIL', 'NOTTRT' or 'NOTASSGN')."
  Message_Folded: "RFSTDTC absent or not populated in any record of the dataset, and\
    \ at least one record meets the rest of the condition: RFSTDTC is empty for a\
    \ treated subject (ACTARMCD is populated and not equal to 'SCRNFAIL', 'NOTTRT'\
    \ or 'NOTASSGN')."
Source:
  FDA_Validator_Rule_Message: "RFSTDTC is not provided for a treated subject"
  FDA_Validator_Rule_Description: "Subject Reference Start Date/Time (RFSTDTC) should\
    \ be populated for all treated subjects, those where Actual Arm Code (ACTARMCD)\
    \ is not equal to 'SCRNFAIL', 'NOTASSGN', 'NOTTRT', or null."
  Domains: "DM"
