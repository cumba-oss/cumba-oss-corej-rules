Core:
  Id: "FDA-SD9719"
  Status: "Published"
  Version: "1"
Description: "Raise an error when none of the End Time-Point variables (--ENDTC, --ENRF,\
  \ --ENRTPT) nor the Duration (--DUR) variable is present in the dataset although\
  \ a record demands an end point (not excepted by --OCCUR equals 'N' or a populated\
  \ --STAT)."
Sensitivity: "Dataset"
Executability: "Partially Executable - Possible Overreporting"
Scope:
  Classes:
    Include:
    - "INTERVENTIONS"
    - "EVENTS"
  Domains:
    Exclude:
    - "DS"
Requirements:
  Variables:
    None:
    - "--ENDTC"
    - "--ENRF"
    - "--ENRTPT"
    - "--DUR"
Check:
  expression: >-
    --OCCUR != "N" and empty(--STAT)
Outcome:
  Message: "None of --ENDTC, --ENRF, --ENRTPT or --DUR is present in the dataset although\
    \ a record demands an End Time-Point."
  Output_Variables:
  - "--OCCUR"
  - "--STAT"
Source_Proposed:
  Sheet_Issue: "#183"
  FDA_Validator_Rule_Message: "No End Time-Point variable (--ENDTC, --ENRF, --ENRTPT)\
    \ or Duration (--DUR) is present in the dataset"
  FDA_Validator_Rule_Description: "At least one of the End Time-Point variables (End\
    \ Date/Time of Event or Intervention (--ENDTC), End Relative to Reference Period\
    \ (--ENRF), End Relative to Reference Time Point (--ENRTPT)) or Duration (--DUR)\
    \ must be present in the dataset when an event or intervention record is not excepted\
    \ by Occurrence (--OCCUR) = 'N' or a populated Completion Status (--STAT)."
  Domains: "INTERVENTIONS, EVENTS (-DS)"
Standards:
- Organization: "FDA"
  Standards:
  - Name: "SDTMIG"
    Version: "3.4"
  - Name: "SDTMIG"
    Version: "3.3"
  - Name: "SDTMIG"
    Version: "3.2"
  - Name: "SDTMIG"
    Version: "3.1.3"
  - Name: "SDTMIG"
    Version: "3.1.2"
  - Name: "SENDIG-AR"
    Version: "1.0"
