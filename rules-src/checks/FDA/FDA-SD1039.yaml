Core:
  Id: "FDA-SD1039"
  Status: "Published"
  Version: "1"
Description: "Raise an error when --CAT is identical to DOMAIN, --TERM, --TESTCD,\
  \ --TRT, or --BODSYS."
Executability: "Fully Executable"
Scope:
  Classes:
    Include:
    - "EVENTS"
    - "INTERVENTIONS"
    - "FINDINGS"
    - "FINDINGS ABOUT"
Requirements:
  Variables:
    All:
    - "--CAT"
Check:
  expression: >-
    not empty(--CAT) and (var_exists("DOMAIN") and equalsIgnoreCase(--CAT, DOMAIN) or
    equalsIgnoreCase(--CAT, --TERM) or equalsIgnoreCase(--CAT, --TESTCD) or equalsIgnoreCase(--CAT,
    --TRT) or equalsIgnoreCase(--CAT, --BODSYS))
Outcome:
  Message: "--CAT value is redundant with another variable value."
  Output_Variables:
  - "DOMAIN"
  - "--TESTCD"
  - "--TERM"
  - "--TRT"
  - "--BODSYS"
Source:
  FDA_Validator_Rule_Message: "--CAT value is redundant with other variable values"
  FDA_Validator_Rule_Description: "Value of Category (--CAT) should not be identical\
    \ to that in Domain Abbreviation (DOMAIN); Reported Term (--TERM); Name of Measurement,\
    \ Test, or Examination (--TESTCD); Name of Treatment (--TRT); Body System or Organ\
    \ Class (--BODSYS)."
  Domains: "INTERVENTIONS, EVENTS, FINDINGS, FINDINGS ABOUT, TI"
