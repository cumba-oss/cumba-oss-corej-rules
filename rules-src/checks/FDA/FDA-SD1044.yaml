Core:
  Id: "FDA-SD1044"
  Status: "Published"
  Version: "1"
Description: "Raise an error when Baseline Flag (--BLFL) is not present in a custom\
  \ Findings-class domain. --BLFL should be present in all custom Findings domains."
Executability: "Fully Executable"
Scope:
  Classes:
    Include:
    - "FINDINGS"
Bindings:
- name: "$domain_is_custom"
  expression: "domain_is_custom()"
Check:
  expression: >-
    $domain_is_custom == true and not var_exists("--BLFL")
Outcome:
  Message: "--BLFL variable is not present in a custom Findings domain."
  Output_Variables:
  - "$domain_is_custom"
Source:
  FDA_Validator_Rule_Message: "No --BLFL variable in custom Findings domain"
  FDA_Validator_Rule_Description: "Baseline Flag (--BLFL) should be present in all\
    \ custom Findings domains."
  Domains: "FINDINGS"
Standards:
- Organization: "FDA"
  Standards:
  - Name: "SDTMIG"
    Version: "3.2"
    References:
    - Origin: "FDA Validator Rules"
      Rule_Identifier:
        Id: "SD1044"
        Version: "1"
      Version: "1.6"
  - Name: "SDTMIG"
    Version: "3.1.3"
    References:
    - Origin: "FDA Validator Rules"
      Rule_Identifier:
        Id: "SD1044"
        Version: "1"
      Version: "1.6"
  - Name: "SDTMIG"
    Version: "3.1.2"
    References:
    - Origin: "FDA Validator Rules"
      Rule_Identifier:
        Id: "SD1044"
        Version: "1"
      Version: "1.6"
