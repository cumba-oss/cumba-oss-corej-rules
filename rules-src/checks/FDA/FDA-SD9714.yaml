Core:
  Id: "FDA-SD9714"
  Status: "Published"
  Version: "1"
Description: "Raise an error when --ORRES carries at least one non-empty value but\
  \ the corresponding original-units variable --ORRESU is not present in the dataset;\
  \ a result in original units requires its units variable."
Executability: "Fully Executable"
Scope:
  Classes:
    Include:
    - "FINDINGS"
    - "FINDINGS ABOUT"
Check:
  expression: >-
    not var_is_null(--ORRES) and not var_exists("--ORRESU")
Outcome:
  Message: "--ORRES has at least one non-empty value but --ORRESU is not present."
  Output_Variables:
  - "--ORRES"
Source_Proposed:
  Sheet_Issue: "#168"
  FDA_Validator_Rule_Message: "--ORRESU is not present although --ORRES is populated"
  FDA_Validator_Rule_Description: "The Original Units (--ORRESU) variable must be\
    \ present in the dataset when the Result or Finding in Original Units (--ORRES)\
    \ variable carries at least one non-empty value."
  Domains: "FINDINGS"
Standards:
- Organization: "FDA"
  Standards:
  - Name: "SDTMIG"
    Version: "3.4"
  - Name: "SDTMIG"
    Version: "3.3"
  - Name: "SDTMIG"
    Version: "3.2"
  - Name: "SDTMIG"
    Version: "3.1.3"
  - Name: "SDTMIG"
    Version: "3.1.2"
  - Name: "SENDIG"
    Version: "3.1.1"
  - Name: "SENDIG"
    Version: "3.1"
  - Name: "SENDIG"
    Version: "3.0"
  - Name: "SENDIG-AR"
    Version: "1.0"
  - Name: "SENDIG-DART"
    Version: "1.1"
