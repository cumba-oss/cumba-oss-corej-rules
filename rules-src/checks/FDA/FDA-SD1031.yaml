Core:
  Id: "FDA-SD1031"
  Status: "Published"
  Version: "1"
Description: "Raise an error when End Relative to Reference Period (--ENRF) is populated\
  \ for a subject with an empty Reference End Date/Time (RFENDTC) in the DM dataset."
Executability: "Fully Executable"
Scope:
  Domains:
    Exclude:
    - "DM"
Requirements:
  Variables:
    All:
    - "--ENRF"
    - "USUBJID"
    All_Or_None:
    - - "USUBJID"
      - "DM.USUBJID"
Match_Datasets:
- Keys:
  - "USUBJID"
  Name: "DM"
Check:
  expression: >-
    empty(DM.RFENDTC) and not empty(--ENRF)
Outcome:
  Message: "--ENRF is populated when RFENDTC in the DM dataset is empty."
  Output_Variables:
  - "--ENRF"
  - "DM.RFENDTC"
Source:
  FDA_Validator_Rule_Message: "Value for --ENRF is populated, when RFENDTC is NULL"
  FDA_Validator_Rule_Description: "End Relative to Reference Period (--ENRF) should\
    \ not be populated for subjects with missing value for Reference End Date/Time\
    \ (RFENDTC)."
  Domains: "SE, SM, SV, INTERVENTIONS, EVENTS, FINDINGS, FINDINGS ABOUT"
