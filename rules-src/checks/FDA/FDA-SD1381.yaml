Core:
  Id: "FDA-SD1381"
  Status: "Published"
  Version: "1"
Description: "Raise an error when Day of Obs Relative to Exposure (--XDY) is populated\
  \ and both the date portion of --DTC and the date portion of RFXSTDTC are complete\
  \ dates, but --XDY does not equal the value computed by the study day algorithm\
  \ relative to the Date/Time of First Study Treatment (RFXSTDTC)."
Executability: "Fully Executable"
Scope:
  Classes:
    Include:
    - "INTERVENTIONS"
    - "EVENTS"
    - "FINDINGS"
    - "FINDINGS ABOUT"
Requirements:
  Variables:
    All:
    - "--XDY"
    - "--DTC"
    - "USUBJID"
    All_Or_None:
    - - "USUBJID"
      - "DM.USUBJID"
Match_Datasets:
- Keys:
  - "USUBJID"
  Name: "DM"
Bindings:
- name: "$value_xdy_algorithm"
  expression: "dy(--DTC, DM.RFXSTDTC)"
Check:
  expression: >-
    not empty(--XDY) and is_complete_date(--DTC) and is_complete_date(DM.RFXSTDTC) and --XDY !=
    $value_xdy_algorithm
Outcome:
  Message: "Day of Obs Relative to Exposure (--XDY) does not equal the value derived\
    \ by the study day algorithm against RFXSTDTC even though the date portions of\
    \ --DTC and RFXSTDTC are complete dates and --XDY is populated."
Source:
  FDA_Validator_Rule_Message: "Incorrect value for --XDY variable"
  FDA_Validator_Rule_Description: "Day of Obs Relative to Exposure (--XDY) variable\
    \ value should be populated as defined by CDISC standards: --XDY = (date portion\
    \ of --DTC) - (date portion of RFXSTDTC) +1 if --DTC is on or after RFXSTDTC;\
    \ --XDY = (date portion of --DTC) - (date portion of RFXSTDTC) if --DTC precedes\
    \ RFXSTDTC."
  Domains: "INTERVENTIONS, FINDINGS, EVENTS, FINDINGS ABOUT"
Standards:
- Organization: "FDA"
  Standards:
  - Name: "SENDIG-AR"
    Version: "1.0"
    References:
    - Origin: "FDA Validator Rules"
      Rule_Identifier:
        Id: "SD1381"
        Version: "1"
      Version: "1.6"
