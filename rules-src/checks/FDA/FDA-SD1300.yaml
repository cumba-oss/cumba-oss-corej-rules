Core:
  Id: "FDA-SD1300"
  Status: "Published"
  Version: "1"
Description: "Raise an error when the DOMAIN value length is not equal to 2 characters."
Executability: "Fully Executable"
Scope:
  Classes:
    Exclude:
    - "RELATIONSHIP"
  Domains:
    Exclude:
    - "AP--"
    - "APRELSUB"
Requirements:
  Variables:
    All:
    - "DOMAIN"
Check:
  expression: >-
    len(dataset_domain) > 2 or len(dataset_domain) < 2
Outcome:
  Message: "DOMAIN value length is not equal to 2."
  Output_Variables:
  - "dataset_domain"
Source:
  FDA_Validator_Rule_Message: "Invalid value for DOMAIN variable"
  FDA_Validator_Rule_Description: "The value of DOMAIN should be no more than 2 characters\
    \ in length, excluding Associated Persons domains."
  Domains: "ALL"
