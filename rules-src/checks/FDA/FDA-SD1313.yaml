Core:
  Id: "FDA-SD1313"
  Status: "Published"
  Version: "1"
Description: "Raise an error when the Epoch (EPOCH) variable is empty for a record\
  \ in the Disposition (DS) dataset whose Category for Disposition Event (DSCAT) equals\
  \ 'DISPOSITION EVENT'; EPOCH should be provided for disposition event records."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "DS"
Requirements:
  Variables:
    All:
    - "EPOCH"
    - "DSCAT"
Check:
  expression: >-
    DSCAT == "DISPOSITION EVENT" and empty(EPOCH)
Outcome:
  Message: "EPOCH is empty when DSCAT equals 'DISPOSITION EVENT'."
Source:
  FDA_Validator_Rule_Message: "Missing EPOCH value, when DSCAT is 'DISPOSITION EVENT'"
  FDA_Validator_Rule_Description: "Epoch (EPOCH) variable should be provided, when\
    \ Category for Disposition Event (DSCAT) equals 'DISPOSITION EVENT'."
  Domains: "DS"
