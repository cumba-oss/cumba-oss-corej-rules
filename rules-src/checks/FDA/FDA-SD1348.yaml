Core:
  Id: "FDA-SD1348"
  Status: "Published"
  Version: "1"
Description: "Raise an error when --TEST references a 'T1 to T2' interval but --STINT\
  \ (Planned Start of Assessment Interval) and/or --ENINT (Planned End of Assessment\
  \ Interval) is empty."
Executability: "Partially Executable - Possible Underreporting"
Scope:
  Domains:
    Include:
    - "PP"
Requirements:
  Variables:
    All:
    - "--TEST"
    - "--STINT"
    - "--ENINT"
Check:
  expression: >-
    --TEST =~ /.+ to .+/ and (empty(--STINT) or empty(--ENINT))
Outcome:
  Message: "--STINT or --ENINT is empty when --TEST references a 'T1 to T2' interval."
  Output_Variables:
  - "--TESTCD"
  - "--TEST"
  - "!--STINT"
  - "!--ENINT"
Source:
  FDA_Validator_Rule_Message: "Missing values for --STINT and --ENINT variables when\
    \ --TEST references 'T1 to T2'"
  FDA_Validator_Rule_Description: "Planned Start of Assessment Interval (--STINT)\
    \ and Planned End of Assessment Interval (--ENINT) variables should be present\
    \ and populated when Name of Measurement, Test or Examination (--TEST) is over\
    \ a time interval, 'T1 to T2', where 'T1' is represented by the value in --STINT\
    \ and 'T2' is represented by the value in --ENINT."
  Domains: "PP"
