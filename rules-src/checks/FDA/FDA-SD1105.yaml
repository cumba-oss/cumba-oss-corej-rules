Core:
  Id: "FDA-SD1105"
  Status: "Published"
  Version: "1"
Description: "Raise an error when the Epoch (EPOCH) variable is populated for a record\
  \ in the Disposition (DS) dataset whose Category for Disposition Event (DSCAT) equals\
  \ 'PROTOCOL MILESTONE'; EPOCH should not be populated for protocol milestone records."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "DS"
Requirements:
  Variables:
    All:
    - "EPOCH"
    - "DSCAT"
Check:
  expression: >-
    DSCAT == "PROTOCOL MILESTONE" and not empty(EPOCH)
Outcome:
  Message: "EPOCH is populated when DSCAT equals 'PROTOCOL MILESTONE'."
Source:
  FDA_Validator_Rule_Message: "EPOCH variable is populated, when DSCAT equals 'PROTOCOL\
    \ MILESTONE'"
  FDA_Validator_Rule_Description: "Epoch (EPOCH) variable value should not be populated,\
    \ when Category for Disposition Event (DSCAT) variable value equals 'PROTOCOL\
    \ MILESTONE'."
  Domains: "DS"
