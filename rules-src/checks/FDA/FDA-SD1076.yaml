Core:
  Id: "FDA-SD1076"
  Status: "Published"
  Version: "1"
Description: "Raise an error when an SDTM Model variable of the dataset's general\
  \ observation class is present in the dataset but is not part of the IG domain specification."
Executability: "Partially Executable - Possible Underreporting"
Scope:
  Domains:
    Include:
    - "ALL"
Bindings:
- name: "$model_order"
  expression: "get_model_column_order()"
- name: "$library_order"
  expression: "get_column_order_from_library()"
Check:
  expression: >-
    varname() in $model_order and varname() not in $library_order
Outcome:
  Message: "A Model permissible variable has been added into a standard domain."
  Output_Variables:
  - "variable_name"
Source:
  FDA_Validator_Rule_Message: "Model permissible variable added into standard domain"
  FDA_Validator_Rule_Description: "SDTM model variable may be added into standard\
    \ domains according its domain general class, if there are no restrictions on\
    \ their usage specified in IG."
  Domains: "ALL"
