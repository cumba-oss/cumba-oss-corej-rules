Core:
  Id: "FDA-SD0059"
  Status: "Published"
  Version: "1"
Description: "Raise an error when the variable data type in the submitted dataset\
  \ does not match the variable data type declared in the Define-XML."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "ALL"
Check:
  expression: >-
    not empty(var_name("DEFINE")) and var_type() != var_type("DEFINE")
Outcome:
  Message: "The variable data type in the dataset does not match the variable data\
    \ type in the Define-XML."
Source:
  FDA_Validator_Rule_Message: "Define.xml/dataset variable type mismatch"
  FDA_Validator_Rule_Description: "Variable DataType in define.xml must match variable\
    \ Type in dataset. Define-XML data types of 'integer' and 'float' match dataset\
    \ type of 'Num', all other match 'Char'."
  Domains: "ALL"
