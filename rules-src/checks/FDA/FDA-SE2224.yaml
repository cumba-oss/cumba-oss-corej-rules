Core:
  Id: "FDA-SE2224"
  Status: "Published"
  Version: "1"
Description: "Raise an error when the Trial Summary (TS) dataset does not contain\
  \ a record where TSPARMCD equals 'TSTFNAM' (Test Facility Name)."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "TS"
Bindings:
- name: "$tstfnam_count"
  expression: "record_count(filter=filter(TSPARMCD=\"TSTFNAM\"))"
Check:
  expression: >-
    $tstfnam_count == 0
Outcome:
  Message: "Missing TSTFNAM Trial Summary Parameter: a 'Test Facility Name' (TSTFNAM)\
    \ record must be present in the Trial Summary (TS) domain."
  Output_Variables:
  - "$tstfnam_count"
Source:
  FDA_Validator_Rule_Message: "Missing TSTFNAM Trial Summary Parameter"
  FDA_Validator_Rule_Description: "'Test Facility Name' (TSTFNAM) record should be\
    \ populated in Trial Summary (TS) domain."
  Domains: "TS"
Standards:
- Organization: "FDA"
  Standards:
