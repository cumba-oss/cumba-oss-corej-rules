Core:
  Id: "FDA-SD1131"
  Status: "Published"
  Version: "1"
Description: "Raise an error when --BLFL equals 'Y' (Baseline record) and --STRESC\
  \ is empty."
Executability: "Fully Executable"
Scope:
  Classes:
    Include:
    - "FINDINGS"
    - "FINDINGS ABOUT"
Requirements:
  Variables:
    All:
    - "--BLFL"
Check:
  expression: >-
    --BLFL == "Y" and empty(--STRESC)
Outcome:
  Message: "Empty --STRESC value for a Baseline record (--BLFL equals 'Y')."
  Output_Variables:
  - "!--STRESC"
Source:
  FDA_Validator_Rule_Message: "Missing --STRESC value for Baseline record"
  FDA_Validator_Rule_Description: "A Standard Result value (--STRESC) is expected\
    \ to be populated for Baseline records (--BLFL='Y')."
  Domains: "FINDINGS, FINDINGS ABOUT"
