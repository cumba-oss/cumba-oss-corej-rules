Core:
  Id: "FDA-SD1026"
  Status: "Published"
  Version: "1"
Description: "Raise an error when RELTYPE is populated while IDVAR references a variable\
  \ name ending in 'SEQ'; RELTYPE must be empty when IDVAR is populated with a --SEQ\
  \ value."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "RELREC"
Check:
  expression: >-
    suffix(IDVAR, 3) =~ /^SEQ$/ and not empty(RELTYPE)
Outcome:
  Message: "RELTYPE is populated when IDVAR references a --SEQ variable."
Source:
  FDA_Validator_Rule_Message: "Invalid value for RELTYPE variable"
  FDA_Validator_Rule_Description: "Relationship Type (RELTYPE) must be NULL, when\
    \ Identifying Variable (IDVAR) is populated with a --SEQ value."
  Domains: "RELREC"
