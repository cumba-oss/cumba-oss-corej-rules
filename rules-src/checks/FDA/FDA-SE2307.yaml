Core:
  Id: "FDA-SE2307"
  Status: "Published"
  Version: "1"
Description: "Raise an error when the required timing variable --DY is not populated;\
  \ the required timing variables identify the day on which group summaries are calculated\
  \ for data associated with a time interval."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "BG"
    - "FW"
Requirements:
  Variables:
    All:
    - "--DY"
Check:
  expression: >-
    empty(--DY)
Outcome:
  Message: "--DY, a required timing variable, is not populated."
  Message_Folded: "--DY not populated in any record of the dataset: --DY, a required\
    \ timing variable, is not populated."
Source:
  FDA_Validator_Rule_Message: "Missing values for all required timing variables: --DY\
    \ & --ENDY"
  FDA_Validator_Rule_Description: "These variables must be populated:  --DY and --ENDY.\
    \  These are the required timing variables for identification of the day on which\
    \ group summaries (Group Means and Incidences) are calculated for data associated\
    \ with a time interval."
  Domains: "BG, FW"
