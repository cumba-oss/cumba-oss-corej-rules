Core:
  Id: "FDA-SD1092"
  Status: "Published"
  Version: "1"
Description: "Raise an error when the Study Day of End of Observation (--ENDY) is\
  \ missing even though the date portion of --ENDTC is a complete date and the date\
  \ portion of DM.RFSTDTC is a complete date."
Executability: "Fully Executable"
Scope:
  Classes:
    Include:
    - "INTERVENTIONS"
    - "EVENTS"
    - "FINDINGS"
    - "FINDINGS ABOUT"
    - "SPECIAL PURPOSE"
  Domains:
    Exclude:
    - "CO"
    - "DM"
Requirements:
  Variables:
    All:
    - "--ENDTC"
    - "--ENDY"
    - "STUDYID"
    - "USUBJID"
    All_Or_None:
    - - "STUDYID"
      - "DM.STUDYID"
    - - "USUBJID"
      - "DM.USUBJID"
Match_Datasets:
- Keys:
  - "STUDYID"
  - "USUBJID"
  Cardinality: "n:1"
  Name: "DM"
Check:
  expression: >-
    is_complete_date(--ENDTC) and is_complete_date(DM.RFSTDTC) and empty(--ENDY)
Outcome:
  Message: "--ENDY is missing when --ENDTC and DM.RFSTDTC are both complete dates."
  Output_Variables:
  - "!--ENDY"
Source:
  FDA_Validator_Rule_Message: "--ENDY variable value is not populated"
  FDA_Validator_Rule_Description: "Study Day of End (--ENDY) variable value should\
    \ be populated, when End Study Date/Time (--ENDTC) and Subject Reference Start\
    \ Date/Time (RFSTDTC) variables values are provided, and both of them include\
    \ complete date part."
  Domains: "SE, SM, SV, INTERVENTIONS, EVENTS, FINDINGS, FINDINGS ABOUT"
