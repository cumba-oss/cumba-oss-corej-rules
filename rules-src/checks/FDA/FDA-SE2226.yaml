Core:
  Id: "FDA-SE2226"
  Status: "Published"
  Version: "1"
Description: "Raise an error when the Trial Summary (TS) dataset does not contain\
  \ a record where TSPARMCD equals 'TRTCAS' (Primary Treatment CAS Registry Number)."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "TS"
Bindings:
- name: "$trtcas_count"
  expression: "record_count(filter=filter(TSPARMCD=\"TRTCAS\"))"
Check:
  expression: >-
    $trtcas_count == 0
Outcome:
  Message: "Missing TRTCAS Trial Summary Parameter: a 'Primary Treatment CAS Registry\
    \ Number' (TRTCAS) record must be present in the Trial Summary (TS) domain."
  Output_Variables:
  - "$trtcas_count"
Source:
  FDA_Validator_Rule_Message: "Missing TRTCAS Trial Summary Parameter"
  FDA_Validator_Rule_Description: "'Primary Treatment CAS Registry Number' (TRTCAS)\
    \ record should be populated in Trial Summary (TS) domain."
  Domains: "TS"
