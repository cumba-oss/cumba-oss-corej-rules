Core:
  Id: "FDA-SD1042"
  Status: "Published"
  Version: "1"
Description: "Raise an error when --OCCUR is 'N' and --STRF or --ENRF is populated\
  \ for a non-occurred event or intervention."
Executability: "Fully Executable"
Scope:
  Classes:
    Include:
    - "INTERVENTIONS"
    - "EVENTS"
Requirements:
  Variables:
    All:
    - "--OCCUR"
Check:
  expression: >-
    --OCCUR == "N" and (not empty(--STRF) or not empty(--ENRF))
Outcome:
  Message: "--STRF or --ENRF is populated for a non-occurred event or intervention."
  Message_Folded: "--ENRF or --STRF absent or not populated in any record of the dataset,\
    \ and at least one record meets the rest of the condition: --STRF or --ENRF is\
    \ populated for a non-occurred event or intervention."
Source:
  FDA_Validator_Rule_Message: "Time point for non-occurred event or intervention is\
    \ provided"
  FDA_Validator_Rule_Description: "Value of Start Relative to Reference Period (--STRF)\
    \ or End Relative to Reference Period (--ENRF) should not be populated, when an\
    \ event or intervention is marked as not occurred (--OCCUR='N')."
  Domains: "INTERVENTIONS, EVENTS"
