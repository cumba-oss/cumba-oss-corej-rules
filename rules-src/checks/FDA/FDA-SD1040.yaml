Core:
  Id: "FDA-SD1040"
  Status: "Published"
  Version: "1"
Description: "Raise an error when --SCAT is identical to DOMAIN, --TERM, --TESTCD,\
  \ --TRT, or --BODSYS."
Executability: "Fully Executable"
Scope:
  Classes:
    Include:
    - "EVENTS"
    - "INTERVENTIONS"
    - "FINDINGS"
    - "FINDINGS ABOUT"
Requirements:
  Variables:
    All:
    - "--SCAT"
Check:
  expression: >-
    not empty(--SCAT) and (var_exists("DOMAIN") and equalsIgnoreCase(--SCAT, DOMAIN) or
    equalsIgnoreCase(--SCAT, --TERM) or equalsIgnoreCase(--SCAT, --TESTCD) or
    equalsIgnoreCase(--SCAT, --TRT) or equalsIgnoreCase(--SCAT, --BODSYS))
Outcome:
  Message: "--SCAT value is redundant with another variable value."
  Output_Variables:
  - "DOMAIN"
  - "--TESTCD"
  - "--TERM"
  - "--TRT"
  - "--BODSYS"
Source:
  FDA_Validator_Rule_Message: "--SCAT value is redundant with other variable values"
  FDA_Validator_Rule_Description: "Value of Subcategory (--SCAT) should not be  identical\
    \ to that in Domain Abbreviation (DOMAIN); Reported Term (--TERM); Name of Measurement,\
    \ Test, or Examination (--TESTCD); Name of Treatment (--TRT); Body System or Organ\
    \ Class (--BODSYS)."
  Domains: "INTERVENTIONS, EVENTS, FINDINGS, FINDINGS ABOUT, TI"
