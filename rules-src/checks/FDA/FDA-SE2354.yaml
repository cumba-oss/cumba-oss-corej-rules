Core:
  Id: "FDA-SE2354"
  Status: "Published"
  Version: "1"
Description: "Raise an error when --REASEX is populated but --EXCLFL is not set to\
  \ 'Y'."
Executability: "Fully Executable"
Scope:
  Classes:
    Include:
    - "FINDINGS"
Requirements:
  Variables:
    All:
    - "--REASEX"
    - "--EXCLFL"
Check:
  expression: >-
    not empty(--REASEX) and --EXCLFL != "Y"
Outcome:
  Message: "--EXCLFL is not set to 'Y' when --REASEX is populated."
  Output_Variables:
  - "!--REASEX"
Source:
  FDA_Validator_Rule_Message: "Missing value for --EXCLFL, when --REASEX is provided"
  FDA_Validator_Rule_Description: "Exclude from Statistics (--EXCLFL) should be set\
    \ to 'Y', when Reason for Exclusion from Statistics (--REASEX) is populated."
  Domains: "FINDINGS"
Standards:
- Organization: "FDA"
