Core:
  Id: "FDA-SD1388"
  Status: "Published"
  Version: "1"
Description: "Raise an error when Start Day of Obs Relative to Exposure (--XSTDY)\
  \ is populated but the date portion of Start Date/Time of Observation (--STDTC)\
  \ or of Date/Time of First Study Treatment (RFXSTDTC) is not a complete date, i.e.\
  \ empty, invalid, or only partially specified, indicating the study day value was\
  \ imputed."
Executability: "Fully Executable"
Scope:
  Classes:
    Include:
    - "INTERVENTIONS"
    - "EVENTS"
    - "FINDINGS"
    - "FINDINGS ABOUT"
Requirements:
  Variables:
    All:
    - "--XSTDY"
    - "--STDTC"
    - "USUBJID"
    All_Or_None:
    - - "USUBJID"
      - "DM.USUBJID"
Match_Datasets:
- Keys:
  - "USUBJID"
  Name: "DM"
Check:
  expression: >-
    not empty(--XSTDY) and (not is_complete_date_part(--STDTC) or not
    is_complete_date_part(DM.RFXSTDTC))
Outcome:
  Message: "Start Day of Obs Relative to Exposure (--XSTDY) is populated but --STDTC\
    \ and/or RFXSTDTC is empty or an incomplete date; the value appears imputed."
  Output_Variables:
  - "--STDTC"
  - "--XSTDY"
  - "DM.RFXSTDTC"
Source:
  FDA_Validator_Rule_Message: "--XSTDY variable value is imputed"
  FDA_Validator_Rule_Description: "Start Day of Obs relative to Exposure (--XSTDY)\
    \ variable value should not be imputed. It may only be populated, when both Start\
    \ Date/Time of Observation (--STDTC) and Date/Time of First Study Treatment (RFXSTDTC)\
    \ variables values are provided and both of them include complete date parts."
  Domains: "INTERVENTIONS, FINDINGS, EVENTS, FINDINGS ABOUT"
Standards:
- Organization: "FDA"
  Standards:
  - Name: "SENDIG-AR"
    Version: "1.0"
    References:
    - Origin: "FDA Validator Rules"
      Rule_Identifier:
        Id: "SD1388"
        Version: "1"
      Version: "1.6"
