Core:
  Id: "FDA-SD1137"
  Status: "Published"
  Version: "1"
Description: "Raise an error when --DRVFL is equal to 'Y' but --ORRES is populated.\
  \ A derived result should not carry a collected --ORRES value."
Executability: "Fully Executable"
Scope:
  Classes:
    Include:
    - "FINDINGS"
    - "FINDINGS ABOUT"
Requirements:
  Variables:
    All:
    - "--DRVFL"
    - "--ORRES"
Check:
  expression: >-
    --DRVFL == "Y" and not empty(--ORRES)
Outcome:
  Message: "--ORRES is not empty when --DRVFL equals 'Y'."
Source:
  FDA_Validator_Rule_Message: "Non-missing value for --ORRES, when --DRVFL='Y'"
  FDA_Validator_Rule_Description: "Character Result/Finding in Original Units (--ORRES)\
    \ value should be NULL, when Derived Flag (--DRVFL) value is 'Y'."
  Domains: "FINDINGS, FINDINGS ABOUT"
