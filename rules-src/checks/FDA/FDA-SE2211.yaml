Core:
  Id: "FDA-SE2211"
  Status: "Published"
  Version: "1"
Description: "Raise an error when the Trial Summary (TS) dataset does not contain\
  \ a record where TSPARMCD equals 'SPECIES' (Species)."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "TS"
Bindings:
- name: "$species_count"
  expression: "record_count(filter=(TSPARMCD == \"SPECIES\"))"
Check:
  expression: >-
    $species_count == 0
Outcome:
  Message: "Missing SPECIES Trial Summary Parameter: a 'Species' (SPECIES) record\
    \ must be present in the Trial Summary (TS) domain."
Source:
  FDA_Validator_Rule_Message: "Missing SPECIES Trial Summary Parameter"
  FDA_Validator_Rule_Description: "'Species' (SPECIES) record should be populated\
    \ in Trial Summary (TS) domain."
  Domains: "TS"
