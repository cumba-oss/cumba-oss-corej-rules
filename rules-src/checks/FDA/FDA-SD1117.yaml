Core:
  Id: "FDA-SD1117"
  Status: "Published"
  Version: "1"
Description: "Raise an error when a Findings-class dataset has more than one record\
  \ for the same subject, test, and qualifier/timing key (duplicate Finding Result)."
Executability: "Fully Executable"
Scope:
  Classes:
    Include:
    - "FINDINGS"
    - "FINDINGS ABOUT"
Operations:
- id: "$natural_key"
  expression: "natural_key_variables()"
Check:
  expression: >-
    not is_unique_set([USUBJID, --TESTCD, $natural_key])
Outcome:
  Message: "Duplicate Finding Result: more than one record for the same subject, test\
    \ and qualifier/timing key."
  Output_Variables:
  - "--TESTCD"
Source:
  FDA_Validator_Rule_Message: "Duplicate records"
  FDA_Validator_Rule_Description: "The structure of Findings class domains should\
    \ be one record per Finding Result per subject. No Finding Result with the same\
    \ Test Short Name (--TESTCD) and the same Qualifier variables at the same timepoint\
    \ for the same Subject (USUBJID) are expected."
  Domains: "FINDINGS, FINDINGS ABOUT"
