Core:
  Id: "FDA-SD0032"
  Status: "Published"
  Version: "1"
Description: "Raise an error when Planned Time Point Name (--TPT) is empty or not\
  \ present while Planned Time Point Number (--TPTNUM) is populated."
Executability: "Fully Executable"
Scope:
  Classes:
    Include:
    - "INTERVENTIONS"
    - "EVENTS"
    - "FINDINGS"
    - "FINDINGS ABOUT"
Requirements:
  Variables:
    All:
    - "--TPTNUM"
Check:
  expression: >-
    not empty(--TPTNUM) and empty(--TPT)
Outcome:
  Message: "--TPT is empty when --TPTNUM is populated."
  Output_Variables:
  - "--TPT"
  - "--TPTNUM"
Source:
  FDA_Validator_Rule_Message: "Missing value for --TPT, when --TPTNUM is provided"
  FDA_Validator_Rule_Description: "Planned Time Point Name (--TPT) should not be NULL,\
    \ when Planned Time Point Number (--TPTNUM) is populated."
  Domains: "CO, INTERVENTIONS, EVENTS, FINDINGS, FINDINGS ABOUT"
