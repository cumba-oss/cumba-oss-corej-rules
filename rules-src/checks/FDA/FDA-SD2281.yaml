Core:
  Id: "FDA-SD2281"
  Status: "Published"
  Version: "1"
Description: "Raise an error when the Trial Summary (TS) dataset does not contain\
  \ a record where TSPARMCD equals 'SDTMVER' (SDTM Version)."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "TS"
Bindings:
- name: "$sdtmver_count"
  expression: "record_count(filter=filter(TSPARMCD=\"SDTMVER\"))"
Check:
  expression: >-
    $sdtmver_count == 0
Outcome:
  Message: "Missing SDTMVER Trial Summary Parameter: a 'SDTM Version' (SDTMVER) record\
    \ must be present in the Trial Summary (TS) domain."
  Output_Variables:
  - "$sdtmver_count"
Source:
  FDA_Validator_Rule_Message: "Missing SDTMVER Trial Summary Parameter"
  FDA_Validator_Rule_Description: "'SDTM Version' (SDTMVER) record must be populated\
    \ in Trial Summary (TS) domain. It is an 'FDA Desired' parameter listed in the\
    \ Technical Conformance Guide (TCG)."
  Domains: "TS"
Standards:
- Organization: "FDA"
  Standards:
  - Name: "SDTMIG"
    Version: "3.4"
    References:
