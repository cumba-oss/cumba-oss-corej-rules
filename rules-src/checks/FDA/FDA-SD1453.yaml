Core:
  Id: "FDA-SD1453"
  Status: "Published"
  Version: "1"
Description: "Raise an error when DISEQ is not a unique number within each SPDEVID\
  \ per domain, including when the domain is split into multiple files."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "DI"
Requirements:
  Variables:
    All:
    - "DISEQ"
Check:
  expression: >-
    not empty(SPDEVID) and not is_unique_set([DISEQ, DOMAIN, SPDEVID])
Outcome:
  Message: "DISEQ is not a unique number within SPDEVID per domain, including when\
    \ the domain is split into multiple files."
Source:
  FDA_Validator_Rule_Message: "Duplicate value for --SEQ variable"
  FDA_Validator_Rule_Description: "The value of Sequence Number (DISEQ) variable must\
    \ be unique for each record within a domain and within each Sponsor Device Identifier\
    \ (SPDEVID)"
  Domains: "DI"
