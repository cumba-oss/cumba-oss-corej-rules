Core:
  Id: "FDA-SD1093"
  Status: "Published"
  Version: "1"
Description: "Raise an error when --ENDY is populated but the date portion of --ENDTC\
  \ or of RFSTDTC in the DM dataset is not a complete date, i.e. empty, invalid, or\
  \ only partially specified, indicating that the Study Day of End value was imputed."
Executability: "Fully Executable"
Scope:
  Domains:
    Exclude:
    - "DM"
Requirements:
  Variables:
    All:
    - "STUDYID"
    - "USUBJID"
    - "--ENDY"
    All_Or_None:
    - - "STUDYID"
      - "DM.STUDYID"
    - - "USUBJID"
      - "DM.USUBJID"
Match_Datasets:
- Keys:
  - "STUDYID"
  - "USUBJID"
  Cardinality: "n:1"
  Name: "DM"
Check:
  expression: >-
    var_exists("--ENDTC") and not is_complete_date_part(--ENDTC) and not empty(--ENDY) or not
    is_complete_date_part(DM.RFSTDTC) and not empty(--ENDY)
Outcome:
  Message: "--ENDY variable value is imputed: --ENDY is populated but --ENDTC or RFSTDTC\
    \ in the DM dataset does not contain a complete date."
Source:
  FDA_Validator_Rule_Message: "--ENDY variable value is imputed"
  FDA_Validator_Rule_Description: "Study Day of End (--ENDY) variable value should\
    \ not be imputed. It may be only populated, when both End Study Date/Time (--ENDTC)\
    \ and Subject Reference Start Date/Time (RFSTDTC) variables values are provided,\
    \ and both of them include complete date part."
  Domains: "SE, SM, SV, INTERVENTIONS, EVENTS, FINDINGS, FINDINGS ABOUT"
