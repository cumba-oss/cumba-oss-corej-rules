Core:
  Id: "FDA-SD1263"
  Status: "Published"
  Version: "1"
Description: "Raise an error when a microorganism has been identified (MBTESTCD equal\
  \ to 'ORGANISM') but the Result Category (MBRESCAT) is not populated, excluding\
  \ records where MBSTRESC equals 'NO GROWTH' or MBMETHOD equals 'GRAM STAIN'."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "MB"
Requirements:
  Variables:
    All:
    - "MBRESCAT"
    - "MBTESTCD"
    - "MBMETHOD"
Check:
  expression: >-
    MBTESTCD == "ORGANISM" and not equalsIgnoreCase(MBSTRESC, "NO GROWTH") and MBMETHOD !=
    "GRAM STAIN" and empty(MBRESCAT)
Outcome:
  Message: "MBRESCAT is empty when MBTESTCD equals 'ORGANISM'."
Source:
  FDA_Validator_Rule_Message: "MBRESCAT is null when MBTESTCD = 'ORGANISM'"
  FDA_Validator_Rule_Description: "MBRESCAT is expected to be populated in all records\
    \ where a microorganism has been identified (MBTESTCD = 'ORGANISM'), excluding\
    \ records where MBSTRESC equals 'NO GROWTH' or MBMETHOD equals 'GRAM STAIN'."
  Domains: "MB"
