Core:
  Id: "FDA-SD1209"
  Status: "Published"
  Version: "1"
Description: "Raise an error when RFXSTDTC is populated but RFXENDTC is empty. The\
  \ date/time of last study treatment exposure must be populated when the date/time\
  \ of first study treatment exposure is provided."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "DM"
Requirements:
  Variables:
    All:
    - "RFXSTDTC"
Check:
  expression: >-
    not empty(RFXSTDTC) and empty(RFXENDTC)
Outcome:
  Message: "RFXENDTC is empty when RFXSTDTC is populated."
  Message_Folded: "RFXENDTC absent or not populated in any record of the dataset,\
    \ and at least one record meets the rest of the condition: RFXENDTC is empty when\
    \ RFXSTDTC is populated."
Source:
  FDA_Validator_Rule_Message: "Missing value for RFXENDTC, when RFXSTDTC is provided"
  FDA_Validator_Rule_Description: "Value for Date/Time of Last Study Treatment (RFXENDTC)\
    \ variable must be populated, when Date/Time of First Study Treatment (RFXSTDTC)\
    \ variable value is provided."
  Domains: "DM"
