Core:
  Id: "FDA-SE1150"
  Status: "Published"
  Version: "1"
Description: "Raise an error when End Date/Time of Treatment (EXENDTC) is populated\
  \ and is earlier than the Experimental Start Date (EXPSTDTC)."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "EX"
Requirements:
  Variables:
    All:
    - "EXENDTC"
Bindings:
- name: "$exp_start"
  expression: "read_value(TSVAL, domain=TS, filter=(TSPARMCD==\"EXPSTDTC\"), mode=\"\
    FIRST\")"
Check:
  expression: >-
    not empty(EXENDTC) and date(EXENDTC) < date($exp_start)
Outcome:
  Message: "EXENDTC is populated and is earlier than the Experimental Start Date (TS\
    \ EXPSTDTC)."
Source:
  FDA_Validator_Rule_Message: "EXENDTC date is before EXPSTDTC in TS domain"
  FDA_Validator_Rule_Description: "End Date/Time of Treatment (EXENDTC) variable value\
    \ must be greater than or equal to Date/Time of Experimental Start Date (EXPSTDTC)\
    \ in Trial Summary (TS) domain."
  Domains: "INTERVENTIONS"
