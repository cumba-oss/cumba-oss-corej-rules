Core:
  Id: "FDA-SD9709"
  Status: "Published"
  Version: "1"
Description: "Raise an error when QLABEL is not populated."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "SUPP--"
    - "SQ--"
Requirements:
  Variables:
    All:
    - "QLABEL"
Check:
  expression: >-
    empty(QLABEL)
Outcome:
  Message: "QLABEL is not populated."
Source_Proposed:
  FDA_Validator_Rule_Message: "Missing value for QLABEL"
  FDA_Validator_Rule_Description: "QLABEL should be populated."
  Domains: "SUPP--, SQ--"
Source:
  FDA_Validator_Rule_Message: "NULL value in variable marked as Required"
  FDA_Validator_Rule_Description: "Required variables (where Core attribute is 'Req')\
    \ cannot be NULL for any records."
  Domains: "ALL"
