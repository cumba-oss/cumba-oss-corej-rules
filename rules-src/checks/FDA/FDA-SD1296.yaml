Core:
  Id: "FDA-SD1296"
  Status: "Published"
  Version: "1"
Description: "Raise an error when the Adaptive Design parameter (TSPARMCD equal to\
  \ 'ADAPT') has a Parameter Value (TSVAL) that is populated with a value other than\
  \ 'Y' or 'N'."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "TS"
Requirements:
  Variables:
    All:
    - "TSPARMCD"
    - "TSVAL"
Check:
  expression: >-
    TSPARMCD == "ADAPT" and not empty(TSVAL) and TSVAL not in ["Y", "N"]
Outcome:
  Message: "TSVAL is not 'Y' or 'N' when TSPARMCD equals 'ADAPT'."
Source:
  FDA_Validator_Rule_Message: "Invalid TSVAL value for ADAPT parameter"
  FDA_Validator_Rule_Description: "TSVAL for ADAPT record must be 'Y' or 'N'."
  Domains: "TS"
