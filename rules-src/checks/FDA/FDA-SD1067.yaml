Core:
  Id: "FDA-SD1067"
  Status: "Published"
  Version: "1"
Description: "Raise an error when RELTYPE is populated but USUBJID is also populated."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "RELREC"
Check:
  expression: >-
    not empty(RELTYPE) and not empty(USUBJID)
Outcome:
  Message: "USUBJID is populated when RELTYPE is populated"
Source:
  FDA_Validator_Rule_Message: "USUBJID value is populated, when RELTYPE values is\
    \ populated"
  FDA_Validator_Rule_Description: "Unique Subject Identifier (USUBJID) variable value\
    \ should not be populated, when Relationship Type (RELTYPE) variable value is\
    \ populated."
  Domains: "RELREC"
