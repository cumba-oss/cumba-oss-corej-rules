Core:
  Id: "FDA-SD2201"
  Status: "Published"
  Version: "1"
Description: "Raise an error when the Trial Summary (TS) dataset does not contain\
  \ a record where TSPARMCD equals 'ADDON' (Added on to Existing Treatments)."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "TS"
Bindings:
- name: "$addon_count"
  expression: "record_count(filter=(TSPARMCD == \"ADDON\"))"
Check:
  expression: >-
    $addon_count == 0
Outcome:
  Message: "Missing ADDON Trial Summary Parameter: a 'Added on to Existing Treatments'\
    \ (ADDON) record must be present in the Trial Summary (TS) domain."
  Output_Variables:
  - "$addon_count"
Source:
  FDA_Validator_Rule_Message: "Missing ADDON Trial Summary Parameter"
  FDA_Validator_Rule_Description: "'Added on to Existing Treatments' (ADDON) record\
    \ must be populated in Trial Summary (TS) domain. It is expected for SDTM IG v3.1.2\
    \ data and required for data in all more recent SDTM versions."
  Domains: "TS"
