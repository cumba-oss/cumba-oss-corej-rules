Core:
  Id: "FDA-SD1368"
  Status: "Published"
  Version: "1"
Description: "Raise an error when the Start Date/Time of Milestone (SMSTDTC) is not\
  \ populated."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "SM"
Requirements:
  Variables:
    All:
    - "SMSTDTC"
Check:
  expression: >-
    empty(SMSTDTC)
Outcome:
  Message: "SMSTDTC is empty."
Source:
  FDA_Validator_Rule_Message: "SMSTDTC is null"
  FDA_Validator_Rule_Description: "Start Date/Time of Milestone (SMSTDTC) should not\
    \ be null. The start date/time of the Disease Milestone is the critical date/time,\
    \ and must be populated."
  Domains: "SM"
Standards:
- Organization: "FDA"
  Standards:
  - Name: "SDTMIG"
    Version: "3.4"
    References:
