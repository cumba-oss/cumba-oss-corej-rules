Core:
  Id: "FDA-SD2268"
  Status: "Published"
  Version: "1"
Description: "Raise an error when the Parameter Value Code (TSVALCD) for a TDIGRP\
  \ trial-summary parameter is not a valid SNOMED CT concept ID."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "TS"
Requirements:
  Variables:
    All:
    - "TSPARMCD"
Bindings:
- name: "$tdigrp_code_valid"
  expression: "valid_external_dictionary_code(TSVALCD, external_dictionary_type=\"\
    snomed\", dictionary_term_type=\"SNOMEDCD\")"
Check:
  expression: >-
    TSPARMCD == "TDIGRP" and $tdigrp_code_valid == false
Outcome:
  Message: "TSVALCD is not a valid SNOMED CT concept ID for the TDIGRP parameter."
  Output_Variables:
  - "TSPARMCD"
  - "TSVALCD"
Source:
  FDA_Validator_Rule_Message: "Invalid TSVALCD value for TDIGRP"
  FDA_Validator_Rule_Description: "TSVALCD for TDIGRP record must be a valid concept\
    \ ID from SNOMED CT."
  Domains: "TS"
Standards:
