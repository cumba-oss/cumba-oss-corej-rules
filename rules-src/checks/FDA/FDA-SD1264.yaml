Core:
  Id: "FDA-SD1264"
  Status: "Published"
  Version: "1"
Description: "Raise an error when IDVARVAL and USUBJID are empty but IDVAR is populated\
  \ with a --SEQ value."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "RELREC"
Check:
  expression: >-
    empty(IDVARVAL) and empty(USUBJID) and ends_with(IDVAR, "SEQ")
Outcome:
  Message: "IDVAR is populated with a --SEQ value when IDVARVAL and USUBJID are empty."
  Message_Folded: "IDVARVAL or USUBJID absent or not populated in any record of the\
    \ dataset, and at least one record meets the rest of the condition: IDVAR is populated\
    \ with a --SEQ value when IDVARVAL and USUBJID are empty."
  Output_Variables:
  - "RDOMAIN"
  - "RELID"
Source:
  FDA_Validator_Rule_Message: "IDVAR equals --SEQ when IDVARVAL is null and USUBJID\
    \ is null"
  FDA_Validator_Rule_Description: "When the RELREC dataset is used to identify relationships\
    \ between datasets (in which case USUBJID and IDVARVAL are left null), instead\
    \ of relating individual records, --SEQ cannot be used for IDVAR because --SEQ\
    \ only has meaning within a subject within a dataset, not across datasets."
  Domains: "RELREC"
