Core:
  Id: "FDA-SD1353"
  Status: "Published"
  Version: "1"
Description: "Raise an error when the Standardized Result in Character Format (--STRESC)\
  \ and the Result or Finding in Original Units (--ORRES) both represent numeric values\
  \ but do not equal each other, while the Standard Units (--STRESU) equal the Original\
  \ Units (--ORRESU) or both units are empty."
Executability: "Fully Executable"
Scope:
  Classes:
    Include:
    - "FINDINGS"
    - "FINDINGS ABOUT"
Requirements:
  Variables:
    All:
    - "--ORRES"
    - "--STRESC"
Check:
  expression: >-
    --ORRES =~ /^[+-]?([0-9]+\\.?[0-9]*|\\.[0-9]+)$/ and --STRESC =~
    /^[+-]?([0-9]+\\.?[0-9]*|\\.[0-9]+)$/ and (var_exists("--STRESU") and var_exists("--ORRESU") and
    --STRESU == --ORRESU or empty(--STRESU) and empty(--ORRESU)) and --STRESC != --ORRES
Outcome:
  Message: "--STRESC does not equal --ORRES when both values are numeric and --STRESU\
    \ equals --ORRESU or both units are empty."
  Message_Folded: "--ORRESU and --STRESU absent or not populated in any record of\
    \ the dataset, and at least one record meets the rest of the condition: --STRESC\
    \ does not equal --ORRES when both values are numeric and --STRESU equals --ORRESU\
    \ or both units are empty."
Source:
  FDA_Validator_Rule_Message: "--STRESC does not equal --ORRES when --STRESU is equal\
    \ to --ORRESU"
  FDA_Validator_Rule_Description: "Standardized Result in Character Format (--STRESC)\
    \ variable value should be equal to Result or Finding in Original Units (--ORRES)\
    \ variable value, when variable values are numeric and Standard Units (--STRESU)\
    \ and Original Units (--ORRESU) are populated with the same units or are null."
  Domains: "FINDINGS, FINDINGS ABOUT"
