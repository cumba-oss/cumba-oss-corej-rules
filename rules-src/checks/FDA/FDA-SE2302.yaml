Core:
  Id: "FDA-SE2302"
  Status: "Published"
  Version: "1"
Description: "Raise an error when no record with TXPARMCD equal to 'GRPLBL' ('Group\
  \ Label') is present for a SETCD in the Trial Sets (TX) domain."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "TX"
Grouping:
  Variables:
  - "SETCD"
Bindings:
- name: "$grplbl_count"
  expression: "record_count(domain=\"TX\", group=[SETCD], filter=(TXPARMCD == \"GRPLBL\"\
    ))"
Check:
  expression: >-
    $grplbl_count == 0
Outcome:
  Message: "Missing GRPLBL Trial Set Parameter: no 'Group Label' (GRPLBL) record is\
    \ present for this SETCD in the Trial Sets (TX) domain."
  Output_Variables:
  - "SETCD"
Source:
  FDA_Validator_Rule_Message: "Missing GRPLBL Trial Set Parameter within SETCD"
  FDA_Validator_Rule_Description: "'Group Label' (GRPLBL) records should be populated\
    \ for each SETCD in Trial Sets (TX) domain."
  Domains: "TX"
Standards:
- Organization: "FDA"
  Standards:
