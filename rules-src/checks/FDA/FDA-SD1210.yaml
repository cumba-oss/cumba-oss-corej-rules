Core:
  Id: "FDA-SD1210"
  Status: "Published"
  Version: "1"
Description: "Raise an error when RFICDTC is empty. RFICDTC should be populated; it\
  \ would be empty only in studies not collecting informed-consent date/time."
Executability: "Partially Executable - Possible Overreporting"
Scope:
  Domains:
    Include:
    - "DM"
Requirements:
  Variables:
    All:
    - "RFICDTC"
Check:
  expression: >-
    empty(RFICDTC)
Outcome:
  Message: "RFICDTC is empty."
  Message_Folded: "RFICDTC not populated in any record of the dataset: RFICDTC is\
    \ empty."
Source:
  FDA_Validator_Rule_Message: "Missing value for RFICDTC"
  FDA_Validator_Rule_Description: "Date/Time of Informed Consent (RFICDTC) variable\
    \ value should be populated. It would be NULL only in studies not collecting this\
    \ info."
  Domains: "DM"
