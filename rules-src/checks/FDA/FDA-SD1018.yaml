Core:
  Id: "FDA-SD1018"
  Status: "Published"
  Version: "1"
Description: "Raise an error when, for a planned visit (SVUPDES is empty) in the Subject\
  \ Visits (SV) domain, the combination of Visit Number (VISITNUM), Visit Name (VISIT),\
  \ and Planned Study Day of Visit (VISITDY) does not match an entry in the Trial\
  \ Visits (TV) dataset."
Executability: "Partially Executable - Possible Overreporting"
Scope:
  Domains:
    Include:
    - "SV"
Requirements:
  Variables:
    All:
    - "VISITNUM"
Match_Datasets:
- Join_Type: "left"
  Keys:
  - "VISITNUM"
  - "VISIT"
  - "VISITDY"
  Name: "TV"
Check:
  expression: >-
    not empty(VISITNUM) and (var_exists("SVPRESP") and SVPRESP == "Y" or not var_exists("SVPRESP")
    and empty(SVUPDES) and not contains(upper(VISIT), "UNSCHEDUL") and not contains(upper(VISIT),
    "UNPLAN")) and empty(TV.VISITNUM)
Outcome:
  Message: "The combination of VISITNUM, VISIT, and VISITDY for a planned visit does\
    \ not match any entry in the Trial Visits (TV) dataset."
  Output_Variables:
  - "VISITNUM"
  - "VISIT"
  - "VISITDY"
  - "SVUPDES"
  - "TV.VISITNUM"
Source:
  FDA_Validator_Rule_Message: "VISITNUM/VISIT/VISITDY values do not match TV domain\
    \ data"
  FDA_Validator_Rule_Description: "The combination of Visit Number (VISITNUM), Visit\
    \ Name (VISIT), and Planned Study Day of Visit (VISITDY) values should match entries\
    \ in the Trial Visits (TV) dataset, when they are planned visits (SVUPDES = NULL)."
  Domains: "SV"
