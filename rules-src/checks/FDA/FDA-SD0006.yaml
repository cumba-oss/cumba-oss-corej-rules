Core:
  Id: "FDA-SD0006"
  Status: "Published"
  Version: "1"
Description: "Raise an error when a subject has no baseline observation (a record\
  \ with --BLFL equal to 'Y') in the domain, except for subjects who failed screening\
  \ (ARMCD equal to 'SCRNFAIL'), were not assigned to an Arm (ARMCD equal to 'NOTASSGN'),\
  \ or were not treated (ACTARMCD equal to 'NOTTRT')."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "EG"
    - "LB"
    - "MB"
    - "MS"
    - "PC"
    - "VS"
Requirements:
  Variables:
    All:
    - "--BLFL"
Match_Datasets:
- Keys:
  - "USUBJID"
  Name: "DM"
Grouping:
  Variables:
  - "USUBJID"
Bindings:
- name: "$blfl"
  expression: "distinct(--BLFL, group=[USUBJID])"
Check:
  expression: >-
    DM.ARMCD not in ["SCRNFAIL", "NOTASSGN"] and DM.ACTARMCD != "NOTTRT" and not contains($blfl,
    "Y")
Outcome:
  Message: "No baseline flag record (--BLFL equal to \"Y\") is present in the domain\
    \ for the subject."
  Output_Variables:
  - "$blfl"
  - "DM.ARMCD"
  - "DM.ACTARMCD"
Source:
  FDA_Validator_Rule_Message: "No baseline flag record in Domain for subject"
  FDA_Validator_Rule_Description: "All subjects should have at least one baseline\
    \ observation (--BLFL = 'Y') in EG, LB, MB, MS, PC and VS domains, except for\
    \ subjects who failed screening (ARMCD = 'SCRNFAIL') or were not fully assigned\
    \ to an Arm (ARMCD = 'NOTASSGN') or were not treated (ACTARMCD = 'NOTTRT')."
  Domains: "EG, LB, MB, MS, PC, VS"
Standards:
- Organization: "FDA"
  Standards:
  - Name: "SDTMIG"
    Version: "3.4"
    References:
    - Origin: "FDA Validator Rules"
      Rule_Identifier:
        Id: "SD0006"
        Version: "1"
      Version: "1.6"
  - Name: "SDTMIG"
    Version: "3.3"
    References:
    - Origin: "FDA Validator Rules"
      Rule_Identifier:
        Id: "SD0006"
        Version: "1"
      Version: "1.6"
  - Name: "SDTMIG"
    Version: "3.2"
    References:
    - Origin: "FDA Validator Rules"
      Rule_Identifier:
        Id: "SD0006"
        Version: "1"
      Version: "1.6"
  - Name: "SDTMIG"
    Version: "3.1.3"
