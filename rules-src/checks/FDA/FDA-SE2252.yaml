Core:
  Id: "FDA-SE2252"
  Status: "Published"
  Version: "1"
Description: "Raise an error when RSTGCD (Repro Stage Code) is longer than 8 characters."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "SJ"
    - "TP"
    - "TT"
Check:
  expression: >-
    not empty(RSTGCD) and len(RSTGCD) > 8
Outcome:
  Message: "RSTGCD is longer than 8 characters."
Source:
  FDA_Validator_Rule_Message: "Invalid value for RSTGCD"
  FDA_Validator_Rule_Description: "The value of Repro Stage Code (RSTGCD) should be\
    \ no more than 8 characters in length."
  Domains: "SJ, TP, TT"
Standards:
- Organization: "FDA"
  Standards:
  - Name: "SENDIG-DART"
    Version: "1.1"
    References:
    - Origin: "FDA Validator Rules"
      Rule_Identifier:
        Id: "SE2252"
        Version: "1"
      Version: "1.6"
