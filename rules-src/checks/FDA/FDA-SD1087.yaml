Core:
  Id: "FDA-SD1087"
  Status: "Published"
  Version: "1"
Description: "Raise an error when --STDTC is present in the dataset but --STDY is\
  \ not present."
Executability: "Fully Executable"
Scope:
  Classes:
    Include:
    - "INTERVENTIONS"
    - "SPECIAL PURPOSE"
    - "EVENTS"
    - "FINDINGS"
    - "FINDINGS ABOUT"
  Domains:
    Exclude:
    - "CO"
    - "DM"
Check:
  expression: >-
    var_exists("--STDTC") and not var_exists("--STDY")
Outcome:
  Message: "--STDY variable is not present in the dataset, but --STDTC variable is\
    \ present."
  Output_Variables:
  - "--STDTC"
Source:
  FDA_Validator_Rule_Message: "Missing --STDY variable, when --STDTC variable is present"
  FDA_Validator_Rule_Description: "Study Day of Start (--STDY) variable should be\
    \ included into dataset, when Start Study Date/Time (--STDTC) variable is present."
  Domains: "SE, SM, SV, INTERVENTIONS, EVENTS, FINDINGS, FINDINGS ABOUT"
