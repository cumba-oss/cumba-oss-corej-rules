Core:
  Id: "FDA-SD0035"
  Status: "Published"
  Version: "1"
Description: "Raise an error when Dose Units (--DOSU) is empty but Dose per Administration\
  \ (--DOSE), Dose Description (--DOSTXT) or Total Daily Dose (--DOSTOT) is provided."
Executability: "Fully Executable"
Scope:
  Classes:
    Include:
    - "INTERVENTIONS"
Requirements:
  Variables:
    All:
    - "--DOSU"
Check:
  expression: >-
    empty(--DOSU) and (var_exists("--DOSE") and not empty(--DOSE) or var_exists("--DOSTXT") and not
    empty(--DOSTXT) or var_exists("--DOSTOT") and not empty(--DOSTOT))
Outcome:
  Message: "--DOSU is empty when --DOSE, --DOSTXT or --DOSTOT is provided."
  Message_Folded: "--DOSE, --DOSTOT or --DOSTXT absent or not populated in any record\
    \ of the dataset, or --DOSU not populated in any record of the dataset, and at\
    \ least one record meets the rest of the condition: --DOSU is empty when --DOSE,\
    \ --DOSTXT or --DOSTOT is provided."
Source:
  FDA_Validator_Rule_Message: "Missing value for --DOSU, when --DOSE, --DOSTXT or\
    \ --DOSTOT is provided"
  FDA_Validator_Rule_Description: "Dose Units (--DOSU) must be populated, when Dose\
    \ per Administration (--DOSE), Dose Description (--DOSTXT) or Total Daily Dose\
    \ (--DOSTOT) is provided."
  Domains: "INTERVENTIONS"
