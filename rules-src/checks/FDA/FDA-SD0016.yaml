Core:
  Id: "FDA-SD0016"
  Status: "Published"
  Version: "1"
Description: "Raise an error when Character Result/Finding in Std Format (--STRESC)\
  \ is empty while Derived Flag (--DRVFL) is equal to 'Y'."
Executability: "Fully Executable"
Scope:
  Classes:
    Include:
    - "FINDINGS"
    - "FINDINGS ABOUT"
Requirements:
  Variables:
    All:
    - "--DRVFL"
Check:
  expression: >-
    --DRVFL == "Y" and empty(--STRESC)
Outcome:
  Message: "--STRESC is empty when --DRVFL equals 'Y'."
  Message_Folded: "--STRESC absent or not populated in any record of the dataset,\
    \ and at least one record meets the rest of the condition: --STRESC is empty when\
    \ --DRVFL equals 'Y'."
  Output_Variables:
  - "--TESTCD"
  - "!--STRESC"
Source:
  FDA_Validator_Rule_Message: "Missing value for --STRESC, when --DRVFL='Y'"
  FDA_Validator_Rule_Description: "Character Result/Finding in Std Format (--STRESC)\
    \ value should not be NULL, when Derived Flag (--DRVFL) value is 'Y'."
  Domains: "FINDINGS, FINDINGS ABOUT"
