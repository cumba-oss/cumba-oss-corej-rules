Core:
  Id: "FDA-SD1095"
  Status: "Published"
  Version: "1"
Description: "Raise an error when a split dataset name (excluding supplemental qualifier\
  \ and associated-persons datasets) has a length other than 3 or 4 characters, because\
  \ a split dataset must not reuse the name of the original domain."
Executability: "Fully Executable"
Scope:
  Domains:
    Exclude:
    - "SUPP--"
    - "SQ--"
    - "AP--"
    - "APRELSUB"
    include_split_datasets: true
Check:
  expression: >-
    len(ds_name()) < 3 or len(ds_name()) > 4
Outcome:
  Message: "Invalid dataset name for split domain: the split dataset name is not 3\
    \ or 4 characters in length."
Source:
  FDA_Validator_Rule_Message: "Invalid dataset name for split domain"
  FDA_Validator_Rule_Description: "Split datasets must not have name of original domain.\
    \ E.g., lbhm.xpt is a valid name, when lb.xpt is not a valid dataset name for\
    \ split domain."
  Domains: "INTERVENTIONS, EVENTS, FINDINGS, FINDINGS ABOUT"
