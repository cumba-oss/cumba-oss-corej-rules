Core:
  Id: "FDA-SD9708"
  Status: "Published"
  Version: "1"
Description: "Raise an error when IETESTCD is not populated."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "TI"
Requirements:
  Variables:
    All:
    - "IETESTCD"
Check:
  expression: >-
    empty(IETESTCD)
Outcome:
  Message: "IETESTCD is not populated."
  Message_Folded: "IETESTCD not populated in any record of the dataset: IETESTCD is\
    \ not populated."
Source_Proposed:
  FDA_Validator_Rule_Message: "Missing value for IETESTCD"
  FDA_Validator_Rule_Description: "IETESTCD should be populated."
  Domains: "TI"
Source:
  FDA_Validator_Rule_Message: "NULL value in variable marked as Required"
  FDA_Validator_Rule_Description: "Required variables (where Core attribute is 'Req')\
    \ cannot be NULL for any records."
  Domains: "ALL"
