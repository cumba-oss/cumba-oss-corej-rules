Core:
  Id: "FDA-SD0015"
  Status: "Published"
  Version: "1"
Description: "Raise an error when a populated Duration (--DUR) ISO 8601 value is negative."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "ALL"
Requirements:
  Variables:
    All:
    - "--DUR"
Check:
  expression: >-
    not empty(--DUR) and contains(--DUR, "-")
Outcome:
  Message: "Negative value for --DUR"
  Output_Variables:
  - "--DUR"
Source:
  FDA_Validator_Rule_Message: "Negative value for --DUR"
  FDA_Validator_Rule_Description: "Non-missing Duration of Event, Exposure or Observation\
    \ (--DUR) value must be greater than or equal to 0."
  Domains: "SE, SM, SV, INTERVENTIONS, EVENTS, FINDINGS, FINDINGS ABOUT, TE"
