Core:
  Id: "FDA-SE2327"
  Status: "Published"
  Version: "1"
Description: "Raise an error when the Trial Summary (TS) dataset does not contain\
  \ a record where TSPARMCD equals 'SPLANSUB' (Planned Number of Subjects)."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "TS"
Operations:
- id: "$splansub_count"
  expression: "record_count(filter=filter(TSPARMCD=\"SPLANSUB\"))"
Check:
  expression: >-
    $splansub_count == 0
Outcome:
  Message: "Missing SPLANSUB Trial Summary Parameter: a 'Planned Number of Subjects'\
    \ (SPLANSUB) record must be present in the Trial Summary (TS) domain."
  Output_Variables:
  - "$splansub_count"
Source:
  FDA_Validator_Rule_Message: "Missing SPLANSUB Trial Summary Parameter"
  FDA_Validator_Rule_Description: "'Planned Number of Subjects' (SPLANSUB) record\
    \ should be populated in Trial Summary (TS) domain. It is used for Janus Non Clinical\
    \ data load blocking."
  Domains: "TS"
