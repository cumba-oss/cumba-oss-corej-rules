Core:
  Id: "FDA-SE2349"
  Status: "Published"
  Version: "1"
Description: "Raise an error when --DTHREL is populated with a value other than 'Y',\
  \ 'N', or 'U'."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "MA"
    - "MI"
    - "TF"
Requirements:
  Variables:
    All:
    - "--DTHREL"
Check:
  expression: >-
    not empty(--DTHREL) and --DTHREL not in ["Y", "N", "U"]
Outcome:
  Message: "--DTHREL value is not one of the allowed values 'Y', 'N', or 'U'."
Source:
  FDA_Validator_Rule_Message: "Invalid value for --DTHREL"
  FDA_Validator_Rule_Description: "Relationship to Death (--DTHREL) describes the\
    \ relationship of a particular finding to the death of a subject. Allowed values\
    \ for this variable include: 'Y' (Caused death), 'N' (Did not cause death), or\
    \ 'U' (Unknown)."
  Domains: "MA, MI, TF"
Standards:
