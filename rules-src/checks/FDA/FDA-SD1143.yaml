Core:
  Id: "FDA-SD1143"
  Status: "Published"
  Version: "1"
Description: "Raise an error when a SUPPAE record with QNAM equal to 'AESOSP' is present\
  \ but the linked AE record does not have AESMIE equal to 'Y'."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "SUPPAE"
Requirements:
  Variables:
    All:
    - "QNAM"
    - "STUDYID"
    - "USUBJID"
    - "IDVAR"
    - "IDVARVAL"
Match_Datasets:
- Child: true
  Keys:
  - "STUDYID"
  - "USUBJID"
  - "IDVAR"
  - "IDVARVAL"
  Name: "AE"
Check:
  expression: >-
    QNAM == "AESOSP" and var_exists("AE.AESMIE") and AE.AESMIE != "Y"
Outcome:
  Message: "A SUPPAE record with QNAM equal to 'AESOSP' is present, but the linked\
    \ AE record does not have AESMIE equal to 'Y'."
Source:
  FDA_Validator_Rule_Message: "No Details info for AESMIE Adverse Event in SUPPAE\
    \ domain"
  FDA_Validator_Rule_Description: "When a description of Other Medically Important\
    \ Serious Adverse Events category is collected on a CRF, sponsors should place\
    \ the description in the SUPPAE dataset using the standard supplemental qualifier\
    \ name code AESOSP."
  Domains: "AE"
Standards:
