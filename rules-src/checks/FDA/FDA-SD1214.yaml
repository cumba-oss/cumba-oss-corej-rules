Core:
  Id: "FDA-SD1214"
  Status: "Published"
  Version: "1"
Description: "Raise an error when the Trial Summary (TS) dataset contains more than\
  \ one record where TSPARMCD equals 'ADDON'."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "TS"
Bindings:
- name: "$addon_count"
  expression: "record_count(filter=(TSPARMCD == \"ADDON\"))"
Check:
  expression: >-
    $addon_count > 1
Outcome:
  Message: "Multiple ADDON records: the Trial Summary (TS) domain must contain only\
    \ one record for the 'ADDON' parameter."
Source:
  FDA_Validator_Rule_Message: "Multiple ADDON records"
  FDA_Validator_Rule_Description: "Trial Summary (TS) domain must contain only one\
    \ record for 'ADDON' Parameter."
  Domains: "TS"
