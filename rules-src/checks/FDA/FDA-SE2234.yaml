Core:
  Id: "FDA-SE2234"
  Status: "Published"
  Version: "1"
Description: "Raise an error when the standardized result (PCSTRESC) is below the\
  \ limit of quantification ('BLQ' or 'BQL') but no PCCALCN supplemental qualifier\
  \ record is present for that record, including when the study contains no SUPPPC\
  \ dataset at all."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "PC"
Requirements:
  Variables:
    All:
    - "PCSTRESC"
Bindings:
- name: "$calcn_present"
  expression: "supp_qnam_present(domain=\"SUPPPC\", key_value=\"PCCALCN\")"
- name: "$study_datasets"
  expression: "dataset_names()"
Check:
  expression: >-
    PCSTRESC in ["BLQ", "BQL"] and (not shares_elements_with($study_datasets, keys=[SUPPPC]) or
    $calcn_present == false)
Outcome:
  Message: "PCSTRESC is below the limit of quantification (BLQ/BQL) but no SUPPPC\
    \ record with QNAM='PCCALCN' provides the numeric interpretation for that PC record."
  Output_Variables:
  - "PCTESTCD"
  - "PCSTRESC"
Source:
  FDA_Validator_Rule_Message: "No record for --CALCN when --STRESC is below LOQ"
  FDA_Validator_Rule_Description: "A numeric interpretation for calculations record\
    \ (QNAM.PCCALCN) should be included in SUPPPC when the Result or Finding in Standard\
    \ Format (PCSTRESC) is below the limit of quantification ('BLQ' or 'BQL') per\
    \ guidance in the FDA Technical Conformance Guide."
  Domains: "PC"
Standards:
- Organization: "FDA"
  Standards:
  - Name: "SENDIG"
    Version: "3.1.1"
    References:
    - Origin: "FDA Validator Rules"
      Rule_Identifier:
        Id: "SE2234"
        Version: "1"
      Version: "1.6"
  - Name: "SENDIG"
    Version: "3.1"
    References:
    - Origin: "FDA Validator Rules"
      Rule_Identifier:
        Id: "SE2234"
        Version: "1"
      Version: "1.6"
  - Name: "SENDIG"
    Version: "3.0"
    References:
    - Origin: "FDA Validator Rules"
      Rule_Identifier:
        Id: "SE2234"
        Version: "1"
      Version: "1.6"
