Core:
  Id: "FDA-SD1030"
  Status: "Published"
  Version: "1"
Description: "Raise an error when Start Relative to Reference Period (--STRF) is populated\
  \ for a subject with an empty Reference Start Date/Time (RFSTDTC) in the DM dataset."
Executability: "Fully Executable"
Scope:
  Domains:
    Exclude:
    - "DM"
Requirements:
  Variables:
    All:
    - "--STRF"
    - "USUBJID"
    All_Or_None:
    - - "USUBJID"
      - "DM.USUBJID"
Match_Datasets:
- Keys:
  - "USUBJID"
  Name: "DM"
Check:
  expression: >-
    empty(DM.RFSTDTC) and not empty(--STRF)
Outcome:
  Message: "--STRF is populated when RFSTDTC in the DM dataset is empty."
Source:
  FDA_Validator_Rule_Message: "Value for --STRF is populated, when RFSTDTC is NULL"
  FDA_Validator_Rule_Description: "Start Relative to Reference Period (--STRF) should\
    \ not be populated for subjects with missing value for Reference Start Date/Time\
    \ (RFSTDTC)."
  Domains: "SE, SM, SV, INTERVENTIONS, EVENTS, FINDINGS, FINDINGS ABOUT"
