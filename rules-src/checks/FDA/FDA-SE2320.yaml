Core:
  Id: "FDA-SE2320"
  Status: "Published"
  Version: "1"
Description: "Raise an error when --PARMCD equals 'SLENGTH' (Study Length) but --VAL\
  \ is not empty and --VAL is not in ISO 8601 format for a time period (e.g. P80Y)\
  \ in the Trial Summary (TS) or Trial Sets (TX) domain."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "TS"
    - "TX"
Requirements:
  Variables:
    All:
    - "--PARMCD"
Check:
  expression: >-
    --PARMCD == "SLENGTH" and not empty(--VAL) and invalid_duration(--VAL, negative=false)
Outcome:
  Message: "Invalid --VAL value for SLENGTH: --VAL must be in ISO 8601 format for\
    \ a time period (e.g. P80Y) or empty when --PARMCD equals 'SLENGTH'."
  Output_Variables:
  - "--PARMCD"
  - "--VAL"
Source:
  FDA_Validator_Rule_Message: "Invalid --VAL value for SLENGTH"
  FDA_Validator_Rule_Description: "TSVAL/TXVAL value must be either ISO 8601 format\
    \ for time period (e.g. P80Y) or null, when TSPARMCD/TXPARMCD='SLENGTH'."
  Domains: "TS, TX"
