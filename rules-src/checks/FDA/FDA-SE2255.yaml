Core:
  Id: "FDA-SE2255"
  Status: "Published"
  Version: "1"
Description: "Raise an error when RSTGCD (Repro Stage Code) has more than one value\
  \ for a given RSTAGE (Description of Repro Stage); RSTGCD must be unique within\
  \ a RSTAGE."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "SJ"
    - "TP"
    - "TT"
Check:
  expression: >-
    not empty(RSTAGE) and not empty(RSTGCD) and has_multiple_values_for(RSTGCD, RSTAGE)
Outcome:
  Message: "RSTGCD has more than one value for a given RSTAGE; RSTGCD must be unique\
    \ within a RSTAGE."
Source:
  FDA_Validator_Rule_Message: "Non-unique value for RSTGCD within RSTAGE"
  FDA_Validator_Rule_Description: "Repro Stage Code (RSTGCD) must have a unique value\
    \ for a given value of Description of Repro Stage (RSTAGE) within the domain."
  Domains: "SJ, TP, TT"
Standards:
- Organization: "FDA"
  Standards:
  - Name: "SENDIG-DART"
    Version: "1.1"
    References:
    - Origin: "FDA Validator Rules"
      Rule_Identifier:
        Id: "SE2255"
        Version: "1"
      Version: "1.6"
