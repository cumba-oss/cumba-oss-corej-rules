Core:
  Id: "FDA-CT2002"
  Status: "Published"
  Version: "1"
Description: "Raise an informational issue when a non-empty value is not a term in\
  \ the extensible CDISC controlled terminology codelist the CDISC Library defines\
  \ for the variable; for the laterality, directionality, portion-or-totality and\
  \ the MI, TF and EG standardised-result variables only, a semicolon-separated combination\
  \ of such terms is also accepted. A variable should be populated with terms from\
  \ its CDISC codelist; because new terms may be added to an extensible codelist,\
  \ a legitimately-added term is also flagged by this check."
Severity: "Warning"
Executability: "Partially Executable - Possible Overreporting"
ExecutabilityHint:
  Category: "partially executable"
  Detail: "The FDA row has no combination tolerance; the semicolon-combination allow-list\
    \ of CDISC-SEND-0049 (--LAT, --DIR, --PORTOT, MISTRESC, TFSTRESC, EGSTRESC; owner\
    \ ruling O-8, 2026-08-22) is mirrored here so that an FDA SEND run and a CDISC\
    \ SEND run agree on a lawful combined value such as MALAT = LEFT;RIGHT. The allow-list\
    \ is applied by variable name on every standard this rule runs on, SDTMIG included,\
    \ because the Check language has no version or standard predicate: on SDTMIG 3.4\
    \ it reaches 35 codelist-bound variables (every --LAT, --DIR, --PORTOT, plus EGSTRESC),\
    \ for which the SEND rows give no warrant and PMDA-CT2002 still reports - a declared,\
    \ owner-visible divergence pending a ruling. Every other codelist-bound variable,\
    \ --SPEC included, is held to a single term. The over-reporting this label declares\
    \ is the extensible-codelist half: a term a sponsor lawfully added is reported\
    \ for confirmation."
Scope:
  Domains:
    Include:
    - "ALL"
Check:
  expression: >-
    var_codelist_extensible("LIBRARY") == true and not empty(var_codelist_coded_values("LIBRARY"))
    and not empty(value()) and value() not in var_codelist_coded_values("LIBRARY") and
    (upper(varname()) !~ /^[A-Z0-9]{2}(LAT|DIR|PORTOT)$|^(MI|TF|EG)STRESC$/ or not
    contains_all(var_codelist_coded_values("LIBRARY"), split_by(value(), ";")))
Outcome:
  Message: "The value is not a term in the extensible CDISC controlled terminology\
    \ codelist the CDISC Library defines for this variable (a semicolon-separated\
    \ combination of terms is accepted only for --LAT, --DIR, --PORTOT, MISTRESC,\
    \ TFSTRESC and EGSTRESC); new terms may be added to an extensible codelist, so\
    \ confirm the value is not a duplicate, synonym or subset of an existing standard\
    \ term."
  Output_Variables:
  - "variable_value"
Source:
  FDA_Validator_Rule_Message: "Variable value not found in extensible codelist"
  FDA_Validator_Rule_Description: "Variable should be populated with terms from its\
    \ CDISC controlled terminology codelist. New terms can be added as long as they\
    \ are not duplicates, synonyms or subsets of existing standard terms."
  Domains: "ALL"
