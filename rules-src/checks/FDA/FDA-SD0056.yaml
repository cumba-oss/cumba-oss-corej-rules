Core:
  Id: "FDA-SD0056"
  Status: "Published"
  Version: "1"
Description: "Raise an error when a variable whose Core attribute is 'Req' (Required)\
  \ is not present in the dataset."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "ALL"
Bindings:
- name: "$required_variables"
  expression: "required_variables()"
- name: "$dataset_variables"
  expression: "get_column_order_from_dataset()"
- name: "$missing_required_variables"
  expression: "minus($required_variables, subtract=$dataset_variables)"
Check:
  expression: >-
    not contains_all($dataset_variables, $required_variables)
Outcome:
  Message: "A variable marked as Required (Core attribute 'Req') is not present in\
    \ the dataset."
  Output_Variables:
  - "$missing_required_variables"
Source:
  FDA_Validator_Rule_Message: "SDTM Required variable not found"
  FDA_Validator_Rule_Description: "Variables described in SDTM IG as Required must\
    \ be included in the dataset."
  Domains: "ALL"
