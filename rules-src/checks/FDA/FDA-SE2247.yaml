Core:
  Id: "FDA-SE2247"
  Status: "Published"
  Version: "1"
Description: "Raise an error when the TP (Trial Repro Paths) dataset is not present\
  \ in the study."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "ALL"
Check:
  expression: >-
    not ds_exists("TP")
Outcome:
  Message: "The TP (Trial Repro Paths) dataset is not present in the study."
Source:
  FDA_Validator_Rule_Message: "Missing TP dataset"
  FDA_Validator_Rule_Description: "Trial Repro Paths (TP) dataset should be included\
    \ for nonclinical Developmental and Reproductive Toxicology (DART) studies."
  Domains: "TP"
Standards:
- Organization: "FDA"
  Standards:
  - Name: "SENDIG-DART"
    Version: "1.1"
    References:
    - Origin: "FDA Validator Rules"
      Rule_Identifier:
        Id: "SE2247"
        Version: "1"
      Version: "1.6"
    - Origin: "FDA Business Rules"
      Rule_Identifier:
        Id: "FDAB011"
        Version: "1"
      Version: "1.5"
