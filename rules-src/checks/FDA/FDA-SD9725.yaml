Core:
  Id: "FDA-SD9725"
  Status: "Published"
  Version: "1"
Description: "Raise an error when neither a Planned Start of Assessment Interval (--STINT)\
  \ nor a Planned End of Assessment Interval (--ENINT) variable is present in the\
  \ dataset although --TEST references a 'T1 to T2' interval."
Sensitivity: "Dataset"
Executability: "Partially Executable - Possible Overreporting"
Scope:
  Domains:
    Include:
    - "PP"
Requirements:
  Variables:
    None:
    - "--STINT"
    - "--ENINT"
    All:
    - "--TEST"
Check:
  expression: >-
    --TEST =~ /.+ to .+/
Outcome:
  Message: "Neither --STINT nor --ENINT is present in the dataset although --TEST\
    \ references a 'T1 to T2' interval."
  Output_Variables:
  - "--TESTCD"
Source_Proposed:
  Sheet_Issue: "#199"
  FDA_Validator_Rule_Message: "Neither --STINT nor --ENINT variable is present in\
    \ the dataset when --TEST references 'T1 to T2'"
  FDA_Validator_Rule_Description: "The Planned Start of Assessment Interval (--STINT)\
    \ and Planned End of Assessment Interval (--ENINT) variables must be present in\
    \ the dataset when Name of Measurement, Test or Examination (--TEST) is over a\
    \ time interval, 'T1 to T2'."
  Domains: "PP"
Standards:
- Organization: "FDA"
  Standards:
  - Name: "SDTMIG"
    Version: "3.4"
  - Name: "SDTMIG"
    Version: "3.3"
  - Name: "SDTMIG"
    Version: "3.2"
  - Name: "SDTMIG"
    Version: "3.1.3"
  - Name: "SDTMIG"
    Version: "3.1.2"
  - Name: "SENDIG"
    Version: "3.1.1"
  - Name: "SENDIG"
    Version: "3.1"
  - Name: "SENDIG"
    Version: "3.0"
  - Name: "SENDIG-AR"
    Version: "1.0"
  - Name: "SENDIG-DART"
    Version: "1.1"
