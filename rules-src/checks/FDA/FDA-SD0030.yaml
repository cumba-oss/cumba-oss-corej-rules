Core:
  Id: "FDA-SD0030"
  Status: "Published"
  Version: "1"
Description: "Raise an error when Standard Units (--STRESU) is provided but Character\
  \ Result/Finding in Std Units (--STRESC) is empty."
Executability: "Fully Executable"
Scope:
  Classes:
    Include:
    - "FINDINGS"
    - "FINDINGS ABOUT"
Requirements:
  Variables:
    All:
    - "--STRESU"
Check:
  expression: >-
    not empty(--STRESU) and empty(--STRESC)
Outcome:
  Message: "--STRESC is empty when --STRESU is provided."
  Message_Folded: "--STRESC absent or not populated in any record of the dataset,\
    \ and at least one record meets the rest of the condition: --STRESC is empty when\
    \ --STRESU is provided."
Source:
  FDA_Validator_Rule_Message: "Missing value for --STRESC, when --STRESU is provided"
  FDA_Validator_Rule_Description: "Character Result/Finding in Std Units (--STRESC)\
    \ should not be NULL, when Standard Units (--STRESU) is provided."
  Domains: "FINDINGS, FINDINGS ABOUT"
