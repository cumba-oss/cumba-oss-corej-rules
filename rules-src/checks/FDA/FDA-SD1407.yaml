Core:
  Id: "FDA-SD1407"
  Status: "Published"
  Version: "1"
Description: "Raise an error when the Challenge Agent Characterization (AC) dataset\
  \ does not contain a record where ACPARMCD equals 'CAGTSUPA' (Challenge Agent Supplier\
  \ Address)."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "AC"
Bindings:
- name: "$parm_count"
  expression: "record_count(filter=(ACPARMCD == \"CAGTSUPA\"))"
Check:
  expression: >-
    $parm_count < 1
Outcome:
  Message: "A 'Challenge Agent Supplier Address' (CAGTSUPA) record is not present\
    \ in the AC domain."
  Output_Variables:
  - "$parm_count"
Source:
  FDA_Validator_Rule_Message: "Missing CAGTSUPA Challenge Agent Parameter"
  FDA_Validator_Rule_Description: "'Challenge Agent Supplier Address' (CAGTSUPA) record\
    \ must be populated in Challenge Agent Characterization (AC) domain."
  Domains: "AC"
Standards:
- Organization: "FDA"
  Standards:
  - Name: "SENDIG-AR"
    Version: "1.0"
    References:
    - Origin: "FDA Validator Rules"
      Rule_Identifier:
        Id: "SD1407"
        Version: "1"
      Version: "1.6"
