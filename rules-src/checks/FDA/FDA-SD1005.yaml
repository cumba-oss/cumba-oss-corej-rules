Core:
  Id: "FDA-SD1005"
  Status: "Published"
  Version: "1"
Description: "Raise an error when STUDYID does not match the STUDYID value in the\
  \ DM domain."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "ALL"
Bindings:
- name: "$dm_studyid"
  expression: "distinct(STUDYID, domain=\"DM\")"
Check:
  expression: >-
    STUDYID not in $dm_studyid
Outcome:
  Message: "STUDYID does not match the STUDYID in the DM domain."
  Output_Variables:
  - "STUDYID"
  - "$dm_studyid"
Source:
  FDA_Validator_Rule_Message: "Invalid STUDYID"
  FDA_Validator_Rule_Description: "Study Identifier (STUDYID) values must match the\
    \ STUDYID in Demographics (DM) domain."
  Domains: "ALL"
