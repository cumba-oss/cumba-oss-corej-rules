Core:
  Id: "FDA-SD1387"
  Status: "Published"
  Version: "1"
Description: "Raise an error when Day of Obs Relative to Exposure (--XDY) is populated\
  \ but the date portion of Date/Time of Collection (--DTC) or of Date/Time of First\
  \ Study Treatment (RFXSTDTC) is not a complete date, i.e. empty, invalid, or only\
  \ partially specified, indicating the study day value was imputed."
Executability: "Fully Executable"
Scope:
  Classes:
    Include:
    - "INTERVENTIONS"
    - "EVENTS"
    - "FINDINGS"
    - "FINDINGS ABOUT"
Requirements:
  Variables:
    All:
    - "--XDY"
    - "--DTC"
    - "USUBJID"
    All_Or_None:
    - - "USUBJID"
      - "DM.USUBJID"
Match_Datasets:
- Keys:
  - "USUBJID"
  Name: "DM"
Check:
  expression: >-
    not empty(--XDY) and (not is_complete_date_part(--DTC) or not
    is_complete_date_part(DM.RFXSTDTC))
Outcome:
  Message: "Day of Obs Relative to Exposure (--XDY) is populated but --DTC and/or\
    \ RFXSTDTC is empty or an incomplete date; the value appears imputed."
  Output_Variables:
  - "--DTC"
  - "--XDY"
  - "DM.RFXSTDTC"
Source:
  FDA_Validator_Rule_Message: "--XDY variable value is imputed"
  FDA_Validator_Rule_Description: "Day of Obs relative to Exposure (--XDY) variable\
    \ value should not be imputed. It may only be populated, when both Date/Time of\
    \ Collection (--DTC) and Date/Time of First Study Treatment (RFXSTDTC) variables\
    \ values are provided and both of them include complete date parts."
  Domains: "INTERVENTIONS, FINDINGS, EVENTS, FINDINGS ABOUT"
Standards:
- Organization: "FDA"
  Standards:
  - Name: "SENDIG-AR"
    Version: "1.0"
    References:
    - Origin: "FDA Validator Rules"
      Rule_Identifier:
        Id: "SD1387"
        Version: "1"
      Version: "1.6"
