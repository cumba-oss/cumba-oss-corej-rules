Core:
  Id: "FDA-SD0004-A"
  Status: "Published"
  Version: "1"
Description: "Raise an error when the Domain Abbreviation (DOMAIN) value of an Associated\
  \ Persons dataset is not consistent with the name of the dataset (the dataset name\
  \ does not begin with the four-character DOMAIN value)."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "AP--"
    Exclude:
    - "APRELSUB"
Requirements:
  Variables:
    All:
    - "DOMAIN"
Check:
  expression: >-
    prefix(dataset_name, 4) != DOMAIN
Outcome:
  Message: "Inconsistent value for DOMAIN"
Source_Proposed:
  FDA_Validator_Rule_Message: "Inconsistent value for DOMAIN"
  FDA_Validator_Rule_Description: "The Domain Abbreviation (DOMAIN) value of an Associated\
    \ Persons dataset is not consistent with the name of the dataset (the dataset\
    \ name does not begin with the four-character DOMAIN value)."
  Domains: "AP--"
Source:
  FDA_Validator_Rule_Message: "Inconsistent value for DOMAIN"
  FDA_Validator_Rule_Description: "Domain Abbreviation (DOMAIN) variable should be\
    \ consistent with the name of the dataset."
  Domains: "ALL"
