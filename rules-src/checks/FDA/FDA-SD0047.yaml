Core:
  Id: "FDA-SD0047"
  Status: "Published"
  Version: "1"
Description: "Raise an error when --ORRES is empty and --STAT is not present or not\
  \ equal to 'NOT DONE' and --DRVFL is not present or not equal to 'Y'."
Executability: "Fully Executable"
Scope:
  Classes:
    Include:
    - "FINDINGS"
    - "FINDINGS ABOUT"
Requirements:
  Variables:
    All:
    - "--ORRES"
Check:
  expression: >-
    (not var_exists("--STAT") or --STAT != "NOT DONE") and (not var_exists("--DRVFL") or --DRVFL !=
    "Y") and empty(--ORRES)
Outcome:
  Message: "--ORRES is empty when --STAT or --DRVFL is not populated."
  Output_Variables:
  - "!--ORRES"
Source:
  FDA_Validator_Rule_Message: "Missing value for --ORRES, when --STAT or --DRVFL is\
    \ not populated"
  FDA_Validator_Rule_Description: "Status (--STAT) should be set to 'NOT DONE' or\
    \ Derived Flag (--DRVFL) should have a value of 'Y', when Result or Finding in\
    \ Original Units (--ORRES) is NULL."
  Domains: "FINDINGS, FINDINGS ABOUT"
