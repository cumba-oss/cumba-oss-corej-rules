Core:
  Id: "FDA-SE9702"
  Status: "Published"
  Version: "1"
Description: "Raise an error when SETCD is not populated."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "TX"
Requirements:
  Variables:
    All:
    - "SETCD"
Check:
  expression: >-
    empty(SETCD)
