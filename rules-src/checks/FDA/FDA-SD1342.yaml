Core:
  Id: "FDA-SD1342"
  Status: "Published"
  Version: "1"
Description: "Raise an error when RFXSTDTC is empty but RFXENDTC is populated."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "DM"
Requirements:
  Variables:
    All:
    - "RFXSTDTC"
Check:
  expression: >-
    not empty(RFXENDTC) and empty(RFXSTDTC)
Outcome:
  Message: "RFXSTDTC is empty but RFXENDTC is populated."
Source:
  FDA_Validator_Rule_Message: "Missing value for RFXSTDTC, when RFXENDTC is provided"
  FDA_Validator_Rule_Description: "Date/Time of First Study Treatment (RFXSTDTC) variable\
    \ must be populated, when Date/Time of Last Study Treatment (RFXENDTC)variable\
    \ value is provided."
  Domains: "DM"
