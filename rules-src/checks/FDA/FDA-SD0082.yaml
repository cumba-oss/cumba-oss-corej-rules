Core:
  Id: "FDA-SD0082"
  Status: "Published"
  Version: "1"
Description: "Raise an error when the Exposure End Date/Time (EXENDTC) is after the\
  \ latest Disposition Event start date (the maximum DSSTDTC in the DS domain) for\
  \ the subject."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "EX"
Operations:
- id: "$max_ds_dsstdtc"
  expression: "max_date(DSSTDTC, domain=\"DS\", group=[USUBJID])"
Check:
  expression: >-
    not empty(EXENDTC) and date(EXENDTC) > $max_ds_dsstdtc
Outcome:
  Message: "EXENDTC is after the latest Disposition start date (maximum DS.DSSTDTC)\
    \ for the subject."
  Output_Variables:
  - "EXENDTC"
  - "$max_ds_dsstdtc"
Source:
  FDA_Validator_Rule_Message: "Exposure end date is after the latest Disposition date"
  FDA_Validator_Rule_Description: "End Date/Time of Treatment (EXENDTC) should be\
    \ less than or equal to the Start Date/Time of the latest Disposition Event (DSSTDTC)."
  Domains: "EX"
