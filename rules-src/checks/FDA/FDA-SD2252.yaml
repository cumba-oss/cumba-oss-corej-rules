Core:
  Id: "FDA-SD2252"
  Status: "Published"
  Version: "1"
Description: "Raise an error when the Parameter Value (TSVAL) and its code (TSVALCD)\
  \ for a CURTRT (Current Therapy or Treatment) trial-summary parameter are not the\
  \ decode and code of the same FDA-SRS (UNII) substance record."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "TS"
Requirements:
  Variables:
    All:
    - "TSPARMCD"
Bindings:
- name: "$curtrt_pair_valid"
  expression: "valid_external_dictionary_code_term_pair(TSVALCD, TSVAL, external_dictionary_type=\"\
    unii\")"
Check:
  expression: >-
    TSPARMCD == "CURTRT" and $curtrt_pair_valid == false
Outcome:
  Message: "TSVAL and TSVALCD do not reference the same FDA-SRS record for the CURTRT\
    \ parameter."
  Output_Variables:
  - "TSPARMCD"
  - "TSVAL"
  - "TSVALCD"
Source:
  FDA_Validator_Rule_Message: "TSVAL/TSVALCD value mismatch for CURTRT"
  FDA_Validator_Rule_Description: "TSVAL and TSVALCD values must be populated from\
    \ the same name record in FDA Substance Registration System (SRS)."
  Domains: "TS"
