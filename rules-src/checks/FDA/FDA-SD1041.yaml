Core:
  Id: "FDA-SD1041"
  Status: "Published"
  Version: "1"
Description: "Raise an error when --SCAT is populated and equal to --CAT."
Executability: "Fully Executable"
Scope:
  Classes:
    Include:
    - "EVENTS"
    - "INTERVENTIONS"
    - "FINDINGS"
    - "FINDINGS ABOUT"
Requirements:
  Variables:
    All:
    - "--SCAT"
    - "--CAT"
Check:
  expression: >-
    not empty(--SCAT) and --SCAT == --CAT
Outcome:
  Message: "--CAT and --SCAT values are identical."
Source:
  FDA_Validator_Rule_Message: "Values for --CAT and --SCAT are identical"
  FDA_Validator_Rule_Description: "Values of Category (--CAT) and Subcategory (--SCAT)\
    \ variables should not be identical."
  Domains: "INTERVENTIONS, EVENTS, FINDINGS, FINDINGS ABOUT, TI"
