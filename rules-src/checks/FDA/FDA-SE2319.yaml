Core:
  Id: "FDA-SE2319"
  Status: "Published"
  Version: "1"
Description: "Raise an error when a subject has no baseline observation (a record\
  \ with --BLFL equal to 'Y') in the domain."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "EG"
    - "LB"
    - "VS"
Requirements:
  Variables:
    All:
    - "--BLFL"
Grouping:
  Variables:
  - "USUBJID"
Bindings:
- name: "$blfl"
  expression: "distinct(--BLFL, group=[USUBJID])"
Check:
  expression: >-
    not contains($blfl, "Y")
Outcome:
  Message: "No baseline observation (a record with --BLFL equal to 'Y') is present\
    \ in the domain for the subject."
  Output_Variables:
  - "$blfl"
Source:
  FDA_Validator_Rule_Message: "No baseline flag record in Domain for subject"
  FDA_Validator_Rule_Description: "All subjects should have at least one baseline\
    \ observation (--BLFL = 'Y') in EG, LB, and VS domains."
  Domains: "EG, LB, VS"
Standards:
- Organization: "FDA"
  Standards:
  - Name: "SENDIG"
    Version: "3.1.1"
    References:
    - Origin: "FDA Validator Rules"
      Rule_Identifier:
        Id: "SE2319"
        Version: "1"
      Version: "1.6"
  - Name: "SENDIG"
    Version: "3.1"
