Core:
  Id: "FDA-SD2256"
  Status: "Published"
  Version: "1"
Description: "Raise an error when TSVCDREF is not equal to 'UNII' for a record where\
  \ TSPARMCD equals 'COMPTRT' (Comparative Treatment)."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "TS"
Requirements:
  Variables:
    All:
    - "TSPARMCD"
    - "TSVCDREF"
Check:
  expression: >-
    TSPARMCD == "COMPTRT" and TSVCDREF != "UNII"
Outcome:
  Message: "Invalid TSVCDREF value for COMPTRT: TSVCDREF must equal 'UNII' when TSPARMCD\
    \ equals 'COMPTRT'."
Source:
  FDA_Validator_Rule_Message: "Invalid TSVCDREF value for COMPTRT"
  FDA_Validator_Rule_Description: "TSVCDREF variable value must be 'UNII', when TSPARMCD='COMPTRT'."
  Domains: "TS"
