Core:
  Id: "FDA-SD1086"
  Status: "Published"
  Version: "1"
Description: "Raise an error when the Collection Study Day (--DY) is populated and\
  \ both the date portion of --DTC and the date portion of RFSTDTC are complete, but\
  \ --DY does not equal the value computed by the CDISC study day algorithm."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "ALL"
Requirements:
  Variables:
    All:
    - "--DTC"
    - "--DY"
    - "USUBJID"
    All_Or_None:
    - - "USUBJID"
      - "DM.USUBJID"
Match_Datasets:
- Keys:
  - "USUBJID"
  Name: "DM"
Bindings:
- name: "$value_dy_algorithm"
  expression: "dy(--DTC)"
Check:
  expression: >-
    not empty(--DY) and is_complete_date_part(--DTC) and is_complete_date_part(DM.RFSTDTC) and --DY
    != $value_dy_algorithm
Outcome:
  Message: "Incorrect value for --DY variable: it is not populated as defined by the\
    \ CDISC study day algorithm."
  Output_Variables:
  - "$value_dy_algorithm"
  - "--DTC"
  - "--DY"
  - "DM.RFSTDTC"
Source:
  FDA_Validator_Rule_Message: "Incorrect value for --DY variable"
  FDA_Validator_Rule_Description: "Collection Study Day (--DY) variable value should\
    \ be populated as defined by CDISC standards: --DY = (date portion of --DTC) -\
    \ (date portion of RFSTDTC) +1 if --DTC is on or after RFSTDTC; --DY = (date portion\
    \ of --DTC) - (date portion of RFSTDTC) if --DTC precedes RFSTDTC."
  Domains: "CO, DI, DM, DR, SE, SM, SV, INTERVENTIONS, EVENTS, FINDINGS, FINDINGS\
    \ ABOUT"
