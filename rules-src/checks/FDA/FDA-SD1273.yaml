Core:
  Id: "FDA-SD1273"
  Status: "Published"
  Version: "1"
Description: "Raise an error when --TRT is equal to 'OTHER'."
Executability: "Fully Executable"
Scope:
  Classes:
    Include:
    - "INTERVENTIONS"
Requirements:
  Variables:
    All:
    - "--TRT"
Check:
  expression: >-
    --TRT == "OTHER"
Outcome:
  Message: "--TRT is equal to 'OTHER'."
Source:
  FDA_Validator_Rule_Message: "--TRT equals 'OTHER'"
  FDA_Validator_Rule_Description: "Name of Treatment variables (--TRT) should not\
    \ be populated with values of 'OTHER'."
  Domains: "INTERVENTIONS"
