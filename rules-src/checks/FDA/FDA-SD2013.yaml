Core:
  Id: "FDA-SD2013"
  Status: "Published"
  Version: "1"
Description: "Raise an error when a High Level Group Term Code (--HLGTCD) value is\
  \ not a valid High Level Group Term code in the MedDRA dictionary."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "AE"
    - "CE"
    - "MH"
Requirements:
  Variables:
    All:
    - "--HLGTCD"
Operations:
- id: "$hlgtcd_valid"
  expression: "valid_external_dictionary_code(--HLGTCD, external_dictionary_type=\"\
    meddra\", dictionary_term_type=\"HLGTCD\")"
Check:
  expression: >-
    $hlgtcd_valid == false
Outcome:
  Message: "High Level Group Term Code (--HLGTCD) is not a valid MedDRA High Level\
    \ Group Term code."
  Output_Variables:
  - "--HLGTCD"
Source:
  FDA_Validator_Rule_Message: "Value for --HLGTCD not found in MedDRA dictionary"
  FDA_Validator_Rule_Description: "Value for High Level Group Term Code (--HLGTCD)\
    \ variable must be populated using a High Level Group Term Code of the MedDRA\
    \ dictionary of a version specified in the define.xml."
  Domains: "AE, CE, MH"
