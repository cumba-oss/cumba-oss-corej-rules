Core:
  Id: "FDA-SD2002"
  Status: "Published"
  Version: "1"
Description: "Raise an error when Actual Arm Code (ACTARMCD) is populated and its\
  \ value does not match an Arm Code (ARMCD) entry in the Trial Arms (TA) dataset.\
  \ Subjects who failed screening ('SCRNFAIL'), were not assigned to an Arm ('NOTASSGN'),\
  \ were randomized but not treated ('NOTTRT'), or received non-planned treatment\
  \ ('UNPLAN') are expected exceptions and are excluded from the check."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "DM"
Requirements:
  Variables:
    All:
    - "ACTARMCD"
Bindings:
- name: "$ta_armcd"
  expression: "distinct(ARMCD, domain=\"TA\")"
Check:
  expression: >-
    not empty(ACTARMCD) and ACTARMCD not in $ta_armcd and ACTARMCD not in ["SCRNFAIL", "NOTASSGN",
    "NOTTRT", "UNPLAN"]
Outcome:
  Message: "ACTARMCD is not among the values of ARMCD in the TA dataset."
  Output_Variables:
  - "ACTARMCD"
  - "$ta_armcd"
Source:
  FDA_Validator_Rule_Message: "Invalid value for ACTARMCD"
  FDA_Validator_Rule_Description: "Actual Arm Code (ACTARMCD) values should match\
    \ entries in the Trial Arms (TA) dataset, except for subjects who failed screening\
    \ ('SCRNFAIL'),  or were not fully assigned to an Arm ('NOTASSGN'),  or randomized\
    \ but not treated ('NOTTRT'), or received non-planned treatment ('UNPLAN')."
  Domains: "DM"
