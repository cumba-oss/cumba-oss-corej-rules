Core:
  Id: "FDA-SD1320"
  Status: "Published"
  Version: "1"
Description: "Raise an error when the Character Result/Finding in Std Format (--STRESC)\
  \ is not populated while the Completion Status (--STAT) is not populated."
Executability: "Fully Executable"
Scope:
  Classes:
    Include:
    - "FINDINGS"
    - "FINDINGS ABOUT"
Requirements:
  Variables:
    All:
    - "--STRESC"
Check:
  expression: >-
    empty(--STAT) and empty(--STRESC)
Outcome:
  Message: "--STRESC is empty when --STAT is empty."
Source:
  FDA_Validator_Rule_Message: "Missing value for --STRESC, when --STAT is null"
  FDA_Validator_Rule_Description: "Character Result/Finding in Std Format (--STRESC)\
    \ value should not be NULL, when Completion Status (--STAT) value is NULL."
  Domains: "FINDINGS, FINDINGS ABOUT"
