Core:
  Id: "FDA-SD1127"
  Status: "Published"
  Version: "1"
Description: "Raise an error when --TPTNUM, --TPT, --TPTREF, and VISITNUM are present\
  \ and --TPTNUM does not have the same value across records with the same combination\
  \ of --TPT, --TPTREF, and VISITNUM."
Executability: "Fully Executable"
Scope:
  Classes:
    Include:
    - "INTERVENTIONS"
    - "EVENTS"
    - "FINDINGS"
    - "FINDINGS ABOUT"
    - "SPECIAL PURPOSE"
  Domains:
    Exclude:
    - "DM"
    - "SE"
    - "SM"
    - "SV"
Requirements:
  Variables:
    All:
    - "--TPTNUM"
    - "--TPT"
    - "--TPTREF"
Check:
  expression: >-
    var_exists("VISITNUM") and is_inconsistent_across_dataset(--TPTNUM, keys=[--TPT, --TPTREF,
    VISITNUM])
Outcome:
  Message: "Inconsistent value for --TPTNUM within --TPT, --TPTREF, VISITNUM"
Source:
  FDA_Validator_Rule_Message: "Inconsistent value for --TPTNUM within --TPT, --TPTREF,\
    \ VISITNUM"
  FDA_Validator_Rule_Description: "All values of Planned Time Point Number (--TPTNUM)\
    \ variable should be the same for a given value of Planned Time Point Name (--TPT)\
    \ variable, Time Point Reference (--TPTREF) variable, and Visit Number (VISITNUM)\
    \ variable."
  Domains: "CO, INTERVENTIONS, EVENTS, FINDINGS, FINDINGS ABOUT"
