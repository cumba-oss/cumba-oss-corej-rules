Core:
  Id: "FDA-SE2210"
  Status: "Published"
  Version: "1"
Description: "Raise an error when the Trial Summary (TS) dataset does not contain\
  \ a record where TSPARMCD equals 'SNDCTVER' (SEND Control Terminology Version)."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "TS"
Bindings:
- name: "$sndctver_count"
  expression: "record_count(filter=(TSPARMCD == \"SNDCTVER\"))"
Check:
  expression: >-
    $sndctver_count == 0
Outcome:
  Message: "Missing SNDCTVER Trial Summary Parameter: a 'SEND Control Terminology\
    \ Version' (SNDCTVER) record must be present in the Trial Summary (TS) domain."
Source:
  FDA_Validator_Rule_Message: "Missing SNDCTVER Trial Summary Parameter"
  FDA_Validator_Rule_Description: "'SEND Control Terminology Version' (SNDCTVER) record\
    \ should be populated in Trial Summary (TS) domain."
  Domains: "TS"
