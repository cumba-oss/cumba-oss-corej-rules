Core:
  Id: "FDA-SD9751"
  Status: "Published"
  Version: "1"
Description: "Raise an error when the TI (Trial Inclusion/Exclusion Criteria) dataset\
  \ is not present in the study."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "ALL"
Check:
  expression: >-
    not ds_exists("TI")
Outcome:
  Message: "The TI (Trial Inclusion/Exclusion Criteria) dataset is not present in\
    \ the study."
Source_Proposed:
  Sheet_Issue: "#289"
  FDA_Validator_Rule_Message: "Missing TI dataset"
  FDA_Validator_Rule_Description: "Trial Inclusion/Exclusion Criteria (TI) dataset\
    \ should be included in every submission."
  Domains: "TI"
