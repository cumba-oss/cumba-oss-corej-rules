Core:
  Id: "FDA-SD1229"
  Status: "Published"
  Version: "1"
Description: "Raise an error when a value is not populated for a record whose applicable\
  \ value-level condition (Define-XML VLM) declares the value-level metadata as mandatory."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "ALL"
Check:
  expression: >-
    vlm_mandatory(variable_name) == "Yes" and empty(value())
Outcome:
  Message: "The value is not populated although the applicable value-level condition\
    \ in the Define-XML declares it mandatory."
Source:
  FDA_Validator_Rule_Message: "Variable value is null when value-level condition occurs"
  FDA_Validator_Rule_Description: "Variable value must be populated when value level\
    \ attribute Mandatory='Yes' as specified in define.xml file."
  Domains: "ALL"
