Core:
  Id: "FDA-SD9738"
  Status: "Published"
  Version: "1"
Description: "Raise an error when Total Daily Dose (--DOSTOT) is populated and its\
  \ value is less than 0."
Executability: "Fully Executable"
Scope:
  Classes:
    Include:
    - "INTERVENTIONS"
Requirements:
  Variables:
    All:
    - "--DOSTOT"
Check:
  expression: >-
    not empty(--DOSTOT) and --DOSTOT < 0
Outcome:
  Message: "Negative value for --DOSTOT."
  Output_Variables:
  - "--DOSTOT"
Source_Proposed:
  Sheet_Issue: "#260"
  FDA_Validator_Rule_Message: "Negative value for --DOSTOT"
  FDA_Validator_Rule_Description: "The value of Total Daily Dose (--DOSTOT) must not\
    \ be negative."
  Domains: "INTERVENTIONS"
