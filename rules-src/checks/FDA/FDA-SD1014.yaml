Core:
  Id: "FDA-SD1014"
  Status: "Published"
  Version: "1"
Description: "Raise an error when a populated Order of Element within Arm (TAETORD)\
  \ value does not match any TAETORD value in the Trial Arms (TA) dataset."
Executability: "Fully Executable"
Scope:
  Classes:
    Include:
    - "SPECIAL PURPOSE"
    - "INTERVENTIONS"
    - "FINDINGS"
    - "EVENTS"
    - "FINDINGS ABOUT"
  Domains:
    Exclude:
    - "DM"
    - "DO"
Requirements:
  Variables:
    All:
    - "TAETORD"
Bindings:
- name: "$ta_taetord"
  expression: "distinct(TAETORD, domain=\"TA\")"
Check:
  expression: >-
    not empty(TAETORD) and TAETORD not in $ta_taetord
Outcome:
  Message: "TAETORD does not match any TAETORD value in the TA dataset."
  Output_Variables:
  - "TAETORD"
  - "$ta_taetord"
Source:
  FDA_Validator_Rule_Message: "Invalid TAETORD"
  FDA_Validator_Rule_Description: "Order of Element within Arm (TAETORD) values should\
    \ match entries in the Trial Arms (TA) dataset."
  Domains: "CO, SE, SM, SV, INTERVENTIONS, FINDINGS, EVENTS, FINDINGS ABOUT"
