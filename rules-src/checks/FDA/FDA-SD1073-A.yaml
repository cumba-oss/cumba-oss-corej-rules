Core:
  Id: "FDA-SD1073-A"
  Status: "Published"
  Version: "1"
Description: "Raise an error for each of the IG-prohibited qualifiers TRLOC, TRLAT,\
  \ TRDIR and TRPORTOT that is present in the TR dataset."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "TR"
Check:
  expression: >-
    upper(varname()) in ["TRLOC", "TRLAT", "TRDIR", "TRPORTOT"]
Outcome:
  Message: "The variable is prohibited in the TR dataset: TRLOC, TRLAT, TRDIR and\
    \ TRPORTOT are IG-prohibited qualifiers."
  Output_Variables:
  - "variable_name"
Source_Proposed:
  FDA_Validator_Rule_Message: "An IG-prohibited variable (TRLOC, TRLAT, TRDIR or TRPORTOT)\
    \ is present in the TR dataset."
  FDA_Validator_Rule_Description: "Any of the IG-prohibited qualifiers TRLOC, TRLAT,\
    \ TRDIR or TRPORTOT is present in the TR dataset."
  Domains: "TR"
Source:
  FDA_Validator_Rule_Message: "Variable prohibited for use in SDTM"
  FDA_Validator_Rule_Description: "Variables described in IG as inappropriate for\
    \ usage must be not included in the dataset."
  Domains: "ALL"
