Core:
  Id: "FDA-SD2239"
  Status: "Published"
  Version: "1"
Description: "Raise an error when Planned Time Point Name (--TPT) is not consistent\
  \ for a given Planned Time Point Number (--TPTNUM), i.e. when VISITNUM and --TPTREF\
  \ are not present and --TPT and --TPTNUM do not have a one-to-one relationship."
Executability: "Fully Executable"
Scope:
  Classes:
    Include:
    - "FINDINGS"
    - "FINDINGS ABOUT"
Requirements:
  Variables:
    All:
    - "--TPT"
    - "--TPTNUM"
Check:
  expression: >-
    not var_exists("VISITNUM") and not var_exists("--TPTREF") and not is_unique_relationship(--TPT,
    --TPTNUM)
Outcome:
  Message: "--TPT and --TPTNUM do not have a one-to-one relationship."
Source:
  FDA_Validator_Rule_Message: "Inconsistent value for --TPT"
  FDA_Validator_Rule_Description: "Planned Time Point Name (--TPT) value must be consistent\
    \ for all records with same Subject (USUBJID) and Assessment Date/Time (--DTC)."
  Domains: "FINDINGS, FINDINGS ABOUT"
