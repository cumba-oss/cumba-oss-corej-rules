Core:
  Id: "FDA-SD0045"
  Status: "Published"
  Version: "1"
Description: "Raise an error when Result Category (--RESCAT) is specified but Character\
  \ Result/Finding in Std Units (--STRESC) is empty."
Executability: "Fully Executable"
Scope:
  Classes:
    Include:
    - "FINDINGS"
    - "FINDINGS ABOUT"
Requirements:
  Variables:
    All:
    - "--RESCAT"
Check:
  expression: >-
    not empty(--RESCAT) and empty(--STRESC)
Outcome:
  Message: "--STRESC is empty when --RESCAT is provided."
  Message_Folded: "--STRESC absent or not populated in any record of the dataset,\
    \ and at least one record meets the rest of the condition: --STRESC is empty when\
    \ --RESCAT is provided."
Source:
  FDA_Validator_Rule_Message: "Missing value for --STRESC, when --RESCAT is populated"
  FDA_Validator_Rule_Description: "Character Result/Finding in Std Units (--STRESC)\
    \ should be provided, when Result Category (--RESCAT) is specified."
  Domains: "FINDINGS, FINDINGS ABOUT"
