Core:
  Id: "FDA-SD1203"
  Status: "Published"
  Version: "1"
Description: "Raise an error when --DTC is populated and is after DM.RFPENDTC (Date/Time\
  \ of End of Participation)."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "ALL"
Requirements:
  Variables:
    All:
    - "--DTC"
Match_Datasets:
- Keys:
  - "USUBJID"
  Name: "DM"
Check:
  expression: >-
    not empty(--DTC) and not empty(DM.RFPENDTC) and date(--DTC) > DM.RFPENDTC
Outcome:
  Message: "--DTC is after DM.RFPENDTC (Date/Time of End of Participation)."
  Output_Variables:
  - "--DTC"
  - "DM.RFPENDTC"
Source:
  FDA_Validator_Rule_Message: "--DTC date is after RFPENDTC"
  FDA_Validator_Rule_Description: "Date/Time of Collection (--DTC) variable value\
    \ must be less than or equal to Date/Time of End of Participation (RFPENDTC)."
  Domains: "CO, DI, DM, DR, SE, SM, SV, INTERVENTIONS, EVENTS, FINDINGS, FINDINGS\
    \ ABOUT"
