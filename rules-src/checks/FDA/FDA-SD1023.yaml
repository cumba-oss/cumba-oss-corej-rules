Core:
  Id: "FDA-SD1023"
  Status: "Published"
  Version: "1"
Description: "Raise an error when a (VISIT, VISITNUM) combination does not match any\
  \ combination defined in the Trial Visits (TV) dataset, excluding unscheduled or\
  \ unplanned visits."
Executability: "Partially Executable - Possible Overreporting"
Scope:
  Domains:
    Exclude:
    - "TV"
Requirements:
  Variables:
    All:
    - "VISIT"
    - "VISITNUM"
    - "TV.VISIT"
    - "STUDYID"
    - "USUBJID"
    All_Or_None:
    - - "STUDYID"
      - "SV.STUDYID"
    - - "USUBJID"
      - "SV.USUBJID"
    - - "VISITNUM"
      - "SV.VISITNUM"
  Datasets:
  - "SV"
Match_Datasets:
- Join_Type: "left"
  Keys:
  - "STUDYID"
  - "USUBJID"
  - "VISITNUM"
  Name: "SV"
Bindings:
- name: "$tv_visit_keys"
  expression: "distinct([VISIT, VISITNUM], domain=\"TV\")"
Check:
  expression: >-
    not empty(VISIT) and not empty(VISITNUM) and (SV._matched_ and SV.SVPRESP == "Y" or SV._matched_
    and not var_exists(SV.SVPRESP) and empty(SV.SVUPDES) and not contains(upper(VISIT), "UNSCHEDUL")
    and not contains(upper(VISIT), "UNPLAN") or not SV._matched_ and not contains(upper(VISIT),
    "UNSCHEDUL") and not contains(upper(VISIT), "UNPLAN")) and tuple(VISIT, VISITNUM) not in
    $tv_visit_keys
Outcome:
  Message: "The (VISIT, VISITNUM) combination does not match any planned visit defined\
    \ in the Trial Visits (TV) dataset."
  Output_Variables:
  - "$tv_visit_keys"
Source:
  FDA_Validator_Rule_Message: "VISIT/VISITNUM values do not match TV domain data"
  FDA_Validator_Rule_Description: "Combination of Visit Name (VISIT) and Visit Number\
    \ (VISITNUM) in subject-level domains should match that in the TV domain with\
    \ the exception of Unscheduled and Unplanned visits."
  Domains: "ALL"
