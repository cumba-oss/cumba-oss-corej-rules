Core:
  Id: "FDA-SD1378"
  Status: "Published"
  Version: "1"
Description: "Raise an error when an Element Code (ETCD) value defined in Trial Elements\
  \ (TE) is not assigned to any Arm in the Trial Arms (TA) dataset."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "TE"
Bindings:
- name: "$ta_etcd"
  expression: "distinct(ETCD, domain=\"TA\")"
Check:
  expression: >-
    not empty(ETCD) and ETCD not in $ta_etcd
Outcome:
  Message: "ETCD value not present in TA"
  Output_Variables:
  - "ETCD"
  - "$ta_etcd"
Source:
  FDA_Validator_Rule_Message: "ETCD value not present in TA"
  FDA_Validator_Rule_Description: "Element Code (ETCD) values defined in Trial Elements\
    \ (TE) should be assigned for at least one Arm Code (ARMCD) in Trial Arms (Trial\
    \ Arms)."
  Domains: "TE"
