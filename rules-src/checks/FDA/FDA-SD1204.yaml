Core:
  Id: "FDA-SD1204"
  Status: "Published"
  Version: "1"
Description: "Raise an error when --ENDTC is populated and is after DM.RFPENDTC (Date/Time\
  \ of End of Participation)."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "ALL"
Requirements:
  Variables:
    All:
    - "--ENDTC"
    - "USUBJID"
    All_Or_None:
    - - "USUBJID"
      - "DM.USUBJID"
Match_Datasets:
- Keys:
  - "USUBJID"
  Name: "DM"
Check:
  expression: >-
    not empty(--ENDTC) and not empty(DM.RFPENDTC) and date(--ENDTC) > date(DM.RFPENDTC)
Outcome:
  Message: "--ENDTC is after DM.RFPENDTC (Date/Time of End of Participation)."
  Output_Variables:
  - "--ENDTC"
  - "DM.RFPENDTC"
Source:
  FDA_Validator_Rule_Message: "--ENDTC date is after RFPENDTC"
  FDA_Validator_Rule_Description: "End Date/Time (--ENDTC) variable value must be\
    \ less than or equal to Date/Time of End of Participation (RFPENDTC)."
  Domains: "DI, DM, DR, SE, SM, SV, INTERVENTIONS, EVENTS, FINDINGS, FINDINGS ABOUT"
