Core:
  Id: "FDA-SD1222"
  Status: "Published"
  Version: "1"
Description: "Raise an error when the Trial Summary (TS) dataset contains more than\
  \ one record where TSPARMCD equals 'PLANSUB'."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "TS"
Bindings:
- name: "$plansub_count"
  expression: "record_count(filter=(TSPARMCD == \"PLANSUB\"))"
Check:
  expression: >-
    $plansub_count > 1
Outcome:
  Message: "Multiple PLANSUB records: the Trial Summary (TS) domain must contain only\
    \ one record for the 'PLANSUB' parameter."
  Output_Variables:
  - "$plansub_count"
Source:
  FDA_Validator_Rule_Message: "Multiple PLANSUB records"
  FDA_Validator_Rule_Description: "Trial Summary (TS) domain must contain only one\
    \ record for 'PLANSUB' Parameter."
  Domains: "TS"
