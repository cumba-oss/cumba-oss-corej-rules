Core:
  Id: "FDA-SD1439"
  Status: "Published"
  Version: "1"
Description: "Raise an error when a subject has more than one record with Baseline\
  \ Flag (--BLFL) equal to 'Y' for the same assessment (the same combination of --TESTCD,\
  \ --CAT, --SCAT, --METHOD, --SPEC, --LOC, --LAT and --DIR)."
Executability: "Fully Executable"
Scope:
  Classes:
    Include:
    - "FINDINGS"
Requirements:
  Variables:
    All:
    - "--BLFL"
    - "--TESTCD"
Check:
  expression: >-
    --BLFL == "Y" and not is_unique_set([--BLFL, USUBJID, --TESTCD, --CAT, --SCAT, --METHOD, --SPEC,
    --LOC, --LAT, --DIR])
Outcome:
  Message: "Multiple BASELINE records for the same test"
Source:
  FDA_Validator_Rule_Message: "Multiple BASELINE records for the same test"
  FDA_Validator_Rule_Description: "By its definition clinical baseline flags (e.g.,\
    \ last non-missing value prior to first dose) should have only a single record\
    \ for the same test for subject. Therefore, each subject (USUBJID) should have\
    \ no more than one record with Baseline Flag (--BLFL) equals 'Y' for the same\
    \ assessment which is defined by Test (--TESTCD), Category (--CAT), Subcategory\
    \ (--SCAT), Method (--METHOD), Specimen (--SPEC), Location (--LOC), Laterality\
    \ (--LAT) and Directionality (--DIR)."
  Domains: "FINDINGS"
