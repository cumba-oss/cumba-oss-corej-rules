Core:
  Id: "FDA-SE2330"
  Status: "Published"
  Version: "1"
Description: "Raise an error when the Trial Summary (TS) dataset does not contain\
  \ a record where TSPARMCD equals 'DOSSTDTC' (Start Date/Time of Dose Interval)."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "TS"
Bindings:
- name: "$dosstdtc_count"
  expression: "record_count(filter=(TSPARMCD == \"DOSSTDTC\"))"
Check:
  expression: >-
    $dosstdtc_count == 0
Outcome:
  Message: "Missing DOSSTDTC Trial Summary Parameter: a 'Start Date/Time of Dose Interval'\
    \ (DOSSTDTC) record must be present in the Trial Summary (TS) domain."
Source:
  FDA_Validator_Rule_Message: "Missing DOSSTDTC Trial Summary Parameter"
  FDA_Validator_Rule_Description: "'Start Date/Time of Dose Interval' (DOSSTDTC) record\
    \ should be populated in Trial Summary (TS) domain."
  Domains: "TS"
