Core:
  Id: "FDA-SD1243"
  Status: "Published"
  Version: "1"
Description: "Raise an error when --BDSYCD does not have the same value across all\
  \ records that share the same value of --BODSYS, evaluated over the records where\
  \ --BODSYS is populated."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "AE"
    - "CE"
    - "MH"
Requirements:
  Variables:
    All:
    - "--BDSYCD"
    - "--BODSYS"
Check:
  expression: >-
    is_inconsistent_across_dataset(--BDSYCD, keys=[--BODSYS])
Outcome:
  Message: "--BDSYCD is not the same value across records with the same value of --BODSYS."
Source:
  FDA_Validator_Rule_Message: "Inconsistent value for --BDSYCD within --BODSYS"
  FDA_Validator_Rule_Description: "All values of Body System or Organ Class Code (--BDSYCD)\
    \ should be the same for a given value of Body System or Organ Class (--BODSYS)."
  Domains: "AE, CE, MH"
