Core:
  Id: "FDA-SE2355"
  Status: "Published"
  Version: "1"
Description: "Raise an error when --VAL is populated with a value other than 'C' or\
  \ 'F' for a record where --PARMCD equals 'ENVTEMPU' (Environmental Temperature Unit).\
  \ Applies to the TS and TX domains (TSVAL/TSPARMCD and TXVAL/TXPARMCD)."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "TS"
    - "TX"
Requirements:
  Variables:
    All:
    - "--PARMCD"
    - "--VAL"
Check:
  expression: >-
    --PARMCD == "ENVTEMPU" and not empty(--VAL) and --VAL not in ["C", "F"]
Outcome:
  Message: "Invalid --VAL value for ENVTEMPU: --VAL must be 'C' or 'F' when --PARMCD\
    \ equals 'ENVTEMPU' (Environmental Temperature Unit)."
  Output_Variables:
  - "--PARMCD"
  - "--VAL"
Source:
  FDA_Validator_Rule_Message: "Invalid --VAL value for ENVTEMPU"
  FDA_Validator_Rule_Description: "--VAL for ENVTEMPU record is the unit for the environmental\
    \ temperature.  Only values of 'C' or 'F' are acceptable."
  Domains: "TS, TX"
Standards:
- Organization: "FDA"
  Standards:
