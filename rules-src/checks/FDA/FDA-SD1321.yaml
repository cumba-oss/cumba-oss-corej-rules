Core:
  Id: "FDA-SD1321"
  Status: "Published"
  Version: "1"
Description: "Raise an error when a subject has Adverse Event (AE) records but no\
  \ treatment-emergent flag is submitted for that subject in SUPPAE (no SUPPAE record\
  \ where QNAM is equal to 'AETRTEM'), including the case where the SUPPAE dataset\
  \ is entirely absent."
Executability: "Partially Executable - Possible Overreporting"
Scope:
  Domains:
    Include:
    - "AE"
Grouping:
  Variables:
  - "USUBJID"
Bindings:
- name: "$aetrtem_count"
  expression: "record_count(domain=\"SUPPAE\", group=[USUBJID], filter=(QNAM == \"\
    AETRTEM\"))"
- name: "$study_datasets"
  expression: "dataset_names()"
Check:
  expression: >-
    not shares_elements_with($study_datasets, keys=[SUPPAE]) or $aetrtem_count < 1
Outcome:
  Message: "Subject has AE records but no treatment-emergent flag is present in SUPPAE\
    \ for that subject (no record with QNAM equal to 'AETRTEM')."
  Output_Variables:
  - "$aetrtem_count"
Source:
  FDA_Validator_Rule_Message: "No Treatment Emergent info for Adverse Event (missing\
    \ SUPPAE)"
  FDA_Validator_Rule_Description: "A treatment-emergent flag should be included in\
    \ SUPPAE according to the FDA business rule that states, 'A treatment-emergent\
    \ flag should be submitted.'"
  Domains: "AE"
Standards:
- Organization: "FDA"
  Standards:
  - Name: "SDTMIG"
    Version: "3.4"
