Core:
  Id: "FDA-SD1317"
  Status: "Published"
  Version: "1"
Description: "Raise an error when a Disposition (DS) record with Standardized Disposition\
  \ Term (DSDECOD) equal to 'DEATH' has a Start Date/Time of Event (DSSTDTC) that\
  \ is not equal to the subject's Date/Time of Death (DTHDTC) in the Demographics\
  \ (DM) dataset."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "DS"
Requirements:
  Variables:
    All:
    - "DSDECOD"
    - "STUDYID"
    - "USUBJID"
    All_Or_None:
    - - "STUDYID"
      - "DM.STUDYID"
    - - "USUBJID"
      - "DM.USUBJID"
Match_Datasets:
- Keys:
  - "STUDYID"
  - "USUBJID"
  Cardinality: "n:1"
  Name: "DM"
Check:
  expression: >-
    not empty(DSSTDTC) and DSDECOD == "DEATH" and not empty(DM.DTHDTC) and date(DSSTDTC) !=
    date(DM.DTHDTC)
Outcome:
  Message: "DSDECOD equals 'DEATH' but DSSTDTC is not equal to DTHDTC in the DM dataset."
Source:
  FDA_Validator_Rule_Message: "DSSTDTC for DEATH record is not the same as DM.DTHDTC"
  FDA_Validator_Rule_Description: "DEATH records (DSDECOD='DEATH') in the Disposition\
    \ (DS) domain should have Start Date of Event (DSSTDTC) equal to subject's Date/Time\
    \ of Death (DTHDTC) populated in the Demographics (DM) domain. Subject's Date/Time\
    \ of Death info should be consistent across all domains."
  Domains: "DS"
Standards:
