Core:
  Id: "FDA-SD1448"
  Status: "Published"
  Version: "1"
Description: "Raise an error when Standardized Result in Numeric Format (--STRESN)\
  \ is populated while Standardized Result in Character Format (--STRESC) is populated\
  \ but does not represent a numeric value."
Executability: "Fully Executable"
Scope:
  Classes:
    Include:
    - "FINDINGS"
    - "FINDINGS ABOUT"
Check:
  expression: >-
    not empty(--STRESC) and not is_numeric(--STRESC) and not empty(--STRESN)
Outcome:
  Message: "--STRESN is populated when --STRESC value is not numeric"
Source:
  FDA_Validator_Rule_Message: "--STRESN is populated when --STRESC value is not numeric"
  FDA_Validator_Rule_Description: "Standardized Result in Numeric Format (--STRESN)\
    \ variable value should be null when Standardized Result in Character Format (--STRESC)\
    \ variable value does not represent a numeric value, (e.g. 'BLQ', value contains\
    \ '<' or '>', etc.)."
  Domains: "FINDINGS, FINDINGS ABOUT"
