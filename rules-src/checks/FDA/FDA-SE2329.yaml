Core:
  Id: "FDA-SE2329"
  Status: "Published"
  Version: "1"
Description: "Raise an error when the Trial Summary (TS) dataset does not contain\
  \ a record where TSPARMCD equals 'DOSENDTC' (End Date/Time of Dose Interval)."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "TS"
Bindings:
- name: "$dosendtc_count"
  expression: "record_count(filter=filter(TSPARMCD=\"DOSENDTC\"))"
Check:
  expression: >-
    $dosendtc_count == 0
Outcome:
  Message: "Missing DOSENDTC Trial Summary Parameter: a 'End Date/Time of Dose Interval'\
    \ (DOSENDTC) record must be present in the Trial Summary (TS) domain."
  Output_Variables:
  - "$dosendtc_count"
Source:
  FDA_Validator_Rule_Message: "Missing DOSENDTC Trial Summary Parameter"
  FDA_Validator_Rule_Description: "'End Date/Time of Dose Interval' (DOSENDTC) record\
    \ should be populated in Trial Summary (TS) domain."
  Domains: "TS"
