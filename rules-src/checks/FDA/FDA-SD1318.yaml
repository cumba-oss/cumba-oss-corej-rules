Core:
  Id: "FDA-SD1318"
  Status: "Published"
  Version: "1"
Description: "Raise an error when a subject has a Disposition (DS) record with DSDECOD\
  \ equal to 'PROTOCOL VIOLATION' or 'PROTOCOL DEVIATION' but the subject has no supportive\
  \ record in the Protocol Deviations (DV) domain."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "DS"
Grouping:
  Variables:
  - "USUBJID"
Bindings:
- name: "$ds_pv_count"
  expression: "record_count(domain=\"DS\", group=[USUBJID], filter=(DSDECOD == \"\
    PROTOCOL VIOLATION\"))"
- name: "$ds_pd_count"
  expression: "record_count(domain=\"DS\", group=[USUBJID], filter=(DSDECOD == \"\
    PROTOCOL DEVIATION\"))"
- name: "$dv_count"
  expression: "record_count(domain=\"DV\", group=[USUBJID])"
Check:
  expression: >-
    ($ds_pv_count >= 1 or $ds_pd_count >= 1) and $dv_count < 1
Outcome:
  Message: "Subject has a DS record with DSDECOD equal to 'PROTOCOL VIOLATION' or\
    \ 'PROTOCOL DEVIATION' but no supportive record exists in the DV (Protocol Deviations)\
    \ domain for that subject."
Source:
  FDA_Validator_Rule_Message: "No records for subject are found in DV domain"
  FDA_Validator_Rule_Description: "Subjects who have DSDECOD = 'PROTOCOL VIOLATION'\
    \ or DSDECOD = 'PROTOCOL DEVIATION' records in the Disposition (DS) domain should\
    \ have supportive records with details in the Protocol Deviations (DV) domain."
  Domains: "DS"
