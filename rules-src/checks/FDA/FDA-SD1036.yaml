Core:
  Id: "FDA-SD1036"
  Status: "Published"
  Version: "1"
Description: "Raise an error when Toxicity Grade (--TOXGR) is not populated but Toxicity\
  \ (--TOX) is populated."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "CV"
    - "EG"
    - "FT"
    - "LB"
    - "MK"
    - "NV"
    - "OE"
    - "PC"
    - "PP"
    - "RE"
    - "UR"
    - "AE"
    - "CE"
    - "MH"
Requirements:
  Variables:
    All:
    - "--TOX"
    - "--TOXGR"
Check:
  expression: >-
    not empty(--TOX) and empty(--TOXGR)
Outcome:
  Message: "--TOXGR is empty when --TOX is populated."
  Output_Variables:
  - "--TOX"
  - "--TOXGR"
Source:
  FDA_Validator_Rule_Message: "Missing value for --TOXGR, when --TOX is populated"
  FDA_Validator_Rule_Description: "Toxicity Grade (--TOXGR) should be provided, when\
    \ Toxicity (--TOX) is populated."
  Domains: "CV, EG, FT, LB, MK, NV, OE, PC, PP, RE, UR, AE, CE, MH"
