Core:
  Id: "FDA-SD1352"
  Status: "Published"
  Version: "1"
Description: "Raise an error when an Interventions class domain contains more than\
  \ one record for the same subject (USUBJID) with the same --TRT, --DECOD, --MOOD,\
  \ --CAT, --SCAT, --ROUTE, --LOC, --TRTV, --STDTC, --TPT, and --TPTNUM values."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "AG"
    - "EC"
    - "EX"
Requirements:
  Variables:
    All:
    - "--TRT"
Check:
  expression: >-
    not is_unique_set([--TRT, USUBJID, --DECOD, --MOOD, --CAT, --SCAT, --ROUTE, --LOC, --TRTV,
    --STDTC, --TPT, --TPTNUM])
Outcome:
  Message: "Duplicate records in domain: more than one Intervention record exists\
    \ for the subject with the same key values."
Source:
  FDA_Validator_Rule_Message: "Duplicate records in domain"
  FDA_Validator_Rule_Description: "The structure of Interventions class domains should\
    \ be one record per Intervention Episode per subject. No Interventions with the\
    \ same Treatment (--TRT), Decoded Term (--DECOD), Mood (--MOOD), Category (--CAT),\
    \ Subcategory (--SCAT), Route (--ROUTE), Location (--LOC) and Treatment Vehicle\
    \ (--TRTV) values for the same Subject (USUBJID) with the same Start Date (--STDTC),\
    \ Planned Time Point Name (--TPT), and Planned Time Point Number (--TPTNUM) are\
    \ expected."
  Domains: "AG, EC, EX"
