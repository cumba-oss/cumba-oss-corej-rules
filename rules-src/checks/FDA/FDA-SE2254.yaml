Core:
  Id: "FDA-SE2254"
  Status: "Published"
  Version: "1"
Description: "Raise an error when RSTAGE (Description of Repro Stage) has more than\
  \ one value for a given RSTGCD (Repro Stage Code); RSTAGE must be unique within\
  \ a RSTGCD."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "SJ"
    - "TP"
    - "TT"
Check:
  expression: >-
    not empty(RSTAGE) and not empty(RSTGCD) and has_multiple_values_for(RSTAGE, RSTGCD)
Outcome:
  Message: "RSTAGE has more than one value for a given RSTGCD; RSTAGE must be unique\
    \ within a RSTGCD."
Source:
  FDA_Validator_Rule_Message: "Non-unique value for RSTAGE within RSTGCD"
  FDA_Validator_Rule_Description: "Description of Repro Stage (RSTAGE) must have a\
    \ unique value for a given value of Repro Stage Code (RSTGCD) within the domain."
  Domains: "SJ, TP, TT"
Standards:
- Organization: "FDA"
  Standards:
  - Name: "SENDIG-DART"
    Version: "1.1"
    References:
    - Origin: "FDA Validator Rules"
      Rule_Identifier:
        Id: "SE2254"
        Version: "1"
      Version: "1.6"
