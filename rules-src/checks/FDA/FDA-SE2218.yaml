Core:
  Id: "FDA-SE2218"
  Status: "Published"
  Version: "1"
Description: "Raise an error when the Trial Summary (TS) dataset does not contain\
  \ a record where TSPARMCD equals 'STSTDTC' (Study Start Date)."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "TS"
Bindings:
- name: "$ststdtc_count"
  expression: "record_count(filter=filter(TSPARMCD=\"STSTDTC\"))"
Check:
  expression: >-
    $ststdtc_count == 0
Outcome:
  Message: "Missing STSTDTC Trial Summary Parameter: a 'Study Start Date' (STSTDTC)\
    \ record must be present in the Trial Summary (TS) domain."
  Output_Variables:
  - "$ststdtc_count"
Source:
  FDA_Validator_Rule_Message: "Missing STSTDTC Trial Summary Parameter"
  FDA_Validator_Rule_Description: "'Study Start Date' (STSTDTC) record should be populated\
    \ in Trial Summary (TS) domain."
  Domains: "TS"
Standards:
- Organization: "FDA"
  Standards:
  - Name: "SENDIG"
    Version: "3.1.1"
    References:
    - Origin: "FDA Validator Rules"
      Rule_Identifier:
        Id: "SE2218"
        Version: "1"
      Version: "1.6"
