Core:
  Id: "FDA-SD1261"
  Status: "Published"
  Version: "1"
Description: "Raise an error when SSSTRESC is equal to 'DEAD' and SSDTC in the SS\
  \ dataset is less than DTHDTC in the DM dataset."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "SS"
Requirements:
  Variables:
    All:
    - "SSSTRESC"
Match_Datasets:
- Keys:
  - "USUBJID"
  Name: "DM"
Check:
  expression: >-
    SSSTRESC == "DEAD" and date(SSDTC) < date(DM.DTHDTC)
Outcome:
  Message: "SSDTC in the SS dataset is not greater than or equal to DTHDTC in the\
    \ DM dataset, when SSSTRESC is equal to 'DEAD'."
  Output_Variables:
  - "SSSTRESC"
  - "SSDTC"
  - "DM.DTHDTC"
Source:
  FDA_Validator_Rule_Message: "SSDTC is not greater than or equal to DTHDTC, when\
    \ SSSTRESC = 'DEAD'"
  FDA_Validator_Rule_Description: "Subject Status Date/Time of Assessment (SSDTC)\
    \ must be greater than or equal to Date/Time of Death (DTHDTC) when the subject's\
    \ status is 'DEAD'."
  Domains: "SS"
Standards:
