Core:
  Id: "FDA-SD1446"
  Status: "Published"
  Version: "1"
Description: "Raise an error when the Start Date/Time of Treatment (EXSTDTC) is after\
  \ the subject's latest Disposition (DS) start date (DSSTDTC)."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "EX"
Bindings:
- name: "$max_ds_dsstdtc"
  expression: "max_date(DSSTDTC, domain=\"DS\", group=[USUBJID])"
Check:
  expression: >-
    not empty(EXSTDTC) and not empty($max_ds_dsstdtc) and date(EXSTDTC) > $max_ds_dsstdtc
Outcome:
  Message: "Exposure start date is after the latest Disposition date"
Source:
  FDA_Validator_Rule_Message: "Exposure start date is after the latest Disposition\
    \ date"
  FDA_Validator_Rule_Description: "Start Date/Time of Treatment (EXSTDTC) should be\
    \ less than or equal to the Start Date/Time of the latest Disposition Event (DSSTDTC)."
  Domains: "EX"
Standards:
