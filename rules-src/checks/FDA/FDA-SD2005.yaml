Core:
  Id: "FDA-SD2005"
  Status: "Published"
  Version: "1"
Description: "Raise an error when the subject died (DTHFL equals 'Y') but the Date/Time\
  \ of Death (DTHDTC) is not populated."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "DM"
Requirements:
  Variables:
    All:
    - "DTHFL"
Check:
  expression: >-
    DTHFL == "Y" and empty(DTHDTC)
Outcome:
  Message: "DTHDTC is empty when DTHFL equals 'Y'."
Source:
  FDA_Validator_Rule_Message: "Missing value for DTHDTC, when DTHFL is populated"
  FDA_Validator_Rule_Description: "Date/Time of Death (DTHDTC) should be provided,\
    \ when subject died (DTHFL=Y)."
  Domains: "DM"
