Core:
  Id: "FDA-SD1269"
  Status: "Published"
  Version: "1"
Description: "Raise an error when the Randomization Quotient parameter (TSPARMCD equal\
  \ to 'RANDQT') has a populated Parameter Value (TSVAL) that is not a number greater\
  \ than 0 and less than or equal to 1."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "TS"
Requirements:
  Variables:
    All:
    - "TSPARMCD"
    - "TSVAL"
Check:
  expression: >-
    TSPARMCD == "RANDQT" and not empty(TSVAL) and (TSVAL <= 0 or TSVAL > 1 or TSVAL !~
    /^[+-]?([0-9]+(\\.[0-9]+)?|\\.[0-9]+)$/)
Outcome:
  Message: "TSVAL is populated but is not a number greater than 0 and less than or\
    \ equal to 1 when TSPARMCD equals 'RANDQT'."
  Output_Variables:
  - "TSPARMCD"
  - "TSVAL"
Source:
  FDA_Validator_Rule_Message: "TSVAL is not between 0 and 1, when TSPARMCD = 'RANDQT'"
  FDA_Validator_Rule_Description: "For the trial summary parameter Randomization Quotient\
    \ (TSPARMCD = 'RANDQT'), the value must always be a number between 0 and 1, with\
    \ some cases where the ratio might be equal to 1."
  Domains: "TS"
