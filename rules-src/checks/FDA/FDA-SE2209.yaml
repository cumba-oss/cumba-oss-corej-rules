Core:
  Id: "FDA-SE2209"
  Status: "Published"
  Version: "1"
Description: "Raise an error when the Trial Summary (TS) dataset does not contain\
  \ a record where TSPARMCD equals 'SNDIGVER' (SEND Implementation Guide Version)."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "TS"
Bindings:
- name: "$sndigver_count"
  expression: "record_count(filter=(TSPARMCD == \"SNDIGVER\"))"
Check:
  expression: >-
    $sndigver_count == 0
Outcome:
  Message: "Missing SNDIGVER Trial Summary Parameter: a 'SEND Implementation Guide\
    \ Version' (SNDIGVER) record must be present in the Trial Summary (TS) domain."
Source:
  FDA_Validator_Rule_Message: "Missing SNDIGVER Trial Summary Parameter"
  FDA_Validator_Rule_Description: "'SEND Implementation Guide Version' (SNDIGVER)\
    \ record should be populated in Trial Summary (TS) domain."
  Domains: "TS"
