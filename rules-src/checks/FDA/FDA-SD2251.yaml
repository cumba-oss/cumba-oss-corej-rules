Core:
  Id: "FDA-SD2251"
  Status: "Published"
  Version: "1"
Description: "Raise an error when the Parameter Value Code (TSVALCD) for a 'CURTRT'\
  \ trial-summary parameter is not a valid Unique Ingredient Identifier (UNII) in\
  \ the FDA Substance Registration System (SRS)."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "TS"
Requirements:
  Variables:
    All:
    - "TSPARMCD"
Bindings:
- name: "$curtrt_unii_valid"
  expression: "valid_external_dictionary_code(TSVALCD, external_dictionary_type=\"\
    unii\", dictionary_term_type=\"UNII\")"
Check:
  expression: >-
    TSPARMCD == "CURTRT" and $curtrt_unii_valid == false
Outcome:
  Message: "TSVALCD is not a valid FDA-SRS Unique Ingredient Identifier (UNII) for\
    \ the 'CURTRT' parameter."
  Output_Variables:
  - "TSPARMCD"
  - "TSVALCD"
Source:
  FDA_Validator_Rule_Message: "Invalid TSVALCD value for CURTRT"
  FDA_Validator_Rule_Description: "TSVALCD for CURTRT record must be a valid unique\
    \ ingredient identifier from FDA Substance Registration System (SRS)."
  Domains: "TS"
