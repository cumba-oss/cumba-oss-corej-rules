Core:
  Id: "FDA-SD9723"
  Status: "Published"
  Version: "1"
Description: "Raise an error when Description of Unplanned Element (SEUPDES) is not\
  \ present in the dataset although an Element Code (ETCD) equal to 'UNPLAN' is reported."
Sensitivity: "Dataset"
Executability: "Partially Executable - Possible Overreporting"
Scope:
  Domains:
    Include:
    - "SE"
Requirements:
  Variables:
    None:
    - "SEUPDES"
    All:
    - "ETCD"
Check:
  expression: >-
    ETCD == "UNPLAN"
Outcome:
  Message: "SEUPDES is not present in the dataset although ETCD is equal to 'UNPLAN'."
  Output_Variables:
  - "ETCD"
Source_Proposed:
  Sheet_Issue: "#192"
  FDA_Validator_Rule_Message: "Description of Unplanned Element (SEUPDES) is not present\
    \ in the dataset when ETCD equals 'UNPLAN'"
  FDA_Validator_Rule_Description: "The Description of Unplanned Element (SEUPDES)\
    \ variable must be present in the dataset when a subject's experience is represented\
    \ as an unplanned Element, where Element Code (ETCD) is equal to 'UNPLAN'."
  Domains: "SE"
Standards:
- Organization: "FDA"
  Standards:
  - Name: "SDTMIG"
    Version: "3.4"
  - Name: "SDTMIG"
    Version: "3.3"
  - Name: "SDTMIG"
    Version: "3.2"
  - Name: "SDTMIG"
    Version: "3.1.3"
  - Name: "SDTMIG"
    Version: "3.1.2"
  - Name: "SENDIG"
    Version: "3.1.1"
  - Name: "SENDIG"
    Version: "3.1"
  - Name: "SENDIG"
    Version: "3.0"
  - Name: "SENDIG-AR"
    Version: "1.0"
  - Name: "SENDIG-DART"
    Version: "1.1"
