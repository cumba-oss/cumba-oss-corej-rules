Core:
  Id: "FDA-SD0009"
  Status: "Published"
  Version: "1"
Description: "Raise an error when Serious Event (AESER) equals 'Y' but none of the\
  \ seriousness criteria variables (AESCAN, AESCONG, AESDISAB, AESDTH, AESHOSP, AESLIFE,\
  \ AESMIE) is equal to 'Y'."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "AE"
Requirements:
  Variables:
    All:
    - "AESER"
Check:
  expression: >-
    AESER == "Y" and (not var_exists("AESCAN") or AESCAN != "Y") and (not var_exists("AESCONG") or
    AESCONG != "Y") and (not var_exists("AESDISAB") or AESDISAB != "Y") and (not
    var_exists("AESDTH") or AESDTH != "Y") and (not var_exists("AESHOSP") or AESHOSP != "Y") and
    (not var_exists("AESLIFE") or AESLIFE != "Y") and (not var_exists("AESMIE") or AESMIE != "Y")
Outcome:
  Message: "AESER indicates a serious event but none of the seriousness criteria variables\
    \ (AESCAN, AESCONG, AESDISAB, AESDTH, AESHOSP, AESLIFE, AESMIE) is set to 'Y'."
  Output_Variables:
  - "AETERM"
Source:
  FDA_Validator_Rule_Message: "No qualifiers set to 'Y', when AE is Serious"
  FDA_Validator_Rule_Description: "When Serious Event (AESER) variable value is 'Y',\
    \ then at least one of seriousness criteria variables is expected to have value\
    \ 'Y' (Involves Cancer (AESCAN), Congenital Anomaly or Birth Defect (AESCONG),\
    \ Persist or Signif Disability/Incapacity (AESDISAB), Results in Death (AESDTH),\
    \ Requires or Prolongs Hospitalization (AESHOSP), Is Life Threatening (AESLIFE),\
    \ or Other Medically Important Serious Event (AESMIE))."
  Domains: "AE"
