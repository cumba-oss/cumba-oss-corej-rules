Core:
  Id: "FDA-SD1138"
  Status: "Published"
  Version: "1"
Description: "Raise an error when --DRVFL is equal to 'Y' but --ORRES is populated\
  \ or --STRESC is empty."
Executability: "Fully Executable"
Scope:
  Classes:
    Include:
    - "FINDINGS"
Requirements:
  Variables:
    All:
    - "--DRVFL"
    - "--ORRES"
Check:
  expression: >-
    --DRVFL == "Y" and (not empty(--ORRES) or empty(--STRESC))
Outcome:
  Message: "--DRVFL equals 'Y' but --ORRES is populated or --STRESC is empty."
  Output_Variables:
  - "!--STRESC"
Source:
  FDA_Validator_Rule_Message: "--DRVFL='Y', when --ORRES value is populated"
  FDA_Validator_Rule_Description: "Derived Flag (--DRVFL) variable may be populated\
    \ only when Result in Original Units (--ORRES) value is NULL and Result in Std.\
    \ Format (--STRESC) value is populated (result is derived rather than collected)."
  Domains: "FINDINGS"
