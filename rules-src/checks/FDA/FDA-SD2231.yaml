Core:
  Id: "FDA-SD2231"
  Status: "Published"
  Version: "1"
Description: "Raise an error when the study type equals 'INTERVENTIONAL' and the Trial\
  \ Summary (TS) dataset does not contain a record where TSPARMCD equals 'INTTYPE'\
  \ (Intervention Type)."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "TS"
Bindings:
- name: "$inttype_count"
  expression: "record_count(filter=filter(TSPARMCD=\"INTTYPE\"))"
- name: "$stype_interventional_count"
  expression: "record_count(filter=filter(TSPARMCD=\"STYPE\", TSVAL=\"INTERVENTIONAL\"\
    ))"
Check:
  expression: >-
    $stype_interventional_count >= 1 and $inttype_count == 0
Outcome:
  Message: "Missing INTTYPE Trial Summary Parameter: a 'Intervention Type' (INTTYPE)\
    \ record must be present in the Trial Summary (TS) domain."
  Output_Variables:
  - "$inttype_count"
Source:
  FDA_Validator_Rule_Message: "Missing INTTYPE Trial Summary Parameter"
  FDA_Validator_Rule_Description: "'Intervention Type' (INTTYPE) record must be populated\
    \ in Trial Summary (TS) domain, when study type is 'INTERVENTIONAL'. It is expected\
    \ for SDTM IG v3.1.2 data and required for data in all more recent SDTM versions."
  Domains: "TS"
