Core:
  Id: "FDA-SE2221"
  Status: "Published"
  Version: "1"
Description: "Raise an error when the Trial Summary (TS) dataset does not contain\
  \ a record where TSPARMCD equals 'TRT' (Investigational Therapy or Treatment)."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "TS"
Bindings:
- name: "$trt_count"
  expression: "record_count(filter=filter(TSPARMCD=\"TRT\"))"
Check:
  expression: >-
    $trt_count == 0
Outcome:
  Message: "Missing TRT Trial Summary Parameter: a 'Investigational Therapy or Treatment'\
    \ (TRT) record must be present in the Trial Summary (TS) domain."
  Output_Variables:
  - "$trt_count"
Source:
  FDA_Validator_Rule_Message: "Missing TRT Trial Summary Parameter"
  FDA_Validator_Rule_Description: "'Investigational Therapy or Treatment' (TRT) record\
    \ should be populated in Trial Summary (TS) domain."
  Domains: "TS"
