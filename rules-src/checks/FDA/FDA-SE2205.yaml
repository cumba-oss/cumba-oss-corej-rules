Core:
  Id: "FDA-SE2205"
  Status: "Published"
  Version: "1"
Description: "Raise an error when the Trial Summary (TS) dataset does not contain\
  \ a record where TSPARMCD equals 'EXPENDTC' (Experimental End Date)."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "TS"
Bindings:
- name: "$expendtc_count"
  expression: "record_count(filter=(TSPARMCD == \"EXPENDTC\"))"
Check:
  expression: >-
    $expendtc_count == 0
Outcome:
  Message: "Missing EXPENDTC Trial Summary Parameter: a 'Experimental End Date' (EXPENDTC)\
    \ record must be present in the Trial Summary (TS) domain."
Source:
  FDA_Validator_Rule_Message: "Missing EXPENDTC Trial Summary Parameter"
  FDA_Validator_Rule_Description: "'Experimental End Date' (EXPENDTC) record should\
    \ be populated in Trial Summary (TS) domain."
  Domains: "TS"
