Core:
  Id: "FDA-SD0025"
  Status: "Published"
  Version: "1"
Description: "Raise an error when the Date/Time of Collection (--DTC) is after the\
  \ End Date/Time of Collection (--ENDTC)."
Executability: "Fully Executable"
Scope:
  Classes:
    Include:
    - "FINDINGS"
    - "FINDINGS ABOUT"
Requirements:
  Variables:
    All:
    - "--DTC"
    - "--ENDTC"
Check:
  expression: >-
    not empty(--DTC) and not empty(--ENDTC) and date(--DTC) > --ENDTC
Outcome:
  Message: "--DTC is after --ENDTC"
  Output_Variables:
  - "--TESTCD"
  - "--DTC"
  - "--ENDTC"
Source:
  FDA_Validator_Rule_Message: "--DTC is after --ENDTC"
  FDA_Validator_Rule_Description: "Date/Time of Specimen Collection (--DTC) must be\
    \ less or equal to End Date/Time of Specimen Collection (--ENDTC)."
  Domains: "FINDINGS, FINDINGS ABOUT"
