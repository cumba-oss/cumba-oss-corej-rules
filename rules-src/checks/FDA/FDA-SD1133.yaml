Core:
  Id: "FDA-SD1133"
  Status: "Published"
  Version: "1"
Description: "Raise an error when ACTARM is present and ACTARMCD is present and ACTARM\
  \ does not have the same value across records with the same value of ACTARMCD."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "DM"
Requirements:
  Variables:
    All:
    - "ACTARM"
Check:
  expression: >-
    var_exists("ACTARMCD") and is_inconsistent_across_dataset(ACTARM, keys=[ACTARMCD])
Outcome:
  Message: "Inconsistent value for ACTARM within ACTARMCD"
Source:
  FDA_Validator_Rule_Message: "Inconsistent value for ACTARM"
  FDA_Validator_Rule_Description: "A value for Description of Actual Arm (ACTARM)\
    \ must have a unique value for Actual Arm Code (ACTARMCD) with the domain."
  Domains: "DM"
