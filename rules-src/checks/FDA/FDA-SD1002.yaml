Core:
  Id: "FDA-SD1002"
  Status: "Published"
  Version: "1"
Description: "Raise an error when the Subject Reference Start Date/Time (RFSTDTC)\
  \ is after the Subject Reference End Date/Time (RFENDTC)."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "DM"
Requirements:
  Variables:
    All:
    - "RFENDTC"
Check:
  expression: >-
    not empty(RFSTDTC) and not empty(RFENDTC) and date(RFSTDTC) > date(RFENDTC)
Outcome:
  Message: "RFSTDTC falls after RFENDTC."
  Output_Variables:
  - "RFSTDTC"
  - "RFENDTC"
Source:
  FDA_Validator_Rule_Message: "RFSTDTC is after RFENDTC"
  FDA_Validator_Rule_Description: "Subject Reference Start Date/Time (RFSTDTC) must\
    \ be less than or equal to Subject Reference End Date/Time (RFENDTC)."
  Domains: "DM"
