Core:
  Id: "FDA-SD0021"
  Status: "Published"
  Version: "1"
Description: "Raise an error when no End Time-Point variable (--ENDTC, --ENRF, or\
  \ --ENRTPT) is populated and the event/intervention is not excepted by --OCCUR equals\
  \ 'N', a populated --STAT, or a populated --DUR."
Executability: "Partially Executable - Possible Underreporting"
Scope:
  Classes:
    Include:
    - "INTERVENTIONS"
    - "EVENTS"
  Domains:
    Exclude:
    - "DS"
Check:
  expression: >-
    empty(--ENDTC) and empty(--ENRF) and empty(--ENRTPT) and --OCCUR != "N" and empty(--STAT) and
    empty(--DUR)
Outcome:
  Message: "No End Time-Point variable (--ENDTC, --ENRF, or --ENRTPT) is populated."
  Message_Folded: "None of --ENDTC, --ENRF, --ENRTPT or --DUR is present or populated\
    \ in the dataset although a record demands an End Time-Point."
  Keep_Row_Findings:
  - "--STAT"
  - "--OCCUR"
  Output_Variables:
  - "!--ENDTC"
  - "!--ENRF"
  - "!--ENRTPT"
  - "!--STAT"
  - "!--DUR"
Source:
  FDA_Validator_Rule_Message: "Missing End Time-Point value"
  FDA_Validator_Rule_Description: "One End Time-Point variable is expected to be populated\
    \ when an event or an intervention occurred. (E.g., End Date/Time of Event or\
    \ Intervention (--ENDTC), or End Relative to Reference Period (--ENRF), or End\
    \ Relative to Reference Period (--ENRTPT) should not be missing, or Occurrence\
    \ (--OCCUR) = 'N' or Completion Status (--STAT) != '') or Duration (--DUR) !=\
    \ '')."
  Domains: "INTERVENTIONS, EVENTS"
