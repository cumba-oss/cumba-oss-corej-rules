Core:
  Id: "FDA-SD0066"
  Status: "Published"
  Version: "1"
Description: "Raise an error when ARMCD is populated and does not match any ARMCD\
  \ value in the Trial Arms (TA) dataset, excluding subjects who failed screening\
  \ (ARMCD equals 'SCRNFAIL') or were not assigned to an Arm (ARMCD equals 'NOTASSGN')."
Executability: "Partially Executable - Possible Overreporting"
Scope:
  Domains:
    Include:
    - "DM"
Requirements:
  Variables:
    All:
    - "ARMCD"
Bindings:
- name: "$ta_armcd"
  expression: "distinct(ARMCD, domain=\"TA\")"
Check:
  expression: >-
    not empty(ARMCD) and upper(ARMCD) not in ["SCRNFAIL", "NOTASSGN"] and ARMCD not in $ta_armcd
Outcome:
  Message: "ARMCD does not match any ARMCD value in the TA dataset."
  Output_Variables:
  - "$ta_armcd"
Source:
  FDA_Validator_Rule_Message: "Invalid ARMCD"
  FDA_Validator_Rule_Description: "Planned Arm Code (ARMCD) values should match entries\
    \ in the Trial Arms (TA) dataset, except for subjects who failed screening (ARMCD\
    \ = 'SCRNFAIL') or were not fully assigned to an Arm (ARMCD = 'NOTASSGN')."
  Domains: "DM"
