Core:
  Id: "FDA-SD1018-A"
  Status: "Published"
  Version: "1"
Description: "Raise an error when the Subject Visits (SV) dataset carries no SVUPDES\
  \ variable and, for a visit whose VISIT name does not mark it unscheduled or unplanned,\
  \ the combination of Visit Number (VISITNUM), Visit Name (VISIT), and Planned Study\
  \ Day of Visit (VISITDY) does not match an entry in the Trial Visits (TV) dataset."
Executability: "Partially Executable - Possible Overreporting"
Scope:
  Domains:
    Include:
    - "SV"
Match_Datasets:
- Join_Type: "left"
  Keys:
  - "VISITNUM"
  - "VISIT"
  - "VISITDY"
  Name: "TV"
Check:
  expression: >-
    not var_exists("SVUPDES") and not empty(VISITNUM) and not empty(VISIT) and not
    contains(upper(VISIT), upper("UNSCHEDUL")) and not contains(upper(VISIT), upper("UNPLAN")) and
    empty(TV.VISITNUM)
Outcome:
  Message: "SVUPDES is not available, and the combination of VISITNUM, VISIT, and\
    \ VISITDY for a visit whose VISIT name does not mark it unscheduled or unplanned\
    \ does not match any entry in the Trial Visits (TV) dataset."
  Output_Variables:
  - "VISITNUM"
  - "VISIT"
  - "VISITDY"
  - "TV.VISITNUM"
Source_Proposed:
  Sheet_Issue: "#208"
  FDA_Validator_Rule_Message: "VISITNUM/VISIT/VISITDY values do not match TV domain\
    \ data"
  FDA_Validator_Rule_Description: "The combination of Visit Number (VISITNUM), Visit\
    \ Name (VISIT), and Planned Study Day of Visit (VISITDY) values should match entries\
    \ in the Trial Visits (TV) dataset when the SVUPDES variable is not present in\
    \ the dataset and the Visit Name (VISIT) does not identify the visit as unscheduled\
    \ or unplanned."
  Domains: "SV"
Source:
  FDA_Validator_Rule_Message: "VISITNUM/VISIT/VISITDY values do not match TV domain\
    \ data"
  FDA_Validator_Rule_Description: "The combination of Visit Number (VISITNUM), Visit\
    \ Name (VISIT), and Planned Study Day of Visit (VISITDY) values should match entries\
    \ in the Trial Visits (TV) dataset, when they are planned visits (SVUPDES = NULL)."
  Domains: "SV"
