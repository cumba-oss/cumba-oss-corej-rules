Core:
  Id: "FDA-SD1308"
  Status: "Published"
  Version: "1"
Description: "Raise an error when a record exists in TS with TSPARMCD equal to 'ADDON'\
  \ and TSVAL equal to 'Y', but TSVAL is empty for the record where TSPARMCD equals\
  \ 'CURTRT'."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "TS"
Requirements:
  Variables:
    All:
    - "TSPARMCD"
Bindings:
- name: "$ADDON_Y"
  expression: "record_count(group=[STUDYID], filter=filter(TSPARMCD=\"ADDON\", TSVAL=\"\
    Y\"))"
Check:
  expression: >-
    TSPARMCD == "CURTRT" and $ADDON_Y >= 1 and empty(TSVAL)
Outcome:
  Message: "TSVAL is empty for the CURTRT Trial Summary Parameter when a record exists\
    \ with TSPARMCD equal to 'ADDON' and TSVAL equal to 'Y'."
  Output_Variables:
  - "TSPARMCD"
  - "TSVAL"
  - "$ADDON_Y"
Source:
  FDA_Validator_Rule_Message: "TSVAL is missing for the CURTRT Trial Summary Parameter,\
    \ when ADDON parameter equals 'Y'"
  FDA_Validator_Rule_Description: "When test product is added to existing treatment\
    \ (TSPARMCD = 'ADDON' and TSVAL = 'Y'), the Current Therapy or Treatment parameter\
    \ should be provided with Parameter Value populated (TSVAL should not be null\
    \ when TSPARMCD = 'CURTRT')."
  Domains: "TS"
Standards:
