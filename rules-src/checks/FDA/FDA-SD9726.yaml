Core:
  Id: "FDA-SD9726"
  Status: "Published"
  Version: "1"
Description: "Raise an error when the Reason Not Done (--REASND) variable is not present\
  \ in the dataset although a record reports its Completion Status (--STAT) as 'NOT\
  \ DONE'."
Sensitivity: "Dataset"
Executability: "Partially Executable - Possible Overreporting"
Scope:
  Classes:
    Include:
    - "INTERVENTIONS"
    - "EVENTS"
    - "FINDINGS"
    - "FINDINGS ABOUT"
Requirements:
  Variables:
    None:
    - "--REASND"
    All:
    - "--STAT"
Check:
  expression: >-
    --STAT == "NOT DONE"
Outcome:
  Message: "--REASND is not present in the dataset although --STAT is equal to 'NOT\
    \ DONE'."
Source_Proposed:
  Sheet_Issue: "#200"
  FDA_Validator_Rule_Message: "The --REASND variable is not present in the dataset\
    \ when --STAT is 'NOT DONE'"
  FDA_Validator_Rule_Description: "The Reason Not Done (--REASND) variable must be\
    \ present in the dataset when the Status (--STAT) variable value is 'NOT DONE'."
  Domains: "INTERVENTIONS, EVENTS, FINDINGS, FINDINGS ABOUT"
Standards:
- Organization: "FDA"
  Standards:
  - Name: "SDTMIG"
    Version: "3.4"
  - Name: "SDTMIG"
    Version: "3.3"
  - Name: "SDTMIG"
    Version: "3.2"
  - Name: "SDTMIG"
    Version: "3.1.3"
  - Name: "SDTMIG"
    Version: "3.1.2"
  - Name: "SENDIG"
    Version: "3.1.1"
  - Name: "SENDIG"
    Version: "3.1"
  - Name: "SENDIG"
    Version: "3.0"
  - Name: "SENDIG-AR"
    Version: "1.0"
  - Name: "SENDIG-DART"
    Version: "1.1"
