Core:
  Id: "FDA-SD0055"
  Status: "Published"
  Version: "1"
Description: "Raise an error when a variable's data type in the dataset does not match\
  \ the data type defined for that variable in the SDTMIG (for variables in a published\
  \ domain) or in the SDTM Model (for variables in a custom domain)."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "ALL"
Check:
  expression: >-
    not empty(var_type("LIBRARY")) and var_type("DATA") != var_type("LIBRARY")
Outcome:
  Message: "Variable data type in the dataset does not match the data type defined\
    \ in the SDTMIG or the SDTM Model."
  Output_Variables:
  - "variable_data_type"
  - "library_variable_data_type"
Source:
  FDA_Validator_Rule_Message: "SDTM/dataset variable type mismatch"
  FDA_Validator_Rule_Description: "Variable Data Types in the dataset should match\
    \ the variable data types described in SDTM."
  Domains: "ALL"
