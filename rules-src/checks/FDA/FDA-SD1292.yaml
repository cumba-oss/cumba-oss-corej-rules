Core:
  Id: "FDA-SD1292"
  Status: "Published"
  Version: "1"
Description: "Raise an error when Start Reference Time Point (--STTPT) is populated\
  \ but Start Relative to Reference Time Point (--STRTPT) is not populated."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "ALL"
Requirements:
  Variables:
    All:
    - "--STRTPT"
    - "--STTPT"
Check:
  expression: >-
    not empty(--STTPT) and empty(--STRTPT)
Outcome:
  Message: "--STRTPT is empty when --STTPT is populated."
Source:
  FDA_Validator_Rule_Message: "Missing value for --STRTPT, when --STTPT is populated"
  FDA_Validator_Rule_Description: "Start Relative to Reference Time Point (--STRTPT)\
    \ must be populated when Start Reference Time Point (--STTPT) is populated."
  Domains: "ALL"
