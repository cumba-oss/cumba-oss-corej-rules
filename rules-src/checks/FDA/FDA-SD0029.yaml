Core:
  Id: "FDA-SD0029"
  Status: "Published"
  Version: "1"
Description: "Raise an error when Standard Units (--STRESU) is empty or not present\
  \ while a numeric Character Result/Finding in Standard Units (--STRESC) is provided."
Executability: "Partially Executable - Possible Overreporting"
Scope:
  Classes:
    Include:
    - "FINDINGS"
    - "FINDINGS ABOUT"
Requirements:
  Variables:
    All:
    - "--STRESC"
Check:
  expression: >-
    not empty(--STRESC) and --STRESC =~ /^-?[0-9]+(\\.[0-9]+)?$/ and empty(--STRESU)
Outcome:
  Message: "--STRESU is empty when a numeric --STRESC is provided."
  Output_Variables:
  - "--STRESC"
  - "!--STRESU"
Source:
  FDA_Validator_Rule_Message: "Missing value for --STRESU, when --STRESC is provided"
  FDA_Validator_Rule_Description: "Standard Units (--STRESU) should not be NULL, when\
    \ Character Result/Finding in Std Units (--STRESC) is provided as a numeric result."
  Domains: "FINDINGS, FINDINGS ABOUT"
