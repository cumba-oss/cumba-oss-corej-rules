Core:
  Id: "FDA-SD1339"
  Status: "Published"
  Version: "1"
Description: "Raise an error when EPOCH is empty even though a start date (--STDTC)\
  \ or a collection date (--DTC) is populated."
Executability: "Partially Executable - Possible Underreporting"
Scope:
  Classes:
    Include:
    - "INTERVENTIONS"
    - "EVENTS"
    - "FINDINGS"
    - "FINDINGS ABOUT"
    - "SPECIAL PURPOSE"
  Domains:
    Exclude:
    - "CO"
    - "DM"
    - "SV"
Requirements:
  Variables:
    All:
    - "EPOCH"
Check:
  expression: >-
    empty(EPOCH) and (not empty(--STDTC) or not empty(--DTC))
Outcome:
  Message: "EPOCH is empty when a start date (--STDTC) or collection date (--DTC)\
    \ is populated."
  Message_Folded: "EPOCH not populated in any record of the dataset, and at least\
    \ one record meets the rest of the condition: EPOCH is empty when a start date\
    \ (--STDTC) or collection date (--DTC) is populated."
Source:
  FDA_Validator_Rule_Message: "Missing EPOCH value, when a start or observation date\
    \ is provided"
  FDA_Validator_Rule_Description: "The EPOCH variable is not populated, however either\
    \ a start date or a collection date is provided. The presence of a start date\
    \ or collection date for a record should allow for the EPOCH variable to be populated.\
    \ Variables requested by the relevant regulatory agency in policy documents (e.g.,\
    \ EPOCH) should be included in the dataset and populated."
  Domains: "SE, SM, INTERVENTIONS, EVENTS, FINDINGS, FINDINGS ABOUT"
