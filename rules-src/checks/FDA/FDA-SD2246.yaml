Core:
  Id: "FDA-SD2246"
  Status: "Published"
  Version: "1"
Description: "Raise an error when TSVAL is not a numeric integer for a record where\
  \ TSPARMCD equals 'NARMS' (Planned Number of Arms)."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "TS"
Requirements:
  Variables:
    All:
    - "TSVAL"
    - "TSPARMCD"
Check:
  expression: >-
    var_exists("TSVAL") and TSPARMCD == "NARMS" and not is_integer(TSVAL)
Outcome:
  Message: "Invalid TSVAL value for NARMS: TSVAL must be a numeric (integer) value\
    \ when TSPARMCD equals 'NARMS' (Planned Number of Arms)."
Source:
  FDA_Validator_Rule_Message: "Invalid TSVAL value for NARMS"
  FDA_Validator_Rule_Description: "TSVAL variable value must be numeric, when TSPARMCD='NARMS'."
  Domains: "TS"
