Core:
  Id: "FDA-SD0040"
  Status: "Published"
  Version: "1"
Description: "Raise an error when --TESTCD is present and --TEST is present and --TEST\
  \ does not have the same value across records with the same value of --TESTCD."
Executability: "Fully Executable"
Scope:
  Classes:
    Include:
    - "FINDINGS"
    - "FINDINGS ABOUT"
Requirements:
  Variables:
    All:
    - "--TEST"
    - "--TESTCD"
Check:
  expression: >-
    is_inconsistent_across_dataset(--TEST, keys=[--TESTCD])
Outcome:
  Message: "Inconsistent value for --TEST within --TESTCD"
Source:
  FDA_Validator_Rule_Message: "Inconsistent value for --TEST within --TESTCD"
  FDA_Validator_Rule_Description: "All values of Name of Measurement, Test or Examination\
    \ (--TEST) should be the same for a given value of Short Name of Measurement,\
    \ Test or Examination (--TESTCD)."
  Domains: "FINDINGS, FINDINGS ABOUT"
