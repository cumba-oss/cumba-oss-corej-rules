Core:
  Id: "FDA-SD1037"
  Status: "Published"
  Version: "1"
Description: "Raise an error when --TOXGR is populated with a value greater than 0\
  \ but --TOX is not populated."
Executability: "Partially Executable - Possible Underreporting"
Scope:
  Domains:
    Include:
    - "CV"
    - "EG"
    - "FT"
    - "LB"
    - "MK"
    - "NV"
    - "OE"
    - "PC"
    - "PP"
    - "RE"
    - "UR"
    - "AE"
    - "CE"
    - "MH"
Requirements:
  Variables:
    All:
    - "--TOXGR"
Check:
  ERROR:
    expression: >-
      num(--TOXGR) > 0 and empty(--TOX)
  INFO:
    expression: >-
      --TOXGR =~ /[1-9]/ and empty(--TOX)
    Message: "--TOX is not populated and --TOXGR appears to record a non-zero grade as\
      \ text (a digit 1-9 in a value the numeric comparison cannot read)."
Outcome:
  Message: "--TOX is not populated when --TOXGR is populated."
  Message_Folded: "--TOX is absent or empty although toxicity grades greater than\
    \ 0 are reported."
  Output_Variables:
  - "!--TOX"
Source:
  FDA_Validator_Rule_Message: "Missing value for --TOX, when --TOXGR is populated"
  FDA_Validator_Rule_Description: "A value for a Toxicity (--TOX) variable should\
    \ be provided, when a Toxicity Grade (--TOXGR) variable value is populated and\
    \ greater than 0."
  Domains: "CV, EG, FT, LB, MK, NV, OE, PC, PP, RE, UR, AE, CE, MH"
