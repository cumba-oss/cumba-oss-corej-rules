Core:
  Id: "FDA-SE2306"
  Status: "Published"
  Version: "1"
Description: "Raise an error when none of the required timing variables VISITDY, --DY\
  \ or --NOMDY is present and populated; at least one must be populated."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "BW"
    - "CL"
    - "CV"
    - "EG"
    - "LB"
    - "PM"
    - "RE"
    - "VS"
Check:
  expression: >-
    empty(VISITDY) and empty(--DY) and empty(--NOMDY)
Outcome:
  Message: "None of the required timing variables (VISITDY, --DY, or --NOMDY) is populated;\
    \ at least one must be present and populated."
  Message_Folded: "--DY, --NOMDY and VISITDY absent or not populated in any record\
    \ of the dataset, and at least one record meets the rest of the condition: None\
    \ of the required timing variables (VISITDY, --DY, or --NOMDY) is populated; at\
    \ least one must be present and populated."
Source:
  FDA_Validator_Rule_Message: "Missing values for all required set(s) of timing variables:\
    \  VISITDY, --DY or --NOMDY"
  FDA_Validator_Rule_Description: "At least one of the these variables or sets of\
    \ variables should be populated: VISITDY, --DY, or --NOMDY. These are the Required\
    \ timing variables for identification of the day on which group summaries (Group\
    \ Means and Incidences) are calculated."
  Domains: "BW, CL, CV, EG, LB, PM, RE, VS"
