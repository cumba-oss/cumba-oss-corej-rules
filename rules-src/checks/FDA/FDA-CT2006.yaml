Core:
  Id: "FDA-CT2006"
  Status: "Published"
  Version: "1"
Description: "Raise an error when a coded value and its paired decoded value do not\
  \ map to the same term of the codelist bound at the value level (Define-XML ValueListDef\
  \ / WhereClauseDef) for the value-level condition that applies to the record."
Executability: "Partially Executable"
Scope:
  Domains:
    Include:
    - "ALL"
Check:
  expression: >-
    not empty(value()) and vlm_decode_matches(variable_name) == false
Outcome:
  Message: "The coded value and its decode do not map to the same value-level codelist\
    \ term in the Define-XML."
  Output_Variables:
  - "variable_value"
Source:
  FDA_Validator_Rule_Message: "Coded and Decoded values do not have the same Code\
    \ in CDISC CT when value-level condition occurs"
  FDA_Validator_Rule_Description: "Paired variables such as TEST/TESTCD must be populated\
    \ using terms with the same Codelist Code value in CDISC control terminology.\
    \ There is one-to-one relationship between paired variable values defined in CDISC\
    \ control terminology by Codelist Code value within the same value level condition."
  Domains: "ALL"
