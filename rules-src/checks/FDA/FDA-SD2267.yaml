Core:
  Id: "FDA-SD2267"
  Status: "Published"
  Version: "1"
Description: "Raise an error when the Parameter Value (TSVAL) for a TDIGRP trial-summary\
  \ parameter is not a valid SNOMED CT term."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "TS"
Requirements:
  Variables:
    All:
    - "TSPARMCD"
Bindings:
- name: "$tdigrp_term_valid"
  expression: "valid_external_dictionary_value(TSVAL, external_dictionary_type=\"\
    snomed\", dictionary_term_type=\"SNOMED\")"
Check:
  expression: >-
    TSPARMCD == "TDIGRP" and $tdigrp_term_valid == false
Outcome:
  Message: "TSVAL is not a valid SNOMED CT term for the TDIGRP parameter."
  Output_Variables:
  - "TSPARMCD"
  - "TSVAL"
Source:
  FDA_Validator_Rule_Message: "Invalid TSVAL value for TDIGRP"
  FDA_Validator_Rule_Description: "TSVAL for TDIGRP record must be a valid term from\
    \ SNOMED CT."
  Domains: "TS"
