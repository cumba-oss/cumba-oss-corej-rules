Core:
  Id: "FDA-SE2202"
  Status: "Published"
  Version: "1"
Description: "Raise an error when the Trial Summary (TS) dataset does not contain\
  \ a record where TSPARMCD equals 'AGEU' (Age Unit)."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "TS"
Bindings:
- name: "$ageu_count"
  expression: "record_count(filter=filter(TSPARMCD=\"AGEU\"))"
Check:
  expression: >-
    $ageu_count == 0
Outcome:
  Message: "Missing AGEU Trial Summary Parameter: a 'Age Unit' (AGEU) record must\
    \ be present in the Trial Summary (TS) domain."
  Output_Variables:
  - "$ageu_count"
Source:
  FDA_Validator_Rule_Message: "Missing AGEU Trial Summary Parameter"
  FDA_Validator_Rule_Description: "'Age Unit' (AGEU) record should be populated in\
    \ Trial Summary (TS) domain."
  Domains: "TS"
Standards:
- Organization: "FDA"
  Standards:
