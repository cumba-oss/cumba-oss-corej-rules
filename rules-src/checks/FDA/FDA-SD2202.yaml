Core:
  Id: "FDA-SD2202"
  Status: "Published"
  Version: "1"
Description: "Raise an error when the Trial Summary (TS) dataset does not contain\
  \ a record where TSPARMCD equals 'AGEMAX' (Planned Maximum Age of Subjects)."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "TS"
Bindings:
- name: "$agemax_count"
  expression: "record_count(filter=(TSPARMCD == \"AGEMAX\"))"
Check:
  expression: >-
    $agemax_count == 0
Outcome:
  Message: "Missing AGEMAX Trial Summary Parameter: a 'Planned Maximum Age of Subjects'\
    \ (AGEMAX) record must be present in the Trial Summary (TS) domain."
  Output_Variables:
  - "$agemax_count"
Source:
  FDA_Validator_Rule_Message: "Missing AGEMAX Trial Summary Parameter"
  FDA_Validator_Rule_Description: "'Planned Maximum Age of Subjects' (AGEMAX) record\
    \ must be populated in Trial Summary (TS) domain. It is expected for SDTM IG v3.1.2\
    \ data and required for data in all more recent SDTM versions."
  Domains: "TS"
