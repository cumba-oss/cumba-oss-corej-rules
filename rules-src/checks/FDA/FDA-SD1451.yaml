Core:
  Id: "FDA-SD1451"
  Status: "Published"
  Version: "1"
Description: "Raise an error when the Planned End of Assessment Interval (--ENINT)\
  \ variable is present in the dataset but the Planned Start of Assessment Interval\
  \ (--STINT) variable is not present."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "CV"
    - "EG"
    - "PP"
    - "RE"
Check:
  expression: >-
    var_exists("--ENINT") and not var_exists("--STINT")
Outcome:
  Message: "--ENINT variable is present, but --STINT variable is not present."
  Output_Variables:
  - "--ENINT"
Source:
  FDA_Validator_Rule_Message: "Missing --STINT variable, when --ENINT variable is\
    \ present"
  FDA_Validator_Rule_Description: "Planned Start of Assessment Interval (--STINT)\
    \ variable must be included in the domain, when Planned End of Assessment Interval\
    \ (--ENINT) variable is present."
  Domains: "CV, EG, PP, RE"
