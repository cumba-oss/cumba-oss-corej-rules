Core:
  Id: "FDA-SD1377"
  Status: "Published"
  Version: "1"
Description: "Raise an error when a subject with ARMNRS equal to 'SCREEN FAILURE'\
  \ has no record in the Inclusion/Exclusion Criteria Not Met (IE) dataset."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "DM"
Requirements:
  Variables:
    All:
    - "ARMNRS"
Bindings:
- name: "$ie_usubjid"
  expression: "distinct(USUBJID, domain=\"IE\")"
Check:
  expression: >-
    ARMNRS == "SCREEN FAILURE" and USUBJID not in $ie_usubjid
Outcome:
  Message: "No IE record found for the SCREEN FAILURE subject."
  Output_Variables:
  - "ARMNRS"
  - "$ie_usubjid"
Source:
  FDA_Validator_Rule_Message: "No records for SCREEN FAILURE subject are found in\
    \ IE domain"
  FDA_Validator_Rule_Description: "All subjects with Reason Arm and/or Actual Arm\
    \ is Null (ARMNRS) equal to 'SCREEN FAILURE' should have records in the Inclusion/Exclusion\
    \ Criteria Not Met (IE) domain."
  Domains: "DM"
Standards:
- Organization: "FDA"
  Standards:
  - Name: "SDTMIG"
    Version: "3.4"
    References:
    - Origin: "FDA Validator Rules"
      Rule_Identifier:
