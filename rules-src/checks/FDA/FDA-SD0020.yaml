Core:
  Id: "FDA-SD0020"
  Status: "Published"
  Version: "1"
Description: "Raise an error when a Parameter Short Name (--PARMCD) value is more\
  \ than 8 characters in length."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "DI"
    - "TS"
Check:
  expression: >-
    len(--PARMCD) > 8
Outcome:
  Message: "--PARMCD value length is greater than 8 characters."
Source:
  FDA_Validator_Rule_Message: "Invalid value for --PARMCD variable"
  FDA_Validator_Rule_Description: "The value of Parameter Short Name (--PARMCD) variables\
    \ should be no more than 8 characters in length."
  Domains: "DI, TS"
