Core:
  Id: "FDA-SD0008C"
  Status: "Published"
  Version: "1"
Description: "Raise an error when a Dictionary-Derived Term (--DECOD) value does not\
  \ match the case of its MedDRA preferred term."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "AE"
    - "CE"
    - "MH"
Requirements:
  Variables:
    All:
    - "--DECOD"
Bindings:
- name: "$decod_case_valid"
  expression: "valid_external_dictionary_value(--DECOD, external_dictionary_type=\"\
    meddra\", dictionary_term_type=\"PT\", case_sensitive=true)"
Check:
  expression: >-
    $decod_case_valid == false
Outcome:
  Message: "Dictionary-Derived Term (--DECOD) does not match the MedDRA preferred\
    \ case."
  Output_Variables:
  - "--DECOD"
Source:
  FDA_Validator_Rule_Message: "Value for --DECOD is in incorrect case"
  FDA_Validator_Rule_Description: "Case for the Dictionary-Derived Term (--DECOD)\
    \ variable must be sentence case using a Preferred Term of the MedDRA dictionary\
    \ of a version specified in the define.xml (Case-sensitive)."
  Domains: "AE, CE, MH"
