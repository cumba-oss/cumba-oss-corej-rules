Core:
  Id: "FDA-SD1284"
  Status: "Published"
  Version: "1"
Description: "Raise an error when --LOC is not present but --PORTOT is present."
Executability: "Fully Executable"
Scope:
  Classes:
    Include:
    - "INTERVENTIONS"
    - "FINDINGS"
    - "FINDINGS ABOUT"
Check:
  expression: >-
    not var_exists("--LOC") and var_exists("--PORTOT")
Outcome:
  Message: "--PORTOT is present when --LOC is not present."
  Output_Variables:
  - "--PORTOT"
Source:
  FDA_Validator_Rule_Message: "--PORTOT variable is present when --LOC variable is\
    \ missing"
  FDA_Validator_Rule_Description: "Portion or Totality (--PORTOT) variable should\
    \ not be present in the domain, when the Location (--LOC) variable is missing."
  Domains: "INTERVENTIONS, FINDINGS, FINDINGS ABOUT"
