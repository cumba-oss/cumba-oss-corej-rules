Core:
  Id: "FDA-SD1135-A"
  Status: "Published"
  Version: "1"
Description: "Raise an error when the Study Day variable --ENDY has a negative value\
  \ in the EC or EX dataset."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "EC"
    - "EX"
Requirements:
  Variables:
    All:
    - "--ENDY"
Check:
  expression: >-
    not empty(--ENDY) and --ENDY < 0
Outcome:
  Message: "Negative value for Study Day variable --ENDY."
Source_Proposed:
  Sheet_Issue: "#241"
  FDA_Validator_Rule_Message: "Negative value of End Study Day variable"
  FDA_Validator_Rule_Description: "Study Day variable (--ENDY) value should not be\
    \ negative in Exposure (EX) datasets."
  Domains: "EC, EX"
Source:
  FDA_Validator_Rule_Message: "Negative value of Study Day variable"
  FDA_Validator_Rule_Description: "Study Day variables (*DY) value should not be negative\
    \ in Exposure (EX) datasets."
  Domains: "EC, EX"
