Core:
  Id: "FDA-SE2206"
  Status: "Published"
  Version: "1"
Description: "Raise an error when the Trial Summary (TS) dataset does not contain\
  \ a record where TSPARMCD equals 'EXPSTDTC' (Experimental Start Date)."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "TS"
Bindings:
- name: "$expstdtc_count"
  expression: "record_count(filter=filter(TSPARMCD=\"EXPSTDTC\"))"
Check:
  expression: >-
    $expstdtc_count == 0
Outcome:
  Message: "Missing EXPSTDTC Trial Summary Parameter: a 'Experimental Start Date'\
    \ (EXPSTDTC) record must be present in the Trial Summary (TS) domain."
  Output_Variables:
  - "$expstdtc_count"
Source:
  FDA_Validator_Rule_Message: "Missing EXPSTDTC Trial Summary Parameter"
  FDA_Validator_Rule_Description: "'Experimental Start Date' (EXPSTDTC) record should\
    \ be populated in Trial Summary (TS) domain."
  Domains: "TS"
Standards:
- Organization: "FDA"
  Standards:
