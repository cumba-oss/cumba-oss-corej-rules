Core:
  Id: "FDA-SD1401"
  Status: "Published"
  Version: "1"
Description: "Raise an error when Start Date/Time of Agent (AGSTDTC) is populated\
  \ and is later than Date/Time of Last Challenge Agent Admin (RFCENDTC) in the DM\
  \ dataset."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "AG"
Requirements:
  Variables:
    All:
    - "AGSTDTC"
    - "USUBJID"
    All_Or_None:
    - - "USUBJID"
      - "DM.USUBJID"
Match_Datasets:
- Keys:
  - "USUBJID"
  Name: "DM"
Check:
  expression: >-
    not empty(AGSTDTC) and date(AGSTDTC) > date(DM.RFCENDTC)
Outcome:
  Message: "AGSTDTC is populated and is later than RFCENDTC in the DM dataset."
  Output_Variables:
  - "AGSTDTC"
  - "DM.RFCENDTC"
Source:
  FDA_Validator_Rule_Message: "AGSTDTC date is after RFCENDTC"
  FDA_Validator_Rule_Description: "Start Date/Time of Agent (AGSTDTC) variable value\
    \ must be less than or equal to Date/Time of Last Challenge Agent Admin (RFCENDTC)."
  Domains: "AG"
Standards:
- Organization: "FDA"
  Standards:
  - Name: "SENDIG-AR"
    Version: "1.0"
    References:
    - Origin: "FDA Validator Rules"
      Rule_Identifier:
        Id: "SD1401"
        Version: "1"
      Version: "1.6"
