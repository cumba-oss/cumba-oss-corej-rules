Core:
  Id: "FDA-SD0012"
  Status: "Published"
  Version: "1"
Description: "Raise an error when Study Day of Start (--STDY) is greater than Study\
  \ Day of End (--ENDY)."
Executability: "Fully Executable"
Scope:
  Classes:
    Include:
    - "INTERVENTIONS"
    - "EVENTS"
    - "SPECIAL PURPOSE"
  Domains:
    Exclude:
    - "CO"
    - "DM"
Requirements:
  Variables:
    All:
    - "--ENDY"
    - "--STDY"
Check:
  expression: >-
    not empty(--STDY) and not empty(--ENDY) and --STDY > --ENDY
Outcome:
  Message: "--STDY is after --ENDY"
Source:
  FDA_Validator_Rule_Message: "--STDY is after --ENDY"
  FDA_Validator_Rule_Description: "Study Day of Start of Event, Exposure or Observation\
    \ (--STDY) must be less or equal to Study Day of End of Event, Exposure or Observation\
    \ (--ENDY)."
  Domains: "SE, SM, SV, INTERVENTIONS, EVENTS"
