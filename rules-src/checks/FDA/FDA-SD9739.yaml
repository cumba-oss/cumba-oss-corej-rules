Core:
  Id: "FDA-SD9739"
  Status: "Published"
  Version: "1"
Description: "Raise an error when Planned Start of Assessment Interval (--STINT) is\
  \ populated but Time Point Reference (--TPTREF) is empty."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "ALL"
Requirements:
  Variables:
    All:
    - "--STINT"
    - "--TPTREF"
Check:
  expression: >-
    not empty(--STINT) and empty(--TPTREF)
Outcome:
  Message: "--STINT is populated, but --TPTREF is empty."
  Message_Folded: "--TPTREF not populated in any record of the dataset, and at least\
    \ one record meets the rest of the condition: --STINT is populated, but --TPTREF\
    \ is empty."
Source_Proposed:
  Sheet_Issue: "#261"
  FDA_Validator_Rule_Message: "--TPTREF is not populated although --STINT is populated"
  FDA_Validator_Rule_Description: "When the Planned Start of Assessment Interval (--STINT)\
    \ is populated, the Time Point Reference (--TPTREF) must also be populated."
  Domains: "ALL"
