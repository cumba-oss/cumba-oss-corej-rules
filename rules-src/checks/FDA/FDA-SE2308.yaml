Core:
  Id: "FDA-SE2308"
  Status: "Published"
  Version: "1"
Description: "Raise an error when the required PC timing variable Planned Elapsed\
  \ Time (PCELTM) is not populated."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "PC"
Requirements:
  Variables:
    All:
    - "PCELTM"
Check:
  expression: >-
    empty(PCELTM)
Outcome:
  Message: "PCELTM, a required PC timing variable, is not populated."
  Output_Variables:
  - "PCELTM"
Source:
  FDA_Validator_Rule_Message: "Missing values for required timing variables: (VISITDY\
    \ and --ELTM) or (--NOMDY and --ELTM)"
  FDA_Validator_Rule_Description: "PCNOMDY and PCELTM or VISITDY and PCELTM must be\
    \ present and populated in PC.   These are the required timing variables for identification\
    \ of the day on which group summaries (Group Means and Incidences) are calculated\
    \ for pharmacokinetic concentrations."
  Domains: "PC"
