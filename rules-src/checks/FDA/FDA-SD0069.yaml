Core:
  Id: "FDA-SD0069"
  Status: "Published"
  Version: "1"
Description: "Raise an error when a Demographics (DM) subject (USUBJID) has no record\
  \ in the Disposition (DS) dataset, excluding subjects who failed screening (ARMCD\
  \ equals 'SCRNFAIL'), were not assigned to an Arm (ARMCD equals 'NOTASSGN'), or\
  \ whose ARMCD is empty."
Executability: "Partially Executable - Possible Overreporting"
Scope:
  Domains:
    Include:
    - "DM"
Requirements:
  Variables:
    All:
    - "ARMCD"
Bindings:
- name: "$ds_usubjid"
  expression: "distinct(USUBJID, domain=\"DS\")"
Check:
  expression: >-
    not empty(ARMCD) and upper(ARMCD) not in ["SCRNFAIL", "NOTASSGN"] and USUBJID not in $ds_usubjid
Outcome:
  Message: "No Disposition (DS) record found for the subject."
  Output_Variables:
  - "ARMCD"
  - "$ds_usubjid"
Source:
  FDA_Validator_Rule_Message: "No Disposition record found for subject"
  FDA_Validator_Rule_Description: "All Demographics (DM) subjects (USUBJID) should\
    \ have at least one record in the Disposition (DS) domain. The only possible exceptions\
    \ for SDTMIG v3.2 (and earlier) are Screen Failures (ARMCD=SCRNFAIL) and Not Assigned\
    \ Treatment (ARMCD=NOTASSGN) subjects, or subjects with ARMCD=null.  There are\
    \ no exceptions for SEND."
  Domains: "DM"
Standards:
