Core:
  Id: "FDA-SD1090"
  Status: "Published"
  Version: "1"
Description: "Raise an error when the populated Study Day of Start of Observation\
  \ (--STDY) does not equal the study day computed from --STDTC and DM.RFSTDTC: the\
  \ date part of --STDTC minus the date part of DM.RFSTDTC, plus one when --STDTC\
  \ is on or after DM.RFSTDTC, otherwise the plain difference (no day zero)."
Executability: "Fully Executable"
Scope:
  Classes:
    Include:
    - "INTERVENTIONS"
    - "EVENTS"
    - "FINDINGS"
    - "FINDINGS ABOUT"
    - "SPECIAL PURPOSE"
  Domains:
    Exclude:
    - "CO"
    - "DM"
Requirements:
  Variables:
    All:
    - "--STDTC"
    - "--STDY"
    - "STUDYID"
    - "USUBJID"
    All_Or_None:
    - - "STUDYID"
      - "DM.STUDYID"
    - - "USUBJID"
      - "DM.USUBJID"
Match_Datasets:
- Keys:
  - "STUDYID"
  - "USUBJID"
  Cardinality: "n:1"
  Name: "DM"
Bindings:
- name: "$val_stdy"
  expression: "dy(--STDTC, DM.RFSTDTC)"
Check:
  expression: >-
    not empty(--STDY) and is_complete_date(--STDTC) and is_complete_date(DM.RFSTDTC) and --STDY !=
    $val_stdy
Outcome:
  Message: "--STDY does not equal the study day computed from --STDTC and DM.RFSTDTC."
Source:
  FDA_Validator_Rule_Message: "Incorrect value for --STDY variable"
  FDA_Validator_Rule_Description: "Study Day of Start (--STDY) variable value should\
    \ be populated as defined by CDISC standards: --STDY = (date portion of --STDTC)\
    \ - (date portion of RFSTDTC) +1 if --STDTC is on or after RFSTDTC; --STDY = (date\
    \ portion of --STDTC) - (date portion of RFSTDTC) if --STDTC precedes RFSTDTC."
  Domains: "SE, SM, SV, INTERVENTIONS, EVENTS, FINDINGS, FINDINGS ABOUT"
