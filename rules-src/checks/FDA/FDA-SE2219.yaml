Core:
  Id: "FDA-SE2219"
  Status: "Published"
  Version: "1"
Description: "Raise an error when the Trial Summary (TS) dataset does not contain\
  \ a record where TSPARMCD equals 'STITLE' (Study Title)."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "TS"
Bindings:
- name: "$stitle_count"
  expression: "record_count(filter=filter(TSPARMCD=\"STITLE\"))"
Check:
  expression: >-
    $stitle_count == 0
Outcome:
  Message: "Missing STITLE Trial Summary Parameter: a 'Study Title' (STITLE) record\
    \ must be present in the Trial Summary (TS) domain."
  Output_Variables:
  - "$stitle_count"
Source:
  FDA_Validator_Rule_Message: "Missing STITLE Trial Summary Parameter"
  FDA_Validator_Rule_Description: "'Study Title' (STITLE) record should be populated\
    \ in Trial Summary (TS) domain."
  Domains: "TS"
