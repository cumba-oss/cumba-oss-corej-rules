Core:
  Id: "FDA-SD2258"
  Status: "Published"
  Version: "1"
Description: "Raise an error when the Parameter Value Code (TSVALCD) for an INDIC\
  \ trial-summary parameter is not a valid SNOMED CT concept ID."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "TS"
Requirements:
  Variables:
    All:
    - "TSPARMCD"
Bindings:
- name: "$indic_code_valid"
  expression: "valid_external_dictionary_code(TSVALCD, external_dictionary_type=\"\
    snomed\", dictionary_term_type=\"SNOMEDCD\")"
Check:
  expression: >-
    TSPARMCD == "INDIC" and $indic_code_valid == false
Outcome:
  Message: "TSVALCD is not a valid SNOMED CT concept ID for the INDIC parameter."
Source:
  FDA_Validator_Rule_Message: "Invalid TSVALCD value for INDIC"
  FDA_Validator_Rule_Description: "TSVALCD for INDIC record must be a valid concept\
    \ ID from SNOMED CT."
  Domains: "TS"
