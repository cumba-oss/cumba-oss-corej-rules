Core:
  Id: "FDA-SD1149"
  Status: "Published"
  Version: "1"
Description: "Raise an error when an Expected variable is empty for all records in\
  \ the dataset."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "ALL"
Bindings:
- name: "$expected_variables"
  expression: "get_dataset_filtered_variables(key_name=\"core\", key_value=\"Exp\"\
    )"
Check:
  expression: >-
    upper(varname()) in $expected_variables and var_is_null(varname())
Outcome:
  Message: "An Expected variable is empty for all records."
Source:
  FDA_Validator_Rule_Message: "Expected variable with missing value for all records"
  FDA_Validator_Rule_Description: "Expected variables may contain some null values,\
    \ but in most cases will not contain null values for every record. When no data\
    \ has been collected for an Expected variable, however, a null column must still\
    \ be included in the dataset, and a comment must be included in the define.xml\
    \ to state that data was not collected."
  Domains: "CO, INTERVENTIONS, EVENTS, FINDINGS, FINDINGS ABOUT"
