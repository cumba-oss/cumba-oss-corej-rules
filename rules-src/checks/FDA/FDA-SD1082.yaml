Core:
  Id: "FDA-SD1082"
  Status: "Published"
  Version: "1"
Description: "Raise an error when a character variable's declared length does not\
  \ equal the longest actual stored value length in the dataset."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "ALL"
Check:
  expression: >-
    var_type("DATA") == "Char" and var_length("DATA") != max_value_length(variable_name)
Outcome:
  Message: "A character variable's declared length does not equal the maximum length\
    \ of its stored data."
  Output_Variables:
  - "variable_size"
  - "variable_max_size"
Source:
  FDA_Validator_Rule_Message: "Variable length is too long for actual data"
  FDA_Validator_Rule_Description: "Variable length should be assigned based on actual\
    \ stored data to minimize file size. Datasets should be re-sized to the maximum\
    \ length of actual data used prior to splitting."
  Domains: "ALL"
