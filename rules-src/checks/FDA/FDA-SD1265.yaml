Core:
  Id: "FDA-SD1265"
  Status: "Published"
  Version: "1"
Description: "Raise an error when the Origin (QORIG) is equal to 'ASSIGNED', indicating\
  \ subjective data, but the Evaluator (QEVAL) is not populated."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "SUPP--"
    - "SQ--"
Requirements:
  Variables:
    All:
    - "QORIG"
Check:
  expression: >-
    equalsIgnoreCase(QORIG, "ASSIGNED") and empty(QEVAL)
Outcome:
  Message: "QEVAL is empty when QORIG equals 'ASSIGNED'."
  Message_Folded: "QEVAL absent or not populated in any record of the dataset, and\
    \ at least one record meets the rest of the condition: QEVAL is empty when QORIG\
    \ equals 'ASSIGNED'."
  Output_Variables:
  - "QNAM"
Source:
  FDA_Validator_Rule_Message: "QEVAL is null when QORIG equals 'ASSIGNED'"
  FDA_Validator_Rule_Description: "For subjective data (when QORIG='ASSIGNED'), QEVAL\
    \ should be populated and the value should reflect the role of the person or institution\
    \ assigning the value."
  Domains: "SUPPQUAL"
