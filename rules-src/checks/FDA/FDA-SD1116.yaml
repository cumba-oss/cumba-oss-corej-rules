Core:
  Id: "FDA-SD1116"
  Status: "Published"
  Version: "1"
Description: "Raise an error when a variable that appears in more than one split dataset\
  \ of the same class is defined with inconsistent lengths across those split datasets."
Executability: "Fully Executable"
Scope:
  Classes:
    Include:
    - "INTERVENTIONS"
    - "EVENTS"
    - "FINDINGS"
    - "FINDINGS ABOUT"
Bindings:
- name: "$len_mismatch"
  expression: "split_sibling_length_mismatch()"
Check:
  expression: >-
    upper(varname()) in $len_mismatch
Outcome:
  Message: "Variable length is inconsistent across split datasets of the same class."
  Output_Variables:
  - "variable_name"
Source:
  FDA_Validator_Rule_Message: "Inconsistent variable length within split datasets"
  FDA_Validator_Rule_Description: "Split datasets should have matching variable lengths\
    \ for future merges. Datasets should be resized to the maximum length used prior\
    \ to splitting."
  Domains: "INTERVENTIONS, EVENTS, FINDINGS, FINDINGS ABOUT"
