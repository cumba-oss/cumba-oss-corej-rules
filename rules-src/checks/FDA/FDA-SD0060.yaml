Core:
  Id: "FDA-SD0060"
  Status: "Published"
  Version: "1"
Description: "Raise an error when a variable present in the submitted dataset is not\
  \ declared in the Define-XML."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "ALL"
Check:
  expression: >-
    not empty(varname()) and empty(var_name("DEFINE"))
Outcome:
  Message: "The variable is present in the dataset but is not described in the Define-XML."
Source:
  FDA_Validator_Rule_Message: "Variable in dataset is not present in define.xml"
  FDA_Validator_Rule_Description: "Variables included in the dataset must be described\
    \ in the data definition document (define.xml)."
  Domains: "ALL"
