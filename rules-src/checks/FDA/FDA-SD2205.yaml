Core:
  Id: "FDA-SD2205"
  Status: "Published"
  Version: "1"
Description: "Raise an error when the Trial Summary (TS) dataset does not contain\
  \ a record where TSPARMCD equals 'PLANSUB' (Planned Number of Subjects)."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "TS"
Bindings:
- name: "$plansub_count"
  expression: "record_count(filter=filter(TSPARMCD=\"PLANSUB\"))"
Check:
  expression: >-
    $plansub_count == 0
Outcome:
  Message: "Missing PLANSUB Trial Summary Parameter: a 'Planned Number of Subjects'\
    \ (PLANSUB) record must be present in the Trial Summary (TS) domain."
  Output_Variables:
  - "$plansub_count"
Source:
  FDA_Validator_Rule_Message: "Missing PLANSUB Trial Summary Parameter"
  FDA_Validator_Rule_Description: "'Planned Number of Subjects' (PLANSUB) record must\
    \ be populated in Trial Summary (TS) domain. It is expected for SDTM IG v3.1.2\
    \ data and required for data in all more recent SDTM versions."
  Domains: "TS"
