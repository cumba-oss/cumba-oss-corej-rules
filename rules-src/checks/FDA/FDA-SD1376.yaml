Core:
  Id: "FDA-SD1376"
  Status: "Published"
  Version: "1"
Description: "Raise an error when Subject Reference End Date/Time (RFENDTC) is empty\
  \ for a randomized subject, that is a subject whose Actual Arm Code (ACTARMCD) is\
  \ populated and is not equal to 'SCRNFAIL' or 'NOTASSGN'."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "DM"
Requirements:
  Variables:
    All:
    - "ACTARMCD"
Check:
  expression: >-
    not empty(ACTARMCD) and upper(ACTARMCD) not in ["SCRNFAIL", "NOTASSGN"] and empty(RFENDTC)
Outcome:
  Message: "RFENDTC is empty for a randomized subject (ACTARMCD is populated and not\
    \ equal to 'SCRNFAIL' or 'NOTASSGN')."
  Message_Folded: "RFENDTC absent or not populated in any record of the dataset, and\
    \ at least one record meets the rest of the condition: RFENDTC is empty for a\
    \ randomized subject (ACTARMCD is populated and not equal to 'SCRNFAIL' or 'NOTASSGN')."
Source:
  FDA_Validator_Rule_Message: "RFENDTC is not provided for a treated subject"
  FDA_Validator_Rule_Description: "Subject Reference End Date/Time (RFENDTC) should\
    \ be populated for all treated subjects, those where Actual Arm Code (ACTARMCD)\
    \ is not equal to 'SCRNFAIL', 'NOTASSGN' or 'NOTTRT' (or null)."
  Domains: "DM"
