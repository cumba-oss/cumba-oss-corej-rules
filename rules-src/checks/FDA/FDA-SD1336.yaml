Core:
  Id: "FDA-SD1336"
  Status: "Published"
  Version: "1"
Description: "Raise an error when a TRLNKID value in the TR domain is not present\
  \ as a TULNKID value in the TU domain for the same subject."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "TR"
Requirements:
  Variables:
    All:
    - "TRLNKID"
Bindings:
- name: "$tu_lnkid"
  expression: "distinct(TULNKID, domain=\"TU\", group=[USUBJID])"
Check:
  expression: >-
    not empty(TRLNKID) and TRLNKID not in $tu_lnkid
Outcome:
  Message: "TRLNKID does not match any TULNKID value in the TU domain for the subject."
  Output_Variables:
  - "$tu_lnkid"
Source:
  FDA_Validator_Rule_Message: "TRLNKID value does not exist in TU domain"
  FDA_Validator_Rule_Description: "A Link ID (TRLNKID) value for a tumor that is referenced\
    \ in the Tumor Results (TR) domain for a subject must also be present in the Tumor\
    \ Identification (TU) domain for that subject."
  Domains: "TR"
