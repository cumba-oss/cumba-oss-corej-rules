Core:
  Id: "FDA-SD0053"
  Status: "Published"
  Version: "1"
Description: "Raise an error when Description of Planned Arm (ARM) is not 'Not Assigned'\
  \ while Planned Arm Code (ARMCD) equals 'NOTASSGN'."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "DM"
    - "TA"
Requirements:
  Variables:
    All:
    - "ARMCD"
    - "ARM"
Check:
  expression: >-
    ARMCD == "NOTASSGN" and ARM != "Not Assigned"
Outcome:
  Message: "ARM is not 'Not Assigned' when ARMCD equals 'NOTASSGN'."
  Output_Variables:
  - "ARMCD"
  - "ARM"
Source:
  FDA_Validator_Rule_Message: "ARM is not 'Not Assigned', when ARMCD equals 'NOTASSGN',\
    \ or vice versa"
  FDA_Validator_Rule_Description: "Description of Arm (ARM) must equal 'Not Assigned',\
    \ when Arm Code (ARMCD) is 'NOTASSGN', and vice versa."
  Domains: "DM, TA"
Standards:
