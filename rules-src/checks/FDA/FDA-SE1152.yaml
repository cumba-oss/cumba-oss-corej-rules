Core:
  Id: "FDA-SE1152"
  Status: "Published"
  Version: "1"
Description: "Raise an error when Start Date/Time of Treatment (EXSTDTC) is populated\
  \ and is earlier than Subject Reference Start Date/Time (RFSTDTC) in the DM dataset."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "EX"
Requirements:
  Variables:
    All:
    - "EXSTDTC"
    - "USUBJID"
    All_Or_None:
    - - "USUBJID"
      - "DM.USUBJID"
Match_Datasets:
- Keys:
  - "USUBJID"
  Name: "DM"
Check:
  expression: >-
    not empty(EXSTDTC) and date(EXSTDTC) < date(DM.RFSTDTC)
Outcome:
  Message: "EXSTDTC is populated and is earlier than RFSTDTC in the DM dataset."
Source:
  FDA_Validator_Rule_Message: "EXSTDTC date is before RFSTDTC"
  FDA_Validator_Rule_Description: "Start Date/Time of Treatment (EXSTDTC) variable\
    \ value must be greater than or equal to Subject Reference Start Date/Time (RFSTDTC)."
  Domains: "INTERVENTIONS"
Standards:
- Organization: "FDA"
