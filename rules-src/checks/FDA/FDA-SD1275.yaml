Core:
  Id: "FDA-SD1275"
  Status: "Published"
  Version: "1"
Description: "Raise an error when --TESTCD is equal to 'MULTIPLE'."
Executability: "Fully Executable"
Scope:
  Classes:
    Include:
    - "FINDINGS"
Requirements:
  Variables:
    All:
    - "--TESTCD"
Check:
  expression: >-
    --TESTCD == "MULTIPLE"
Outcome:
  Message: "--TESTCD is equal to 'MULTIPLE'."
Source:
  FDA_Validator_Rule_Message: "--TESTCD equals 'MULTIPLE'"
  FDA_Validator_Rule_Description: "Test Code variables (--TESTCD) should not be populated\
    \ with values of 'MULTIPLE'."
