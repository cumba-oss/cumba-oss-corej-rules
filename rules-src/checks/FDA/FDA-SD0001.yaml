Core:
  Id: "FDA-SD0001"
  Status: "Published"
  Version: "1"
Description: "Raise an error when a dataset has no records; a dataset should have\
  \ at least one record."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "ALL"
Bindings:
- name: "$records_in_dataset"
  expression: "record_count()"
Check:
  expression: >-
    $records_in_dataset == 0
Outcome:
  Message: "Dataset has no records."
  Output_Variables:
  - "$records_in_dataset"
Source:
  FDA_Validator_Rule_Message: "No records in data source"
  FDA_Validator_Rule_Description: "Domain table should have at least one record."
  Domains: "ALL"
