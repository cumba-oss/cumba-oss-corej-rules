Core:
  Id: "FDA-SD1212"
  Status: "Published"
  Version: "1"
Description: "Raise an error when --STRESC represents a numeric value but --STRESN\
  \ is not equal to --STRESC."
Executability: "Fully Executable"
Scope:
  Classes:
    Include:
    - "FINDINGS"
    - "FINDINGS ABOUT"
Requirements:
  Variables:
    All:
    - "--STRESN"
    - "--STRESC"
Check:
  expression: >-
    not empty(--STRESN) and is_numeric(--STRESC) and --STRESN != num(--STRESC)
Outcome:
  Message: "--STRESN does not equal --STRESC, although --STRESC represents a numeric\
    \ value."
  Output_Variables:
  - "--TESTCD"
Source:
  FDA_Validator_Rule_Message: "--STRESN does not equal --STRESC"
  FDA_Validator_Rule_Description: "Standardized Result in Numeric Format (--STRESN)\
    \ variable value should be equal Standardized Result in Character Format (--STRESC)\
    \ variable value, when Standardized Result in Character Format (--STRESC) variable\
    \ value represents a numeric value."
  Domains: "FINDINGS, FINDINGS ABOUT"
