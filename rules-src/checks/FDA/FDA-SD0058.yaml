Core:
  Id: "FDA-SD0058"
  Status: "Published"
  Version: "1"
Description: "Raise an error when a variable present in a dataset is in neither the\
  \ SDTM model list of allowed variables for the observation class nor the IG's variable\
  \ list for the dataset (a sponsor-defined variable). Raise a warning when the IG\
  \ defines the variable for the dataset but the SDTM model version the IG links to\
  \ does not list it for the observation class (the IG runs ahead of its model)."
Executability: "Partially Executable - Possible Underreporting"
ExecutabilityHint:
  Category: "partially executable"
  Detail: "Two shapes escape the check. (1) A dataset no class tier places, or whose\
    \ class the linked model carries no variables for, resolves no model list and\
    \ the rule is SKIPPED for it: a domain the run's IG does not define whose code\
    \ the curated domain map does not know and whose columns show no topic variable\
    \ the class sniffer recognises (e.g. SDTMIG-MD's DI and DR in an SDTMIG 3.4 run),\
    \ an AP-- dataset whose parent domain is not in the study (the scope matcher places\
    \ it in no class either), and a special-purpose or trial-design domain the linked\
    \ model has no dataset for (e.g. SM, TD and TM under SDTMIG 3.1.2). Every other\
    \ domain the IG does not define - a sponsor-defined domain, or a standard one\
    \ the IG leaves out, such as the SEND domains SENDIG-AR 1.0 omits - is judged\
    \ against the model variables of the class the scope matcher gives it. (2) The\
    \ model's '--' templates are substituted without regard to the domain, so a template\
    \ meant for one domain is allowed on every dataset of the class (AEBEATNO on AE;\
    \ CDISC-CG0542 reports --BEATNO outside EG)."
Scope:
  Domains:
    Include:
    - "ALL"
Bindings:
- name: "$model_variables"
  expression: "get_model_column_order()"
- name: "$ig_variables"
  expression: "get_dataset_filtered_variables()"
Check:
  ERROR:
    expression: >-
      upper(varname()) not in $model_variables and upper(varname()) not in $ig_variables
    Message: "Variable is in neither the SDTM model list of allowed variables for the\
      \ observation class nor the IG's variable list for the dataset (sponsor-defined)."
  WARNING:
    expression: >-
      upper(varname()) not in $model_variables and upper(varname()) in $ig_variables
    Message: "Variable is defined by the IG for this dataset but is not in the SDTM model\
      \ list of allowed variables for the observation class of the model version the IG\
      \ links to."
Outcome:
  Message: "Variable is present in the dataset but is not listed in the SDTM model\
    \ list of allowed variables for the observation class."
  Output_Variables:
  - "variable_name"
  - "$model_variables"
  - "$ig_variables"
Source:
  FDA_Validator_Rule_Message: "Variable appears in dataset, but is not in SDTM model"
  FDA_Validator_Rule_Description: "Only variables listed in SDTM model should appear\
    \ in a dataset. New sponsor defined variables must not be added, and existing\
    \ variables must not be renamed or modified."
  Domains: "ALL"
