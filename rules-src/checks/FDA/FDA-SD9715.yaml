Core:
  Id: "FDA-SD9715"
  Status: "Published"
  Version: "1"
Description: "Raise an error when Standard Units (--STRESU) is not present in the\
  \ dataset although a numeric Character Result/Finding in Std Units (--STRESC) is\
  \ reported."
Sensitivity: "Dataset"
Executability: "Partially Executable - Possible Overreporting"
Scope:
  Classes:
    Include:
    - "FINDINGS"
    - "FINDINGS ABOUT"
Requirements:
  Variables:
    All:
    - "--STRESC"
Check:
  expression: >-
    not var_exists("--STRESU") and --STRESC =~ /^-?[0-9]+(\\.[0-9]+)?$/
Outcome:
  Message: "--STRESU is not present in the dataset although numeric standardised results\
    \ are reported."
  Output_Variables:
  - "--STRESC"
Source_Proposed:
  Sheet_Issue: "#172,#173,#174"
  FDA_Validator_Rule_Message: "Standard Units (--STRESU) is not present in the dataset\
    \ when --STRESC is provided as a numeric result"
  FDA_Validator_Rule_Description: "Standard Units (--STRESU) should be present in\
    \ the dataset, when Character Result/Finding in Std Units (--STRESC) is provided\
    \ as a numeric result."
  Domains: "FINDINGS, FINDINGS ABOUT"
Standards:
- Organization: "FDA"
  Standards:
  - Name: "SDTMIG"
    Version: "3.4"
  - Name: "SDTMIG"
    Version: "3.3"
  - Name: "SDTMIG"
    Version: "3.2"
  - Name: "SDTMIG"
    Version: "3.1.3"
  - Name: "SDTMIG"
    Version: "3.1.2"
  - Name: "SENDIG"
    Version: "3.1.1"
  - Name: "SENDIG"
    Version: "3.1"
  - Name: "SENDIG"
    Version: "3.0"
  - Name: "SENDIG-AR"
    Version: "1.0"
  - Name: "SENDIG-DART"
    Version: "1.1"
