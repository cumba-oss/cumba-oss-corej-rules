Core:
  Id: "FDA-SE2261"
  Status: "Published"
  Version: "1"
Description: "Raise an error when RPATHCD (Planned Repro Path Code) is longer than\
  \ 20 characters."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "DM"
    - "TP"
Check:
  expression: >-
    not empty(RPATHCD) and len(RPATHCD) > 20
Outcome:
  Message: "RPATHCD is longer than 20 characters."
Source:
  FDA_Validator_Rule_Message: "Invalid value for RPATHCD"
  FDA_Validator_Rule_Description: "The value of Planned Repro Path Code (RPATHCD)\
    \ should be no more than 20 characters in length."
  Domains: "DM, TP"
Standards:
- Organization: "FDA"
  Standards:
  - Name: "SENDIG-DART"
    Version: "1.1"
    References:
    - Origin: "FDA Validator Rules"
      Rule_Identifier:
        Id: "SE2261"
        Version: "1"
      Version: "1.6"
