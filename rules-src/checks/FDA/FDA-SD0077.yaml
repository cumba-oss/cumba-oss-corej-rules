Core:
  Id: "FDA-SD0077"
  Status: "Published"
  Version: "1"
Description: "Raise an error when the reference record defined by RDOMAIN, USUBJID,\
  \ IDVAR and IDVARVAL does not exist in the target domain."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "CO"
    - "SUPP--"
    - "SQ--"
    - "RELREC"
Requirements:
  Variables:
    All:
    - "USUBJID"
    - "IDVAR"
    - "IDVARVAL"
Match_Datasets:
- Child: true
  Keys:
  - "USUBJID"
  - "IDVAR"
  - "IDVARVAL"
  Name: "SUPP--"
- Child: true
  Keys:
  - "USUBJID"
  - "IDVAR"
  - "IDVARVAL"
  Name: "CO"
- Child: true
  Keys:
  - "USUBJID"
  - "IDVAR"
  - "IDVARVAL"
  Name: "RELREC"
Check:
  expression: >-
    not empty(IDVAR) and not empty(IDVARVAL) and str(IDVARVAL) != str(colref(IDVAR))
Outcome:
  Message: "The referenced record defined by RDOMAIN, USUBJID, IDVAR and IDVARVAL\
    \ does not exist in the target domain."
  Output_Variables:
  - "RDOMAIN"
Source:
  FDA_Validator_Rule_Message: "Invalid referenced record"
  FDA_Validator_Rule_Description: "Reference record defined by Related Domain Abbreviation\
    \ (RDOMAIN), Unique Subject Identifier (USUBJID), Identifying Variable (IDVAR)\
    \ and Identifying Variable Value (IDVARVAL) must exist in the target Domain."
  Domains: "CO, RELREC, SUPPQUAL"
