Core:
  Id: "PMDA-SD1031"
  Status: "Published"
  Version: "1"
Description: "Raise a warning when End Relative to Reference Period (--ENRF) is populated\
  \ for a subject with an empty Reference End Date/Time (RFENDTC) in the DM dataset."
Severity: "Warning"
Executability: "Fully Executable"
Scope:
  Classes:
    Include:
    - "SPECIAL PURPOSE"
    - "INTERVENTIONS"
    - "EVENTS"
    - "FINDINGS"
    - "FINDINGS ABOUT"
  Domains:
    Exclude:
    - "CO"
    - "DM"
Requirements:
  Variables:
    All:
    - "--ENRF"
    - "USUBJID"
    All_Or_None:
    - - "USUBJID"
      - "DM.USUBJID"
Match_Datasets:
- Keys:
  - "USUBJID"
  Name: "DM"
Check:
  expression: >-
    empty(DM.RFENDTC) and not empty(--ENRF)
Outcome:
  Message: "--ENRF is populated when RFENDTC in the DM dataset is empty."
  Output_Variables:
  - "--ENRF"
  - "DM.RFENDTC"
Source:
  Message: "Value for --ENRF is populated when RFENDTC is null"
  Description: "End Relative to Reference Period (--ENRF) should not be populated\
    \ for subjects with missing value for Reference End Date/Time (RFENDTC)."
  Domains: "SPECIAL PURPOSE (-CO, -DM), INTERVENTIONS, FINDINGS, EVENTS, FINDINGS\
    \ ABOUT"
  Severity: "Warning"
