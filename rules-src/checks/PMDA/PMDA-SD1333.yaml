Core:
  Id: "PMDA-SD1333"
  Status: "Published"
  Version: "1"
Description: "Raise a warning when the Outcome of Adverse Event (AEOUT) is equal to\
  \ 'RECOVERED/RESOLVED' but neither an End Date/Time of Adverse Event (AEENDTC) nor\
  \ a Duration of Adverse Event (AEDUR) is provided."
Severity: "Warning"
Executability: "Partially Executable - Possible Underreporting"
Scope:
  Domains:
    Include:
    - "AE"
Requirements:
  Variables:
    All:
    - "AEOUT"
    Any:
    - "AEENDTC"
    - "AEDUR"
Check:
  expression: >-
    AEOUT == "RECOVERED/RESOLVED" and empty(AEENDTC) and empty(AEDUR)
Outcome:
  Message: "Neither AEENDTC nor AEDUR is populated, when AEOUT is equal to RECOVERED/RESOLVED."
  Output_Variables:
  - "AEOUT"
  - "AEENDTC"
  - "AEDUR"
Source:
  Message: "AEOUT = RECOVERED/RESOLVED, but an end date or collected duration is not\
    \ provided"
  Description: "The Outcome of Adverse Event (AEOUT) variable is populated with the\
    \ value RECOVERED/RESOLVED, however the End Date/Time of Adverse Event (AEENDTC)\
    \ or Duration of Adverse Event (AEDUR) variables are null. If the adverse event\
    \ has an outcome of RECOVERED/RESOLVED, it is expected that an end date or a collected\
    \ duration be provided."
  Domains: "AE"
  Severity: "Warning"
Standards:
