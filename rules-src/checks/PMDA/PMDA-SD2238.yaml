Core:
  Id: "PMDA-SD2238"
  Status: "Published"
  Version: "1"
Description: "Raise an error when --STTPT does not have the same value across records\
  \ with the same values of USUBJID and --STDTC."
Executability: "Fully Executable"
Scope:
  Classes:
    Include:
    - "INTERVENTIONS"
    - "EVENTS"
  Domains:
    Exclude:
    - "DE"
    - "DT"
    - "DX"
    - "EC"
    - "HO"
    - "PR"
Requirements:
  Variables:
    All:
    - "--STTPT"
Check:
  expression: >-
    var_exists("USUBJID") and var_exists("--STDTC") and is_inconsistent_across_dataset(--STTPT,
    keys=[USUBJID, --STDTC])
Outcome:
  Message: "Inconsistent value for --STTPT within USUBJID and --STDTC"
Source:
  Message: "Inconsistent value for --STTPT"
  Description: "Start Reference Time Point (--STTPT) value must be consistent for\
    \ all records with same Subject (USUBJID) and Start Date/Time (--STDTC) values."
  Domains: "INTERVENTIONS (-DX, -EC, -PR), EVENTS (-DE, -DT, -HO)"
  Severity: "Error"
