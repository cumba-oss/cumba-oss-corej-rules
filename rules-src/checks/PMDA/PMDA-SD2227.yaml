Core:
  Id: "PMDA-SD2227"
  Status: "Published"
  Version: "1"
Description: "Raise a warning when the Trial Summary (TS) dataset does not contain\
  \ a record where TSPARMCD equals 'DCUTDESC' (Data Cutoff Description)."
Severity: "Warning"
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "TS"
Bindings:
- name: "$dcutdesc_count"
  expression: "record_count(filter=(TSPARMCD == \"DCUTDESC\"))"
Check:
  expression: >-
    $dcutdesc_count == 0
Outcome:
  Message: "Missing DCUTDESC Trial Summary Parameter: a 'Data Cutoff Description'\
    \ (DCUTDESC) record must be present in the Trial Summary (TS) domain."
Source:
  Message: "Missing DCUTDESC Trial Summary Parameter"
  Description: "'Data Cutoff Description' (DCUTDESC) record must be populated in Trial\
    \ Summary (TS) domain. It is expected for SDTM IG v3.1.2 data and required for\
    \ data in all more recent SDTM versions."
  Domains: "TS"
  Severity: "Warning"
