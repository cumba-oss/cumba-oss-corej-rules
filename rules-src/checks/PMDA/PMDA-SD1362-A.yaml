Core:
  Id: "PMDA-SD1362-A"
  Status: "Published"
  Version: "1"
Description: "Raise an error when Actual Arm Code (ACTARMCD) is populated but Description\
  \ of Actual Arm (ACTARM) is empty; both must be populated together."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "DM"
Requirements:
  Variables:
    All:
    - "ACTARMCD"
    - "ACTARM"
Check:
  expression: >-
    not empty(ACTARMCD) and empty(ACTARM)
Outcome:
  Message: "ACTARMCD is populated but ACTARM is empty."
  Output_Variables:
  - "ACTARMCD"
  - "ACTARM"
Source_Proposed:
  Sheet_Issue: "#225"
  Message: "ACTARMCD is populated, but ACTARM is null"
  Description: "Description of Actual Arm (ACTARM) must be populated when Actual Arm\
    \ Code (ACTARMCD) is populated."
  Domains: "DM"
  Severity: "Error"
Source:
  Message: "ACTARM is populated, but ACTARMCD is null, or vice versa"
  Description: "Description of Actual Arm (ACTARM) must be populated when Actual Arm\
    \ Code (ACTARMCD) is populated, and vice versa."
  Domains: "DM"
  Severity: "Error"
