Core:
  Id: "PMDA-AD0053"
  Status: "Published"
  Version: "1"
Description: "Raise an error when the combination of Study Identifier (STUDYID) and\
  \ Unique Subject Identifier (USUBJID) on an analysis-dataset record is not found\
  \ in the SDTM Demographics (DM) domain; ADaM subjects must be traceable to SDTM\
  \ DM."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "SUBJECT LEVEL ANALYSIS DATASET"
    - "DEVICE LEVEL ANALYSIS DATASET"
Requirements:
  Variables:
    All:
    - "DM.USUBJID"
    - "STUDYID"
    All_Or_None:
    - - "STUDYID"
      - "DM.STUDYID"
    - - "USUBJID"
      - "DM.USUBJID"
Match_Datasets:
- Join_Type: "left"
  Keys:
  - "STUDYID"
  - "USUBJID"
  Cardinality: "n:1"
  Name: "DM"
Check:
  expression: >-
    not DM._matched_
Outcome:
  Message: "The combination of STUDYID and USUBJID does not exist in the SDTM DM domain."
  Output_Variables:
  - "STUDYID"
  - "DM.DOMAIN"
Source:
  Message: "The combination of STUDYID and USUBJID value does not exist in the SDTM\
    \ DM domain"
  Description: "The combination of Study Identifier (STUDYID) and Unique Subject Identifier\
    \ (USUBJID) is not found in the SDTM Demographics domain. There must be traceability\
    \ between ADaM and SDTM."
  Domains: "ADSL, ADDL"
  Severity: "Error"
Standards:
- Organization: "PMDA"
  Standards:
  - Name: "ADaMIG"
    Version: "1.3"
    References:
    - Origin: "PMDA Validation Rules"
      Rule_Identifier:
        Id: "AD0053"
        Version: "1"
      Version: "6.0"
  - Name: "ADaMIG"
    Version: "1.2"
    References:
    - Origin: "PMDA Validation Rules"
      Rule_Identifier:
        Id: "AD0053"
        Version: "1"
      Version: "6.0"
  - Name: "ADaMIG"
    Version: "1.1"
    References:
    - Origin: "PMDA Validation Rules"
      Rule_Identifier:
        Id: "AD0053"
        Version: "1"
      Version: "6.0"
  - Name: "ADaMIG"
    Version: "1.0"
    References:
    - Origin: "PMDA Validation Rules"
      Rule_Identifier:
        Id: "AD0053"
        Version: "1"
      Version: "6.0"
