Core:
  Id: "PMDA-SD1076"
  Status: "Published"
  Version: "1"
Description: "Raise a warning when a variable present in the dataset is a permissible\
  \ SDTM model variable for the dataset's general observation class but is not part\
  \ of the domain's IG specification."
Severity: "Warning"
Executability: "Partially Executable - Possible Underreporting"
Scope:
  Domains:
    Include:
    - "ALL"
Bindings:
- name: "$allowed_variables"
  expression: "get_model_column_order()"
- name: "$ig_req"
  expression: "upper(get_dataset_filtered_variables(key_name=\"core\", key_value=\"\
    Req\"))"
- name: "$ig_exp"
  expression: "upper(get_dataset_filtered_variables(key_name=\"core\", key_value=\"\
    Exp\"))"
- name: "$ig_perm"
  expression: "upper(get_dataset_filtered_variables(key_name=\"core\", key_value=\"\
    Perm\"))"
Check:
  expression: >-
    upper(varname()) in $allowed_variables and upper(varname()) not in $ig_req and upper(varname())
    not in $ig_exp and upper(varname()) not in $ig_perm
Outcome:
  Message: "Variable is a permissible SDTM model variable for the general observation\
    \ class but is not part of the domain's IG specification."
  Output_Variables:
  - "!$ig_req"
  - "!$ig_exp"
  - "!$ig_perm"
Source:
  Message: "Model Permissible variable added into standard domain"
  Description: "SDTM model variable may be added into standard domains according to\
    \ its domain general class, if there are no restrictions on their usage specified\
    \ in IG."
  Domains: "ALL"
  Severity: "Warning"
