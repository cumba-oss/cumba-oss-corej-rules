Core:
  Id: "PMDA-SD1322"
  Status: "Published"
  Version: "1"
Description: "Raise an error when the Country (COUNTRY) variable is populated with\
  \ a value that is not a term in the non-extensible CDISC COUNTRY controlled terminology\
  \ codelist (ISO 3166-1 alpha-3)."
Executability: "Partially Executable - Possible Underreporting"
Scope:
  Domains:
    Include:
    - "DM"
Check:
  expression: >-
    equalsIgnoreCase(varname(), "COUNTRY") and var_codelist_extensible("LIBRARY") == false and not
    empty(var_codelist_coded_values("LIBRARY")) and not empty(value()) and value() not in
    var_codelist_coded_values("LIBRARY")
Outcome:
  Message: "COUNTRY is populated with a value that is not found in the ISO 3166 (CDISC\
    \ COUNTRY) codelist."
  Output_Variables:
  - "variable_name"
  - "variable_value"
Source:
  Message: "Value for COUNTRY not found in GENC"
  Description: "Value for the Country (COUNTRY) variable must be populated using terms\
    \ found in Geopolitical Entities, Names, and Codes (GENC) dictionary. Note that\
    \ country codes in GENC and ISO 3166 are the same for most cases."
  Domains: "DM"
  Severity: "Error"
