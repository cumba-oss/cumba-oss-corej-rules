Core:
  Id: "PMDA-SD1137"
  Status: "Published"
  Version: "1"
Description: "Raise a warning when --DRVFL is equal to 'Y' but --ORRES is populated.\
  \ A derived result should not carry a collected --ORRES value."
Severity: "Warning"
Executability: "Fully Executable"
Scope:
  Classes:
    Include:
    - "FINDINGS"
    - "FINDINGS ABOUT"
Requirements:
  Variables:
    All:
    - "--DRVFL"
    - "--ORRES"
Check:
  expression: >-
    --DRVFL == "Y" and not empty(--ORRES)
Outcome:
  Message: "--ORRES is not empty when --DRVFL equals 'Y'."
Source:
  Message: "Non-missing value for --ORRES when --DRVFL='Y'"
  Description: "Character Result/Finding in Original Units (--ORRES) value should\
    \ be null when Derived Flag (--DRVFL) value is 'Y'."
  Domains: "FINDINGS, FINDINGS ABOUT"
  Severity: "Warning"
