Core:
  Id: "PMDA-SD0002"
  Status: "Published"
  Version: "1"
Description: "Raise an error when a variable whose Core attribute is 'Req' (Required)\
  \ is not populated in a record."
Severity: "Reject"
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "ALL"
Bindings:
- name: "$required_variables"
  expression: "required_variables()"
Check:
  expression: >-
    upper(varname()) in $required_variables and empty(value())
Outcome:
  Message: "A variable marked as Required (Core attribute 'Req') is not populated."
  Output_Variables:
  - "variable_value"
Source:
  Message: "Null value in variable marked as Required"
  Description: "Required variables (where Core attribute is 'Req') cannot be null\
    \ for any records."
  Domains: "ALL"
  Severity: "Reject"
