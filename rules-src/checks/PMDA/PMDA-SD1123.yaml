Core:
  Id: "PMDA-SD1123"
  Status: "Published"
  Version: "1"
Description: "Raise a warning when Status (--STAT) is equal to 'NOT DONE' but the\
  \ Original Result (--ORRES) is populated."
Severity: "Warning"
Executability: "Fully Executable"
Scope:
  Classes:
    Include:
    - "FINDINGS"
    - "FINDINGS ABOUT"
Requirements:
  Variables:
    All:
    - "--STAT"
Check:
  expression: >-
    --STAT == "NOT DONE" and not empty(--ORRES)
Outcome:
  Message: "--ORRES is populated when --STAT is equal to 'NOT DONE'."
Source:
  Message: "--ORRES value is populated when --STAT is 'NOT DONE'"
  Description: "Value of Original Result (--ORRES) variable is expected to be missing\
    \ when observation was not performed (Status (--STAT) is 'NOT DONE')."
  Domains: "FINDINGS, FINDINGS ABOUT"
  Severity: "Warning"
