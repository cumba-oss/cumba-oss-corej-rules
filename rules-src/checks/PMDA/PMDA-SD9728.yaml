Core:
  Id: "PMDA-SD9728"
  Status: "Published"
  Version: "1"
Description: "Raise an error when Related Domain Abbreviation (RDOMAIN) is not present\
  \ in the dataset although a record populates Identifying Variable (IDVAR) or Identifying\
  \ Variable Value (IDVARVAL)."
Sensitivity: "Dataset"
Executability: "Partially Executable - Possible Overreporting"
Scope:
  Domains:
    Include:
    - "CO"
Requirements:
  Variables:
    None:
    - "RDOMAIN"
    Any:
    - "IDVAR"
    - "IDVARVAL"
Check:
  expression: >-
    not empty(IDVAR) or not empty(IDVARVAL)
Outcome:
  Message: "RDOMAIN is not present in the dataset although IDVAR or IDVARVAL is populated."
Source_Proposed:
  Sheet_Issue: "#207"
  Message: "The RDOMAIN variable is not present in the dataset when IDVAR or IDVARVAL\
    \ is populated"
  Description: "The Related Domain Abbreviation (RDOMAIN) variable must be present\
    \ in the dataset when the value of the Identifying Variable (IDVAR) or Identifying\
    \ Variable Value (IDVARVAL) variable is populated."
  Domains: "CO"
  Severity: "Error"
Standards:
- Organization: "PMDA"
  Standards:
  - Name: "SDTMIG"
    Version: "3.4"
  - Name: "SDTMIG"
    Version: "3.3"
  - Name: "SDTMIG"
    Version: "3.2"
  - Name: "SDTMIG"
    Version: "3.1.3"
  - Name: "SDTMIG"
    Version: "3.1.2"
