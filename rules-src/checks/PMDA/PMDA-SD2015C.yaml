Core:
  Id: "PMDA-SD2015C"
  Status: "Published"
  Version: "1"
Description: "Raise a warning when a System Organ Class (--SOC) value does not match\
  \ the case of its MedDRA System Organ Class."
Severity: "Warning"
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "AE"
    - "CE"
    - "MH"
Requirements:
  Variables:
    All:
    - "--SOC"
Bindings:
- name: "$soc_case_valid"
  expression: "valid_external_dictionary_value(--SOC, external_dictionary_type=\"\
    meddra\", dictionary_term_type=\"SOC\", case_sensitive=true)"
Check:
  expression: >-
    $soc_case_valid == false
Outcome:
  Message: "System Organ Class (--SOC) does not match the MedDRA System Organ Class\
    \ case."
  Output_Variables:
  - "--SOC"
Source:
  Message: "Value for --SOC is in incorrect case"
  Description: "Case for System Organ Class (--SOC) variable must be sentence case\
    \ using a System Organ Class of the MedDRA dictionary of a version specified in\
    \ the define.xml (Case-sensitive)."
  Domains: "AE, CE, MH"
  Severity: "Warning"
