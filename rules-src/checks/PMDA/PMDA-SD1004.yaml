Core:
  Id: "PMDA-SD1004"
  Status: "Published"
  Version: "1"
Description: "Raise an error when the value of Planned Arm Code (ARMCD) is longer\
  \ than 20 characters."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "DM"
    - "TA"
    - "TV"
Check:
  expression: >-
    len(ARMCD) > 20
Outcome:
  Message: "ARMCD value length is greater than 20 characters."
Source:
  Message: "Invalid value for ARMCD exceeding 20 characters"
  Description: "The value of Planned Arm Code (ARMCD) should be no more than 20 characters\
    \ in length."
  Domains: "DM, TA, TV"
  Severity: "Error"
