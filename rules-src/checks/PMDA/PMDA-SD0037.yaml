Core:
  Id: "PMDA-SD0037"
  Status: "Published"
  Version: "1"
Description: "Raise an error when a value is not a term in the user-defined codelist\
  \ associated with the variable in the Define-XML."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "ALL"
Check:
  expression: >-
    not empty(value()) and var_has_codelist("DEFINE") == true and value() not in
    var_codelist_coded_values("DEFINE")
Outcome:
  Message: "The value is not in the codelist associated with the variable in the Define-XML."
Source:
  Message: "Value for variable not found in user-defined codelist"
  Description: "Variable values should be populated with terms found in the user-defined\
    \ codelist associated with the variable in define.xml."
  Domains: "ALL"
  Severity: "Error"
