Core:
  Id: "PMDA-SD0046"
  Status: "Published"
  Version: "1"
Description: "Raise an error when QNAM is present and QLABEL is present and QLABEL\
  \ does not have the same value across records with the same value of QNAM."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "SUPP--"
    - "SQ--"
Requirements:
  Variables:
    All:
    - "QLABEL"
Check:
  expression: >-
    var_exists("QNAM") and is_inconsistent_across_dataset(QLABEL, keys=[QNAM])
Outcome:
  Message: "Inconsistent value for QLABEL within QNAM"
Source:
  Message: "Inconsistent value for QLABEL within QNAM"
  Description: "All values of Qualifier Variable Label (QLABEL) should be the same\
    \ for a given value of Qualifier Variable Name (QNAM)."
  Domains: "SUPPQUAL"
  Severity: "Error"
