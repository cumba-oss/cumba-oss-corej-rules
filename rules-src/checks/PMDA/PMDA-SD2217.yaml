Core:
  Id: "PMDA-SD2217"
  Status: "Published"
  Version: "1"
Description: "Raise a warning when the Trial Summary (TS) dataset does not contain\
  \ a record where TSPARMCD equals 'OBJPRIM' (Trial Primary Objective)."
Severity: "Warning"
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "TS"
Bindings:
- name: "$objprim_count"
  expression: "record_count(filter=filter(TSPARMCD=\"OBJPRIM\"))"
Check:
  expression: >-
    $objprim_count == 0
Outcome:
  Message: "Missing OBJPRIM Trial Summary Parameter: a 'Trial Primary Objective' (OBJPRIM)\
    \ record must be present in the Trial Summary (TS) domain."
  Output_Variables:
  - "$objprim_count"
Source:
  Message: "Missing OBJPRIM Trial Summary Parameter"
  Description: "'Trial Primary Objective' (OBJPRIM) record must be populated in Trial\
    \ Summary (TS) domain. It is expected for SDTM IG v3.1.2 data and required for\
    \ data in all more recent SDTM versions."
  Domains: "TS"
  Severity: "Warning"
