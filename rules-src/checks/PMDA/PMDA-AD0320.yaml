Core:
  Id: "PMDA-AD0320"
  Status: "Published"
  Version: "1"
Description: "Raise an error when the dataset named 'ADSL' has a dataset label other\
  \ than 'Subject-Level Analysis Dataset'; the Subject-Level Analysis Dataset must\
  \ carry its standard label."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "SUBJECT LEVEL ANALYSIS DATASET"
Check:
  expression: >-
    ds_label("DATA") != "Subject-Level Analysis Dataset"
Outcome:
  Message: "The ADSL dataset label is not 'Subject-Level Analysis Dataset'."
  Output_Variables:
  - "dataset_name"
Source:
  Message: "Non-standard dataset label"
  Description: "The dataset label for a dataset named 'ADSL' must be 'Subject-Level\
    \ Analysis Dataset'."
  Domains: "ADSL"
  Severity: "Error"
Standards:
- Organization: "PMDA"
  Standards:
  - Name: "ADaMIG"
    Version: "1.3"
    References:
