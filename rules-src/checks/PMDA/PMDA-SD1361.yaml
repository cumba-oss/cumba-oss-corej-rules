Core:
  Id: "PMDA-SD1361"
  Status: "Published"
  Version: "1"
Description: "Raise an error when Description of Planned Arm (ARM) is populated but\
  \ Planned Arm Code (ARMCD) is empty; both must be populated together."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "DM"
Requirements:
  Variables:
    All:
    - "ARMCD"
    - "ARM"
Check:
  expression: >-
    not empty(ARM) and empty(ARMCD)
Outcome:
  Message: "ARM is populated but ARMCD is empty."
Source:
  Message: "ARM is populated, but ARMCD is null, or vice versa"
  Description: "Description of Planned Arm (ARM) must be populated when Planned Arm\
    \ Code (ARMCD) is populated, and vice versa."
  Domains: "DM"
  Severity: "Error"
