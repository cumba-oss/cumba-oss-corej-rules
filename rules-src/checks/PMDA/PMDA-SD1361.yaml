Core:
  Id: "PMDA-SD1361"
  Status: "Published"
  Version: "1"
Description: "Raise an error when exactly one of Planned Arm Code (ARMCD) and Description\
  \ of Planned Arm (ARM) is populated while the other is empty; both must be populated\
  \ together."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "DM"
Check:
  expression: >-
    not empty(ARM) and empty(ARMCD) or empty(ARM) and not empty(ARMCD)
Outcome:
  Message: "ARM is populated but ARMCD is empty, or ARMCD is populated but ARM is\
    \ empty."
  Output_Variables:
  - "ARMCD"
  - "ARM"
Source:
  Message: "ARM is populated, but ARMCD is null, or vice versa"
  Description: "Description of Planned Arm (ARM) must be populated when Planned Arm\
    \ Code (ARMCD) is populated, and vice versa."
  Domains: "DM"
  Severity: "Error"
