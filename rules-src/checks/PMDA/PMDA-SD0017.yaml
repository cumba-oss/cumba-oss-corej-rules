Core:
  Id: "PMDA-SD0017"
  Status: "Published"
  Version: "1"
Description: "Raise an error when the value of Name of Measurement, Test or Examination\
  \ (--TEST) is more than 40 characters in length."
Executability: "Fully Executable"
Scope:
  Classes:
    Include:
    - "FINDINGS"
    - "FINDINGS ABOUT"
  Domains:
    Exclude:
    - "IE"
Check:
  expression: >-
    len(--TEST) > 40
Outcome:
  Message: "--TEST value length is greater than 40 characters."
  Output_Variables:
  - "--TESTCD"
Source:
  Message: "Invalid value for --TEST variable"
  Description: "The value of Name of Measurement, Test or Examination (--TEST) should\
    \ be no more than 40 characters in length."
  Domains: "FINDINGS (-IE), FINDINGS ABOUT"
  Severity: "Error"
