Core:
  Id: "PMDA-AD0247"
  Status: "Published"
  Version: "1"
Description: "Raise an error when the Censor (CNSR) variable is populated on a record\
  \ but one or more of the companion analysis variables is missing on the same record:\
  \ the Analysis Value (AVAL) is missing, or the Time-to-Event Origin Date for Subject\
  \ (STARTDT) is missing, or both the Analysis Date (ADT) and Analysis Datetime (ADTM)\
  \ are missing. When an event is censored, AVAL, STARTDT, and at least one of ADT\
  \ or ADTM must all be populated."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "BASIC DATA STRUCTURE"
    - "MEDICAL DEVICE BASIC DATA STRUCTURE"
Check:
  expression: >-
    not empty(CNSR) and (empty(AVAL) or empty(STARTDT) or empty(ADT) and empty(ADTM))
Outcome:
  Message: "CNSR is populated, but AVAL, STARTDT, and at least one of ADT or ADTM\
    \ are not all populated."
  Message_Folded: "ADT, ADTM, AVAL or STARTDT not populated in any record of the dataset,\
    \ and at least one record meets the rest of the condition: CNSR is populated,\
    \ but AVAL, STARTDT, and at least one of ADT or ADTM are not all populated."
Source:
  Message: "CNSR is populated, but AVAL, STARTDT, and one of [ADT, ADTM] are not populated"
  Description: "When an event is censored, 3 other variables must be populated. Censor\
    \ (CNSR) variable qualifies the Analysis Value (AVAL) variable. ADT and ADTM variables\
    \ are the Analysis Date and Time of event or censoring associated with AVAL. Origin\
    \ Date for Subject (STARTDT) variable is the original date of risk for the time-to-event\
    \ analysis. This is generally the time at which a subject is first at risk for\
    \ the event of interest evaluation."
  Domains: "BDS, ADNCA, MDBDS"
  Severity: "Error"
