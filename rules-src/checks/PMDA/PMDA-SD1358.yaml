Core:
  Id: "PMDA-SD1358"
  Status: "Published"
  Version: "1"
Description: "Raise an error when the Actual Arm Code (ACTARMCD) or Description of\
  \ Actual Arm (ACTARM) is empty but the Reason Arm and/or Actual Arm is Null (ARMNRS)\
  \ is not populated."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "DM"
Check:
  expression: >-
    (empty(ACTARMCD) or empty(ACTARM)) and empty(ARMNRS)
Outcome:
  Message: "ARMNRS is not populated, when ACTARMCD or ACTARM is empty."
Source:
  Message: "ARMNRS is not populated, when ACTARMCD or ACTARM is null"
  Description: "When Actual Arm Code (ACTARMCD)/Description of Actual Arm (ACTARM)\
    \ are not populated, the Reason Arm and/or Actual Arm is Null (ARMNRS) variable\
    \ must be populated with the reason ACTARMCD/ACTARM are null."
  Domains: "DM"
  Severity: "Error"
