Core:
  Id: "PMDA-SD1102"
  Status: "Published"
  Version: "1"
Description: "Raise a warning when End Reference Time Point (--ENTPT) is present in\
  \ the dataset but End Relative to Reference Time Point (--ENRTPT) is not present\
  \ in the dataset."
Severity: "Warning"
Executability: "Fully Executable"
Scope:
  Classes:
    Include:
    - "SPECIAL PURPOSE"
    - "INTERVENTIONS"
    - "EVENTS"
    - "FINDINGS"
    - "FINDINGS ABOUT"
  Domains:
    Exclude:
    - "CO"
    - "DM"
Check:
  expression: >-
    var_exists("--ENTPT") and not var_exists("--ENRTPT")
Outcome:
  Message: "--ENRTPT variable is not present when --ENTPT variable is present."
  Output_Variables:
  - "--ENTPT"
Source:
  Message: "Missing --ENRTPT variable when --ENTPT variable is present"
  Description: "End Relative to Reference Time Point (--ENRTPT) variable must be included\
    \ into the domain when End Relative Time Point (--ENTPT) variable is present."
  Domains: "SPECIAL PURPOSE (-CO, -DM), INTERVENTIONS, FINDINGS, EVENTS, FINDINGS\
    \ ABOUT"
  Severity: "Warning"
