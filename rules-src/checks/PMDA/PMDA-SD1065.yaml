Core:
  Id: "PMDA-SD1065"
  Status: "Published"
  Version: "1"
Description: "Raise an error when IDVAR is populated but RDOMAIN is empty."
Executability: "Partially Executable - Possible Underreporting"
Scope:
  Domains:
    Include:
    - "CO"
Requirements:
  Variables:
    All:
    - "IDVAR"
    - "RDOMAIN"
Check:
  expression: >-
    not empty(IDVAR) and empty(RDOMAIN)
Outcome:
  Message: "Missing RDOMAIN value, when IDVAR is populated"
  Output_Variables:
  - "RDOMAIN"
  - "IDVAR"
Source:
  Message: "Missing RDOMAIN value when IDVAR is populated"
  Description: "Value of Related Domain Abbreviation (RDOMAIN) variable must be populated\
    \ when value of Identifying Variable (IDVAR) variable is populated."
  Domains: "CO"
  Severity: "Error"
