Core:
  Id: "PMDA-SD1312"
  Status: "Published"
  Version: "1"
Description: "Raise a warning when a record with TSPARMCD equal to 'STYPE' and TSVAL\
  \ equal to 'INTERVENTIONAL' exists in TS but TSVAL is empty for the record where\
  \ TSPARMCD equals 'PCLAS'."
Severity: "Warning"
Executability: "Partially Executable - Possible Overreporting"
Scope:
  Domains:
    Include:
    - "TS"
Requirements:
  Variables:
    All:
    - "TSPARMCD"
Bindings:
- name: "$STYPE_INTERVENTIONAL"
  expression: "record_count(group=[STUDYID], filter=(TSPARMCD == \"STYPE\" and TSVAL\
    \ == \"INTERVENTIONAL\"))"
Check:
  expression: >-
    TSPARMCD == "PCLAS" and $STYPE_INTERVENTIONAL >= 1 and empty(TSVAL)
Outcome:
  Message: "TSVAL is empty for the PCLAS Trial Summary Parameter when a record exists\
    \ with TSPARMCD equal to 'STYPE' and TSVAL equal to 'INTERVENTIONAL'."
  Output_Variables:
  - "TSPARMCD"
  - "TSVAL"
  - "$STYPE_INTERVENTIONAL"
Source:
  Message: "TSVAL is missing for the PCLAS Trial Summary Parameter when STYPE parameter\
    \ equals 'INTERVENTIONAL'"
  Description: "When the study type is interventional (TSPARMCD = 'STYPE' and TSVAL\
    \ = 'INTERVENTIONAL'), the Pharmacologic Class parameter should be provided with\
    \ Parameter Value populated (TSVAL should not be null when TSPARMCD = 'PCLAS')."
  Domains: "TS"
  Severity: "Warning"
