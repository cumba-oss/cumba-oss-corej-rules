Core:
  Id: "PMDA-SD1271"
  Status: "Published"
  Version: "1"
Description: "Raise a warning when the combination of ELEMENT, TESTRL, TEENRL, and\
  \ TEDUR is not unique for each ETCD."
Severity: "Warning"
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "TE"
Check:
  expression: >-
    not is_unique_set([ETCD, ELEMENT, TESTRL, TEENRL, TEDUR])
Outcome:
  Message: "The combination of ELEMENT, TESTRL, TEENRL, and TEDUR is not unique for\
    \ each ETCD."
Source:
  Message: "The combination of ELEMENT, TESTRL TEENRL, and TEDUR is not unique for\
    \ each ETCD"
  Description: "The combination of Description of Element (ELEMENT), Rule for Start\
    \ of Element (TESTRL), Rule for End of Element (TEENRL), and Planned Duration\
    \ of Element (TEDUR) should be unique for each Element Code (ETCD)."
  Domains: "TE"
  Severity: "Warning"
