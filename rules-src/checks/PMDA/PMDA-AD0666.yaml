Core:
  Id: "PMDA-AD0666"
  Status: "Published"
  Version: "1"
Description: "Raise an error when DOSPCTDF (Percent Diff. Nominal vs. Actual Dose)\
  \ is populated on a record but DOSEP (Planned Treatment Dose) and/or DOSEA (Actual\
  \ Treatment Dose) is not populated; when DOSPCTDF is populated, both DOSEP and DOSEA\
  \ must be populated."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "BASIC DATA STRUCTURE"
Check:
  expression: >-
    not empty(DOSPCTDF) and (empty(DOSEP) or empty(DOSEA))
Outcome:
  Message: "DOSPCTDF is populated but DOSEP and/or DOSEA is not populated."
  Message_Folded: "DOSEA and DOSEP absent or not populated in any record of the dataset,\
    \ and at least one record meets the rest of the condition: DOSPCTDF is populated\
    \ but DOSEP and/or DOSEA is not populated."
Source:
  Message: "DOSPCTDF is populated and DOSEP and DOSEA are not populated"
  Description: "If DOSPCTDF (Percent Diff. Nominal vs. Actual Dose) is populated,\
    \ both DOSEP (Planned Treatment Dose) and DOSEA (Actual Treatment Dose) must be\
    \ populated."
  Domains: "ADNCA"
  Severity: "Error"
Standards:
- Organization: "PMDA"
  Standards:
  - Name: "ADaMIG"
    Version: "1.3"
    References:
    - Origin: "PMDA Validation Rules"
      Rule_Identifier:
        Id: "AD0666"
        Version: "1"
      Version: "6.0"
