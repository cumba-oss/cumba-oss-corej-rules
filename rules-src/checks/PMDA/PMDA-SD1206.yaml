Core:
  Id: "PMDA-SD1206"
  Status: "Published"
  Version: "1"
Description: "Raise an error when EXSTDTC is populated and is after DM.RFXENDTC (Date/Time\
  \ of Last Study Treatment)."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "EX"
Requirements:
  Variables:
    All:
    - "USUBJID"
    - "EXSTDTC"
    All_Or_None:
    - - "USUBJID"
      - "DM.USUBJID"
Match_Datasets:
- Keys:
  - "USUBJID"
  Name: "DM"
Check:
  expression: >-
    not empty(EXSTDTC) and date(EXSTDTC) > date(DM.RFXENDTC)
Outcome:
  Message: "EXSTDTC is after DM.RFXENDTC (Date/Time of Last Study Treatment)."
Source:
  Message: "EXSTDTC date is after RFXENDTC"
  Description: "Start Date/Time of Treatment (EXSTDTC) variable value must be less\
    \ than or equal to Date/Time of Last Study Treatment (RFXENDTC)."
  Domains: "EX"
  Severity: "Error"
