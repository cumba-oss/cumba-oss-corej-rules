Core:
  Id: "PMDA-SD1306"
  Status: "Published"
  Version: "1"
Description: "Raise a warning when a record exists in TS with TSPARMCD equal to 'HLTSUBJI'\
  \ and TSVAL equal to 'Y', but TSVAL is populated for the record where TSPARMCD equals\
  \ 'TDIGRP'."
Severity: "Warning"
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "TS"
Requirements:
  Variables:
    All:
    - "TSPARMCD"
Bindings:
- name: "$HLTSUBJI_Y"
  expression: "record_count(group=[STUDYID], filter=(TSPARMCD == \"HLTSUBJI\" and\
    \ TSVAL == \"Y\"))"
Check:
  expression: >-
    TSPARMCD == "TDIGRP" and $HLTSUBJI_Y >= 1 and not empty(TSVAL)
Outcome:
  Message: "TSVAL is populated for the TDIGRP Trial Summary Parameter when a record\
    \ exists with TSPARMCD equal to 'HLTSUBJI' and TSVAL equal to 'Y'."
Source:
  Message: "The TDIGRP Trial Summary Parameter is not provided with TSVAL equal to\
    \ null when HLTSUBJI parameter equals 'Y'"
  Description: "When the study population is healthy subjects (TSPARMCD = 'HLTSUBJI'\
    \ and TSVAL = 'Y'), the Diagnosis Group parameter should be provided with a null\
    \ Parameter Value (TSVAL should be null when TSPARMCD = 'TDIGRP')."
  Domains: "TS"
  Severity: "Warning"
