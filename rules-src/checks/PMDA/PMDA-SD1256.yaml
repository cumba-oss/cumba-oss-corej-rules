Core:
  Id: "PMDA-SD1256"
  Status: "Published"
  Version: "1"
Description: "Raise an error when DSDECOD in the DS dataset is equal to 'DEATH' and\
  \ DTHFL does not equal 'Y'."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "DM"
Requirements:
  Variables:
    All:
    - "DTHFL"
    - "STUDYID"
    - "USUBJID"
    All_Or_None:
    - - "STUDYID"
      - "DS.STUDYID"
    - - "USUBJID"
      - "DS.USUBJID"
Match_Datasets:
- Keys:
  - "STUDYID"
  - "USUBJID"
  Name: "DS"
Check:
  expression: >-
    DS.DSDECOD == "DEATH" and DTHFL != "Y"
Outcome:
  Message: "DTHFL does not equal 'Y' when DSDECOD in the DS dataset is equal to 'DEATH'."
Source:
  Message: "DTHFL does not equal 'Y' when DS.DSDECOD = 'DEATH'"
  Description: "DTHFL must equal 'Y' when there is a record in the Disposition (DS)\
    \ domain with DSDECOD = 'DEATH'."
  Domains: "DS"
  Severity: "Error"
