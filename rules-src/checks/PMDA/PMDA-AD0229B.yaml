Core:
  Id: "PMDA-AD0229B"
  Status: "Published"
  Version: "1"
Description: "Raise an error when the Actual Sequence of Treatment (TRTSEQA) and Actual\
  \ Sequence of Treatments (N) (TRTSEQAN) are both populated and TRTSEQA does not\
  \ have the same value across all records that share the same TRTSEQAN; within a\
  \ study each TRTSEQAN value must map to one TRTSEQA value. Applies to the subject-level\
  \ and device-level analysis datasets."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "SUBJECT LEVEL ANALYSIS DATASET"
    - "DEVICE LEVEL ANALYSIS DATASET"
Check:
  expression: >-
    not empty(TRTSEQA) and not empty(TRTSEQAN) and is_inconsistent_across_dataset(TRTSEQA,
    keys=[TRTSEQAN])
Outcome:
  Message: "TRTSEQA is not the same value across all records with the same TRTSEQAN."
Source:
  Message: "Inconsistent value for TRTSEQA"
  Description: "Within a study, all Actual Sequence of Treatment (TRTSEQA) variable\
    \ values must be the same for each unique value of Actual Sequence of Treatments\
    \ (N) (TRTSEQAN) when both variables are populated."
  Domains: "ADSL, ADDL"
  Severity: "Error"
Standards:
- Organization: "PMDA"
  Standards:
  - Name: "ADaMIG"
    Version: "1.3"
    References:
    - Origin: "PMDA Validation Rules"
      Rule_Identifier:
        Id: "AD0229B"
        Version: "1"
      Version: "6.0"
  - Name: "ADaMIG"
