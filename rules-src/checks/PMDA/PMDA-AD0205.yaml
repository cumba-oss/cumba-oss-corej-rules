Core:
  Id: "PMDA-AD0205"
  Status: "Published"
  Version: "1"
Description: "Raise an error when, for the same subject (USUBJID), the Age Unit (AGEU)\
  \ value in ADSL is populated and differs from the Age Unit (AGEU) value in DM. There\
  \ must be traceability between ADaM and SDTM."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "SUBJECT LEVEL ANALYSIS DATASET"
Requirements:
  Variables:
    All:
    - "DM.AGEU"
Match_Datasets:
- Keys:
  - "USUBJID"
  Name: "DM"
Check:
  expression: >-
    not empty(AGEU) and AGEU != DM.AGEU
Outcome:
  Message: "ADSL.AGEU does not match DM.AGEU for the same subject (USUBJID)."
  Output_Variables:
  - "AGEU"
  - "DM.AGEU"
Source:
  Message: "For the same USUBJID, the ADSL.AGEU != DM.AGEU"
  Description: "The same subject in ADSL and DM must have the same value for Age Unit\
    \ (AGEU). There must be traceability between ADaM and SDTM."
  Domains: "ADSL"
  Severity: "Error"
Standards:
- Organization: "PMDA"
  Standards:
  - Name: "ADaMIG"
    Version: "1.3"
    References:
    - Origin: "PMDA Validation Rules"
      Rule_Identifier:
        Id: "AD0205"
        Version: "1"
      Version: "6.0"
  - Name: "ADaMIG"
    Version: "1.2"
    References:
    - Origin: "PMDA Validation Rules"
      Rule_Identifier:
        Id: "AD0205"
        Version: "1"
      Version: "6.0"
  - Name: "ADaMIG"
    Version: "1.1"
    References:
    - Origin: "PMDA Validation Rules"
      Rule_Identifier:
        Id: "AD0205"
        Version: "1"
      Version: "6.0"
  - Name: "ADaMIG"
    Version: "1.0"
    References:
    - Origin: "PMDA Validation Rules"
      Rule_Identifier:
        Id: "AD0205"
        Version: "1"
      Version: "6.0"
