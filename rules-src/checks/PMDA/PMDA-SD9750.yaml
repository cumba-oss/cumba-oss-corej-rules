Core:
  Id: "PMDA-SD9750"
  Status: "Published"
  Version: "1"
Description: "Raise a warning when Body System or Organ Class Code (--BDSYCD) is not\
  \ present in the dataset although Body System or Organ Class (--BODSYS) is populated."
Sensitivity: "Dataset"
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "AE"
    - "CE"
    - "MH"
Requirements:
  Variables:
    None:
    - "--BDSYCD"
    All:
    - "--BODSYS"
Check:
  expression: >-
    not empty(--BODSYS)
Outcome:
  Message: "--BDSYCD is not present in the dataset although --BODSYS is populated."
Source_Proposed:
  Sheet_Issue: "#281"
  Message: "Body System or Organ Class Code (--BDSYCD) is not present in the dataset\
    \ when --BODSYS is populated"
  Description: "The Body System or Organ Class Code (--BDSYCD) variable must be present\
    \ in the dataset when the Body System or Organ Class (--BODSYS) variable is populated."
  Domains: "AE, CE, MH"
  Severity: "Warning"
Standards:
- Organization: "PMDA"
  Standards:
  - Name: "SDTMIG"
    Version: "3.4"
