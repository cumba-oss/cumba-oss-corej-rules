Core:
  Id: "PMDA-AD0093"
  Status: "Published"
  Version: "1"
Description: "Raise an error when, within a study, the Planned Treatment (TRTP) does\
  \ not have a single consistent value for each unique value of Planned Treatment\
  \ (N) (TRTPN). All TRTP values must be the same for each unique value of TRTPN when\
  \ the primary variable TRTP is populated."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "ALL"
Requirements:
  Variables:
    All:
    - "TRTP"
    - "TRTPN"
Check:
  expression: >-
    var_exists("TRTPN") and not empty(TRTP) and is_inconsistent_across_dataset(TRTP, keys=[TRTPN])
Outcome:
  Message: "Inconsistent value for TRTP: TRTP is not the same value across records\
    \ with the same value of TRTPN."
Source:
  Message: "Inconsistent value for TRTP"
  Description: "Within a study, all TRTP values must be the same for each unique value\
    \ of TRTPN when the primary variable TRTP is populated."
  Domains: "BDS, ADAMOTHER"
  Severity: "Error"
Standards:
- Organization: "PMDA"
  Standards:
  - Name: "ADaMIG"
    Version: "1.0"
    References:
    - Origin: "PMDA Validation Rules"
      Rule_Identifier:
        Id: "AD0093"
        Version: "1"
      Version: "6.0"
