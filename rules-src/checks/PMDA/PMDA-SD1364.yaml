Core:
  Id: "PMDA-SD1364"
  Status: "Published"
  Version: "1"
Description: "Raise an error when a subject who was not treated (ARMNRS indicates\
  \ Screen Failure, Not Assigned, or Assigned, Not Treated) has a populated Actual\
  \ Arm Code (ACTARMCD) or Actual Arm (ACTARM); both must be empty for subjects who\
  \ were not treated."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "DM"
Requirements:
  Variables:
    All:
    - "ARMNRS"
Check:
  expression: >-
    ARMNRS in ["SCREEN FAILURE", "NOT ASSIGNED", "ASSIGNED, NOT TREATED"] and (not empty(ACTARMCD)
    or not empty(ACTARM))
Outcome:
  Message: "ACTARMCD and/or ACTARM is populated for a subject who was not treated\
    \ (ARMNRS indicates Screen Failure, Not Assigned, or Assigned, Not Treated)."
Source:
  Message: "ACTARMCD/ACTARM is populated for a subject who wasn't treated"
  Description: "Actual Arm Code (ACTARMCD) and Actual Arm (ACTARM) must be null for\
    \ subjects who weren't treated. This includes Screen Failure subjects, Not Assigned\
    \ subjects, and Not Treated subjects."
  Domains: "DM"
  Severity: "Error"
