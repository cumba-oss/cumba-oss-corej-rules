Core:
  Id: "PMDA-SD2018"
  Status: "Published"
  Version: "1"
Description: "Raise an error when both the Parameter Value (TSVAL) and the Parameter\
  \ Null Flavor (TSVALNF) variables are populated."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "TS"
Requirements:
  Variables:
    All:
    - "TSVALNF"
    - "TSVAL"
Check:
  expression: >-
    not empty(TSVAL) and not empty(TSVALNF)
Outcome:
  Message: "Both TSVAL and TSVALNF variables are populated"
Source:
  Message: "Both --VAL and --VALNF variables are populated"
  Description: "Value for Parameter Null Flavor (--VALNF) variable should be null\
    \ when Parameter Value (--VAL) variable value can be populated."
  Domains: "TS"
  Severity: "Error"
