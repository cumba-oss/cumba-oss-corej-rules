Core:
  Id: "PMDA-SD1013"
  Status: "Published"
  Version: "1"
Description: "Raise an error when TAETORD is populated and ETCD is equal to 'UNPLAN'."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "SE"
Requirements:
  Variables:
    All:
    - "TAETORD"
    - "ETCD"
Check:
  expression: >-
    ETCD == "UNPLAN" and not empty(TAETORD)
Outcome:
  Message: "TAETORD is populated when ETCD is equal to 'UNPLAN'."
Source:
  Message: "TAETORD is populated, ETCD = 'UNPLAN'"
  Description: "Planned Order of Elements within Arm (TAETORD) should be null when\
    \ subject's experience for a particular period of time is represented as an unplanned\
    \ Element (ETCD = 'UNPLAN')."
  Domains: "SE"
  Severity: "Error"
