Core:
  Id: "PMDA-SD1204"
  Status: "Published"
  Version: "1"
Description: "Raise a warning when --ENDTC is populated and is after DM.RFPENDTC (Date/Time\
  \ of End of Participation)."
Severity: "Warning"
Executability: "Fully Executable"
Scope:
  Classes:
    Include:
    - "SPECIAL PURPOSE"
    - "INTERVENTIONS"
    - "FINDINGS"
    - "EVENTS"
    - "FINDINGS ABOUT"
  Domains:
    Exclude:
    - "CO"
    - "DM"
    - "DO"
Requirements:
  Variables:
    All:
    - "--ENDTC"
    - "STUDYID"
    - "USUBJID"
    All_Or_None:
    - - "STUDYID"
      - "DM.STUDYID"
    - - "USUBJID"
      - "DM.USUBJID"
Match_Datasets:
- Keys:
  - "STUDYID"
  - "USUBJID"
  Cardinality: "n:1"
  Name: "DM"
Check:
  expression: >-
    not empty(--ENDTC) and date(--ENDTC) > date(DM.RFPENDTC)
Outcome:
  Message: "--ENDTC is after DM.RFPENDTC (Date/Time of End of Participation)."
Source:
  Message: "--ENDTC date is after RFPENDTC"
  Description: "End Date/Time (--ENDTC) variable value must be less than or equal\
    \ to Date/Time of End of Participation (RFPENDTC). If the study is ongoing, Parameter\
    \ Value (TSVAL) for the 'ONGOSIND/Ongoing Study Indicator' parameter should be\
    \ set to 'Y' in the Trial Summary (TS) domain."
  Domains: "SPECIAL PURPOSE (-CO, -DM), INTERVENTIONS, FINDINGS (-DO), EVENTS, FINDINGS\
    \ ABOUT"
  Severity: "Warning"
Standards:
