Core:
  Id: "PMDA-SD1012"
  Status: "Published"
  Version: "1"
Description: "Raise an error when the combination of Element Code (ETCD) and Description\
  \ of Element (ELEMENT) does not match an entry in the Trial Elements (TE) dataset,\
  \ except for unplanned elements where ETCD is 'UNPLAN'."
Executability: "Partially Executable - Possible Overreporting"
Scope:
  Domains:
    Include:
    - "SE"
    - "TA"
Requirements:
  Variables:
    All:
    - "ETCD"
    All_Or_None:
    - - "ETCD"
      - "TE.ETCD"
    - - "ELEMENT"
      - "TE.ELEMENT"
Match_Datasets:
- Join_Type: "left"
  Keys:
  - "ETCD"
  - "ELEMENT"
  Name: "TE"
Check:
  expression: >-
    ETCD != "UNPLAN" and empty(TE.ETCD)
Outcome:
  Message: "The combination of ETCD and ELEMENT does not match any entry in the Trial\
    \ Elements (TE) dataset."
Source:
  Message: "Invalid ETCD/ELEMENT"
  Description: "The combination of Element Code (ETCD) and Description of Element\
    \ (ELEMENT) values should match entries in the Trial Elements (TE) dataset, except\
    \ for unplanned Element (ETCD = 'UNPLAN')."
  Domains: "SE, TA"
  Severity: "Error"
