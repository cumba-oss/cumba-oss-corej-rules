Core:
  Id: "PMDA-SD2230"
  Status: "Published"
  Version: "1"
Description: "Raise a warning when the Trial Summary (TS) dataset does not contain\
  \ a record where TSPARMCD equals 'STYPE' (Study Type)."
Severity: "Warning"
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "TS"
Bindings:
- name: "$stype_count"
  expression: "record_count(filter=filter(TSPARMCD=\"STYPE\"))"
Check:
  expression: >-
    $stype_count == 0
Outcome:
  Message: "Missing STYPE Trial Summary Parameter: a 'Study Type' (STYPE) record must\
    \ be present in the Trial Summary (TS) domain."
  Output_Variables:
  - "$stype_count"
Source:
  Message: "Missing STYPE Trial Summary Parameter"
  Description: "'Study Type' (STYPE) record must be populated in Trial Summary (TS)\
    \ domain. It is expected for SDTM IG v3.1.2 data and required for data in all\
    \ more recent SDTM versions."
  Domains: "TS"
  Severity: "Warning"
Standards:
