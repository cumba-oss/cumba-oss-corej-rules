Core:
  Id: "PMDA-SD2239"
  Status: "Published"
  Version: "1"
Description: "Raise an error when --TPT does not have the same value across records\
  \ with the same values of USUBJID, VISITNUM, --OBJ and --DTC."
Executability: "Fully Executable"
Scope:
  Classes:
    Include:
    - "FINDINGS"
    - "FINDINGS ABOUT"
  Domains:
    Exclude:
    - "DD"
    - "DO"
    - "DU"
    - "IS"
    - "MI"
    - "RP"
    - "SS"
Requirements:
  Variables:
    All:
    - "--TPT"
Check:
  expression: >-
    is_inconsistent_across_dataset(--TPT, keys=[USUBJID, VISITNUM, --OBJ, --DTC])
Outcome:
  Message: "Inconsistent value for --TPT within USUBJID, VISITNUM, --OBJ and --DTC"
  Output_Variables:
  - "--OBJ"
  - "VISITNUM"
  - "--DTC"
  - "--TPT"
Source:
  Message: "Inconsistent value for --TPT"
  Description: "Planned Time Point Name (--TPT) value must be consistent for all records\
    \ with same Subject (USUBJID), Visit Num (VISITNUM), Object (--OBJ) and Assessment\
    \ Date/Time (--DTC)."
  Domains: "FINDINGS (-DD, -DO, -DU, -IS, -MI, -RP, -SS), FINDINGS ABOUT"
  Severity: "Error"
