Core:
  Id: "PMDA-SD1268"
  Status: "Published"
  Version: "1"
Description: "Raise a warning when TSVCDREF is not populated and TSVCDVER is populated."
Severity: "Warning"
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "TS"
Check:
  expression: >-
    not empty(TSVCDVER) and empty(TSVCDREF)
Outcome:
  Message: "TSVCDREF is empty when TSVCDVER is populated."
Source:
  Message: "TSVCDREF is null when TSVCDVER is populated"
  Description: "The Name of the Reference Terminology (TSVCDREF) must be populated\
    \ when the Version of the Reference Terminology (TSVCDVER) is populated."
  Domains: "TS"
  Severity: "Warning"
