Core:
  Id: "PMDA-SD9729"
  Status: "Published"
  Version: "1"
Description: "Raise an error when neither the Rule for End of Element (TEENRL) nor\
  \ the Planned Duration of Element (TEDUR) variable is present in the Trial Elements\
  \ (TE) dataset; at least one of the two must be populated for each Element."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "TE"
Check:
  expression: >-
    not var_exists("TEENRL") and not var_exists("TEDUR")
Outcome:
  Message: "Neither the TEENRL nor the TEDUR variable is present in the dataset."
Source_Proposed:
  Sheet_Issue: "#216"
  Message: "Neither the TEENRL nor the TEDUR variable is present in the dataset"
  Description: "At least one of Rule for End of Element (TEENRL) or Planned Duration\
    \ of Element (TEDUR) must be present in the dataset so that one of them can be\
    \ populated for each Element."
  Domains: "TE"
  Severity: "Error"
Standards:
- Organization: "PMDA"
  Standards:
  - Name: "SDTMIG"
    Version: "3.1.2"
  - Name: "SDTMIG"
    Version: "3.1.3"
  - Name: "SDTMIG"
    Version: "3.2"
  - Name: "SDTMIG"
    Version: "3.3"
  - Name: "SDTMIG"
    Version: "3.4"
