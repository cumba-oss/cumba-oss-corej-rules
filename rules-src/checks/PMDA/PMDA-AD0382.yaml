Core:
  Id: "PMDA-AD0382"
  Status: "Published"
  Version: "1"
Description: "Raise an error when, within a parameter (PARAMCD), the numeric Baseline\
  \ Toxicity Grade (N) (BTOXGRN) does not have a single consistent value for a given\
  \ value of the character Baseline Toxicity Grade (BTOXGR), evaluated only on rows\
  \ where both BTOXGRN and BTOXGR are populated."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "BASIC DATA STRUCTURE"
    - "MEDICAL DEVICE BASIC DATA STRUCTURE"
Check:
  expression: >-
    not empty(BTOXGRN) and var_exists("BTOXGR") and var_exists("PARAMCD") and not empty(BTOXGR) and
    not empty(PARAMCD) and is_inconsistent_across_dataset(BTOXGRN, keys=[BTOXGR, PARAMCD])
Outcome:
  Message: "BTOXGRN has inconsistent values for the same BTOXGR within a parameter."
  Output_Variables:
  - "PARAMCD"
  - "BTOXGR"
  - "BTOXGRN"
Source:
  Message: "Inconsistent value for BTOXGRN within a unique PARAMCD"
  Description: "Within a parameter, there should be only a single value of Baseline\
    \ Toxicity Grade (N) (BTOXGRN) variable for a given value of Baseline Toxicity\
    \ Grade (BTOXGR) variable, considering only those rows on which both variables\
    \ are populated."
  Domains: "BDS, ADNCA, MDBDS, ADAMOTHER"
  Severity: "Error"
Standards:
- Organization: "PMDA"
  Standards:
  - Name: "ADaMIG"
    Version: "1.3"
    References:
    - Origin: "PMDA Validation Rules"
      Rule_Identifier:
        Id: "AD0382"
        Version: "1"
      Version: "6.0"
  - Name: "ADaMIG"
    Version: "1.2"
    References:
    - Origin: "PMDA Validation Rules"
      Rule_Identifier:
        Id: "AD0382"
        Version: "1"
      Version: "6.0"
