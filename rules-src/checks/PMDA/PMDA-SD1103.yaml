Core:
  Id: "PMDA-SD1103"
  Status: "Published"
  Version: "1"
Description: "Raise an error when Start Relative to Reference Time Point (--STRTPT)\
  \ is present in the dataset but Start Reference Time Point (--STTPT) is not present\
  \ in the dataset."
Executability: "Fully Executable"
Scope:
  Classes:
    Include:
    - "SPECIAL PURPOSE"
    - "INTERVENTIONS"
    - "FINDINGS"
    - "EVENTS"
    - "FINDINGS ABOUT"
  Domains:
    Exclude:
    - "CO"
    - "DM"
Check:
  expression: >-
    var_exists("--STRTPT") and not var_exists("--STTPT")
Outcome:
  Message: "--STTPT variable is not present when --STRTPT variable is present."
  Output_Variables:
  - "--STRTPT"
Source:
  Message: "Missing --STTPT variable when --STRTPT variable is present"
  Description: "Start Reference Time Point (--STTPT) variable must be included into\
    \ the domain when Start Relative to Reference Time Point (--STRTPT) variable is\
    \ present."
  Domains: "SPECIAL PURPOSE (-CO, -DM), INTERVENTIONS, FINDINGS, EVENTS, FINDINGS\
    \ ABOUT"
  Severity: "Error"
