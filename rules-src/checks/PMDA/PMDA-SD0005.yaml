Core:
  Id: "PMDA-SD0005"
  Status: "Published"
  Version: "1"
Description: "Raise an error when the Sequence Number (--SEQ) value is not unique\
  \ for each record within a domain per Unique Subject Identifier (USUBJID), or per\
  \ Pool Identifier (POOLID) when present, including when the domain is split into\
  \ multiple files."
Executability: "Fully Executable"
Scope:
  Classes:
    Include:
    - "SPECIAL PURPOSE"
    - "INTERVENTIONS"
    - "FINDINGS"
    - "EVENTS"
    - "FINDINGS ABOUT"
  Domains:
    Exclude:
    - "DM"
    - "DX"
    - "DO"
    - "DU"
    - "DE"
    - "DT"
Check:
  expression: >-
    var_exists("--SEQ") and not empty(USUBJID) and not is_unique_set([--SEQ, DOMAIN, USUBJID]) or
    var_exists("--SEQ") and var_exists("POOLID") and not empty(POOLID) and not is_unique_set([--SEQ,
    DOMAIN, POOLID])
Outcome:
  Message: "Duplicate value for --SEQ variable"
  Message_Folded: "POOLID or USUBJID absent or not populated in any record of the\
    \ dataset, and at least one record meets the rest of the condition: Duplicate\
    \ value for --SEQ variable"
Source:
  Message: "Duplicate value for --SEQ variable"
  Description: "The value of Sequence Number (--SEQ) variable must be unique for each\
    \ record within a domain and within each Unique Subject Identifier (USUBJID) or\
    \ Pool Identifier (POOLID) variables value when they are present in the domain.\
    \ Exclusions are DE, DO, DT, DU, and DX domains."
  Domains: "SPECIAL PURPOSE (-DM), INTERVENTIONS (-DX), FINDINGS (-DO, -DU), EVENTS\
    \ (-DE, -DT), FINDINGS ABOUT"
  Severity: "Error"
