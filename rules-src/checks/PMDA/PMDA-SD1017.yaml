Core:
  Id: "PMDA-SD1017"
  Status: "Published"
  Version: "1"
Description: "Raise a warning when, for a planned visit (SVUPDES is empty) in the\
  \ Subject Visits (SV) domain, the Visit Number (VISITNUM) value does not match any\
  \ VISITNUM value in the Trial Visits (TV) dataset."
Severity: "Warning"
Executability: "Partially Executable - Possible Overreporting"
Scope:
  Domains:
    Include:
    - "SV"
Requirements:
  Variables:
    All:
    - "VISITNUM"
    - "TV.VISITNUM"
Bindings:
- name: "$tv_visitnum"
  expression: "distinct(VISITNUM, domain=\"TV\")"
Check:
  expression: >-
    not empty(VISITNUM) and (var_exists("SVPRESP") and SVPRESP == "Y" or not var_exists("SVPRESP")
    and empty(SVUPDES) and not contains(upper(VISIT), "UNSCHEDUL") and not contains(upper(VISIT),
    "UNPLAN")) and VISITNUM not in $tv_visitnum
Outcome:
  Message: "VISITNUM for a planned visit does not match any VISITNUM value in the\
    \ TV dataset."
  Message_Folded: "SVPRESP, SVUPDES or VISIT absent or not populated in any record\
    \ of the dataset, and at least one record meets the rest of the condition: VISITNUM\
    \ for a planned visit does not match any VISITNUM value in the TV dataset."
  Output_Variables:
  - "!SVUPDES"
  - "$tv_visitnum"
Source:
  Message: "VISITNUM value does not match TV domain data"
  Description: "Visit Number (VISITNUM) values should match entries in the Trial Visits\
    \ (TV) dataset when they are planned visits (SVUPDES = null)."
  Domains: "SV"
  Severity: "Warning"
