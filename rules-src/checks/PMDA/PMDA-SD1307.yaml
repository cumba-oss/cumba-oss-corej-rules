Core:
  Id: "PMDA-SD1307"
  Status: "Published"
  Version: "1"
Description: "Raise a warning when a record exists in TS with TSPARMCD equal to 'HLTSUBJI'\
  \ and TSVAL equal to 'N', but TSVAL is empty for the record where TSPARMCD equals\
  \ 'TDIGRP'."
Severity: "Warning"
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "TS"
Requirements:
  Variables:
    All:
    - "TSPARMCD"
Bindings:
- name: "$HLTSUBJI_N_COUNT"
  expression: "record_count(group=[STUDYID], filter=(TSPARMCD == \"HLTSUBJI\" and\
    \ TSVAL == \"N\"))"
Check:
  expression: >-
    TSPARMCD == "TDIGRP" and $HLTSUBJI_N_COUNT >= 1 and empty(TSVAL)
Outcome:
  Message: "TSVAL is empty for the TDIGRP Trial Summary Parameter when a record exists\
    \ with TSPARMCD equal to 'HLTSUBJI' and TSVAL equal to 'N'."
  Output_Variables:
  - "TSPARMCD"
  - "TSVAL"
  - "$HLTSUBJI_N_COUNT"
Source:
  Message: "TSVAL is missing for the TDIGRP Trial Summary Parameter when HLTSUBJI\
    \ parameter equals 'N'"
  Description: "When the study population is not healthy subjects (TSPARMCD = 'HLTSUBJI'\
    \ and TSVAL = 'N'), the Diagnosis Group parameter should be provided with Parameter\
    \ Value populated (TSVAL should not be null when TSPARMCD = 'TDIGRP')."
  Domains: "TS"
  Severity: "Warning"
