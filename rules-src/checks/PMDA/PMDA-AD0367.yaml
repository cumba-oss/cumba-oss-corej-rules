Core:
  Id: "PMDA-AD0367"
  Status: "Published"
  Version: "1"
Description: "Raise an error when, for the same subject (USUBJID), the Description\
  \ of Actual Arm (ACTARM) value in ADSL is populated and differs from the Description\
  \ of Actual Arm (ACTARM) value populated for that subject in DM. There must be traceability\
  \ between ADaM and SDTM."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "SUBJECT LEVEL ANALYSIS DATASET"
Requirements:
  Variables:
    All:
    - "ACTARM"
    - "DM.ACTARM"
    - "USUBJID"
    All_Or_None:
    - - "USUBJID"
      - "DM.USUBJID"
Match_Datasets:
- Keys:
  - "USUBJID"
  Name: "DM"
Check:
  expression: >-
    not empty(ACTARM) and ACTARM != DM.ACTARM
Outcome:
  Message: "For the same USUBJID, ADSL.ACTARM does not equal DM.ACTARM."
  Output_Variables:
  - "ACTARM"
  - "DM.ACTARM"
Source:
  Message: "For the same USUBJID, the ADSL.ACTARM != DM.ACTARM"
  Description: "The same subject in ADSL and DM datasets must have the same value\
    \ for Actual Arm (ACTARM). There must be traceability between ADaM and SDTM."
  Domains: "ADSL"
  Severity: "Error"
Standards:
- Organization: "PMDA"
  Standards:
  - Name: "ADaMIG"
    Version: "1.3"
    References:
    - Origin: "PMDA Validation Rules"
      Rule_Identifier:
        Id: "AD0367"
        Version: "1"
      Version: "6.0"
  - Name: "ADaMIG"
    Version: "1.2"
    References:
    - Origin: "PMDA Validation Rules"
      Rule_Identifier:
        Id: "AD0367"
        Version: "1"
      Version: "6.0"
  - Name: "ADaMIG"
    Version: "1.1"
    References:
    - Origin: "PMDA Validation Rules"
      Rule_Identifier:
        Id: "AD0367"
        Version: "1"
      Version: "6.0"
  - Name: "ADaMIG"
    Version: "1.0"
    References:
    - Origin: "PMDA Validation Rules"
      Rule_Identifier:
        Id: "AD0367"
        Version: "1"
      Version: "6.0"
