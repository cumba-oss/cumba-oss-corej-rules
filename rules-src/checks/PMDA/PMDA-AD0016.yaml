Core:
  Id: "PMDA-AD0016"
  Status: "Published"
  Version: "1"
Description: "Raise an error when a variable label is more than 40 characters in length.\
  \ All ADaM variable labels must be no more than 40 characters."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "SUBJECT LEVEL ANALYSIS DATASET"
    - "BASIC DATA STRUCTURE"
    - "OCCURRENCE DATA STRUCTURE"
    - "DEVICE LEVEL ANALYSIS DATASET"
    - "MEDICAL DEVICE BASIC DATA STRUCTURE"
    - "MEDICAL DEVICE OCCURRENCE DATA STRUCTURE"
Check:
  expression: >-
    len(variable_label) > 40
Outcome:
  Message: "Variable label length is greater than 40 characters."
  Output_Variables:
  - "variable_label"
Source:
  Message: "Variable label length is greater than 40 characters"
  Description: "All ADaM variable labels must be no more than 40 characters in length.\
    \ This should not be possible to fail with sas v5 xpt. Dataset-XML or .csv can\
    \ fail this rule."
  Domains: "ADSL, ADDL, BDS, ADNCA, MDBDS, OCCDS, ADAE, MDOCCDS, ADAMOTHER"
  Severity: "Error"
Standards:
- Organization: "PMDA"
  Standards:
