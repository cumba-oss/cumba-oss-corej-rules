Core:
  Id: "PMDA-AD0609"
  Status: "Published"
  Version: "1"
Description: "Raise an error when, on a BDS or OCCDS record where APHASEN is populated,\
  \ PHSDTM does not equal the ADSL variable PHwSDTM for the same USUBJID (where w\
  \ equals the record's APHASEN value)."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "BASIC DATA STRUCTURE"
    - "OCCURRENCE DATA STRUCTURE"
Match_Datasets:
- Name: "ADSL"
  Keys:
  - "USUBJID"
Check:
  expression: >-
    not empty(APHASEN) and not empty(PHSDTM) and PHSDTM != ADSL.PH${APHASEN:%d}SDTM
Outcome:
  Message: "On a given record, APHASEN is populated and the value of PHSDTM is not\
    \ equal to the value of variable PHwSDTM where w equals the value of APHASEN"
  Output_Variables:
  - "APHASEN"
  - "PHSDTM"
  - "ADSL.PH${*}SDTM"
Source:
  Message: "APHASEN w has a PHSDTM != ADSL.PHwSDTM"
  Description: "When analysis Phase (APHASE) variable is defined, the analysis Phase\
    \ Start Datetime (PHSDTM) variable value must equal ADSL Phase w Start Datetime\
    \ (PHwSDTM) for that phase defined by the value in Phase (N) (APHASEN) variable.\
    \ APHASEN = w."
  Domains: "BDS, ADNCA, MDBDS, OCCDS, ADAE, MDOCCDS, ADAMOTHER"
  Severity: "Error"
Standards:
- Organization: "PMDA"
  Standards:
  - Name: "ADaMIG"
    Version: "1.2"
    References:
    - Origin: "PMDA Validation Rules"
      Rule_Identifier:
        Id: "AD0609"
        Version: "1"
      Version: "6.0"
  - Name: "ADaMIG"
    Version: "1.3"
    References:
    - Origin: "PMDA Validation Rules"
      Rule_Identifier:
        Id: "AD0609"
        Version: "1"
      Version: "6.0"
