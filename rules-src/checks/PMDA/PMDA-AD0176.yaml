Core:
  Id: "PMDA-AD0176"
  Status: "Published"
  Version: "1"
Description: "Raise an error when the Analysis Baseline Flag character (ABLFL) variable\
  \ has a populated value other than Y. For this parameter-level / record-level character\
  \ population flag, Y indicates the record is included; an empty value is allowed,\
  \ so only non-empty values that are not Y are flagged."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "BASIC DATA STRUCTURE"
    - "MEDICAL DEVICE BASIC DATA STRUCTURE"
Requirements:
  Variables:
    All:
    - "ABLFL"
Check:
  expression: >-
    not empty(ABLFL) and ABLFL not in ["Y"]
Outcome:
  Message: "ABLFL value is not Y or empty."
Source:
  Message: "ABLFL value is not Y or null"
  Description: "Analysis Baseline Flag character (ABLFL) must be Y or null. For parameter-level\
    \ and record-level character population flag variables: Y = yes (included). Null\
    \ values are allowed."
  Domains: "BDS, ADNCA, MDBDS"
  Severity: "Error"
