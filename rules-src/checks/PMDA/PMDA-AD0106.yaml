Core:
  Id: "PMDA-AD0106"
  Status: "Published"
  Version: "1"
Description: "Raise an error when, within a study, the Analysis Period (APERIOD) variable\
  \ does not hold a single consistent value for each unique value of the Period (C)\
  \ (APERIODC) variable, evaluated over the records where both APERIOD and APERIODC\
  \ are populated."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "ALL"
Requirements:
  Variables:
    All:
    - "APERIOD"
Check:
  expression: >-
    var_exists("APERIODC") and not empty(APERIOD) and is_inconsistent_across_dataset(APERIOD,
    keys=[APERIODC])
Outcome:
  Message: "Inconsistent value for APERIOD"
Source:
  Message: "Inconsistent value for APERIOD"
  Description: "Within a study, all APERIOD values must be the same for each unique\
    \ value of APERIODC when the primary variable APERIOD is populated."
  Domains: "BDS, ADAE, ADAMOTHER"
  Severity: "Error"
Standards:
- Organization: "PMDA"
  Standards:
  - Name: "ADaMIG"
    Version: "1.0"
    References:
    - Origin: "PMDA Validation Rules"
      Rule_Identifier:
        Id: "AD0106"
        Version: "1"
      Version: "6.0"
