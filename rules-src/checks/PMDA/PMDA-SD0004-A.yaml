Core:
  Id: "PMDA-SD0004-A"
  Status: "Published"
  Version: "1"
Description: "Raise a warning when the Domain Abbreviation (DOMAIN) value of an Associated\
  \ Persons dataset is not consistent with the name of the dataset (the dataset name\
  \ does not begin with the four-character DOMAIN value)."
Severity: "Warning"
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "AP--"
    Exclude:
    - "APRELSUB"
Requirements:
  Variables:
    All:
    - "DOMAIN"
Check:
  expression: >-
    prefix(ds_name(), 4) != DOMAIN
Outcome:
  Message: "Inconsistent value for DOMAIN"
Source_Proposed:
  Message: "Inconsistent value for DOMAIN"
  Description: "The Domain Abbreviation (DOMAIN) value of an Associated Persons dataset\
    \ is not consistent with the name of the dataset (the dataset name does not begin\
    \ with the four-character DOMAIN value)."
  Domains: "AP--"
  Severity: "Warning"
Source:
  Message: "Inconsistent value for DOMAIN"
  Description: "Domain Abbreviation (DOMAIN) variable should be consistent with the\
    \ name of the dataset."
  Domains: "ALL (-POOLDEF, -RELREC, -RELSPEC, -RELSUB, -SUPPQUAL)"
  Severity: "Warning"
