Core:
  Id: "PMDA-SD0053-A"
  Status: "Published"
  Version: "1"
Description: "Raise an error when Planned Arm Code (ARMCD) is not 'NOTASSGN' while\
  \ Description of Planned Arm (ARM) equals 'Not Assigned'."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "DM"
    - "TA"
Requirements:
  Variables:
    All:
    - "ARM"
    - "ARMCD"
Check:
  expression: >-
    ARM == "Not Assigned" and ARMCD != "NOTASSGN"
Outcome:
  Message: "ARMCD is not 'NOTASSGN' when ARM equals 'Not Assigned'."
  Output_Variables:
  - "ARMCD"
  - "ARM"
Source_Proposed:
  Sheet_Issue: "#231"
  Message: "ARMCD is not 'NOTASSGN' when ARM equals 'Not Assigned'"
  Description: "Arm Code (ARMCD) must equal 'NOTASSGN' when Description of Arm (ARM)\
    \ is 'Not Assigned'."
  Domains: "DM, TA"
  Severity: "Error"
Source:
  Message: "ARM is not 'Not Assigned' when ARMCD equals 'NOTASSGN', or vice versa"
  Description: "Description of Arm (ARM) must equal 'Not Assigned' when Arm Code (ARMCD)\
    \ is 'NOTASSGN', and vice versa."
  Domains: "DM, TA"
  Severity: "Error"
