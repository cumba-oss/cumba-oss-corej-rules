Core:
  Id: "PMDA-SD1082"
  Status: "Published"
  Version: "1"
Description: "Raise a warning when a character variable's declared length does not\
  \ equal the longest actual stored value length in the dataset."
Severity: "Warning"
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "ALL"
Check:
  expression: >-
    var_type() == "Char" and var_length() > 1 and var_length() != max_value_length(variable_name,
    unit="bytes")
Outcome:
  Message: "A character variable's declared length does not equal the maximum length\
    \ of its stored data."
  Output_Variables:
  - "variable_size"
Source:
  Message: "Variable length is too long for actual data"
  Description: "Variable length should be assigned based on actual stored data to\
    \ minimize file size. Datasets should be re-sized to the maximum length of actual\
    \ data used prior to splitting."
  Domains: "ALL"
  Severity: "Warning"
