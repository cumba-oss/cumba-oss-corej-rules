Core:
  Id: "PMDA-SD1114"
  Status: "Published"
  Version: "1"
Description: "Raise a warning when a Body System or Organ Class (--BODSYS) value is\
  \ not a System Organ Class term in the MedDRA dictionary."
Severity: "Warning"
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "AE"
    - "CE"
    - "MH"
Requirements:
  Variables:
    All:
    - "--BODSYS"
Bindings:
- name: "$bodsys_valid"
  expression: "valid_external_dictionary_value(--BODSYS, external_dictionary_type=\"\
    meddra\", dictionary_term_type=\"SOC\", case_sensitive=false)"
Check:
  expression: >-
    $bodsys_valid == false
Outcome:
  Message: "Body System or Organ Class (--BODSYS) is not a MedDRA System Organ Class\
    \ term."
  Output_Variables:
  - "--BODSYS"
Source:
  Message: "Value for --BODSYS not found in MedDRA dictionary"
  Description: "Value for Body System or Organ Class (--BODSYS) variable must be populated\
    \ using a System Organ Class of the MedDRA dictionary of a version specified in\
    \ the define.xml (Case-insensitive)."
  Domains: "AE, CE, MH"
  Severity: "Warning"
