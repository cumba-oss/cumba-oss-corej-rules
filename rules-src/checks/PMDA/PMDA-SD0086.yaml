Core:
  Id: "PMDA-SD0086"
  Status: "Published"
  Version: "1"
Description: "Raise an error when the combination of STUDYID, USUBJID, and QNAM is\
  \ not unique for a DM-related SUPPQUAL record (RDOMAIN = 'DM'; QNAM must be unique\
  \ for each parent subject record)."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "SUPP--"
    - "SQ--"
Requirements:
  Variables:
    All:
    - "RDOMAIN"
Check:
  expression: >-
    RDOMAIN == "DM" and not is_unique_set([USUBJID, RDOMAIN, QNAM])
Outcome:
  Message: "Duplicate SUPPQUAL records found for the same DM parent subject record\
    \ and QNAM."
  Output_Variables:
  - "RDOMAIN"
  - "QNAM"
Source:
  Message: "SUPPQUAL duplicate records"
  Description: "All SUPPQUAL Domains records are associated with a single parent record\
    \ and must have a unique combination of Study Identifier (STUDYID), Unique Subject\
    \ Identifier (USUBJID), Identifying Variable (IDVAR), Identifying Variable Value\
    \ (IDVARVAL) and Qualifier Variable Name (QNAM) variable value. For all SUPPQUAL\
    \ domain record all The QNAM variable should be unique for each parent record."
  Domains: "SUPPQUAL"
  Severity: "Error"
