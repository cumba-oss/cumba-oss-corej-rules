Core:
  Id: "PMDA-SD1336"
  Status: "Published"
  Version: "1"
Description: "Raise an error when a TRLNKID value in the TR domain is not present\
  \ as a TULNKID value in the TU domain for the same subject."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "TR"
Requirements:
  Variables:
    All:
    - "TRLNKID"
Bindings:
- name: "$tu_lnkid"
  expression: "distinct(TULNKID, domain=\"TU\", group=[USUBJID])"
Check:
  expression: >-
    not empty(TRLNKID) and TRLNKID not in $tu_lnkid
Outcome:
  Message: "TRLNKID does not match any TULNKID value in the TU domain for the subject."
  Output_Variables:
  - "$tu_lnkid"
Source:
  Message: "TRLNKID value does not exist in TU domain"
  Description: "A Link ID (TRLNKID) value for a tumor that is referenced in the Tumor\
    \ Results (TR) domain for a subject must also be present in the Tumor Identification\
    \ (TU) domain for that subject."
  Domains: "TR"
  Severity: "Error"
Standards:
- Organization: "PMDA"
  Standards:
  - Name: "SDTMIG"
    Version: "3.3"
    References:
    - Origin: "PMDA Validation Rules"
      Rule_Identifier:
        Id: "SD1336"
        Version: "1"
      Version: "6.0"
  - Name: "SDTMIG"
    Version: "3.4"
    References:
    - Origin: "PMDA Validation Rules"
      Rule_Identifier:
        Id: "SD1336"
        Version: "1"
      Version: "6.0"
- Organization: "FDA"
  Standards:
