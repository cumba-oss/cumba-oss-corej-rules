Core:
  Id: "PMDA-SD2019"
  Status: "Published"
  Version: "1"
Description: "Raise a warning when Age Range (AGETXT) is populated with a value that\
  \ does not follow the 'number-number' format (one or more digits, a hyphen, then\
  \ one or more digits)."
Severity: "Warning"
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "DM"
Requirements:
  Variables:
    All:
    - "AGETXT"
Check:
  expression: >-
    not empty(AGETXT) and AGETXT !~ /^[0-9]+-[0-9]+$/
Outcome:
  Message: "Invalid value for AGETXT (the value does not follow the 'number-number'\
    \ format)."
Source:
  Message: "Invalid value for AGETXT"
  Description: "Age Range (AGETXT) variable values should be populated with 'number-number'\
    \ format."
  Domains: "DM"
  Severity: "Warning"
