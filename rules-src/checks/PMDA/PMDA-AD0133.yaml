Core:
  Id: "PMDA-AD0133"
  Status: "Published"
  Version: "1"
Description: "Raise a warning when Ratio to Analysis Range y Lower Limit (R2AyLO),\
  \ Analysis Value (AVAL) and Analysis Range y Lower Limit (AyLO) are all populated\
  \ and AyLO does not equal 0, but R2AyLO does not equal AVAL / AyLO."
Severity: "Warning"
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "BASIC DATA STRUCTURE"
    - "MEDICAL DEVICE BASIC DATA STRUCTURE"
Check:
  expression: >-
    AyLO != 0 and R2AyLO != (AVAL / AyLO)
Outcome:
  Message: "R2AyLO does not equal AVAL / AyLO."
  Output_Variables:
  - "AVAL"
  - "R2AyLO"
  - "AyLO"
wildcards:
  "y":
    min: 1
    max: 99
Source:
  Message: "Calculation issue: R2AyLO != AVAL / AyLO"
  Description: "When all 3 variables are populated and AyLO does not equal 0, Ratio\
    \ to AyLO (R2AyLO) must equal Analysis Value (AVAL) / Analysis Range y LO Value\
    \ (AyLO)."
  Domains: "BDS, ADNCA, MDBDS"
  Severity: "Warning"
