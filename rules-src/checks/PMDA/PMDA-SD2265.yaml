Core:
  Id: "PMDA-SD2265"
  Status: "Published"
  Version: "1"
Description: "Raise a warning when the Parameter Value (TSVAL) and its code (TSVALCD)\
  \ for a PCLAS trial-summary parameter are not the term and code of the same MED-RT\
  \ (or legacy NDF-RT) record."
Severity: "Warning"
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "TS"
Requirements:
  Variables:
    All:
    - "TSPARMCD"
Bindings:
- name: "$pclas_medrt_pair"
  expression: "valid_external_dictionary_code_term_pair(TSVALCD, TSVAL, external_dictionary_type=\"\
    medrt\")"
Check:
  expression: >-
    TSPARMCD == "PCLAS" and $pclas_medrt_pair == false
Outcome:
  Message: "TSVAL and TSVALCD do not reference the same MED-RT (or legacy NDF-RT)\
    \ record for the PCLAS parameter."
  Output_Variables:
  - "TSPARMCD"
  - "TSVAL"
  - "TSVALCD"
Source:
  Message: "TSVAL/TSVALCD value mismatch for PCLAS"
  Description: "TSVAL and TSVALCD values must be populated from the same record in\
    \ MED-RT or NDF-RT (Note: Any version 2018-02-05 or earlier uses NDF-RT, and any\
    \ version after is MED-RT)."
  Domains: "TS"
  Severity: "Warning"
