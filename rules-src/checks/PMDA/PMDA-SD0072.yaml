Core:
  Id: "PMDA-SD0072"
  Status: "Published"
  Version: "1"
Description: "Raise an error when Related Domain Abbreviation (RDOMAIN) is populated\
  \ but does not represent a domain present in the study data."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "CO"
    - "RELREC"
    - "SUPP--"
    - "SQ--"
Bindings:
- name: "$study_domains"
  expression: "study_domains()"
Check:
  expression: >-
    not empty(RDOMAIN) and RDOMAIN not in $study_domains
Outcome:
  Message: "RDOMAIN does not represent a domain present in the study."
  Output_Variables:
  - "$study_domains"
Source:
  Message: "Invalid RDOMAIN"
  Description: "Related Domain Abbreviation (RDOMAIN) must have a valid value of Domains\
    \ included in the study data."
  Domains: "CO, RELREC, SUPPQUAL"
  Severity: "Error"
