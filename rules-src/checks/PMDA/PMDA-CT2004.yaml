Core:
  Id: "PMDA-CT2004"
  Status: "Published"
  Version: "1"
Description: "Raise an error when a populated value is not a term in the non-extensible\
  \ codelist bound at the value level (Define-XML ValueListDef / WhereClauseDef) for\
  \ the value-level condition that applies to the record."
Severity: "Reject"
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "ALL"
Check:
  expression: >-
    not empty(value()) and vlm_codelist_extensible(variable_name) == false and
    vlm_has_codelist(variable_name) == true and value() not in
    vlm_codelist_coded_values(variable_name)
Outcome:
  Message: "The value is not in the non-extensible value-level codelist declared in\
    \ the Define-XML."
Source:
  Message: "Variable value not found in non-extensible codelist when value-level condition\
    \ occurs"
  Description: "Variable must be populated with terms from its CDISC controlled terminology\
    \ codelist when its value level condition is met. New terms cannot be added into\
    \ non-extensible codelists."
  Domains: "ALL"
  Severity: "Reject"
