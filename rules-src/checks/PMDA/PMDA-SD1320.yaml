Core:
  Id: "PMDA-SD1320"
  Status: "Published"
  Version: "1"
Description: "Raise a warning when the Character Result/Finding in Std Format (--STRESC)\
  \ is not populated while the Completion Status (--STAT) is not populated."
Severity: "Warning"
Executability: "Fully Executable"
Scope:
  Classes:
    Include:
    - "FINDINGS"
    - "FINDINGS ABOUT"
Requirements:
  Variables:
    All:
    - "--STRESC"
Check:
  expression: >-
    empty(--STAT) and empty(--STRESC)
Outcome:
  Message: "--STRESC is empty when --STAT is empty."
  Message_Folded: "--STRESC not populated in any record of the dataset, and at least\
    \ one record meets the rest of the condition: --STRESC is empty when --STAT is\
    \ empty."
  Keep_Row_Findings:
  - "--STAT"
Source:
  Message: "Missing value for --STRESC when --STAT is null"
  Description: "Character Result/Finding in Std Format (--STRESC) value should not\
    \ be null when Completion Status (--STAT) value is null."
  Domains: "FINDINGS, FINDINGS ABOUT"
  Severity: "Warning"
