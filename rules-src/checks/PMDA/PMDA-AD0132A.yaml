Core:
  Id: "PMDA-AD0132A"
  Status: "Published"
  Version: "1"
Description: "Raise an error when the Baseline Value (BASE) equals 0 but the Ratio\
  \ to Baseline (R2BASE) is populated. Because R2BASE equals AVAL divided by BASE,\
  \ it cannot be derived when BASE is 0 (division by zero), so R2BASE must be missing\
  \ in that case."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "BASIC DATA STRUCTURE"
    - "MEDICAL DEVICE BASIC DATA STRUCTURE"
Requirements:
  Variables:
    All:
    - "BASE"
Check:
  expression: >-
    not empty(R2BASE) and BASE == 0
Outcome:
  Message: "BASE equals 0 but R2BASE is populated; R2BASE cannot be derived because\
    \ it would require dividing by 0."
Source:
  Message: "Calculation issue: BASE = 0, but R2BASE is populated"
  Description: "When baseline (BASE) equals 0, the Ratio to Baseline (R2BASE) should\
    \ not be populated since you cannot divide by 0. AD0132 checks the RSBASE calculation\
    \ is correct when BASE does not equal 0."
  Domains: "BDS, ADNCA, MDBDS"
  Severity: "Error"
Standards:
- Organization: "PMDA"
  Standards:
