Core:
  Id: "PMDA-SD0023"
  Status: "Published"
  Version: "1"
Description: "Raise a warning when Reason Not Done (--REASND) is populated but Completion\
  \ Status (--STAT) is not set to 'NOT DONE'."
Severity: "Warning"
Executability: "Fully Executable"
Scope:
  Classes:
    Include:
    - "INTERVENTIONS"
    - "FINDINGS"
    - "EVENTS"
    - "FINDINGS ABOUT"
Requirements:
  Variables:
    All:
    - "--REASND"
    - "--STAT"
Check:
  expression: >-
    not empty(--REASND) and --STAT != "NOT DONE"
Outcome:
  Message: "--STAT is not set to 'NOT DONE' when --REASND is provided."
  Output_Variables:
  - "!--REASND"
Source:
  Message: "Missing value for --STAT when --REASND is provided"
  Description: "Completion Status (--STAT) should be set to 'NOT DONE' when Reason\
    \ Not Done (--REASND) is populated."
  Domains: "INTERVENTIONS, FINDINGS, EVENTS, FINDINGS ABOUT"
  Severity: "Warning"
