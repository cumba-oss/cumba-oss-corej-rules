Core:
  Id: "PMDA-AD0325"
  Status: "Published"
  Version: "1"
Description: "Raise an error when the Subperiod within Period (ASPER) variable does\
  \ not hold a single consistent value for each unique value of the Subperiod within\
  \ Period (C) (ASPERC) variable, evaluated over the records where the primary variable\
  \ ASPERC is populated."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "ALL"
Requirements:
  Variables:
    All:
    - "ASPER"
Check:
  expression: >-
    var_exists("ASPERC") and not empty(ASPERC) and is_inconsistent_across_dataset(ASPER,
    keep_missings=true, keys=[APERIOD, ASPERC])
Outcome:
  Message: "Inconsistent value for ASPER."
Source:
  Message: "Inconsistent value for ASPER"
  Description: "Within a Study and a Period, all Subperiod within Period (ASPER) variable\
    \ values must be the same for each unique value of Subperiod within Period (C)\
    \ (ASPERC) variable when the primary variable ASPERC is populated."
  Domains: "BDS, ADNCA, MDBDS, OCCDS, ADAE, MDOCCDS, ADAMOTHER"
  Severity: "Error"
Standards:
- Organization: "PMDA"
  Standards:
  - Name: "ADaMIG"
    Version: "1.3"
    References:
    - Origin: "PMDA Validation Rules"
      Rule_Identifier:
        Id: "AD0325"
        Version: "1"
      Version: "6.0"
  - Name: "ADaMIG"
    Version: "1.2"
