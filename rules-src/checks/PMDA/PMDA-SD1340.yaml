Core:
  Id: "PMDA-SD1340"
  Status: "Published"
  Version: "1"
Description: "Raise a warning when an Exposure (EX) record, other than a run-in record\
  \ (EPOCH equals 'RUN-IN'), is present for a subject who is not treated (DM.ACTARMCD\
  \ equals 'NOTTRT' or is empty)."
Severity: "Warning"
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "EX"
Requirements:
  Variables:
    All:
    - "USUBJID"
    All_Or_None:
    - - "USUBJID"
      - "DM.USUBJID"
Match_Datasets:
- Keys:
  - "USUBJID"
  Name: "DM"
Check:
  expression: >-
    (not var_exists("EPOCH") or EPOCH != "RUN-IN") and var_exists(DM.ACTARMCD) and
    (upper(DM.ACTARMCD) == "NOTTRT" or empty(DM.ACTARMCD))
Outcome:
  Message: "An Exposure (EX) record is present for a subject who is not treated (ACTARMCD\
    \ equals 'NOTTRT' or is empty)."
Source:
  Message: "EX record is present when subject is not treated"
  Description: "Subjects that are not treated (ACTARMCD='NOTTRT' or null) should not\
    \ have any Exposure records. Run-in records (EPOCH='RUN-IN') are excluded from\
    \ firing for this validation rule."
  Domains: "EX"
  Severity: "Warning"
Standards:
- Organization: "PMDA"
  Standards:
  - Name: "SDTMIG"
    Version: "3.4"
    References:
    - Origin: "PMDA Validation Rules"
      Rule_Identifier:
        Id: "SD1340"
        Version: "1"
      Version: "6.0"
  - Name: "SDTMIG"
    Version: "3.3"
    References:
    - Origin: "PMDA Validation Rules"
      Rule_Identifier:
        Id: "SD1340"
        Version: "1"
      Version: "6.0"
- Organization: "FDA"
  Standards:
