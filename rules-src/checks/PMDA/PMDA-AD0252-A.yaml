Core:
  Id: "PMDA-AD0252-A"
  Status: "Published"
  Version: "1"
Description: "Raise an error for each variable in an occurrence-data-structure (OCCDS)\
  \ dataset whose name is one of the basic-data-structure numeric analysis-category\
  \ variables AVALCAyN or BASECAyN (introduced in ADaMIG 1.1), which are prohibited\
  \ in OCCDS datasets."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "OCCURRENCE DATA STRUCTURE"
    - "MEDICAL DEVICE OCCURRENCE DATA STRUCTURE"
Check:
  expression: >-
    upper(varname()) =~ /^AVALCA([1-9]|[1-9][0-9])N$/ or upper(varname()) =~
    /^BASECA([1-9]|[1-9][0-9])N$/
Outcome:
  Message: "The variable is prohibited in occurrence-data-structure datasets: its\
    \ name is one of the basic-data-structure numeric analysis-category variables\
    \ AVALCAyN and BASECAyN."
Source_Proposed:
  Message: "The variable is prohibited in occurrence-data-structure datasets: its\
    \ name is one of the basic-data-structure numeric analysis-category variables\
    \ AVALCAyN and BASECAyN."
  Description: "Raise an error for each variable in an occurrence-data-structure (OCCDS)\
    \ dataset whose name is one of the basic-data-structure numeric analysis-category\
    \ variables AVALCAyN or BASECAyN (introduced in ADaMIG 1.1), which are prohibited\
    \ in OCCDS datasets."
  Domains: "OCCURRENCE DATA STRUCTURE, MEDICAL DEVICE OCCURRENCE DATA STRUCTURE"
  Severity: "Error"
Source:
  Message: "Variable present in dataset is prohibited for use in ADaM"
  Description: "Variables described in ADaM IG as inappropriate for usage must be\
    \ not included in the dataset. i.e., for ADAE, there is no need for AVAL, AVALC\
    \ and Parameter variables."
  Domains: "ADSL, ADDL, BDS, ADNCA, MDBDS, OCCDS, ADAE, MDOCCDS"
  Severity: "Error"
