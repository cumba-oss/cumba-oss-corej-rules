Core:
  Id: "PMDA-SD2261"
  Status: "Published"
  Version: "1"
Description: "Raise a warning when the Parameter Value Code (TSVALCD) for a TRT (Investigational\
  \ Therapy or Treatment) trial-summary parameter is not a valid Unique Ingredient\
  \ Identifier (UNII) in the FDA Substance Registration System (SRS)."
Severity: "Warning"
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "TS"
Requirements:
  Variables:
    All:
    - "TSPARMCD"
Operations:
- id: "$trt_srs_code"
  expression: "valid_external_dictionary_code(TSVALCD, external_dictionary_type=\"\
    unii\", dictionary_term_type=\"UNII\")"
Check:
  expression: >-
    TSPARMCD == "TRT" and $trt_srs_code == false
Outcome:
  Message: "TSVALCD is not a valid FDA-SRS Unique Ingredient Identifier (UNII) for\
    \ the TRT parameter."
  Output_Variables:
  - "TSPARMCD"
  - "TSVALCD"
Source:
  Message: "Invalid TSVALCD value for TRT"
  Description: "TSVALCD for TRT record must be a valid unique ingredient identifier\
    \ from FDA Substance Registration System (SRS)."
  Domains: "TS"
  Severity: "Warning"
