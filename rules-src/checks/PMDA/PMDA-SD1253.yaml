Core:
  Id: "PMDA-SD1253"
  Status: "Published"
  Version: "1"
Description: "Raise an error when a record is present in the DD domain but DTHFL in\
  \ the DM dataset does not equal 'Y' for the corresponding subject."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "DM"
Requirements:
  Variables:
    All:
    - "DTHFL"
    - "USUBJID"
Operations:
- id: "$usubjids_in_dd"
  expression: "distinct(USUBJID, domain=\"DD\")"
Check:
  expression: >-
    DTHFL != "Y" and USUBJID in $usubjids_in_dd
Outcome:
  Message: "DTHFL does not equal 'Y' when a record is present in the DD domain for\
    \ the subject."
  Output_Variables:
  - "DTHFL"
Source:
  Message: "DTHFL does not equal 'Y' when DD record is present"
  Description: "DTHFL must equal 'Y' when there is a record in the Death Details (DD)\
    \ domain."
  Domains: "DD"
  Severity: "Error"
Standards:
- Organization: "PMDA"
  Standards:
  - Name: "SDTMIG"
    Version: "3.2"
    References:
    - Origin: "PMDA Validation Rules"
      Rule_Identifier:
