Core:
  Id: "PMDA-SD0044"
  Status: "Published"
  Version: "1"
Description: "Raise a warning when --VAMT (Treatment Vehicle Amount) is populated\
  \ but --VAMTU (Treatment Vehicle Amount Units) is not present or is empty."
Severity: "Warning"
Executability: "Fully Executable"
Scope:
  Classes:
    Include:
    - "INTERVENTIONS"
Requirements:
  Variables:
    All:
    - "--VAMT"
Check:
  expression: >-
    not empty(--VAMT) and empty(--VAMTU)
Outcome:
  Message: "--VAMTU is empty when --VAMT is populated."
  Output_Variables:
  - "--VAMT"
  - "--VAMTU"
Source:
  Message: "Missing value for --VAMTU when --VAMT is populated"
  Description: "Treatment Vehicle Amount Units (--VAMTU) should not be null when Treatment\
    \ Vehicle Amount (--VAMT) is populated."
  Domains: "INTERVENTIONS"
  Severity: "Warning"
