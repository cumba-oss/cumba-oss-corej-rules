Core:
  Id: "PMDA-SD1240"
  Status: "Published"
  Version: "1"
Description: "Raise a warning when a DM subject has no Informed Consent record (DSDECOD\
  \ equals 'INFORMED CONSENT OBTAINED') in the Disposition (DS) domain."
Severity: "Warning"
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "DM"
Bindings:
- name: "$ds_ic_usubjid"
  expression: "distinct(USUBJID, domain=\"DS\", filter=(DSDECOD == \"INFORMED CONSENT\
    \ OBTAINED\"))"
Check:
  expression: >-
    USUBJID not in $ds_ic_usubjid
Outcome:
  Message: "No Informed Consent Obtained record is present in the DS domain for the\
    \ subject."
  Message_Folded: "USUBJID not present in the dataset: No Informed Consent Obtained\
    \ record is present in the DS domain for the subject."
  Output_Variables:
  - "$ds_ic_usubjid"
Source:
  Message: "No Informed Consent Obtained record in DS domain for subject"
  Description: "All subjects should have an Informed Consent record in the Disposition\
    \ domain."
  Domains: "DM"
  Severity: "Warning"
