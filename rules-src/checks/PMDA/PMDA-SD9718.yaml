Core:
  Id: "PMDA-SD9718"
  Status: "Published"
  Version: "1"
Description: "Raise a warning when none of the variables Start Date/Time (--STDTC),\
  \ Collection Date/Time (--DTC) and Start Study Day (--STDY) is present in the dataset."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "DS"
Check:
  expression: >-
    not var_exists("--STDTC") and not var_exists("--DTC") and not var_exists("--STDY")
Outcome:
  Message: "None of --STDTC, --DTC and --STDY is present in the dataset."
Source_Proposed:
  Sheet_Issue: "#182"
  Message: "Neither --STDTC, --DTC nor --STDY is present in the dataset"
  Description: "At least one of the three variables Start Date/Time (--STDTC), Collection\
    \ Date/Time (--DTC) or Start Study Day (--STDY) must be present in the dataset."
  Domains: "DS"
  Severity: "Warning"
Standards:
- Organization: "PMDA"
  Standards:
  - Name: "SDTMIG"
    Version: "3.1.2"
  - Name: "SDTMIG"
    Version: "3.1.3"
  - Name: "SDTMIG"
    Version: "3.2"
  - Name: "SDTMIG"
    Version: "3.3"
  - Name: "SDTMIG"
    Version: "3.4"
