Core:
  Id: "PMDA-SD9723"
  Status: "Published"
  Version: "1"
Description: "Raise a warning when Description of Unplanned Element (SEUPDES) is not\
  \ present in the dataset although an Element Code (ETCD) equal to 'UNPLAN' is reported."
Sensitivity: "Dataset"
Executability: "Partially Executable - Possible Overreporting"
Scope:
  Domains:
    Include:
    - "SE"
Requirements:
  Variables:
    None:
    - "SEUPDES"
    All:
    - "ETCD"
Check:
  expression: >-
    ETCD == "UNPLAN"
Outcome:
  Message: "SEUPDES is not present in the dataset although ETCD is equal to 'UNPLAN'."
Source_Proposed:
  Sheet_Issue: "#193"
  Message: "Description of Unplanned Element (SEUPDES) is not present in the dataset\
    \ when ETCD equals 'UNPLAN'"
  Description: "The Description of Unplanned Element (SEUPDES) variable must be present\
    \ in the dataset when a subject's experience is represented as an unplanned Element,\
    \ where Element Code (ETCD) is equal to 'UNPLAN'."
  Domains: "SE"
  Severity: "Warning"
Standards:
- Organization: "PMDA"
  Standards:
  - Name: "SDTMIG"
    Version: "3.4"
  - Name: "SDTMIG"
    Version: "3.3"
  - Name: "SDTMIG"
    Version: "3.2"
  - Name: "SDTMIG"
    Version: "3.1.3"
  - Name: "SDTMIG"
    Version: "3.1.2"
