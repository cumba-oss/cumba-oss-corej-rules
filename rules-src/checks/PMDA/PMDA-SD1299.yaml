Core:
  Id: "PMDA-SD1299"
  Status: "Published"
  Version: "1"
Description: "Raise a warning when a dataset based on the Interventions, Events or\
  \ Findings general observation classes does not contain at least one Timing variable."
Severity: "Warning"
Executability: "Partially Executable - Possible Underreporting"
Scope:
  Classes:
    Include:
    - "INTERVENTIONS"
    - "EVENTS"
    - "FINDINGS"
    - "FINDINGS ABOUT"
  Domains:
    Exclude:
    - "IE"
    - "SC"
Bindings:
- name: "$dataset_variables"
  expression: "get_column_order_from_dataset()"
- name: "$dataset_variables_upper"
  expression: "upper($dataset_variables)"
- name: "$timing_variables"
  expression: "get_model_filtered_variables(key_name=\"role\", key_value=\"Timing\"\
    )"
Check:
  expression: >-
    not shares_elements_with($dataset_variables_upper, $timing_variables)
Outcome:
  Message: "No timing variables are present in the dataset."
  Output_Variables:
  - "$dataset_variables"
  - "$timing_variables"
  - "!$dataset_variables_upper"
Source:
  Message: "No timing variables are present in dataset"
  Description: "All domains based on the general observation classes (Interventions,\
    \ Events, Findings) should have at least one Timing variable present."
  Domains: "INTERVENTIONS, FINDINGS (-IE, -SC), EVENTS, FINDINGS ABOUT"
  Severity: "Warning"
