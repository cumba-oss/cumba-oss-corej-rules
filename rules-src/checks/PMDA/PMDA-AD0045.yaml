Core:
  Id: "PMDA-AD0045"
  Status: "Published"
  Version: "1"
Description: "Raise an error when a record carries both a date variable (*DT) and\
  \ its corresponding datetime variable (*DTM) and the date portion of the datetime\
  \ value differs from the date value itself."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "SUBJECT LEVEL ANALYSIS DATASET"
    - "BASIC DATA STRUCTURE"
    - "OCCURRENCE DATA STRUCTURE"
    - "DEVICE LEVEL ANALYSIS DATASET"
    - "MEDICAL DEVICE BASIC DATA STRUCTURE"
    - "MEDICAL DEVICE OCCURRENCE DATA STRUCTURE"
Check:
  expression: >-
    not empty(*DT) and not empty(*DTM) and date_part(date(*DTM)) != date(*DT)
Outcome:
  Message: "The date portion of a *DTM datetime variable differs from its corresponding\
    \ *DT date variable."
  Output_Variables:
  - "*DT"
  - "*DTM"
Source:
  Message: "*DT and its corresponding *DTM variable have different date values"
  Description: "When both date and datetime variables are collected on the same record\
    \ for the same observation, the Date portion of the datetime variable should be\
    \ equal to the Date variable itself."
  Domains: "ADSL, ADDL, BDS, ADNCA, MDBDS, OCCDS, ADAE, MDOCCDS, ADAMOTHER"
  Severity: "Error"
Standards:
- Organization: "PMDA"
  Standards:
