Core:
  Id: "PMDA-AD0649-A"
  Status: "Published"
  Version: "1"
Description: "Raise a warning when an indexed ONTRTxxFL flag variable is present in\
  \ the dataset but the corresponding non-indexed ONTRTFL variable is not; the indexed\
  \ flags qualify ONTRTFL, so ONTRTFL must exist wherever they do."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "OCCURRENCE DATA STRUCTURE"
    - "MEDICAL DEVICE OCCURRENCE DATA STRUCTURE"
Check:
  expression: >-
    varname() =~ /^(ONTR(0[1-9]|[1-9][0-9])|ONTRT[1-9])FL$/ and not var_exists("ONTRTFL")
Outcome:
  Message: "An indexed flag variable is present but ONTRTFL is not."
  Output_Variables:
  - "variable_name"
Source_Proposed:
  Message: "ONTRxxFL is included but ONTRTFL is not present"
  Description: "If ONTRxxFL is included, ONTRTFL is defined as the overall on-treatment\
    \ flag. The On Treatment Record Flag (ONTRTFL) variable must therefore be present\
    \ in the dataset whenever any On Treatment Period xx Flag (ONTRxxFL) variable\
    \ is present."
  Domains: "OCCDS, ADAE, MDOCCDS"
  Severity: "Error"
Source:
  Message: "ONTRxxFL = Y and ONTRTFL != Y"
  Description: "If ONTRxxFL is included, ONTRTFL is defined as the overall on-treatment\
    \ flag. If any On Treatment Period xx Flag (ONTRxxFL) variables are flagged Y,\
    \ then the overall On Treatment Record Flag (ONTRTFL) variable should also be\
    \ Y."
  Domains: "OCCDS, ADAE, MDOCCDS"
  Severity: "Error"
Standards:
- Organization: "PMDA"
  Standards:
  - Name: "ADaMIG"
    Version: "1.3"
    References:
    - Origin: "PMDA Validation Rules"
      Rule_Identifier:
        Id: "AD0649"
        Version: "1"
      Version: "6.0"
