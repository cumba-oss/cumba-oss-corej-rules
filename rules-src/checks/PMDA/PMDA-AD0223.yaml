Core:
  Id: "PMDA-AD0223"
  Status: "Published"
  Version: "1"
Description: "Raise a warning when Change from Baseline (CHG), Analysis Value (AVAL)\
  \ and Baseline Value (BASE) are all populated but CHG does not equal AVAL minus\
  \ BASE."
Severity: "Warning"
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "BASIC DATA STRUCTURE"
    - "MEDICAL DEVICE BASIC DATA STRUCTURE"
Check:
  expression: >-
    not empty(CHG) and not empty(AVAL) and not empty(BASE) and CHG != (AVAL - BASE)
Outcome:
  Message: "CHG does not equal AVAL minus BASE."
  Output_Variables:
  - "AVAL"
  - "BASE"
  - "CHG"
Source:
  Message: "Calculation issue: CHG != AVAL - BASE"
  Description: "When all 3 variables are populated, Change from Baseline (CHG) must\
    \ equal Analysis Value (AVAL) minus Baseline Value (BASE)."
  Domains: "BDS, ADNCA, MDBDS"
  Severity: "Warning"
Standards:
- Organization: "PMDA"
  Standards:
