Core:
  Id: "PMDA-SD1018"
  Status: "Published"
  Version: "1"
Description: "Raise a warning when, for a planned visit (SVUPDES is empty) in the\
  \ Subject Visits (SV) domain, the combination of Visit Number (VISITNUM), Visit\
  \ Name (VISIT), and Planned Study Day of Visit (VISITDY) does not match an entry\
  \ in the Trial Visits (TV) dataset."
Severity: "Warning"
Executability: "Partially Executable - Possible Overreporting"
Scope:
  Domains:
    Include:
    - "SV"
Requirements:
  Variables:
    All:
    - "VISITNUM"
Match_Datasets:
- Join_Type: "left"
  Keys:
  - "VISITNUM"
  - "VISIT"
  - "VISITDY"
  Name: "TV"
Check:
  expression: >-
    not empty(VISITNUM) and empty(SVUPDES) and empty(TV.VISITNUM)
Outcome:
  Message: "The combination of VISITNUM, VISIT, and VISITDY for a planned visit does\
    \ not match any entry in the Trial Visits (TV) dataset."
  Output_Variables:
  - "VISITNUM"
  - "VISIT"
  - "VISITDY"
  - "SVUPDES"
  - "TV.VISITNUM"
Source:
  Message: "VISITNUM/VISIT/VISITDY values do not match TV domain data"
  Description: "The combination of Visit Number (VISITNUM), Visit Name (VISIT), and\
    \ Planned Study Day of Visit (VISITDY) values should match entries in the Trial\
    \ Visits (TV) dataset when they are planned visits (SVUPDES = null)."
  Domains: "SV"
  Severity: "Warning"
