Core:
  Id: "PMDA-SD1068"
  Status: "Published"
  Version: "1"
Description: "Raise a warning when ELEMENT is not unique within the TE dataset."
Severity: "Warning"
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "TE"
Requirements:
  Variables:
    All:
    - "ELEMENT"
Check:
  expression: >-
    not is_unique_set([ELEMENT])
Outcome:
  Message: "Duplicate ELEMENT value"
Source:
  Message: "Duplicate ELEMENT value"
  Description: "The value of Element (Description of Element) variable must be unique\
    \ within Trial Elements (TE) domain."
  Domains: "TE"
  Severity: "Warning"
