Core:
  Id: "PMDA-SD1325"
  Status: "Published"
  Version: "1"
Description: "Raise an error when the dataset label in the submitted dataset does\
  \ not match the dataset description declared in the Define-XML."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "ALL"
Check:
  expression: >-
    not empty(ds_label("DEFINE")) and ds_label() != ds_label("DEFINE")
Outcome:
  Message: "The dataset label does not match the dataset description in the Define-XML."
Source:
  Message: "Define.xml/dataset description mismatch"
  Description: "Dataset Description in define.xml must match dataset Description."
  Domains: "ALL"
  Severity: "Error"
