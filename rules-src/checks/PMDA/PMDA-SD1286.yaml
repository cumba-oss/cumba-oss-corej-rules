Core:
  Id: "PMDA-SD1286"
  Status: "Published"
  Version: "1"
Description: "Raise an error when TIVERS is present and IETESTCD is not unique within\
  \ TIVERS."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "TI"
Requirements:
  Variables:
    All:
    - "TIVERS"
Check:
  expression: >-
    var_exists("TIVERS") and not is_unique_set([IETESTCD, TIVERS])
Outcome:
  Message: "IETESTCD is not unique within TIVERS."
Source:
  Message: "IETESTCD is not unique within TIVERS"
  Description: "A value of Incl/Excl Criterion Short Name (IETESTCD) must be unique\
    \ within a version of inclusion/exclusion criteria (TIVERS)."
  Domains: "TI"
  Severity: "Error"
