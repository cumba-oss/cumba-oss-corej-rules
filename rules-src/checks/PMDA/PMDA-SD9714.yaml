Core:
  Id: "PMDA-SD9714"
  Status: "Published"
  Version: "1"
Description: "Raise a warning when --ORRES carries at least one non-empty value but\
  \ the corresponding original-units variable --ORRESU is not present in the dataset;\
  \ a result in original units requires its units variable."
Executability: "Fully Executable"
Scope:
  Classes:
    Include:
    - "FINDINGS"
    - "FINDINGS ABOUT"
  Domains:
    Exclude:
    - "IE"
    - "QS"
    - "SC"
    - "SS"
Requirements:
  Variables:
    None:
    - "--ORRESU"
Check:
  expression: >-
    not var_is_null(--ORRES)
Outcome:
  Message: "--ORRES has at least one non-empty value but --ORRESU is not present."
  Output_Variables:
  - "--ORRES"
Source_Proposed:
  Sheet_Issue: "#169"
  Message: "--ORRESU is not present although --ORRES is populated"
  Description: "The Original Units (--ORRESU) variable must be present in the dataset\
    \ when the Result or Finding in Original Units (--ORRES) variable carries at least\
    \ one non-empty value."
  Domains: "FINDINGS"
  Severity: "Warning"
Standards:
- Organization: "PMDA"
  Standards:
  - Name: "SDTMIG"
    Version: "3.4"
  - Name: "SDTMIG"
    Version: "3.3"
  - Name: "SDTMIG"
    Version: "3.2"
  - Name: "SDTMIG"
    Version: "3.1.3"
  - Name: "SDTMIG"
    Version: "3.1.2"
