Core:
  Id: "PMDA-AD0041A"
  Status: "Published"
  Version: "1"
Description: "Raise an error when a variable whose name ends in 'DT' has a missing\
  \ SAS display format. *DT variables must have a non-missing SAS date format."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "ALL"
Check:
  expression: >-
    ends_with(upper(varname()), "DT") and empty(var_format("DATA"))
Outcome:
  Message: "A variable whose name ends in 'DT' has a missing SAS date format."
Source:
  Message: "*DT variable has missing SAS Date Format"
  Description: "*DT variables must have non-missing SAS Date Format."
  Domains: "ADSL, ADDL, BDS, ADNCA, MDBDS, OCCDS, ADAE, MDOCCDS, ADAMOTHER"
  Severity: "Error"
