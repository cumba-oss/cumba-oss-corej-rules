Core:
  Id: "PMDA-SD2228"
  Status: "Published"
  Version: "1"
Description: "Raise a warning when the study type equals 'INTERVENTIONAL' and the\
  \ Trial Summary (TS) dataset does not contain a record where TSPARMCD equals 'INTMODEL'\
  \ (Intervention Model)."
Severity: "Warning"
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "TS"
Operations:
- id: "$styp_interventional_count"
  expression: "record_count(filter=filter(TSPARMCD=\"STYPE\", TSVAL=\"INTERVENTIONAL\"\
    ))"
- id: "$intmodel_count"
  expression: "record_count(filter=filter(TSPARMCD=\"INTMODEL\"))"
Check:
  expression: >-
    $styp_interventional_count >= 1 and $intmodel_count == 0
Outcome:
  Message: "Missing INTMODEL Trial Summary Parameter: a 'Intervention Model' (INTMODEL)\
    \ record must be present in the Trial Summary (TS) domain."
  Output_Variables:
  - "$styp_interventional_count"
  - "$intmodel_count"
Source:
  Message: "Missing INTMODEL Trial Summary Parameter"
  Description: "'Intervention Model' (INTMODEL) record must be populated in Trial\
    \ Summary (TS) domain when study type is 'INTERVENTIONAL'. It is expected for\
    \ SDTM IG v3.1.2 data and required for data in all more recent SDTM versions."
  Domains: "TS"
  Severity: "Warning"
