Core:
  Id: "PMDA-AD0320B"
  Status: "Published"
  Version: "1"
Description: "Raise an error when a dataset named ADDL does not carry the dataset\
  \ label 'Device-level Analysis Dataset' required by the PMDA validation rules."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "ADDL"
Check:
  expression: >-
    ds_label("DATA") != "Device-level Analysis Dataset"
Outcome:
  Message: "The ADDL dataset label is not 'Device-level Analysis Dataset'."
  Output_Variables:
  - "dataset_label"
Source:
  Message: "Non-standard dataset label"
  Description: "The dataset label for a dataset named 'ADDL' must be 'Device-level\
    \ Analysis Dataset'."
  Domains: "ADDL"
  Severity: "Error"
Standards:
- Organization: "PMDA"
  Standards:
  - Name: "ADaMIG"
    Version: "1.3"
    References:
    - Origin: "PMDA Validation Rules"
      Rule_Identifier:
        Id: "AD0320B"
        Version: "1"
      Version: "6.0"
