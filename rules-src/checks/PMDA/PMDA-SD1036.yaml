Core:
  Id: "PMDA-SD1036"
  Status: "Published"
  Version: "1"
Description: "Raise a warning when Toxicity Grade (--TOXGR) is not populated but Toxicity\
  \ (--TOX) is populated."
Severity: "Warning"
Executability: "Partially Executable - Possible Underreporting"
Scope:
  Domains:
    Include:
    - "CP"
    - "CV"
    - "EG"
    - "LB"
    - "MI"
    - "PC"
    - "PP"
    - "RE"
    - "VS"
    - "AE"
    - "CE"
    - "MH"
Requirements:
  Variables:
    All:
    - "--TOX"
    - "--TOXGR"
Check:
  expression: >-
    not empty(--TOX) and empty(--TOXGR)
Outcome:
  Message: "--TOXGR is empty when --TOX is populated."
  Message_Folded: "--TOXGR not populated in any record of the dataset, and at least\
    \ one record meets the rest of the condition: --TOXGR is empty when --TOX is populated."
Source:
  Message: "Missing value for --TOXGR when --TOX is populated"
  Description: "Toxicity Grade (--TOXGR) should be provided when Toxicity (--TOX)\
    \ is populated."
  Domains: "CP, CV, EG, LB, MI, PC, PP, RE, VS, AE, CE, MH"
  Severity: "Warning"
