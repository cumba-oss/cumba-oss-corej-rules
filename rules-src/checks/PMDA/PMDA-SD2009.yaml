Core:
  Id: "PMDA-SD2009"
  Status: "Published"
  Version: "1"
Description: "Raise an error when a Lowest Level Term Code (--LLTCD) value is not\
  \ a valid Lowest Level Term code in the MedDRA dictionary."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "AE"
    - "CE"
    - "MH"
Requirements:
  Variables:
    All:
    - "--LLTCD"
Bindings:
- name: "$lltcd_valid"
  expression: "valid_external_dictionary_code(--LLTCD, external_dictionary_type=\"\
    meddra\", dictionary_term_type=\"LLTCD\")"
Check:
  expression: >-
    $lltcd_valid == false
Outcome:
  Message: "Lowest Level Term Code (--LLTCD) is not a valid MedDRA Lowest Level Term\
    \ code."
  Output_Variables:
  - "--LLTCD"
Source:
  Message: "Value for --LLTCD not found in MedDRA dictionary"
  Description: "Value for Lowest Level Term Code (--LLTCD) variable must be populated\
    \ using a Lowest Level Term Code of the MedDRA dictionary of a version specified\
    \ in the define.xml."
  Domains: "AE, CE, MH"
  Severity: "Error"
