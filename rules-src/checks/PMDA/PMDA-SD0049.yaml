Core:
  Id: "PMDA-SD0049"
  Status: "Published"
  Version: "1"
Description: "Raise a warning when --STRTPT (Start Relative to Reference Time Point)\
  \ is populated but --STTPT (Start Reference Time Point) is empty."
Severity: "Warning"
Executability: "Partially Executable - Possible Underreporting"
Scope:
  Classes:
    Include:
    - "EVENTS"
    - "FINDINGS"
    - "FINDINGS ABOUT"
    - "INTERVENTIONS"
    - "SPECIAL PURPOSE"
  Domains:
    Exclude:
    - "CO"
    - "DM"
Requirements:
  Variables:
    All:
    - "--STRTPT"
    - "--STTPT"
Check:
  expression: >-
    not empty(--STRTPT) and empty(--STTPT)
Outcome:
  Message: "--STTPT is empty when --STRTPT is populated."
  Message_Folded: "--STTPT not populated in any record of the dataset, and at least\
    \ one record meets the rest of the condition: --STTPT is empty when --STRTPT is\
    \ populated."
Source:
  Message: "Missing value for --STTPT when --STRTPT is populated"
  Description: "Start Reference Time Point (--STTPT) must not be null when Start Relative\
    \ to Reference Time Point (--STRTPT) is provided."
  Domains: "SPECIAL PURPOSE (-CO, -DM), INTERVENTIONS, FINDINGS, EVENTS, FINDINGS\
    \ ABOUT"
  Severity: "Warning"
