Core:
  Id: "PMDA-SD2204"
  Status: "Published"
  Version: "1"
Description: "Raise a warning when the Trial Summary (TS) dataset does not contain\
  \ a record where TSPARMCD equals 'LENGTH' (Trial Length)."
Severity: "Warning"
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "TS"
Bindings:
- name: "$length_count"
  expression: "record_count(filter=filter(TSPARMCD=\"LENGTH\"))"
Check:
  expression: >-
    $length_count == 0
Outcome:
  Message: "Missing LENGTH Trial Summary Parameter: a 'Trial Length' (LENGTH) record\
    \ must be present in the Trial Summary (TS) domain."
  Output_Variables:
  - "$length_count"
Source:
  Message: "Missing LENGTH Trial Summary Parameter"
  Description: "'Trial Length' (LENGTH) record must be populated in Trial Summary\
    \ (TS) domain. It is expected for SDTM IG v3.1.2 data and required for data in\
    \ all more recent SDTM versions."
  Domains: "TS"
  Severity: "Warning"
Standards:
