Core:
  Id: "PMDA-SD1278"
  Status: "Published"
  Version: "1"
Description: "Raise an error when TSVAL and TSVALCD are populated but do not have\
  \ a one-to-one relationship."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "TS"
Requirements:
  Variables:
    All:
    - "TSVAL"
    - "TSVALCD"
Check:
  expression: >-
    not empty(TSVAL) and not empty(TSVALCD) and not is_unique_relationship(TSVAL, TSVALCD)
Outcome:
  Message: "TSVALCD and TSVAL do not have a one-to-one relationship."
Source:
  Message: "Inconsistent value for TSVALCD within TSVAL"
  Description: "Parameter Value Code (TSVALCD) and Parameter Value (TSVAL) should\
    \ have a one-to-one relationship."
  Domains: "TS"
  Severity: "Error"
