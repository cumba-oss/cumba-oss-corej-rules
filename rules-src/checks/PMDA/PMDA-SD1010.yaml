Core:
  Id: "PMDA-SD1010"
  Status: "Published"
  Version: "1"
Description: "Raise a warning when ELEMENT is populated and ETCD is equal to 'UNPLAN'."
Severity: "Warning"
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "SE"
Requirements:
  Variables:
    All:
    - "ELEMENT"
    - "ETCD"
Check:
  expression: >-
    ETCD == "UNPLAN" and not empty(ELEMENT)
Outcome:
  Message: "ELEMENT is populated when ETCD is equal to 'UNPLAN'."
Source:
  Message: "ELEMENT value is populated when ETCD= 'UNPLAN'"
  Description: "Description of Element (ELEMENT) should be null when subject's experience\
    \ for a particular period of time is represented as an unplanned Element, where\
    \ Element Code (ETCD) is equal to 'UNPLAN'."
  Domains: "SE"
  Severity: "Warning"
