Core:
  Id: "PMDA-SD0083"
  Status: "Published"
  Version: "1"
Description: "Raise an error when the Unique Subject Identifier (USUBJID) is not unique\
  \ within a study (STUDYID) in the Demographics (DM) domain. DM should contain exactly\
  \ one record per subject."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "DM"
Check:
  expression: >-
    not is_unique_set([USUBJID, STUDYID])
Outcome:
  Message: "USUBJID is not unique within STUDYID; DM should contain one record per\
    \ subject."
Source:
  Message: "Duplicate USUBJID in DM within STUDYID"
  Description: "The value of Unique Subject Identifier (USUBJID) variable must be\
    \ unique for each subject across all trials in the submission. In the Demographics\
    \ (DM) domain, there should only be one record per subject."
  Domains: "DM"
  Severity: "Error"
