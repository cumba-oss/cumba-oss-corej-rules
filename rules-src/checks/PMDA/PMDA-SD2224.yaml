Core:
  Id: "PMDA-SD2224"
  Status: "Published"
  Version: "1"
Description: "Raise a warning when the Trial Summary (TS) dataset does not contain\
  \ a record where TSPARMCD equals 'FCNTRY' (Planned Country of Investigational Sites)."
Severity: "Warning"
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "TS"
Bindings:
- name: "$fcntry_count"
  expression: "record_count(filter=(TSPARMCD == \"FCNTRY\"))"
Check:
  expression: >-
    $fcntry_count == 0
Outcome:
  Message: "Missing FCNTRY Trial Summary Parameter: a 'Planned Country of Investigational\
    \ Sites' (FCNTRY) record must be present in the Trial Summary (TS) domain."
Source:
  Message: "Missing FCNTRY Trial Summary Parameter"
  Description: "'Planned Country of Investigational Sites' (FCNTRY) record must be\
    \ populated in Trial Summary (TS) domain. It is expected for SDTM IG v3.1.2 data\
    \ and required for data in all more recent SDTM versions."
  Domains: "TS"
  Severity: "Warning"
