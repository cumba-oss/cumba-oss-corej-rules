Core:
  Id: "PMDA-SD2215"
  Status: "Published"
  Version: "1"
Description: "Raise a warning when the Trial Summary (TS) dataset does not contain\
  \ a record where TSPARMCD equals 'TTYPE' (Trial Type)."
Severity: "Warning"
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "TS"
Bindings:
- name: "$ttype_count"
  expression: "record_count(filter=(TSPARMCD == \"TTYPE\"))"
Check:
  expression: >-
    $ttype_count == 0
Outcome:
  Message: "Missing TTYPE Trial Summary Parameter: a 'Trial Type' (TTYPE) record must\
    \ be present in the Trial Summary (TS) domain."
  Output_Variables:
  - "$ttype_count"
Source:
  Message: "Missing TTYPE Trial Summary Parameter"
  Description: "'Trial Type (TTYPE) record must be populated in Trial Summary (TS)\
    \ domain. It is expected for SDTM IG v3.1.2 data and required for data in all\
    \ more recent SDTM versions."
  Domains: "TS"
  Severity: "Warning"
