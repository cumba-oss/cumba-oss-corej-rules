Core:
  Id: "PMDA-SD1098"
  Status: "Published"
  Version: "1"
Description: "Raise a warning when Subcategory (--SCAT) is populated but Category\
  \ (--CAT) is not populated."
Severity: "Warning"
Executability: "Partially Executable - Possible Underreporting"
Scope:
  Classes:
    Include:
    - "INTERVENTIONS"
    - "FINDINGS"
    - "EVENTS"
    - "FINDINGS ABOUT"
Requirements:
  Variables:
    All:
    - "--SCAT"
    - "--CAT"
Check:
  expression: >-
    not empty(--SCAT) and empty(--CAT)
Outcome:
  Message: "--CAT is not populated when --SCAT is populated."
  Message_Folded: "--CAT not populated in any record of the dataset, and at least\
    \ one record meets the rest of the condition: --CAT is not populated when --SCAT\
    \ is populated."
Source:
  Message: "Missing --CAT value when --SCAT value is populated"
  Description: "Value for Category (--CAT) variable should be populated when value\
    \ for Subcategory (--SCAT) variable is populated."
  Domains: "INTERVENTIONS, FINDINGS, EVENTS, FINDINGS ABOUT, TI"
  Severity: "Warning"
