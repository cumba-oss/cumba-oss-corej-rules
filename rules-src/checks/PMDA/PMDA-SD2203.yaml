Core:
  Id: "PMDA-SD2203"
  Status: "Published"
  Version: "1"
Description: "Raise a warning when the Trial Summary (TS) dataset does not contain\
  \ a record where TSPARMCD equals 'AGEMIN' (Planned Minimum Age of Subject)."
Severity: "Warning"
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "TS"
Bindings:
- name: "$agemin_count"
  expression: "record_count(filter=filter(TSPARMCD=\"AGEMIN\"))"
Check:
  expression: >-
    $agemin_count == 0
Outcome:
  Message: "Missing AGEMIN Trial Summary Parameter: a 'Planned Minimum Age of Subject'\
    \ (AGEMIN) record must be present in the Trial Summary (TS) domain."
  Output_Variables:
  - "$agemin_count"
Source:
  Message: "Missing AGEMIN Trial Summary Parameter"
  Description: "'Planned Minimum Age of Subject' (AGEMIN) record must be populated\
    \ in Trial Summary (TS) domain. It is expected for SDTM IG v3.1.2 data and required\
    \ for data in all more recent SDTM versions."
  Domains: "TS"
  Severity: "Warning"
