Core:
  Id: "PMDA-SD0075"
  Status: "Published"
  Version: "1"
Description: "Raise an error when Identifying Variable (IDVAR) is populated but does\
  \ not represent a variable present in the dataset referenced by RDOMAIN."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "CO"
    - "RELREC"
    - "SUPP--"
    - "SQ--"
Bindings:
- name: "$rdomain_variables"
  expression: "referenced_dataset_variables(RDOMAIN)"
- name: "$rdomain_variables_upper"
  expression: "upper($rdomain_variables)"
Check:
  expression: >-
    var_exists("RDOMAIN") and not empty(IDVAR) and IDVAR not in $rdomain_variables and IDVAR not in
    $rdomain_variables_upper
Outcome:
  Message: "IDVAR does not represent a variable present in the dataset referenced\
    \ by RDOMAIN."
  Output_Variables:
  - "RDOMAIN"
  - "IDVAR"
  - "$rdomain_variables"
  - "!$rdomain_variables_upper"
Source:
  Message: "Invalid IDVAR"
  Description: "Identifying Variable (IDVAR) must have a valid value of variables\
    \ from a referenced Domain."
  Domains: "CO, RELREC, SUPPQUAL"
  Severity: "Error"
