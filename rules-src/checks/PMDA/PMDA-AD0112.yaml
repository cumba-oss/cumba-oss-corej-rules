Core:
  Id: "PMDA-AD0112"
  Status: "Published"
  Version: "1"
Description: "Raise an error when, on a record, Analysis Relative Time (ARELTM, numeric,\
  \ missing when absent) is populated but Analysis Relative Time unit (ARELTMU, character,\
  \ empty when absent) is empty. If either variable is populated, both must be populated\
  \ together."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "BASIC DATA STRUCTURE"
    - "MEDICAL DEVICE BASIC DATA STRUCTURE"
Requirements:
  Variables:
    All:
    - "ARELTM"
    - "ARELTMU"
Check:
  expression: >-
    not empty(ARELTM) and empty(ARELTMU)
Outcome:
  Message: "ARELTM is populated but ARELTMU is empty."
  Output_Variables:
  - "ARELTM"
  - "ARELTMU"
Source:
  Message: "Only one of these variables is populated: ARELTM, ARELTMU"
  Description: "If ARELTMU (Analysis Relative Time unit) or ARELTM (Analysis Relative\
    \ Time) is populated, then both must be populated together."
  Domains: "BDS, ADNCA, MDBDS, ADAMOTHER"
  Severity: "Error"
Standards:
- Organization: "PMDA"
  Standards:
  - Name: "ADaMIG"
    Version: "1.3"
    References:
    - Origin: "PMDA Validation Rules"
      Rule_Identifier:
