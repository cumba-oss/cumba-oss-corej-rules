Core:
  Id: "PMDA-SD1117"
  Status: "Published"
  Version: "1"
Description: "Raise a warning when a Findings-class dataset has more than one record\
  \ for the same subject, test, and qualifier/timing key (duplicate Finding Result)."
Severity: "Warning"
Executability: "Fully Executable"
Scope:
  Classes:
    Include:
    - "FINDINGS"
    - "FINDINGS ABOUT"
  Domains:
    Exclude:
    - "DA"
    - "MB"
    - "MS"
    - "RS"
    - "TR"
    - "TU"
Bindings:
- name: "$natural_key"
  expression: "natural_key_variables()"
Check:
  expression: >-
    not is_unique_set([USUBJID, --TESTCD, $natural_key])
Outcome:
  Message: "Duplicate Finding Result: more than one record for the same subject, test\
    \ and qualifier/timing key."
Source:
  Message: "Duplicate records"
  Description: "The structure of Findings class domains should be one record per Finding\
    \ Result per subject. No Finding Result with the same Test Short Name (--TESTCD)\
    \ and the same Qualifier variables at the same timepoint for the same Subject\
    \ (USUBJID) are expected."
  Domains: "FINDINGS (-DA, -MB, -MS, -RS, -TR, -TU), FINDINGS ABOUT"
  Severity: "Warning"
