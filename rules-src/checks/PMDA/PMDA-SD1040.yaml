Core:
  Id: "PMDA-SD1040"
  Status: "Published"
  Version: "1"
Description: "Raise a warning when --SCAT is identical to DOMAIN, --TERM, --TESTCD,\
  \ --TRT, --DECOD, or --BODSYS."
Severity: "Warning"
Executability: "Fully Executable"
Scope:
  Classes:
    Include:
    - "EVENTS"
    - "INTERVENTIONS"
    - "FINDINGS"
    - "FINDINGS ABOUT"
Requirements:
  Variables:
    All:
    - "--SCAT"
Check:
  expression: >-
    not empty(--SCAT) and (var_exists("DOMAIN") and equalsIgnoreCase(--SCAT, DOMAIN) or
    equalsIgnoreCase(--SCAT, --TERM) or equalsIgnoreCase(--SCAT, --TESTCD) or
    equalsIgnoreCase(--SCAT, --TRT) or equalsIgnoreCase(--SCAT, --DECOD) or equalsIgnoreCase(--SCAT,
    --BODSYS))
Outcome:
  Message: "--SCAT value is redundant with other variable values."
  Output_Variables:
  - "DOMAIN"
  - "--TERM"
  - "--TESTCD"
  - "--TRT"
  - "--DECOD"
  - "--BODSYS"
Source:
  Message: "--SCAT value is redundant with other variable values"
  Description: "Value of Subcategory (--SCAT) should not be identical to that in Domain\
    \ Abbreviation (DOMAIN); Reported Term (--TERM); Name of Measurement, Test, or\
    \ Examination (--TESTCD); Name of Treatment (--TRT); Standardized Coded Term (--DECOD);\
    \ Body System or Organ Class (--BODSYS)."
  Domains: "INTERVENTIONS, FINDINGS, EVENTS, FINDINGS ABOUT, TI"
  Severity: "Warning"
