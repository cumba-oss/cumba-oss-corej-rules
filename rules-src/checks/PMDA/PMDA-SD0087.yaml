Core:
  Id: "PMDA-SD0087"
  Status: "Published"
  Version: "1"
Description: "Raise a warning when RFSTDTC is empty for a randomized subject, that\
  \ is a subject whose ARMCD is populated and is not equal to 'SCRNFAIL' or 'NOTASSGN'."
Severity: "Warning"
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "DM"
Requirements:
  Variables:
    All:
    - "ARMCD"
Check:
  expression: >-
    not empty(ARMCD) and upper(ARMCD) not in ["SCRNFAIL", "NOTASSGN"] and empty(RFSTDTC)
Outcome:
  Message: "RFSTDTC is empty for a randomized subject (ARMCD is populated and not\
    \ equal to 'SCRNFAIL' or 'NOTASSGN')."
  Output_Variables:
  - "RFSTDTC"
  - "ARMCD"
Source:
  Message: "RFSTDTC is not provided for a randomized subject"
  Description: "Subject Reference Start Date/Time (RFSTDTC) should be populated for\
    \ all randomized subjects, those where Planned Arm Code (ARMCD) is not equal to\
    \ 'SCRNFAIL' or 'NOTASSGN' or null."
  Domains: "DM"
  Severity: "Warning"
