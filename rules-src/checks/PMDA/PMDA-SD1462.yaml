Core:
  Id: "PMDA-SD1462"
  Status: "Published"
  Version: "1"
Description: "Raise a warning when a multi-axial dictionary such as MedDRA is used\
  \ and Body System or System Organ Class (--BODSYS) does not hold the same value\
  \ as the Primary System Organ Class (--SOC) used for analysis."
Severity: "Warning"
Executability: "Partially Executable - Possible Overreporting"
Scope:
  Domains:
    Include:
    - "AE"
    - "CE"
    - "MH"
Requirements:
  Variables:
    All:
    - "--BODSYS"
    - "--SOC"
Check:
  expression: >-
    --BODSYS != --SOC
Outcome:
  Message: "--BODSYS does not have the same value as --SOC (the Primary System Organ\
    \ Class used for analysis)."
Source:
  Message: "Not the same values for --SOC and --BODSYS"
  Description: "When using a multi-axial dictionary such as MedDRA, Body System or\
    \ System Organ Class (--BODSYS) variable value should be populated as Primary\
    \ System Organ Class Code (--SOC) used for analysis."
  Domains: "AE, CE, MH"
  Severity: "Warning"
Standards:
- Organization: "PMDA"
  Standards:
  - Name: "SDTMIG"
    Version: "3.4"
    References:
    - Origin: "PMDA Validation Rules"
      Rule_Identifier:
        Id: "SD1462"
        Version: "1"
      Version: "6.0"
