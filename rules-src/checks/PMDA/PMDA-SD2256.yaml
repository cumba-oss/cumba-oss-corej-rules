Core:
  Id: "PMDA-SD2256"
  Status: "Published"
  Version: "1"
Description: "Raise a warning when TSVCDREF is not equal to 'UNII' for a record where\
  \ TSPARMCD equals 'COMPTRT' (Comparative Treatment)."
Severity: "Warning"
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "TS"
Requirements:
  Variables:
    All:
    - "TSPARMCD"
    - "TSVCDREF"
Check:
  expression: >-
    TSPARMCD == "COMPTRT" and TSVCDREF != "UNII"
Outcome:
  Message: "Invalid TSVCDREF value for COMPTRT: TSVCDREF must equal 'UNII' when TSPARMCD\
    \ equals 'COMPTRT'."
Source:
  Message: "Invalid TSVCDREF value for COMPTRT"
  Description: "TSVCDREF variable value must be 'UNII' when TSPARMCD='COMPTRT'."
  Domains: "TS"
  Severity: "Warning"
