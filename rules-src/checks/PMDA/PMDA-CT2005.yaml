Core:
  Id: "PMDA-CT2005"
  Status: "Published"
  Version: "1"
Description: "Raise a warning when a populated value is not a term in the extensible\
  \ codelist bound at the value level (Define-XML ValueListDef / WhereClauseDef) for\
  \ the value-level condition that applies to the record."
Severity: "Warning"
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "ALL"
Check:
  expression: >-
    not empty(value()) and vlm_codelist_extensible(variable_name) == true and
    vlm_has_codelist(variable_name) == true and value() not in
    vlm_codelist_coded_values(variable_name)
Outcome:
  Message: "The value is not in the extensible value-level codelist declared in the\
    \ Define-XML."
Source:
  Message: "Variable value not found in extensible codelist when value-level condition\
    \ occurs"
  Description: "Variable should be populated with terms from its CDISC controlled\
    \ terminology codelist when its value level condition is met. New terms can be\
    \ added as long as they are not duplicates, synonyms or subsets of existing standard\
    \ terms."
  Domains: "ALL"
  Severity: "Warning"
