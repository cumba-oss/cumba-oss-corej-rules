Core:
  Id: "PMDA-SD1314"
  Status: "Published"
  Version: "1"
Description: "Raise a warning when Reported Term for the Disposition Event (DSTERM)\
  \ is 'COMPLETED' but Standardized Disposition Term (DSDECOD) is not 'COMPLETED'."
Severity: "Warning"
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "DS"
Requirements:
  Variables:
    All:
    - "DSTERM"
    - "DSDECOD"
Check:
  expression: >-
    DSTERM == "COMPLETED" and DSDECOD != "COMPLETED"
Outcome:
  Message: "DSDECOD is not equal to 'COMPLETED' when DSTERM equals 'COMPLETED'."
Source:
  Message: "DSDECOD is not 'COMPLETED' when DSTERM='COMPLETED'"
  Description: "When Reported Term for the Disposition Event (DSTERM) is 'COMPLETED',\
    \ Standardized Disposition Term (DSDECOD) should have the same value 'COMPLETED'."
  Domains: "DS"
  Severity: "Warning"
