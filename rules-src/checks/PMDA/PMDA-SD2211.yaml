Core:
  Id: "PMDA-SD2211"
  Status: "Published"
  Version: "1"
Description: "Raise a warning when the study population is unhealthy subjects (the\
  \ Trial Summary (TS) dataset contains a record where TSPARMCD equals 'HLTSUBJI'\
  \ and TSVAL equals 'N') but the TS dataset does not contain a record where TSPARMCD\
  \ equals 'TDIGRP' (Diagnosis Group)."
Severity: "Warning"
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "TS"
Bindings:
- name: "$hltsubji_n_count"
  expression: "record_count(filter=filter(TSPARMCD=\"HLTSUBJI\", TSVAL=\"N\"))"
- name: "$tdigrp_count"
  expression: "record_count(filter=filter(TSPARMCD=\"TDIGRP\"))"
Check:
  expression: >-
    $hltsubji_n_count > 0 and $tdigrp_count == 0
Outcome:
  Message: "Missing TDIGRP Trial Summary Parameter: a 'Diagnosis Group' (TDIGRP) record\
    \ must be populated in the Trial Summary (TS) domain when the study population\
    \ is unhealthy subjects (HLTSUBJI equals 'N')."
  Output_Variables:
  - "$hltsubji_n_count"
  - "$tdigrp_count"
Source:
  Message: "Missing TDIGRP Trial Summary Parameter"
  Description: "'Diagnosis Group' (TDIGRP) record must be populated in Trial Summary\
    \ (TS) domain when study population is unhealthy subjects (HLTSUBJI = 'N'). It\
    \ is expected for SDTM IG v3.1.2 data and required for data in all more recent\
    \ SDTM versions."
  Domains: "TS"
  Severity: "Warning"
