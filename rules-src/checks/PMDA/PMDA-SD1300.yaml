Core:
  Id: "PMDA-SD1300"
  Status: "Published"
  Version: "1"
Description: "Raise an error when the DOMAIN value length is not equal to 2 characters."
Executability: "Fully Executable"
Scope:
  Domains:
    Exclude:
    - "AP--"
    - "APRELSUB"
    - "POOLDEF"
    - "RELREC"
    - "RELSPEC"
    - "RELSUB"
    - "SQ--"
    - "SUPP--"
    - "SUPPQUAL"
Requirements:
  Variables:
    All:
    - "DOMAIN"
Check:
  expression: >-
    len(ds_domain()) > 2 or len(ds_domain()) < 2
Outcome:
  Message: "DOMAIN value length is not equal to 2."
Source:
  Message: "Invalid value (not 2 chars) for DOMAIN variable"
  Description: "The value of DOMAIN should be no more than 2 characters in length,\
    \ excluding Associated Persons domains."
  Domains: "ALL (-POOLDEF, -RELREC, -RELSPEC, -RELSUB, -SUPPQUAL)"
  Severity: "Error"
