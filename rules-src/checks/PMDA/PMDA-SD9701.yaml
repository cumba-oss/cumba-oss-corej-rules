Core:
  Id: "PMDA-SD9701"
  Status: "Published"
  Version: "1"
Description: "Raise an error when --OBJ is not populated."
Severity: "Reject"
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "FA"
    - "SR"
Requirements:
  Variables:
    All:
    - "--OBJ"
Check:
  expression: >-
    empty(--OBJ)
Outcome:
  Message: "--OBJ is empty."
Source_Proposed:
  Message: "Missing value for --OBJ"
  Description: "--OBJ should be populated."
  Domains: "FA, SR"
  Severity: "Reject"
Source:
  Message: "Null value in variable marked as Required"
  Description: "Required variables (where Core attribute is 'Req') cannot be null\
    \ for any records."
  Domains: "ALL"
  Severity: "Reject"
