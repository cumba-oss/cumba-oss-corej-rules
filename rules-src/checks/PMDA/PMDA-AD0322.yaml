Core:
  Id: "PMDA-AD0322"
  Status: "Published"
  Version: "1"
Description: "Raise an error when, within a study, the Planned Pooled Treatment y\
  \ (TRTPGy) variable does not hold a single consistent value for each unique populated\
  \ value of the Planned Treatment (TRTP) variable. TRTPGy is a derived pooled-treatment\
  \ grouping variable (name ends in TRTPG followed by y, y = 1-9). Within a given\
  \ value of TRTP there can be only one unique value of TRTPGy; only rows on which\
  \ both variables are populated are considered."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "ALL"
Check:
  expression: >-
    not empty(TRTP) and not empty(TRTPGy) and is_inconsistent_across_dataset(TRTPGy, keys=[TRTP])
Outcome:
  Message: "Inconsistent value for TRTPGy within a given TRTP."
wildcards:
  "y":
    min: 1
    max: 99
Source:
  Message: "Inconsistent value for TRTPGy within a given TRTP"
  Description: "Within a given value of Planned Treatment (TRTP) variable, there can\
    \ only be one unique value of Planned Pooled Treatment y (TRTPGy) variable."
  Domains: "BDS, ADNCA, MDBDS, ADAMOTHER"
  Severity: "Error"
Standards:
- Organization: "PMDA"
  Standards:
  - Name: "ADaMIG"
    Version: "1.3"
    References:
    - Origin: "PMDA Validation Rules"
      Rule_Identifier:
        Id: "AD0322"
        Version: "1"
