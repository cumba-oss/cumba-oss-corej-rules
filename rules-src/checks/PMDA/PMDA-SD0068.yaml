Core:
  Id: "PMDA-SD0068"
  Status: "Published"
  Version: "1"
Description: "Raise an error when an Inclusion/Exclusion Criterion Short Name (IETESTCD)\
  \ value is not present among the IETESTCD values in the Trial Inclusion/Exclusion\
  \ Criteria (TI) dataset."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "IE"
Operations:
- id: "$ti_ietestcd"
  expression: "distinct(IETESTCD, domain=\"TI\")"
Check:
  expression: >-
    IETESTCD not in $ti_ietestcd
Outcome:
  Message: "IETESTCD value is not present in the TI dataset."
  Output_Variables:
  - "IETESTCD"
  - "$ti_ietestcd"
Source:
  Message: "IETESTCD value doesn't exist in TI domain"
  Description: "A value for Inclusion/Exclusion Criterion Short Name (IETESTCD) must\
    \ be present the Trial Inclusion/Exclusion Criteria (TI) domain."
  Domains: "IE"
  Severity: "Error"
