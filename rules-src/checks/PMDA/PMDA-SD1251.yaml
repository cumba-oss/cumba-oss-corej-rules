Core:
  Id: "PMDA-SD1251"
  Status: "Published"
  Version: "1"
Description: "Raise a warning when Treatment Vehicle (--TRTV) is empty but Treatment\
  \ Vehicle Amount Units (--VAMTU) is populated."
Severity: "Warning"
Executability: "Fully Executable"
Scope:
  Classes:
    Include:
    - "INTERVENTIONS"
Requirements:
  Variables:
    All:
    - "--TRTV"
    - "--VAMTU"
Check:
  expression: >-
    empty(--TRTV) and not empty(--VAMTU)
Outcome:
  Message: "--VAMTU is populated when --TRTV is empty."
Source:
  Message: "--VAMTU value is populatd when --TRTV is null"
  Description: "Treatment Vehicle Amount Units (--VAMTU) value must be null when Treatment\
    \ Vehicle Amount (--TRTV) value is null."
  Domains: "INTERVENTIONS"
  Severity: "Warning"
