Core:
  Id: "PMDA-SD0052"
  Status: "Published"
  Version: "1"
Description: "Raise a warning when VISITNUM does not have the same value across all\
  \ records that share the same value of VISIT."
Severity: "Warning"
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "ALL"
Requirements:
  Variables:
    All:
    - "VISITNUM"
Check:
  expression: >-
    var_exists("VISIT") and is_inconsistent_across_dataset(VISITNUM, keys=[VISIT])
Outcome:
  Message: "VISITNUM is not the same value across records with the same value of VISIT."
Source:
  Message: "Inconsistent value for VISITNUM within VISIT"
  Description: "All values of Visit Number (VISITNUM) should be the same for a given\
    \ value of Visit Name (VISIT)."
  Domains: "SPECIAL PURPOSE, INTERVENTIONS, FINDINGS, EVENTS, FINDINGS ABOUT, TV"
  Severity: "Warning"
