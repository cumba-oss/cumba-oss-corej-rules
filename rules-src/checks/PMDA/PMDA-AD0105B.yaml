Core:
  Id: "PMDA-AD0105B"
  Status: "Published"
  Version: "1"
Description: "Raise an error when, within a study, the Period (C) (APERIODC) variable\
  \ does not hold a single consistent value for each unique value of the Analysis\
  \ Period (APERIOD) variable, evaluated over the records where the primary variable\
  \ APERIOD is populated."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "ALL"
Requirements:
  Variables:
    All:
    - "APERIODC"
Check:
  expression: >-
    var_exists("APERIOD") and not empty(APERIOD) and is_inconsistent_across_dataset(APERIODC,
    keys=[APERIOD])
Outcome:
  Message: "Inconsistent value for APERIODC"
Source:
  Message: "Inconsistent value for APERIODC"
  Description: "Within a study, all APERIODC values must be the same for each unique\
    \ value of APERIOD when the primary variable APERIOD is populated."
  Domains: "BDS, ADNCA, MDBDS, OCCDS, ADAE, MDOCCDS, ADAMOTHER"
  Severity: "Error"
Standards:
- Organization: "PMDA"
  Standards:
  - Name: "ADaMIG"
    Version: "1.3"
    References:
    - Origin: "PMDA Validation Rules"
      Rule_Identifier:
        Id: "AD0105B"
        Version: "1"
      Version: "6.0"
  - Name: "ADaMIG"
    Version: "1.2"
    References:
    - Origin: "PMDA Validation Rules"
      Rule_Identifier:
        Id: "AD0105B"
        Version: "1"
      Version: "6.0"
  - Name: "ADaMIG"
    Version: "1.1"
