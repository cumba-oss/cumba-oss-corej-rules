Core:
  Id: "PMDA-SD0028"
  Status: "Published"
  Version: "1"
Description: "Raise an error when the Reference Range Upper Limit-Std Units (--STNRHI)\
  \ is less than the Reference Range Lower Limit-Std Units (--STNRLO)."
Executability: "Fully Executable"
Scope:
  Classes:
    Include:
    - "FINDINGS"
    - "FINDINGS ABOUT"
Requirements:
  Variables:
    All:
    - "--STNRHI"
    - "--STNRLO"
Check:
  expression: >-
    not empty(--STNRHI) and not empty(--STNRLO) and --STNRHI < --STNRLO
Outcome:
  Message: "Value for --STNRHI is less than value for --STNRLO"
  Output_Variables:
  - "--TESTCD"
Source:
  Message: "Value for --STNRHI is less than value for --STNRLO"
  Description: "Reference Range Upper Limit-Std Units (--STNRHI) value must be greater\
    \ than or equal to Reference Range Lower Limit-Std Units (--STNRLO) value."
  Domains: "FINDINGS, FINDINGS ABOUT"
  Severity: "Error"
