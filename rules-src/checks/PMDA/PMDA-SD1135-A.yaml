Core:
  Id: "PMDA-SD1135-A"
  Status: "Published"
  Version: "1"
Description: "Raise a warning when the Study Day variable --ENDY has a negative value\
  \ in the EC or EX dataset."
Severity: "Warning"
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "EC"
    - "EX"
Requirements:
  Variables:
    All:
    - "--ENDY"
Check:
  expression: >-
    not empty(--ENDY) and --ENDY < 0
Outcome:
  Message: "Negative value for Study Day variable --ENDY."
Source_Proposed:
  Sheet_Issue: "#242"
  Message: "Negative value of End Study Day variable"
  Description: "Study Day variable (--ENDY) value should not be negative in Exposure\
    \ (EX) and Exposure As Collected (EC) datasets."
  Domains: "EC, EX"
  Severity: "Warning"
Source:
  Message: "Negative value of Study Day variable"
  Description: "Study Day variables (*DY) value should not be negative in Exposure\
    \ (EX) and Exposure As Collected (EC) datasets."
  Domains: "EC, EX"
  Severity: "Warning"
