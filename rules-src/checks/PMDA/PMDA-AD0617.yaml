Core:
  Id: "PMDA-AD0617"
  Status: "Published"
  Version: "1"
Description: "Raise an error when the Treatment Compliance (%) Group y (N) (TRCMPGyN)\
  \ variable does not have a single value for a given value of its corresponding Treatment\
  \ Compliance (%) Group y (TRCMPGy) variable, evaluated over the records where both\
  \ variables are populated."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "SUBJECT LEVEL ANALYSIS DATASET"
    - "DEVICE LEVEL ANALYSIS DATASET"
Requirements:
  Variables:
    All:
    - "TRCMPGyN"
Check:
  expression: >-
    var_exists("TRCMPGy") and not empty(TRCMPGy) and not empty(TRCMPGyN) and
    is_inconsistent_across_dataset(TRCMPGyN, keys=[TRCMPGy])
Outcome:
  Message: "Inconsistent value for TRCMPGyN"
  Output_Variables:
  - "TRCMPGy"
  - "TRCMPGyN"
wildcards:
  "y":
    min: 1
    max: 99
Source:
  Message: "Inconsistent value for TRCMPGyN"
  Description: "There should be only a single value of Treatment Compliance (%) Group\
    \ y (N) (TRCMPGyN) variable for a given value of Treatment Compliance (%) Group\
    \ y (TRCMPGy) variable, considering only those rows on which both variables are\
    \ populated."
  Domains: "ADSL, ADDL"
  Severity: "Error"
Standards:
- Organization: "PMDA"
  Standards:
  - Name: "ADaMIG"
    Version: "1.3"
    References:
    - Origin: "PMDA Validation Rules"
      Rule_Identifier:
        Id: "AD0617"
        Version: "1"
      Version: "6.0"
  - Name: "ADaMIG"
    Version: "1.2"
    References:
    - Origin: "PMDA Validation Rules"
      Rule_Identifier:
        Id: "AD0617"
        Version: "1"
      Version: "6.0"
  - Name: "ADaMIG"
    Version: "1.1"
    References:
    - Origin: "PMDA Validation Rules"
      Rule_Identifier:
        Id: "AD0617"
        Version: "1"
      Version: "6.0"
