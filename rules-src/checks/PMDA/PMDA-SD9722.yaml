Core:
  Id: "PMDA-SD9722"
  Status: "Published"
  Version: "1"
Description: "Raise a warning when Dose Description (ECDOSTXT) is not present in the\
  \ dataset although a record has ECDOSE missing, ECOCCUR not equal to 'N' and ECSTAT\
  \ not equal to 'NOT DONE'."
Sensitivity: "Dataset"
Executability: "Partially Executable - Possible Overreporting"
Scope:
  Domains:
    Include:
    - "EC"
Requirements:
  Variables:
    None:
    - "ECDOSTXT"
    All:
    - "ECDOSE"
Check:
  expression: >-
    empty(ECDOSE) and (not var_exists("ECOCCUR") or ECOCCUR != "N") and ECSTAT != "NOT DONE"
Outcome:
  Message: "ECDOSTXT is not present in the dataset although ECDOSE is missing, ECOCCUR\
    \ does not equal 'N' and ECSTAT does not equal 'NOT DONE'."
Source_Proposed:
  Sheet_Issue: "#190"
  Message: "Dose Description (ECDOSTXT) is not present in the dataset when ECDOSE\
    \ is null and ECOCCUR does not equal 'N'"
  Description: "The Dose Description (ECDOSTXT) variable must be present in the dataset\
    \ when Dose (ECDOSE) is null, ECOCCUR does not equal 'N', and ECSTAT does not\
    \ equal 'NOT DONE'."
  Domains: "EC"
  Severity: "Warning"
Standards:
- Organization: "PMDA"
  Standards:
  - Name: "SDTMIG"
    Version: "3.2"
  - Name: "SDTMIG"
    Version: "3.3"
  - Name: "SDTMIG"
    Version: "3.4"
