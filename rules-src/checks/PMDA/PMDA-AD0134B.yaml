Core:
  Id: "PMDA-AD0134B"
  Status: "Published"
  Version: "1"
Description: "Raise an error when Ratio to Analysis Range y Upper Limit (R2AyHI) is\
  \ populated but the values required to derive it - Analysis Value (AVAL) and Analysis\
  \ Range y Upper Limit (AyHI) - are not both present and populated. R2AyHI equals\
  \ AVAL divided by AyHI."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "BASIC DATA STRUCTURE"
    - "MEDICAL DEVICE BASIC DATA STRUCTURE"
Check:
  expression: >-
    not empty(R2AyHI) and (empty(AVAL) or empty(AyHI))
Outcome:
  Message: "R2AyHI is populated, but AVAL and/or AyHI are not populated."
  Message_Folded: "AVAL absent or not populated in any record of the dataset, or AyHI\
    \ not populated in any record of the dataset, and at least one record meets the\
    \ rest of the condition: R2AyHI is populated, but AVAL and/or AyHI are not populated."
  Output_Variables:
  - "AVAL"
  - "R2AyHI"
  - "AyHI"
wildcards:
  "y":
    min: 1
    max: 99
Source:
  Message: "Calculation issue: R2AyHI is populated, but AVAL and/or AyHI are not populated"
  Description: "If R2AyHI is populated, the values necessary for its calculation must\
    \ both be present and populated. R2AyHI = AVAL / AyHI. Once this issue is resolved,\
    \ there is greater potential for AD0134 to fire."
  Domains: "BDS, ADNCA, MDBDS"
  Severity: "Error"
