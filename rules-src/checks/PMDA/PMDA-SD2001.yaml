Core:
  Id: "PMDA-SD2001"
  Status: "Published"
  Version: "1"
Description: "Raise an error when the value of Actual Arm Code (ACTARMCD) is more\
  \ than 20 characters in length."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "DM"
Check:
  expression: >-
    len(ACTARMCD) > 20
Outcome:
  Message: "ACTARMCD has a length greater than 20 characters."
Source:
  Message: "Invalid value for ACTARMCD exceeding 20 characters"
  Description: "The value of Actual Arm Code (ACTARMCD) should be no more than 20\
    \ characters in length."
  Domains: "DM"
  Severity: "Error"
