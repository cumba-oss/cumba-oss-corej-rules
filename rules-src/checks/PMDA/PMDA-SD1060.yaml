Core:
  Id: "PMDA-SD1060"
  Status: "Published"
  Version: "1"
Description: "Raise a warning when the value of Visit Number (VISITNUM) is not unique\
  \ for a record within a subject."
Severity: "Warning"
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "SV"
Bindings: null
Check:
  expression: >-
    not is_unique_set([VISITNUM, USUBJID])
Outcome:
  Message: "VISITNUM is not unique within subject."
  Output_Variables:
  - "VISITNUM"
Source:
  Message: "Duplicate VISITNUM"
  Description: "The value of Visit Number (VISITNUM) variable should be unique for\
    \ each record within a subject."
  Domains: "SV"
  Severity: "Warning"
