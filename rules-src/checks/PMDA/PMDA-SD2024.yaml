Core:
  Id: "PMDA-SD2024"
  Status: "Published"
  Version: "1"
Description: "Raise an error when both the Unique Subject Identifier (USUBJID) and\
  \ the Pool Identifier (POOLID) variables are populated on the same record."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "ALL"
Requirements:
  Variables:
    All:
    - "POOLID"
Check:
  expression: >-
    not empty(USUBJID) and not empty(POOLID)
Outcome:
  Message: "Redundant values for USUBJID and POOLID"
Source:
  Message: "Redundant values for USUBJID and POOLID"
  Description: "Only one of the Unique Subject Identifier (USUBJID) or Pool Identifier\
    \ (POOLID) variables values may be populated, not both."
  Domains: "SPECIAL PURPOSE (-DM, -SE, -SM), INTERVENTIONS, FINDINGS, EVENTS, FINDINGS\
    \ ABOUT, RELATIONSHIP (-DR, -POOLDEF, -RELREC)"
  Severity: "Error"
