Core:
  Id: "PMDA-SD0086-A"
  Status: "Published"
  Version: "1"
Description: "Raise an error when the combination of STUDYID, USUBJID, IDVAR, IDVARVAL,\
  \ and QNAM is not unique for a SUPPQUAL parent record not related to DM (RDOMAIN\
  \ is not 'DM'; QNAM must be unique for each parent record)."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "SUPP--"
    - "SQ--"
Requirements:
  Variables:
    All:
    - "RDOMAIN"
Check:
  expression: >-
    RDOMAIN != "DM" and not is_unique_set([USUBJID, RDOMAIN, IDVAR, IDVARVAL, QNAM])
Outcome:
  Message: "Duplicate SUPPQUAL records found for the same non-DM parent record and\
    \ QNAM."
  Output_Variables:
  - "RDOMAIN"
  - "IDVAR"
  - "IDVARVAL"
  - "QNAM"
Source_Proposed:
  Sheet_Issue: "#251"
  Message: "SUPPQUAL duplicate records for a non-DM parent record"
  Description: "All SUPPQUAL Domains records not related to DM (RDOMAIN is not 'DM')\
    \ are associated with a single parent record and must have a unique combination\
    \ of Study Identifier (STUDYID), Unique Subject Identifier (USUBJID), Identifying\
    \ Variable (IDVAR), Identifying Variable Value (IDVARVAL) and Qualifier Variable\
    \ Name (QNAM) variable value. The QNAM variable should be unique for each parent\
    \ record."
  Domains: "SUPPQUAL"
  Severity: "Error"
Source:
  Message: "SUPPQUAL duplicate records"
  Description: "All SUPPQUAL Domains records are associated with a single parent record\
    \ and must have a unique combination of Study Identifier (STUDYID), Unique Subject\
    \ Identifier (USUBJID), Identifying Variable (IDVAR), Identifying Variable Value\
    \ (IDVARVAL) and Qualifier Variable Name (QNAM) variable value. For all SUPPQUAL\
    \ domain record all The QNAM variable should be unique for each parent record."
  Domains: "SUPPQUAL"
  Severity: "Error"
