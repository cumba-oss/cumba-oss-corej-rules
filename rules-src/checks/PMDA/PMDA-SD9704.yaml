Core:
  Id: "PMDA-SD9704"
  Status: "Published"
  Version: "1"
Description: "Raise an error when --SPEC is not populated."
Severity: "Reject"
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "MI"
Requirements:
  Variables:
    All:
    - "--SPEC"
Check:
  expression: >-
    empty(--SPEC)
Outcome:
  Message: "--SPEC is empty."
  Output_Variables:
  - "--SPEC"
Source_Proposed:
  Message: "Missing value for --SPEC"
  Description: "--SPEC should be populated."
  Domains: "MI"
  Severity: "Reject"
Source:
  Message: "Null value in variable marked as Required"
  Description: "Required variables (where Core attribute is 'Req') cannot be null\
    \ for any records."
  Domains: "ALL"
  Severity: "Reject"
