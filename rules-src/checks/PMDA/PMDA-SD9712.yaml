Core:
  Id: "PMDA-SD9712"
  Status: "Published"
  Version: "1"
Description: "Raise an error when VISIT is not populated."
Severity: "Reject"
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "TV"
Requirements:
  Variables:
    All:
    - "VISIT"
Check:
  expression: >-
    empty(VISIT)
Outcome:
  Message: "VISIT is empty."
Source_Proposed:
  Message: "Missing value for VISIT"
  Description: "VISIT should be populated."
  Domains: "TV"
  Severity: "Reject"
Source:
  Message: "Null value in variable marked as Required"
  Description: "Required variables (where Core attribute is 'Req') cannot be null\
    \ for any records."
  Domains: "ALL"
  Severity: "Reject"
