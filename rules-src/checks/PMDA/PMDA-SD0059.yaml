Core:
  Id: "PMDA-SD0059"
  Status: "Published"
  Version: "1"
Description: "Raise a warning when the variable data type in the submitted dataset\
  \ does not match the variable data type declared in the Define-XML."
Severity: "Warning"
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "ALL"
Check:
  expression: >-
    not empty(var_name("DEFINE")) and var_type("DATA") != var_type("DEFINE")
Outcome:
  Message: "The variable data type in the dataset does not match the variable data\
    \ type in the Define-XML."
  Output_Variables:
  - "define_variable_name"
  - "variable_data_type"
  - "define_variable_data_type"
Source:
  Message: "Define.xml/dataset variable type mismatch"
  Description: "Variable DataType in define.xml must match variable Type in dataset.\
    \ Define-XML data types of 'integer' and 'float' match dataset type of 'Num',\
    \ all other match 'Char'."
  Domains: "ALL"
  Severity: "Warning"
