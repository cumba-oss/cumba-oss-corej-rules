Core:
  Id: "PMDA-SD1022"
  Status: "Published"
  Version: "1"
Description: "Raise an error when QNAM is longer than 8 characters, starts with a\
  \ number, or contains characters other than uppercase letters, numbers, and underscores."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "SUPP--"
    - "SQ--"
Check:
  expression: >-
    not empty(QNAM) and not is_valid_name(QNAM)
Outcome:
  Message: "QNAM is longer than 8 characters, starts with a number, or contains characters\
    \ other than uppercase letters, numbers, and underscores."
  Output_Variables:
  - "IDVAR"
  - "IDVARVAL"
Source:
  Message: "Invalid value for QNAM variable"
  Description: "The value of Qualifier Variable Name (QNAM) should be limited to 8\
    \ characters, cannot start with a number, and cannot contain characters other\
    \ than letters in upper case, numbers, or underscores."
  Domains: "SUPPQUAL"
  Severity: "Error"
