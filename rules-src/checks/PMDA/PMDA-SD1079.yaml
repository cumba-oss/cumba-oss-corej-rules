Core:
  Id: "PMDA-SD1079"
  Status: "Published"
  Version: "1"
Description: "Raise a warning when the order of variables does not reflect the order\
  \ of the variables in the SDTM Model for the observation class."
Severity: "Warning"
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "ALL"
Operations:
- id: "$model_column_order"
  expression: "get_model_column_order()"
- id: "$column_order_from_dataset"
  expression: "get_column_order_from_dataset()"
Check:
  expression: >-
    not empty($model_column_order) and not is_ordered_subset_of($column_order_from_dataset,
    $model_column_order)
Outcome:
  Message: "Variables are not in the correct order as shown in the SDTM Model for\
    \ the observation class."
  Output_Variables:
  - "$column_order_from_dataset"
  - "$model_column_order"
Source:
  Message: "Variable is in wrong order within domain"
  Description: "The order of variables should reflect the order of the variables in\
    \ the SDTM Model. Variables for the three general observation classes must be\
    \ ordered with Identifiers first, followed by the Topic, Qualifier, and Timing\
    \ variables. Within each role, variables must be ordered as shown in SDTM: Tables\
    \ 2.2.1, 2.2.2, 2.2.3, 2.2.4, and 2.2.5."
  Domains: "ALL"
  Severity: "Warning"
