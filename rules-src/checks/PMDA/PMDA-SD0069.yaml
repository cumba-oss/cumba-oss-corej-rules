Core:
  Id: "PMDA-SD0069"
  Status: "Published"
  Version: "1"
Description: "Raise a warning when a Demographics (DM) subject (USUBJID) has no record\
  \ in the Disposition (DS) dataset, excluding subjects who failed screening (ARMCD\
  \ equals 'SCRNFAIL'), were not assigned to an Arm (ARMCD equals 'NOTASSGN'), or\
  \ whose ARMCD is empty."
Severity: "Warning"
Executability: "Partially Executable - Possible Overreporting"
Scope:
  Domains:
    Include:
    - "DM"
Requirements:
  Variables:
    All:
    - "ARMCD"
Bindings:
- name: "$ds_usubjid"
  expression: "distinct(USUBJID, domain=\"DS\")"
Check:
  expression: >-
    not empty(ARMCD) and upper(ARMCD) not in ["SCRNFAIL", "NOTASSGN"] and USUBJID not in $ds_usubjid
Outcome:
  Message: "No Disposition (DS) record found for the subject."
  Output_Variables:
  - "$ds_usubjid"
Source:
  Message: "No Disposition record found for subject"
  Description: "All Demographics (DM) subjects (USUBJID) should have at least one\
    \ record in the Disposition (DS) domain. The only possible exceptions for SDTMIG\
    \ v3.2 (and earlier) are Screen Failures (ARMCD=SCRNFAIL) and Not Assigned Treatment\
    \ (ARMCD=NOTASSGN) subjects, or subjects with ARMCD=null. If the study is ongoing,\
    \ Parameter Value (TSVAL) for the 'ONGOSIND/Ongoing Study Indicator' parameter\
    \ should be set to 'Y' in the Trial Summary (TS) domain."
  Domains: "DM"
  Severity: "Warning"
Standards:
