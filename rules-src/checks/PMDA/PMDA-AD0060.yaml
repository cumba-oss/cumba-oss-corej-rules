Core:
  Id: "PMDA-AD0060"
  Status: "Published"
  Version: "1"
Description: "Raise an error when a datetime variable whose name ends in 'DTM' is\
  \ not stored as a numeric variable; the SAS data type of a *DTM variable must be\
  \ Num."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "SUBJECT LEVEL ANALYSIS DATASET"
    - "BASIC DATA STRUCTURE"
    - "OCCURRENCE DATA STRUCTURE"
    - "DEVICE LEVEL ANALYSIS DATASET"
    - "MEDICAL DEVICE BASIC DATA STRUCTURE"
    - "MEDICAL DEVICE OCCURRENCE DATA STRUCTURE"
Check:
  expression: >-
    ends_with(upper(varname()), "DTM") and var_type() != "Num"
Outcome:
  Message: "A *DTM datetime variable is not a numeric variable."
Source:
  Message: "*DTM is not a numeric variable"
  Description: "The SAS TYPE for *DTM variable must be equal Num."
  Domains: "ADSL, ADDL, BDS, ADNCA, MDBDS, OCCDS, ADAE, MDOCCDS, ADAMOTHER"
  Severity: "Error"
Standards:
- Organization: "PMDA"
  Standards:
  - Name: "ADaMIG"
    Version: "1.3"
    References:
    - Origin: "PMDA Validation Rules"
      Rule_Identifier:
