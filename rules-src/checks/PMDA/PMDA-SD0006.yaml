Core:
  Id: "PMDA-SD0006"
  Status: "Published"
  Version: "1"
Description: "Raise a warning when a subject has no baseline observation (a record\
  \ with --BLFL equal to 'Y') in the domain, except for subjects who failed screening\
  \ (ARMCD equal to 'SCRNFAIL'), were not assigned to an Arm (ARMCD equal to 'NOTASSGN'),\
  \ or were not treated (ACTARMCD equal to 'NOTTRT')."
Severity: "Warning"
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "EG"
    - "LB"
    - "MB"
    - "MS"
    - "PC"
    - "VS"
Requirements:
  Variables:
    All:
    - "--BLFL"
Match_Datasets:
- Keys:
  - "USUBJID"
  Name: "DM"
Grouping:
  Variables:
  - "USUBJID"
Bindings:
- name: "$blfl"
  expression: "distinct(--BLFL, group=[USUBJID])"
Check:
  expression: >-
    upper(DM.ARMCD) not in ["SCRNFAIL", "NOTASSGN"] and upper(DM.ACTARMCD) != "NOTTRT" and not
    contains($blfl, "Y")
Outcome:
  Message: "No baseline flag record (--BLFL equal to \"Y\") is present in the domain\
    \ for the subject."
  Output_Variables:
  - "$blfl"
  - "DM.ARMCD"
  - "DM.ACTARMCD"
Source:
  Message: "No baseline flag record in Domain for subject"
  Description: "All subjects should have at least one baseline observation (--BLFL\
    \ = 'Y') in EG, LB, MB, MS, PC and VS domains, except for subjects who failed\
    \ screening (ARMCD = 'SCRNFAIL') or were not fully assigned to an Arm (ARMCD =\
    \ 'NOTASSGN') or were not treated (ACTARMCD = 'NOTTRT')."
  Domains: "EG, LB, MB, MS, PC, VS"
  Severity: "Warning"
