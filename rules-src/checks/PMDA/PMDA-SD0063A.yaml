Core:
  Id: "PMDA-SD0063A"
  Status: "Published"
  Version: "1"
Description: "Raise a warning when the label of a standard variable does not match\
  \ the variable label specified for that variable in the SDTM Implementation Guide."
Severity: "Warning"
Executability: "Fully Executable"
Scope:
  Domains:
    Exclude:
    - "APAE"
    - "APDM"
    - "APMH"
    - "APRELSUB"
    - "RELSUB"
Check:
  expression: >-
    varname() == var_name("LIBRARY") and not empty(var_label("LIBRARY")) and var_label("DATA") !=
    var_label("LIBRARY")
Outcome:
  Message: "The variable label does not match the variable label specified in the\
    \ SDTMIG."
  Output_Variables:
  - "variable_name"
  - "library_variable_label"
  - "variable_label"
Source:
  Message: "SDTM/dataset variable label mismatch"
  Description: "Variable Label in the dataset should match the variable label described\
    \ in SDTM IG. When creating a new domain Variable Labels could be adjusted as\
    \ appropriate to properly convey the meaning in the context of the data being\
    \ submitted."
  Domains: "ALL (-APAE, -APMH, -APRELSUB, -RELSUB, -APDM)"
  Severity: "Warning"
