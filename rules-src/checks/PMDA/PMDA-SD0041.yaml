Core:
  Id: "PMDA-SD0041"
  Status: "Published"
  Version: "1"
Description: "Raise a warning when --OCCUR is populated for an unsolicited record,\
  \ that is a record where --PRESP is not present or is not equal to 'Y'."
Severity: "Warning"
Executability: "Fully Executable"
Scope:
  Classes:
    Include:
    - "INTERVENTIONS"
    - "EVENTS"
  Domains:
    Exclude:
    - "EX"
    - "AE"
    - "DS"
    - "DV"
Requirements:
  Variables:
    All:
    - "--OCCUR"
Check:
  expression: >-
    not empty(--OCCUR) and (not var_exists("--PRESP") or --PRESP != "Y")
Outcome:
  Message: "Value for --OCCUR is populated for unsolicited Intervention or Event"
Source:
  Message: "Value for --OCCUR is populated for unsolicited Intervention or Event"
  Description: "Occurrence (--OCCUR) may only be populated when a given Intervention\
    \ or Event has been pre-specified (--PRESP = 'Y')."
  Domains: "INTERVENTIONS (-EX), EVENTS (-AE, -DS, -DV)"
  Severity: "Warning"
