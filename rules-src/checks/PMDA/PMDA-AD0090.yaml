Core:
  Id: "PMDA-AD0090"
  Status: "Published"
  Version: "1"
Description: "Raise an error when a Basic Data Structure dataset contains none of\
  \ the subject-level or record-level treatment variables defined in the IG. At least\
  \ 1 treatment variable is required in a BDS dataset; this requirement is satisfied\
  \ by any of the subject-level (ARM, ACTARM, TRTxxP, TRTxxA, TRTSEQP, TRTSEQA, TRxxPGy,\
  \ TRxxAGy, TSEQPGy, TSEQAGy) or record-level (TRTP, TRTA, TRTPGy, TRTAGy) treatment\
  \ variables."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "BASIC DATA STRUCTURE"
    - "MEDICAL DEVICE BASIC DATA STRUCTURE"
Bindings:
- name: "$treatment_variable_count"
  expression: "variable_count(name_pattern=\"^(ARM|ACTARM|TRTSEQ[PA]|TRT\\\\d\\\\\
    d[PA]|TR\\\\d\\\\d[PA]G\\\\d+|TSEQ[PA]G\\\\d+|TRT[PA]|TRT[PA]G\\\\d+)$\")"
Check:
  expression: >-
    $treatment_variable_count == 0
Outcome:
  Message: "None of the subject-level or record-level treatment variables defined\
    \ in the IG are present in the BDS dataset."
Source:
  Message: "None of the subject-level or record-level treatment variables defined\
    \ in the IG are present"
  Description: "At least 1 treatment variable is required in a BDS dataset. This requirement\
    \ is satisfied by any of the subject-level (ARM, ACTARM, TRTxxP, TRTxxA, TRTSEQP,\
    \ TRTSEQA, TRxxPGy, TRxxAGy, TSEQPGy, TSEQAGy) or record-level (TRTP, TRTA, TRTPGy,\
    \ TRTAGy) treatment variables. One is allowed to use any treatment variable in\
    \ analysis of BDS. Any subject-level treatment variable may be copied into the\
    \ BDS dataset from ADSL."
  Domains: "BDS, ADNCA, MDBDS"
  Severity: "Error"
Standards:
- Organization: "PMDA"
