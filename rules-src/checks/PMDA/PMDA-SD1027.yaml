Core:
  Id: "PMDA-SD1027"
  Status: "Published"
  Version: "1"
Description: "Raise an error when the Description of Element (ELEMENT) does not have\
  \ a unique value for a given value of Element Code (ETCD) within the domain."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "SE"
    - "TA"
Requirements:
  Variables:
    All:
    - "ELEMENT"
    - "ETCD"
Check:
  expression: >-
    not is_unique_relationship(ETCD, ELEMENT) or not is_unique_relationship(ELEMENT, ETCD)
Outcome:
  Message: "ELEMENT does not have a unique value for a given ETCD within the domain."
Source:
  Message: "Non-unique value for ELEMENT within ETCD"
  Description: "Description of Element (ELEMENT) must have a unique value for a given\
    \ value of Element Code (ETCD) within the domain."
  Domains: "SE, TA"
  Severity: "Error"
