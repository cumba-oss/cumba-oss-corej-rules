Core:
  Id: "PMDA-AD0137"
  Status: "Published"
  Version: "1"
Description: "Raise an error when the Analysis Criterion Flag (CRITyFL) is populated\
  \ but its corresponding parent Analysis Criterion (CRITy) is empty; whenever CRITyFL\
  \ is populated the Analysis Criterion text CRITy must also be populated."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "BASIC DATA STRUCTURE"
    - "MEDICAL DEVICE BASIC DATA STRUCTURE"
Check:
  expression: >-
    not empty(CRITyFL) and empty(CRITy)
Outcome:
  Message: "CRITyFL is populated, but CRITy is not populated"
  Message_Folded: "CRITy not populated in any record of the dataset, and at least\
    \ one record meets the rest of the condition: CRITyFL is populated, but CRITy\
    \ is not populated"
  Output_Variables:
  - "CRITy"
  - "CRITyFL"
wildcards:
  "y":
    min: 1
    max: 99
Source:
  Message: "CRITyFL is populated, but CRITy is not populated"
  Description: "When CRITyFL (Analysis Criterion Flag) is populated, it's corresponding\
    \ parent Analysis Criterion y must be populated."
  Domains: "BDS, ADNCA, MDBDS, ADAMOTHER"
  Severity: "Error"
