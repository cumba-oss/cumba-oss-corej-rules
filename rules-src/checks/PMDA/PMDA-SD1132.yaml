Core:
  Id: "PMDA-SD1132"
  Status: "Published"
  Version: "1"
Description: "Raise an error when any of AESCAN, AESCONG, AESDISAB, AESDTH, AESHOSP,\
  \ AESLIFE or AESMIE is equal to 'Y' but AESER is not equal to 'Y'."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "AE"
Requirements:
  Variables:
    All:
    - "AESER"
Check:
  expression: >-
    (var_exists("AESCAN") and AESCAN == "Y" or var_exists("AESCONG") and AESCONG == "Y" or
    var_exists("AESDISAB") and AESDISAB == "Y" or var_exists("AESDTH") and AESDTH == "Y" or
    var_exists("AESHOSP") and AESHOSP == "Y" or var_exists("AESLIFE") and AESLIFE == "Y" or
    var_exists("AESMIE") and AESMIE == "Y") and AESER != "Y"
Outcome:
  Message: "At least one seriousness criterion (AESCAN, AESCONG, AESDISAB, AESDTH,\
    \ AESHOSP, AESLIFE or AESMIE) equals 'Y', but AESER does not equal 'Y'."
Source:
  Message: "AESER is not 'Y'"
  Description: "Serious Event (AESER) variable value is expected to be 'Y' when either\
    \ of Seriousness Criteria variables (AESCAN, AESCONG, AESDISAB, AESDTH, AESHOSP,\
    \ AESLIFE, AESMIE) has value 'Y'."
  Domains: "AE"
  Severity: "Error"
