Core:
  Id: "PMDA-SD1142"
  Status: "Published"
  Version: "1"
Description: "Raise a warning when the submitted dataset is larger than 5 GB (5,000,000,000\
  \ bytes)."
Severity: "Warning"
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "ALL"
Operations:
- id: "$dataset_size"
  expression: "extract_metadata(\"dataset_size\")"
Check:
  expression: >-
    $dataset_size > 5368709120
Outcome:
  Message: "The submitted dataset is larger than 5 GB."
  Output_Variables:
  - "$dataset_size"
Source:
  Message: "Dataset is greater than 5 GB in size"
  Description: "Applicant should consult the PMDA beforehand if the dataset exceeds\
    \ the file size specified by PMDA."
  Domains: "ALL"
  Severity: "Warning"
Standards:
- Organization: "PMDA"
  Standards:
  - Name: "SDTMIG"
    Version: "3.1.2"
    References:
    - Origin: "PMDA Validation Rules"
      Rule_Identifier:
        Id: "SD1142"
        Version: "1"
      Version: "6.0"
  - Name: "SDTMIG"
    Version: "3.1.3"
    References:
    - Origin: "PMDA Validation Rules"
      Rule_Identifier:
        Id: "SD1142"
        Version: "1"
      Version: "6.0"
  - Name: "SDTMIG"
    Version: "3.2"
    References:
