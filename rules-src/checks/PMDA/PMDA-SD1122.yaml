Core:
  Id: "PMDA-SD1122"
  Status: "Published"
  Version: "1"
Description: "Raise an error when --STRESC is populated with a numeric value, but\
  \ --STRESN is not populated."
Executability: "Fully Executable"
Scope:
  Classes:
    Include:
    - "FINDINGS"
    - "FINDINGS ABOUT"
Requirements:
  Variables:
    All:
    - "--STRESN"
Check:
  expression: >-
    not empty(--STRESC) and is_numeric(--STRESC) and empty(--STRESN)
Outcome:
  Message: "--STRESN is not populated when --STRESC represents a numeric value."
  Output_Variables:
  - "--STRESC"
  - "!--STRESN"
Source:
  Message: "Missing value for --STRESN"
  Description: "Standardized Result in Numeric Format (--STRESN) variable value should\
    \ be populated when Standardized Result in Character Format (--STRESC) variable\
    \ value represents a numeric value."
  Domains: "FINDINGS, FINDINGS ABOUT"
  Severity: "Error"
