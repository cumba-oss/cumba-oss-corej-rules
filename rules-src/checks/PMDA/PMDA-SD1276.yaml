Core:
  Id: "PMDA-SD1276"
  Status: "Published"
  Version: "1"
Description: "Raise an error when --TRT is equal to 'MULTIPLE'."
Executability: "Fully Executable"
Scope:
  Classes:
    Include:
    - "INTERVENTIONS"
Requirements:
  Variables:
    All:
    - "--TRT"
Check:
  expression: >-
    --TRT == "MULTIPLE"
Outcome:
  Message: "--TRT is equal to 'MULTIPLE'."
Source:
  Message: "--TRT equals 'MULTIPLE'"
  Description: "Name of Treatment variables (--TRT) should not be populated with values\
    \ of 'MULTIPLE'."
  Domains: "INTERVENTIONS"
  Severity: "Error"
