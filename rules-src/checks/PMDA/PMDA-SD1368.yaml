Core:
  Id: "PMDA-SD1368"
  Status: "Published"
  Version: "1"
Description: "Raise an error when the Start Date/Time of Milestone (SMSTDTC) is not\
  \ populated."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "SM"
Requirements:
  Variables:
    All:
    - "SMSTDTC"
Check:
  expression: >-
    empty(SMSTDTC)
Outcome:
  Message: "SMSTDTC is empty."
  Message_Folded: "SMSTDTC not populated in any record of the dataset: SMSTDTC is\
    \ empty."
Source:
  Message: "SMSTDTC is null"
  Description: "Start Date/Time of Milestone (SMSTDTC) should not be null. The start\
    \ date/time of the Disease Milestone is the critical date/time and must be populated."
  Domains: "SM"
  Severity: "Error"
Standards:
- Organization: "PMDA"
  Standards:
  - Name: "SDTMIG"
    Version: "3.4"
    References:
    - Origin: "PMDA Validation Rules"
      Rule_Identifier:
        Id: "SD1368"
        Version: "1"
      Version: "6.0"
  - Name: "SDTMIG"
    Version: "3.3"
    References:
    - Origin: "PMDA Validation Rules"
      Rule_Identifier:
        Id: "SD1368"
        Version: "1"
      Version: "6.0"
