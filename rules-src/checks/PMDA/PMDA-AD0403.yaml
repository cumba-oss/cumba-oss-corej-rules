Core:
  Id: "PMDA-AD0403"
  Status: "Published"
  Version: "1"
Description: "Raise a warning when, within a subject (USUBJID), the character Analysis\
  \ Toxicity Description Low (ATOXDSCL) does not have a single consistent value for\
  \ a given value of Parameter Code (PARAMCD), evaluated only on rows where both ATOXDSCL\
  \ and PARAMCD are populated."
Severity: "Warning"
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "BASIC DATA STRUCTURE"
    - "MEDICAL DEVICE BASIC DATA STRUCTURE"
Check:
  expression: >-
    not empty(ATOXDSCL) and var_exists("USUBJID") and not empty(PARAMCD) and
    is_inconsistent_across_dataset(ATOXDSCL, keys=[USUBJID, PARAMCD])
Outcome:
  Message: "ATOXDSCL has inconsistent values for the same PARAMCD within a subject."
Source:
  Message: "Inconsistent value for ATOXDSCL within a subject and parameter"
  Description: "Within a subject, there should be only a single value of Analysis\
    \ Toxicity Description Low (ATOXDSCL) variable for a given value of Parameter\
    \ Code (PARAMCD) variable, considering only those rows on which both variables\
    \ are populated."
  Domains: "BDS, ADNCA, MDBDS, ADAMOTHER"
  Severity: "Warning"
Standards:
- Organization: "PMDA"
  Standards:
  - Name: "ADaMIG"
    Version: "1.3"
    References:
    - Origin: "PMDA Validation Rules"
      Rule_Identifier:
        Id: "AD0403"
        Version: "1"
      Version: "6.0"
  - Name: "ADaMIG"
    Version: "1.2"
    References:
    - Origin: "PMDA Validation Rules"
      Rule_Identifier:
        Id: "AD0403"
        Version: "1"
      Version: "6.0"
