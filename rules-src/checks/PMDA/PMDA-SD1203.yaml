Core:
  Id: "PMDA-SD1203"
  Status: "Published"
  Version: "1"
Description: "Raise a warning when --DTC is populated and is after the Date/Time of\
  \ End of Participation (DM.RFPENDTC)."
Severity: "Warning"
Executability: "Fully Executable"
Scope:
  Classes:
    Include:
    - "SPECIAL PURPOSE"
    - "INTERVENTIONS"
    - "FINDINGS"
    - "EVENTS"
    - "FINDINGS ABOUT"
  Domains:
    Exclude:
    - "DO"
Requirements:
  Variables:
    All:
    - "--DTC"
    - "STUDYID"
    - "USUBJID"
    All_Or_None:
    - - "STUDYID"
      - "DM.STUDYID"
    - - "USUBJID"
      - "DM.USUBJID"
Match_Datasets:
- Keys:
  - "STUDYID"
  - "USUBJID"
  Cardinality: "n:1"
  Name: "DM"
Check:
  expression: >-
    not empty(--DTC) and date(--DTC) > date(DM.RFPENDTC)
Outcome:
  Message: "--DTC is after the Date/Time of End of Participation (DM.RFPENDTC)."
Source:
  Message: "--DTC date is after RFPENDTC"
  Description: "Date/Time of Collection (--DTC) variable value must be less than or\
    \ equal to Date/Time of End of Participation (RFPENDTC). If the study is ongoing,\
    \ Parameter Value (TSVAL) for the 'ONGOSIND/Ongoing Study Indicator' parameter\
    \ should be set to 'Y' in the Trial Summary (TS) domain."
  Domains: "SPECIAL PURPOSE, INTERVENTIONS, FINDINGS (-DO), EVENTS, FINDINGS ABOUT"
  Severity: "Warning"
Standards:
- Organization: "PMDA"
  Standards:
