Core:
  Id: "PMDA-AD0133B"
  Status: "Published"
  Version: "1"
Description: "Raise an error when Ratio to Analysis Range y Lower Limit (R2AyLO) is\
  \ populated but the values required to derive it - Analysis Value (AVAL) and Analysis\
  \ Range y Lower Limit (AyLO) - are not both present and populated. R2AyLO equals\
  \ AVAL divided by AyLO."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "BASIC DATA STRUCTURE"
    - "MEDICAL DEVICE BASIC DATA STRUCTURE"
Check:
  expression: >-
    not empty(R2AyLO) and (empty(AVAL) or empty(AyLO))
Outcome:
  Message: "R2AyLO is populated, but AVAL and/or AyLO are not populated."
  Message_Folded: "AVAL absent or not populated in any record of the dataset, or AyLO\
    \ not populated in any record of the dataset, and at least one record meets the\
    \ rest of the condition: R2AyLO is populated, but AVAL and/or AyLO are not populated."
  Output_Variables:
  - "AVAL"
  - "R2AyLO"
  - "AyLO"
wildcards:
  "y":
    min: 1
    max: 99
Source:
  Message: "Calculation issue: R2AyLO is populated, but AVAL and/or AyLO are not populated"
  Description: "If R2AyLO is populated, the values necessary for its calculation must\
    \ both be present and populated. R2AyLO = AVAL / AyLO. Once this issue is resolved,\
    \ there is greater potential for AD0133 to fire."
  Domains: "BDS, ADNCA, MDBDS"
  Severity: "Error"
