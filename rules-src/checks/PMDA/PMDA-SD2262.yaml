Core:
  Id: "PMDA-SD2262"
  Status: "Published"
  Version: "1"
Description: "Raise a warning when the Parameter Value (TSVAL) and its code (TSVALCD)\
  \ for a TRT trial-summary parameter are not the decode and code of the same FDA-SRS\
  \ (UNII) substance record."
Severity: "Warning"
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "TS"
Requirements:
  Variables:
    All:
    - "TSPARMCD"
Bindings:
- name: "$trt_srs_pair"
  expression: "valid_external_dictionary_code_term_pair(TSVALCD, external_dictionary_type=\"\
    unii\", external_dictionary_term_variable=\"TSVAL\")"
Check:
  expression: >-
    TSPARMCD == "TRT" and $trt_srs_pair == false
Outcome:
  Message: "TSVAL and TSVALCD do not reference the same FDA-SRS record for the TRT\
    \ parameter."
  Output_Variables:
  - "TSPARMCD"
  - "TSVAL"
  - "TSVALCD"
Source:
  Message: "TSVAL/TSVALCD value mismatch for TRT"
  Description: "TSVAL and TSVALCD values must be populated from the same name record\
    \ in FDA Substance Registration System (SRS)."
  Domains: "TS"
  Severity: "Warning"
