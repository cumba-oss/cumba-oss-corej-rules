Core:
  Id: "PMDA-SD0058-B"
  Status: "Published"
  Version: "1"
Description: "Raise an error when a variable present in the DM dataset is not listed\
  \ in the SDTM model list of allowed variables for the observation class and is not\
  \ one of VISITNUM, VISIT, VISITDY and DMXFN, which the IG permits adding to DM."
Executability: "Partially Executable - Possible Underreporting"
Scope:
  Domains:
    Include:
    - "DM"
Bindings:
- name: "$allowed_variables"
  expression: "get_model_column_order()"
Check:
  expression: >-
    upper(varname()) not in $allowed_variables and upper(varname()) not in ["VISITNUM", "VISIT",
    "VISITDY", "DMXFN"]
Outcome:
  Message: "Variable is present in the dataset but is not listed in the SDTM model\
    \ list for the observation class, and is not one of VISITNUM, VISIT, VISITDY and\
    \ DMXFN, which the IG permits adding to DM."
  Output_Variables:
  - "variable_name"
  - "$allowed_variables"
Source_Proposed:
  Class: "SPC"
  Domain: "DM"
  Variable: "GEN"
  Condition: "Dataset is DM; SDTMIG DM assumption 8 permits only VISITNUM, VISIT,\
    \ VISITDY and DMXFN in addition"
  Rule: "Variable = SDTM Model list for the observation class, or a variable the IG\
    \ permits adding to the domain"
Source:
  Message: "Variable appears in dataset, but is not in SDTM model"
  Description: "Only variables listed in SDTM model should appear in a dataset. New\
    \ sponsor defined variables must not be added, and existing variables must not\
    \ be renamed or modified."
  Domains: "ALL"
  Severity: "Error"
