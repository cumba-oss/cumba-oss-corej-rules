Core:
  Id: "PMDA-SD1062"
  Status: "Published"
  Version: "1"
Description: "Raise a warning when Occurred with Overdose (AESOD) equals 'Y' but Serious\
  \ Event (AESER) does not equal 'Y'."
Severity: "Warning"
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "AE"
Requirements:
  Variables:
    All:
    - "AESOD"
    - "AESER"
Check:
  expression: >-
    AESOD == "Y" and AESER != "Y"
Outcome:
  Message: "AESER is not 'Y' when AESOD equals 'Y'."
Source:
  Message: "AESER is not 'Y' when AESOD equals 'Y'"
  Description: "Serious Event (AESER) variable value is expected to be 'Y' when Occurred\
    \ with Overdose (AESOD) variable value equals 'Y'."
  Domains: "AE"
  Severity: "Warning"
