Core:
  Id: "PMDA-SD2253"
  Status: "Published"
  Version: "1"
Description: "Raise a warning when the Parameter Value (TSVAL) for a 'COMPTRT' trial-summary\
  \ parameter is not a valid preferred term in the FDA Substance Registration System\
  \ (SRS)."
Severity: "Warning"
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "TS"
Requirements:
  Variables:
    All:
    - "TSPARMCD"
Bindings:
- name: "$comptrt_srs_term"
  expression: "valid_external_dictionary_value(TSVAL, external_dictionary_type=\"\
    unii\", dictionary_term_type=\"SRS\")"
Check:
  expression: >-
    TSPARMCD == "COMPTRT" and $comptrt_srs_term == false
Outcome:
  Message: "TSVAL is not a valid FDA-SRS preferred term for the 'COMPTRT' parameter."
Source:
  Message: "Invalid TSVAL value for COMPTRT"
  Description: "TSVAL for COMPTRT record must be a valid preferred term from FDA Substance\
    \ Registration System (SRS)."
  Domains: "TS"
  Severity: "Warning"
