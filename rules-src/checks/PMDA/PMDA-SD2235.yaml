Core:
  Id: "PMDA-SD2235"
  Status: "Published"
  Version: "1"
Description: "Raise a warning when the Trial Summary (TS) dataset does not contain\
  \ a record where TSPARMCD equals 'HLTSUBJI' (Healthy Subject Indicator)."
Severity: "Warning"
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "TS"
Bindings:
- name: "$hltsubji_count"
  expression: "record_count(filter=(TSPARMCD == \"HLTSUBJI\"))"
Check:
  expression: >-
    $hltsubji_count == 0
Outcome:
  Message: "Missing HLTSUBJI Trial Summary Parameter: a 'Healthy Subject Indicator'\
    \ (HLTSUBJI) record must be present in the Trial Summary (TS) domain."
  Output_Variables:
  - "$hltsubji_count"
Source:
  Message: "Missing HLTSUBJI Trial Summary Parameter"
  Description: "'Healthy Subject Indicator' (HLTSUBJI) record must be populated in\
    \ Trial Summary (TS) domain. It is expected for SDTM IG v3.1.2 data and required\
    \ for data in all more recent SDTM versions."
  Domains: "TS"
  Severity: "Warning"
