Core:
  Id: "PMDA-SD1003"
  Status: "Published"
  Version: "1"
Description: "Raise a warning when AGEU is populated but AGE is not present or missing."
Severity: "Warning"
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "DM"
Check:
  expression: >-
    not empty(AGEU) and empty(AGE)
Outcome:
  Message: "AGE is missing when AGEU is populated."
Source:
  Message: "Missing value for AGE when AGEU is provided"
  Description: "Age (AGE) should be provided when Age Units (AGEU) are populated."
  Domains: "DM"
  Severity: "Warning"
Standards:
- Organization: "PMDA"
  Standards:
  - Name: "SDTMIG"
    Version: "3.1.2"
    References:
    - Origin: "PMDA Validation Rules"
      Rule_Identifier:
        Id: "SD1003"
        Version: "1"
      Version: "6.0"
- Organization: "FDA"
  Standards:
  - Name: "SDTMIG"
    Version: "3.1.2"
    References:
    - Origin: "FDA Validator Rules"
      Rule_Identifier:
        Id: "SD1003"
        Version: "1"
      Version: "1.6"
