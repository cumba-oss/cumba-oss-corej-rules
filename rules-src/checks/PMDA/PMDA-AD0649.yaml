Core:
  Id: "PMDA-AD0649"
  Status: "Published"
  Version: "1"
Description: "Raise an error when an On Treatment Period xx Flag (ONTRxxFL) variable\
  \ is flagged Y on a record but the overall On Treatment Record Flag (ONTRTFL) variable\
  \ is not Y on that same record; when any ONTRxxFL is Y, ONTRTFL must also be Y."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "OCCURRENCE DATA STRUCTURE"
    - "MEDICAL DEVICE OCCURRENCE DATA STRUCTURE"
Requirements:
  Variables:
    All:
    - "ONTRTFL"
Check:
  expression: >-
    upper(varname()) =~ /^ONTR(0[1-9]|[1-9][0-9])FL$/ and value() == "Y" and ONTRTFL != "Y"
Outcome:
  Message: "An ONTRxxFL variable is Y but the overall ONTRTFL is not Y on the same\
    \ record."
  Output_Variables:
  - "variable_name"
  - "variable_value"
  - "ONTRTFL"
Source:
  Message: "ONTRxxFL = Y and ONTRTFL != Y"
  Description: "If ONTRxxFL is included, ONTRTFL is defined as the overall on-treatment\
    \ flag. If any On Treatment Period xx Flag (ONTRxxFL) variables are flagged Y,\
    \ then the overall On Treatment Record Flag (ONTRTFL) variable should also be\
    \ Y."
  Domains: "OCCDS, ADAE, MDOCCDS"
  Severity: "Error"
Standards:
- Organization: "PMDA"
  Standards:
  - Name: "ADaMIG"
    Version: "1.3"
    References:
    - Origin: "PMDA Validation Rules"
      Rule_Identifier:
        Id: "AD0649"
        Version: "1"
      Version: "6.0"
