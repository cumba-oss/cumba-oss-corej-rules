Core:
  Id: "PMDA-SD1041"
  Status: "Published"
  Version: "1"
Description: "Raise a warning when --SCAT is populated and equal to --CAT."
Severity: "Warning"
Executability: "Fully Executable"
Scope:
  Classes:
    Include:
    - "EVENTS"
    - "INTERVENTIONS"
    - "FINDINGS"
    - "FINDINGS ABOUT"
Requirements:
  Variables:
    All:
    - "--SCAT"
    - "--CAT"
Check:
  expression: >-
    not empty(--SCAT) and --SCAT == --CAT
Outcome:
  Message: "--CAT and --SCAT values are identical."
Source:
  Message: "Values for --CAT and --SCAT are identical"
  Description: "Values of Category (--CAT) and Subcategory (--SCAT) variables should\
    \ not be identical."
  Domains: "INTERVENTIONS, FINDINGS, EVENTS, FINDINGS ABOUT, TI"
  Severity: "Warning"
