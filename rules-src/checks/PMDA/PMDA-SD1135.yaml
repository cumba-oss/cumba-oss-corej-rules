Core:
  Id: "PMDA-SD1135"
  Status: "Published"
  Version: "1"
Description: "Raise a warning when the Study Day variable --STDY has a negative value\
  \ in the EC or EX dataset."
Severity: "Warning"
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "EC"
    - "EX"
Requirements:
  Variables:
    All:
    - "--STDY"
Check:
  expression: >-
    not empty(--STDY) and --STDY < 0
Outcome:
  Message: "Negative value for Study Day variable --STDY."
Source:
  Message: "Negative value of Study Day variable"
  Description: "Study Day variables (*DY) value should not be negative in Exposure\
    \ (EX) and Exposure As Collected (EC) datasets."
  Domains: "EC, EX"
  Severity: "Warning"
