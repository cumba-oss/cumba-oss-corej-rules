Core:
  Id: "PMDA-SD0038"
  Status: "Published"
  Version: "1"
Description: "Raise an error when a Study Day variable (a variable whose name ends\
  \ in DY) has a value equal to 0. There is no study day 0; days before the reference\
  \ start date are negative and days on or after it are positive."
Executability: "Fully Executable"
Scope:
  Classes:
    Include:
    - "INTERVENTIONS"
    - "EVENTS"
    - "FINDINGS"
    - "FINDINGS ABOUT"
    - "SPECIAL PURPOSE"
Check:
  expression: >-
    ends_with(upper(varname()), "DY") and value() == 0
Outcome:
  Message: "Study day variable value equals 0."
Source:
  Message: "Value of Study Day variable equals 0"
  Description: "Study Day variables (*DY) value should not equal 0."
  Domains: "SPECIAL PURPOSE, INTERVENTIONS, FINDINGS, EVENTS, FINDINGS ABOUT"
  Severity: "Error"
