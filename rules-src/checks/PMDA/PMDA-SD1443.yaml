Core:
  Id: "PMDA-SD1443"
  Status: "Published"
  Version: "1"
Description: "Raise a warning when --TERM is present and --BODSYS is present and --BODSYS\
  \ does not have the same value across records with the same value of --TERM."
Severity: "Warning"
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "AE"
    - "CE"
    - "MH"
Requirements:
  Variables:
    All:
    - "--BODSYS"
    - "--TERM"
Check:
  expression: >-
    is_inconsistent_across_dataset(--BODSYS, keys=[--TERM])
Outcome:
  Message: "Inconsistent value for --BODSYS within --TERM"
Source:
  Message: "Inconsistent value for --BODSYS within --TERM"
  Description: "Body System (--BODSYS) should be consistent for the same collected\
    \ term (--TERM)."
  Domains: "AE, CE, MH"
  Severity: "Warning"
Standards:
