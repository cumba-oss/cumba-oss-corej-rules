Core:
  Id: "PMDA-AD0272"
  Status: "Published"
  Version: "1"
Description: "Raise an error when a 1st Occurrence Flag variable whose name matches\
  \ AOCC*FL has a value that is not Y or empty."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "ALL"
Check:
  expression: >-
    varname() =~ /^AOCC.*FL$/ and not empty(value()) and value() not in ["Y"]
Outcome:
  Message: "A 1st Occurrence Flag (AOCC*FL) variable has a populated value that is\
    \ not Y."
  Output_Variables:
  - "variable_name"
  - "variable_value"
Source:
  Message: "Variable flag value is not Y or null"
  Description: "1st Occurrence * Flag (AOCC*FL) variable values must be Y or null."
  Domains: "OCCDS, ADAE, MDOCCDS, ADAMOTHER"
  Severity: "Error"
