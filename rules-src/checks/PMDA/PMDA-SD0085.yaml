Core:
  Id: "PMDA-SD0085"
  Status: "Published"
  Version: "1"
Description: "Raise a warning when IEORRES and IESTRESC do not have the same value."
Severity: "Warning"
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "IE"
Requirements:
  Variables:
    All:
    - "IESTRESC"
    - "IEORRES"
Check:
  expression: >-
    IESTRESC != IEORRES
Outcome:
  Message: "Mismatch between IEORRES and IESTRESC values."
Source:
  Message: "Mismatch between IEORRES and IESTRESC values"
  Description: "I/E Criterion Original Result (IEORRES) and I/E Criterion Result in\
    \ Std Format (IESTRESC) should have the same value."
  Domains: "IE"
  Severity: "Warning"
