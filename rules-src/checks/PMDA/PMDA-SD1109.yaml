Core:
  Id: "PMDA-SD1109"
  Status: "Published"
  Version: "1"
Description: "Raise a warning when the EX (Exposure) dataset is not present in the\
  \ study."
Severity: "Warning"
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "ALL"
Check:
  expression: >-
    not ds_exists("EX")
Outcome:
  Message: "The EX (Exposure) dataset is not present in the study."
Source:
  Message: "Missing EX dataset"
  Description: "Exposure (EX) dataset should be included in every submission."
  Domains: "EX"
  Severity: "Warning"
