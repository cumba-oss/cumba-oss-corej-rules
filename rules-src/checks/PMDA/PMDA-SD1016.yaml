Core:
  Id: "PMDA-SD1016"
  Status: "Published"
  Version: "1"
Description: "Raise an error when the combination of Inclusion/Exclusion Criterion\
  \ Short Name (IETESTCD), Criterion (IETEST), and Category (IECAT) in the IE dataset\
  \ does not match any entry in the Trial Inclusion/Exclusion Criteria (TI) dataset."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "IE"
Requirements:
  Variables:
    All:
    - "IETESTCD"
    All_Or_None:
    - - "IETESTCD"
      - "TI.IETESTCD"
    - - "IETEST"
      - "TI.IETEST"
    - - "IECAT"
      - "TI.IECAT"
Match_Datasets:
- Join_Type: "left"
  Keys:
  - "IETESTCD"
  - "IETEST"
  - "IECAT"
  Name: "TI"
Check:
  expression: >-
    empty(TI.IETESTCD)
Outcome:
  Message: "The combination of IETESTCD, IETEST, and IECAT does not match any entry\
    \ in the TI dataset."
  Message_Folded: "TI.IETESTCD not present in the dataset: The combination of IETESTCD,\
    \ IETEST, and IECAT does not match any entry in the TI dataset."
  Output_Variables:
  - "IETESTCD"
  - "IETEST"
  - "IECAT"
Source:
  Message: "IETESTCD/IETEST/IECAT values do not exist in TI domain"
  Description: "The combination of Inclusion/Exclusion Criterion Short Name (IETESTCD),\
    \ Criterion (IETEST), and Category (IECAT) values should match entries in the\
    \ Trial Inclusion/Exclusion Criteria (TI) dataset."
  Domains: "IE"
  Severity: "Error"
