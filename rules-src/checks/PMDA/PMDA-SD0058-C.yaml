Core:
  Id: "PMDA-SD0058-C"
  Status: "Published"
  Version: "1"
Description: "Raise an error when a variable present in the CO dataset is not listed\
  \ in the SDTM model list of allowed variables for the observation class and is not\
  \ one of the closed list of identifiers and timing variables SDTMIG 3.1.2-3.2 permit\
  \ adding to CO."
Executability: "Partially Executable - Possible Underreporting"
Scope:
  Domains:
    Include:
    - "CO"
Bindings:
- name: "$allowed_variables"
  expression: "get_model_column_order()"
Check:
  expression: >-
    upper(varname()) not in $allowed_variables and upper(varname()) not in ["COGRPID", "COREFID",
    "COSPID", "VISIT", "VISITNUM", "VISITDY", "TAETORD", "CODY", "COTPT", "COTPTNUM", "COELTM",
    "COTPTREF", "CORFTDTC"]
Outcome:
  Message: "Variable is present in the dataset but is not listed in the SDTM model\
    \ list for the observation class, and is not one of the closed list of identifiers\
    \ and timing variables SDTMIG 3.1.2-3.2 permit adding to CO."
  Output_Variables:
  - "variable_name"
  - "$allowed_variables"
Source_Proposed:
  Class: "SPC"
  Domain: "CO"
  Variable: "GEN"
  Condition: "Dataset is CO; SDTMIG 3.1.2-3.2 CO assumption 6 permits only COGRPID,\
    \ COREFID, COSPID, VISIT, VISITNUM, VISITDY, TAETORD, CODY, COTPT, COTPTNUM, COELTM,\
    \ COTPTREF and CORFTDTC in addition"
  Rule: "Variable = SDTM Model list for the observation class, or a variable the IG\
    \ permits adding to the domain"
Source:
  Message: "Variable appears in dataset, but is not in SDTM model"
  Description: "Only variables listed in SDTM model should appear in a dataset. New\
    \ sponsor defined variables must not be added, and existing variables must not\
    \ be renamed or modified."
  Domains: "ALL"
  Severity: "Error"
Standards:
- Organization: "PMDA"
  Standards:
  - Name: "SDTMIG"
    Version: "3.1.2"
    References:
    - Origin: "PMDA Validation Rules"
      Rule_Identifier:
        Id: "SD0058"
        Version: "1"
      Version: "6.0"
  - Name: "SDTMIG"
    Version: "3.1.3"
    References:
