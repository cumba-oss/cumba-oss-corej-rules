Core:
  Id: "PMDA-SD9727"
  Status: "Published"
  Version: "1"
Description: "Raise an error when none of the subject identifier variables Unique\
  \ Subject Identifier (USUBJID), Associated Persons Identifier (APID), Sponsor Device\
  \ Identifier (SPDEVID) and Pool Identifier (POOLID) is present in the dataset."
Executability: "Fully Executable"
Scope:
  Classes:
    Include:
    - "EVENTS"
    - "INTERVENTIONS"
    - "FINDINGS"
    - "FINDINGS ABOUT"
    - "SPECIAL PURPOSE"
    - "RELATIONSHIP"
  Domains:
    Exclude:
    - "RELREC"
    - "DR"
    - "POOLDEF"
    - "DM"
    - "SE"
    - "SM"
Check:
  expression: >-
    not var_exists("USUBJID") and not var_exists("APID") and not var_exists("SPDEVID") and not
    var_exists("POOLID")
Outcome:
  Message: "None of USUBJID, APID, SPDEVID and POOLID is present in the dataset."
Source_Proposed:
  Sheet_Issue: "#204"
  Message: "No subject identifier variable is present in the dataset"
  Description: "At least one of the subject identifier variables Unique Subject Identifier\
    \ (USUBJID), Associated Persons Identifier (APID), Sponsor Device Identifier (SPDEVID)\
    \ or Pool Identifier (POOLID) must be present in the dataset."
  Domains: "SPECIAL PURPOSE (-DM, -SE, -SM), INTERVENTIONS, FINDINGS, EVENTS, FINDINGS\
    \ ABOUT, RELATIONSHIP (-DR, -POOLDEF, -RELREC)"
  Severity: "Error"
Standards:
- Organization: "PMDA"
  Standards:
  - Name: "SDTMIG"
    Version: "3.4"
  - Name: "SDTMIG"
    Version: "3.3"
