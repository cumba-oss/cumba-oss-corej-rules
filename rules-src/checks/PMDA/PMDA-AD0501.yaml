Core:
  Id: "PMDA-AD0501"
  Status: "Published"
  Version: "1"
Description: "Raise an error when the Subperiod within Period (ASPER) variable is\
  \ populated on a record but the Period (APERIOD) variable is missing on that same\
  \ record; when ASPER is populated APERIOD must also be populated."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "BASIC DATA STRUCTURE"
    - "OCCURRENCE DATA STRUCTURE"
    - "MEDICAL DEVICE BASIC DATA STRUCTURE"
    - "MEDICAL DEVICE OCCURRENCE DATA STRUCTURE"
Check:
  expression: >-
    not empty(ASPER) and empty(APERIOD)
Outcome:
  Message: "ASPER is populated but APERIOD is not populated on the same record."
  Message_Folded: "APERIOD absent or not populated in any record of the dataset, and\
    \ at least one record meets the rest of the condition: ASPER is populated but\
    \ APERIOD is not populated on the same record."
Source:
  Message: "ASPER is populated and APERIOD is not populated"
  Description: "On a given record, if Subperiod within Period (ASPER) variable is\
    \ populated, then Period (APERIOD) variable must be populated."
  Domains: "BDS, ADNCA, MDBDS, OCCDS, ADAE, MDOCCDS, ADAMOTHER"
  Severity: "Error"
Standards:
- Organization: "PMDA"
  Standards:
  - Name: "ADaMIG"
    Version: "1.3"
    References:
    - Origin: "PMDA Validation Rules"
      Rule_Identifier:
        Id: "AD0501"
        Version: "1"
      Version: "6.0"
  - Name: "ADaMIG"
    Version: "1.2"
