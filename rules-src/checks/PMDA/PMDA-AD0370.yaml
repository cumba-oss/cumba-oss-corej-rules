Core:
  Id: "PMDA-AD0370"
  Status: "Published"
  Version: "1"
Description: "Raise an error when *TMF is populated and neither *TM nor *DTM is populated."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "SUBJECT LEVEL ANALYSIS DATASET"
    - "DEVICE LEVEL ANALYSIS DATASET"
    - "BASIC DATA STRUCTURE"
    - "MEDICAL DEVICE BASIC DATA STRUCTURE"
    - "OCCURRENCE DATA STRUCTURE"
    - "MEDICAL DEVICE OCCURRENCE DATA STRUCTURE"
Check:
  expression: >-
    not empty(*TMF) and empty(*TM) and empty(*DTM)
Outcome:
  Message: "*TMF is populated but neither *TM nor *DTM is populated."
  Message_Folded: "*DTM or *TM not populated in any record of the dataset, and at\
    \ least one record meets the rest of the condition: *TMF is populated but neither\
    \ *TM nor *DTM is populated."
  Output_Variables:
  - "*TM"
  - "*DTM"
  - "*TMF"
Source:
  Message: "*TMF is populated, but *TM or *DTM is not populated"
  Description: "If a Time variable is indicated to be imputated by population of an\
    \ Imputation Flag (*TMF), that Time variable (*TM) or Datetime variable (*DTM)\
    \ must have a value."
  Domains: "ADSL, ADDL, BDS, ADNCA, MDBDS, OCCDS, ADAE, MDOCCDS, ADAMOTHER"
  Severity: "Error"
Standards:
- Organization: "PMDA"
  Standards:
  - Name: "ADaMIG"
    Version: "1.3"
    References:
    - Origin: "PMDA Validation Rules"
      Rule_Identifier:
        Id: "AD0370"
        Version: "1"
      Version: "6.0"
  - Name: "ADaMIG"
    Version: "1.2"
    References:
    - Origin: "PMDA Validation Rules"
      Rule_Identifier:
        Id: "AD0370"
        Version: "1"
      Version: "6.0"
