Core:
  Id: "PMDA-SD2017"
  Status: "Published"
  Version: "1"
Description: "Raise an error when both the Parameter Value (TSVAL) and the Parameter\
  \ Null Flavor (TSVALNF) variables are empty."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "TS"
Requirements:
  Variables:
    All:
    - "TSVALNF"
    - "TSVAL"
Check:
  expression: >-
    empty(TSVAL) and empty(TSVALNF)
Outcome:
  Message: "Both TSVAL and TSVALNF are empty."
  Message_Folded: "TSVAL and TSVALNF not populated in any record of the dataset, and\
    \ at least one record meets the rest of the condition: Both TSVAL and TSVALNF\
    \ are empty."
Source:
  Message: "Missing values for both --VAL and --VALNF"
  Description: "Value for Parameter Value (--VAL) variable must be populated. --VAL\
    \ can only be null when Parameter Null Flavor (--VALNF) variable value is populated."
  Domains: "TS"
  Severity: "Error"
