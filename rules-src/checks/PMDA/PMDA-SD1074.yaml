Core:
  Id: "PMDA-SD1074"
  Status: "Published"
  Version: "1"
Description: "Raise an error when a variable that may be used only in SEND is present\
  \ in the SDTM dataset."
Severity: "Reject"
Executability: "Partially Executable - Possible Underreporting"
Scope:
  Domains:
    Include:
    - "ALL"
Check:
  expression: >-
    upper(varname()) in ["SPECIES", "STRAIN", "SBSTRAIN", "AGETXT", "SETCD", "RPATHCD"]
Outcome:
  Message: "A variable that may be used only in SEND is present in the SDTM dataset."
  Output_Variables:
  - "variable_name"
Source:
  Message: "Variable which can be used only in SEND"
  Description: "Variables designed only for SEND pre-clinical studies must be not\
    \ included in the SDTM dataset."
  Domains: "ALL"
  Severity: "Reject"
