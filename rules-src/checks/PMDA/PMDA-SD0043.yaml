Core:
  Id: "PMDA-SD0043"
  Status: "Published"
  Version: "1"
Description: "Raise a warning when --VAMT (Treatment Vehicle Amount) is populated\
  \ but --TRTV (Treatment Vehicle) is empty."
Severity: "Warning"
Executability: "Fully Executable"
Scope:
  Classes:
    Include:
    - "INTERVENTIONS"
Requirements:
  Variables:
    All:
    - "--TRTV"
    - "--VAMT"
Check:
  expression: >-
    not empty(--VAMT) and empty(--TRTV)
Outcome:
  Message: "--TRTV is empty when --VAMT is populated."
Source:
  Message: "Missing value for --TRTV when --VAMT is not null"
  Description: "Treatment Vehicle (--TRTV) should be provided when Treatment Vehicle\
    \ Amount (--VAMT) is specified."
  Domains: "INTERVENTIONS"
  Severity: "Warning"
