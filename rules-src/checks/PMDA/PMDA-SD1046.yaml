Core:
  Id: "PMDA-SD1046"
  Status: "Published"
  Version: "1"
Description: "Raise an error when I/E Criterion Original Result (IEORRES) does not\
  \ equal 'N' while Inclusion/Exclusion Category (IECAT) is 'INCLUSION'."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "IE"
Requirements:
  Variables:
    All:
    - "IECAT"
    - "IEORRES"
Check:
  expression: >-
    IECAT == "INCLUSION" and IEORRES != "N"
Outcome:
  Message: "IEORRES does not equal 'N' when IECAT is 'INCLUSION'."
  Output_Variables:
  - "IETESTCD"
Source:
  Message: "IESTRESC is not 'N' when IECAT ='INCLUSION'"
  Description: "I/E Criterion Original Result (IEORRES) must equal 'N' when Inclusion/Exclusion\
    \ Category (IECAT) is 'INCLUSION'."
  Domains: "IE"
  Severity: "Error"
