Core:
  Id: "PMDA-SD0024"
  Status: "Published"
  Version: "1"
Description: "Raise a warning when the End Date/Time of Observation (--ENDTC) is populated\
  \ but the Date/Time of Collection (--DTC) is empty."
Severity: "Warning"
Executability: "Partially Executable - Possible Underreporting"
Scope:
  Classes:
    Include:
    - "FINDINGS"
    - "FINDINGS ABOUT"
Requirements:
  Variables:
    All:
    - "--ENDTC"
    - "--DTC"
Check:
  expression: >-
    not empty(--ENDTC) and empty(--DTC)
Outcome:
  Message: "--DTC is empty when --ENDTC is populated."
  Message_Folded: "--DTC not populated in any record of the dataset, and at least\
    \ one record meets the rest of the condition: --DTC is empty when --ENDTC is populated."
Source:
  Message: "Missing value for --DTC when --ENDTC is provided"
  Description: "Date/Time of Collection (--DTC) should not be null when End Date/Time\
    \ of Observation (--ENDTC) is not null."
  Domains: "FINDINGS, FINDINGS ABOUT"
  Severity: "Warning"
