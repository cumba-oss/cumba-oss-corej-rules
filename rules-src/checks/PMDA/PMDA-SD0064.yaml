Core:
  Id: "PMDA-SD0064"
  Status: "Published"
  Version: "1"
Description: "Raise an error when a Unique Subject Identifier (USUBJID) value is not\
  \ present in the Demographics (DM) dataset."
Severity: "Reject"
Executability: "Fully Executable"
Scope:
  Domains:
    Exclude:
    - "AP--"
    - "APRELSUB"
Grouping:
  Variables:
  - "USUBJID"
Bindings:
- name: "$dm_usubjid"
  expression: "distinct(USUBJID, domain=\"DM\")"
Check:
  expression: >-
    not empty(USUBJID) and USUBJID not in $dm_usubjid
Outcome:
  Message: "USUBJID value is not present in the DM dataset."
  Output_Variables:
  - "$dm_usubjid"
Source:
  Message: "Subject is not present in DM domain"
  Description: "All Subjects (USUBJID) must be present in Demographics (DM) domain."
  Domains: "ALL (-DM, -DI, -OI, -TA, -TD, -TE, -TI, -TM, -TS, -TV)"
  Severity: "Reject"
