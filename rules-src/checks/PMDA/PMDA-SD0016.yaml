Core:
  Id: "PMDA-SD0016"
  Status: "Published"
  Version: "1"
Description: "Raise a warning when Character Result/Finding in Std Format (--STRESC)\
  \ is empty while Derived Flag (--DRVFL) is equal to 'Y'."
Severity: "Warning"
Executability: "Fully Executable"
Scope:
  Classes:
    Include:
    - "FINDINGS"
    - "FINDINGS ABOUT"
Requirements:
  Variables:
    All:
    - "--DRVFL"
Check:
  expression: >-
    --DRVFL == "Y" and empty(--STRESC)
Outcome:
  Message: "--STRESC is empty when --DRVFL equals 'Y'."
  Output_Variables:
  - "!--STRESC"
Source:
  Message: "Missing value for --STRESC when --DRVFL='Y'"
  Description: "Character Result/Finding in Std Format (--STRESC) value should not\
    \ be null when Derived Flag (--DRVFL) value is 'Y'."
  Domains: "FINDINGS, FINDINGS ABOUT"
  Severity: "Warning"
