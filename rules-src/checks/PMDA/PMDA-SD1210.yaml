Core:
  Id: "PMDA-SD1210"
  Status: "Published"
  Version: "1"
Description: "Raise a warning when RFICDTC is empty. RFICDTC should be populated;\
  \ it would be empty only in studies not collecting informed-consent date/time."
Severity: "Warning"
Executability: "Partially Executable - Possible Overreporting"
Scope:
  Domains:
    Include:
    - "DM"
Requirements:
  Variables:
    All:
    - "RFICDTC"
Check:
  expression: >-
    empty(RFICDTC)
Outcome:
  Message: "RFICDTC is empty."
  Message_Folded: "RFICDTC not populated in any record of the dataset: RFICDTC is\
    \ empty."
Source:
  Message: "Missing value for RFICDTC"
  Description: "Date/Time of Informed Consent (RFICDTC) variable value should be populated.\
    \ It would be null only in studies not collecting this info."
  Domains: "DM"
  Severity: "Warning"
