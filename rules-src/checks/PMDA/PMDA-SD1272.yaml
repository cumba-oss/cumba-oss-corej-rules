Core:
  Id: "PMDA-SD1272"
  Status: "Published"
  Version: "1"
Description: "Raise an error when --TESTCD is equal to 'OTHER'."
Executability: "Fully Executable"
Scope:
  Classes:
    Include:
    - "FINDINGS"
Requirements:
  Variables:
    All:
    - "--TESTCD"
Check:
  expression: >-
    --TESTCD == "OTHER"
Outcome:
  Message: "--TESTCD is equal to 'OTHER'."
Source:
  Message: "--TESTCD equals 'OTHER'"
  Description: "Test Code variables (--TESTCD) should not be populated with values\
    \ of 'OTHER'."
  Domains: "FINDINGS, FINDINGS ABOUT"
  Severity: "Error"
