Core:
  Id: "PMDA-SD1470"
  Status: "Published"
  Version: "1"
Description: "Raise a warning when the Result or Finding in Original Units (LBORRES)\
  \ is populated with a non-numeric value while the Reference Range Lower Limit in\
  \ Original Units (LBORNRLO) is populated. LBORNRLO should be populated only for\
  \ continuous (numeric) results. Allowed numeric values may include optional leading\
  \ >, <, =, a space, and - symbols in that order, e.g. '<= -1.2'."
Severity: "Warning"
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "LB"
Requirements:
  Variables:
    All:
    - "LBORRES"
Check:
  expression: >-
    not empty(LBORNRLO) and not empty(LBORRES) and LBORRES !~ /^[><]?=?
    ?(-?((\\d+(\\.\\d+)?)|(\\.\\d+)))$/
Outcome:
  Message: "LBORRES is not a numeric value when LBORNRLO is populated."
Source:
  Message: "--ORRES is not numeric value, when --ORNRLO is populated"
  Description: "Lower end of reference range for continuous measurement in original\
    \ units (--ORNRLO) should be populated only for continuous results (--ORRES is\
    \ numeric value). Allowed \"numeric\" values may include optional >, <, =, a space\
    \ and - leading symbols in the listed order. For example, \"<= -1.2\"."
  Domains: "LB"
  Severity: "Warning"
Standards:
- Organization: "PMDA"
  Standards:
  - Name: "SDTMIG"
    Version: "3.4"
    References:
    - Origin: "PMDA Validation Rules"
      Rule_Identifier:
        Id: "SD1470"
        Version: "1"
      Version: "6.0"
