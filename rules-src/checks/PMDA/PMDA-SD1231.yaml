Core:
  Id: "PMDA-SD1231"
  Status: "Published"
  Version: "1"
Description: "Raise a warning when the length of a value exceeds the value-level length\
  \ declared for the applicable value-level condition (Define-XML ValueListDef / WhereClauseDef)."
Severity: "Warning"
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "ALL"
Check:
  expression: >-
    not empty(value()) and not empty(vlm_length(variable_name)) and vlm_value_length(variable_name)
    > vlm_length(variable_name)
Outcome:
  Message: "The value is longer than the value-level length declared in the Define-XML."
  Output_Variables:
  - "variable_value"
Source:
  Message: "Variable value is longer than defined max length %Variable.@Clause.Length%\
    \ when value-level condition occurs"
  Description: "Value level length must not exceed the length as specified define.xml."
  Domains: "ALL"
  Severity: "Warning"
