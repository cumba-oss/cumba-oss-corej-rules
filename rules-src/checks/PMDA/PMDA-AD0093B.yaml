Core:
  Id: "PMDA-AD0093B"
  Status: "Published"
  Version: "1"
Description: "Raise an error when, within a study, the Planned Treatment (TRTP) does\
  \ not have a single consistent value for each unique value of Planned Treatment\
  \ (N) (TRTPN), considering only those rows on which both variables are populated.\
  \ All TRTP values must be the same for each unique value of TRTPN when the primary\
  \ variable TRTP is populated."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "ALL"
Requirements:
  Variables:
    All:
    - "TRTP"
    - "TRTPN"
Check:
  expression: >-
    not empty(TRTP) and not empty(TRTPN) and is_inconsistent_across_dataset(TRTP, keys=[TRTPN])
Outcome:
  Message: "Inconsistent value for TRTP: TRTP is not the same value across records\
    \ with the same value of TRTPN."
Source:
  Message: "Inconsistent value for TRTP"
  Description: "Within a study, all TRTP values must be the same for each unique value\
    \ of TRTPN when the primary variable TRTP is populated. Considering only those\
    \ rows on which both variables are populated."
  Domains: "BDS, ADNCA, MDBDS, ADAMOTHER"
  Severity: "Error"
