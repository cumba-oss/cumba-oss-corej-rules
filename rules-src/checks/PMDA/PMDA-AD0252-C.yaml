Core:
  Id: "PMDA-AD0252-C"
  Status: "Published"
  Version: "1"
Description: "Raise an error for each variable in a subject-level or device-level\
  \ analysis dataset (ADSL or ADDL) whose name is one of the basic-data-structure\
  \ numeric analysis-category variables AVALCAyN or BASECAyN (introduced in ADaMIG\
  \ 1.1), which are prohibited at subject and device level."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "SUBJECT LEVEL ANALYSIS DATASET"
    - "DEVICE LEVEL ANALYSIS DATASET"
Check:
  expression: >-
    upper(varname()) =~ /^AVALCA([1-9]|[1-9][0-9])N$/ or upper(varname()) =~
    /^BASECA([1-9]|[1-9][0-9])N$/
Outcome:
  Message: "The variable is prohibited in the subject-level analysis dataset: its\
    \ name is one of the basic-data-structure numeric analysis-category variables\
    \ AVALCAyN and BASECAyN."
Source_Proposed:
  Message: "The variable is prohibited in the subject-level analysis dataset: its\
    \ name is one of the basic-data-structure numeric analysis-category variables\
    \ AVALCAyN and BASECAyN."
  Description: "Raise an error for each variable in a subject-level or device-level\
    \ analysis dataset (ADSL or ADDL) whose name is one of the basic-data-structure\
    \ numeric analysis-category variables AVALCAyN or BASECAyN (introduced in ADaMIG\
    \ 1.1), which are prohibited at subject and device level."
  Domains: "SUBJECT LEVEL ANALYSIS DATASET, DEVICE LEVEL ANALYSIS DATASET"
  Severity: "Error"
Source:
  Message: "Variable present in dataset is prohibited for use in ADaM"
  Description: "Variables described in ADaM IG as inappropriate for usage must be\
    \ not included in the dataset. i.e., for ADAE, there is no need for AVAL, AVALC\
    \ and Parameter variables."
  Domains: "ADSL, ADDL, BDS, ADNCA, MDBDS, OCCDS, ADAE, MDOCCDS"
  Severity: "Error"
Standards:
- Organization: "PMDA"
  Standards:
