Core:
  Id: "PMDA-SD1072"
  Status: "Published"
  Version: "1"
Description: "Raise a warning when RDOMAIN is populated and is not equal to 'DM' but\
  \ IDVAR is not populated."
Severity: "Warning"
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "RELREC"
    - "SUPP--"
    - "SQ--"
Requirements:
  Variables:
    All:
    - "RDOMAIN"
Check:
  expression: >-
    not empty(RDOMAIN) and upper(RDOMAIN) != "DM" and empty(IDVAR)
Outcome:
  Message: "IDVAR is empty when RDOMAIN is populated and is not equal to 'DM'."
  Message_Folded: "IDVAR absent or not populated in any record of the dataset, and\
    \ at least one record meets the rest of the condition: IDVAR is empty when RDOMAIN\
    \ is populated and is not equal to 'DM'."
Source:
  Message: "Missing IDVAR value when RDOMAIN value is provided"
  Description: "Value of Identifying Variable (IDVAR) variable must be populated when\
    \ Related Domain Abbreviation (RDOMAIN) variable value is provided, with the only\
    \ exception of 'DM' value for RDOMAIN."
  Domains: "RELREC, SUPPQUAL"
  Severity: "Warning"
