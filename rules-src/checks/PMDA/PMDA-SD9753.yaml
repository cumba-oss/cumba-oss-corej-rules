Core:
  Id: "PMDA-SD9753"
  Status: "Published"
  Version: "1"
Description: "Raise an error when Study Day of Start of Observation (--STDY) is populated\
  \ on at least one record but Start Date/Time of Observation (--STDTC) is not present\
  \ in the dataset; the study day may only be populated when --STDTC is provided,\
  \ so without the column every populated value is unsupported."
Sensitivity: "Dataset"
Executability: "Fully Executable"
Scope:
  Classes:
    Include:
    - "SPECIAL PURPOSE"
    - "INTERVENTIONS"
    - "EVENTS"
    - "FINDINGS"
    - "FINDINGS ABOUT"
  Domains:
    Exclude:
    - "CO"
    - "DM"
Requirements:
  Variables:
    None:
    - "--STDTC"
    All:
    - "--STDY"
Check:
  expression: >-
    not empty(--STDY)
Outcome:
  Message: "--STDY is populated but --STDTC is not present in the dataset."
Source_Proposed:
  Sheet_Issue: "#295"
  Message: "Missing --STDTC variable, when --STDY is populated"
  Description: "Start Date/Time of Observation (--STDTC) variable should be included\
    \ into dataset, when Study Day of Start of Observation (--STDY) is populated."
  Domains: "SPECIAL PURPOSE, INTERVENTIONS, EVENTS, FINDINGS, FINDINGS ABOUT (-CO,\
    \ -DM)"
  Severity: "Warning"
Standards:
- Organization: "PMDA"
  Standards:
  - Name: "SDTMIG"
    Version: "3.2"
  - Name: "SDTMIG"
    Version: "3.1.3"
  - Name: "SDTMIG"
    Version: "3.1.2"
