Core:
  Id: "PMDA-SD1039"
  Status: "Published"
  Version: "1"
Description: "Raise a warning when Category (--CAT) is non-empty and identical (case-insensitive)\
  \ to the value of Domain Abbreviation (DOMAIN), Reported Term (--TERM), Name of\
  \ Measurement, Test, or Examination (--TESTCD), Name of Treatment (--TRT), Standardized\
  \ Coded Term (--DECOD), or Body System or Organ Class (--BODSYS) on the same record."
Severity: "Warning"
Executability: "Fully Executable"
Scope:
  Classes:
    Include:
    - "EVENTS"
    - "INTERVENTIONS"
    - "FINDINGS"
    - "FINDINGS ABOUT"
Requirements:
  Variables:
    All:
    - "--CAT"
Check:
  expression: >-
    not empty(--CAT) and (var_exists("DOMAIN") and equalsIgnoreCase(--CAT, DOMAIN) or
    equalsIgnoreCase(--CAT, --TERM) or equalsIgnoreCase(--CAT, --TESTCD) or equalsIgnoreCase(--CAT,
    --TRT) or equalsIgnoreCase(--CAT, --DECOD) or equalsIgnoreCase(--CAT, --BODSYS))
Outcome:
  Message: "--CAT value is redundant with other variable values."
  Output_Variables:
  - "DOMAIN"
  - "--TERM"
  - "--TESTCD"
  - "--TRT"
  - "--DECOD"
  - "--BODSYS"
Source:
  Message: "--CAT value is redundant with other variable values"
  Description: "Value of Category (--CAT) should not be identical to that in Domain\
    \ Abbreviation (DOMAIN); Reported Term (--TERM); Name of Measurement, Test, or\
    \ Examination (--TESTCD); Name of Treatment (--TRT); Standardized Coded Term (--DECOD);\
    \ Body System or Organ Class (--BODSYS)."
  Domains: "INTERVENTIONS, FINDINGS, EVENTS, FINDINGS ABOUT, TI"
  Severity: "Warning"
