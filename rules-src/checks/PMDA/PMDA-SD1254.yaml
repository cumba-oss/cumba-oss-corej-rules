Core:
  Id: "PMDA-SD1254"
  Status: "Published"
  Version: "1"
Description: "Raise an error when AEOUT in the AE dataset equals 'FATAL' but DTHFL\
  \ in the DM dataset does not equal 'Y' for the corresponding subject."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "DM"
Requirements:
  Variables:
    All:
    - "DTHFL"
    - "AE.AEOUT"
    - "USUBJID"
    All_Or_None:
    - - "USUBJID"
      - "AE.USUBJID"
Match_Datasets:
- Keys:
  - "USUBJID"
  Name: "AE"
Check:
  expression: >-
    AE.AEOUT == "FATAL" and DTHFL != "Y"
Outcome:
  Message: "DTHFL does not equal 'Y' when AEOUT in the AE dataset equals 'FATAL'."
Source:
  Message: "DTHFL does not equal 'Y' when AE.AEOUT = 'FATAL'"
  Description: "DTHFL must equal 'Y' when there is a record in the Adverse Events\
    \ (AE) domain with AEOUT = 'FATAL'."
  Domains: "AE"
  Severity: "Error"
Standards:
