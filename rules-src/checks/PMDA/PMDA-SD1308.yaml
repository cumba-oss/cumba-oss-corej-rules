Core:
  Id: "PMDA-SD1308"
  Status: "Published"
  Version: "1"
Description: "Raise a warning when a record exists in TS with TSPARMCD equal to 'ADDON'\
  \ and TSVAL equal to 'Y', but TSVAL is empty for the record where TSPARMCD equals\
  \ 'CURTRT'."
Severity: "Warning"
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "TS"
Requirements:
  Variables:
    All:
    - "TSPARMCD"
Bindings:
- name: "$ADDON_Y"
  expression: "record_count(group=[STUDYID], filter=(TSPARMCD == \"ADDON\" and TSVAL\
    \ == \"Y\"))"
Check:
  expression: >-
    TSPARMCD == "CURTRT" and $ADDON_Y >= 1 and empty(TSVAL)
Outcome:
  Message: "TSVAL is empty for the CURTRT Trial Summary Parameter when a record exists\
    \ with TSPARMCD equal to 'ADDON' and TSVAL equal to 'Y'."
  Message_Folded: "TSVAL absent or not populated in any record of the dataset, and\
    \ at least one record meets the rest of the condition: TSVAL is empty for the\
    \ CURTRT Trial Summary Parameter when a record exists with TSPARMCD equal to 'ADDON'\
    \ and TSVAL equal to 'Y'."
Source:
  Message: "TSVAL is missing for the CURTRT Trial Summary Parameter when ADDON parameter\
    \ equals 'Y'"
  Description: "When test product is added to existing treatment (TSPARMCD = 'ADDON'\
    \ and TSVAL = 'Y'), the Current Therapy or Treatment parameter should be provided\
    \ with Parameter Value populated (TSVAL should not be null when TSPARMCD = 'CURTRT')."
  Domains: "TS"
  Severity: "Warning"
