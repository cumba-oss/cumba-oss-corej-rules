Core:
  Id: "PMDA-SD2022"
  Status: "Published"
  Version: "1"
Description: "Raise a warning when Age Units (AGEU) is empty or not present while\
  \ Age (AGE) is populated or Age Range (AGETXT) is populated."
Severity: "Warning"
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "DM"
Check:
  expression: >-
    (not empty(AGE) or not empty(AGETXT)) and empty(AGEU)
Outcome:
  Message: "AGEU is empty when AGE or AGETXT is populated."
  Message_Folded: "AGE, AGETXT or AGEU absent or not populated in any record of the\
    \ dataset, and at least one record meets the rest of the condition: AGEU is empty\
    \ when AGE or AGETXT is populated."
Source:
  Message: "Missing value for AGEU when AGE or AGETXT is populated"
  Description: "Age Units (AGEU) variable values should be provided when Age (AGE)\
    \ or Age Range (AGETXT) variables values are populated."
  Domains: "DM"
  Severity: "Warning"
