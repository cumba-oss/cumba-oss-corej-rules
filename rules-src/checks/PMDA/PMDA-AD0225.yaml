Core:
  Id: "PMDA-AD0225"
  Status: "Published"
  Version: "1"
Description: "Raise a warning when Percent Change from Baseline (PCHG), Analysis Value\
  \ (AVAL) and Baseline Value (BASE) are all populated and BASE does not equal 0,\
  \ but PCHG does not equal (AVAL minus BASE) divided by BASE, expressed as a percentage.\
  \ The case where BASE equals 0 is handled separately by AD0225A."
Severity: "Warning"
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "BASIC DATA STRUCTURE"
    - "MEDICAL DEVICE BASIC DATA STRUCTURE"
Check:
  expression: >-
    not empty(PCHG) and not empty(AVAL) and not empty(BASE) and BASE != 0 and PCHG != (((AVAL -
    BASE) / BASE) * 100)
Outcome:
  Message: "PCHG does not equal (AVAL minus BASE) divided by BASE, expressed as a\
    \ percentage."
Source:
  Message: "Calculation issue: PCHG != (AVAL - BASE)/BASE * 100"
  Description: "When all 3 variables are populated and base <> 0, Percent Change from\
    \ Baseline (PCHG) must equal the difference of Analysis Value (AVAL) minus Baseline\
    \ Value (BASE) divided by the Baseline Value (BASE), expressed as a percentage.\
    \ AD0225A will raise errors when BASE = 0. AD0132B also complements this check."
  Domains: "BDS, ADNCA, MDBDS"
  Severity: "Warning"
Standards:
