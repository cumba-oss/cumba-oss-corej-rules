Core:
  Id: "PMDA-SD1216"
  Status: "Published"
  Version: "1"
Description: "Raise an error when the Trial Summary (TS) dataset contains more than\
  \ one record where TSPARMCD equals 'AGEMAX'."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "TS"
Bindings:
- name: "$agemax_count"
  expression: "record_count(filter=(TSPARMCD == \"AGEMAX\"))"
Check:
  expression: >-
    $agemax_count > 1
Outcome:
  Message: "Multiple AGEMAX records: the Trial Summary (TS) domain must contain only\
    \ one record for the 'AGEMAX' parameter."
Source:
  Message: "Multiple AGEMAX records"
  Description: "Trial Summary (TS) domain must contain only one record for 'AGEMAX'\
    \ Parameter."
  Domains: "TS"
  Severity: "Error"
