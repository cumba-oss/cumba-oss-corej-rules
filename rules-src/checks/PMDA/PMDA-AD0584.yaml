Core:
  Id: "PMDA-AD0584"
  Status: "Published"
  Version: "1"
Description: "Raise an error when, within a parameter, the Change to Baseline Category\
  \ y (BCHGCATy) variable does not hold a single consistent value for a given value\
  \ of the Change to Baseline Category y (N) (BCHGCAyN) variable, evaluated only over\
  \ the records where both BCHGCATy and BCHGCAyN are populated."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "BASIC DATA STRUCTURE"
    - "MEDICAL DEVICE BASIC DATA STRUCTURE"
Requirements:
  Variables:
    All:
    - "BCHGCATy"
Check:
  expression: >-
    var_exists("PARAMCD") and var_exists("BCHGCAyN") and not empty(BCHGCAyN) and not empty(BCHGCATy)
    and not empty(PARAMCD) and is_inconsistent_across_dataset(BCHGCATy, keys=[PARAMCD, BCHGCAyN])
Outcome:
  Message: "Inconsistent value for BCHGCATy within a unique PARAMCD."
  Output_Variables:
  - "PARAMCD"
  - "BCHGCATy"
  - "BCHGCAyN"
wildcards:
  "y":
    min: 1
    max: 99
Source:
  Message: "Inconsistent value for BCHGCATy within a unique PARAMCD"
  Description: "Within a parameter, there should be only a single value of Change\
    \ to Baseline Category y (BCHGCATy) variable for a given value of Change to Baseline\
    \ Category y (N) (BCHGCAyN) variable, considering only those rows on which both\
    \ variables are populated."
  Domains: "BDS, ADNCA, MDBDS, ADAMOTHER"
  Severity: "Error"
Standards:
- Organization: "PMDA"
  Standards:
  - Name: "ADaMIG"
    Version: "1.3"
    References:
    - Origin: "PMDA Validation Rules"
      Rule_Identifier:
        Id: "AD0584"
        Version: "1"
      Version: "6.0"
  - Name: "ADaMIG"
    Version: "1.2"
    References:
    - Origin: "PMDA Validation Rules"
      Rule_Identifier:
        Id: "AD0584"
        Version: "1"
      Version: "6.0"
