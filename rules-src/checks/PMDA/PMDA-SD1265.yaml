Core:
  Id: "PMDA-SD1265"
  Status: "Published"
  Version: "1"
Description: "Raise a warning when the Origin (QORIG) is equal to 'ASSIGNED', indicating\
  \ subjective data, but the Evaluator (QEVAL) is not populated."
Severity: "Warning"
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "SUPP--"
    - "SQ--"
Requirements:
  Variables:
    All:
    - "QORIG"
Check:
  expression: >-
    equalsIgnoreCase(QORIG, "ASSIGNED") and empty(QEVAL)
Outcome:
  Message: "QEVAL is empty when QORIG equals 'ASSIGNED'."
Source:
  Message: "QEVAL is null when QORIG equals 'ASSIGNED'"
  Description: "For subjective data (when QORIG='ASSIGNED'), QEVAL should be populated,\
    \ and the value should reflect the role of the person or institution assigning\
    \ the value."
  Domains: "SUPPQUAL"
  Severity: "Warning"
