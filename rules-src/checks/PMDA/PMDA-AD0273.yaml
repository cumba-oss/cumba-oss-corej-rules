Core:
  Id: "PMDA-AD0273"
  Status: "Published"
  Version: "1"
Description: "Raise an error when an additional 1st Occurrence Flag variable named\
  \ AOCCzzFL has a zz index that is not in the range 01 to 99; zz must be the nth\
  \ flag variable (01 to 99)."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "OCCURRENCE DATA STRUCTURE"
    - "MEDICAL DEVICE OCCURRENCE DATA STRUCTURE"
Check:
  expression: >-
    upper(varname()) =~ /^AOCC\\d\\dFL$/ and upper(varname()) !~ /^AOCC(0[1-9]|[1-9]\\d)FL$/
Outcome:
  Message: "Illegal variable name: zz is not in [01-99] for AOCCzzFL."
Source:
  Message: "Illegal variable name: zz is not in [01-99] for AOCCzzFL"
  Description: "For additional Flag (AOCCzzFL) variables representing the 1st Occurrence\
    \ of an analysis event or datapoint, zz must be nth flag variable (01 to 99).\
    \ The main purpose of these flags is to facilitate data point traceability between\
    \ records in the dataset and unique counts in the summary displays. In addition,\
    \ if a Time to Event (TTE) Analysis dataset is built off of Adverse Events, the\
    \ flags provide a crucial link between the summary records in the TTE BDS and\
    \ the source of the records in ADAE. If the producer of the ADAE dataset has standard\
    \ programs in place to summarize unique counts of events, then they may choose\
    \ not to create these flags."
  Domains: "OCCDS, ADAE, MDOCCDS"
  Severity: "Error"
