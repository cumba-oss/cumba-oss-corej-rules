Core:
  Id: "PMDA-SD0031"
  Status: "Published"
  Version: "1"
Description: "Raise a warning when an end timepoint (--ENDTC, --ENRF or --ENRTPT)\
  \ is populated but none of the related start timepoints (--STDTC, --STRF or --STRTPT)\
  \ is populated."
Severity: "Warning"
Executability: "Partially Executable - Possible Underreporting"
Scope:
  Classes:
    Include:
    - "INTERVENTIONS"
    - "EVENTS"
    - "SPECIAL PURPOSE"
  Domains:
    Exclude:
    - "CO"
    - "DM"
Requirements:
  Variables:
    Any:
    - "--STDTC"
    - "--STRF"
    - "--STRTPT"
Check:
  expression: >-
    (not empty(--ENDTC) or not empty(--ENRF) or not empty(--ENRTPT)) and empty(--STDTC) and
    empty(--STRF) and empty(--STRTPT)
Outcome:
  Message: "An end timepoint is populated but no start timepoint is populated."
  Output_Variables:
  - "--STDTC"
  - "--ENDTC"
  - "--STRF"
  - "--ENRF"
  - "--STRTPT"
  - "--ENRTPT"
Source:
  Message: "Missing values for --STDTC, --STRF and --STRTPT when --ENDTC, --ENRF or\
    \ --ENRTPT is provided"
  Description: "Start Date/Time of Observation (--STDTC), Start Relative to Reference\
    \ Period (--STRF) or Start Relative to Reference Time Point (--STRTPT) should\
    \ not be null when End Date/Time of Observation (--ENDTC), End Relative to Reference\
    \ Period (--ENRF) or End Relative to Reference Time Period (--ENRTPT) is not null."
  Domains: "SPECIAL PURPOSE (-CO, -DM), INTERVENTIONS, EVENTS"
  Severity: "Warning"
