Core:
  Id: "PMDA-SD0030"
  Status: "Published"
  Version: "1"
Description: "Raise a warning when Standard Units (--STRESU) is provided but Character\
  \ Result/Finding in Std Units (--STRESC) is empty."
Severity: "Warning"
Executability: "Fully Executable"
Scope:
  Classes:
    Include:
    - "FINDINGS"
    - "FINDINGS ABOUT"
Requirements:
  Variables:
    All:
    - "--STRESU"
Check:
  expression: >-
    not empty(--STRESU) and empty(--STRESC)
Outcome:
  Message: "--STRESC is empty when --STRESU is provided."
  Message_Folded: "--STRESC absent or not populated in any record of the dataset,\
    \ and at least one record meets the rest of the condition: --STRESC is empty when\
    \ --STRESU is provided."
Source:
  Message: "Missing value for --STRESC when --STRESU is provided"
  Description: "Character Result/Finding in Std Units (--STRESC) should not be null\
    \ when Standard Units (--STRESU) is provided."
  Domains: "FINDINGS, FINDINGS ABOUT"
  Severity: "Warning"
