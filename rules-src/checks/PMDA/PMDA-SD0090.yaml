Core:
  Id: "PMDA-SD0090"
  Status: "Published"
  Version: "1"
Description: "Raise a warning when AEOUT is equal to 'FATAL' but AESDTH is not equal\
  \ to 'Y'."
Severity: "Warning"
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "AE"
Requirements:
  Variables:
    All:
    - "AEOUT"
    - "AESDTH"
Check:
  expression: >-
    AEOUT == "FATAL" and AESDTH != "Y"
Outcome:
  Message: "AESDTH does not equal 'Y' when AEOUT equals 'FATAL'."
Source:
  Message: "AESDTH is not 'Y' when AEOUT='FATAL'"
  Description: "Results in Death (AESDTH) should equal 'Y' when Outcome of Adverse\
    \ Event (AEOUT) is 'FATAL'."
  Domains: "AE"
  Severity: "Warning"
