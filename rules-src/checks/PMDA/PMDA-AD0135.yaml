Core:
  Id: "PMDA-AD0135"
  Status: "Published"
  Version: "1"
Description: "Raise an error when the character Shift (SHIFTy) does not have a single\
  \ consistent value for each unique value of the numeric Shift (SHIFTyN), evaluated\
  \ on rows where both Parameter Code (PARAMCD) and the primary variable SHIFTy are\
  \ populated; within a study each SHIFTyN value must map to one SHIFTy value."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "BASIC DATA STRUCTURE"
Check:
  expression: >-
    not empty(PARAMCD) and not empty(SHIFTy) and has_multiple_values_for(SHIFTy, SHIFTyN,
    within=PARAMCD)
Outcome:
  Message: "Inconsistent value for SHIFTy"
  Output_Variables:
  - "PARAMCD"
  - "SHIFTy"
  - "SHIFTyN"
wildcards:
  "y":
    min: 1
    max: 9
Source:
  Message: "Inconsistent value for SHIFTy"
  Description: "Within a study, All SHIFTy values must be the same for each unique\
    \ value of SHIFTyN when PARAMCD and primary variable SHIFTy are populated."
  Domains: "BDS"
  Severity: "Error"
Standards:
- Organization: "PMDA"
  Standards:
  - Name: "ADaMIG"
    Version: "1.0"
    References:
    - Origin: "PMDA Validation Rules"
      Rule_Identifier:
        Id: "AD0135"
        Version: "1"
      Version: "6.0"
