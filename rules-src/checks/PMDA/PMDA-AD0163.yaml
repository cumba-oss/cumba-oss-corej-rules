Core:
  Id: "PMDA-AD0163"
  Status: "Published"
  Version: "1"
Description: "Raise an error when the Baseline Toxicity Grade (BTOXGR) variable is\
  \ present in the dataset but the Analysis Toxicity Grade (ATOXGR) variable is not\
  \ present; when BTOXGR is used, the analysis toxicity grade it is derived from must\
  \ also be present."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "BASIC DATA STRUCTURE"
    - "MEDICAL DEVICE BASIC DATA STRUCTURE"
Check:
  expression: >-
    var_exists("BTOXGR") and not var_exists("ATOXGR")
Outcome:
  Message: "BTOXGR is present, but ATOXGR is not present."
  Output_Variables:
  - "BTOXGR"
Source:
  Message: "BTOXGR is present, but ATOXGR is not present"
  Description: "If Baseline Toxicity Grade (BTOXGR) variable is present, then Analysis\
    \ Toxicity Grade (ATOXGR) and Baseline Record Flag (ABLFL) variables must be present."
  Domains: "BDS, ADNCA, MDBDS"
  Severity: "Error"
Standards:
- Organization: "PMDA"
  Standards:
