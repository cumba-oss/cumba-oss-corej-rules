Core:
  Id: "PMDA-SD1279"
  Status: "Published"
  Version: "1"
Description: "Raise a warning when ECDOSE is missing, ECOCCUR is not equal to 'N',\
  \ ECSTAT does not equal 'NOT DONE', and ECDOSTXT is empty."
Severity: "Warning"
Executability: "Partially Executable - Possible Underreporting"
Scope:
  Domains:
    Include:
    - "EC"
Requirements:
  Variables:
    All:
    - "ECDOSTXT"
Check:
  expression: >-
    empty(ECDOSE) and (not var_exists("ECOCCUR") or ECOCCUR != "N") and ECSTAT != "NOT DONE" and
    empty(ECDOSTXT)
Outcome:
  Message: "ECDOSTXT is empty when ECDOSE is missing, ECOCCUR does not equal 'N' and\
    \ ECSTAT does not equal 'NOT DONE'."
Source:
  Message: "ECDOSTXT is null when ECDOSE is null and ECOCCUR does not equal 'N'"
  Description: "Dose Description (ECDOSTXT) should be populated when Dose (ECDOSE)\
    \ is null, ECOCCUR does not equal 'N', and ECSTAT does not equal 'NOT DONE'."
  Domains: "EC"
  Severity: "Warning"
