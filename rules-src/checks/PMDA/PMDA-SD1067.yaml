Core:
  Id: "PMDA-SD1067"
  Status: "Published"
  Version: "1"
Description: "Raise a warning when RELTYPE is populated but USUBJID is also populated."
Severity: "Warning"
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "RELREC"
Check:
  expression: >-
    not empty(RELTYPE) and not empty(USUBJID)
Outcome:
  Message: "USUBJID is populated when RELTYPE is populated"
Source:
  Message: "USUBJID value is populated when RELTYPE values is populated"
  Description: "Unique Subject Identifier (USUBJID) variable value should not be populated\
    \ when Relationship Type (RELTYPE) variable value is populated."
  Domains: "RELREC"
  Severity: "Warning"
