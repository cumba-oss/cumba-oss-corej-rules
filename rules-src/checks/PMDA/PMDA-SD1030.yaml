Core:
  Id: "PMDA-SD1030"
  Status: "Published"
  Version: "1"
Description: "Raise a warning when Start Relative to Reference Period (--STRF) is\
  \ populated for a subject with an empty Reference Start Date/Time (RFSTDTC) in the\
  \ DM dataset."
Severity: "Warning"
Executability: "Fully Executable"
Scope:
  Classes:
    Include:
    - "SPECIAL PURPOSE"
    - "INTERVENTIONS"
    - "EVENTS"
    - "FINDINGS"
    - "FINDINGS ABOUT"
  Domains:
    Exclude:
    - "CO"
    - "DM"
Requirements:
  Variables:
    All:
    - "--STRF"
    - "USUBJID"
    All_Or_None:
    - - "USUBJID"
      - "DM.USUBJID"
Match_Datasets:
- Keys:
  - "USUBJID"
  Name: "DM"
Check:
  expression: >-
    empty(DM.RFSTDTC) and not empty(--STRF)
Outcome:
  Message: "--STRF is populated when RFSTDTC in the DM dataset is empty."
  Output_Variables:
  - "--STRF"
  - "DM.RFSTDTC"
Source:
  Message: "Value for --STRF is populated when RFSTDTC is null"
  Description: "Start Relative to Reference Period (--STRF) should not be populated\
    \ for subjects with missing value for Reference Start Date/Time (RFSTDTC)."
  Domains: "SPECIAL PURPOSE (-CO, -DM), INTERVENTIONS, FINDINGS, EVENTS, FINDINGS\
    \ ABOUT"
  Severity: "Warning"
