Core:
  Id: "PMDA-SD1361-A"
  Status: "Published"
  Version: "1"
Description: "Raise an error when Planned Arm Code (ARMCD) is populated but Description\
  \ of Planned Arm (ARM) is empty; both must be populated together."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "DM"
Requirements:
  Variables:
    All:
    - "ARMCD"
    - "ARM"
Check:
  expression: >-
    empty(ARM) and not empty(ARMCD)
Outcome:
  Message: "ARMCD is populated but ARM is empty."
Source_Proposed:
  Sheet_Issue: "#224"
  Message: "ARMCD is populated, but ARM is null"
  Description: "Description of Planned Arm (ARM) must be populated when Planned Arm\
    \ Code (ARMCD) is populated."
  Domains: "DM"
  Severity: "Error"
Source:
  Message: "ARM is populated, but ARMCD is null, or vice versa"
  Description: "Description of Planned Arm (ARM) must be populated when Planned Arm\
    \ Code (ARMCD) is populated, and vice versa."
  Domains: "DM"
  Severity: "Error"
