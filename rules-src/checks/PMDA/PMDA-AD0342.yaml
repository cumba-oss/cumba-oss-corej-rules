Core:
  Id: "PMDA-AD0342"
  Status: "Published"
  Version: "1"
Description: "Raise an error when, within a study and a parameter, the Analysis Normal\
  \ Range Lower Limit (ANRLO) variable does not have a single consistent value across\
  \ all records sharing the same combination of Parameter Code (PARAMCD) and a populated\
  \ Analysis Normal Range Lower Limit (C) (ANRLOC) value."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "BASIC DATA STRUCTURE"
    - "MEDICAL DEVICE BASIC DATA STRUCTURE"
Check:
  expression: >-
    var_exists("PARAMCD") and not empty(ANRLOC) and not empty(PARAMCD) and
    is_inconsistent_across_dataset(ANRLO, keys=[PARAMCD, ANRLOC])
Outcome:
  Message: "Inconsistent value for ANRLO within a unique ANRLOC."
Source:
  Message: "Inconsistent value for ANRLO"
  Description: "Within a Study and a Parameter, all Analysis Normal Range Lower Limit\
    \ (ANRLO) variable values must be the same for each unique value of Analysis Normal\
    \ Range Lower Limit (C) (ANRLOC) variable when variable ANRLOC is populated."
  Domains: "BDS, ADNCA, MDBDS"
  Severity: "Error"
Standards:
- Organization: "PMDA"
  Standards:
  - Name: "ADaMIG"
    Version: "1.3"
    References:
    - Origin: "PMDA Validation Rules"
      Rule_Identifier:
        Id: "AD0342"
        Version: "1"
      Version: "6.0"
  - Name: "ADaMIG"
