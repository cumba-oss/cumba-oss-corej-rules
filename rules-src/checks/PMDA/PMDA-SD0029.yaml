Core:
  Id: "PMDA-SD0029"
  Status: "Published"
  Version: "1"
Description: "Raise a warning when Standard Units (--STRESU) is empty while a numeric\
  \ Character Result/Finding in Std Format (--STRESC) is provided and Original Units\
  \ (--ORRESU) is populated."
Severity: "Warning"
Executability: "Partially Executable - Possible Underreporting"
Scope:
  Classes:
    Include:
    - "FINDINGS"
    - "FINDINGS ABOUT"
  Domains:
    Exclude:
    - "IE"
    - "QS"
    - "SC"
    - "SS"
Requirements:
  Variables:
    All:
    - "--STRESU"
    - "--STRESC"
    - "--ORRESU"
Check:
  expression: >-
    not empty(--STRESC) and --STRESC =~ /^-?[0-9]+(\\.[0-9]+)?$/ and not empty(--ORRESU) and
    empty(--STRESU)
Outcome:
  Message: "--STRESU is empty when a numeric --STRESC is provided and --ORRESU is\
    \ populated."
  Output_Variables:
  - "--STRESC"
  - "--ORRESU"
  - "!--STRESU"
Source:
  Message: "Missing value for --STRESU when --STRESC is provided"
  Description: "Standard Units (--STRESU) should not be null when Character Result/Finding\
    \ in Std Units (--STRESC) is provided as a numeric result."
  Domains: "FINDINGS (-IE, -QS, -SC, -SS), FINDINGS ABOUT"
  Severity: "Warning"
