Core:
  Id: "PMDA-AD0208"
  Status: "Published"
  Version: "1"
Description: "Raise an error when, for the same subject (USUBJID), the Subject Identifier\
  \ (SUBJID) in ADSL does not match the Subject Identifier (SUBJID) of the same subject\
  \ in the SDTM DM dataset; ADaM must be traceable to SDTM."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "SUBJECT LEVEL ANALYSIS DATASET"
Requirements:
  Variables:
    All:
    - "SUBJID"
    - "DM.SUBJID"
    - "USUBJID"
    All_Or_None:
    - - "USUBJID"
      - "DM.USUBJID"
Match_Datasets:
- Keys:
  - "USUBJID"
  Name: "DM"
Check:
  expression: >-
    not empty(SUBJID) and SUBJID != DM.SUBJID
Outcome:
  Message: "For the same USUBJID, the ADSL SUBJID does not equal the DM SUBJID."
  Output_Variables:
  - "SUBJID"
  - "DM.SUBJID"
Source:
  Message: "For the same USUBJID, the ADSL.SUBJID != DM.SUBJID"
  Description: "The same subject in ADSL and DM must have the same value for Subject\
    \ ID (SUBJID). There must be traceability between ADaM and SDTM."
  Domains: "ADSL"
  Severity: "Error"
Standards:
- Organization: "PMDA"
  Standards:
  - Name: "ADaMIG"
    Version: "1.3"
    References:
    - Origin: "PMDA Validation Rules"
      Rule_Identifier:
        Id: "AD0208"
        Version: "1"
      Version: "6.0"
  - Name: "ADaMIG"
    Version: "1.2"
    References:
    - Origin: "PMDA Validation Rules"
      Rule_Identifier:
        Id: "AD0208"
        Version: "1"
      Version: "6.0"
  - Name: "ADaMIG"
    Version: "1.1"
    References:
    - Origin: "PMDA Validation Rules"
      Rule_Identifier:
        Id: "AD0208"
        Version: "1"
      Version: "6.0"
  - Name: "ADaMIG"
    Version: "1.0"
    References:
    - Origin: "PMDA Validation Rules"
      Rule_Identifier:
        Id: "AD0208"
        Version: "1"
      Version: "6.0"
