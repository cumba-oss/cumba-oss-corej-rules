Core:
  Id: "PMDA-SD1052"
  Status: "Published"
  Version: "1"
Description: "Raise an error when TAETORD does not have a unique value for a given\
  \ value of ARMCD within the dataset."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "TA"
Requirements:
  Variables:
    All:
    - "TAETORD"
Check:
  expression: >-
    var_exists("ARMCD") and not is_unique_set([TAETORD, ARMCD])
Outcome:
  Message: "Non-unique value for TAETORD within ARMCD"
  Output_Variables:
  - "ARMCD"
  - "TAETORD"
Source:
  Message: "Non-unique value for TAETORD within ARMCD"
  Description: "Order of Element within Arm (TAETORD) must have a unique value for\
    \ a given value of Planned Arm Code (ARMCD) within the domain."
  Domains: "TA"
  Severity: "Error"
