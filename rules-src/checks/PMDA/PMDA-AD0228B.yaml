Core:
  Id: "PMDA-AD0228B"
  Status: "Published"
  Version: "1"
Description: "Raise an error when the Planned Sequence of Treatments (TRTSEQP) and\
  \ Planned Sequence of Treatments (N) (TRTSEQPN) are both populated and TRTSEQPN\
  \ does not have the same value across all records that share the same TRTSEQP; within\
  \ a study each TRTSEQP value must map to one TRTSEQPN value. Applies to the subject-level\
  \ and device-level analysis datasets."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "SUBJECT LEVEL ANALYSIS DATASET"
    - "DEVICE LEVEL ANALYSIS DATASET"
Check:
  expression: >-
    not empty(TRTSEQP) and not empty(TRTSEQPN) and is_inconsistent_across_dataset(TRTSEQPN,
    keys=[TRTSEQP])
Outcome:
  Message: "TRTSEQPN is not the same value across all records with the same TRTSEQP."
Source:
  Message: "Inconsistent value for TRTSEQPN"
  Description: "Within a study, all Planned Sequence of Treatments (N) (TRTSEQPN)\
    \ variable values must be the same for each unique value of Planned Sequence of\
    \ Treatments (TRTSEQP) when both variables are populated."
  Domains: "ADSL, ADDL"
  Severity: "Error"
Standards:
- Organization: "PMDA"
  Standards:
  - Name: "ADaMIG"
    Version: "1.3"
    References:
    - Origin: "PMDA Validation Rules"
      Rule_Identifier:
        Id: "AD0228B"
        Version: "1"
      Version: "6.0"
  - Name: "ADaMIG"
