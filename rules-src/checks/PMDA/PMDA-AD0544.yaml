Core:
  Id: "PMDA-AD0544"
  Status: "Published"
  Version: "1"
Description: "Raise an error when the Baseline Category y (N) (BASECAyN) variable\
  \ is present in a dataset but its corresponding Baseline Category y (BASECATy) variable\
  \ (sharing the same y index) is not present. BASECAyN cannot be present unless BASECATy\
  \ is also present."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "ALL"
Check:
  expression: >-
    var_exists("BASECAyN") and not var_exists("BASECATy")
Outcome:
  Message: "BASECAyN is present and BASECATy is not present."
  Output_Variables:
  - "BASECAyN"
wildcards:
  "y":
    min: 1
    max: 99
Source:
  Message: "BASECAyN is present and BASECATy is not present"
  Description: "If Baseline Category y (N) (BASECAyN) variable is used in a dataset,\
    \ Baseline Category y (BASECATy) variable must also be present in that dataset."
  Domains: "BDS, ADNCA, MDBDS, ADAMOTHER"
  Severity: "Error"
Standards:
- Organization: "PMDA"
  Standards:
  - Name: "ADaMIG"
    Version: "1.3"
    References:
    - Origin: "PMDA Validation Rules"
      Rule_Identifier:
        Id: "AD0544"
        Version: "1"
      Version: "6.0"
  - Name: "ADaMIG"
    Version: "1.2"
    References:
    - Origin: "PMDA Validation Rules"
      Rule_Identifier:
        Id: "AD0544"
        Version: "1"
      Version: "6.0"
  - Name: "ADaMIG"
    Version: "1.1"
