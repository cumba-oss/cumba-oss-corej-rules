Core:
  Id: "PMDA-SD9703"
  Status: "Published"
  Version: "1"
Description: "Raise an error when --PARMCD is not populated."
Severity: "Reject"
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "TS"
Requirements:
  Variables:
    All:
    - "--PARMCD"
Check:
  expression: >-
    empty(--PARMCD)
Outcome:
  Message: "The --PARMCD value is not populated."
  Message_Folded: "--PARMCD not populated in any record of the dataset: The --PARMCD\
    \ value is not populated."
Source_Proposed:
  Message: "Missing value for --PARMCD"
  Description: "--PARMCD should be populated."
  Domains: "TS"
  Severity: "Reject"
Source:
  Message: "Null value in variable marked as Required"
  Description: "Required variables (where Core attribute is 'Req') cannot be null\
    \ for any records."
  Domains: "ALL"
  Severity: "Reject"
