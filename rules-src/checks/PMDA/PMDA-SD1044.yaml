Core:
  Id: "PMDA-SD1044"
  Status: "Published"
  Version: "1"
Description: "Raise a warning when Baseline Flag (--BLFL) is not present in a custom\
  \ Findings-class domain. --BLFL should be present in all custom Findings domains."
Severity: "Warning"
Executability: "Fully Executable"
Scope:
  Classes:
    Include:
    - "FINDINGS"
Bindings:
- name: "$domain_is_custom"
  expression: "domain_is_custom()"
Check:
  expression: >-
    $domain_is_custom == true and not var_exists("--BLFL")
Outcome:
  Message: "--BLFL variable is not present in a custom Findings domain."
  Output_Variables:
  - "$domain_is_custom"
Source:
  Message: "No --BLFL variable in custom Findings domain"
  Description: "Baseline Flag (--BLFL) should be present in all custom Findings domains."
  Domains: "FINDINGS"
  Severity: "Warning"
