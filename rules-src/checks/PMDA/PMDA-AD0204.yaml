Core:
  Id: "PMDA-AD0204"
  Status: "Published"
  Version: "1"
Description: "Raise an error when, for the same subject (USUBJID), the Age (AGE) value\
  \ in ADSL is populated and differs from the Age (AGE) value in DM. There must be\
  \ traceability between ADaM and SDTM."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "SUBJECT LEVEL ANALYSIS DATASET"
Requirements:
  Variables:
    All:
    - "AGE"
    - "DM.AGE"
    - "USUBJID"
    All_Or_None:
    - - "USUBJID"
      - "DM.USUBJID"
Match_Datasets:
- Keys:
  - "USUBJID"
  Name: "DM"
Check:
  expression: >-
    not empty(AGE) and AGE != DM.AGE
Outcome:
  Message: "ADSL.AGE does not match DM.AGE for the same subject (USUBJID)."
Source:
  Message: "For the same USUBJID, the ADSL.AGE != DM.AGE"
  Description: "The same subject in ADSL and DM must have the same value for Age (AGE).\
    \ There must be traceability between ADaM and SDTM."
  Domains: "ADSL"
  Severity: "Error"
Standards:
- Organization: "PMDA"
  Standards:
  - Name: "ADaMIG"
    Version: "1.3"
    References:
    - Origin: "PMDA Validation Rules"
      Rule_Identifier:
        Id: "AD0204"
        Version: "1"
      Version: "6.0"
  - Name: "ADaMIG"
    Version: "1.2"
    References:
    - Origin: "PMDA Validation Rules"
      Rule_Identifier:
        Id: "AD0204"
        Version: "1"
      Version: "6.0"
  - Name: "ADaMIG"
    Version: "1.1"
    References:
    - Origin: "PMDA Validation Rules"
      Rule_Identifier:
        Id: "AD0204"
        Version: "1"
      Version: "6.0"
  - Name: "ADaMIG"
    Version: "1.0"
    References:
    - Origin: "PMDA Validation Rules"
      Rule_Identifier:
        Id: "AD0204"
        Version: "1"
      Version: "6.0"
