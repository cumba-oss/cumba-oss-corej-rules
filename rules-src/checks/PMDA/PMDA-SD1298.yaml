Core:
  Id: "PMDA-SD1298"
  Status: "Published"
  Version: "1"
Description: "Raise a warning when LBTOXGR is populated but does not contain only\
  \ a numeric (integer) value."
Severity: "Warning"
Executability: "Partially Executable - Possible Overreporting"
Scope:
  Domains:
    Include:
    - "LB"
Requirements:
  Variables:
    All:
    - "LBTOXGR"
Check:
  expression: >-
    not empty(LBTOXGR) and LBTOXGR !~ /^[0-9]+$/
Outcome:
  Message: "LBTOXGR is not a numeric value when a numeric scale is used."
Source:
  Message: "LBTOXGR is not a numeric value when a numeric scale is used"
  Description: "If LBTOXGR value is from a numeric scale, represent only the number\
    \ (e.g., \"2\" and not \"Grade 2\")."
  Domains: "LB"
  Severity: "Warning"
