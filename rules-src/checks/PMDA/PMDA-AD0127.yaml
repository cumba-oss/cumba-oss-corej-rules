Core:
  Id: "PMDA-AD0127"
  Status: "Published"
  Version: "1"
Description: "Raise an error when, within a given value of USUBJID and PARAMCD, BASE\
  \ or BASEC is populated on a record but no record in that group carries ABLFL equal\
  \ to Y (there is no baseline record to which the reported baseline value can be\
  \ traced)."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "BASIC DATA STRUCTURE"
Grouping:
  Variables:
  - "USUBJID"
  - "PARAMCD"
Operations:
- id: "$ablfl_y_count"
  expression: "record_count(ABLFL, group=[USUBJID, PARAMCD], filter=filter(ABLFL=\"\
    Y\"))"
Check:
  expression: >-
    (not empty(BASE) or not empty(BASEC)) and $ablfl_y_count == 0
Outcome:
  Message: "Within a given value of USUBJID and PARAMCD, BASE or BASEC is populated\
    \ and there is not at least one record with ABLFL equal to Y."
  Output_Variables:
  - "PARAMCD"
  - "BASE"
  - "BASEC"
  - "ABLFL"
Source:
  Message: "BASE or BASEC is populated for a unique USUBJID, PARAMCD, but no baseline\
    \ record exists"
  Description: "Within a given Subject's PARAMCD, a baseline value is populated (either\
    \ BASE or BASEC) and there is not at least one record in that group marked as\
    \ the baseline (ABLFL = Y)."
  Domains: "BDS, ADNCA"
  Severity: "Error"
Standards:
- Organization: "PMDA"
  Standards:
  - Name: "ADaMIG"
    Version: "1.0"
    References:
