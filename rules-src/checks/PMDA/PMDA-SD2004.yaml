Core:
  Id: "PMDA-SD2004"
  Status: "Published"
  Version: "1"
Description: "Raise an error when Date/Time of Death (DTHDTC) is populated but Subject\
  \ Death Flag (DTHFL) is not equal to 'Y'."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "DM"
Requirements:
  Variables:
    All:
    - "DTHFL"
Check:
  expression: >-
    not empty(DTHDTC) and DTHFL != "Y"
Outcome:
  Message: "DTHFL does not equal 'Y' when DTHDTC is populated."
Source:
  Message: "Missing value for DTHFL when DTHDTC is populated"
  Description: "Subject Death Flag (DTHFL) value must equal 'Y' when Date/Time of\
    \ Death (DTHDTC) is provided."
  Domains: "DM"
  Severity: "Error"
