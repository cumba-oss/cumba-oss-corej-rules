Core:
  Id: "PMDA-SD2243"
  Status: "Published"
  Version: "1"
Description: "Raise a warning when TSVCDREF is neither 'MED-RT' nor 'NDF-RT' for a\
  \ record where TSPARMCD equals 'PCLAS' (Pharmacological Class)."
Severity: "Warning"
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "TS"
Requirements:
  Variables:
    All:
    - "TSPARMCD"
    - "TSVCDREF"
Check:
  expression: >-
    TSPARMCD == "PCLAS" and TSVCDREF not in ["MED-RT", "NDF-RT"]
Outcome:
  Message: "Invalid TSVCDREF value for PCLAS: TSVCDREF must be either 'MED-RT' or\
    \ 'NDF-RT' when TSPARMCD equals 'PCLAS'."
Source:
  Message: "Invalid TSVCDREF value for PCLAS"
  Description: "TSVCDREF variable value must be either 'MED-RT' or 'NDF-RT' when TSPARMCD='PCLAS'.\
    \ (Note: Any version 2018-02-05 or earlier is NDF-RT, and any version after is\
    \ MED-RT)."
  Domains: "TS"
  Severity: "Warning"
