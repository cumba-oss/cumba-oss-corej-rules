Core:
  Id: "PMDA-AD0012"
  Status: "Published"
  Version: "1"
Description: "Raise an error when a Flag Numeric (*FN) variable is populated but its\
  \ corresponding Flag Character (*FL) variable (sharing the same name root) is not\
  \ populated."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "SUBJECT LEVEL ANALYSIS DATASET"
    - "BASIC DATA STRUCTURE"
    - "OCCURRENCE DATA STRUCTURE"
    - "DEVICE LEVEL ANALYSIS DATASET"
    - "MEDICAL DEVICE BASIC DATA STRUCTURE"
    - "MEDICAL DEVICE OCCURRENCE DATA STRUCTURE"
Check:
  expression: >-
    not empty(*FN) and empty(*FL)
Outcome:
  Message: "A Flag Numeric (*FN) variable is populated, but its corresponding Flag\
    \ Character (*FL) variable is not populated."
  Output_Variables:
  - "*FN"
  - "*FL"
Source:
  Message: "Secondary variable *FN is populated, but its primary variable *FL is not\
    \ populated"
  Description: "When a numeric Flag variable (*FN) is populated, its corresponding\
    \ character Flag variable (*FL) must be populated."
  Domains: "ADSL, ADDL, BDS, ADNCA, MDBDS, OCCDS, ADAE, MDOCCDS, ADAMOTHER"
  Severity: "Error"
Standards:
- Organization: "PMDA"
  Standards:
  - Name: "ADaMIG"
    Version: "1.3"
    References:
    - Origin: "PMDA Validation Rules"
      Rule_Identifier:
        Id: "AD0012"
        Version: "1"
      Version: "6.0"
  - Name: "ADaMIG"
    Version: "1.2"
    References:
    - Origin: "PMDA Validation Rules"
      Rule_Identifier:
        Id: "AD0012"
        Version: "1"
      Version: "6.0"
  - Name: "ADaMIG"
    Version: "1.1"
