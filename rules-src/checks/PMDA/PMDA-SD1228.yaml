Core:
  Id: "PMDA-SD1228"
  Status: "Published"
  Version: "1"
Description: "Raise a warning when a value is not a term in the user-defined value-level\
  \ codelist (Define-XML ValueListDef / WhereClauseDef) that applies to the record."
Severity: "Warning"
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "ALL"
Check:
  expression: >-
    not empty(value()) and vlm_has_codelist(variable_name) == true and value() not in
    vlm_codelist_coded_values(variable_name)
Outcome:
  Message: "The value is not in the value-level codelist declared in the Define-XML."
Source:
  Message: "Variable value not found in user-defined codelist when value-level condition\
    \ occurs"
  Description: "Variable value must be populated with terms from user-defined value\
    \ level codelist as specified in define.xml file."
  Domains: "ALL"
  Severity: "Warning"
