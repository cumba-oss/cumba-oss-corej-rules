Core:
  Id: "PMDA-SD1362"
  Status: "Published"
  Version: "1"
Description: "Raise an error when Description of Actual Arm (ACTARM) is populated\
  \ but Actual Arm Code (ACTARMCD) is empty; both must be populated together."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "DM"
Requirements:
  Variables:
    All:
    - "ACTARMCD"
    - "ACTARM"
Check:
  expression: >-
    empty(ACTARMCD) and not empty(ACTARM)
Outcome:
  Message: "ACTARM is populated but ACTARMCD is empty."
Source:
  Message: "ACTARM is populated, but ACTARMCD is null, or vice versa"
  Description: "Description of Actual Arm (ACTARM) must be populated when Actual Arm\
    \ Code (ACTARMCD) is populated, and vice versa."
  Domains: "DM"
  Severity: "Error"
