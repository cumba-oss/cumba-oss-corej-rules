Core:
  Id: "PMDA-SD1116"
  Status: "Published"
  Version: "1"
Description: "Raise a warning when a variable that appears in more than one split\
  \ dataset of the same class is defined with inconsistent lengths across those split\
  \ datasets."
Severity: "Warning"
Executability: "Fully Executable"
Scope:
  Classes:
    Include:
    - "INTERVENTIONS"
    - "FINDINGS"
    - "EVENTS"
    - "FINDINGS ABOUT"
Bindings:
- name: "$len_mismatch"
  expression: "split_sibling_length_mismatch()"
Check:
  expression: >-
    upper(varname()) in $len_mismatch
Outcome:
  Message: "Variable length is inconsistent across split datasets of the same class."
Source:
  Message: "Inconsistent variable length within split datasets"
  Description: "Split datasets should have matching variable lengths for future mergers.\
    \ Datasets should be resized to the maximum length used prior to splitting."
  Domains: "INTERVENTIONS, FINDINGS, EVENTS, FINDINGS ABOUT"
  Severity: "Warning"
