Core:
  Id: "PMDA-AD0006B"
  Status: "Published"
  Version: "1"
Description: "Raise an error when a variable whose name ends in 'FN' (a numeric flag)\
  \ has a value other than 0, 1 or missing. Exceptions (allowed other values): ABLFN,\
  \ ANLzzFN. Applies across the subject-level, basic-data-structure, occurrence and\
  \ medical-device ADaM structures."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "SUBJECT LEVEL ANALYSIS DATASET"
    - "BASIC DATA STRUCTURE"
    - "OCCURRENCE DATA STRUCTURE"
    - "DEVICE LEVEL ANALYSIS DATASET"
    - "MEDICAL DEVICE BASIC DATA STRUCTURE"
    - "MEDICAL DEVICE OCCURRENCE DATA STRUCTURE"
Check:
  expression: >-
    ends_with(upper(varname()), "FN") and upper(varname()) !~ /^(ABLFN|ANL(0[1-9]|[1-9][0-9])FN)$/
    and not empty(value()) and value() not in [0, 1]
Outcome:
  Message: "A variable whose name ends in 'FN' has a value that is not 0, 1 or missing."
Source:
  Message: "*FN value is not 0, 1 or null"
  Description: "A variable with a suffix of FN has a value that is not 0, 1, or null\
    \ (Exception: ABLFN, ANLzzFN, and numeric population flags COMPLFN, FASFN, ITTFN,\
    \ PPROTFN, SAFFN, RANDFN, ENRLFN cannot be null and at least 1 must be included\
    \ in ADSL)."
  Domains: "ADSL, ADDL, BDS, ADNCA, MDBDS, OCCDS, ADAE, MDOCCDS, ADAMOTHER"
  Severity: "Error"
Standards:
- Organization: "PMDA"
  Standards:
  - Name: "ADaMIG"
    Version: "1.3"
    References:
    - Origin: "PMDA Validation Rules"
      Rule_Identifier:
        Id: "AD0006B"
        Version: "1"
      Version: "6.0"
  - Name: "ADaMIG"
    Version: "1.2"
    References:
    - Origin: "PMDA Validation Rules"
      Rule_Identifier:
        Id: "AD0006B"
        Version: "1"
      Version: "6.0"
