Core:
  Id: "PMDA-SD2216"
  Status: "Published"
  Version: "1"
Description: "Raise a warning when ADDON is 'Y' and the Trial Summary (TS) dataset\
  \ does not contain a record where TSPARMCD equals 'CURTRT' (Current Therapy or Treatment)."
Severity: "Warning"
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "TS"
Bindings:
- name: "$addon_y_count"
  expression: "record_count(filter=(TSPARMCD == \"ADDON\" and TSVAL == \"Y\"))"
- name: "$curtrt_count"
  expression: "record_count(filter=(TSPARMCD == \"CURTRT\"))"
Check:
  expression: >-
    $addon_y_count >= 1 and $curtrt_count == 0
Outcome:
  Message: "Missing CURTRT Trial Summary Parameter: a 'Current Therapy or Treatment'\
    \ (CURTRT) record must be present in the Trial Summary (TS) domain."
Source:
  Message: "Missing CURTRT Trial Summary Parameter"
  Description: "'Current Therapy or Treatment' (CURTRT) record must be populated in\
    \ Trial Summary (TS) domain when ADDON is 'Y'. It is expected for SDTM IG v3.1.2\
    \ data and required for data in all more recent SDTM versions."
  Domains: "TS"
  Severity: "Warning"
