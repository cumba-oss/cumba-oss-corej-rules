Core:
  Id: "PMDA-SD1125"
  Status: "Published"
  Version: "1"
Description: "Raise a warning when --TPT and --ELTM are populated but --ELTM does\
  \ not have the same value across records that share the same value of Planned Time\
  \ Point Name (--TPT), Time Point Reference (--TPTREF), and/or Visit Number (VISITNUM)."
Severity: "Warning"
Executability: "Fully Executable"
Scope:
  Classes:
    Include:
    - "INTERVENTIONS"
    - "EVENTS"
    - "FINDINGS"
    - "FINDINGS ABOUT"
  Domains:
    Exclude:
    - "DO"
Check:
  expression: >-
    is_inconsistent_across_dataset(--ELTM, keys=[VISITNUM, --TPTREF, --TPT])
Outcome:
  Message: "Inconsistent value for --ELTM: it is not the same value across records\
    \ with the same --TPT, --TPTREF, and/or VISITNUM."
Source:
  Message: "Inconsistent value for --ELTM within --TPT, --TPTREF and/or VISITNUM"
  Description: "All values of Planned Elapsed Time (--ELTM) variable should be the\
    \ same for a given value of Planned Time Point Name (--TPT) variable, Time Point\
    \ Reference (--TPTREF) and/or Visit Number (VISITNUM)."
  Domains: "CO, INTERVENTIONS, FINDINGS (-DO), EVENTS, FINDINGS ABOUT"
  Severity: "Warning"
