Core:
  Id: "PMDA-AD0011"
  Status: "Published"
  Version: "1"
Description: "Raise an error when a Flag Character (*FL) variable has the value 'N'\
  \ but its corresponding Flag Numeric (*FN) variable (sharing the same name root)\
  \ is not 0."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "SUBJECT LEVEL ANALYSIS DATASET"
    - "BASIC DATA STRUCTURE"
    - "OCCURRENCE DATA STRUCTURE"
    - "DEVICE LEVEL ANALYSIS DATASET"
    - "MEDICAL DEVICE BASIC DATA STRUCTURE"
    - "MEDICAL DEVICE OCCURRENCE DATA STRUCTURE"
Check:
  expression: >-
    *FL == "N" and var_exists(*FN) and *FN != 0
Outcome:
  Message: "A Flag Character (*FL) variable is 'N' but its corresponding Flag Numeric\
    \ (*FN) variable is not 0."
  Output_Variables:
  - "*FL"
  - "*FN"
Source:
  Message: "*FL = N and *FN != 0"
  Description: "When a Flag variable (FL) is N, its corresponding Flag numeric variable\
    \ (FN) must be 0."
  Domains: "ADSL, ADDL, BDS, ADNCA, MDBDS, OCCDS, ADAE, MDOCCDS, ADAMOTHER"
  Severity: "Error"
Standards:
- Organization: "PMDA"
  Standards:
  - Name: "ADaMIG"
    Version: "1.3"
    References:
