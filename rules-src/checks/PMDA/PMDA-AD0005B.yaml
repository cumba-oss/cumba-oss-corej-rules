Core:
  Id: "PMDA-AD0005B"
  Status: "Published"
  Version: "1"
Description: "Raise an error when a variable whose name ends in 'FL' has a value other\
  \ than Y, N or empty. Exceptions (allowed other values): ABLFL, ANLzzFL. Applies\
  \ across the subject-level, basic-data-structure, occurrence and medical-device\
  \ ADaM structures."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "SUBJECT LEVEL ANALYSIS DATASET"
    - "BASIC DATA STRUCTURE"
    - "OCCURRENCE DATA STRUCTURE"
    - "DEVICE LEVEL ANALYSIS DATASET"
    - "MEDICAL DEVICE BASIC DATA STRUCTURE"
    - "MEDICAL DEVICE OCCURRENCE DATA STRUCTURE"
Check:
  expression: >-
    ends_with(upper(varname()), "FL") and upper(varname()) !~ /^(ABLFL|ANL(0[1-9]|[1-9][0-9])FL)$/
    and not empty(value()) and value() not in ["Y", "N"]
Outcome:
  Message: "A variable whose name ends in 'FL' has a value that is not Y, N or empty."
  Output_Variables:
  - "variable_value"
Source:
  Message: "*FL value is not Y, N or null"
  Description: "A variable with a suffix of FL must have value that is Y, N or null\
    \ (Exception 1: ABLFL, ANLzzFL. Exception 2: Population flags COMPLFL, FASFL,\
    \ ITTFL, PPROTFL, SAFFL, RANDFL, ENRLFL cannot be null and at least 1 must be\
    \ included in ADSL)."
  Domains: "ADSL, ADDL, BDS, ADNCA, MDBDS, OCCDS, ADAE, MDOCCDS, ADAMOTHER"
  Severity: "Error"
Standards:
- Organization: "PMDA"
  Standards:
  - Name: "ADaMIG"
    Version: "1.3"
    References:
    - Origin: "PMDA Validation Rules"
      Rule_Identifier:
        Id: "AD0005B"
        Version: "1"
      Version: "6.0"
  - Name: "ADaMIG"
    Version: "1.2"
    References:
    - Origin: "PMDA Validation Rules"
      Rule_Identifier:
        Id: "AD0005B"
        Version: "1"
      Version: "6.0"
