Core:
  Id: "PMDA-SD2003"
  Status: "Published"
  Version: "1"
Description: "Raise an error when Description of Actual Arm (ACTARM) is populated\
  \ and its value does not match an Arm (ARM) entry in the Trial Arms (TA) dataset.\
  \ Subjects who failed screening ('Screen Failure'), were not assigned to an Arm\
  \ ('Not Assigned'), were randomized but not treated ('Not Treated'), or received\
  \ non-planned treatment ('Unplanned Treatment') are expected exceptions and are\
  \ excluded from the check."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "DM"
Requirements:
  Variables:
    All:
    - "ACTARM"
Bindings:
- name: "$ta_arm"
  expression: "distinct(ARM, domain=\"TA\")"
Check:
  expression: >-
    not empty(ACTARM) and ACTARM not in $ta_arm and upper(ACTARM) not in ["SCREEN FAILURE",
    "NOT ASSIGNED", "NOT TREATED", "UNPLANNED TREATMENT"]
Outcome:
  Message: "ACTARM is not among the values of ARM in the TA dataset."
  Output_Variables:
  - "$ta_arm"
Source:
  Message: "Invalid value for ACTARM"
  Description: "Description of Actual Arm (ACTARM) values should match entries in\
    \ the Trial Arms (TA) dataset, except for subjects who failed screening ('Screen\
    \ Failure'), or were not fully assigned to an Arm ('Not Assigned'), or randomized,\
    \ but not treated ('Not Treated') or received non-planned treatment ('Unplanned\
    \ Treatment')."
  Domains: "DM"
  Severity: "Error"
