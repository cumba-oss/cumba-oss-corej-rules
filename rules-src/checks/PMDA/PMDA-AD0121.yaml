Core:
  Id: "PMDA-AD0121"
  Status: "Published"
  Version: "1"
Description: "Raise an error when a variable whose name ends in SDT (Start Date) is\
  \ populated together with its corresponding EDT (End Date) variable and the SDT\
  \ value is greater than the EDT value (e.g. TRTSDT/TRTEDT, TR01SDT/TR01EDT, AP01SDT/AP01EDT,\
  \ APERSDT/APEREDT)."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "SUBJECT LEVEL ANALYSIS DATASET"
    - "DEVICE LEVEL ANALYSIS DATASET"
    - "BASIC DATA STRUCTURE"
    - "MEDICAL DEVICE BASIC DATA STRUCTURE"
    - "OCCURRENCE DATA STRUCTURE"
    - "MEDICAL DEVICE OCCURRENCE DATA STRUCTURE"
Check:
  expression: >-
    not empty(*SDT) and not empty(*EDT) and *SDT > *EDT
Outcome:
  Message: "A variable whose name ends in SDT (Start Date) is greater than its corresponding\
    \ EDT (End Date) variable."
  Output_Variables:
  - "*SDT"
  - "*EDT"
Source:
  Message: "*SDT is greater than *EDT"
  Description: "Any variable ending in SDT (Start Date) must have a value less than\
    \ or equal to its corresponding EDT (End Date) value (e.g., ADSL - TRTSDT, TR01SDT,\
    \ AP01SDT; BDS - APERSDT)."
  Domains: "ADSL, ADDL, BDS, ADNCA, MDBDS, OCCDS, ADAE, MDOCCDS, ADAMOTHER"
  Severity: "Error"
Standards:
- Organization: "PMDA"
  Standards:
