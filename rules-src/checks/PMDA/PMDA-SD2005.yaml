Core:
  Id: "PMDA-SD2005"
  Status: "Published"
  Version: "1"
Description: "Raise a warning when the subject died (DTHFL equals 'Y') but the Date/Time\
  \ of Death (DTHDTC) is not populated."
Severity: "Warning"
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "DM"
Requirements:
  Variables:
    All:
    - "DTHFL"
Check:
  expression: >-
    DTHFL == "Y" and empty(DTHDTC)
Outcome:
  Message: "DTHDTC is empty when DTHFL equals 'Y'."
  Message_Folded: "DTHDTC absent or not populated in any record of the dataset, and\
    \ at least one record meets the rest of the condition: DTHDTC is empty when DTHFL\
    \ equals 'Y'."
Source:
  Message: "Missing value for DTHDTC when DTHFL is populated"
  Description: "Date/Time of Death (DTHDTC) should be provided when subject died (DTHFL=Y)."
  Domains: "DM"
  Severity: "Warning"
