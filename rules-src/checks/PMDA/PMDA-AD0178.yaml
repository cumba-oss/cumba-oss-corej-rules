Core:
  Id: "PMDA-AD0178"
  Status: "Published"
  Version: "1"
Description: "Raise an error when a variable of the form ANLzzFL (Analysis Record\
  \ Flag, where zz is a two-digit number) has a value other than Y or empty."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "ALL"
Check:
  expression: >-
    upper(varname()) =~ /^ANL(0[1-9]|[1-9][0-9])FL$/ and not empty(value()) and value() not in ["Y"]
Outcome:
  Message: "ANLzzFL value is not Y or empty"
  Output_Variables:
  - "variable_name"
  - "variable_value"
Source:
  Message: "ANLzzFL value is not Y or null"
  Description: "A variable of form ANLzzFL (analysis record flag) must be Y or null."
  Domains: "BDS, ADNCA, MDBDS, OCCDS, ADAE, MDOCCDS, ADAMOTHER"
  Severity: "Error"
