Core:
  Id: "PMDA-AD0007"
  Status: "Published"
  Version: "1"
Description: "Raise an error when a Flag Numeric (*FN) variable is present in a dataset\
  \ but its corresponding Flag Character (*FL) variable (sharing the same name root)\
  \ is not present. Every *FN must be accompanied by its primary *FL."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "SUBJECT LEVEL ANALYSIS DATASET"
    - "BASIC DATA STRUCTURE"
    - "OCCURRENCE DATA STRUCTURE"
    - "DEVICE LEVEL ANALYSIS DATASET"
    - "MEDICAL DEVICE BASIC DATA STRUCTURE"
    - "MEDICAL DEVICE OCCURRENCE DATA STRUCTURE"
Check:
  expression: >-
    var_exists(*FN) and not var_exists(*FL)
Outcome:
  Message: "A Flag Numeric (*FN) variable is present, but its corresponding Flag Character\
    \ (*FL) variable is not present."
Source:
  Message: "Secondary variable *FN is present, but its primary variable *FL is not\
    \ present"
  Description: "If a Flag Numeric (*FN) variable is present, its corresponding Flag\
    \ Character (*FL) variable must be present."
  Domains: "ADSL, ADDL, BDS, ADNCA, MDBDS, OCCDS, ADAE, MDOCCDS, ADAMOTHER"
  Severity: "Error"
Standards:
- Organization: "PMDA"
  Standards:
