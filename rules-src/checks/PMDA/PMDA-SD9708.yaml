Core:
  Id: "PMDA-SD9708"
  Status: "Published"
  Version: "1"
Description: "Raise an error when IETESTCD is not populated."
Severity: "Reject"
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "TI"
Requirements:
  Variables:
    All:
    - "IETESTCD"
Check:
  expression: >-
    empty(IETESTCD)
Outcome:
  Message: "IETESTCD is empty."
  Message_Folded: "IETESTCD not populated in any record of the dataset: IETESTCD is\
    \ empty."
Source_Proposed:
  Message: "Missing value for IETESTCD"
  Description: "IETESTCD should be populated."
  Domains: "TI"
  Severity: "Reject"
Source:
  Message: "Null value in variable marked as Required"
  Description: "Required variables (where Core attribute is 'Req') cannot be null\
    \ for any records."
  Domains: "ALL"
  Severity: "Reject"
