Core:
  Id: "PMDA-SD1078"
  Status: "Published"
  Version: "1"
Description: "Raise a warning when a Permissible variable is present in the dataset\
  \ but empty for all records."
Severity: "Warning"
Executability: "Partially Executable - Possible Underreporting"
Scope:
  Domains:
    Include:
    - "ALL"
Bindings:
- name: "$permissible_variables"
  expression: "get_dataset_filtered_variables(key_name=\"core\", key_value=\"Perm\"\
    )"
Check:
  expression: >-
    upper(varname()) in $permissible_variables and var_is_null(varname())
Outcome:
  Message: "A Permissible variable is present in the dataset but empty for all records."
  Output_Variables:
  - "variable_name"
Source:
  Message: "Permissible variable with missing value for all records"
  Description: "Permissible variable should not be present in domain, when the variable\
    \ has missing value for all records in the dataset (SDTM-IG 3.1.1 - 3.2). Permissible\
    \ variable should not be present in domain, when the variable is not present on\
    \ study CRFs (SDTM-IG 3.3 and higher)."
  Domains: "ALL"
  Severity: "Warning"
