Core:
  Id: "PMDA-SD0047"
  Status: "Published"
  Version: "1"
Description: "Raise a warning when --ORRES is empty and --STAT is not present or empty\
  \ and --DRVFL is not present or not equal to 'Y'."
Severity: "Warning"
Executability: "Fully Executable"
Scope:
  Classes:
    Include:
    - "FINDINGS"
    - "FINDINGS ABOUT"
Requirements:
  Variables:
    All:
    - "--ORRES"
Check:
  expression: >-
    (not var_exists("--STAT") or --STAT != "NOT DONE") and (not var_exists("--DRVFL") or --DRVFL !=
    "Y") and empty(--ORRES)
Outcome:
  Message: "--ORRES is empty when --STAT or --DRVFL is not populated."
  Output_Variables:
  - "!--ORRES"
Source:
  Message: "Missing value for --ORRES when --STAT or --DRVFL is not populated"
  Description: "Status (--STAT) should be set to 'NOT DONE' or Derived Flag (--DRVFL)\
    \ should have a value of 'Y' when Result or Finding in Original Units (--ORRES)\
    \ is null."
  Domains: "FINDINGS, FINDINGS ABOUT"
  Severity: "Warning"
