Core:
  Id: "PMDA-AD0648"
  Status: "Published"
  Version: "1"
Description: "Raise an error when a Treatment Emergent Analysis w Flag (TRTEMwFL)\
  \ is 'Y' on a record whose overall Treatment Emergent Analysis Flag (TRTEMFL) is\
  \ not 'Y'. If any TRTEMwFL is flagged Y, the overall TRTEMFL must also be Y."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "OCCURRENCE DATA STRUCTURE"
    - "MEDICAL DEVICE OCCURRENCE DATA STRUCTURE"
Requirements:
  Variables:
    All:
    - "TRTEMFL"
Check:
  expression: >-
    upper(varname()) =~ /^TRTEM[1-9]FL$/ and value() == "Y" and TRTEMFL != "Y"
Outcome:
  Message: "TRTEMwFL equals Y but TRTEMFL does not equal Y"
  Output_Variables:
  - "variable_value"
  - "TRTEMFL"
Source:
  Message: "TRTEMwFL = Y and TRTEMFL != Y"
  Description: "If TRTEMwFL is included, TRTEMFL is defined as the overall treatment\
    \ emergent flag. If any Treatment Emergent Analysis w Flag (TRTEMwFL) variables\
    \ are flagged Y, then the overall Treatment Emergent Analysis Flag (TRTEMFL) variable\
    \ should also be Y."
  Domains: "ADAE"
  Severity: "Error"
Standards:
- Organization: "PMDA"
  Standards:
  - Name: "ADaMIG"
    Version: "1.3"
    References:
    - Origin: "PMDA Validation Rules"
      Rule_Identifier:
        Id: "AD0648"
        Version: "1"
      Version: "6.0"
