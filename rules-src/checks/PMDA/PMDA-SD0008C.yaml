Core:
  Id: "PMDA-SD0008C"
  Status: "Published"
  Version: "1"
Description: "Raise a warning when a Dictionary-Derived Term (--DECOD) value does\
  \ not match the case of its MedDRA preferred term."
Severity: "Warning"
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "AE"
    - "CE"
    - "MH"
Requirements:
  Variables:
    All:
    - "--DECOD"
Bindings:
- name: "$decod_case_valid"
  expression: "valid_external_dictionary_value(--DECOD, external_dictionary_type=\"\
    meddra\", dictionary_term_type=\"PT\", case_sensitive=true)"
Check:
  expression: >-
    $decod_case_valid == false
Outcome:
  Message: "Dictionary-Derived Term (--DECOD) does not match the MedDRA preferred\
    \ case."
Source:
  Message: "Value for --DECOD is in incorrect case"
  Description: "Case for the Dictionary-Derived Term (--DECOD) variable must be sentence\
    \ case using a Preferred Term of the MedDRA dictionary of a version specified\
    \ in the define.xml (Case-sensitive)."
  Domains: "AE, CE, MH"
  Severity: "Warning"
