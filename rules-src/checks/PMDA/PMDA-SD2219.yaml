Core:
  Id: "PMDA-SD2219"
  Status: "Published"
  Version: "1"
Description: "Raise a warning when the study type is 'INTERVENTIONAL' (a Trial Summary\
  \ record with TSPARMCD equals 'STYPE' and TSVAL equals 'INTERVENTIONAL' is present)\
  \ but the Trial Summary (TS) dataset does not contain a record where TSPARMCD equals\
  \ 'TRT' (Investigational Therapy or Treatment)."
Severity: "Warning"
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "TS"
Bindings:
- name: "$interventional_count"
  expression: "record_count(filter=(TSPARMCD == \"STYPE\" and TSVAL == \"INTERVENTIONAL\"\
    ))"
- name: "$trt_count"
  expression: "record_count(filter=(TSPARMCD == \"TRT\"))"
Check:
  expression: >-
    $interventional_count > 0 and $trt_count == 0
Outcome:
  Message: "Missing TRT Trial Summary Parameter: when study type is 'INTERVENTIONAL',\
    \ a 'Investigational Therapy or Treatment' (TRT) record must be present in the\
    \ Trial Summary (TS) domain."
Source:
  Message: "Missing TRT Trial Summary Parameter"
  Description: "'Investigational Therapy or Treatment' (TRT) record must be populated\
    \ in Trial Summary (TS) domain when study type is 'INTERVENTIONAL'. It is expected\
    \ for SDTM IG v3.1.2 data and required for data in all more recent SDTM versions."
  Domains: "TS"
  Severity: "Warning"
