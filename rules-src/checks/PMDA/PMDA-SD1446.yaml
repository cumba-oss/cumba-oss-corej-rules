Core:
  Id: "PMDA-SD1446"
  Status: "Published"
  Version: "1"
Description: "Raise a warning when the Start Date/Time of Treatment (EXSTDTC) is after\
  \ the subject's latest Disposition (DS) start date (DSSTDTC)."
Severity: "Warning"
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "EX"
Bindings:
- name: "$max_ds_dsstdtc"
  expression: "max_date(DSSTDTC, domain=\"DS\", group=[USUBJID])"
Check:
  expression: >-
    not empty(EXSTDTC) and not empty($max_ds_dsstdtc) and date(EXSTDTC) > $max_ds_dsstdtc
Outcome:
  Message: "Exposure start date is after the latest Disposition date"
Source:
  Message: "Exposure start date is after the latest Disposition date"
  Description: "Start Date/Time of Treatment (EXSTDTC) should be less than or equal\
    \ to the Start Date/Time of the latest Disposition Event (DSSTDTC). Investigator\
    \ should provide a date of study discontinuation for each subject in Disposition\
    \ (DS) domain. If the study is ongoing, Parameter Value (TSVAL) for the 'ONGOSIND/Ongoing\
    \ Study Indicator' parameter should be set to 'Y' in the Trial Summary (TS) domain."
  Domains: "EX"
  Severity: "Warning"
Standards:
- Organization: "PMDA"
  Standards:
  - Name: "SDTMIG"
    Version: "3.4"
    References:
    - Origin: "PMDA Validation Rules"
      Rule_Identifier:
        Id: "SD1446"
        Version: "1"
      Version: "6.0"
- Organization: "FDA"
  Standards:
  - Name: "SDTMIG"
    Version: "3.4"
    References:
    - Origin: "FDA Validator Rules"
      Rule_Identifier:
        Id: "SD1446"
        Version: "1"
      Version: "1.6"
