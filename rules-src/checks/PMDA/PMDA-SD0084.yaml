Core:
  Id: "PMDA-SD0084"
  Status: "Published"
  Version: "1"
Description: "Raise an error when the value of Age (AGE) is less than or equal to\
  \ 0."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "DM"
Requirements:
  Variables:
    All:
    - "AGE"
Check:
  expression: >-
    not empty(AGE) and AGE <= 0
Outcome:
  Message: "AGE has a negative or zero value."
Source:
  Message: "Negative or zero value for AGE"
  Description: "The value of Age (AGE) cannot be less than or equal to 0."
  Domains: "DM"
  Severity: "Error"
