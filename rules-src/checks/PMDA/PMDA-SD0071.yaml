Core:
  Id: "PMDA-SD0071"
  Status: "Published"
  Version: "1"
Description: "Raise an error when the combination of Planned Arm Code (ARMCD) and\
  \ Description of Planned Arm (ARM) does not match an entry in the Trial Arms (TA)\
  \ dataset, except for subjects who failed screening (ARMCD is 'SCRNFAIL') or were\
  \ not assigned to an arm (ARMCD is 'NOTASSGN')."
Executability: "Partially Executable - Possible Overreporting"
Scope:
  Domains:
    Include:
    - "DM"
Requirements:
  Variables:
    All:
    - "ARMCD"
    All_Or_None:
    - - "ARMCD"
      - "TA.ARMCD"
    - - "ARM"
      - "TA.ARM"
Match_Datasets:
- Join_Type: "left"
  Keys:
  - "ARMCD"
  - "ARM"
  Name: "TA"
Check:
  expression: >-
    not empty(ARMCD) and upper(ARMCD) != "SCRNFAIL" and upper(ARMCD) != "NOTASSGN" and
    empty(TA.ARMCD)
Outcome:
  Message: "The combination of ARMCD and ARM does not match any entry in the Trial\
    \ Arms (TA) dataset."
  Output_Variables:
  - "ARMCD"
  - "ARM"
  - "TA.ARMCD"
Source:
  Message: "Invalid ARM/ARMCD"
  Description: "The combination of Description of Planned Arm (ARM) and Planned Arm\
    \ Code (ARMCD) values must match entries in the Trial Arms (TA) dataset, except\
    \ for subjects who failed screening (ARMCD = 'SCRNFAIL') or were not fully assigned\
    \ to an Arm (ARMCD = 'NOTASSGN')."
  Domains: "DM"
  Severity: "Error"
