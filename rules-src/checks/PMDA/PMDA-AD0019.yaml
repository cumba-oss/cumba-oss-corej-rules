Core:
  Id: "PMDA-AD0019"
  Status: "Published"
  Version: "1"
Description: "Raise an error when a subject-level character population flag variable\
  \ (COMPLFL, FASFL, ITTFL, PPROTFL, SAFFL, RANDFL, ENRLFL) is empty. These flags\
  \ must be populated with N (not included) or Y (included); an empty value is not\
  \ allowed."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "SUBJECT LEVEL ANALYSIS DATASET"
    - "BASIC DATA STRUCTURE"
    - "OCCURRENCE DATA STRUCTURE"
    - "DEVICE LEVEL ANALYSIS DATASET"
    - "MEDICAL DEVICE BASIC DATA STRUCTURE"
    - "MEDICAL DEVICE OCCURRENCE DATA STRUCTURE"
Check:
  expression: >-
    upper(varname()) =~ /^(COMPLFL|FASFL|ITTFL|PPROTFL|SAFFL|RANDFL|ENRLFL)$/ and empty(value())
Outcome:
  Message: "A subject-level population flag variable is empty; N or Y is required."
  Output_Variables:
  - "variable_name"
  - "variable_value"
Source:
  Message: "Variable subject-population flag value is null"
  Description: "For subject-level character population flag variables: N = no (not\
    \ included), Y = yes (included). Null values are not allowed."
  Domains: "ADSL, ADDL, BDS, ADNCA, MDBDS, OCCDS, ADAE, MDOCCDS, ADAMOTHER"
  Severity: "Error"
Standards:
- Organization: "PMDA"
  Standards:
