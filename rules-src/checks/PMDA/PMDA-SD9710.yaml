Core:
  Id: "PMDA-SD9710"
  Status: "Published"
  Version: "1"
Description: "Raise an error when QNAM is not populated."
Severity: "Reject"
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "SUPP--"
    - "SQ--"
Requirements:
  Variables:
    All:
    - "QNAM"
Check:
  expression: >-
    empty(QNAM)
Outcome:
  Message: "QNAM is empty."
Source_Proposed:
  Message: "Missing value for QNAM"
  Description: "QNAM should be populated."
  Domains: "SUPP--, SQ--"
  Severity: "Reject"
Source:
  Message: "Null value in variable marked as Required"
  Description: "Required variables (where Core attribute is 'Req') cannot be null\
    \ for any records."
  Domains: "ALL"
  Severity: "Reject"
