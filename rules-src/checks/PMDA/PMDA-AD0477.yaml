Core:
  Id: "PMDA-AD0477"
  Status: "Published"
  Version: "1"
Description: "Raise an error when Strata from Verification Source (STRATAV) is present\
  \ and Strata from Verification Source (N) (STRATAVN) is present and STRATAVN does\
  \ not have a single value across records sharing the same value of STRATAV, considering\
  \ only the records on which both variables are populated."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "SUBJECT LEVEL ANALYSIS DATASET"
    - "DEVICE LEVEL ANALYSIS DATASET"
Requirements:
  Variables:
    All:
    - "STRATAVN"
Check:
  expression: >-
    var_exists("STRATAV") and not empty(STRATAV) and not empty(STRATAVN) and
    is_inconsistent_across_dataset(STRATAVN, keys=[STRATAV])
Outcome:
  Message: "Inconsistent value for STRATAVN within STRATAV."
Source:
  Message: "Inconsistent value for STRATAVN"
  Description: "There should be only a single value of Strata from Verification Source\
    \ (N) (STRATAVN) variable for a given value of Strata from Verification Source\
    \ (STRATAV) variable, considering only those rows on which both variables are\
    \ populated."
  Domains: "ADSL, ADDL"
  Severity: "Error"
Standards:
- Organization: "PMDA"
  Standards:
  - Name: "ADaMIG"
    Version: "1.3"
    References:
    - Origin: "PMDA Validation Rules"
      Rule_Identifier:
        Id: "AD0477"
        Version: "1"
      Version: "6.0"
  - Name: "ADaMIG"
    Version: "1.2"
    References:
    - Origin: "PMDA Validation Rules"
      Rule_Identifier:
        Id: "AD0477"
        Version: "1"
      Version: "6.0"
