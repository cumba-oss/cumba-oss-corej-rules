Core:
  Id: "PMDA-AD0001"
  Status: "Published"
  Version: "1"
Description: "Raise an error when the Subject-Level Analysis Dataset (ADSL) is not\
  \ present in the study; ADSL must be included in every ADaM submission."
Severity: "Reject"
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "ALL"
Check:
  expression: >-
    not ds_exists("ADSL")
Outcome:
  Message: "The ADSL (Subject-Level Analysis) dataset is not present in the study."
Source:
  Message: "Missing ADSL dataset"
  Description: "ADaM Subject level (ADSL) dataset should be included in every submission."
  Domains: "GLOBAL"
  Severity: "Reject"
