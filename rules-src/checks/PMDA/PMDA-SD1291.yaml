Core:
  Id: "PMDA-SD1291"
  Status: "Published"
  Version: "1"
Description: "Raise a warning when --ENTPT is populated but --ENRTPT is empty."
Severity: "Warning"
Executability: "Fully Executable"
Scope:
  Classes:
    Include:
    - "SPECIAL PURPOSE"
    - "INTERVENTIONS"
    - "FINDINGS"
    - "EVENTS"
    - "FINDINGS ABOUT"
  Domains:
    Exclude:
    - "DM"
    - "SE"
    - "SV"
    - "DO"
Requirements:
  Variables:
    All:
    - "--ENRTPT"
    - "--ENTPT"
Check:
  expression: >-
    not empty(--ENTPT) and empty(--ENRTPT)
Outcome:
  Message: "--ENRTPT is empty when --ENTPT is populated."
Source:
  Message: "Missing value for --ENRTPT when --ENTPT is populated"
  Description: "End Relative to Reference Time Point (--ENRTPT) must be populated\
    \ when End Reference Time Point (--ENTPT) is populated."
  Domains: "SPECIAL PURPOSE (-DM, -SE, -SV), INTERVENTIONS, FINDINGS (-DO), EVENTS,\
    \ FINDINGS ABOUT"
  Severity: "Warning"
