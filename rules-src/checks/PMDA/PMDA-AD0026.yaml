Core:
  Id: "PMDA-AD0026"
  Status: "Published"
  Version: "1"
Description: "Raise an error when a subject-level numeric population flag variable\
  \ (the numeric 0/1 equivalent of an ADaM population flag: COMPLFN, ENRLFN, FASFN,\
  \ ITTFN, PPROTFN, RANDFN, SAFFN) is not populated. For these variables 0 means no\
  \ (not included) and 1 means yes (included); the variable must be populated for\
  \ every subject."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "SUBJECT LEVEL ANALYSIS DATASET"
    - "DEVICE LEVEL ANALYSIS DATASET"
Check:
  expression: >-
    upper(varname()) =~ /^(COMPLFN|ENRLFN|FASFN|ITTFN|PPROTFN|RANDFN|SAFFN)$/ and empty(value())
Outcome:
  Message: "A subject-level numeric population flag variable is not populated; the\
    \ value must be 0 (no) or 1 (yes)."
Source:
  Message: "Variable subject-population flag value is null"
  Description: "For subject-level numeric population flag variables: 0 = no (not included),\
    \ 1 = yes (included). Null values are not allowed."
  Domains: "ADSL, ADDL"
  Severity: "Error"
Standards:
- Organization: "PMDA"
  Standards:
  - Name: "ADaMIG"
    Version: "1.3"
    References:
