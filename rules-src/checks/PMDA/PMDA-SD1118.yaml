Core:
  Id: "PMDA-SD1118"
  Status: "Published"
  Version: "1"
Description: "Raise a warning when none of --STDTC (Start Date/Time), --DTC (Collection\
  \ Date/Time) and --STDY (Start Study Day) are populated on a record."
Severity: "Warning"
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "DS"
Requirements:
  Variables:
    Any:
    - "--STDTC"
    - "--DTC"
    - "--STDY"
Check:
  expression: >-
    empty(--STDTC) and empty(--DTC) and empty(--STDY)
Outcome:
  Message: "Neither --STDTC, --DTC nor --STDY are populated"
Source:
  Message: "Neither --STDTC, --DTC nor --STDY are populated"
  Description: "At least one value of three variables Start Date/Time (--STDTC), Collection\
    \ Date/Time (--DTC) or Start Study Day (--STDY) should be populated."
  Domains: "DS"
  Severity: "Warning"
