Core:
  Id: "PMDA-SD1227"
  Status: "Published"
  Version: "1"
Description: "Raise an error when the Trial Summary (TS) dataset contains more than\
  \ one record where TSPARMCD equals 'NARMS'."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "TS"
Bindings:
- name: "$narms_count"
  expression: "record_count(filter=filter(TSPARMCD=\"NARMS\"))"
Check:
  expression: >-
    $narms_count > 1
Outcome:
  Message: "Multiple NARMS records: the Trial Summary (TS) domain must contain only\
    \ one record for the 'NARMS' parameter."
  Output_Variables:
  - "$narms_count"
Source:
  Message: "Multiple NARMS records"
  Description: "Trial Summary (TS) domain must contain only one record for 'NARMS'\
    \ Parameter."
  Domains: "TS"
  Severity: "Error"
