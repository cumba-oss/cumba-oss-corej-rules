Core:
  Id: "PMDA-AD0123"
  Status: "Published"
  Version: "1"
Description: "Raise an error when, within a study and considering only records on\
  \ which PARAMCD is populated, the Parameter Type (PARAMTYP) takes more than one\
  \ value for the same Parameter Code (PARAMCD). Every record for a given PARAMCD\
  \ must carry the same PARAMTYP; more than one parameter may be derived."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "BASIC DATA STRUCTURE"
    - "MEDICAL DEVICE BASIC DATA STRUCTURE"
Requirements:
  Variables:
    All:
    - "PARAMTYP"
Check:
  expression: >-
    var_exists("PARAMCD") and not empty(PARAMCD) and is_inconsistent_across_dataset(PARAMTYP,
    include_empty=true, keys=[PARAMCD])
Outcome:
  Message: "Inconsistent value for PARAMTYP"
Source:
  Message: "Inconsistent value for PARAMTYP"
  Description: "Within a study, all PARAMTYP values must be the same for each unique\
    \ value of PARAMCD when PARAMCD is populated. If a PARAMCD is said to be derived,\
    \ all instances must be derived. More than one parameter can be derived."
  Domains: "BDS, ADNCA, MDBDS"
  Severity: "Error"
Standards:
- Organization: "PMDA"
  Standards:
  - Name: "ADaMIG"
    Version: "1.3"
    References:
    - Origin: "PMDA Validation Rules"
      Rule_Identifier:
        Id: "AD0123"
        Version: "1"
      Version: "6.0"
  - Name: "ADaMIG"
    Version: "1.2"
