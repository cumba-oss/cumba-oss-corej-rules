Core:
  Id: "PMDA-SD1130"
  Status: "Published"
  Version: "1"
Description: "Raise a warning when QNAM is present and QLABEL is present and QNAM\
  \ does not have the same value across records with the same value of QLABEL."
Severity: "Warning"
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "SUPP--"
    - "SQ--"
Requirements:
  Variables:
    All:
    - "QNAM"
Check:
  expression: >-
    var_exists("QLABEL") and is_inconsistent_across_dataset(QNAM, keys=[QLABEL]) and
    count(distinct(prefix(coalesce(QNAM ~ /^(.*)[0-9]$/$1/, QNAM), 7), group=[QLABEL])) > 1
Outcome:
  Message: "Inconsistent value for QNAM within QLABEL"
Source:
  Message: "Inconsistent value for QNAM within QLABEL"
  Description: "All values of Qualifier Variable Name (QNAM) should be the same for\
    \ a given value of Qualifier Variable Label (QLABEL)."
  Domains: "SUPPQUAL"
  Severity: "Warning"
