Core:
  Id: "PMDA-AD0149"
  Status: "Published"
  Version: "1"
Description: "Raise a warning when, for a given Parameter Code (PARAMCD), the Analysis\
  \ Value (C) (AVALC) takes more than one value for the same Analysis Value (AVAL)\
  \ on records where both AVAL and AVALC are populated; AVAL and AVALC must hold a\
  \ one-to-one mapping within a PARAMCD."
Severity: "Warning"
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "BASIC DATA STRUCTURE"
Requirements:
  Variables:
    All:
    - "AVAL"
    - "AVALC"
    - "PARAMCD"
Check:
  expression: >-
    not empty(PARAMCD) and not empty(AVAL) and not empty(AVALC) and
    is_inconsistent_across_dataset(AVALC, keys=[PARAMCD, AVAL])
Outcome:
  Message: "Inconsistent value for AVALC"
Source:
  Message: "Inconsistent value for AVALC"
  Description: "Within a study and a given value of PARAMCD when both AVAL and AVALC\
    \ are populated, then all AVALC values must be the same for each unique value\
    \ of AVAL creating a one-to-one mapping."
  Domains: "BDS"
  Severity: "Warning"
Standards:
- Organization: "PMDA"
  Standards:
  - Name: "ADaMIG"
    Version: "1.0"
    References:
    - Origin: "PMDA Validation Rules"
      Rule_Identifier:
        Id: "AD0149"
        Version: "1"
      Version: "6.0"
