Core:
  Id: "PMDA-AD0279"
  Status: "Published"
  Version: "1"
Description: "Raise an error when the Severity/Intensity (N) (AESEVN) variable holds\
  \ a populated value that is not 1, 2, or 3. AESEVN is a numeric severity code whose\
  \ only permitted populated values are 1, 2, and 3."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "OCCURRENCE DATA STRUCTURE"
    - "MEDICAL DEVICE OCCURRENCE DATA STRUCTURE"
Check:
  expression: >-
    not empty(AESEVN) and AESEVN not in [1, 2, 3]
Outcome:
  Message: "AESEVN has a populated value that is not 1, 2, or 3."
  Output_Variables:
  - "AESEVN"
Source:
  Message: "Variable value != 1, 2, 3, or null"
  Description: "Severity/Intensity (N) (AESEVN) and Analysis Severity/Intensity (N)\
    \ (ASEVN) variables must have values in [1, 2, 3] when populated. AESEVN can be\
    \ null. ASEVN cannot be null."
  Domains: "OCCDS, ADAE, MDOCCDS"
  Severity: "Error"
Standards:
- Organization: "PMDA"
  Standards:
  - Name: "ADaMIG"
    Version: "1.3"
