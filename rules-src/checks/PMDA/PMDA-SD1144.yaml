Core:
  Id: "PMDA-SD1144"
  Status: "Published"
  Version: "1"
Description: "Raise a warning when MHSTDTC is populated and is the same as or later\
  \ than RFSTDTC in the DM dataset. Medical history events should start before the\
  \ Subject Reference Start Date/Time (RFSTDTC)."
Severity: "Warning"
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "MH"
Requirements:
  Variables:
    All:
    - "MHSTDTC"
    - "STUDYID"
    - "USUBJID"
    All_Or_None:
    - - "STUDYID"
      - "DM.STUDYID"
    - - "USUBJID"
      - "DM.USUBJID"
Match_Datasets:
- Keys:
  - "STUDYID"
  - "USUBJID"
  Cardinality: "n:1"
  Name: "DM"
Check:
  expression: >-
    not empty(MHSTDTC) and date(MHSTDTC) >= date(DM.RFSTDTC)
Outcome:
  Message: "MHSTDTC is populated and is the same as or later than RFSTDTC in the DM\
    \ dataset."
Source:
  Message: "MHSTDTC date is after RFSTDTC"
  Description: "The medical history dataset includes the subject's prior history at\
    \ the start of the trial. Start Date/Time of Medical History Event (MHSTDTC) should\
    \ be before Subject Reference Start Date/Time (RFSTDTC)."
  Domains: "MH"
  Severity: "Warning"
