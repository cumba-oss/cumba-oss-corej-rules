Core:
  Id: "PMDA-SD0089-A"
  Status: "Published"
  Version: "1"
Description: "Raise an error when the Planned Duration of Element (TEDUR) variable\
  \ is not present in the Trial Elements (TE) dataset and TEENRL is not populated;\
  \ with no TEDUR column, TEENRL must be populated for each Element."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "TE"
Requirements:
  Variables:
    None:
    - "TEDUR"
    All:
    - "TEENRL"
Check:
  expression: >-
    empty(TEENRL)
Outcome:
  Message: "TEDUR is not present in the dataset and TEENRL is not populated."
  Message_Folded: "TEENRL not populated in any record of the dataset: TEDUR is not\
    \ present in the dataset and TEENRL is not populated."
Source_Proposed:
  Sheet_Issue: "#216"
  Message: "Missing values for TEENRL and TEDUR"
  Description: "Rule for End of Element (TEENRL) should be populated when the Planned\
    \ Duration of Element (TEDUR) variable is not present in the dataset."
  Domains: "TE"
  Severity: "Error"
Source:
  Message: "Missing values for TEENRL and TEDUR"
  Description: "At least one of Rule for End of Element (TEENRL) or Planned Duration\
    \ of Element (TEDUR) should be populated."
  Domains: "TE"
  Severity: "Error"
