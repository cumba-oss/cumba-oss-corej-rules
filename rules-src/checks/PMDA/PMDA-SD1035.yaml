Core:
  Id: "PMDA-SD1035"
  Status: "Published"
  Version: "1"
Description: "Raise a warning when Category for Disposition Event (DSCAT) is not populated."
Severity: "Warning"
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "DS"
Requirements:
  Variables:
    All:
    - "DSCAT"
Check:
  expression: >-
    empty(DSCAT)
Outcome:
  Message: "DSCAT is empty."
  Output_Variables:
  - "DSCAT"
Source:
  Message: "Missing value for DSCAT"
  Description: "Category for Disposition Event (DSCAT) should be populated."
  Domains: "DS"
  Severity: "Warning"
