Core:
  Id: "PMDA-SD2244"
  Status: "Published"
  Version: "1"
Description: "Raise an error when TSVCDREF is neither 'GENC' nor 'ISO 3166-1 alpha-3'\
  \ for a record where TSPARMCD equals 'FCNTRY' (Planned Country of Investigational\
  \ Sites)."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "TS"
Requirements:
  Variables:
    All:
    - "TSPARMCD"
    - "TSVCDREF"
Check:
  expression: >-
    TSPARMCD == "FCNTRY" and TSVCDREF != "GENC" and TSVCDREF != "ISO 3166-1 alpha-3"
Outcome:
  Message: "Invalid TSVCDREF value for FCNTRY: TSVCDREF must be 'GENC' or 'ISO 3166-1\
    \ alpha-3' when TSPARMCD equals 'FCNTRY'."
  Output_Variables:
  - "TSPARMCD"
  - "TSVCDREF"
Source:
  Message: "Invalid TSVCDREF value for FCNTRY"
  Description: "TSVCDREF variable value must be 'GENC' (for FDA submissions) or 'ISO\
    \ 3166-1 alpha-3' when TSPARMCD='FCNTRY'."
  Domains: "TS"
  Severity: "Error"
