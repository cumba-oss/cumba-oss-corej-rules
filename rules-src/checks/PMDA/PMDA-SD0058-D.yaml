Core:
  Id: "PMDA-SD0058-D"
  Status: "Published"
  Version: "1"
Description: "Raise an error when a variable present in the CO dataset is not listed\
  \ in the SDTM model list of allowed variables for the observation class and is not\
  \ one of the Identifier and Timing variables SDTMIG 3.3/3.4 permit adding to CO."
Executability: "Partially Executable - Possible Underreporting"
Scope:
  Domains:
    Include:
    - "CO"
Bindings:
- name: "$allowed_variables"
  expression: "get_model_column_order()"
- name: "$timing_variables"
  expression: "get_model_filtered_variables(key_name=\"role\", key_value=\"Timing\"\
    , model_class=\"Findings\")"
- name: "$identifier_variables"
  expression: "get_model_filtered_variables(key_name=\"role\", key_value=\"Identifier\"\
    , model_class=\"Findings\")"
Check:
  expression: >-
    upper(varname()) not in $allowed_variables and upper(varname()) not in $timing_variables and
    upper(varname()) not in $identifier_variables
Outcome:
  Message: "Variable is present in the dataset but is not listed in the SDTM model\
    \ list for the observation class, and is not one of the Identifier and Timing\
    \ variables SDTMIG 3.3/3.4 permit adding to CO."
  Output_Variables:
  - "variable_name"
  - "$allowed_variables"
Source_Proposed:
  Class: "SPC"
  Domain: "CO"
  Variable: "GEN"
  Condition: "Dataset is CO; SDTMIG 3.3/3.4 CO assumptions permit adding any Identifier\
    \ and Timing variables"
  Rule: "Variable = SDTM Model list for the observation class, or a variable the IG\
    \ permits adding to the domain"
Source:
  Message: "Variable appears in dataset, but is not in SDTM model"
  Description: "Only variables listed in SDTM model should appear in a dataset. New\
    \ sponsor defined variables must not be added, and existing variables must not\
    \ be renamed or modified."
  Domains: "ALL"
  Severity: "Error"
Standards:
- Organization: "PMDA"
  Standards:
  - Name: "SDTMIG"
    Version: "3.3"
    References:
    - Origin: "PMDA Validation Rules"
      Rule_Identifier:
        Id: "SD0058"
        Version: "1"
      Version: "6.0"
  - Name: "SDTMIG"
    Version: "3.4"
    References:
    - Origin: "PMDA Validation Rules"
      Rule_Identifier:
        Id: "SD0058"
        Version: "1"
      Version: "6.0"
- Organization: "FDA"
  Standards:
  - Name: "SDTMIG"
    Version: "3.3"
    References:
    - Origin: "FDA Validator Rules"
      Rule_Identifier:
        Id: "SD0058"
        Version: "1"
      Version: "1.6"
  - Name: "SDTMIG"
    Version: "3.4"
    References:
    - Origin: "FDA Validator Rules"
      Rule_Identifier:
        Id: "SD0058"
        Version: "1"
      Version: "1.6"
