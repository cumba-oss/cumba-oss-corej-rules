Core:
  Id: "PMDA-SD1207"
  Status: "Published"
  Version: "1"
Description: "Raise an error when EXENDTC is after RFXENDTC in the DM dataset."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "EX"
Requirements:
  Variables:
    All:
    - "USUBJID"
    - "EXENDTC"
    All_Or_None:
    - - "USUBJID"
      - "DM.USUBJID"
Match_Datasets:
- Keys:
  - "USUBJID"
  Name: "DM"
Check:
  expression: >-
    not empty(EXENDTC) and date(EXENDTC) > date(DM.RFXENDTC)
Outcome:
  Message: "End Date/Time of Treatment (EXENDTC) is after Date/Time of Last Study\
    \ Treatment (RFXENDTC) in DM."
  Output_Variables:
  - "EXENDTC"
  - "DM.RFXENDTC"
Source:
  Message: "EXENDTC date is after RFXENDTC"
  Description: "End Date/Time of Treatment (EXENDTC) variable value must be less than\
    \ or equal to Date/Time of Last Study Treatment (RFXENDTC)."
  Domains: "EX"
  Severity: "Error"
