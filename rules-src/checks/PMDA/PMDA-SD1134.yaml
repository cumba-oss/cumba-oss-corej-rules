Core:
  Id: "PMDA-SD1134"
  Status: "Published"
  Version: "1"
Description: "Raise an error when ACTARMCD is present and ACTARM is present and ACTARMCD\
  \ does not have the same value across records with the same value of ACTARM."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "DM"
Requirements:
  Variables:
    All:
    - "ACTARMCD"
Check:
  expression: >-
    var_exists("ACTARM") and is_inconsistent_across_dataset(ACTARMCD, keys=[ACTARM])
Outcome:
  Message: "Inconsistent value for ACTARMCD within ACTARM"
  Output_Variables:
  - "ACTARMCD"
  - "ACTARM"
Source:
  Message: "Inconsistent value for ACTARMCD"
  Description: "A value for Actual Arm Code (ACTARMCD) must have a unique value for\
    \ Description of Actual Arm (ACTARM) with the domain."
  Domains: "DM"
  Severity: "Error"
