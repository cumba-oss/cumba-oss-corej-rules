Core:
  Id: "PMDA-SD1319"
  Status: "Published"
  Version: "1"
Description: "Raise a warning when --STDTC in the Disposition (DS) or Protocol Deviations\
  \ (DV) domains is earlier than the subject's Date/Time of Informed Consent (RFICDTC)\
  \ in the Demographics (DM) domain."
Severity: "Warning"
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "DS"
    - "DV"
Match_Datasets:
- Keys:
  - "USUBJID"
  Name: "DM"
Check:
  expression: >-
    not empty(--STDTC) and date(--STDTC) < date(DM.RFICDTC)
Outcome:
  Message: "--STDTC is before RFICDTC."
  Output_Variables:
  - "--STDTC"
  - "DM.RFICDTC"
Source:
  Message: "--STDTC is before RFICDTC"
  Description: "All records in the Disposition (DS) and Protocol Deviations (DV) domains\
    \ should have the Start Date/Time of Event (--STDTC) equal to or after a subject's\
    \ Date/Time of Informed Consent (RFICDTC) in the Demographics (DM) domain."
  Domains: "DS, DV"
  Severity: "Warning"
