Core:
  Id: "PMDA-SD0063"
  Status: "Published"
  Version: "1"
Description: "Raise a warning when the label of a standard variable does not match\
  \ the variable label specified for that variable in the SDTM Implementation Guide."
Severity: "Warning"
Executability: "Not Executable"
ExecutabilityHint:
  Category: "not executable"
  Detail: "Parked as an R-5.26 duplicate of PMDA-SD0063A (owner rulings D-8 + D-18,\
    \ 2026-09-14): the two are identical in every field but the id and ship into exactly\
    \ the same packages, so one run reported the same finding twice. Both package\
    \ sets being equal, D-18's tie-break applies and the lower-numbered row is parked\
    \ — the lower id was authored first, so the higher is the more recent statement.\
    \ The row stays documented here while PMDA-SD0063A carries the executable check."
Scope:
  Domains:
    Exclude:
    - "APAE"
    - "APDM"
    - "APMH"
    - "APRELSUB"
    - "RELSUB"
Check:
  expression: >-
    equalsIgnoreCase(varname(), var_name("LIBRARY")) and not empty(var_label("LIBRARY")) and
    var_label() != var_label("LIBRARY")
Outcome:
  Message: "The variable label does not match the variable label specified in the\
    \ SDTMIG."
  Output_Variables:
  - "variable_name"
  - "library_variable_label"
  - "variable_label"
Source:
  Message: "SDTM/dataset variable label mismatch"
  Description: "Variable Label in the dataset should match the variable label described\
    \ in SDTM IG. When creating a new domain Variable Labels could be adjusted as\
    \ appropriate to properly convey the meaning in the context of the data being\
    \ submitted."
  Domains: "ALL (-APAE, -APMH, -APRELSUB, -RELSUB, -APDM)"
  Severity: "Warning"
