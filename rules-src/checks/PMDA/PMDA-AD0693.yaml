Core:
  Id: "PMDA-AD0693"
  Status: "Published"
  Version: "1"
Description: "Raise an error when, within a study, the Baseline Value (BASE) is not\
  \ the same for every record sharing the same Sponsor Device Identifier (SPDEVID),\
  \ Unique Subject Identifier (USUBJID), Parameter Code (PARAMCD) and Baseline Value\
  \ character (BASEC), evaluated only where PARAMCD, BASE and BASEC are populated.\
  \ There must be a one-to-one map between BASE and BASEC within a given parameter\
  \ when both are populated."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "MEDICAL DEVICE BASIC DATA STRUCTURE"
Check:
  expression: >-
    not empty(PARAMCD) and not empty(BASE) and not empty(BASEC) and
    is_inconsistent_across_dataset(BASE, keys=[SPDEVID, USUBJID, PARAMCD, BASEC])
Outcome:
  Message: "BASE has inconsistent values within a unique SPDEVID, USUBJID, PARAMCD,\
    \ BASEC group."
Source:
  Message: "Inconsistent value for BASE"
  Description: "Within a study, All BASE values must be the same for each unique value\
    \ group of [SPDEVID,USUBJID,PARAMCD,BASEC] when PARAMCD, BASE and BASEC are populated\
    \  (ADaM IG: There must be a one-to-one map between BASE and BASEC within a given\
    \ PARAM if BOTH are populated)."
  Domains: "MDBDS"
  Severity: "Error"
Standards:
- Organization: "PMDA"
  Standards:
  - Name: "ADaMIG"
    Version: "1.3"
    References:
    - Origin: "PMDA Validation Rules"
      Rule_Identifier:
        Id: "AD0693"
        Version: "1"
      Version: "6.0"
