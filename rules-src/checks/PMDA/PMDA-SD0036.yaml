Core:
  Id: "PMDA-SD0036"
  Status: "Published"
  Version: "1"
Description: "Raise an error when --ORRES (Result or Finding in Original Units) is\
  \ populated but --STRESC (Character Result/Finding in Standard Units) is empty."
Executability: "Fully Executable"
Scope:
  Classes:
    Include:
    - "FINDINGS"
    - "FINDINGS ABOUT"
Requirements:
  Variables:
    All:
    - "--ORRES"
    - "--STRESC"
Check:
  expression: >-
    not empty(--ORRES) and empty(--STRESC)
Outcome:
  Message: "--STRESC is empty when --ORRES is populated."
  Output_Variables:
  - "--ORRES"
  - "--STRESC"
Source:
  Message: "Missing value for --STRESC when --ORRES is provided"
  Description: "Character Result/Finding in Std Units (--STRESC) must be populated\
    \ when Result or Finding in Original Units (--ORRES) is provided."
  Domains: "FINDINGS, FINDINGS ABOUT"
  Severity: "Error"
