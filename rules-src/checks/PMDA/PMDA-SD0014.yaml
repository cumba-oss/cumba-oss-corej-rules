Core:
  Id: "PMDA-SD0014"
  Status: "Published"
  Version: "1"
Description: "Raise an error when a non-missing Dose (--DOSE) value is negative (less\
  \ than 0)."
Executability: "Fully Executable"
Scope:
  Classes:
    Include:
    - "INTERVENTIONS"
Requirements:
  Variables:
    All:
    - "--DOSE"
Check:
  expression: >-
    not empty(--DOSE) and --DOSE < 0
Outcome:
  Message: "Negative value for --DOSE"
Source:
  Message: "Negative value for --DOSE"
  Description: "Non-missing Dose (--DOSE) value must be greater than or equal to 0."
  Domains: "INTERVENTIONS"
  Severity: "Error"
