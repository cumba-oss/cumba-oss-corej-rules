Core:
  Id: "PMDA-AD0059"
  Status: "Published"
  Version: "1"
Description: "Raise an error when a time variable whose name ends in 'TM' (excluding\
  \ datetime '*DTM' variables) is not stored as a numeric variable; the SAS data type\
  \ of a *TM variable must be Num."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "SUBJECT LEVEL ANALYSIS DATASET"
    - "BASIC DATA STRUCTURE"
    - "OCCURRENCE DATA STRUCTURE"
    - "DEVICE LEVEL ANALYSIS DATASET"
    - "MEDICAL DEVICE BASIC DATA STRUCTURE"
    - "MEDICAL DEVICE OCCURRENCE DATA STRUCTURE"
Check:
  expression: >-
    ends_with(upper(varname()), "TM") and not ends_with(upper(varname()), "DTM") and var_type() !=
    "Num"
Outcome:
  Message: "A *TM time variable is not a numeric variable."
Source:
  Message: "*TM is not a numeric variable"
  Description: "The SAS TYPE for *TM variable must be equal Num."
  Domains: "ADSL, ADDL, BDS, ADNCA, MDBDS, OCCDS, ADAE, MDOCCDS, ADAMOTHER"
  Severity: "Error"
Standards:
- Organization: "PMDA"
  Standards:
