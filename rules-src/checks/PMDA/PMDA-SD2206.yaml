Core:
  Id: "PMDA-SD2206"
  Status: "Published"
  Version: "1"
Description: "Raise a warning when the Trial Summary (TS) dataset does not contain\
  \ a record where TSPARMCD equals 'RANDOM' (Trial is Randomized)."
Severity: "Warning"
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "TS"
Bindings:
- name: "$random_count"
  expression: "record_count(filter=(TSPARMCD == \"RANDOM\"))"
Check:
  expression: >-
    $random_count == 0
Outcome:
  Message: "Missing RANDOM Trial Summary Parameter: a 'Trial is Randomized' (RANDOM)\
    \ record must be present in the Trial Summary (TS) domain."
Source:
  Message: "Missing RANDOM Trial Summary Parameter"
  Description: "'Trial is Randomized' (RANDOM) record must be populated in Trial Summary\
    \ (TS) domain. It is expected for SDTM IG v3.1.2 data and required for data in\
    \ all more recent SDTM versions."
  Domains: "TS"
  Severity: "Warning"
Standards:
