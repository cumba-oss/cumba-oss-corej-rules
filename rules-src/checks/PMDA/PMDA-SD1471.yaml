Core:
  Id: "PMDA-SD1471"
  Status: "Published"
  Version: "1"
Description: "Raise a warning when Result or Finding in Original Units (LBORRES) is\
  \ not a numeric value while Upper End of Reference Range in Original Units (LBORNRHI)\
  \ is populated. The upper end of the reference range for a continuous measurement\
  \ should be populated only for continuous (numeric) results. Allowed numeric values\
  \ may include optional leading >, <, =, space, and - symbols."
Severity: "Warning"
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "LB"
Requirements:
  Variables:
    All:
    - "LBORRES"
Check:
  expression: >-
    not empty(LBORNRHI) and not empty(LBORRES) and LBORRES !~ /^[><]?=?
    ?(-?((\\d+(\\.\\d+)?)|(\\.\\d+)))$/
Outcome:
  Message: "LBORRES is not a numeric value when LBORNRHI is populated."
Source:
  Message: "--ORRES is not numeric value, when --ORNRHI is populated"
  Description: "Upper end of reference range for continuous measurement in original\
    \ units (--ORNRHI) should be populated only for continuous results (--ORRES is\
    \ numeric value). Allowed \"numeric\" values may include optional >, <, =, a space\
    \ and - leading symbols in the listed order. For example, \"<= -1.2\"."
  Domains: "LB"
  Severity: "Warning"
Standards:
- Organization: "PMDA"
  Standards:
  - Name: "SDTMIG"
    Version: "3.4"
    References:
    - Origin: "PMDA Validation Rules"
      Rule_Identifier:
        Id: "SD1471"
        Version: "1"
      Version: "6.0"
