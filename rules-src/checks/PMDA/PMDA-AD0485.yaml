Core:
  Id: "PMDA-AD0485"
  Status: "Published"
  Version: "1"
Description: "Raise an error when, on a given record, the secondary numeric variable\
  \ Percent Change to Baseline Category y (N) (PBCHGCyN) is populated but its corresponding\
  \ primary character variable Percent Change to Baseline Category y (PBCHGCAy) is\
  \ not populated. The secondary variable must be populated only when its primary\
  \ variable is populated."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "ALL"
Check:
  expression: >-
    not empty(PBCHGCyN) and empty(PBCHGCAy)
Outcome:
  Message: "Secondary variable PBCHGCyN is populated, but its primary variable PBCHGCAy\
    \ is not populated."
  Output_Variables:
  - "PBCHGCAy"
  - "PBCHGCyN"
wildcards:
  "y":
    min: 1
    max: 99
Source_Proposed:
  Sheet_Issue: "#77"
  Message: "Secondary variable PBCHGCyN is populated, but its primary variable PBCHGCAy\
    \ is not populated"
  Description: "In a pair of corresponding character and numeric variables, the primary\
    \ or most commonly used variable must be populated if its secondary variable describing\
    \ it is populated. Corresponding character and numeric values must also have a\
    \ one-to-one mapping consistency when the primary variable is populated, which\
    \ are addressed in other rules."
  Domains: "BDS, ADNCA, MDBDS, ADAMOTHER"
  Severity: "Error"
Source:
  Message: "Secondary variable PBCHGCyN is populated, but its primary variable PBCHGCAy\
    \ is not populated"
  Description: "In a pair of corresponding character and numeric variables, the secondary\
    \ variable must be populated if its primary variable is populated. Corresponding\
    \ character and numeric values must also have a one-to-one mapping consistency\
    \ when the primary variable is populated, which are addressed in other rules."
  Domains: "BDS, ADNCA, MDBDS, ADAMOTHER"
  Severity: "Error"
