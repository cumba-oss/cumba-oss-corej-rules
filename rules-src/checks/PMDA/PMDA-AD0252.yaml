Core:
  Id: "PMDA-AD0252"
  Status: "Published"
  Version: "1"
Description: "Raise an error for each variable in an occurrence-data-structure (OCCDS)\
  \ dataset whose name is a basic-data-structure analysis variable name (e.g. PARAM,\
  \ AVAL, BASE, CHG, DTYPE, CRITy) prohibited in OCCDS datasets."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "OCCURRENCE DATA STRUCTURE"
    - "MEDICAL DEVICE OCCURRENCE DATA STRUCTURE"
Check:
  expression: >-
    varname() in ["PARAM", "PARAMCD", "PARAMN", "AVAL", "AVALC", "BASE", "BASEC", "BASETYPE",
    "ABLFL", "CHG", "PCHG", "DTYPE", "AVISIT", "AVISITN", "ATPT", "ATPTN", "ATPTREF", "AWRANGE",
    "AWLO", "AWHI", "AWTARGET", "AWTDIFF", "AWU", "ANRLO", "ANRHI", "ANRIND", "BNRIND", "CNSR"] or
    varname() =~ /^PARCAT([1-9]|[1-9][0-9])$/ or varname() =~ /^PARCAT([1-9]|[1-9][0-9])N$/ or
    varname() =~ /^AVALCAT([1-9]|[1-9][0-9])$/ or varname() =~ /^BASECAT([1-9]|[1-9][0-9])$/ or
    varname() =~ /^CHGCAT([1-9]|[1-9][0-9])$/ or varname() =~ /^PCHGCAT([1-9]|[1-9][0-9])$/ or
    varname() =~ /^A([1-9]|[1-9][0-9])LO$/ or varname() =~ /^A([1-9]|[1-9][0-9])HI$/ or varname() =~
    /^A([1-9]|[1-9][0-9])IND$/ or varname() =~ /^SHIFT([1-9]|[1-9][0-9])$/ or varname() =~
    /^CRIT([1-9]|[1-9][0-9])$/ or varname() =~ /^CRIT([1-9]|[1-9][0-9])FL$/ or varname() =~
    /^CRIT([1-9]|[1-9][0-9])FN$/
Outcome:
  Message: "The variable is prohibited in occurrence-data-structure datasets: its\
    \ name is a basic-data-structure analysis variable name such as PARAM, PARAMCD,\
    \ AVAL, AVALC, BASE, CHG, DTYPE, a member of the CRITy criterion family, or a\
    \ member of the AyLO/AyHI/AyIND and SHIFTy families."
  Output_Variables:
  - "variable_name"
Source:
  Message: "Variable present in dataset is prohibited for use in ADaM"
  Description: "Variables described in ADaM IG as inappropriate for usage must be\
    \ not included in the dataset. i.e., for ADAE, there is no need for AVAL, AVALC\
    \ and Parameter variables."
  Domains: "ADSL, ADDL, BDS, ADNCA, MDBDS, OCCDS, ADAE, MDOCCDS"
  Severity: "Error"
Standards:
- Organization: "PMDA"
  Standards:
