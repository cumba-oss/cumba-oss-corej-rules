Core:
  Id: "PMDA-SD0033"
  Status: "Published"
  Version: "1"
Description: "Raise a warning when Planned Time Point Number (--TPTNUM) is missing\
  \ while Planned Time Point Name (--TPT) is populated."
Severity: "Warning"
Executability: "Partially Executable - Possible Underreporting"
Scope:
  Classes:
    Include:
    - "INTERVENTIONS"
    - "EVENTS"
    - "FINDINGS"
    - "FINDINGS ABOUT"
  Domains:
    Exclude:
    - "DS"
Requirements:
  Variables:
    All:
    - "--TPT"
    - "--TPTNUM"
Check:
  expression: >-
    not empty(--TPT) and empty(--TPTNUM)
Outcome:
  Message: "--TPTNUM is missing when --TPT is populated."
  Output_Variables:
  - "--TPT"
  - "--TPTNUM"
Source:
  Message: "Missing value for --TPTNUM when --TPT is provided"
  Description: "Planned Time Point Number (--TPTNUM) should not be null when Planned\
    \ Time Point Name (--TPT) is populated."
  Domains: "CO, INTERVENTIONS, FINDINGS, EVENTS (-DS), FINDINGS ABOUT"
  Severity: "Warning"
