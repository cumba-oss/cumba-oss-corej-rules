Core:
  Id: "PMDA-SD1371"
  Status: "Published"
  Version: "1"
Description: "Raise an error when --ORRES is empty while --LOBXFL equals 'Y' and the\
  \ record is not derived (--DRVFL is not equal to 'Y' or --DRVFL is not present)."
Executability: "Fully Executable"
Scope:
  Classes:
    Include:
    - "FINDINGS"
    - "FINDINGS ABOUT"
  Domains:
    Exclude:
    - "DD"
    - "IE"
    - "SC"
Requirements:
  Variables:
    All:
    - "--LOBXFL"
Check:
  expression: >-
    empty(--ORRES) and --LOBXFL == "Y" and --DRVFL != "Y"
Outcome:
  Message: "--ORRES is empty even though --LOBXFL equals 'Y' and either --DRVFL is\
    \ not present in dataset or is not equal to 'Y'."
  Keep_Row_Findings:
  - "--ORRES"
  Output_Variables:
  - "!--ORRES"
Source:
  Message: "--ORRES is null when --LOBXFL = 'Y' (and --DRVFL is null)"
  Description: "Result or Finding in Original Units (--ORRES) should be populated\
    \ when Last Observation Before Exposure Flag (--LOBXFL) is set to 'Y’ unless the\
    \ record is derived (--DRVFL = 'Y')."
  Domains: "FINDINGS (-DD, -IE, -SC), FINDINGS ABOUT"
  Severity: "Error"
Standards:
- Organization: "PMDA"
  Standards:
  - Name: "SDTMIG"
    Version: "3.4"
    References:
