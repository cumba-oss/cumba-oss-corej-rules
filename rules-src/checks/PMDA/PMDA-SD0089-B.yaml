Core:
  Id: "PMDA-SD0089-B"
  Status: "Published"
  Version: "1"
Description: "Raise an error when the Rule for End of Element (TEENRL) variable is\
  \ not present in the Trial Elements (TE) dataset and TEDUR is not populated; with\
  \ no TEENRL column, TEDUR must be populated for each Element."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "TE"
Requirements:
  Variables:
    None:
    - "TEENRL"
    All:
    - "TEDUR"
Check:
  expression: >-
    empty(TEDUR)
Outcome:
  Message: "TEENRL is not present in the dataset and TEDUR is not populated."
  Output_Variables:
  - "TEDUR"
Source_Proposed:
  Sheet_Issue: "#216"
  Message: "Missing values for TEENRL and TEDUR"
  Description: "Planned Duration of Element (TEDUR) should be populated when the Rule\
    \ for End of Element (TEENRL) variable is not present in the dataset."
  Domains: "TE"
  Severity: "Error"
Source:
  Message: "Missing values for TEENRL and TEDUR"
  Description: "At least one of Rule for End of Element (TEENRL) or Planned Duration\
    \ of Element (TEDUR) should be populated."
  Domains: "TE"
  Severity: "Error"
