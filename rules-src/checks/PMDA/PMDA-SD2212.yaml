Core:
  Id: "PMDA-SD2212"
  Status: "Published"
  Version: "1"
Description: "Raise a warning when the study type is 'INTERVENTIONAL' and the Trial\
  \ Summary (TS) dataset does not contain a record where TSPARMCD equals 'TINDTP'\
  \ (Trial Indication Type)."
Severity: "Warning"
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "TS"
Bindings:
- name: "$STYPE_INTERVENTIONAL"
  expression: "record_count(filter=(TSPARMCD == \"STYPE\" and TSVAL == \"INTERVENTIONAL\"\
    ))"
- name: "$tindtp_count"
  expression: "record_count(filter=(TSPARMCD == \"TINDTP\"))"
Check:
  expression: >-
    $STYPE_INTERVENTIONAL >= 1 and $tindtp_count == 0
Outcome:
  Message: "Missing TINDTP Trial Summary Parameter: a 'Trial Indication Type' (TINDTP)\
    \ record must be present in the Trial Summary (TS) domain."
  Output_Variables:
  - "$STYPE_INTERVENTIONAL"
  - "$tindtp_count"
Source:
  Message: "Missing TINDTP Trial Summary Parameter"
  Description: "'Trial Indication Type' (TINDTP) record must be populated in Trial\
    \ Summary (TS) domain when study type is 'INTERVENTIONAL'. It is expected for\
    \ SDTM IG v3.1.2 data and required for data in all more recent SDTM versions."
  Domains: "TS"
  Severity: "Warning"
