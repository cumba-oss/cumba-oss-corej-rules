Core:
  Id: "PMDA-AD0078"
  Status: "Published"
  Version: "1"
Description: "Raise a warning when Planned Treatment for Period xx (TRTxxP) is present\
  \ for a treatment period beyond the first (xx greater than 01) but the corresponding\
  \ First Treatment date for Period xx (TRxxSDT) is not present. For a single treatment\
  \ period (Period 01) TRTSDT is sufficient."
Severity: "Warning"
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "SUBJECT LEVEL ANALYSIS DATASET"
    - "DEVICE LEVEL ANALYSIS DATASET"
Check:
  expression: >-
    var_exists("TRTxxP") and not var_exists("TRxxSDT")
Outcome:
  Message: "TRTxxP is present, but TRxxSDT is not present for periods greater than\
    \ 01."
  Output_Variables:
  - "TRTxxP"
wildcards:
  xx:
    min: 2
Source:
  Message: "TRTxxP is present, but TRxxSDT is not present for periods greater than\
    \ 01"
  Description: "If Planned Treatment for Period xx (TRTxxP) is present, First Treatment\
    \ date for period xx (TRxxSDT) must be present if there is more than one Treatment\
    \ Period. When there is only 1 Treatment Period 01, TRTSDT is sufficient."
  Domains: "ADSL, ADDL"
  Severity: "Warning"
Standards:
- Organization: "PMDA"
  Standards:
  - Name: "ADaMIG"
    Version: "1.3"
    References:
