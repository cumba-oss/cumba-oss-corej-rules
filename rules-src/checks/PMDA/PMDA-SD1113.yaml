Core:
  Id: "PMDA-SD1113"
  Status: "Published"
  Version: "1"
Description: "Raise an error when the TE (Trial Elements) dataset is not present in\
  \ the study."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "ALL"
Check:
  expression: >-
    not ds_exists("TE")
Outcome:
  Message: "The TE (Trial Elements) dataset is not present in the study."
Source:
  Message: "Missing TE dataset"
  Description: "Trial Elements (TE) dataset should be included in every submission."
  Domains: "TE"
  Severity: "Error"
