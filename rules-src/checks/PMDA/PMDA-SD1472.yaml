Core:
  Id: "PMDA-SD1472"
  Status: "Published"
  Version: "1"
Description: "Raise a warning when --STNRLO (lower end of the reference range in standard\
  \ units) is populated but --ORRES does not represent a numeric value."
Severity: "Warning"
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "LB"
Requirements:
  Variables:
    All:
    - "--ORRES"
Check:
  expression: >-
    not empty(--STNRLO) and not empty(--ORRES) and --ORRES !~ /^[><]?=?
    ?(-?((\\d+(\\.\\d+)?)|(\\.\\d+)))$/
Outcome:
  Message: "--ORRES does not represent a numeric value although --STNRLO is populated."
Source:
  Message: "--ORRES is not numeric value, when --STNRLO is populated"
  Description: "Lower end of reference range for continuous measurement in standard\
    \ units (--STNRLO) should be populated only for continuous results (--ORRES is\
    \ numeric value). Allowed \"numeric\" values may include optional >, <, =, a space\
    \ and - leading symbols in the listed order. For example, \"<= -1.2\"."
  Domains: "LB"
  Severity: "Warning"
Standards:
- Organization: "PMDA"
  Standards:
  - Name: "SDTMIG"
    Version: "3.4"
    References:
    - Origin: "PMDA Validation Rules"
      Rule_Identifier:
        Id: "SD1472"
        Version: "1"
      Version: "6.0"
