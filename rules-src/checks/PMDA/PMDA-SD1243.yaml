Core:
  Id: "PMDA-SD1243"
  Status: "Published"
  Version: "1"
Description: "Raise a warning when --BDSYCD does not have the same value across all\
  \ records that share the same value of --BODSYS, evaluated over the records where\
  \ --BODSYS is populated."
Severity: "Warning"
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "AE"
    - "CE"
    - "MH"
Requirements:
  Variables:
    All:
    - "--BDSYCD"
    - "--BODSYS"
Check:
  expression: >-
    is_inconsistent_across_dataset(--BDSYCD, keys=[--BODSYS])
Outcome:
  Message: "--BDSYCD is not the same value across records with the same value of --BODSYS."
Source:
  Message: "Inconsistent value for --BDSYCD within --BODSYS"
  Description: "All values of Body System or Organ Class Code (--BDSYCD) should be\
    \ the same for a given value of Body System or Organ Class (--BODSYS)."
  Domains: "AE, CE, MH"
  Severity: "Warning"
