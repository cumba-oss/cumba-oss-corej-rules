Core:
  Id: "PMDA-SD1114C"
  Status: "Published"
  Version: "1"
Description: "Raise a warning when a Body System or Organ Class (--BODSYS) value does\
  \ not match the case of its MedDRA System Organ Class."
Severity: "Warning"
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "AE"
    - "CE"
    - "MH"
Requirements:
  Variables:
    All:
    - "--BODSYS"
Operations:
- id: "$bodsys_case_valid"
  expression: "valid_external_dictionary_value(--BODSYS, external_dictionary_type=\"\
    meddra\", dictionary_term_type=\"SOC\", case_sensitive=true)"
Check:
  expression: >-
    $bodsys_case_valid == false
Outcome:
  Message: "Body System or Organ Class (--BODSYS) does not match the MedDRA System\
    \ Organ Class case."
  Output_Variables:
  - "--BODSYS"
Source:
  Message: "Value for --BODSYS is in incorrect case"
  Description: "Case for Body System or Organ Class (--BODSYS) variable must follow\
    \ MedDRA sentence case and be populated using a System Organ Class of the MedDRA\
    \ dictionary of a version specified in the define.xml (Case-sensitive)."
  Domains: "AE, CE, MH"
  Severity: "Warning"
