Core:
  Id: "PMDA-AD0296B"
  Status: "Published"
  Version: "1"
Description: "Raise an error when the ATOXGRN variable is not uniquely determined\
  \ by ATOXGR within the dataset: a single value of ATOXGR maps to more than one value\
  \ of ATOXGRN, considering only the records on which both variables are populated.\
  \ The PMDA validation sheet's 'inconsistent value across studies' intent is reinterpreted\
  \ as a within-dataset unique (1-to-1) relationship check between the paired character/numeric\
  \ variables ATOXGRN and ATOXGR; the cross-study scope is not evaluated."
Executability: "Partially Executable"
ExecutabilityHint:
  Category: "partially executable"
  Detail: "The sheet's 'inconsistent across studies' intent is reinterpreted as a\
    \ within-dataset unique-relationship check between the char/numeric pair ATOXGRN/ATOXGR\
    \ (has_multiple_values_for); the cross-study scope is not evaluated."
Scope:
  Data_Structures:
    Include:
    - "BASIC DATA STRUCTURE"
    - "OCCURRENCE DATA STRUCTURE"
Check:
  expression: >-
    not empty(ATOXGRN) and not empty(ATOXGR) and has_multiple_values_for(ATOXGRN, ATOXGR)
Outcome:
  Message: "There is more than one value of ATOXGRN for a given value of ATOXGR (within\
    \ the dataset)."
  Output_Variables:
  - "ATOXGR"
  - "ATOXGRN"
Source:
  Message: "Inconsistent value for ATOXGRN"
  Description: "Across studies, all Analysis Toxicity Grade (N) (ATOXGRN) variable\
    \ values must be the same for each unique value of Analysis Toxicity Grade (ATOXGR)\
    \ variable when both variables are populated."
  Domains: "OCCDS, ADAE, MDOCCDS, ADAMOTHER"
  Severity: "Error"
