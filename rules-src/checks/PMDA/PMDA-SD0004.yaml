Core:
  Id: "PMDA-SD0004"
  Status: "Published"
  Version: "1"
Description: "Raise a warning when the Domain Abbreviation (DOMAIN) value is not consistent\
  \ with the name of the dataset (the dataset name does not begin with the DOMAIN\
  \ value)."
Severity: "Warning"
Executability: "Fully Executable"
Scope:
  Domains:
    Exclude:
    - "SUPP--"
    - "SQ--"
    - "RELREC"
    - "RELSUB"
    - "RELSPEC"
    - "POOLDEF"
    - "AP--"
    - "APRELSUB"
Requirements:
  Variables:
    All:
    - "DOMAIN"
Check:
  expression: >-
    prefix(dataset_name, 2) != DOMAIN
Outcome:
  Message: "Inconsistent value for DOMAIN"
Source:
  Message: "Inconsistent value for DOMAIN"
  Description: "Domain Abbreviation (DOMAIN) variable should be consistent with the\
    \ name of the dataset."
  Domains: "ALL (-POOLDEF, -RELREC, -RELSPEC, -RELSUB, -SUPPQUAL)"
  Severity: "Warning"
