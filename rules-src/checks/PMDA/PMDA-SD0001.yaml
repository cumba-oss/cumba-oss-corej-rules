Core:
  Id: "PMDA-SD0001"
  Status: "Published"
  Version: "1"
Description: "Raise a warning when a dataset has no records; a dataset should have\
  \ at least one record."
Severity: "Warning"
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "ALL"
Bindings:
- name: "$records_in_dataset"
  expression: "record_count()"
Check:
  expression: >-
    $records_in_dataset == 0
Outcome:
  Message: "Dataset has no records."
Source:
  Message: "No records in data source"
  Description: "Domain table should have at least one record."
  Domains: "ALL"
  Severity: "Warning"
