Core:
  Id: "PMDA-SD2270"
  Status: "Published"
  Version: "1"
Description: "Raise a warning when --DY is present in the dataset but --DTC is not\
  \ present."
Severity: "Warning"
Executability: "Fully Executable"
Scope:
  Classes:
    Include:
    - "SPECIAL PURPOSE"
    - "INTERVENTIONS"
    - "FINDINGS"
    - "EVENTS"
    - "FINDINGS ABOUT"
  Domains:
    Exclude:
    - "DO"
Check:
  expression: >-
    var_exists("--DY") and not var_exists("--DTC")
Outcome:
  Message: "--DY is present in the dataset but --DTC is not present."
  Output_Variables:
  - "--DY"
Source:
  Message: "Missing --DTC variable when --DY variable is present"
  Description: "Collection Study Date/Time (--DTC) variable should be included into\
    \ dataset when Collection Study Day (--DY) variable is present."
  Domains: "SPECIAL PURPOSE, INTERVENTIONS, FINDINGS (-DO), EVENTS, FINDINGS ABOUT"
  Severity: "Warning"
Standards:
- Organization: "PMDA"
  Standards:
  - Name: "SDTMIG"
    Version: "3.4"
    References:
    - Origin: "PMDA Validation Rules"
      Rule_Identifier:
        Id: "SD2270"
        Version: "1"
      Version: "6.0"
  - Name: "SDTMIG"
    Version: "3.3"
    References:
    - Origin: "PMDA Validation Rules"
      Rule_Identifier:
        Id: "SD2270"
        Version: "1"
      Version: "6.0"
