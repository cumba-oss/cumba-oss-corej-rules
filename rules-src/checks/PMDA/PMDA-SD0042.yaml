Core:
  Id: "PMDA-SD0042"
  Status: "Published"
  Version: "1"
Description: "Raise a warning when --PRESP is equal to 'Y' and --OCCUR is empty but\
  \ --STAT is not equal to 'NOT DONE'."
Severity: "Warning"
Executability: "Fully Executable"
Scope:
  Classes:
    Include:
    - "INTERVENTIONS"
    - "EVENTS"
  Domains:
    Exclude:
    - "AE"
    - "DS"
    - "DV"
    - "EX"
Requirements:
  Variables:
    All:
    - "--OCCUR"
    - "--PRESP"
    - "--STAT"
Check:
  expression: >-
    --PRESP == "Y" and empty(--OCCUR) and --STAT != "NOT DONE"
Outcome:
  Message: "--STAT does not equal 'NOT DONE' when --PRESP equals 'Y' and --OCCUR is\
    \ empty."
  Message_Folded: "--OCCUR not populated in any record of the dataset, and at least\
    \ one record meets the rest of the condition: --STAT does not equal 'NOT DONE'\
    \ when --PRESP equals 'Y' and --OCCUR is empty."
  Output_Variables:
  - "!--OCCUR"
Source:
  Message: "--STAT does not equal 'NOT DONE' when --PRESP='Y' and --OCCUR is null"
  Description: "When no response is provided for Occurrence (--OCCUR) for a pre-specified\
    \ Intervention or Event (--PRESP = 'Y'), then Status (--STAT) should be set to\
    \ 'NOT DONE'."
  Domains: "INTERVENTIONS (-EX), EVENTS (-AE, -DS, -DV)"
  Severity: "Warning"
