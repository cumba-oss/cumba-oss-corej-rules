Core:
  Id: "PMDA-SD1238"
  Status: "Published"
  Version: "1"
Description: "Raise an error when --RFTDTC is populated but --TPTREF is not populated,\
  \ since --RFTDTC is the fixed reference time point defined by --TPTREF."
Executability: "Partially Executable - Possible Underreporting"
Scope:
  Domains:
    Include:
    - "ALL"
Requirements:
  Variables:
    All:
    - "--TPTREF"
Check:
  expression: >-
    not empty(--RFTDTC) and empty(--TPTREF)
Outcome:
  Message: "--RFTDTC is populated when --TPTREF is not populated."
  Message_Folded: "--TPTREF not populated in any record of the dataset, and at least\
    \ one record meets the rest of the condition: --RFTDTC is populated when --TPTREF\
    \ is not populated."
Source:
  Message: "--RFTDTC is populated when --TPTREF is not populated"
  Description: "--RFTDTC is defined as the Date/time for a fixed reference time point\
    \ defined by --TPTREF, therefore --RFTDTC should only be populated when --TPTREF\
    \ is populated."
  Domains: "SPECIAL PURPOSE (-DM, -SE, -SV), INTERVENTIONS, FINDINGS (-DO), EVENTS,\
    \ FINDINGS ABOUT"
  Severity: "Error"
