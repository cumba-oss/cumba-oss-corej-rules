Core:
  Id: "PMDA-AD0484"
  Status: "Published"
  Version: "1"
Description: "Raise an error when, on a given record, the primary character variable\
  \ Percent Change to Baseline Category y (PBCHGCAy) is populated but its corresponding\
  \ secondary numeric variable Percent Change to Baseline Category y (N) (PBCHGCyN)\
  \ is not populated."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "ALL"
Check:
  expression: >-
    not empty(PBCHGCAy) and empty(PBCHGCyN)
Outcome:
  Message: "Primary variable PBCHGCAy is populated, but its secondary variable PBCHGCyN\
    \ is not populated."
  Message_Folded: "PBCHGCyN not populated in any record of the dataset, and at least\
    \ one record meets the rest of the condition: Primary variable PBCHGCAy is populated,\
    \ but its secondary variable PBCHGCyN is not populated."
  Output_Variables:
  - "PBCHGCAy"
  - "PBCHGCyN"
wildcards:
  "y":
    min: 1
    max: 99
Source_Proposed:
  Sheet_Issue: "#76"
  Message: "Primary variable PBCHGCAy is populated, but its secondary variable PBCHGCyN\
    \ is not populated"
  Description: "In a pair of corresponding character and numeric variables, the secondary\
    \ variable must be populated if its primary variable is populated. Corresponding\
    \ character and numeric values must also have a one-to-one mapping consistency\
    \ when the primary variable is populated, which are addressed in other rules."
  Domains: "BDS, ADNCA, MDBDS, ADAMOTHER"
  Severity: "Error"
Source:
  Message: "Primary variable PBCHGCAy is populated, but its secondary variable PBCHGCyN\
    \ is not populated"
  Description: "In a pair of corresponding character and numeric variables, the primary\
    \ or most commonly used variable must be populated if its secondary variable describing\
    \ it is populated. Corresponding character and numeric values must also have a\
    \ one-to-one mapping consistency when the primary variable is populated, which\
    \ are addressed in other rules."
  Domains: "BDS, ADNCA, MDBDS, ADAMOTHER"
  Severity: "Error"
Standards:
- Organization: "PMDA"
  Standards:
  - Name: "ADaMIG"
    Version: "1.3"
    References:
