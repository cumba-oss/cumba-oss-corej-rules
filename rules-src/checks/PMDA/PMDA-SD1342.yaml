Core:
  Id: "PMDA-SD1342"
  Status: "Published"
  Version: "1"
Description: "Raise a warning when RFXSTDTC is empty but RFXENDTC is populated."
Severity: "Warning"
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "DM"
Requirements:
  Variables:
    All:
    - "RFXSTDTC"
Check:
  expression: >-
    not empty(RFXENDTC) and empty(RFXSTDTC)
Outcome:
  Message: "RFXSTDTC is empty but RFXENDTC is populated."
Source:
  Message: "Missing value for RFXSTDTC when RFXENDTC is provided"
  Description: "Date/Time of First Study Treatment (RFXSTDTC) variable must be populated\
    \ when Date/Time of Last Study Treatment (RFXENDTC)variable value is provided."
  Domains: "DM"
  Severity: "Warning"
