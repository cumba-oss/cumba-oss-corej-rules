Core:
  Id: "PMDA-SD2254"
  Status: "Published"
  Version: "1"
Description: "Raise a warning when the Parameter Value Code (TSVALCD) for a 'COMPTRT'\
  \ trial-summary parameter is not a valid Unique Ingredient Identifier (UNII) in\
  \ the FDA Substance Registration System (SRS)."
Severity: "Warning"
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "TS"
Requirements:
  Variables:
    All:
    - "TSPARMCD"
Bindings:
- name: "$comptrt_srs_code"
  expression: "valid_external_dictionary_code(TSVALCD, external_dictionary_type=\"\
    unii\", dictionary_term_type=\"UNII\")"
Check:
  expression: >-
    TSPARMCD == "COMPTRT" and $comptrt_srs_code == false
Outcome:
  Message: "TSVALCD is not a valid FDA-SRS Unique Ingredient Identifier (UNII) for\
    \ the 'COMPTRT' parameter."
Source:
  Message: "Invalid TSVALCD value for COMPTRT"
  Description: "TSVALCD for COMPTRT record must be a valid unique ingredient identifier\
    \ from FDA Substance Registration System (SRS)."
  Domains: "TS"
  Severity: "Warning"
