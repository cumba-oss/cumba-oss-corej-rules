Core:
  Id: "PMDA-SD1301"
  Status: "Published"
  Version: "1"
Description: "Raise an error when TDSTOFF is populated with a value other than 0 that\
  \ does not match the ISO 8601 duration format (e.g., P80Y)."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "TD"
Requirements:
  Variables:
    All:
    - "TDSTOFF"
Check:
  expression: >-
    not empty(TDSTOFF) and TDSTOFF != "0" and invalid_duration(TDSTOFF, negative=false)
Outcome:
  Message: "Invalid value for TDSTOFF variable: TDSTOFF must be 0, an ISO 8601 duration\
    \ (e.g. P80Y), or empty."
  Output_Variables:
  - "TDSTOFF"
Source:
  Message: "Invalid value for TDSTOFF variable"
  Description: "Offset from the Anchor (TDSTOFF) variable value must be either 0,\
    \ ISO 8601 format for duration (e.g., P80Y), or null."
  Domains: "TD"
  Severity: "Error"
