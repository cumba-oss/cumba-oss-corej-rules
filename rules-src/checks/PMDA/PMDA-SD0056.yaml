Core:
  Id: "PMDA-SD0056"
  Status: "Published"
  Version: "1"
Description: "Raise an error when a variable whose Core attribute is 'Req' (Required)\
  \ is not present in the dataset."
Severity: "Reject"
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "ALL"
Bindings:
- name: "$required_variables"
  expression: "required_variables()"
- name: "$dataset_variables"
  expression: "get_column_order_from_dataset()"
- name: "$dataset_variables_upper"
  expression: "upper($dataset_variables)"
- name: "$missing_required_variables"
  expression: "minus($required_variables, subtract=$dataset_variables_upper)"
Check:
  expression: >-
    not contains_all($dataset_variables_upper, $required_variables)
Outcome:
  Message: "A variable marked as Required (Core attribute 'Req') is not present in\
    \ the dataset."
  Output_Variables:
  - "$missing_required_variables"
  - "!$dataset_variables_upper"
Source:
  Message: "SDTM Required variable not found"
  Description: "Variables described in SDTM IG as Required must be included in the\
    \ dataset."
  Domains: "ALL"
  Severity: "Reject"
