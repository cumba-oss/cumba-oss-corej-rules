Core:
  Id: "PMDA-AD0104"
  Status: "Published"
  Version: "1"
Description: "Raise a warning when APERIOD is populated with a value xx but the ADSL\
  \ variable TRxxEDT is not present."
Severity: "Warning"
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "BASIC DATA STRUCTURE"
    - "OCCURRENCE DATA STRUCTURE"
Requirements:
  Variables:
    All:
    - "STUDYID"
    - "USUBJID"
    - "APERIOD"
    All_Or_None:
    - - "STUDYID"
      - "ADSL.STUDYID"
    - - "USUBJID"
      - "ADSL.USUBJID"
Match_Datasets:
- Name: "ADSL"
  Keys:
  - "STUDYID"
  - "USUBJID"
  Cardinality: "n:1"
Bindings:
- name: "$tr_edt"
  expression: "concat(\"ADSL.TR\", printf(\"%02d\", APERIOD), \"EDT\")"
Check:
  expression: >-
    not empty(APERIOD) and not empty($tr_edt) and not var_exists($tr_edt)
Outcome:
  Message: "TRxxEDT is not present in ADSL for this record's APERIOD value."
  Output_Variables:
  - "!$tr_edt"
Source:
  Message: "There is no TRxxEDT variable in ADSL for every unique xx value of APERIOD"
  Description: "The Analysis Period (APERIOD) values will be a number like 01. There\
    \ must be a corresponding Date of Last Exposure in Period xx variable for this\
    \ period (like TR01EDT) in ADSL dataset."
  Domains: "BDS, ADNCA, MDBDS, OCCDS, ADAE, MDOCCDS, ADAMOTHER"
  Severity: "Warning"
Standards:
- Organization: "PMDA"
  Standards:
  - Name: "ADaMIG"
    Version: "1.1"
    References:
    - Origin: "PMDA Validation Rules"
      Rule_Identifier:
        Id: "AD0104"
        Version: "1"
      Version: "6.0"
  - Name: "ADaMIG"
    Version: "1.0"
    References:
    - Origin: "PMDA Validation Rules"
      Rule_Identifier:
        Id: "AD0104"
        Version: "1"
      Version: "6.0"
  - Name: "ADaMIG"
    Version: "1.2"
    References:
    - Origin: "PMDA Validation Rules"
      Rule_Identifier:
        Id: "AD0104"
        Version: "1"
      Version: "6.0"
  - Name: "ADaMIG"
    Version: "1.3"
    References:
    - Origin: "PMDA Validation Rules"
      Rule_Identifier:
        Id: "AD0104"
        Version: "1"
      Version: "6.0"
