Core:
  Id: "PMDA-AD0230"
  Status: "Published"
  Version: "1"
Description: "Raise an error when, within a study, the Actual Sequence of Treatments\
  \ (N) (TRTSEQAN) variable does not hold a single consistent value for each unique\
  \ populated value of the Actual Sequence of Treatment (TRTSEQA) variable."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "SUBJECT LEVEL ANALYSIS DATASET"
Requirements:
  Variables:
    All:
    - "TRTSEQAN"
Check:
  expression: >-
    var_exists("TRTSEQA") and not empty(TRTSEQA) and is_inconsistent_across_dataset(TRTSEQAN,
    keys=[TRTSEQA])
Outcome:
  Message: "Inconsistent value for TRTSEQAN"
Source:
  Message: "Inconsistent value for TRTSEQAN"
  Description: "Within a study, all Actual Sequence of Treatments (N) (TRTSEQAN) variable\
    \ values must be the same for each unique value of Actual Sequence of Treatment\
    \ (TRTSEQA) variable when the primary variable TRTSEQA is populated."
  Domains: "ADSL"
  Severity: "Error"
Standards:
- Organization: "PMDA"
  Standards:
  - Name: "ADaMIG"
    Version: "1.0"
    References:
    - Origin: "PMDA Validation Rules"
      Rule_Identifier:
        Id: "AD0230"
        Version: "1"
      Version: "6.0"
