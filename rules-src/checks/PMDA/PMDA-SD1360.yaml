Core:
  Id: "PMDA-SD1360"
  Status: "Published"
  Version: "1"
Description: "Raise an error when the Reason Arm and/or Actual Arm is Null (ARMNRS)\
  \ variable is populated while both Planned Arm Code (ARMCD) and Actual Arm Code\
  \ (ACTARMCD) are populated."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "DM"
Check:
  expression: >-
    not empty(ARMNRS) and not empty(ARMCD) and not empty(ACTARMCD)
Outcome:
  Message: "ARMNRS is populated when both ARMCD and ACTARMCD are populated."
Source:
  Message: "ARMNRS is populated, but ARMCD and ACTARMCD are populated"
  Description: "The Reason Arm and/or Actual Arm is Null (ARMNRS) variable should\
    \ only be populated when Planned Arm Code (ARMCD) and Actual Arm Code (ACTARMCD)\
    \ are null."
  Domains: "DM"
  Severity: "Error"
