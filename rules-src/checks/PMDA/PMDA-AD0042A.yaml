Core:
  Id: "PMDA-AD0042A"
  Status: "Published"
  Version: "1"
Description: "Raise an error when a variable whose name ends in 'TM' (but not 'DTM')\
  \ has a missing SAS display format. *TM variables must have a non-missing SAS time\
  \ format."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "ALL"
Check:
  expression: >-
    ends_with(upper(varname()), "TM") and not ends_with(upper(varname()), "DTM") and not
    equalsIgnoreCase(varname(), "ARELTM") and var_type() == "Num" and empty(var_format())
Outcome:
  Message: "A variable whose name ends in 'TM' has a missing SAS time format."
Source:
  Message: "*TM variable has missing SAS Time Format"
  Description: "*TM variables must have non-missing SAS Time Format."
  Domains: "ADSL, ADDL, BDS, ADNCA, MDBDS, OCCDS, ADAE, MDOCCDS, ADAMOTHER"
  Severity: "Error"
Standards:
- Organization: "PMDA"
  Standards:
  - Name: "ADaMIG"
    Version: "1.3"
    References:
    - Origin: "PMDA Validation Rules"
      Rule_Identifier:
        Id: "AD0042A"
        Version: "1"
      Version: "6.0"
  - Name: "ADaMIG"
    Version: "1.2"
