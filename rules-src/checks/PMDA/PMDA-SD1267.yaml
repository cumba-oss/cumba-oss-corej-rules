Core:
  Id: "PMDA-SD1267"
  Status: "Published"
  Version: "1"
Description: "Raise an error when TAETORD is not an integer."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "TA"
Requirements:
  Variables:
    All:
    - "TAETORD"
Check:
  expression: >-
    not empty(TAETORD) and not is_integer(TAETORD)
Outcome:
  Message: "TAETORD is not an integer."
  Output_Variables:
  - "TAETORD"
Source:
  Message: "Invalid value for TAETORD"
  Description: "Planned Order of Element within Arm (TAETORD) variable value must\
    \ be an integer."
  Domains: "TA"
  Severity: "Error"
