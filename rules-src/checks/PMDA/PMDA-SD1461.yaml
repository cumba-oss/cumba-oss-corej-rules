Core:
  Id: "PMDA-SD1461"
  Status: "Published"
  Version: "1"
Description: "Raise a warning when Body System or Organ Class Code (--BDSYCD) is missing\
  \ while Body System or Organ Class (--BODSYS) is populated."
Severity: "Warning"
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "AE"
    - "CE"
    - "MH"
Requirements:
  Variables:
    All:
    - "--BODSYS"
    - "--BDSYCD"
Check:
  expression: >-
    not empty(--BODSYS) and empty(--BDSYCD)
Outcome:
  Message: "--BDSYCD is missing when --BODSYS is populated."
  Output_Variables:
  - "--BODSYS"
  - "--BDSYCD"
Source:
  Message: "--BDSYCD is null when --BODSYS is populated"
  Description: "Body System or Organ Class Code (--BDSYCD) must be populated when\
    \ Body System or Organ Class (--BODSYS) is populated."
  Domains: "AE, CE, MH"
  Severity: "Warning"
Standards:
- Organization: "PMDA"
  Standards:
  - Name: "SDTMIG"
    Version: "3.4"
    References:
    - Origin: "PMDA Validation Rules"
      Rule_Identifier:
        Id: "SD1461"
        Version: "1"
      Version: "6.0"
