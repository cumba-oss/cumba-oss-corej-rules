Core:
  Id: "PMDA-SD1047"
  Status: "Published"
  Version: "1"
Description: "Raise an error when --DOSE is populated and --DOSTXT is populated."
Executability: "Fully Executable"
Scope:
  Classes:
    Include:
    - "INTERVENTIONS"
Requirements:
  Variables:
    All:
    - "--DOSE"
    - "--DOSTXT"
Check:
  expression: >-
    not empty(--DOSE) and not empty(--DOSTXT)
Outcome:
  Message: "Both --DOSE and --DOSTXT values are populated"
Source:
  Message: "Both --DOSE and --DOSTXT values are populated"
  Description: "Only one of Dose (--DOSE) or Dose Description (--DOSTXT) variables\
    \ must be populated on the same record."
  Domains: "INTERVENTIONS"
  Severity: "Error"
