Core:
  Id: "PMDA-SD1359"
  Status: "Published"
  Version: "1"
Description: "Raise an error when the Reason Arm and/or Actual Arm is Null (ARMNRS)\
  \ variable is empty while the Planned Arm Code (ARMCD) or the Description of Planned\
  \ Arm (ARM) is empty."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "DM"
Check:
  expression: >-
    (empty(ARMCD) or empty(ARM)) and empty(ARMNRS)
Outcome:
  Message: "ARMNRS is not populated, when ARMCD or ARM is empty."
  Message_Folded: "ARM, ARMCD or ARMNRS absent or not populated in any record of the\
    \ dataset, and at least one record meets the rest of the condition: ARMNRS is\
    \ not populated, when ARMCD or ARM is empty."
Source:
  Message: "ARMNRS is not populated when ARMCD/ARM are not provided"
  Description: "When Planned Arm Code (ARMCD)/Description of Planned Arm (ARM) are\
    \ not populated, the Reason Arm and/or Actual Arm is Null (ARMNRS) variable must\
    \ be populated with the reason ARMCD/ARM are null."
  Domains: "DM"
  Severity: "Error"
