Core:
  Id: "PMDA-AD0289B"
  Status: "Published"
  Version: "1"
Description: "Raise an error when the AREL variable is not uniquely determined by\
  \ ARELN within the dataset: a single value of ARELN maps to more than one value\
  \ of AREL, considering only the records on which both variables are populated."
Executability: "Partially Executable"
ExecutabilityHint:
  Category: "partially executable"
  Detail: "The sheet's 'inconsistent across studies' intent is reinterpreted as a\
    \ within-dataset unique-relationship check between the char/numeric pair AREL/ARELN\
    \ (has_multiple_values_for); the cross-study scope is not evaluated."
Scope:
  Data_Structures:
    Include:
    - "BASIC DATA STRUCTURE"
    - "OCCURRENCE DATA STRUCTURE"
Check:
  expression: >-
    not empty(AREL) and not empty(ARELN) and has_multiple_values_for(AREL, ARELN)
Outcome:
  Message: "There is more than one value of AREL for a given value of ARELN (within\
    \ the dataset)."
  Output_Variables:
  - "AREL"
  - "ARELN"
Source:
  Message: "Inconsistent value for AREL"
  Description: "Across studies, all Analysis Causality (AREL) variable values must\
    \ be the same for each unique value of Analysis Causality (N) (ARELN) variable\
    \ when both variables are populated."
  Domains: "OCCDS, ADAE, MDOCCDS, ADAMOTHER"
  Severity: "Error"
Standards:
- Organization: "PMDA"
  Standards:
