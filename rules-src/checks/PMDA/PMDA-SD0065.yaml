Core:
  Id: "PMDA-SD0065"
  Status: "Published"
  Version: "1"
Description: "Raise a warning when VISITNUM is populated but the USUBJID + VISIT +\
  \ VISITNUM combination does not exist as a row in the SV domain, excluding records\
  \ where --STAT is populated and EC records where ECOCCUR equals 'N'."
Severity: "Warning"
Executability: "Partially Executable"
Scope:
  Domains:
    Exclude:
    - "SV"
    - "TV"
Requirements:
  Variables:
    All:
    - "VISIT"
Bindings:
- name: "$sv_visit_keys"
  expression: "distinct([USUBJID, VISIT, VISITNUM], domain=\"SV\")"
Check:
  expression: >-
    not empty(VISIT) and not empty(VISITNUM) and empty(--STAT) and (not var_exists("ECOCCUR") or
    ECOCCUR != "N") and tuple(USUBJID, VISIT, VISITNUM) not in $sv_visit_keys
Outcome:
  Message: "The USUBJID/VISIT/VISITNUM combination does not match any row in the SV\
    \ dataset."
  Output_Variables:
  - "VISITNUM"
  - "VISIT"
  - "!--STAT"
  - "ECOCCUR"
  - "$sv_visit_keys"
Source:
  Message: "USUBJID/VISIT/VISITNUM values do not match SV domain data"
  Description: "All Unique Subject Identifier (USUBJID) + Visit Name (VISIT) + Visit\
    \ Number (VISITNUM) combination values in data should be present in the Subject\
    \ Visits (SV) domain. There is an exception for records, where Status (--STAT)\
    \ variable value is populated. E.g., --STAT = 'NOT DONE'. Another exception is\
    \ for records, where Occurrence (ECOCCUR) is 'N' in EC domain."
  Domains: "SPECIAL PURPOSE (-SV), INTERVENTIONS, FINDINGS, EVENTS, FINDINGS ABOUT"
  Severity: "Warning"
