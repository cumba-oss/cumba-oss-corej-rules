Core:
  Id: "PMDA-SD0032"
  Status: "Published"
  Version: "1"
Description: "Raise a warning when Planned Time Point Name (--TPT) is empty while\
  \ Planned Time Point Number (--TPTNUM) is populated."
Severity: "Warning"
Executability: "Partially Executable - Possible Underreporting"
Scope:
  Classes:
    Include:
    - "INTERVENTIONS"
    - "EVENTS"
    - "FINDINGS"
    - "FINDINGS ABOUT"
  Domains:
    Exclude:
    - "DX"
    - "DS"
Requirements:
  Variables:
    All:
    - "--TPTNUM"
    - "--TPT"
Check:
  expression: >-
    not empty(--TPTNUM) and empty(--TPT)
Outcome:
  Message: "--TPT is empty when --TPTNUM is populated."
  Message_Folded: "--TPT not populated in any record of the dataset, and at least\
    \ one record meets the rest of the condition: --TPT is empty when --TPTNUM is\
    \ populated."
Source:
  Message: "Missing value for --TPT when --TPTNUM is provided"
  Description: "Planned Time Point Name (--TPT) should not be null when Planned Time\
    \ Point Number (--TPTNUM) is populated."
  Domains: "CO, INTERVENTIONS (-DX), FINDINGS, EVENTS (-DS), FINDINGS ABOUT"
  Severity: "Warning"
