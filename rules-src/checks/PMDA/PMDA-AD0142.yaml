Core:
  Id: "PMDA-AD0142"
  Status: "Published"
  Version: "1"
Description: "Raise an error when the Parameter Code (PARAMCD) does not have a single\
  \ consistent value for each unique value of the Parameter (PARAM), evaluated on\
  \ rows where both PARAMCD and PARAM are populated; within a study each PARAM value\
  \ must map to one PARAMCD value."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "BASIC DATA STRUCTURE"
    - "MEDICAL DEVICE BASIC DATA STRUCTURE"
Check:
  expression: >-
    not empty(PARAMCD) and not empty(PARAM) and is_inconsistent_across_dataset(PARAMCD,
    keys=[PARAM])
Outcome:
  Message: "Inconsistent value for PARAMCD within a unique PARAM"
Source:
  Message: "Inconsistent value for PARAMCD within a unique PARAM"
  Description: "Within a study, All PARAMCD values must be the same for each unique\
    \ value of PARAM when both PARAMCD and PARAM are populated."
  Domains: "BDS, ADNCA, MDBDS"
  Severity: "Error"
