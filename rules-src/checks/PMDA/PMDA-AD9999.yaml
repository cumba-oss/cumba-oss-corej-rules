Core:
  Id: "PMDA-AD9999"
  Status: "Published"
  Version: "1"
Description: "Raise a warning when an ADaM dataset's structure is not one of the supported\
  \ ADSL (Subject-Level Analysis Dataset), BDS (Basic Data Structure), or OCCDS (Occurrence\
  \ Data Structure) structures, so the dataset is not validated."
Severity: "Warning"
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "ALL"
Check:
  expression: >-
    not empty(ds_class("DEFINE")) and upper(ds_class("DEFINE")) not in
    ["SUBJECT LEVEL ANALYSIS DATASET", "BASIC DATA STRUCTURE", "OCCURRENCE DATA STRUCTURE"]
Outcome:
  Message: "The dataset structure is not one of the supported ADSL, BDS, or OCCDS\
    \ structures, so the dataset is not validated."
Source:
  Message: "Dataset not validated"
  Description: "Validation is defined only for ADSL, BDS, and OCCDS datasets. Other\
    \ dataset structures are not currently supported."
  Domains: "UNRECOGNIZED"
  Severity: "Warning"
Standards:
- Organization: "PMDA"
  Standards:
