Core:
  Id: "PMDA-SD2218"
  Status: "Published"
  Version: "1"
Description: "Raise a warning when the Trial Summary (TS) dataset does not contain\
  \ a record where TSPARMCD equals 'SPONSOR' (Clinical Study Sponsor)."
Severity: "Warning"
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "TS"
Bindings:
- name: "$sponsor_count"
  expression: "record_count(filter=filter(TSPARMCD=\"SPONSOR\"))"
Check:
  expression: >-
    $sponsor_count == 0
Outcome:
  Message: "Missing SPONSOR Trial Summary Parameter: a 'Clinical Study Sponsor' (SPONSOR)\
    \ record must be present in the Trial Summary (TS) domain."
  Output_Variables:
  - "$sponsor_count"
Source:
  Message: "Missing SPONSOR Trial Summary Parameter"
  Description: "'Clinical Study Sponsor' (SPONSOR) record must be populated in Trial\
    \ Summary (TS) domain. It is expected for SDTM IG v3.1.2 data and required for\
    \ data in all more recent SDTM versions."
  Domains: "TS"
  Severity: "Warning"
