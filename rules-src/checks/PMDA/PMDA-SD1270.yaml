Core:
  Id: "PMDA-SD1270"
  Status: "Published"
  Version: "1"
Description: "Raise an error when a PP dataset is present in study, but a PC dataset\
  \ is not present in study."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "PP"
Check:
  expression: >-
    ds_exists("PP") and not ds_exists("PC")
Outcome:
  Message: "PC dataset is not present in study, when a PP dataset is present in study."
Source:
  Message: "Missing PC dataset when PP dataset is present"
  Description: "Pharmacokinetic Concentrations (PC) dataset should be included when\
    \ a Pharmacokinetic Parameters (PP) dataset is present."
  Domains: "PC"
  Severity: "Error"
