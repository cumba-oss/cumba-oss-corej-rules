Core:
  Id: "PMDA-SD1289"
  Status: "Published"
  Version: "1"
Description: "Raise an error when --PTCD is populated but --DECOD is empty."
Executability: "Fully Executable"
Scope:
  Classes:
    Include:
    - "EVENTS"
Requirements:
  Variables:
    All:
    - "--DECOD"
    - "--PTCD"
Check:
  expression: >-
    not empty(--PTCD) and empty(--DECOD)
Outcome:
  Message: "--DECOD is empty when --PTCD is populated."
  Message_Folded: "--DECOD not populated in any record of the dataset, and at least\
    \ one record meets the rest of the condition: --DECOD is empty when --PTCD is\
    \ populated."
Source:
  Message: "Missing value for --DECOD when --PTCD is populated"
  Description: "Dictionary-Derived Term (--DECOD) should be populated when Preferred\
    \ Term Code (--PTCD) is populated."
  Domains: "EVENTS"
  Severity: "Error"
