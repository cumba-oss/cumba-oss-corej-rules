Core:
  Id: "PMDA-SD1311"
  Status: "Published"
  Version: "1"
Description: "Raise a warning when a record exists in TS with TSPARMCD equal to 'STYPE'\
  \ and TSVAL equal to 'INTERVENTIONAL', but TSVAL is empty for the record where TSPARMCD\
  \ equals 'INTTYPE'."
Severity: "Warning"
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "TS"
Requirements:
  Variables:
    All:
    - "TSPARMCD"
Bindings:
- name: "$STYPE_INTERVENTIONAL"
  expression: "record_count(group=[STUDYID], filter=filter(TSPARMCD=\"STYPE\", TSVAL=\"\
    INTERVENTIONAL\"))"
Check:
  expression: >-
    TSPARMCD == "INTTYPE" and $STYPE_INTERVENTIONAL >= 1 and empty(TSVAL)
Outcome:
  Message: "TSVAL is empty for the INTTYPE Trial Summary Parameter when a record exists\
    \ with TSPARMCD equal to 'STYPE' and TSVAL equal to 'INTERVENTIONAL'."
  Output_Variables:
  - "TSPARMCD"
  - "TSVAL"
  - "$STYPE_INTERVENTIONAL"
Source:
  Message: "TSVAL is missing for the INTTYPE Trial Summary Parameter when STYPE parameter\
    \ equals 'INTERVENTIONAL'"
  Description: "When the study type is interventional (TSPARMCD = 'STYPE' and TSVAL\
    \ = 'INTERVENTIONAL'), the Intervention Type parameter should be provided with\
    \ Parameter Value populated (TSVAL should not be null when TSPARMCD = 'INTTYPE')."
  Domains: "TS"
  Severity: "Warning"
