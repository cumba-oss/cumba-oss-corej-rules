Core:
  Id: "PMDA-SD1331"
  Status: "Published"
  Version: "1"
Description: "Raise an error when the Start Date/Time (--STDTC) is after the Date/Time\
  \ of Collection (--DTC)."
Executability: "Fully Executable"
Scope:
  Classes:
    Include:
    - "INTERVENTIONS"
    - "EVENTS"
  Domains:
    Exclude:
    - "BE"
Requirements:
  Variables:
    All:
    - "--DTC"
Check:
  expression: >-
    not empty(--STDTC) and not empty(--DTC) and date(--STDTC) > date(--DTC)
Outcome:
  Message: "--STDTC is after --DTC"
  Output_Variables:
  - "--DTC"
  - "--STDTC"
Source:
  Message: "--STDTC is after --DTC"
  Description: "Start Date/Time of Event, Exposure (--STDTC) must be less or equal\
    \ to Date/Time of Collection(--DTC)."
  Domains: "INTERVENTIONS, EVENTS (-BE)"
  Severity: "Error"
