Core:
  Id: "PMDA-SD1120"
  Status: "Published"
  Version: "1"
Description: "Raise a warning when a Supplemental Qualifier (SUPP--) record carries\
  \ a comment qualifier (Qualifier Variable Name QNAM contains 'COMM' or Qualifier\
  \ Variable Label QLABEL contains 'Comment', case-insensitive) that should instead\
  \ be stored in the Comments (CO) domain."
Severity: "Warning"
Executability: "Partially Executable - Possible Underreporting"
Scope:
  Domains:
    Include:
    - "SUPP--"
    - "SQ--"
Check:
  expression: >-
    var_exists("QNAM") and QNAM =~ /.*COMM/ or var_exists("QLABEL") and QLABEL =~
    /.*[Cc][Oo][Mm][Mm][Ee][Nn][Tt]/
Outcome:
  Message: "Comments in SUPPQUAL domain."
Source:
  Message: "Comments in SUPPQUAL domain"
  Description: "Comments should be stored in Comments (CO) domain, rather than be\
    \ put into Supplemental Qualifier (SUPP--) domains."
  Domains: "SUPPQUAL"
  Severity: "Warning"
