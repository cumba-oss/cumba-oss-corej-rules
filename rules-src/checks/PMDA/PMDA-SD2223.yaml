Core:
  Id: "PMDA-SD2223"
  Status: "Published"
  Version: "1"
Description: "Raise a warning when the study type is 'INTERVENTIONAL', the intervention\
  \ type (TSPARMCD equals 'INTTYPE') is a pharmacological one (DRUG, BIOLOGIC, VACCINE,\
  \ DIETARY SUPPLEMENT or COMBINATION PRODUCT), and the Trial Summary (TS) dataset\
  \ does not contain a record where TSPARMCD equals 'PCLAS' (Pharmacological Class\
  \ of Investigational Therapy)."
Severity: "Warning"
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "TS"
Bindings:
- name: "$pclas_count"
  expression: "record_count(filter=(TSPARMCD == \"PCLAS\"))"
- name: "$inttype_pharm_count"
  expression: "record_count(filter=(TSPARMCD == \"INTTYPE\" and TSVAL in [\"DRUG\"\
    , \"BIOLOGIC\", \"VACCINE\", \"DIETARY SUPPLEMENT\", \"COMBINATION PRODUCT\"]))"
- name: "$stype_interventional_count"
  expression: "record_count(filter=(TSPARMCD == \"STYPE\" and TSVAL == \"INTERVENTIONAL\"\
    ))"
Check:
  expression: >-
    $stype_interventional_count >= 1 and $inttype_pharm_count >= 1 and $pclas_count == 0
Outcome:
  Message: "Missing PCLAS Trial Summary Parameter: a 'Pharmacological Class of Investigational\
    \ Therapy' (PCLAS) record must be present in the Trial Summary (TS) domain."
  Output_Variables:
  - "$pclas_count"
Source:
  Message: "Missing PCLAS Trial Summary Parameter"
  Description: "'Pharmacological Class of Investigational Therapy' (PCLAS) record\
    \ must be populated in Trial Summary (TS) domain when study type is 'INTERVENTIONAL'\
    \ and if Intervention Type (INTTYPE) is one for which pharmacological class is\
    \ applicable. It is expected for SDTM IG v3.1.2 data and required for data in\
    \ all more recent SDTM versions."
  Domains: "TS"
  Severity: "Warning"
