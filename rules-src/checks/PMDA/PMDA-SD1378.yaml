Core:
  Id: "PMDA-SD1378"
  Status: "Published"
  Version: "1"
Description: "Raise an error when an Element Code (ETCD) value defined in Trial Elements\
  \ (TE) is not assigned to any Arm in the Trial Arms (TA) dataset."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "TE"
Bindings:
- name: "$ta_etcd"
  expression: "distinct(ETCD, domain=\"TA\")"
Check:
  expression: >-
    not empty(ETCD) and ETCD not in $ta_etcd
Outcome:
  Message: "ETCD value not present in TA"
  Output_Variables:
  - "ETCD"
  - "$ta_etcd"
Source:
  Message: "ETCD value does not present in TA"
  Description: "Element Code (ETCD) values defined in Trial Elements (TE) should be\
    \ assigned for at least one Arm Code (ARMCD) in Trial Arms (Trial Arms)."
  Domains: "TE"
  Severity: "Error"
Standards:
- Organization: "PMDA"
  Standards:
  - Name: "SDTMIG"
    Version: "3.4"
    References:
    - Origin: "PMDA Validation Rules"
      Rule_Identifier:
        Id: "SD1378"
        Version: "1"
      Version: "6.0"
  - Name: "SDTMIG"
    Version: "3.3"
    References:
    - Origin: "PMDA Validation Rules"
      Rule_Identifier:
        Id: "SD1378"
        Version: "1"
      Version: "6.0"
