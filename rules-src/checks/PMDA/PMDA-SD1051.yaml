Core:
  Id: "PMDA-SD1051"
  Status: "Published"
  Version: "1"
Description: "Raise a warning when RDOMAIN equals 'DM' but IDVAR or IDVARVAL is populated."
Severity: "Warning"
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "SUPP--"
    - "SQ--"
Requirements:
  Variables:
    All:
    - "RDOMAIN"
Check:
  expression: >-
    upper(RDOMAIN) == "DM" and (not empty(IDVAR) or not empty(IDVARVAL))
Outcome:
  Message: "IDVAR or IDVARVAL is populated when RDOMAIN equals 'DM'."
Source:
  Message: "Unexpected value for IDVAR/IDVARVAL"
  Description: "Both Identifying Variable (IDVAR) and Identifying Variable Value (IDVARVAL)\
    \ should not be populated when relating information to the Demographics (DM) domain."
  Domains: "SUPPQUAL"
  Severity: "Warning"
