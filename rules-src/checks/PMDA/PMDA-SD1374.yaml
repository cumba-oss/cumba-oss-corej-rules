Core:
  Id: "PMDA-SD1374"
  Status: "Published"
  Version: "1"
Description: "Raise a warning when a DM subject who received treatment (ACTARMCD is\
  \ populated) has no record in the Disposition (DS) domain."
Severity: "Warning"
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "DM"
Bindings:
- name: "$ds_usubjid"
  expression: "distinct(USUBJID, domain=\"DS\")"
Check:
  expression: >-
    not empty(ACTARMCD) and USUBJID not in $ds_usubjid
Outcome:
  Message: "There are no DS records for subject who was assigned treatment."
  Output_Variables:
  - "ACTARMCD"
  - "$ds_usubjid"
Source:
  Message: "No Disposition record found for subject"
  Description: "All Demographics (DM) subjects (USUBJID) should have at least one\
    \ record in the Disposition (DS) domain with only possible exceptions to subjects\
    \ who did not receive treatment (ACTARMCD is null)."
  Domains: "DM"
  Severity: "Warning"
Standards:
- Organization: "PMDA"
  Standards:
  - Name: "SDTMIG"
    Version: "3.3"
    References:
    - Origin: "PMDA Validation Rules"
      Rule_Identifier:
        Id: "SD1374"
        Version: "1"
      Version: "6.0"
  - Name: "SDTMIG"
    Version: "3.4"
    References:
    - Origin: "PMDA Validation Rules"
      Rule_Identifier:
        Id: "SD1374"
        Version: "1"
      Version: "6.0"
- Organization: "FDA"
  Standards:
