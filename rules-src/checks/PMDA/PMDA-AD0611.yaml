Core:
  Id: "PMDA-AD0611"
  Status: "Published"
  Version: "1"
Description: "Raise an error when, on a BDS or OCCDS record where APHASEN is populated,\
  \ PHEDT does not equal the ADSL variable PHwEDT for the same USUBJID (where w equals\
  \ the record's APHASEN value)."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "BASIC DATA STRUCTURE"
    - "OCCURRENCE DATA STRUCTURE"
Requirements:
  Variables:
    All:
    - "STUDYID"
    - "USUBJID"
    - "PHEDT"
    - "APHASEN"
    All_Or_None:
    - - "STUDYID"
      - "ADSL.STUDYID"
    - - "USUBJID"
      - "ADSL.USUBJID"
Match_Datasets:
- Name: "ADSL"
  Keys:
  - "STUDYID"
  - "USUBJID"
  Cardinality: "n:1"
Bindings:
- name: "$ph_edt"
  expression: "colref(concat(\"ADSL.PH\", printf(\"%d\", APHASEN), \"EDT\"))"
Check:
  expression: >-
    not empty(APHASEN) and not empty(PHEDT) and PHEDT != $ph_edt
Outcome:
  Message: "On a given record, APHASEN is populated and the value of PHEDT is not\
    \ equal to the value of variable PHwEDT where w equals the value of APHASEN"
  Output_Variables:
  - "ADSL.PHwEDT"
  - "!$ph_edt"
Source:
  Message: "APHASEN w has a PHEDT != ADSL.PHwEDT"
  Description: "When analysis Phase (APHASE) is defined, the Phase End Date (PHEDT)\
    \ variable value must equal ADSL Phase w End Date (PHwEDT) variable value for\
    \ that phase defined by the value in Phase (N) (APHASEN) variable. APHASEN = w."
  Domains: "BDS, ADNCA, MDBDS, OCCDS, ADAE, MDOCCDS, ADAMOTHER"
  Severity: "Error"
Standards:
- Organization: "PMDA"
  Standards:
  - Name: "ADaMIG"
    Version: "1.2"
    References:
    - Origin: "PMDA Validation Rules"
      Rule_Identifier:
        Id: "AD0611"
        Version: "1"
      Version: "6.0"
  - Name: "ADaMIG"
    Version: "1.3"
    References:
    - Origin: "PMDA Validation Rules"
      Rule_Identifier:
        Id: "AD0611"
        Version: "1"
      Version: "6.0"
