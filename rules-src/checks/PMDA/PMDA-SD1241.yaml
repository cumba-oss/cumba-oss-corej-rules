Core:
  Id: "PMDA-SD1241"
  Status: "Published"
  Version: "1"
Description: "Raise a warning when --BDSYCD is populated but --BODSYS is empty."
Severity: "Warning"
Executability: "Partially Executable - Possible Underreporting"
Scope:
  Domains:
    Include:
    - "AE"
    - "CE"
    - "MH"
Requirements:
  Variables:
    All:
    - "--BDSYCD"
    - "--BODSYS"
Check:
  expression: >-
    not empty(--BDSYCD) and empty(--BODSYS)
Outcome:
  Message: "--BODSYS is empty when --BDSYCD is populated."
  Output_Variables:
  - "--BODSYS"
  - "--BDSYCD"
Source:
  Message: "--BODSYS is not populated when --BDSYCD is populated"
  Description: "Body System or Organ Class (--BODSYS) must be populated when Body\
    \ System or Organ Class Code (--BDSYCD) is populated."
  Domains: "AE, CE, MH"
  Severity: "Warning"
