Core:
  Id: "PMDA-AD0206"
  Status: "Published"
  Version: "1"
Description: "Raise an error when, for the same subject (USUBJID), the Sex (SEX) value\
  \ in ADSL is populated and differs from the Sex (SEX) value in DM. There must be\
  \ traceability between ADaM and SDTM."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "SUBJECT LEVEL ANALYSIS DATASET"
Requirements:
  Variables:
    All:
    - "SEX"
    - "DM.SEX"
    - "STUDYID"
    - "USUBJID"
    All_Or_None:
    - - "STUDYID"
      - "DM.STUDYID"
    - - "USUBJID"
      - "DM.USUBJID"
Match_Datasets:
- Keys:
  - "STUDYID"
  - "USUBJID"
  Cardinality: "n:1"
  Name: "DM"
Check:
  expression: >-
    not empty(SEX) and SEX != DM.SEX
Outcome:
  Message: "ADSL.SEX does not match DM.SEX for the same subject (USUBJID)."
Source:
  Message: "For the same USUBJID, the ADSL.SEX != DM.SEX"
  Description: "The same subject in ADSL and DM must have the same value for Sex (SEX).\
    \ There must be traceability between ADaM and SDTM."
  Domains: "ADSL"
  Severity: "Error"
Standards:
- Organization: "PMDA"
  Standards:
  - Name: "ADaMIG"
    Version: "1.3"
    References:
    - Origin: "PMDA Validation Rules"
      Rule_Identifier:
        Id: "AD0206"
        Version: "1"
      Version: "6.0"
  - Name: "ADaMIG"
    Version: "1.2"
    References:
    - Origin: "PMDA Validation Rules"
      Rule_Identifier:
        Id: "AD0206"
        Version: "1"
      Version: "6.0"
  - Name: "ADaMIG"
    Version: "1.1"
    References:
    - Origin: "PMDA Validation Rules"
      Rule_Identifier:
        Id: "AD0206"
        Version: "1"
      Version: "6.0"
  - Name: "ADaMIG"
    Version: "1.0"
    References:
    - Origin: "PMDA Validation Rules"
      Rule_Identifier:
        Id: "AD0206"
        Version: "1"
      Version: "6.0"
