Core:
  Id: "PMDA-SD9715"
  Status: "Published"
  Version: "1"
Description: "Raise a warning when Standard Units (--STRESU) is not present in the\
  \ dataset although a numeric Character Result/Finding in Std Format (--STRESC) is\
  \ reported with Original Units (--ORRESU) populated."
Sensitivity: "Dataset"
Executability: "Partially Executable - Possible Overreporting"
Scope:
  Classes:
    Include:
    - "FINDINGS"
    - "FINDINGS ABOUT"
  Domains:
    Exclude:
    - "IE"
    - "QS"
    - "SC"
    - "SS"
Requirements:
  Variables:
    None:
    - "--STRESU"
    All:
    - "--STRESC"
    - "--ORRESU"
Check:
  expression: >-
    --STRESC =~ /^-?[0-9]+(\\.[0-9]+)?$/ and not empty(--ORRESU)
Outcome:
  Message: "--STRESU is not present in the dataset although numeric standardised results\
    \ with original units are reported."
Source_Proposed:
  Sheet_Issue: "#172,#173,#174"
  Message: "Standard Units (--STRESU) is not present in the dataset when --STRESC\
    \ is provided as a numeric result"
  Description: "Standard Units (--STRESU) should be present in the dataset when Character\
    \ Result/Finding in Std Units (--STRESC) is provided as a numeric result."
  Domains: "FINDINGS (-IE, -QS, -SC, -SS), FINDINGS ABOUT"
  Severity: "Warning"
Standards:
- Organization: "PMDA"
  Standards:
  - Name: "SDTMIG"
    Version: "3.4"
  - Name: "SDTMIG"
    Version: "3.3"
  - Name: "SDTMIG"
    Version: "3.2"
  - Name: "SDTMIG"
    Version: "3.1.3"
  - Name: "SDTMIG"
    Version: "3.1.2"
