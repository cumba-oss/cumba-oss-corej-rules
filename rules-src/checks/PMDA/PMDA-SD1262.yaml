Core:
  Id: "PMDA-SD1262"
  Status: "Published"
  Version: "1"
Description: "Raise a warning when SSSTRESC is equal to 'DEAD' in the SS dataset and\
  \ SSDTC is less than the subject's maximum DSSTDTC in the DS dataset."
Severity: "Warning"
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "SS"
Requirements:
  Variables:
    All:
    - "SSSTRESC"
Bindings:
- name: "$max_ds_dsstdtc"
  expression: "max_date(DSSTDTC, domain=\"DS\", group=[USUBJID])"
Check:
  expression: >-
    SSSTRESC == "DEAD" and date(SSDTC) < $max_ds_dsstdtc
Outcome:
  Message: "SSDTC is not greater than or equal to the subject's maximum DSSTDTC value\
    \ in the DS dataset, when SSSTRESC is equal to 'DEAD'."
Source:
  Message: "SSDTC is not greater than or equal to DSSTDTC when SSSTRESC = 'DEAD'"
  Description: "Subject Status Date/Time of Assessment (SSDTC) must be greater than\
    \ or equal to Start Date/Time of Disposition Event (DSSTDTC) when the subject's\
    \ status is 'DEAD'."
  Domains: "SS"
  Severity: "Warning"
Standards:
