Core:
  Id: "PMDA-SD1023-B"
  Status: "Published"
  Version: "1"
Description: "Raise a warning when the Subject Visits (SV) dataset is not present\
  \ in the study and a (VISIT, VISITNUM) combination does not match any combination\
  \ defined in the Trial Visits (TV) dataset, excluding unscheduled or unplanned visits."
Severity: "Warning"
Executability: "Partially Executable - Possible Overreporting"
Scope:
  Domains:
    Exclude:
    - "TV"
Requirements:
  Variables:
    All:
    - "VISIT"
    - "VISITNUM"
    - "TV.VISIT"
Bindings:
- name: "$tv_visit_keys"
  expression: "distinct([VISIT, VISITNUM], domain=\"TV\")"
Check:
  expression: >-
    not ds_exists("SV") and not empty(VISIT) and not empty(VISITNUM) and not contains(upper(VISIT),
    "UNSCHEDUL") and not contains(upper(VISIT), "UNPLAN") and tuple(VISIT, VISITNUM) not in
    $tv_visit_keys
Outcome:
  Message: "The SV dataset is not present, so planned-ness is decided by the visit\
    \ name alone, and the (VISIT, VISITNUM) combination does not match any planned\
    \ visit defined in the Trial Visits (TV) dataset."
  Output_Variables:
  - "$tv_visit_keys"
Source_Proposed:
  Class: "ALL"
  Domain: "ALL"
  Variable: "VISIT"
  Condition: "SV dataset is not present and VISIT ^= null and VISITNUM ^= null and\
    \ VISIT does not identify the visit as unscheduled or unplanned"
  Rule: "(VISIT, VISITNUM) in TV"
Source:
  Message: "VISIT/VISITNUM values do not match TV domain data"
  Description: "Combination of Visit Name (VISIT) and Visit Number (VISITNUM) in subject-level\
    \ domains should match that in the TV domain except for Unscheduled and Unplanned\
    \ visits."
  Domains: "SPECIAL PURPOSE, INTERVENTIONS, FINDINGS, EVENTS, FINDINGS ABOUT"
  Severity: "Warning"
