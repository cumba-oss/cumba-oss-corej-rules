Core:
  Id: "CDISC-CG0309"
  Status: "Published"
  Version: "1"
Description: "Raise an error when the DOMAIN value length of an Associated Persons\
  \ (AP--) dataset is not equal to 4 characters."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "AP--"
    Exclude:
    - "APRELSUB"
Check:
  expression: >-
    len(DOMAIN) != 4
Outcome:
  Message: "AP-- DOMAIN value length is not equal to 4."
Source:
  Class: "ALL"
  Domain: "AP--"
  Variable: "DOMAIN"
  Rule: "DOMAIN value length = 4"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "SDTMIG"
    Version: "3.4"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0309"
        Version: "1"
      Version: "2.0"
  - Name: "SDTMIG"
    Version: "3.3"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0309"
        Version: "1"
      Version: "2.0"
  - Name: "SDTMIG"
    Version: "3.2"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0309"
        Version: "1"
      Version: "2.0"
