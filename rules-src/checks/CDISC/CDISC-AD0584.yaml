Core:
  Id: "CDISC-AD0584"
  Status: "Published"
  Version: "2"
Description: "Raise an error when, within a parameter, there is more than one value\
  \ of BCHGCATy for a given value of BCHGCAyN, considering only those rows on which\
  \ both variables are populated, where y is an integer [1-99, not zero-padded]."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "BASIC DATA STRUCTURE"
Check:
  expression: >-
    not empty(BCHGCATy) and not empty(BCHGCAyN) and has_multiple_values_for(BCHGCATy, BCHGCAyN,
    within=PARAMCD)
Outcome:
  Message: "Within a parameter, there is more than one value of BCHGCATy for a given\
    \ value of BCHGCAyN, considering only those rows on which both variables are populated"
  Output_Variables:
  - "PARAMCD"
  - "BCHGCATy"
  - "BCHGCAyN"
wildcards:
  "y":
    min: 1
    max: 99
Source:
  Class: "BASIC DATA STRUCTURE; MEDICAL DEVICE BASIC DATA STRUCTURE"
  Variable_or_Item: "BCHGCATy where y is an integer [1-9, not zero-padded]"
  Natural_Language_Rule_Failure_Criteria: "Within a parameter, there is more than\
    \ one value of BCHGCATy for a given value of BCHGCAyN, considering only those\
    \ rows on which both variables are populated"
  Rule_Failure_Criteria: "Within a parameter, there is more than one value of BCHGCATy\
    \ for a given value of BCHGCAyN"
  Condition_Failure: "On rows where both BCHGCATy and BCHGCAyN are both populated"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.2"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR584"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.3"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR584"
        Version: "2"
      Version: "5.0"
