Core:
  Id: "CDISC-CG0032"
  Status: "Published"
  Version: "1"
Description: "Raise an error when VISITNUM matches a VISITNUM value in the Trial Visits\
  \ (TV) dataset (the visit is planned) but VISITDY does not equal the VISITDY value\
  \ of the corresponding VISITNUM in the TV dataset."
Executability: "Fully Executable"
Scope:
  Domains:
    Exclude:
    - "TV"
Requirements:
  Variables:
    All:
    - "VISITNUM"
    - "VISITDY"
    - "TV.VISITDY"
Match_Datasets:
- Keys:
  - "VISITNUM"
  Name: "TV"
Bindings:
- name: "$tv_visitnum"
  expression: "distinct(VISITNUM, domain=\"TV\")"
Check:
  expression: >-
    VISITNUM in $tv_visitnum and VISITDY != TV.VISITDY
Outcome:
  Message: "VISITDY does not match the VISITDY value of the corresponding VISITNUM\
    \ in the TV dataset."
  Output_Variables:
  - "VISITNUM"
  - "VISITDY"
  - "TV.VISITDY"
  - "$tv_visitnum"
Source:
  Class: "ALL"
  Domain: "ALL"
  Variable: "VISITDY"
  Condition: "VISITNUM is in TV.VISITNUM"
  Rule: "VISITDY = TV.VISITDY"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "SDTMIG"
    Version: "3.4"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0032"
        Version: "2"
      Version: "2.0"
  - Name: "SDTMIG"
    Version: "3.3"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0032"
        Version: "2"
      Version: "2.0"
  - Name: "SDTMIG"
    Version: "3.2"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0032"
        Version: "2"
      Version: "2.0"
