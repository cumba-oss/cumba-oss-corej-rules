Core:
  Id: "CDISC-AD0145"
  Status: "Published"
  Version: "2"
Description: "Raise an error when PARAMCD has characters that are not letters, digits,\
  \ and underscores."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "BASIC DATA STRUCTURE"
    - "MEDICAL DEVICE BASIC DATA STRUCTURE"
Requirements:
  Variables:
    All:
    - "PARAMCD"
Check:
  expression: >-
    not empty(PARAMCD) and PARAMCD !~ /^[A-Z0-9_]+$/
Outcome:
  Message: "PARAMCD contains a character that is not a letter, digit, or underscore."
Source:
  Class: "BASIC DATA STRUCTURE; MEDICAL DEVICE BASIC DATA STRUCTURE"
  Variable_or_Item: "PARAMCD"
  Natural_Language_Rule_Failure_Criteria: "PARAMCD has characters that are not letters,\
    \ digits, and underscores"
  Rule_Failure_Criteria: "PARAMCD has characters that are not letters, digits, and\
    \ underscores"
