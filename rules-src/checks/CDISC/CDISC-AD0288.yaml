Core:
  Id: "CDISC-AD0288"
  Status: "Published"
  Version: "1"
Description: "Raise an error when there is more than one value of AERELN for a given\
  \ value of AEREL."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "OCCURRENCE DATA STRUCTURE"
Check:
  expression: >-
    not empty(AERELN) and not empty(AEREL) and has_multiple_values_for(AERELN, AEREL)
Outcome:
  Message: "AERELN has more than one value for the same value of AEREL."
Source:
  Class: "OCCURRENCE DATA STRUCTURE"
  Variable_or_Item: "AERELN"
  Natural_Language_Rule_Failure_Criteria: "There is more than one value of AERELN\
    \ for a given value of AEREL"
  Rule_Failure_Criteria: "There is more than one value of AERELN for a given value\
    \ of AEREL"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.0"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR288"
        Version: "1"
      Version: "5.0"
