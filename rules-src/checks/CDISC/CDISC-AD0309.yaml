Core:
  Id: "CDISC-AD0309"
  Status: "Published"
  Version: "2"
Description: "Raise an error when SMQzzSC is populated and SMQzzCD is missing, where\
  \ zz is an integer [01-99, zero-padded]."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "OCCURRENCE DATA STRUCTURE"
    - "MEDICAL DEVICE OCCURRENCE DATA STRUCTURE"
Check:
  expression: >-
    not empty(SMQzzSC) and empty(SMQzzCD)
Outcome:
  Message: "SMQzzSC is populated and SMQzzCD is missing"
  Message_Folded: "SMQzzCD not populated in any record of the dataset, and at least\
    \ one record meets the rest of the condition: SMQzzSC is populated and SMQzzCD\
    \ is missing"
  Output_Variables:
  - "SMQzzCD"
  - "SMQzzSC"
wildcards:
  zz:
    min: 1
    max: 99
Source:
  Class: "OCCURRENCE DATA STRUCTURE; MEDICAL DEVICE OCCURRENCE DATA STRUCTURE"
  Variable_or_Item: "SMQzzCD where zz is an integer [01-99, zero-padded]"
  Natural_Language_Rule_Failure_Criteria: "SMQzzSC is populated and SMQzzCD is not\
    \ populated"
  Rule_Failure_Criteria: "SMQzzCD is not populated"
  Condition_Failure: "SMQzzSC is populated"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.0"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
