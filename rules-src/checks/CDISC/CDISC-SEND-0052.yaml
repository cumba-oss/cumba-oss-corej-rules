Core:
  Id: "CDISC-SEND-0052"
  Status: "Published"
  Version: "1"
Description: "Raise an error when, for a variable subject to CDISC controlled terminology,\
  \ the Define-XML document neither includes the controlled terminology nor references\
  \ external controlled terminology."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "ALL"
Variable_Universe: "Define"
Check:
  expression: >-
    not empty(var_name("DEFINE")) and not empty(var_codelist("LIBRARY")) and
    empty(var_codelist("DEFINE")) and empty(var_ccode("DEFINE"))
Outcome:
  Message: "The Define-XML document neither includes the controlled terminology for\
    \ the variable nor references external controlled terminology."
Source:
  Class: "ALL"
  Domain: "ALL"
  Variable: "GEN"
  Plain_Text_Explanation: "If Controlled Terminology is used, the Define-XML document\
    \ should include the Controlled Terminology or a reference to the Controlled Terminology."
  Condition: "Controlled Terminology used"
  Rule: "Controlled Terminology is included in the Define-XML document OR a reference\
    \ to external Controlled Terminology is included in the Define-XML document"
Standards:
- Organization: "CDISC"
