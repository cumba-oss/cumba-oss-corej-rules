Core:
  Id: "CDISC-AD0155"
  Status: "Published"
  Version: "1"
Description: "Raise an error when, within a given PARAMCD for a subject, more than\
  \ one record has ABLFL equal to Y and BASETYPE is not present."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "BASIC DATA STRUCTURE"
Grouping:
  Variables:
  - "USUBJID"
  - "PARAMCD"
Bindings:
- name: "$ablfl_y_count"
  expression: "record_count(group=[USUBJID, PARAMCD], filter=(ABLFL == \"Y\"))"
Check:
  expression: >-
    not var_exists("BASETYPE") and $ablfl_y_count > 1
Outcome:
  Message: "More than one record has ABLFL equal to Y for this subject and PARAMCD,\
    \ and BASETYPE is not present."
  Output_Variables:
  - "PARAMCD"
  - "ABLFL"
Source:
  Class: "BASIC DATA STRUCTURE"
  Variable_or_Item: "ABLFL"
  Natural_Language_Rule_Failure_Criteria: "Within a given PARAMCD for a subject, more\
    \ than one record has ABLFL equal to Y and BASETYPE is not present"
  Rule_Failure_Criteria: "Within a given PARAMCD for a subject, more than one record\
    \ has ABLFL equal to Y"
  Condition_Failure: "BASETYPE is not present"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.0"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR155"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.1"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR155"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.2"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR155"
        Version: "1"
      Version: "5.0"
