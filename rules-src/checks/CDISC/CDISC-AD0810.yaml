Core:
  Id: "CDISC-AD0810"
  Status: "Published"
  Version: "1"
Description: "Raise an error when USUBJID is populated and USUBJIDN is not populated"
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "BASIC DATA STRUCTURE"
Requirements:
  Variables:
    All:
    - "USUBJID"
    - "USUBJIDN"
Check:
  expression: >-
    not empty(USUBJID) and empty(USUBJIDN)
Outcome:
  Message: "USUBJID is populated, but USUBJIDN is not populated."
Source:
  Class: "BASIC DATA STRUCTURE"
  Subclass: "POPULATION PHARMACOKINETIC ANALYSIS"
  Variable_or_Item: "USUBJIDN"
  Natural_Language_Rule_Failure_Criteria: "USUBJID is populated and USUBJIDN is not\
    \ populated"
  Rule_Failure_Criteria: "USUBJIDN is not populated"
  Condition_Failure: "USUBJID is populated"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.3"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR810"
        Version: "1"
      Version: "5.0"
