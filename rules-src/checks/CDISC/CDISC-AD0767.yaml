Core:
  Id: "CDISC-AD0767"
  Status: "Published"
  Version: "1"
Description: "Raise an error when there is more than one value of TRTxxAN for a given\
  \ value of TRTxxA, where xx is an integer [01-99, zero-padded], considering only\
  \ rows on which both variables are populated"
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "SUBJECT LEVEL ANALYSIS DATASET"
Check:
  expression: >-
    not empty(TRTxxAN) and not empty(TRTxxA) and has_multiple_values_for(TRTxxAN, TRTxxA)
Outcome:
  Message: "TRTxxAN has more than one value for this TRTxxA, among rows where both\
    \ are populated"
  Output_Variables:
  - "TRTxxA"
  - "TRTxxAN"
wildcards:
  xx:
    min: 1
    max: 99
Source:
  Class: "SUBJECT LEVEL ANALYSIS DATASET"
  Variable_or_Item: "TRTxxAN where xx is an integer [01-99, zero-padded]"
  Natural_Language_Rule_Failure_Criteria: "There is more than one value of TRTxxAN\
    \ for a given value of TRTxxA, where xx is an integer [01-99, zero-padded], considering\
    \ only those rows on which both variables are populated"
  Rule_Failure_Criteria: "There is more than one value of TRTxxAN for a given value\
    \ of TRTxxA"
  Condition_Failure: "On rows where TRTxxAN and TRTxxA are both populated"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.1"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR767"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.2"
