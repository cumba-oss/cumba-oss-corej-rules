Core:
  Id: "CDISC-SEND-0045"
  Status: "Published"
  Version: "1"
Description: "Raise an error when Subcategory (--SCAT) is populated and its value\
  \ is identical to the Dictionary-Derived Term (--DECOD) or the Body System or Organ\
  \ Class (--BODSYS)."
Executability: "Fully Executable"
Scope:
  Classes:
    Include:
    - "EVENTS"
    - "INTERVENTIONS"
    - "FINDINGS"
    - "FINDINGS ABOUT"
Requirements:
  Variables:
    All:
    - "--SCAT"
Check:
  expression: >-
    not empty(--SCAT) and (--SCAT == --DECOD or --SCAT == --BODSYS)
Outcome:
  Message: "--SCAT is redundant with --DECOD or --BODSYS (--SCAT is equal to --DECOD\
    \ or --BODSYS)."
Source:
  Class: "ALL"
  Domain: "ALL"
  Variable: "--SCAT"
  Plain_Text_Explanation: "--SCAT should not be the same as --DECOD or --BODSYS"
  Condition: "--SCAT ^= null"
  Rule: "--SCAT ^= --DECOD or --BODSYS"
