Core:
  Id: "CDISC-CG0024"
  Status: "Published"
  Version: "1"
Description: "Raise an error when Link ID (--LNKID) is present in a domain but is\
  \ not present in any other domain."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "ALL"
Bindings:
- name: "$variable_count"
  expression: "variable_count(\"--LNKID\")"
Check:
  expression: >-
    var_exists("--LNKID") and $variable_count < 2
Outcome:
  Message: "--LNKID is present in this domain but is not present in any other domain."
  Output_Variables:
  - "--LNKID"
  - "$variable_count"
Source:
  Class: "ALL"
  Domain: "ALL"
  Variable: "--LNKID"
  Condition: "--LNKID present in a domain"
  Rule: "--LNKID present in another domain"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "SDTMIG"
    Version: "3.4"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0024"
        Version: "1"
      Version: "2.0"
  - Name: "SDTMIG"
    Version: "3.3"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0024"
        Version: "1"
      Version: "2.0"
  - Name: "SDTMIG"
    Version: "3.2"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0024"
        Version: "1"
      Version: "2.0"
