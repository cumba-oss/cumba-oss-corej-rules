Core:
  Id: "CDISC-AD0436"
  Status: "Published"
  Version: "2"
Description: "Raise an error when ATPTN is populated but ATPT is empty"
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "BASIC DATA STRUCTURE"
    - "OCCURRENCE DATA STRUCTURE"
    - "MEDICAL DEVICE OCCURRENCE DATA STRUCTURE"
Requirements:
  Variables:
    All:
    - "ATPT"
    - "ATPTN"
Check:
  expression: >-
    not empty(ATPTN) and empty(ATPT)
Outcome:
  Message: "ATPTN is populated, but ATPT is empty"
Source:
  Class: "BASIC DATA STRUCTURE; MEDICAL DEVICE BASIC DATA STRUCTURE; OCCURRENCE DATA\
    \ STRUCTURE; MEDICAL DEVICE OCCURRENCE DATA STRUCTURE"
  Variable_or_Item: "ATPT"
  Natural_Language_Rule_Failure_Criteria: "On a given record, ATPTN is populated and\
    \ ATPT is not populated"
  Rule_Failure_Criteria: "ATPT is not populated"
  Condition_Failure: "ATPTN is populated"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.2"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR436"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.3"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR436"
        Version: "2"
      Version: "5.0"
