Core:
  Id: "CDISC-AD0272"
  Status: "Published"
  Version: "2"
Description: "Raise an error when an AOCCzzFL variable (AOCC + two-digit index + FL)\
  \ is populated and not equal to 'Y'."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "OCCURRENCE DATA STRUCTURE"
    - "MEDICAL DEVICE OCCURRENCE DATA STRUCTURE"
Check:
  expression: >-
    upper(varname()) =~ /^AOCC(0[1-9]|[1-9][0-9])FL$/ and not empty(value()) and value() != "Y"
Outcome:
  Message: "An AOCCzzFL variable is populated and not equal to 'Y'."
Source:
  Class: "OCCURRENCE DATA STRUCTURE; MEDICAL DEVICE OCCURRENCE DATA STRUCTURE"
  Variable_or_Item: "AOCCzzFL where zz is an integer [01-99, zero-padded]"
  Natural_Language_Rule_Failure_Criteria: "A variable with a prefix of AOCC and a\
    \ suffix of FL is not equal to Y or null"
  Rule_Failure_Criteria: "AOCCzzFL is not equal to Y or null"
Standards:
- Organization: "CDISC"
  Standards:
