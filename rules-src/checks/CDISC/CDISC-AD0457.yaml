Core:
  Id: "CDISC-AD0457"
  Status: "Published"
  Version: "2"
Description: "Raise an error when TRTAN is populated but TRTA is empty"
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "BASIC DATA STRUCTURE"
    - "OCCURRENCE DATA STRUCTURE"
    - "MEDICAL DEVICE OCCURRENCE DATA STRUCTURE"
Requirements:
  Variables:
    All:
    - "TRTAN"
    - "TRTA"
Check:
  expression: >-
    not empty(TRTAN) and empty(TRTA)
Outcome:
  Message: "TRTAN is populated, but TRTA is empty"
  Message_Folded: "TRTA not populated in any record of the dataset, and at least one\
    \ record meets the rest of the condition: TRTAN is populated, but TRTA is empty"
Source:
  Class: "BASIC DATA STRUCTURE; MEDICAL DEVICE BASIC DATA STRUCTURE; OCCURRENCE DATA\
    \ STRUCTURE; MEDICAL DEVICE OCCURRENCE DATA STRUCTURE"
  Variable_or_Item: "TRTA"
  Natural_Language_Rule_Failure_Criteria: "On a given record, TRTAN is populated and\
    \ TRTA is not populated"
  Rule_Failure_Criteria: "TRTA is not populated"
  Condition_Failure: "TRTAN is populated"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.2"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR457"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.3"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR457"
        Version: "2"
      Version: "5.0"
