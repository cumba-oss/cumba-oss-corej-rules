Core:
  Id: "CDISC-SEND-0027.1"
  Status: "Published"
  Version: "1"
Description: "Raise an error when a Planned Arm Code (ARMCD) value is longer than\
  \ 20 characters."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "DM"
    - "TA"
Requirements:
  Variables:
    All:
    - "ARMCD"
Check:
  expression: >-
    len(ARMCD) > 20
Outcome:
  Message: "ARMCD value is longer than 20 characters."
  Output_Variables:
  - "ARMCD"
Source:
  Class: "SPC, TDM"
  Domain: "DM, TA, TX"
  Variable: "ARMCD"
  Plain_Text_Explanation: "ARMCD value limited to 20 characters"
  Rule: "ARMCD value length <= 20"
