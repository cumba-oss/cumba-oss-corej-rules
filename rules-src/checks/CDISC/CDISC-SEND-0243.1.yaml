Core:
  Id: "CDISC-SEND-0243.1"
  Status: "Published"
  Version: "1"
Description: "Raise an error when, for a date Trial Set Parameter (TXPARMCD is DOSENDTC\
  \ or DOSSTDTC), the value (TXVAL) is neither a valid ISO 8601 date/time nor an SDTM\
  \ masked date, in which an unknown component is written as a hyphen placeholder."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "TX"
Requirements:
  Variables:
    All:
    - "TXPARMCD"
Check:
  expression: >-
    TXPARMCD in ["DOSENDTC", "DOSSTDTC"] and invalid_date(TXVAL)
Outcome:
  Message: "TXVAL is neither a valid ISO 8601 date/time nor an SDTM masked date for\
    \ a date Trial Set Parameter (TXPARMCD in DOSENDTC, DOSSTDTC)."
Source:
  Class: "TDM"
  Domain: "TX"
  Variable: "TXVAL"
  Plain_Text_Explanation: "Trial Set Parameters that include dates are required to\
    \ be presented according to the international standard ISO 8601"
  Condition: "TXPARMCD In (\"DOSENDTC\", \"DOSSTDTC\")"
  Rule: "TXVAL value is in ISO 8601 date/time format"
