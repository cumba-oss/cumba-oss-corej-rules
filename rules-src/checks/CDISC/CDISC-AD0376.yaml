Core:
  Id: "CDISC-AD0376"
  Status: "Published"
  Version: "1"
Description: "Raise an error when, on a given record, a variable with a suffix of\
  \ GRy is populated and the variable with the same root name and a suffix of GRyN\
  \ is not populated"
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "ALL"
Check:
  expression: >-
    not empty(*GRy) and empty(*GRyN)
Outcome:
  Message: "On this record, the variable with a suffix of GRy is populated, but the\
    \ variable with the same root name and a suffix of GRyN is not populated."
  Output_Variables:
  - "*GRy"
  - "*GRyN"
wildcards:
  "y":
    min: 1
    max: 99
Source:
  Class: "ALL"
  Variable_or_Item: "*GRyN where y is an integer [1-99, not zero-padded]"
  Natural_Language_Rule_Failure_Criteria: "On a given record, a variable which has\
    \ a suffix of GRy is populated and a variable with the same root name and suffix\
    \ of GRyN is not populated"
  Rule_Failure_Criteria: "*GRyN is not populated"
  Condition_Failure: "*GRy is populated"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.2"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR376"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.3"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR376"
        Version: "1"
      Version: "5.0"
