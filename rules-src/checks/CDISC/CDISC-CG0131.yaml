Core:
  Id: "CDISC-CG0131"
  Status: "Published"
  Version: "1"
Description: "Raise an error when DTHFL is populated and not equal to 'Y'."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "DM"
Requirements:
  Variables:
    All:
    - "DTHFL"
Check:
  expression: >-
    DTHFL != "Y" and not empty(DTHFL)
Outcome:
  Message: "DTHFL is populated but not equal to 'Y'."
  Output_Variables:
  - "DTHFL"
Source:
  Class: "SPC"
  Domain: "DM"
  Variable: "DTHFL"
  Rule: "DTHFL in ('Y',null)"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "SDTMIG"
    Version: "3.4"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0131"
        Version: "1"
      Version: "2.0"
  - Name: "SDTMIG"
    Version: "3.3"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0131"
        Version: "1"
      Version: "2.0"
  - Name: "SDTMIG"
    Version: "3.2"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0131"
        Version: "1"
      Version: "2.0"
