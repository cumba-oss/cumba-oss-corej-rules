Core:
  Id: "CDISC-AD0643"
  Status: "Published"
  Version: "1"
Description: "Raise an error when the SDTM AE dataset contains the AEDUR column but\
  \ AEDUR is not present in the ADAE dataset."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "OCCURRENCE DATA STRUCTURE"
  Subclasses:
    Include:
    - "ADVERSE EVENT"
Requirements:
  Variables:
    All:
    - "AE.AEDUR"
Check:
  expression: >-
    not var_exists("AEDUR")
Outcome:
  Message: "AE.AEDUR is present but AEDUR is not present"
  Output_Variables:
  - "AEDUR"
Source:
  Class: "OCCURRENCE DATA STRUCTURE"
  Subclass: "ADVERSE EVENT"
  Variable_or_Item: "AE.AEDUR"
  Natural_Language_Rule_Failure_Criteria: "AE.AEDUR is present but AEDUR is not present"
  Rule_Failure_Criteria: "AEDUR is not present"
  Condition_Failure: "AE.AEDUR is present"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.0"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR643"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.1"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR643"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.2"
    References:
