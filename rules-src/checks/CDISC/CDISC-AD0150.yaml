Core:
  Id: "CDISC-AD0150"
  Status: "Published"
  Version: "1"
Description: "Raise an error when, within a given value of PARAMCD, there is more\
  \ than one value of AVAL for a given value of AVALC."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "BASIC DATA STRUCTURE"
Check:
  expression: >-
    has_multiple_values_for(AVAL, AVALC, within=PARAMCD)
Outcome:
  Message: "AVAL has more than one value for this PARAMCD and AVALC."
Source:
  Class: "BASIC DATA STRUCTURE"
  Variable_or_Item: "AVAL"
  Natural_Language_Rule_Failure_Criteria: "Within a given value of PARAMCD, there\
    \ is more than one value of AVAL for a given value of AVALC"
  Rule_Failure_Criteria: "Within a given value of PARAMCD, there is more than one\
    \ value of AVAL for a given value of AVALC"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.0"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR150"
        Version: "1"
      Version: "5.0"
