Core:
  Id: "CDISC-CG0432"
  Status: "Published"
  Version: "1"
Description: "Raise an error when AGEU is empty but AGE or AGETXT is populated."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "DM"
Check:
  expression: >-
    empty(AGEU) and (not empty(AGETXT) or not empty(AGE))
Outcome:
  Message: "AGEU is empty when AGE or AGETXT is populated."
  Message_Folded: "AGEU absent or not populated in any record of the dataset, and\
    \ at least one record meets the rest of the condition: AGEU is empty when AGE\
    \ or AGETXT is populated."
Source:
  Class: "SPC"
  Domain: "DM"
  Variable: "AGEU"
  Condition: "AGE ^= null or AGETXT ^= null"
  Rule: "AGEU ^= null"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "SDTMIG"
    Version: "3.3"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0432"
        Version: "1"
      Version: "2.0"
  - Name: "SDTMIG"
    Version: "3.2"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0432"
        Version: "1"
      Version: "2.0"
