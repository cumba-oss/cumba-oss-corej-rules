Core:
  Id: "CDISC-SEND-0014"
  Status: "Published"
  Version: "1"
Description: "Raise an error when a variable the CDISC Library marks Expected has\
  \ no collected data and the Define-XML document carries no Comment stating that\
  \ the data were not collected."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "ALL"
Variable_Universe: "Define"
Check:
  expression: >-
    not empty(var_name("DEFINE")) and var_core("LIBRARY") == "Exp" and
    max_value_length(variable_name) == 0 and var_has_comment("DEFINE") == false
Outcome:
  Message: "A variable declared in the Define-XML document has no comment."
Source:
  Class: "ALL"
  Domain: "ALL"
  Variable: "GEN"
  Plain_Text_Explanation: "If expected variables in a domain are all null, a comment\
    \ should be included in the Define-XML document to state that data were not collected."
  Condition: "Variable Core Status = Expected and data not collected for any subject"
  Rule: "The Define-XML document includes a comment stating the data were not collected."
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "SENDIG"
    Version: "3.0"
    References:
    - Origin: "SEND Conformance Rules"
      Rule_Identifier:
        Id: "SEND14"
        Version: "1"
      Version: "5.0"
