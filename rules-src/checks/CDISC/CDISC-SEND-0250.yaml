Core:
  Id: "CDISC-SEND-0250"
  Status: "Published"
  Version: "1"
Description: "Raise an error when the Trial Summary (TS) dataset contains both a record\
  \ with TSPARMCD equal to 'AGE' and a record with TSPARMCD equal to 'AGETXT'; exactly\
  \ one of the two must be present."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "TS"
Bindings:
- name: "$age_count"
  expression: "record_count(domain=\"TS\", filter=(TSPARMCD == \"AGE\"))"
- name: "$agetxt_count"
  expression: "record_count(domain=\"TS\", filter=(TSPARMCD == \"AGETXT\"))"
Check:
  expression: >-
    $age_count > 0 and $agetxt_count > 0
Outcome:
  Message: "TS contains both a TSPARMCD 'AGE' record and a TSPARMCD 'AGETXT' record;\
    \ exactly one must be present."
  Output_Variables:
  - "$age_count"
  - "$agetxt_count"
Source:
  Class: "TDM"
  Domain: "TS"
  Variable: "TSPARMCD"
  Plain_Text_Explanation: "Either a record with TSPARMCD of AGE or TSPARMCD of AGETXT\
    \ should be present, but not both."
  Rule: "Either a record with TSPARMCD = AGE or TSPARMCD = AGETXT is present; both\
    \ are not present"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "SENDIG-GENETOX"
    Version: "1.0"
    References:
    - Origin: "SEND Conformance Rules"
      Rule_Identifier:
