Core:
  Id: "CDISC-SEND-0250"
  Status: "Published"
  Version: "1"
Description: "Raise an error when the Trial Summary (TS) dataset does not contain\
  \ exactly one of a record with TSPARMCD equal to 'AGE' and a record with TSPARMCD\
  \ equal to 'AGETXT' (i.e. both are present, or neither is present)."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "TS"
Operations:
- id: "$age_count"
  expression: "record_count(TSPARMCD, domain=\"TS\", filter=filter(TSPARMCD=\"AGE\"\
    ))"
- id: "$agetxt_count"
  expression: "record_count(TSPARMCD, domain=\"TS\", filter=filter(TSPARMCD=\"AGETXT\"\
    ))"
Check:
  expression: >-
    $age_count > 0 and $agetxt_count > 0 or $age_count == 0 and $agetxt_count == 0
Outcome:
  Message: "TS does not contain exactly one of a TSPARMCD 'AGE' record and a TSPARMCD\
    \ 'AGETXT' record."
  Output_Variables:
  - "$age_count"
  - "$agetxt_count"
Source:
  Class: "TDM"
  Domain: "TS"
  Variable: "TSPARMCD"
  Plain_Text_Explanation: "Either a record with TSPARMCD of AGE or TSPARMCD of AGETXT\
    \ should be present, but not both."
  Rule: "Either a record with TSPARMCD = AGE or TSPARMCD = AGETXT is present; both\
    \ are not present"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "SENDIG-GENETOX"
    Version: "1.0"
    References:
    - Origin: "SEND Conformance Rules"
      Rule_Identifier:
