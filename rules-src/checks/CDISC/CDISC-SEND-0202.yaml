Core:
  Id: "CDISC-SEND-0202"
  Status: "Published"
  Version: "1"
Description: "Raise an error when the tumor-detection interval (TFDETECT) is populated\
  \ but does not equal the number of days from the earliest dose date (earliest EXSTDTC\
  \ for the subject) to the tumor-detection date, plus one (first dose day = day 1)."
Executability: "Not Executable"
ExecutabilityHint:
  Category: "not executable"
  Detail: "Parked: the detection method is expressible, the detection date is not.\
    \ The link is readable: SENDIG TF Assumption 5 (SENDIG 3.0 Assumption 4) makes\
    \ the mass identifier in --SPID consistent across CL, PM, MA, MI and TF, so a\
    \ TF record whose USUBJID and TFSPID are also a CL mass (CLSPID) was detected\
    \ as a clinical sign, as CDISC-SEND-0204 and CDISC-SEND-0205 read it. The formula\
    \ is TFDETECT = (CLDTC - EXSTDTC) + 1, where CLDTC is the date of the CL observation\
    \ of THAT mass, and the engine cannot read it (engine feature F1): it needs a\
    \ grouped read of CL keyed by USUBJID and the mass identifier, whose key column\
    \ is named differently on the two sides (TFSPID here, CLSPID in CL), and a --SPID\
    \ group member is refused under domain=; a keyed Match_Datasets join on CL instead\
    \ multiplies each TF record by the mass's CL observations with nothing to aggregate\
    \ them to the earliest CLDTC. The split between CDISC-SEND-0202 and CDISC-SEND-0203\
    \ needs the same read (R4): a mass that is both a clinical sign and a palpable\
    \ mass was first detected in the domain holding the earlier date, ties to CL,\
    \ so the two rules must compare CLDTC with PMDTC before either applies. The parked\
    \ Check is the old stand-in, the local --DTC for CLDTC with EX joined, and must\
    \ not be un-parked as it stands."
Scope:
  Domains:
    Include:
    - "TF"
Requirements:
  Variables:
    All:
    - "EX.EXSTDTC"
    - "STUDYID"
    - "USUBJID"
    - "--DTC"
    - "TFDETECT"
    All_Or_None:
    - - "STUDYID"
      - "EX.STUDYID"
    - - "USUBJID"
      - "EX.USUBJID"
Match_Datasets:
- Keys:
  - "STUDYID"
  - "USUBJID"
  Name: "EX"
Bindings:
- name: "$days_from_first_dose"
  expression: "date_diff_days(--DTC, min_date(EXSTDTC, domain=\"EX\", group=[USUBJID]))\
    \ + 1"
Check:
  expression: >-
    is_complete_date(--DTC) and not empty(TFDETECT) and TFDETECT != $days_from_first_dose
Outcome:
  Message: "TFDETECT does not equal the number of days from the earliest EXSTDTC to\
    \ the detection date plus one."
  Output_Variables:
  - "$days_from_first_dose"
  - "--DTC"
  - "TFDETECT"
Source:
  Class: "FND"
  Domain: "TF"
  Variable: "TFDETECT"
  Plain_Text_Explanation: "If the tumor was detected as a clinical sign, then TFDETECT\
    \ is based off the CL domain variable CLDTC (Start Date/Time of Observation).\
    \ This is calculated as (CLDTC - EXSTDTC) + 1."
  Condition: "Tumor was detected as a clinical sign"
  Rule: "TFDETECT = (CLDTC - EXSTDTC) + 1"
Standards:
- Organization: "CDISC"
  Standards:
