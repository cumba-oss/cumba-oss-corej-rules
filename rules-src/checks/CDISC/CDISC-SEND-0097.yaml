Core:
  Id: "CDISC-SEND-0097"
  Status: "Published"
  Version: "1"
Description: "Raise an error when more than one Demographics (DM) record exists for\
  \ the same subject (USUBJID) within a study; the DM domain expects one record per\
  \ subject."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "DM"
Check:
  expression: >-
    not is_unique_set([USUBJID, STUDYID])
Outcome:
  Message: "More than one DM record exists for the same subject (USUBJID)."
Source:
  Class: "SPC"
  Domain: "DM"
  Variable: "ALL"
  Plain_Text_Explanation: "One record per subject"
  Condition: "Domain = DM"
  Rule: "One record per subject"
