Core:
  Id: "CDISC-CG0523"
  Status: "Published"
  Version: "1"
Description: "Raise an error when a subject was not assigned to treatment (ARMNRS\
  \ indicates Screen Failure or Not Assigned) but the Planned Arm Code (ARMCD) is\
  \ populated; ARMCD must be empty for subjects who were not assigned to treatment."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "DM"
Requirements:
  Variables:
    All:
    - "ARMNRS"
Check:
  expression: >-
    ARMNRS in ["SCREEN FAILURE", "NOT ASSIGNED"] and not empty(ARMCD)
Outcome:
  Message: "ARMCD is populated for a subject who was not assigned to treatment (ARMNRS\
    \ indicates Screen Failure or Not Assigned)."
Source:
  Class: "SPC"
  Domain: "DM"
  Variable: "ARMCD"
  Condition: "Subject not assigned to treatment"
  Rule: "ARMCD = null"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "SDTMIG"
    Version: "3.4"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0523"
        Version: "1"
      Version: "2.0"
  - Name: "SDTMIG"
    Version: "3.3"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0523"
        Version: "1"
      Version: "2.0"
