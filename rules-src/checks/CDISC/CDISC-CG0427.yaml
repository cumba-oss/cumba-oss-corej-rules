Core:
  Id: "CDISC-CG0427"
  Status: "Published"
  Version: "1"
Description: "Raise an error when Result Category (--RESCAT) is specified but Character\
  \ Result/Finding in Std Format (--STRESC) is empty."
Executability: "Fully Executable"
Scope:
  Classes:
    Include:
    - "FINDINGS"
Requirements:
  Variables:
    All:
    - "--RESCAT"
Check:
  expression: >-
    not empty(--RESCAT) and empty(--STRESC)
Outcome:
  Message: "--STRESC is empty when --RESCAT is provided."
Source:
  Class: "FND"
  Domain: "ALL"
  Variable: "--STRESC"
  Condition: "--RESCAT ^= null"
  Rule: "--STRESC ^= null"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "SDTMIG"
    Version: "3.4"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0427"
        Version: "1"
      Version: "2.0"
  - Name: "SDTMIG"
    Version: "3.3"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0427"
        Version: "1"
      Version: "2.0"
