Core:
  Id: "CDISC-AD0559"
  Status: "Published"
  Version: "1"
Description: "Raise an error when TRCMPGyN is present and TRCMPGy is not present,\
  \ where y is an integer [1-99, not zero-padded]."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "SUBJECT LEVEL ANALYSIS DATASET"
Check:
  expression: >-
    var_exists("TRCMPGyN") and not var_exists("TRCMPGy")
Outcome:
  Message: "TRCMPGyN is present, but TRCMPGy is not present."
  Output_Variables:
  - "TRCMPGyN"
wildcards:
  "y":
    min: 1
    max: 99
Source:
  Class: "SUBJECT LEVEL ANALYSIS DATASET"
  Variable_or_Item: "TRCMPGyN where y is an integer [1-9, not zero-padded]"
  Natural_Language_Rule_Failure_Criteria: "TRCMPGyN is present and TRCMPGy is not\
    \ present"
  Rule_Failure_Criteria: "TRCMPGy is not present"
  Condition_Failure: "TRCMPGyN is present"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.1"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR559"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.2"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR559"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.3"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR559"
        Version: "1"
      Version: "5.0"
