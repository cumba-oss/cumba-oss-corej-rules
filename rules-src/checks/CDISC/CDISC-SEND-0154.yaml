Core:
  Id: "CDISC-SEND-0154"
  Status: "Published"
  Version: "1"
Description: "Raise an error when the Result or Finding in Original Units (BGORRES)\
  \ is empty but the Completion Status (BGSTAT) is not \"NOT DONE\"; a body-weight-gain\
  \ record with a missing result should have BGSTAT set to \"NOT DONE\"."
Executability: "Partially Executable - Possible Overreporting"
Scope:
  Domains:
    Include:
    - "BG"
Requirements:
  Variables:
    All:
    - "BGSTAT"
Check:
  expression: >-
    empty(BGORRES) and BGSTAT != "NOT DONE"
Outcome:
  Message: "BGORRES is empty but BGSTAT is not \"NOT DONE\"."
  Message_Folded: "BGORRES absent or not populated in any record of the dataset, and\
    \ at least one record meets the rest of the condition: BGORRES is empty but BGSTAT\
    \ is not \"NOT DONE\"."
Source:
  Class: "FND"
  Domain: "BG"
  Variable: "--STAT"
  Plain_Text_Explanation: "If one of the two body weights needed for the calculation\
    \ is missing, BGORRES should be null and BGSTAT should be \"NOT DONE\"."
  Condition: "One or both of the two body weights needed for the calculation is missing"
  Rule: "BGORRES = null AND BGSTAT = \"NOT DONE\"."
