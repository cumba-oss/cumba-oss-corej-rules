Core:
  Id: "CDISC-AD0290"
  Status: "Published"
  Version: "1"
Description: "Raise an error when there is more than one value of ARELN for a given\
  \ value of AREL."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "OCCURRENCE DATA STRUCTURE"
Check:
  expression: >-
    not empty(ARELN) and not empty(AREL) and has_multiple_values_for(ARELN, AREL)
Outcome:
  Message: "ARELN has more than one value for the same value of AREL."
  Output_Variables:
  - "AREL"
  - "ARELN"
Source:
  Class: "OCCURRENCE DATA STRUCTURE"
  Variable_or_Item: "ARELN"
  Natural_Language_Rule_Failure_Criteria: "There is more than one value of ARELN for\
    \ a given value of AREL"
  Rule_Failure_Criteria: "There is more than one value of ARELN for a given value\
    \ of AREL"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.0"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR290"
        Version: "1"
      Version: "5.0"
