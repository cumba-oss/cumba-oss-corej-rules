Core:
  Id: "CDISC-CG9673"
  Status: "Published"
  Version: "1"
Description: "Raise an error when Dose Description (ECDOSTXT) is not present in the\
  \ dataset although a record has ECDOSE missing, ECOCCUR not equal to 'N' and ECSTAT\
  \ empty."
Sensitivity: "Dataset"
Executability: "Partially Executable - Possible Overreporting"
Scope:
  Domains:
    Include:
    - "EC"
Requirements:
  Variables:
    None:
    - "ECDOSTXT"
    All:
    - "ECDOSE"
Check:
  expression: >-
    empty(ECDOSE) and (not var_exists("ECOCCUR") or ECOCCUR != "N") and empty(ECSTAT)
Outcome:
  Message: "ECDOSTXT is not present in the dataset although ECDOSE is missing, ECOCCUR\
    \ does not equal 'N' and ECSTAT is empty."
Source_Proposed:
  Sheet_Issue: "#188"
  Class: "INT"
  Domain: "EC"
  Variable: "ECDOSTXT"
  Condition: "ECDOSE = null and ECOCCUR ^= 'N' and ECSTAT = null"
  Rule: "ECDOSTXT variable is present in the dataset"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "SDTMIG"
    Version: "3.4"
  - Name: "SDTMIG"
    Version: "3.3"
  - Name: "SDTMIG"
    Version: "3.2"
