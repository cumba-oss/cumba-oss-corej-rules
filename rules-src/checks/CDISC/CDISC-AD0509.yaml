Core:
  Id: "CDISC-AD0509"
  Status: "Published"
  Version: "1"
Description: "Raise an error when a variable name ends in SDT but its label does not\
  \ contain 'Start Date', unless the variable is one of the standard library variables."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "ALL"
Bindings:
- name: "$library_variables"
  expression: "get_column_order_from_library()"
Check:
  expression: >-
    ends_with(upper(varname()), "SDT") and not contains(var_label("DATA"), "Start Date") and
    varname() not in $library_variables
Outcome:
  Message: "A variable ending in SDT does not contain 'Start Date' in the label."
  Output_Variables:
  - "variable_name"
  - "variable_label"
Source:
  Class: "ALL"
  Variable_or_Item: "*SDT"
  Natural_Language_Rule_Failure_Criteria: "A variable ending in SDT must contain \"\
    Start Date\" in the label"
  Rule_Failure_Criteria: "*SDT does not contain \"Start Date\" in the label"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.1"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR509"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.2"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR509"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.3"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR509"
        Version: "1"
      Version: "5.0"
