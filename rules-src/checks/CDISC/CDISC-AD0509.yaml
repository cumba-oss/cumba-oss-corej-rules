Core:
  Id: "CDISC-AD0509"
  Status: "Published"
  Version: "1"
Description: "Raise an error when a variable's name ends in SDT, the ADaM implementation\
  \ guide's *SDT naming fragment governs it (the name is not a standard library variable),\
  \ and its label does not contain the fragment's phrase 'Start Date'."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "ALL"
Check:
  expression: >-
    ends_with(upper(varname()), "SDT") and var_name("LIBRARY") == "*SDT" and not
    matches_label_template(var_label("DATA"), label_template("LIBRARY"))
Outcome:
  Message: "A variable ending in SDT does not contain 'Start Date' in the label."
  Output_Variables:
  - "variable_name"
  - "variable_label"
  - "library_variable_label_template"
Source:
  Class: "ALL"
  Variable_or_Item: "*SDT"
  Natural_Language_Rule_Failure_Criteria: "A variable ending in SDT must contain \"\
    Start Date\" in the label"
  Rule_Failure_Criteria: "*SDT does not contain \"Start Date\" in the label"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.1"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR509"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.2"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR509"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.3"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR509"
        Version: "1"
      Version: "5.0"
