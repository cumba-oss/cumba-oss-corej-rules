Core:
  Id: "CDISC-CG0572"
  Status: "Published"
  Version: "1"
Description: "Raise an error when VISITNUM is not present in the dataset and --TPTREF\
  \ is present in the dataset, and --TPT and --TPTNUM do not have a one-to-one relationship\
  \ per unique value of --TPTREF."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "ALL"
Check:
  expression: >-
    not var_exists("VISITNUM") and var_exists("--TPTREF") and (is_inconsistent_across_dataset(--TPT,
    keys=[--TPTNUM, --TPTREF]) or is_inconsistent_across_dataset(--TPTNUM, keys=[--TPT, --TPTREF]))
Outcome:
  Message: "--TPT and --TPTNUM do not have a one-to-one relationship per unique value\
    \ of --TPTREF."
Source:
  Class: "ALL"
  Domain: "ALL"
  Variable: "--TPT"
  Condition: "VISITNUM not present in dataset and --TPTREF present in dataset"
  Rule: "--TPT and --TPTNUM have a one-to-one relationship per unique values of --TPTREF"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "SDTMIG"
    Version: "3.3"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0572"
        Version: "1"
      Version: "2.0"
  - Name: "SDTMIG"
    Version: "3.2"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0572"
        Version: "1"
      Version: "2.0"
