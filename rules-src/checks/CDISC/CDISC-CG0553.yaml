Core:
  Id: "CDISC-CG0553"
  Status: "Published"
  Version: "1"
Description: "Raise an error when --ORRES is empty while --LOBXFL equals 'Y' and --DRVFL\
  \ is null (an absent --DRVFL reads null)."
Executability: "Fully Executable"
Scope:
  Classes:
    Include:
    - "FINDINGS"
Requirements:
  Variables:
    All:
    - "--ORRES"
    - "--LOBXFL"
Check:
  expression: >-
    empty(--ORRES) and --LOBXFL == "Y" and empty(--DRVFL)
Outcome:
  Message: "--ORRES is empty even though --LOBXFL equals 'Y' and --DRVFL is null."
  Keep_Row_Findings:
  - "--ORRES"
  - "--DRVFL"
  Output_Variables:
  - "!--ORRES"
Source:
  Class: "FND"
  Domain: "ALL"
  Variable: "--ORRES"
  Condition: "--LOBXFL = 'Y' and --DRVFL = null"
  Rule: "--ORRES ^= null"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "SDTMIG"
    Version: "3.4"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0553"
        Version: "2"
      Version: "2.0"
  - Name: "SDTMIG"
    Version: "3.3"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0553"
        Version: "2"
      Version: "2.0"
