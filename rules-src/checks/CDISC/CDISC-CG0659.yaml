Core:
  Id: "CDISC-CG0659"
  Status: "Published"
  Version: "1"
Description: "Raise an error when the --EVAL variable (QSEVAL or FTEVAL) is present\
  \ in a QS or FT dataset. --EVAL must not be used to model QRS (Questionnaires, Ratings,\
  \ and Scales) data. The RS domain is covered by this rule's -A sibling, which tests\
  \ the Clinical Classification use case at record level."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "QS"
    - "FT"
Check:
  expression: >-
    var_exists("--EVAL")
Outcome:
  Message: "--EVAL is present. --EVAL must not be used to model QRS data."
  Output_Variables:
  - "--EVAL"
Source:
  Class: "FND"
  Domain: "QS, FT, RS"
  Variable: "--EVAL"
  Condition: "Domain in ('QS', 'FT') or (Domain = 'RS' and it's the Clinical Classification\
    \ Use Case)"
  Rule: "--EVAL not present in dataset"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "SDTMIG"
    Version: "3.4"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0659"
        Version: "1"
      Version: "2.0"
