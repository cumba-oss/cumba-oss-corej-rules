Core:
  Id: "CDISC-CG0659"
  Status: "Published"
  Version: "1"
Description: "Raise an error when --EVAL is present in a QS or FT dataset. --EVAL\
  \ must not be used to model QRS (Questionnaires, Ratings, and Scales) data. This\
  \ also applies to the RS domain for the Clinical Classification Use Case, which\
  \ is a human-judgement condition not evaluated by this rule."
Executability: "Partially Executable"
Scope:
  Domains:
    Include:
    - "QS"
    - "FT"
    - "RS"
Check:
  expression: >-
    var_exists("QSEVAL") or var_exists("FTEVAL")
Outcome:
  Message: "--EVAL is present. --EVAL must not be used to model QRS data."
  Output_Variables:
  - "QSEVAL"
  - "FTEVAL"
Source:
  Class: "FND"
  Domain: "QS, FT, RS"
  Variable: "--EVAL"
  Condition: "Domain in ('QS', 'FT') or (Domain = 'RS' and it's the Clinical Classification\
    \ Use Case)"
  Rule: "--EVAL not present in dataset"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "SDTMIG"
    Version: "3.4"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0659"
        Version: "1"
      Version: "2.0"
