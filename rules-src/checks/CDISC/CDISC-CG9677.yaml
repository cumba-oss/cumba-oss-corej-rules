Core:
  Id: "CDISC-CG9677"
  Status: "Published"
  Version: "1"
Description: "Raise an error when the Description of Planned Arm (ARM) is empty while\
  \ the Planned Arm Code (ARMCD) is populated."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "DM"
Requirements:
  Variables:
    All:
    - "ARMCD"
    - "ARM"
Check:
  expression: >-
    not empty(ARMCD) and empty(ARM)
Outcome:
  Message: "ARMCD is populated when ARM is empty."
Source_Proposed:
  Sheet_Issue: "#252"
  Class: "SPC"
  Domain: "DM"
  Variable: "ARMCD"
  Condition: "ARM = null"
  Rule: "ARMCD = null"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "SDTMIG"
    Version: "3.4"
  - Name: "SDTMIG"
    Version: "3.3"
