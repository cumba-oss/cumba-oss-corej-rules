Core:
  Id: "CDISC-AD0537"
  Status: "Published"
  Version: "2"
Description: "Raise an error when TOXGGRyN is present but the corresponding TOXGGRy\
  \ is not present, where y is an integer [1-99, not zero-padded]."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "OCCURRENCE DATA STRUCTURE"
    - "MEDICAL DEVICE OCCURRENCE DATA STRUCTURE"
Check:
  expression: >-
    var_exists("TOXGGRyN") and not var_exists("TOXGGRy")
Outcome:
  Message: "TOXGGRyN is present but the corresponding TOXGGRy is not present."
  Output_Variables:
  - "TOXGGRyN"
wildcards:
  "y":
    min: 1
    max: 99
Source:
  Class: "OCCURRENCE DATA STRUCTURE; MEDICAL DEVICE OCCURRENCE DATA STRUCTURE"
  Variable_or_Item: "TOXGGRyN where y is an integer [1-9, not zero-padded]"
  Natural_Language_Rule_Failure_Criteria: "TOXGGRyN is present and TOXGGRy is not\
    \ present"
  Rule_Failure_Criteria: "TOXGGRy is not present"
  Condition_Failure: "TOXGGRyN is present"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.1"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR537"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.2"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR537"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.3"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR537"
        Version: "2"
      Version: "5.0"
