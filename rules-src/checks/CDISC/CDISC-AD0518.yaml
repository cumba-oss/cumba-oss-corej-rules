Core:
  Id: "CDISC-AD0518"
  Status: "Published"
  Version: "1"
Description: "Raise an error when a variable's name ends in EDY and its label does\
  \ not contain the phrase of the ADaM implementation guide's *EDY naming fragment\
  \ ('Relative End Day')."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "ALL"
Check:
  expression: >-
    ends_with(upper(varname()), "EDY") and not empty(label_template("LIBRARY", stem="*EDY")) and not
    matches_label_template(var_label("DATA"), label_template("LIBRARY", stem="*EDY"))
Outcome:
  Message: "A variable ending in EDY does not contain \"Relative End Day\" in the\
    \ label"
  Output_Variables:
  - "library_variable_label_template"
Source:
  Class: "ALL"
  Variable_or_Item: "*EDY"
  Natural_Language_Rule_Failure_Criteria: "A variable ending in EDY must contain \"\
    Relative End Day\" in the label"
  Rule_Failure_Criteria: "*EDY does not contain \"Relative End Day\" in the label"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.1"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR518"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.2"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR518"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.3"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR518"
        Version: "1"
      Version: "5.0"
