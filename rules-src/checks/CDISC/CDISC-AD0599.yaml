Core:
  Id: "CDISC-AD0599"
  Status: "Published"
  Version: "1"
Description: "Raise an error when, on a BDS or OCCDS record, ASPRSTM does not equal\
  \ the ADSL variable PxxSwSTM for the same USUBJID (where xx equals the record's\
  \ APERIOD value and w equals the record's ASPER value)."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "BASIC DATA STRUCTURE"
    - "OCCURRENCE DATA STRUCTURE"
Requirements:
  Variables:
    All:
    - "USUBJID"
    - "ASPRSTM"
    - "APERIOD"
    - "ASPER"
    All_Or_None:
    - - "USUBJID"
      - "ADSL.USUBJID"
Match_Datasets:
- Name: "ADSL"
  Keys:
  - "USUBJID"
Check:
  expression: >-
    not empty(ASPRSTM) and not empty(ADSL.P${APERIOD:%02d}S${ASPER:%d}STM) and ASPRSTM !=
    ADSL.P${APERIOD:%02d}S${ASPER:%d}STM
Outcome:
  Message: "On a given record, the value of ASPRSTM is not equal to the value of variable\
    \ PxxSwSTM where xx equals the value of APERIOD and w equals the value of ASPER"
  Output_Variables:
  - "APERIOD"
  - "ASPER"
  - "ASPRSTM"
  - "ADSL.P${*}S${*}STM"
Source:
  Class: "ALL"
  Variable_or_Item: "ASPRSTM"
  Natural_Language_Rule_Failure_Criteria: "On a given record, the value of ASPRSTM\
    \ is not equal to the value of variable PxxSwSTM where xx equals the value of\
    \ APERIOD and w equals the value of ASPER"
  Rule_Failure_Criteria: "On a given record, the value of ASPRSTM is not equal to\
    \ the value of variable PxxSwSTM where xx equals the value of APERIOD and w equals\
    \ the value of ASPER"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.2"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR599"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.3"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR599"
        Version: "1"
      Version: "5.0"
