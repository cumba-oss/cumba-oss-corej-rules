Core:
  Id: "CDISC-AD0594"
  Status: "Published"
  Version: "1"
Description: "Raise an error when, on a BDS or OCCDS record, APERSDTM does not equal\
  \ the ADSL variable APxxSDTM for the same USUBJID (where xx equals the record's\
  \ APERIOD value)."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "BASIC DATA STRUCTURE"
    - "OCCURRENCE DATA STRUCTURE"
Requirements:
  Variables:
    All:
    - "USUBJID"
    - "APERSDTM"
    - "APERIOD"
    All_Or_None:
    - - "USUBJID"
      - "ADSL.USUBJID"
Match_Datasets:
- Name: "ADSL"
  Keys:
  - "USUBJID"
Bindings:
- name: "$ap_sdtm"
  expression: "colref(concat(\"ADSL.AP\", printf(\"%02d\", APERIOD), \"SDTM\"))"
Check:
  expression: >-
    not empty(APERSDTM) and not empty($ap_sdtm) and APERSDTM != $ap_sdtm
Outcome:
  Message: "On a given record, the value of APERSDTM is not equal to the value of\
    \ variable APxxSDTM where xx equals the value of APERIOD"
  Output_Variables:
  - "APERIOD"
  - "ADSL.APxxSDTM"
  - "!$ap_sdtm"
Source:
  Class: "ALL"
  Variable_or_Item: "APERSDTM"
  Natural_Language_Rule_Failure_Criteria: "On a given record, the value of APERSDTM\
    \ is not equal to the value of variable APxxSDTM where xx equals the value of\
    \ APERIOD"
  Rule_Failure_Criteria: "On a given record, the value of APERSDTM is not equal to\
    \ the value of variable APxxSDTM where xx equals the value of APERIOD"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.2"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR594"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.3"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR594"
        Version: "1"
      Version: "5.0"
