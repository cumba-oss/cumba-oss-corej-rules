Core:
  Id: "CDISC-AD0148"
  Status: "Published"
  Version: "1"
Description: "Raise an error when PARAMN is populated and is not an integer."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "BASIC DATA STRUCTURE"
Requirements:
  Variables:
    All:
    - "PARAMN"
Check:
  expression: >-
    not empty(PARAMN) and not is_integer(PARAMN)
Outcome:
  Message: "PARAMN is populated but is not an integer value."
Source:
  Class: "BASIC DATA STRUCTURE"
  Variable_or_Item: "PARAMN"
  Natural_Language_Rule_Failure_Criteria: "PARAMN is not an integer"
  Rule_Failure_Criteria: "PARAMN is not an integer"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.0"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR148"
        Version: "1"
      Version: "5.0"
