Core:
  Id: "CDISC-SEND-0018"
  Status: "Published"
  Version: "1"
Description: "Raise an error when a Test Short Name (--TESTCD) value starts with a\
  \ number; --TESTCD may not begin with a numeric character."
Executability: "Fully Executable"
Scope:
  Classes:
    Include:
    - "FINDINGS"
Requirements:
  Variables:
    All:
    - "--TESTCD"
Check:
  expression: >-
    --TESTCD =~ /^[0-9]/
Outcome:
  Message: "--TESTCD value starts with a number."
Source:
  Class: "FND"
  Domain: "ALL"
  Variable: "--TESTCD"
  Plain_Text_Explanation: "--TESTCD value can not start with a number"
  Rule: "--TESTCD value can not start with a number"
