Core:
  Id: "CDISC-AD0723"
  Status: "Published"
  Version: "1"
Description: "Raise an error when there is more than one value of TRTAN for a given\
  \ value of TRTA, considering only records where both variables are populated"
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "BASIC DATA STRUCTURE"
Check:
  expression: >-
    not empty(TRTA) and not empty(TRTAN) and has_multiple_values_for(TRTAN, TRTA)
Outcome:
  Message: "More than one value of TRTAN is present for the same populated value of\
    \ TRTA"
Source:
  Class: "BASIC DATA STRUCTURE; MEDICAL DEVICE BASIC DATA STRUCTURE"
  Variable_or_Item: "TRTAN"
  Natural_Language_Rule_Failure_Criteria: "There is more than one value of TRTAN for\
    \ a given value of TRTA, considering only those rows on which both variables are\
    \ populated"
  Rule_Failure_Criteria: "There is more than one value of TRTAN for a given value\
    \ of TRTA"
  Condition_Failure: "On rows where TRTAN and TRTA are both populated"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.1"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR723"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.2"
    References:
