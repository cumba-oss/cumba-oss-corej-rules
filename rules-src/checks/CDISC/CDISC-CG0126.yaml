Core:
  Id: "CDISC-CG0126"
  Status: "Published"
  Version: "1"
Description: "Raise an error when ARMCD is populated and does not match any ARMCD\
  \ value in the Trial Arms (TA) dataset, excluding subjects who failed screening\
  \ (ARMCD equals 'SCRNFAIL') or were not assigned to an Arm (ARMCD equals 'NOTASSGN')."
Executability: "Not Executable"
ExecutabilityHint:
  Category: "not executable"
  Detail: "Parked as an R-5.26 duplicate of CDISC-CG0128 (owner rulings D-8 + D-18,\
    \ 2026-09-14): the two are identical in every field but the id and ship into exactly\
    \ the same packages, so one run reported the same finding twice. Both package\
    \ sets being equal, D-18's tie-break applies and the lower-numbered row is parked\
    \ — the lower id was authored first, so the higher is the more recent statement.\
    \ The row stays documented here while CDISC-CG0128 carries the executable check."
Scope:
  Domains:
    Include:
    - "DM"
Requirements:
  Variables:
    All:
    - "ARMCD"
Bindings:
- name: "$ta_armcd"
  expression: "distinct(ARMCD, domain=\"TA\")"
Check:
  expression: >-
    not empty(ARMCD) and ARMCD not in ["SCRNFAIL", "NOTASSGN"] and ARMCD not in $ta_armcd
Outcome:
  Message: "ARMCD does not match any ARMCD value in the TA dataset."
  Output_Variables:
  - "ARMCD"
  - "$ta_armcd"
Source:
  Class: "SPC"
  Domain: "DM"
  Variable: "ARMCD"
  Condition: "ARMCD not in ('SCRNFAIL', 'NOTASSGN')"
  Rule: "ARMCD in TA.ARMCD"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "SDTMIG"
    Version: "3.2"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0126"
        Version: "1"
      Version: "2.0"
