Core:
  Id: "CDISC-SEND-0125.1"
  Status: "Published"
  Version: "1"
Description: "Raise an error when the Element is unplanned (ETCD equals \"UNPLAN\"\
  ) but the Description of Unplanned Element (SEUPDES) is empty."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "SE"
Requirements:
  Variables:
    All:
    - "ETCD"
Check:
  expression: >-
    ETCD == "UNPLAN" and empty(SEUPDES)
Outcome:
  Message: "SEUPDES is empty when ETCD is \"UNPLAN\"."
  Message_Folded: "SEUPDES is absent or empty although ETCD is equal to 'UNPLAN'."
Source:
  Class: "SPC"
  Domain: "SE"
  Variable: "SEUPDES"
  Plain_Text_Explanation: "SEUPDES is the description of the unplanned element.  This\
    \ variable should only be populated if ETCD is UNPLAN."
  Condition: "ETCD = \"UNPLAN\""
  Rule: "SEUPDES ^= null"
Standards:
