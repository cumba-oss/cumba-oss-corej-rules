Core:
  Id: "CDISC-AD0716"
  Status: "Published"
  Version: "1"
Description: "Raise an error when a variable with suffix TM (excluding SDTM ELTM variables\
  \ and variables with suffix DTM) is not a numeric variable."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "ALL"
Check:
  expression: >-
    ends_with(upper(varname()), "TM") and not ends_with(upper(varname()), "DTM") and not
    ends_with(upper(varname()), "ELTM") and var_type("DATA") != "Num"
Outcome:
  Message: "A variable with a suffix of TM is not a numeric variable excluding SDTM\
    \ variables with a suffix of ELTM"
  Output_Variables:
  - "variable_data_type"
Source:
  Class: "ALL"
  Variable_or_Item: "*TM"
  Natural_Language_Rule_Failure_Criteria: "A variable with a suffix of TM is not a\
    \ numeric variable excluding SDTM variables with a suffix of ELTM"
  Rule_Failure_Criteria: "A variable is not a numeric variable"
  Condition_Failure: "Excluding SDTM variables with a suffix of ELTM"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.1"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR716"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.2"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR716"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.3"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR716"
        Version: "1"
      Version: "5.0"
