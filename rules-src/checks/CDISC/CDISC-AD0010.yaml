Core:
  Id: "CDISC-AD0010"
  Status: "Published"
  Version: "1"
Description: "Raise an error when a variable with a suffix of FL equals Y and a variable\
  \ with the same root and a suffix of FN is present but does not equal 1"
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "ALL"
Check:
  expression: >-
    *FL == "Y" and var_exists(*FN) and *FN != 1
Outcome:
  Message: "A variable with a suffix of FN is present but does not equal 1, although\
    \ the variable with the same root and a suffix of FL equals Y"
  Output_Variables:
  - "*FL"
  - "*FN"
Source:
  Class: "ALL"
  Variable_or_Item: "*FN"
  Natural_Language_Rule_Failure_Criteria: "A variable with a suffix of FL is equal\
    \ to Y and a variable with the same root and a suffix of FN is not equal to 1"
  Rule_Failure_Criteria: "A variable with a suffix of FN is not equal to 1"
  Condition_Failure: "Variable with a suffix of FL is present and equal to Y, and\
    \ a variable with the same root and a suffix of FN is present"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.0"
    References:
