Core:
  Id: "CDISC-AD0551"
  Status: "Published"
  Version: "1"
Description: "Raise an error when DTHCAUSN is present and DTHCAUS is not present."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "SUBJECT LEVEL ANALYSIS DATASET"
Check:
  expression: >-
    var_exists("DTHCAUSN") and not var_exists("DTHCAUS")
Outcome:
  Message: "DTHCAUSN is present, but DTHCAUS is not present."
  Output_Variables:
  - "DTHCAUSN"
Source:
  Class: "SUBJECT LEVEL ANALYSIS DATASET"
  Variable_or_Item: "DTHCAUSN"
  Natural_Language_Rule_Failure_Criteria: "DTHCAUSN is present and DTHCAUS is not\
    \ present"
  Rule_Failure_Criteria: "DTHCAUS is not present"
  Condition_Failure: "DTHCAUSN is present"
Standards:
- Organization: "CDISC"
  Standards:
