Core:
  Id: "CDISC-AD0459"
  Status: "Published"
  Version: "2"
Description: "Raise an error when TRTPN is populated but TRTP is empty"
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "BASIC DATA STRUCTURE"
    - "OCCURRENCE DATA STRUCTURE"
    - "MEDICAL DEVICE OCCURRENCE DATA STRUCTURE"
Requirements:
  Variables:
    All:
    - "TRTPN"
    - "TRTP"
Check:
  expression: >-
    not empty(TRTPN) and empty(TRTP)
Outcome:
  Message: "TRTPN is populated, but TRTP is empty"
Source:
  Class: "BASIC DATA STRUCTURE; MEDICAL DEVICE BASIC DATA STRUCTURE; OCCURRENCE DATA\
    \ STRUCTURE; MEDICAL DEVICE OCCURRENCE DATA STRUCTURE"
  Variable_or_Item: "TRTP"
  Natural_Language_Rule_Failure_Criteria: "On a given record, TRTPN is populated and\
    \ TRTP is not populated"
  Rule_Failure_Criteria: "TRTP is not populated"
  Condition_Failure: "TRTPN is populated"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.2"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR459"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.3"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR459"
        Version: "2"
      Version: "5.0"
