Core:
  Id: "CDISC-AD0676"
  Status: "Published"
  Version: "1"
Description: "Raise an error when, on a given record, DEVGRyN is populated but DEVGRy\
  \ is not populated."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "DEVICE LEVEL ANALYSIS DATASET"
Check:
  expression: >-
    not empty(DEVGRyN) and empty(DEVGRy)
Outcome:
  Message: "DEVGRyN is populated but DEVGRy is not populated on this record."
  Output_Variables:
  - "DEVGRy"
  - "DEVGRyN"
wildcards:
  "y":
    min: 1
    max: 99
Source:
  Class: "DEVICE LEVEL ANALYSIS DATASET"
  Variable_or_Item: "DEVGRy where y is an integer [1-99, not zero-padded]"
  Natural_Language_Rule_Failure_Criteria: "On a given record, DEVGRyN is populated\
    \ and DEVGRy is not populated"
  Rule_Failure_Criteria: "DEVGRy is not populated"
  Condition_Failure: "DEVGRyN is populated"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.3"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR676"
        Version: "1"
      Version: "5.0"
