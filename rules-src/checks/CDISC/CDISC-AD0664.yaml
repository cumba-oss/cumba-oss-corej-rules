Core:
  Id: "CDISC-AD0664"
  Status: "Published"
  Version: "1"
Description: "Raise an error when, on a record in an ADNCA v1.0 dataset, COHORT is\
  \ populated and COHORTN is present but not populated."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "BASIC DATA STRUCTURE"
  Subclasses:
    Include:
    - "NON-COMPARTMENTAL ANALYSIS"
Requirements:
  Variables:
    All:
    - "COHORTN"
Check:
  expression: >-
    not empty(COHORT) and empty(COHORTN)
Outcome:
  Message: "On a given record, COHORT is populated and COHORTN is present and not\
    \ populated"
Source:
  Class: "BASIC DATA STRUCTURE"
  Subclass: "NON-COMPARTMENTAL ANALYSIS"
  Variable_or_Item: "COHORTN"
  Natural_Language_Rule_Failure_Criteria: "On a given record, COHORT is populated\
    \ and COHORTN is present and not populated"
  Rule_Failure_Criteria: "COHORTN is present and not populated"
  Condition_Failure: "COHORT is populated"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.0"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
