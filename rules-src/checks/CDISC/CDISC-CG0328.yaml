Core:
  Id: "CDISC-CG0328"
  Status: "Published"
  Version: "1"
Description: "Raise an error when both TEENRL and TEDUR are present in the dataset\
  \ but neither is populated; at least one of the two must be populated for each Element."
Executability: "Not Executable"
ExecutabilityHint:
  Category: "not executable"
  Detail: "Parked as an R-5.26 duplicate of CDISC-CG0329 (owner ruling D-8, 2026-09-12):\
    \ the two rules are byte-identical in Scope, Requirements, Check, Message and\
    \ Output_Variables — the sheet decomposes one sentence by subject, CG0328 keyed\
    \ on TEENRL and CG0329 on TEDUR — and both ship into cdisc-sdtmig-3-2/-3-3/-3-4,\
    \ so a dataset with both columns present and blank reported the same finding twice.\
    \ The row stays documented here while CDISC-CG0329 carries the executable check;\
    \ the one-column-absent states are covered by CDISC-CG0328-A / CDISC-CG0329-A\
    \ and the neither-present state by CDISC-CG9676."
Scope:
  Domains:
    Include:
    - "TE"
Requirements:
  Variables:
    All:
    - "TEENRL"
    - "TEDUR"
Check:
  expression: >-
    empty(TEDUR) and empty(TEENRL)
Outcome:
  Message: "At least one of TEENRL or TEDUR should be populated."
  Output_Variables:
  - "TEENRL"
  - "TEDUR"
Source:
  Class: "TDM"
  Domain: "TE"
  Variable: "TEENRL"
  Condition: "TEDUR = null"
  Rule: "TEENRL ^= null"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "SDTMIG"
    Version: "3.4"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0328"
        Version: "1"
      Version: "2.0"
  - Name: "SDTMIG"
    Version: "3.3"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0328"
        Version: "1"
      Version: "2.0"
  - Name: "SDTMIG"
    Version: "3.2"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0328"
        Version: "1"
      Version: "2.0"
