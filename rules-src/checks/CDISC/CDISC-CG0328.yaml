Core:
  Id: "CDISC-CG0328"
  Status: "Published"
  Version: "1"
Description: "Raise an error when both TEENRL and TEDUR are empty or not present."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "TE"
Requirements:
  Variables:
    Any:
    - "TEENRL"
    - "TEDUR"
Check:
  expression: >-
    empty(TEDUR) and empty(TEENRL)
Outcome:
  Message: "At least one of TEENRL or TEDUR should be populated."
  Output_Variables:
  - "TEENRL"
  - "TEDUR"
Source:
  Class: "TDM"
  Domain: "TE"
  Variable: "TEENRL"
  Condition: "TEDUR = null"
  Rule: "TEENRL ^= null"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "SDTMIG"
    Version: "3.4"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0328"
        Version: "1"
      Version: "2.0"
  - Name: "SDTMIG"
    Version: "3.3"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0328"
        Version: "1"
      Version: "2.0"
  - Name: "SDTMIG"
    Version: "3.2"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0328"
        Version: "1"
      Version: "2.0"
