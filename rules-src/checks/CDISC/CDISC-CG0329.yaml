Core:
  Id: "CDISC-CG0329"
  Status: "Published"
  Version: "1"
Description: "Raise an error when both TEENRL and TEDUR are present in the dataset\
  \ but neither is populated; at least one of the two must be populated for each Element."
Executability: "Partially Executable - Possible Underreporting"
Scope:
  Domains:
    Include:
    - "TE"
Check:
  expression: >-
    empty(TEDUR) and empty(TEENRL)
Outcome:
  Message: "At least one of TEENRL or TEDUR should be populated."
  Message_Folded: "Neither the TEENRL nor the TEDUR variable is present or populated\
    \ in the dataset."
Source:
  Class: "TDM"
  Domain: "TE"
  Variable: "TEDUR"
  Condition: "TEENRL = null"
  Rule: "TEDUR ^= null"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "SDTMIG"
    Version: "3.4"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0329"
        Version: "1"
      Version: "2.0"
  - Name: "SDTMIG"
    Version: "3.3"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0329"
        Version: "1"
      Version: "2.0"
  - Name: "SDTMIG"
    Version: "3.2"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0329"
        Version: "1"
      Version: "2.0"
