Core:
  Id: "CDISC-CG0365"
  Status: "Published"
  Version: "1"
Description: "Raise an error when Related Subject or Pool Identifier (RSUBJID) is\
  \ populated and Related Device Identifier (RDEVID) is also populated for the same\
  \ record."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "AP--"
    - "APRELSUB"
Check:
  expression: >-
    not empty(RSUBJID) and not empty(RDEVID)
Outcome:
  Message: "RDEVID is populated when RSUBJID is populated; RSUBJID and RDEVID must\
    \ not both be populated for the same record."
Source:
  Class: "AP"
  Domain: "ALL"
  Variable: "RDEVID"
  Condition: "RSUBJID ^= null"
  Rule: "RDEVID = null"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "SDTMIG"
    Version: "3.4"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0365"
        Version: "1"
      Version: "2.0"
  - Name: "SDTMIG"
    Version: "3.3"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0365"
        Version: "1"
      Version: "2.0"
  - Name: "SDTMIG"
    Version: "3.2"
    References:
