Core:
  Id: "CDISC-AD0125"
  Status: "Published"
  Version: "1"
Description: "Raise an error when there is more than one value of PARCATy for a given\
  \ value of PARCATyN."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "BASIC DATA STRUCTURE"
Check:
  expression: >-
    not empty(PARCATy) and not empty(PARCATyN) and has_multiple_values_for(PARCATy, PARCATyN)
Outcome:
  Message: "PARCATy has more than one value for this PARCATyN."
  Output_Variables:
  - "PARCATy"
  - "PARCATyN"
wildcards:
  "y":
    min: 1
    max: 9
Source:
  Class: "BASIC DATA STRUCTURE"
  Variable_or_Item: "PARCATy where y is an integer [1-9, not zero-padded]"
  Natural_Language_Rule_Failure_Criteria: "There is more than one value of PARCATy\
    \ for a given value of PARCATyN"
  Rule_Failure_Criteria: "There is more than one value of PARCATy for a given value\
    \ of PARCATyN"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.0"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR125"
        Version: "1"
      Version: "5.0"
