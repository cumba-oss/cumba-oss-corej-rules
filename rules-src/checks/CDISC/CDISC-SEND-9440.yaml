Core:
  Id: "CDISC-SEND-9440"
  Status: "Published"
  Version: "1"
Description: "Raise an error when neither the Rule for End of Element (TEENRL) nor\
  \ the Planned Duration of Element (TEDUR) variable is present in the Trial Elements\
  \ (TE) dataset; at least one of the two must be populated for each Element."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "TE"
Check:
  expression: >-
    not var_exists("TEENRL") and not var_exists("TEDUR")
Outcome:
  Message: "Neither the TEENRL nor the TEDUR variable is present in the dataset."
Source_Proposed:
  Sheet_Issue: "#212"
  Class: "TDM"
  Domain: "TE"
  Variable: "TEENRL, TEDUR"
  Plain_Text_Explanation: "Either TEENRL or TEDUR (or both) must be populated for\
    \ each Element, which no record can satisfy when neither variable is present in\
    \ the dataset"
  Condition: ""
  Rule: "at least one of the TEENRL and TEDUR variables is present in the dataset"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "SENDIG-GENETOX"
    Version: "1.0"
  - Name: "SENDIG-DART"
    Version: "1.2"
  - Name: "SENDIG-DART"
    Version: "1.1"
  - Name: "SENDIG"
    Version: "3.1.1"
  - Name: "SENDIG"
    Version: "3.1"
  - Name: "SENDIG"
    Version: "3.0"
