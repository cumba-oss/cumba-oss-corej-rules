Core:
  Id: "CDISC-SEND-0188"
  Status: "Published"
  Version: "1"
Description: "Raise an error when more than one Organ Measurements (OM) record exists\
  \ for the same combination of Test Short Name (OMTESTCD), Unique Subject Identifier\
  \ (USUBJID), and specimen (OMSPEC); the domain should hold one record per test per\
  \ specimen per subject."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "OM"
Check:
  expression: >-
    not is_unique_set([OMTESTCD, USUBJID, OMSPEC])
Outcome:
  Message: "More than one OM record exists for the same test (OMTESTCD), subject (USUBJID),\
    \ and specimen (OMSPEC)."
Source:
  Class: "FND"
  Domain: "OM"
  Variable: "ALL"
  Plain_Text_Explanation: "One record per test per specimen per subject"
  Rule: "One record per test per specimen per subject"
