Core:
  Id: "CDISC-AD0002"
  Status: "Published"
  Version: "1"
Description: "Raise an error when a variable in ADaM shares its name with a variable\
  \ in SDTM but the two labels do not match."
Executability: "Partially Executable"
Scope:
  Domains:
    Include:
    - "ALL"
Bindings:
- name: "$sdtm_label"
  expression: "cross_dataset_variable_metadata(\"label\", domain=\"*\")"
Check:
  expression: >-
    not empty($sdtm_label) and var_label("DATA") != $sdtm_label
Outcome:
  Message: "Variable label does not match the label in the corresponding SDTM dataset."
  Output_Variables:
  - "variable_name"
  - "variable_label"
  - "$sdtm_label"
Source:
  Class: "ALL"
  Natural_Language_Rule_Failure_Criteria: "A variable is present in ADaM with the\
    \ same name as a variable present in SDTM but the variables do not have identical\
    \ labels"
  Rule_Failure_Criteria: "Variables do not have identical labels"
  Condition_Failure: "A variable is present in ADaM with the same name as a variable\
    \ present in SDTM"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.0"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR2"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.1"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR2"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.2"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR2"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.3"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR2"
        Version: "1"
      Version: "5.0"
