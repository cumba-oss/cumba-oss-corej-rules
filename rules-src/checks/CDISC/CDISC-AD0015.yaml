Core:
  Id: "CDISC-AD0015"
  Status: "Published"
  Version: "1"
Description: "Raise an error when a variable name contains a character other than\
  \ letters (A-Z), underscores (_), or numerals (0-9)"
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "ALL"
Check:
  expression: >-
    varname() !~ /^[A-Z0-9_]+$/
Outcome:
  Message: "The variable name includes a character that is not a letter (A-Z), underscore\
    \ (_), or numeral (0-9)"
Source:
  Class: "ALL"
  Variable_or_Item: "ALL"
  Natural_Language_Rule_Failure_Criteria: "A variable name contains a character other\
    \ than letters (A-Z), underscores (_), or numerals (0-9)"
  Rule_Failure_Criteria: "A variable name contains a character other than letters\
    \ (A-Z), underscores (_), or numerals (0-9)"
