Core:
  Id: "CDISC-AD0422"
  Status: "Published"
  Version: "1"
Description: "Raise an error when TRxxAGy is populated but TRxxAGyN is not populated"
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "SUBJECT LEVEL ANALYSIS DATASET"
Requirements:
  Variables:
    All:
    - "TRxxAGy"
    - "TRxxAGyN"
Check:
  expression: >-
    not empty(TRxxAGy) and empty(TRxxAGyN)
Outcome:
  Message: "TRxxAGy is populated, but TRxxAGyN is not populated"
  Output_Variables:
  - "TRxxAGy"
  - "TRxxAGyN"
wildcards:
  xx:
    min: 1
    max: 99
  "y":
    min: 1
    max: 99
Source:
  Class: "SUBJECT LEVEL ANALYSIS DATASET"
  Variable_or_Item: "TRxxAGyN where xx is an integer [01-99, zero-padded] and y is\
    \ an integer [1-9, not zero-padded]"
  Natural_Language_Rule_Failure_Criteria: "On a given record, TRxxAGy is populated\
    \ and TRxxAGyN is not populated"
  Rule_Failure_Criteria: "TRxxAGyN is not populated"
  Condition_Failure: "TRxxAGy is populated"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.2"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR422"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.3"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR422"
        Version: "1"
      Version: "5.0"
