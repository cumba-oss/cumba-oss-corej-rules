Core:
  Id: "CDISC-CG0627"
  Status: "Published"
  Version: "1"
Description: "Raise an error when --DTHREL is present in a Findings dataset, since\
  \ --DTHREL is not permitted in human clinical trials."
Executability: "Fully Executable"
Scope:
  Classes:
    Include:
    - "FINDINGS"
Check:
  expression: >-
    var_exists("--DTHREL")
Outcome:
  Message: "Variable --DTHREL is present but is not permitted in human clinical trials."
  Output_Variables:
  - "--DTHREL"
Source:
  Class: "FND"
  Variable: "--DTHREL"
  Rule: "--DTHREL not present in dataset"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "SDTMIG"
    Version: "3.4"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0627"
        Version: "1"
      Version: "2.0"
