Core:
  Id: "CDISC-CG0354"
  Status: "Published"
  Version: "1"
Description: "Raise an error when the --REASEX variable is present in the dataset,\
  \ since --REASEX is defined for use in non-clinical (SEND) studies and must never\
  \ be used in the submission of SDTM-based data for human clinical trials."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "ALL"
Check:
  expression: >-
    var_exists("--REASEX")
Outcome:
  Message: "--REASEX is present in the dataset; this variable must never be used in\
    \ the submission of SDTM-based data for human clinical trials."
  Output_Variables:
  - "--REASEX"
Source:
  Class: "ALL"
  Domain: "ALL"
  Variable: "--REASEX"
  Rule: "--REASEX not present in dataset"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "SDTMIG"
    Version: "3.4"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0354"
        Version: "1"
      Version: "2.0"
  - Name: "SDTMIG"
    Version: "3.3"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0354"
        Version: "1"
      Version: "2.0"
  - Name: "SDTMIG"
    Version: "3.2"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0354"
        Version: "1"
      Version: "2.0"
