Core:
  Id: "CDISC-CG0214"
  Status: "Published"
  Version: "1"
Description: "Raise an error when SVUPDES is populated and VISITNUM is equal to a\
  \ VISITNUM present in the TV dataset."
Executability: "Partially Executable - Possible Overreporting"
Scope:
  Domains:
    Include:
    - "SV"
Requirements:
  Variables:
    All:
    - "VISITNUM"
Bindings:
- name: "$visitnums_in_tv"
  expression: "distinct(VISITNUM, domain=\"TV\")"
Check:
  expression: >-
    (var_exists("SVPRESP") and SVPRESP != "Y" or not var_exists("SVPRESP") and (not empty(SVUPDES)
    or contains(upper(VISIT), "UNSCHEDUL") or contains(upper(VISIT), "UNPLAN"))) and VISITNUM in
    $visitnums_in_tv
Outcome:
  Message: "VISITNUM for an unplanned visit matches a VISITNUM value in the TV dataset."
  Output_Variables:
  - "VISITNUM"
  - "!SVUPDES"
  - "$visitnums_in_tv"
Source:
  Class: "SPC"
  Domain: "SV"
  Variable: "VISITNUM"
  Condition: "SVUPDES ^= null"
  Rule: "VISITNUM not in TV.VISITNUM"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "SDTMIG"
    Version: "3.3"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0214"
        Version: "1"
      Version: "2.0"
  - Name: "SDTMIG"
    Version: "3.2"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0214"
        Version: "1"
      Version: "2.0"
