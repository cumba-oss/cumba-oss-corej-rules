Core:
  Id: "CDISC-AD0712"
  Status: "Published"
  Version: "1"
Description: "Raise an error when a variable with a suffix of RFN is populated with\
  \ a value that is not 0 or 1."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "BASIC DATA STRUCTURE"
Check:
  expression: >-
    ends_with(upper(varname()), "RFN") and not empty(value()) and value() not in [0, 1]
Outcome:
  Message: "A variable with a suffix of RFN has a value that is not 1, 0, or missing."
  Output_Variables:
  - "variable_value"
Source:
  Class: "BASIC DATA STRUCTURE; MEDICAL DEVICE BASIC DATA STRUCTURE"
  Variable_or_Item: "*RFN"
  Natural_Language_Rule_Failure_Criteria: "A variable with a suffix of RFN has a value\
    \ that is not 1, 0 or null"
  Rule_Failure_Criteria: "Value is not 1, 0, or null"
  Condition_Failure: "Variable with a suffix of RFN is present"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.2"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR712"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.3"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR712"
        Version: "1"
      Version: "5.0"
