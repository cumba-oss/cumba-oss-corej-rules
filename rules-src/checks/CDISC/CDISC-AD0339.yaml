Core:
  Id: "CDISC-AD0339"
  Status: "Published"
  Version: "2"
Description: "Raise an error when MCRITyML is populated and MCRITy is empty"
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "BASIC DATA STRUCTURE"
    - "MEDICAL DEVICE BASIC DATA STRUCTURE"
Requirements:
  Variables:
    All:
    - "MCRITyML"
    - "MCRITy"
Check:
  expression: >-
    not empty(MCRITyML) and empty(MCRITy)
Outcome:
  Message: "MCRITyML is populated, but MCRITy is empty."
  Message_Folded: "MCRITy not populated in any record of the dataset, and at least\
    \ one record meets the rest of the condition: MCRITyML is populated, but MCRITy\
    \ is empty."
  Output_Variables:
  - "MCRITy"
  - "MCRITyML"
wildcards:
  "y":
    min: 1
    max: 99
Source:
  Class: "BASIC DATA STRUCTURE; MEDICAL DEVICE BASIC DATA STRUCTURE"
  Variable_or_Item: "MCRITy where y is an integer [1-99, not zero-padded]"
  Natural_Language_Rule_Failure_Criteria: "MCRITyML is populated and MCRITy is not\
    \ populated"
  Rule_Failure_Criteria: "MCRITy is not populated"
  Condition_Failure: "MCRITyML is populated"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.1"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR339"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.2"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR339"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.3"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR339"
        Version: "2"
      Version: "5.0"
