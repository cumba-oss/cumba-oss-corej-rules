Core:
  Id: "CDISC-AD0411"
  Status: "Published"
  Version: "2"
Description: "Raise an error when ANLzzFN is populated and ANLzzFL is not populated."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "BASIC DATA STRUCTURE"
Check:
  expression: >-
    not empty(ANLzzFN) and empty(ANLzzFL)
Outcome:
  Message: "ANLzzFN is populated but ANLzzFL is not populated."
  Message_Folded: "ANLzzFL not populated in any record of the dataset, and at least\
    \ one record meets the rest of the condition: ANLzzFN is populated but ANLzzFL\
    \ is not populated."
  Output_Variables:
  - "ANLzzFL"
  - "ANLzzFN"
wildcards:
  zz:
    min: 1
    max: 99
Source:
  Class: "BASIC DATA STRUCTURE; MEDICAL DEVICE BASIC DATA STRUCTURE"
  Variable_or_Item: "ANLzzFL where zz is an integer [01-99, zero-padded]"
  Natural_Language_Rule_Failure_Criteria: "On a given record, ANLzzFN is populated\
    \ and ANLzzFL is not populated"
  Rule_Failure_Criteria: "ANLzzFL is not populated"
  Condition_Failure: "ANLzzFN is populated"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.2"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR411"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.3"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR411"
        Version: "2"
      Version: "5.0"
