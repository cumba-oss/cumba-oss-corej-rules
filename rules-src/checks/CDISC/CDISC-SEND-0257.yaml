Core:
  Id: "CDISC-SEND-0257"
  Status: "Published"
  Version: "1"
Description: "Raise an error when a record in a SUPP-- dataset has an empty value\
  \ for QVAL."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "SUPP--"
    - "SQ--"
Requirements:
  Variables:
    All:
    - "QVAL"
Check:
  expression: >-
    empty(QVAL)
Outcome:
  Message: "QVAL is empty in a SUPP-- dataset record."
Source:
  Class: "REL"
  Domain: "SUPP--"
  Variable: "QVAL"
  Plain_Text_Explanation: "All records in the SUPP-- datasets must have a value for\
    \ QVAL."
  Rule: "QVAL ^= null"
