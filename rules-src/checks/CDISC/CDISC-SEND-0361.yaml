Core:
  Id: "CDISC-SEND-0361"
  Status: "Published"
  Version: "1"
Description: "Raise an error when a subject present in the IC, FM, or FX dataset does\
  \ not have a record with PYRESCAT equal to 'PREGNANT' in the PY dataset."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "IC"
    - "FM"
    - "FX"
Grouping:
  Variables:
  - "USUBJID"
Bindings:
- name: "$pregnant_subjects"
  expression: "distinct(USUBJID, domain=\"PY\", filter=filter(PYRESCAT=\"PREGNANT\"\
    ))"
Check:
  expression: >-
    USUBJID not in $pregnant_subjects
Outcome:
  Message: "The subject present in this dataset does not have a record with PYRESCAT\
    \ equal to 'PREGNANT' in the PY dataset."
  Output_Variables:
  - "$pregnant_subjects"
Source:
  Class: "FND"
  Domain: "IC, FM, FX"
  Variable: "USUBJID"
  Plain_Text_Explanation: "The IC, FM, FX domains should only include records for\
    \ pregnant (maternal) females."
  Condition: "PY.PYRESCAT ^= \"PREGNANT\""
  Rule: "USUBJID does not exist in domain"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "SENDIG-DART"
    Version: "1.2"
    References:
    - Origin: "SEND Conformance Rules"
      Rule_Identifier:
        Id: "SEND361"
        Version: "1"
      Version: "5.0"
  - Name: "SENDIG-DART"
    Version: "1.1"
    References:
    - Origin: "SEND Conformance Rules"
      Rule_Identifier:
        Id: "SEND361"
        Version: "1"
      Version: "5.0"
