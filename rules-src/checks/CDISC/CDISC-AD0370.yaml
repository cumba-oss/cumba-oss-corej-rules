Core:
  Id: "CDISC-AD0370"
  Status: "Published"
  Version: "2"
Description: "Raise an error when *TMF is populated and neither *TM nor *DTM is populated"
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "BASIC DATA STRUCTURE"
    - "OCCURRENCE DATA STRUCTURE"
    - "MEDICAL DEVICE BASIC DATA STRUCTURE"
    - "MEDICAL DEVICE OCCURRENCE DATA STRUCTURE"
Check:
  expression: >-
    not empty(*TMF) and empty(*TM) and empty(*DTM)
Outcome:
  Message: "*TMF is populated, but neither *TM nor *DTM is populated."
  Message_Folded: "*DTM or *TM not populated in any record of the dataset, and at\
    \ least one record meets the rest of the condition: *TMF is populated, but neither\
    \ *TM nor *DTM is populated."
  Output_Variables:
  - "*TM"
  - "*DTM"
  - "*TMF"
Source:
  Class: "BASIC DATA STRUCTURE; MEDICAL DEVICE BASIC DATA STRUCTURE; OCCURRENCE DATA\
    \ STRUCTURE; MEDICAL DEVICE OCCURRENCE DATA STRUCTURE"
  Variable_or_Item: "*TM; *DTM"
  Natural_Language_Rule_Failure_Criteria: "*TMF is populated and neither *TM nor *DTM\
    \ is populated"
  Rule_Failure_Criteria: "Neither *TM nor *DTM is populated"
  Condition_Failure: "*TMF is populated"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.0"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR370"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.1"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR370"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.2"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR370"
        Version: "1"
      Version: "5.0"
