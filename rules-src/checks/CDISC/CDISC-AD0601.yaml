Core:
  Id: "CDISC-AD0601"
  Status: "Published"
  Version: "1"
Description: "Raise an error when, on a BDS or OCCDS record, ASPREDT does not equal\
  \ the ADSL variable PxxSwEDT for the same USUBJID (where xx equals the record's\
  \ APERIOD value and w equals the record's ASPER value)."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "BASIC DATA STRUCTURE"
    - "OCCURRENCE DATA STRUCTURE"
Requirements:
  Variables:
    All:
    - "USUBJID"
    - "ASPREDT"
    - "APERIOD"
    - "ASPER"
    All_Or_None:
    - - "USUBJID"
      - "ADSL.USUBJID"
Match_Datasets:
- Name: "ADSL"
  Keys:
  - "USUBJID"
Check:
  expression: >-
    not empty(ASPREDT) and not empty(ADSL.P${APERIOD:%02d}S${ASPER:%d}EDT) and ASPREDT !=
    ADSL.P${APERIOD:%02d}S${ASPER:%d}EDT
Outcome:
  Message: "On a given record, the value of ASPREDT is not equal to the value of variable\
    \ PxxSwEDT where xx equals the value of APERIOD and w equals the value of ASPER"
  Output_Variables:
  - "APERIOD"
  - "ASPER"
  - "ASPREDT"
  - "ADSL.P${*}S${*}EDT"
Source:
  Class: "ALL"
  Variable_or_Item: "ASPREDT"
  Natural_Language_Rule_Failure_Criteria: "On a given record, the value of ASPREDT\
    \ is not equal to the value of variable PxxSwEDT where xx equals the value of\
    \ APERIOD and w equals the value of ASPER"
  Rule_Failure_Criteria: "On a given record, the value of ASPREDT is not equal to\
    \ the value of variable PxxSwEDT where xx equals the value of APERIOD and w equals\
    \ the value of ASPER"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.2"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR601"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.3"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR601"
        Version: "1"
      Version: "5.0"
