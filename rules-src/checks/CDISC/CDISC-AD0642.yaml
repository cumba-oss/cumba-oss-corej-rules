Core:
  Id: "CDISC-AD0642"
  Status: "Published"
  Version: "1"
Description: "Raise an error when the SDTM AE dataset contains the AEENDY column but\
  \ AEENDY is not present in the ADAE dataset."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "OCCURRENCE DATA STRUCTURE"
  Subclasses:
    Include:
    - "ADVERSE EVENT"
Requirements:
  Variables:
    All:
    - "AE.AEENDY"
Check:
  expression: >-
    not var_exists("AEENDY")
Outcome:
  Message: "AE.AEENDY is present but AEENDY is not present"
  Output_Variables:
  - "AEENDY"
Source:
  Class: "OCCURRENCE DATA STRUCTURE"
  Subclass: "ADVERSE EVENT"
  Variable_or_Item: "AE.AEENDY"
  Natural_Language_Rule_Failure_Criteria: "AE.AEENDY is present but AEENDY is not\
    \ present"
  Rule_Failure_Criteria: "AEENDY is not present"
  Condition_Failure: "AE.AEENDY is present"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.0"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR642"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.1"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR642"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.2"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR642"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.3"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR642"
        Version: "1"
      Version: "5.0"
