Core:
  Id: "CDISC-SEND-0169"
  Status: "Published"
  Version: "1"
Description: "Raise an error when more than one Laboratory (LB) record exists for\
  \ the same combination of Test Short Name (LBTESTCD), subject or pool (USUBJID/POOLID),\
  \ specimen (LBSPEC), and observation time (LBDTC); the domain should hold one record\
  \ per test per specimen per observation time per subject or pool."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "LB"
Check:
  expression: >-
    not is_unique_set([LBTESTCD, USUBJID, POOLID, LBSPEC, LBDTC])
Outcome:
  Message: "More than one LB record exists for the same test (LBTESTCD), subject or\
    \ pool (USUBJID/POOLID), specimen (LBSPEC), and observation time (LBDTC)."
Source:
  Class: "FND"
  Domain: "LB"
  Variable: "ALL"
  Plain_Text_Explanation: "One record per test per specimen per observation time per\
    \ subject or pool."
  Rule: "One record per test per specimen per observation time per subject or pool."
