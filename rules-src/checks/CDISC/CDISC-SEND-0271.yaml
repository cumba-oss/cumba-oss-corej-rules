Core:
  Id: "CDISC-SEND-0271"
  Status: "Published"
  Version: "1"
Description: "Raise an error when a variable's data type in the dataset does not match\
  \ the data type specified for that variable in the SENDIG library metadata (or,\
  \ for a domain the SENDIG does not define, in the SDTM Model)."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "ALL"
Check:
  expression: >-
    not empty(var_type("LIBRARY")) and var_type("DATA") != var_type("LIBRARY")
Outcome:
  Message: "The variable data type in the dataset does not match the data type specified\
    \ in the SENDIG."
Source:
  Class: "ALL"
  Domain: "ALL"
  Variable: "ALL"
  Plain_Text_Explanation: "The variable type in the .xpt dataset must match the SDTM\
    \ specified data type."
  Rule: "The variable type in the .xpt dataset must match the SDTM specified data\
    \ type."
