Core:
  Id: "CDISC-SEND-0036"
  Status: "Published"
  Version: "1"
Description: "Raise an error when neither USUBJID nor POOLID is populated on a record;\
  \ every record containing subject-level or pool-level data must have USUBJID or\
  \ POOLID populated."
Executability: "Fully Executable"
Scope:
  Classes:
    Include:
    - "INTERVENTIONS"
    - "EVENTS"
    - "FINDINGS"
Check:
  expression: >-
    empty(USUBJID) and empty(POOLID)
Outcome:
  Message: "Neither USUBJID nor POOLID is populated; one of the two identifiers is\
    \ required."
  Message_Folded: "POOLID and USUBJID absent or not populated in any record of the\
    \ dataset, and at least one record meets the rest of the condition: Neither USUBJID\
    \ nor POOLID is populated; one of the two identifiers is required."
Source:
  Class: "INT, FND, EVT"
  Domain: "ALL"
  Variable: "USUBJID, POOLID"
  Plain_Text_Explanation: "For all records containing subject level or pool level\
    \ data, USUBJID or POOLID is required."
  Rule: "USUBJID ^=null OR POOLID ^=null"
