Core:
  Id: "CDISC-AD0393"
  Status: "Published"
  Version: "2"
Description: "Raise an error when ATOXGRL is populated and ATOXGRLN is not populated."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "BASIC DATA STRUCTURE"
Requirements:
  Variables:
    All:
    - "ATOXGRL"
    - "ATOXGRLN"
Check:
  expression: >-
    not empty(ATOXGRL) and empty(ATOXGRLN)
Outcome:
  Message: "ATOXGRL is populated but ATOXGRLN is not populated."
Source:
  Class: "BASIC DATA STRUCTURE; MEDICAL DEVICE BASIC DATA STRUCTURE"
  Variable_or_Item: "ATOXGRLN"
  Natural_Language_Rule_Failure_Criteria: "On a given record, ATOXGRL is populated\
    \ and ATOXGRLN is not populated"
  Rule_Failure_Criteria: "ATOXGRLN is not populated"
  Condition_Failure: "ATOXGRL is populated"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.2"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR393"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.3"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR393"
        Version: "2"
      Version: "5.0"
