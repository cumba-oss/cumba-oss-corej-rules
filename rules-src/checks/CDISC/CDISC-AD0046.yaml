Core:
  Id: "CDISC-AD0046"
  Status: "Published"
  Version: "1"
Description: "Raise an error when a variable with a suffix of DY equals zero"
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "ALL"
Check:
  expression: >-
    ends_with(upper(varname()), "DY") and value() == 0
Outcome:
  Message: "A variable with a suffix of DY has a value of zero"
  Output_Variables:
  - "variable_name"
  - "variable_value"
Source:
  Class: "ALL"
  Variable_or_Item: "*DY"
  Natural_Language_Rule_Failure_Criteria: "A variable with a suffix of DY has a value\
    \ of zero"
  Rule_Failure_Criteria: "Variable has a value of zero"
  Condition_Failure: "Variable with a suffix of DY"
Standards:
- Organization: "CDISC"
  Standards:
