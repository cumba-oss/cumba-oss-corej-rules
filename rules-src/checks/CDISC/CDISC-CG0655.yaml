Core:
  Id: "CDISC-CG0655"
  Status: "Published"
  Version: "1"
Description: "Raise an error when a visit is planned (SVPRESP is equal to 'Y') but\
  \ the Visit Number (VISITNUM) value does not match any VISITNUM value in the Trial\
  \ Visits (TV) dataset."
Executability: "Partially Executable - Possible Overreporting"
Scope:
  Domains:
    Include:
    - "SV"
Requirements:
  Variables:
    All:
    - "VISITNUM"
Bindings:
- name: "$tv_visitnum"
  expression: "distinct(VISITNUM, domain=\"TV\")"
Check:
  expression: >-
    (var_exists("SVPRESP") and SVPRESP == "Y" or not var_exists("SVPRESP") and empty(SVUPDES) and
    not contains(upper(VISIT), "UNSCHEDUL") and not contains(upper(VISIT), "UNPLAN")) and VISITNUM
    not in $tv_visitnum
Outcome:
  Message: "VISITNUM value for a planned visit does not match any VISITNUM value in\
    \ the TV dataset."
  Output_Variables:
  - "VISITNUM"
  - "SVPRESP"
  - "$tv_visitnum"
Source:
  Class: "SPC"
  Domain: "SV"
  Variable: "VISITNUM"
  Condition: "SVPRESP = 'Y'"
  Rule: "VISITNUM in TV.VISITNUM"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "SDTMIG"
    Version: "3.4"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0655"
        Version: "1"
      Version: "2.0"
