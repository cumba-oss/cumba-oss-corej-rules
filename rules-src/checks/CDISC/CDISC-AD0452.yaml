Core:
  Id: "CDISC-AD0452"
  Status: "Published"
  Version: "1"
Description: "Raise an error when REGIONy is populated but REGIONyN is missing"
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "SUBJECT LEVEL ANALYSIS DATASET"
Check:
  expression: >-
    not empty(REGIONy) and empty(REGIONyN)
Outcome:
  Message: "REGIONy is populated, but REGIONyN is missing"
  Message_Folded: "REGIONyN not populated in any record of the dataset, and at least\
    \ one record meets the rest of the condition: REGIONy is populated, but REGIONyN\
    \ is missing"
  Output_Variables:
  - "REGIONy"
  - "REGIONyN"
wildcards:
  "y":
    min: 1
    max: 99
Source:
  Class: "SUBJECT LEVEL ANALYSIS DATASET"
  Variable_or_Item: "REGIONyN where y is an integer [1-9, not zero-padded]"
  Natural_Language_Rule_Failure_Criteria: "On a given record, REGIONy is populated\
    \ and REGIONyN is not populated"
  Rule_Failure_Criteria: "REGIONyN is not populated"
  Condition_Failure: "REGIONy is populated"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.2"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR452"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.3"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR452"
        Version: "1"
      Version: "5.0"
