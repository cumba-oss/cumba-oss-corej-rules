Core:
  Id: "CDISC-CG0271"
  Status: "Published"
  Version: "1"
Description: "Raise an error when TSVAL is populated with a value other than 'Y' or\
  \ 'N' for a record where TSPARMCD equals 'RANDOM' (Trial is Randomized)."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "TS"
Requirements:
  Variables:
    All:
    - "TSPARMCD"
    - "TSVAL"
Check:
  expression: >-
    TSPARMCD == "RANDOM" and not empty(TSVAL) and TSVAL not in ["Y", "N"]
Outcome:
  Message: "Invalid TSVAL value for RANDOM: TSVAL must be 'Y' or 'N' when TSPARMCD\
    \ equals 'RANDOM' (Trial is Randomized)."
Source:
  Class: "TDM"
  Domain: "TS"
  Variable: "TSVAL"
  Condition: "TSPARMCD = 'RANDOM' and TSVAL ^= null"
  Rule: "TSVAL in ('N','Y')"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "SDTMIG"
    Version: "3.3"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0271"
        Version: "1"
      Version: "2.0"
  - Name: "SDTMIG"
    Version: "3.2"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0271"
        Version: "1"
      Version: "2.0"
