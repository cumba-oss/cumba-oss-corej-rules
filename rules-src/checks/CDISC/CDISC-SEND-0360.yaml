Core:
  Id: "CDISC-SEND-0360"
  Status: "Published"
  Version: "1"
Description: "Raise an error when the Fetus Identifier (FETUSID) is not unique for\
  \ a given combination of Unique Subject Identifier (USUBJID) and Implantation Site\
  \ Label (ICIMPLBL) in the Implantation Classification (IC) dataset."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "IC"
Check:
  expression: >-
    not is_unique_set([FETUSID, USUBJID, ICIMPLBL])
Outcome:
  Message: "FETUSID is not unique for the combination of subject (USUBJID) and implantation\
    \ site (ICIMPLBL)."
Source:
  Class: "FND"
  Domain: "IC"
  Variable: "ICIMPLBL, FETUSID"
  Plain_Text_Explanation: "FETUSID must be unique per ICIMPLBL"
  Condition: "More than 1 record per ICIMPLBL"
  Rule: "FETUSID is unique per ICIMPLBL per USUBJID"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "SENDIG-DART"
    Version: "1.2"
    References:
    - Origin: "SEND Conformance Rules"
      Rule_Identifier:
        Id: "SEND360"
        Version: "1"
      Version: "5.0"
  - Name: "SENDIG-DART"
    Version: "1.1"
    References:
    - Origin: "SEND Conformance Rules"
      Rule_Identifier:
        Id: "SEND360"
        Version: "1"
      Version: "5.0"
