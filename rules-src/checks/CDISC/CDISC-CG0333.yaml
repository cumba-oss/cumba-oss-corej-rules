Core:
  Id: "CDISC-CG0333"
  Status: "Published"
  Version: "1"
Description: "Raise an error when a Findings About dataset name begins with \"FA\"\
  , is longer than two characters, and the characters following \"FA\" do not match\
  \ the two-character code of a domain present in the study."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "FA"
    include_split_datasets: true
Bindings:
- name: "$study_domains"
  expression: "study_domains()"
Check:
  expression: >-
    ds_name("DATA") =~ /(?i)^FA[A-Z]{1,2}$/ and upper(suffix(ds_name("DATA"), 2)) not in
    $study_domains
Outcome:
  Message: "The parent domain code in the Findings About split dataset name does not\
    \ match a domain present in the study."
  Output_Variables:
  - "dataset_name"
  - "$study_domains"
Source:
  Class: "ALL"
  Domain: "ALL"
  Variable: "GEN"
  Condition: "Dataset split by parent domain and dataset name length > 2 and dataset\
    \ name begins with 'FA'"
  Rule: "The characters of the dataset name after 'FA' equal a domain that present\
    \ in the study"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "SDTMIG"
    Version: "3.4"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0333"
        Version: "1"
      Version: "2.0"
  - Name: "SDTMIG"
    Version: "3.3"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0333"
        Version: "1"
      Version: "2.0"
  - Name: "SDTMIG"
    Version: "3.2"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0333"
        Version: "1"
      Version: "2.0"
