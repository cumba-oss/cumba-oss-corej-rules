Core:
  Id: "CDISC-CG0318"
  Status: "Published"
  Version: "1"
Description: "Raise an error when a PP dataset is present in study, but a PC dataset\
  \ is not present in study."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "PP"
Check:
  expression: >-
    ds_exists("PP") and not ds_exists("PC")
Outcome:
  Message: "PC dataset is not present in study, when a PP dataset is present in study."
Source:
  Class: "FND"
  Domain: "PC"
  Variable: "GEN"
  Condition: "PP dataset present in study"
  Rule: "PC dataset present in study"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "SDTMIG"
    Version: "3.4"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0318"
        Version: "1"
      Version: "2.0"
  - Name: "SDTMIG"
    Version: "3.3"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0318"
        Version: "1"
      Version: "2.0"
  - Name: "SDTMIG"
    Version: "3.2"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0318"
        Version: "1"
      Version: "2.0"
