Core:
  Id: "CDISC-SEND-0103"
  Status: "Published"
  Version: "1"
Description: "Raise an error when Age Text (AGETXT) is populated and either Age (AGE)\
  \ or Date/Time of Birth (BRTHDTC) is also populated."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "DM"
Requirements:
  Variables:
    All:
    - "AGETXT"
Check:
  expression: >-
    not empty(AGETXT) and (not empty(AGE) or not empty(BRTHDTC))
Outcome:
  Message: "AGETXT is populated while AGE or BRTHDTC is also populated."
Source:
  Class: "SPC, TDM"
  Domain: "DM,TS"
  Variable: "AGETXT"
  Plain_Text_Explanation: "AGETXT is used to present the age range in situations where\
    \ the exact birthdate is not known.  If AGETXT is included both BRTHDTC and AGE\
    \ should not be populated."
  Condition: "AGETXT ^=null"
  Rule: "AGE = null AND BRTHDTC = null"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "SENDIG-GENETOX"
    Version: "1.0"
    References:
