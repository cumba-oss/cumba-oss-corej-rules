Core:
  Id: "CDISC-AD0294"
  Status: "Published"
  Version: "1"
Description: "Raise an error when there is more than one value of AETOXGRN for a given\
  \ value of AETOXGR."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "OCCURRENCE DATA STRUCTURE"
Check:
  expression: >-
    not empty(AETOXGRN) and not empty(AETOXGR) and has_multiple_values_for(AETOXGRN, AETOXGR)
Outcome:
  Message: "AETOXGRN has more than one value for the same value of AETOXGR."
Source:
  Class: "OCCURRENCE DATA STRUCTURE"
  Variable_or_Item: "AETOXGRN"
  Natural_Language_Rule_Failure_Criteria: "There is more than one value of AETOXGRN\
    \ for a given value of AETOXGR"
  Rule_Failure_Criteria: "There is more than one value of AETOXGRN for a given value\
    \ of AETOXGR"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.0"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR294"
        Version: "1"
      Version: "5.0"
