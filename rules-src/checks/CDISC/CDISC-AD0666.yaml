Core:
  Id: "CDISC-AD0666"
  Status: "Published"
  Version: "1"
Description: "Raise an error when DOSPCTDF is populated but DOSEP and DOSEA are not\
  \ populated in an ADNCA v1.0 dataset."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "BASIC DATA STRUCTURE"
  Subclasses:
    Include:
    - "NON-COMPARTMENTAL ANALYSIS"
Check:
  expression: >-
    not empty(DOSPCTDF) and empty(DOSEP) and empty(DOSEA)
Outcome:
  Message: "DOSPCTDF is populated and DOSEP and DOSEA are not populated"
Source:
  Class: "BASIC DATA STRUCTURE"
  Subclass: "NON-COMPARTMENTAL ANALYSIS"
  Variable_or_Item: "DOSEP; DOSEA"
  Natural_Language_Rule_Failure_Criteria: "DOSPCTDF is populated and DOSEP and DOSEA\
    \ are not populated"
  Rule_Failure_Criteria: "DOSEP and DOSEA are not populated"
  Condition_Failure: "DOSPCTDF is populated"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.0"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
