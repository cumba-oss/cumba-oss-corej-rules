Core:
  Id: "CDISC-AD0280"
  Status: "Published"
  Version: "1"
Description: "Raise an error when there is more than one value of AESEV for a given\
  \ value of AESEVN."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "OCCURRENCE DATA STRUCTURE"
Check:
  expression: >-
    not empty(AESEV) and not empty(AESEVN) and has_multiple_values_for(AESEV, AESEVN)
Outcome:
  Message: "AESEV has more than one value for the same value of AESEVN."
Source:
  Class: "OCCURRENCE DATA STRUCTURE"
  Variable_or_Item: "AESEV"
  Natural_Language_Rule_Failure_Criteria: "There is more than one value of AESEV for\
    \ a given value of AESEVN"
  Rule_Failure_Criteria: "There is more than one value of AESEV for a given value\
    \ of AESEVN"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.0"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR280"
        Version: "1"
      Version: "5.0"
