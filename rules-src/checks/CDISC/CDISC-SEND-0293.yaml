Core:
  Id: "CDISC-SEND-0293"
  Status: "Published"
  Version: "1"
Description: "Raise an error when a Planned Time Point Name (--TPT) is populated but\
  \ the corresponding Planned Time Point Number (--TPTNUM) is missing."
Executability: "Fully Executable"
Scope:
  Classes:
    Include:
    - "FINDINGS"
Requirements:
  Variables:
    All:
    - "--TPT"
Check:
  expression: >-
    not empty(--TPT) and empty(--TPTNUM)
Outcome:
  Message: "--TPTNUM is missing when --TPT is populated."
  Message_Folded: "--TPTNUM absent or not populated in any record of the dataset,\
    \ and at least one record meets the rest of the condition: --TPTNUM is missing\
    \ when --TPT is populated."
Source_Proposed:
  Sheet_Issue: "#20,#90"
  Class: "FND"
  Domain: "ALL"
  Variable: "ALL"
  Plain_Text_Explanation: "If --TPT is populated --TPTNUM must be populated."
  Condition: "--TPT ^=null"
  Rule: "--TPTNUM ^= null"
Source:
  Class: "FND"
  Domain: "ALL"
  Variable: "ALL"
  Plain_Text_Explanation: "If --TPT is populated --TPTNUM must be populated."
  Condition: "--TPT ^=null"
  Rule: "TPTNUM ^= null"
