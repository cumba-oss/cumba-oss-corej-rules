Core:
  Id: "CDISC-SEND-0177"
  Status: "Published"
  Version: "1"
Description: "Raise an error when Test Name (MATEST) is \"Gross Pathological Examination\"\
  \ but Specimen Material Type (MASPEC) is empty; MASPEC is required for this test."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "MA"
Requirements:
  Variables:
    All:
    - "MASPEC"
    - "MATEST"
Check:
  expression: >-
    MATEST == "Gross Pathological Examination" and empty(MASPEC)
Outcome:
  Message: "MASPEC is empty when MATEST is \"Gross Pathological Examination\"; MASPEC\
    \ is required."
Source:
  Class: "FND"
  Domain: "MA"
  Variable: "MASPEC, MATEST"
  Plain_Text_Explanation: "When MATEST is \"Gross Pathological Examination\" MASPEC\
    \ is required."
  Condition: "MATEST = \"Gross Pathological Examination\""
  Rule: "MASPEC ^= null"
