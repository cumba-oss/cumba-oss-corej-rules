Core:
  Id: "CDISC-CG0636"
  Status: "Published"
  Version: "1"
Description: "Raise an error when --NOMLBL is present."
Executability: "Not Executable"
ExecutabilityHint:
  Category: "not executable"
  Detail: "Parked as an R-5.26 duplicate of CDISC-CG0511 (owner rulings D-8 + D-18,\
    \ 2026-09-14): the two are identical in every field but the id. ⛔ The SURVIVOR\
    \ IS NOT THE HIGHER NUMBER here — D-18 makes COVERAGE the invariant and the number\
    \ only a tie-break. CDISC-CG0636 ships into a strict SUBSET of CDISC-CG0511's\
    \ packages, so parking CDISC-CG0511 instead would leave the standards only it\
    \ reaches with no active rule. Every standard either rule names keeps an active\
    \ rule."
Scope:
  Domains:
    Include:
    - "ALL"
Check:
  expression: >-
    var_exists("--NOMLBL")
Outcome:
  Message: "--NOMLBL must not be present."
  Output_Variables:
  - "--NOMLBL"
Source:
  Class: "ALL"
  Variable: "--NOMLBL"
  Rule: "--NOMLBL not present in dataset"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "SDTMIG"
    Version: "3.4"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0636"
        Version: "1"
      Version: "2.0"
