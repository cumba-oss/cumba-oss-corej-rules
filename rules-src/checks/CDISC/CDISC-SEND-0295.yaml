Core:
  Id: "CDISC-SEND-0295"
  Status: "Published"
  Version: "1"
Description: "Raise an error when the assessment-interval start (--STINT) variable\
  \ is populated but the end (--ENINT) variable is empty; both must be populated together\
  \ or both be empty."
Executability: "Fully Executable"
Scope:
  Classes:
    Include:
    - "FINDINGS"
Requirements:
  Variables:
    All:
    - "--STINT"
    - "--ENINT"
Check:
  expression: >-
    not empty(--STINT) and empty(--ENINT)
Outcome:
  Message: "--STINT is populated but --ENINT is empty; both must be populated together\
    \ or both empty."
Source:
  Class: "FND"
  Domain: "ALL"
  Variable: "--STINT, --ENINT"
  Plain_Text_Explanation: "Both --STINT and --ENINT must be populated if one is populated\
    \ or both --STINT and --ENINT must be null."
  Condition: "--STINT ^= null  OR --ENINT ^= null"
  Rule: "--STINT ^= null  AND --ENINT ^= null"
