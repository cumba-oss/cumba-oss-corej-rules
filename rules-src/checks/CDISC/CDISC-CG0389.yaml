Core:
  Id: "CDISC-CG0389"
  Status: "Published"
  Version: "1"
Description: "Raise an error when AESCONG is populated and its value is not 'Y' or\
  \ 'N'."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "AE"
Requirements:
  Variables:
    All:
    - "AESCONG"
Check:
  expression: >-
    not empty(AESCONG) and AESCONG not in ["Y", "N"]
Outcome:
  Message: "AESCONG is populated but its value is not 'Y' or 'N'."
Source:
  Class: "EVT"
  Domain: "AE"
  Variable: "--SCONG"
  Condition: "--SCONG ^= null"
  Rule: "--SCONG in ('Y','N')"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "SDTMIG"
    Version: "3.4"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0389"
        Version: "1"
      Version: "2.0"
  - Name: "SDTMIG"
    Version: "3.3"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0389"
        Version: "1"
      Version: "2.0"
  - Name: "SDTMIG"
    Version: "3.2"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0389"
        Version: "1"
      Version: "2.0"
