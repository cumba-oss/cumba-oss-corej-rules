Core:
  Id: "CDISC-SEND-0205"
  Status: "Published"
  Version: "1"
Description: "Raise an error when the tumor-detection interval (TFDETECT) is populated\
  \ but does not equal the number of days from the earliest dose date (earliest EXSTDTC\
  \ for the subject) to the tumor record date (TFDTC), plus one (first dose day =\
  \ day 1). Because every TF record is post mortem, TFDTC is the subject's disposition\
  \ date, so it serves as a faithful proxy for the necropsy/histopathology source\
  \ rule's (DSSTDTC - EXSTDTC) + 1."
Executability: "Not Executable"
ExecutabilityHint:
  Category: "not executable"
  Detail: "Parked: the engine cannot express this rule's Source formula. The formula\
    \ is TFDETECT = (DSSTDTC - EXSTDTC) + 1, a two-hop foreign date subtraction —\
    \ the minuend comes from DS and the subtrahend from EX, neither of them the TF\
    \ dataset being validated. date_diff_days reaches ONE foreign dataset, so the\
    \ shipped implementation silently substituted the local TF.--DTC for DSSTDTC;\
    \ that is a different assertion, not an approximation of this one. The Source's\
    \ detection-method Condition (tumor was initially detected during histopathology\
    \ examination, the MI domain) is a cross-domain relationship test and is not implemented\
    \ at all, so the four rules CDISC-SEND-0202 to 0205 shared one byte-identical\
    \ Check and reported four identical findings per offending record. Un-parking\
    \ needs (1) two-hop foreign date arithmetic — the parked EC-47 gap, PLAN-date-diff-foreign-offset.md,\
    \ register section 48 — and (2) a cross-domain detection-method condition, which\
    \ EC-47 does not cover."
Scope:
  Domains:
    Include:
    - "TF"
Requirements:
  Variables:
    All:
    - "EX.EXSTDTC"
    - "USUBJID"
    - "--DTC"
    - "TFDETECT"
    All_Or_None:
    - - "USUBJID"
      - "EX.USUBJID"
Match_Datasets:
- Keys:
  - "USUBJID"
  Name: "EX"
Bindings:
- name: "$days_from_first_dose"
  expression: "date_diff_days(--DTC, domain=\"EX\", reference=\"EXSTDTC\", offset=\"\
    1\", group=[USUBJID])"
Check:
  expression: >-
    is_complete_date(--DTC) and not empty(TFDETECT) and TFDETECT != $days_from_first_dose
Outcome:
  Message: "TFDETECT does not equal the number of days from the earliest EXSTDTC to\
    \ the tumor record date (TFDTC, the post-mortem disposition date) plus one."
  Output_Variables:
  - "$days_from_first_dose"
  - "--DTC"
  - "TFDETECT"
Source:
  Class: "FND"
  Domain: "TF"
  Variable: "TFDETECT"
  Plain_Text_Explanation: "If the tumor was initially detected during histopathology\
    \ examination (the MI domain), then TFDETECT is based off the DS domain variable\
    \ DSSTDTC (Date/Time of Disposition). This is calculated as: (DSSTDTC - EXSTDTC)\
    \ + 1."
  Condition: "Tumor was initially detected during histopathology examination (the\
    \ MI domain)"
  Rule: "TFDETECT = (DSSTDTC - EXSTDTC) + 1"
