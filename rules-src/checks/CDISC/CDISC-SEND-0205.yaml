Core:
  Id: "CDISC-SEND-0205"
  Status: "Published"
  Version: "1"
Description: "Raise an error when a tumor record's mass identifier (TFSPID) is populated\
  \ and linked by --SPID to no clinical sign (CL), palpable mass (PM) or macroscopic\
  \ finding (MA) record of the same subject, so the tumor was first detected at histopathology\
  \ (MI), and its populated TFDETECT does not equal the number of days from the earliest\
  \ dose date (earliest EXSTDTC for the subject) to the subject's disposition date\
  \ (DS.DSSTDTC, a complete date), plus one (first dose day = day 1)."
Executability: "Partially Executable"
ExecutabilityHint:
  Category: "partially executable"
  Detail: "The detection method is read from the --SPID link alone (SENDIG TF Assumption\
    \ 5, SENDIG 3.0 Assumption 4: the mass identifier in --SPID is consistent across\
    \ CL, PM, MA, MI and TF): a TF record whose USUBJID and TFSPID are also a CL or\
    \ PM mass was detected in life (CDISC-SEND-0202, CDISC-SEND-0203), one that is\
    \ an MA mass and neither of those at necropsy (CDISC-SEND-0204), one that is none\
    \ of them at histopathology (CDISC-SEND-0205). Gaps: a record with a blank TFSPID\
    \ is not judged, because its detection method cannot be determined; a mass linked\
    \ to CL, PM or MA only through RELREC, not by --SPID, is not seen, so it is judged\
    \ by the wrong one of CDISC-SEND-0204 and CDISC-SEND-0205, or judged at all where\
    \ a missed CL or PM link means it was detected in life; a study whose CL, PM or\
    \ MA dataset lacks its --SPID column skips the rule, because the link to that\
    \ domain cannot be read for any record; a subject without a DS record, or whose\
    \ DSSTDTC is not a complete date, is not judged."
Scope:
  Domains:
    Include:
    - "TF"
Requirements:
  Variables:
    All:
    - "USUBJID"
    - "TFSPID"
    - "TFDETECT"
    - "DS.DSSTDTC"
    - "EX.EXSTDTC"
    - "EX.USUBJID"
    All_Or_None:
    - - "USUBJID"
      - "DS.USUBJID"
    - - "CL.USUBJID"
      - "CL.CLSPID"
    - - "PM.USUBJID"
      - "PM.PMSPID"
    - - "MA.USUBJID"
      - "MA.MASPID"
Match_Datasets:
- Keys:
  - "USUBJID"
  Name: "DS"
Bindings:
- name: "$cl_masses"
  expression: "distinct([USUBJID, CLSPID], domain=\"CL\", filter=(not empty(CLSPID)))"
- name: "$pm_masses"
  expression: "distinct([USUBJID, PMSPID], domain=\"PM\", filter=(not empty(PMSPID)))"
- name: "$ma_masses"
  expression: "distinct([USUBJID, MASPID], domain=\"MA\", filter=(not empty(MASPID)))"
- name: "$first_dose"
  expression: "min_date(EXSTDTC, domain=\"EX\", group=[USUBJID])"
- name: "$days_to_disposition"
  expression: "date_diff_days(DS.DSSTDTC, min_date(EXSTDTC, domain=\"EX\", group=[USUBJID]))\
    \ + 1"
Check:
  expression: >-
    not empty(TFSPID) and not empty(TFDETECT) and is_complete_date(DS.DSSTDTC) and tuple(USUBJID,
    TFSPID) not in $cl_masses and tuple(USUBJID, TFSPID) not in $pm_masses and tuple(USUBJID,
    TFSPID) not in $ma_masses and TFDETECT != $days_to_disposition
Outcome:
  Message: "TFDETECT does not equal (DSSTDTC - earliest EXSTDTC) + 1 for a tumor first\
    \ detected at histopathology (its TFSPID matches no CL, PM or MA record of the\
    \ subject)."
  Output_Variables:
  - "TFSPID"
  - "TFDETECT"
  - "DS.DSSTDTC"
  - "$first_dose"
  - "$days_to_disposition"
Source:
  Class: "FND"
  Domain: "TF"
  Variable: "TFDETECT"
  Plain_Text_Explanation: "If the tumor was initially detected during histopathology\
    \ examination (the MI domain), then TFDETECT is based off the DS domain variable\
    \ DSSTDTC (Date/Time of Disposition). This is calculated as: (DSSTDTC - EXSTDTC)\
    \ + 1."
  Condition: "Tumor was initially detected during histopathology examination (the\
    \ MI domain)"
  Rule: "TFDETECT = (DSSTDTC - EXSTDTC) + 1"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "SENDIG-GENETOX"
    Version: "1.0"
    References:
    - Origin: "SEND Conformance Rules"
      Rule_Identifier:
        Id: "SEND205"
        Version: "1"
      Version: "5.0"
  - Name: "SENDIG-DART"
    Version: "1.2"
    References:
    - Origin: "SEND Conformance Rules"
      Rule_Identifier:
        Id: "SEND205"
        Version: "1"
      Version: "5.0"
  - Name: "SENDIG-DART"
    Version: "1.1"
    References:
    - Origin: "SEND Conformance Rules"
      Rule_Identifier:
        Id: "SEND205"
        Version: "1"
      Version: "5.0"
  - Name: "SENDIG"
    Version: "3.1.1"
    References:
    - Origin: "SEND Conformance Rules"
      Rule_Identifier:
        Id: "SEND205"
        Version: "1"
      Version: "5.0"
  - Name: "SENDIG"
    Version: "3.1"
