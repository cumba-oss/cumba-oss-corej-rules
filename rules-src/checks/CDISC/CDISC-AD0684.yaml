Core:
  Id: "CDISC-AD0684"
  Status: "Published"
  Version: "1"
Description: "Raise an error when, on a given record, MODELGyN is populated but MODELGy\
  \ is empty."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "DEVICE LEVEL ANALYSIS DATASET"
Check:
  expression: >-
    not empty(MODELGyN) and empty(MODELGy)
Outcome:
  Message: "MODELGyN is populated but MODELGy is empty on this record."
  Message_Folded: "MODELGy not populated in any record of the dataset, and at least\
    \ one record meets the rest of the condition: MODELGyN is populated but MODELGy\
    \ is empty on this record."
  Output_Variables:
  - "MODELGy"
  - "MODELGyN"
wildcards:
  "y":
    min: 1
    max: 99
Source:
  Class: "DEVICE LEVEL ANALYSIS DATASET"
  Variable_or_Item: "MODELGy where y is an integer [1-99, not zero-padded]"
  Natural_Language_Rule_Failure_Criteria: "On a given record, MODELGyN is populated\
    \ and MODELGy is not populated"
  Rule_Failure_Criteria: "MODELGy is not populated"
  Condition_Failure: "MODELGyN is populated"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.3"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR684"
        Version: "1"
      Version: "5.0"
