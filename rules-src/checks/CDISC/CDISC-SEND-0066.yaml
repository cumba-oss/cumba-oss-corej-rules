Core:
  Id: "CDISC-SEND-0066"
  Status: "Published"
  Version: "1"
Description: "Raise an error when a Date/Time variable (a variable whose name ends\
  \ in DTC) is populated with a value that neither conforms to the ISO 8601 international\
  \ standard nor is an SDTM masked date, in which an unknown component is written\
  \ as a hyphen placeholder."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "ALL"
Check:
  expression: >-
    ends_with(upper(varname()), "DTC") and not empty(value()) and invalid_date(value())
Outcome:
  Message: "A Date/Time (DTC) variable is populated with a value that is neither valid\
    \ ISO 8601 nor an SDTM masked date."
  Output_Variables:
  - "variable_value"
Source:
  Class: "ALL"
  Domain: "ALL"
  Variable: "RFSTDTC,  RFENDTC, BRTHDTC, --STDTC, --ENDTC, --DTC, --RFTDTC"
  Plain_Text_Explanation: "Variables that include dates (--DTC) are required to be\
    \ presented according to the international standard ISO 8601 date or date/time\
    \ format"
  Condition: "Variable = RFSTDTC, RFENDTC, BRTHDTC, --STDTC, --ENDTC, --DTC, --RFTDTC"
  Rule: "Variable populated in ISO 8601 date or date/time format"
Standards:
- Organization: "CDISC"
  Standards:
