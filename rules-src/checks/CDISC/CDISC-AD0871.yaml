Core:
  Id: "CDISC-AD0871"
  Status: "Published"
  Version: "1"
Description: "Raise an error when SEXN is populated and SEX is not populated."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "BASIC DATA STRUCTURE"
Check:
  expression: >-
    not empty(SEXN) and empty(SEX)
Outcome:
  Message: "SEXN is populated, but SEX is not populated."
  Output_Variables:
  - "SEX"
  - "SEXN"
Source:
  Class: "BASIC DATA STRUCTURE"
  Subclass: "POPULATION PHARMACOKINETIC ANALYSIS"
  Variable_or_Item: "SEX"
  Natural_Language_Rule_Failure_Criteria: "SEXN is populated and SEX is not populated"
  Rule_Failure_Criteria: "SEX is not populated"
  Condition_Failure: "SEXN is populated"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.3"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR871"
        Version: "1"
      Version: "5.0"
