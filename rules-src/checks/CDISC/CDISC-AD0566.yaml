Core:
  Id: "CDISC-AD0566"
  Status: "Published"
  Version: "2"
Description: "Raise an error when PBCHGCyN is present and PBCHGCAy is not present."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "BASIC DATA STRUCTURE"
Check:
  expression: >-
    var_exists("PBCHGCyN") and not var_exists("PBCHGCAy")
Outcome:
  Message: "PBCHGCyN is present, but PBCHGCAy is not present."
  Output_Variables:
  - "PBCHGCyN"
wildcards:
  "y":
    min: 1
    max: 99
Source_Proposed:
  Sheet_Issue: "#59,#155"
  Class: "BASIC DATA STRUCTURE; MEDICAL DEVICE BASIC DATA STRUCTURE"
  Subclass: ""
  SEND_SDTM_Domain: ""
  Variable_or_Item: "PBCHGCyN where y is an integer [1-99, not zero-padded]"
  Natural_Language_Rule_Failure_Criteria: "PBCHGCyN is present and PBCHGCAy is not\
    \ present"
  Rule_Failure_Criteria: "PBCHGCAy is not present"
  Condition_Failure: "PBCHGCyN is present"
Source:
  Class: "BASIC DATA STRUCTURE; MEDICAL DEVICE BASIC DATA STRUCTURE"
  Variable_or_Item: "PBCHGCyN where y is an integer [1-9, not zero-padded]"
  Natural_Language_Rule_Failure_Criteria: "PBCHGCyN is present and PBCHGCAy is not\
    \ present"
  Rule_Failure_Criteria: "BCHGCAy is not present"
  Condition_Failure: "PBCHGCyN is present"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.2"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR566"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.3"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR566"
        Version: "2"
      Version: "5.0"
