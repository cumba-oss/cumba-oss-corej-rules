Core:
  Id: "CDISC-SEND-0025"
  Status: "Published"
  Version: "1"
Description: "Raise an error when a Set Code (SETCD) value is longer than 8 characters."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "DM"
    - "TX"
Requirements:
  Variables:
    All:
    - "SETCD"
Check:
  expression: >-
    len(SETCD) > 8
Outcome:
  Message: "SETCD value is longer than 8 characters."
Source:
  Class: "SPC, TDM"
  Domain: "DM, TX"
  Variable: "SETCD"
  Plain_Text_Explanation: "SETCD value limited to 8 characters"
  Rule: "--SETCD value length <= 8"
