Core:
  Id: "CDISC-CG0218"
  Status: "Published"
  Version: "1"
Description: "Raise an error when the Epoch (EPOCH) in the Subject Visits (SV) domain\
  \ does not match the EPOCH value of the corresponding Subject Elements (SE) element\
  \ whose date range (SESTDTC to SEENDTC) contains the visit start date (SVSTDTC)."
Executability: "Partially Executable - Possible Overreporting"
Scope:
  Domains:
    Include:
    - "SV"
Requirements:
  Variables:
    All:
    - "EPOCH"
    - "SE.EPOCH"
    - "SVSTDTC"
    - "STUDYID"
    - "USUBJID"
    All_Or_None:
    - - "STUDYID"
      - "SE.STUDYID"
    - - "USUBJID"
      - "SE.USUBJID"
Match_Datasets:
- Keys:
  - "STUDYID"
  - "USUBJID"
  Name: "SE"
Bindings:
- name: "$first_element_start"
  expression: "min_date(SESTDTC, domain=\"SE\", group=[USUBJID])"
Check:
  ERROR:
    expression: >-
      date(SE.SESTDTC) <= date(SVSTDTC) and date(SVSTDTC) < date(SE.SEENDTC) and EPOCH != SE.EPOCH
      and (SVSTDTC !~ /^[0-9]{4}-[0-9]{2}-[0-9]{2}$/ or SVSTDTC != SE.SESTDTC or date(SE.SESTDTC) <=
      date($first_element_start))
  INFO:
    expression: >-
      not empty(earliest_possible(SE.SESTDTC)) and not empty(earliest_possible(SVSTDTC)) and
      date(earliest_possible(SE.SESTDTC)) <= latest_possible(SVSTDTC) and
      date(earliest_possible(SVSTDTC)) < latest_possible(SE.SEENDTC) and EPOCH != SE.EPOCH and
      (SVSTDTC !~ /^[0-9]{4}-[0-9]{2}-[0-9]{2}$/ or SVSTDTC != SE.SESTDTC or date(SE.SESTDTC) <=
      date($first_element_start))
    Message: "EPOCH in SV does not match EPOCH of an SE element whose date range may contain\
      \ the visit start date (partial date/time precision leaves the containment undetermined)."
Outcome:
  Message: "EPOCH in SV does not match EPOCH of the corresponding element in the SE\
    \ dataset."
  Output_Variables:
  - "!$first_element_start"
Source:
  Class: "SPC"
  Domain: "SV"
  Variable: "EPOCH"
  Condition: "EPOCH present in dataset and SESTDTC <= SVSTDTC and SVSTDTC <= SEENDTC"
  Rule: "EPOCH = SE.EPOCH"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "SDTMIG"
    Version: "3.4"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0218"
        Version: "1"
      Version: "2.0"
  - Name: "SDTMIG"
    Version: "3.3"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0218"
        Version: "1"
      Version: "2.0"
  - Name: "SDTMIG"
    Version: "3.2"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0218"
        Version: "1"
      Version: "2.0"
