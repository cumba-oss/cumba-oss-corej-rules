Core:
  Id: "CDISC-SEND-0142"
  Status: "Published"
  Version: "1"
Description: "Raise an error when more than one Body Weight (BW) record exists for\
  \ the same combination of Test Short Name (BWTESTCD), Unique Subject Identifier\
  \ (USUBJID), and observation time (BWDTC); the domain should hold one record per\
  \ test per observation time per subject."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "BW"
Check:
  expression: >-
    not is_unique_set([BWTESTCD, USUBJID, BWDTC])
Outcome:
  Message: "More than one BW record exists for the same test (BWTESTCD), subject (USUBJID),\
    \ and observation time (BWDTC)."
Source:
  Class: "FND"
  Domain: "BW"
  Variable: "ALL"
  Plain_Text_Explanation: "One record per test per observation time per subject"
  Rule: "One record per test per observation time per subject"
