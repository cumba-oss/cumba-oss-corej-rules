Core:
  Id: "CDISC-SEND-0112.1"
  Status: "Published"
  Version: "1"
Description: "Raise an error when AGE or AGEU is declared in the DM Define-XML document\
  \ with Origin Type Derived but has no derivation Method."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "DM"
Check:
  expression: >-
    upper(varname()) in ["AGE", "AGEU"] and not empty(var_name("DEFINE")) and
    var_origin_type("DEFINE") == "Derived" and var_has_method("DEFINE") == false
Outcome:
  Message: "AGE/AGEU has no derivation method (algorithm) in the Define-XML document."
Source:
  Class: "SPC"
  Domain: "DM"
  Variable: "AGE,AGEU"
  Plain_Text_Explanation: "AGE and AGEU can be calculated from the BRTHDTC and RFSTDTC.\
    \  If a calculation is used, the algorithm should be included in the Define-XML\
    \ document."
  Condition: "AGE^= null AND AGE def:Origin/@Type = \"Derived\""
  Rule: "Algorithm is included in the Define-XML document"
Standards:
