Core:
  Id: "CDISC-AD0451"
  Status: "Published"
  Version: "2"
Description: "Raise an error when MCRITyMN is populated but MCRITyML is empty"
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "BASIC DATA STRUCTURE"
Check:
  expression: >-
    not empty(MCRITyMN) and empty(MCRITyML)
Outcome:
  Message: "MCRITyMN is populated, but MCRITyML is empty"
  Message_Folded: "MCRITyML not populated in any record of the dataset, and at least\
    \ one record meets the rest of the condition: MCRITyMN is populated, but MCRITyML\
    \ is empty"
  Output_Variables:
  - "MCRITyML"
  - "MCRITyMN"
wildcards:
  "y":
    min: 1
    max: 99
Source:
  Class: "BASIC DATA STRUCTURE; MEDICAL DEVICE BASIC DATA STRUCTURE"
  Variable_or_Item: "MCRITyML where y is an integer [1-9, not zero-padded]"
  Natural_Language_Rule_Failure_Criteria: "On a given record, MCRITyMN is populated\
    \ and MCRITyML is not populated"
  Rule_Failure_Criteria: "MCRITyML is not populated"
  Condition_Failure: "MCRITyMN is populated"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.2"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR451"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.3"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR451"
        Version: "2"
      Version: "5.0"
