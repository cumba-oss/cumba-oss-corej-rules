Core:
  Id: "CDISC-AD0023"
  Status: "Published"
  Version: "1"
Description: "Raise an error when SAFFL is populated with a value that is not Y or\
  \ N"
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "SUBJECT LEVEL ANALYSIS DATASET"
Requirements:
  Variables:
    All:
    - "SAFFL"
Check:
  expression: >-
    not empty(SAFFL) and SAFFL not in ["Y", "N"]
Outcome:
  Message: "SAFFL has a value other than Y or N"
Source:
  Class: "SUBJECT LEVEL ANALYSIS DATASET"
  Variable_or_Item: "SAFFL"
  Natural_Language_Rule_Failure_Criteria: "SAFFL is present and has a value that is\
    \ not Y or N"
  Rule_Failure_Criteria: "Value is not Y or N"
  Condition_Failure: "SAFFL is present"
