Core:
  Id: "CDISC-SEND-0063"
  Status: "Published"
  Version: "1"
Description: "Raise an error when the Time Point Reference date/time (--RFTDTC) is\
  \ populated but the Time Point Reference (--TPTREF) is empty; --TPTREF should be\
  \ provided whenever --RFTDTC is populated because --RFTDTC represents the actual\
  \ date/time of the fixed reference point named by --TPTREF."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "ALL"
Requirements:
  Variables:
    All:
    - "--RFTDTC"
    - "--TPTREF"
Check:
  expression: >-
    not empty(--RFTDTC) and empty(--TPTREF)
Outcome:
  Message: "--TPTREF is empty when --RFTDTC is populated."
  Message_Folded: "--TPTREF not populated in any record of the dataset, and at least\
    \ one record meets the rest of the condition: --TPTREF is empty when --RFTDTC\
    \ is populated."
Source:
  Class: "ALL"
  Domain: "ALL"
  Variable: "--TPTREF"
  Plain_Text_Explanation: "If --RFTDTC is not null then --TPTREF is not null"
  Condition: "--RFTDTC ^= null"
  Rule: "--TPTREF ^= null"
