Core:
  Id: "CDISC-AD0641"
  Status: "Published"
  Version: "1"
Description: "Raise an error when the SDTM AE dataset contains the AESTDY column but\
  \ AESTDY is not present in the ADAE dataset."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "OCCURRENCE DATA STRUCTURE"
  Subclasses:
    Include:
    - "ADVERSE EVENT"
Requirements:
  Variables:
    All:
    - "AE.AESTDY"
Check:
  expression: >-
    not var_exists("AESTDY")
Outcome:
  Message: "AE.AESTDY is present but AESTDY is not present"
  Output_Variables:
  - "AE.AESTDY"
  - "AESTDY"
Source:
  Class: "OCCURRENCE DATA STRUCTURE"
  Subclass: "ADVERSE EVENT"
  Variable_or_Item: "AE.AESTDY"
  Natural_Language_Rule_Failure_Criteria: "AE.AESTDY is present but AESTDY is not\
    \ present"
  Rule_Failure_Criteria: "AESTDY is not present"
  Condition_Failure: "AE.AESTDY is present"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.0"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR641"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.1"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR641"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.2"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR641"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.3"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR641"
        Version: "1"
      Version: "5.0"
