Core:
  Id: "CDISC-AD0282"
  Status: "Published"
  Version: "2"
Description: "Raise an error when ASEVN is populated and is not equal to 1, 2, or\
  \ 3."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "OCCURRENCE DATA STRUCTURE"
    - "MEDICAL DEVICE OCCURRENCE DATA STRUCTURE"
Check:
  expression: >-
    not empty(ASEVN) and ASEVN not in [1, 2, 3]
Outcome:
  Message: "ASEVN is populated and is not equal to 1, 2, or 3."
Source:
  Class: "OCCURRENCE DATA STRUCTURE; MEDICAL DEVICE OCCURRENCE DATA STRUCTURE"
  Variable_or_Item: "ASEVN"
  Natural_Language_Rule_Failure_Criteria: "ASEVN is not equal to 1, 2, 3, or null"
  Rule_Failure_Criteria: "ASEVN is not equal to 1, 2, 3, or null"
