Core:
  Id: "CDISC-AD0880"
  Status: "Published"
  Version: "1"
Description: "Raise an error when COUNTRY is populated and COUNTRYL is not populated"
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "BASIC DATA STRUCTURE"
Requirements:
  Variables:
    All:
    - "COUNTRY"
    - "COUNTRYL"
Check:
  expression: >-
    not empty(COUNTRY) and empty(COUNTRYL)
Outcome:
  Message: "COUNTRY is populated, but COUNTRYL is not populated"
  Message_Folded: "COUNTRYL not populated in any record of the dataset, and at least\
    \ one record meets the rest of the condition: COUNTRY is populated, but COUNTRYL\
    \ is not populated"
Source:
  Class: "BASIC DATA STRUCTURE"
  Subclass: "POPULATION PHARMACOKINETIC ANALYSIS"
  Variable_or_Item: "COUNTRYL"
  Natural_Language_Rule_Failure_Criteria: "COUNTRY is populated and COUNTRYL is not\
    \ populated"
  Rule_Failure_Criteria: "COUNTRYL is not populated"
  Condition_Failure: "COUNTRY is populated"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.3"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR880"
        Version: "1"
      Version: "5.0"
