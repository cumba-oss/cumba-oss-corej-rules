Core:
  Id: "CDISC-AD0876"
  Status: "Published"
  Version: "1"
Description: "Raise an error when COUNTRYN is populated and COUNTRY is not populated"
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "BASIC DATA STRUCTURE"
Check:
  expression: >-
    not empty(COUNTRYN) and empty(COUNTRY)
Outcome:
  Message: "COUNTRYN is populated, but COUNTRY is not populated"
  Message_Folded: "COUNTRY not populated in any record of the dataset, and at least\
    \ one record meets the rest of the condition: COUNTRYN is populated, but COUNTRY\
    \ is not populated"
Source:
  Class: "BASIC DATA STRUCTURE"
  Subclass: "POPULATION PHARMACOKINETIC ANALYSIS"
  Variable_or_Item: "COUNTRY"
  Natural_Language_Rule_Failure_Criteria: "COUNTRYN is populated and COUNTRY is not\
    \ populated"
  Rule_Failure_Criteria: "COUNTRY is not populated"
  Condition_Failure: "COUNTRYN is populated"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.3"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR876"
        Version: "1"
      Version: "5.0"
