Core:
  Id: "CDISC-AD0105"
  Status: "Published"
  Version: "1"
Description: "Raise an error when APERIODC and APERIOD are both populated and there\
  \ is more than one value of APERIODC for a given value of APERIOD"
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "ALL"
Requirements:
  Variables:
    All:
    - "APERIOD"
    - "APERIODC"
Check:
  expression: >-
    not empty(APERIODC) and not empty(APERIOD) and has_multiple_values_for(APERIODC, APERIOD)
Outcome:
  Message: "More than one value of APERIODC was found for the same value of APERIOD"
Source:
  Class: "ALL"
  Variable_or_Item: "APERIODC"
  Natural_Language_Rule_Failure_Criteria: "There is more than one value of APERIODC\
    \ for a given value of APERIOD"
  Rule_Failure_Criteria: "There is more than one value of APERIODC for a given value\
    \ of APERIOD"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.0"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR105"
        Version: "1"
      Version: "5.0"
