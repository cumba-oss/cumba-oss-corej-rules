Core:
  Id: "CDISC-AD0708"
  Status: "Published"
  Version: "1"
Description: "Raise an error when a variable's name contains no numeric index, the\
  \ implementation guide defines a fixed standard label for it without an asterisk,\
  \ ellipsis, or brace placeholder, and the variable's actual label does not match\
  \ that standard label"
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "ALL"
Check:
  expression: >-
    varname() !~ /[0-9]/ and not empty(var_label("LIBRARY")) and not contains(var_label("LIBRARY"),
    "*") and not contains(var_label("LIBRARY"), "...") and not contains(var_label("LIBRARY"), "{")
    and not empty(label_template("LIBRARY")) and not matches_label_template(var_label("DATA"),
    label_template("LIBRARY"))
Outcome:
  Message: "The variable's label does not match the fixed standard label defined for\
    \ it in the implementation guide"
  Output_Variables:
  - "variable_name"
  - "variable_label"
  - "library_variable_label"
Source:
  Class: "ALL"
  Variable_or_Item: "ALL"
  Natural_Language_Rule_Failure_Criteria: "Labels for ADaM variables do not match\
    \ the standard labels for ADaM variables listed in the implementation guide that\
    \ cannot be modified (with the exception of (1) variables whose names contain\
    \ indexes \"w\", “y”, \"xx\", or “zz”; and (2) variable labels with asterisks\
    \ (*), braces ({...}), and ellipses (...) indicated for sponsor appropriate text)"
  Rule_Failure_Criteria: "Variable label does not match the standard label"
  Condition_Failure: "Variable name matches a standard variable defined in the ADaM-IG"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.1"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR708"
        Version: "1"
      Version: "5.0"
