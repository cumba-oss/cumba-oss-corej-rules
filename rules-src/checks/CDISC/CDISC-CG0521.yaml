Core:
  Id: "CDISC-CG0521"
  Status: "Published"
  Version: "1"
Description: "Raise an error when the Planned Arm Code (ARMCD) is empty while the\
  \ Description of Planned Arm (ARM) is populated."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "DM"
Requirements:
  Variables:
    All:
    - "ARMCD"
    - "ARM"
Check:
  expression: >-
    empty(ARMCD) and not empty(ARM)
Outcome:
  Message: "ARM is populated when ARMCD is empty."
  Message_Folded: "ARMCD not populated in any record of the dataset, and at least\
    \ one record meets the rest of the condition: ARM is populated when ARMCD is empty."
Source:
  Class: "SPC"
  Domain: "DM"
  Variable: "ARM"
  Condition: "ARMCD = null"
  Rule: "ARM = null"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "SDTMIG"
    Version: "3.4"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0521"
        Version: "1"
      Version: "2.0"
  - Name: "SDTMIG"
    Version: "3.3"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0521"
        Version: "1"
      Version: "2.0"
