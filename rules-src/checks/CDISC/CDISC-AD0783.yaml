Core:
  Id: "CDISC-AD0783"
  Status: "Published"
  Version: "1"
Description: "Raise an error when there is more than one value of ATOXGR for a given\
  \ value of ATOXGRN, considering only rows on which both variables are populated"
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "BASIC DATA STRUCTURE"
    - "OCCURRENCE DATA STRUCTURE"
    - "MEDICAL DEVICE OCCURRENCE DATA STRUCTURE"
Check:
  expression: >-
    not empty(ATOXGR) and not empty(ATOXGRN) and has_multiple_values_for(ATOXGR, ATOXGRN)
Outcome:
  Message: "ATOXGR takes more than one value for the same value of ATOXGRN, considering\
    \ only rows on which both variables are populated."
  Output_Variables:
  - "ATOXGR"
  - "ATOXGRN"
Source:
  Class: "BASIC DATA STRUCTURE; MEDICAL DEVICE BASIC DATA STRUCTURE; OCCURRENCE DATA\
    \ STRUCTURE; MEDICAL DEVICE OCCURRENCE DATA STRUCTURE"
  Variable_or_Item: "ATOXGR"
  Natural_Language_Rule_Failure_Criteria: "There is more than one value of ATOXGR\
    \ for a given value of ATOXGRN, considering only those rows on which both variables\
    \ are populated"
  Rule_Failure_Criteria: "There is more than one value of ATOXGR for a given value\
    \ of ATOXGRN"
  Condition_Failure: "On rows where both ATOXGR and ATOXGRN are both populated."
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.1"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR783"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.2"
    References:
