Core:
  Id: "CDISC-AD0475"
  Status: "Published"
  Version: "1"
Description: "Raise an error when STRATAVN is populated and STRATAV is empty on the\
  \ same record."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "SUBJECT LEVEL ANALYSIS DATASET"
Check:
  expression: >-
    not empty(STRATAVN) and empty(STRATAV)
Outcome:
  Message: "STRATAVN is populated but STRATAV is empty."
Source:
  Class: "SUBJECT LEVEL ANALYSIS DATASET"
  Variable_or_Item: "STRATAV"
  Natural_Language_Rule_Failure_Criteria: "On a given record, STRATAVN is populated\
    \ and STRATAV is not populated"
  Rule_Failure_Criteria: "STRATAV is not populated"
  Condition_Failure: "STRATAVN is populated"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.2"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR475"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.3"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR475"
        Version: "1"
      Version: "5.0"
