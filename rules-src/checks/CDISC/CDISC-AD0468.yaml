Core:
  Id: "CDISC-AD0468"
  Status: "Published"
  Version: "1"
Description: "Raise an error when there is more than one value of STRATAR for a given\
  \ value of STRATARN, considering only records where both variables are populated."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "SUBJECT LEVEL ANALYSIS DATASET"
Check:
  expression: >-
    not empty(STRATAR) and not empty(STRATARN) and has_multiple_values_for(STRATAR, STRATARN)
Outcome:
  Message: "More than one value of STRATAR was found for the same value of STRATARN."
Source:
  Class: "SUBJECT LEVEL ANALYSIS DATASET"
  Variable_or_Item: "STRATAR"
  Natural_Language_Rule_Failure_Criteria: "There is more than one value of STRATAR\
    \ for a given value of STRATARN, considering only those rows on which both variables\
    \ are populated"
  Rule_Failure_Criteria: "There is more than one value of STRATAR for a given value\
    \ of STRATARN"
  Condition_Failure: "On rows where both STRATAR and STRATARN are both populated."
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.2"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR468"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.3"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR468"
        Version: "1"
      Version: "5.0"
