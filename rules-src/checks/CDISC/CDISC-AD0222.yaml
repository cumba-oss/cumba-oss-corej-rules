Core:
  Id: "CDISC-AD0222"
  Status: "Published"
  Version: "1"
Description: "Raise an error when, within a given value of PARAMCD, BASECATy is populated,\
  \ BASE is populated, and there is more than one value of BASECATy for a given value\
  \ of BASE"
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "BASIC DATA STRUCTURE"
Check:
  expression: >-
    not empty(BASECATy) and not empty(BASE) and has_multiple_values_for(BASECATy, BASE,
    within=PARAMCD)
Outcome:
  Message: "Within this PARAMCD, more than one value of BASECATy is recorded for the\
    \ same BASE"
wildcards:
  "y":
    min: 1
    max: 9
Source_Proposed:
  Sheet_Issue: "#55"
  Class: "BASIC DATA STRUCTURE"
  Subclass: ""
  SEND_SDTM_Domain: ""
  Variable_or_Item: "BASECATy where y is an integer [1-9, not zero-padded]"
  Natural_Language_Rule_Failure_Criteria: "Within a given value of PARAMCD, there\
    \ is more than one value of BASECATy for a given value of BASE and y"
  Rule_Failure_Criteria: "There is more than one value of BASECATy for a given value\
    \ of BASE"
  Condition_Failure: "Within a given value of PARAMCD"
Source:
  Class: "BASIC DATA STRUCTURE"
  Variable_or_Item: "BASECATy where y is an integer [1-9, not zero-padded]"
  Natural_Language_Rule_Failure_Criteria: "Within a given value of PARAMCD, there\
    \ is more than one value of BASECATy for a given value of BASE and y"
  Rule_Failure_Criteria: "There is more than one value of BASECATy for a given value\
    \ of AVAL"
  Condition_Failure: "Within a given value of PARAMCD"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.0"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR222"
        Version: "1"
      Version: "5.0"
