Core:
  Id: "CDISC-AD0546"
  Status: "Published"
  Version: "2"
Description: "Raise an error when PCHGCAyN is present but the corresponding PCHGCATy\
  \ is not present, where y is an integer [1-99, not zero-padded]."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "BASIC DATA STRUCTURE"
Check:
  expression: >-
    var_exists("PCHGCAyN") and not var_exists("PCHGCATy")
Outcome:
  Message: "PCHGCAyN is present but the corresponding PCHGCATy is not present."
  Output_Variables:
  - "PCHGCAyN"
wildcards:
  "y":
    min: 1
    max: 99
Source:
  Class: "BASIC DATA STRUCTURE; MEDICAL DEVICE BASIC DATA STRUCTURE"
  Variable_or_Item: "PCHGCAyN where y is an integer [1-9, not zero-padded]"
  Natural_Language_Rule_Failure_Criteria: "PCHGCAyN is present and PCHGCATy is not\
    \ present"
  Rule_Failure_Criteria: "PCHGCATy is not present"
  Condition_Failure: "PCHGCAyN is present"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.1"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR546"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.2"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR546"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.3"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR546"
        Version: "2"
      Version: "5.0"
