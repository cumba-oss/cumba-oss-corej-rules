Core:
  Id: "CDISC-AD0796"
  Status: "Published"
  Version: "1"
Description: "Raise an error when PROJIDN is populated and PROJID is not populated"
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "BASIC DATA STRUCTURE"
Check:
  expression: >-
    not empty(PROJIDN) and empty(PROJID)
Outcome:
  Message: "PROJIDN is populated, but PROJID is not populated."
  Message_Folded: "PROJID absent or not populated in any record of the dataset, and\
    \ at least one record meets the rest of the condition: PROJIDN is populated, but\
    \ PROJID is not populated."
Source:
  Class: "BASIC DATA STRUCTURE"
  Subclass: "POPULATION PHARMACOKINETIC ANALYSIS"
  Variable_or_Item: "PROJID"
  Natural_Language_Rule_Failure_Criteria: "PROJIDN is populated and PROJID is not\
    \ populated"
  Rule_Failure_Criteria: "PROJID is not populated"
  Condition_Failure: "PROJIDN is populated"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.3"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR796"
        Version: "1"
      Version: "5.0"
