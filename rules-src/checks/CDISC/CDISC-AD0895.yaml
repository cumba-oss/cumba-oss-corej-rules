Core:
  Id: "CDISC-AD0895"
  Status: "Published"
  Version: "2"
Description: "Raise an error when a variable with a prefix of CRIT, a suffix of FL\
  \ and containing either a one-digit or two-digit number (CRITyFL) is present and\
  \ a variable with the same root without a suffix of FL (CRITy) is not present"
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "BASIC DATA STRUCTURE"
Check:
  expression: >-
    var_exists("CRITyFL") and not var_exists("CRITy")
Outcome:
  Message: "A variable with a prefix of CRIT, a suffix of FL and containing either\
    \ a one-digit or two-digit number (CRITyFL) is present, but a variable with the\
    \ same root without a suffix of FL (CRITy) is not present"
  Output_Variables:
  - "CRITyFL"
wildcards:
  "y":
    min: 1
    max: 99
Source:
  Class: "BASIC DATA STRUCTURE; MEDICAL DEVICE BASIC DATA STRUCTURE"
  Variable_or_Item: "CRITyFL where y is an integer [1-99, not zero-padded]"
  Natural_Language_Rule_Failure_Criteria: "A variable with a prefix of CRIT, a suffix\
    \ of FL and containing either a one-digit or two-digit number (CRITyFL) is present\
    \ and a variable with the same root without a suffix of FL (CRITy) is not present"
  Rule_Failure_Criteria: "A variable with a prefix of CRIT, a suffix of FL and containing\
    \ either a one-digit or two-digit number is present and a variable with the same\
    \ root without a suffix of FL is not present"
  Condition_Failure: "CRITyFL is present"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.1"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR895"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.2"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR895"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.3"
    References:
