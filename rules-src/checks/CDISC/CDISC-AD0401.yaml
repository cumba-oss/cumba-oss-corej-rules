Core:
  Id: "CDISC-AD0401"
  Status: "Published"
  Version: "2"
Description: "Raise an error when ATOXDSCL is populated and AVAL or ATOXGRL is not\
  \ populated."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "BASIC DATA STRUCTURE"
Requirements:
  Variables:
    All:
    - "ATOXDSCL"
Check:
  expression: >-
    not empty(ATOXDSCL) and (empty(AVAL) or empty(ATOXGRL))
Outcome:
  Message: "ATOXDSCL is populated but AVAL or ATOXGRL is not populated."
Source:
  Class: "BASIC DATA STRUCTURE; MEDICAL DEVICE BASIC DATA STRUCTURE"
  Variable_or_Item: "AVAL; ATOXGRL"
  Natural_Language_Rule_Failure_Criteria: "AVAL is not populated or ATOXGRL is not\
    \ populated, and ATOXDSCL is populated"
  Rule_Failure_Criteria: "AVAL is not populated or ATOXGRL is not populated"
  Condition_Failure: "ATOXDSCL is populated"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.2"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR401"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.3"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR401"
        Version: "2"
      Version: "5.0"
