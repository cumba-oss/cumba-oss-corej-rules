Core:
  Id: "CDISC-CG0273"
  Status: "Published"
  Version: "1"
Description: "Raise an error when a record exists with TSPARMCD equal to 'HLTSUBJI'\
  \ and TSVAL equal to 'N', but TSVAL is empty for the record where TSPARMCD equals\
  \ 'TDIGRP'."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "TS"
Requirements:
  Variables:
    All:
    - "TSPARMCD"
Bindings:
- name: "$HLTSUBJI_N"
  expression: "record_count(group=[STUDYID], filter=(TSPARMCD == \"HLTSUBJI\" and\
    \ TSVAL == \"N\"))"
Check:
  expression: >-
    TSPARMCD == "TDIGRP" and $HLTSUBJI_N >= 1 and empty(TSVAL)
Outcome:
  Message: "TSVAL is empty for the TDIGRP Trial Summary Parameter when a record exists\
    \ with TSPARMCD equal to 'HLTSUBJI' and TSVAL equal to 'N'."
  Output_Variables:
  - "TSPARMCD"
  - "TSVAL"
  - "$HLTSUBJI_N"
Source:
  Class: "TDM"
  Domain: "TS"
  Variable: "TSVAL"
  Condition: "TSPARMCD = 'TDIGRP' and record exists where TSPARMCD = 'HLTSUBJI' and\
    \ TSVAL = 'N'"
  Rule: "TSVAL ^= null"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "SDTMIG"
    Version: "3.3"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0273"
        Version: "1"
      Version: "2.0"
  - Name: "SDTMIG"
    Version: "3.2"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0273"
        Version: "1"
      Version: "2.0"
