Core:
  Id: "CDISC-AD0844"
  Status: "Published"
  Version: "1"
Description: "Raise an error when ALQFN is present and ALQFL is not present."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "BASIC DATA STRUCTURE"
Check:
  expression: >-
    var_exists("ALQFN") and not var_exists("ALQFL")
Outcome:
  Message: "ALQFN is present, but ALQFL is not present."
  Output_Variables:
  - "ALQFN"
Source:
  Class: "BASIC DATA STRUCTURE"
  Subclass: "POPULATION PHARMACOKINETIC ANALYSIS"
  Variable_or_Item: "ALQFN"
  Natural_Language_Rule_Failure_Criteria: "ALQFN is present and ALQFL is not present"
  Rule_Failure_Criteria: "ALQFL is not present"
  Condition_Failure: "ALQFN is present"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.3"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR844"
        Version: "1"
      Version: "5.0"
