Core:
  Id: "CDISC-SEND-0352-A"
  Status: "Published"
  Version: "1"
Description: "Raise an error when at least one record has Repro Stage Code (RSTGCD)\
  \ equal to 'UNPLAN' but the Unplanned Stage Description (SJUPDES) variable is not\
  \ present in the dataset; the published row requires SJUPDES to be non-null under\
  \ that condition, and an absent variable is null on every record."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "SJ"
Bindings:
- name: "$unplanned_records"
  expression: "record_count(filter=(RSTGCD == \"UNPLAN\"))"
Check:
  expression: >-
    $unplanned_records >= 1 and not var_exists("SJUPDES")
Outcome:
  Message: "SJUPDES is not present although at least one record has RSTGCD equal to\
    \ 'UNPLAN'."
Source_Proposed:
  Class: "SPC"
  Domain: "SJ"
  Variable: "SJUPDES"
  Plain_Text_Explanation: "SJUPDES must be present in the dataset if any record has\
    \ RSTGCD equal to \"UNPLAN\"."
  Condition: "RSTGCD = \"UNPLAN\" for at least one record"
  Rule: "SJUPDES exists"
Source:
  Class: "SPC"
  Domain: "SJ"
  Variable: "SJUPDES"
  Plain_Text_Explanation: "SJUPDES should only be populated if RSTGCD is \"UNPLAN\"\
    ."
  Condition: "RSTGCD = \"UNPLAN\""
  Rule: "SJUPDES ^= null"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "SENDIG-DART"
    Version: "1.2"
    References:
    - Origin: "SEND Conformance Rules"
      Rule_Identifier:
        Id: "SEND352"
        Version: "1"
      Version: "5.0"
  - Name: "SENDIG-DART"
    Version: "1.1"
    References:
    - Origin: "SEND Conformance Rules"
      Rule_Identifier:
        Id: "SEND352"
        Version: "1"
      Version: "5.0"
