Core:
  Id: "CDISC-CG0413-A"
  Status: "Published"
  Version: "1"
Description: "Raise an error when the Domain Abbreviation (DOMAIN) value of an Associated\
  \ Persons dataset is not consistent with the name of the dataset (the dataset name\
  \ does not begin with the four-character DOMAIN value)."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "AP--"
    Exclude:
    - "APRELSUB"
Requirements:
  Variables:
    All:
    - "DOMAIN"
Check:
  expression: >-
    prefix(dataset_name, 4) != DOMAIN
Outcome:
  Message: "The dataset name does not begin with the DOMAIN value."
Source_Proposed:
  Class: "ALL"
  Domain: "AP--"
  Variable: "DOMAIN"
  Condition: ""
  Rule: "the Domain Abbreviation (DOMAIN) value of an Associated Persons dataset is\
    \ not consistent with the name of the dataset (the dataset name does not begin\
    \ with the four-character DOMAIN value)"
Source:
  Class: "ALL"
  Domain: "ALL"
  Variable: "DOMAIN"
  Rule: "Dataset name begins with DOMAIN value"
