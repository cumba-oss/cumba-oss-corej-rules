Core:
  Id: "CDISC-SEND-0012-A"
  Status: "Published"
  Version: "1"
Description: "Raise an error when a variable whose Core designation in the SENDIG\
  \ is Required is not populated in any record."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "ALL"
Bindings:
- name: "$required_variables"
  expression: "required_variables()"
Check:
  expression: >-
    upper(varname()) in $required_variables and empty(value())
Outcome:
  Message: "A Required variable is not populated."
  Output_Variables:
  - "variable_name"
  - "variable_value"
Source_Proposed:
  Sheet_Issue: "#20"
  Class: "ALL"
  Domain: "ALL"
  Variable: "GEN"
  Plain_Text_Explanation: "a variable whose Core designation in the SENDIG is Required\
    \ is not populated in any record"
  Condition: "Variable Core Status = Required"
  Rule: "Variable present in dataset and ^= null"
Source:
  Class: "ALL"
  Domain: "ALL"
  Variable: "GEN"
  Plain_Text_Explanation: "Required variables must always be included in the dataset\
    \ and cannot be null for any record."
  Condition: "Variable Core Status = Required"
  Rule: "Variable present in dataset and ^= null"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "SENDIG-GENETOX"
    Version: "1.0"
    References:
