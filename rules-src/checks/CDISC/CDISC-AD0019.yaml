Core:
  Id: "CDISC-AD0019"
  Status: "Published"
  Version: "1"
Description: "Raise an error when COMPLFL is populated with a value that is not Y\
  \ or N"
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "SUBJECT LEVEL ANALYSIS DATASET"
Requirements:
  Variables:
    All:
    - "COMPLFL"
Check:
  expression: >-
    not empty(COMPLFL) and COMPLFL not in ["Y", "N"]
Outcome:
  Message: "COMPLFL has a value other than Y or N"
Source:
  Class: "SUBJECT LEVEL ANALYSIS DATASET"
  Variable_or_Item: "COMPLFL"
  Natural_Language_Rule_Failure_Criteria: "COMPLFL is present and has a value that\
    \ is not Y or N"
  Rule_Failure_Criteria: "Value is not Y or N"
  Condition_Failure: "COMPLFL is present"
