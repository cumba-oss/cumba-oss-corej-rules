Core:
  Id: "CDISC-AD0851"
  Status: "Published"
  Version: "1"
Description: "Raise an error when ROUTEN is populated and ROUTE is not populated."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "BASIC DATA STRUCTURE"
Requirements:
  Variables:
    All:
    - "ROUTE"
    - "ROUTEN"
Check:
  expression: >-
    not empty(ROUTEN) and empty(ROUTE)
Outcome:
  Message: "ROUTEN is populated, but ROUTE is not populated."
  Message_Folded: "ROUTE not populated in any record of the dataset, and at least\
    \ one record meets the rest of the condition: ROUTEN is populated, but ROUTE is\
    \ not populated."
Source:
  Class: "BASIC DATA STRUCTURE"
  Subclass: "POPULATION PHARMACOKINETIC ANALYSIS"
  Variable_or_Item: "ROUTE"
  Natural_Language_Rule_Failure_Criteria: "ROUTEN is populated and ROUTE is not populated"
  Rule_Failure_Criteria: "ROUTE is not populated"
  Condition_Failure: "ROUTEN is populated"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.3"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR851"
        Version: "1"
      Version: "5.0"
