Core:
  Id: "CDISC-CG0562"
  Status: "Published"
  Version: "1"
Description: "Raise an error when REPNUM is in the dataset and there are multiple\
  \ records for a subject for a test within the timeframe identified by the timing\
  \ variables on the record, and --REPNUM is missing or not unique per subject per\
  \ test per timing variables."
Executability: "Fully Executable"
Scope:
  Classes:
    Include:
    - "FINDINGS"
Requirements:
  Variables:
    All:
    - "--REPNUM"
Bindings:
- name: "$TIMING_VARIABLES"
  expression: "get_dataset_filtered_variables(key_name=\"role\", key_value=\"Timing\"\
    )"
- name: "$record_count_per_subject_test_timing"
  expression: "record_count(group=[USUBJID, --TESTCD, $TIMING_VARIABLES], regex=\"\
    ^\\\\d{4}-\\\\d{2}-\\\\d{2}\")"
Check:
  expression: >-
    $record_count_per_subject_test_timing > 1 and (empty(--REPNUM) or not is_unique_set([--REPNUM,
    USUBJID, --TESTCD, $TIMING_VARIABLES], regex="^\\d{4}-\\d{2}-\\d{2}"))
Outcome:
  Message: "--REPNUM is missing or is not unique per subject per test per timing variables."
  Message_Folded: "--REPNUM not populated in any record of the dataset, and at least\
    \ one record meets the rest of the condition: --REPNUM is missing or is not unique\
    \ per subject per test per timing variables."
  Output_Variables:
  - "$TIMING_VARIABLES"
Source:
  Class: "FND"
  Domain: "ALL"
  Variable: "--REPNUM"
  Condition: "REPNUM is in the dataset, and the are multiple records for a subject\
    \ for a test within the timeframe identified by the timing variables on the record"
  Rule: "--REPNUM ^= null and unique per subject per test per the timing variables"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "SDTMIG"
    Version: "3.4"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0562"
        Version: "1"
      Version: "2.0"
  - Name: "SDTMIG"
    Version: "3.3"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0562"
        Version: "1"
      Version: "2.0"
