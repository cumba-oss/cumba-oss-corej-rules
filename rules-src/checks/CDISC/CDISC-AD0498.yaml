Core:
  Id: "CDISC-AD0498"
  Status: "Published"
  Version: "2"
Description: "Raise an error when a BDS or OCCDS record has populated APERIOD and\
  \ ASPER values but the ADSL dataset does not contain a variable PxxSw for that combination\
  \ (xx=APERIOD, w=ASPER)."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "BASIC DATA STRUCTURE"
    - "OCCURRENCE DATA STRUCTURE"
Requirements:
  Variables:
    All:
    - "STUDYID"
    - "USUBJID"
    - "APERIOD"
    - "ASPER"
    All_Or_None:
    - - "STUDYID"
      - "ADSL.STUDYID"
    - - "USUBJID"
      - "ADSL.USUBJID"
Match_Datasets:
- Name: "ADSL"
  Keys:
  - "STUDYID"
  - "USUBJID"
  Cardinality: "n:1"
Bindings:
- name: "$p_s"
  expression: "concat(\"ADSL.P\", printf(\"%02dS%d\", APERIOD, ASPER))"
Check:
  expression: >-
    not empty(APERIOD) and not empty(ASPER) and not empty($p_s) and not var_exists($p_s)
Outcome:
  Message: "The values of APERIOD and ASPER have no corresponding PxxSw variable present\
    \ in ADSL."
  Output_Variables:
  - "!$p_s"
Source:
  Class: "ALL"
  Variable_or_Item: "APERIOD; ASPER"
  Natural_Language_Rule_Failure_Criteria: "For every unique combination of a w value\
    \ of ASPER and xx value of APERIOD in BDS or OCCDS datasets, there is not a variable\
    \ PxxSw"
  Rule_Failure_Criteria: "For every unique combination of a w value of ASPER and xx\
    \ value of APERIOD in BDS or OCCDS datasets, there is not a variable PxxSw"
  Condition_Failure: "APERIOD and ASPER are populated"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.2"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR498"
        Version: "2"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.3"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR498"
        Version: "2"
      Version: "5.0"
