Core:
  Id: "CDISC-AD0458"
  Status: "Published"
  Version: "2"
Description: "Raise an error when TRTP is populated but TRTPN is missing"
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "BASIC DATA STRUCTURE"
    - "OCCURRENCE DATA STRUCTURE"
    - "MEDICAL DEVICE OCCURRENCE DATA STRUCTURE"
Requirements:
  Variables:
    All:
    - "TRTP"
    - "TRTPN"
Check:
  expression: >-
    not empty(TRTP) and empty(TRTPN)
Outcome:
  Message: "TRTP is populated, but TRTPN is missing"
Source:
  Class: "BASIC DATA STRUCTURE; MEDICAL DEVICE BASIC DATA STRUCTURE; OCCURRENCE DATA\
    \ STRUCTURE; MEDICAL DEVICE OCCURRENCE DATA STRUCTURE"
  Variable_or_Item: "TRTPN"
  Natural_Language_Rule_Failure_Criteria: "On a given record, TRTP is populated and\
    \ TRTPN is not populated"
  Rule_Failure_Criteria: "TRTPN is not populated"
  Condition_Failure: "TRTP is populated"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.2"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR458"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.3"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR458"
        Version: "2"
      Version: "5.0"
