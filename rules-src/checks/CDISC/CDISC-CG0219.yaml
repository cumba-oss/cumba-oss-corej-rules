Core:
  Id: "CDISC-CG0219"
  Status: "Published"
  Version: "1"
Description: "Raise an error when a dataset based on the Interventions, Events or\
  \ Findings general observation classes does not contain at least one Timing variable."
Executability: "Partially Executable - Possible Underreporting"
Scope:
  Classes:
    Include:
    - "INTERVENTIONS"
    - "EVENTS"
    - "FINDINGS"
  Domains:
    Exclude:
    - "IE"
    - "SC"
Bindings:
- name: "$dataset_variables"
  expression: "get_column_order_from_dataset()"
- name: "$dataset_variables_upper"
  expression: "upper($dataset_variables)"
- name: "$timing_variables"
  expression: "get_model_filtered_variables(key_name=\"role\", key_value=\"Timing\"\
    )"
- name: "$timing_variables_upper"
  expression: "upper($timing_variables)"
Check:
  expression: >-
    not shares_elements_with($dataset_variables_upper, $timing_variables_upper)
Outcome:
  Message: "No timing variables are present in the dataset."
  Output_Variables:
  - "$dataset_variables"
  - "$timing_variables"
  - "!$dataset_variables_upper"
  - "!$timing_variables_upper"
Source:
  Class: "INT, FND, EVT"
  Domain: "NOT(IE, SC)"
  Variable: "GEN"
  Rule: "At least one timing variable present in dataset"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "SDTMIG"
    Version: "3.4"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0219"
        Version: "1"
      Version: "2.0"
  - Name: "SDTMIG"
    Version: "3.3"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0219"
        Version: "1"
      Version: "2.0"
  - Name: "SDTMIG"
    Version: "3.2"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0219"
        Version: "1"
      Version: "2.0"
