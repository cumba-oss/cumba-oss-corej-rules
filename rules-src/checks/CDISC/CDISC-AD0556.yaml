Core:
  Id: "CDISC-AD0556"
  Status: "Published"
  Version: "2"
Description: "Raise an error when TRTPN is present and TRTP is not present."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "BASIC DATA STRUCTURE"
    - "OCCURRENCE DATA STRUCTURE"
    - "MEDICAL DEVICE OCCURRENCE DATA STRUCTURE"
Check:
  expression: >-
    var_exists("TRTPN") and not var_exists("TRTP")
Outcome:
  Message: "TRTPN is present, but TRTP is not present."
  Output_Variables:
  - "TRTPN"
Source:
  Class: "BASIC DATA STRUCTURE; MEDICAL DEVICE BASIC DATA STRUCTURE; OCCURRENCE DATA\
    \ STRUCTURE; MEDICAL DEVICE OCCURRENCE DATA STRUCTURE"
  Variable_or_Item: "TRTPN"
  Natural_Language_Rule_Failure_Criteria: "TRTPN is present and TRTP is not present"
  Rule_Failure_Criteria: "TRTP is not present"
  Condition_Failure: "TRTPN is present"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.1"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR556"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.2"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR556"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.3"
    References:
