Core:
  Id: "CDISC-AD0379"
  Status: "Published"
  Version: "2"
Description: "Raise an error when BTOXGRN is populated and BTOXGR is not populated."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "BASIC DATA STRUCTURE"
    - "MEDICAL DEVICE BASIC DATA STRUCTURE"
Requirements:
  Variables:
    All:
    - "BTOXGRN"
    - "BTOXGR"
Check:
  expression: >-
    not empty(BTOXGRN) and empty(BTOXGR)
Outcome:
  Message: "BTOXGRN is populated but BTOXGR is not populated."
Source:
  Class: "BASIC DATA STRUCTURE; MEDICAL DEVICE BASIC DATA STRUCTURE"
  Variable_or_Item: "BTOXGR"
  Natural_Language_Rule_Failure_Criteria: "On a given record, BTOXGRN is populated\
    \ and BTOXGR is not populated"
  Rule_Failure_Criteria: "BTOXGR is not populated"
  Condition_Failure: "BTOXGRN is populated"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.2"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR379"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.3"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR379"
        Version: "2"
      Version: "5.0"
