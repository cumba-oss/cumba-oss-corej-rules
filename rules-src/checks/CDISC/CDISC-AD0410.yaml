Core:
  Id: "CDISC-AD0410"
  Status: "Published"
  Version: "2"
Description: "Raise an error when there is more than one value of ABLFL for a given\
  \ value of ABLFN, considering only rows on which both variables are populated."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "BASIC DATA STRUCTURE"
Requirements:
  Variables:
    All:
    - "ABLFL"
    - "ABLFN"
Check:
  expression: >-
    not empty(ABLFL) and not empty(ABLFN) and has_multiple_values_for(ABLFL, ABLFN)
Outcome:
  Message: "There is more than one value of ABLFL for a given value of ABLFN, though\
    \ both variables are populated."
Source:
  Class: "BASIC DATA STRUCTURE; MEDICAL DEVICE BASIC DATA STRUCTURE"
  Variable_or_Item: "ABLFL"
  Natural_Language_Rule_Failure_Criteria: "There is more than one value of ABLFL for\
    \ a given value of ABLFN, considering only those rows on which both variables\
    \ are populated"
  Rule_Failure_Criteria: "There is more than one value of ABLFL for a given value\
    \ of ABLFN"
  Condition_Failure: "On rows where both ABLFL and  ABLFN are both populated."
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.2"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR410"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.3"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR410"
        Version: "2"
      Version: "5.0"
