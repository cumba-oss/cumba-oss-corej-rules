Core:
  Id: "CDISC-AD0488"
  Status: "Published"
  Version: "2"
Description: "Raise an error when ONTRTFL is populated and ONTRTFN is missing on the\
  \ same record."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "BASIC DATA STRUCTURE"
    - "MEDICAL DEVICE BASIC DATA STRUCTURE"
    - "OCCURRENCE DATA STRUCTURE"
    - "MEDICAL DEVICE OCCURRENCE DATA STRUCTURE"
Check:
  expression: >-
    not empty(ONTRTFL) and empty(ONTRTFN)
Outcome:
  Message: "ONTRTFL is populated but ONTRTFN is missing."
  Message_Folded: "ONTRTFN not populated in any record of the dataset, and at least\
    \ one record meets the rest of the condition: ONTRTFL is populated but ONTRTFN\
    \ is missing."
Source:
  Class: "BASIC DATA STRUCTURE; MEDICAL DEVICE BASIC DATA STRUCTURE; OCCURRENCE DATA\
    \ STRUCTURE; MEDICAL DEVICE OCCURRENCE DATA STRUCTURE"
  Variable_or_Item: "ONTRTFN"
  Natural_Language_Rule_Failure_Criteria: "On a given record, ONTRTFL is populated\
    \ and ONTRTFN is not populated"
  Rule_Failure_Criteria: "ONTRTFN is not populated"
  Condition_Failure: "ONTRTFL is populated"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.2"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR488"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.3"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR488"
        Version: "2"
      Version: "5.0"
