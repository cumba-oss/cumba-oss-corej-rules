Core:
  Id: "CDISC-SEND-0200"
  Status: "Published"
  Version: "1"
Description: "Raise an error when more than one Tumor Findings (TF) record exists\
  \ for the same combination of subject (USUBJID), test (TFTESTCD), specimen (TFSPEC),\
  \ and tumor identity (TFSPID, TFANTREG, TFLAT, TFDIR); the TF domain expects one\
  \ record per tumor per specimen per subject."
Executability: "Partially Executable - Possible Overreporting"
Scope:
  Domains:
    Include:
    - "TF"
Check:
  expression: >-
    not is_unique_set([USUBJID, TFTESTCD, TFSPEC, TFSPID, TFANTREG, TFLAT, TFDIR])
Outcome:
  Message: "More than one TF record exists for the same tumor and specimen within\
    \ a subject."
Source:
  Class: "FND"
  Domain: "TF"
  Variable: "ALL"
  Plain_Text_Explanation: "One record per tumor per specimen per subject"
  Rule: "One record per tumor per specimen per subject"
