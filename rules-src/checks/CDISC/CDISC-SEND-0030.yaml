Core:
  Id: "CDISC-SEND-0030"
  Status: "Published"
  Version: "1"
Description: "Raise an error when a variable name contains a lowercase letter; variable\
  \ names must be represented in uppercase."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "ALL"
Check:
  expression: >-
    varname() =~ /.*[a-z]/
Outcome:
  Message: "The variable name is not in uppercase (it contains a lowercase letter)."
  Output_Variables:
  - "variable_name"
Source:
  Class: "ALL"
  Domain: "ALL"
  Variable: "GEN"
  Plain_Text_Explanation: "Variable name is in uppercase"
  Rule: "Variable name is in uppercase"
