Core:
  Id: "CDISC-SEND-0130.1"
  Status: "Published"
  Version: "1"
Description: "Raise an error when SESEQ is not in chronological order (based on SESTDTC)\
  \ within USUBJID."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "SE"
Check:
  expression: >-
    not is_sorted_by(SESEQ, by=[asc(SESTDTC)], within=USUBJID)
Outcome:
  Message: "SESEQ is not in chronological order (based on SESTDTC) within USUBJID."
  Output_Variables:
  - "SESTDTC"
Source:
  Class: "SPC"
  Domain: "SE"
  Variable: "SESEQ"
  Plain_Text_Explanation: "SESEQ values must be assigned in chronological order within\
    \ a subject."
  Rule: "SESEQ values are in chronological order within a subject"
