Core:
  Id: "CDISC-SEND-0163"
  Status: "Published"
  Version: "1"
Description: "Raise an error when more than one Death Diagnosis (DD) record exists\
  \ for the same combination of Test Short Name (DDTESTCD), Unique Subject Identifier\
  \ (USUBJID), and diagnosis result (DDORRES); the domain should hold one record per\
  \ diagnosis per subject."
Executability: "Partially Executable - Possible Overreporting"
Scope:
  Domains:
    Include:
    - "DD"
Check:
  expression: >-
    not is_unique_set([DDTESTCD, USUBJID, DDORRES])
Outcome:
  Message: "More than one DD record exists for the same diagnosis (DDTESTCD/DDORRES)\
    \ and subject (USUBJID)."
Source:
  Class: "FND"
  Domain: "DD"
  Variable: "ALL"
  Plain_Text_Explanation: "One record per diagnosis per subject (for unscheduled deaths\
    \ only)"
  Rule: "One record per diagnosis per subject (for unscheduled deaths only)"
