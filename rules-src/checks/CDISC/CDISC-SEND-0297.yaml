Core:
  Id: "CDISC-SEND-0297"
  Status: "Published"
  Version: "1"
Description: "Raise an error when a variable present in the DM, CO, or SE dataset\
  \ is not defined for that domain in the SENDIG."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "DM"
    - "CO"
    - "SE"
Operations:
- id: "$library_variables"
  expression: "get_column_order_from_library()"
Check:
  expression: >-
    varname() not in $library_variables
Outcome:
  Message: "The variable is not defined for this domain in the SENDIG and may not\
    \ be added."
  Output_Variables:
  - "variable_name"
  - "$library_variables"
Source:
  Class: "SPC"
  Domain: "DM, CO, SE"
  Variable: "ALL"
  Plain_Text_Explanation: "Additional variables not specified in the SENDIG description\
    \ of the domain (including both the domain table and assumptions) may not be added\
    \ to DM, CO, or SE."
  Rule: "Additional variables not specified in the SENDIG description of the domain\
    \ (including both the domain table and assumptions) may not be added."
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "SENDIG-DART"
    Version: "1.1"
    References:
    - Origin: "SEND Conformance Rules"
      Rule_Identifier:
        Id: "SEND297"
        Version: "1"
      Version: "5.0"
  - Name: "SENDIG"
    Version: "3.1"
    References:
    - Origin: "SEND Conformance Rules"
      Rule_Identifier:
        Id: "SEND297"
        Version: "1"
      Version: "5.0"
