Core:
  Id: "CDISC-AD0863"
  Status: "Published"
  Version: "1"
Description: "Raise an error when, considering only rows on which both COHORT and\
  \ COHORTC are populated, more than one value of COHORT is present within the dataset\
  \ for a given value of COHORTC."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "BASIC DATA STRUCTURE"
Check:
  expression: >-
    not empty(COHORT) and not empty(COHORTC) and has_multiple_values_for(COHORT, COHORTC)
Outcome:
  Message: "More than one value of COHORT is present for this value of COHORTC within\
    \ the dataset."
Source:
  Class: "BASIC DATA STRUCTURE"
  Subclass: "POPULATION PHARMACOKINETIC ANALYSIS"
  Variable_or_Item: "COHORT"
  Natural_Language_Rule_Failure_Criteria: "Within a dataset, there is more than one\
    \ value of COHORT for a given value of COHORTC, considering only those rows on\
    \ which both variables are populated"
  Rule_Failure_Criteria: "Within a dataset, there is more than one value of COHORT\
    \ for a given value of COHORTC"
  Condition_Failure: "On rows where both COHORT and COHORTC are both populated"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.3"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR863"
        Version: "1"
      Version: "5.0"
