Core:
  Id: "CDISC-AD0093"
  Status: "Published"
  Version: "1"
Description: "Raise an error when TRTP and TRTPN are both populated and there is more\
  \ than one value of TRTP for a given value of TRTPN"
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "BASIC DATA STRUCTURE"
Check:
  expression: >-
    not empty(TRTP) and not empty(TRTPN) and has_multiple_values_for(TRTP, TRTPN)
Outcome:
  Message: "More than one value of TRTP was found for the same value of TRTPN"
Source:
  Class: "BASIC DATA STRUCTURE"
  Variable_or_Item: "TRTP"
  Natural_Language_Rule_Failure_Criteria: "There is more than one value of TRTP for\
    \ a given value of TRTPN"
  Rule_Failure_Criteria: "There is more than one value of TRTP for a given value of\
    \ TRTPN"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.0"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR93"
        Version: "1"
      Version: "5.0"
