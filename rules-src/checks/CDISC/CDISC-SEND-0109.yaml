Core:
  Id: "CDISC-SEND-0109"
  Status: "Published"
  Version: "1"
Description: "Raise an error when a Unique Subject Identifier (USUBJID) value present\
  \ in a SEND dataset is not present in the Demographics (DM) dataset."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "ALL"
Grouping:
  Variables:
  - "USUBJID"
Bindings:
- name: "$dm_usubjid"
  expression: "distinct(USUBJID, domain=\"DM\")"
Check:
  expression: >-
    not empty(USUBJID) and USUBJID not in $dm_usubjid
Outcome:
  Message: "USUBJID is populated but the value is not present in the DM dataset."
  Output_Variables:
  - "$dm_usubjid"
Source:
  Class: "ALL"
  Domain: "DM"
  Variable: "USUBJID"
  Plain_Text_Explanation: "Each USUBJID that exists in the SEND dataset must exist\
    \ in DM"
  Condition: "USUBJID exists in any domain"
  Rule: "USUBJID exists in DM"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "SENDIG-GENETOX"
    Version: "1.0"
    References:
    - Origin: "SEND Conformance Rules"
      Rule_Identifier:
        Id: "SEND109"
        Version: "1"
      Version: "5.0"
