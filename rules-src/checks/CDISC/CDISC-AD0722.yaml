Core:
  Id: "CDISC-AD0722"
  Status: "Published"
  Version: "1"
Description: "Raise an error when there is more than one value of TRTP for a given\
  \ value of TRTPN, considering only records where both variables are populated"
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "BASIC DATA STRUCTURE"
Check:
  expression: >-
    not empty(TRTP) and not empty(TRTPN) and has_multiple_values_for(TRTP, TRTPN)
Outcome:
  Message: "More than one value of TRTP is present for the same populated value of\
    \ TRTPN"
Source:
  Class: "BASIC DATA STRUCTURE; MEDICAL DEVICE BASIC DATA STRUCTURE"
  Variable_or_Item: "TRTP"
  Natural_Language_Rule_Failure_Criteria: "There is more than one value of TRTP for\
    \ a given value of TRTPN, considering only those rows on which both variables\
    \ are populated"
  Rule_Failure_Criteria: "There is more than one value of TRTP for a given value of\
    \ TRTPN"
  Condition_Failure: "On rows where TRTP and TRTPN are both populated"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.1"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR722"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
