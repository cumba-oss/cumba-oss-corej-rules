Core:
  Id: "CDISC-CG0376"
  Status: "Published"
  Version: "1"
Description: "Raise an error when Offset from the Anchor (TDSTOFF) is populated with\
  \ a value that is not 0 and is not a positive value in ISO 8601 duration format."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "TD"
Requirements:
  Variables:
    All:
    - "TDSTOFF"
Check:
  expression: >-
    not empty(TDSTOFF) and TDSTOFF != "0" and invalid_duration(TDSTOFF, negative=false)
Outcome:
  Message: "TDSTOFF is populated with a value that is not 0 and not a positive value\
    \ in ISO 8601 duration format."
  Output_Variables:
  - "TDSTOFF"
Source:
  Class: "TDM"
  Domain: "TD"
  Variable: "TDSTOFF"
  Rule: "TDSTOFF = 0 or positive value in ISO 8601 Duration format"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "SDTMIG"
    Version: "3.4"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0376"
        Version: "1"
      Version: "2.0"
  - Name: "SDTMIG"
    Version: "3.3"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0376"
        Version: "1"
      Version: "2.0"
  - Name: "SDTMIG"
    Version: "3.2"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0376"
        Version: "1"
      Version: "2.0"
