Core:
  Id: "CDISC-AD0593"
  Status: "Published"
  Version: "1"
Description: "Raise an error when, on a BDS or OCCDS record, APERSTM does not equal\
  \ the ADSL variable APxxSTM for the same USUBJID (where xx equals the record's APERIOD\
  \ value)."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "BASIC DATA STRUCTURE"
    - "OCCURRENCE DATA STRUCTURE"
Requirements:
  Variables:
    All:
    - "USUBJID"
    - "APERSTM"
    - "APERIOD"
    All_Or_None:
    - - "USUBJID"
      - "ADSL.USUBJID"
Match_Datasets:
- Name: "ADSL"
  Keys:
  - "USUBJID"
Bindings:
- name: "$ap_stm"
  expression: "colref(concat(\"ADSL.AP\", printf(\"%02d\", APERIOD), \"STM\"))"
Check:
  expression: >-
    not empty(APERSTM) and not empty($ap_stm) and APERSTM != $ap_stm
Outcome:
  Message: "On a given record, the value of APERSTM is not equal to the value of variable\
    \ APxxSTM where xx equals the value of APERIOD"
  Output_Variables:
  - "APERIOD"
  - "APERSTM"
  - "ADSL.APxxSTM"
  - "!$ap_stm"
Source:
  Class: "ALL"
  Variable_or_Item: "APERSTM"
  Natural_Language_Rule_Failure_Criteria: "On a given record, the value of APERSTM\
    \ is not equal to the value of variable APxxSTM where xx equals the value of APERIOD"
  Rule_Failure_Criteria: "On a given record, the value of APERSTM is not equal to\
    \ the value of variable APxxSTM where xx equals the value of APERIOD"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.2"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR593"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.3"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR593"
        Version: "1"
      Version: "5.0"
