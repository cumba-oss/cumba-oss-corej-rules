Core:
  Id: "CDISC-AD0437"
  Status: "Published"
  Version: "2"
Description: "Raise an error when AVALCATy is populated but AVALCAyN is missing"
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "BASIC DATA STRUCTURE"
Requirements:
  Variables:
    All:
    - "AVALCATy"
    - "AVALCAyN"
Check:
  expression: >-
    not empty(AVALCATy) and empty(AVALCAyN)
Outcome:
  Message: "AVALCATy is populated, but AVALCAyN is missing"
  Message_Folded: "AVALCAyN not populated in any record of the dataset, and at least\
    \ one record meets the rest of the condition: AVALCATy is populated, but AVALCAyN\
    \ is missing"
  Output_Variables:
  - "AVALCATy"
  - "AVALCAyN"
wildcards:
  "y":
    min: 1
    max: 99
Source:
  Class: "BASIC DATA STRUCTURE; MEDICAL DEVICE BASIC DATA STRUCTURE"
  Variable_or_Item: "AVALCAyN where y is an integer [1-9, not zero-padded]"
  Natural_Language_Rule_Failure_Criteria: "On a given record, AVALCATy is populated\
    \ and AVALCAyN is not populated"
  Rule_Failure_Criteria: "AVALCAyN is not populated"
  Condition_Failure: "AVALCATy is populated"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.2"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR437"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.3"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR437"
        Version: "2"
      Version: "5.0"
