Core:
  Id: "CDISC-SEND-0223"
  Status: "Published"
  Version: "1"
Description: "Raise an error when a populated Planned Arm Code (ARMCD) in DM does\
  \ not exist among the Planned Arm Code (ARMCD) values defined in the Trial Arms\
  \ (TA) dataset."
Executability: "Partially Executable - Possible Overreporting"
Scope:
  Domains:
    Include:
    - "DM"
Bindings:
- name: "$ta_armcd"
  expression: "distinct(ARMCD, domain=\"TA\")"
Check:
  expression: >-
    not empty(ARMCD) and ARMCD not in $ta_armcd
Outcome:
  Message: "DM ARMCD does not exist among the ARMCD values in the TA dataset."
  Output_Variables:
  - "$ta_armcd"
Source:
  Class: "SPC"
  Domain: "DM"
  Variable: "ARMCD"
  Plain_Text_Explanation: "The ARMCD value in DM for a given subject must exist in\
    \ TA."
  Rule: "DM.ARMCD exists in TA.ARMCD"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "SENDIG-GENETOX"
    Version: "1.0"
    References:
    - Origin: "SEND Conformance Rules"
      Rule_Identifier:
        Id: "SEND223"
        Version: "1"
      Version: "5.0"
  - Name: "SENDIG-DART"
    Version: "1.2"
    References:
