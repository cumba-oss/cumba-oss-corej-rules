Core:
  Id: "CDISC-SEND-0070"
  Status: "Published"
  Version: "1"
Description: "Raise an error when a date/time (--DTC) expresses an interval of uncertainty\
  \ as its beginning and end concatenated with a solidus (/), and the two sides are\
  \ represented with different levels of completeness (precision)."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "ALL"
Bindings:
- name: "$interval_mismatch_dtc"
  expression: "interval_uncertainty_precision_mismatch(--DTC, delimiter=\"/\")"
Check:
  expression: >-
    $interval_mismatch_dtc == true
Outcome:
  Message: "The beginning and end of the interval of uncertainty in --DTC have different\
    \ levels of completeness."
  Output_Variables:
  - "--DTC"
Source:
  Class: "ALL"
  Domain: "ALL"
  Variable: "GEN"
  Plain_Text_Explanation: "The completeness of the representation of the date/time\
    \ must be the same on both sides of the solidus when a concatenation of the beginning\
    \ and end of an interval of uncertainty are used to present an interval."
  Condition: "Date/time includes an interval of uncertainty"
  Rule: "Interval of uncertainty is presented by concatenating the beginning and end\
    \ of the interval with a solidus; the level of completeness for the beginning\
    \ and the end of the interval of uncertainty are the same"
Standards:
- Organization: "CDISC"
