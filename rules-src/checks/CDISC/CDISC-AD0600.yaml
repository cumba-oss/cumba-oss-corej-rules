Core:
  Id: "CDISC-AD0600"
  Status: "Published"
  Version: "1"
Description: "Raise an error when, on a BDS or OCCDS record, ASPRSDTM does not equal\
  \ the ADSL variable PxxSwSDM for the same USUBJID (where xx equals the record's\
  \ APERIOD value and w equals the record's ASPER value)."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "BASIC DATA STRUCTURE"
    - "OCCURRENCE DATA STRUCTURE"
Requirements:
  Variables:
    All:
    - "USUBJID"
    - "ASPRSDTM"
    - "APERIOD"
    - "ASPER"
    All_Or_None:
    - - "USUBJID"
      - "ADSL.USUBJID"
Match_Datasets:
- Name: "ADSL"
  Keys:
  - "USUBJID"
Bindings:
- name: "$p_s_sdm"
  expression: "colref(concat(\"ADSL.P\", printf(\"%02dS%d\", APERIOD, ASPER), \"SDM\"\
    ))"
Check:
  expression: >-
    not empty(ASPRSDTM) and not empty($p_s_sdm) and ASPRSDTM != $p_s_sdm
Outcome:
  Message: "On a given record, the value of ASPRSDTM is not equal to the value of\
    \ variable PxxSwSDM where xx equals the value of APERIOD and w equals the value\
    \ of ASPER"
  Output_Variables:
  - "APERIOD"
  - "ASPER"
  - "ADSL.PxxSwSDM"
  - "!$p_s_sdm"
Source:
  Class: "ALL"
  Variable_or_Item: "ASPRSDTM"
  Natural_Language_Rule_Failure_Criteria: "On a given record, the value of ASPRSDTM\
    \ is not equal to the value of variable PxxSwSDM where xx equals the value of\
    \ APERIOD and w equals the value of ASPER"
  Rule_Failure_Criteria: "On a given record, the value of ASPRSDTM is not equal to\
    \ the value of variable PxxSwSDM where xx equals the value of APERIOD and w equals\
    \ the value of ASPER"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.2"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR600"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.3"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR600"
        Version: "1"
      Version: "5.0"
