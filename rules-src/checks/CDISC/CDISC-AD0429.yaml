Core:
  Id: "CDISC-AD0429"
  Status: "Published"
  Version: "2"
Description: "Raise an error when APERIOD is populated but APERIODC is empty"
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "BASIC DATA STRUCTURE"
    - "OCCURRENCE DATA STRUCTURE"
    - "MEDICAL DEVICE OCCURRENCE DATA STRUCTURE"
Check:
  expression: >-
    not empty(APERIOD) and empty(APERIODC)
Outcome:
  Message: "APERIOD is populated, but APERIODC is empty"
  Message_Folded: "APERIODC not populated in any record of the dataset, and at least\
    \ one record meets the rest of the condition: APERIOD is populated, but APERIODC\
    \ is empty"
Source:
  Class: "BASIC DATA STRUCTURE; MEDICAL DEVICE BASIC DATA STRUCTURE; OCCURRENCE DATA\
    \ STRUCTURE; MEDICAL DEVICE OCCURRENCE DATA STRUCTURE"
  Variable_or_Item: "APERIODC"
  Natural_Language_Rule_Failure_Criteria: "On a given record, APERIOD is populated\
    \ and APERIODC is not populated"
  Rule_Failure_Criteria: "APERIODC is not populated"
  Condition_Failure: "APERIOD is populated"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.2"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR429"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.3"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR429"
        Version: "2"
      Version: "5.0"
