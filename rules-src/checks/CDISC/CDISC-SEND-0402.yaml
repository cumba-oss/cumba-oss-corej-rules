Core:
  Id: "CDISC-SEND-0402"
  Status: "Published"
  Version: "1"
Description: "Raise an error when, within a reproductive phase (RPHASE), the observation\
  \ start date (--STDTC) is a complete date and the reproductive-phase start day (--RPSTDY)\
  \ is populated but does not equal the date portion of --STDTC minus the date portion\
  \ of the earliest phase start date (earliest SJSTDTC within the subject's RPHASE)."
Executability: "Partially Executable"
ExecutabilityHint:
  Category: "partially executable"
  Detail: "The RPRFDY offset of the sheet's algorithm is NOT applied: RPRFDY is a\
    \ TP (Trial Paths) variable, reached only through DM.RPATHCD, and the engine cannot\
    \ follow that two-hop join yet (owner ruling EC-47 = (C), 2026-09-29; the join\
    \ is PLAN-rprfdy-offset-tp-join). The reproductive-phase day is derived as date(--STDTC)\
    \ minus the earliest SJSTDTC within the subject's RPHASE, which is exact for a\
    \ path whose RPRFDY is 0 and off by one day for a path whose RPRFDY is 1 — such\
    \ a path is then over- and under-reported by one day in both directions."
Scope:
  Classes:
    Include:
    - "SPECIAL PURPOSE"
    - "FINDINGS"
    - "EVENTS"
    - "INTERVENTIONS"
Requirements:
  Variables:
    All:
    - "--STDTC"
    - "--RPSTDY"
    - "SJ.SJSTDTC"
    - "USUBJID"
    All_Or_None:
    - - "USUBJID"
      - "SJ.USUBJID"
    - - "RPHASE"
      - "SJ.RPHASE"
Match_Datasets:
- Keys:
  - "USUBJID"
  - "RPHASE"
  Name: "SJ"
Bindings:
- name: "$rpref_day"
  expression: "date_diff_days(--STDTC, min_date(SJSTDTC, domain=\"SJ\", group=[USUBJID,\
    \ RPHASE]))"
Check:
  expression: >-
    is_complete_date(--STDTC) and not empty(--RPSTDY) and --RPSTDY != $rpref_day
Outcome:
  Message: "--RPSTDY does not equal the reproductive-phase start day derived from\
    \ --STDTC, the earliest SJSTDTC within the RPHASE."
  Output_Variables:
  - "$rpref_day"
  - "--STDTC"
  - "--RPSTDY"
Source:
  Class: "SPC, FND, EVT, INT"
  Domain: "All"
  Variable: "--RPSTDY"
  Plain_Text_Explanation: "Within a repro phase, if --STDTC is populated and the earliest\
    \ SJSTDTC within the repro phase in SJ is populated then --RPSTDY should be populated\
    \ using the actual repro phase day of observation start algorithm"
  Condition: "Date portion exists for --STDTC and SJSTDTC within the RPHASE and --RPSTDY\
    \ is present"
  Rule: "--RPSTDY=(date portion of --STDTC) - (date portion of earliest SJSTDTC) +\
    \ RPRFDY"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "SENDIG-DART"
    Version: "1.2"
    References:
    - Origin: "SEND Conformance Rules"
      Rule_Identifier:
        Id: "SEND402"
        Version: "1"
      Version: "5.0"
  - Name: "SENDIG-DART"
    Version: "1.1"
    References:
    - Origin: "SEND Conformance Rules"
      Rule_Identifier:
        Id: "SEND402"
        Version: "1"
      Version: "5.0"
