Core:
  Id: "CDISC-SEND-0148"
  Status: "Published"
  Version: "1"
Description: "Raise an error when an Exclusion Flag (--EXCLFL) is populated with a\
  \ value other than \"Y\"; --EXCLFL must be either \"Y\" or empty."
Executability: "Fully Executable"
Scope:
  Classes:
    Include:
    - "FINDINGS"
Requirements:
  Variables:
    All:
    - "--EXCLFL"
Check:
  expression: >-
    not empty(--EXCLFL) and --EXCLFL != "Y"
Outcome:
  Message: "--EXCLFL is populated with a value other than \"Y\"."
Source:
  Class: "FND"
  Domain: "ALL"
  Variable: "--EXCLFL"
  Plain_Text_Explanation: "--EXCLFL value must either be \"Y\" or null"
  Condition: "--EXCLFL ^= null"
  Rule: "--EXCLFL = \"Y\""
