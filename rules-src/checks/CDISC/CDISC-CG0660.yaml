Core:
  Id: "CDISC-CG0660"
  Status: "Published"
  Version: "1"
Description: "Raise an error when the --EVALID variable (QSEVALID or FTEVALID) is\
  \ present in a QS or FT dataset. --EVALID must not be used to model QRS (Questionnaires,\
  \ Ratings, and Scales) data. The RS domain is covered by this rule's -A sibling,\
  \ which tests the Clinical Classification use case at record level."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "QS"
    - "FT"
Check:
  expression: >-
    var_exists("--EVALID")
Outcome:
  Message: "--EVALID is present. --EVALID must not be used to model QRS data."
  Output_Variables:
  - "--EVALID"
Source:
  Class: "FND"
  Domain: "QS, FT, RS"
  Variable: "--EVALID"
  Condition: "Domain in ('QS', 'FT') or (Domain = 'RS' and it's the Clinical Classification\
    \ Use Case)"
  Rule: "--EVALID not present in dataset"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "SDTMIG"
    Version: "3.4"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0660"
        Version: "1"
      Version: "2.0"
