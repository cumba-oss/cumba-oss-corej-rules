Core:
  Id: "CDISC-AD0167"
  Status: "Published"
  Version: "2"
Description: "Raise an error when BNRIND is present and ABLFL is not present"
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "BASIC DATA STRUCTURE"
    - "MEDICAL DEVICE BASIC DATA STRUCTURE"
Check:
  expression: >-
    var_exists("BNRIND") and not var_exists("ABLFL")
Outcome:
  Message: "BNRIND is present, but ABLFL is not present"
  Output_Variables:
  - "BNRIND"
Source_Proposed:
