Core:
  Id: "CDISC-CG0120"
  Status: "Published"
  Version: "1"
Description: "Raise an error when the Description of Planned Arm (ARM) is not 'Screen\
  \ Failure' or 'Not Assigned' and does not match an ARM value in the Trial Arms (TA)\
  \ dataset."
Executability: "Not Executable"
ExecutabilityHint:
  Category: "not executable"
  Detail: "Parked as an R-5.26 duplicate of CDISC-CG0121 (owner rulings D-8 + D-18,\
    \ 2026-09-14): the two are identical in every field but the id and ship into exactly\
    \ the same packages, so one run reported the same finding twice. Both package\
    \ sets being equal, D-18's tie-break applies and the lower-numbered row is parked\
    \ — the lower id was authored first, so the higher is the more recent statement.\
    \ The row stays documented here while CDISC-CG0121 carries the executable check."
Scope:
  Domains:
    Include:
    - "DM"
Requirements:
  Variables:
    All:
    - "ARM"
Bindings:
- name: "$ta_arm"
  expression: "distinct(ARM, domain=\"TA\")"
Check:
  expression: >-
    ARM not in ["Screen Failure", "Not Assigned"] and ARM not in $ta_arm
Outcome:
  Message: "ARM (other than 'Screen Failure' or 'Not Assigned') does not match an\
    \ ARM value in the Trial Arms (TA) dataset."
  Output_Variables:
  - "ARM"
  - "$ta_arm"
Source:
  Class: "SPC"
  Domain: "DM"
  Variable: "ARM"
  Condition: "ARM not in TA.ARM"
  Rule: "ARM in ('Screen Failure', 'Not Assigned')"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "SDTMIG"
    Version: "3.2"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0120"
        Version: "1"
      Version: "2.0"
