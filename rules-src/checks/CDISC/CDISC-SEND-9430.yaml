Core:
  Id: "CDISC-SEND-9430"
  Status: "Published"
  Version: "1"
Description: "Raise an error when --TESTCD is not populated"
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "BG"
    - "BW"
    - "CL"
    - "CV"
    - "DD"
    - "EG"
    - "FM"
    - "FW"
    - "FX"
    - "GV"
    - "IC"
    - "LB"
    - "MA"
    - "MI"
    - "OM"
    - "PC"
    - "PM"
    - "PP"
    - "PY"
    - "RE"
    - "SC"
    - "TF"
    - "VS"
Requirements:
  Variables:
    All:
    - "--TESTCD"
Check:
  expression: >-
    empty(--TESTCD)
Outcome:
  Message: "--TESTCD is empty"
Source_Proposed:
  Class: "ALL"
  Domain: "BG, BW, CL, CV, DD, EG, FM, FW, FX, GV, IC, LB, MA, MI, OM, PC, PM, PP,\
    \ PY, RE, SC, TF, VS"
  Variable: "--TESTCD"
  Plain_Text_Explanation: "--TESTCD must be populated for every record."
  Condition: ""
  Rule: "--TESTCD ^= null"
Source:
  Class: "ALL"
  Domain: "ALL"
  Variable: "GEN"
  Plain_Text_Explanation: "Required variables must always be included in the dataset\
    \ and cannot be null for any record."
  Condition: "Variable Core Status = Required"
  Rule: "Variable present in dataset and ^= null"
