Core:
  Id: "CDISC-CG0508"
  Status: "Published"
  Version: "1"
Description: "Raise an error when --IMPLBL, a variable defined for use in non-clinical\
  \ (SEND) studies, is present in a dataset submitted as SDTM-based data for a human\
  \ clinical trial."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "ALL"
Check:
  expression: >-
    var_exists("--IMPLBL")
Outcome:
  Message: "--IMPLBL is present; this variable is defined for use in non-clinical\
    \ (SEND) studies and must never be used in SDTM-based data for human clinical\
    \ trials."
  Output_Variables:
  - "--IMPLBL"
Source:
  Class: "ALL"
  Domain: "ALL"
  Variable: "--IMPLBL"
  Rule: "--IMPLBL not present in dataset"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "SDTMIG"
    Version: "3.4"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0508"
        Version: "1"
      Version: "2.0"
  - Name: "SDTMIG"
    Version: "3.3"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0508"
        Version: "1"
      Version: "2.0"
