Core:
  Id: "CDISC-AD0720"
  Status: "Published"
  Version: "1"
Description: "Raise an error when TRTP is populated but its value does not equal any\
  \ value of the character planned treatment variables in ADSL defined in the IG."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "ALL"
Requirements:
  Variables:
    All:
    - "STUDYID"
    - "USUBJID"
    - "TRTP"
    All_Or_None:
    - - "STUDYID"
      - "ADSL.STUDYID"
    - - "USUBJID"
      - "ADSL.USUBJID"
Match_Datasets:
- Name: "ADSL"
  Keys:
  - "STUDYID"
  - "USUBJID"
  Cardinality: "n:1"
Check:
  expression: >-
    not empty(TRTP) and (not empty(APERIOD) and TRTP != colref(concat("ADSL.TRT", printf("%02d",
    APERIOD), "P")) or empty(APERIOD) and count(find_vars("ADSL.TRTxxP")) == 1 and TRTP not in
    colref(find_vars("ADSL.TRTxxP"))) and TRTP not in ADSL.TRTSEQP and TRTP not in
    colref(find_vars("ADSL.TRTPGy")) and TRTP not in colref(find_vars("ADSL.TRxxPGy"))
Outcome:
  Message: "TRTP is populated, but does not match the ADSL planned treatment variable\
    \ of the record's period (TRTxxP for APERIOD, or the only TRTxxP), TRTSEQP, nor\
    \ any ADSL planned treatment group variable"
  Keep_Row_Findings:
  - "APERIOD"
Source:
  Class: "ALL"
  Variable_or_Item: "TRTP"
  Natural_Language_Rule_Failure_Criteria: "A non-missing value of TRTP is not equal\
    \ to at least one value of the character planned treatment variables in ADSL defined\
    \ in the IG"
  Rule_Failure_Criteria: "Variable is not equal to at least one value of the IG-defined\
    \ character planned treatment variables in ADSL"
  Condition_Failure: "TRTP is populated"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.1"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR720"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.2"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR720"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.3"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR720"
        Version: "1"
      Version: "5.0"
