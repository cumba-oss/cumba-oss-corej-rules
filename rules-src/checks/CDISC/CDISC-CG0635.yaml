Core:
  Id: "CDISC-CG0635"
  Status: "Published"
  Version: "1"
Description: "Raise an error when --NOMDY is present in a dataset, because this variable\
  \ is not permitted in human clinical trials."
Executability: "Not Executable"
ExecutabilityHint:
  Category: "not executable"
  Detail: "Parked as an R-5.26 duplicate of CDISC-CG0510 (owner rulings D-8 + D-18,\
    \ 2026-09-14): the two are identical in every field but the id. ⛔ The SURVIVOR\
    \ IS NOT THE HIGHER NUMBER here — D-18 makes COVERAGE the invariant and the number\
    \ only a tie-break. CDISC-CG0635 ships into a strict SUBSET of CDISC-CG0510's\
    \ packages, so parking CDISC-CG0510 instead would leave the standards only it\
    \ reaches with no active rule. Every standard either rule names keeps an active\
    \ rule."
Scope:
  Domains:
    Include:
    - "ALL"
Check:
  expression: >-
    var_exists("--NOMDY")
Outcome:
  Message: "--NOMDY is present but is not permitted in human clinical trials."
  Output_Variables:
  - "--NOMDY"
Source:
  Class: "ALL"
  Variable: "--NOMDY"
  Rule: "--NOMDY not present in dataset"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "SDTMIG"
    Version: "3.4"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0635"
        Version: "1"
      Version: "2.0"
