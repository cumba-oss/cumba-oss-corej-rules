Core:
  Id: "CDISC-AD0454"
  Status: "Published"
  Version: "2"
Description: "Raise an error when SHIFTy is populated but SHIFTyN is missing"
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "BASIC DATA STRUCTURE"
Check:
  expression: >-
    not empty(SHIFTy) and empty(SHIFTyN)
Outcome:
  Message: "SHIFTy is populated, but SHIFTyN is missing"
  Message_Folded: "SHIFTyN not populated in any record of the dataset, and at least\
    \ one record meets the rest of the condition: SHIFTy is populated, but SHIFTyN\
    \ is missing"
  Output_Variables:
  - "SHIFTy"
  - "SHIFTyN"
wildcards:
  "y":
    min: 1
    max: 99
Source:
  Class: "BASIC DATA STRUCTURE; MEDICAL DEVICE BASIC DATA STRUCTURE"
  Variable_or_Item: "SHIFTyN where y is an integer [1-99, not zero-padded]"
  Natural_Language_Rule_Failure_Criteria: "On a given record, SHIFTy is populated\
    \ and SHIFTyN is not populated"
  Rule_Failure_Criteria: "SHIFTyN is not populated"
  Condition_Failure: "SHIFTy is populated"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.2"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR454"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.3"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR454"
        Version: "2"
      Version: "5.0"
