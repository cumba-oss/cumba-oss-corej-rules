Core:
  Id: "CDISC-CG0110"
  Status: "Published"
  Version: "1"
Description: "Raise an error when --DOSE is populated and --DOSTXT is populated."
Executability: "Fully Executable"
Scope:
  Classes:
    Include:
    - "INTERVENTIONS"
Requirements:
  Variables:
    All:
    - "--DOSE"
    - "--DOSTXT"
Check:
  expression: >-
    not empty(--DOSE) and not empty(--DOSTXT)
Outcome:
  Message: "Both --DOSE and --DOSTXT values are populated"
Source:
  Class: "INT"
  Domain: "ALL"
  Variable: "--DOSE"
  Condition: "--DOSTXT ^= null"
  Rule: "--DOSE = null"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "SDTMIG"
    Version: "3.4"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0110"
        Version: "1"
      Version: "2.0"
  - Name: "SDTMIG"
    Version: "3.3"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0110"
        Version: "1"
      Version: "2.0"
  - Name: "SDTMIG"
    Version: "3.2"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0110"
        Version: "1"
      Version: "2.0"
