Core:
  Id: "CDISC-SEND-0180"
  Status: "Published"
  Version: "1"
Description: "Raise an error when more than one Microscopic Findings (MI) record exists\
  \ for the same combination of Test Short Name (MITESTCD), Unique Subject Identifier\
  \ (USUBJID), specimen (MISPEC), standardized finding (MISTRESC), laterality (MILAT),\
  \ directionality (MIDIR), and anatomical region (MIANTREG); the domain should hold\
  \ one record per finding per specimen per subject."
Executability: "Partially Executable - Possible Overreporting"
Scope:
  Domains:
    Include:
    - "MI"
Check:
  expression: >-
    not is_unique_set([MITESTCD, USUBJID, MISPEC, MISTRESC, MILAT, MIDIR, MIANTREG])
Outcome:
  Message: "More than one MI record exists for the same finding (MITESTCD/MISTRESC),\
    \ subject (USUBJID), and specimen (MISPEC)."
Source:
  Class: "FND"
  Domain: "MI"
  Variable: "ALL"
  Plain_Text_Explanation: "One record per finding per specimen per subject"
  Rule: "One record per finding per specimen per subject"
