Core:
  Id: "CDISC-AD0678"
  Status: "Published"
  Version: "1"
Description: "Raise an error when there is more than one value of DEVTYGyN for a given\
  \ value of DEVTYGy, considering only rows where both variables are populated."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "DEVICE LEVEL ANALYSIS DATASET"
Check:
  expression: >-
    not empty(DEVTYGyN) and not empty(DEVTYGy) and has_multiple_values_for(DEVTYGyN, DEVTYGy)
Outcome:
  Message: "More than one value of DEVTYGyN was found for a given value of DEVTYGy,\
    \ among the rows where both variables are populated."
  Output_Variables:
  - "DEVTYGy"
  - "DEVTYGyN"
wildcards:
  "y":
    min: 1
    max: 99
Source:
  Class: "DEVICE LEVEL ANALYSIS DATASET"
  Variable_or_Item: "DEVTYGyN where y is an integer [1-9, not zero-padded]"
  Natural_Language_Rule_Failure_Criteria: "There is more than one value of DEVTYGyN\
    \ for a given value of DEVTYGy, considering only those rows on which both variables\
    \ are populated"
  Rule_Failure_Criteria: "There is more than one value of DEVTYGyN for a given value\
    \ of DEVTYGy"
  Condition_Failure: "On rows where both DEVTYGyN and DEVTYGy are both populated."
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.3"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR678"
        Version: "1"
      Version: "5.0"
