Core:
  Id: "CDISC-CG0232"
  Status: "Published"
  Version: "1"
Description: "Raise an error when the start reference time point (--STTPT) is a complete\
  \ date equal to the date/time of collection (--DTC) but the start relative to reference\
  \ time point (--STRTPT) is not one of 'BEFORE', 'COINCIDENT', or 'UNKNOWN'."
Executability: "Partially Executable"
Scope:
  Domains:
    Include:
    - "ALL"
Requirements:
  Variables:
    All:
    - "--STRTPT"
    - "--STTPT"
    - "--DTC"
Check:
  expression: >-
    not empty(--STTPT) and is_complete_date(--STTPT) and not empty(--DTC) and date(--STTPT) ==
    date(--DTC) and --STRTPT not in ["BEFORE", "COINCIDENT", "UNKNOWN"]
Outcome:
  Message: "--STTPT is equal to the date of collection or assessment but --STRTPT\
    \ is not in ('BEFORE', 'COINCIDENT', 'UNKNOWN')."
Source:
  Class: "ALL"
  Domain: "ALL"
  Variable: "--STRTPT"
  Condition: "--STTPT corresponds to the date of collection or assessment."
  Rule: "--STRTPT in ('BEFORE', 'COINCIDENT', 'UNKNOWN')"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "SDTMIG"
    Version: "3.4"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0232"
        Version: "1"
      Version: "2.0"
  - Name: "SDTMIG"
    Version: "3.3"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0232"
        Version: "1"
      Version: "2.0"
  - Name: "SDTMIG"
    Version: "3.2"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0232"
        Version: "1"
      Version: "2.0"
