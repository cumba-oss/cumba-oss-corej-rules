Core:
  Id: "CDISC-AD0834"
  Status: "Published"
  Version: "1"
Description: "Raise an error when DVIDN is present and DVID is not present."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "BASIC DATA STRUCTURE"
Check:
  expression: >-
    var_exists("DVIDN") and not var_exists("DVID")
Outcome:
  Message: "DVIDN is present, but DVID is not present."
  Output_Variables:
  - "DVIDN"
Source:
  Class: "BASIC DATA STRUCTURE"
  Subclass: "POPULATION PHARMACOKINETIC ANALYSIS"
  Variable_or_Item: "DVIDN"
  Natural_Language_Rule_Failure_Criteria: "DVIDN is present and DVID is not present"
  Rule_Failure_Criteria: "DVID is not present"
  Condition_Failure: "DVIDN is present"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.3"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR834"
        Version: "1"
      Version: "5.0"
