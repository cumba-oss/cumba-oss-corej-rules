Core:
  Id: "CDISC-AD0511"
  Status: "Published"
  Version: "1"
Description: "Raise an error when a variable's name ends in SDTM and is not a standard\
  \ library variable, and its label does not contain the phrase of the ADaM implementation\
  \ guide's *SDTM naming fragment ('Start Datetime')."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "ALL"
Check:
  expression: >-
    ends_with(upper(varname()), "SDTM") and not empty(label_template("LIBRARY", stem="*SDTM")) and
    not matches_label_template(var_label("DATA"), label_template("LIBRARY", stem="*SDTM"))
Outcome:
  Message: "A variable ending in SDTM does not contain 'Start Datetime' in the label."
  Output_Variables:
  - "library_variable_label_template"
Source:
  Class: "ALL"
  Variable_or_Item: "*SDTM"
  Natural_Language_Rule_Failure_Criteria: "A variable ending in SDTM must contain\
    \ \"Start Datetime\" in the label"
  Rule_Failure_Criteria: "*SDTM does not contain \"Start Datetime\" in the label"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.1"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR511"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.2"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR511"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.3"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR511"
        Version: "1"
      Version: "5.0"
