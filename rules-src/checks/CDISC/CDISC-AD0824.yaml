Core:
  Id: "CDISC-AD0824"
  Status: "Published"
  Version: "1"
Description: "Raise an error when SITEIDN is present and SITEID is not present."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "BASIC DATA STRUCTURE"
Check:
  expression: >-
    var_exists("SITEIDN") and not var_exists("SITEID")
Outcome:
  Message: "SITEIDN is present, but SITEID is not present."
  Output_Variables:
  - "SITEIDN"
Source:
  Class: "BASIC DATA STRUCTURE"
  Subclass: "POPULATION PHARMACOKINETIC ANALYSIS"
  Variable_or_Item: "SITEIDN"
  Natural_Language_Rule_Failure_Criteria: "SITEIDN is present and SITEID is not present"
  Rule_Failure_Criteria: "SITEID is not present"
  Condition_Failure: "SITEIDN is present"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.3"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR824"
        Version: "1"
      Version: "5.0"
