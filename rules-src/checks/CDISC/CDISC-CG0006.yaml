Core:
  Id: "CDISC-CG0006"
  Status: "Published"
  Version: "1"
Description: "Raise an error when the collection Study Day (--DY) is populated and\
  \ both the date portion of --DTC and the date portion of RFSTDTC are complete dates,\
  \ but --DY does not equal the value computed by the SDTM study day algorithm (a\
  \ non-zero integer)."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "ALL"
Requirements:
  Variables:
    All:
    - "--DTC"
    - "--DY"
    - "USUBJID"
    All_Or_None:
    - - "USUBJID"
      - "DM.USUBJID"
Match_Datasets:
- Keys:
  - "USUBJID"
  Name: "DM"
Bindings:
- name: "$value_dy_algorithm"
  expression: "dy(--DTC, DM.RFSTDTC)"
Check:
  expression: >-
    not empty(--DY) and is_complete_date_part(--DTC) and is_complete_date_part(DM.RFSTDTC) and --DY
    != $value_dy_algorithm
Outcome:
  Message: "--DY does not equal the value derived by the SDTM study day algorithm\
    \ even though the date portions of --DTC and RFSTDTC are complete dates and --DY\
    \ is populated."
Source:
  Class: "ALL"
  Domain: "ALL"
  Variable: "--DY"
  Condition: "Date portion of --DTC is complete and date portion of RFSTDTC is a complete\
    \ date AND --DY is ^= null"
  Rule: "--DY calculated as per the study day algorithm as a non-zero integer value"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "SDTMIG"
    Version: "3.4"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0006"
        Version: "2"
      Version: "2.0"
  - Name: "SDTMIG"
    Version: "3.3"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0006"
        Version: "2"
      Version: "2.0"
  - Name: "SDTMIG"
    Version: "3.2"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0006"
        Version: "2"
      Version: "2.0"
