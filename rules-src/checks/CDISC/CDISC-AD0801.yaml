Core:
  Id: "CDISC-AD0801"
  Status: "Published"
  Version: "1"
Description: "Raise an error when STUDYIDN is populated and STUDYID is not populated"
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "BASIC DATA STRUCTURE"
Check:
  expression: >-
    not empty(STUDYIDN) and empty(STUDYID)
Outcome:
  Message: "STUDYIDN is populated, but STUDYID is not populated."
  Message_Folded: "STUDYID not populated in any record of the dataset, and at least\
    \ one record meets the rest of the condition: STUDYIDN is populated, but STUDYID\
    \ is not populated."
Source:
  Class: "BASIC DATA STRUCTURE"
  Subclass: "POPULATION PHARMACOKINETIC ANALYSIS"
  Variable_or_Item: "STUDYID"
  Natural_Language_Rule_Failure_Criteria: "STUDYIDN is populated and STUDYID is not\
    \ populated"
  Rule_Failure_Criteria: "STUDYID is not populated"
  Condition_Failure: "STUDYIDN is populated"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.3"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR801"
        Version: "1"
      Version: "5.0"
