Core:
  Id: "CDISC-SEND-0116"
  Status: "Published"
  Version: "1"
Description: "Raise an error when Related Domain Abbreviation (RDOMAIN) is populated\
  \ but does not match a domain abbreviation present in the study data."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "CO"
Requirements:
  Variables:
    All:
    - "RDOMAIN"
Bindings:
- name: "$study_domains"
  expression: "study_domains()"
Check:
  expression: >-
    not empty(RDOMAIN) and RDOMAIN not in $study_domains
Outcome:
  Message: "RDOMAIN is populated with a value that is not a domain present in the\
    \ study."
  Output_Variables:
  - "$study_domains"
Source:
  Class: "SPC"
  Domain: "CO"
  Variable: "RDOMAIN"
  Plain_Text_Explanation: "RDOMAIN is a valid domain abbreviation used within the\
    \ study"
  Condition: "RDOMAIN ^= null"
  Rule: "RDOMAIN = valid domain abbreviation used within the study"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "SENDIG-GENETOX"
    Version: "1.0"
    References:
    - Origin: "SEND Conformance Rules"
      Rule_Identifier:
        Id: "SEND116"
        Version: "1"
      Version: "5.0"
  - Name: "SENDIG-DART"
    Version: "1.2"
    References:
    - Origin: "SEND Conformance Rules"
      Rule_Identifier:
        Id: "SEND116"
        Version: "1"
      Version: "5.0"
  - Name: "SENDIG-DART"
    Version: "1.1"
    References:
