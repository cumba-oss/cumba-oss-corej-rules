Core:
  Id: "CDISC-AD0607"
  Status: "Published"
  Version: "1"
Description: "Raise an error when, on a BDS or OCCDS record where APHASEN is populated,\
  \ PHSTM does not equal the ADSL variable PHwSTM for the same USUBJID (where w equals\
  \ the record's APHASEN value)."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "BASIC DATA STRUCTURE"
    - "OCCURRENCE DATA STRUCTURE"
Match_Datasets:
- Name: "ADSL"
  Keys:
  - "USUBJID"
Check:
  expression: >-
    not empty(APHASEN) and not empty(PHSTM) and PHSTM != ADSL.PH${APHASEN:%d}STM
Outcome:
  Message: "On a given record, APHASEN is populated and the value of PHSTM is not\
    \ equal to the value of variable PHwSTM where w equals the value of APHASEN"
  Output_Variables:
  - "APHASEN"
  - "PHSTM"
  - "ADSL.PH${*}STM"
Source:
  Class: "ALL"
  Variable_or_Item: "PHSTM"
  Natural_Language_Rule_Failure_Criteria: "On a given record, APHASEN is present and\
    \ the value of PHSTM is not equal to the value of variable PHwSTM where w equals\
    \ the value of APHASEN"
  Rule_Failure_Criteria: "On a given record, APHASEN is present and the value of PHSTM\
    \ is not equal to the value of variable PHwSTM where w equals the value of APHASEN"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.2"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR607"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.3"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR607"
        Version: "1"
      Version: "5.0"
