Core:
  Id: "CDISC-AD0178"
  Status: "Published"
  Version: "1"
Description: "Raise an error when ANLzzFL is populated and does not equal 'Y', where\
  \ zz is a zero-padded two-digit integer [01-99]."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "BASIC DATA STRUCTURE"
    - "OCCURRENCE DATA STRUCTURE"
Check:
  expression: >-
    upper(varname()) =~ /^ANL(0[1-9]|[1-9][0-9])FL$/ and not empty(value()) and value() != "Y"
Outcome:
  Message: "ANLzzFL is populated but does not equal Y, where zz is a zero-padded two-digit\
    \ integer [01-99]."
  Output_Variables:
  - "variable_value"
Source:
  Class: "BASIC DATA STRUCTURE; OCCURRENCE DATA STRUCTURE"
  Variable_or_Item: "ANLzzFL where zz is an integer [01-99, zero-padded]"
  Natural_Language_Rule_Failure_Criteria: "ANLzzFL is not equal to Y or null where\
    \ zz is a zero-padded two-digit integer [01-99]"
  Rule_Failure_Criteria: "ANLzzFL is not equal to Y or null"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.0"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR178"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.1"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR178"
        Version: "1"
      Version: "5.0"
