Core:
  Id: "CDISC-AD0837"
  Status: "Published"
  Version: "1"
Description: "Raise an error when, within a dataset, there is more than one value\
  \ of BLQFN for a given value of BLQFL, considering only records where both variables\
  \ are populated"
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "BASIC DATA STRUCTURE"
Check:
  expression: >-
    not empty(BLQFL) and not empty(BLQFN) and has_multiple_values_for(BLQFN, BLQFL)
Outcome:
  Message: "Within this dataset, more than one value of BLQFN is present for the same\
    \ populated value of BLQFL"
Source:
  Class: "BASIC DATA STRUCTURE"
  Subclass: "POPULATION PHARMACOKINETIC ANALYSIS"
  Variable_or_Item: "BLQFN"
  Natural_Language_Rule_Failure_Criteria: "Within a dataset, there is more than one\
    \ value of BLQFN for a given value of BLQFL, considering only those rows on which\
    \ both variables are populated."
  Rule_Failure_Criteria: "Within a dataset, there is more than one value of BLQFN\
    \ for a given value of BLQFL"
  Condition_Failure: "On rows where both BLQFN and BLQFL are both populated"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.3"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR837"
        Version: "1"
      Version: "5.0"
