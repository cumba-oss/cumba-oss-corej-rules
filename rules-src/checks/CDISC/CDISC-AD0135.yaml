Core:
  Id: "CDISC-AD0135"
  Status: "Published"
  Version: "1"
Description: "Raise an error when, within a given value of PARAMCD, there is more\
  \ than one value of SHIFTy for a given value of SHIFTyN."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "BASIC DATA STRUCTURE"
Check:
  expression: >-
    not empty(SHIFTy) and not empty(SHIFTyN) and has_multiple_values_for(SHIFTy, SHIFTyN,
    within=PARAMCD)
Outcome:
  Message: "SHIFTy has more than one value for this PARAMCD and SHIFTyN."
  Output_Variables:
  - "PARAMCD"
  - "SHIFTy"
  - "SHIFTyN"
wildcards:
  "y":
    min: 1
    max: 9
Source:
  Class: "BASIC DATA STRUCTURE"
  Variable_or_Item: "SHIFTy where y is an integer [1-9, not zero-padded]"
  Natural_Language_Rule_Failure_Criteria: "Within a given value of PARAMCD, there\
    \ is more than one value of SHIFTy for a given value of SHIFTyN"
  Rule_Failure_Criteria: "Within a given value of PARAMCD, there is more than one\
    \ value of SHIFTy for a given value of SHIFTyN"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.0"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR135"
        Version: "1"
      Version: "5.0"
