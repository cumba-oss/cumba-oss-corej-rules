Core:
  Id: "CDISC-AD0382"
  Status: "Published"
  Version: "2"
Description: "Raise an error when, within a parameter, there is more than one value\
  \ of BTOXGRN for a given value of BTOXGR, considering only rows on which both variables\
  \ are populated."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "BASIC DATA STRUCTURE"
    - "MEDICAL DEVICE BASIC DATA STRUCTURE"
Check:
  expression: >-
    not empty(BTOXGR) and not empty(BTOXGRN) and has_multiple_values_for(BTOXGRN, BTOXGR,
    within=PARAMCD)
Outcome:
  Message: "Within a parameter, there is more than one value of BTOXGRN for a given\
    \ value of BTOXGR, considering only rows on which both variables are populated."
Source:
  Class: "BASIC DATA STRUCTURE; MEDICAL DEVICE BASIC DATA STRUCTURE"
  Variable_or_Item: "BTOXGRN"
  Natural_Language_Rule_Failure_Criteria: "Within a parameter, there is more than\
    \ one value of BTOXGRN for a given value of BTOXGR, considering only those rows\
    \ on which both variables are populated"
  Rule_Failure_Criteria: "Within a parameter, there is more than one value of BTOXGRN\
    \ for a given value of BTOXGR"
  Condition_Failure: "On rows where both BTOXGRN and BTOXGR are both populated"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.2"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR382"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.3"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR382"
        Version: "2"
      Version: "5.0"
