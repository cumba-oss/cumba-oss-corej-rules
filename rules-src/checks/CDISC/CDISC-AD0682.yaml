Core:
  Id: "CDISC-AD0682"
  Status: "Published"
  Version: "1"
Description: "Raise an error when there is more than one value of MODELGyN for a given\
  \ value of MODELGy, considering only rows where both variables are populated."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "DEVICE LEVEL ANALYSIS DATASET"
Check:
  expression: >-
    not empty(MODELGyN) and not empty(MODELGy) and has_multiple_values_for(MODELGyN, MODELGy)
Outcome:
  Message: "More than one value of MODELGyN was found for a given value of MODELGy,\
    \ among the rows where both variables are populated."
  Output_Variables:
  - "MODELGy"
  - "MODELGyN"
wildcards:
  "y":
    min: 1
    max: 99
Source:
  Class: "DEVICE LEVEL ANALYSIS DATASET"
  Variable_or_Item: "MODELGyN where y is an integer [1-9, not zero-padded]"
  Natural_Language_Rule_Failure_Criteria: "There is more than one value of MODELGyN\
    \ for a given value of MODELGy, considering only those rows on which both variables\
    \ are populated"
  Rule_Failure_Criteria: "There is more than one value of MODELGyN for a given value\
    \ of MODELGy"
  Condition_Failure: "On rows where both MODELGyN and MODELGy are both populated."
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.3"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR682"
        Version: "1"
      Version: "5.0"
