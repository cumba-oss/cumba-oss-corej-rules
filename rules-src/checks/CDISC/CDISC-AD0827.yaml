Core:
  Id: "CDISC-AD0827"
  Status: "Published"
  Version: "1"
Description: "Raise an error when, within a dataset, there is more than one value\
  \ of FLGREASC for a given value of FLGREAS, considering only records where both\
  \ variables are populated"
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "BASIC DATA STRUCTURE"
Check:
  expression: >-
    not empty(FLGREAS) and not empty(FLGREASC) and has_multiple_values_for(FLGREASC, FLGREAS)
Outcome:
  Message: "Within this dataset, more than one value of FLGREASC is present for the\
    \ same populated value of FLGREAS"
Source:
  Class: "BASIC DATA STRUCTURE"
  Subclass: "POPULATION PHARMACOKINETIC ANALYSIS"
  Variable_or_Item: "FLGREASC"
  Natural_Language_Rule_Failure_Criteria: "Within a dataset, there is more than one\
    \ value of FLGREASC for a given value of FLGREAS, considering only those rows\
    \ on which both variables are populated."
  Rule_Failure_Criteria: "Within a dataset, there is more than one value of FLGREASC\
    \ for a given value of FLGREAS"
  Condition_Failure: "On rows where both FLGREASC and FLGREAS are both populated"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.3"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR827"
        Version: "1"
      Version: "5.0"
