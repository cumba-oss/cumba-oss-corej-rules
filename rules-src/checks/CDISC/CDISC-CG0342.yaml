Core:
  Id: "CDISC-CG0342"
  Status: "Published"
  Version: "1"
Description: "Raise an error when --TRT is equal to 'OTHER'."
Executability: "Fully Executable"
Scope:
  Classes:
    Include:
    - "INTERVENTIONS"
Requirements:
  Variables:
    All:
    - "--TRT"
Check:
  expression: >-
    --TRT == "OTHER"
Outcome:
  Message: "--TRT is equal to 'OTHER'."
  Output_Variables:
  - "--TRT"
Source:
  Class: "INT"
  Domain: "ALL"
  Variable: "--TRT"
  Rule: "--TRT ^= 'OTHER'"
