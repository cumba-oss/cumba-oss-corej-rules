Core:
  Id: "CDISC-SEND-0167"
  Status: "Published"
  Version: "1"
Description: "Raise an error when a Death Diagnosis (DD) record exists for a subject\
  \ whose Disposition (DS) records a scheduled reason for termination (a planned sacrifice);\
  \ the DD domain should only be used for subjects with an unscheduled death."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "DD"
Requirements:
  Variables:
    All:
    - "USUBJID"
Grouping:
  Variables:
  - "USUBJID"
Bindings:
- name: "$scheduled_subjects"
  expression: "distinct(USUBJID, domain=\"DS\", filter=(DSDECOD in [\"TERMINAL SACRIFICE\"\
    , \"INTERIM SACRIFICE\", \"RECOVERY SACRIFICE\", \"NON-MORIBUND SACRIFICE\"]))"
Check:
  expression: >-
    USUBJID in $scheduled_subjects
Outcome:
  Message: "A DD record exists for a subject whose DS disposition records a scheduled\
    \ reason for termination (planned sacrifice)."
  Output_Variables:
  - "USUBJID"
Source:
  Class: "FND"
  Domain: "DD"
  Variable: "ALL"
  Plain_Text_Explanation: "This domain should only be utilized for subjects with an\
    \ unscheduled death."
  Condition: "Subject with scheduled reason for termination"
  Rule: "No record should exist for that subject"
Standards:
