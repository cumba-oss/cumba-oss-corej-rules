Core:
  Id: "CDISC-SEND-0138"
  Status: "Published"
  Version: "1"
Description: "Raise an error when the Sequence Number (--SEQ) is not unique for a\
  \ subject (USUBJID) within a domain; the same USUBJID and --SEQ combination must\
  \ not appear on more than one record."
Executability: "Fully Executable"
Scope:
  Classes:
    Include:
    - "INTERVENTIONS"
    - "EVENTS"
    - "FINDINGS"
Check:
  expression: >-
    not is_unique_set([--SEQ, USUBJID, POOLID])
Outcome:
  Message: "--SEQ is not unique for a subject within the domain."
Source:
  Class: "INT, EVT, FND"
  Domain: "ALL"
  Variable: "--SEQ"
  Plain_Text_Explanation: "Sequence number is assigned to ensure uniqueness of records\
    \ within a domain for a subject (or pool)."
  Rule: "--SEQ is unique within a USUBJID OR --SEQ is unique within a POOLID"
