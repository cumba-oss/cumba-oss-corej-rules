Core:
  Id: "CDISC-AD0519"
  Status: "Published"
  Version: "1"
Description: "Raise an error when a variable's name ends in EDTF and is not a standard\
  \ library variable, and its label does not end with 'Imputation Flag' (or 'Imput.\
  \ Flag') or does not contain 'End' or does not contain 'Date'."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "ALL"
Check:
  expression: >-
    ends_with(upper(varname()), "EDTF") and not empty(label_template("LIBRARY", stem="*EDTF")) and
    (var_label("DATA") !~ / Imput(\\.|ation) Flag$/ or not contains(var_label("DATA"), "End") or not
    contains(var_label("DATA"), "Date"))
Outcome:
  Message: "A variable ending in EDTF has a label that does not end with 'Imputation\
    \ Flag' (or 'Imput. Flag') or does not contain 'End' or does not contain 'Date'."
  Output_Variables:
  - "variable_name"
  - "variable_label"
  - "library_variable_label_template"
Source:
  Class: "ALL"
  Variable_or_Item: "*EDTF"
  Natural_Language_Rule_Failure_Criteria: "A variable ending in EDTF must contain\
    \ \"End Date Imputation Flag\" in the label"
  Rule_Failure_Criteria: "*EDTF does not contain \"End Date Imputation Flag\" in the\
    \ label"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.1"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR519"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.2"
    References:
