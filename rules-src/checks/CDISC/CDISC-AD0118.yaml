Core:
  Id: "CDISC-AD0118"
  Status: "Published"
  Version: "1"
Description: "Raise an error when, within a given value of PARAMCD, there is more\
  \ than one value of ATPTN for a given value of ATPT."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "BASIC DATA STRUCTURE"
Requirements:
  Variables:
    All:
    - "ATPT"
    - "ATPTN"
Check:
  expression: >-
    has_multiple_values_for(ATPTN, ATPT, within=PARAMCD)
Outcome:
  Message: "ATPTN has more than one value for this PARAMCD and ATPT."
  Output_Variables:
  - "ATPT"
  - "ATPTN"
  - "PARAMCD"
Source:
  Class: "BASIC DATA STRUCTURE; MEDICAL DEVICE BASIC DATA STRUCTURE"
  Variable_or_Item: "ATPTN"
  Natural_Language_Rule_Failure_Criteria: "Within a given value of PARAMCD, there\
    \ is more than one value of ATPTN for a given value of ATPT"
  Rule_Failure_Criteria: "Within a given value of PARAMCD, there is more than one\
    \ value of ATPTN for a given value of ATPT"
Standards:
- Organization: "CDISC"
  Standards:
