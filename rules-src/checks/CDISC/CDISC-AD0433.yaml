Core:
  Id: "CDISC-AD0433"
  Status: "Published"
  Version: "2"
Description: "Raise an error when ASPER is populated but ASPERC is empty"
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "BASIC DATA STRUCTURE"
    - "OCCURRENCE DATA STRUCTURE"
    - "MEDICAL DEVICE OCCURRENCE DATA STRUCTURE"
Check:
  expression: >-
    not empty(ASPER) and empty(ASPERC)
Outcome:
  Message: "ASPER is populated, but ASPERC is empty"
Source:
  Class: "BASIC DATA STRUCTURE; MEDICAL DEVICE BASIC DATA STRUCTURE; OCCURRENCE DATA\
    \ STRUCTURE; MEDICAL DEVICE OCCURRENCE DATA STRUCTURE"
  Variable_or_Item: "ASPERC"
  Natural_Language_Rule_Failure_Criteria: "On a given record, ASPER is populated and\
    \ ASPERC is not populated"
  Rule_Failure_Criteria: "ASPERC is not populated"
  Condition_Failure: "ASPER is populated"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.2"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR433"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.3"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR433"
        Version: "2"
      Version: "5.0"
