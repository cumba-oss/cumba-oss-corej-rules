Core:
  Id: "CDISC-AD0892"
  Status: "Published"
  Version: "1"
Description: "Raise an error when, within an ADNCA v1.0 dataset and considering only\
  \ rows on which both COHORT and COHORTN are populated, more than one value of COHORT\
  \ is present for a given value of COHORTN."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "BASIC DATA STRUCTURE"
  Subclasses:
    Include:
    - "NON-COMPARTMENTAL ANALYSIS"
Check:
  expression: >-
    not empty(COHORT) and not empty(COHORTN) and has_multiple_values_for(COHORT, COHORTN)
Outcome:
  Message: "There is more than one value of COHORT for a given value of COHORTN."
Source:
  Class: "BASIC DATA STRUCTURE"
  Subclass: "NON-COMPARTMENTAL ANALYSIS"
  Variable_or_Item: "COHORT"
  Natural_Language_Rule_Failure_Criteria: "On a given record, there is more than one\
    \ value of COHORT for a given value of COHORTN, considering only those rows on\
    \ which both variables are populated"
  Rule_Failure_Criteria: "There is more than one value of COHORT for a given value\
    \ of COHORTN"
  Condition_Failure: "On rows where both COHORT and COHORTN are both populated."
Standards:
- Organization: "CDISC"
  Standards:
