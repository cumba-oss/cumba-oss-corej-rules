Core:
  Id: "CDISC-AD0797"
  Status: "Published"
  Version: "1"
Description: "Raise an error when, within a dataset, there is more than one value\
  \ of PROJIDN for a given value of PROJID, considering only those rows on which both\
  \ variables are populated."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "BASIC DATA STRUCTURE"
Check:
  expression: >-
    not empty(PROJID) and not empty(PROJIDN) and has_multiple_values_for(PROJIDN, PROJID)
Outcome:
  Message: "Within a dataset, there is more than one value of PROJIDN for a given\
    \ value of PROJID."
Source:
  Class: "BASIC DATA STRUCTURE"
  Subclass: "POPULATION PHARMACOKINETIC ANALYSIS"
  Variable_or_Item: "PROJIDN"
  Natural_Language_Rule_Failure_Criteria: "Within a dataset, there is more than one\
    \ value of PROJIDN for a given value of PROJID, considering only those rows on\
    \ which both variables are populated."
  Rule_Failure_Criteria: "Within a dataset, there is more than one value of PROJIDN\
    \ for a given value of PROJID"
  Condition_Failure: "On rows where both PROJIDN and PROJID are both populated"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.3"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR797"
        Version: "1"
      Version: "5.0"
