Core:
  Id: "CDISC-AD0480"
  Status: "Published"
  Version: "1"
Description: "Raise an error when there is more than one value of STRATwV for a given\
  \ value of STRATwVN, where w is a single-digit integer [1-9], considering only records\
  \ where both variables are populated."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "SUBJECT LEVEL ANALYSIS DATASET"
Check:
  expression: >-
    not empty(STRATwV) and not empty(STRATwVN) and has_multiple_values_for(STRATwV, STRATwVN)
Outcome:
  Message: "More than one value of STRATwV was found for the same value of STRATwVN."
  Output_Variables:
  - "STRATwV"
  - "STRATwVN"
wildcards:
  w:
    min: 1
    max: 9
Source:
  Class: "SUBJECT LEVEL ANALYSIS DATASET"
  Variable_or_Item: "STRATwV where w is an integer [1-9, not zero-padded]"
  Natural_Language_Rule_Failure_Criteria: "There is more than one value of STRATwV\
    \ for a given value of STRATwVN, considering only those rows on which both variables\
    \ are populated"
  Rule_Failure_Criteria: "There is more than one value of STRATwV for a given value\
    \ of STRATwVN"
  Condition_Failure: "On rows where both STRATwV and STRATwVN are both populated."
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.2"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR480"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.3"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR480"
        Version: "1"
      Version: "5.0"
