Core:
  Id: "CDISC-SEND-0183"
  Status: "Published"
  Version: "1"
Description: "Raise an error when Relationship to Death (--DTHREL) is populated with\
  \ a value other than \"Y\", \"N\", or \"U\"."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "MA"
    - "MI"
Requirements:
  Variables:
    All:
    - "--DTHREL"
Check:
  expression: >-
    not empty(--DTHREL) and --DTHREL not in ["Y", "N", "U"]
Outcome:
  Message: "--DTHREL is populated with a value that is not \"Y\", \"N\", or \"U\"."
Source:
  Class: "FND"
  Domain: "MA, MI"
  Variable: "--DTHREL"
  Plain_Text_Explanation: "DTHREL must be populated with \"Y\", \"N\", \"U\" or null."
  Condition: "DTHREL ^= null"
  Rule: "DTHREL = \"Y\" OR DTHREL = \"N\" OR DTHREL = \"U\""
