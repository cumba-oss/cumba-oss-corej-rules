Core:
  Id: "CDISC-CG0411"
  Status: "Published"
  Version: "1"
Description: "Raise an error when, for a DM-related record (RDOMAIN = 'DM') in a Supplemental\
  \ Qualifiers (SUPP--) dataset, the combination of RDOMAIN and QNAM is not unique\
  \ for the parent subject record."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "SUPP--"
    - "SQ--"
Requirements:
  Variables:
    All:
    - "RDOMAIN"
Check:
  expression: >-
    RDOMAIN == "DM" and not is_unique_set([USUBJID, RDOMAIN, QNAM])
Outcome:
  Message: "RDOMAIN and QNAM are not a unique combination for the parent subject record\
    \ (RDOMAIN = 'DM')."
  Output_Variables:
  - "RDOMAIN"
  - "QNAM"
Source:
  Class: "ALL"
  Domain: "SUPP--"
  Variable: "GEN"
  Rule: "IDVAR, IDVARVAL, and QNAM a unique combination per parent subject record"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "SDTMIG"
    Version: "3.4"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0411"
        Version: "1"
      Version: "2.0"
  - Name: "SDTMIG"
    Version: "3.3"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0411"
        Version: "1"
      Version: "2.0"
  - Name: "SDTMIG"
    Version: "3.2"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0411"
        Version: "1"
      Version: "2.0"
