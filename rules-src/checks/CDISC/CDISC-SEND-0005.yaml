Core:
  Id: "CDISC-SEND-0005"
  Status: "Published"
  Version: "1"
Description: "Raise an error when a variable name declared in the Define-XML document\
  \ is not a variable name defined in the SENDIG (or, for a domain the SENDIG does\
  \ not define, in the SDTM Model)."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "ALL"
Variable_Universe: "Define"
Check:
  expression: >-
    not empty(var_name("DEFINE")) and not equalsIgnoreCase(var_name("DEFINE"), var_name("LIBRARY"))
Outcome:
  Message: "The variable name in the Define-XML document does not match a variable\
    \ name in the SENDIG."
  Output_Variables:
  - "define_variable_name"
Source:
  Class: "ALL"
  Domain: "ALL"
  Variable: "GEN"
  Plain_Text_Explanation: "Variable-level metadata in Define-XML document should include\
    \ the Variable Name (limited to 8 characters for compatibility with the SAS V5\
    \ Transport format)."
  Rule: "Variable-level metadata in Define-XML document matches the Variable Name\
    \ in the SENDIG"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "SENDIG-GENETOX"
    Version: "1.0"
    References:
    - Origin: "SEND Conformance Rules"
      Rule_Identifier:
        Id: "SEND5"
        Version: "1"
      Version: "5.0"
  - Name: "SENDIG-DART"
