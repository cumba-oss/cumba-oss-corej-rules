Core:
  Id: "CDISC-AD0060"
  Status: "Published"
  Version: "1"
Description: "Raise an error when a variable with a name ending in DTM is not a numeric\
  \ variable"
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "ALL"
Check:
  expression: >-
    ends_with(upper(varname()), "DTM") and var_type("DATA") != "Num"
Outcome:
  Message: "This variable's name ends in DTM, but it is not a numeric variable"
skipIfLibraryDefined: true
Source:
  Class: "ALL"
  Variable_or_Item: "*DTM"
  Natural_Language_Rule_Failure_Criteria: "A variable with a suffix of DTM is not\
    \ a numeric variable"
  Rule_Failure_Criteria: "A variable is not a numeric variable"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.0"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR60"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.1"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR60"
        Version: "1"
      Version: "5.0"
