Core:
  Id: "CDISC-CG0118"
  Status: "Published"
  Version: "1"
Description: "Raise an error when Description of Actual Arm (ACTARM) is populated,\
  \ is not one of the reserved values 'Screen Failure', 'Not Assigned', 'Not Treated',\
  \ or 'Unplanned Treatment', and its value does not match an Arm (ARM) entry in the\
  \ Trial Arms (TA) dataset."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "DM"
Requirements:
  Variables:
    All:
    - "ACTARM"
Bindings:
- name: "$ta_arm"
  expression: "distinct(ARM, domain=\"TA\")"
Check:
  expression: >-
    not empty(ACTARM) and upper(ACTARM) not in ["SCREEN FAILURE", "NOT ASSIGNED", "NOT TREATED",
    "UNPLANNED TREATMENT"] and ACTARM not in $ta_arm
Outcome:
  Message: "ACTARM is not one of the reserved values 'Screen Failure', 'Not Assigned',\
    \ 'Not Treated', or 'Unplanned Treatment' and is not among the values of ARM in\
    \ the TA dataset."
  Output_Variables:
  - "ACTARM"
  - "$ta_arm"
Source:
  Class: "SPC"
  Domain: "DM"
  Variable: "ACTARM"
  Condition: "ACTARM not in ('Screen Failure', 'Not Assigned', 'Not Treated', 'Unplanned\
    \ Treatment')"
  Rule: "ACTARM in TA.ARM"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "SDTMIG"
    Version: "3.2"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0118"
        Version: "1"
      Version: "2.0"
