Core:
  Id: "CDISC-AD0836"
  Status: "Published"
  Version: "1"
Description: "Raise an error when BLQFN is populated and BLQFL is not populated."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "BASIC DATA STRUCTURE"
Requirements:
  Variables:
    All:
    - "BLQFN"
    - "BLQFL"
Check:
  expression: >-
    not empty(BLQFN) and empty(BLQFL)
Outcome:
  Message: "BLQFN is populated, but BLQFL is not populated."
  Message_Folded: "BLQFL not populated in any record of the dataset, and at least\
    \ one record meets the rest of the condition: BLQFN is populated, but BLQFL is\
    \ not populated."
Source:
  Class: "BASIC DATA STRUCTURE"
  Subclass: "POPULATION PHARMACOKINETIC ANALYSIS"
  Variable_or_Item: "BLQFL"
  Natural_Language_Rule_Failure_Criteria: "BLQFN is populated and BLQFL is not populated"
  Rule_Failure_Criteria: "BLQFL is not populated"
  Condition_Failure: "BLQFN is populated"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.3"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR836"
        Version: "1"
      Version: "5.0"
