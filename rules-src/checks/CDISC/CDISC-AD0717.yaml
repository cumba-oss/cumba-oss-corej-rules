Core:
  Id: "CDISC-AD0717"
  Status: "Published"
  Version: "1"
Description: "Raise an error when there is more than one value of TRTxxPN for a given\
  \ value of TRTxxP, considering only rows on which both variables are populated"
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "SUBJECT LEVEL ANALYSIS DATASET"
Check:
  expression: >-
    not empty(TRTxxPN) and not empty(TRTxxP) and has_multiple_values_for(TRTxxPN, TRTxxP)
Outcome:
  Message: "TRTxxPN has more than one value for this TRTxxP, among rows where both\
    \ are populated"
  Output_Variables:
  - "TRTxxP"
  - "TRTxxPN"
wildcards:
  xx:
    min: 1
    max: 99
Source:
  Class: "SUBJECT LEVEL ANALYSIS DATASET"
  Variable_or_Item: "TRTxxPN where xx is an integer [01-99, zero-padded]"
  Natural_Language_Rule_Failure_Criteria: "There is more than one value of TRTxxPN\
    \ for a given value of TRTxxP, considering only those rows on which both variables\
    \ are populated"
  Rule_Failure_Criteria: "There is more than one value of TRTxxPN for a given value\
    \ of TRTxxP"
  Condition_Failure: "Considering only those rows on which both TRTxxPN and TRTxxP\
    \ are populated"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.1"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR717"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.2"
    References:
