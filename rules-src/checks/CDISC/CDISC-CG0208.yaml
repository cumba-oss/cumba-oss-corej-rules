Core:
  Id: "CDISC-CG0208"
  Status: "Published"
  Version: "1"
Description: "Raise an error when Start Date/Time of Element (SESTDTC) is not populated."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "SE"
Requirements:
  Variables:
    All:
    - "SESTDTC"
Check:
  expression: >-
    empty(SESTDTC)
Outcome:
  Message: "SESTDTC is not populated."
  Message_Folded: "SESTDTC not populated in any record of the dataset: SESTDTC is\
    \ not populated."
Source:
  Class: "SPC"
  Domain: "SE"
  Variable: "SESTDTC"
  Rule: "SESTDTC ^= null"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "SDTMIG"
    Version: "3.4"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0208"
        Version: "3"
      Version: "2.0"
  - Name: "SDTMIG"
    Version: "3.3"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0208"
        Version: "3"
      Version: "2.0"
