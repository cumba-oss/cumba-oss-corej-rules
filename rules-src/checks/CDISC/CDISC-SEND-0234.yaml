Core:
  Id: "CDISC-SEND-0234"
  Status: "Published"
  Version: "1"
Description: "Raise an error when a Trial Set (SETCD) in the Trial Sets (TX) domain\
  \ has no Sponsor-Defined Group Code parameter record (TXPARMCD is SPGRPCD)."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "TX"
Grouping:
  Variables:
  - "SETCD"
Bindings:
- name: "$spgrpcd_count"
  expression: "record_count(SETCD, domain=\"TX\", group=[SETCD], filter=filter(TXPARMCD=\"\
    SPGRPCD\"))"
Check:
  expression: >-
    $spgrpcd_count == 0
Outcome:
  Message: "No TXPARMCD='SPGRPCD' record is present for this Trial Set (SETCD) in\
    \ the TX domain."
  Output_Variables:
  - "$spgrpcd_count"
  - "SETCD"
Source:
  Class: "TDM"
  Domain: "TX"
  Variable: "TXPARMCD"
  Plain_Text_Explanation: "For each Trial Set the Sponsor-Defined Group Code (SPGRPCD)\
    \ should be provided."
  Rule: "Each Trial Set must have a TXPARMCD = \"SPGRPCD\""
Standards:
- Organization: "CDISC"
  Standards:
