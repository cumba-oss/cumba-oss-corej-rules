Core:
  Id: "CDISC-AD0503"
  Status: "Published"
  Version: "1"
Description: "Raise an error when a variable's name ends in DT and its label does\
  \ not contain the phrase of the ADaM implementation guide's *DT naming fragment\
  \ ('Date') - every such name, also one that ends in SDT or EDT and so falls under\
  \ that longer fragment's rule as well."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "ALL"
Check:
  expression: >-
    ends_with(upper(varname()), "DT") and not empty(label_template("LIBRARY", stem="*DT")) and not
    matches_label_template(var_label(), label_template("LIBRARY", stem="*DT"))
Outcome:
  Message: "The variable's name ends in DT, but its label does not contain 'Date'."
  Output_Variables:
  - "library_variable_label_template"
Source:
  Class: "ALL"
  Variable_or_Item: "*DT"
  Natural_Language_Rule_Failure_Criteria: "A variable ending in DT must contain \"\
    Date\" in the label"
  Rule_Failure_Criteria: "*DT does not contain \"Date\" in the label"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.1"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR503"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.2"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR503"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.3"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR503"
        Version: "1"
      Version: "5.0"
