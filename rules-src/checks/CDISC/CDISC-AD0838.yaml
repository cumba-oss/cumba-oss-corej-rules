Core:
  Id: "CDISC-AD0838"
  Status: "Published"
  Version: "1"
Description: "Raise an error when, within a dataset, there is more than one value\
  \ of BLQFL for a given value of BLQFN, considering only records where both variables\
  \ are populated"
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "BASIC DATA STRUCTURE"
Check:
  expression: >-
    not empty(BLQFL) and not empty(BLQFN) and has_multiple_values_for(BLQFL, BLQFN)
Outcome:
  Message: "Within this dataset, more than one value of BLQFL is present for the same\
    \ populated value of BLQFN"
Source:
  Class: "BASIC DATA STRUCTURE"
  Subclass: "POPULATION PHARMACOKINETIC ANALYSIS"
  Variable_or_Item: "BLQFL"
  Natural_Language_Rule_Failure_Criteria: "Within a dataset, there is more than one\
    \ value of BLQFL for a given value of BLQFN, considering only those rows on which\
    \ both variables are populated"
  Rule_Failure_Criteria: "Within a dataset, there is more than one value of BLQFL\
    \ for a given value of BLQFN"
  Condition_Failure: "On rows where both BLQFL and BLQFN are both populated"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.3"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR838"
        Version: "1"
      Version: "5.0"
