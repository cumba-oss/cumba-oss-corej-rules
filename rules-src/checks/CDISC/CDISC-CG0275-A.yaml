Core:
  Id: "CDISC-CG0275-A"
  Status: "Published"
  Version: "1"
Description: "Raise an error when a record exists with TSPARMCD equal to 'ADDON' and\
  \ TSVAL equal to 'Y', but no record with TSPARMCD equal to 'CURTRT' is present in\
  \ TS."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "TS"
Bindings:
- name: "$ADDON_Y"
  expression: "record_count(filter=(TSPARMCD == \"ADDON\" and TSVAL == \"Y\"))"
- name: "$CURTRT_N"
  expression: "record_count(filter=(TSPARMCD == \"CURTRT\"))"
Check:
  expression: >-
    $ADDON_Y >= 1 and $CURTRT_N == 0
Outcome:
  Message: "The required CURTRT Trial Summary Parameter is missing from TS when a\
    \ record exists with TSPARMCD equal to 'ADDON' and TSVAL equal to 'Y'."
Source_Proposed:
  Class: "TDM"
  Domain: "TS"
  Variable: "TSVAL"
  Condition: "TSPARMCD = 'CURTRT' and record exists where TSPARMCD = 'ADDON' and TSVAL\
    \ = 'Y'"
  Rule: "a record exists with TSPARMCD equal to 'ADDON' and TSVAL equal to 'Y', but\
    \ no record with TSPARMCD equal to 'CURTRT' is present in TS"
Source:
  Class: "TDM"
  Domain: "TS"
  Variable: "TSVAL"
  Condition: "TSPARMCD = 'CURTRT' and record exists where TSPARMCD = 'ADDON' and TSVAL\
    \ = 'Y'"
  Rule: "TSVAL ^= null"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "SDTMIG"
    Version: "3.3"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0275"
        Version: "1"
      Version: "2.0"
  - Name: "SDTMIG"
    Version: "3.2"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0275"
        Version: "1"
      Version: "2.0"
