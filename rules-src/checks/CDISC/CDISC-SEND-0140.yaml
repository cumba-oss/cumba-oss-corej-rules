Core:
  Id: "CDISC-SEND-0140"
  Status: "Published"
  Version: "1"
Description: "Raise an error when more than one Disposition (DS) record exists for\
  \ the same Unique Subject Identifier (USUBJID); the DS domain should hold one record\
  \ per subject."
Executability: "Partially Executable - Possible Underreporting"
Scope:
  Domains:
    Include:
    - "DS"
Check:
  expression: >-
    not is_unique_set([USUBJID, DOMAIN])
Outcome:
  Message: "More than one DS record exists for the same subject (USUBJID); DS should\
    \ contain one record per subject."
Source:
  Class: "EVT"
  Domain: "DS"
  Variable: "ALL"
  Plain_Text_Explanation: "DS has one record per USUBJID in DM"
  Rule: "DS has one record per USUBJID in DM"
