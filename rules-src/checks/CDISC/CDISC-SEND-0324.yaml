Core:
  Id: "CDISC-SEND-0324"
  Status: "Published"
  Version: "1"
Description: "Raise an error when a Pharmacokinetic Concentrations (PC) result is\
  \ quantifiably below the lower limit of quantitation - PCORRES below PCLLOQ - but\
  \ PCSTRESC does not carry the 'BLQ' token."
Executability: "Partially Executable - Possible Underreporting"
ExecutabilityHint:
  Category: "partially executable"
  Detail: "Below-limit detection is only possible for numerically comparable results:\
    \ a textual PCORRES (e.g. a literal 'BLQ') skips the row, so token omissions on\
    \ non-numeric results are not reported. PCLLOQ is the limit the comparison reads\
    \ and is gated by Requirements.Variables.All (R-4.11), so a PC dataset that omits\
    \ it takes an auditable SKIP naming the column instead of running to silence;\
    \ no finding changes either way, because no row can fire without the limit. Token\
    \ comparison is exact ('BLQ' per controlled terminology). The above-limit half\
    \ of the published SEND324 row is carried by the split sibling CDISC-SEND-0324-A."
Scope:
  Domains:
    Include:
    - "PC"
Requirements:
  Variables:
    All:
    - "PCORRES"
    - "PCSTRESC"
    - "PCLLOQ"
Check:
  expression: >-
    num(PCORRES) < PCLLOQ and PCSTRESC != "BLQ"
Outcome:
  Message: "PCORRES is below the lower limit of quantitation but PCSTRESC does not\
    \ carry the 'BLQ' token."
  Output_Variables:
  - "PCSTRESC"
  - "PCORRES"
  - "PCLLOQ"
Source:
  Class: "FND"
  Domain: "PC"
  Variable: "PCSTRESC"
  Plain_Text_Explanation: "For results outside the Limit of Quantitation PCSTRESC\
    \ should be populated with \"BLQ\" for results below the limit or PCSTRESC should\
    \ be populated with \"ALQ\" for results above the limit."
  Condition: "Result is outside the Limit of Quantification"
  Rule: "PCSTRESC = \"BLQ\" or PCSTRESC = \"ALQ\""
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "SENDIG"
    Version: "3.1.1"
    References:
