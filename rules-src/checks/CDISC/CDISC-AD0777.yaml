Core:
  Id: "CDISC-AD0777"
  Status: "Published"
  Version: "1"
Description: "Raise an error when there is more than one value of AREL for a given\
  \ value of ARELN, considering only rows on which both variables are populated"
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "OCCURRENCE DATA STRUCTURE"
    - "MEDICAL DEVICE OCCURRENCE DATA STRUCTURE"
Check:
  expression: >-
    not empty(AREL) and not empty(ARELN) and has_multiple_values_for(AREL, ARELN)
Outcome:
  Message: "AREL takes more than one value for the same value of ARELN, considering\
    \ only rows on which both variables are populated."
Source:
  Class: "OCCURRENCE DATA STRUCTURE; MEDICAL DEVICE OCCURRENCE DATA STRUCTURE"
  Variable_or_Item: "AREL"
  Natural_Language_Rule_Failure_Criteria: "There is more than one value of AREL for\
    \ a given value of ARELN, considering only those rows on which both variables\
    \ are populated"
  Rule_Failure_Criteria: "There is more than one value of AREL for a given value of\
    \ ARELN"
  Condition_Failure: "On rows where both AREL and ARELN are both populated."
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.1"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR777"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
