Core:
  Id: "CDISC-SEND-0288-A"
  Status: "Published"
  Version: "1"
Description: "Raise an error when both the Parameter Value (TSVAL) and the Parameter\
  \ Null Flavor (TSVALNF) variables are empty."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "TS"
Requirements:
  Variables:
    All:
    - "TSVALNF"
    - "TSVAL"
Check:
  expression: >-
    empty(TSVAL) and empty(TSVALNF)
Outcome:
  Message: "Both TSVAL and TSVALNF are empty."
  Message_Folded: "TSVAL or TSVALNF not populated in any record of the dataset, and\
    \ at least one record meets the rest of the condition: Both TSVAL and TSVALNF\
    \ are empty."
Source_Proposed:
  Sheet_Issue: "#175"
  Class: "TDM"
  Domain: "TS"
  Variable: "TSVALNF"
  Plain_Text_Explanation: "TSVALNF is populated when TSVAL is null."
  Condition: "TSVAL = null"
  Rule: "TSVALNF ^= null"
Source:
  Class: "TDM"
  Domain: "TS"
  Variable: "TSVAL, TSVALNF"
  Plain_Text_Explanation: "Either TSVAL or TSVALNF is populated, but not both."
  Rule: "Either TSVAL or TSVALNF is populated, but not both."
