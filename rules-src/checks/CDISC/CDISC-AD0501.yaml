Core:
  Id: "CDISC-AD0501"
  Status: "Published"
  Version: "2"
Description: "Raise an error when ASPER is populated and APERIOD is missing on the\
  \ same record."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "BASIC DATA STRUCTURE"
    - "OCCURRENCE DATA STRUCTURE"
    - "MEDICAL DEVICE OCCURRENCE DATA STRUCTURE"
Requirements:
  Variables:
    All:
    - "ASPER"
    - "APERIOD"
Check:
  expression: >-
    not empty(ASPER) and empty(APERIOD)
Outcome:
  Message: "ASPER is populated but APERIOD is missing."
  Message_Folded: "APERIOD not populated in any record of the dataset, and at least\
    \ one record meets the rest of the condition: ASPER is populated but APERIOD is\
    \ missing."
Source:
  Class: "BASIC DATA STRUCTURE; MEDICAL DEVICE BASIC DATA STRUCTURE; OCCURRENCE DATA\
    \ STRUCTURE; MEDICAL DEVICE OCCURRENCE DATA STRUCTURE"
  Variable_or_Item: "APERIOD"
  Natural_Language_Rule_Failure_Criteria: "On a given record, ASPER is populated and\
    \ APERIOD is not populated"
  Rule_Failure_Criteria: "APERIOD is not populated"
  Condition_Failure: "ASPER is populated"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.2"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR501"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.3"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR501"
        Version: "2"
      Version: "5.0"
