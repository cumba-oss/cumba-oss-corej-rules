Core:
  Id: "CDISC-AD0845"
  Status: "Published"
  Version: "1"
Description: "Raise an error when FORM is populated and FORMN is not populated."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "BASIC DATA STRUCTURE"
Requirements:
  Variables:
    All:
    - "FORM"
    - "FORMN"
Check:
  expression: >-
    not empty(FORM) and empty(FORMN)
Outcome:
  Message: "FORM is populated, but FORMN is not populated."
  Message_Folded: "FORMN not populated in any record of the dataset, and at least\
    \ one record meets the rest of the condition: FORM is populated, but FORMN is\
    \ not populated."
Source:
  Class: "BASIC DATA STRUCTURE"
  Subclass: "POPULATION PHARMACOKINETIC ANALYSIS"
  Variable_or_Item: "FORMN"
  Natural_Language_Rule_Failure_Criteria: "FORM is populated and FORMN is not populated"
  Rule_Failure_Criteria: "FORMN is not populated"
  Condition_Failure: "FORM is populated"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.3"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR845"
        Version: "1"
      Version: "5.0"
