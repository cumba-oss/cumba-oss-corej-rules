Core:
  Id: "CDISC-SEND-0132"
  Status: "Published"
  Version: "1"
Description: "Raise an error when both POOLID and USUBJID are populated on the same\
  \ record; POOLID and USUBJID are mutually exclusive, so USUBJID must be empty when\
  \ POOLID is populated."
Executability: "Fully Executable"
Scope:
  Classes:
    Include:
    - "INTERVENTIONS"
    - "FINDINGS"
Requirements:
  Variables:
    All:
    - "POOLID"
Check:
  expression: >-
    not empty(POOLID) and not empty(USUBJID)
Outcome:
  Message: "USUBJID is populated when POOLID is populated; the two identifiers are\
    \ mutually exclusive."
Source:
  Class: "INT, FND"
  Domain: "ALL"
  Variable: "USUBJID, POOLID"
  Plain_Text_Explanation: "If POOLID is populated, USUBJID must be null."
  Condition: "POOLID ^=null"
  Rule: "USUBJID = null"
