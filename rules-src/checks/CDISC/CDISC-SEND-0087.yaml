Core:
  Id: "CDISC-SEND-0087"
  Status: "Published"
  Version: "1"
Description: "Raise an error when --ORRES (Result or Finding in Original Units) is\
  \ populated but --STRESC (Character Result/Finding in Standard Units) is empty."
Executability: "Fully Executable"
Scope:
  Classes:
    Include:
    - "FINDINGS"
Requirements:
  Variables:
    All:
    - "--ORRES"
    - "--STRESC"
Check:
  expression: >-
    not empty(--ORRES) and empty(--STRESC)
Outcome:
  Message: "--STRESC is empty when --ORRES is populated."
Source:
  Class: "FND"
  Domain: "ALL"
  Variable: "--STRESC"
  Plain_Text_Explanation: "There should always be data presented in --STRESC if there\
    \ are data presented in --ORRES.  --STRESC population is not based on data value\
    \ format - it will be populated for both character and numeric values."
  Condition: "--ORRES ^= null"
  Rule: "--STRESC ^= null"
