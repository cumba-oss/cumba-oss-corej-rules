Core:
  Id: "CDISC-CG0033"
  Status: "Published"
  Version: "1"
Description: "Raise an error when VISITNUM is populated for a visit the Subject Visits\
  \ (SV) dataset flags as pre-specified (SVPRESP equals 'Y') but its value does not\
  \ match any VISITNUM value in the Trial Visits (TV) dataset."
Executability: "Partially Executable - Possible Overreporting"
Scope:
  Domains:
    Exclude:
    - "TV"
Requirements:
  Variables:
    All:
    - "VISITNUM"
    - "TV.VISITNUM"
Match_Datasets:
- Join_Type: "left"
  Keys:
  - "USUBJID"
  - "VISITNUM"
  Name: "SV"
Bindings:
- name: "$tv_visitnum"
  expression: "distinct(VISITNUM, domain=\"TV\")"
Check:
  expression: >-
    not empty(VISITNUM) and (var_exists(SV.SVPRESP) and SV.SVPRESP == "Y" or not
    var_exists(SV.SVPRESP) and empty(SV.SVUPDES) and not contains(upper(VISIT), "UNSCHEDUL") and not
    contains(upper(VISIT), "UNPLAN")) and VISITNUM not in $tv_visitnum
Outcome:
  Message: "VISITNUM for a visit determined to be planned — SV.SVPRESP is \"Y\", or\
    \ SV carries no SVPRESP column and the visit has no unplanned-visit description\
    \ and no unscheduled/unplanned name marker — does not match any VISITNUM value\
    \ in the TV dataset."
  Output_Variables:
  - "VISITNUM"
  - "SV.SVPRESP"
  - "SV.SVUPDES"
  - "$tv_visitnum"
Source:
  Class: "ALL"
  Domain: "ALL"
  Variable: "VISITNUM"
  Condition: "VISITNUM ^= null and is planned"
  Rule: "VISITNUM in TV.VISITNUM"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "SDTMIG"
    Version: "3.4"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0033"
        Version: "2"
      Version: "2.0"
  - Name: "SDTMIG"
    Version: "3.3"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0033"
        Version: "2"
      Version: "2.0"
  - Name: "SDTMIG"
    Version: "3.2"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0033"
        Version: "2"
      Version: "2.0"
