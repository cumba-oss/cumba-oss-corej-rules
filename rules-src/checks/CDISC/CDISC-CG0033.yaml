Core:
  Id: "CDISC-CG0033"
  Status: "Published"
  Version: "1"
Description: "Raise an error when VISITNUM is populated for a planned visit but its\
  \ value does not match any VISITNUM value in the Trial Visits (TV) dataset. A visit\
  \ is treated as planned when the Subject Visits (SV) dataset flags it as pre-specified\
  \ (SVPRESP equals 'Y'); when SVPRESP is not present, every populated VISITNUM is\
  \ checked against TV.VISITNUM."
Executability: "Partially Executable - Possible Overreporting"
Scope:
  Domains:
    Exclude:
    - "TV"
Requirements:
  Variables:
    All:
    - "VISITNUM"
Match_Datasets:
- Join_Type: "left"
  Keys:
  - "USUBJID"
  - "VISITNUM"
  Name: "SV"
Operations:
- id: "$tv_visitnum"
  expression: "distinct(VISITNUM, domain=\"TV\")"
Check:
  expression: >-
    var_exists(TV.VISITNUM) and not empty(VISITNUM) and (not var_exists(SV.SVPRESP) or SV.SVPRESP ==
    "Y") and VISITNUM not in $tv_visitnum
Outcome:
  Message: "VISITNUM for a planned visit does not match any VISITNUM value in the\
    \ TV dataset."
  Output_Variables:
  - "VISITNUM"
  - "SV.SVPRESP"
  - "$tv_visitnum"
Source:
  Class: "ALL"
  Domain: "ALL"
  Variable: "VISITNUM"
  Condition: "VISITNUM ^= null and is planned"
  Rule: "VISITNUM in TV.VISITNUM"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "SDTMIG"
    Version: "3.4"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0033"
        Version: "2"
      Version: "2.0"
  - Name: "SDTMIG"
    Version: "3.3"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0033"
        Version: "2"
      Version: "2.0"
  - Name: "SDTMIG"
    Version: "3.2"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0033"
        Version: "2"
      Version: "2.0"
