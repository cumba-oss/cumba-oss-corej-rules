Core:
  Id: "CDISC-AD0025"
  Status: "Published"
  Version: "1"
Description: "Raise an error when ENRLFL is populated with a value that is not Y or\
  \ N"
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "SUBJECT LEVEL ANALYSIS DATASET"
Requirements:
  Variables:
    All:
    - "ENRLFL"
Check:
  expression: >-
    not empty(ENRLFL) and ENRLFL not in ["Y", "N"]
Outcome:
  Message: "ENRLFL has a value other than Y or N"
Source:
  Class: "SUBJECT LEVEL ANALYSIS DATASET"
  Variable_or_Item: "ENRLFL"
  Natural_Language_Rule_Failure_Criteria: "ENRLFL is present and has a value that\
    \ is not Y or N"
  Rule_Failure_Criteria: "Value is not Y or N"
  Condition_Failure: "ENRLFL is present"
