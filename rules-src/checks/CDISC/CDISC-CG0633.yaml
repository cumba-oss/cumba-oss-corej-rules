Core:
  Id: "CDISC-CG0633"
  Status: "Published"
  Version: "1"
Description: "Raise an error when RPPLSTDY is present in a dataset, because this variable\
  \ is not permitted in human clinical trials."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "ALL"
Check:
  expression: >-
    var_exists("RPPLSTDY")
Outcome:
  Message: "RPPLSTDY is present but is not permitted in human clinical trials."
  Output_Variables:
  - "RPPLSTDY"
Source:
  Class: "ALL"
  Variable: "RPPLSTDY"
  Rule: "RPPLSTDY not present in dataset"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "SDTMIG"
    Version: "3.4"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0633"
        Version: "1"
      Version: "2.0"
