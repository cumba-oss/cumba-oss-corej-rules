Core:
  Id: "CDISC-AD0077"
  Status: "Published"
  Version: "1"
Description: "Raise an error when TRTxxP and TRTxxPN are both populated and there\
  \ is more than one value of TRTxxP for a given value of TRTxxPN"
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "SUBJECT LEVEL ANALYSIS DATASET"
Check:
  expression: >-
    not empty(TRTxxP) and not empty(TRTxxPN) and has_multiple_values_for(TRTxxP, TRTxxPN)
Outcome:
  Message: "More than one value of TRTxxP was found for the same value of TRTxxPN"
  Output_Variables:
  - "TRTxxP"
  - "TRTxxPN"
wildcards:
  xx:
    min: 1
    max: 99
Source:
  Class: "SUBJECT LEVEL ANALYSIS DATASET"
  Variable_or_Item: "TRTxxP where xx is an integer [01-99, zero-padded]"
  Natural_Language_Rule_Failure_Criteria: "There is more than one value of TRTxxP\
    \ for a given value of TRTxxPN"
  Rule_Failure_Criteria: "There is more than one value of TRTxxP for a given value\
    \ of TRTxxPN"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.0"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR77"
        Version: "1"
      Version: "5.0"
