Core:
  Id: "CDISC-SEND-0156"
  Status: "Published"
  Version: "1"
Description: "Raise an error when more than one Clinical Observations (CL) record\
  \ exists for the same combination of Test Short Name (CLTESTCD), subject or pool\
  \ (USUBJID/POOLID), standardized finding (CLSTRESC), and observation time (CLDTC);\
  \ the domain should hold one record per finding per observation time per subject\
  \ or pool."
Executability: "Partially Executable - Possible Overreporting"
Scope:
  Domains:
    Include:
    - "CL"
Check:
  expression: >-
    not is_unique_set([CLTESTCD, USUBJID, POOLID, CLSTRESC, CLDTC])
Outcome:
  Message: "More than one CL record exists for the same finding (CLTESTCD/CLSTRESC),\
    \ subject or pool (USUBJID/POOLID), and observation time (CLDTC)."
Source:
  Class: "FND"
  Domain: "CL"
  Variable: "ALL"
  Plain_Text_Explanation: "One record per finding per observation time per subject\
    \ or pool."
  Rule: "One record per finding per observation time per subject or pool."
