Core:
  Id: "CDISC-AD0378"
  Status: "Published"
  Version: "2"
Description: "Raise an error when, on a given record, TRTxxPN is populated and TRTxxP\
  \ is empty"
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "SUBJECT LEVEL ANALYSIS DATASET"
Check:
  expression: >-
    not empty(TRTxxPN) and empty(TRTxxP)
Outcome:
  Message: "On this record, TRTxxPN is populated, but TRTxxP is empty."
  Output_Variables:
  - "TRTxxP"
  - "TRTxxPN"
wildcards:
  xx:
    min: 1
    max: 99
Source:
  Class: "SUBJECT LEVEL ANALYSIS DATASET"
  Variable_or_Item: "TRTxxP where xx is an integer [01-99, zero-padded]"
  Natural_Language_Rule_Failure_Criteria: "On a given record, TRTxxPN is populated\
    \ and TRTxxP is not populated"
  Rule_Failure_Criteria: "On a given record, TRTxxPN is populated and TRTxxP is not\
    \ populated"
  Condition_Failure: "TRTxxPN and TRTxxP are present"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.2"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR378"
        Version: "2"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.3"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR378"
        Version: "2"
      Version: "5.0"
