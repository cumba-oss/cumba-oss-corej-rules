Core:
  Id: "CDISC-CG0648"
  Status: "Published"
  Version: "1"
Description: "Raise an error when the TP dataset is present."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "TP"
Check:
  expression: >-
    ds_exists("TP")
Outcome:
  Message: "TP dataset must not be present."
Source:
  Class: "TDM"
  Domain: "TP"
  Rule: "TP dataset not present"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "SDTMIG"
    Version: "3.4"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0648"
        Version: "1"
      Version: "2.0"
