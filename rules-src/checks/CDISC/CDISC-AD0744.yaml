Core:
  Id: "CDISC-AD0744"
  Status: "Published"
  Version: "1"
Description: "Raise an error when BASETYPE and BTOXGR are both populated and BTOXGR\
  \ does not equal ATOXGR from the record where ABLFL equals Y, for a given value\
  \ of PARAMCD and BASETYPE, for a subject"
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "BASIC DATA STRUCTURE"
Bindings:
- name: "$baseline_atoxgr"
  expression: "max(ATOXGR, group=[USUBJID, PARAMCD, BASETYPE], filter=filter(ABLFL=\"\
    Y\"))"
Check:
  expression: >-
    not empty(BASETYPE) and not empty(BTOXGR) and BTOXGR != $baseline_atoxgr
Outcome:
  Message: "BTOXGR does not equal the baseline ATOXGR from the record where ABLFL\
    \ equals Y for this subject's PARAMCD and BASETYPE"
  Output_Variables:
  - "PARAMCD"
  - "BASETYPE"
  - "BTOXGR"
Source:
  Class: "BASIC DATA STRUCTURE"
  Variable_or_Item: "BTOXGR"
  Natural_Language_Rule_Failure_Criteria: "BASETYPE is populated, BTOXGR is populated,\
    \ and BTOXGR is not equal to ATOXGR where ABLFL is equal to Y for a given value\
    \ of PARAMCD and BASETYPE for a subject"
  Rule_Failure_Criteria: "BTOXGR is not equal to ATOXGR where ABLFL is equal to Y\
    \ for a given value of PARAMCD and BASETYPE"
  Condition_Failure: "BASETYPE is populated and BTOXGR is populated"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.3"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR744"
        Version: "1"
      Version: "5.0"
