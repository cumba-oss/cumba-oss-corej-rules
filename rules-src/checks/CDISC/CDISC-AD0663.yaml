Core:
  Id: "CDISC-AD0663"
  Status: "Published"
  Version: "1"
Description: "Raise an error when, on a record in an ADNCA v1.0 dataset, COHORTN is\
  \ populated and COHORT is not populated."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "BASIC DATA STRUCTURE"
  Subclasses:
    Include:
    - "NON-COMPARTMENTAL ANALYSIS"
Check:
  expression: >-
    not empty(COHORTN) and empty(COHORT)
Outcome:
  Message: "On a given record, COHORTN is populated and COHORT is not populated"
Source:
  Class: "BASIC DATA STRUCTURE"
  Subclass: "NON-COMPARTMENTAL ANALYSIS"
  Variable_or_Item: "COHORT"
  Natural_Language_Rule_Failure_Criteria: "On a given record, COHORTN is populated\
    \ and COHORT is not populated"
  Rule_Failure_Criteria: "COHORT is not populated"
  Condition_Failure: "COHORTN is populated"
