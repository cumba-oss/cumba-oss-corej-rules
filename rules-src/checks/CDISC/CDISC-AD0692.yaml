Core:
  Id: "CDISC-AD0692"
  Status: "Published"
  Version: "1"
Description: "Raise an error when, within a given value of PARAMCD for a combination\
  \ of device and subject, BASEC is populated but no record has ABLFL equal to 'Y'."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "MEDICAL DEVICE BASIC DATA STRUCTURE"
Requirements:
  Variables:
    All:
    - "BASEC"
Grouping:
  Variables:
  - "USUBJID"
  - "PARAMCD"
  - "SPDEVID"
Bindings:
- name: "$ablfl_y_count"
  expression: "record_count(ABLFL, group=[USUBJID, PARAMCD, SPDEVID], filter=filter(ABLFL=\"\
    Y\"))"
Check:
  expression: >-
    not empty(BASEC) and $ablfl_y_count == 0
Outcome:
  Message: "BASEC is populated for this PARAMCD, device, and subject combination,\
    \ but no record has ABLFL equal to 'Y'."
  Output_Variables:
  - "PARAMCD"
  - "BASEC"
  - "ABLFL"
Source:
  Class: "MEDICAL DEVICE BASIC DATA STRUCTURE"
  Natural_Language_Rule_Failure_Criteria: "Within a given value of PARAMCD for a combination\
    \ of device and subject, BASEC is populated and there is not at least one record\
    \ with ABLFL equal to Y"
  Rule_Failure_Criteria: "Within a given value of PARAMCD for a combination of device\
    \ and subject, there is not at least one record with ABLFL equal to Y"
  Condition_Failure: "USUBJID and SPDEVID are present and BASEC is populated"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.3"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR692"
        Version: "1"
      Version: "5.0"
