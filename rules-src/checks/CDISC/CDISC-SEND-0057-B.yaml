Core:
  Id: "CDISC-SEND-0057-B"
  Status: "Published"
  Version: "1"
Description: "Raise an error when a combined --PORTOT value, whose terms are separated\
  \ by a semicolon (;), contains a token that is not a submission value in the (PORTOT)\
  \ controlled terminology codelist."
Executability: "Fully Executable"
Scope:
  Classes:
    Include:
    - "FINDINGS"
Bindings:
- name: "$portot_terms"
  expression: "codelist_terms(codelists=[\"PORTOT\"], level=\"term\", returntype=\"\
    value\")"
Check:
  expression: >-
    not empty(--PORTOT) and contains(--PORTOT, ";") and not contains_all($portot_terms,
    split_by(--PORTOT, ";"))
Outcome:
  Message: "A semicolon-separated --PORTOT token is not a submission value in the\
    \ (PORTOT) controlled terminology codelist."
Source_Proposed:
  Sheet_Issue: "#233"
  Class: "ALL"
  Domain: "ALL"
  Variable: "--PORTOT"
  Plain_Text_Explanation: "When a --PORTOT value comprises multiple individual values,\
    \ each contributing value must be included as its (PORTOT) controlled terminology\
    \ submission value, and delimited from other terms by a semicolon."
  Condition: "A --PORTOT value is composed of multiple individual values and CDISC\
    \ published Controlled Terminology applies to the value"
  Rule: "Multiple individual --PORTOT values are separated by \";\""
Source:
  Class: "ALL"
  Domain: "ALL"
  Variable: "ALL"
  Plain_Text_Explanation: "In some cases, a variable value may comprise multiple individual\
    \ values. In these cases, each contributing value is a separately collected or\
    \ analyzed item...In these scenarios, when controlled terminology applies to the\
    \ corresponding variable, each contributing value must be included as its controlled\
    \ terminology submission value, and delimited from other terms by a semicolon."
  Condition: "A variable value is composed of multiple individual values and CDISC\
    \ published Controlled Terminology applies to the value"
  Rule: "Multiple individual values are separated by \";\""
