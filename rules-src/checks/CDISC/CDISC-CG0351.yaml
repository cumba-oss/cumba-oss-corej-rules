Core:
  Id: "CDISC-CG0351"
  Status: "Published"
  Version: "1"
Description: "Raise an error when a variable in an observation-class dataset is neither\
  \ listed in the SDTM Model list of allowed variables for that observation class\
  \ nor in the IG's variable list for the dataset."
Executability: "Partially Executable - Possible Underreporting"
Scope:
  Classes:
    Include:
    - "EVENTS"
    - "FINDINGS"
    - "INTERVENTIONS"
Bindings:
- name: "$model_variables"
  expression: "get_model_column_order()"
- name: "$ig_variables"
  expression: "get_dataset_filtered_variables()"
Check:
  expression: >-
    upper(varname()) not in $model_variables and upper(varname()) not in $ig_variables
Outcome:
  Message: "The variable is in neither the SDTM Model list of allowed variables for\
    \ the observation class nor the IG variable list for the dataset, and should be\
    \ in the Supplemental Qualifiers (SUPPQUAL) dataset."
  Output_Variables:
  - "$model_variables"
  - "$ig_variables"
Source:
  Class: "ALL"
  Domain: "ALL"
  Variable: "GEN"
  Rule: "Variables not in Model List of Allowed Variables for Observation Class are\
    \ in SUPPQUAL"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "SDTMIG"
    Version: "3.4"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0351"
        Version: "1"
      Version: "2.0"
  - Name: "SDTMIG"
    Version: "3.3"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0351"
        Version: "1"
      Version: "2.0"
  - Name: "SDTMIG"
    Version: "3.2"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0351"
        Version: "1"
      Version: "2.0"
