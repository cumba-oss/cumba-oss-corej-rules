Core:
  Id: "CDISC-CG0351"
  Status: "Published"
  Version: "1"
Description: "Raise an error when a variable in an observation-class dataset is not\
  \ listed in the SDTM Model list of allowed variables for that observation class."
Executability: "Partially Executable - Possible Underreporting"
Scope:
  Classes:
    Include:
    - "EVENTS"
    - "FINDINGS"
    - "INTERVENTIONS"
Bindings:
- name: "$allowed_variables"
  expression: "get_model_column_order()"
Check:
  expression: >-
    varname() not in $allowed_variables
Outcome:
  Message: "The variable is not listed in the SDTM Model list of allowed variables\
    \ for the observation class and should be in the Supplemental Qualifiers (SUPPQUAL)\
    \ dataset."
  Output_Variables:
  - "variable_name"
  - "$allowed_variables"
Source:
  Class: "ALL"
  Domain: "ALL"
  Variable: "GEN"
  Rule: "Variables not in Model List of Allowed Variables for Observation Class are\
    \ in SUPPQUAL"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "SDTMIG"
    Version: "3.4"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0351"
        Version: "1"
      Version: "2.0"
  - Name: "SDTMIG"
    Version: "3.3"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0351"
        Version: "1"
      Version: "2.0"
  - Name: "SDTMIG"
    Version: "3.2"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0351"
        Version: "1"
      Version: "2.0"
