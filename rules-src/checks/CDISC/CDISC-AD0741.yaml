Core:
  Id: "CDISC-AD0741"
  Status: "Published"
  Version: "1"
Description: "Raise an error when, within a dataset, there is more than one value\
  \ of PARAMN for a given value of PARAM, considering only rows on which both variables\
  \ are populated"
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "BASIC DATA STRUCTURE"
Check:
  expression: >-
    not empty(PARAM) and not empty(PARAMN) and has_multiple_values_for(PARAMN, PARAM)
Outcome:
  Message: "PARAMN has more than one value for this PARAM within this dataset, among\
    \ rows where both are populated"
Source:
  Class: "BASIC DATA STRUCTURE; MEDICAL DEVICE BASIC DATA STRUCTURE"
  Variable_or_Item: "PARAMN"
  Natural_Language_Rule_Failure_Criteria: "Within a dataset, there is more than one\
    \ value of PARAMN for a given value of PARAM, considering only those rows on which\
    \ both variables are populated"
  Rule_Failure_Criteria: "Within a dataset, there is more than one value of PARAMN\
    \ for a given value of PARAM"
  Condition_Failure: "On rows where PARAMN and PARAM are both populated"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.1"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR741"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
