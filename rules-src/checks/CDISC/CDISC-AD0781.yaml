Core:
  Id: "CDISC-AD0781"
  Status: "Published"
  Version: "1"
Description: "Raise an error when there is more than one value of AETOXGR for a given\
  \ value of AETOXGRN, considering only rows on which both variables are populated"
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "OCCURRENCE DATA STRUCTURE"
    - "MEDICAL DEVICE OCCURRENCE DATA STRUCTURE"
Check:
  expression: >-
    not empty(AETOXGR) and not empty(AETOXGRN) and has_multiple_values_for(AETOXGR, AETOXGRN)
Outcome:
  Message: "AETOXGR takes more than one value for the same value of AETOXGRN, considering\
    \ only rows on which both variables are populated."
Source:
  Class: "OCCURRENCE DATA STRUCTURE; MEDICAL DEVICE OCCURRENCE DATA STRUCTURE"
  Variable_or_Item: "AETOXGR"
  Natural_Language_Rule_Failure_Criteria: "There is more than one value of AETOXGR\
    \ for a given value of AETOXGRN, considering only those rows on which both variables\
    \ are populated"
  Rule_Failure_Criteria: "There is more than one value of AETOXGR for a given value\
    \ of AETOXGRN"
  Condition_Failure: "On rows where both AETOXGR and AETOXGRN are both populated."
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.1"
    References:
