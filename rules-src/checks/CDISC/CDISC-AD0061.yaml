Core:
  Id: "CDISC-AD0061"
  Status: "Published"
  Version: "1"
Description: "Raise an error when SDTM.EX is present and neither TRTSDT nor TRTSDTM\
  \ is present"
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "SUBJECT LEVEL ANALYSIS DATASET"
Requirements:
  Datasets:
  - "EX"
Bindings:
- name: "$TRTSDT_EXISTS"
  expression: "var_exists(\"TRTSDT\")"
- name: "$TRTSDTM_EXISTS"
  expression: "var_exists(\"TRTSDTM\")"
Check:
  expression: >-
    $TRTSDT_EXISTS == false and $TRTSDTM_EXISTS == false
Outcome:
  Message: "SDTM.EX is present, but ADSL contains neither TRTSDT nor TRTSDTM"
Source:
  Class: "SUBJECT LEVEL ANALYSIS DATASET"
  Variable_or_Item: "TRTSDT; TRTSDTM"
  Natural_Language_Rule_Failure_Criteria: "SDTM.EX is present and neither TRTSDT or\
    \ TRTSDTM are present"
  Rule_Failure_Criteria: "Neither TRTSDT or TRTSDTM are present"
  Condition_Failure: "SDTM.EX is present"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.0"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR61"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.1"
    References:
