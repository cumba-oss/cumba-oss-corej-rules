Core:
  Id: "CDISC-CG0415"
  Status: "Published"
  Version: "1"
Description: "Raise an error when a Trial Arms (TA) record has a Planned Arm Code\
  \ (ARMCD) of 'SCRNFAIL' or 'NOTASSGN', which are not valid planned arm codes."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "TA"
Requirements:
  Variables:
    All:
    - "ARMCD"
Check:
  expression: >-
    upper(ARMCD) in ["SCRNFAIL", "NOTASSGN"]
Outcome:
  Message: "ARMCD is 'SCRNFAIL' or 'NOTASSGN', which is not a valid planned arm code."
Source:
  Class: "TDM"
  Domain: "TA"
  Variable: "ARMCD"
  Rule: "ARMCD is a valid planned arm code"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "SDTMIG"
    Version: "3.4"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0415"
        Version: "1"
      Version: "2.0"
  - Name: "SDTMIG"
    Version: "3.3"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0415"
        Version: "1"
      Version: "2.0"
  - Name: "SDTMIG"
    Version: "3.2"
