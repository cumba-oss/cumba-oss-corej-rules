Core:
  Id: "CDISC-AD0761"
  Status: "Published"
  Version: "1"
Description: "Raise an error when there is more than one value of TRxxAGyN for a given\
  \ value of TRxxAGy, where xx is an integer [01-99, zero-padded] and y is an integer\
  \ [1-99, not zero-padded], considering only rows on which both variables are populated"
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "SUBJECT LEVEL ANALYSIS DATASET"
Check:
  expression: >-
    not empty(TRxxAGyN) and not empty(TRxxAGy) and has_multiple_values_for(TRxxAGyN, TRxxAGy)
Outcome:
  Message: "TRxxAGyN has more than one value for this TRxxAGy, among rows where both\
    \ are populated"
  Output_Variables:
  - "TRxxAGy"
  - "TRxxAGyN"
wildcards:
  xx:
    min: 1
    max: 99
  "y":
    min: 1
    max: 99
Source:
  Class: "SUBJECT LEVEL ANALYSIS DATASET"
  Variable_or_Item: "TRxxAGyN where xx is an integer [01-99, zero-padded] and y is\
    \ an integer [1-9, not zero-padded]"
  Natural_Language_Rule_Failure_Criteria: "There is more than one value of TRxxAGyN\
    \ for a given value of TRxxAGy, where xx is an integer [01-99, zero-padded] and\
    \ y is a single-digit integer [1-9], considering only those rows on which both\
    \ variables are populated"
  Rule_Failure_Criteria: "There is more than one value of TRxxAGyN for a given value\
    \ of TRxxAGy"
  Condition_Failure: "On rows where TRxxAGyN and TRxxAGy are both populated"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.1"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
