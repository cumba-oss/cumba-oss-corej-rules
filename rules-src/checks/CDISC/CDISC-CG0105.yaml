Core:
  Id: "CDISC-CG0105"
  Status: "Published"
  Version: "1"
Description: "Raise an error when the EC domain is present and Treatment Vehicle Amount\
  \ (EXVAMT) is present in the EX dataset."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "EX"
Requirements:
  Datasets:
  - "EC"
Operations:
- id: "$exvamt_exists"
  expression: "variable_exists(EXVAMT)"
Check:
  expression: >-
    $exvamt_exists == true
Outcome:
  Message: "EXVAMT is present in the EX dataset when the EC domain is present."
  Output_Variables:
  - "$exvamt_exists"
Source:
  Class: "INT"
  Domain: "EX"
  Variable: "EXVAMT"
  Condition: "EC domain is present"
  Rule: "EXVAMT not present in dataset"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "SDTMIG"
    Version: "3.4"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0105"
        Version: "1"
      Version: "2.0"
  - Name: "SDTMIG"
    Version: "3.3"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0105"
        Version: "1"
      Version: "2.0"
  - Name: "SDTMIG"
    Version: "3.2"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0105"
        Version: "1"
      Version: "2.0"
