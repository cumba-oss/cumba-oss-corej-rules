Core:
  Id: "CDISC-AD0852"
  Status: "Published"
  Version: "1"
Description: "Raise an error when, considering only rows on which both ROUTEN and\
  \ ROUTE are populated, more than one value of ROUTEN is present within the dataset\
  \ for a given value of ROUTE."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "BASIC DATA STRUCTURE"
Check:
  expression: >-
    not empty(ROUTE) and not empty(ROUTEN) and has_multiple_values_for(ROUTEN, ROUTE)
Outcome:
  Message: "More than one value of ROUTEN is present for this value of ROUTE within\
    \ the dataset."
Source:
  Class: "BASIC DATA STRUCTURE"
  Subclass: "POPULATION PHARMACOKINETIC ANALYSIS"
  Variable_or_Item: "ROUTEN"
  Natural_Language_Rule_Failure_Criteria: "Within a dataset, there is more than one\
    \ value of ROUTEN for a given value of ROUTE, considering only those rows on which\
    \ both variables are populated."
  Rule_Failure_Criteria: "Within a dataset, there is more than one value of ROUTEN\
    \ for a given value of ROUTE"
  Condition_Failure: "On rows where both ROUTEN and ROUTE are both populated"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.3"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR852"
        Version: "1"
      Version: "5.0"
