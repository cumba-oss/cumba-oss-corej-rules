Core:
  Id: "CDISC-AD0109"
  Status: "Published"
  Version: "1"
Description: "Raise an error when, within a given value of PARAMCD, there is more\
  \ than one value of AVISITN for a given value of AVISIT."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "BASIC DATA STRUCTURE"
Requirements:
  Variables:
    All:
    - "AVISIT"
    - "AVISITN"
Check:
  expression: >-
    has_multiple_values_for(AVISITN, AVISIT, within=PARAMCD)
Outcome:
  Message: "AVISITN has more than one value for this PARAMCD and AVISIT."
Source:
  Class: "BASIC DATA STRUCTURE"
  Variable_or_Item: "AVISITN"
  Natural_Language_Rule_Failure_Criteria: "Within a given value of PARAMCD, there\
    \ is more than one value of AVISITN for a given value of AVISIT"
  Rule_Failure_Criteria: "Within a given value of PARAMCD, there is more than one\
    \ value of AVISITN for a given value of AVISIT"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.0"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR109"
        Version: "1"
      Version: "5.0"
