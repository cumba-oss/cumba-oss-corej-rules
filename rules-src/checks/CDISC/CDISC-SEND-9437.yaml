Core:
  Id: "CDISC-SEND-9437"
  Status: "Published"
  Version: "1"
Description: "Raise an error when the Reason Not Done (--REASND) variable is not present\
  \ in the dataset although a record reports its Completion Status (--STAT) as \"\
  NOT DONE\"."
Sensitivity: "Dataset"
Executability: "Partially Executable - Possible Overreporting"
Scope:
  Domains:
    Include:
    - "LB"
    - "MI"
Requirements:
  Variables:
    None:
    - "--REASND"
    All:
    - "--STAT"
Check:
  expression: >-
    --STAT == "NOT DONE"
Outcome:
  Message: "--REASND is not present in the dataset although --STAT is equal to \"\
    NOT DONE\"."
  Output_Variables:
  - "--STAT"
Source_Proposed:
  Sheet_Issue: "#201"
  Class: "FND"
  Domain: "LB, MI"
  Variable: "--REASND"
  Plain_Text_Explanation: "Whenever --STAT is \"NOT DONE\", the --REASND variable\
    \ should be present in the dataset so it can provide the reason for not completing\
    \ the evaluation as scheduled in the study plan"
  Condition: "LBSTAT (OR MISTAT) = \"NOT DONE\""
  Rule: "--REASND variable is present in the dataset"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "SENDIG-GENETOX"
    Version: "1.0"
  - Name: "SENDIG-DART"
    Version: "1.2"
  - Name: "SENDIG-DART"
    Version: "1.1"
  - Name: "SENDIG"
    Version: "3.1.1"
  - Name: "SENDIG"
    Version: "3.1"
  - Name: "SENDIG"
    Version: "3.0"
