Core:
  Id: "CDISC-SEND-0175"
  Status: "Published"
  Version: "1"
Description: "Raise an error when more than one Macroscopic Findings (MA) record exists\
  \ for the same combination of Test Short Name (MATESTCD), Unique Subject Identifier\
  \ (USUBJID), specimen (MASPEC), standardized finding (MASTRESC), laterality (MALAT),\
  \ directionality (MADIR), and anatomical region (MAANTREG); the domain should hold\
  \ one record per finding per specimen per subject."
Executability: "Partially Executable - Possible Overreporting"
Scope:
  Domains:
    Include:
    - "MA"
Check:
  expression: >-
    not is_unique_set([MATESTCD, USUBJID, MASPEC, MASTRESC, MALAT, MADIR, MAANTREG])
Outcome:
  Message: "More than one MA record exists for the same finding (MATESTCD/MASTRESC),\
    \ subject (USUBJID), and specimen (MASPEC)."
Source:
  Class: "FND"
  Domain: "MA"
  Variable: "ALL"
  Plain_Text_Explanation: "One record per finding per specimen per subject"
  Rule: "One record per finding per specimen per subject"
