Core:
  Id: "CDISC-AD0112"
  Status: "Published"
  Version: "2"
Description: "Raise an error when ARELTM is populated and ARELTMU is not populated."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "BASIC DATA STRUCTURE"
Requirements:
  Variables:
    All:
    - "ARELTM"
    - "ARELTMU"
Check:
  expression: >-
    not empty(ARELTM) and empty(ARELTMU)
Outcome:
  Message: "ARELTM is populated, but ARELTMU is not populated."
Source:
  Class: "BASIC DATA STRUCTURE; MEDICAL DEVICE BASIC DATA STRUCTURE"
  Variable_or_Item: "ARELTMU"
  Natural_Language_Rule_Failure_Criteria: "ARELTM is populated and ARELTMU is not\
    \ populated"
  Rule_Failure_Criteria: "ARELTMU is not populated"
  Condition_Failure: "ARELTM is populated"
