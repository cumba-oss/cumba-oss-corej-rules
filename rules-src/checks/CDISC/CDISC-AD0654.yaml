Core:
  Id: "CDISC-AD0654"
  Status: "Published"
  Version: "1"
Description: "Raise an error when SRCSEQ is present in an ADVERSE EVENT sub-class\
  \ OCCDS dataset (e.g., ADAE); SRCSEQ must not be used for the AE sub-class (AESEQ\
  \ replaces SRCDOM+SRCSEQ per OCCDS v1.1)."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "OCCURRENCE DATA STRUCTURE"
  Subclasses:
    Include:
    - "ADVERSE EVENT"
Check:
  expression: >-
    var_exists("SRCSEQ")
Outcome:
  Message: "SRCSEQ is present"
  Output_Variables:
  - "SRCSEQ"
Source:
  Class: "OCCURRENCE DATA STRUCTURE"
  Subclass: "ADVERSE EVENT"
  Variable_or_Item: "SRCSEQ"
  Natural_Language_Rule_Failure_Criteria: "SRCSEQ is present"
  Rule_Failure_Criteria: "SRCSEQ is present"
