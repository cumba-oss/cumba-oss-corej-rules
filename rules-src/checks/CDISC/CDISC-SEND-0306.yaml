Core:
  Id: "CDISC-SEND-0306"
  Status: "Published"
  Version: "1"
Description: "Raise an error when the Date/Time of Last Study Treatment (RFXENDTC)\
  \ is populated for a subject with Exposure (EX) records but equals neither the latest\
  \ End Date/Time of Treatment (EXENDTC) nor the latest Start Date/Time of Treatment\
  \ (EXSTDTC) for that subject, over the subject's own EX records and the EX records\
  \ of every pool POOLDEF assigns it to."
Executability: "Partially Executable - Possible Underreporting"
ExecutabilityHint:
  Category: "partially executable"
  Detail: "EX rows recorded per pool (POOLID, USUBJID blank) are read through POOLDEF\
    \ for every pool the subject belongs to; when the latest EXENDTC or the latest\
    \ EXSTDTC of the subject's own EX records or of any of its pools cannot be determined\
    \ (a partial or unreadable date, or a blank EXENDTC within a pool's or the subject's\
    \ own records) while another can, the latest of those that can is taken as RFXENDTC's\
    \ reference, so the rule may be silent where the latest over all of them would\
    \ be reported. A POOLID typed differently in EX and POOLDEF, or a USUBJID typed\
    \ differently in DM and POOLDEF (Char against Num), makes the rule ERROR; in a\
    \ CSV or XLSX study the type is inferred from the data, and a column blank in\
    \ every row reads as Char from CSV but as Num from XLSX (e.g. an empty EX POOLID\
    \ in an XLSX study beside character POOLDEF pool IDs such as POOL1)."
Scope:
  Domains:
    Include:
    - "DM"
Requirements:
  Variables:
    All:
    - "RFXENDTC"
    - "USUBJID"
Bindings:
- name: "$ex_subjects"
  expression: "distinct(USUBJID, domain=\"EX\")"
- name: "$latest_exendtc"
  expression: "max_date(EXENDTC, domain=\"EX\", missing_values=\"indeterminate\",\
    \ group=[USUBJID])"
- name: "$latest_exstdtc"
  expression: "max_date(EXSTDTC, domain=\"EX\", group=[USUBJID])"
- name: "$pool_latest_exendtc"
  expression: "max_date(max_date(EXENDTC, domain=\"EX\", missing_values=\"indeterminate\"\
    , group=[POOLID], filter=(not empty(POOLID))), domain=\"POOLDEF\", group=[USUBJID])"
- name: "$pool_latest_exstdtc"
  expression: "max_date(max_date(EXSTDTC, domain=\"EX\", group=[POOLID], filter=(not\
    \ empty(POOLID))), domain=\"POOLDEF\", group=[USUBJID])"
- name: "$pool_ex_rows"
  expression: "max(record_count(domain=\"EX\", group=[POOLID], filter=(not empty(POOLID))),\
    \ domain=\"POOLDEF\", group=[USUBJID])"
- name: "$last_exendtc"
  expression: "latest_date($latest_exendtc, $pool_latest_exendtc)"
- name: "$last_exstdtc"
  expression: "latest_date($latest_exstdtc, $pool_latest_exstdtc)"
Check:
  expression: >-
    not empty(RFXENDTC) and (USUBJID in $ex_subjects or $pool_ex_rows > 0) and date(RFXENDTC) !=
    $last_exendtc and date(RFXENDTC) != $last_exstdtc
Outcome:
  Message: "RFXENDTC is populated but does not equal the latest EXENDTC or the latest\
    \ EXSTDTC over the subject's own EX records and the EX records of every pool POOLDEF\
    \ assigns it to."
  Output_Variables:
  - "RFXENDTC"
  - "$last_exendtc"
  - "$last_exstdtc"
  - "$latest_exendtc"
  - "$latest_exstdtc"
  - "$pool_latest_exendtc"
  - "$pool_latest_exstdtc"
  - "$ex_subjects"
  - "$pool_ex_rows"
Source:
  Class: "SPC"
  Domain: "DM"
  Variable: "RFXENDTC"
  Plain_Text_Explanation: "If RFXENDTC is populated it is equal to the latest (i.e.,\
    \ absolute last) value of EXENDTC.  If EXENDTC is not populated RFXENDTC is equal\
    \ to the latest (i.e., absolute last) value of EXSTDTC if EXENDTC was not collected\
    \ or is missing."
  Condition: "RFXENDTC ^= null"
  Rule: "RFXENDTC value = date/time of absolute latest value of test article exposure\
    \ (as represented in EXENDTC or EXSTDTC for that subject)."
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "SENDIG-GENETOX"
    Version: "1.0"
    References:
