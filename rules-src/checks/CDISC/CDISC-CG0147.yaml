Core:
  Id: "CDISC-CG0147"
  Status: "Published"
  Version: "1"
Description: "Raise an error when Exposure (EX) records are present for a subject,\
  \ but the Subject Reference End Date/Time (RFXENDTC) in the Demographics (DM) domain\
  \ does not equal the latest Exposure Start Date/Time (EXSTDTC) or the latest Exposure\
  \ End Date/Time (EXENDTC) in the EX domain for that subject."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "DM"
Requirements:
  Variables:
    All:
    - "USUBJID"
Bindings:
- name: "$ex_usubjid"
  expression: "distinct(USUBJID, domain=\"EX\")"
- name: "$max_ex_exstdtc"
  expression: "max_date(EXSTDTC, domain=\"EX\", group=[USUBJID])"
- name: "$max_ex_exendtc"
  expression: "max_date(EXENDTC, domain=\"EX\", missing_values=\"indeterminate\",\
    \ group=[USUBJID])"
Check:
  expression: >-
    USUBJID in $ex_usubjid and RFXENDTC != $max_ex_exstdtc and RFXENDTC != $max_ex_exendtc
Outcome:
  Message: "RFXENDTC does not equal the latest value of EXSTDTC or EXENDTC in the\
    \ EX dataset for the subject."
  Output_Variables:
  - "$ex_usubjid"
Source:
  Class: "SPC"
  Domain: "DM"
  Variable: "RFXENDTC"
  Condition: "EX records present for subject"
  Rule: "RFXENDTC = latest value of EX.EXSTDTC or EX.EXENDTC"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "SDTMIG"
    Version: "3.4"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0147"
        Version: "1"
      Version: "2.0"
  - Name: "SDTMIG"
    Version: "3.3"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0147"
        Version: "1"
      Version: "2.0"
  - Name: "SDTMIG"
    Version: "3.2"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0147"
        Version: "1"
      Version: "2.0"
