Core:
  Id: "CDISC-CG0013"
  Status: "Published"
  Version: "1"
Description: "Raise an error when a variable present in a dataset is neither among\
  \ the variables permitted by the SDTM Model list of allowed variables for the dataset's\
  \ general observation class nor in the IG's variable list for the dataset."
Executability: "Partially Executable - Possible Underreporting"
Scope:
  Domains:
    Exclude:
    - "CO"
    - "DM"
    - "SE"
    - "SV"
Bindings:
- name: "$model_variables"
  expression: "get_model_column_order()"
- name: "$ig_variables"
  expression: "get_dataset_filtered_variables()"
Check:
  expression: >-
    upper(varname()) not in $model_variables and upper(varname()) not in $ig_variables
Outcome:
  Message: "Variable is in neither the SDTM Model list of allowed variables for the\
    \ observation class nor the IG variable list for the dataset, and should be represented\
    \ in supplemental qualifiers (SUPP--)."
  Output_Variables:
  - "$model_variables"
  - "$ig_variables"
Source:
  Class: "ALL"
  Domain: "ALL"
  Variable: "GEN"
  Rule: "Variable = Model List of Allowed Variables for Observation Class"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "SDTMIG"
    Version: "3.4"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0013"
        Version: "1"
      Version: "2.0"
  - Name: "SDTMIG"
    Version: "3.3"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0013"
        Version: "1"
      Version: "2.0"
  - Name: "SDTMIG"
    Version: "3.2"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0013"
        Version: "1"
      Version: "2.0"
