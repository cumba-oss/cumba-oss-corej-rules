Core:
  Id: "CDISC-SEND-0232"
  Status: "Published"
  Version: "1"
Description: "Raise an error when a Trial Set Parameter Short Name (TXPARMCD) value\
  \ is longer than 8 characters."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "TX"
Check:
  expression: >-
    len(TXPARMCD) > 8
Outcome:
  Message: "TXPARMCD value is longer than 8 characters."
Source:
  Class: "TDM"
  Domain: "TX"
  Variable: "TXPARMCD"
  Plain_Text_Explanation: "TXPARMCD value limited to 8 characters"
  Rule: "TXPARMCD value length <= 8"
