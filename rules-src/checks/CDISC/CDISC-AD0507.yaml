Core:
  Id: "CDISC-AD0507"
  Status: "Published"
  Version: "1"
Description: "Raise an error when a variable name that is not one of the standard\
  \ library variables ends in DTF but its label does not end with 'Imputation Flag'\
  \ (or 'Imput. Flag') or does not contain 'Date'."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "ALL"
Bindings:
- name: "$library_variables"
  expression: "get_column_order_from_library()"
Check:
  expression: >-
    ends_with(varname(), "DTF") and (var_label("DATA") !~ / Imput(\\.|ation) Flag$/ or not
    contains(var_label("DATA"), "Date")) and varname() not in $library_variables
Outcome:
  Message: "A variable ending in DTF has a label that does not end with 'Imputation\
    \ Flag' (or 'Imput. Flag') or does not contain 'Date'."
  Output_Variables:
  - "variable_name"
  - "variable_label"
Source:
  Class: "ALL"
  Variable_or_Item: "*DTF"
  Natural_Language_Rule_Failure_Criteria: "A variable ending in DTF must contain \"\
    Date Imputation Flag\" in the label"
  Rule_Failure_Criteria: "*DTF does not contain \"Date Imputation Flag\" in the label"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.1"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR507"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.2"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR507"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.3"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR507"
        Version: "1"
      Version: "5.0"
