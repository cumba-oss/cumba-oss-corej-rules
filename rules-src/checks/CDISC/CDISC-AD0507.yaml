Core:
  Id: "CDISC-AD0507"
  Status: "Published"
  Version: "1"
Description: "Raise an error when a variable's name ends in DTF and is not a standard\
  \ library variable, and its label does not end with 'Imputation Flag' (or 'Imput.\
  \ Flag') or does not contain 'Date' - every such name, also one that ends in SDTF\
  \ or EDTF and so falls under that longer fragment's rule as well."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "ALL"
Check:
  expression: >-
    ends_with(upper(varname()), "DTF") and not empty(label_template("LIBRARY", stem="*DTF")) and
    (var_label("DATA") !~ / Imput(\\.|ation) Flag$/ or not contains(var_label("DATA"), "Date"))
Outcome:
  Message: "A variable ending in DTF has a label that does not end with 'Imputation\
    \ Flag' (or 'Imput. Flag') or does not contain 'Date'."
  Output_Variables:
  - "variable_label"
  - "library_variable_label_template"
Source:
  Class: "ALL"
  Variable_or_Item: "*DTF"
  Natural_Language_Rule_Failure_Criteria: "A variable ending in DTF must contain \"\
    Date Imputation Flag\" in the label"
  Rule_Failure_Criteria: "*DTF does not contain \"Date Imputation Flag\" in the label"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.1"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR507"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.2"
    References:
