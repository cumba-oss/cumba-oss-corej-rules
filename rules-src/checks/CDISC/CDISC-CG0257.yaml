Core:
  Id: "CDISC-CG0257"
  Status: "Published"
  Version: "1"
Description: "Raise an error when the value of Trial Summary Parameter Short Name\
  \ (TSPARMCD) is more than 8 characters in length."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "TS"
Check:
  expression: >-
    len(TSPARMCD) > 8
Outcome:
  Message: "TSPARMCD value is more than 8 characters in length."
Source:
  Class: "TDM"
  Domain: "TS"
  Variable: "TSPARMCD"
  Rule: "TSPARMCD value length <= 8"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "SDTMIG"
    Version: "3.4"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0257"
        Version: "1"
      Version: "2.0"
  - Name: "SDTMIG"
    Version: "3.3"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0257"
        Version: "1"
      Version: "2.0"
  - Name: "SDTMIG"
    Version: "3.2"
    References:
