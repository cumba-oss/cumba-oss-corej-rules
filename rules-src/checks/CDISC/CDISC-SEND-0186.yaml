Core:
  Id: "CDISC-SEND-0186"
  Status: "Published"
  Version: "1"
Description: "Raise an error when Completion Status (MISTAT) is \"NOT DONE\" but Result\
  \ or Finding in Original Units (MIORRES) is populated; a record for a tissue that\
  \ was not examined must have MIORRES empty."
Executability: "Partially Executable - Possible Underreporting"
Scope:
  Domains:
    Include:
    - "MI"
Requirements:
  Variables:
    All:
    - "MISTAT"
Check:
  expression: >-
    MISTAT == "NOT DONE" and not empty(MIORRES)
Outcome:
  Message: "MIORRES is populated when MISTAT is \"NOT DONE\"; a not-examined tissue\
    \ record must have MIORRES empty."
Source:
  Class: "FND"
  Domain: "MI"
  Variable: "MIORRES, MISTAT"
  Plain_Text_Explanation: "If a tissue that was scheduled for examination but not\
    \ examined was not examined, the record will have a blank value in MIORRES and\
    \ MISTAT will be \"NOT DONE\"."
  Condition: "Scheduled tissue was not examined"
  Rule: "MIORRES = null AND MISTAT = \"NOT DONE\""
