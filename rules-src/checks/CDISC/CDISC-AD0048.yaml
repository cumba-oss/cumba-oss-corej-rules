Core:
  Id: "CDISC-AD0048"
  Status: "Published"
  Version: "1"
Description: "Raise an error when ADSL contains no variable with a name ending in\
  \ FL"
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "SUBJECT LEVEL ANALYSIS DATASET"
Bindings:
- name: "$fl_count"
  expression: "variable_count(name_pattern=\"^.+FL$\")"
Check:
  expression: >-
    $fl_count == 0
Outcome:
  Message: "No variable in ADSL has a name ending in FL"
Source:
  Class: "SUBJECT LEVEL ANALYSIS DATASET"
  Natural_Language_Rule_Failure_Criteria: "A variable with a suffix of FL is not present\
    \ in ADSL"
  Rule_Failure_Criteria: "*FL is not present"
Standards:
- Organization: "CDISC"
  Standards:
