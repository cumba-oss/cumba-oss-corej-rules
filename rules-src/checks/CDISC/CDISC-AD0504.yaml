Core:
  Id: "CDISC-AD0504"
  Status: "Published"
  Version: "1"
Description: "Raise an error when a variable's name ends in TM, the ADaM implementation\
  \ guide's *TM naming fragment governs it (the name is not a standard library variable),\
  \ and its label does not contain the fragment's phrase 'Time'."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "ALL"
Check:
  expression: >-
    ends_with(upper(varname()), "TM") and var_name("LIBRARY") == "*TM" and not
    matches_label_template(var_label("DATA"), label_template("LIBRARY"))
Outcome:
  Message: "The variable's name ends in TM, but its label does not contain 'Time'."
  Output_Variables:
  - "variable_name"
  - "variable_label"
  - "library_variable_label_template"
skipIfLibraryDefined: true
Source:
  Class: "ALL"
  Variable_or_Item: "*TM"
  Natural_Language_Rule_Failure_Criteria: "A variable ending in TM must contain \"\
    Time\" in the label"
  Rule_Failure_Criteria: "*TM does not contain \"Time\" in the label"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.1"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR504"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.2"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR504"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.3"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR504"
        Version: "1"
      Version: "5.0"
