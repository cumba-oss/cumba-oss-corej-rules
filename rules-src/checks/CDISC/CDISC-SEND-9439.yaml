Core:
  Id: "CDISC-SEND-9439"
  Status: "Published"
  Version: "1"
Description: "Raise an error when the Description of Unplanned Element (SEUPDES) variable\
  \ is not present in the dataset although an Element Code (ETCD) equal to 'UNPLAN'\
  \ is reported."
Sensitivity: "Dataset"
Executability: "Partially Executable - Possible Overreporting"
Scope:
  Domains:
    Include:
    - "SE"
Requirements:
  Variables:
    None:
    - "SEUPDES"
    All:
    - "ETCD"
Check:
  expression: >-
    ETCD == "UNPLAN"
Outcome:
  Message: "SEUPDES is not present in the dataset although ETCD is equal to 'UNPLAN'."
  Output_Variables:
  - "ETCD"
Source_Proposed:
  Sheet_Issue: "#210"
  Class: "SPC"
  Domain: "SE"
  Variable: "SEUPDES"
  Plain_Text_Explanation: "SEUPDES is the description of the unplanned element; whenever\
    \ an unplanned element (ETCD = UNPLAN) is reported, the SEUPDES variable should\
    \ be present in the dataset so it can carry that description"
  Condition: "ETCD = \"UNPLAN\""
  Rule: "SEUPDES variable is present in the dataset"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "SENDIG-GENETOX"
    Version: "1.0"
  - Name: "SENDIG-DART"
    Version: "1.2"
  - Name: "SENDIG-DART"
    Version: "1.1"
  - Name: "SENDIG"
    Version: "3.1.1"
  - Name: "SENDIG"
    Version: "3.1"
  - Name: "SENDIG"
    Version: "3.0"
