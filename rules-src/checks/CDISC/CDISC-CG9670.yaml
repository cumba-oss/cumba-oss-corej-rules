Core:
  Id: "CDISC-CG9670"
  Status: "Published"
  Version: "1"
Description: "Raise an error when USUBJID is not populated"
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "SE"
Requirements:
  Variables:
    All:
    - "USUBJID"
Check:
  expression: >-
    empty(USUBJID)
Outcome:
  Message: "USUBJID is empty"
  Message_Folded: "USUBJID not populated in any record of the dataset: USUBJID is\
    \ empty"
  Output_Variables:
  - "USUBJID"
Source_Proposed:
  Class: "ALL"
  Domain: "SE"
  Variable: "USUBJID"
  Condition: ""
  Rule: "USUBJID ^= null"
Source:
  Class: "ALL"
  Domain: "ALL"
  Variable: "GEN"
  Condition: "Variable Core Status = Required"
  Rule: "Variable present in dataset and ^= null"
