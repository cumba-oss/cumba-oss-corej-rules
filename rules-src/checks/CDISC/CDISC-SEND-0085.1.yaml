Core:
  Id: "CDISC-SEND-0085.1"
  Status: "Published"
  Version: "1"
Description: "Raise an error when a Findings Result or Finding in Original Units (--ORRES)\
  \ is empty and the record is not marked as not done (--STAT is not present or does\
  \ not equal 'NOT DONE'); a result is expected unless the examination was not done."
Executability: "Fully Executable"
Scope:
  Classes:
    Include:
    - "FINDINGS"
Requirements:
  Variables:
    All:
    - "--ORRES"
Check:
  expression: >-
    empty(--ORRES) and (not var_exists("--STAT") or --STAT != "NOT DONE")
Outcome:
  Message: "--ORRES is empty and the record is not marked \"NOT DONE\" in --STAT;\
    \ a result is expected."
  Message_Folded: "--ORRES not populated in any record of the dataset or --STAT not\
    \ present in the dataset, and at least one record meets the rest of the condition:\
    \ --ORRES is empty and the record is not marked \"NOT DONE\" in --STAT; a result\
    \ is expected."
  Output_Variables:
  - "!--ORRES"
Source:
  Class: "FND"
  Domain: "ALL"
  Variable: "--ORRES"
  Plain_Text_Explanation: "There should always be data presented in the --ORRES variable\
    \ unless  --STAT = \"NOT DONE\"."
  Condition: "--STAT ^= \"NOT DONE\""
  Rule: "--ORRES ^= null"
