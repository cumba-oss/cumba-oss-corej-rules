Core:
  Id: "CDISC-AD0443"
  Status: "Published"
  Version: "2"
Description: "Raise an error when PCHGCATy is populated but PCHGCAyN is missing"
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "BASIC DATA STRUCTURE"
Requirements:
  Variables:
    All:
    - "PCHGCATy"
    - "PCHGCAyN"
Check:
  expression: >-
    not empty(PCHGCATy) and empty(PCHGCAyN)
Outcome:
  Message: "PCHGCATy is populated, but PCHGCAyN is missing"
  Message_Folded: "PCHGCAyN not populated in any record of the dataset, and at least\
    \ one record meets the rest of the condition: PCHGCATy is populated, but PCHGCAyN\
    \ is missing"
  Output_Variables:
  - "PCHGCATy"
  - "PCHGCAyN"
wildcards:
  "y":
    min: 1
    max: 99
Source:
  Class: "BASIC DATA STRUCTURE; MEDICAL DEVICE BASIC DATA STRUCTURE"
  Variable_or_Item: "PCHGCAyN where y is an integer [1-9, not zero-padded]"
  Natural_Language_Rule_Failure_Criteria: "On a given record, PCHGCATy is populated\
    \ and PCHGCAyN is not populated"
  Rule_Failure_Criteria: "PCHGCAyN is not populated"
  Condition_Failure: "PCHGCATy is populated"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.2"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR443"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.3"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR443"
        Version: "2"
      Version: "5.0"
