Core:
  Id: "CDISC-AD0881"
  Status: "Published"
  Version: "1"
Description: "Raise an error when COUNTRYL is populated and COUNTRY is not populated"
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "BASIC DATA STRUCTURE"
Requirements:
  Variables:
    All:
    - "COUNTRY"
    - "COUNTRYL"
Check:
  expression: >-
    not empty(COUNTRYL) and empty(COUNTRY)
Outcome:
  Message: "COUNTRYL is populated, but COUNTRY is not populated"
  Output_Variables:
  - "COUNTRY"
  - "COUNTRYL"
Source:
  Class: "BASIC DATA STRUCTURE"
  Subclass: "POPULATION PHARMACOKINETIC ANALYSIS"
  Variable_or_Item: "COUNTRY"
  Natural_Language_Rule_Failure_Criteria: "COUNTRYL is populated and COUNTRY is not\
    \ populated"
  Rule_Failure_Criteria: "COUNTRY is not populated"
  Condition_Failure: "COUNTRYL is populated"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.3"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR881"
        Version: "1"
      Version: "5.0"
