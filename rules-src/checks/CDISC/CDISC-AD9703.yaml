Core:
  Id: "CDISC-AD9703"
  Status: "Published"
  Version: "1"
Description: "Raise an error when an indexed TRTEMxxFL flag variable is present in\
  \ the dataset but the corresponding non-indexed TRTEMFL variable is not; the indexed\
  \ flags qualify TRTEMFL, so TRTEMFL must exist wherever they do."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "OCCURRENCE DATA STRUCTURE"
Check:
  expression: >-
    upper(varname()) =~ /^(TREM(0[1-9]|[1-9][0-9])|TRTEM[1-9])FL$/ and not var_exists("TRTEMFL")
Outcome:
  Message: "An indexed flag variable is present but TRTEMFL is not."
  Output_Variables:
  - "variable_name"
Source_Proposed:
  Sheet_Issue: "#166"
  Class: "OCCURRENCE DATA STRUCTURE; MEDICAL DEVICE OCCURRENCE DATA STRUCTURE"
  Subclass: ""
  SEND_SDTM_Domain: ""
  Variable_or_Item: "TRTEMFL"
  Natural_Language_Rule_Failure_Criteria: "an indexed TREMxxFL or TRTEMxFL flag variable\
    \ is present in the dataset but the non-indexed TRTEMFL variable is not"
  Rule_Failure_Criteria: "TRTEMFL is not present"
  Condition_Failure: "an indexed TREMxxFL or TRTEMxFL variable is present"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.0"
  - Name: "ADaMIG"
    Version: "1.1"
  - Name: "ADaMIG"
    Version: "1.2"
  - Name: "ADaMIG"
    Version: "1.3"
