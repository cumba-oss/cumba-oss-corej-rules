Core:
  Id: "CDISC-AD0377"
  Status: "Published"
  Version: "2"
Description: "Raise an error when, on a given record, TRTxxP is populated and TRTxxPN\
  \ is missing"
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "SUBJECT LEVEL ANALYSIS DATASET"
Check:
  expression: >-
    not empty(TRTxxP) and empty(TRTxxPN)
Outcome:
  Message: "On this record, TRTxxP is populated, but TRTxxPN is missing."
  Message_Folded: "TRTxxPN not populated in any record of the dataset, and at least\
    \ one record meets the rest of the condition: On this record, TRTxxP is populated,\
    \ but TRTxxPN is missing."
  Output_Variables:
  - "TRTxxP"
  - "TRTxxPN"
wildcards:
  xx:
    min: 1
    max: 99
Source:
  Class: "SUBJECT LEVEL ANALYSIS DATASET"
  Variable_or_Item: "TRTxxPN where xx is an integer [01-99, zero-padded]"
  Natural_Language_Rule_Failure_Criteria: "On a given record, TRTxxP is populated\
    \ and TRTxxPN is not populated"
  Rule_Failure_Criteria: "On a given record, TRTxxP is populated and TRTxxPN is not\
    \ populated"
  Condition_Failure: "TRTxxP and TRTxxPN are present"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.2"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR377"
        Version: "2"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.3"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR377"
        Version: "2"
      Version: "5.0"
