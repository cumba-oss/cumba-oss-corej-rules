Core:
  Id: "CDISC-AD0034"
  Status: "Published"
  Version: "1"
Description: "Raise an error when a variable with a suffix of PFL is populated with\
  \ a value that is not Y"
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "BASIC DATA STRUCTURE"
Check:
  expression: >-
    ends_with(upper(varname()), "PFL") and not empty(value()) and value() != "Y"
Outcome:
  Message: "A variable with a suffix of PFL has a value other than Y"
Source:
  Class: "BASIC DATA STRUCTURE"
  Variable_or_Item: "*PFL"
  Natural_Language_Rule_Failure_Criteria: "A variable with a suffix of PFL has a value\
    \ that is not Y or null"
  Rule_Failure_Criteria: "Value is not Y or null"
  Condition_Failure: "Variable with a suffix of PFL is present"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.0"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR34"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.1"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR34"
        Version: "1"
      Version: "5.0"
