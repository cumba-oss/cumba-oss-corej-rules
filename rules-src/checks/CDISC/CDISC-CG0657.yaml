Core:
  Id: "CDISC-CG0657"
  Status: "Published"
  Version: "1"
Description: "Raise an error when a visit is planned (SVPRESP is equal to 'Y') but\
  \ the Visit Name (VISIT) value does not match any VISIT value in the Trial Visits\
  \ (TV) dataset."
Executability: "Partially Executable - Possible Overreporting"
Scope:
  Domains:
    Include:
    - "SV"
Requirements:
  Variables:
    All:
    - "VISIT"
Bindings:
- name: "$tv_visit"
  expression: "distinct(VISIT, domain=\"TV\")"
Check:
  expression: >-
    (var_exists("SVPRESP") and SVPRESP == "Y" or not var_exists("SVPRESP") and empty(SVUPDES) and
    not contains(upper(VISIT), "UNSCHEDUL") and not contains(upper(VISIT), "UNPLAN")) and VISIT not
    in $tv_visit
Outcome:
  Message: "VISIT value for a planned visit does not match any VISIT value in the\
    \ TV dataset."
  Message_Folded: "SVPRESP absent from the dataset, or SVUPDES absent or not populated\
    \ in any record of the dataset, and at least one record meets the rest of the\
    \ condition: VISIT value for a planned visit does not match any VISIT value in\
    \ the TV dataset."
  Output_Variables:
  - "$tv_visit"
Source:
  Class: "SPC"
  Domain: "SV"
  Variable: "VISIT"
  Condition: "SVPRESP = 'Y'"
  Rule: "VISIT in TV.VISIT"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "SDTMIG"
    Version: "3.4"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0657"
        Version: "1"
      Version: "2.0"
