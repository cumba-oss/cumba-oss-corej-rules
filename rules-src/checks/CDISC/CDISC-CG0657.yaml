Core:
  Id: "CDISC-CG0657"
  Status: "Published"
  Version: "1"
Description: "Raise an error when a visit is planned (SVPRESP is equal to 'Y') but\
  \ the Visit Name (VISIT) value does not match any VISIT value in the Trial Visits\
  \ (TV) dataset."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "SV"
Requirements:
  Variables:
    All:
    - "VISIT"
    - "SVPRESP"
Operations:
- id: "$tv_visit"
  expression: "distinct(VISIT, domain=\"TV\")"
Check:
  expression: >-
    SVPRESP == "Y" and VISIT not in $tv_visit
Outcome:
  Message: "VISIT value for a planned visit does not match any VISIT value in the\
    \ TV dataset."
  Output_Variables:
  - "VISIT"
  - "SVPRESP"
  - "$tv_visit"
Source:
  Class: "SPC"
  Domain: "SV"
  Variable: "VISIT"
  Condition: "SVPRESP = 'Y'"
  Rule: "VISIT in TV.VISIT"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "SDTMIG"
    Version: "3.4"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0657"
        Version: "1"
      Version: "2.0"
