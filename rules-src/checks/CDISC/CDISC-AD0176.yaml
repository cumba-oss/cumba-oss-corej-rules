Core:
  Id: "CDISC-AD0176"
  Status: "Published"
  Version: "1"
Description: "Raise an error when ABLFL is populated and does not equal 'Y'."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "BASIC DATA STRUCTURE"
Requirements:
  Variables:
    All:
    - "ABLFL"
Check:
  expression: >-
    not empty(ABLFL) and ABLFL != "Y"
Outcome:
  Message: "ABLFL is populated but does not equal Y."
  Output_Variables:
  - "ABLFL"
Source:
  Class: "BASIC DATA STRUCTURE"
  Variable_or_Item: "ABLFL"
  Natural_Language_Rule_Failure_Criteria: "ABLFL is not equal to Y or null"
  Rule_Failure_Criteria: "ABLFL is not equal to Y or null"
