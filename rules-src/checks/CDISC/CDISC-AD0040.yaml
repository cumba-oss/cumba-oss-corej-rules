Core:
  Id: "CDISC-AD0040"
  Status: "Published"
  Version: "1"
Description: "Raise an error when a variable with a suffix of TMF is populated with\
  \ a value that is not within Controlled Terminology for TIMEFL"
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "ALL"
Check:
  expression: >-
    ends_with(upper(varname()), "TMF") and not empty(value()) and value() not in ["H", "M", "S"]
Outcome:
  Message: "A variable with a suffix of TMF has a value outside Controlled Terminology\
    \ for TIMEFL"
  Output_Variables:
  - "variable_name"
  - "variable_value"
Source:
  Class: "ALL"
  Variable_or_Item: "*TMF"
  Natural_Language_Rule_Failure_Criteria: "A variable with a suffix of TMF has a value\
    \ that is not within Controlled Terminology for TIMEFL"
  Rule_Failure_Criteria: "Value that is not within Controlled Terminology for TIMEFL"
  Condition_Failure: "Variable with a suffix of TMF"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.0"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR40"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.1"
    References:
