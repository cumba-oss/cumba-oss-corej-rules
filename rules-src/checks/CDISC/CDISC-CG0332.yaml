Core:
  Id: "CDISC-CG0332"
  Status: "Published"
  Version: "1"
Description: "Raise an error when a split dataset (a three- or four-character dataset\
  \ name not beginning with AP or FA) does not have its two-character parent domain\
  \ present in the study."
Executability: "Fully Executable"
Scope:
  Domains:
    Exclude:
    - "RELREC"
    - "RELSUB"
    - "SUPP--"
    - "SQ--"
    include_split_datasets: true
Bindings:
- name: "$study_domains"
  expression: "study_domains()"
Check:
  expression: >-
    ds_name() =~ /(?i)^(?!AP|FA)[A-Z]{2}[A-Z0-9]{1,2}$/ and upper(prefix(ds_name(), 2)) not in
    $study_domains
Outcome:
  Message: "The first two characters of the split dataset name do not match a domain\
    \ present in the study."
  Output_Variables:
  - "$study_domains"
Source:
  Class: "ALL"
  Domain: "NOT(RELREC, RELSUB, SUPP--)"
  Variable: "GEN"
  Condition: "Dataset name length = 3 or 4 and dataset name does not begin with 'AP'\
    \ or 'FA'"
  Rule: "The first two characters of the dataset name must equal a domain that is\
    \ present in the study"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "SDTMIG"
    Version: "3.4"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0332"
        Version: "1"
      Version: "2.0"
  - Name: "SDTMIG"
    Version: "3.3"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0332"
        Version: "1"
      Version: "2.0"
  - Name: "SDTMIG"
    Version: "3.2"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0332"
        Version: "1"
      Version: "2.0"
