Core:
  Id: "CDISC-CG0349"
  Status: "Published"
  Version: "1"
Description: "Raise an error when, within a custom domain, the first two characters\
  \ of a prefixed variable name do not match the two-character domain code. Standard\
  \ SDTM non-prefixed variables — Required Identifiers, common merge/grouping keys,\
  \ and the other standard identifier/timing variables that the IG exempts from the\
  \ domain-prefix convention — are not checked."
Executability: "Fully Executable"
Scope:
  Classes:
    Include:
    - "FINDINGS"
    - "INTERVENTIONS"
    - "EVENTS"
Bindings:
- name: "$domain_list"
  expression: "distinct(DOMAIN)"
- name: "$domain_is_custom"
  expression: "domain_is_custom()"
Check:
  expression: >-
    $domain_is_custom == true and upper(varname()) not in ["STUDYID", "DOMAIN", "USUBJID", "POOLID",
    "SPDEVID", "VISIT", "VISITNUM", "VISITDY", "ELEMENT", "TAETORD", "EPOCH", "NHOID", "FOCID",
    "SPTOBID", "STOCONID", "IGDCMPID", "MIDS", "RELMIDS", "MIDSDTC", "RSUBJID", "RDEVID", "SREL",
    "APID"] and prefix(varname(), 2) not in $domain_list
Outcome:
  Message: "First 2 characters of the variable name within a custom domain do not\
    \ match the 2-character domain code."
  Output_Variables:
  - "variable_name"
  - "$domain_list"
  - "$domain_is_custom"
Source:
  Class: "FND, INT, EVT"
  Domain: "ALL"
  Variable: "GEN"
  Condition: "Custom domain and variable name is not STUDYID, DOMAIN, USUBJID, POOLID,\
    \ SPDEVID, VISIT, VISITNUM, VISITDY, ELEMENT, TAETORD, EPOCH."
  Rule: "First 2 characters of the Variable Name = the 2-character domain code"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "SDTMIG"
    Version: "3.4"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0349"
        Version: "1"
      Version: "2.0"
  - Name: "SDTMIG"
    Version: "3.3"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0349"
        Version: "1"
      Version: "2.0"
  - Name: "SDTMIG"
    Version: "3.2"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0349"
        Version: "1"
      Version: "2.0"
