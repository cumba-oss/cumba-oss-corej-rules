Core:
  Id: "CDISC-AD0334"
  Status: "Published"
  Version: "2"
Description: "Raise an error when, within a parameter, PCHGCAyN has more than one\
  \ value for a given value of PCHGCATy, considering only records where both variables\
  \ are populated"
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "BASIC DATA STRUCTURE"
    - "MEDICAL DEVICE BASIC DATA STRUCTURE"
Check:
  expression: >-
    not empty(PCHGCAyN) and not empty(PCHGCATy) and has_multiple_values_for(PCHGCAyN, PCHGCATy,
    within=PARAMCD)
Outcome:
  Message: "Within this parameter, PCHGCAyN has more than one value for the same value\
    \ of PCHGCATy."
  Output_Variables:
  - "PARAMCD"
  - "PCHGCATy"
  - "PCHGCAyN"
wildcards:
  "y":
    min: 1
    max: 99
Source:
  Class: "BASIC DATA STRUCTURE; MEDICAL DEVICE BASIC DATA STRUCTURE"
  Variable_or_Item: "PCHGCAyN where y is an integer [1-9, not zero-padded]"
  Natural_Language_Rule_Failure_Criteria: "Within a parameter, there is more than\
    \ one value of PCHGCAyN for a given value of PCHGCATy, considering only those\
    \ rows on which both variables are populated"
  Rule_Failure_Criteria: "Within a parameter, there is more than one value of PCHGCAyN\
    \ for a given value of PCHGCATy"
  Condition_Failure: "On rows where both PCHGCAyN and PCHGCATy are both populated"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.1"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR334"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.2"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR334"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.3"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR334"
        Version: "2"
      Version: "5.0"
