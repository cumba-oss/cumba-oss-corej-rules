Core:
  Id: "CDISC-AD0790"
  Status: "Published"
  Version: "1"
Description: "Raise an error when BASETYPE is populated, ByIND is populated, and ByIND\
  \ does not equal the AyIND value recorded where ABLFL equals Y for the same subject,\
  \ PARAMCD, and BASETYPE, where y is an integer [1-99, not zero-padded]"
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "BASIC DATA STRUCTURE"
Bindings:
- name: "$baseline_ayind"
  expression: "max(AyIND, group=[USUBJID, PARAMCD, BASETYPE], filter=(ABLFL==\"Y\"\
    ))"
Check:
  expression: >-
    not empty(BASETYPE) and not empty(ByIND) and ByIND != $baseline_ayind
Outcome:
  Message: "ByIND does not equal the AyIND value recorded where ABLFL equals Y for\
    \ this subject, PARAMCD, and BASETYPE."
  Output_Variables:
  - "PARAMCD"
  - "BASETYPE"
  - "ByIND"
wildcards:
  "y":
    min: 1
    max: 99
Source:
  Class: "BASIC DATA STRUCTURE"
  Variable_or_Item: "ByIND where y is an integer [1-99, not zero-padded]"
  Natural_Language_Rule_Failure_Criteria: "BASETYPE is populated, ByIND is populated,\
    \ and ByIND is not equal to AyIND where ABLFL is equal to Y for a given value\
    \ of PARAMCD and BASETYPE for a subject"
  Rule_Failure_Criteria: "ByIND is not equal to AyIND where ABLFL is equal to Y for\
    \ a given value of PARAMCD and BASETYPE for a subject"
  Condition_Failure: "BASETYPE is populated and ByIND is populated"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.3"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR790"
        Version: "1"
      Version: "5.0"
