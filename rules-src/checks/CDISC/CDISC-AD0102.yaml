Core:
  Id: "CDISC-AD0102"
  Status: "Published"
  Version: "1"
Description: "Raise an error when APERIOD is populated but the corresponding TRTxxP\
  \ variable (xx = zero-padded APERIOD value) is not present in ADSL."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "BASIC DATA STRUCTURE"
    - "OCCURRENCE DATA STRUCTURE"
Requirements:
  Variables:
    All:
    - "APERIOD"
    - "USUBJID"
    All_Or_None:
    - - "USUBJID"
      - "ADSL.USUBJID"
Match_Datasets:
- Name: "ADSL"
  Keys:
  - "USUBJID"
Bindings:
- name: "$trt_p"
  expression: "concat(\"ADSL.TRT\", printf(\"%02d\", APERIOD), \"P\")"
Check:
  expression: >-
    not empty(APERIOD) and not empty($trt_p) and not var_exists($trt_p)
Outcome:
  Message: "The value of APERIOD has no corresponding TRTxxP variable present in ADSL."
  Output_Variables:
  - "!$trt_p"
Source:
  Class: "ALL"
  Variable_or_Item: "APERIOD"
  Natural_Language_Rule_Failure_Criteria: "For every unique xx value of APERIOD, there\
    \ is not an ADSL variable TRTxxP"
  Rule_Failure_Criteria: "The value of APERIOD does not have a corresponding xx component\
    \ of a TRTxxP variable in ADSL"
  Condition_Failure: "APERIOD is populated"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.0"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR102"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.1"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR102"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.2"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR102"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.3"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR102"
        Version: "1"
      Version: "5.0"
