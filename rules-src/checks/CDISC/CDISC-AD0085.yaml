Core:
  Id: "CDISC-AD0085"
  Status: "Published"
  Version: "1"
Description: "Raise an error when a variable is present with the same name as a variable\
  \ in ADSL, but the two variables' labels are not identical"
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "ALL"
Bindings:
- name: "$adsl_label"
  expression: "cross_dataset_variable_metadata(\"label\", domain=\"ADSL\")"
Check:
  expression: >-
    not empty($adsl_label) and var_label("DATA") != $adsl_label
Outcome:
  Message: "This variable's label does not match the label of the same-named variable\
    \ in ADSL"
  Output_Variables:
  - "variable_label"
  - "$adsl_label"
Source:
  Class: "ALL"
  Natural_Language_Rule_Failure_Criteria: "A variable is present with the same name\
    \ as a variable present in ADSL but the variables do not have identical labels"
  Rule_Failure_Criteria: "Variables do not have identical labels"
  Condition_Failure: "A variable is present with the same name as a variable present\
    \ in ADSL"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.0"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR85"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.1"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR85"
        Version: "1"
      Version: "5.0"
