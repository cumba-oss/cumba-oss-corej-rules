Core:
  Id: "CDISC-SEND-0255"
  Status: "Published"
  Version: "1"
Description: "Raise an error when the Origin (QORIG) is populated with a value other\
  \ than COLLECTED, DERIVED, OTHER, or NOT AVAILABLE."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "SUPP--"
    - "SQ--"
Requirements:
  Variables:
    All:
    - "QORIG"
Check:
  expression: >-
    not empty(QORIG) and QORIG not in ["COLLECTED", "DERIVED", "OTHER", "NOT AVAILABLE"]
Outcome:
  Message: "QORIG is not one of the permitted origin values: COLLECTED, DERIVED, OTHER,\
    \ NOT AVAILABLE."
  Output_Variables:
  - "QNAM"
Source:
  Class: "REL"
  Domain: "SUPP--"
  Variable: "QORIG"
  Plain_Text_Explanation: "QORIG is used to indicate the origin of the data. Possible\
    \ values are COLLECTED, DERIVED, OTHER, and NOT AVAILABLE."
  Condition: "QORIG ^= null"
  Rule: "QORIG = \"COLLECTED\" OR QORIG = \"DERIVED\" OR QORIG = \"OTHER\" OR QORIG\
    \ = \"NOT AVAILABLE\""
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "SENDIG-GENETOX"
    Version: "1.0"
    References:
