Core:
  Id: "CDISC-AD0225"
  Status: "Published"
  Version: "1"
Description: "Raise an error when PCHG is populated and is not equal to ((AVAL - BASE)/BASE)*100."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "BASIC DATA STRUCTURE"
Check:
  expression: >-
    not empty(PCHG) and PCHG != (((AVAL - BASE) / BASE) * 100)
Outcome:
  Message: "PCHG is populated and is not equal to ((AVAL - BASE)/BASE)*100."
  Output_Variables:
  - "PARAMCD"
Source:
  Class: "BASIC DATA STRUCTURE"
  Variable_or_Item: "PCHG"
  Natural_Language_Rule_Failure_Criteria: "Within a given value of PARAMCD for a subject,\
    \ PCHG is populated and is not equal to ((AVAL - BASE)/BASE)*100"
  Rule_Failure_Criteria: "PCHG is not equal to ((AVAL - BASE)/BASE)*100"
  Condition_Failure: "PCHG is populated."
Standards:
