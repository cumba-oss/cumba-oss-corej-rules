Core:
  Id: "CDISC-SEND-0001-A"
  Status: "Published"
  Version: "1"
Description: "Raise an error when an Associated Persons dataset has a dataset name\
  \ whose first four characters do not equal the Domain Abbreviation (DOMAIN) value."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "AP--"
    Exclude:
    - "APRELSUB"
Requirements:
  Variables:
    All:
    - "DOMAIN"
Check:
  expression: >-
    upper(prefix(ds_name(), 4)) != upper(DOMAIN)
Outcome:
  Message: "The dataset name does not begin with the DOMAIN value; a SEND dataset\
    \ name must be consistent with its domain code."
Source_Proposed:
  Class: "ALL"
  Domain: "AP--"
  Variable: "DOMAIN"
  Plain_Text_Explanation: "an Associated Persons dataset has a dataset name whose\
    \ first four characters do not equal the Domain Abbreviation (DOMAIN) value"
  Condition: "not SUPP OR RELREC OR POOLDEF"
  Rule: "SEND dataset file name is the domain abbreviation."
Source:
  Class: "ALL"
  Domain: "ALL"
  Variable: "NA"
  Plain_Text_Explanation: "SEND datasets are named to be consistent with the domain\
    \ code (xpt file name is the domain abbreviation); exceptions to this rule are\
    \ RELREC, SUPP, and POOLDEF."
  Condition: "not SUPP OR RELREC OR POOLDEF"
  Rule: "SEND dataset file name is the domain abbreviation."
