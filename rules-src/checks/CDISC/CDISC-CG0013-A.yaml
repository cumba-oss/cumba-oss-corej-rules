Core:
  Id: "CDISC-CG0013-A"
  Status: "Published"
  Version: "1"
Description: "Raise an error when a variable present in the Subject Elements (SE)\
  \ or Subject Visits (SV) dataset is neither in the SDTM Model list of allowed variables\
  \ for the dataset nor one of the variables the IG permits adding there: the identifiers\
  \ --SEQ, --GRPID, --REFID and --SPID, and any Timing variable except the time-point\
  \ variables (--TPT, --TPTNUM, --ELTM, --TPTREF, --RFTDTC)."
Executability: "Partially Executable - Possible Underreporting"
Scope:
  Domains:
    Include:
    - "SE"
    - "SV"
Bindings:
- name: "$allowed_variables"
  expression: "get_model_column_order()"
- name: "$timing_variables"
  expression: "get_model_filtered_variables(key_name=\"role\", key_value=\"Timing\"\
    , model_class=\"Findings\")"
- name: "$identifier_variables"
  expression: "get_model_filtered_variables(key_name=\"role\", key_value=\"Identifier\"\
    , model_class=\"Findings\")"
Check:
  expression: >-
    upper(varname()) not in $allowed_variables and not (upper(varname()) in $timing_variables and
    upper(varname()) !~ /^..(TPT|TPTNUM|ELTM|TPTREF|RFTDTC)$/) and not (upper(varname()) in
    $identifier_variables and upper(varname()) =~ /^..(SEQ|GRPID|REFID|SPID)$/)
Outcome:
  Message: "Variable is not in the SDTM Model list of allowed variables for the dataset\
    \ and is not an identifier or timing variable the IG permits adding to SE/SV."
  Output_Variables:
  - "variable_name"
  - "$allowed_variables"
Source_Proposed:
  Class: "SPC"
  Domain: "SE, SV"
  Variable: "GEN"
  Condition: "Dataset is SE or SV; SDTMIG SE/SV assumptions permit adding --SEQ (SV),\
    \ --GRPID, --REFID, --SPID and Timing variables except the time-point variables"
  Rule: "Variable = Model List of Allowed Variables for the domain, or a variable\
    \ the IG permits adding to it"
Source:
  Class: "ALL"
  Domain: "ALL"
  Variable: "GEN"
  Rule: "Variable = Model List of Allowed Variables for Observation Class"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "SDTMIG"
    Version: "3.4"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0013"
        Version: "1"
      Version: "2.0"
  - Name: "SDTMIG"
    Version: "3.3"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0013"
        Version: "1"
      Version: "2.0"
  - Name: "SDTMIG"
    Version: "3.2"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0013"
        Version: "1"
      Version: "2.0"
