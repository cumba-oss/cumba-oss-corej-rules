Core:
  Id: "CDISC-AD0820"
  Status: "Published"
  Version: "1"
Description: "Raise an error when SITEID is populated and SITEIDN is not populated."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "BASIC DATA STRUCTURE"
Requirements:
  Variables:
    All:
    - "SITEID"
    - "SITEIDN"
Check:
  expression: >-
    not empty(SITEID) and empty(SITEIDN)
Outcome:
  Message: "SITEID is populated, but SITEIDN is not populated."
Source:
  Class: "BASIC DATA STRUCTURE"
  Subclass: "POPULATION PHARMACOKINETIC ANALYSIS"
  Variable_or_Item: "SITEIDN"
  Natural_Language_Rule_Failure_Criteria: "SITEID is populated and SITEIDN is not\
    \ populated"
  Rule_Failure_Criteria: "SITEIDN is not populated"
  Condition_Failure: "SITEID is populated"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.3"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR820"
        Version: "1"
      Version: "5.0"
