Core:
  Id: "CDISC-SEND-0192"
  Status: "Published"
  Version: "1"
Description: "Raise an error when more than one Pharmacokinetic Concentrations (PC)\
  \ record exists for the same combination of Test Short Name (PCTESTCD), subject\
  \ or pool (USUBJID/POOLID), specimen (PCSPEC), and observation time (PCDTC, or the\
  \ planned time PCTPTREF / PCELTM where PCDTC is null); the domain should hold one\
  \ record per test per specimen per observation time per subject or pool."
Executability: "Partially Executable - Possible Underreporting"
Scope:
  Domains:
    Include:
    - "PC"
Check:
  expression: >-
    not is_unique_set([PCTESTCD, USUBJID, POOLID, PCSPEC, coalesce(PCDTC, concat(PCTPTREF, "/",
    PCELTM))])
Outcome:
  Message: "More than one PC record exists for the same test (PCTESTCD), subject or\
    \ pool (USUBJID/POOLID), specimen (PCSPEC), and observation time (PCDTC, or PCTPTREF\
    \ / PCELTM where PCDTC is null)."
  Output_Variables:
  - "PCELTM"
Source:
  Class: "FND"
  Domain: "PC"
  Variable: "ALL"
  Plain_Text_Explanation: "One record per test per specimen per observation time per\
    \ subject or pool"
  Rule: "One record per test per specimen per observation time per subject or pool"
