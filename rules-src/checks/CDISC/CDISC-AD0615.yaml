Core:
  Id: "CDISC-AD0615"
  Status: "Published"
  Version: "1"
Description: "Raise an error when, on a BDS or OCCDS record where APHASEN is populated,\
  \ PHEDTM does not equal the ADSL variable PHwEDTM for the same USUBJID (where w\
  \ equals the record's APHASEN value)."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "BASIC DATA STRUCTURE"
    - "OCCURRENCE DATA STRUCTURE"
Requirements:
  Variables:
    All:
    - "USUBJID"
    - "PHEDTM"
    - "APHASEN"
    All_Or_None:
    - - "USUBJID"
      - "ADSL.USUBJID"
Match_Datasets:
- Name: "ADSL"
  Keys:
  - "USUBJID"
Check:
  expression: >-
    not empty(APHASEN) and not empty(PHEDTM) and PHEDTM != ADSL.PH${APHASEN:%d}EDTM
Outcome:
  Message: "On a given record, APHASEN is populated and the value of PHEDTM is not\
    \ equal to the value of variable PHwEDTM where w equals the value of APHASEN"
  Output_Variables:
  - "APHASEN"
  - "PHEDTM"
  - "ADSL.PH${*}EDTM"
Source:
  Class: "ALL"
  Variable_or_Item: "PHEDTM"
  Natural_Language_Rule_Failure_Criteria: "On a given record, APHASEN is present and\
    \ the value of PHEDTM is not equal to the value of variable PHwEDTM where w equals\
    \ the value of APHASEN"
  Rule_Failure_Criteria: "On a given record, APHASEN is present and the value of PHEDTM\
    \ is not equal to the value of variable PHwEDTM where w equals the value of APHASEN"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.2"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR615"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.3"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR615"
        Version: "1"
      Version: "5.0"
