Core:
  Id: "CDISC-AD0799"
  Status: "Published"
  Version: "1"
Description: "Raise an error when PROJIDN is present and PROJID is not present"
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "BASIC DATA STRUCTURE"
Check:
  expression: >-
    var_exists("PROJIDN") and not var_exists("PROJID")
Outcome:
  Message: "PROJIDN is present in the dataset, but PROJID is not present."
  Output_Variables:
  - "PROJID"
  - "PROJIDN"
Source:
  Class: "BASIC DATA STRUCTURE"
  Subclass: "POPULATION PHARMACOKINETIC ANALYSIS"
  Variable_or_Item: "PROJIDN"
  Natural_Language_Rule_Failure_Criteria: "PROJIDN is present and PROJID is not present"
  Rule_Failure_Criteria: "PROJID is not present"
  Condition_Failure: "PROJIDN is present"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.3"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR799"
        Version: "1"
      Version: "5.0"
