Core:
  Id: "CDISC-AD0776"
  Status: "Published"
  Version: "1"
Description: "Raise an error when there is more than one value of AERELN for a given\
  \ value of AEREL, considering only rows on which both variables are populated"
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "OCCURRENCE DATA STRUCTURE"
    - "MEDICAL DEVICE OCCURRENCE DATA STRUCTURE"
Check:
  expression: >-
    not empty(AEREL) and not empty(AERELN) and has_multiple_values_for(AERELN, AEREL)
Outcome:
  Message: "AERELN takes more than one value for the same value of AEREL, considering\
    \ only rows on which both variables are populated."
Source:
  Class: "OCCURRENCE DATA STRUCTURE; MEDICAL DEVICE OCCURRENCE DATA STRUCTURE"
  Variable_or_Item: "AERELN"
  Natural_Language_Rule_Failure_Criteria: "There is more than one value of AERELN\
    \ for a given value of AEREL, considering only those rows on which both variables\
    \ are populated"
  Rule_Failure_Criteria: "There is more than one value of AERELN for a given value\
    \ of AEREL"
  Condition_Failure: "On rows where both AERELN and AEREL are both populated."
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.1"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR776"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
