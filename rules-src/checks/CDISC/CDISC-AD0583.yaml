Core:
  Id: "CDISC-AD0583"
  Status: "Published"
  Version: "2"
Description: "Raise an error when, within a given value of PARAMCD, there is more\
  \ than one value of BCHGCATy for a given value of BCHG, where y is an integer [1-99,\
  \ not zero-padded]."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "BASIC DATA STRUCTURE"
Check:
  expression: >-
    not empty(BCHGCATy) and not empty(BCHG) and has_multiple_values_for(BCHGCATy, BCHG,
    within=PARAMCD)
Outcome:
  Message: "Within a given value of PARAMCD, there is more than one value of BCHGCATy\
    \ for a given value of BCHG, where y is an integer [1-99, not zero-padded]."
wildcards:
  "y":
    min: 1
    max: 99
Source_Proposed:
  Sheet_Issue: "#63,#78,#155"
  Class: "BASIC DATA STRUCTURE; MEDICAL DEVICE BASIC DATA STRUCTURE"
  Subclass: ""
  SEND_SDTM_Domain: ""
  Variable_or_Item: "BCHGCATy where y is an integer [1-99, not zero-padded]"
  Natural_Language_Rule_Failure_Criteria: "Within a given value of PARAMCD, there\
    \ is more than one value of BCHGCATy for a given value of BCHG and y, where y\
    \ is an integer [1-99, not zero-padded]"
  Rule_Failure_Criteria: "Within a given value of PARAMCD, there is more than one\
    \ value of BCHGCATy for a given value of BCHG"
  Condition_Failure: ""
Source:
