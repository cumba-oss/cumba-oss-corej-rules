Core:
  Id: "CDISC-AD0408"
  Status: "Published"
  Version: "2"
Description: "Raise an error when ABLFL is populated and ABLFN is not populated."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "BASIC DATA STRUCTURE"
Requirements:
  Variables:
    All:
    - "ABLFL"
    - "ABLFN"
Check:
  expression: >-
    not empty(ABLFL) and empty(ABLFN)
Outcome:
  Message: "ABLFL is populated but ABLFN is not populated."
Source:
  Class: "BASIC DATA STRUCTURE; MEDICAL DEVICE BASIC DATA STRUCTURE"
  Variable_or_Item: "ABLFN"
  Natural_Language_Rule_Failure_Criteria: "On a given record, ABLFL is populated and\
    \ ABLFN is not populated"
  Rule_Failure_Criteria: "ABLFN is not populated"
  Condition_Failure: "ABLFL is populated"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.2"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR408"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.3"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR408"
        Version: "2"
      Version: "5.0"
