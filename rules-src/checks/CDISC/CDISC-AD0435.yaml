Core:
  Id: "CDISC-AD0435"
  Status: "Published"
  Version: "2"
Description: "Raise an error when ATPT is populated but ATPTN is missing"
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "BASIC DATA STRUCTURE"
    - "OCCURRENCE DATA STRUCTURE"
    - "MEDICAL DEVICE OCCURRENCE DATA STRUCTURE"
Requirements:
  Variables:
    All:
    - "ATPT"
    - "ATPTN"
Check:
  expression: >-
    not empty(ATPT) and empty(ATPTN)
Outcome:
  Message: "ATPT is populated, but ATPTN is missing"
  Output_Variables:
  - "ATPT"
  - "ATPTN"
Source:
  Class: "BASIC DATA STRUCTURE; MEDICAL DEVICE BASIC DATA STRUCTURE; OCCURRENCE DATA\
    \ STRUCTURE; MEDICAL DEVICE OCCURRENCE DATA STRUCTURE"
  Variable_or_Item: "ATPTN"
  Natural_Language_Rule_Failure_Criteria: "On a given record, ATPT is populated and\
    \ ATPTN is not populated"
  Rule_Failure_Criteria: "ATPTN is not populated"
  Condition_Failure: "ATPT is populated"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.2"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR435"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.3"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR435"
        Version: "2"
      Version: "5.0"
