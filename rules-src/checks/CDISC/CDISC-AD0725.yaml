Core:
  Id: "CDISC-AD0725"
  Status: "Published"
  Version: "1"
Description: "Raise an error when there is more than one value of APERIODC for a given\
  \ value of APERIOD, considering only rows on which both variables are populated"
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "ALL"
Check:
  expression: >-
    not empty(APERIODC) and not empty(APERIOD) and has_multiple_values_for(APERIODC, APERIOD)
Outcome:
  Message: "APERIODC has more than one value for this APERIOD, among rows where both\
    \ are populated"
Source:
  Class: "ALL"
  Variable_or_Item: "APERIODC"
  Natural_Language_Rule_Failure_Criteria: "There is more than one value of APERIODC\
    \ for a given value of APERIOD, considering only those rows on which both variables\
    \ are populated"
  Rule_Failure_Criteria: "There is more than one value of APERIODC for a given value\
    \ of APERIOD"
  Condition_Failure: "On rows where APERIODC and APERIOD are both populated"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.1"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR725"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.2"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR725"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.3"
    References:
