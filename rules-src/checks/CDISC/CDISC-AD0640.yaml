Core:
  Id: "CDISC-AD0640"
  Status: "Published"
  Version: "1"
Description: "Raise an error when SDTM SUPPAE contains a record whose QNAM equals\
  \ AETRTEM for a subject but AETRTEM is not a column of the corresponding ADVERSE\
  \ EVENT sub-class OCCDS (ADaM) dataset."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "OCCURRENCE DATA STRUCTURE"
  Subclasses:
    Include:
    - "ADVERSE EVENT"
Requirements:
  Variables:
    All:
    - "AE.AETRTEM"
Check:
  expression: >-
    not var_exists("AETRTEM")
Outcome:
  Message: "AE.AETRTEM is present but AETRTEM is not present"
  Output_Variables:
  - "AE.AETRTEM"
  - "AETRTEM"
Source:
  Class: "OCCURRENCE DATA STRUCTURE"
  Subclass: "ADVERSE EVENT"
  Natural_Language_Rule_Failure_Criteria: "SUPPAE.QNAM=AETRTEM is present but AETRTEM\
    \ is not present"
  Rule_Failure_Criteria: "AETRTEM is not present"
  Condition_Failure: "SUPPAE.QNAM=AETRTEM is present"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.0"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR640"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.1"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR640"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.2"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR640"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.3"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR640"
        Version: "1"
      Version: "5.0"
