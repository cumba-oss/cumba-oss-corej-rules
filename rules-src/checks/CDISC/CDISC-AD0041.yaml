Core:
  Id: "CDISC-AD0041"
  Status: "Published"
  Version: "1"
Description: "Raise an error when a numeric variable with a suffix of DT does not\
  \ have a date format"
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "ALL"
Check:
  expression: >-
    ends_with(upper(varname()), "DT") and var_type("DATA") == "Num" and var_format("DATA") !~
    /(?i)^(DATE(?!TIME|AMPM)|DDMMYY|MMDDYY|YYMMDD|E8601DA|IS8601DA|B8601DA|EURDFDN|EURDFDE|JULDAY|JULIAN|MONYY|DOWNAME|WEEKDATE|WORDDATE|YYMM|YYMON|MMYY|YEAR|MONTH|DAY|QTR|NLDATE|MINGUO|NENGO)/
Outcome:
  Message: "A numeric variable with a suffix of DT has a format that is not a date\
    \ format"
Source:
  Class: "ALL"
  Variable_or_Item: "*DT"
  Natural_Language_Rule_Failure_Criteria: "A numeric variable with a suffix of DT\
    \ does not have a date format"
  Rule_Failure_Criteria: "Variable does not have a date format"
  Condition_Failure: "Numeric variable with a suffix of DT"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.0"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR41"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.1"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR41"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.2"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR41"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.3"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR41"
        Version: "1"
      Version: "5.0"
