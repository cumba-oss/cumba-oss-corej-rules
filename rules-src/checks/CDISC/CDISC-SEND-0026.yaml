Core:
  Id: "CDISC-SEND-0026"
  Status: "Published"
  Version: "1"
Description: "Raise an error when the Trial Summary Parameter Short Name (TSPARMCD)\
  \ value is longer than 8 characters."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "TS"
Requirements:
  Variables:
    All:
    - "TSPARMCD"
Check:
  expression: >-
    len(TSPARMCD) > 8
Outcome:
  Message: "TSPARMCD is longer than 8 characters."
Source:
  Class: "TDM"
  Domain: "TS"
  Variable: "TSPARMCD"
  Plain_Text_Explanation: "TSPARMCD value limited to 8 characters"
  Rule: "TSPARMCD value length <= 8"
