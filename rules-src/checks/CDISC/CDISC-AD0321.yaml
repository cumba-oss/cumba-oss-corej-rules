Core:
  Id: "CDISC-AD0321"
  Status: "Published"
  Version: "1"
Description: "Raise an error when a dataset's label is 'Subject-Level Analysis Dataset'\
  \ and the dataset is not named ADSL."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "ALL"
Check:
  expression: >-
    ds_label("DATA") == "Subject-Level Analysis Dataset" and ds_name("DATA") != "ADSL"
Outcome:
  Message: "This dataset's label is 'Subject-Level Analysis Dataset', but it is not\
    \ named ADSL."
Source:
  Class: "SUBJECT LEVEL ANALYSIS DATASET"
  Natural_Language_Rule_Failure_Criteria: "A dataset label is \"Subject-Level Analysis\
    \ Dataset\" and the dataset is not named ADSL"
  Rule_Failure_Criteria: "Dataset name is not ADSL"
  Condition_Failure: "Dataset label is \"Subject-Level Analysis Dataset\""
Standards:
- Organization: "CDISC"
  Standards:
