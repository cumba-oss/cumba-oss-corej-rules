Core:
  Id: "CDISC-CG0330"
  Status: "Published"
  Version: "1"
Description: "Raise an error when the order of variables does not reflect the order\
  \ of the variables in the SDTM Model for the observation class."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "ALL"
Bindings:
- name: "$model_column_order"
  expression: "get_model_column_order()"
- name: "$model_column_order_upper"
  expression: "upper($model_column_order)"
- name: "$column_order_from_dataset"
  expression: "get_column_order_from_dataset()"
- name: "$column_order_from_dataset_upper"
  expression: "upper($column_order_from_dataset)"
- name: "$not_in_model"
  expression: "minus($column_order_from_dataset_upper, subtract=$model_column_order_upper)"
- name: "$known_order"
  expression: "minus($column_order_from_dataset_upper, subtract=$not_in_model)"
Check:
  expression: >-
    not empty($model_column_order) and not is_ordered_subset_of($known_order,
    $model_column_order_upper)
Outcome:
  Message: "Variables are not in the correct order as shown in the SDTM Model for\
    \ the observation class."
  Output_Variables:
  - "$column_order_from_dataset"
  - "$model_column_order"
  - "!$column_order_from_dataset_upper"
  - "!$model_column_order_upper"
  - "!$known_order"
  - "!$not_in_model"
Source:
  Class: "ALL"
  Domain: "ALL"
  Variable: "GEN"
  Rule: "Variables are ordered with Identifiers first, followed by the Topic, Qualifier,\
    \ and Timing variables. Within each role, variables are ordered as shown in SDTM:\
    \ Tables 2.2.1, 2.2.2, 2.2.3, 2.2.3.1, 2.2.4, and 2.2.5"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "SDTMIG"
    Version: "3.3"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0330"
        Version: "1"
      Version: "2.0"
  - Name: "SDTMIG"
    Version: "3.2"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0330"
        Version: "1"
      Version: "2.0"
