Core:
  Id: "CDISC-AD0483"
  Status: "Published"
  Version: "2"
Description: "Raise an error when BCHGCAyN is populated and BCHGCATy is empty on the\
  \ same record."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "BASIC DATA STRUCTURE"
Check:
  expression: >-
    not empty(BCHGCAyN) and empty(BCHGCATy)
Outcome:
  Message: "BCHGCAyN is populated but BCHGCATy is empty."
  Message_Folded: "BCHGCATy not populated in any record of the dataset, and at least\
    \ one record meets the rest of the condition: BCHGCAyN is populated but BCHGCATy\
    \ is empty."
  Output_Variables:
  - "BCHGCATy"
  - "BCHGCAyN"
wildcards:
  "y":
    min: 1
    max: 99
Source:
  Class: "BASIC DATA STRUCTURE; MEDICAL DEVICE BASIC DATA STRUCTURE"
  Variable_or_Item: "BCHGCATy where y is an integer [1-9, not zero-padded]"
  Natural_Language_Rule_Failure_Criteria: "On a given record, BCHGCAyN is populated\
    \ and BCHGCATy is not populated"
  Rule_Failure_Criteria: "BCHGCATy is not populated"
  Condition_Failure: "BCHGCAyN is populated"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.2"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR483"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.3"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR483"
        Version: "2"
      Version: "5.0"
