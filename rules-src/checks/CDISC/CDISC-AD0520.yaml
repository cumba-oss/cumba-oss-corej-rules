Core:
  Id: "CDISC-AD0520"
  Status: "Published"
  Version: "1"
Description: "Raise an error when a variable's name ends in ETMF and its label does\
  \ not end with 'Imputation Flag' (or 'Imput. Flag') or does not contain 'End' or\
  \ does not contain 'Time'."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "ALL"
Check:
  expression: >-
    ends_with(upper(varname()), "ETMF") and not empty(label_template("LIBRARY", stem="*ETMF")) and
    (var_label("DATA") !~ / Imput(\\.|ation) Flag$/ or not contains(var_label("DATA"), "End") or not
    contains(var_label("DATA"), "Time"))
Outcome:
  Message: "A variable ending in ETMF has a label that does not end with 'Imputation\
    \ Flag' (or 'Imput. Flag') or does not contain 'End' or does not contain 'Time'."
  Output_Variables:
  - "library_variable_label_template"
Source:
  Class: "ALL"
  Variable_or_Item: "*ETMF"
  Natural_Language_Rule_Failure_Criteria: "A variable ending in ETMF must contain\
    \ \"End Time Imputation Flag\" in the label"
  Rule_Failure_Criteria: "*ETMF does not contain \"End Time Imputation Flag\" in the\
    \ label"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.1"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR520"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.2"
