Core:
  Id: "CDISC-AD0513"
  Status: "Published"
  Version: "1"
Description: "Raise an error when a variable name ends in SDTF but its label does\
  \ not end with 'Imputation Flag' (or 'Imput. Flag') or does not contain 'Start'\
  \ or does not contain 'Date', unless the variable is TRTSDTF, TRnnSDTF (nn=01-99),\
  \ or one of the standard library variables."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "ALL"
Bindings:
- name: "$library_variables"
  expression: "get_column_order_from_library()"
Check:
  expression: >-
    ends_with(upper(varname()), "SDTF") and upper(varname()) !~ /^TR(T|0[1-9]|[1-9][0-9])SDTF$/ and
    (var_label("DATA") !~ / Imput(\\.|ation) Flag$/ or not contains(var_label("DATA"), "Start") or
    not contains(var_label("DATA"), "Date")) and upper(varname()) not in $library_variables
Outcome:
  Message: "A variable ending in SDTF has a label that does not end with 'Imputation\
    \ Flag' (or 'Imput. Flag') or does not contain 'Start' or does not contain 'Date'."
  Output_Variables:
  - "variable_name"
  - "variable_label"
Source:
  Class: "ALL"
  Variable_or_Item: "*SDTF"
  Natural_Language_Rule_Failure_Criteria: "A variable ending in SDTF must contain\
    \ \"Start Date Imputation Flag\" in the label"
  Rule_Failure_Criteria: "*SDTF does not contain \"Start Date Imputation Flag\" in\
    \ the label"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.1"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR513"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.2"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR513"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.3"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR513"
        Version: "1"
      Version: "5.0"
