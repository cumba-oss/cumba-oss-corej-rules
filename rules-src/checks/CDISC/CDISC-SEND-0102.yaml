Core:
  Id: "CDISC-SEND-0102"
  Status: "Published"
  Version: "1"
Description: "Raise an error when Age Range (AGETXT) is populated with a value that\
  \ does not follow the 'number-number' format (one or more digits, a hyphen, then\
  \ one or more digits)."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "DM"
Requirements:
  Variables:
    All:
    - "AGETXT"
Check:
  expression: >-
    not empty(AGETXT) and AGETXT !~ /^[0-9]+-[0-9]+$/
Outcome:
  Message: "Invalid value for AGETXT (the value does not follow the 'number-number'\
    \ format)."
Source:
  Class: "SPC, TDM"
  Domain: "DM,TS"
  Variable: "AGETXT"
  Plain_Text_Explanation: "AGETXT is used to present the age range in situations where\
    \ the exact birthdate is not known.  It should be presented in number-number format."
  Condition: "AGETXT^= null"
  Rule: "AGETXT = number-number"
Standards:
- Organization: "CDISC"
  Standards:
