Core:
  Id: "CDISC-SEND-0401"
  Status: "Published"
  Version: "1"
Description: "Raise an error when, within a reproductive phase (RPHASE), the collection\
  \ date (--DTC) is a complete date and the reproductive-phase day (--RPDY) is populated\
  \ but does not equal the date portion of --DTC minus the date portion of the earliest\
  \ phase start date (earliest SJSTDTC within the subject's RPHASE) plus RPRFDY (the\
  \ path's first phase day reference, read from TP through DM.RPATHCD)."
Executability: "Fully Executable"
Scope:
  Classes:
    Include:
    - "SPECIAL PURPOSE"
    - "FINDINGS"
    - "EVENTS"
    - "INTERVENTIONS"
Requirements:
  Variables:
    All:
    - "--DTC"
    - "--RPDY"
    - "USUBJID"
    - "SJ.SJSTDTC"
    - "SJ.USUBJID"
    - "DM.RPATHCD"
    - "TP.RPATHCD"
    - "TP.RPRFDY:N"
    All_Or_None:
    - - "USUBJID"
      - "DM.USUBJID"
    - - "RPHASE"
      - "SJ.RPHASE"
      - "TP.RPHASE"
Match_Datasets:
- Keys:
  - "USUBJID"
  Name: "DM"
Bindings:
- name: "$sj_stages"
  expression: "record_count(domain=\"SJ\", group=[USUBJID, RPHASE])"
- name: "$rprfdy"
  expression: "read_value(RPRFDY, domain=\"TP\", group=[DM.RPATHCD, RPHASE], mode=\"\
    MAX\")"
- name: "$rpref_day"
  expression: "date_diff_days(--DTC, min_date(SJSTDTC, domain=\"SJ\", group=[USUBJID,\
    \ RPHASE])) + $rprfdy"
Check:
  expression: >-
    is_complete_date(--DTC) and not empty(--RPDY) and $sj_stages > 0 and not empty($rprfdy) and
    --RPDY != $rpref_day
Outcome:
  Message: "--RPDY does not equal the reproductive-phase day derived from --DTC, the\
    \ earliest SJSTDTC within the RPHASE, plus RPRFDY (the path's first phase day\
    \ reference, from TP through DM.RPATHCD)."
  Output_Variables:
  - "DM.RPATHCD"
Source:
  Class: "SPC, FND, EVT, INT"
  Domain: "All"
  Variable: "--RPDY"
  Plain_Text_Explanation: "Within a repro phase, if --DTC is populated and the first\
    \ SJSTDTC within the repro phase in SJ is populated then --RPDY should be populated\
    \ using the actual repro phase day algorithm."
  Condition: "Date portion exists for --DTC and SJSTDTC within the RPHASE and --RPDY\
    \ is present"
  Rule: "--RPDY=(date portion of --DTC) - (date portion of earliest SJSTDTC) + RPRFDY"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "SENDIG-DART"
    Version: "1.2"
    References:
    - Origin: "SEND Conformance Rules"
      Rule_Identifier:
        Id: "SEND401"
        Version: "1"
      Version: "5.0"
  - Name: "SENDIG-DART"
    Version: "1.1"
    References:
    - Origin: "SEND Conformance Rules"
      Rule_Identifier:
        Id: "SEND401"
        Version: "1"
      Version: "5.0"
