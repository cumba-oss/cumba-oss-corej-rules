Core:
  Id: "CDISC-AD0738"
  Status: "Published"
  Version: "1"
Description: "Raise an error when there is more than one value of PARAM for a given\
  \ value of PARAMCD, considering only rows on which both variables are populated"
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "BASIC DATA STRUCTURE"
Check:
  expression: >-
    not empty(PARAM) and not empty(PARAMCD) and has_multiple_values_for(PARAM, PARAMCD)
Outcome:
  Message: "PARAM has more than one value for this PARAMCD, among rows where both\
    \ are populated"
Source:
  Class: "BASIC DATA STRUCTURE; MEDICAL DEVICE BASIC DATA STRUCTURE"
  Variable_or_Item: "PARAM"
  Natural_Language_Rule_Failure_Criteria: "There is more than one value of PARAM for\
    \ a given value of PARAMCD, considering only those rows on which both variables\
    \ are populated"
  Rule_Failure_Criteria: "There is more than one value of PARAM for a given value\
    \ of PARAMCD"
  Condition_Failure: "On rows where PARAM and PARAMCD are both populated"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.1"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR738"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.2"
