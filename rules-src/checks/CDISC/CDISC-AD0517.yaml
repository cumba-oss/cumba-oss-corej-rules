Core:
  Id: "CDISC-AD0517"
  Status: "Published"
  Version: "1"
Description: "Raise an error when a variable's name ends in EDTM and its label does\
  \ not contain the phrase of the ADaM implementation guide's *EDTM naming fragment\
  \ ('End Datetime')."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "ALL"
Check:
  expression: >-
    ends_with(upper(varname()), "EDTM") and not empty(label_template("LIBRARY", stem="*EDTM")) and
    not matches_label_template(var_label("DATA"), label_template("LIBRARY", stem="*EDTM"))
Outcome:
  Message: "A variable ending in EDTM does not contain \"End Datetime\" in the label"
  Output_Variables:
  - "library_variable_label_template"
Source:
  Class: "ALL"
  Variable_or_Item: "*EDTM"
  Natural_Language_Rule_Failure_Criteria: "A variable ending in EDTM must contain\
    \ \"End Datetime\" in the label"
  Rule_Failure_Criteria: "*EDTM does not contain \"End Datetime\" in the label"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.1"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR517"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.2"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR517"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.3"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR517"
        Version: "1"
      Version: "5.0"
