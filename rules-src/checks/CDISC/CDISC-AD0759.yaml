Core:
  Id: "CDISC-AD0759"
  Status: "Published"
  Version: "1"
Description: "Raise an error when, within a given value of TRTxxA, there is more than\
  \ one value of TRxxAGy, where xx is an integer [01-99, zero-padded] and y is an\
  \ integer [1-99, not zero-padded]."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "SUBJECT LEVEL ANALYSIS DATASET"
Check:
  expression: >-
    not empty(TRxxAGy) and not empty(TRTxxA) and has_multiple_values_for(TRxxAGy, TRTxxA)
Outcome:
  Message: "Within a given value of TRTxxA, there is more than one value of TRxxAGy"
  Output_Variables:
  - "TRTxxA"
  - "TRxxAGy"
wildcards:
  xx:
    min: 1
    max: 99
  "y":
    min: 1
    max: 99
Source:
  Class: "SUBJECT LEVEL ANALYSIS DATASET"
  Variable_or_Item: "TRxxAGy where xx is an integer [01-99, zero-padded] and y is\
    \ an integer [1-99, not zero-padded]"
  Natural_Language_Rule_Failure_Criteria: "Within a given value of TRTxxA, there is\
    \ more than one value of TRxxAGy, where xx is an integer [01-99, zero-padded]\
    \ and y is an integer [1-99, not zero-padded]"
  Rule_Failure_Criteria: "Within a given value of TRTxxA, there is more than one value\
    \ of TRxxAGy"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.1"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR759"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.2"
