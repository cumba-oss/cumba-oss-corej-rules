Core:
  Id: "CDISC-SEND-0250-A"
  Status: "Published"
  Version: "1"
Description: "Raise an error when the Trial Summary (TS) dataset contains neither\
  \ a record with TSPARMCD equal to 'AGE' nor a record with TSPARMCD equal to 'AGETXT';\
  \ exactly one of the two must be present."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "TS"
Bindings:
- name: "$age_count"
  expression: "record_count(domain=\"TS\", filter=(TSPARMCD == \"AGE\"))"
- name: "$agetxt_count"
  expression: "record_count(domain=\"TS\", filter=(TSPARMCD == \"AGETXT\"))"
Check:
  expression: >-
    $age_count == 0 and $agetxt_count == 0
Outcome:
  Message: "TS contains neither a TSPARMCD 'AGE' record nor a TSPARMCD 'AGETXT' record;\
    \ exactly one must be present."
Source_Proposed:
  Sheet_Issue: "#218"
  Class: "TDM"
  Domain: "TS"
  Variable: "TSPARMCD"
  Plain_Text_Explanation: "Either a record with TSPARMCD of AGE or a record with TSPARMCD\
    \ of AGETXT should be present."
  Rule: "A record with TSPARMCD = AGE or a record with TSPARMCD = AGETXT is present"
Source:
  Class: "TDM"
  Domain: "TS"
  Variable: "TSPARMCD"
  Plain_Text_Explanation: "Either a record with TSPARMCD of AGE or TSPARMCD of AGETXT\
    \ should be present, but not both."
  Rule: "Either a record with TSPARMCD = AGE or TSPARMCD = AGETXT is present; both\
    \ are not present"
