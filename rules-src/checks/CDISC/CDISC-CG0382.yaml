Core:
  Id: "CDISC-CG0382"
  Status: "Published"
  Version: "1"
Description: "Raise an error when a High Level Term Code (--HLTCD) value is not a\
  \ valid High Level Term code in the MedDRA dictionary."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "AE"
    - "CE"
    - "MH"
Requirements:
  Variables:
    All:
    - "--HLTCD"
Bindings:
- name: "$hltcd_valid"
  expression: "valid_external_dictionary_code(--HLTCD, external_dictionary_type=\"\
    meddra\", dictionary_term_type=\"HLTCD\")"
Check:
  expression: >-
    $hltcd_valid == false
Outcome:
  Message: "High Level Term Code (--HLTCD) is not a valid MedDRA High Level Term code."
  Output_Variables:
  - "--HLTCD"
Source:
  Class: "EVT"
  Domain: "AE, MH, CE"
  Variable: "--HLTCD"
  Rule: "--HLTCD = MedDRA high level TERM code"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "SDTMIG"
    Version: "3.4"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0382"
        Version: "1"
      Version: "2.0"
  - Name: "SDTMIG"
    Version: "3.3"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0382"
        Version: "1"
      Version: "2.0"
  - Name: "SDTMIG"
    Version: "3.2"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0382"
        Version: "1"
      Version: "2.0"
