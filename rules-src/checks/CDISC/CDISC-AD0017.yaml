Core:
  Id: "CDISC-AD0017"
  Status: "Published"
  Version: "1"
Description: "Raise an error when the value of a character variable exceeds 200 characters\
  \ in length"
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "ALL"
Check:
  expression: >-
    var_type() == "Char" and len(value()) > 200
Outcome:
  Message: "The character value exceeds 200 characters in length"
Source:
  Class: "ALL"
  Variable_or_Item: "ALL"
  Natural_Language_Rule_Failure_Criteria: "The length of a character value is greater\
    \ than 200 characters"
  Rule_Failure_Criteria: "The length of a character value is greater than 200 characters"
