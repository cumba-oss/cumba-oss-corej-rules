Core:
  Id: "CDISC-AD0891"
  Status: "Published"
  Version: "1"
Description: "Raise an error when, within an ADNCA v1.0 dataset and considering only\
  \ rows on which both COHORTN and COHORT are populated, more than one value of COHORTN\
  \ is present for a given value of COHORT."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "BASIC DATA STRUCTURE"
  Subclasses:
    Include:
    - "NON-COMPARTMENTAL ANALYSIS"
Check:
  expression: >-
    not empty(COHORT) and not empty(COHORTN) and has_multiple_values_for(COHORTN, COHORT)
Outcome:
  Message: "There is more than one value of COHORTN for a given value of COHORT."
Source:
  Class: "BASIC DATA STRUCTURE"
  Subclass: "NON-COMPARTMENTAL ANALYSIS"
  Variable_or_Item: "COHORTN"
  Natural_Language_Rule_Failure_Criteria: "On a given record, there is more than one\
    \ value of COHORTN for a given value of COHORT, considering only those rows on\
    \ which both variables are populated"
  Rule_Failure_Criteria: "There is more than one value of COHORTN for a given value\
    \ of COHORT"
  Condition_Failure: "On rows where both COHORTN and COHORT are both populated."
Standards:
- Organization: "CDISC"
  Standards:
