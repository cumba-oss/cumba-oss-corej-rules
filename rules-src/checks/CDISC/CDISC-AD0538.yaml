Core:
  Id: "CDISC-AD0538"
  Status: "Published"
  Version: "2"
Description: "Raise an error when SMQzzSCN is present but the corresponding SMQzzSC\
  \ is not present, where zz is an integer [01-99, zero-padded]."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "OCCURRENCE DATA STRUCTURE"
    - "MEDICAL DEVICE OCCURRENCE DATA STRUCTURE"
Check:
  expression: >-
    var_exists("SMQzzSCN") and not var_exists("SMQzzSC")
Outcome:
  Message: "SMQzzSCN is present but the corresponding SMQzzSC is not present."
  Output_Variables:
  - "SMQzzSCN"
wildcards:
  zz:
    min: 1
    max: 99
Source:
  Class: "OCCURRENCE DATA STRUCTURE; MEDICAL DEVICE OCCURRENCE DATA STRUCTURE"
  Variable_or_Item: "SMQzzSCN where zz is an integer [01-99, zero-padded]"
  Natural_Language_Rule_Failure_Criteria: "SMQzzSCN is present and SMQzzSC is not\
    \ present"
  Rule_Failure_Criteria: "SMQzzSC is not present"
  Condition_Failure: "SMQzzSCN is present"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.1"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR538"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.2"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR538"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.3"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR538"
        Version: "2"
      Version: "5.0"
