Core:
  Id: "CDISC-SEND-0225"
  Status: "Published"
  Version: "1"
Description: "Raise an error when the Description of Planned Arm (ARM) in DM is populated\
  \ but does not match an ARM value in the Trial Arms (TA) dataset."
Executability: "Partially Executable - Possible Overreporting"
Scope:
  Domains:
    Include:
    - "DM"
Requirements:
  Variables:
    All:
    - "ARM"
Bindings:
- name: "$ta_arm"
  expression: "distinct(ARM, domain=\"TA\")"
Check:
  expression: >-
    not empty(ARM) and ARM not in $ta_arm
Outcome:
  Message: "ARM in DM does not match an ARM value in the Trial Arms (TA) dataset."
  Output_Variables:
  - "$ta_arm"
Source:
  Class: "SPC"
  Domain: "DM"
  Variable: "ARM"
  Plain_Text_Explanation: "If present, the ARM value in DM for a given subject must\
    \ exist in TA."
  Condition: "DM.ARM ^= null"
  Rule: "DM.ARM exists in TA.ARM"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "SENDIG-GENETOX"
    Version: "1.0"
    References:
    - Origin: "SEND Conformance Rules"
      Rule_Identifier:
        Id: "SEND225"
        Version: "1"
      Version: "5.0"
  - Name: "SENDIG-DART"
