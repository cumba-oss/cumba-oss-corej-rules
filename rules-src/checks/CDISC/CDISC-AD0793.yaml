Core:
  Id: "CDISC-AD0793"
  Status: "Published"
  Version: "1"
Description: "Raise an error when, on a given record, a variable with a suffix of\
  \ STM has a value greater than the value of the variable with the same root and\
  \ a suffix of ETM, and both variables are populated"
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "BASIC DATA STRUCTURE"
Check:
  expression: >-
    not empty(*STM) and not empty(*ETM) and *STM > *ETM
Outcome:
  Message: "A variable with a suffix of STM has a greater value than the variable\
    \ with the same root and a suffix of ETM on this record."
  Output_Variables:
  - "*STM"
  - "*ETM"
Source:
  Class: "BASIC DATA STRUCTURE"
  Variable_or_Item: "*SDT"
  Natural_Language_Rule_Failure_Criteria: "On a given record, a variable with a suffix\
    \ of STM has a value greater than a value of a variable with the same root and\
    \ a suffix of ETM, and both variables are populated"
  Rule_Failure_Criteria: "A variable with a suffix of STM has a value greater than\
    \ a value of a variable with the same root and a suffix of ETM"
  Condition_Failure: "On rows where *STM and *ETM are both populated"
Standards:
