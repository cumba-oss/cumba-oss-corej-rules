Core:
  Id: "CDISC-AD0515"
  Status: "Published"
  Version: "1"
Description: "Raise an error when a variable's name ends in EDT and its label does\
  \ not contain the phrase of the ADaM implementation guide's *EDT naming fragment\
  \ ('End Date')."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "ALL"
Check:
  expression: >-
    ends_with(upper(varname()), "EDT") and not empty(label_template("LIBRARY", stem="*EDT")) and not
    matches_label_template(var_label("DATA"), label_template("LIBRARY", stem="*EDT"))
Outcome:
  Message: "A variable ending in EDT does not contain 'End Date' in the label."
  Output_Variables:
  - "library_variable_label_template"
Source:
  Class: "ALL"
  Variable_or_Item: "*EDT"
  Natural_Language_Rule_Failure_Criteria: "A variable ending in EDT must contain \"\
    End Date\" in the label"
  Rule_Failure_Criteria: "*EDT does not contain \"End Date\" in the label"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.1"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR515"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.2"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR515"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.3"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR515"
        Version: "1"
      Version: "5.0"
