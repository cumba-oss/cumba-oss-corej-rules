Core:
  Id: "CDISC-AD0521"
  Status: "Published"
  Version: "1"
Description: "Raise an error when GRyN is present but the corresponding GRy is not\
  \ present, where y is an integer [1-99, not zero-padded]."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "ALL"
Check:
  expression: >-
    var_exists(*GRyN) and not var_exists(*GRy)
Outcome:
  Message: "GRyN is present but the corresponding GRy is not present."
wildcards:
  "y":
    min: 1
    max: 99
Source:
  Class: "ALL"
  Natural_Language_Rule_Failure_Criteria: "A variable which has a suffix of GRyN is\
    \ present and a variable with the same root name and suffix of GRy is not present"
  Rule_Failure_Criteria: "*GRy is not present, where y is an integer [1-99, not zero-padded]"
  Condition_Failure: "*GRyN is present"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.1"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR521"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.2"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR521"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.3"
    References:
