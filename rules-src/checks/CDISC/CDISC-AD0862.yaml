Core:
  Id: "CDISC-AD0862"
  Status: "Published"
  Version: "1"
Description: "Raise an error when, considering only rows on which both COHORTC and\
  \ COHORT are populated, more than one value of COHORTC is present within the dataset\
  \ for a given value of COHORT."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "BASIC DATA STRUCTURE"
Check:
  expression: >-
    not empty(COHORT) and not empty(COHORTC) and has_multiple_values_for(COHORTC, COHORT)
Outcome:
  Message: "More than one value of COHORTC is present for this value of COHORT within\
    \ the dataset."
Source:
  Class: "BASIC DATA STRUCTURE"
  Subclass: "POPULATION PHARMACOKINETIC ANALYSIS"
  Variable_or_Item: "COHORTC"
  Natural_Language_Rule_Failure_Criteria: "Within a dataset, there is more than one\
    \ value of COHORTC for a given value of COHORT, considering only those rows on\
    \ which both variables are populated."
  Rule_Failure_Criteria: "Within a dataset, there is more than one value of COHORTC\
    \ for a given value of COHORT"
  Condition_Failure: "On rows where both COHORTC and COHORT are both populated"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.3"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR862"
        Version: "1"
      Version: "5.0"
