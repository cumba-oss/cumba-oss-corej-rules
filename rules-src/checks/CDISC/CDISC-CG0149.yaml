Core:
  Id: "CDISC-CG0149"
  Status: "Published"
  Version: "1"
Description: "Raise an error when the length of SETCD is greater than 8 characters."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "DM"
    - "TX"
Check:
  expression: >-
    len(SETCD) > 8
Outcome:
  Message: "SETCD value length is greater than 8 characters."
Source:
  Class: "SPC"
  Domain: "DM"
  Variable: "SETCD"
  Rule: "SETCD value length <= 8"
Standards:
- Organization: "CDISC"
  Standards:
