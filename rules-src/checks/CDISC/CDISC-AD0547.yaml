Core:
  Id: "CDISC-AD0547"
  Status: "Published"
  Version: "2"
Description: "Raise an error when PARCATyN is present but the corresponding PARCATy\
  \ is not present, where y is an integer [1-99, not zero-padded]."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "BASIC DATA STRUCTURE"
Check:
  expression: >-
    var_exists("PARCATyN") and not var_exists("PARCATy")
Outcome:
  Message: "PARCATyN is present but the corresponding PARCATy is not present."
  Output_Variables:
  - "PARCATyN"
wildcards:
  "y":
    min: 1
    max: 99
Source:
  Class: "BASIC DATA STRUCTURE; MEDICAL DEVICE BASIC DATA STRUCTURE"
  Variable_or_Item: "PARCATyN where y is an integer [1-9, not zero-padded]"
  Natural_Language_Rule_Failure_Criteria: "PARCATyN is present and PARCATy is not\
    \ present"
  Rule_Failure_Criteria: "PARCATy is not present"
  Condition_Failure: "PARCATyN is present"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.1"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR547"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.2"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR547"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.3"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR547"
        Version: "2"
      Version: "5.0"
