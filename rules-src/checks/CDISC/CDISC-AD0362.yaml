Core:
  Id: "CDISC-AD0362"
  Status: "Published"
  Version: "1"
Description: "Raise an error when the value of ASTDTM is greater than the value of\
  \ AENDTM"
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "ALL"
Requirements:
  Variables:
    All:
    - "ASTDTM"
    - "AENDTM"
Check:
  expression: >-
    not empty(ASTDTM) and not empty(AENDTM) and ASTDTM > AENDTM
Outcome:
  Message: "ASTDTM is greater than AENDTM."
Source:
  Class: "ALL"
  Variable_or_Item: "ASTDTM"
  Natural_Language_Rule_Failure_Criteria: "The value of ASTDTM is greater than the\
    \ value of AENDTM, considering only those rows on which both variables are populated"
  Rule_Failure_Criteria: "The value of ASTDTM is greater than the value of AENDTM"
  Condition_Failure: "Considering only those rows on which both ASTDTM and AENDTM\
    \ are populated"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.0"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
