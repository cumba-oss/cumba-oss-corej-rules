Core:
  Id: "CDISC-AD0363"
  Status: "Published"
  Version: "1"
Description: "Raise an error when ONTRTFL is populated and not equal to 'Y'."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "BASIC DATA STRUCTURE"
    - "OCCURRENCE DATA STRUCTURE"
Requirements:
  Variables:
    All:
    - "ONTRTFL"
Check:
  expression: >-
    not empty(ONTRTFL) and ONTRTFL != "Y"
Outcome:
  Message: "ONTRTFL is populated but not equal to 'Y'."
Source:
  Class: "BASIC DATA STRUCTURE; OCCURRENCE DATA STRUCTURE"
  Variable_or_Item: "ONTRTFL"
  Natural_Language_Rule_Failure_Criteria: "ONTRTFL is not equal to Y or null"
  Rule_Failure_Criteria: "ONTRTFL is not equal to Y or null"
