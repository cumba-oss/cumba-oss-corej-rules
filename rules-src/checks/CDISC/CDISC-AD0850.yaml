Core:
  Id: "CDISC-AD0850"
  Status: "Published"
  Version: "1"
Description: "Raise an error when ROUTE is populated and ROUTEN is not populated."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "BASIC DATA STRUCTURE"
Requirements:
  Variables:
    All:
    - "ROUTE"
    - "ROUTEN"
Check:
  expression: >-
    not empty(ROUTE) and empty(ROUTEN)
Outcome:
  Message: "ROUTE is populated, but ROUTEN is not populated."
  Message_Folded: "ROUTEN not populated in any record of the dataset, and at least\
    \ one record meets the rest of the condition: ROUTE is populated, but ROUTEN is\
    \ not populated."
Source:
  Class: "BASIC DATA STRUCTURE"
  Subclass: "POPULATION PHARMACOKINETIC ANALYSIS"
  Variable_or_Item: "ROUTEN"
  Natural_Language_Rule_Failure_Criteria: "ROUTE is populated and ROUTEN is not populated"
  Rule_Failure_Criteria: "ROUTEN is not populated"
  Condition_Failure: "ROUTE is populated"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.3"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR850"
        Version: "1"
      Version: "5.0"
