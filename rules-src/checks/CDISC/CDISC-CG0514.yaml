Core:
  Id: "CDISC-CG0514"
  Status: "Published"
  Version: "1"
Description: "Raise an error when, for a study that does not use multi-stage Arm assignments,\
  \ Description of Actual Arm (ACTARM) is populated and its value is not an Arm (ARM)\
  \ in the Trial Arms (TA) dataset."
Executability: "Partially Executable - Possible Overreporting"
Scope:
  Domains:
    Include:
    - "DM"
Bindings:
- name: "$ta_arm"
  expression: "distinct(ARM, domain=\"TA\")"
Check:
  expression: >-
    not empty(ACTARM) and ACTARM not in $ta_arm
Outcome:
  Message: "ACTARM is populated but is not a value of ARM in the TA dataset."
  Output_Variables:
  - "ACTARM"
  - "$ta_arm"
Source:
  Class: "SPC"
  Domain: "DM"
  Variable: "ACTARM"
  Condition: "Study does not use multi-stage arm assignments and ACTARM ^= null"
  Rule: "ACTARM in TA.ARM"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "SDTMIG"
    Version: "3.4"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0514"
        Version: "1"
      Version: "2.0"
  - Name: "SDTMIG"
    Version: "3.3"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0514"
        Version: "1"
      Version: "2.0"
