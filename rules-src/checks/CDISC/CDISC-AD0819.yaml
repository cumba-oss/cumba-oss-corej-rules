Core:
  Id: "CDISC-AD0819"
  Status: "Published"
  Version: "1"
Description: "Raise an error when SUBJIDN is present and SUBJID is not present."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "BASIC DATA STRUCTURE"
Check:
  expression: >-
    var_exists("SUBJIDN") and not var_exists("SUBJID")
Outcome:
  Message: "SUBJIDN is present, but SUBJID is not present."
  Output_Variables:
  - "SUBJIDN"
Source:
  Class: "BASIC DATA STRUCTURE"
  Subclass: "POPULATION PHARMACOKINETIC ANALYSIS"
  Variable_or_Item: "SUBJIDN"
  Natural_Language_Rule_Failure_Criteria: "SUBJIDN is present and SUBJID is not present"
  Rule_Failure_Criteria: "SUBJID is not present"
  Condition_Failure: "SUBJIDN is present"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.3"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR819"
        Version: "1"
      Version: "5.0"
