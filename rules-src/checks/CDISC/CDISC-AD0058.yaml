Core:
  Id: "CDISC-AD0058"
  Status: "Published"
  Version: "1"
Description: "Raise an error when a variable with a name ending in DT is not a numeric\
  \ variable"
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "ALL"
Check:
  expression: >-
    ends_with(upper(varname()), "DT") and var_type("DATA") != "Num"
Outcome:
  Message: "This variable's name ends in DT, but it is not a numeric variable"
Source:
  Class: "ALL"
  Variable_or_Item: "*DT"
  Natural_Language_Rule_Failure_Criteria: "A variable with a suffix of DT is not a\
    \ numeric variable"
  Rule_Failure_Criteria: "A variable is not a numeric variable"
