Core:
  Id: "CDISC-SEND-0172"
  Status: "Published"
  Version: "1"
Description: "Raise an error when a Derived Flag (--DRVFL) is populated with a value\
  \ other than \"Y\"; --DRVFL must be either \"Y\" or empty."
Executability: "Fully Executable"
Scope:
  Classes:
    Include:
    - "FINDINGS"
Requirements:
  Variables:
    All:
    - "--DRVFL"
Check:
  expression: >-
    not empty(--DRVFL) and --DRVFL != "Y"
Outcome:
  Message: "--DRVFL is populated with a value other than \"Y\"."
Source:
  Class: "FND"
  Domain: "ALL"
  Variable: "--DRVFL"
  Plain_Text_Explanation: "--DRVFL value must be either \"Y\" or null."
  Condition: "--DRVFL ^= null"
  Rule: "--DRVFL = \"Y\""
