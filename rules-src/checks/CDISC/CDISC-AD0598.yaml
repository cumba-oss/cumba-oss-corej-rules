Core:
  Id: "CDISC-AD0598"
  Status: "Published"
  Version: "1"
Description: "Raise an error when, on a BDS or OCCDS record, ASPRSDT does not equal\
  \ the ADSL variable PxxSwSDT for the same USUBJID (where xx equals the record's\
  \ APERIOD value and w equals the record's ASPER value)."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "BASIC DATA STRUCTURE"
    - "OCCURRENCE DATA STRUCTURE"
Requirements:
  Variables:
    All:
    - "STUDYID"
    - "USUBJID"
    - "ASPRSDT"
    - "APERIOD"
    - "ASPER"
    All_Or_None:
    - - "STUDYID"
      - "ADSL.STUDYID"
    - - "USUBJID"
      - "ADSL.USUBJID"
Match_Datasets:
- Name: "ADSL"
  Keys:
  - "STUDYID"
  - "USUBJID"
  Cardinality: "n:1"
Bindings:
- name: "$p_s_sdt"
  expression: "colref(concat(\"ADSL.P\", printf(\"%02dS%d\", APERIOD, ASPER), \"SDT\"\
    ))"
Check:
  expression: >-
    not empty(ASPRSDT) and not empty($p_s_sdt) and ASPRSDT != $p_s_sdt
Outcome:
  Message: "On a given record, the value of ASPRSDT is not equal to the value of variable\
    \ PxxSwSDT where xx equals the value of APERIOD and w equals the value of ASPER"
  Output_Variables:
  - "APERIOD"
  - "ASPER"
  - "ADSL.PxxSwSDT"
  - "!$p_s_sdt"
Source:
  Class: "ALL"
  Variable_or_Item: "ASPRST"
  Natural_Language_Rule_Failure_Criteria: "On a given record, the value of ASPRSDT\
    \ is not equal to the value of variable PxxSwSDT where xx equals the value of\
    \ APERIOD and w equals the value of ASPER"
  Rule_Failure_Criteria: "On a given record, the value of ASPRSDT is not equal to\
    \ the value of variable PxxSwSDT where xx equals the value of APERIOD and w equals\
    \ the value of ASPER"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.2"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR598"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.3"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR598"
        Version: "1"
      Version: "5.0"
