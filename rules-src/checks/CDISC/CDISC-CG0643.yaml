Core:
  Id: "CDISC-CG0643"
  Status: "Published"
  Version: "1"
Description: "Raise an error when the STRAIN variable is present in the Demographics\
  \ (DM) dataset, since STRAIN is not used in human clinical trials."
Executability: "Not Executable"
ExecutabilityHint:
  Category: "not executable"
  Detail: "Parked as an R-5.26 duplicate of CDISC-CG0357 (owner rulings D-8 + D-18,\
    \ 2026-09-14): the two are identical in every field but the id. ⛔ The SURVIVOR\
    \ IS NOT THE HIGHER NUMBER here — D-18 makes COVERAGE the invariant and the number\
    \ only a tie-break. CDISC-CG0643 ships into a strict SUBSET of CDISC-CG0357's\
    \ packages, so parking CDISC-CG0357 instead would leave the standards only it\
    \ reaches with no active rule. Every standard either rule names keeps an active\
    \ rule."
Scope:
  Domains:
    Include:
    - "DM"
Check:
  expression: >-
    var_exists("STRAIN")
Outcome:
  Message: "STRAIN must not be present in the Demographics (DM) dataset because it\
    \ is not used in human clinical trials."
  Output_Variables:
  - "STRAIN"
Source:
  Class: "SPC"
  Domain: "DM"
  Variable: "STRAIN"
  Rule: "STRAIN not present in dataset"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "SDTMIG"
    Version: "3.4"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0643"
        Version: "1"
      Version: "2.0"
