Core:
  Id: "CDISC-AD0647"
  Status: "Published"
  Version: "2"
Description: "Raise an error when TREMxxFL is Y but TRTEMFL is not Y."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "OCCURRENCE DATA STRUCTURE"
    - "MEDICAL DEVICE OCCURRENCE DATA STRUCTURE"
Requirements:
  Variables:
    All:
    - "TRTEMFL"
Check:
  expression: >-
    varname() =~ /^TREM(0[1-9]|[1-9][0-9])FL$/ and value() == "Y" and TRTEMFL != "Y"
Outcome:
  Message: "TREMxxFL is Y, but TRTEMFL is not Y."
  Output_Variables:
  - "variable_name"
  - "variable_value"
  - "TRTEMFL"
Source:
  Class: "OCCURRENCE DATA STRUCTURE; MEDICAL DEVICE OCCURRENCE DATA STRUCTURE"
  Variable_or_Item: "TRTEMFL"
  Natural_Language_Rule_Failure_Criteria: "TREMxxFL is Y but TRTEMFL is not Y"
  Rule_Failure_Criteria: "TRTEMFL is not equal to Y"
  Condition_Failure: "TREMxxFL is equal to Y"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.0"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
