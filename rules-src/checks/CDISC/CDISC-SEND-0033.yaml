Core:
  Id: "CDISC-SEND-0033"
  Status: "Published"
  Version: "1"
Description: "Raise an error when the two-character domain code (DOMAIN) contains\
  \ a lowercase letter; the domain code must be represented in uppercase."
Executability: "Fully Executable"
Scope:
  Classes:
    Include:
    - "INTERVENTIONS"
    - "EVENTS"
    - "FINDINGS"
Requirements:
  Variables:
    All:
    - "DOMAIN"
Check:
  expression: >-
    DOMAIN =~ /.*[a-z]/
Outcome:
  Message: "The domain code (DOMAIN) is not in uppercase (it contains a lowercase\
    \ letter)."
Source:
  Class: "INT, EVT, FND"
  Domain: "ALL"
  Variable: "GEN"
  Plain_Text_Explanation: "Two character domain identifier is in uppercase"
  Rule: "Two character domain identifier is in uppercase"
