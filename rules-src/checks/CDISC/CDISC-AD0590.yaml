Core:
  Id: "CDISC-AD0590"
  Status: "Published"
  Version: "1"
Description: "Raise an error when a variable is present with the same name as a variable\
  \ in ADSL, but the two variables do not have identical data types."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "ALL"
Bindings:
- name: "$adsl_data_type"
  expression: "cross_dataset_variable_metadata(\"data_type\", domain=\"ADSL\")"
Check:
  expression: >-
    not empty($adsl_data_type) and var_type("DATA") != $adsl_data_type
Outcome:
  Message: "This variable and the identically named ADSL variable do not have identical\
    \ data types."
  Output_Variables:
  - "variable_data_type"
  - "$adsl_data_type"
Source:
  Class: "ALL"
  Variable_or_Item: "ALL"
  Natural_Language_Rule_Failure_Criteria: "A variable is present with the same name\
    \ as a variable present in ADSL but the variables do not have identical data types"
  Rule_Failure_Criteria: "A variable in the ADaM IG and a variable in ADSL with the\
    \ same name do not have identical data types"
  Condition_Failure: "A variable is present in ADSL with the same name as a variable\
    \ present in ADaM IG"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.2"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR590"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.3"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR590"
        Version: "1"
      Version: "5.0"
