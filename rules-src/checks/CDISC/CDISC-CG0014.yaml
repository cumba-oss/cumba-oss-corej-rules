Core:
  Id: "CDISC-CG0014"
  Status: "Published"
  Version: "1"
Description: "Raise an error when a variable whose Core designation in the SDTMIG\
  \ is Required is not present in the dataset."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "ALL"
Bindings:
- name: "$required_variables"
  expression: "required_variables()"
- name: "$dataset_variables"
  expression: "get_column_order_from_dataset()"
- name: "$dataset_variables_upper"
  expression: "upper($dataset_variables)"
- name: "$missing_required_variables"
  expression: "minus($required_variables, subtract=$dataset_variables_upper)"
Check:
  expression: >-
    not contains_all($dataset_variables_upper, $required_variables)
Outcome:
  Message: "A Required variable is not present in the dataset."
  Output_Variables:
  - "$missing_required_variables"
  - "!$dataset_variables_upper"
Source:
  Class: "ALL"
  Domain: "ALL"
  Variable: "GEN"
  Condition: "Variable Core Status = Required"
  Rule: "Variable present in dataset and ^= null"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "SDTMIG"
    Version: "3.4"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0014"
        Version: "1"
      Version: "2.0"
  - Name: "SDTMIG"
    Version: "3.3"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0014"
        Version: "1"
      Version: "2.0"
  - Name: "SDTMIG"
    Version: "3.2"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0014"
        Version: "1"
      Version: "2.0"
