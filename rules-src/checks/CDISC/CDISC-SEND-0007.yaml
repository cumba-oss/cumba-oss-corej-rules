Core:
  Id: "CDISC-SEND-0007"
  Status: "Published"
  Version: "1"
Description: "Raise an error when no controlled terminology codelist is declared in\
  \ the Define-XML variable-level metadata for a variable that the SENDIG associates\
  \ with controlled terminology."
Executability: "Partially Executable - Possible Underreporting"
Scope:
  Domains:
    Include:
    - "ALL"
Variable_Universe: "Define"
Check:
  expression: >-
    not empty(var_name("DEFINE")) and not empty(var_codelist("LIBRARY")) and
    empty(var_codelist("DEFINE"))
Outcome:
  Message: "The Define-XML variable-level metadata does not declare the controlled\
    \ terminology codelist that the SENDIG assigns to the variable."
Source:
  Class: "ALL"
  Domain: "ALL"
  Variable: "GEN"
  Plain_Text_Explanation: "Variable-level metadata in Define-XML document should include\
    \ the set of Controlled Terminology for the value or the presentation format of\
    \ the variable (Controlled Term, Codelist or Format)."
  Rule: "Variable-level metadata in Define-XML document matches the \"Controlled Terms,\
    \ Codelist, or Format\" in the SENDIG"
