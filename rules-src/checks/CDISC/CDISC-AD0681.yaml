Core:
  Id: "CDISC-AD0681"
  Status: "Published"
  Version: "1"
Description: "Raise an error when there is more than one value of MODELGy for a given\
  \ value of MODELGyN, considering only rows where both variables are populated."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "DEVICE LEVEL ANALYSIS DATASET"
Check:
  expression: >-
    not empty(MODELGy) and not empty(MODELGyN) and has_multiple_values_for(MODELGy, MODELGyN)
Outcome:
  Message: "More than one value of MODELGy was found for a given value of MODELGyN,\
    \ among the rows where both variables are populated."
  Output_Variables:
  - "MODELGy"
  - "MODELGyN"
wildcards:
  "y":
    min: 1
    max: 99
Source:
  Class: "DEVICE LEVEL ANALYSIS DATASET"
  Variable_or_Item: "MODELGy where y is an integer [1-99, not zero-padded]"
  Natural_Language_Rule_Failure_Criteria: "There is more than one value of MODELGy\
    \ for a given value of MODELGyN, considering only those rows on which both variables\
    \ are populated"
  Rule_Failure_Criteria: "There is more than one value of MODELGy for a given value\
    \ of MODELGyN"
  Condition_Failure: "On rows where both MODELGy and MODELGyN are both populated."
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.3"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR681"
        Version: "1"
      Version: "5.0"
