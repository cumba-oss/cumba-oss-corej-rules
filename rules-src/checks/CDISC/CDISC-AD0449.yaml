Core:
  Id: "CDISC-AD0449"
  Status: "Published"
  Version: "1"
Description: "Raise an error when DTHCAUSN is populated but DTHCAUS is empty"
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "SUBJECT LEVEL ANALYSIS DATASET"
Check:
  expression: >-
    not empty(DTHCAUSN) and empty(DTHCAUS)
Outcome:
  Message: "DTHCAUSN is populated, but DTHCAUS is empty"
  Message_Folded: "DTHCAUS absent or not populated in any record of the dataset, and\
    \ at least one record meets the rest of the condition: DTHCAUSN is populated,\
    \ but DTHCAUS is empty"
Source:
  Class: "SUBJECT LEVEL ANALYSIS DATASET"
  Variable_or_Item: "DTHCAUS"
  Natural_Language_Rule_Failure_Criteria: "On a given record, DTHCAUSN is populated\
    \ and DTHCAUS is not populated"
  Rule_Failure_Criteria: "DTHCAUS is not populated"
  Condition_Failure: "DTHCAUSN is populated"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.2"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR449"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.3"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR449"
        Version: "1"
      Version: "5.0"
