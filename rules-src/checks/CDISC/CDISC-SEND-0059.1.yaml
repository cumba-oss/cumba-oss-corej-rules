Core:
  Id: "CDISC-SEND-0059.1"
  Status: "Published"
  Version: "1"
Description: "Raise an error when --EVLINT, --ELTM, or --DUR is populated with a value\
  \ that is not a valid ISO 8601 duration; the negative-interval extension format\
  \ is accepted."
Executability: "Fully Executable"
Scope:
  Classes:
    Include:
    - "INTERVENTIONS"
    - "EVENTS"
    - "FINDINGS"
Check:
  expression: >-
    var_exists("--EVLINT") and not empty(--EVLINT) and invalid_duration(--EVLINT, negative=true) or
    var_exists("--ELTM") and not empty(--ELTM) and invalid_duration(--ELTM, negative=true) or
    var_exists("--DUR") and not empty(--DUR) and invalid_duration(--DUR, negative=true)
Outcome:
  Message: "--EVLINT, --ELTM, or --DUR is not a valid ISO 8601 duration value."
  Output_Variables:
  - "--EVLINT"
  - "--ELTM"
  - "--DUR"
Source:
  Class: "INT, EVT, FND"
  Domain: "ALL"
  Variable: "--EVLINT, --ELTM, --DUR"
  Plain_Text_Explanation: "--EVLINT, --ELTM, --DUR must be in ISO 8601 duration format,\
    \ including the additional format that allows the representation of  \"negative\"\
    \ intervals of time."
  Rule: "--EVLINT, --ELTM, --DUR must be in ISO 8601 duration format, including the\
    \ additional format that allows the representation of  \"negative\" intervals\
    \ of time."
