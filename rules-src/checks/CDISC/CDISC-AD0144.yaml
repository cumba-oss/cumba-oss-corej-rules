Core:
  Id: "CDISC-AD0144"
  Status: "Published"
  Version: "2"
Description: "Raise an error when PARAMCD starts with a character other than a letter."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "BASIC DATA STRUCTURE"
    - "MEDICAL DEVICE BASIC DATA STRUCTURE"
Check:
  expression: >-
    not empty(PARAMCD) and not between(char(PARAMCD), char("A"), char("Z"))
Outcome:
  Message: "The first character of PARAMCD is not a letter."
Source:
  Class: "BASIC DATA STRUCTURE; MEDICAL DEVICE BASIC DATA STRUCTURE"
  Variable_or_Item: "PARAMCD"
  Natural_Language_Rule_Failure_Criteria: "PARAMCD starts with a character other than\
    \ a letter"
  Rule_Failure_Criteria: "PARAMCD starts with a character other than a letter"
