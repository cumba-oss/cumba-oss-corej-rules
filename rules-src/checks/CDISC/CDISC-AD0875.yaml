Core:
  Id: "CDISC-AD0875"
  Status: "Published"
  Version: "1"
Description: "Raise an error when COUNTRY is populated and COUNTRYN is not populated"
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "BASIC DATA STRUCTURE"
Check:
  expression: >-
    not empty(COUNTRY) and empty(COUNTRYN)
Outcome:
  Message: "COUNTRY is populated, but COUNTRYN is not populated"
Source:
  Class: "BASIC DATA STRUCTURE"
  Subclass: "POPULATION PHARMACOKINETIC ANALYSIS"
  Variable_or_Item: "COUNTRYN"
  Natural_Language_Rule_Failure_Criteria: "COUNTRY is populated and COUNTRYN is not\
    \ populated"
  Rule_Failure_Criteria: "COUNTRYN is not populated"
  Condition_Failure: "COUNTRY is populated"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.3"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR875"
        Version: "1"
      Version: "5.0"
