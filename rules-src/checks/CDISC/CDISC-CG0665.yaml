Core:
  Id: "CDISC-CG0665"
  Status: "Published"
  Version: "1"
Description: "Raise an error when AGE is populated but AGEU is not present or empty."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "DM"
Check:
  expression: >-
    not empty(AGE) and empty(AGEU)
Outcome:
  Message: "AGEU is empty when AGE is populated."
  Message_Folded: "AGEU absent or not populated in any record of the dataset, and\
    \ at least one record meets the rest of the condition: AGEU is empty when AGE\
    \ is populated."
Source:
  Class: "SPC"
  Domain: "DM"
  Variable: "AGEU"
  Condition: "AGE ^= null"
  Rule: "AGEU ^= null"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "SDTMIG"
    Version: "3.4"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0665"
        Version: "2"
      Version: "2.0"
