Core:
  Id: "CDISC-SEND-0337"
  Status: "Published"
  Version: "1"
Description: "Raise an error when a reference time point (--TPTREF) is provided but\
  \ the Planned Start (--STINT) or Planned End (--ENINT) of the assessment interval\
  \ is empty."
Executability: "Partially Executable - Possible Overreporting"
Scope:
  Domains:
    Include:
    - "CV"
    - "RE"
Check:
  expression: >-
    not empty(--TPTREF) and (empty(--STINT) or empty(--ENINT))
Outcome:
  Message: "--STINT or --ENINT is empty for a record where a reference time point\
    \ (--TPTREF) is provided."
  Message_Folded: "--ENINT or --STINT absent or not populated in any record of the\
    \ dataset, and at least one record meets the rest of the condition: --STINT or\
    \ --ENINT is empty for a record where a reference time point (--TPTREF) is provided."
Source:
  Class: "FND"
  Domain: "CV, RE"
  Variable: "--STINT and --ENINT"
  Plain_Text_Explanation: "If there is a planned assessment interval, --STINT and\
    \ --ENINT should be used to describe the known assessment interval whenever there\
    \ is a reference time point (--TPTREF)."
  Condition: "--TPTREF ^= null AND measurement is made over a planned assessment interval"
  Rule: "--STINT ^= null  AND --ENINT ^= null"
