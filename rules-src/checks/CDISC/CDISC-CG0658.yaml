Core:
  Id: "CDISC-CG0658"
  Status: "Published"
  Version: "1"
Description: "Raise an error when SVPRESP is empty and VISITDY is populated. VISITDY\
  \ is the Planned Study Day of a visit and should not be populated for unplanned\
  \ visits."
Executability: "Partially Executable - Possible Overreporting"
Scope:
  Domains:
    Include:
    - "SV"
Requirements:
  Variables:
    All:
    - "VISITDY"
Check:
  expression: >-
    (var_exists("SVPRESP") and SVPRESP != "Y" or not var_exists("SVPRESP") and (not empty(SVUPDES)
    or contains(upper(VISIT), "UNSCHEDUL") or contains(upper(VISIT), "UNPLAN"))) and not
    empty(VISITDY)
Outcome:
  Message: "VISITDY is populated for an unplanned visit. VISITDY is the Planned Study\
    \ Day of a visit and should not be populated for unplanned visits."
Source:
  Class: "SPC"
  Domain: "SV"
  Variable: "VISITDY"
  Condition: "SVPRESP = null"
  Rule: "VISITDY = null"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "SDTMIG"
    Version: "3.4"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0658"
        Version: "1"
      Version: "2.0"
