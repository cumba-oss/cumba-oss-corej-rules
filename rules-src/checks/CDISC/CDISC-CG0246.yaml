Core:
  Id: "CDISC-CG0246"
  Status: "Published"
  Version: "1"
Description: "Raise an error when the value of Element Code (ETCD) is longer than\
  \ 8 characters."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "TA"
    - "TE"
    - "SE"
Check:
  expression: >-
    len(ETCD) > 8
Outcome:
  Message: "ETCD value length is greater than 8 characters."
  Output_Variables:
  - "ETCD"
Source:
  Class: "TDM, SPC"
  Domain: "TA, TE, SE"
  Variable: "ETCD"
  Rule: "ETCD value length <= 8"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "SDTMIG"
    Version: "3.4"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0246"
        Version: "1"
      Version: "2.0"
  - Name: "SDTMIG"
    Version: "3.3"
    References:
