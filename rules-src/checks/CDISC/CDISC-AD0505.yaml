Core:
  Id: "CDISC-AD0505"
  Status: "Published"
  Version: "1"
Description: "Raise an error when a variable's name ends in DTM and its label does\
  \ not contain the phrase of the ADaM implementation guide's *DTM naming fragment\
  \ ('Datetime') - every such name, also one that ends in SDTM or EDTM and so falls\
  \ under that longer fragment's rule as well."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "ALL"
Check:
  expression: >-
    ends_with(upper(varname()), "DTM") and not empty(label_template("LIBRARY", stem="*DTM")) and not
    matches_label_template(var_label("DATA"), label_template("LIBRARY", stem="*DTM"))
Outcome:
  Message: "The variable's name ends in DTM, but its label does not contain 'Datetime'."
  Output_Variables:
  - "library_variable_label_template"
Source:
  Class: "ALL"
  Variable_or_Item: "*DTM"
  Natural_Language_Rule_Failure_Criteria: "A variable ending in DTM must contain \"\
    Datetime\" in the label"
  Rule_Failure_Criteria: "*DTM does not contain \"Datetime\" in the label"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.1"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR505"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.2"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR505"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.3"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR505"
        Version: "1"
      Version: "5.0"
