Core:
  Id: "CDISC-CG0166"
  Status: "Published"
  Version: "1"
Description: "Raise an error when IDVARVAL is populated but RDOMAIN is empty."
Executability: "Partially Executable - Possible Underreporting"
Scope:
  Domains:
    Include:
    - "CO"
Requirements:
  Variables:
    All:
    - "IDVARVAL"
Check:
  expression: >-
    not empty(IDVARVAL) and empty(RDOMAIN)
Outcome:
  Message: "RDOMAIN is not populated when IDVARVAL is populated."
  Message_Folded: "RDOMAIN is absent or empty although IDVAR or IDVARVAL is populated."
Source:
  Class: "SPC"
  Domain: "CO"
  Variable: "RDOMAIN"
  Condition: "IDVARVAL ^= null"
  Rule: "RDOMAIN ^= null"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "SDTMIG"
    Version: "3.4"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0166"
        Version: "1"
      Version: "2.0"
  - Name: "SDTMIG"
    Version: "3.3"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0166"
        Version: "1"
      Version: "2.0"
  - Name: "SDTMIG"
    Version: "3.2"
