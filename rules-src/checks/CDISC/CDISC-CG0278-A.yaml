Core:
  Id: "CDISC-CG0278-A"
  Status: "Published"
  Version: "1"
Description: "Raise an error when a record exists with TSPARMCD equal to 'STYPE' and\
  \ TSVAL equal to 'INTERVENTIONAL', but no record with TSPARMCD equal to 'INTTYPE'\
  \ is present in TS."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "TS"
Bindings:
- name: "$STYPE_INTERVENTIONAL"
  expression: "record_count(filter=(TSPARMCD == \"STYPE\" and TSVAL == \"INTERVENTIONAL\"\
    ))"
- name: "$INTTYPE_N"
  expression: "record_count(filter=(TSPARMCD == \"INTTYPE\"))"
Check:
  expression: >-
    $STYPE_INTERVENTIONAL >= 1 and $INTTYPE_N == 0
Outcome:
  Message: "The required INTTYPE Trial Summary Parameter is missing from TS when a\
    \ record exists with TSPARMCD equal to 'STYPE' and TSVAL equal to 'INTERVENTIONAL'."
  Output_Variables:
  - "$INTTYPE_N"
Source_Proposed:
  Class: "TDM"
  Domain: "TS"
  Variable: "TSVAL"
  Condition: "TSPARMCD = 'INTTYPE' and record exists where TSPARMCD = 'STYPE' and\
    \ TSVAL = 'INTERVENTIONAL'"
  Rule: "a record exists with TSPARMCD equal to 'STYPE' and TSVAL equal to 'INTERVENTIONAL',\
    \ but no record with TSPARMCD equal to 'INTTYPE' is present in TS"
Source:
  Class: "TDM"
  Domain: "TS"
  Variable: "TSVAL"
  Condition: "TSPARMCD = 'INTTYPE' and record exists where TSPARMCD = 'STYPE' and\
    \ TSVAL = 'INTERVENTIONAL'"
  Rule: "TSVAL ^= null"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "SDTMIG"
    Version: "3.3"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0278"
        Version: "1"
      Version: "2.0"
  - Name: "SDTMIG"
    Version: "3.2"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0278"
        Version: "1"
      Version: "2.0"
