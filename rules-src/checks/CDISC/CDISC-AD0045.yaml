Core:
  Id: "CDISC-AD0045"
  Status: "Published"
  Version: "1"
Description: "Raise an error when a variable with a suffix of DT and a variable with\
  \ a suffix of DTM with the same root name are both populated and the date portion\
  \ of the DTM value does not equal the DT value"
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "ALL"
Check:
  expression: >-
    not empty(*DT) and not empty(*DTM) and date_part(date(*DTM)) != date(*DT)
Outcome:
  Message: "The date portion of the value of the DTM-suffixed variable does not equal\
    \ the value of the DT-suffixed variable with the same root name"
  Output_Variables:
  - "*DT"
  - "*DTM"
Source:
  Class: "ALL"
  Variable_or_Item: "*DT; *DTM"
  Natural_Language_Rule_Failure_Criteria: "A variable with a suffix of DT and a variable\
    \ with a suffix of DTM with the same root name have different date values"
  Rule_Failure_Criteria: "Date values are different"
  Condition_Failure: "Variable with a suffix of DT and a variable with a suffix of\
    \ DTM with the same root name"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.0"
    References:
    - Origin: "ADaM Conformance Rules"
