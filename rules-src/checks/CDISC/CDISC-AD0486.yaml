Core:
  Id: "CDISC-AD0486"
  Status: "Published"
  Version: "2"
Description: "Raise an error when CRITyFL is populated and CRITyFN is missing on the\
  \ same record."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "BASIC DATA STRUCTURE"
    - "MEDICAL DEVICE BASIC DATA STRUCTURE"
    - "OCCURRENCE DATA STRUCTURE"
    - "MEDICAL DEVICE OCCURRENCE DATA STRUCTURE"
Check:
  expression: >-
    not empty(CRITyFL) and empty(CRITyFN)
Outcome:
  Message: "CRITyFL is populated but CRITyFN is missing."
  Message_Folded: "CRITyFN not populated in any record of the dataset, and at least\
    \ one record meets the rest of the condition: CRITyFL is populated but CRITyFN\
    \ is missing."
  Output_Variables:
  - "CRITyFL"
  - "CRITyFN"
wildcards:
  "y":
    min: 1
    max: 99
Source:
  Class: "BASIC DATA STRUCTURE; MEDICAL DEVICE BASIC DATA STRUCTURE; OCCURRENCE DATA\
    \ STRUCTURE; MEDICAL DEVICE OCCURRENCE DATA STRUCTURE"
  Variable_or_Item: "CRITyFN where y is an integer [1-99, not zero-padded]"
  Natural_Language_Rule_Failure_Criteria: "On a given record, CRITyFL is populated\
    \ and CRITyFN is not populated"
  Rule_Failure_Criteria: "CRITyFN is not populated"
  Condition_Failure: "CRITyFL is populated"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.2"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR486"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.3"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR486"
        Version: "2"
      Version: "5.0"
