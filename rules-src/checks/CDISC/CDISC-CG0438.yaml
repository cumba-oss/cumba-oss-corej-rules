Core:
  Id: "CDISC-CG0438"
  Status: "Published"
  Version: "1"
Description: "Raise an error when TSVAL is populated with a value that is not a valid\
  \ ISO 8601 duration (time period) for a record where TSPARMCD equals 'AGEMIN' (Planned\
  \ Minimum Age of Subjects)."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "TS"
Requirements:
  Variables:
    All:
    - "TSPARMCD"
Check:
  expression: >-
    TSPARMCD == "AGEMIN" and not empty(TSVAL) and invalid_duration(TSVAL, negative=false)
Outcome:
  Message: "Invalid TSVAL value for AGEMIN: TSVAL must be in ISO 8601 duration format\
    \ (e.g., P18Y) when TSPARMCD equals 'AGEMIN' (Planned Minimum Age of Subjects)."
Source:
  Class: "TDM"
  Domain: "TS"
  Variable: "TSVAL"
  Condition: "TSPARMCD = 'AGEMIN' and TSVAL ^= null"
  Rule: "TSVAL conforms to ISO 8601 time period"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "SDTMIG"
    Version: "3.3"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0438"
        Version: "1"
      Version: "2.0"
  - Name: "SDTMIG"
    Version: "3.2"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0438"
        Version: "1"
      Version: "2.0"
