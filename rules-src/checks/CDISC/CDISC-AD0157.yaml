Core:
  Id: "CDISC-AD0157"
  Status: "Published"
  Version: "2"
Description: "Raise an error when a variable with a prefix of CRIT and a suffix of\
  \ a one-digit number (CRITy) is present and a variable with the same root with a\
  \ suffix of FL (CRITyFL) is not present."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "BASIC DATA STRUCTURE"
Check:
  expression: >-
    var_exists("CRITy") and not var_exists("CRITyFL")
Outcome:
  Message: "CRITy is present, but the corresponding CRITyFL variable is not present."
  Output_Variables:
  - "CRITy"
wildcards:
  "y":
    min: 1
    max: 99
Source:
  Class: "BASIC DATA STRUCTURE; MEDICAL DEVICE BASIC DATA STRUCTURE"
  Variable_or_Item: "CRITy where y is an integer [1-99, not zero-padded]"
  Natural_Language_Rule_Failure_Criteria: "A variable with a prefix of CRIT and a\
    \ suffix of a one-digit number (CRITy) is present and a variable with the same\
    \ root with a suffix of FL (CRITyFL) is not present"
  Rule_Failure_Criteria: "A variable with a prefix of CRIT and a suffix of a one-digit\
    \ number is present and a variable with the same root with a suffix of FL is not\
    \ present"
  Condition_Failure: "CRITy is present"
Standards:
