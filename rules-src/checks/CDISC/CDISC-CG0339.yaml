Core:
  Id: "CDISC-CG0339"
  Status: "Published"
  Version: "1"
Description: "Raise an error when --CAT is equal to --BODSYS."
Executability: "Fully Executable"
Scope:
  Classes:
    Include:
    - "EVENTS"
Requirements:
  Variables:
    All:
    - "--CAT"
    - "--BODSYS"
Check:
  expression: >-
    not empty(--CAT) and equalsIgnoreCase(--CAT, --BODSYS)
Outcome:
  Message: "--CAT is equal to --BODSYS."
  Output_Variables:
  - "--BODSYS"
Source:
  Class: "EVT"
  Domain: "ALL"
  Variable: "--CAT"
  Rule: "--CAT ^= --BODSYS"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "SDTMIG"
    Version: "3.4"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0339"
        Version: "1"
      Version: "2.0"
  - Name: "SDTMIG"
    Version: "3.3"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0339"
        Version: "1"
      Version: "2.0"
  - Name: "SDTMIG"
    Version: "3.2"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0339"
        Version: "1"
      Version: "2.0"
