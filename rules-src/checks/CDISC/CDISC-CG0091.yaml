Core:
  Id: "CDISC-CG0091"
  Status: "Published"
  Version: "1"
Description: "Raise an error when --TPTNUM is present in the dataset but --TPT is\
  \ not present in the dataset."
Executability: "Not Executable"
ExecutabilityHint:
  Category: "not executable"
  Detail: "Parked as an R-5.26 duplicate of CDISC-CG0661 (owner rulings D-8 + D-18,\
    \ 2026-09-14): the two are identical in every field but the id and ship into exactly\
    \ the same packages, so one run reported the same finding twice. Both package\
    \ sets being equal, D-18's tie-break applies and the lower-numbered row is parked\
    \ — the lower id was authored first, so the higher is the more recent statement.\
    \ The row stays documented here while CDISC-CG0661 carries the executable check."
Scope:
  Domains:
    Include:
    - "ALL"
Check:
  expression: >-
    var_exists("--TPTNUM") and not var_exists("--TPT")
Outcome:
  Message: "--TPT is not present in the dataset when --TPTNUM is present in the dataset."
  Output_Variables:
  - "--TPTNUM"
Source:
  Class: "ALL"
  Domain: "ALL"
  Variable: "--TPT"
  Condition: "--TPTNUM present in dataset"
  Rule: "--TPT present in dataset"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "SDTMIG"
    Version: "3.4"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0091"
        Version: "1"
      Version: "2.0"
