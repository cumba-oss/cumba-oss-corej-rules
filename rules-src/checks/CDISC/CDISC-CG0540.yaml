Core:
  Id: "CDISC-CG0540"
  Status: "Published"
  Version: "1"
Description: "Raise an error when a DM subject who received treatment (ACTARMCD is\
  \ populated) has no record in the Disposition (DS) domain."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "DM"
Bindings:
- name: "$ds_usubjid"
  expression: "distinct(USUBJID, domain=\"DS\")"
Check:
  expression: >-
    not empty(ACTARMCD) and USUBJID not in $ds_usubjid
Outcome:
  Message: "There are no DS records for subject who was assigned treatment."
  Output_Variables:
  - "ACTARMCD"
  - "$ds_usubjid"
Source:
  Class: "EVT"
  Domain: "DS"
  Variable: "GEN"
  Condition: "DM.ACTARMCD not null"
  Rule: "DS records present for subject"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "SDTMIG"
    Version: "3.4"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0540"
        Version: "1"
      Version: "2.0"
  - Name: "SDTMIG"
    Version: "3.3"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0540"
        Version: "1"
      Version: "2.0"
