Core:
  Id: "CDISC-SEND-0024"
  Status: "Published"
  Version: "1"
Description: "Raise an error when an Element Code (ETCD) value is longer than 8 characters."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "TA"
    - "TE"
    - "SE"
Requirements:
  Variables:
    All:
    - "ETCD"
Check:
  expression: >-
    len(ETCD) > 8
Outcome:
  Message: "ETCD value is longer than 8 characters."
Source:
  Class: "SPC"
  Domain: "TA, TE, SE"
  Variable: "ETCD"
  Plain_Text_Explanation: "ETCD value limited to 8 characters."
  Rule: "ETCD value length <= 8"
