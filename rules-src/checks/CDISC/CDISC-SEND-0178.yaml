Core:
  Id: "CDISC-SEND-0178"
  Status: "Published"
  Version: "1"
Description: "Raise an error when Test Name (MATEST) is \"Clinical Signs Follow-up\"\
  \ but Specimen Material Type (MASPEC) is populated; MASPEC should not be used for\
  \ this test."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "MA"
Requirements:
  Variables:
    All:
    - "MASPEC"
    - "MATEST"
Check:
  expression: >-
    MATEST == "Clinical Signs Follow-up" and not empty(MASPEC)
Outcome:
  Message: "MASPEC is populated when MATEST is \"Clinical Signs Follow-up\"; MASPEC\
    \ should not be used."
Source:
  Class: "FND"
  Domain: "MA"
  Variable: "MASPEC, MATEST"
  Plain_Text_Explanation: "When MATEST is \"Clinical Signs Follow-up\" MASPEC should\
    \ not be used."
  Condition: "MATEST = \"Clinical Signs Follow-up\""
  Rule: "MASPEC = null"
