Core:
  Id: "CDISC-AD0212"
  Status: "Published"
  Version: "2"
Description: "Raise an error when a value of ANLzzFN is populated and does not equal\
  \ 1, where zz is a zero-padded two-digit integer [01-99]"
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "BASIC DATA STRUCTURE"
Check:
  expression: >-
    upper(varname()) =~ /^ANL(0[1-9]|[1-9][0-9])FN$/ and not empty(value()) and value() != 1
Outcome:
  Message: "ANLzzFN is populated, but does not equal 1"
  Output_Variables:
  - "variable_value"
Source:
  Class: "BASIC DATA STRUCTURE; MEDICAL DEVICE BASIC DATA STRUCTURE"
  Variable_or_Item: "ANLzzFN where zz is an integer [01-99, zero-padded]"
  Natural_Language_Rule_Failure_Criteria: "ANLzzFN is not equal to 1 or null where\
    \ zz is a zero-padded two-digit integer [01-99]"
  Rule_Failure_Criteria: "ANLzzFN is not equal to 1 or null"
