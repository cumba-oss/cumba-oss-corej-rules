Core:
  Id: "CDISC-SEND-0214-A"
  Status: "Published"
  Version: "1"
Description: "Raise an error when the Planned Duration of Element (TEDUR) variable\
  \ is not present in the Trial Elements (TE) dataset and TEENRL is not populated;\
  \ with no TEDUR column, TEENRL must be populated for each Element."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "TE"
Requirements:
  Variables:
    None:
    - "TEDUR"
    All:
    - "TEENRL"
Check:
  expression: >-
    empty(TEENRL)
Outcome:
  Message: "TEDUR is not present in the dataset and TEENRL is not populated."
  Output_Variables:
  - "TEENRL"
Source_Proposed:
  Sheet_Issue: "#212"
  Class: "TDM"
  Domain: "TE"
  Variable: "TEENRL"
  Plain_Text_Explanation: "When the TEDUR variable is not present in the dataset,\
    \ TEENRL must be populated for each Element so that every Element carries an end\
    \ rule or a planned duration"
  Condition: "TEDUR variable is not present in the dataset"
  Rule: "TEENRL ^= null"
Source:
  Class: "TDM"
  Domain: "TE"
  Variable: "TEENRL, TEDUR"
  Plain_Text_Explanation: "Either TEENRL or TEDUR (or both) must be populated for\
    \ each Element."
  Rule: "TEENRL ^= null AND/OR TEDUR ^= null"
