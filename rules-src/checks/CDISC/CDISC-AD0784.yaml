Core:
  Id: "CDISC-AD0784"
  Status: "Published"
  Version: "1"
Description: "Raise an error when there is more than one value of ATOXGRN for a given\
  \ value of ATOXGR, considering only rows on which both variables are populated"
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "BASIC DATA STRUCTURE"
    - "OCCURRENCE DATA STRUCTURE"
    - "MEDICAL DEVICE OCCURRENCE DATA STRUCTURE"
Check:
  expression: >-
    not empty(ATOXGRN) and not empty(ATOXGR) and has_multiple_values_for(ATOXGRN, ATOXGR)
Outcome:
  Message: "ATOXGRN takes more than one value for the same value of ATOXGR, considering\
    \ only rows on which both variables are populated."
Source:
  Class: "BASIC DATA STRUCTURE; MEDICAL DEVICE BASIC DATA STRUCTURE; OCCURRENCE DATA\
    \ STRUCTURE; MEDICAL DEVICE OCCURRENCE DATA STRUCTURE"
  Variable_or_Item: "ATOXGRN"
  Natural_Language_Rule_Failure_Criteria: "There is more than one value of ATOXGRN\
    \ for a given value of ATOXGR, considering only those rows on which both variables\
    \ are populated"
  Rule_Failure_Criteria: "There is more than one value of ATOXGRN for a given value\
    \ of ATOXGR"
  Condition_Failure: "On rows where both ATOXGRN and ATOXGR are both populated."
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.1"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR784"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.2"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR784"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.3"
    References:
