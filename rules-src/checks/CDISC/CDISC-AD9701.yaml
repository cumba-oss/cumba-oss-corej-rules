Core:
  Id: "CDISC-AD9701"
  Status: "Published"
  Version: "1"
Description: "Raise an error when a dataset has no records; a dataset should have\
  \ at least one record."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "ALL"
Bindings:
- name: "$records_in_dataset"
  expression: "record_count()"
Check:
  expression: >-
    $records_in_dataset == 0
Outcome:
  Message: "Dataset has no records."
  Output_Variables:
  - "$records_in_dataset"
Source_Proposed:
  Sheet_Issue: "#157"
  Class: "ALL"
  Subclass: ""
  SEND_SDTM_Domain: ""
  Variable_or_Item: ""
  Natural_Language_Rule_Failure_Criteria: "a dataset has no records; a dataset should\
    \ have at least one record"
  Rule_Failure_Criteria: ""
  Condition_Failure: ""
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.3"
  - Name: "ADaMIG"
    Version: "1.2"
  - Name: "ADaMIG"
    Version: "1.1"
  - Name: "ADaMIG"
    Version: "1.0"
