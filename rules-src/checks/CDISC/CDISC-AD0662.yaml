Core:
  Id: "CDISC-AD0662"
  Status: "Published"
  Version: "1"
Description: "Raise an error when TMPCTDF is populated but ARRLT and NRRLT are not\
  \ populated in an ADNCA v1.0 dataset."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "BASIC DATA STRUCTURE"
  Subclasses:
    Include:
    - "NON-COMPARTMENTAL ANALYSIS"
Check:
  expression: >-
    not empty(TMPCTDF) and empty(ARRLT) and empty(NRRLT)
Outcome:
  Message: "TMPCTDF is populated and ARRLT and NRRLT are not populated"
  Message_Folded: "ARRLT or NRRLT not populated in any record of the dataset, and\
    \ at least one record meets the rest of the condition: TMPCTDF is populated and\
    \ ARRLT and NRRLT are not populated"
Source:
  Class: "BASIC DATA STRUCTURE"
  Subclass: "NON-COMPARTMENTAL ANALYSIS"
  Variable_or_Item: "ARRLT; NRRLT"
  Natural_Language_Rule_Failure_Criteria: "TMPCTDF is populated and ARRLT and NRRLT\
    \ are not populated"
  Rule_Failure_Criteria: "ARRLT and NRRLT are not populated"
  Condition_Failure: "TMPCTDF is populated"
