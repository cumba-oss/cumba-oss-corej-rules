Core:
  Id: "CDISC-AD0396"
  Status: "Published"
  Version: "2"
Description: "Raise an error when, within a parameter, there is more than one value\
  \ of ATOXGRLN for a given value of ATOXGRL, considering only rows on which both\
  \ variables are populated."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "BASIC DATA STRUCTURE"
Requirements:
  Variables:
    All:
    - "ATOXGRLN"
    - "ATOXGRL"
Check:
  expression: >-
    not empty(ATOXGRL) and not empty(ATOXGRLN) and has_multiple_values_for(ATOXGRLN, ATOXGRL,
    within=PARAMCD)
Outcome:
  Message: "Within a parameter, there is more than one value of ATOXGRLN for a given\
    \ value of ATOXGRL, considering only rows on which both variables are populated."
Source:
  Class: "BASIC DATA STRUCTURE; MEDICAL DEVICE BASIC DATA STRUCTURE"
  Variable_or_Item: "ATOXGRLN"
  Natural_Language_Rule_Failure_Criteria: "Within a parameter, there is more than\
    \ one value of ATOXGRLN for a given value of ATOXGRL, considering only those rows\
    \ on which both variables are populated"
  Rule_Failure_Criteria: "Within a parameter, there is more than one value of ATOXGRLN\
    \ for a given value of ATOXGRL"
  Condition_Failure: "On rows where both ATOXGRLN and ATOXGRL are both populated"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.2"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR396"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.3"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR396"
        Version: "2"
      Version: "5.0"
