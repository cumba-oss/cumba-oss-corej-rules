Core:
  Id: "CDISC-SEND-0084"
  Status: "Published"
  Version: "1"
Description: "Raise an error when the planned Elapsed Time (--ELTM) is populated but\
  \ the Time Point Reference (--TPTREF) it is measured from is empty; --ELTM is the\
  \ planned elapsed time relative to the fixed reference point named by --TPTREF,\
  \ so --TPTREF must be present whenever --ELTM is given."
Executability: "Partially Executable - Possible Underreporting"
Scope:
  Domains:
    Include:
    - "ALL"
Requirements:
  Variables:
    All:
    - "--ELTM"
Check:
  expression: >-
    not empty(--ELTM) and empty(--TPTREF)
Outcome:
  Message: "--TPTREF is empty when --ELTM is populated."
Source:
  Class: "ALL"
  Domain: "ALL"
  Variable: "--ELTM"
  Plain_Text_Explanation: "--ELTM is relative to --TPTREF"
  Condition: "--ELTM ^= null"
  Rule: "--ELTM is the planned elapsed time from --TPTREF"
