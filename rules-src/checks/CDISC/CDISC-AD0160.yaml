Core:
  Id: "CDISC-AD0160"
  Status: "Published"
  Version: "1"
Description: "Raise an error when AWU is present and both AWLO and AWHI are not present"
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "BASIC DATA STRUCTURE"
Check:
  expression: >-
    var_exists("AWU") and not var_exists("AWLO") and not var_exists("AWHI")
Outcome:
  Message: "AWU is present, but neither AWLO nor AWHI is present"
  Output_Variables:
  - "AWU"
Source:
  Class: "BASIC DATA STRUCTURE"
  Variable_or_Item: "AWU"
  Natural_Language_Rule_Failure_Criteria: "AWU is present and both AWLO and AWHI are\
    \ not present"
  Rule_Failure_Criteria: "AWLO and AWHI are not present"
  Condition_Failure: "AWU is present"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.0"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR160"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.1"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR160"
        Version: "1"
      Version: "5.0"
