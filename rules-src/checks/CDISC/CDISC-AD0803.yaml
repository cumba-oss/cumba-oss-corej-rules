Core:
  Id: "CDISC-AD0803"
  Status: "Published"
  Version: "1"
Description: "Raise an error when, within a dataset, there is more than one value\
  \ of STUDYID for a given value of STUDYIDN, considering only records where both\
  \ variables are populated"
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "BASIC DATA STRUCTURE"
Check:
  expression: >-
    not empty(STUDYID) and not empty(STUDYIDN) and has_multiple_values_for(STUDYID, STUDYIDN)
Outcome:
  Message: "Within this dataset, more than one value of STUDYID is present for the\
    \ same populated value of STUDYIDN"
Source:
  Class: "BASIC DATA STRUCTURE"
  Subclass: "POPULATION PHARMACOKINETIC ANALYSIS"
  Variable_or_Item: "STUDYID"
  Natural_Language_Rule_Failure_Criteria: "Within a dataset, there is more than one\
    \ value of STUDYID for a given value of STUDYIDN, considering only those rows\
    \ on which both variables are populated"
  Rule_Failure_Criteria: "Within a dataset, there is more than one value of STUDYID\
    \ for a given value of STUDYIDN"
  Condition_Failure: "On rows where both STUDYID and STUDYIDN are both populated"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.3"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR803"
        Version: "1"
      Version: "5.0"
