Core:
  Id: "CDISC-SEND-0070-A"
  Status: "Published"
  Version: "1"
Description: "Raise an error when a start date/time (--STDTC) expresses an interval\
  \ of uncertainty as its beginning and end concatenated with a solidus (/), and the\
  \ two sides are represented with different levels of completeness (precision)."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "ALL"
Bindings:
- name: "$interval_mismatch_stdtc"
  expression: "interval_uncertainty_precision_mismatch(--STDTC, delimiter=\"/\")"
Check:
  expression: >-
    $interval_mismatch_stdtc == true
Outcome:
  Message: "The beginning and end of the interval of uncertainty in --STDTC have different\
    \ levels of completeness."
Source_Proposed:
  Sheet_Issue: "#237"
  Class: "ALL"
  Domain: "ALL"
  Variable: "--STDTC"
  Plain_Text_Explanation: "The completeness of the representation of the date/time\
    \ must be the same on both sides of the solidus when a concatenation of the beginning\
    \ and end of an interval of uncertainty are used to present an interval in --STDTC."
  Condition: "--STDTC includes an interval of uncertainty"
  Rule: "Interval of uncertainty is presented by concatenating the beginning and end\
    \ of the interval with a solidus; the level of completeness for the beginning\
    \ and the end of the interval of uncertainty are the same"
Source:
  Class: "ALL"
  Domain: "ALL"
  Variable: "GEN"
  Plain_Text_Explanation: "The completeness of the representation of the date/time\
    \ must be the same on both sides of the solidus when a concatenation of the beginning\
    \ and end of an interval of uncertainty are used to present an interval."
  Condition: "Date/time includes an interval of uncertainty"
  Rule: "Interval of uncertainty is presented by concatenating the beginning and end\
    \ of the interval with a solidus; the level of completeness for the beginning\
    \ and the end of the interval of uncertainty are the same"
