Core:
  Id: "CDISC-AD0016"
  Status: "Published"
  Version: "1"
Description: "Raise an error when the length of a variable label exceeds 40 characters"
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "ALL"
Check:
  expression: >-
    len(variable_label) > 40
Outcome:
  Message: "The variable label is longer than 40 characters"
  Output_Variables:
  - "variable_label"
Source:
  Class: "ALL"
  Variable_or_Item: "ALL"
  Natural_Language_Rule_Failure_Criteria: "The length of a variable label is greater\
    \ than 40 characters"
  Rule_Failure_Criteria: "The length of a variable label is greater than 40 characters"
