Core:
  Id: "CDISC-AD0782"
  Status: "Published"
  Version: "1"
Description: "Raise an error when there is more than one value of AETOXGRN for a given\
  \ value of AETOXGR, considering only rows on which both variables are populated"
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "OCCURRENCE DATA STRUCTURE"
    - "MEDICAL DEVICE OCCURRENCE DATA STRUCTURE"
Check:
  expression: >-
    not empty(AETOXGRN) and not empty(AETOXGR) and has_multiple_values_for(AETOXGRN, AETOXGR)
Outcome:
  Message: "AETOXGRN takes more than one value for the same value of AETOXGR, considering\
    \ only rows on which both variables are populated."
Source:
  Class: "OCCURRENCE DATA STRUCTURE; MEDICAL DEVICE OCCURRENCE DATA STRUCTURE"
  Variable_or_Item: "AETOXGRN"
  Natural_Language_Rule_Failure_Criteria: "There is more than one value of AETOXGRN\
    \ for a given value of AETOXGR, considering only those rows on which both variables\
    \ are populated"
  Rule_Failure_Criteria: "There is more than one value of AETOXGRN for a given value\
    \ of AETOXGR"
  Condition_Failure: "On rows where both AETOXGRN and AETOXGR are both populated."
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.1"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
