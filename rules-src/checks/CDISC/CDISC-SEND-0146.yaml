Core:
  Id: "CDISC-SEND-0146"
  Status: "Published"
  Version: "1"
Description: "Raise an error when Completion Status (--STAT) is empty but Reason Not\
  \ Done (--REASND) is populated; --REASND must be empty when --STAT is not populated."
Executability: "Fully Executable"
Scope:
  Classes:
    Include:
    - "FINDINGS"
Requirements:
  Variables:
    All:
    - "--REASND"
Check:
  expression: >-
    empty(--STAT) and not empty(--REASND)
Outcome:
  Message: "--REASND is populated when --STAT is empty; --REASND must be empty when\
    \ --STAT is not populated."
Source:
  Class: "FND"
  Domain: "NOT (SC)"
  Variable: "--REASND"
  Plain_Text_Explanation: "If --STAT is not populated then --REASND is not populated"
  Condition: "--STAT = null"
  Rule: "--REASND = null"
