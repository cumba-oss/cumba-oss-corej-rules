Core:
  Id: "CDISC-AD0668"
  Status: "Published"
  Version: "1"
Description: "Raise an error when, on a given record, ACYCLE is populated but ACYCLEC\
  \ is not populated."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "BASIC DATA STRUCTURE"
Check:
  expression: >-
    not empty(ACYCLE) and empty(ACYCLEC)
Outcome:
  Message: "ACYCLE is populated but ACYCLEC is not populated on this record."
  Message_Folded: "ACYCLEC absent or not populated in any record of the dataset, and\
    \ at least one record meets the rest of the condition: ACYCLE is populated but\
    \ ACYCLEC is not populated on this record."
Source:
  Class: "BASIC DATA STRUCTURE"
  Subclass: "NON-COMPARTMENTAL ANALYSIS"
  Variable_or_Item: "ACYCLEC"
  Natural_Language_Rule_Failure_Criteria: "On a given record, ACYCLE is populated\
    \ and ACYCLEC is not populated"
  Rule_Failure_Criteria: "ACYCLEC is not populated"
  Condition_Failure: "ACYCLE is populated"
Standards:
- Organization: "CDISC"
  Standards:
