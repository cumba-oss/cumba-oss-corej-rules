Core:
  Id: "CDISC-SEND-0204"
  Status: "Published"
  Version: "1"
Description: "Raise an error when a tumor record's mass identifier (TFSPID) is populated\
  \ and linked by --SPID to a macroscopic finding of the same subject (an MA record\
  \ with that MASPID) and to no clinical sign (CL) or palpable mass (PM) record, so\
  \ the tumor was first detected at necropsy, and its populated TFDETECT does not\
  \ equal the number of days from the earliest dose date (earliest EXSTDTC of the\
  \ subject's own EX records and of its pools' (POOLDEF)) to the subject's disposition\
  \ date (DS.DSSTDTC, a complete date), plus one (first dose day = day 1)."
Executability: "Partially Executable"
ExecutabilityHint:
  Category: "partially executable"
  Detail: "The detection method is read from the --SPID link alone (SENDIG TF Assumption\
    \ 5, SENDIG 3.0 Assumption 4: the mass identifier in --SPID is consistent across\
    \ CL, PM, MA, MI and TF): a TF record whose USUBJID and TFSPID are also a CL or\
    \ PM mass was detected in life (CDISC-SEND-0202, CDISC-SEND-0203), one that is\
    \ an MA mass and neither of those at necropsy (CDISC-SEND-0204), one that is none\
    \ of them at histopathology (CDISC-SEND-0205). Gaps: a record with a blank TFSPID\
    \ is not judged, because its detection method cannot be determined; a mass linked\
    \ to CL, PM or MA only through RELREC, not by --SPID, is not seen, so it is judged\
    \ by the wrong one of CDISC-SEND-0204 and CDISC-SEND-0205, or judged at all where\
    \ a missed CL or PM link means it was detected in life; a study whose CL or PM\
    \ dataset lacks its --SPID column skips the rule, because the link to that domain\
    \ cannot be read for any record and a tumor detected in life is dated differently;\
    \ an MA dataset without MASPID links no record, so CDISC-SEND-0204 finds no tumor\
    \ first detected at necropsy and CDISC-SEND-0205 judges those tumors by the same\
    \ formula, a necropsy finding then being reported under CDISC-SEND-0205's id;\
    \ a subject without a DS record, or whose DSSTDTC is not a complete date, is not\
    \ judged; EX rows recorded per pool (POOLID, USUBJID blank) are read through POOLDEF\
    \ for every pool the subject belongs to; when the earliest EXSTDTC of the subject's\
    \ own EX records or of any of its pools cannot be determined (a partial or unreadable\
    \ date) while another can, the earliest of those that can is taken as the first\
    \ dose, so the rule may be silent where the earliest over all of them would be\
    \ reported. A POOLID typed differently in EX and POOLDEF, or a USUBJID typed differently\
    \ in TF and POOLDEF (Char against Num; in a CSV or XLSX study an all-blank EX\
    \ POOLID beside a numeric-looking POOLDEF POOLID), makes the rule ERROR."
Scope:
  Domains:
    Include:
    - "TF"
Requirements:
  Variables:
    All:
    - "USUBJID"
    - "TFSPID"
    - "TFDETECT"
    - "DS.DSSTDTC"
    - "EX.EXSTDTC"
    - "EX.USUBJID"
    All_Or_None:
    - - "USUBJID"
      - "DS.USUBJID"
    - - "CL.USUBJID"
      - "CL.CLSPID"
    - - "PM.USUBJID"
      - "PM.PMSPID"
Match_Datasets:
- Keys:
  - "USUBJID"
  Name: "DS"
Bindings:
- name: "$cl_masses"
  expression: "distinct([USUBJID, CLSPID], domain=\"CL\", filter=(not empty(CLSPID)))"
- name: "$pm_masses"
  expression: "distinct([USUBJID, PMSPID], domain=\"PM\", filter=(not empty(PMSPID)))"
- name: "$ma_masses"
  expression: "distinct([USUBJID, MASPID], domain=\"MA\", filter=(not empty(MASPID)))"
- name: "$own_first_dose"
  expression: "min_date(EXSTDTC, domain=\"EX\", group=[USUBJID])"
- name: "$pool_first_dose"
  expression: "min_date(min_date(EXSTDTC, domain=\"EX\", group=[POOLID], filter=(not\
    \ empty(POOLID))), domain=\"POOLDEF\", group=[USUBJID])"
- name: "$first_dose"
  expression: "earliest_date($own_first_dose, $pool_first_dose)"
- name: "$days_to_disposition"
  expression: "date_diff_days(DS.DSSTDTC, $first_dose) + 1"
Check:
  expression: >-
    not empty(TFSPID) and not empty(TFDETECT) and is_complete_date(DS.DSSTDTC) and tuple(USUBJID,
    TFSPID) not in $cl_masses and tuple(USUBJID, TFSPID) not in $pm_masses and tuple(USUBJID,
    TFSPID) in $ma_masses and TFDETECT != $days_to_disposition
Outcome:
  Message: "TFDETECT does not equal (DSSTDTC - the earliest EXSTDTC of the subject's\
    \ own EX records and of the EX records of every pool POOLDEF assigns it to) +\
    \ 1 for a tumor first detected at necropsy (its TFSPID matches an MA record and\
    \ no CL or PM record of the subject)."
  Output_Variables:
  - "TFSPID"
  - "TFDETECT"
  - "DS.DSSTDTC"
  - "$first_dose"
  - "$days_to_disposition"
  - "$own_first_dose"
  - "$pool_first_dose"
Source:
  Class: "FND"
  Domain: "TF"
  Variable: "TFDETECT"
  Plain_Text_Explanation: "If the tumor was initially detected during necropsy (the\
    \ MA domain), then TFDETECT is based off the DS domain variable DSSTDTC (Date/Time\
    \ of Disposition). This is calculated as (DSSTDTC - EXSTDTC) + 1."
  Condition: "Tumor was initially detected during necropsy (the MA domain)"
  Rule: "TFDETECT = (DSSTDTC - EXSTDTC) + 1"
Standards:
