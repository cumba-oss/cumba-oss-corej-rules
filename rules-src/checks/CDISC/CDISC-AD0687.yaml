Core:
  Id: "CDISC-AD0687"
  Status: "Published"
  Version: "1"
Description: "Raise an error when DEVIPDT is greater than DEVXPDT, considering only\
  \ rows where both variables are populated."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "DEVICE LEVEL ANALYSIS DATASET"
Requirements:
  Variables:
    All:
    - "DEVIPDT"
    - "DEVXPDT"
Check:
  expression: >-
    not empty(DEVIPDT) and not empty(DEVXPDT) and DEVIPDT > DEVXPDT
Outcome:
  Message: "DEVIPDT is greater than DEVXPDT on this row."
Source:
  Class: "DEVICE LEVEL ANALYSIS DATASET"
  Variable_or_Item: "DEVIPDT"
  Natural_Language_Rule_Failure_Criteria: "The value of DEVIPDT is greater than the\
    \ value of DEVXPDT, considering only rows on which both variables are populated"
  Rule_Failure_Criteria: "DEVIPDT is greater than the value of DEVXPDT"
  Condition_Failure: "Considering only those rows on which both DEVIPDT and DEVXPDT\
    \ are populated"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.3"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR687"
        Version: "1"
      Version: "5.0"
