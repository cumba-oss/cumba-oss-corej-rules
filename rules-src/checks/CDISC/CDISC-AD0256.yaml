Core:
  Id: "CDISC-AD0256"
  Status: "Published"
  Version: "1"
Description: "Raise an error when a subject in the dataset is not present in ADSL."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "ALL"
Requirements:
  Variables:
    All:
    - "ADSL.USUBJID"
Match_Datasets:
- Name: "ADSL"
  Keys:
  - "USUBJID"
  Join_Type: "left"
Check:
  expression: >-
    empty(ADSL.USUBJID)
Outcome:
  Message: "This subject's USUBJID is not present in ADSL."
  Output_Variables:
  - "ADSL.USUBJID"
Source:
  Class: "ALL"
  Natural_Language_Rule_Failure_Criteria: "The values of USUBJID are not present in\
    \ ADSL"
  Rule_Failure_Criteria: "The values of USUBJID are not present in ADSL"
  Condition_Failure: "USUBJID is present"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.0"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR256"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.1"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR256"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.2"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR256"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.3"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR256"
        Version: "1"
      Version: "5.0"
