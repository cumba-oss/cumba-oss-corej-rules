Core:
  Id: "CDISC-CG0176"
  Status: "Published"
  Version: "1"
Description: "Raise an error when I/E Criterion Original Result (IEORRES) does not\
  \ equal 'N' while Inclusion/Exclusion Category (IECAT) is 'INCLUSION'."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "IE"
Requirements:
  Variables:
    All:
    - "IECAT"
    - "IEORRES"
Check:
  expression: >-
    IECAT == "INCLUSION" and IEORRES != "N"
Outcome:
  Message: "IEORRES does not equal 'N' when IECAT is 'INCLUSION'."
  Output_Variables:
  - "IETESTCD"
  - "IECAT"
  - "IEORRES"
Source:
  Class: "FND"
  Domain: "IE"
  Variable: "IEORRES"
  Condition: "IECAT = 'INCLUSION'"
  Rule: "IEORRES = 'N'"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "SDTMIG"
    Version: "3.4"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0176"
        Version: "1"
      Version: "2.0"
  - Name: "SDTMIG"
    Version: "3.3"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0176"
        Version: "1"
      Version: "2.0"
  - Name: "SDTMIG"
    Version: "3.2"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0176"
        Version: "1"
      Version: "2.0"
