Core:
  Id: "CDISC-CG0049"
  Status: "Published"
  Version: "1"
Description: "Raise an error when --DECOD and --PTCD do not have a one-to-one relationship."
Executability: "Fully Executable"
Scope:
  Classes:
    Include:
    - "EVENTS"
Requirements:
  Variables:
    All:
    - "--PTCD"
    - "--DECOD"
Check:
  expression: >-
    not is_unique_relationship(--PTCD, --DECOD)
Outcome:
  Message: "--DECOD and --PTCD do not have a one-to-one relationship."
Source:
  Class: "EVT"
  Domain: "ALL"
  Variable: "--PTCD"
  Rule: "--DECOD and --PTCD have a one-to-one relationship"
Standards:
- Organization: "CDISC"
  Standards:
