Core:
  Id: "CDISC-AD0014"
  Status: "Published"
  Version: "1"
Description: "Raise an error when a variable name does not start with a letter (A-Z)"
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "ALL"
Check:
  expression: >-
    varname() !~ /^[A-Z]/
Outcome:
  Message: "The variable name does not begin with a letter (A-Z)"
Source:
  Class: "ALL"
  Variable_or_Item: "ALL"
  Natural_Language_Rule_Failure_Criteria: "A variable name does not start with a letter\
    \ (A-Z)"
  Rule_Failure_Criteria: "A variable name does not start with a letter (A-Z)"
