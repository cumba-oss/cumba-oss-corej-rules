Core:
  Id: "CDISC-SEND-0104"
  Status: "Published"
  Version: "1"
Description: "Raise an error when Age (AGE) or Age Text (AGETXT) is populated but\
  \ Age Units (AGEU) is empty."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "DM"
Requirements:
  Variables:
    All:
    - "AGEU"
Check:
  expression: >-
    (not empty(AGE) or not empty(AGETXT)) and empty(AGEU)
Outcome:
  Message: "AGEU is empty when AGE or AGETXT is populated."
  Message_Folded: "AGEU not populated in any record of the dataset, and at least one\
    \ record meets the rest of the condition: AGEU is empty when AGE or AGETXT is\
    \ populated."
Source:
  Class: "SPC, TDM"
  Domain: "DM,TS"
  Variable: "AGEU"
  Plain_Text_Explanation: "AGEU is the unit associated with AGE or AGETXT.  If either\
    \ of those variables is populated, AGEU should be populated."
  Condition: "AGE ^= null OR AGETXT^= null"
  Rule: "AGEU ^= null"
