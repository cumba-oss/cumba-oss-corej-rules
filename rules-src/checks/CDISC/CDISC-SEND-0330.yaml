Core:
  Id: "CDISC-SEND-0330"
  Status: "Published"
  Version: "1"
Description: "Raise an error when the standardized character result (PCSTRESC) equals\
  \ 'BLQ' or 'ALQ' but no supplemental numeric interpretation for calculations exists\
  \ for that PC record."
Executability: "Partially Executable - Possible Underreporting"
Scope:
  Domains:
    Include:
    - "PC"
Requirements:
  Variables:
    All:
    - "PCSTRESC"
Check:
  expression: >-
    (PCSTRESC == "BLQ" or PCSTRESC == "ALQ") and empty(PCCALCN)
Outcome:
  Message: "PCSTRESC is outside the limit of quantitation (BLQ or ALQ) but no SUPPPC\
    \ record with QNAM='PCCALCN' provides the numeric interpretation for that PC record."
  Output_Variables:
  - "PCSTRESC"
  - "PCCALCN"
Source:
  Class: "FND"
  Domain: "PC, SUPPPC"
  Variable: "PCSTRESN"
  Plain_Text_Explanation: "If the test result is outside the Limit of Quantification\
    \ and a value was used for computation in PP, then the PCCALCN should be provided\
    \ in the SUPPPC domain to provide the value utilized for PP computation. Units\
    \ of this value should be the same units as the standardized units in PCSTRESU."
  Condition: "If the test result is outside of limits of quantitation and the value\
    \ was utilized for PP computation"
  Rule: "PCSTRESN = null AND SUPPPC exists where QNAM = \"CALCN\"; QLABEL = \"Numeric\
    \ Interpretation for Calculations\"; value in QVAL must be in the same units as\
    \ PCSTRESU"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "SENDIG-GENETOX"
    Version: "1.0"
    References:
    - Origin: "SEND Conformance Rules"
      Rule_Identifier:
        Id: "SEND330"
        Version: "1"
      Version: "5.0"
  - Name: "SENDIG-DART"
    Version: "1.2"
    References:
    - Origin: "SEND Conformance Rules"
      Rule_Identifier:
        Id: "SEND330"
        Version: "1"
      Version: "5.0"
  - Name: "SENDIG"
    Version: "3.1.1"
    References:
    - Origin: "SEND Conformance Rules"
      Rule_Identifier:
        Id: "SEND330"
        Version: "1"
      Version: "5.0"
