Core:
  Id: "CDISC-CG0213"
  Status: "Published"
  Version: "1"
Description: "Raise an error when SVUPDES is not populated and VISITNUM is not equal\
  \ to a VISITNUM present in the TV dataset."
Executability: "Partially Executable - Possible Overreporting"
Scope:
  Domains:
    Include:
    - "SV"
Requirements:
  Variables:
    All:
    - "VISITNUM"
    - "TV.VISITNUM"
Bindings:
- name: "$visitnums_in_tv"
  expression: "distinct(VISITNUM, domain=\"TV\")"
Check:
  expression: >-
    not empty(VISITNUM) and (var_exists("SVPRESP") and SVPRESP == "Y" or not var_exists("SVPRESP")
    and empty(SVUPDES) and not contains(upper(VISIT), "UNSCHEDUL") and not contains(upper(VISIT),
    "UNPLAN")) and VISITNUM not in $visitnums_in_tv
Outcome:
  Message: "VISITNUM for a planned visit does not match any VISITNUM value in the\
    \ TV dataset."
  Message_Folded: "SVPRESP or VISIT absent from the dataset, or SVUPDES absent or\
    \ not populated in any record of the dataset, and at least one record meets the\
    \ rest of the condition: VISITNUM for a planned visit does not match any VISITNUM\
    \ value in the TV dataset."
  Output_Variables:
  - "$visitnums_in_tv"
Source:
  Class: "SPC"
  Domain: "SV"
  Variable: "VISITNUM"
  Condition: "SVUPDES = null"
  Rule: "VISITNUM in TV.VISITNUM"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "SDTMIG"
    Version: "3.3"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0213"
        Version: "1"
      Version: "2.0"
  - Name: "SDTMIG"
    Version: "3.2"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0213"
        Version: "1"
      Version: "2.0"
