Core:
  Id: "CDISC-AD0427"
  Status: "Published"
  Version: "1"
Description: "Raise an error when TRTxxA is populated but TRTxxAN is missing"
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "SUBJECT LEVEL ANALYSIS DATASET"
Check:
  expression: >-
    not empty(TRTxxA) and empty(TRTxxAN)
Outcome:
  Message: "TRTxxA is populated, but TRTxxAN is missing"
  Output_Variables:
  - "TRTxxA"
  - "TRTxxAN"
wildcards:
  xx:
    min: 1
    max: 99
Source:
  Class: "SUBJECT LEVEL ANALYSIS DATASET"
  Variable_or_Item: "TRTxxAN where xx is an integer [01-99, zero-padded]"
  Natural_Language_Rule_Failure_Criteria: "On a given record, TRTxxA is populated\
    \ and TRTxxAN is not populated"
  Rule_Failure_Criteria: "TRTxxAN is not populated"
  Condition_Failure: "TRTxxA is populated"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.2"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR427"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.3"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR427"
        Version: "1"
      Version: "5.0"
