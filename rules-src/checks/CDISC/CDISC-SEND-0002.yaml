Core:
  Id: "CDISC-SEND-0002"
  Status: "Published"
  Version: "1"
Description: "Raise an error when a variable name is longer than 8 characters."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "ALL"
Check:
  expression: >-
    len(varname()) > 8
Outcome:
  Message: "The variable name is longer than 8 characters."
Source:
  Class: "ALL"
  Domain: "ALL"
  Variable: "GEN"
  Plain_Text_Explanation: "Variable Name limited to 8 characters"
  Rule: "Variable name length <= 8"
