Core:
  Id: "CDISC-AD0130"
  Status: "Published"
  Version: "1"
Description: "Raise an error when, within a given value of PARAMCD for a subject,\
  \ there is more than one value of BASEC for a given value of BASE."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "BASIC DATA STRUCTURE"
Check:
  expression: >-
    not empty(BASEC) and not empty(BASE) and has_multiple_values_for(BASEC, BASE, within=[USUBJID,
    PARAMCD])
Outcome:
  Message: "BASEC has more than one value for this subject, PARAMCD, and BASE."
Source:
  Class: "BASIC DATA STRUCTURE"
  Variable_or_Item: "BASEC"
  Natural_Language_Rule_Failure_Criteria: "Within a given value of PARAMCD for a subject,\
    \ there is more than one value of BASEC for a given value of BASE"
  Rule_Failure_Criteria: "Within a given value of PARAMCD for a subject, there is\
    \ more than one value of BASEC for a given value of BASE"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.0"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR130"
        Version: "1"
      Version: "5.0"
