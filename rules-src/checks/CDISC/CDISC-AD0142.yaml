Core:
  Id: "CDISC-AD0142"
  Status: "Published"
  Version: "1"
Description: "Raise an error when there is more than one value of PARAMCD for a given\
  \ value of PARAM."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "BASIC DATA STRUCTURE"
Check:
  expression: >-
    has_multiple_values_for(PARAMCD, PARAM)
Outcome:
  Message: "PARAMCD has more than one value for this PARAM."
Source:
  Class: "BASIC DATA STRUCTURE"
  Variable_or_Item: "PARAMCD"
  Natural_Language_Rule_Failure_Criteria: "There is more than one value of PARAMCD\
    \ for a given value of PARAM"
  Rule_Failure_Criteria: "There is more than one value of PARAMCD for a given value\
    \ of PARAM"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.0"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR142"
        Version: "1"
      Version: "5.0"
