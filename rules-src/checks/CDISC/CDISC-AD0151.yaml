Core:
  Id: "CDISC-AD0151"
  Status: "Published"
  Version: "2"
Description: "Raise an error when, within a given value of PARAMCD, there is more\
  \ than one value of CRITy."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "BASIC DATA STRUCTURE"
    - "MEDICAL DEVICE BASIC DATA STRUCTURE"
Requirements:
  Variables:
    All:
    - "CRITy"
Check:
  expression: >-
    has_multiple_values_for(CRITy, PARAMCD)
Outcome:
  Message: "CRITy has more than one value for this PARAMCD."
wildcards:
  "y":
    min: 1
    max: 99
Source:
  Class: "BASIC DATA STRUCTURE; MEDICAL DEVICE BASIC DATA STRUCTURE"
  Variable_or_Item: "CRITy where y is an integer [1-99, not zero-padded]"
  Natural_Language_Rule_Failure_Criteria: "Within a given value of PARAMCD, there\
    \ is more than one value of CRITy"
  Rule_Failure_Criteria: "Within a given value of PARAMCD, there is more than one\
    \ value of CRITy"
