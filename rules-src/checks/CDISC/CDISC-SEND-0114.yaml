Core:
  Id: "CDISC-SEND-0114"
  Status: "Published"
  Version: "1"
Description: "Raise an error when more than one CO record exists for the same combination\
  \ of subject or pool (USUBJID/POOLID), parent-record linkage (RDOMAIN/IDVAR/IDVARVAL),\
  \ comment text (COVAL/COVAL1/COVAL2), and date (CODTC); the CO dataset expects one\
  \ record per comment."
Executability: "Partially Executable - Possible Overreporting"
Scope:
  Domains:
    Include:
    - "CO"
Check:
  expression: >-
    not is_unique_set([USUBJID, POOLID, RDOMAIN, IDVAR, IDVARVAL, COVAL, COVAL1, COVAL2, CODTC])
Outcome:
  Message: "More than one CO record exists for the same subject or pool, parent-record\
    \ linkage, comment text (COVAL/COVAL1/COVAL2), and date (CODTC)."
Source:
  Class: "SPC"
  Domain: "CO"
  Variable: "ALL"
  Plain_Text_Explanation: "Only one record should exist per comment."
  Rule: "One record per comment"
