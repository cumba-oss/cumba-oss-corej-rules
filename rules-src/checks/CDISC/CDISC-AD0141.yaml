Core:
  Id: "CDISC-AD0141"
  Status: "Published"
  Version: "1"
Description: "Raise an error when there is more than one value of PARAM for a given\
  \ value of PARAMCD."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "BASIC DATA STRUCTURE"
Check:
  expression: >-
    has_multiple_values_for(PARAM, PARAMCD)
Outcome:
  Message: "PARAM has more than one value for this PARAMCD."
Source:
  Class: "BASIC DATA STRUCTURE"
  Variable_or_Item: "PARAM"
  Natural_Language_Rule_Failure_Criteria: "There is more than one value of PARAM for\
    \ a given value of PARAMCD"
  Rule_Failure_Criteria: "There is more than one value of PARAM for a given value\
    \ of PARAMCD"
Standards:
