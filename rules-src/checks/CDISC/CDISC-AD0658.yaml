Core:
  Id: "CDISC-AD0658"
  Status: "Published"
  Version: "1"
Description: "Raise an error when NCAXFN is populated with a value other than 1 in\
  \ an ADNCA v1.0 dataset."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "BASIC DATA STRUCTURE"
  Subclasses:
    Include:
    - "NON-COMPARTMENTAL ANALYSIS"
Requirements:
  Variables:
    All:
    - "NCAXFN"
Check:
  expression: >-
    not empty(NCAXFN) and NCAXFN != 1
Outcome:
  Message: "NCAXFN is populated and has a value that is not 1"
Source:
  Class: "BASIC DATA STRUCTURE"
  Subclass: "NON-COMPARTMENTAL ANALYSIS"
  Variable_or_Item: "NCAXFN"
  Natural_Language_Rule_Failure_Criteria: "NCAXFN is present and has a value that\
    \ is not 1 or null"
  Rule_Failure_Criteria: "Value is not 1 or null"
  Condition_Failure: "NCAXFN is present"
Standards:
- Organization: "CDISC"
  Standards:
