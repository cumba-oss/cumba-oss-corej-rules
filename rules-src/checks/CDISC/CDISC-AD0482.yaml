Core:
  Id: "CDISC-AD0482"
  Status: "Published"
  Version: "2"
Description: "Raise an error when BCHGCATy is populated and BCHGCAyN is missing on\
  \ the same record."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "BASIC DATA STRUCTURE"
Check:
  expression: >-
    not empty(BCHGCATy) and empty(BCHGCAyN)
Outcome:
  Message: "BCHGCATy is populated but BCHGCAyN is missing."
  Message_Folded: "BCHGCAyN not populated in any record of the dataset, and at least\
    \ one record meets the rest of the condition: BCHGCATy is populated but BCHGCAyN\
    \ is missing."
  Output_Variables:
  - "BCHGCATy"
  - "BCHGCAyN"
wildcards:
  "y":
    min: 1
    max: 99
Source:
  Class: "BASIC DATA STRUCTURE; MEDICAL DEVICE BASIC DATA STRUCTURE"
  Variable_or_Item: "BCHGCAyN where y is an integer [1-9, not zero-padded]"
  Natural_Language_Rule_Failure_Criteria: "On a given record, BCHGCATy is populated\
    \ and BCHGCAyN is not populated"
  Rule_Failure_Criteria: "BCHGCAyN is not populated"
  Condition_Failure: "BCHGCATy is populated"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.2"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR482"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.3"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR482"
        Version: "2"
      Version: "5.0"
