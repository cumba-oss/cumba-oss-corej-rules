Core:
  Id: "CDISC-CG0440"
  Status: "Published"
  Version: "1"
Description: "Raise an error when TSPARMCD equals 'PLANSUB' and TSVAL is not an integer\
  \ greater than 0."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "TS"
Requirements:
  Variables:
    All:
    - "TSPARMCD"
    - "TSVAL"
Check:
  expression: >-
    TSPARMCD == "PLANSUB" and TSVAL !~ /^[1-9]\\d*$/
Outcome:
  Message: "TSPARMCD equals 'PLANSUB' but TSVAL is not a positive integer."
Source:
  Class: "TDM"
  Domain: "TS"
  Variable: "TSVAL"
  Condition: "TSPARMCD = 'PLANSUB'"
  Rule: "TSVAL is integer and > 0"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "SDTMIG"
    Version: "3.3"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0440"
        Version: "1"
      Version: "2.0"
  - Name: "SDTMIG"
    Version: "3.2"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0440"
        Version: "1"
      Version: "2.0"
