Core:
  Id: "CDISC-AD0878"
  Status: "Published"
  Version: "1"
Description: "Raise an error when, considering only rows on which both COUNTRY and\
  \ COUNTRYN are populated, more than one value of COUNTRY is present within the dataset\
  \ for a given value of COUNTRYN."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "BASIC DATA STRUCTURE"
Check:
  expression: >-
    not empty(COUNTRY) and not empty(COUNTRYN) and has_multiple_values_for(COUNTRY, COUNTRYN)
Outcome:
  Message: "More than one value of COUNTRY is present for this value of COUNTRYN within\
    \ the dataset."
  Output_Variables:
  - "COUNTRY"
  - "COUNTRYN"
Source:
  Class: "BASIC DATA STRUCTURE"
  Subclass: "POPULATION PHARMACOKINETIC ANALYSIS"
  Variable_or_Item: "COUNTRY"
  Natural_Language_Rule_Failure_Criteria: "Within a dataset, there is more than one\
    \ value of COUNTRY for a given value of COUNTRYN, considering only those rows\
    \ on which both variables are populated"
  Rule_Failure_Criteria: "Within a dataset, there is more than one value of COUNTRY\
    \ for a given value of COUNTRYN"
  Condition_Failure: "On rows where both COUNTRY and COUNTRYN are both populated"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.3"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR878"
        Version: "1"
      Version: "5.0"
