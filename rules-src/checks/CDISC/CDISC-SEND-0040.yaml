Core:
  Id: "CDISC-SEND-0040"
  Status: "Published"
  Version: "1"
Description: "Raise an error when a variable value matches a term in the CDISC controlled\
  \ terminology codelist the CDISC Library defines for the variable only when letter\
  \ case is ignored, i.e. the value differs from the published term solely by case."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "ALL"
Check:
  expression: >-
    not empty(var_codelist_coded_values("LIBRARY")) and not empty(value()) and upper(value()) in
    var_codelist_coded_values("LIBRARY") and value() not in var_codelist_coded_values("LIBRARY")
Outcome:
  Message: "The value matches a CDISC controlled terminology term only when case is\
    \ ignored; it must match the case of the published term exactly."
  Output_Variables:
  - "variable_value"
Source:
  Class: "ALL"
  Domain: "ALL"
  Variable: "GEN"
  Plain_Text_Explanation: "Variables and Parameter Values populated with Controlled\
    \ Terminology must follow the case-sensitivity of the Controlled Terminology list.\
    \  The terms used must match those in the Controlled Terminology Codelist exactly\
    \ (format, spelling)."
  Condition: "Controlled Terminology list exists for variable or parameter value"
  Rule: "Variable value or parameter value matches the case of the Controlled Terminology\
    \ list"
