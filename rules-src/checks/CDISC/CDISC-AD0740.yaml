Core:
  Id: "CDISC-AD0740"
  Status: "Published"
  Version: "1"
Description: "Raise an error when, within a dataset, there is more than one value\
  \ of PARAM for a given value of PARAMN, considering only rows on which both variables\
  \ are populated"
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "BASIC DATA STRUCTURE"
Check:
  expression: >-
    not empty(PARAM) and not empty(PARAMN) and has_multiple_values_for(PARAM, PARAMN)
Outcome:
  Message: "PARAM has more than one value for this PARAMN within this dataset, among\
    \ rows where both are populated"
Source:
  Class: "BASIC DATA STRUCTURE; MEDICAL DEVICE BASIC DATA STRUCTURE"
  Variable_or_Item: "PARAM"
  Natural_Language_Rule_Failure_Criteria: "Within a dataset, there is more than one\
    \ value of PARAM for a given value of PARAMN, considering only those rows on which\
    \ both variables are populated"
  Rule_Failure_Criteria: "Within a dataset, there is more than one value of PARAM\
    \ for a given value of PARAMN"
  Condition_Failure: "On rows where PARAM and PARAMN are both populated"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.1"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
