Core:
  Id: "CDISC-SEND-0111"
  Status: "Published"
  Version: "1"
Description: "Raise an error when the BRTHDTC variable is populated but the Origin\
  \ (Type) declared for it in the DM Define-XML document is not Collected."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "DM"
Check:
  expression: >-
    varname() == "BRTHDTC" and not empty(var_name("DEFINE")) and max_value_length(variable_name) > 0
    and var_origin_type("DEFINE") not in ["Collected", "CRF"]
Outcome:
  Message: "BRTHDTC is populated but its Origin (Type) declared in the Define-XML\
    \ document is not Collected."
  Output_Variables:
  - "variable_name"
  - "define_variable_origin_type"
Source:
  Class: "SPC"
  Domain: "DM"
  Variable: "BRTHDTC"
  Plain_Text_Explanation: "BRTHDTC should be collected.   If BRTHDTC was not collected\
    \ this variable should be left blank.  BRTHDTC should never be derived from another\
    \ variable."
  Condition: "BRTHDTC ^= null"
  Rule: "BRTHDTC ORIGIN = collected in the Define-XML document"
Standards:
- Organization: "CDISC"
