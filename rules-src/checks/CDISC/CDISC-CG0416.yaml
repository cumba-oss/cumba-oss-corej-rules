Core:
  Id: "CDISC-CG0416"
  Status: "Published"
  Version: "1"
Description: "Raise an error when the Qualifier Variable Label (QLABEL) value is longer\
  \ than 40 characters."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "SUPP--"
    - "SQ--"
Check:
  expression: >-
    len(QLABEL) > 40
Outcome:
  Message: "QLABEL value length is greater than 40 characters."
  Output_Variables:
  - "IDVAR"
  - "IDVARVAL"
  - "QNAM"
  - "QLABEL"
Source:
  Class: "SPC"
  Domain: "SUPP--"
  Variable: "QLABEL"
  Rule: "QLABEL value length <= 40"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "SDTMIG"
    Version: "3.4"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0416"
        Version: "1"
      Version: "2.0"
  - Name: "SDTMIG"
    Version: "3.3"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0416"
        Version: "1"
      Version: "2.0"
  - Name: "SDTMIG"
    Version: "3.2"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0416"
        Version: "1"
      Version: "2.0"
