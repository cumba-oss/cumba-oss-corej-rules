Core:
  Id: "CDISC-SEND-0331"
  Status: "Published"
  Version: "1"
Description: "Raise an error when the standardized character result (PCSTRESC) indicates\
  \ a value below the limit of quantitation ('BLQ') but the Lower Limit of Quantitation\
  \ (PCLLOQ) is missing or the Standard Units (PCSTRESU) is empty."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "PC"
Requirements:
  Variables:
    All:
    - "PCSTRESC"
Check:
  expression: >-
    PCSTRESC == "BLQ" and (empty(PCLLOQ) or empty(PCSTRESU))
Outcome:
  Message: "PCLLOQ is missing or PCSTRESU is empty when PCSTRESC is 'BLQ' (below the\
    \ limit of quantitation)."
Source:
  Class: "FND"
  Domain: "PC"
  Variable: "PCLLOQ, PCSTRESU, PCSTRESC"
  Plain_Text_Explanation: "If the test result in PCORRES is below the Lower Limit\
    \ of Quantitation as indicated in PCSTRESC, then the PCLLOQ must be populated\
    \ and the PCSTRESU populated with the appropriate unit"
  Condition: "PCSTRESC = \"BLQ\""
  Rule: "PCLLOQ ^= null AND PCTRESU ^= null"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "SENDIG-GENETOX"
    Version: "1.0"
    References:
    - Origin: "SEND Conformance Rules"
      Rule_Identifier:
        Id: "SEND331"
        Version: "1"
      Version: "5.0"
  - Name: "SENDIG-DART"
    Version: "1.2"
    References:
    - Origin: "SEND Conformance Rules"
      Rule_Identifier:
        Id: "SEND331"
        Version: "1"
      Version: "5.0"
  - Name: "SENDIG"
    Version: "3.1.1"
    References:
    - Origin: "SEND Conformance Rules"
      Rule_Identifier:
        Id: "SEND331"
        Version: "1"
      Version: "5.0"
