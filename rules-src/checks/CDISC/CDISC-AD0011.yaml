Core:
  Id: "CDISC-AD0011"
  Status: "Published"
  Version: "1"
Description: "Raise an error when a variable with a suffix of FL equals N and a variable\
  \ with the same root and a suffix of FN is present but does not equal 0"
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "ALL"
Check:
  expression: >-
    *FL == "N" and var_exists(*FN) and *FN != 0
Outcome:
  Message: "A variable with a suffix of FN is present but does not equal 0, although\
    \ the variable with the same root and a suffix of FL equals N"
  Output_Variables:
  - "*FL"
  - "*FN"
Source:
  Class: "ALL"
  Variable_or_Item: "*FN"
  Natural_Language_Rule_Failure_Criteria: "A variable with a suffix of FL is equal\
    \ to N and a variable with the same root and a suffix of FN is not equal to 0"
  Rule_Failure_Criteria: "A variable with a suffix of FN is not equal to 0"
  Condition_Failure: "Variable with a suffix of FL is present and equal to N, and\
    \ a variable with the same root and a suffix of FN is present"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.0"
    References:
