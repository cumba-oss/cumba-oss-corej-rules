Core:
  Id: "CDISC-SEND-0203"
  Status: "Published"
  Version: "1"
Description: "Raise an error when the tumor-detection interval (TFDETECT) is populated\
  \ but does not equal the number of days from the earliest dose date (earliest EXSTDTC\
  \ for the subject) to the tumor-detection date, plus one (first dose day = day 1)."
Executability: "Not Executable"
ExecutabilityHint:
  Category: "not executable"
  Detail: "Parked: the engine cannot express this rule's Source formula. The formula\
    \ is TFDETECT = (PMDTC - EXSTDTC) + 1, a two-hop foreign date subtraction — the\
    \ minuend comes from PM and the subtrahend from EX, neither of them the TF dataset\
    \ being validated. date_diff_days reaches ONE foreign dataset, so the shipped\
    \ implementation silently substituted the local TF.--DTC for PMDTC; that is a\
    \ different assertion, not an approximation of this one. The Source's detection-method\
    \ Condition (tumor was detected as a palpable mass) is a cross-domain relationship\
    \ test and is not implemented at all, so the four rules CDISC-SEND-0202 to 0205\
    \ shared one byte-identical Check and reported four identical findings per offending\
    \ record. Un-parking needs (1) two-hop foreign date arithmetic — the parked EC-47\
    \ gap, PLAN-date-diff-foreign-offset.md, register section 48 — and (2) a cross-domain\
    \ detection-method condition, which EC-47 does not cover."
Scope:
  Domains:
    Include:
    - "TF"
Requirements:
  Variables:
    All:
    - "EX.EXSTDTC"
    - "USUBJID"
    - "--DTC"
    - "TFDETECT"
    All_Or_None:
    - - "USUBJID"
      - "EX.USUBJID"
Match_Datasets:
- Keys:
  - "USUBJID"
  Name: "EX"
Bindings:
- name: "$days_from_first_dose"
  expression: "date_diff_days(--DTC, min_date(EXSTDTC, domain=\"EX\", group=[USUBJID]))\
    \ + 1"
Check:
  expression: >-
    is_complete_date(--DTC) and not empty(TFDETECT) and TFDETECT != $days_from_first_dose
Outcome:
  Message: "TFDETECT does not equal the number of days from the earliest EXSTDTC to\
    \ the detection date plus one."
  Output_Variables:
  - "$days_from_first_dose"
  - "--DTC"
  - "TFDETECT"
Source:
  Class: "FND"
  Domain: "TF"
  Variable: "TFDETECT"
  Plain_Text_Explanation: "If the tumor was detected as a palpable mass, then TFDETECT\
    \ is based off the PM domain variable PMDTC (Start Date/Time of Observation).\
    \ This is calculated as (PMDTC - EXSTDTC) + 1."
  Condition: "Tumor was detected as a palpable mass"
  Rule: "TFDETECT = (PMDTC - EXSTDTC) + 1"
