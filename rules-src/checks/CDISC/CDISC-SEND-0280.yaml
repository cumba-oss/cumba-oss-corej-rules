Core:
  Id: "CDISC-SEND-0280"
  Status: "Published"
  Version: "1"
Description: "Raise an error when Reason Not Done (--REASND) is empty for a record\
  \ whose Completion Status (--STAT) is \"NOT DONE\"."
Executability: "Partially Executable - Possible Underreporting"
Scope:
  Domains:
    Include:
    - "LB"
    - "MI"
Requirements:
  Variables:
    All:
    - "--STAT"
Check:
  expression: >-
    --STAT == "NOT DONE" and empty(--REASND)
Outcome:
  Message: "--REASND is empty for a record where --STAT is \"NOT DONE\"."
  Message_Folded: "--REASND is absent or empty although --STAT is equal to \"NOT DONE\"\
    ."
  Output_Variables:
  - "!--REASND"
Source:
  Class: "FND"
  Domain: "LB, MI"
  Variable: "--REASND"
  Plain_Text_Explanation: "Whenever --STAT is “NOT DONE”; --REASND should provide\
    \ the reason for not completing the evaluation as scheduled in the study plan"
  Condition: "LBSTAT (OR MISTAT) = “NOT DONE”"
  Rule: "--REASND ^= null"
