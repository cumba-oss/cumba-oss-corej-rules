Core:
  Id: "CDISC-CG0529"
  Status: "Published"
  Version: "1"
Description: "Raise an error when Planned Arm (ARM) is populated but Subject Reference\
  \ End Date/Time (RFENDTC) is empty."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "DM"
Check:
  expression: >-
    not empty(ARM) and empty(RFENDTC)
Outcome:
  Message: "RFENDTC is empty when ARM is populated."
  Message_Folded: "RFENDTC absent or not populated in any record of the dataset, and\
    \ at least one record meets the rest of the condition: RFENDTC is empty when ARM\
    \ is populated."
Source:
  Class: "SPC"
  Domain: "DM"
  Variable: "RFENDTC"
  Condition: "ARM ^= null"
  Rule: "RFENDTC ^= null"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "SDTMIG"
    Version: "3.4"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0529"
        Version: "1"
      Version: "2.0"
  - Name: "SDTMIG"
    Version: "3.3"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0529"
        Version: "1"
      Version: "2.0"
