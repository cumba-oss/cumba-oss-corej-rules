Core:
  Id: "CDISC-CG0664"
  Status: "Published"
  Version: "1"
Description: "Raise an error when the order of variables does not reflect the order\
  \ of the variables in the SDTM Model for the observation class."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "ALL"
Bindings:
- name: "$permitted_column_order"
  expression: "get_permitted_column_order()"
- name: "$permitted_column_order_upper"
  expression: "upper($permitted_column_order)"
- name: "$column_order_from_dataset"
  expression: "get_column_order_from_dataset()"
- name: "$column_order_from_dataset_upper"
  expression: "upper($column_order_from_dataset)"
- name: "$not_in_reference"
  expression: "minus($column_order_from_dataset_upper, subtract=$permitted_column_order_upper)"
- name: "$known_order"
  expression: "minus($column_order_from_dataset_upper, subtract=$not_in_reference)"
Check:
  expression: >-
    not empty($permitted_column_order) and not is_ordered_subset_of($known_order,
    $permitted_column_order_upper)
Outcome:
  Message: "Variables are not in the correct order as shown in the SDTM Model for\
    \ the observation class."
  Output_Variables:
  - "$column_order_from_dataset"
  - "$permitted_column_order"
  - "!$column_order_from_dataset_upper"
  - "!$permitted_column_order_upper"
  - "!$known_order"
  - "!$not_in_reference"
Source:
  Class: "ALL"
  Domain: "ALL"
  Variable: "GEN"
  Rule: "Variables are ordered with Identifiers first, followed by the Topic, Qualifier,\
    \ and Timing variables. Within each role, variables are ordered as shown in SDTM\
    \ tables in sections 3.1.1, 3.1.2, 3.1.3, 3.1.3.1, 3.1.4, and 3.1.5"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "SDTMIG"
    Version: "3.4"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0664"
        Version: "1"
      Version: "2.0"
