Core:
  Id: "CDISC-AD0465"
  Status: "Published"
  Version: "1"
Description: "Raise an error when TRCMPGyN is populated and TRCMPGy is empty on the\
  \ same record."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "SUBJECT LEVEL ANALYSIS DATASET"
Check:
  expression: >-
    not empty(TRCMPGyN) and empty(TRCMPGy)
Outcome:
  Message: "TRCMPGyN is populated but TRCMPGy is empty."
  Message_Folded: "TRCMPGy not populated in any record of the dataset, and at least\
    \ one record meets the rest of the condition: TRCMPGyN is populated but TRCMPGy\
    \ is empty."
  Output_Variables:
  - "TRCMPGy"
  - "TRCMPGyN"
wildcards:
  "y":
    min: 1
    max: 99
Source:
  Class: "SUBJECT LEVEL ANALYSIS DATASET"
  Variable_or_Item: "TRCMPGy where y is an integer [1-99, not zero-padded]"
  Natural_Language_Rule_Failure_Criteria: "On a given record, TRCMPGyN is populated\
    \ and TRCMPGy is not populated"
  Rule_Failure_Criteria: "TRCMPGy is not populated"
  Condition_Failure: "TRCMPGyN is populated"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.2"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR465"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.3"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR465"
        Version: "1"
      Version: "5.0"
