Core:
  Id: "CDISC-SEND-0151.1"
  Status: "Published"
  Version: "1"
Description: "Raise an error when the Date/Time of Collection (BGDTC) is empty for\
  \ a Body Weight Gain record (BGTESTCD equals \"BWGAINA\")."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "BG"
Requirements:
  Variables:
    All:
    - "BGDTC"
    - "BGTESTCD"
Check:
  expression: >-
    BGTESTCD == "BWGAINA" and empty(BGDTC)
Outcome:
  Message: "BGDTC is empty for a record where BGTESTCD equals \"BWGAINA\" (Average\
    \ Body Weight Gain)."
  Message_Folded: "BGDTC not populated in any record of the dataset, and at least\
    \ one record meets the rest of the condition: BGDTC is empty for a record where\
    \ BGTESTCD equals \"BWGAINA\" (Average Body Weight Gain)."
Source:
  Class: "FND"
  Domain: "BG"
  Variable: "BGDTC"
  Plain_Text_Explanation: "BGDTC must be populated when BGTESTCD is representing Average\
    \ Body Weight Gain."
  Condition: "BGTESTCD = \"BWGAINA\""
  Rule: "BGDTC ^= null"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "SENDIG"
    Version: "3.0"
    References:
    - Origin: "SEND Conformance Rules"
      Rule_Identifier:
        Id: "SEND151.1"
        Version: "1"
      Version: "5.0"
