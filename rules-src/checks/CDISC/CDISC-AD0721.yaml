Core:
  Id: "CDISC-AD0721"
  Status: "Published"
  Version: "1"
Description: "Raise an error when there is more than one value of TRTPN for a given\
  \ value of TRTP, considering only records where both variables are populated"
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "BASIC DATA STRUCTURE"
Check:
  expression: >-
    not empty(TRTP) and not empty(TRTPN) and has_multiple_values_for(TRTPN, TRTP)
Outcome:
  Message: "More than one value of TRTPN is present for the same populated value of\
    \ TRTP"
  Output_Variables:
  - "TRTP"
  - "TRTPN"
Source:
  Class: "BASIC DATA STRUCTURE; MEDICAL DEVICE BASIC DATA STRUCTURE"
  Variable_or_Item: "TRTPN"
  Natural_Language_Rule_Failure_Criteria: "There is more than one value of TRTPN for\
    \ a given value of TRTP, considering only those rows on which both variables are\
    \ populated"
  Rule_Failure_Criteria: "There is more than one value of TRTPN for a given value\
    \ of TRTP"
  Condition_Failure: "On rows where TRTPN and TRTP are both populated"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.1"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR721"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.2"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR721"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.3"
    References:
