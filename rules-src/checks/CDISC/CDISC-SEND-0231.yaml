Core:
  Id: "CDISC-SEND-0231"
  Status: "Published"
  Version: "1"
Description: "Raise an error when the Sequence Number (TXSEQ) is not unique for a\
  \ record within the TX dataset."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "TX"
Check:
  expression: >-
    not is_unique_set([TXSEQ, STUDYID])
Outcome:
  Message: "TXSEQ is not unique within the TX dataset."
Source:
  Class: "TDM"
  Domain: "TX"
  Variable: "TXSEQ"
  Plain_Text_Explanation: "TXSEQ should be unique for each record within the TX dataset."
  Rule: "TXSEQ should be unique for each record within the TX dataset."
