Core:
  Id: "CDISC-AD0448"
  Status: "Published"
  Version: "1"
Description: "Raise an error when DTHCAUS is populated but DTHCAUSN is missing"
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "SUBJECT LEVEL ANALYSIS DATASET"
Check:
  expression: >-
    not empty(DTHCAUS) and empty(DTHCAUSN)
Outcome:
  Message: "DTHCAUS is populated, but DTHCAUSN is missing"
Source:
  Class: "SUBJECT LEVEL ANALYSIS DATASET"
  Variable_or_Item: "DTHCAUSN"
  Natural_Language_Rule_Failure_Criteria: "On a given record, DTHCAUS is populated\
    \ and DTHCAUSN is not populated"
  Rule_Failure_Criteria: "DTHCAUSN is not populated"
  Condition_Failure: "DTHCAUS is populated"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.2"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR448"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.3"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR448"
        Version: "1"
      Version: "5.0"
