Core:
  Id: "CDISC-AD0080"
  Status: "Published"
  Version: "1"
Description: "Raise an error when TRTxxA is present but the corresponding TRTxxP is\
  \ not present, where xx is an integer [01-99, zero-padded]"
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "SUBJECT LEVEL ANALYSIS DATASET"
Check:
  expression: >-
    var_exists("TRTxxA") and not var_exists("TRTxxP")
Outcome:
  Message: "TRTxxA is present but the corresponding TRTxxP is not present"
  Output_Variables:
  - "TRTxxA"
wildcards:
  xx:
    min: 1
    max: 99
Source:
  Class: "SUBJECT LEVEL ANALYSIS DATASET"
  Variable_or_Item: "TRTxxA where xx is an integer [01-99, zero-padded]"
  Natural_Language_Rule_Failure_Criteria: "TRTxxA is present and TRTxxP is not present"
  Rule_Failure_Criteria: "TRTxxP is not present"
  Condition_Failure: "TRTxxA is present"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.0"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
