Core:
  Id: "CDISC-CG0329-A"
  Status: "Published"
  Version: "1"
Description: "Raise an error when the Rule for End of Element (TEENRL) variable is\
  \ not present in the Trial Elements (TE) dataset and TEDUR is not populated; with\
  \ no TEENRL column, TEDUR must be populated for each Element."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "TE"
Requirements:
  Variables:
    None:
    - "TEENRL"
    All:
    - "TEDUR"
Check:
  expression: >-
    empty(TEDUR)
Outcome:
  Message: "TEENRL is not present in the dataset and TEDUR is not populated."
  Message_Folded: "TEDUR not populated in any record of the dataset: TEENRL is not\
    \ present in the dataset and TEDUR is not populated."
Source_Proposed:
  Sheet_Issue: "#211"
  Class: "TDM"
  Domain: "TE"
  Variable: "TEDUR"
  Condition: "TEENRL variable is not present in the dataset"
  Rule: "TEDUR ^= null"
Source:
  Class: "TDM"
  Domain: "TE"
  Variable: "TEDUR"
  Condition: "TEENRL = null"
  Rule: "TEDUR ^= null"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "SDTMIG"
    Version: "3.4"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0329"
        Version: "1"
      Version: "2.0"
  - Name: "SDTMIG"
    Version: "3.3"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0329"
        Version: "1"
      Version: "2.0"
  - Name: "SDTMIG"
    Version: "3.2"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0329"
        Version: "1"
      Version: "2.0"
