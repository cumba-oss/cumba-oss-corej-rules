Core:
  Id: "CDISC-CG0425"
  Status: "Published"
  Version: "1"
Description: "Raise a warning when a numeric Character Result/Finding in Standard\
  \ Format (--STRESC) is populated but Standard Units (--STRESU) is empty."
Severity: "Warning"
Executability: "Partially Executable - Possible Underreporting"
Scope:
  Classes:
    Include:
    - "FINDINGS"
Requirements:
  Variables:
    All:
    - "--STRESU"
    - "--STRESC"
Check:
  expression: >-
    not empty(--STRESC) and --STRESC =~ /^-?[0-9]+(\\.[0-9]+)?$/ and empty(--STRESU)
Outcome:
  Message: "--STRESU is empty when a numeric --STRESC is provided."
  Output_Variables:
  - "--STRESC"
  - "--STRESU"
Source:
  Class: "FND"
  Domain: "ALL"
  Variable: "--STRESU"
  Condition: "--STRESC ^= null and units are applicable for the result"
  Rule: "--STRESU ^= null"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "SDTMIG"
    Version: "3.4"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0425"
        Version: "1"
      Version: "2.0"
  - Name: "SDTMIG"
    Version: "3.3"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0425"
        Version: "1"
      Version: "2.0"
  - Name: "SDTMIG"
    Version: "3.2"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0425"
        Version: "1"
      Version: "2.0"
