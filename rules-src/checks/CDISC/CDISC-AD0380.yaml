Core:
  Id: "CDISC-AD0380"
  Status: "Published"
  Version: "2"
Description: "Raise an error when BTOXGR is populated and BTOXGRN is not populated."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "BASIC DATA STRUCTURE"
    - "MEDICAL DEVICE BASIC DATA STRUCTURE"
Check:
  expression: >-
    not empty(BTOXGR) and empty(BTOXGRN)
Outcome:
  Message: "BTOXGR is populated but BTOXGRN is not populated."
  Message_Folded: "BTOXGRN absent or not populated in any record of the dataset, and\
    \ at least one record meets the rest of the condition: BTOXGR is populated but\
    \ BTOXGRN is not populated."
Source:
  Class: "BASIC DATA STRUCTURE; MEDICAL DEVICE BASIC DATA STRUCTURE"
  Variable_or_Item: "BTOXGRN"
  Natural_Language_Rule_Failure_Criteria: "On a given record, BTOXGR is populated\
    \ and BTOXGRN is not populated"
  Rule_Failure_Criteria: "BTOXGRN is not populated"
  Condition_Failure: "BTOXGR is populated"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.2"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR380"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.3"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR380"
        Version: "2"
      Version: "5.0"
