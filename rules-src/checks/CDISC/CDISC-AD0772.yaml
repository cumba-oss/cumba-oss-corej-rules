Core:
  Id: "CDISC-AD0772"
  Status: "Published"
  Version: "1"
Description: "Raise an error when there is more than one value of ASEVN for a given\
  \ value of ASEV, considering only rows on which both variables are populated"
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "OCCURRENCE DATA STRUCTURE"
    - "MEDICAL DEVICE OCCURRENCE DATA STRUCTURE"
Check:
  expression: >-
    not empty(ASEV) and not empty(ASEVN) and has_multiple_values_for(ASEVN, ASEV)
Outcome:
  Message: "ASEVN takes more than one value for the same value of ASEV, considering\
    \ only rows on which both variables are populated."
Source:
  Class: "OCCURRENCE DATA STRUCTURE; MEDICAL DEVICE OCCURRENCE DATA STRUCTURE"
  Variable_or_Item: "ASEVN"
  Natural_Language_Rule_Failure_Criteria: "There is more than one value of ASEVN for\
    \ a given value of ASEV, considering only those rows on which both variables are\
    \ populated"
  Rule_Failure_Criteria: "There is more than one value of ASEVN for a given value\
    \ of ASEV"
  Condition_Failure: "On rows where both ASEVN and ASEV are both populated."
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.1"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR772"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
