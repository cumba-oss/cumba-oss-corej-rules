Core:
  Id: "CDISC-AD0096"
  Status: "Published"
  Version: "1"
Description: "Raise an error when TRTA and TRTAN are both populated and there is more\
  \ than one value of TRTA for a given value of TRTAN"
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "BASIC DATA STRUCTURE"
Requirements:
  Variables:
    All:
    - "TRTA"
    - "TRTAN"
Check:
  expression: >-
    not empty(TRTA) and not empty(TRTAN) and has_multiple_values_for(TRTA, TRTAN)
Outcome:
  Message: "More than one value of TRTA was found for the same value of TRTAN"
  Output_Variables:
  - "TRTA"
  - "TRTAN"
Source:
  Class: "BASIC DATA STRUCTURE"
  Variable_or_Item: "TRTA"
  Natural_Language_Rule_Failure_Criteria: "There is more than one value of TRTA for\
    \ a given value of TRTAN"
  Rule_Failure_Criteria: "There is more than one value of TRTA for a given value of\
    \ TRTAN"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.0"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR96"
        Version: "1"
      Version: "5.0"
