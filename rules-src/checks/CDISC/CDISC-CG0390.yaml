Core:
  Id: "CDISC-CG0390"
  Status: "Published"
  Version: "1"
Description: "Raise an error when AESDISAB is populated and its value is not 'Y' or\
  \ 'N'."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "AE"
Requirements:
  Variables:
    All:
    - "AESDISAB"
Check:
  expression: >-
    not empty(AESDISAB) and AESDISAB not in ["Y", "N"]
Outcome:
  Message: "AESDISAB is populated, but its value is not 'Y' or 'N'."
Source:
  Class: "EVT"
  Domain: "AE"
  Variable: "--SDISAB"
  Condition: "--SDISAB ^= null"
  Rule: "--SDISAB in ('Y','N')"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "SDTMIG"
    Version: "3.4"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0390"
        Version: "1"
      Version: "2.0"
  - Name: "SDTMIG"
    Version: "3.3"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0390"
        Version: "1"
      Version: "2.0"
  - Name: "SDTMIG"
    Version: "3.2"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0390"
        Version: "1"
      Version: "2.0"
