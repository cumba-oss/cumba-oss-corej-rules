Core:
  Id: "CDISC-SEND-0329"
  Status: "Published"
  Version: "1"
Description: "Raise an error when the standardized character result (PCSTRESC) indicates\
  \ a value outside the limit of quantitation ('BLQ' or 'ALQ') but the Numeric Result/Finding\
  \ in Std Units (PCSTRESN) is populated; PCSTRESN should be missing rather than zero."
Executability: "Partially Executable - Possible Underreporting"
Scope:
  Domains:
    Include:
    - "PC"
Requirements:
  Variables:
    All:
    - "PCSTRESN"
    - "PCSTRESC"
Check:
  expression: >-
    (PCSTRESC == "BLQ" or PCSTRESC == "ALQ") and not empty(PCSTRESN)
Outcome:
  Message: "PCSTRESN is populated when the result is outside the limit of quantitation\
    \ (PCSTRESC is 'BLQ' or 'ALQ'); it should be missing and not set to zero."
Source:
  Class: "FND"
  Domain: "PC"
  Variable: "PCSTRESN"
  Plain_Text_Explanation: "If the PCORRES result is above or below the Limit of Quantification,\
    \ then PCSTRESN should be null and not populated with the value of zero (0)."
  Condition: "PCORRES is outside the Limit of Quantification"
  Rule: "PCSTRESN = null"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "SENDIG-GENETOX"
    Version: "1.0"
    References:
    - Origin: "SEND Conformance Rules"
      Rule_Identifier:
        Id: "SEND329"
        Version: "1"
      Version: "5.0"
  - Name: "SENDIG-DART"
    Version: "1.2"
