Core:
  Id: "CDISC-CG0404"
  Status: "Published"
  Version: "1"
Description: "Raise an error when --PRESP is equal to 'Y' and --OCCUR is empty and\
  \ --STAT is not present in dataset."
Executability: "Fully Executable"
Scope:
  Classes:
    Include:
    - "EVENTS"
    - "INTERVENTIONS"
  Domains:
    Exclude:
    - "DS"
    - "DV"
    - "EX"
Requirements:
  Variables:
    All:
    - "--OCCUR"
    - "--PRESP"
Check:
  expression: >-
    --PRESP == "Y" and empty(--OCCUR) and not var_exists("--STAT")
Outcome:
  Message: "--STAT is not present in dataset when --PRESP equals 'Y' and --OCCUR is\
    \ empty."
  Message_Folded: "--OCCUR not populated in any record of the dataset, and at least\
    \ one record meets the rest of the condition: --STAT is not present in dataset\
    \ when --PRESP equals 'Y' and --OCCUR is empty."
  Output_Variables:
  - "!--OCCUR"
Source:
  Class: "EVT, INT"
  Domain: "NOT(DS, DV, EX)"
  Variable: "--STAT"
  Condition: "--PRESP = 'Y' and  --OCCUR = null"
  Rule: "--STAT present in dataset"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "SDTMIG"
    Version: "3.4"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0404"
        Version: "2"
      Version: "2.0"
  - Name: "SDTMIG"
    Version: "3.3"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0404"
        Version: "2"
      Version: "2.0"
  - Name: "SDTMIG"
    Version: "3.2"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0404"
        Version: "2"
      Version: "2.0"
