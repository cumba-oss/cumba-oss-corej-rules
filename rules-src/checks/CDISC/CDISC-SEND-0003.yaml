Core:
  Id: "CDISC-SEND-0003"
  Status: "Published"
  Version: "1"
Description: "Raise an error when a variable label is longer than 40 characters."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "ALL"
Check:
  expression: >-
    len(variable_label) > 40
Outcome:
  Message: "The variable label is longer than 40 characters."
Source:
  Class: "ALL"
  Domain: "ALL"
  Variable: "GEN"
  Plain_Text_Explanation: "Variable Label limited to 40 characters; should be unique\
    \ for each variable in the dataset"
  Rule: "Variable label length <= 40"
