Core:
  Id: "CDISC-AD0860"
  Status: "Published"
  Version: "1"
Description: "Raise an error when COHORT is populated and COHORTC is not populated."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "BASIC DATA STRUCTURE"
Requirements:
  Variables:
    All:
    - "COHORT"
    - "COHORTC"
Check:
  expression: >-
    not empty(COHORT) and empty(COHORTC)
Outcome:
  Message: "COHORT is populated, but COHORTC is not populated."
  Message_Folded: "COHORTC not populated in any record of the dataset, and at least\
    \ one record meets the rest of the condition: COHORT is populated, but COHORTC\
    \ is not populated."
Source:
  Class: "BASIC DATA STRUCTURE"
  Subclass: "POPULATION PHARMACOKINETIC ANALYSIS"
  Variable_or_Item: "COHORTC"
  Natural_Language_Rule_Failure_Criteria: "COHORT is populated and COHORTC is not\
    \ populated"
  Rule_Failure_Criteria: "COHORTC is not populated"
  Condition_Failure: "COHORT is populated"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.3"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR860"
        Version: "1"
      Version: "5.0"
