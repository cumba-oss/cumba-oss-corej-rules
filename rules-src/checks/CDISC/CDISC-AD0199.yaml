Core:
  Id: "CDISC-AD0199"
  Status: "Published"
  Version: "1"
Description: "Raise an error when a variable in ADaM shares its name with a variable\
  \ in SDTM but the two do not have identical data types."
Executability: "Partially Executable"
Scope:
  Domains:
    Include:
    - "ALL"
Bindings:
- name: "$sdtm_data_type"
  expression: "cross_dataset_variable_metadata(\"data_type\", domain=\"*\")"
Check:
  expression: >-
    not empty($sdtm_data_type) and var_type() != $sdtm_data_type
Outcome:
  Message: "A variable in SDTM and a variable in ADaM with the same name do not have\
    \ identical data types"
  Output_Variables:
  - "$sdtm_data_type"
Source:
  Class: "ALL"
  Variable_or_Item: "ALL"
  Natural_Language_Rule_Failure_Criteria: "A variable is present in ADaM with the\
    \ same name as a variable present in SDTM but the variables do not have identical\
    \ data types"
  Rule_Failure_Criteria: "A variable in SDTM and a variable in ADaM with the same\
    \ name do not have identical data types"
  Condition_Failure: "A variable is present in ADaM with the same name as a variable\
    \ present in SDTM"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.0"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR199"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.1"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR199"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.2"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR199"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.3"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR199"
        Version: "1"
      Version: "5.0"
