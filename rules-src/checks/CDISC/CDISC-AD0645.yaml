Core:
  Id: "CDISC-AD0645"
  Status: "Published"
  Version: "1"
Description: "Raise an error when the SDTM AE dataset contains the AETOXGR column\
  \ but AETOXGR is not present in the ADAE dataset."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "OCCURRENCE DATA STRUCTURE"
  Subclasses:
    Include:
    - "ADVERSE EVENT"
Requirements:
  Variables:
    All:
    - "AE.AETOXGR"
Check:
  expression: >-
    not var_exists("AETOXGR")
Outcome:
  Message: "AE.AETOXGR is present but AETOXGR is not present"
  Output_Variables:
  - "AE.AETOXGR"
  - "AETOXGR"
Source:
  Class: "OCCURRENCE DATA STRUCTURE"
  Subclass: "ADVERSE EVENT"
  Variable_or_Item: "AE.AETOXGR"
  Natural_Language_Rule_Failure_Criteria: "AE.AETOXGR is present but AETOXGR is not\
    \ present"
  Rule_Failure_Criteria: "AETOXGR is not present"
  Condition_Failure: "AE.AETOXGR is present"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.0"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR645"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.1"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR645"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.2"
    References:
