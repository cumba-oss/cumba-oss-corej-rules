Core:
  Id: "CDISC-CG0630"
  Status: "Published"
  Version: "1"
Description: "Raise an error when FETUSID is present in the dataset, since FETUSID\
  \ is not permitted in human clinical trials."
Executability: "Not Executable"
ExecutabilityHint:
  Category: "not executable"
  Detail: "Parked as an R-5.26 duplicate of CDISC-CG0509 (owner rulings D-8 + D-18,\
    \ 2026-09-14): the two are identical in every field but the id. ⛔ The SURVIVOR\
    \ IS NOT THE HIGHER NUMBER here — D-18 makes COVERAGE the invariant and the number\
    \ only a tie-break. CDISC-CG0630 ships into a strict SUBSET of CDISC-CG0509's\
    \ packages, so parking CDISC-CG0509 instead would leave the standards only it\
    \ reaches with no active rule. Every standard either rule names keeps an active\
    \ rule."
Scope:
  Domains:
    Include:
    - "ALL"
Check:
  expression: >-
    var_exists("FETUSID")
Outcome:
  Message: "Variable FETUSID is present but is not permitted in human clinical trials."
  Output_Variables:
  - "FETUSID"
Source:
  Class: "ALL"
  Variable: "FETUSID"
  Rule: "FETUSID not present in dataset"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "SDTMIG"
    Version: "3.4"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0630"
        Version: "1"
      Version: "2.0"
