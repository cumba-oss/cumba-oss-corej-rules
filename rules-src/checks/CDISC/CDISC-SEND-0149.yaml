Core:
  Id: "CDISC-SEND-0149"
  Status: "Published"
  Version: "1"
Description: "Raise an error when a Reason for Exclusion (--REASEX) is populated but\
  \ the corresponding Exclusion Flag (--EXCLFL) is not \"Y\"; --REASEX must be used\
  \ only when --EXCLFL is \"Y\"."
Executability: "Fully Executable"
Scope:
  Classes:
    Include:
    - "FINDINGS"
Requirements:
  Variables:
    All:
    - "--REASEX"
Check:
  expression: >-
    not empty(--REASEX) and (not var_exists("--EXCLFL") or --EXCLFL != "Y")
Outcome:
  Message: "--REASEX is populated when --EXCLFL is not \"Y\"."
  Output_Variables:
  - "!--REASEX"
Source:
  Class: "FND"
  Domain: "ALL"
  Variable: "--REASEX"
  Plain_Text_Explanation: "--REASEX should only be present when --EXCLFL is \"Y\""
  Condition: "--REASEX  ^= null"
  Rule: "--EXCLFL = \"Y\""
Standards:
- Organization: "CDISC"
