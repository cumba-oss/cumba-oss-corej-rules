Core:
  Id: "CDISC-AD0866"
  Status: "Published"
  Version: "1"
Description: "Raise an error when RACEN is populated and RACE is not populated."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "BASIC DATA STRUCTURE"
Requirements:
  Variables:
    All:
    - "RACEN"
Check:
  expression: >-
    not empty(RACEN) and empty(RACE)
Outcome:
  Message: "RACEN is populated, but RACE is not populated."
Source:
  Class: "BASIC DATA STRUCTURE"
  Subclass: "POPULATION PHARMACOKINETIC ANALYSIS"
  Variable_or_Item: "RACE"
  Natural_Language_Rule_Failure_Criteria: "RACEN is populated and RACE is not populated"
  Rule_Failure_Criteria: "RACE is not populated"
  Condition_Failure: "RACEN is populated"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.3"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR866"
        Version: "1"
      Version: "5.0"
