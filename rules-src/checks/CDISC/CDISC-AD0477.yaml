Core:
  Id: "CDISC-AD0477"
  Status: "Published"
  Version: "1"
Description: "Raise an error when there is more than one value of STRATAVN for a given\
  \ value of STRATAV, considering only records where both variables are populated."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "SUBJECT LEVEL ANALYSIS DATASET"
Check:
  expression: >-
    not empty(STRATAV) and not empty(STRATAVN) and has_multiple_values_for(STRATAVN, STRATAV)
Outcome:
  Message: "More than one value of STRATAVN was found for the same value of STRATAV."
Source:
  Class: "SUBJECT LEVEL ANALYSIS DATASET"
  Variable_or_Item: "STRATAVN"
  Natural_Language_Rule_Failure_Criteria: "There is more than one value of STRATAVN\
    \ for a given value of STRATAV, considering only those rows on which both variables\
    \ are populated"
  Rule_Failure_Criteria: "There is more than one value of STRATAVN for a given value\
    \ of STRATAV"
  Condition_Failure: "On rows where both STRATAVN and STRATAV are both populated."
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.2"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR477"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.3"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR477"
        Version: "1"
      Version: "5.0"
