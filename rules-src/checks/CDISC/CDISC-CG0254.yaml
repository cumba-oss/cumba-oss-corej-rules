Core:
  Id: "CDISC-CG0254"
  Status: "Published"
  Version: "1"
Description: "Raise an error when TIVERS is not present and IETESTCD is not unique\
  \ within the TI dataset."
Executability: "Not Executable"
ExecutabilityHint:
  Category: "not executable"
  Detail: "Parked as an R-5.26 duplicate of CDISC-CG0256 (owner rulings D-8 + D-18,\
    \ 2026-09-14): the two are identical in every field but the id and ship into exactly\
    \ the same packages, so one run reported the same finding twice. Both package\
    \ sets being equal, D-18's tie-break applies and the lower-numbered row is parked\
    \ — the lower id was authored first, so the higher is the more recent statement.\
    \ The row stays documented here while CDISC-CG0256 carries the executable check."
Scope:
  Domains:
    Include:
    - "TI"
Check:
  expression: >-
    not var_exists("TIVERS") and not is_unique_set([IETESTCD, DOMAIN])
Outcome:
  Message: "IETESTCD is not unique within the dataset."
  Output_Variables:
  - "IETESTCD"
Source:
  Class: "TDM"
  Domain: "TI"
  Variable: "TIVERS"
  Condition: "Greater than one version of the IE criteria"
  Rule: "TIVERS present in dataset"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "SDTMIG"
    Version: "3.4"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0254"
        Version: "1"
      Version: "2.0"
  - Name: "SDTMIG"
    Version: "3.3"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0254"
        Version: "1"
      Version: "2.0"
  - Name: "SDTMIG"
    Version: "3.2"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0254"
        Version: "1"
      Version: "2.0"
