Core:
  Id: "CDISC-AD0508"
  Status: "Published"
  Version: "1"
Description: "Raise an error when a variable name that is not one of the standard\
  \ library variables ends in TMF but its label does not end with 'Imputation Flag'\
  \ (or 'Imput. Flag') or does not contain 'Time'."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "ALL"
Operations:
- id: "$library_variables"
  expression: "get_column_order_from_library()"
Check:
  expression: >-
    ends_with(varname(), "TMF") and (var_label("DATA") !~ / Imput(\\.|ation) Flag$/ or not
    contains(var_label("DATA"), "Time")) and varname() not in $library_variables
Outcome:
  Message: "A variable ending in TMF has a label that does not end with 'Imputation\
    \ Flag' (or 'Imput. Flag') or does not contain 'Time'."
  Output_Variables:
  - "variable_name"
  - "variable_label"
Source:
  Class: "ALL"
  Variable_or_Item: "*TMF"
  Natural_Language_Rule_Failure_Criteria: "A variable ending in TMF must contain \"\
    Time Imputation Flag\" in the label"
  Rule_Failure_Criteria: "*TMF does not contain \"Time Imputation Flag\" in the label"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.1"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR508"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.2"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR508"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.3"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR508"
        Version: "1"
      Version: "5.0"
