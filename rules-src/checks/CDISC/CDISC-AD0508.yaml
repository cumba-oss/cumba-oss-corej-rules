Core:
  Id: "CDISC-AD0508"
  Status: "Published"
  Version: "1"
Description: "Raise an error when a variable's name ends in TMF, the ADaM implementation\
  \ guide's *TMF naming fragment governs it (the name is not a standard library variable),\
  \ and its label does not end with 'Imputation Flag' (or 'Imput. Flag') or does not\
  \ contain 'Time'."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "ALL"
Check:
  expression: >-
    ends_with(upper(varname()), "TMF") and var_name("LIBRARY") == "*TMF" and (var_label("DATA") !~ /
    Imput(\\.|ation) Flag$/ or not contains(var_label("DATA"), "Time"))
Outcome:
  Message: "A variable ending in TMF has a label that does not end with 'Imputation\
    \ Flag' (or 'Imput. Flag') or does not contain 'Time'."
  Output_Variables:
  - "variable_name"
  - "variable_label"
  - "library_variable_label_template"
Source:
  Class: "ALL"
  Variable_or_Item: "*TMF"
  Natural_Language_Rule_Failure_Criteria: "A variable ending in TMF must contain \"\
    Time Imputation Flag\" in the label"
  Rule_Failure_Criteria: "*TMF does not contain \"Time Imputation Flag\" in the label"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.1"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR508"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.2"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR508"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.3"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR508"
        Version: "1"
      Version: "5.0"
