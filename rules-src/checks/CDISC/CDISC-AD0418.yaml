Core:
  Id: "CDISC-AD0418"
  Status: "Published"
  Version: "1"
Description: "Raise an error when TRTSEQA is populated and TRTSEQAN is not populated."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "SUBJECT LEVEL ANALYSIS DATASET"
Requirements:
  Variables:
    All:
    - "TRTSEQA"
    - "TRTSEQAN"
Check:
  expression: >-
    not empty(TRTSEQA) and empty(TRTSEQAN)
Outcome:
  Message: "TRTSEQA is populated but TRTSEQAN is not populated."
  Message_Folded: "TRTSEQAN not populated in any record of the dataset, and at least\
    \ one record meets the rest of the condition: TRTSEQA is populated but TRTSEQAN\
    \ is not populated."
Source:
  Class: "SUBJECT LEVEL ANALYSIS DATASET"
  Variable_or_Item: "TRTSEQAN"
  Natural_Language_Rule_Failure_Criteria: "On a given record, TRTSEQA is populated\
    \ and TRTSEQAN is not populated"
  Rule_Failure_Criteria: "TRTSEQAN is not populated"
  Condition_Failure: "TRTSEQA is populated"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.2"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR418"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.3"
    References:
