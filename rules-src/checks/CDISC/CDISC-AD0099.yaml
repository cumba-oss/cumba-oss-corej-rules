Core:
  Id: "CDISC-AD0099"
  Status: "Published"
  Version: "2"
Description: "Raise an error when, on a given record, a variable with a suffix of\
  \ STDY and the variable with the same root and a suffix of ENDY are both populated,\
  \ and the STDY variable's value is greater than the ENDY variable's value"
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "BASIC DATA STRUCTURE"
    - "MEDICAL DEVICE BASIC DATA STRUCTURE"
Check:
  expression: >-
    not empty(*STDY) and not empty(*ENDY) and *STDY > *ENDY
Outcome:
  Message: "On this record, the value of the STDY variable is greater than the value\
    \ of the corresponding ENDY variable"
  Output_Variables:
  - "*STDY"
  - "*ENDY"
Source:
  Class: "BASIC DATA STRUCTURE; MEDICAL DEVICE BASIC DATA STRUCTURE"
  Variable_or_Item: "*STDY"
  Natural_Language_Rule_Failure_Criteria: "On a given record, a variable with a suffix\
    \ of STDY has a value greater than a value of a variable with the same root and\
    \ a suffix of ENDY, and both variables are populated"
  Rule_Failure_Criteria: "A variable with a suffix of STDY has a value greater than\
    \ a value of a variable with the same root and a suffix of ENDY"
  Condition_Failure: "On rows where *STDY and *ENDY are both populated"
