Core:
  Id: "CDISC-CG0153"
  Status: "Published"
  Version: "1"
Description: "Raise an error when the value of Planned Arm Code (ARMCD) is longer\
  \ than 20 characters."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "DM"
    - "TA"
Check:
  expression: >-
    len(ARMCD) > 20
Outcome:
  Message: "ARMCD value length is greater than 20 characters."
  Output_Variables:
  - "ARMCD"
Source:
  Class: "SPC, TDM"
  Domain: "DM, TA"
  Variable: "ARMCD"
  Rule: "ARMCD value length <= 20"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "SDTMIG"
    Version: "3.4"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0153"
        Version: "1"
      Version: "2.0"
  - Name: "SDTMIG"
    Version: "3.3"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0153"
        Version: "1"
      Version: "2.0"
  - Name: "SDTMIG"
    Version: "3.2"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0153"
        Version: "1"
      Version: "2.0"
