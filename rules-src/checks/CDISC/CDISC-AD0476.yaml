Core:
  Id: "CDISC-AD0476"
  Status: "Published"
  Version: "1"
Description: "Raise an error when there is more than one value of STRATAV for a given\
  \ value of STRATAVN, considering only records where both variables are populated."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "SUBJECT LEVEL ANALYSIS DATASET"
Check:
  expression: >-
    not empty(STRATAV) and not empty(STRATAVN) and has_multiple_values_for(STRATAV, STRATAVN)
Outcome:
  Message: "More than one value of STRATAV was found for the same value of STRATAVN."
Source:
  Class: "SUBJECT LEVEL ANALYSIS DATASET"
  Variable_or_Item: "STRATAV"
  Natural_Language_Rule_Failure_Criteria: "There is more than one value of STRATAV\
    \ for a given value of STRATAVN, considering only those rows on which both variables\
    \ are populated"
  Rule_Failure_Criteria: "There is more than one value of STRATAV for a given value\
    \ of STRATAVN"
  Condition_Failure: "On rows where both STRATAV and STRATAVN are both populated."
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.2"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR476"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.3"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR476"
        Version: "1"
      Version: "5.0"
