Core:
  Id: "CDISC-AD0345"
  Status: "Published"
  Version: "2"
Description: "Raise an error when, within a parameter, ANRHIC has more than one value\
  \ for a given value of ANRHI"
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "BASIC DATA STRUCTURE"
    - "MEDICAL DEVICE BASIC DATA STRUCTURE"
Check:
  expression: >-
    has_multiple_values_for(ANRHIC, ANRHI, within=PARAMCD)
Outcome:
  Message: "Within this parameter, ANRHIC has more than one value for the same value\
    \ of ANRHI."
Source:
  Class: "BASIC DATA STRUCTURE; MEDICAL DEVICE BASIC DATA STRUCTURE"
  Variable_or_Item: "ANRHIC"
  Natural_Language_Rule_Failure_Criteria: "Within a parameter, there is more than\
    \ one value of ANRHIC for a given value of ANRHI"
  Rule_Failure_Criteria: "Within a parameter, there is more than one value of ANRHIC\
    \ for a given value of ANRHI"
