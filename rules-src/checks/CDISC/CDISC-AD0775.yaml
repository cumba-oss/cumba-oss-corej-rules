Core:
  Id: "CDISC-AD0775"
  Status: "Published"
  Version: "1"
Description: "Raise an error when there is more than one value of AEREL for a given\
  \ value of AERELN, considering only rows on which both variables are populated"
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "OCCURRENCE DATA STRUCTURE"
    - "MEDICAL DEVICE OCCURRENCE DATA STRUCTURE"
Check:
  expression: >-
    not empty(AEREL) and not empty(AERELN) and has_multiple_values_for(AEREL, AERELN)
Outcome:
  Message: "AEREL takes more than one value for the same value of AERELN, considering\
    \ only rows on which both variables are populated."
Source:
  Class: "OCCURRENCE DATA STRUCTURE; MEDICAL DEVICE OCCURRENCE DATA STRUCTURE"
  Variable_or_Item: "AEREL"
  Natural_Language_Rule_Failure_Criteria: "There is more than one value of AEREL for\
    \ a given value of AERELN, considering only those rows on which both variables\
    \ are populated"
  Rule_Failure_Criteria: "There is more than one value of AEREL for a given value\
    \ of AERELN"
  Condition_Failure: "On rows where both AEREL and AERELN are both populated."
Standards:
- Organization: "CDISC"
  Standards:
