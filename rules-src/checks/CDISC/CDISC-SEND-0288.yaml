Core:
  Id: "CDISC-SEND-0288"
  Status: "Published"
  Version: "1"
Description: "Raise an error when both the Parameter Value (TSVAL) and the Parameter\
  \ Null Flavor (TSVALNF) variables are populated."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "TS"
Requirements:
  Variables:
    All:
    - "TSVALNF"
    - "TSVAL"
Check:
  expression: >-
    not empty(TSVAL) and not empty(TSVALNF)
Outcome:
  Message: "Both TSVAL and TSVALNF variables are populated"
Source:
  Class: "TDM"
  Domain: "TS"
  Variable: "TSVAL, TSVALNF"
  Plain_Text_Explanation: "Either TSVAL or TSVALNF is populated, but not both."
  Rule: "Either TSVAL or TSVALNF is populated, but not both."
