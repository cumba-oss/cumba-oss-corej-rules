Core:
  Id: "CDISC-SEND-0020"
  Status: "Published"
  Version: "1"
Description: "Raise an error when the Qualifier Variable Name (QNAM) is longer than\
  \ 8 characters."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "SUPP--"
    - "SQ--"
Requirements:
  Variables:
    All:
    - "QNAM"
Check:
  expression: >-
    not empty(QNAM) and len(QNAM) > 8
Outcome:
  Message: "QNAM is longer than 8 characters."
Source:
  Class: "SPC"
  Domain: "SUPP--"
  Variable: "QNAM"
  Plain_Text_Explanation: "QNAM value limited to 8 characters"
  Rule: "QNAM value length <= 8"
