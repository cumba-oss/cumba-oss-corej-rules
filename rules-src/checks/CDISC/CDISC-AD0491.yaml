Core:
  Id: "CDISC-AD0491"
  Status: "Published"
  Version: "2"
Description: "Raise an error when LVOTFN is populated and LVOTFL is empty on the same\
  \ record."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "BASIC DATA STRUCTURE"
    - "MEDICAL DEVICE BASIC DATA STRUCTURE"
    - "OCCURRENCE DATA STRUCTURE"
    - "MEDICAL DEVICE OCCURRENCE DATA STRUCTURE"
Check:
  expression: >-
    not empty(LVOTFN) and empty(LVOTFL)
Outcome:
  Message: "LVOTFN is populated but LVOTFL is empty."
  Message_Folded: "LVOTFL absent or not populated in any record of the dataset, and\
    \ at least one record meets the rest of the condition: LVOTFN is populated but\
    \ LVOTFL is empty."
Source:
  Class: "BASIC DATA STRUCTURE; MEDICAL DEVICE BASIC DATA STRUCTURE; OCCURRENCE DATA\
    \ STRUCTURE; MEDICAL DEVICE OCCURRENCE DATA STRUCTURE"
  Variable_or_Item: "LVOTFL"
  Natural_Language_Rule_Failure_Criteria: "On a given record, LVOTFN is populated\
    \ and LVOTFL is not populated"
  Rule_Failure_Criteria: "LVOTFL is not populated"
  Condition_Failure: "LVOTFN is populated"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.2"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR491"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.3"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR491"
        Version: "2"
      Version: "5.0"
