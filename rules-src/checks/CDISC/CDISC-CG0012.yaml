Core:
  Id: "CDISC-CG0012"
  Status: "Published"
  Version: "1"
Description: "Raise an error when a variable's data type in the dataset does not match\
  \ the data type defined for that variable in the SDTMIG (for variables in a published\
  \ domain) or in the SDTM Model (for variables in a custom domain)."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "ALL"
Check:
  expression: >-
    not empty(var_type("LIBRARY")) and var_type("DATA") != var_type("LIBRARY")
Outcome:
  Message: "Variable data type in the dataset does not match the data type defined\
    \ in the SDTMIG or the SDTM Model."
Source:
  Class: "ALL"
  Domain: "ALL"
  Variable: "GEN"
  Rule: "Variable Type = IG Type for domains in IG, Type = Model Type for custom domains"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "SDTMIG"
    Version: "3.4"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0012"
        Version: "1"
      Version: "2.0"
  - Name: "SDTMIG"
    Version: "3.3"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0012"
        Version: "1"
      Version: "2.0"
  - Name: "SDTMIG"
    Version: "3.2"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0012"
        Version: "1"
      Version: "2.0"
