Core:
  Id: "CDISC-SEND-0238"
  Status: "Published"
  Version: "1"
Description: "Raise an error when more than one Trial Set Code (SETCD) shares the\
  \ same Trial Set description (SET) value; the SET must contain information that\
  \ distinguishes the Trial Sets from each other."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "TX"
Check:
  expression: >-
    not empty(SETCD) and not empty(SET) and has_multiple_values_for(SETCD, SET)
Outcome:
  Message: "More than one SETCD shares the same SET value; SET must distinguish the\
    \ Trial Sets from each other."
Source:
  Class: "TDM"
  Domain: "TX"
  Variable: "SET"
  Plain_Text_Explanation: "The SET variable must contain information which distinguishes\
    \ the Trial Sets from each other."
  Rule: "The SET variable must contain information which distinguishes the Trial Sets\
    \ from each other."
