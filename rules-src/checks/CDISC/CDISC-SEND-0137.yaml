Core:
  Id: "CDISC-SEND-0137"
  Status: "Published"
  Version: "1"
Description: "Raise an error when the EXDOSE variable declared in the EX Define-XML\
  \ document has no Comment."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "EX"
Check:
  expression: >-
    equalsIgnoreCase(varname(), "EXDOSE") and not empty(var_name("DEFINE")) and
    var_has_comment("DEFINE") == false
Outcome:
  Message: "EXDOSE has no comment (explanation of intended or actual dose levels)\
    \ in the Define-XML document."
Source:
  Class: "INT"
  Domain: "EX"
  Variable: "EXDOSE"
  Plain_Text_Explanation: "The Define-XML document contains an explanation of EXDOSE\
    \ values with respect for intended or actual dose levels."
  Rule: "Define-XML document contains entry for EXDOSE (explanation of value as intended\
    \ or actual dose levels)."
