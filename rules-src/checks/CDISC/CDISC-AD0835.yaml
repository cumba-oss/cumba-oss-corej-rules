Core:
  Id: "CDISC-AD0835"
  Status: "Published"
  Version: "1"
Description: "Raise an error when BLQFL is populated and BLQFN is not populated."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "BASIC DATA STRUCTURE"
Requirements:
  Variables:
    All:
    - "BLQFL"
    - "BLQFN"
Check:
  expression: >-
    not empty(BLQFL) and empty(BLQFN)
Outcome:
  Message: "BLQFL is populated, but BLQFN is not populated."
  Output_Variables:
  - "BLQFL"
  - "BLQFN"
Source:
  Class: "BASIC DATA STRUCTURE"
  Subclass: "POPULATION PHARMACOKINETIC ANALYSIS"
  Variable_or_Item: "BLQFN"
  Natural_Language_Rule_Failure_Criteria: "BLQFL is populated and BLQFN is not populated"
  Rule_Failure_Criteria: "BLQFN is not populated"
  Condition_Failure: "BLQFL is populated"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.3"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR835"
        Version: "1"
      Version: "5.0"
