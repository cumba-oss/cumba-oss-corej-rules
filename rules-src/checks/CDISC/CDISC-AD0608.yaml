Core:
  Id: "CDISC-AD0608"
  Status: "Published"
  Version: "1"
Description: "Raise an error when, on a BDS or OCCDS record where APHASEN is not present,\
  \ PHSDTM does not equal any ADSL variable PHwSDTM (for any w) for the same USUBJID."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "BASIC DATA STRUCTURE"
    - "OCCURRENCE DATA STRUCTURE"
Requirements:
  Variables:
    All:
    - "USUBJID"
    - "PHSDTM"
    All_Or_None:
    - - "USUBJID"
      - "ADSL.USUBJID"
Match_Datasets:
- Name: "ADSL"
  Keys:
  - "USUBJID"
Check:
  expression: >-
    not var_exists("APHASEN") and not empty(PHSDTM) and PHSDTM not in
    colref(find_vars("ADSL.PHwSDTM"))
Outcome:
  Message: "On a given record, APHASEN is not present and the value of PHSDTM does\
    \ not equal any PHwSDTM variable"
Source:
  Class: "ALL"
  Variable_or_Item: "PHSDTM"
  Natural_Language_Rule_Failure_Criteria: "On a given record, APHASEN is not present\
    \ and the value of PHSDTM is not equal to the value of at least one PHwSDTM variable"
  Rule_Failure_Criteria: "On a given record, APHASEN is not present and the value\
    \ of PHSDTM is not equal to the value of at least one PHwSDTM variable"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.2"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR608"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.3"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR608"
        Version: "1"
      Version: "5.0"
