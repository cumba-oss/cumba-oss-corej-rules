Core:
  Id: "CDISC-SEND-0286"
  Status: "Published"
  Version: "1"
Description: "Raise an error when a RELREC record that represents a record-to-record\
  \ relationship (IDVARVAL is populated) fails to populate USUBJID or POOLID, or populates\
  \ RELTYPE, which must be empty for a record-to-record relationship."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "RELREC"
Check:
  expression: >-
    not empty(IDVARVAL) and (empty(USUBJID) and empty(POOLID) or not empty(RELTYPE))
Outcome:
  Message: "A RELREC record with IDVARVAL populated (a record-to-record relationship)\
    \ does not populate USUBJID or POOLID, or populates RELTYPE which must be empty."
  Message_Folded: "POOLID and USUBJID absent or not populated in any record of the\
    \ dataset, and at least one record meets the rest of the condition: A RELREC record\
    \ with IDVARVAL populated (a record-to-record relationship) does not populate\
    \ USUBJID or POOLID, or populates RELTYPE which must be empty."
Source:
  Class: "REL"
  Domain: "RELREC"
  Variable: "RELTYPE, USUBJID, POOLID, IDVARVAL"
  Plain_Text_Explanation: "If a record is part of a record-to-record relationship,\
    \ either USUBJID or POOLID is populated,  IDVARVAL is populated, and the variable\
    \ RELTYPE is null."
  Condition: "Record is part of a record-to-record relationship"
  Rule: "(USUBJID OR POOLID is ^= null) AND IDVARVAL ^= null AND RELTYPE = null"
