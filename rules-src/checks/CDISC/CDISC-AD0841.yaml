Core:
  Id: "CDISC-AD0841"
  Status: "Published"
  Version: "1"
Description: "Raise an error when ALQFN is populated and ALQFL is not populated."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "BASIC DATA STRUCTURE"
Requirements:
  Variables:
    All:
    - "ALQFL"
    - "ALQFN"
Check:
  expression: >-
    not empty(ALQFN) and empty(ALQFL)
Outcome:
  Message: "ALQFN is populated, but ALQFL is not populated."
Source:
  Class: "BASIC DATA STRUCTURE"
  Subclass: "POPULATION PHARMACOKINETIC ANALYSIS"
  Variable_or_Item: "ALQFL"
  Natural_Language_Rule_Failure_Criteria: "ALQFN is populated and ALQFL is not populated"
  Rule_Failure_Criteria: "ALQFL is not populated"
  Condition_Failure: "ALQFN is populated"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.3"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
