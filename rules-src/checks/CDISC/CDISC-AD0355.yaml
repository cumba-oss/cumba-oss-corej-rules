Core:
  Id: "CDISC-AD0355"
  Status: "Published"
  Version: "1"
Description: "Raise an error when REGIONy has more than one value for a given value\
  \ of REGIONyN, considering only records where both variables are populated"
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "SUBJECT LEVEL ANALYSIS DATASET"
Check:
  expression: >-
    not empty(REGIONy) and not empty(REGIONyN) and has_multiple_values_for(REGIONy, REGIONyN)
Outcome:
  Message: "REGIONy has more than one value for the same value of REGIONyN, on the\
    \ records where both variables are populated."
  Output_Variables:
  - "REGIONy"
  - "REGIONyN"
wildcards:
  "y":
    min: 1
    max: 99
Source:
  Class: "SUBJECT LEVEL ANALYSIS DATASET"
  Variable_or_Item: "REGIONy where y is an integer [1-99, not zero-padded]"
  Natural_Language_Rule_Failure_Criteria: "There is more than one value of REGIONy\
    \ for a given value of REGIONyN, considering only those rows on which both variables\
    \ are populated"
  Rule_Failure_Criteria: "There is more than one value of REGIONy for a given value\
    \ of REGIONyN"
  Condition_Failure: "On rows where both REGIONy and REGIONyN are both populated."
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.1"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR355"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.2"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR355"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.3"
    References:
