Core:
  Id: "CDISC-AD0743"
  Status: "Published"
  Version: "1"
Description: "Raise an error when, within a given value of PARAMCD, there is more\
  \ than one value of AVAL for a given value of AVALC, considering only rows on which\
  \ both variables are populated"
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "BASIC DATA STRUCTURE"
Check:
  expression: >-
    not empty(AVAL) and not empty(AVALC) and has_multiple_values_for(AVAL, AVALC, within=PARAMCD)
Outcome:
  Message: "AVAL has more than one value for this AVALC within this PARAMCD, among\
    \ rows where both are populated"
Source:
  Class: "BASIC DATA STRUCTURE; MEDICAL DEVICE BASIC DATA STRUCTURE"
  Variable_or_Item: "AVAL"
  Natural_Language_Rule_Failure_Criteria: "Within a given value of PARAMCD, there\
    \ is more than one value of AVAL for a given value of AVALC, considering only\
    \ those rows on which both variables are populated"
  Rule_Failure_Criteria: "Within a given value of PARAMCD, there is more than one\
    \ value of AVAL for a given value of AVALC"
  Condition_Failure: "On rows where AVAL and AVALC are both populated"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.1"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR743"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
