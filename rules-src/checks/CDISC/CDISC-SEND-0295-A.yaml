Core:
  Id: "CDISC-SEND-0295-A"
  Status: "Published"
  Version: "1"
Description: "Raise an error when the assessment-interval end (--ENINT) variable is\
  \ populated but the start (--STINT) variable is empty; both must be populated together\
  \ or both be empty."
Executability: "Fully Executable"
Scope:
  Classes:
    Include:
    - "FINDINGS"
Requirements:
  Variables:
    All:
    - "--STINT"
    - "--ENINT"
Check:
  expression: >-
    empty(--STINT) and not empty(--ENINT)
Outcome:
  Message: "--ENINT is populated but --STINT is empty; both must be populated together\
    \ or both empty."
Source_Proposed:
  Sheet_Issue: "#217"
  Class: "FND"
  Domain: "ALL"
  Variable: "--STINT"
  Plain_Text_Explanation: "--STINT is populated when --ENINT is populated."
  Condition: "--ENINT ^= null"
  Rule: "--STINT ^= null"
Source:
  Class: "FND"
  Domain: "ALL"
  Variable: "--STINT, --ENINT"
  Plain_Text_Explanation: "Both --STINT and --ENINT must be populated if one is populated\
    \ or both --STINT and --ENINT must be null."
  Condition: "--STINT ^= null  OR --ENINT ^= null"
  Rule: "--STINT ^= null  AND --ENINT ^= null"
