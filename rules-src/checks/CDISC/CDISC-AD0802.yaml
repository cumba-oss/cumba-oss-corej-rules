Core:
  Id: "CDISC-AD0802"
  Status: "Published"
  Version: "1"
Description: "Raise an error when, within a dataset, there is more than one value\
  \ of STUDYIDN for a given value of STUDYID, considering only records where both\
  \ variables are populated"
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "BASIC DATA STRUCTURE"
Check:
  expression: >-
    not empty(STUDYID) and not empty(STUDYIDN) and has_multiple_values_for(STUDYIDN, STUDYID)
Outcome:
  Message: "Within this dataset, more than one value of STUDYIDN is present for the\
    \ same populated value of STUDYID"
Source:
  Class: "BASIC DATA STRUCTURE"
  Subclass: "POPULATION PHARMACOKINETIC ANALYSIS"
  Variable_or_Item: "STUDYIDN"
  Natural_Language_Rule_Failure_Criteria: "Within a dataset, there is more than one\
    \ value of STUDYIDN for a given value of STUDYID, considering only those rows\
    \ on which both variables are populated."
  Rule_Failure_Criteria: "Within a dataset, there is more than one value of STUDYIDN\
    \ for a given value of STUDYID"
  Condition_Failure: "On rows where both STUDYIDN and STUDYID are both populated"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.3"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR802"
        Version: "1"
      Version: "5.0"
