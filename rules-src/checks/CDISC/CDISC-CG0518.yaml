Core:
  Id: "CDISC-CG0518"
  Status: "Published"
  Version: "1"
Description: "Raise an error when, for a study that does not use multi-stage Arm assignments,\
  \ the Description of Planned Arm (ARM) is populated but its value is not a value\
  \ of ARM in the Trial Arms (TA) dataset."
Executability: "Partially Executable - Possible Overreporting"
Scope:
  Domains:
    Include:
    - "DM"
Bindings:
- name: "$ta_arm"
  expression: "distinct(ARM, domain=\"TA\")"
Check:
  expression: >-
    not empty(ACTARM) and not empty(ARM) and ARM not in $ta_arm
Outcome:
  Message: "ARM is populated but is not a value of ARM in the Trial Arms (TA) dataset."
  Output_Variables:
  - "ARM"
  - "ACTARM"
  - "$ta_arm"
Source:
  Class: "SPC"
  Domain: "DM"
  Variable: "ARM"
  Condition: "Study does not use multi-stage arm assignments and ACTARM ^= null"
  Rule: "ARM in TA.ARM"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "SDTMIG"
    Version: "3.4"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0518"
        Version: "1"
      Version: "2.0"
  - Name: "SDTMIG"
    Version: "3.3"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0518"
        Version: "1"
      Version: "2.0"
