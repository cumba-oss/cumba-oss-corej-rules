Core:
  Id: "CDISC-AD0606"
  Status: "Published"
  Version: "1"
Description: "Raise an error when, on a BDS or OCCDS record where APHASEN is not present,\
  \ PHSTM does not equal any ADSL variable PHwSTM (for any w) for the same USUBJID."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "BASIC DATA STRUCTURE"
    - "OCCURRENCE DATA STRUCTURE"
Requirements:
  Variables:
    All:
    - "USUBJID"
    - "PHSTM"
    All_Or_None:
    - - "USUBJID"
      - "ADSL.USUBJID"
Match_Datasets:
- Name: "ADSL"
  Keys:
  - "USUBJID"
Check:
  expression: >-
    not var_exists("APHASEN") and not empty(PHSTM) and PHSTM not in colref(find_vars("ADSL.PHwSTM"))
Outcome:
  Message: "On a given record, APHASEN is not present and the value of PHSTM is not\
    \ equal to the value of at least one PHwSTM variable"
Source:
  Class: "ALL"
  Variable_or_Item: "PHSTM"
  Natural_Language_Rule_Failure_Criteria: "On a given record, APHASEN is not present\
    \ and the value of PHSTM is not equal to the value of at least one PHwSTM variable"
  Rule_Failure_Criteria: "On a given record, APHASEN is not present and the value\
    \ of PHSTM is not equal to the value of at least one PHwSTM variable"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.2"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR606"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.3"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR606"
        Version: "1"
      Version: "5.0"
