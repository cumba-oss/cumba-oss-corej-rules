Core:
  Id: "CDISC-CG0157"
  Status: "Published"
  Version: "1"
Description: "Raise an error when Related Subject or Pool Identifier (RSUBJID) is\
  \ populated, does not match a Pool Identifier (POOLID) in the Pool Definition (POOLDEF)\
  \ dataset, and so describes a relationship to a study subject, but does not match\
  \ a Unique Subject Identifier (USUBJID) in the Demographics (DM) dataset."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "AP--"
    - "APRELSUB"
Requirements:
  Variables:
    All:
    - "RSUBJID"
Bindings:
- name: "$pooldef_poolid"
  expression: "distinct(POOLID, domain=\"POOLDEF\")"
- name: "$dm_usubjid"
  expression: "distinct(USUBJID, domain=\"DM\")"
Check:
  expression: >-
    not empty(RSUBJID) and RSUBJID not in $pooldef_poolid and RSUBJID not in $dm_usubjid
Outcome:
  Message: "RSUBJID is populated and does not identify a pool in POOLDEF, but does\
    \ not match a USUBJID in DM."
  Output_Variables:
  - "$pooldef_poolid"
  - "$dm_usubjid"
Source:
  Class: "AP"
  Domain: "ALL"
  Variable: "RSUBJID"
  Condition: "Relationship described is to a study subject"
  Rule: "RSUBJID in DM.USUBJID"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "SDTMIG"
    Version: "3.4"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0157"
        Version: "1"
      Version: "2.0"
  - Name: "SDTMIG"
    Version: "3.3"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0157"
        Version: "1"
      Version: "2.0"
  - Name: "SDTMIG"
    Version: "3.2"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0157"
        Version: "1"
      Version: "2.0"
