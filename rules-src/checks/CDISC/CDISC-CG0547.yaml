Core:
  Id: "CDISC-CG0547"
  Status: "Published"
  Version: "1"
Description: "Raise an error when the Start Date/Time of Milestone (SMSTDTC) is not\
  \ populated."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "SM"
Requirements:
  Variables:
    All:
    - "SMSTDTC"
Check:
  expression: >-
    empty(SMSTDTC)
Outcome:
  Message: "SMSTDTC is empty."
  Message_Folded: "SMSTDTC not populated in any record of the dataset: SMSTDTC is\
    \ empty."
Source:
  Class: "SPC"
  Domain: "SM"
  Variable: "SMSTDTC"
  Rule: "SMSTDTC ^= null"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "SDTMIG"
    Version: "3.4"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0547"
        Version: "1"
      Version: "2.0"
  - Name: "SDTMIG"
    Version: "3.3"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0547"
        Version: "1"
      Version: "2.0"
