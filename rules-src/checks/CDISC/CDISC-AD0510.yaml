Core:
  Id: "CDISC-AD0510"
  Status: "Published"
  Version: "1"
Description: "Raise an error when a variable's name ends in STM and is not a standard\
  \ library variable, and its label does not contain the phrase of the ADaM implementation\
  \ guide's *STM naming fragment ('Start Time')."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "ALL"
Check:
  expression: >-
    ends_with(upper(varname()), "STM") and not empty(label_template("LIBRARY", stem="*STM")) and not
    matches_label_template(var_label("DATA"), label_template("LIBRARY", stem="*STM"))
Outcome:
  Message: "A variable ending in STM does not contain 'Start Time' in the label."
  Output_Variables:
  - "variable_label"
  - "library_variable_label_template"
Source:
  Class: "ALL"
  Variable_or_Item: "*STM"
  Natural_Language_Rule_Failure_Criteria: "A variable ending in STM must contain \"\
    Start Time\" in the label"
  Rule_Failure_Criteria: "*STM does not contain \"Start Time\" in the label"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.1"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR510"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.2"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR510"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.3"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR510"
        Version: "1"
      Version: "5.0"
