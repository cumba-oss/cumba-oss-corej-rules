Core:
  Id: "CDISC-AD0053"
  Status: "Published"
  Version: "1"
Description: "Raise an error when a record's USUBJID does not have a matching record\
  \ in SDTM.DM"
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "ALL"
Requirements:
  Variables:
    All:
    - "DM.USUBJID"
    - "STUDYID"
    - "USUBJID"
    All_Or_None:
    - - "STUDYID"
      - "DM.STUDYID"
    - - "USUBJID"
      - "DM.USUBJID"
Match_Datasets:
- Name: "DM"
  Keys:
  - "STUDYID"
  - "USUBJID"
  Cardinality: "n:1"
  Join_Type: "left"
Check:
  expression: >-
    not DM._matched_
Outcome:
  Message: "This record's USUBJID value was not found in SDTM.DM"
  Output_Variables:
  - "DM.USUBJID"
Source:
  Class: "ALL"
  Variable_or_Item: "USUBJID"
  Natural_Language_Rule_Failure_Criteria: "The value of USUBJID is not present in\
    \ SDTM.DM"
  Rule_Failure_Criteria: "The value is not present in SDTM.DM"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.0"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR53"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.1"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR53"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.2"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR53"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.3"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR53"
        Version: "1"
      Version: "5.0"
