Core:
  Id: "CDISC-SEND-0100"
  Status: "Published"
  Version: "1"
Description: "Raise an error when the RFSTDTC variable in the DM dataset has no definition\
  \ in the Define-XML document."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "DM"
Check:
  expression: >-
    equalsIgnoreCase(varname(), "RFSTDTC") and empty(var_name("DEFINE"))
Outcome:
  Message: "RFSTDTC is not defined in the Define-XML document."
  Output_Variables:
  - "define_variable_name"
Source:
  Class: "SPC"
  Domain: "DM"
  Variable: "RFSTDTC"
  Plain_Text_Explanation: "There must be an explanation in the Define-XML document\
    \ that explains how RFSTDTC was populated."
  Rule: "RFSTDTC definition must be in the Define-XML document"
