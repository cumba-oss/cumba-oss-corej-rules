Core:
  Id: "CDISC-SEND-0403"
  Status: "Published"
  Version: "1"
Description: "Raise an error when, within a reproductive phase (RPHASE), the observation\
  \ end date (--ENDTC) is a complete date and the reproductive-phase end day (--RPENDY)\
  \ is populated but does not equal the date portion of --ENDTC minus the date portion\
  \ of the earliest phase start date (earliest SJSTDTC within the subject's RPHASE)\
  \ plus RPRFDY (the path's first phase day reference, read from TP through DM.RPATHCD)."
Executability: "Fully Executable"
Scope:
  Classes:
    Include:
    - "SPECIAL PURPOSE"
    - "FINDINGS"
    - "EVENTS"
    - "INTERVENTIONS"
Requirements:
  Variables:
    All:
    - "--ENDTC"
    - "--RPENDY"
    - "USUBJID"
    - "SJ.SJSTDTC"
    - "SJ.USUBJID"
    - "DM.RPATHCD"
    - "TP.RPATHCD"
    - "TP.RPRFDY:N"
    All_Or_None:
    - - "USUBJID"
      - "DM.USUBJID"
    - - "RPHASE"
      - "SJ.RPHASE"
      - "TP.RPHASE"
Match_Datasets:
- Keys:
  - "USUBJID"
  Name: "DM"
Bindings:
- name: "$sj_stages"
  expression: "record_count(domain=\"SJ\", group=[USUBJID, RPHASE])"
- name: "$rprfdy"
  expression: "read_value(RPRFDY, domain=\"TP\", group=[DM.RPATHCD, RPHASE], mode=\"\
    MAX\")"
- name: "$rpref_day"
  expression: "date_diff_days(--ENDTC, min_date(SJSTDTC, domain=\"SJ\", group=[USUBJID,\
    \ RPHASE])) + $rprfdy"
Check:
  expression: >-
    is_complete_date(--ENDTC) and not empty(--RPENDY) and $sj_stages > 0 and not empty($rprfdy) and
    --RPENDY != $rpref_day
Outcome:
  Message: "--RPENDY does not equal the reproductive-phase end day derived from --ENDTC,\
    \ the earliest SJSTDTC within the RPHASE, plus RPRFDY (the path's first phase\
    \ day reference, from TP through DM.RPATHCD)."
  Output_Variables:
  - "$rpref_day"
  - "$rprfdy"
  - "--ENDTC"
  - "--RPENDY"
  - "DM.RPATHCD"
Source:
  Class: "SPC, FND, EVT, INT"
  Domain: "All"
  Variable: "--RPENDY"
  Plain_Text_Explanation: "Within a repro phase, if --ENDTC is populated and the latest\
    \ SJENDTC within the repro phase in SJ is populated then --RPENDY should be populated\
    \ using the actual repro phase day of observation end algorithm"
  Condition: "Date portion exists for --ENDTC and SJENDTC within the RPHASE and --RPENDY\
    \ is present"
  Rule: "--RPENDY=(date portion of --ENDTC) - (date portion of latest SJENDTC) + RPRFDY"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "SENDIG-DART"
    Version: "1.2"
    References:
    - Origin: "SEND Conformance Rules"
      Rule_Identifier:
        Id: "SEND403"
        Version: "1"
      Version: "5.0"
  - Name: "SENDIG-DART"
    Version: "1.1"
    References:
    - Origin: "SEND Conformance Rules"
      Rule_Identifier:
        Id: "SEND403"
        Version: "1"
      Version: "5.0"
