Core:
  Id: "CDISC-SEND-0403"
  Status: "Published"
  Version: "1"
Description: "Raise an error when, within a reproductive phase (RPHASE), the observation\
  \ end date (--ENDTC) is a complete date and the reproductive-phase end day (--RPENDY)\
  \ is populated but does not equal the date portion of --ENDTC minus the date portion\
  \ of the earliest phase start date (earliest SJSTDTC within the subject's RPHASE)."
Executability: "Partially Executable"
ExecutabilityHint:
  Category: "partially executable"
  Detail: "The RPRFDY offset of the sheet's algorithm is NOT applied: RPRFDY is a\
    \ TP (Trial Paths) variable, reached only through DM.RPATHCD, and the engine cannot\
    \ follow that two-hop join yet (owner ruling EC-47 = (C), 2026-09-29; the join\
    \ is PLAN-rprfdy-offset-tp-join). The reproductive-phase day is derived as date(--ENDTC)\
    \ minus the earliest SJSTDTC within the subject's RPHASE, which is exact for a\
    \ path whose RPRFDY is 0 and off by one day for a path whose RPRFDY is 1 — such\
    \ a path is then over- and under-reported by one day in both directions."
Scope:
  Classes:
    Include:
    - "SPECIAL PURPOSE"
    - "FINDINGS"
    - "EVENTS"
    - "INTERVENTIONS"
Requirements:
  Variables:
    All:
    - "--ENDTC"
    - "--RPENDY"
    - "SJ.SJSTDTC"
    - "USUBJID"
    All_Or_None:
    - - "USUBJID"
      - "SJ.USUBJID"
    - - "RPHASE"
      - "SJ.RPHASE"
Match_Datasets:
- Keys:
  - "USUBJID"
  - "RPHASE"
  Name: "SJ"
Bindings:
- name: "$rpref_day"
  expression: "date_diff_days(--ENDTC, min_date(SJSTDTC, domain=\"SJ\", group=[USUBJID,\
    \ RPHASE]))"
Check:
  expression: >-
    is_complete_date(--ENDTC) and not empty(--RPENDY) and --RPENDY != $rpref_day
Outcome:
  Message: "--RPENDY does not equal the reproductive-phase end day derived from --ENDTC,\
    \ the earliest SJSTDTC within the RPHASE."
  Output_Variables:
  - "$rpref_day"
  - "--ENDTC"
  - "--RPENDY"
Source:
  Class: "SPC, FND, EVT, INT"
  Domain: "All"
  Variable: "--RPENDY"
  Plain_Text_Explanation: "Within a repro phase, if --ENDTC is populated and the latest\
    \ SJENDTC within the repro phase in SJ is populated then --RPENDY should be populated\
    \ using the actual repro phase day of observation end algorithm"
  Condition: "Date portion exists for --ENDTC and SJENDTC within the RPHASE and --RPENDY\
    \ is present"
  Rule: "--RPENDY=(date portion of --ENDTC) - (date portion of latest SJENDTC) + RPRFDY"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "SENDIG-DART"
    Version: "1.2"
    References:
    - Origin: "SEND Conformance Rules"
      Rule_Identifier:
        Id: "SEND403"
        Version: "1"
      Version: "5.0"
  - Name: "SENDIG-DART"
    Version: "1.1"
    References:
    - Origin: "SEND Conformance Rules"
      Rule_Identifier:
        Id: "SEND403"
        Version: "1"
      Version: "5.0"
