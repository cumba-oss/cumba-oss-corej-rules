Core:
  Id: "CDISC-AD0581"
  Status: "Published"
  Version: "2"
Description: "Raise an error when none of TRTP, TRTPGy, TRTA, TRTAGy, ARM, ACTARM,\
  \ TRTxxP, TRTxxA, TRTSEQP, TRTSEQA, TRxxPGy, TRxxAGy, TSEQPGy, or TSEQAGy are present,\
  \ where xx is an integer [01-99, zero-padded] and y is an integer [1-99, not zero-padded]."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "BASIC DATA STRUCTURE"
    - "MEDICAL DEVICE BASIC DATA STRUCTURE"
Check:
  expression: >-
    not var_exists("TRTP") and not var_exists("TRTA") and not var_exists("ARM") and not
    var_exists("ACTARM") and not var_exists("TRTSEQP") and not var_exists("TRTSEQA") and
    count(find_vars("TRTPGy")) == 0 and count(find_vars("TRTAGy")) == 0 and
    count(find_vars("TRTxxP")) == 0 and count(find_vars("TRTxxA")) == 0 and
    count(find_vars("TRxxPGy")) == 0 and count(find_vars("TRxxAGy")) == 0 and
    count(find_vars("TSEQPGy")) == 0 and count(find_vars("TSEQAGy")) == 0
Outcome:
  Message: "None of TRTP, TRTPGy, TRTA, TRTAGy, ARM, ACTARM, TRTxxP, TRTxxA, TRTSEQP,\
    \ TRTSEQA, TRxxPGy, TRxxAGy, TSEQPGy, or TSEQAGy are present, where xx is an integer\
    \ [01-99, zero-padded] and y is an integer [1-99, not zero-padded]"
  Output_Variables: []
Source:
  Class: "BASIC DATA STRUCTURE; MEDICAL DEVICE BASIC DATA STRUCTURE"
  Natural_Language_Rule_Failure_Criteria: "None of TRTP, TRTPGy, TRTA, and TRTAGy\
    \ are present and none of the character treatment variables in ADSL defined in\
    \ the IG are present"
  Rule_Failure_Criteria: "None of TRTP, TRTPGy, TRTA, TRTAGy, ARM, ACTARM, TRTxxP,\
    \ TRTxxA, TRTSEQP, TRTSEQA, TRxxPGy, TRxxAGy, TSEQPGy, or TSEQAGy are present,\
    \ where xx is an integer [01-99, zero-padded] and y is an integer [1-99, not zero-padded]"
