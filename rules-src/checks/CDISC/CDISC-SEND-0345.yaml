    - Origin: "SEND Conformance Rules"
      Rule_Identifier:
        Id: "SEND345"
        Version: "1"
      Version: "5.0"
  - Name: "SENDIG"
    Version: "3.1.1"
    References:
    - Origin: "SEND Conformance Rules"
      Rule_Identifier:
        Id: "SEND345"
        Version: "1"
      Version: "5.0"
  - Name: "SENDIG"
