Core:
  Id: "CDISC-AD0441"
  Status: "Published"
  Version: "2"
Description: "Raise an error when CHGCATy is populated but CHGCATyN is missing"
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "BASIC DATA STRUCTURE"
Requirements:
  Variables:
    All:
    - "CHGCATy"
    - "CHGCATyN"
Check:
  expression: >-
    not empty(CHGCATy) and empty(CHGCATyN)
Outcome:
  Message: "CHGCATy is populated, but CHGCATyN is missing"
  Output_Variables:
  - "CHGCATy"
  - "CHGCATyN"
wildcards:
  "y":
    min: 1
    max: 99
Source:
  Class: "BASIC DATA STRUCTURE; MEDICAL DEVICE BASIC DATA STRUCTURE"
  Variable_or_Item: "CHGCATyN where y is an integer [1-9, not zero-padded]"
  Natural_Language_Rule_Failure_Criteria: "On a given record, CHGCATy is populated\
    \ and CHGCATyN is not populated"
  Rule_Failure_Criteria: "CHGCATyN is not populated"
  Condition_Failure: "CHGCATy is populated"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.2"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR441"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.3"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR441"
        Version: "2"
      Version: "5.0"
