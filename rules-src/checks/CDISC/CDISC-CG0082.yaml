Core:
  Id: "CDISC-CG0082"
  Status: "Published"
  Version: "1"
Description: "Raise an error when --BODSYS is populated but --BDSYCD is empty."
Executability: "Fully Executable"
Scope:
  Classes:
    Include:
    - "EVENTS"
Requirements:
  Variables:
    All:
    - "--BODSYS"
Check:
  expression: >-
    not empty(--BODSYS) and empty(--BDSYCD)
Outcome:
  Message: "--BDSYCD is empty when --BODSYS is populated."
  Message_Folded: "--BDSYCD is absent or empty although --BODSYS is populated."
Source:
  Class: "EVT"
  Domain: "ALL"
  Variable: "--BDSYCD"
  Condition: "--BODSYS ^= null"
  Rule: "--BDSYCD ^= null"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "SDTMIG"
    Version: "3.4"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0082"
        Version: "2"
      Version: "2.0"
  - Name: "SDTMIG"
    Version: "3.3"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0082"
        Version: "2"
      Version: "2.0"
  - Name: "SDTMIG"
    Version: "3.2"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0082"
        Version: "2"
      Version: "2.0"
