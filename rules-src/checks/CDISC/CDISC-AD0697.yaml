Core:
  Id: "CDISC-AD0697"
  Status: "Published"
  Version: "1"
Description: "Raise an error when BASETYPE is not present and, within a given PARAMCD\
  \ for a combination of device and subject, more than one record has ABLFL equal\
  \ to 'Y'."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "MEDICAL DEVICE BASIC DATA STRUCTURE"
Grouping:
  Variables:
  - "USUBJID"
  - "PARAMCD"
  - "SPDEVID"
Bindings:
- name: "$ablfl_y_count"
  expression: "record_count(ABLFL, group=[USUBJID, PARAMCD, SPDEVID], filter=filter(ABLFL=\"\
    Y\"))"
Check:
  expression: >-
    not var_exists("BASETYPE") and $ablfl_y_count > 1
Outcome:
  Message: "BASETYPE is not present, and more than one record has ABLFL equal to 'Y'\
    \ within this PARAMCD, device, and subject combination."
  Output_Variables:
  - "PARAMCD"
  - "ABLFL"
  - "$ablfl_y_count"
Source:
  Class: "MEDICAL DEVICE BASIC DATA STRUCTURE"
  Variable_or_Item: "ABLFL"
  Natural_Language_Rule_Failure_Criteria: "Within a given PARAMCD for a combination\
    \ of device and subject, more than one record has ABLFL equal to Y and BASETYPE\
    \ is not present"
  Rule_Failure_Criteria: "Within a given PARAMCD for a combination of device and subject,\
    \ more than one record has ABLFL equal to Y"
  Condition_Failure: "USUBJID and SPDEVID are present, BASETYPE is not present, and\
    \ PARAMCD is populated"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.3"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR697"
        Version: "1"
      Version: "5.0"
