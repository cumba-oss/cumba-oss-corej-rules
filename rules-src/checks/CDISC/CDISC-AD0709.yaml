Core:
  Id: "CDISC-AD0709"
  Status: "Published"
  Version: "1"
Description: "Raise an error when a variable's label does not match the standard label\
  \ for that variable in the ADaM implementation guide, excluding variable names containing\
  \ the wildcard indexes 'w', 'y', or 'zz' (a name with the index 'xx', such as TRT01P,\
  \ is checked against its resolved label template) and library labels that contain\
  \ an asterisk (*), braces ({...}), or an ellipsis (...) for sponsor-specific text."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "ALL"
Check:
  expression: >-
    var_name("LIBRARY") !~ /[wyz]/ and not empty(var_label("LIBRARY")) and not
    empty(label_template("LIBRARY")) and not contains(var_label("LIBRARY"), "{") and not
    contains(var_label("LIBRARY"), "*") and not contains(var_label("LIBRARY"), "...") and not
    matches_label_template(var_label("DATA"), label_template("LIBRARY"))
Outcome:
  Message: "Variable label does not match the standard label defined in the ADaM implementation\
    \ guide."
  Output_Variables:
  - "variable_label"
  - "library_variable_label"
  - "library_variable_label_template"
Source:
  Class: "ALL"
  Variable_or_Item: "ALL"
  Natural_Language_Rule_Failure_Criteria: "Labels for ADaM variables do not match\
    \ the standard labels for ADaM variables listed in the implementation guide that\
    \ cannot be modified (with the exception of (1) variables whose names contain\
    \ indexes \"w\", “y”, or “zz”; and (2) variable labels with asterisks (*), braces\
    \ ({...}), and ellipses (...) indicated for sponsor appropriate text)"
  Rule_Failure_Criteria: "Variable label does not match the standard label"
  Condition_Failure: "Variable name matches a standard variable defined in the ADaM-IG"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.2"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR709"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.3"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR709"
        Version: "1"
      Version: "5.0"
