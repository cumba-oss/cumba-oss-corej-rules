Core:
  Id: "CDISC-SEND-0262.1"
  Status: "Published"
  Version: "1"
Description: "Raise an error when more than one POOLDEF record exists for the same\
  \ combination of pool (POOLID) and subject (USUBJID); the POOLDEF dataset expects\
  \ one record per subject per pool."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "POOLDEF"
Check:
  expression: >-
    not is_unique_set([POOLID, USUBJID])
Outcome:
  Message: "More than one POOLDEF record exists for the same pool (POOLID) and subject\
    \ (USUBJID)."
Source:
  Class: "REL"
  Domain: "POOLDEF"
  Variable: "ALL"
  Plain_Text_Explanation: "One record per subject per pool, Tabulation."
  Rule: "One record per subject per pool"
