Core:
  Id: "CDISC-AD0470"
  Status: "Published"
  Version: "1"
Description: "Raise an error when STRATwR is populated and STRATwRN is missing on\
  \ the same record."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "SUBJECT LEVEL ANALYSIS DATASET"
Check:
  expression: >-
    not empty(STRATwR) and empty(STRATwRN)
Outcome:
  Message: "STRATwR is populated but STRATwRN is missing."
  Message_Folded: "STRATwRN not populated in any record of the dataset, and at least\
    \ one record meets the rest of the condition: STRATwR is populated but STRATwRN\
    \ is missing."
  Output_Variables:
  - "STRATwR"
  - "STRATwRN"
wildcards:
  w:
    min: 1
    max: 9
Source:
  Class: "SUBJECT LEVEL ANALYSIS DATASET"
  Variable_or_Item: "STRATwRN where w is an integer [1-9, not zero-padded]"
  Natural_Language_Rule_Failure_Criteria: "On a given record, STRATwR is populated\
    \ and STRATwRN is not populated"
  Rule_Failure_Criteria: "STRATwRN is not populated"
  Condition_Failure: "STRATwR is populated"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.2"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR470"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.3"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR470"
        Version: "1"
      Version: "5.0"
