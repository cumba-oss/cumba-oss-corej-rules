Core:
  Id: "CDISC-AD0269"
  Status: "Published"
  Version: "2"
Description: "Raise an error when TRTEMFL is populated and not equal to 'Y'."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "OCCURRENCE DATA STRUCTURE"
    - "MEDICAL DEVICE OCCURRENCE DATA STRUCTURE"
Requirements:
