Core:
  Id: "CDISC-AD0042"
  Status: "Published"
  Version: "1"
Description: "Raise an error when a numeric variable with a suffix of TM does not\
  \ have a time format, excluding ARELTM and variables with a suffix of DTM"
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "ALL"
Check:
  expression: >-
    ends_with(varname(), "TM") and not ends_with(varname(), "DTM") and not
    equalsIgnoreCase(varname(), "ARELTM") and var_type("DATA") == "Num" and var_format("DATA") !~
    /(?i)^(TIME|HHMM|HOUR|MMSS|TOD|E8601TM|IS8601TM|B8601TM|TIMEAMPM|NLTIME|NLTIMAP)/
Outcome:
  Message: "A numeric variable with a suffix of TM has a format that is not a time\
    \ format, excluding ARELTM and variables with a suffix of DTM"
  Output_Variables:
  - "variable_name"
  - "variable_data_type"
  - "variable_format"
Source:
  Class: "ALL"
  Variable_or_Item: "*TM"
  Natural_Language_Rule_Failure_Criteria: "A numeric variable with a suffix of TM\
    \ does not have a time format, excluding ARELTM and variables with a suffix of\
    \ DTM"
  Rule_Failure_Criteria: "Variable does not have a time format"
  Condition_Failure: "Numeric variable with a suffix of TM, excluding ARELTM and variables\
    \ with a suffix of DTM"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.0"
    References:
    - Origin: "ADaM Conformance Rules"
