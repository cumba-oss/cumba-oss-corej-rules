Core:
  Id: "CDISC-AD0795"
  Status: "Published"
  Version: "1"
Description: "Raise an error when PROJID is populated and PROJIDN is not populated"
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "BASIC DATA STRUCTURE"
Check:
  expression: >-
    not empty(PROJID) and empty(PROJIDN)
Outcome:
  Message: "PROJID is populated, but PROJIDN is not populated."
  Message_Folded: "PROJIDN absent or not populated in any record of the dataset, and\
    \ at least one record meets the rest of the condition: PROJID is populated, but\
    \ PROJIDN is not populated."
Source:
  Class: "BASIC DATA STRUCTURE"
  Subclass: "POPULATION PHARMACOKINETIC ANALYSIS"
  Variable_or_Item: "PROJIDN"
  Natural_Language_Rule_Failure_Criteria: "PROJID is populated and PROJIDN is not\
    \ populated"
  Rule_Failure_Criteria: "PROJIDN is not populated"
  Condition_Failure: "PROJID is populated"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.3"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR795"
        Version: "1"
      Version: "5.0"
