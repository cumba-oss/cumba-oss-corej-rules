Core:
  Id: "CDISC-SEND-9441"
  Status: "Published"
  Version: "1"
Description: "Raise an error when neither the Rule for End of Repro Stage (TTENRL)\
  \ nor the Planned Duration of Repro Stage (TTDUR) variable is present in the Trial\
  \ Repro Stages (TT) dataset; at least one of the two must be populated for each\
  \ Repro Stage."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "TT"
Check:
  expression: >-
    not var_exists("TTENRL") and not var_exists("TTDUR")
Outcome:
  Message: "Neither the TTENRL nor the TTDUR variable is present in the dataset."
Source_Proposed:
  Sheet_Issue: "#213"
  Class: "TDM"
  Domain: "TT"
  Variable: "TTENRL, TTDUR"
  Plain_Text_Explanation: "Either TTENRL or TTDUR (or both) must be populated for\
    \ each Repro Stage, which no record can satisfy when neither variable is present\
    \ in the dataset"
  Condition: ""
  Rule: "at least one of the TTENRL and TTDUR variables is present in the dataset"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "SENDIG-DART"
    Version: "1.2"
  - Name: "SENDIG-DART"
    Version: "1.1"
