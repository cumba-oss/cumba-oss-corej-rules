Core:
  Id: "CDISC-AD0407"
  Status: "Published"
  Version: "2"
Description: "Raise an error when ABLFN is populated and ABLFL is not populated."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "BASIC DATA STRUCTURE"
Requirements:
  Variables:
    All:
    - "ABLFL"
    - "ABLFN"
Check:
  expression: >-
    not empty(ABLFN) and empty(ABLFL)
Outcome:
  Message: "ABLFN is populated but ABLFL is not populated."
Source:
  Class: "BASIC DATA STRUCTURE; MEDICAL DEVICE BASIC DATA STRUCTURE"
  Variable_or_Item: "ABLFL"
  Natural_Language_Rule_Failure_Criteria: "On a given record, ABLFN is populated and\
    \ ABLFL is not populated"
  Rule_Failure_Criteria: "ABLFL is not populated"
  Condition_Failure: "ABLFN is populated"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.2"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR407"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.3"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR407"
        Version: "2"
      Version: "5.0"
