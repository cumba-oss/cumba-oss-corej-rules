Core:
  Id: "CDISC-AD0587"
  Status: "Published"
  Version: "2"
Description: "Raise an error when, within a given value of PARAMCD, there is more\
  \ than one value of PBCHGCAy for a given value of PBCHG, considering only rows on\
  \ which both variables are populated, where y is an integer [1-99, not zero-padded]."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "BASIC DATA STRUCTURE"
Check:
  expression: >-
    not empty(PBCHGCAy) and not empty(PBCHG) and has_multiple_values_for(PBCHGCAy, PBCHG,
    within=PARAMCD)
Outcome:
  Message: "Within this PARAMCD, PBCHGCAy has more than one value for a given value\
    \ of PBCHG, considering only rows on which both variables are populated."
wildcards:
  "y":
    min: 1
    max: 99
Source_Proposed:
  Sheet_Issue: "#64,#155"
  Class: "BASIC DATA STRUCTURE; MEDICAL DEVICE BASIC DATA STRUCTURE"
  Subclass: ""
  SEND_SDTM_Domain: ""
  Variable_or_Item: "PBCHGCAy where y is an integer [1-99, not zero-padded]"
  Natural_Language_Rule_Failure_Criteria: "Within a given value of PARAMCD, there\
    \ is more than one value of PBCHGCAy for a given value of PBCHG and y, where y\
    \ is a single-digit integer [1-9]"
  Rule_Failure_Criteria: "Within a given value of PARAMCD, there is more than one\
    \ value of PBCHGCAy for a given value of PBCHG"
  Condition_Failure: ""
Source:
  Class: "BASIC DATA STRUCTURE; MEDICAL DEVICE BASIC DATA STRUCTURE"
  Variable_or_Item: "PBCHGCAy where y is an integer [1-9, not zero-padded]"
  Natural_Language_Rule_Failure_Criteria: "Within a given value of PARAMCD, there\
    \ is more than one value of PBCHGCAy for a given value of PBCHG and y, where y\
    \ is a single-digit integer [1-9]"
  Rule_Failure_Criteria: "Within a given value of PARAMCD, there is more than one\
    \ value of PBCHGCAy for a given value of PBCHGy"
