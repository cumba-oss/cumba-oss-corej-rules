Core:
  Id: "CDISC-CG0603"
  Status: "Published"
  Version: "1"
Description: "Raise an error when a Findings About record has a parent record whose\
  \ --DECOD is populated and FAOBJ does not equal the parent record's --DECOD value."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "FA"
Requirements:
  Variables:
    All:
    - "FAOBJ"
Match_Datasets:
- Name: "RELREC"
Check:
  expression: >-
    AE._matched_ and not empty(AE.AEDECOD) and FAOBJ != AE.AEDECOD or BE._matched_ and not
    empty(BE.BEDECOD) and FAOBJ != BE.BEDECOD or CE._matched_ and not empty(CE.CEDECOD) and FAOBJ !=
    CE.CEDECOD or DS._matched_ and not empty(DS.DSDECOD) and FAOBJ != DS.DSDECOD or DV._matched_ and
    not empty(DV.DVDECOD) and FAOBJ != DV.DVDECOD or HO._matched_ and not empty(HO.HODECOD) and
    FAOBJ != HO.HODECOD or MH._matched_ and not empty(MH.MHDECOD) and FAOBJ != MH.MHDECOD or
    AG._matched_ and not empty(AG.AGDECOD) and FAOBJ != AG.AGDECOD or CM._matched_ and not
    empty(CM.CMDECOD) and FAOBJ != CM.CMDECOD or EC._matched_ and not empty(EC.ECDECOD) and FAOBJ !=
    EC.ECDECOD or EX._matched_ and not empty(EX.EXDECOD) and FAOBJ != EX.EXDECOD or ML._matched_ and
    not empty(ML.MLDECOD) and FAOBJ != ML.MLDECOD or PR._matched_ and not empty(PR.PRDECOD) and
    FAOBJ != PR.PRDECOD or SU._matched_ and not empty(SU.SUDECOD) and FAOBJ != SU.SUDECOD
Outcome:
  Message: "The Findings About record has a parent record with a populated --DECOD,\
    \ but FAOBJ does not equal the parent record's --DECOD value."
Source:
  Class: "FND"
  Domain: "FA"
  Variable: "--OBJ"
  Condition: "Parent record exists and DECOD ^= null"
  Rule: "--OBJ = --DECOD"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "SDTMIG"
    Version: "3.4"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0603"
        Version: "1"
      Version: "2.0"
