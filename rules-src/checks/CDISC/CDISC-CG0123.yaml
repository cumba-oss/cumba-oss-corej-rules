Core:
  Id: "CDISC-CG0123"
  Status: "Published"
  Version: "1"
Description: "Raise an error when the value of Actual Arm Code (ACTARMCD) is more\
  \ than 20 characters in length."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "DM"
Check:
  expression: >-
    len(ACTARMCD) > 20
Outcome:
  Message: "ACTARMCD has a length greater than 20 characters."
  Output_Variables:
  - "ACTARMCD"
Source:
  Class: "SPC"
  Domain: "DM"
  Variable: "ACTARMCD"
  Rule: "ACTARMCD value length <= 20"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "SDTMIG"
    Version: "3.2"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0123"
        Version: "1"
      Version: "2.0"
  - Name: "SDTMIG"
    Version: "3.3"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0123"
        Version: "1"
      Version: "2.0"
  - Name: "SDTMIG"
    Version: "3.4"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0123"
        Version: "1"
      Version: "2.0"
