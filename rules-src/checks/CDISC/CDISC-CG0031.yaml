Core:
  Id: "CDISC-CG0031"
  Status: "Published"
  Version: "1"
Description: "Raise an error when VISIT is populated with a value that does not match\
  \ any VISIT value defined in the Trial Visits (TV) dataset, for a visit the Subject\
  \ Visits (SV) dataset flags as pre-specified (SVPRESP equals 'Y')."
Executability: "Partially Executable - Possible Overreporting"
Scope:
  Domains:
    Exclude:
    - "TV"
Requirements:
  Variables:
    All:
    - "VISIT"
    - "VISITNUM"
    - "TV.VISIT"
  Datasets:
  - "SV"
Match_Datasets:
- Join_Type: "left"
  Keys:
  - "USUBJID"
  - "VISITNUM"
  Name: "SV"
Bindings:
- name: "$tv_visit"
  expression: "distinct(VISIT, domain=\"TV\")"
Check:
  expression: >-
    (SV._matched_ and SV.SVPRESP == "Y" or SV._matched_ and not var_exists(SV.SVPRESP) and
    empty(SV.SVUPDES) and not contains(upper(VISIT), "UNSCHEDUL") and not contains(upper(VISIT),
    "UNPLAN") or not SV._matched_ and not contains(upper(VISIT), "UNSCHEDUL") and not
    contains(upper(VISIT), "UNPLAN")) and not empty(VISIT) and VISIT not in $tv_visit
Outcome:
  Message: "VISIT value for a visit determined to be planned — SV.SVPRESP is \"Y\"\
    , or SV carries no SVPRESP column and the visit has no unplanned-visit description\
    \ and no unscheduled/unplanned name marker — does not match any VISIT value in\
    \ the TV dataset."
  Output_Variables:
  - "VISITNUM"
  - "VISIT"
  - "SV.SVPRESP"
  - "SV.SVUPDES"
  - "$tv_visit"
Source:
  Class: "ALL"
  Domain: "ALL"
  Variable: "VISIT"
  Condition: "VISIT ^= null and is planned"
  Rule: "VISIT in TV.VISIT"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "SDTMIG"
    Version: "3.4"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0031"
        Version: "1"
      Version: "2.0"
  - Name: "SDTMIG"
    Version: "3.3"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0031"
        Version: "1"
      Version: "2.0"
  - Name: "SDTMIG"
    Version: "3.2"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0031"
        Version: "1"
      Version: "2.0"
