Core:
  Id: "CDISC-CG0031"
  Status: "Published"
  Version: "1"
Description: "Raise an error when VISIT is populated with a value that does not match\
  \ any VISIT value defined in the Trial Visits (TV) dataset, for a visit the Subject\
  \ Visits (SV) dataset flags as pre-specified (SVPRESP equals 'Y')."
Executability: "Partially Executable - Possible Overreporting"
Scope:
  Domains:
    Exclude:
    - "TV"
Requirements:
  Variables:
    All:
    - "VISIT"
    - "TV.VISIT"
    - "SV.SVPRESP"
Match_Datasets:
- Join_Type: "left"
  Keys:
  - "USUBJID"
  - "VISIT"
  Name: "SV"
Operations:
- id: "$tv_visit"
  expression: "distinct(VISIT, domain=\"TV\")"
Check:
  expression: >-
    SV.SVPRESP == "Y" and not empty(VISIT) and VISIT not in $tv_visit
Outcome:
  Message: "VISIT value for a visit flagged pre-specified in SV does not match any\
    \ VISIT value in the TV dataset."
  Output_Variables:
  - "VISITNUM"
  - "VISIT"
  - "SV.SVPRESP"
  - "$tv_visit"
Source:
  Class: "ALL"
  Domain: "ALL"
  Variable: "VISIT"
  Condition: "VISIT ^= null and is planned"
  Rule: "VISIT in TV.VISIT"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "SDTMIG"
    Version: "3.4"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0031"
        Version: "1"
      Version: "2.0"
  - Name: "SDTMIG"
    Version: "3.3"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0031"
        Version: "1"
      Version: "2.0"
  - Name: "SDTMIG"
    Version: "3.2"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0031"
        Version: "1"
      Version: "2.0"
