Core:
  Id: "CDISC-AD0516"
  Status: "Published"
  Version: "1"
Description: "Raise an error when a variable's name ends in ETM, the ADaM implementation\
  \ guide's *ETM naming fragment governs it (the name is not a standard library variable),\
  \ and its label does not contain the fragment's phrase 'End Time'."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "ALL"
Check:
  expression: >-
    ends_with(upper(varname()), "ETM") and var_name("LIBRARY") == "*ETM" and not
    matches_label_template(var_label("DATA"), label_template("LIBRARY"))
Outcome:
  Message: "A variable ending in ETM does not contain 'End Time' in the label."
  Output_Variables:
  - "variable_name"
  - "variable_label"
  - "library_variable_label_template"
Source:
  Class: "ALL"
  Variable_or_Item: "*ETM"
  Natural_Language_Rule_Failure_Criteria: "A variable ending in ETM must contain \"\
    End Time\" in the label"
  Rule_Failure_Criteria: "*ETM does not contain \"End Time\" in the label"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.1"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR516"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.2"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR516"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.3"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR516"
        Version: "1"
      Version: "5.0"
