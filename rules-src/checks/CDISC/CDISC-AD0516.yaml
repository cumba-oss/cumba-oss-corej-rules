Core:
  Id: "CDISC-AD0516"
  Status: "Published"
  Version: "1"
Description: "Raise an error when a variable name ends in ETM but its label does not\
  \ contain 'End Time', unless the variable is one of the standard library variables."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "ALL"
Bindings:
- name: "$library_variables"
  expression: "get_column_order_from_library()"
Check:
  expression: >-
    ends_with(upper(varname()), "ETM") and not contains(var_label("DATA"), "End Time") and
    upper(varname()) not in $library_variables
Outcome:
  Message: "A variable ending in ETM does not contain 'End Time' in the label."
  Output_Variables:
  - "variable_name"
  - "variable_label"
Source:
  Class: "ALL"
  Variable_or_Item: "*ETM"
  Natural_Language_Rule_Failure_Criteria: "A variable ending in ETM must contain \"\
    End Time\" in the label"
  Rule_Failure_Criteria: "*ETM does not contain \"End Time\" in the label"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.1"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR516"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.2"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR516"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.3"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR516"
        Version: "1"
      Version: "5.0"
