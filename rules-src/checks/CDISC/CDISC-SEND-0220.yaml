Core:
  Id: "CDISC-SEND-0220"
  Status: "Published"
  Version: "1"
Description: "Raise an error when more than one Trial Arms (TA) record exists for\
  \ the same combination of Planned Arm Code (ARMCD) and Element Code (ETCD); the\
  \ TA domain expects one record per planned Element per Arm."
Executability: "Partially Executable - Possible Overreporting"
Scope:
  Domains:
    Include:
    - "TA"
Check:
  expression: >-
    not is_unique_set([ARMCD, ETCD])
Outcome:
  Message: "More than one TA record exists for the same ARMCD and ETCD combination."
Source:
  Class: "TDM"
  Domain: "TA"
  Variable: "ALL"
  Plain_Text_Explanation: "One record per planned Element per Arm"
  Rule: "One record per planned Element per Arm"
