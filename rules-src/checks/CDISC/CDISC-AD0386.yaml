Core:
  Id: "CDISC-AD0386"
  Status: "Published"
  Version: "2"
Description: "Raise an error when BTOXGRLN is populated and BTOXGRL is not populated."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "BASIC DATA STRUCTURE"
    - "MEDICAL DEVICE BASIC DATA STRUCTURE"
Requirements:
  Variables:
    All:
    - "BTOXGRLN"
    - "BTOXGRL"
Check:
  expression: >-
    not empty(BTOXGRLN) and empty(BTOXGRL)
Outcome:
  Message: "BTOXGRLN is populated but BTOXGRL is not populated."
  Message_Folded: "BTOXGRL not populated in any record of the dataset, and at least\
    \ one record meets the rest of the condition: BTOXGRLN is populated but BTOXGRL\
    \ is not populated."
Source:
  Class: "BASIC DATA STRUCTURE; MEDICAL DEVICE BASIC DATA STRUCTURE"
  Variable_or_Item: "BTOXGRL"
  Natural_Language_Rule_Failure_Criteria: "On a given record, BTOXGRLN is populated\
    \ and BTOXGRL is not populated"
  Rule_Failure_Criteria: "BTOXGRL is not populated"
  Condition_Failure: "BTOXGRLN is populated"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.2"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR386"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.3"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR386"
        Version: "2"
      Version: "5.0"
