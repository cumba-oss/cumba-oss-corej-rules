Core:
  Id: "CDISC-AD0688"
  Status: "Published"
  Version: "1"
Description: "Raise an error when, within ADDL, there is more than one record for\
  \ a given combination of USUBJID and SPDEVID."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "DEVICE LEVEL ANALYSIS DATASET"
Check:
  expression: >-
    not is_unique_set([USUBJID, SPDEVID])
Outcome:
  Message: "More than one record was found in ADDL for this combination of USUBJID\
    \ and SPDEVID."
Source:
  Class: "DEVICE LEVEL ANALYSIS DATASET"
  Natural_Language_Rule_Failure_Criteria: "Within ADDL there is more than one record\
    \ for unique values of USUBJID and SPDEVID"
  Rule_Failure_Criteria: "Within ADDL there is more than one record for unique values\
    \ of USUBJID and SPDEVID"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.3"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR688"
        Version: "1"
      Version: "5.0"
