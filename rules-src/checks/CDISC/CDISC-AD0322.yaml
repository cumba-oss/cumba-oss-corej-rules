Core:
  Id: "CDISC-AD0322"
  Status: "Published"
  Version: "2"
Description: "Raise an error when there is more than one value of TRTPGy for a given\
  \ value of TRTP, where y is an integer [1-99, not zero-padded]."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "BASIC DATA STRUCTURE"
    - "OCCURRENCE DATA STRUCTURE"
    - "MEDICAL DEVICE OCCURRENCE DATA STRUCTURE"
Check:
  expression: >-
    has_multiple_values_for(TRTPGy, TRTP)
Outcome:
  Message: "TRTPGy has more than one value for the same value of TRTP, where y is\
    \ an integer [1-99, not zero-padded]."
wildcards:
  "y":
    min: 1
    max: 99
Source:
  Class: "BASIC DATA STRUCTURE; MEDICAL DEVICE BASIC DATA STRUCTURE; OCCURRENCE DATA\
    \ STRUCTURE; MEDICAL DEVICE OCCURRENCE DATA STRUCTURE"
  Variable_or_Item: "TRTPGy where y is an integer [1-99, not zero-padded]"
  Natural_Language_Rule_Failure_Criteria: "Within a given value of TRTP, there is\
    \ more than one value of TRTPGy, where y is an integer [1-99, not zero-padded]"
  Rule_Failure_Criteria: "Within a given value of TRTP, there is more than one value\
    \ of TRTPGy"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.1"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR322"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.2"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR322"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.3"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR322"
        Version: "2"
      Version: "5.0"
