Core:
  Id: "CDISC-AD0786"
  Status: "Published"
  Version: "1"
Description: "Raise an error when there is more than one value of TOXGGRyN for a given\
  \ value of TOXGGRy, considering only rows on which both variables are populated"
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "OCCURRENCE DATA STRUCTURE"
    - "MEDICAL DEVICE OCCURRENCE DATA STRUCTURE"
Check:
  expression: >-
    not empty(TOXGGRyN) and not empty(TOXGGRy) and has_multiple_values_for(TOXGGRyN, TOXGGRy)
Outcome:
  Message: "TOXGGRyN takes more than one value for the same value of TOXGGRy, considering\
    \ only rows on which both variables are populated."
  Output_Variables:
  - "TOXGGRy"
  - "TOXGGRyN"
wildcards:
  "y":
    min: 1
    max: 99
Source:
  Class: "OCCURRENCE DATA STRUCTURE; MEDICAL DEVICE OCCURRENCE DATA STRUCTURE"
  Variable_or_Item: "TOXGGRyN where y is an integer [1-9, not zero-padded]"
  Natural_Language_Rule_Failure_Criteria: "There is more than one value of TOXGGRyN\
    \ for a given value of TOXGGRy, considering only those rows on which both variables\
    \ are populated"
  Rule_Failure_Criteria: "There is more than one value of TOXGGRyN for a given value\
    \ of TOXGGRy"
  Condition_Failure: "On rows where both TOXGGRyN and TOXGGRy are both populated."
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.1"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR786"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.2"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR786"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.3"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR786"
        Version: "1"
      Version: "5.0"
