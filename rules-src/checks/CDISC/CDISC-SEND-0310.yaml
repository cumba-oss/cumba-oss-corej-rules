Core:
  Id: "CDISC-SEND-0310"
  Status: "Published"
  Version: "1"
Description: "Raise an error when DM records that share the same value of SETCD do\
  \ not all have the same value of STRAIN; records with different STRAIN values must\
  \ have different SETCD values."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "DM"
Requirements:
  Variables:
    All:
    - "STRAIN"
Check:
  expression: >-
    var_exists("SETCD") and is_inconsistent_across_dataset(STRAIN, keys=[SETCD])
Outcome:
  Message: "STRAIN is not consistent across DM records that share the same SETCD value."
Source:
  Class: "SPC"
  Domain: "DM"
  Variable: "STRAIN"
  Plain_Text_Explanation: "Subjects with different values for SPECIES and/or STRAIN\
    \  cannot have the same SETCD value."
  Rule: "DM records with different values for DM.STRAIN must have different values\
    \ for DM.SETCD."
