Core:
  Id: "CDISC-CG0136"
  Status: "Published"
  Version: "1"
Description: "Raise an error when DSDECOD in the DS dataset is equal to 'DEATH' and\
  \ DTHFL does not equal 'Y'."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "DM"
Requirements:
  Variables:
    All:
    - "DTHFL"
    - "USUBJID"
    All_Or_None:
    - - "USUBJID"
      - "DS.USUBJID"
Match_Datasets:
- Keys:
  - "USUBJID"
  Name: "DS"
Check:
  expression: >-
    DS.DSDECOD == "DEATH" and DTHFL != "Y"
Outcome:
  Message: "DTHFL does not equal 'Y' when DSDECOD in the DS dataset is equal to 'DEATH'."
Source:
  Class: "SPC"
  Domain: "DM"
  Variable: "DTHFL"
  Condition: "DS.DSDECOD = 'DEATH'"
  Rule: "DTHFL = 'Y'"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "SDTMIG"
    Version: "3.4"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0136"
        Version: "1"
      Version: "2.0"
  - Name: "SDTMIG"
    Version: "3.3"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0136"
        Version: "1"
      Version: "2.0"
  - Name: "SDTMIG"
    Version: "3.2"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0136"
        Version: "1"
      Version: "2.0"
