Core:
  Id: "CDISC-CG0216"
  Status: "Published"
  Version: "1"
Description: "Raise an error when Planned Study Day of Visit (VISITDY) is populated\
  \ for an unplanned visit (Description of Unplanned Visit (SVUPDES) is populated)\
  \ in the Subject Visits (SV) domain; VISITDY should be missing for unplanned visits."
Executability: "Partially Executable - Possible Overreporting"
Scope:
  Domains:
    Include:
    - "SV"
Requirements:
  Variables:
    All:
    - "VISITDY"
Check:
  expression: >-
    (var_exists("SVPRESP") and SVPRESP != "Y" or not var_exists("SVPRESP") and (not empty(SVUPDES)
    or contains(upper(VISIT), "UNSCHEDUL") or contains(upper(VISIT), "UNPLAN"))) and not
    empty(VISITDY)
Outcome:
  Message: "VISITDY is populated for an unplanned visit."
Source:
  Class: "SPC"
  Domain: "SV"
  Variable: "VISITDY"
  Condition: "SVUPDES ^= null"
  Rule: "VISITDY = null"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "SDTMIG"
    Version: "3.3"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0216"
        Version: "1"
      Version: "2.0"
  - Name: "SDTMIG"
    Version: "3.2"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0216"
        Version: "1"
      Version: "2.0"
