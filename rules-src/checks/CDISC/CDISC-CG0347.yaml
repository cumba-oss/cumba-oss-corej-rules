Core:
  Id: "CDISC-CG0347"
  Status: "Published"
  Version: "1"
Description: "Raise an error when --ORRES is equal to 'MULTIPLE'."
Executability: "Fully Executable"
Scope:
  Classes:
    Include:
    - "FINDINGS"
Requirements:
  Variables:
    All:
    - "--ORRES"
Check:
  expression: >-
    --ORRES == "MULTIPLE"
Outcome:
  Message: "--ORRES is equal to 'MULTIPLE'."
Source:
  Class: "FND"
  Domain: "ALL"
  Variable: "--ORRES"
  Condition: "The use of 'MULTIPLE' reflects multiple values (as opposed to a valid\
    \ response in the context of the finding (e.g., Questionnaire CT)."
  Rule: "--ORRES ^ = 'MULTIPLE'"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "SDTMIG"
    Version: "3.4"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0347"
        Version: "1"
      Version: "2.0"
  - Name: "SDTMIG"
    Version: "3.3"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0347"
        Version: "1"
      Version: "2.0"
  - Name: "SDTMIG"
    Version: "3.2"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0347"
        Version: "1"
      Version: "2.0"
