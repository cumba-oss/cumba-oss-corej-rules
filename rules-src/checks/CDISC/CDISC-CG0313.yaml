Core:
  Id: "CDISC-CG0313"
  Status: "Published"
  Version: "1"
Description: "Raise an error when the variable STUDYID is not present in a dataset\
  \ based on one of the three SDTM general observation classes."
Executability: "Fully Executable"
Scope:
  Classes:
    Include:
    - "EVENTS"
    - "INTERVENTIONS"
    - "FINDINGS"
Check:
  expression: >-
    not var_exists("STUDYID")
Outcome:
  Message: "STUDYID is not present in the dataset."
Source:
  Class: "ALL"
  Domain: "ALL"
  Variable: "GEN"
  Rule: "STUDYID, USUBJID or POOLID, DOMAIN, and --SEQ exist"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "SDTMIG"
    Version: "3.2"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0313"
        Version: "1"
      Version: "2.0"
