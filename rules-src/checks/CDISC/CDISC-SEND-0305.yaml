Core:
  Id: "CDISC-SEND-0305"
  Status: "Published"
  Version: "1"
Description: "Raise an error when the Subject Reference Start Date/Time of Study Treatment\
  \ (RFXSTDTC) is populated but does not equal the earliest EXSTDTC of the subject's\
  \ own EX records and of the EX records of every pool POOLDEF assigns it to."
Executability: "Partially Executable - Possible Underreporting"
ExecutabilityHint:
  Category: "partially executable"
  Detail: "EX rows recorded per pool (POOLID, USUBJID blank) are read through POOLDEF\
    \ for every pool the subject belongs to; when the earliest EXSTDTC of the subject's\
    \ own EX records or of any of its pools cannot be determined (a partial or unreadable\
    \ date) while another can, the earliest of those that can is taken as RFXSTDTC's\
    \ reference, so the rule may be silent where the earliest over all of them would\
    \ be reported. A POOLID typed differently in EX and POOLDEF, or a USUBJID typed\
    \ differently in DM and POOLDEF (Char against Num), makes the rule ERROR; in a\
    \ CSV or XLSX study the type is inferred from the data, and a column blank in\
    \ every row reads as Char from CSV but as Num from XLSX (e.g. an empty EX POOLID\
    \ in an XLSX study beside character POOLDEF pool IDs such as POOL1). The rule\
    \ runs on a pooled study only — POOLDEF with POOLID and EX with POOLID; a study\
    \ that defines no pools is judged by CDISC-SEND-0305-A, and a study whose POOLDEF\
    \ defines pools while EX has no POOLID skips both (the pool part cannot be read)."
Scope:
  Domains:
    Include:
    - "DM"
Requirements:
  Variables:
    All:
    - "USUBJID"
    - "EX.USUBJID"
    - "POOLDEF.POOLID"
    - "EX.POOLID"
Bindings:
- name: "$ex_usubjid"
  expression: "distinct(USUBJID, domain=\"EX\")"
- name: "$min_ex_exstdtc"
  expression: "min_date(EXSTDTC, domain=\"EX\", group=[USUBJID])"
- name: "$pool_min_exstdtc"
  expression: "min_date(min_date(EXSTDTC, domain=\"EX\", group=[POOLID], filter=(not\
    \ empty(POOLID))), domain=\"POOLDEF\", group=[USUBJID])"
- name: "$pool_ex_rows"
  expression: "max(record_count(domain=\"EX\", group=[POOLID], filter=(not empty(POOLID))),\
    \ domain=\"POOLDEF\", group=[USUBJID])"
- name: "$first_exstdtc"
  expression: "earliest_date($min_ex_exstdtc, $pool_min_exstdtc)"
Check:
  expression: >-
    not empty(RFXSTDTC) and (USUBJID in $ex_usubjid or $pool_ex_rows > 0) and date(RFXSTDTC) !=
    $first_exstdtc
Outcome:
  Message: "RFXSTDTC is populated but does not equal the earliest EXSTDTC of the subject's\
    \ own EX records and of the EX records of every pool POOLDEF assigns it to."
  Output_Variables:
  - "$ex_usubjid"
Source:
  Class: "SPC"
  Domain: "DM"
  Variable: "RFXSTDTC"
  Plain_Text_Explanation: "If RFXSTDTC is populated the value should be equal to the\
    \ earliest (i.e., absolute first) value of EXSTDTC for that subject or the EXSTDTC\
    \ for the pool to which that subject belongs."
  Condition: "RFXSTDTC ^= null"
  Rule: "RFXSTDTC value = earliest EXSTDTC value for that subject"
Standards:
