Core:
  Id: "CDISC-AD0146"
  Status: "Published"
  Version: "1"
Description: "Raise an error when, within a dataset, there is more than one value\
  \ of PARAM for a given value of PARAMN."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "BASIC DATA STRUCTURE"
Requirements:
  Variables:
    All:
    - "PARAMN"
Check:
  expression: >-
    has_multiple_values_for(PARAM, PARAMN)
Outcome:
  Message: "PARAM has more than one value for this PARAMN within the dataset."
Source:
  Class: "BASIC DATA STRUCTURE"
  Variable_or_Item: "PARAM"
  Natural_Language_Rule_Failure_Criteria: "Within a dataset, there is more than one\
    \ value of PARAM for a given value of PARAMN"
  Rule_Failure_Criteria: "Within a dataset, there is more than one value of PARAM\
    \ for a given value of PARAMN"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.0"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR146"
        Version: "1"
      Version: "5.0"
