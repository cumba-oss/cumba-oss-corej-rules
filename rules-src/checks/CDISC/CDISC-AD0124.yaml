Core:
  Id: "CDISC-AD0124"
  Status: "Published"
  Version: "2"
Description: "Raise an error when there is more than one value of PARCATy for a given\
  \ value of PARAMCD."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "BASIC DATA STRUCTURE"
Check:
  expression: >-
    has_multiple_values_for(PARCATy, PARAMCD)
Outcome:
  Message: "PARCATy has more than one value for this PARAMCD."
  Output_Variables:
  - "PARAMCD"
  - "PARCATy"
wildcards:
  "y":
    min: 1
    max: 99
Source:
  Class: "BASIC DATA STRUCTURE; MEDICAL DEVICE BASIC DATA STRUCTURE"
  Variable_or_Item: "PARCATy where y is an integer [1-99, not zero-padded]"
  Natural_Language_Rule_Failure_Criteria: "There is more than one value of PARCATy\
    \ for a given value of PARAMCD"
  Rule_Failure_Criteria: "There is more than one value of PARCATy for a given value\
    \ of PARAMCD"
Standards:
- Organization: "CDISC"
  Standards:
