Core:
  Id: "CDISC-AD0823"
  Status: "Published"
  Version: "1"
Description: "Raise an error when, within a dataset, there is more than one value\
  \ of SITEID for a given value of SITEIDN, considering only records where both variables\
  \ are populated"
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "BASIC DATA STRUCTURE"
Check:
  expression: >-
    not empty(SITEID) and not empty(SITEIDN) and has_multiple_values_for(SITEID, SITEIDN)
Outcome:
  Message: "Within this dataset, more than one value of SITEID is present for the\
    \ same populated value of SITEIDN"
Source:
  Class: "BASIC DATA STRUCTURE"
  Subclass: "POPULATION PHARMACOKINETIC ANALYSIS"
  Variable_or_Item: "SITEID"
  Natural_Language_Rule_Failure_Criteria: "Within a dataset, there is more than one\
    \ value of SITEID for a given value of SITEIDN, considering only those rows on\
    \ which both variables are populated"
  Rule_Failure_Criteria: "Within a dataset, there is more than one value of SITEID\
    \ for a given value of SITEIDN"
  Condition_Failure: "On rows where both SITEID and SITEIDN are both populated"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.3"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR823"
        Version: "1"
      Version: "5.0"
