Core:
  Id: "CDISC-CG0337"
  Status: "Published"
  Version: "1"
Description: "Raise an error when --CAT is equal to the Dictionary-Derived Term (--DECOD)."
Executability: "Fully Executable"
Scope:
  Classes:
    Include:
    - "EVENTS"
    - "INTERVENTIONS"
Requirements:
  Variables:
    All:
    - "--CAT"
    - "--DECOD"
Check:
  expression: >-
    equalsIgnoreCase(--CAT, --DECOD)
Outcome:
  Message: "--CAT value is redundant with the dictionary-derived term (--DECOD)."
  Output_Variables:
  - "--DECOD"
Source:
  Class: "EVT"
  Domain: "ALL"
  Variable: "--CAT"
  Rule: "--CAT ^= --DECOD"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "SDTMIG"
    Version: "3.4"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0337"
        Version: "1"
      Version: "2.0"
  - Name: "SDTMIG"
    Version: "3.3"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0337"
        Version: "1"
      Version: "2.0"
  - Name: "SDTMIG"
    Version: "3.2"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0337"
        Version: "1"
      Version: "2.0"
