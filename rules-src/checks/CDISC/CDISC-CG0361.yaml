Core:
  Id: "CDISC-CG0361"
  Status: "Published"
  Version: "1"
Description: "Raise an error when both the Unique Subject Identifier (USUBJID) and\
  \ the Pool Identifier (POOLID) variables are populated on the same record."
Executability: "Not Executable"
ExecutabilityHint:
  Category: "not executable"
  Detail: "Parked as an R-5.26 duplicate of CDISC-CG0362 (owner rulings D-8 + D-18,\
    \ 2026-09-14): the two are identical in every field but the id and ship into exactly\
    \ the same packages, so one run reported the same finding twice. Both package\
    \ sets being equal, D-18's tie-break applies and the lower-numbered row is parked\
    \ — the lower id was authored first, so the higher is the more recent statement.\
    \ The row stays documented here while CDISC-CG0362 carries the executable check."
Scope:
  Domains:
    Include:
    - "RELSUB"
Requirements:
  Variables:
    All:
    - "POOLID"
Check:
  expression: >-
    not empty(USUBJID) and not empty(POOLID)
Outcome:
  Message: "Redundant values for USUBJID and POOLID"
  Output_Variables:
  - "POOLID"
Source:
  Class: "SPC"
  Domain: "RELSUB"
  Variable: "POOLID"
  Condition: "USUBJID ^= null"
  Rule: "POOLID = null"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "SDTMIG"
    Version: "3.4"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0361"
        Version: "1"
      Version: "2.0"
  - Name: "SDTMIG"
    Version: "3.3"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0361"
        Version: "1"
      Version: "2.0"
  - Name: "SDTMIG"
    Version: "3.2"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0361"
        Version: "1"
      Version: "2.0"
