Core:
  Id: "CDISC-AD0147"
  Status: "Published"
  Version: "1"
Description: "Raise an error when, within a dataset, there is more than one value\
  \ of PARAMN for a given value of PARAM."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "BASIC DATA STRUCTURE"
Requirements:
  Variables:
    All:
    - "PARAMN"
Check:
  expression: >-
    has_multiple_values_for(PARAMN, PARAM)
Outcome:
  Message: "PARAMN has more than one value for this PARAM within the dataset."
  Output_Variables:
  - "PARAM"
  - "PARAMN"
Source:
  Class: "BASIC DATA STRUCTURE"
  Variable_or_Item: "PARAMN"
  Natural_Language_Rule_Failure_Criteria: "Within a dataset, there is more than one\
    \ value of PARAMN for a given value of PARAM"
  Rule_Failure_Criteria: "Within a dataset, there is more than one value of PARAMN\
    \ for a given value of PARAM"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.0"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR147"
        Version: "1"
      Version: "5.0"
