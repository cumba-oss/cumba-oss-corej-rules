Core:
  Id: "CDISC-AD0043"
  Status: "Published"
  Version: "1"
Description: "Raise an error when a numeric variable with a suffix of DTM does not\
  \ have a datetime format"
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "ALL"
Check:
  expression: >-
    ends_with(upper(varname()), "DTM") and var_type("DATA") == "Num" and var_format("DATA") !~
    /(?i)^(DATETIME|DATEAMPM|E8601DT|IS8601DT|B8601DT|NLDATM|DTDATE|DTMONYY|DTYEAR|DTWKDATX|MDYAMPM)/
Outcome:
  Message: "A numeric variable with a suffix of DTM has a format that is not a datetime\
    \ format"
skipIfLibraryDefined: true
Source:
  Class: "ALL"
  Variable_or_Item: "*DTM"
  Natural_Language_Rule_Failure_Criteria: "A numeric variable with a suffix of DTM\
    \ does not have a datetime format"
  Rule_Failure_Criteria: "Variable does not have a datetime format"
  Condition_Failure: "Numeric variable with a suffix of DTM"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.0"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR43"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.1"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR43"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.2"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR43"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.3"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR43"
        Version: "1"
      Version: "5.0"
