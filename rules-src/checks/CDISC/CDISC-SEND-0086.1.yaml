Core:
  Id: "CDISC-SEND-0086.1"
  Status: "Published"
  Version: "1"
Description: "Raise an error when Completion/Reason Not Done (--STAT) is \"NOT DONE\"\
  \ but Result or Finding in Original Units (--ORRES) is populated; a result must\
  \ not be presented when the examination was not done."
Executability: "Fully Executable"
Scope:
  Classes:
    Include:
    - "FINDINGS"
Requirements:
  Variables:
    All:
    - "--STAT"
    - "--ORRES"
Check:
  expression: >-
    --STAT == "NOT DONE" and not empty(--ORRES)
Outcome:
  Message: "--ORRES is populated when --STAT is \"NOT DONE\"; no result should be\
    \ presented."
Source:
  Class: "FND"
  Domain: "ALL"
  Variable: "--ORRES"
  Plain_Text_Explanation: "Data should not be presented in the --ORRES variable if\
    \ --STAT = \"NOT DONE\"."
  Condition: "--STAT = \"NOT DONE\""
  Rule: "--ORRES = null"
