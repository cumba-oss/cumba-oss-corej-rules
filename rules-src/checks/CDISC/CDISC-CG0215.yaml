Core:
  Id: "CDISC-CG0215"
  Status: "Published"
  Version: "1"
Description: "Raise an error when Visit Name (VISIT) is populated for a planned visit\
  \ (SVUPDES is empty) in the Subject Visits (SV) domain, but the VISIT value does\
  \ not match any VISIT value in the Trial Visits (TV) dataset."
Executability: "Partially Executable - Possible Overreporting"
Scope:
  Domains:
    Include:
    - "SV"
Requirements:
  Variables:
    All:
    - "VISIT"
Bindings:
- name: "$tv_visit"
  expression: "distinct(VISIT, domain=\"TV\")"
Check:
  expression: >-
    not empty(VISIT) and (var_exists("SVPRESP") and SVPRESP == "Y" or not var_exists("SVPRESP") and
    empty(SVUPDES) and not contains(upper(VISIT), "UNSCHEDUL") and not contains(upper(VISIT),
    "UNPLAN")) and VISIT not in $tv_visit
Outcome:
  Message: "VISIT for a planned visit does not match any VISIT value in the TV dataset."
  Message_Folded: "SVUPDES absent or not populated in any record of the dataset, and\
    \ at least one record meets the rest of the condition: VISIT for a planned visit\
    \ does not match any VISIT value in the TV dataset."
  Output_Variables:
  - "!SVUPDES"
  - "$tv_visit"
Source:
  Class: "SPC"
  Domain: "SV"
  Variable: "VISIT"
  Condition: "SVUPDES = null"
  Rule: "VISIT in TV.VISIT"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "SDTMIG"
    Version: "3.3"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0215"
        Version: "1"
      Version: "2.0"
  - Name: "SDTMIG"
    Version: "3.2"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0215"
        Version: "1"
      Version: "2.0"
