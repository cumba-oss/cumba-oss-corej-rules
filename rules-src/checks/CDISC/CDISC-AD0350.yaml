Core:
  Id: "CDISC-AD0350"
  Status: "Published"
  Version: "2"
Description: "Raise an error when, within a parameter, AyHI has more than one value\
  \ for a given value of AyHIC"
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "BASIC DATA STRUCTURE"
Check:
  expression: >-
    has_multiple_values_for(AyHI, AyHIC, within=PARAMCD)
Outcome:
  Message: "Within this parameter, AyHI has more than one value for the same value\
    \ of AyHIC."
  Output_Variables:
  - "PARAMCD"
  - "AyHI"
  - "AyHIC"
wildcards:
  "y":
    min: 1
    max: 99
Source:
  Class: "BASIC DATA STRUCTURE; MEDICAL DEVICE BASIC DATA STRUCTURE"
  Variable_or_Item: "AyHI where y is an integer [1-99, not zero-padded]"
  Natural_Language_Rule_Failure_Criteria: "Within a parameter, there is more than\
    \ one value of AyHI for a given value of AyHIC"
  Rule_Failure_Criteria: "Within a parameter, there is more than one value of AyHI\
    \ for a given value of AyHIC"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.1"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR350"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.2"
    References:
