Core:
  Id: "CDISC-AD0512"
  Status: "Published"
  Version: "1"
Description: "Raise an error when a variable name ends in SDY but its label does not\
  \ contain 'Relative Start Day'."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "ALL"
Check:
  expression: >-
    ends_with(varname(), "SDY") and not contains(var_label("DATA"), "Relative Start Day")
Outcome:
  Message: "A variable ending in SDY does not contain 'Relative Start Day' in the\
    \ label."
  Output_Variables:
  - "variable_name"
  - "variable_label"
skipIfLibraryDefined: true
Source:
  Class: "ALL"
  Variable_or_Item: "*SDY"
  Natural_Language_Rule_Failure_Criteria: "A variable ending in SDY must contain \"\
    Relative Start Day\" in the label"
  Rule_Failure_Criteria: "*SDY does not contain \"Relative Start Day\" in the label"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.1"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR512"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.2"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR512"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.3"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR512"
        Version: "1"
      Version: "5.0"
