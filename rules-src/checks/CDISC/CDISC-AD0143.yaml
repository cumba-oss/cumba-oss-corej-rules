Core:
  Id: "CDISC-AD0143"
  Status: "Published"
  Version: "2"
Description: "Raise an error when PARAMCD has more than 8 characters in length."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "BASIC DATA STRUCTURE"
    - "MEDICAL DEVICE BASIC DATA STRUCTURE"
Check:
  expression: >-
    len(PARAMCD) > 8
Outcome:
  Message: "PARAMCD is longer than 8 characters."
