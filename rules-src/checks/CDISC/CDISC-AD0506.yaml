Core:
  Id: "CDISC-AD0506"
  Status: "Published"
  Version: "1"
Description: "Raise an error when a variable's name ends in ADY and its label does\
  \ not contain the phrase of the ADaM implementation guide's *ADY naming fragment\
  \ ('Relative Day')."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "ALL"
Check:
  expression: >-
    ends_with(upper(varname()), "ADY") and not empty(label_template("LIBRARY", stem="*ADY")) and not
    matches_label_template(var_label(), label_template("LIBRARY", stem="*ADY"))
Outcome:
  Message: "The variable's name ends in ADY, but its label does not contain 'Relative\
    \ Day'."
  Output_Variables:
  - "library_variable_label_template"
Source:
  Class: "ALL"
  Variable_or_Item: "*ADY"
  Natural_Language_Rule_Failure_Criteria: "A variable ending in ADY must contain \"\
    Relative Day\" in the label"
  Rule_Failure_Criteria: "*ADY does not contain \"Relative Day\" in the label"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.1"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR506"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.2"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR506"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.3"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR506"
        Version: "1"
      Version: "5.0"
