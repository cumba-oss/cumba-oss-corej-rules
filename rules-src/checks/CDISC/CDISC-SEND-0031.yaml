Core:
  Id: "CDISC-SEND-0031"
  Status: "Published"
  Version: "1"
Description: "Raise an error when the first character of the two-character domain\
  \ code (DOMAIN) is not an uppercase letter A to Z."
Executability: "Fully Executable"
Scope:
  Classes:
    Include:
    - "INTERVENTIONS"
    - "EVENTS"
    - "FINDINGS"
Requirements:
  Variables:
    All:
    - "DOMAIN"
Check:
  expression: >-
    DOMAIN =~ /^[^A-Z]/
Outcome:
  Message: "The first character of the domain code (DOMAIN) is not an uppercase letter\
    \ A to Z."
Source:
  Class: "INT, EVT, FND"
  Domain: "ALL"
  Variable: "GEN"
  Plain_Text_Explanation: "Two character domain identifier used as a prefix in the\
    \ variable is limited to A to Z for the first character"
  Rule: "Two character domain identifier used as a prefix in the variable is limited\
    \ to A to Z for the first character"
