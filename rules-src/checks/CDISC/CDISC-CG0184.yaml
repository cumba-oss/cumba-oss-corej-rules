Core:
  Id: "CDISC-CG0184"
  Status: "Published"
  Version: "1"
Description: "Raise an error when LBORRES is populated with a quantitative (continuous)\
  \ result and the character reference range in standardized units (LBSTNRC) is populated.\
  \ LBSTNRC is intended for non-continuous, character or categorical reference ranges\
  \ and should be empty when the result is a continuous measurement; a quantitative\
  \ (continuous) result is approximated by a numeric LBORRES value, optionally prefixed\
  \ with a relational operator."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "LB"
Requirements:
  Variables:
    All:
    - "LBSTNRC"
    - "LBORRES"
Check:
  expression: >-
    LBORRES =~ /^(<|>|< |> )?(-?((\\d+(\\.\\d+)?)|(\\.\\d+)))$/ and not empty(LBSTNRC)
Outcome:
  Message: "LBSTNRC is populated when LBORRES is a quantitative (continuous) measurement."
Source:
  Class: "FND"
  Domain: "LB"
  Variable: "LBSTNRC"
  Condition: "LBORRES = continuous measurement"
  Rule: "LBSTNRC = null"
Standards:
- Organization: "CDISC"
  Standards:
