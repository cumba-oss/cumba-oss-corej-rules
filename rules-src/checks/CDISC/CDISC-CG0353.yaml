Core:
  Id: "CDISC-CG0353"
  Status: "Published"
  Version: "1"
Description: "Raise an error when --EXCLFL is present in a dataset submitted for human\
  \ clinical trials."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "ALL"
Check:
  expression: >-
    var_exists("--EXCLFL")
Outcome:
  Message: "--EXCLFL must not be present in data submitted for human clinical trials."
  Output_Variables:
  - "--EXCLFL"
Source:
  Class: "ALL"
  Domain: "ALL"
  Variable: "--EXCLFL"
  Rule: "--EXCLFL not present in dataset"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "SDTMIG"
    Version: "3.4"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0353"
        Version: "1"
      Version: "2.0"
  - Name: "SDTMIG"
    Version: "3.3"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0353"
        Version: "1"
      Version: "2.0"
