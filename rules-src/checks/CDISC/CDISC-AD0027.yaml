Core:
  Id: "CDISC-AD0027"
  Status: "Published"
  Version: "1"
Description: "Raise an error when FASFN is populated with a value that is not 1 or\
  \ 0"
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "SUBJECT LEVEL ANALYSIS DATASET"
Requirements:
  Variables:
    All:
    - "FASFN"
Check:
  expression: >-
    not empty(FASFN) and FASFN not in [0, 1]
Outcome:
  Message: "FASFN has a value other than 1 or 0"
  Output_Variables:
  - "FASFN"
Source:
  Class: "SUBJECT LEVEL ANALYSIS DATASET"
  Variable_or_Item: "FASFN"
  Natural_Language_Rule_Failure_Criteria: "FASFN is present and has a value that is\
    \ not 1 or 0"
  Rule_Failure_Criteria: "Value is not 1 or 0"
  Condition_Failure: "FASFN is present"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.0"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
