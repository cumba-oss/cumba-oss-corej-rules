Core:
  Id: "CDISC-AD0696"
  Status: "Published"
  Version: "1"
Description: "Raise an error when, within a given PARAMCD and BASETYPE for a combination\
  \ of device and subject, more than one record has ABLFL equal to 'Y'."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "MEDICAL DEVICE BASIC DATA STRUCTURE"
Grouping:
  Variables:
  - "USUBJID"
  - "SPDEVID"
  - "PARAMCD"
  - "BASETYPE"
Bindings:
- name: "$ablfl_y_count"
  expression: "record_count(group=[USUBJID, SPDEVID, PARAMCD, BASETYPE], filter=(ABLFL\
    \ == \"Y\"))"
Check:
  expression: >-
    not empty(PARAMCD) and not empty(BASETYPE) and $ablfl_y_count > 1
Outcome:
  Message: "More than one record has ABLFL equal to 'Y' within this PARAMCD, BASETYPE,\
    \ device, and subject combination."
  Output_Variables:
  - "SPDEVID"
  - "ABLFL"
Source:
  Class: "MEDICAL DEVICE BASIC DATA STRUCTURE"
  Variable_or_Item: "ABLFL"
  Natural_Language_Rule_Failure_Criteria: "Within a given PARAMCD and BASETYPE for\
    \ a combination of device and subject, more than one record has ABLFL equal to\
    \ Y"
  Rule_Failure_Criteria: "Within a given PARAMCD and BASETYPE for a combination of\
    \ device and subject, more than one record has ABLFL equal to Y"
  Condition_Failure: "USUBJID and SPDEVID are present and PARAMCD and BASETYPE are\
    \ populated"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.3"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR696"
        Version: "1"
      Version: "5.0"
