Core:
  Id: "CDISC-AD0816"
  Status: "Published"
  Version: "1"
Description: "Raise an error when SUBJIDN is populated and SUBJID is not populated."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "BASIC DATA STRUCTURE"
Check:
  expression: >-
    not empty(SUBJIDN) and empty(SUBJID)
Outcome:
  Message: "SUBJIDN is populated, but SUBJID is not populated."
  Message_Folded: "SUBJID not populated in any record of the dataset, and at least\
    \ one record meets the rest of the condition: SUBJIDN is populated, but SUBJID\
    \ is not populated."
Source:
  Class: "BASIC DATA STRUCTURE"
  Subclass: "POPULATION PHARMACOKINETIC ANALYSIS"
  Variable_or_Item: "SUBJID"
  Natural_Language_Rule_Failure_Criteria: "SUBJIDN is populated and SUBJID is not\
    \ populated"
  Rule_Failure_Criteria: "SUBJID is not populated"
  Condition_Failure: "SUBJIDN is populated"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.3"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR816"
        Version: "1"
      Version: "5.0"
