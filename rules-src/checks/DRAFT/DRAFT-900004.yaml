Core:
  Id: "DRAFT-900004"
  Status: "Draft"
  Version: "1"
Description: "Raise an error when --HLGT is not empty but --HLGTCD is missing or not\
  \ present in dataset."
Executability: "Fully Executable"
Scope:
  Classes:
    Include:
    - "EVENTS"
  Use_Case: "INDH"
Requirements:
  Variables:
    All:
    - "--HLGT"
Check:
  expression: >-
    not empty(--HLGT) and empty(--HLGTCD)
Outcome:
  Message: "--HLGT is not empty but --HLGTCD is missing or not present in dataset."
  Message_Folded: "--HLGTCD absent or not populated in any record of the dataset,\
    \ and at least one record meets the rest of the condition: --HLGT is not empty\
    \ but --HLGTCD is missing or not present in dataset."
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "SDTMIG"
    Version: "3.4"
  - Name: "SDTMIG"
    Version: "3.3"
  - Name: "SDTMIG"
    Version: "3.2"
  - Name: "SENDIG"
    Version: "3.1.1"
  - Name: "TIG"
    Substandard: "SDTM"
    Version: "1.0"
