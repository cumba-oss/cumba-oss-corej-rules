- Organization: "CDISC"
  Standards:
  - Name: "SDTMIG"
    Version: "3.4"
  - Name: "SDTMIG"
    Version: "3.3"
  - Name: "SDTMIG"
    Version: "3.2"
  - Name: "SENDIG"
    Version: "3.1.1"
  - Name: "TIG"
    Substandard: "SDTM"
    Version: "1.0"
