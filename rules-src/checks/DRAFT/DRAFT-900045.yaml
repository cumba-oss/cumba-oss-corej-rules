Core:
  Id: "DRAFT-900045"
  Status: "Draft"
  Version: "1"
Description: "Raise an error when Subcategory for Disposition Event (DSSCAT) is not\
  \ present in the dataset although a subject has more than one record per Epoch (EPOCH)\
  \ with Category for Disposition Event (DSCAT) equal to 'DISPOSITION EVENT'."
Sensitivity: "Dataset"
Executability: "Fully Executable"
Scope:
  Classes:
    Include:
    - "EVENTS"
  Domains:
    Include:
    - "DS"
  Use_Case: "INDH"
Requirements:
  Variables:
    None:
    - "DSSCAT"
    All:
    - "DSCAT"
Check:
  expression: >-
    not is_unique_set([DSCAT, USUBJID, EPOCH]) and DSCAT == "DISPOSITION EVENT"
Outcome:
  Message: "DSSCAT is not present in the dataset although a subject has more than\
    \ one record per Epoch with DSCAT equal to 'DISPOSITION EVENT'; DSSCAT is required\
    \ to distinguish study-participation from study-treatment dispositions."
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "SDTMIG"
    Version: "3.4"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0535"
        Version: "1"
      Version: "2.0"
