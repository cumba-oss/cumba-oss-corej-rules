Core:
  Id: "DRAFT-900001"
  Status: "Draft"
  Version: "1"
Description: "Raise an error when --SOC is not empty but --SOCCD is missing or not\
  \ present in dataset."
Executability: "Fully Executable"
Scope:
  Classes:
    Include:
    - "EVENTS"
  Use_Case: "INDH"
Requirements:
  Variables:
    All:
    - "--SOC"
Check:
  expression: >-
    not empty(--SOC) and empty(--SOCCD)
Outcome:
  Message: "--SOC is not empty but --SOCCD is missing or not present in dataset."
  Message_Folded: "--SOCCD absent or not populated in any record of the dataset, and\
    \ at least one record meets the rest of the condition: --SOC is not empty but\
    \ --SOCCD is missing or not present in dataset."
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "SDTMIG"
    Version: "3.4"
  - Name: "SDTMIG"
    Version: "3.3"
  - Name: "SDTMIG"
    Version: "3.2"
  - Name: "SENDIG"
    Version: "3.1.1"
  - Name: "TIG"
    Substandard: "SDTM"
    Version: "1.0"
