  FDA|SDTMIG|3.4||SD1367|1:
  - Cited_Guidance: There should be at most one disposition event record per subject per Subcategory for Disposition Event (DSSCAT) per Epoch. If multiple disposition events are reported for a Subcategory for DSSCAT and EPOCH, the sponsor should identify a primary reason and use that to populate DSTERM and DSDECOD. Additional reasons should be submitted in SUPPDS.
