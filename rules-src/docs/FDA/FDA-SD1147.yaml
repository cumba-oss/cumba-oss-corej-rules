Core: FDA-SD1147
Citations:
  FDA|SDTMIG|3.4||SD1147|1:
  - Cited_Guidance: Pre-specified (--PRESP) variable should be included into dataset, when Occurrence (--OCCUR) variable is present. (--PRESP/Events) Used to indicate whether the event describe by --TERM was pre-specified on a CRF.  Value is Y for pre-specified events, null for spontaneously reported events. (--PRESP/Interventions) Used when a specific intervention is pre-specified on a CRF. Values should be 'Y' or null. (--OCCUR) Used to record whether a pre-specified event occurred when information about the occurrence of a specific event is solicited.
    Document: FDA Validator Rules v1.6
    Section: CG0088
