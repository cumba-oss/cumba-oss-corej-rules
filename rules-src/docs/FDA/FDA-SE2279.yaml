  FDA|SENDIG|3.1.1||SE2279|1:
  - Cited_Guidance: Time Point Reference (PCTPTREF) must identify a unique dose. Ambiguous references such as 'Most recent dose' should be avoided; it is recommended that Time Point Reference (PCTPTREF) include both the Nominal Study Day for Tabulations (PCNOMDY) and the time point description in order (e.g., “Day 1, Dose 1” and “Day 1, Dose 2” for twice daily dosing).
