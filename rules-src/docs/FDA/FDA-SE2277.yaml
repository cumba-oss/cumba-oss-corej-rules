Core: FDA-SE2277
Citations:
  FDA|SENDIG|3.1.1||SE2277|1:
  - Cited_Guidance: Due to SAS v5 transport file limitations, variables cannot have a length that is greater than 200 characters.  For SEND data, this results in loading errors into regulatory nonclinical review tools. The SENDIG should be followed in how to split long character strings appropriately.
    Document: FDA Validator Rules v1.6
    Section: '95, 95.1, 119, 281'
