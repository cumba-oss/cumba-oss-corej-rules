Core: FDA-SD1332
Citations:
  FDA|SDTMIG|3.4||SD1332|1:
  - Cited_Guidance: The Outcome of Adverse Event (AEOUT) variable is populated with the value NOT RECOVERED/NOT RESOLVED, however the End Date/Time of Adverse Event (AEENDTC) variable is populated with an end date for the adverse event. If the adverse event has an outcome of NOT RECOVERED/NOT RESOLVED, it is expected that no end date is available.
    Document: FDA Validator Rules v1.6
    Section: FDAB034
