Citations:
  FDA|SDTMIG|3.4||SD1445|1:
  - Cited_Guidance: "By its definition Last Observation Before Exposure Flag (--LOBXFL) should have only a single record for the same test for subject. Therefore, each subject (USUBJID) should have no more than one record with  Last Observation Before Exposure Flag (--LOBXFL) equals 'Y' for the same assessment which is defined by Test (--TESTCD), Category (--CAT), Subcategory (--SCAT), Position of Subject During Observation (--POS), Method (--METHOD), Specimen (--SPEC), Location (--LOC) and Laterality (--LAT)."
    Document: "FDA Validator Rules v1.6"
    Section: "FDAB026"
