Citations:
  FDA|SDTMIG|3.4||SD1347|1:
  - Cited_Guidance: Fatal Adverse Event records (AEOUT = 'FATAL') in the Adverse Events (AE) domain should have End Date/Time of Adverse Event (AEENDTC) equal to subject's Date/Time of Death (DTHDTC) populated in the Demographics (DM) domain. Subject's Date/Time of Death info should be consistent across all domains.
