Core: FDA-SE2268
Citations:
  FDA|SENDIG|3.1.1||SE2268|1:
  - Cited_Guidance: 'For subjects that have a disposition status in the Disposition (DS) domain that indicates an unscheduled death, the cause of death should be captured in the Death Diagnosis and Details (DD) domain. Standardized Disposition Term (DSDECOD) values for unscheduled death include: ACCIDENTAL DEATH, FOUND DEAD, MISSING, MORIBUND SACRIFICE, or NON-MORIBUND SACRIFICE. For SEND v3.1 and later, Unscheduled Flag (DSUSCHFL) should also be set to ''Y''.'
    Document: FDA Validator Rules v1.6
    Section: '167'
