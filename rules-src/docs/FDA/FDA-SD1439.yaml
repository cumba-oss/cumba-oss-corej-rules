Core: "FDA-SD1439"
Citations:
  FDA|SDTMIG|3.4||SD1439|1:
  - Cited_Guidance: "By its definition clinical baseline flags (e.g., last non-missing value prior to first dose) should have only a single record for the same test for subject. Therefore, each subject (USUBJID) should have no more than one record with Baseline Flag (--BLFL) equals 'Y' for the same assessment which is defined by Test (--TESTCD), Category (--CAT), Subcategory (--SCAT), Method (--METHOD), Specimen (--SPEC), Location (--LOC), Laterality (--LAT) and Directionality (--DIR)."
    Document: "FDA Validator Rules v1.6"
    Section: "FDAB026"
