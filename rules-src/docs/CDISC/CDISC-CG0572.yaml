Core: "CDISC-CG0572"
Citations:
  CDISC|SDTMIG|3.3||CG0572|1:
  - Cited_Guidance: "Within the context that defines uniqueness for a time point,\
      \ which may include domain, visit, and reference time point, there must be a\
      \ one-to-relationship between values of --TPT and --TPTNUM. in other words, if\
      \ domain, visit, and reference time point uniquely identify subject data, then\
      \ if two subjects have records with the same values of DOMAIN, VISITNUM, --TPTREF,\
      \ and --TPTNUM, then these records may not have different time point descriptions\
      \ in --TPT."
    Document: "IG v3.3"
    Section: "4.4.10"
