Core: "CDISC-SEND-0126"
Citations:
  CDISC|SENDIG|3.0||SEND126|1:
  - Cited_Guidance: "There are, by definition, no time gaps between Elements; therefore, the value SEENDTC for one Element will always be the same as the value of SESTDTC for the next Element.  Each Element continues until the time at which the next Element begins."
    Document: "SENDIG v3.0"
    Item: "Assumption 1"
    Section: "5.3.1.1"
