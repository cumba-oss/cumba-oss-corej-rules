Core: "CDISC-CG0459"
Citations:
  CDISC|SDTMIG|3.2||CG0459|1:
  - Cited_Guidance: "While it would be possible to allow a value such as NONE or UNBOUNDED\
      \ to be entered in TSVAL, validation programs would then have to recognize this\
      \ special term as an exception to the expected data format. Therefore, it was\
      \ decided that a separate null flavor variable that uses the ISO 21090 null\
      \ flavor terminology would be a better solution."
    Document: "IG v3.2"
    Section: "Section 7.4-TS: Use of Null Flavor Enumeration"
  CDISC|SDTMIG|3.3||CG0459|1:
  - Cited_Guidance: "The variable TSVALNF is based on the idea of a \"null flavor\"\
      \ as embodied in the ISO 21090 standard; \"Health Informatics' Harmonized data\
      \ types for information exchange.\" A null flavor is an ancillary piece of data\
      \ that provides additional information when its primary piece of data is null\
      \ (has a missing value). There is controlled terminology for the null flavor\
      \ data item which includes such familiar values as Unknown; Other; and Not Applicable\
      \ among its fourteen terms"
    Document: "IG v3.3"
    Section: "7.4.2.1"
