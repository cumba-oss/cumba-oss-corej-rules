Core: "CDISC-CG0120"
Citations:
  CDISC|SDTMIG|3.2||CG0120|1:
  - Cited_Guidance: "The values of ARM and ARMCD in DM must match entries in the Trial\
      \ Arms (TA) dataset, except for subjects who were not fully assigned to an Arm.\
      \ ... In trials where Arm assignment is done by means of two or more allocation\
      \ processes at separate points in time, subjects who drop out after the first\
      \ allocation process but before the last allocation process, should be assigned\
      \ values of ARMCD that reflect only the allocation processes they underwent."
    Document: "IG v3.2"
    Item: "Assumption 4"
    Section: "5"
