  CDISC|SDTMIG|3.2||CG0347|1:
  - Cited_Guidance: "Multiple Values for a Findings Result Variable. If multiple result\
      \ values (--ORRES) are reported for a test in a Findings class dataset; multiple\
      \ records should be submitted for that --TESTCD. Example: - EGTESTCD=RHYRATE;\
      \ EGTEST=Rhythm and Rate; EGORRES=ATRIAL FIBRILLATION. - EGTESTCD=RHYRATE; EGTEST=Rhythm\
      \ and Rate; EGORRES=ATRIAL FLUTTER"
    Document: "IG v3.2"
    Section: "4.1.2.8.2"
