Core: "CDISC-CG0347"
Citations:
  CDISC|SDTMIG|3.4||CG0347|1:
  - Cited_Guidance: "If multiple result values (--ORRES) are reported for a test in\
      \ a Findings class dataset, multiple records should be submitted for that --TESTCD.\
      \ When a finding can have multiple results, the key structure for the findings\
      \ dataset must be adequate to distinguish between the multiple results.  See\
      \ Section 4.1.9 Assigning Natural Keys in the Metadata."
    Document: "IG v3.4"
    Section: "4.2.8.2"
