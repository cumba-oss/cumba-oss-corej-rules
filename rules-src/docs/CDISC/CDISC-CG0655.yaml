  - Cited_Guidance: "The values of VISITNUM in the TV dataset are the valid values of\
      \ VISITNUM for planned Visits. Any values of VISITNUM that appear in subject-level\
      \ datasets that are not in the TV dataset are assumed to correspond to unplanned\
      \ Visits. This applies, in particular, to the subject-level Subject Visits (SV)\
      \ dataset; see SV under Section 5, Models for Special-Purpose Domains, for additional\
      \ information about handling unplanned Visits."
