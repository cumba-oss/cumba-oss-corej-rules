Core: "CDISC-CG0073"
Citations:
  CDISC|SDTMIG|3.2||CG0073|2:
  - Cited_Guidance: "When DSCAT='PROTOCOL MILESTONE', DSTERM and DSDECOD will contain\
      \ the same value drawn from the sponsor's controlled terminology. Examples of\
      \ controlled terms include 'INFORMED CONSENT OBTAINED' and 'RANDOMIZED.' EPOCH\
      \ should not be populated when DSCAT = \"PROTOCOL MILESTONE\"."
