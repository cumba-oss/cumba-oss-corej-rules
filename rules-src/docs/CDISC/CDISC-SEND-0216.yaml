Core: "CDISC-SEND-0216"
Citations:
  CDISC|SENDIG-GENETOX|1.0||SEND216|1:
  - Cited_Guidance: "Elements with different start and end rules are different Elements and must be represented as unique values in ELEMENT and ETCD (i.e., Elements involving the same treatment but different durations are different Elements). The same applies to nontreatment Elements (e.g., a washout with a fixed duration of 14 days is different from a washout that ends after 7 days if drug cannot be detected in a blood sample or after 14 days if drug can be detected in a blood sample)....Additional factors beyond treatment, start rule, and either end rule or duration do not distinguish separate Elements."
    Document: "SENDIG v3.1.1"
    Item: "Assumption 2 | Assumption 4"
    Section: "7.2.1.1"
