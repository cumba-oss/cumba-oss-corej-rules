Core: "CDISC-CG0348"
Citations:
  CDISC|SDTMIG|3.4||CG0348|1:
  - Cited_Guidance: "The --ORRES variable contains the result of the measurement or\
      \ finding as originally received or collected. --ORRES is an expected variable\
      \ and should always be populated, with two exceptions:\n\nWhen --STAT = \"NOT\
      \ DONE\" since there is no result for such a record\nWhen --DRVFL = \"Y\" since\
      \ the distinction between an original result and a standard result is not applicable\
      \ for records for which --DRVFL = \"Y\"."
    Document: "IG v3.4"
    Section: "4.5.1.1"
  CDISC|SDTMIG|3.3||CG0348|1:
  - Cited_Guidance: "The --ORRES variable contains the result of the measurement or\
      \ finding as originally received or collected. --ORRES is an expected variable\
      \ and should always be populated; with two exceptions: When --STAT = 'NOT DONE'.\
      \ --ORRES should generally not be populated for derived records."
    Document: "IG v3.3"
    Section: "4.5.1.1"
  CDISC|SDTMIG|3.2||CG0348|1:
  - Cited_Guidance: "The --ORRES variable contains the result of the measurement or\
      \ finding as originally received or collected. --ORRES is an expected variable\
      \ and should always be populated; with two exceptions: When --STAT = 'NOT DONE'.\
      \ --ORRES should generally not be populated for derived records."
    Document: "IG v3.2"
