Core: "CDISC-SEND-0416"
Citations:
  CDISC|SENDIG-DART|1.2||SEND416|1:
  - Cited_Guidance: "Typically, other measurements such as Body Weight are captured\
      \ on the day that a subject reaches a particular milestone. Such results would\
      \ be listed in their respective domains and should not be included in this domain.\
      \ For example, if a milestone body weight is captured on the day of reaching\
      \ sexual maturity, then the positive sexual maturity result would be recorded\
      \ in the DP domain and the body weight would be recorded in the BW domain."
    Document: "SENDIG-DART v1.2"
    Section: "5.5.2"
    Item: "Assumption 2"
