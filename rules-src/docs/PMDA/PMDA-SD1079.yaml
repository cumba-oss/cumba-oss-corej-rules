  - Cited_Guidance: "PMDA Severity: Warning. The order of variables should reflect the order of the variables in the SDTM Model. Variables for the three general observation classes must be ordered with Identifiers first, followed by the Topic, Qualifier, and Timing variables. Within each role, variables must be ordered as shown in SDTM: Tables 2.2.1, 2.2.2, 2.2.3, 2.2.4, and 2.2.5."
