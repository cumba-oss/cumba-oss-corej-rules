Core: PMDA-AD0273
Citations:
  PMDA|ADaMIG|1.0||AD0273|1:
  - Cited_Guidance: 'PMDA Severity: Error. For additional Flag (AOCCzzFL) variables representing the 1st Occurrence of an analysis event or datapoint, zz must be nth flag variable (01 to 99). The main purpose of these flags is to facilitate data point traceability between records in the dataset and unique counts in the summary displays. In addition, if a Time to Event (TTE) Analysis dataset is built off of Adverse Events, the flags provide a crucial link between the summary records in the TTE BDS and the source of the records in ADAE. If the producer of the ADAE dataset has standard programs in place to summarize unique counts of events, then they may choose not to create these flags.'
    Document: PMDA Validation Rules v6.0
    Section: AD0273
