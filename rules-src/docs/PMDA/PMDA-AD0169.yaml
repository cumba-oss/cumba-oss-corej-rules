Core: PMDA-AD0169
Citations:
  PMDA|ADaMIG|1.0||AD0169|1:
  - Cited_Guidance: 'PMDA Severity: Error. Censor (CNSR) value must be an integer. Defines whether the event was censored (period of observation truncated prior to event being observed). It is strongly recommended to use 0 as an event indicator and positive integers as censoring indicators. It is also recommended that unique positive integers be used to indicate coded descriptions of censoring reasons. CNSR is required for time-to-event parameters.'
    Document: PMDA Validation Rules v6.0
    Section: AD0169
