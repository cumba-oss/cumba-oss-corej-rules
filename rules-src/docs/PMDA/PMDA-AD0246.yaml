  - Cited_Guidance: 'PMDA Severity: Error. When Censor (CNSR) variable is present, the Time-to-Event Origin Date for Subject (STARTDT) and one of Analysis Date (ADT) or Analysis Datetime (ADTM) variables must be included in the dataset. In Time to Event studies, the basis of analysis is the time from a defined starting point to the time of occurrence of the event of interest.'
