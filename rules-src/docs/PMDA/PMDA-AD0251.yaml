Core: PMDA-AD0251
Citations:
  PMDA|ADaMIG|1.0||AD0251|1:
  - Cited_Guidance: 'PMDA Severity: Error. In Time to Event studies, Censor Date Description (CNSDTDSC) variable describes the circumstance represented by the censoring date if different from the event date that warrants censoring. If present, Censor (CNSR) variable must be present. Note that adding CNSDTDSC provides additional information when there is a difference between the event date that warrants censoring and the actual date of censoring. If the event that warrants censoring is the same as the onset date of the event that represents the censoring date, then the CNSDTDSC column is not needed in the analysis dataset.'
    Document: PMDA Validation Rules v6.0
    Section: AD0251
