Core: PMDA-SD0080
Citations:
  PMDA|SDTMIG|3.1.2||SD0080|1:
  - Cited_Guidance: "PMDA Severity: Warning. Start Date/Time of Adverse Event (AESTDTC) should be less than or equal to the Start Date/Time of the latest Disposition Event (DSSTDTC). Investigator should provide a date of study discontinuation for each subject in Disposition (DS) domain. If the study is ongoing, Parameter Value (TSVAL) for the 'ONGOSIND/Ongoing Study Indicator' parameter should be set to 'Y' in the Trial Summary (TS) domain."
