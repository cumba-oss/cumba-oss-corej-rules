Rule_Id: "DEFINE-XML-0254"
Sheet_Rule_Identifier: "254"
Rule_Set: "CDISC"
Element: "ODM"
Attribute: "CreationDateTime"
Applicable_Versions: ["2.0", "2.1"]
Source_Type: "Schema"
Plain_Text_Rule: "A valid CreationDateTime attribute  must be provided for the ODM element."
# Detection of a MISSING CreationDateTime is DEFINE-XML-0013; this rule owns the
# invalid-value half of sheet row 254 (value-kinds fire only on present values).
Message: "The ODM CreationDateTime attribute value [${value}] is not a valid ISO 8601 datetime."
Check:
  kind: "matches_regex"
  attribute: "CreationDateTime"
  format: "iso8601-datetime"
