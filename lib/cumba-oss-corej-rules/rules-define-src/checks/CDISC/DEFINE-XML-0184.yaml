Rule_Id: "DEFINE-XML-0184"
Sheet_Rule_Identifier: "184"
Rule_Set: "CDISC"
Element: "EnumeratedItem"
Attribute: "OrderNumber"
Applicable_Versions: ["2.0", "2.1"]
Source_Type: "Schema"
Plain_Text_Rule: "The value of attribute OrderNumber must be an integer number."
# Value check fires only on a present OrderNumber (presence is sheet id 185).
Message: "The value of attribute OrderNumber [${value}] is not an integer number for the EnumeratedItem element."
Check:
  kind: "matches_regex"
  attribute: "OrderNumber"
  format: "integer"
