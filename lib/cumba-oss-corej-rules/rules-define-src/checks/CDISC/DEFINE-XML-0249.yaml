Rule_Id: "DEFINE-XML-0249"
Sheet_Rule_Identifier: "249"
Rule_Set: "CDISC"
Element: "CodeList"
Attribute: "Context"
Applicable_Versions: ["2.1"]
Source_Type: "Specification"
Plain_Text_Rule: "There must be an Alias element with the Context Attribute nci:ExtCodeID when the Codelist includes a reference to a CDISC Controlled Terminology Standard."
# Custom check (counts against the corpus-wide custom budget of 15; running
# count tracked by the coordinator): the sheet's formal Rule is a COUNT
# over attribute-filtered children — "if Codelist/@def:StandardOID is non-null,
# count(Alias[@Context='nci:ExtCodeID']) = 1" — which no declarative kind can
# express (cardinality_at_most cannot filter children by attribute; the
# when-grammar is any-match and cannot count). The when guard carries the
# StandardOID condition; the class enforces exactly-one. Message deviation
# (documented): "not exactly one" instead of the sheet's "Missing", because the
# sheet's count(...)=1 form also outlaws duplicates; the def:Standard name
# placeholder is carried by the finding's xpath.
Message: "There is not exactly one Alias element with Context attribute 'nci:ExtCodeID' for the CodeList referencing a CDISC Controlled Terminology standard."
Check:
  kind: "custom"
  className: "net.cumba.corej.define.conformance.checks.CodeListStandardAliasCheck"
  when:
    path: "@StandardOID"
    exists: true
