Rule_Id: "PMDA-DD0049"
Sheet_Rule_Identifier: "DD0049"
Rule_Set: "PMDA"
Element: "ItemGroupDef"
Attribute: null
Applicable_Versions: ["2.0", "2.1"]
Severity: "Error"
Plain_Text_Rule: "For SDTM and SEND submission data and for datasets that are not SUPPQUAL and not split (where def:StandardName is 'SDTM-IG' or 'SEND-IG' and only one ItemGroupDef exists for the Domain), Name, Domain, and SASDatasetName attributes must have the same value. Note: Refer to the data standards catalog by the relevant Regulatory Agency for acceptance of standards and their versions."
# Custom (budget 4/15): "only one ItemGroupDef exists for the Domain" needs
# document-wide counting, outside the DSL - semantics on the check class
# (SUPP/SQAP exclusion, absent-SASDatasetName skip, case-sensitive equality).
# The SDTM/SEND standard-family condition is this guard, DD0053's shape:
# 2.0 via the enclosing MetaDataVersion's def:StandardName (all SEND-IG sheet
# variants admitted, as in DD0053), 2.1 via def:StandardOID dereferenced to the
# def:Standard whose Name begins with SDTM/SEND. Related CDISC rows 0110
# (SASDatasetName=Name, unconditional) and 0095 (Alias when Domain!=Name)
# check different obligations - partial overlap only.
Message: "Name/Domain/SASDatasetName mismatch"
Check:
  kind: "custom"
  className: "net.cumba.corej.define.conformance.checks.NonSplitDatasetNameConsistencyCheck"
  when:
    any:
    - path: "../@StandardName"
      oneOf: ["SDTM-IG", "SEND-IG", "SEND-IG-AR", "SEND-IG-DART", "SEND-IG-GENETOX"]
    - path: "@StandardOID->Standard@OID/@Name"
      matchesRegex: "(SDTM|SEND).*"
