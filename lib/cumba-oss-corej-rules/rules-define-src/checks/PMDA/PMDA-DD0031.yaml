Rule_Id: "PMDA-DD0031"
Sheet_Rule_Identifier: "DD0031"
Rule_Set: "PMDA"
Element: "CodeList"
Attribute: "Name"
Applicable_Versions: ["2.0"]
Severity: "Error"
Requires: "ct"
Plain_Text_Rule: "NCI Code is required for each Codelist that is defined in CDISC Controlled Terminology. Define-XML specification represents NCI Code as Name attribute on Alias element when Context attribute is \"nci:ExtCodeID\"."
# CT-gated (P5). 2.0-only per the sheet's version marks. "Defined in CDISC
# Controlled Terminology" is operationalised as the CodeList's Name resolving
# via CtProvider.codelistByName - the missing nci:ExtCodeID alias is exactly
# what the rule detects, so the alias cannot be the identification vehicle.
# A name unknown to CT produces no finding (conservative). Twin: CDISC 97
# (reclassified as a library-gap there - the CDISC row additionally requires
# per-variable CT-requirement knowledge from the IG).
Message: "Missing NCI Code for Codelist ${value}"
Check:
  kind: "nci_alias_required"
  level: "codelist"
