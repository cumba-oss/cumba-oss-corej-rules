Rule_Id: "PMDA-OD0032"
Sheet_Rule_Identifier: "OD0032"
Rule_Set: "PMDA"
Element: "CodeList"
Attribute: "OID"
Applicable_Versions: ["2.0", "2.1"]
Severity: "Error"
Plain_Text_Rule: "The OID attribute for CodeList (the CodeList ID) must be unique within Define.xml. Define-XML specification represents Codelists as CodeList elements within MetaDataVersion element."
# Sheet scope is "within Define.xml" => document-wide.
Message: "Duplicate Codelist OID [${value}]"
Check:
  kind: "unique_in_document"
  attribute: "OID"
