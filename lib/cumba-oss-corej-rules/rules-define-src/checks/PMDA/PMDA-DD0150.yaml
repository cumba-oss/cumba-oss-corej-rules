Rule_Id: "PMDA-DD0150"
Sheet_Rule_Identifier: "DD0150"
Rule_Set: "PMDA"
Element: "Document"
Attribute: null
Applicable_Versions: ["2.1"]
Severity: "Reject"
Plain_Text_Rule: "Invalid combination of def:Standard elements found in a v2.1 define.xml file. For SEND, at least two Standards must be defined: (1) where Type='IG' and Name begins with 'SENDIG' and (2) where Type='CT' and PublishingSet='SEND'. For SDTM, at least two Standards must be defined: (1) where Type='IG' and Name='SDTMIG' and (2) where Type='CT' and PublishingSet='SDTM'. For ADaM, at least two Standards must be defined: (1) where Type='IG' and Name='ADaMIG', and (2) where Type='CT' and PublishingSet='SDTM' or where Type='CT' and PublishingSet='ADaM'."
# Custom (document-level cross-conditional family matching): for whichever
# data-standard family an IG def:Standard declares (SENDIG / SDTMIG / ADaMIG),
# the matching CT def:Standard (PublishingSet SEND / SDTM / SDTM|ADaM) must also
# be present. The IG Name prefix determines the required CT PublishingSet - a
# conjunction on one element that the path grammar cannot express, hence custom.
Message: "Missing expected Standard"
Check:
  kind: "custom"
  className: "net.cumba.corej.define.conformance.checks.StandardsCombinationCheck"
