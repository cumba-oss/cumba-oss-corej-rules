Rule_Id: "PMDA-OD0079-B"
Sheet_Rule_Identifier: "OD0079"
Rule_Set: "PMDA"
Element: "CodeListItem"
Attribute: "CodedValue"
Applicable_Versions: ["2.0", "2.1"]
Severity: "Error"
Plain_Text_Rule: "The Term must be unique within a Codelist. Define-XML specification represents Term as CodedValue attribute on either EnumeratedItem or CodeListItem elements within CodeList element."
# Companion of PMDA-OD0079 (one sheet row, two rules): the CodeListItem leg.
Message: "Duplicate Term [${value}] in Codelist"
Check:
  kind: "unique_among_siblings"
  attribute: "CodedValue"
