Rule_Id: "PMDA-DD0055"
Sheet_Rule_Identifier: "DD0055"
Rule_Set: "PMDA"
Element: "ItemGroupDef"
Attribute: "Class"
Applicable_Versions: ["2.0"]
Severity: "Error"
Plain_Text_Rule: "For Define-XML 2.0, the Class attribute must have a value of 'SPECIAL PURPOSE', 'FINDINGS', 'FINDINGS ABOUT', 'EVENTS', 'INTERVENTIONS', 'TRIAL DESIGN', or 'RELATIONSHIP' for SDTM and SEND data and 'SUBJECT LEVEL ANALYSIS DATASET', 'BASIC DATA STRUCTURE', 'OCCURRENCE DATA STRUCTURE' (IG v1.1 and above), or 'ADAM OTHER' for ADaM data. For Define-XML 2.1, the Class attribute must have a value that is found in the GNRLOBSC (C103329) codelist in Define-CT. Note: Refer to the data standards catalog by the relevant Regulatory Agency for acceptance of standards and their versions."
# 2.0 legs only (this: SDTM/SEND set; -B: ADaM set), on the 2.0 @def:Class
# attribute, guarded by the enclosing MetaDataVersion's def:StandardName. The
# 2.1 half binds def:Class/@Name to the GNRLOBSC (C103329) codelist in
# Define-CT - CT-publication-dependent (the CDISC review CT-gated the twin,
# sheet id 132, for exactly this reason), so it is DEFERRED to batch P5. The
# sheet's '(IG v1.1 and above)' parenthetical on OCCURRENCE DATA STRUCTURE is
# not enforceable here (no IG-version input) - value admitted unconditionally.
Message: "Invalid Class value"
Check:
  kind: "one_of"
  attribute: "Class"
  values: ["SPECIAL PURPOSE", "FINDINGS", "FINDINGS ABOUT", "EVENTS", "INTERVENTIONS", "TRIAL DESIGN", "RELATIONSHIP"]
  when:
    path: "../@StandardName"
    oneOf: ["SDTM-IG", "SEND-IG", "SEND-IG-AR", "SEND-IG-DART", "SEND-IG-GENETOX"]
