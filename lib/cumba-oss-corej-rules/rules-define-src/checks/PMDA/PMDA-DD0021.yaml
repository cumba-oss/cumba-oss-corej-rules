Rule_Id: "PMDA-DD0021"
Sheet_Rule_Identifier: "DD0021"
Rule_Set: "PMDA"
Element: "MetaDataVersion"
Attribute: "StandardName"
Applicable_Versions: ["2.0"]
Severity: "Reject"
Plain_Text_Rule: "Allowable values of Standard Name are: Values from the STDNAM Codelist in Define-CT for Define-XML v2.1, 'SDTM-IG', 'SEND-IG', 'SEND-IG-AR', 'SEND-IG-DART', 'SEND-IG-GENETOX', 'ADaM-IG', or 'BIMO' for Define-XML v2.0, or 'CDISC SDTM', 'CDISC SEND', or 'CDISC ADaM' for Define-XML v1.0. Values must conform to this list of values. Note: Refer to the data standards catalog by the relevant Regulatory Agency for acceptance of standards and their versions."
# 2.0 leg only: the sheet's 2.0 name set is closed and printed inline, so it is
# a plain one_of on MetaDataVersion/@def:StandardName. The 2.1 leg binds the
# def:Standard/@Name to the STDNAM codelist in Define-CT - CT-publication-
# dependent (same reasoning as the CDISC review's CT-gating of sheet id 132),
# so it is DEFERRED to batch P5 (Requires: ct / term_in_ct_codelist). The 1.0
# value set is out of scope (the validator handles 2.0/2.1 documents only).
Message: "Invalid Standard Name value ${value}"
Check:
  kind: "one_of"
  attribute: "StandardName"
  values: ["SDTM-IG", "SEND-IG", "SEND-IG-AR", "SEND-IG-DART", "SEND-IG-GENETOX", "ADaM-IG", "BIMO"]
