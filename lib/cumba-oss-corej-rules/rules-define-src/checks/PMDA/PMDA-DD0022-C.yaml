Rule_Id: "PMDA-DD0022-C"
Sheet_Rule_Identifier: "DD0022"
Rule_Set: "PMDA"
Element: "Standard"
Attribute: "Version"
Applicable_Versions: ["2.1"]
Severity: "Reject"
Plain_Text_Rule: "Standard Version must have a valid value for the given Standard Name. Allowed values are '3.1.2', '3.1.3', '3.2', '3.3', or '3.4' for SDTM-IG, '3.0', '3.1', or '3.1.1' for SEND-IG, '1.0' for SEND-IG-AR, '1.1' for SEND-IG-DART, '1.0' for SEND-IG-GENETOX, '1.0', '1.1', '1.2', or '1.3' for ADaM-IG, and '1.0' for BIMO. Define-XML specification represents Standard Version as def:StandardVersion attribute on MetaDataVersion element. Note: Refer to the data standards catalog by the relevant Regulatory Agency for acceptance of standards and their versions."
# One sheet row, per-standard version sets: standards sharing one allowed set
# share one leg (0140/0160 version-split convention; base + -B..-E = 2.1 legs
# on def:Standard/@Version, -F..-J = 2.0 legs on MetaDataVersion). The sheet is
# worded in 2.0 standard names; the 2.1 guard accepts both the hyphenated sheet
# spelling and the Define-CT STDNAM spelling (judgment call, DD0045 precedent).
# Value check fires only on a present Version; CT-type def:Standard elements
# (Name 'CDISC/NCI' etc.) never match the guard.
Message: "Invalid Standard Version value ${value} for ADaM-IG"
Check:
  kind: "one_of"
  attribute: "Version"
  values: ["1.0", "1.1", "1.2", "1.3"]
  when:
    path: "@Name"
    oneOf: ["ADaMIG", "ADaM-IG"]
