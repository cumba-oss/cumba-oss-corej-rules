name: CDISC-AD0407
kind: rule
description: |
  Wave A4 port — T1a PlainSimple.
  CDISC-AD0407: ABLFN is populated while ABLFL is empty.
  Record-data rule scoped to BASIC DATA STRUCTURE; non_empty + empty pair.
python_source: rules-adamig-1-3.json (CDISC-AD0407)
rule:
  coreId: CDISC-AD0407
datasets:
  ADLB:
    row_key: [STUDYID, USUBJID, PARAMCD]
    rows:
      - {STUDYID: S1, USUBJID: '001', PARAMCD: 'HGB', ABLFN: '', ABLFL: ''}      # ok
      - {STUDYID: S1, USUBJID: '002', PARAMCD: 'HGB', ABLFN: '1', ABLFL: ''}     # bad
config:
  standard: adamig
  standard_version: '1.3'
library_mocks:
  classes:
    basic data structure: [ADLB]
expected_violations:
  - rule_id: CDISC-AD0407
    dataset: ADLB
    row_key: {PARAMCD: HGB, STUDYID: S1, USUBJID: '002'}
    status: SUCCESS
    output_variables:
      ABLFL: null
      ABLFN: '1'
expected_errors: []
