name: CDISC-AD0415
kind: rule
description: |
  Wave A4 port — T1a PlainSimple.
  CDISC-AD0415: TRTSEQPN is populated while TRTSEQP is empty.
  Record-data rule scoped to SUBJECT LEVEL ANALYSIS DATASET; non_empty + empty pair.
python_source: rules-adamig-1-3.json (CDISC-AD0415)
rule:
  coreId: CDISC-AD0415
datasets:
  ADSL:
    row_key: [STUDYID, USUBJID]
    rows:
      - {STUDYID: S1, USUBJID: '001', TRTSEQPN: '', TRTSEQP: ''}      # ok
      - {STUDYID: S1, USUBJID: '002', TRTSEQPN: '1', TRTSEQP: ''}     # bad
config:
  standard: adamig
  standard_version: '1.3'
library_mocks:
  classes:
    subject level analysis dataset: [ADSL]
expected_violations:
  - rule_id: CDISC-AD0415
    dataset: ADSL
    row_key: {STUDYID: S1, USUBJID: '002'}
    status: SUCCESS
    output_variables:
      TRTSEQP: null
      TRTSEQPN: '1'
expected_errors: []
