  Rule-body quirk: uses 'greater_than' (numeric compare) on datetime strings; Java's numeric
  operator rejects unparseable strings, Python's business_rules bare-leaf path raises
  KeyError: 'name'. Both engines emit zero violations, so expected_violations = [].
python_source: rules-adamig-1-3.json (CDISC-AD0362)
rule:
