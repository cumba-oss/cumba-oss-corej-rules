name: OPGAP-shares-at-least-one-element-with
kind: check_operator
description: |
  The corpus's FIRST `expected_status: ERROR` pin, and its first non-empty `expected_errors`.

  Authored by PLAN-parity-expected-errors as the follow-up its §2.3 asked for: until an ERROR
  pin existed anywhere in the corpus, the errors channel could only ever assert "Java produced
  no error message", which the status channel already implied. This spec is what makes the
  channel assert something on the Java lane.

  WHAT IT PINS — a real operator-support gap, not malformed input. The fork implements
  `shares_at_least_one_element_with` (cdisc_rules_engine/check_operators/dataframe_operators.py
  :2272) and evaluates it here; the Java engine has no such operator, so `RulePackageLoader
  .installNativeExpr` raises no expression and the Check carries no native form. Since the
  legacy evaluator was retired, `RuleRunner` reports a rule-level ERROR rather than silently
  evaluating on a removed engine. Zero shipped rules use the operator (verified by grep over
  rules-legacy), so this is externally-supplied-rule territory — exactly the case RuleRunner's
  missing-checkExpr branch was written for.

  WHY THAT IS THE CONTRACT WORTH PINNING. The failure mode this guards against is the engine
  quietly *passing* a rule it cannot evaluate. A `--rules-dir` user supplying a rule with an
  unsupported operator must get a loud per-rule ERROR carrying a reason, not zero findings that
  read as "your data is clean".

  WHY THE `errors` CHANNEL IS WHAT MAKES IT MEANINGFUL. `expected_status: ERROR` alone would
  still be satisfied if the rule started erroring for an entirely different cause — a load
  error, or the RELREC/key-expansion conflict. `expected_errors: [NO_NATIVE_CHECK_EXPR]` says
  *which*, so a future engine change that alters the cause is a red rather than a silent pass.
  That is the whole claim of PLAN-parity-expected-errors, and this is the spec that exercises
  it on the Java lane.

  LANE DIVERGENCE. The comparator operand is a COLUMN reference (the fork's operator reads
  `row[comparator]`, so a literal would raise KeyError and degrade to SKIPPED — which is not
  the gap being pinned). AETERM and AEDECOD deliberately share no element on any row, so Python
  evaluates the operator to all-false and reports NO violations. Violations therefore AGREE
  across lanes and the violation channel stays asserted normally; only `status` and `errors`
  diverge, and only on the Python side. Recorded in parity-diff-baseline.json with
  `lane: python`, `channels: ["status", "errors"]`.
check:
  name: AETERM
  operator: shares_at_least_one_element_with
  value: AEDECOD
datasets:
  AE:
    row_key: [STUDYID, USUBJID, AESEQ]
    rows:
      - {STUDYID: "S1", USUBJID: "001", AESEQ: 1, AETERM: "HEADACHE", AEDECOD: "NAUSEA"}
      - {STUDYID: "S1", USUBJID: "002", AESEQ: 1, AETERM: "RASH", AEDECOD: "PYREXIA"}
config:
  standard: sdtmig
  standard_version: "3.4"
expected_status: ERROR
expected_violations: []
expected_errors:
  - NO_NATIVE_CHECK_EXPR
