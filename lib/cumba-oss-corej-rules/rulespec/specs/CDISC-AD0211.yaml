name: CDISC-AD0211
kind: rule
description: |
  A2 port — T1a PlainSimple. BDS: ABLFN is populated and not equal to 1.
python_source: rules-adamig-1-3.json (CDISC-AD0211)
rule:
  coreId: CDISC-AD0211
datasets:
  ADLB:
    row_key: [STUDYID, USUBJID, PARAMCD, AVISITN]
    column_types:
      AVISITN: LONG
      ABLFN: LONG
    rows:
      - {STUDYID: S1, USUBJID: '001', PARAMCD: 'HGB', AVISITN: 1, ABLFN: 1}  # ok
      - {STUDYID: S1, USUBJID: '002', PARAMCD: 'HGB', AVISITN: 1, ABLFN: 2}  # bad
config:
  standard: adamig
  standard_version: '1.3'
library_mocks:
  classes:
    basic data structure: [ADLB]
expected_violations:
  - rule_id: CDISC-AD0211
    dataset: ADLB
    row_key: {STUDYID: S1, USUBJID: '002', PARAMCD: 'HGB', AVISITN: 1}
    status: SUCCESS
    output_variables:
      ABLFN: '2'
expected_errors: []
