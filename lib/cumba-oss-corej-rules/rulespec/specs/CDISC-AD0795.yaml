name: CDISC-AD0795
kind: rule
description: |
  Wave A9 port — T1a PlainSimple.
  CDISC-AD0795: PROJID is populated and PROJIDN is not populated.
  Record-data rule scoped to BASIC DATA STRUCTURE; non_empty + empty pair.
python_source: rules-adamig-1-3.json (CDISC-AD0795)
rule:
  coreId: CDISC-AD0795
datasets:
  ADLB:
    row_key: [STUDYID, USUBJID, PARAMCD]
    rows:
      - {STUDYID: S1, USUBJID: '001', PARAMCD: 'HGB', PROJID: '', PROJIDN: ''}      # ok
      - {STUDYID: S1, USUBJID: '002', PARAMCD: 'HGB', PROJID: 'X', PROJIDN: ''}     # bad
config:
  standard: adamig
  standard_version: '1.3'
library_mocks:
  classes:
    basic data structure: [ADLB]
expected_violations:
  - rule_id: CDISC-AD0795
    dataset: ADLB
    row_key: {PARAMCD: HGB, STUDYID: S1, USUBJID: '002'}
    status: SUCCESS
    output_variables:
      PROJID: 'X'
      PROJIDN: null
expected_errors: []
