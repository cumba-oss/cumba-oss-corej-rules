name: CDISC-AD0209
kind: rule
description: |
  Wave C2 port — T2-MD (Match_Datasets without Operations).
  CDISC-AD0209: ADSL.SITEID must equal DM.SITEID for the matching subject (USUBJID).
  Class-scoped rule (SUBJECT LEVEL ANALYSIS DATASET). Bare-leaf Check (no outer
  all/any wrapper) — Finding #26 quirk on Python's business_rules lane.
python_source: rules-adamig-1-3.json (CDISC-AD0209)
rule:
  coreId: CDISC-AD0209
datasets:
  ADSL:
    row_key: [STUDYID, USUBJID]
    rows:
      - {STUDYID: S1, USUBJID: '001', SITEID: '100'}    # ok — matches DM.SITEID
      - {STUDYID: S1, USUBJID: '002', SITEID: '999'}    # bad — DM.SITEID is '200'
  DM:
    row_key: [STUDYID, USUBJID]
    rows:
      - {STUDYID: S1, DOMAIN: DM, USUBJID: '001', SITEID: '100'}
      - {STUDYID: S1, DOMAIN: DM, USUBJID: '002', SITEID: '200'}
config:
  standard: adamig
  standard_version: '1.3'
library_mocks:
  classes:
    subject level analysis dataset: [ADSL]
    special-purpose: [DM]
expected_violations:
  - rule_id: CDISC-AD0209
    dataset: ADSL
    row_key: {STUDYID: S1, USUBJID: '002'}
    status: SUCCESS
    output_variables:
      SITEID: '999'
      DM.SITEID: '200'
expected_errors: []
