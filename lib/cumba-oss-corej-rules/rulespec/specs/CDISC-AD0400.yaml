name: CDISC-AD0400
kind: rule
description: |
  Wave B2 port — T1b PlainIntermediate.
  CDISC-AD0400: Within a parameter, there is more than one value of ATOXGRHN for a given value of ATOXGRH.
  Bare-leaf Check (`has_multiple_values_for` with `within: PARAMCD`) scoped to BASIC DATA STRUCTURE.
  Two rows share the same ATOXGRH value but distinct ATOXGRHN; both fire. A third row is unique and does not fire.
  Bare-leaf Check raises `KeyError: 'name'` on Python's business_rules library (Finding #26); Python lane baseline expected.
python_source: rules-adamig-1-3.json (CDISC-AD0400)
rule:
  coreId: CDISC-AD0400
datasets:
  ADLB:
    row_key: [STUDYID, USUBJID, PARAMCD, AVISITN]
    column_types:
      AVISITN: LONG
    rows:
      - {STUDYID: S1, USUBJID: '001', PARAMCD: 'HGB', AVISITN: 1, ATOXGRHN: 'X', ATOXGRH: 'A'}   # bad
      - {STUDYID: S1, USUBJID: '002', PARAMCD: 'HGB', AVISITN: 1, ATOXGRHN: 'Y', ATOXGRH: 'A'}   # bad (distinct ATOXGRHN for same ATOXGRH within PARAMCD)
      - {STUDYID: S1, USUBJID: '003', PARAMCD: 'HGB', AVISITN: 1, ATOXGRHN: 'Z', ATOXGRH: 'B'}   # ok (unique ATOXGRH)
config:
  standard: adamig
  standard_version: '1.3'
library_mocks:
  classes:
    basic data structure: [ADLB]
expected_violations:
  - rule_id: CDISC-AD0400
    dataset: ADLB
    row_key: {STUDYID: S1, USUBJID: '001', PARAMCD: 'HGB', AVISITN: 1}
    status: SUCCESS
    output_variables:
      PARAMCD: 'HGB'
      ATOXGRHN: 'X'
      ATOXGRH: 'A'
  - rule_id: CDISC-AD0400
    dataset: ADLB
    row_key: {STUDYID: S1, USUBJID: '002', PARAMCD: 'HGB', AVISITN: 1}
    status: SUCCESS
    output_variables:
      PARAMCD: 'HGB'
      ATOXGRHN: 'Y'
      ATOXGRH: 'A'
expected_errors: []
