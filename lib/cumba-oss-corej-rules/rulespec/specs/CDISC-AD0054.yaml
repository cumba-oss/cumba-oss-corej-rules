name: CDISC-AD0054
kind: rule
description: |
  Wave B1 port - T1b PlainIntermediate.
  CDISC-AD0054: Within ADSL there is more than one record for a unique value of USUBJID.
  Single-leaf is_not_unique_set check on USUBJID within SUBJECT LEVEL ANALYSIS DATASET.
  Bare-leaf Check at top level - Python business-rules lib raises KeyError on the
  un-wrapped leaf; expected_violations match Java's output. Baseline on Python lane
  per key-context finding.
python_source: rules-adamig-1-3.json (CDISC-AD0054)
rule:
  coreId: CDISC-AD0054
datasets:
  ADSL:
    row_key: [STUDYID, USUBJID]
    rows:
      - {STUDYID: S1, USUBJID: '001'}
      - {STUDYID: S1, USUBJID: '002'}
      # Duplicate USUBJID - both rows fire under is_not_unique_set
      - {STUDYID: S1, USUBJID: '003'}
      - {STUDYID: S1, USUBJID: '003'}
config:
  standard: adamig
  standard_version: '1.3'
library_mocks:
  classes:
    subject level analysis dataset: [ADSL]
expected_violations:
  - rule_id: CDISC-AD0054
    dataset: ADSL
    row_key: {STUDYID: S1, USUBJID: '003'}
    status: SUCCESS
    output_variables:
      USUBJID: '003'
  - rule_id: CDISC-AD0054
    dataset: ADSL
    row_key: {STUDYID: S1, USUBJID: '003'}
    status: SUCCESS
    output_variables:
      USUBJID: '003'
expected_errors: []
