name: CDISC-AD0488
kind: rule
description: |
  Wave A7 port — T1a PlainSimple.
  CDISC-AD0488: On a given record, ONTRTFL is populated and ONTRTFN is not populated.
  Record-data rule scoped to BDS/OCCDS; non_empty + empty pair.
python_source: rules-adamig-1-3.json (CDISC-AD0488)
rule:
  coreId: CDISC-AD0488
datasets:
  ADLB:
    row_key: [STUDYID, USUBJID, PARAMCD]
    rows:
      - {STUDYID: S1, USUBJID: '001', PARAMCD: 'HGB', ONTRTFL: '',  ONTRTFN: ''}   # ok
      - {STUDYID: S1, USUBJID: '002', PARAMCD: 'HGB', ONTRTFL: 'Y', ONTRTFN: ''}   # bad
config:
  standard: adamig
  standard_version: '1.3'
library_mocks:
  classes:
    basic data structure: [ADLB]
expected_violations:
  - rule_id: CDISC-AD0488
    dataset: ADLB
    row_key: {PARAMCD: HGB, STUDYID: S1, USUBJID: '002'}
    status: SUCCESS
    output_variables:
      ONTRTFL: 'Y'
      ONTRTFN: null
expected_errors: []
