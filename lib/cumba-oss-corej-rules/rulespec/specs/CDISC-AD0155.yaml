name: CDISC-AD0155
kind: rule
description: |
  Wave C3 port — T2-Grouping (Sensitivity=Group). BDS class scope.
  CDISC-AD0155: within (USUBJID, PARAMCD), more than one record has
  ABLFL=Y AND BASETYPE is not present. Output_Variables: ABLFL.
python_source: rules-adamig-1-3.json (CDISC-AD0155)
rule:
  coreId: CDISC-AD0155
datasets:
  ADLB:
    row_key: [STUDYID, USUBJID, PARAMCD, AVISITN]
    column_types:
      AVISITN: LONG
    rows:
      # Subject 001, HGB: exactly one ABLFL=Y → ok
      - {STUDYID: S1, USUBJID: '001', PARAMCD: HGB, AVISITN: 0, ABLFL: Y}
      - {STUDYID: S1, USUBJID: '001', PARAMCD: HGB, AVISITN: 1, ABLFL: ''}
      # Subject 002, HGB: two ABLFL=Y (BASETYPE absent) → violation at group first row
      - {STUDYID: S1, USUBJID: '002', PARAMCD: HGB, AVISITN: 0, ABLFL: Y}
      - {STUDYID: S1, USUBJID: '002', PARAMCD: HGB, AVISITN: 1, ABLFL: Y}
config:
  standard: adamig
  standard_version: '1.3'
library_mocks:
  classes:
    basic data structure: [ADLB]
expected_violations:
  - rule_id: CDISC-AD0155
    dataset: ADLB
    row_key: {AVISITN: 0, PARAMCD: HGB, STUDYID: S1, USUBJID: '002'}
    status: SUCCESS
    output_variables:
      $ablfl_y_count: '2'
      ABLFL: Y
      PARAMCD: HGB
expected_errors: []
