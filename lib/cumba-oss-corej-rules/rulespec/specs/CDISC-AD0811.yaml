name: CDISC-AD0811
kind: rule
description: |
  Wave A9 port — T1a PlainSimple.
  CDISC-AD0811: USUBJIDN is populated and USUBJID is not populated.
  Record-data rule scoped to BASIC DATA STRUCTURE; non_empty + empty pair.
python_source: rules-adamig-1-3.json (CDISC-AD0811)
rule:
  coreId: CDISC-AD0811
datasets:
  ADLB:
    row_key: [STUDYID, USUBJID, PARAMCD]
    rows:
      - {STUDYID: S1, USUBJID: '001', PARAMCD: HGB, USUBJIDN: ''}        # ok (USUBJIDN empty)
      - {STUDYID: S1, USUBJID: '', PARAMCD: HGB, USUBJIDN: '2'}          # bad (USUBJIDN populated, USUBJID empty)
config:
  standard: adamig
  standard_version: '1.3'
library_mocks:
  classes:
    basic data structure: [ADLB]
expected_violations:
  - rule_id: CDISC-AD0811
    dataset: ADLB
    row_key: {PARAMCD: HGB, STUDYID: S1, USUBJID: ''}
    status: SUCCESS
    output_variables:
      USUBJIDN: '2'
expected_errors: []
