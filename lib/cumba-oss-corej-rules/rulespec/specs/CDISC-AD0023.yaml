name: CDISC-AD0023
kind: rule
description: |
  Wave A1 port — T1a PlainSimple.
  CDISC-AD0023: SAFFL must be 'Y' or 'N' when populated on ADSL.
python_source: rules-adamig-1-3.json (CDISC-AD0023)
rule:
  coreId: CDISC-AD0023
datasets:
  ADSL:
    row_key: [STUDYID, USUBJID]
    rows:
      - {STUDYID: S1, USUBJID: '001', SAFFL: Y}
      - {STUDYID: S1, USUBJID: '002', SAFFL: MAYBE}
config:
  standard: adamig
  standard_version: '1.3'
library_mocks:
  classes:
    subject level analysis dataset: [ADSL]
expected_violations:
  - rule_id: CDISC-AD0023
    dataset: ADSL
    row_key: {STUDYID: S1, USUBJID: '002'}
    status: SUCCESS
    output_variables:
      SAFFL: MAYBE
expected_errors: []
