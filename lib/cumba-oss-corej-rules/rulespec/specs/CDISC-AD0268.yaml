name: CDISC-AD0268
kind: rule
description: |
  A2 port — T1a PlainSimple. OCCDS (ADAE): ADURN populated but ADURU empty.
python_source: rules-adamig-1-3.json (CDISC-AD0268)
rule:
  coreId: CDISC-AD0268
datasets:
  ADAE:
    row_key: [STUDYID, USUBJID, AESEQ]
    column_types:
      AESEQ: LONG
    rows:
      - {STUDYID: S1, USUBJID: '001', AESEQ: 1, ADURN: '5', ADURU: 'DAY'}  # ok
      - {STUDYID: S1, USUBJID: '002', AESEQ: 1, ADURN: '5', ADURU: ''}      # bad
config:
  standard: adamig
  standard_version: '1.3'
library_mocks:
  classes:
    occurrence data structure: [ADAE]
expected_violations:
  - rule_id: CDISC-AD0268
    dataset: ADAE
    row_key: {STUDYID: S1, USUBJID: '002', AESEQ: 1}
    status: SUCCESS
    output_variables:
      ADURN: '5'
      ADURU: null
expected_errors: []
