name: CDISC-AD0693
kind: rule
description: |
  Wave B3 port — T1b PlainIntermediate.
  CDISC-AD0693: more than one BASE for a given BASEC within PARAMCD (bare leaf)
  Record-data rule scoped to MEDICAL DEVICE BASIC DATA STRUCTURE with bare-leaf Check.
  Double Python gap: (1) has_multiple_values_for missing from DataframeType,
  (2) bare leaf raises KeyError: 'name' in business_rules engine (Finding #26).
  Baselines on the Python lane; expected matches Java.
python_source: rules-adamig-1-3.json (CDISC-AD0693)
rule:
  coreId: CDISC-AD0693
datasets:
  ADLB:
    row_key: [STUDYID, USUBJID, PARAMCD, AVISITN]
    column_types:
      AVISITN: LONG
    rows:
    - {STUDYID: S1, USUBJID: '001', SPDEVID: 'D1', PARAMCD: 'HGB', AVISITN: 1, BASE: 'A', BASEC: '1'}
    - {STUDYID: S1, USUBJID: '001', SPDEVID: 'D1', PARAMCD: 'HGB', AVISITN: 2, BASE: 'B', BASEC: '1'}
    - {STUDYID: S1, USUBJID: '002', SPDEVID: 'D2', PARAMCD: 'HGB', AVISITN: 1, BASE: 'C', BASEC: '2'}
config:
  standard: adamig
  standard_version: '1.3'
library_mocks:
  classes:
    medical device basic data structure: [ADLB]
expected_violations:
