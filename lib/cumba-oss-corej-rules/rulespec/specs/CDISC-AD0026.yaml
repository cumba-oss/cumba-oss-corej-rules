name: CDISC-AD0026
kind: rule
description: |
  Wave A1 port — T1a PlainSimple.
  CDISC-AD0026: COMPLFN must be 0 or 1 when populated on ADSL.
python_source: rules-adamig-1-3.json (CDISC-AD0026)
rule:
  coreId: CDISC-AD0026
datasets:
  ADSL:
    row_key: [STUDYID, USUBJID]
    column_types:
      COMPLFN: LONG
    rows:
      - {STUDYID: S1, USUBJID: '001', COMPLFN: 1}
      - {STUDYID: S1, USUBJID: '002', COMPLFN: 2}
config:
  standard: adamig
  standard_version: '1.3'
library_mocks:
  classes:
    subject level analysis dataset: [ADSL]
expected_violations:
  - rule_id: CDISC-AD0026
    dataset: ADSL
    row_key: {STUDYID: S1, USUBJID: '002'}
    status: SUCCESS
    output_variables:
      COMPLFN: '2'
expected_errors: []
