name: CDISC-AD0320
kind: rule
description: |
  Wave C3 port — T3-DatasetMetaCheck (Sensitivity=Dataset, Scope=SLAD).
  CDISC-AD0320: fire when ADSL's `dataset_label` is not the literal string
  "Subject-Level Analysis Dataset". Check is a bare leaf
  `{name: dataset_label, operator: not_equal_to, value: "...", value_is_literal: true}`.

  Rule-body quirk: bare-leaf Check → Python Finding #26 (business_rules
  KeyError: 'name'). Per plan §3 T3-DatasetMetaCheck ("Finding #23
  territory. Expect Python SKIPs → baseline on Python lane under Fix
  #34"), baselined on the Python lane. Since the spec-runner does not
  thread a per-dataset label, Java sees dataset_label as null/empty,
  which != "Subject-Level Analysis Dataset" → fires per-row on Java.
python_source: rules-adamig-1-3.json (CDISC-AD0320)
rule:
  coreId: CDISC-AD0320
datasets:
  ADSL:
    row_key: [STUDYID, USUBJID]
    rows:
    - {STUDYID: S1, USUBJID: '001'}
config:
  standard: adamig
  standard_version: '1.3'
library_mocks:
  classes:
    subject level analysis dataset: [ADSL]
expected_violations:
- rule_id: CDISC-AD0320
  dataset: ADSL
  row_key: {STUDYID: S1, USUBJID: '001'}
  status: SUCCESS
  output_variables:
    dataset_label: ADSL
    dataset_name: ADSL
expected_errors: []
