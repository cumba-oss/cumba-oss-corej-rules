name: CDISC-AD0385
kind: rule
description: |
  Wave A3 port — T1a PlainSimple.
  CDISC-AD0385: BTOXGRL populated while BTOXGRLN is empty.
  Record-data rule scoped to BASIC DATA STRUCTURE; non_empty + empty pair.
python_source: rules-adamig-1-3.json (CDISC-AD0385)
rule:
  coreId: CDISC-AD0385
datasets:
  ADLB:
    row_key: [STUDYID, USUBJID, PARAMCD]
    rows:
      - {STUDYID: S1, USUBJID: '001', PARAMCD: 'HGB', BTOXGRL: '', BTOXGRLN: ''}      # ok
      - {STUDYID: S1, USUBJID: '002', PARAMCD: 'HGB', BTOXGRL: 'LOW', BTOXGRLN: ''}   # bad
config:
  standard: adamig
  standard_version: '1.3'
library_mocks:
  classes:
    basic data structure: [ADLB]
expected_violations:
  - rule_id: CDISC-AD0385
    dataset: ADLB
    row_key: {PARAMCD: HGB, STUDYID: S1, USUBJID: '002'}
    status: SUCCESS
    output_variables:
      BTOXGRL: 'LOW'
      BTOXGRLN: null
expected_errors: []
