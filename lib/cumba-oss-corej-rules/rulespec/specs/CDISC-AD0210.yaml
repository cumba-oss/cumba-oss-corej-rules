name: CDISC-AD0210
kind: rule
description: |
  Wave C2 port — T2-MD (Match_Datasets without Operations).
  CDISC-AD0210: ADSL.ARM must equal DM.ARM for the matching subject (USUBJID).
  Class-scoped rule (SUBJECT LEVEL ANALYSIS DATASET). Bare-leaf Check (no outer
  all/any wrapper) — Finding #26 quirk on Python's business_rules lane.
python_source: rules-adamig-1-3.json (CDISC-AD0210)
rule:
  coreId: CDISC-AD0210
datasets:
  ADSL:
    row_key: [STUDYID, USUBJID]
    rows:
      - {STUDYID: S1, USUBJID: '001', ARM: 'Treatment A'}   # ok — matches DM.ARM
      - {STUDYID: S1, USUBJID: '002', ARM: 'Treatment X'}   # bad — DM.ARM is Placebo
  DM:
    row_key: [STUDYID, USUBJID]
    rows:
      - {STUDYID: S1, DOMAIN: DM, USUBJID: '001', ARM: 'Treatment A'}
      - {STUDYID: S1, DOMAIN: DM, USUBJID: '002', ARM: 'Placebo'}
config:
  standard: adamig
  standard_version: '1.3'
library_mocks:
  classes:
    subject level analysis dataset: [ADSL]
    special-purpose: [DM]
expected_violations:
  - rule_id: CDISC-AD0210
    dataset: ADSL
    row_key: {STUDYID: S1, USUBJID: '002'}
    status: SUCCESS
    output_variables:
      ARM: 'Treatment X'
      DM.ARM: 'Placebo'
expected_errors: []
