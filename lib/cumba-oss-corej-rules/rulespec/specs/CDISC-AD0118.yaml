name: CDISC-AD0118
kind: rule
description: |
  Wave B1 port - T1b PlainIntermediate.
  CDISC-AD0118: Within a given value of PARAMCD, there is more than one value of ATPTN for a given value of ATPT.
  Inverse of CDISC-AD0117 - checks the ATPT->ATPTN direction of the 1-to-1
  functional dependency. Bare-leaf Check at root - Python KeyError; baseline
  Python lane with Java expected.
python_source: rules-adamig-1-3.json (CDISC-AD0118)
rule:
  coreId: CDISC-AD0118
datasets:
  ADLB:
    row_key: [STUDYID, USUBJID, PARAMCD, ATPTN, ATPT]
    column_types:
      ATPTN: LONG
    rows:
      # PARAMCD=HGB: ATPT='Baseline' maps to two distinct ATPTN values (1 vs 2) -> violation
      - {STUDYID: S1, USUBJID: '001', PARAMCD: HGB, ATPTN: 1, ATPT: Baseline}
      - {STUDYID: S1, USUBJID: '002', PARAMCD: HGB, ATPTN: 2, ATPT: Baseline}
      # PARAMCD=HGB: ATPT='Week 1' consistent
      - {STUDYID: S1, USUBJID: '003', PARAMCD: HGB, ATPTN: 3, ATPT: Week 1}
      # Different parameter: clean
      - {STUDYID: S1, USUBJID: '004', PARAMCD: GLUC, ATPTN: 1, ATPT: Baseline}
config:
  standard: adamig
  standard_version: '1.3'
library_mocks:
  classes:
    basic data structure: [ADLB]
expected_violations:
  - rule_id: CDISC-AD0118
    dataset: ADLB
    row_key: {ATPT: Baseline, ATPTN: 1, PARAMCD: HGB, STUDYID: S1, USUBJID: '001'}
    status: SUCCESS
    output_variables:
      ATPT: Baseline
      ATPTN: '1'
      PARAMCD: HGB
  - rule_id: CDISC-AD0118
    dataset: ADLB
    row_key: {ATPT: Baseline, ATPTN: 2, PARAMCD: HGB, STUDYID: S1, USUBJID: '002'}
    status: SUCCESS
    output_variables:
      ATPT: Baseline
      ATPTN: '2'
      PARAMCD: HGB
expected_errors: []
