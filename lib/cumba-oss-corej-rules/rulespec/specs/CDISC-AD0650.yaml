name: CDISC-AD0650
kind: rule
description: |
  EC-6 — Python VMC melt narrow merge-back on row_number (companion of AD0649).
  AD0650: an ONTRTwFL variable is 'Y' but the overall on-treatment flag ONTRTFL is
  not 'Y' on the same record (variable_name matches ^ONTRT\dFL$). Before the fix the
  Python lane SKIPPED (concrete ONTRTFL dropped by melt → KeyError); the Java lane
  already resolves the raw column. Both lanes now fire exactly once (USUBJID 001:
  ONTRT1FL=Y, ONTRTFL=N). ONTRTFL is present in the fixture.
python_source: rules-adamig-1-3.json (CDISC-AD0650)
rule:
  coreId: CDISC-AD0650
datasets:
  ADAE:
    row_key: [STUDYID, USUBJID, AESEQ]
    column_types:
      AESEQ: LONG
    rows:
      - {STUDYID: S1, USUBJID: '001', AESEQ: 1, ONTRT1FL: 'Y', ONTRTFL: 'N'}   # bad: ONTRT1FL=Y, ONTRTFL!=Y
      - {STUDYID: S1, USUBJID: '002', AESEQ: 1, ONTRT1FL: 'Y', ONTRTFL: 'Y'}   # ok: both Y
      - {STUDYID: S1, USUBJID: '003', AESEQ: 1, ONTRT1FL: 'N', ONTRTFL: 'N'}   # ok: ONTRT1FL!=Y
config:
  standard: adamig
  standard_version: '1.3'
library_mocks:
  classes:
    occurrence data structure: [ADAE]
# EC-6 discharge: this rule must RUN, not just fire — see PLAN-parity-expected-status P3
expected_status: EXECUTED
expected_violations:
  - rule_id: CDISC-AD0650
    dataset: ADAE
    row_key: {STUDYID: S1, USUBJID: '001', AESEQ: 1}
    status: SUCCESS
    output_variables:
      variable_name: ONTRT1FL
      variable_value: 'Y'
      ONTRTFL: 'N'
expected_errors: []
