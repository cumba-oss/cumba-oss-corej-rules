name: CDISC-AD0430
kind: rule
description: |
  Wave A5 port — T1a PlainSimple.
  CDISC-AD0430: On a given record, APERIODC is populated and APERIOD is not populated.
  Record-data rule scoped to BASIC DATA STRUCTURE (+ MD variants) and
  OCCURRENCE DATA STRUCTURE (+ MD variants); simple non_empty + empty pair.
python_source: rules-adamig-1-3.json (CDISC-AD0430)
rule:
  coreId: CDISC-AD0430
datasets:
  ADLB:
    row_key: [STUDYID, USUBJID, PARAMCD, AVISITN]
    column_types:
      AVISITN: LONG
    rows:
      - {STUDYID: S1, USUBJID: '001', PARAMCD: 'HGB', AVISITN: 1, APERIOD: '1', APERIODC: 'P1'}  # ok
      - {STUDYID: S1, USUBJID: '002', PARAMCD: 'HGB', AVISITN: 1, APERIOD: '',  APERIODC: 'P1'}  # bad — APERIODC populated, APERIOD empty
config:
  standard: adamig
  standard_version: '1.3'
library_mocks:
  classes:
    basic data structure: [ADLB]
expected_violations:
  - rule_id: CDISC-AD0430
    dataset: ADLB
    row_key: {STUDYID: S1, USUBJID: '002', PARAMCD: 'HGB', AVISITN: 1}
    status: SUCCESS
    output_variables:
      APERIOD: null
      APERIODC: 'P1'
expected_errors: []
