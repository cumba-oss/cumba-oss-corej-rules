name: CDISC-AD0701
kind: rule
description: |
  Wave C4 port — T2-CalcOps (baseline Python lane).
  CDISC-AD0701: PCHG must equal ((AVAL-BASE)/BASE)*100 on MDBDS.
  Same check as CDISC-AD0225 but scoped to MEDICAL DEVICE BASIC DATA STRUCTURE.
  Python's DataframeType does not implement `not_equal_to_pctchg`
  and raises AssertionError; Java fires on the row where
  PCHG ≠ ((AVAL-BASE)/BASE)*100.
python_source: rules-adamig-1-3.json (CDISC-AD0701)
rule:
  coreId: CDISC-AD0701
datasets:
  ADLB:
    row_key: [STUDYID, USUBJID, SPDEVID, PARAMCD, AVISITN]
    column_types:
      AVISITN: LONG
      AVAL: DOUBLE
      BASE: DOUBLE
      PCHG: DOUBLE
    rows:
      # ok — PCHG=100.0 matches ((10-5)/5)*100
      - {STUDYID: S1, USUBJID: '001', SPDEVID: 'D1', PARAMCD: 'HGB', AVISITN: 1, AVAL: 10.0, BASE: 5.0, PCHG: 100.0}
      # bad — PCHG=50.0 but correct is 100.0
      - {STUDYID: S1, USUBJID: '002', SPDEVID: 'D1', PARAMCD: 'HGB', AVISITN: 1, AVAL: 10.0, BASE: 5.0, PCHG: 50.0}
config:
  standard: adamig
  standard_version: '1.3'
library_mocks:
  classes:
    medical device basic data structure: [ADLB]
expected_violations:
  - rule_id: CDISC-AD0701
    dataset: ADLB
    row_key: {STUDYID: S1, USUBJID: '002', SPDEVID: 'D1', PARAMCD: 'HGB', AVISITN: 1}
    status: SUCCESS
    output_variables:
      PCHG: '50'
      PARAMCD: 'HGB'
      BASE: '5'
      AVAL: '10'
expected_errors: []
