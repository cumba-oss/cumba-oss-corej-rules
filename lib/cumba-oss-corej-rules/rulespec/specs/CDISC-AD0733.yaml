name: CDISC-AD0733
kind: rule
description: |
  Wave B4 port — T1b PlainIntermediate.
  CDISC-AD0733: Within PARAMCD, more than one BASEC for a given BASE.
  Record-data rule scoped to BASIC DATA STRUCTURE.
  Bare-leaf Check + has_multiple_values_for with within=PARAMCD — Python gaps
  (Finding #26 + #28). Baselines on Python lane; expected matches Java.
python_source: rules-adamig-1-3.json (CDISC-AD0733)
rule:
  coreId: CDISC-AD0733
datasets:
  ADLB:
    row_key: [STUDYID, USUBJID, PARAMCD, BASEC]
    column_types:
      BASE: DOUBLE
    rows:
      # subj001/HGB: BASE=13.0 maps to two BASEC (Normal and Okay) within the same subject -> violation
    - {STUDYID: S1, USUBJID: '001', PARAMCD: 'HGB', BASE: 13.0, BASEC: 'Normal'}
    - {STUDYID: S1, USUBJID: '001', PARAMCD: 'HGB', BASE: 13.0, BASEC: 'Okay'}
    - {STUDYID: S1, USUBJID: '001', PARAMCD: 'HGB', BASE: 16.0, BASEC: 'High'}     # ok (BASE=16 single BASEC)
    - {STUDYID: S1, USUBJID: '002', PARAMCD: 'HGB', BASE: 13.0, BASEC: 'Normal'}   # ok (other subject, single)
config:
  standard: adamig
  standard_version: '1.3'
library_mocks:
  classes:
    basic data structure: [ADLB]
expected_violations:
- rule_id: CDISC-AD0733
  dataset: ADLB
  row_key: {STUDYID: S1, USUBJID: '001', PARAMCD: 'HGB', BASEC: 'Normal'}
  status: SUCCESS
  output_variables:
    BASE: '13'
    BASEC: Normal
    PARAMCD: HGB
- rule_id: CDISC-AD0733
  dataset: ADLB
  row_key: {STUDYID: S1, USUBJID: '001', PARAMCD: 'HGB', BASEC: 'Okay'}
  status: SUCCESS
  output_variables:
    BASE: '13'
    BASEC: Okay
    PARAMCD: HGB
expected_errors: []
