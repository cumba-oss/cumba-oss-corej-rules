  - Cited_Guidance: 'For subjects that have a disposition status in the Disposition (DS) domain that indicates a scheduled death, the Unscheduled Flag (DSUSCHFL) should not be populated. Standardized Disposition Term (DSDECOD) values for scheduled death include: INTERIM SACRIFICE, TERMINAL SACRIFICE, RECOVERY SACRIFICE, and REMOVED FROM STUDY ALIVE.'
