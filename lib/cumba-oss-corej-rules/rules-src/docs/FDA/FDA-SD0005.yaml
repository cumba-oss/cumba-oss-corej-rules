Core: FDA-SD0005
Citations:
  FDA|SDTMIG|3.4||SD0005|1:
  - Cited_Guidance: The value of Sequence Number (--SEQ) variable must be unique for each record within a domain and within each Unique Subject Identifier (USUBJID) or Pool Identifier (POOLID) variables value when they are present in the domain. Exclusions are DO, DT, DU and DX domains.
