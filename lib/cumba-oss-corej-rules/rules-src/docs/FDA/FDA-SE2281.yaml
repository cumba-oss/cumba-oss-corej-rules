  - Cited_Guidance: For PC records contributing to a time concentration profile, PCNOMDY, PCELTM and PCTPTREF must be present and populated. These are the required timing variables for identification of the day on which group summaries (Group Means and Incidences) are calculated for pharmacokinetic concentrations.
