Core: "CDISC-AD0282"
Citations:
  CDISC|ADaMIG|1.0||CR282|1:
  - Cited_Guidance: "ADaMIG v1.0, Section 3, Item 9 (General Variable Naming Conventions):\
      \ In general, if SDTM character variables are converted to numeric variables\
      \ in ADaM datasets, then they should be named as they are in the SDTM with an\
      \ \"N\" suffix added. For example, the numeric version of the DM SEX variable\
      \ is SEXN in an ADaM dataset, and a numeric version of RACE is RACEN. If necessary\
      \ to keep within the 8-character variable name length limit, the last character\
      \ may be removed prior to appending the N. Note "
    Document: "ADaMIG v1.0; OCCDS v1.0; OCCDS v1.1"
    Section: "3; 3.2.8; 3.2.8"
    Item: "9 (General Variable Naming Conventions); Table 3.2.8.1; Table 3.2.8.1"
  CDISC|ADaMIG|1.1||CR282|1:
  - Cited_Guidance: "ADaMIG v1.1, Section 3.1.1, Item 6: In a pair of corresponding\
      \ variables (e.g., TRTP and TRTPN), the primary or most commonly used variable\
      \ does not have the suffix or extension (e.g., N for Numeric or C for Character).\
      \ The relevant suffix is used only on the name of the secondary member of the\
      \ variable pair. For example, in the (TRTP, TRTPN) pair, the primary variable,\
      \ TRTP is character; but it is not named TRTPC. Similarly in the (APERIOD, APERIODC)\
      \ pair, the primary variable, APERIOD, is nume"
    Document: "ADaMIG v1.1; OCCDS v1.0; OCCDS v1.1"
    Section: "3.1.1; 3.2.8; 3.2.8"
    Item: "6; Table 3.2.8.1; Table 3.2.8.1"
