Core: "CDISC-CG0205"
Citations:
  CDISC|SDTMIG|3.4||CG0205|1:
  - Cited_Guidance: "When data have been split into multiple datasets (see Section\
      \ 4.1.7, Splitting Domains), longer names such as SUPPFAMH may be needed. In\
      \ cases where data about Associated Persons (see Associated Persons Implementation\
      \ Guide) have been collected, Supplemental Qualifiers for Findings About events\
      \ or interventions for an associated person may need to be represented. A dataset\
      \ name with the SUPP fragment, e.g., SUPPAPFAMH, would be too long. In this case\
      \ only, the “SUPP” portion should be shortened to “SQ”, resulting\
      \ in a dataset name such as SQAPFAMH."
    Document: "IG v3.4"
    Section: "8.4.2"
  CDISC|SDTMIG|3.3||CG0205|1:
  - Cited_Guidance: "When data have been split into multiple datasets (see Section\
      \ 4: 4.1.1.7, Splitting Domains), longer names such as SUPPFAMH may be needed.\
      \ In cases where data about Associated Persons (see Associated Persons Implementation\
      \ Guide) have been collected, an associated person with Supplemental Qualifiers\
      \ for Findings About their medical history, the resulting dataset name SUPPAPFAMH)\
      \ would be too long so that, in this case only, the \"SUPP\" portion should be\
      \ shortened to \"SQ\". resulting in a dataset name of SQAPFAMH."
    Document: "IG v3.3"
    Section: "8.4.2"
