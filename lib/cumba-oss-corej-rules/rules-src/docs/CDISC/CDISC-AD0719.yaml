Core: "CDISC-AD0719"
Citations:
  CDISC|ADaMIG|1.1||CR719|1:
  - Cited_Guidance: "ADaMIG v1.1, Section 3.3.2, Table 3.3.2.1: At least one treatment\
      \ variable is required in a BDS dataset. This requirement is satisfied by any\
      \ of the subject-level or record-level treatment variables (e.g. TRTxxP or TRTP).\
      \ One is allowed to use any treatment variable in analysis of BDS. Any subject-level\
      \ treatment variable may be copied into the BDS dataset from ADSL."
    Document: "ADaMIG v1.1"
    Section: "3.3.2"
    Item: "Table 3.3.2.1"
  CDISC|ADaMIG|1.2||CR719|1:
  - Cited_Guidance: "ADaMIG v1.2, Section 3.3.2, Table 3.3.2.1: At least one treatment\
      \ variable is required in a BDS dataset. This requirement is satisfied by any\
      \ of the subject-level treatment variables (e.g., TRTxxP) or record-level treatment\
      \ variables (e.g., TRTP). All treatment variables defined in Table 3.3.2.1 are\
      \ record level, meaning that the values contained in the variable may vary by\
      \ record within a subject. Subject-level treatment variables are described in\
      \ Table 3.2.4."
    Document: "ADaMIG v1.2"
    Section: "3.3.2"
    Item: "Table 3.3.2.1"
