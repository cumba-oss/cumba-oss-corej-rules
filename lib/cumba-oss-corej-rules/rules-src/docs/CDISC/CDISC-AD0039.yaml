  - Cited_Guidance: "ADaMIG v1.0, Section 3, Item 6 (General Timing Variable Conventions):\
      \ Variables whose names end in DTF are date imputation flags. *DTF variables\
      \ represent the level of imputation of the *DT variable based on the source\
      \ SDTM DTC variable. *DTF = Y if the entire date is imputed. *DTF = M if month\
      \ and day are imputed. *DTF = D if only day is imputed. *DTF = null if *DT equals\
      \ the SDTM DTC variable date part equivalent. If a date was imputed, *DTF must\
      \ be populated and is required. Both *DTF and *TM"
