Core: CDISC-CG0349
Citations:
  CDISC|SDTMIG|3.4||CG0349|1:
  - Cited_Guidance: 'The following variables are exceptions to the philosophy that all variable names
      are prefixed with the Domain Identifier: -Required Identifiers (STUDYID, DOMAIN, USUBJID) -Commonly
      used grouping and merge Keys (e.g., VISIT, VISITNUM, VISITDY)

      All Demographics domain (DM) variables other than DMDTC and DMDY -All variables in RELREC and SUPPQUAL,
      and some variables in Comments and Trial Design datasets.

      Required Identifiers are not prefixed because they are usually used as keys when merging/joining
      observations. The --SEQ and the optional Identifiers --GRPID and --REFID are prefixed because they
      may be used as keys when relating observations across domains.'
    Document: IG v3.4
    Section: 4.2.2
