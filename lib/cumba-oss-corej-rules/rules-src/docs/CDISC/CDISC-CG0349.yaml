  CDISC|SDTMIG|3.2||CG0349|1:
  - Cited_Guidance: 'The philosophy applied to determine which variable names use a prefix was that all
      variable names are prefixed with the Domain Identifier in which they originate except the following:
      a. Required Identifiers (STUDYID; DOMAIN; USUBJID). b. Commonly used grouping and merge Keys (VISIT;
      VISITNUM; VISITDY); and many of the variables in trial design (such as ELEMENT and ARM). c. All
      Demographics domain (DM) variables other than DMDTC and DMDY. d. All variables in RELREC and SUPPQUAL;
      and some variables in Comments and Trial Design datasets.'
    Document: IG v3.2
    Section: 4.1.2.2
