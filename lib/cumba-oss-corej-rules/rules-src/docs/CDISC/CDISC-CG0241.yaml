Core: "CDISC-CG0241"
Citations:
  CDISC|SDTMIG|3.4||CG0241|1:
  - Cited_Guidance: "Within the context that defines uniqueness for a time point, there\
      \ is likely to be a one-to-one relationship between most values of --TPT and\
      \ --ELTM. However, since --ELTM can only be populated with ISO 8601 periods of\
      \ time (as described in Section 4.4.3, Intervals of Time and Use of Duration\
      \ for --DUR Variables), --ELTM may not be populated for all time points. For\
      \ example, --ELTM is likely to be null for time points described by text such\
      \ as 'pre-dose' or 'before breakfast.' When --ELTM is populated, if two subjects\
      \ have records with the same values of DOMAIN, VISITNUM, --TPTREF, and --TPTNUM,\
      \ then these records may not have different values in --ELTM."
    Document: "IG v3.4"
    Section: "4.4.10"
