Core: "CDISC-CG0332"
Citations:
  CDISC|SDTMIG|3.4||CG0332|1:
  - Cited_Guidance: "For domains with two-letter domain codes (i.e., other than SUPPxx\
      \ and RELREC), split dataset names can be up to four characters in length. For\
      \ example, if splitting by --CAT, then dataset names would be the domain name\
      \ plus up to two additional characters (e.g., QS36 for SF-36). If splitting Findings\
      \ About by parent domain, then the dataset name would be the domain code, \"\
      FA\", plus the two-character domain code for parent domain code (e.g., \"FACM\"\
      ). The four-character dataset-name limitation allows the use of a Supplemental\
      \ Qualifier dataset associated with the split dataset."
    Document: "IG v3.4"
    Item: "6"
    Section: "4.1.7"
