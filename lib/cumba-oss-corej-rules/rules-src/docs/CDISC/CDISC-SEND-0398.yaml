Core: "CDISC-SEND-0398"
Citations:
  CDISC|SENDIG-GENETOX|1.0||SEND398|1:
  - Cited_Guidance: "There are, by definition, no time gaps between Elements; therefore, the value of SEENDTC for one Element will always be immediately before or the same as the value of SESTDTC for the next Element. Each Element continues until the time at which the next Element begins, and a subject must be in only one element at a time."
    Document: "SENDIG v3.1.1"
    Item: "Assumption 1"
    Section: "5.3.1.1"
