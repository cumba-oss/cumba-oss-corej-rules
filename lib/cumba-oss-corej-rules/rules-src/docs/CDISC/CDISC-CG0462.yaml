Core: "CDISC-CG0462"
Citations:
  CDISC|SDTMIG|3.4||CG0462|2:
  - Cited_Guidance: "For example, if 0 tablets are taken within a timeframe or 0 mL\
      \ infused at a visit, then ECOCCUR = 'N' is the standard representation of the\
      \ collected doses not taken, not given, or missed. Dose amount variables (e.g.,\
      \ ECDOSE, ECDOSTXT) must not be set to zero (0) as an alternative method for indicating\
      \ doses not taken, not given, or missed."
    Document: "IG v3.4"
    Item: "Assumption 4a"
    Section: "6.1.3.2"
  - Cited_Guidance: "Qualifiers that indicate dose amount (e.g., ECDOSE, ECDOSTXT)\
      \ may be populated with positive (non-zero) values in cases where the sponsor\
      \ feels it is necessary and/or appropriate to represent specific dose amounts\
      \ not taken, not given, or missed."
    Document: "IG v3.4"
    Item: "Assumption 4b"
    Section: "6.1.3.2"
