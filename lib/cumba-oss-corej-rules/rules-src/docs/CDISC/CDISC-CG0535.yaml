Core: "CDISC-CG0535"
Citations:
  CDISC|SDTMIG|3.4||CG0535|1:
  - Cited_Guidance: "An event with DSCAT = “DISPOSITION EVENT” describes either disposition of study participation or of a study treatment.  It describes whether a subject completed study participation or a study treatment, and if not, the reason they did not complete it. Dispositions may be described for each Epoch (e.g., screening, initial treatment, washout, cross-over treatment, follow-up) or for the study as a whole. If disposition events for both study participation and study treatment(s) are to be represented, then DSSCAT provides this distinction. The value of DSSCAT is based on the sponsor's controlled terminology, however for records with DSCAT = \"DISPOSITION EVENT\",\nDSSCAT = \"STUDY PARTICIPATION\" is used to represent disposition of study participation.\nDSSCAT = \"STUDY TREATMENT\" can be used as a generic identifier when a study has only a single treatment.\nIf a study has multiple treatments, then DSSCAT should name the individual treatment."
    Document: "IG v3.4"
    Item: "DS – Assumption 2b"
    Section: "6.2.3"
  CDISC|SDTMIG|3.3||CG0535|1:
  - Cited_Guidance: "If separate disposition events for both study participation and study treatment(s) are to be represented, then DSSCAT provides this distinction."
    Document: "IG v3.3"
    Item: "Assumption 2.b"
    Section: "6.2.3 DS"
