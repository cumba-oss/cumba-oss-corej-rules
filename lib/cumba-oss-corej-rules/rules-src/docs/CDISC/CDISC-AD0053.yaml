  CDISC|ADaMIG|1.0||CR53|1:
  - Cited_Guidance: "ADaMIG v1.0, Section 3, Item 4 (General Variable Naming Conventions):\
      \ Any ADaM variable whose name is the same as an SDTM variable must be a copy\
      \ of the SDTM variable, and its label, meaning, and values must not be modified.\
      \ ADaM adheres to a principle of harmonization known as \"same name, same meaning,\
      \ same values.\""
