Core: PMDA-SD0069
Citations:
  PMDA|SDTMIG|3.2||SD0069|1:
  - Cited_Guidance: "PMDA Severity: Warning. All Demographics (DM) subjects (USUBJID)
      should have at least one record in the Disposition (DS) domain. The only possible
      exceptions for SDTMIG v3.2 (and earlier) are Screen Failures (ARMCD=SCRNFAIL)
      and Not Assigned Treatment (ARMCD=NOTASSGN) subjects, or subjects with ARMCD=null.
      If the study is ongoing, Parameter Value (TSVAL) for the 'ONGOSIND/Ongoing Study
      Indicator' parameter should be set to 'Y' in the Trial Summary (TS) domain."
    Document: "PMDA Validation Rules v6.0"
    Section: "SD0069"
