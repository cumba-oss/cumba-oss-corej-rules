Core: PMDA-SD1449
Citations:
  PMDA|SDTMIG|3.4||SD1449|1:
  - Cited_Guidance: "PMDA Severity: Warning. Reported Term for the Adverse Event (AETERM) is expected to be coded using the Medical Dictionary for Regulatory Affairs (MedDRA). Sponsors should code each term to the MedDRA-specified hierarchy of terms. These terms/codes are represented in SDTM variables that are subject to MedDRA: AELLT, AELLTCD, AEDECOD, AEPTCD, AEHLT, AEHLTCD, AEHLGT, AEHLGTCD, AEBODSYS, AEBDSYCD, AESOC, AESOCCD."
    Document: PMDA Validation Rules v6.0
    Section: SD1449
