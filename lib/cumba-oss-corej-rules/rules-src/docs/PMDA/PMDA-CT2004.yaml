Core: PMDA-CT2004
Citations:
  PMDA|SDTMIG|3.1.2||CT2004|1:
  - Cited_Guidance: "PMDA Severity: Reject. Variable must be populated with terms from its CDISC controlled terminology codelist when its value level condition is met. New terms cannot be added into non-extensible codelists. NOTES: Violation of CT2004 for the following variable/codelist pairs will be considered part of Rejection criteria. All others will be considered Errors. <Variable Name (Codelist Name)> TSVAL when TSPARMCD value is SEXPOP (SEXPOP); TSVAL when TSPARMCD value is ADDON (NY); TSVAL when TSPARMCD value is RANDOM (NY)."
    Document: "PMDA Validation Rules v6.0"
    Section: "CT2004"
