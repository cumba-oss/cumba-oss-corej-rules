Core: PMDA-AD0037B
Citations:
  PMDA|ADaMIG|1.1||AD0037B|1:
  - Cited_Guidance: 'PMDA Severity: Error. Within a study, all *GRyN values must be the same for each unique value of *GRy when the primary variable *GRy is populated. ADaM IG v1.1 p.15 general variable naming conventions #10: If any combining of the SDTM character categories is done, the name of the derived ADaM character grouping variable should end in GRy and the name of its numeric equivalent should end in GRyN where y is an integer from 1-9 representing a grouping scheme. Considering only those rows on which both variables are populated.'
    Document: PMDA Validation Rules v6.0
    Section: AD0037B
