Core: PMDA-SD0065
Citations:
  PMDA|SDTMIG|3.1.2||SD0065|1:
  - Cited_Guidance: 'PMDA Severity: Warning. All Unique Subject Identifier (USUBJID) + Visit Name (VISIT) + Visit Number (VISITNUM) combination values in data should be present in the Subject Visits (SV) domain. There is an exception for records, where Status (--STAT) variable value is populated. E.g., --STAT = ''NOT DONE''. Another exception is for records, where Occurrence (ECOCCUR) is ''N'' in EC domain.'
    Document: PMDA Validation Rules v6.0
    Section: SD0065
