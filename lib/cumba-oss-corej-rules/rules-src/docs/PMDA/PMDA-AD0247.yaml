Core: PMDA-AD0247
Citations:
  PMDA|ADaMIG|1.0||AD0247|1:
  - Cited_Guidance: 'PMDA Severity: Error. When an event is censored, 3 other variables must be populated. Censor (CNSR) variable qualifies the Analysis Value (AVAL) variable. ADT and ADTM variables are the Analysis Date and Time of event or censoring associated with AVAL. Origin Date for Subject (STARTDT) variable is the original date of risk for the time-to-event analysis. This is generally the time at which a subject is first at risk for the event of interest evaluation.'
    Document: PMDA Validation Rules v6.0
    Section: AD0247
