Core: PMDA-SD1201
Citations:
  PMDA|SDTMIG|3.1.2||SD1201|1:
  - Cited_Guidance: "PMDA Severity: Warning. The structure of Events class domains should be one record per Event per subject. No Events with the same Collected Term (--TERM), Decoded Term (--DECOD), Category (--CAT), Subcategory (--SCAT), Occurrence (--OCCUR), Location (--LOC), Laterality (--LAT), Directionality (--DIR), Severity (--SEV), Toxicity Grade (--TOXGR), Visit Number (VISITNUM), Visit Day (VISITDY), and Start Reference Time Point (--STTPT) values for the same Subject (USUBJID) and the same Start Date (--STDTC) are expected."
    Document: "PMDA Validation Rules v6.0"
    Section: "SD1201"
