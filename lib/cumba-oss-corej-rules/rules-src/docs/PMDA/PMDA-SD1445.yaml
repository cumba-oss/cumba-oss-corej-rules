Core: PMDA-SD1445
Citations:
  PMDA|SDTMIG|3.3||SD1445|1:
  - Cited_Guidance: "PMDA Severity: Warning. By its definition Last Observation Before Exposure Flag (--LOBXFL) should have only a single record for the same test for subject. Therefore, each subject (USUBJID) should have no more than one record with Last Observation Before Exposure Flag (--LOBXFL) equals 'Y' for the same assessment which is defined by Test (--TESTCD), --TSTDTL (Measurement, Test or Examination Detail), Category (--CAT), Subcategory (--SCAT), Method (--METHOD), Specimen (--SPEC), Location (--LOC) and Laterality (--LAT)."
    Document: "PMDA Validation Rules v6.0"
    Section: "SD1445"
