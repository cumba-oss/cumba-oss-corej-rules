  - Cited_Guidance: 'PMDA Severity: Error. In a pair of corresponding character and numeric variables, the primary or most commonly used variable must be populated if its secondary variable describing it is populated. Corresponding character and numeric values must also have a one-to-one mapping consistency when the primary variable is populated, which are addressed in other rules.'
