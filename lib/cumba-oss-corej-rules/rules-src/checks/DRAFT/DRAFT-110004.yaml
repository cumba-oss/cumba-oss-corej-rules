Core:
  Id: "DRAFT-110004"
  Status: "Published"
  Version: "1"
Description: "Raise an error when the Study Day of Start of Observation (--STDY) is\
  \ greater than the Study Day of Visit/Collection/Exam (--DY)."
Executability: "Fully Executable"
Scope:
  Classes:
    Include:
    - "EVENTS"
    - "INTERVENTIONS"
  Domains:
    Exclude:
    - "BE"
Requirements:
  Variables:
    All:
    - "--DY"
    - "--STDY"
Check:
  expression: >-
    not empty(--STDY) and not empty(--DY) and --STDY > --DY
Outcome:
  Message: "--STDY is greater than --DY."
  Output_Variables:
  - "--DY"
  - "--STDY"
