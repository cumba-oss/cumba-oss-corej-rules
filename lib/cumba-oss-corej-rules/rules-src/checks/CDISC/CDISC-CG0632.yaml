Core:
  Id: "CDISC-CG0632"
  Status: "Published"
  Version: "1"
Description: "Raise an error when RPPLDY is present in a dataset, because this variable\
  \ is not permitted in human clinical trials."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "ALL"
Check:
  expression: >-
    var_exists("RPPLDY")
Outcome:
  Message: "RPPLDY is present but is not permitted in human clinical trials."
  Output_Variables:
  - "RPPLDY"
Source:
  Class: "ALL"
  Variable: "RPPLDY"
  Rule: "RPPLDY not present in dataset"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "SDTMIG"
    Version: "3.4"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0632"
        Version: "1"
      Version: "2.0"
