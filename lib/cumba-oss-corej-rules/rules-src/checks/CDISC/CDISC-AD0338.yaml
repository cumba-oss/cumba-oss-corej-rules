Core:
  Id: "CDISC-AD0338"
  Status: "Published"
  Version: "2"
Description: "Raise an error when MCRITy is present and MCRITyML is not present"
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "BASIC DATA STRUCTURE"
    - "MEDICAL DEVICE BASIC DATA STRUCTURE"
Check:
  expression: >-
    var_exists("MCRITy") and not var_exists("MCRITyML")
Outcome:
  Message: "MCRITy is present, but MCRITyML is not present."
  Output_Variables:
  - "MCRITy"
wildcards:
  "y":
    min: 1
    max: 99
Source:
  Class: "BASIC DATA STRUCTURE; MEDICAL DEVICE BASIC DATA STRUCTURE"
  Variable_or_Item: "MCRITy where y is an integer [1-99, not zero-padded]"
  Natural_Language_Rule_Failure_Criteria: "MCRITy is present and MCRITyML is not present"
  Rule_Failure_Criteria: "MCRITyML is not present"
  Condition_Failure: "MCRITy is present"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.1"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR338"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.2"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR338"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.3"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR338"
        Version: "2"
      Version: "5.0"
