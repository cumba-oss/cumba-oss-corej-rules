Core:
  Id: "CDISC-CG0344"
  Status: "Published"
  Version: "1"
Description: "Raise an error when --TESTCD is equal to 'MULTIPLE'."
Executability: "Fully Executable"
Scope:
  Classes:
    Include:
    - "FINDINGS"
Requirements:
  Variables:
    All:
    - "--TESTCD"
Check:
  expression: >-
    --TESTCD == "MULTIPLE"
Outcome:
  Message: "--TESTCD is equal to 'MULTIPLE'."
  Output_Variables:
  - "--TESTCD"
Source:
  Class: "FND"
  Domain: "ALL"
  Variable: "--TESTCD"
  Rule: "--TESTCD ^= 'MULTIPLE'"
