Core:
  Id: "CDISC-CG0626"
  Status: "Published"
  Version: "1"
Description: "Raise an error when --RESLOC is present in a Findings dataset, since\
  \ --RESLOC is not permitted in human clinical trials."
Executability: "Fully Executable"
Scope:
  Classes:
    Include:
    - "FINDINGS"
Check:
  expression: >-
    var_exists("--RESLOC")
Outcome:
  Message: "Variable --RESLOC is present but is not permitted in human clinical trials."
  Output_Variables:
  - "--RESLOC"
Source:
  Class: "FND"
  Variable: "--RESLOC"
  Rule: "--RESLOC not present in dataset"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "SDTMIG"
    Version: "3.4"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0626"
        Version: "1"
      Version: "2.0"
