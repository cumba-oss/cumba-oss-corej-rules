Core:
  Id: "CDISC-AD0549"
  Status: "Published"
  Version: "2"
Description: "Raise an error when BTOXGRHN is present and BTOXGRH is not present."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "BASIC DATA STRUCTURE"
Check:
  expression: >-
    var_exists("BTOXGRHN") and not var_exists("BTOXGRH")
Outcome:
  Message: "BTOXGRHN is present, but BTOXGRH is not present."
  Output_Variables:
  - "BTOXGRHN"
Source:
  Class: "BASIC DATA STRUCTURE; MEDICAL DEVICE BASIC DATA STRUCTURE"
  Variable_or_Item: "BTOXGRHN"
  Natural_Language_Rule_Failure_Criteria: "BTOXGRHN is present and BTOXGRH is not\
    \ present"
  Rule_Failure_Criteria: "BTOXGRH is not present"
  Condition_Failure: "BTOXGRHN is present"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.2"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR549"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.3"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR549"
        Version: "2"
      Version: "5.0"
