Core:
  Id: "CDISC-AD0450"
  Status: "Published"
  Version: "2"
Description: "Raise an error when MCRITyML is populated but MCRITyMN is missing"
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "BASIC DATA STRUCTURE"
Check:
  expression: >-
    not empty(MCRITyML) and empty(MCRITyMN)
Outcome:
  Message: "MCRITyML is populated, but MCRITyMN is missing"
  Output_Variables:
  - "MCRITyML"
  - "MCRITyMN"
wildcards:
  "y":
    min: 1
    max: 99
Source:
  Class: "BASIC DATA STRUCTURE; MEDICAL DEVICE BASIC DATA STRUCTURE"
  Variable_or_Item: "MCRITyMN where y is an integer [1-9, not zero-padded]"
  Natural_Language_Rule_Failure_Criteria: "On a given record, MCRITyML is populated\
    \ and MCRITyMN is not populated"
  Rule_Failure_Criteria: "MCRITyMN is not populated"
  Condition_Failure: "MCRITyML is populated"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.2"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR450"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.3"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR450"
        Version: "2"
      Version: "5.0"
