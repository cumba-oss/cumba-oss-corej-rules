Core:
  Id: "CDISC-CG0394"
  Status: "Published"
  Version: "1"
Description: "Raise an error when AESOD is populated and its value is not 'Y' or 'N'."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "AE"
Requirements:
  Variables:
    All:
    - "AESOD"
Check:
  expression: >-
    not empty(AESOD) and AESOD not in ["Y", "N"]
Outcome:
  Message: "AESOD is populated, but its value is not 'Y' or 'N'."
  Output_Variables:
  - "AESOD"
Source:
  Class: "EVT"
  Domain: "AE"
  Variable: "--SOD"
  Condition: "--SOD ^= null"
  Rule: "--SOD in ('Y','N')"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "SDTMIG"
    Version: "3.4"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0394"
        Version: "1"
      Version: "2.0"
  - Name: "SDTMIG"
    Version: "3.3"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0394"
        Version: "1"
      Version: "2.0"
  - Name: "SDTMIG"
    Version: "3.2"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0394"
        Version: "1"
      Version: "2.0"
