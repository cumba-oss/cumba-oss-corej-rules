Core:
  Id: "CDISC-AD0463"
  Status: "Published"
  Version: "2"
Description: "Raise an error when TSEQAGyN is populated and TSEQAGy is empty on the\
  \ same record."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "SUBJECT LEVEL ANALYSIS DATASET"
Requirements:
  Variables:
    All:
    - "TSEQAGyN"
    - "TSEQAGy"
Check:
  expression: >-
    not empty(TSEQAGyN) and empty(TSEQAGy)
Outcome:
  Message: "TSEQAGyN is populated but TSEQAGy is empty."
  Output_Variables:
  - "TSEQAGy"
  - "TSEQAGyN"
wildcards:
  "y":
    min: 1
    max: 99
Source:
  Class: "BASIC DATA STRUCTURE; MEDICAL DEVICE BASIC DATA STRUCTURE; OCCURRENCE DATA\
    \ STRUCTURE; MEDICAL DEVICE OCCURRENCE DATA STRUCTURE"
  Variable_or_Item: "TSEQAGy where y is an integer [1-99, not zero-padded]"
  Natural_Language_Rule_Failure_Criteria: "On a given record, TSEQAGyN is populated\
    \ and TSEQAGy is not populated"
  Rule_Failure_Criteria: "TSEQAGy is not populated"
  Condition_Failure: "TSEQAGyN is populated"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.2"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR463"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.3"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR463"
        Version: "2"
      Version: "5.0"
