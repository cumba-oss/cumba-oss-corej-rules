Core:
  Id: "CDISC-AD0210"
  Status: "Published"
  Version: "1"
Description: "Raise an error when, for a subject, DM has a value for ARM and ADSL.ARM\
  \ does not equal that value"
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "SUBJECT LEVEL ANALYSIS DATASET"
Match_Datasets:
- Name: "DM"
  Keys:
  - "USUBJID"
Check:
  expression: >-
    var_exists(DM.ARM) and ARM != DM.ARM
Outcome:
  Message: "For this subject, ADSL.ARM does not equal DM.ARM"
  Output_Variables:
  - "ARM"
  - "DM.ARM"
Source:
  Class: "SUBJECT LEVEL ANALYSIS DATASET"
  Variable_or_Item: "ARM"
  Natural_Language_Rule_Failure_Criteria: "The value of ADSL.USUBJID is equal to the\
    \ value of DM.USUBJID and ADSL.ARM is not equal to DM.ARM"
  Rule_Failure_Criteria: "ADSL.ARM is not equal to DM.ARM"
  Condition_Failure: "The value of ADSL.USUBJID is equal to the value of DM.USUBJID"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.0"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR210"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.1"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR210"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.2"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR210"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.3"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR210"
        Version: "1"
      Version: "5.0"
