Core:
  Id: "CDISC-AD0421"
  Status: "Published"
  Version: "1"
Description: "Raise an error when TRxxAGyN is populated and TRxxAGy is not populated."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "SUBJECT LEVEL ANALYSIS DATASET"
Requirements:
  Variables:
    All:
    - "TRxxAGyN"
    - "TRxxAGy"
Check:
  expression: >-
    not empty(TRxxAGyN) and empty(TRxxAGy)
Outcome:
  Message: "TRxxAGyN is populated but TRxxAGy is not populated."
  Output_Variables:
  - "TRxxAGy"
  - "TRxxAGyN"
wildcards:
  xx:
    min: 1
    max: 99
  "y":
    min: 1
    max: 99
Source:
  Class: "SUBJECT LEVEL ANALYSIS DATASET"
  Variable_or_Item: "TRxxAGy where xx is an integer [01-99, zero-padded] and y is\
    \ an integer [1-99, not zero-padded]"
  Natural_Language_Rule_Failure_Criteria: "On a given record, TRxxAGyN is populated\
    \ and TRxxAGy is not populated"
  Rule_Failure_Criteria: "TRxxAGy is not populated"
  Condition_Failure: "TRxxAGyN is populated"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.2"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR421"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.3"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR421"
        Version: "1"
      Version: "5.0"
