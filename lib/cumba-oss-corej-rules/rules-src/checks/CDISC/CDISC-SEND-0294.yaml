Core:
  Id: "CDISC-SEND-0294"
  Status: "Published"
  Version: "1"
Description: "Raise an error when the interval start (--STINT) and interval end (--ENINT)\
  \ are both populated but the Time Point Reference (--TPTREF) anchor is empty; --STINT\
  \ and --ENINT specify the interval relative to the --TPTREF anchor, so --TPTREF\
  \ must be populated when both are populated."
Executability: "Fully Executable"
Scope:
  Classes:
    Include:
    - "FINDINGS"
Requirements:
  Variables:
    All:
    - "--STINT"
    - "--ENINT"
Check:
  expression: >-
    not empty(--STINT) and not empty(--ENINT) and empty(--TPTREF)
Outcome:
  Message: "--TPTREF is empty when both --STINT and --ENINT are populated."
  Output_Variables:
  - "--TPTREF"
  - "--STINT"
  - "--ENINT"
Source:
  Class: "FND"
  Domain: "ALL"
  Variable: "--TPTREF"
  Plain_Text_Explanation: "--TPTREF must be populated when --STINT and --ENINT are\
    \ populated."
  Condition: "--STINT ^= null AND --ENINT ^= null"
  Rule: "--TPTREF ^= null"
