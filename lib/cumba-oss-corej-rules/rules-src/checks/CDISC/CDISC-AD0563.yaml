Core:
  Id: "CDISC-AD0563"
  Status: "Published"
  Version: "1"
Description: "Raise an error when STRATwVN is present and STRATwV is not present for\
  \ the same value of 'w'."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "SUBJECT LEVEL ANALYSIS DATASET"
Check:
  expression: >-
    var_exists("STRATwVN") and not var_exists("STRATwV")
Outcome:
  Message: "STRATwVN is present, but STRATwV is not present."
  Output_Variables:
  - "STRATwVN"
wildcards:
  w:
    min: 1
    max: 9
Source:
  Class: "SUBJECT LEVEL ANALYSIS DATASET"
  Variable_or_Item: "STRATwVN where w is an integer [1-9, not zero-padded]"
  Natural_Language_Rule_Failure_Criteria: "STRATwVN is present and STRATwV is not\
    \ present for the same value of \"w\""
  Rule_Failure_Criteria: "STRATwV is not present"
  Condition_Failure: "STRATwVN is present"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.2"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR563"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.3"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR563"
        Version: "1"
      Version: "5.0"
