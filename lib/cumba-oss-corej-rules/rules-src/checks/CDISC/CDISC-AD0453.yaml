Core:
  Id: "CDISC-AD0453"
  Status: "Published"
  Version: "1"
Description: "Raise an error when REGIONyN is populated but REGIONy is empty"
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "SUBJECT LEVEL ANALYSIS DATASET"
Check:
  expression: >-
    not empty(REGIONyN) and empty(REGIONy)
Outcome:
  Message: "REGIONyN is populated, but REGIONy is empty"
  Output_Variables:
  - "REGIONy"
  - "REGIONyN"
wildcards:
  "y":
    min: 1
    max: 99
Source:
  Class: "SUBJECT LEVEL ANALYSIS DATASET"
  Variable_or_Item: "REGIONy where y is an integer [1-99, not zero-padded]"
  Natural_Language_Rule_Failure_Criteria: "On a given record, REGIONyN is populated\
    \ and REGIONy is not populated"
  Rule_Failure_Criteria: "REGIONy is not populated"
  Condition_Failure: "REGIONyN is populated"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.2"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR453"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.3"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR453"
        Version: "1"
      Version: "5.0"
