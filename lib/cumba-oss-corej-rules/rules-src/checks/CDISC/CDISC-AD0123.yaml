Core:
  Id: "CDISC-AD0123"
  Status: "Published"
  Version: "1"
Description: "Raise an error when there is more than one value of PARAMTYP for a given\
  \ value of PARAMCD."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "BASIC DATA STRUCTURE"
Requirements:
  Variables:
    All:
    - "PARAMTYP"
Check:
  expression: >-
    has_multiple_values_for(PARAMTYP, PARAMCD)
Outcome:
  Message: "PARAMTYP has more than one value for this PARAMCD."
  Output_Variables:
  - "PARAMCD"
  - "PARAMTYP"
Source:
  Class: "BASIC DATA STRUCTURE"
  Variable_or_Item: "PARAMTYP"
  Natural_Language_Rule_Failure_Criteria: "There is more than one value of PARAMTYP\
    \ for a given value of PARAMCD"
  Rule_Failure_Criteria: "There is more than one value of PARAMTYP for a given value\
    \ of PARAMCD"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.0"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR123"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.1"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR123"
        Version: "1"
      Version: "5.0"
