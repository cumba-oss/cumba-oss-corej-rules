Core:
  Id: "CDISC-AD0752"
  Status: "Published"
  Version: "1"
Description: "Raise an error when there is more than one value of TRTSEQP for a given\
  \ value of TRTSEQPN, considering only rows on which both variables are populated"
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "SUBJECT LEVEL ANALYSIS DATASET"
Check:
  expression: >-
    not empty(TRTSEQP) and not empty(TRTSEQPN) and has_multiple_values_for(TRTSEQP, TRTSEQPN)
Outcome:
  Message: "TRTSEQP has more than one value for this TRTSEQPN, among rows where both\
    \ are populated"
  Output_Variables:
  - "TRTSEQP"
  - "TRTSEQPN"
Source:
  Class: "SUBJECT LEVEL ANALYSIS DATASET"
  Variable_or_Item: "TRTSEQP"
  Natural_Language_Rule_Failure_Criteria: "There is more than one value of TRTSEQP\
    \ for a given value of TRTSEQPN, considering only those rows on which both variables\
    \ are populated"
  Rule_Failure_Criteria: "There is more than one value of TRTSEQP for a given value\
    \ of TRTSEQPN"
  Condition_Failure: "On rows where TRTSEQP and TRTSEQPN are both populated"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.1"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR752"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.2"
