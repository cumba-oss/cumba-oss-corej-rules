Core:
  Id: "CDISC-AD0617"
  Status: "Published"
  Version: "1"
Description: "Raise an error when there is more than one value of TRCMPGyN for a given\
  \ value of TRCMPGy, considering only rows on which both variables are populated,\
  \ where y is an integer [1-99, not zero-padded]."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "SUBJECT LEVEL ANALYSIS DATASET"
Check:
  expression: >-
    not empty(TRCMPGyN) and not empty(TRCMPGy) and has_multiple_values_for(TRCMPGyN, TRCMPGy)
Outcome:
  Message: "TRCMPGyN has more than one value for a given value of TRCMPGy, considering\
    \ only rows on which both variables are populated."
  Output_Variables:
  - "TRCMPGy"
  - "TRCMPGyN"
wildcards:
  "y":
    min: 1
    max: 99
Source:
  Class: "SUBJECT LEVEL ANALYSIS DATASET"
  Variable_or_Item: "TRCMPGyN where y is an integer [1-9, not zero-padded]"
  Natural_Language_Rule_Failure_Criteria: "There is more than one value of TRCMPGyN\
    \ for a given value of TRCMPGy, where y is an integer [1-99, not zero-padded],\
    \ considering only those rows on which both variables are populated"
  Rule_Failure_Criteria: "There is more than one value of TRCMPGyN for a given value\
    \ of TRCMPGy"
  Condition_Failure: "On rows where both TRCMPGyN and TRCMPGy are both populated."
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.1"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR617"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.2"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR617"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.3"
    References:
