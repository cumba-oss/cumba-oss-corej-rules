Core:
  Id: "CDISC-SEND-0164"
  Status: "Published"
  Version: "1"
Description: "Raise an error when the Test Short Name (DDTESTCD) is not \"DEATHD\"\
  \ in the Death Diagnosis and Details (DD) domain."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "DD"
Requirements:
  Variables:
    All:
    - "DDTESTCD"
Check:
  expression: >-
    DDTESTCD != "DEATHD"
Outcome:
  Message: "DDTESTCD is not \"DEATHD\"."
  Output_Variables:
  - "DDTESTCD"
Source:
  Class: "FND"
  Domain: "DD"
  Variable: "DDTESTCD"
  Plain_Text_Explanation: "DDTESTCD should always be DEATHD."
  Rule: "DDTESTCD = \"DEATHD\""
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "SENDIG"
    Version: "3.0"
    References:
    - Origin: "SEND Conformance Rules"
      Rule_Identifier:
        Id: "SEND164"
        Version: "1"
      Version: "5.0"
