  Variable_or_Item: "LVOTFN"
  Natural_Language_Rule_Failure_Criteria: "LVOTFN is present and LVOTFL is not present"
  Rule_Failure_Criteria: "VOTFL is not present"
  Condition_Failure: "LVOTFN is present"
