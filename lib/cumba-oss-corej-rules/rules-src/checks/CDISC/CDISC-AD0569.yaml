Core:
  Id: "CDISC-AD0569"
  Status: "Published"
  Version: "2"
Description: "Raise an error when LVOTFN is present and LVOTFL is not present."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "BASIC DATA STRUCTURE"
    - "OCCURRENCE DATA STRUCTURE"
    - "MEDICAL DEVICE OCCURRENCE DATA STRUCTURE"
Check:
  expression: >-
    var_exists("LVOTFN") and not var_exists("LVOTFL")
Outcome:
  Message: "LVOTFN is present, but LVOTFL is not present."
  Output_Variables:
  - "LVOTFN"
Source_Proposed:
  Sheet_Issue: "#62"
  Class: "BASIC DATA STRUCTURE; MEDICAL DEVICE BASIC DATA STRUCTURE; OCCURRENCE DATA\
    \ STRUCTURE; MEDICAL DEVICE OCCURRENCE DATA STRUCTURE"
  Subclass: ""
  SEND_SDTM_Domain: ""
  Variable_or_Item: "LVOTFN"
  Natural_Language_Rule_Failure_Criteria: "LVOTFN is present and LVOTFL is not present"
  Rule_Failure_Criteria: "LVOTFL is not present"
  Condition_Failure: "LVOTFN is present"
Source:
  Class: "BASIC DATA STRUCTURE; MEDICAL DEVICE BASIC DATA STRUCTURE; OCCURRENCE DATA\
