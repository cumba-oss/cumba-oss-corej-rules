Core:
  Id: "CDISC-AD0810-A"
  Status: "Published"
  Version: "1"
Description: "Raise an error when the dataset carries USUBJID but no USUBJIDN variable\
  \ at all; the numeric companion must be present alongside USUBJID."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "BASIC DATA STRUCTURE"
  Subclasses:
    Include:
    - "POPULATION PHARMACOKINETIC ANALYSIS"
Check:
  expression: >-
    var_exists("USUBJID") and not var_exists("USUBJIDN")
Outcome:
  Message: "USUBJIDN is not present in the dataset although USUBJID is; the numeric\
    \ companion USUBJIDN must accompany USUBJID."
Source_Proposed:
  Sheet_Issue: "#149"
  Class: "BASIC DATA STRUCTURE"
  Subclass: "POPULATION PHARMACOKINETIC ANALYSIS"
  SEND_SDTM_Domain: ""
  Variable_or_Item: "USUBJIDN"
  Natural_Language_Rule_Failure_Criteria: "the dataset carries USUBJID but no USUBJIDN\
    \ variable at all; the numeric companion must be present alongside USUBJID"
  Rule_Failure_Criteria: "USUBJIDN is not populated"
  Condition_Failure: "USUBJID is populated"
Source:
  Class: "BASIC DATA STRUCTURE"
  Subclass: "POPULATION PHARMACOKINETIC ANALYSIS"
  Variable_or_Item: "USUBJIDN"
  Natural_Language_Rule_Failure_Criteria: "USUBJID is populated and USUBJIDN is not\
    \ populated"
  Rule_Failure_Criteria: "USUBJIDN is not populated"
  Condition_Failure: "USUBJID is populated"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.3"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR810"
        Version: "1"
      Version: "5.0"
