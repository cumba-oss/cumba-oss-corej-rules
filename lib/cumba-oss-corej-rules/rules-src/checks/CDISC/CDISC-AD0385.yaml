Core:
  Id: "CDISC-AD0385"
  Status: "Published"
  Version: "2"
Description: "Raise an error when BTOXGRL is populated and BTOXGRLN is not populated."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "BASIC DATA STRUCTURE"
    - "MEDICAL DEVICE BASIC DATA STRUCTURE"
Requirements:
  Variables:
    All:
    - "BTOXGRL"
    - "BTOXGRLN"
Check:
  expression: >-
    not empty(BTOXGRL) and empty(BTOXGRLN)
Outcome:
  Message: "BTOXGRL is populated but BTOXGRLN is not populated."
  Output_Variables:
  - "BTOXGRL"
  - "BTOXGRLN"
Source:
  Class: "BASIC DATA STRUCTURE; MEDICAL DEVICE BASIC DATA STRUCTURE"
  Variable_or_Item: "BTOXGRLN"
  Natural_Language_Rule_Failure_Criteria: "On a given record, BTOXGRL is populated\
    \ and BTOXGRLN is not populated"
  Rule_Failure_Criteria: "BTOXGRLN is not populated"
  Condition_Failure: "BTOXGRL is populated"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.2"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR385"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.3"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR385"
        Version: "2"
      Version: "5.0"
