Core:
  Id: "CDISC-AD0460"
  Status: "Published"
  Version: "2"
Description: "Raise an error when TSEQPGy is populated but TSEQPGyN is missing"
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "SUBJECT LEVEL ANALYSIS DATASET"
Requirements:
  Variables:
    All:
    - "TSEQPGy"
    - "TSEQPGyN"
Check:
  expression: >-
    not empty(TSEQPGy) and empty(TSEQPGyN)
Outcome:
  Message: "TSEQPGy is populated, but TSEQPGyN is missing"
  Output_Variables:
  - "TSEQPGy"
  - "TSEQPGyN"
wildcards:
  "y":
    min: 1
    max: 99
Source:
  Class: "BASIC DATA STRUCTURE; MEDICAL DEVICE BASIC DATA STRUCTURE; OCCURRENCE DATA\
    \ STRUCTURE; MEDICAL DEVICE OCCURRENCE DATA STRUCTURE"
  Variable_or_Item: "TSEQPGyN where y is an integer [1-9, not zero-padded]"
  Natural_Language_Rule_Failure_Criteria: "On a given record, TSEQPGy is populated\
    \ and TSEQPGyN is not populated"
  Rule_Failure_Criteria: "TSEQPGyN is not populated"
  Condition_Failure: "TSEQPGy is populated"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.2"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR460"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.3"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR460"
        Version: "2"
      Version: "5.0"
