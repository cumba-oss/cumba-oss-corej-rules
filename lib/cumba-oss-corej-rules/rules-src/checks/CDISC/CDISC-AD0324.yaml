Core:
  Id: "CDISC-AD0324"
  Status: "Published"
  Version: "2"
Description: "Raise an error when, within a study, there is more than one value of\
  \ APHASE for a given value of APHASEN, considering only rows on which both variables\
  \ are populated."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "BASIC DATA STRUCTURE"
    - "OCCURRENCE DATA STRUCTURE"
    - "MEDICAL DEVICE OCCURRENCE DATA STRUCTURE"
Check:
  expression: >-
    not empty(APHASE) and not empty(APHASEN) and has_multiple_values_for(APHASE, APHASEN)
Outcome:
  Message: "Within this study, APHASE has more than one value for the same value of\
    \ APHASEN, considering only rows on which both variables are populated."
  Output_Variables:
  - "APHASE"
  - "APHASEN"
Source:
  Class: "BASIC DATA STRUCTURE; MEDICAL DEVICE BASIC DATA STRUCTURE; OCCURRENCE DATA\
    \ STRUCTURE; MEDICAL DEVICE OCCURRENCE DATA STRUCTURE"
  Variable_or_Item: "APHASE"
  Natural_Language_Rule_Failure_Criteria: "Within a study, there is more than one\
    \ value of APHASE for a given value of APHASEN, considering only those rows on\
    \ which both variables are populated"
  Rule_Failure_Criteria: "Within a study, there is more than one value of APHASE for\
    \ a given value of APHASEN"
  Condition_Failure: "On rows where both APHASE and APHASEN are both populated"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.1"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR324"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.2"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR324"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.3"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR324"
        Version: "2"
      Version: "5.0"
