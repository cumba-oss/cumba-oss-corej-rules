Core:
  Id: "CDISC-CG0083"
  Status: "Published"
  Version: "1"
Description: "Raise an error when --BDSYCD and --BODSYS do not have a one-to-one relationship."
Executability: "Fully Executable"
Scope:
  Classes:
    Include:
    - "EVENTS"
Requirements:
  Variables:
    All:
    - "--BDSYCD"
    - "--BODSYS"
Check:
  expression: >-
    not is_unique_relationship(--BDSYCD, --BODSYS)
Outcome:
  Message: "--BDSYCD and --BODSYS do not have a one-to-one relationship."
  Output_Variables:
  - "--BODSYS"
  - "--BDSYCD"
Source:
  Class: "EVT"
  Domain: "ALL"
  Variable: "--BDSYCD"
  Rule: "--BDSYCD and --BODSYS have a one-to-one relationship"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "SDTMIG"
    Version: "3.4"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0083"
        Version: "2"
      Version: "2.0"
  - Name: "SDTMIG"
    Version: "3.3"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0083"
        Version: "2"
      Version: "2.0"
  - Name: "SDTMIG"
    Version: "3.2"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0083"
        Version: "2"
      Version: "2.0"
