Core:
  Id: "CDISC-AD0233"
  Status: "Published"
  Version: "1"
Description: "Raise an error when TRxxPGyN is populated, TRxxPGy is populated, and\
  \ there is more than one value of TRxxPGyN for a given value of TRxxPGy"
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "SUBJECT LEVEL ANALYSIS DATASET"
Check:
  expression: >-
    not empty(TRxxPGyN) and not empty(TRxxPGy) and has_multiple_values_for(TRxxPGyN, TRxxPGy)
Outcome:
  Message: "More than one value of TRxxPGyN is recorded for the same value of TRxxPGy"
  Output_Variables:
  - "TRxxPGy"
  - "TRxxPGyN"
wildcards:
  xx:
    min: 1
    max: 99
  "y":
    min: 1
    max: 9
Source:
  Class: "SUBJECT LEVEL ANALYSIS DATASET"
  Variable_or_Item: "TRxxPGyN where xx is an integer [01-99, zero-padded] and y is\
    \ an integer [1-9, not zero-padded]"
  Natural_Language_Rule_Failure_Criteria: "There is more than one value of TRxxPGyN\
    \ for a given value of TRxxPGy, where xx is an integer [01-99, zero-padded] and\
    \ y is a single-digit integer [1-9]"
  Rule_Failure_Criteria: "There is more than one value of TRxxPGyN for a given value\
    \ of TRxxPGy"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.0"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR233"
        Version: "1"
      Version: "5.0"
