Core:
  Id: "CDISC-AD0893"
  Status: "Published"
  Version: "1"
Description: "Raise an error when, within an ADNCA v1.0 dataset and considering only\
  \ rows on which both ACYCLEC and ACYCLE are populated, more than one value of ACYCLEC\
  \ is present for a given value of ACYCLE."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "BASIC DATA STRUCTURE"
  Subclasses:
    Include:
    - "NON-COMPARTMENTAL ANALYSIS"
Check:
  expression: >-
    not empty(ACYCLE) and not empty(ACYCLEC) and has_multiple_values_for(ACYCLEC, ACYCLE)
Outcome:
  Message: "There is more than one value of ACYCLEC for a given value of ACYCLE."
  Output_Variables:
  - "ACYCLE"
  - "ACYCLEC"
Source:
  Class: "BASIC DATA STRUCTURE"
  Subclass: "NON-COMPARTMENTAL ANALYSIS"
  Variable_or_Item: "ACYCLEC"
  Natural_Language_Rule_Failure_Criteria: "On a given record, there is more than one\
    \ value of ACYCLEC for a given value of ACYCLE, considering only those rows on\
    \ which both variables are populated"
  Rule_Failure_Criteria: "There is more than one value of ACYCLEC for a given value\
    \ of ACYCLE"
  Condition_Failure: "On rows where both ACYCLEC and ACYCLE are both populated."
Standards:
- Organization: "CDISC"
  Standards:
