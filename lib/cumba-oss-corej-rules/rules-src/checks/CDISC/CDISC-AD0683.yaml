Core:
  Id: "CDISC-AD0683"
  Status: "Published"
  Version: "1"
Description: "Raise an error when, on a given record, MODELGy is populated but MODELGyN\
  \ is missing."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "DEVICE LEVEL ANALYSIS DATASET"
Check:
  expression: >-
    not empty(MODELGy) and empty(MODELGyN)
Outcome:
  Message: "MODELGy is populated but MODELGyN is missing on this record."
  Output_Variables:
  - "MODELGy"
  - "MODELGyN"
wildcards:
  "y":
    min: 1
    max: 99
Source:
  Class: "DEVICE LEVEL ANALYSIS DATASET"
  Variable_or_Item: "MODELGyN where y is an integer [1-9, not zero-padded]"
  Natural_Language_Rule_Failure_Criteria: "On a given record, MODELGy is populated\
    \ and MODELGyN is not populated"
  Rule_Failure_Criteria: "MODELGyN is not populated"
  Condition_Failure: "MODELGy is populated"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.3"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR683"
        Version: "1"
      Version: "5.0"
