Core:
  Id: "CDISC-SEND-0017"
  Status: "Published"
  Version: "1"
Description: "Raise an error when a Test Short Name (--TESTCD) value is longer than\
  \ 8 characters."
Executability: "Fully Executable"
Scope:
  Classes:
    Include:
    - "FINDINGS"
Requirements:
  Variables:
    All:
    - "--TESTCD"
Check:
  expression: >-
    len(--TESTCD) > 8
Outcome:
  Message: "--TESTCD value is longer than 8 characters."
  Output_Variables:
  - "--TESTCD"
Source:
  Class: "FND"
  Domain: "ALL"
  Variable: "--TESTCD"
  Plain_Text_Explanation: "--TESTCD value can not be longer than 8 characters"
  Rule: "--TESTCD value length<= 8 chars"
