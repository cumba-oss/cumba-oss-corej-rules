Core:
  Id: "CDISC-AD0755"
  Status: "Published"
  Version: "1"
Description: "Raise an error when there is more than one value of TRTSEQAN for a given\
  \ value of TRTSEQA, considering only rows on which both variables are populated"
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "SUBJECT LEVEL ANALYSIS DATASET"
Check:
  expression: >-
    not empty(TRTSEQAN) and not empty(TRTSEQA) and has_multiple_values_for(TRTSEQAN, TRTSEQA)
Outcome:
  Message: "TRTSEQAN has more than one value for this TRTSEQA, among rows where both\
    \ are populated"
  Output_Variables:
  - "TRTSEQA"
  - "TRTSEQAN"
Source:
  Class: "SUBJECT LEVEL ANALYSIS DATASET"
  Variable_or_Item: "TRTSEQAN"
  Natural_Language_Rule_Failure_Criteria: "There is more than one value of TRTSEQAN\
    \ for a given value of TRTSEQA, considering only those rows on which both variables\
    \ are populated"
  Rule_Failure_Criteria: "There is more than one value of TRTSEQAN for a given value\
    \ of TRTSEQA"
  Condition_Failure: "On rows where TRTSEQAN and TRTSEQA are both populated"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.1"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR755"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.2"
