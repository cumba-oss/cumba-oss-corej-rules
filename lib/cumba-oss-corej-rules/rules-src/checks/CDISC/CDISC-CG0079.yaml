Core:
  Id: "CDISC-CG0079"
  Status: "Published"
  Version: "1"
Description: "Raise an error when MHSTDTC is populated and is the same as or later\
  \ than RFSTDTC in the DM dataset. Medical history events should start before the\
  \ Subject Reference Start Date/Time (RFSTDTC)."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "MH"
Requirements:
  Variables:
    All:
    - "MHSTDTC"
Match_Datasets:
- Keys:
  - "USUBJID"
  Name: "DM"
Check:
  expression: >-
    not empty(MHSTDTC) and date(MHSTDTC) >= DM.RFSTDTC
Outcome:
  Message: "MHSTDTC is populated and is the same as or later than RFSTDTC in the DM\
    \ dataset."
  Output_Variables:
  - "MHSTDTC"
  - "DM.RFSTDTC"
Source:
  Class: "EVT"
  Domain: "MH"
  Variable: "MHSTDTC"
  Condition: "MHSTDTC ^= null"
  Rule: "MHSTDTC < DM.RFSTDTC"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "SDTMIG"
    Version: "3.4"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0079"
        Version: "1"
      Version: "2.0"
  - Name: "SDTMIG"
    Version: "3.3"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0079"
        Version: "1"
      Version: "2.0"
  - Name: "SDTMIG"
    Version: "3.2"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0079"
        Version: "1"
      Version: "2.0"
