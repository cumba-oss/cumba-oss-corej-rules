Core:
  Id: "CDISC-SEND-0131.1"
  Status: "Published"
  Version: "1"
Description: "Raise an error when more than one Exposure (EX) record exists for the\
  \ same combination of subject or pool (USUBJID, POOLID), administration site (FOCID),\
  \ treatment (EXTRT), and dosing interval (EXSTDTC, EXENDTC); the EX domain expects\
  \ one record per constant dosing interval per subject or pool per treatment per\
  \ administration site."
Executability: "Partially Executable - Possible Overreporting"
Scope:
  Domains:
    Include:
    - "EX"
Check:
  expression: >-
    not is_unique_set([USUBJID, POOLID, FOCID, EXTRT, EXSTDTC, EXENDTC])
Outcome:
  Message: "More than one EX record exists for the same treatment, dosing interval,\
    \ and administration site within a subject or pool."
  Output_Variables:
  - "POOLID"
  - "FOCID"
  - "EXTRT"
  - "EXSTDTC"
  - "EXENDTC"
Source:
  Class: "INT"
  Domain: "EX"
  Variable: "ALL"
  Plain_Text_Explanation: "One record per constant dosing interval per subject or\
    \ pool per treatment per administration site (if identified in FOCID)"
  Rule: "One record per constant dosing interval per subject or pool per treatment\
    \ per administration site (if identified in FOCID)"
