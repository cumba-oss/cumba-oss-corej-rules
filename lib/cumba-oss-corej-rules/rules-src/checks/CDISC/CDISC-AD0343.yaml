Core:
  Id: "CDISC-AD0343"
  Status: "Published"
  Version: "2"
Description: "Raise an error when, within a parameter, ANRLOC has more than one value\
  \ for a given value of ANRLO"
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "BASIC DATA STRUCTURE"
    - "MEDICAL DEVICE BASIC DATA STRUCTURE"
Check:
  expression: >-
    has_multiple_values_for(ANRLOC, ANRLO, within=PARAMCD)
Outcome:
  Message: "Within this parameter, ANRLOC has more than one value for the same value\
    \ of ANRLO."
  Output_Variables:
  - "PARAMCD"
  - "ANRLO"
  - "ANRLOC"
Source:
  Class: "BASIC DATA STRUCTURE; MEDICAL DEVICE BASIC DATA STRUCTURE"
  Variable_or_Item: "ANRLOC"
  Natural_Language_Rule_Failure_Criteria: "Within a parameter, there is more than\
    \ one value of ANRLOC for a given value of ANRLO"
  Rule_Failure_Criteria: "Within a parameter, there is more than one value of ANRLOC\
    \ for a given value of ANRLO"
