Core:
  Id: "CDISC-AD0562"
  Status: "Published"
  Version: "1"
Description: "Raise an error when STRATAVN is present and STRATAV is not present."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "SUBJECT LEVEL ANALYSIS DATASET"
Check:
  expression: >-
    var_exists("STRATAVN") and not var_exists("STRATAV")
Outcome:
  Message: "STRATAVN is present, but STRATAV is not present."
  Output_Variables:
  - "STRATAVN"
Source:
  Class: "SUBJECT LEVEL ANALYSIS DATASET"
  Variable_or_Item: "STRATAVN"
  Natural_Language_Rule_Failure_Criteria: "STRATAVN is present and STRATAV is not\
    \ present"
  Rule_Failure_Criteria: "STRATAV is not present"
  Condition_Failure: "STRATAVN is present"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.2"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR562"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.3"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR562"
        Version: "1"
      Version: "5.0"
