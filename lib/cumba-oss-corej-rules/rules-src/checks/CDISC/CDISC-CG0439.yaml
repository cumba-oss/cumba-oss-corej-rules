Core:
  Id: "CDISC-CG0439"
  Status: "Published"
  Version: "1"
Description: "Raise an error when TSVAL is populated with a value that is not a valid\
  \ ISO 8601 duration (time period) for a record where TSPARMCD equals 'LENGTH' (Trial\
  \ Length)."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "TS"
Requirements:
  Variables:
    All:
    - "TSPARMCD"
Check:
  expression: >-
    TSPARMCD == "LENGTH" and not empty(TSVAL) and invalid_duration(TSVAL, negative=false)
Outcome:
  Message: "Invalid TSVAL value for LENGTH: TSVAL must be in ISO 8601 duration format\
    \ (e.g., P2Y) when TSPARMCD equals 'LENGTH' (Trial Length)."
  Output_Variables:
  - "TSPARMCD"
  - "TSVAL"
Source:
  Class: "TDM"
  Domain: "TS"
  Variable: "TSVAL"
  Condition: "TSPARMCD = 'LENGTH' and TSVAL ^= null"
  Rule: "TSVAL conforms to ISO 8601 time period"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "SDTMIG"
    Version: "3.3"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0439"
        Version: "1"
      Version: "2.0"
  - Name: "SDTMIG"
    Version: "3.2"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0439"
        Version: "1"
      Version: "2.0"
