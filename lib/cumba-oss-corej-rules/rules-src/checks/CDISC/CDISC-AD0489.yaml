Core:
  Id: "CDISC-AD0489"
  Status: "Published"
  Version: "2"
Description: "Raise an error when ONTRTFN is populated and ONTRTFL is empty on the\
  \ same record."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "BASIC DATA STRUCTURE"
    - "MEDICAL DEVICE BASIC DATA STRUCTURE"
    - "OCCURRENCE DATA STRUCTURE"
    - "MEDICAL DEVICE OCCURRENCE DATA STRUCTURE"
Check:
  expression: >-
    not empty(ONTRTFN) and empty(ONTRTFL)
Outcome:
  Message: "ONTRTFN is populated but ONTRTFL is empty."
  Output_Variables:
  - "ONTRTFL"
  - "ONTRTFN"
Source:
  Class: "BASIC DATA STRUCTURE; MEDICAL DEVICE BASIC DATA STRUCTURE; OCCURRENCE DATA\
    \ STRUCTURE; MEDICAL DEVICE OCCURRENCE DATA STRUCTURE"
  Variable_or_Item: "ONTRTFL"
  Natural_Language_Rule_Failure_Criteria: "On a given record, ONTRTFN is populated\
    \ and ONTRTFL is not populated"
  Rule_Failure_Criteria: "ONTRTFL is not populated"
  Condition_Failure: "ONTRTFN is populated"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.2"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR489"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.3"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR489"
        Version: "2"
      Version: "5.0"
