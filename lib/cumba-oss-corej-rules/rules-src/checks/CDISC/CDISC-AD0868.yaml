Core:
  Id: "CDISC-AD0868"
  Status: "Published"
  Version: "1"
Description: "Raise an error when, considering only rows on which both RACE and RACEN\
  \ are populated, more than one value of RACE is present within the dataset for a\
  \ given value of RACEN."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "BASIC DATA STRUCTURE"
Check:
  expression: >-
    not empty(RACE) and not empty(RACEN) and has_multiple_values_for(RACE, RACEN)
Outcome:
  Message: "More than one value of RACE is present for this value of RACEN within\
    \ the dataset."
  Output_Variables:
  - "RACE"
  - "RACEN"
Source:
  Class: "BASIC DATA STRUCTURE"
  Subclass: "POPULATION PHARMACOKINETIC ANALYSIS"
  Variable_or_Item: "RACE"
  Natural_Language_Rule_Failure_Criteria: "Within a dataset, there is more than one\
    \ value of RACE for a given value of RACEN, considering only those rows on which\
    \ both variables are populated"
  Rule_Failure_Criteria: "Within a dataset, there is more than one value of RACE for\
    \ a given value of RACEN"
  Condition_Failure: "On rows where both RACE and RACEN are both populated"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.3"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR868"
        Version: "1"
      Version: "5.0"
