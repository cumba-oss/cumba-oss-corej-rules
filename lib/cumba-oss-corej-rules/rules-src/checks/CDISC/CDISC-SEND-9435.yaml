Core:
  Id: "CDISC-SEND-9435"
  Status: "Published"
  Version: "1"
Description: "Raise an error when TXPARMCD is not populated"
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "TX"
Requirements:
  Variables:
    All:
    - "TXPARMCD"
Check:
  expression: >-
    empty(TXPARMCD)
Outcome:
  Message: "TXPARMCD is empty"
  Output_Variables:
  - "TXPARMCD"
Source_Proposed:
  Class: "ALL"
  Domain: "TX"
  Variable: "TXPARMCD"
  Plain_Text_Explanation: "TXPARMCD must be populated for every record."
  Condition: ""
  Rule: "TXPARMCD ^= null"
Source:
  Class: "ALL"
  Domain: "ALL"
  Variable: "GEN"
  Plain_Text_Explanation: "Required variables must always be included in the dataset\
    \ and cannot be null for any record."
  Condition: "Variable Core Status = Required"
  Rule: "Variable present in dataset and ^= null"
