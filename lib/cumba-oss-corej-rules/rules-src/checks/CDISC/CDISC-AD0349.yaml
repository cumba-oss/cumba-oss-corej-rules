Core:
  Id: "CDISC-AD0349"
  Status: "Published"
  Version: "2"
Description: "Raise an error when R2AyHI is present and AyHI is not present"
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "BASIC DATA STRUCTURE"
Check:
  expression: >-
    var_exists("R2AyHI") and not var_exists("AyHI")
Outcome:
  Message: "R2AyHI is present, but AyHI is not present."
  Output_Variables:
  - "R2AyHI"
wildcards:
  "y":
    min: 1
    max: 99
Source:
  Class: "BASIC DATA STRUCTURE; MEDICAL DEVICE BASIC DATA STRUCTURE"
  Variable_or_Item: "R2AyHI where y is an integer [1-99, not zero-padded]"
  Natural_Language_Rule_Failure_Criteria: "R2AyHI is present and AyHI is not present"
  Rule_Failure_Criteria: "AyHI is not present"
  Condition_Failure: "R2AyHI is present"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.1"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR349"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.2"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR349"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.3"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR349"
        Version: "2"
      Version: "5.0"
