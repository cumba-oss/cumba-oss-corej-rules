Core:
  Id: "CDISC-CG0214"
  Status: "Published"
  Version: "1"
Description: "Raise an error when SVUPDES is populated and VISITNUM is equal to a\
  \ VISITNUM present in the TV dataset."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "SV"
Requirements:
  Variables:
    All:
    - "SVUPDES"
    - "VISITNUM"
Operations:
- id: "$visitnums_in_tv"
  expression: "distinct(VISITNUM, domain=\"TV\")"
Check:
  expression: >-
    not empty(SVUPDES) and VISITNUM in $visitnums_in_tv
Outcome:
  Message: "SVUPDES is populated, but the VISITNUM is equal to a VISITNUM present\
    \ in the TV dataset."
  Output_Variables:
  - "VISITNUM"
  - "!SVUPDES"
  - "$visitnums_in_tv"
Source:
  Class: "SPC"
  Domain: "SV"
  Variable: "VISITNUM"
  Condition: "SVUPDES ^= null"
  Rule: "VISITNUM not in TV.VISITNUM"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "SDTMIG"
    Version: "3.3"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0214"
        Version: "1"
      Version: "2.0"
  - Name: "SDTMIG"
    Version: "3.2"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0214"
        Version: "1"
      Version: "2.0"
