Core:
  Id: "CDISC-AD0828"
  Status: "Published"
  Version: "1"
Description: "Raise an error when, within a dataset, there is more than one value\
  \ of FLGREAS for a given value of FLGREASC, considering only records where both\
  \ variables are populated"
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "BASIC DATA STRUCTURE"
Check:
  expression: >-
    not empty(FLGREAS) and not empty(FLGREASC) and has_multiple_values_for(FLGREAS, FLGREASC)
Outcome:
  Message: "Within this dataset, more than one value of FLGREAS is present for the\
    \ same populated value of FLGREASC"
  Output_Variables:
  - "FLGREAS"
  - "FLGREASC"
Source:
  Class: "BASIC DATA STRUCTURE"
  Subclass: "POPULATION PHARMACOKINETIC ANALYSIS"
  Variable_or_Item: "FLGREAS"
  Natural_Language_Rule_Failure_Criteria: "Within a dataset, there is more than one\
    \ value of FLGREAS for a given value of FLGREASC, considering only those rows\
    \ on which both variables are populated"
  Rule_Failure_Criteria: "Within a dataset, there is more than one value of FLGREAS\
    \ for a given value of FLGREASC"
  Condition_Failure: "On rows where both FLGREAS and FLGREASC are both populated"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.3"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR828"
        Version: "1"
      Version: "5.0"
