Core:
  Id: "CDISC-CG0397"
  Status: "Published"
  Version: "1"
Description: "Raise an error when Result or Finding in Original Units (--ORRES) is\
  \ populated or Derived Flag (--DRVFL) is equal to 'Y' but Result or Finding in Standard\
  \ Format (--STRESC) is empty."
Executability: "Fully Executable"
Scope:
  Classes:
    Include:
    - "FINDINGS"
Check:
  expression: >-
    (not empty(--ORRES) or var_exists("--DRVFL") and --DRVFL == "Y") and empty(--STRESC)
Outcome:
  Message: "--STRESC is empty when --ORRES is populated or --DRVFL is equal to 'Y'."
  Output_Variables:
  - "--ORRES"
  - "!--STRESC"
  - "--DRVFL"
Source:
  Class: "FND"
  Domain: "ALL"
  Variable: "--STRESC"
  Condition: "--ORRES ^= null or --DRVFL = 'Y'"
  Rule: "--STRESC ^= null"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "SDTMIG"
    Version: "3.4"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0397"
        Version: "1"
      Version: "2.0"
  - Name: "SDTMIG"
    Version: "3.3"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0397"
        Version: "1"
      Version: "2.0"
  - Name: "SDTMIG"
    Version: "3.2"
