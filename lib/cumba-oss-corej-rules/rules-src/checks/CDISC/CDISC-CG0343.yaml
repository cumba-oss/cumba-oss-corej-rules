Core:
  Id: "CDISC-CG0343"
  Status: "Published"
  Version: "1"
Description: "Raise an error when --TERM is equal to 'OTHER'."
Executability: "Fully Executable"
Scope:
  Classes:
    Include:
    - "EVENTS"
Requirements:
  Variables:
    All:
    - "--TERM"
Check:
  expression: >-
    --TERM == "OTHER"
Outcome:
  Message: "--TERM is equal to 'OTHER'."
  Output_Variables:
  - "--TERM"
Source:
  Class: "EVT"
  Domain: "ALL"
  Variable: "--TERM"
  Rule: "--TERM ^= 'OTHER'"
