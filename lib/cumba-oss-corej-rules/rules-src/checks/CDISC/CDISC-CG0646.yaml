Core:
  Id: "CDISC-CG0646"
  Status: "Published"
  Version: "1"
Description: "Raise an error when the SJ (Subject Reproductive Stages) dataset is\
  \ present in the study, since it is not used in human clinical trials."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "SJ"
Check:
  expression: >-
    ds_exists("SJ")
Outcome:
  Message: "The SJ (Subject Reproductive Stages) dataset must not be present in the\
    \ study because it is not used in human clinical trials."
Source:
  Class: "SPC"
  Domain: "SJ"
  Rule: "SJ dataset not present"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "SDTMIG"
    Version: "3.4"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0646"
        Version: "1"
      Version: "2.0"
