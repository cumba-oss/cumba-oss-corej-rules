Core:
  Id: "CDISC-AD0677"
  Status: "Published"
  Version: "1"
Description: "Raise an error when there is more than one value of DEVTYGy for a given\
  \ value of DEVTYGyN, considering only rows where both variables are populated."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "DEVICE LEVEL ANALYSIS DATASET"
Check:
  expression: >-
    not empty(DEVTYGy) and not empty(DEVTYGyN) and has_multiple_values_for(DEVTYGy, DEVTYGyN)
Outcome:
  Message: "More than one value of DEVTYGy was found for a given value of DEVTYGyN,\
    \ among the rows where both variables are populated."
  Output_Variables:
  - "DEVTYGy"
  - "DEVTYGyN"
wildcards:
  "y":
    min: 1
    max: 99
Source:
  Class: "DEVICE LEVEL ANALYSIS DATASET"
  Variable_or_Item: "DEVTYGy where y is an integer [1-99, not zero-padded]"
  Natural_Language_Rule_Failure_Criteria: "There is more than one value of DEVTYGy\
    \ for a given value of DEVTYGyN, considering only those rows on which both variables\
    \ are populated"
  Rule_Failure_Criteria: "There is more than one value of DEVTYGy for a given value\
    \ of DEVTYGyN"
  Condition_Failure: "On rows where both DEVTYGy and DEVTYGyN are both populated."
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.3"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR677"
        Version: "1"
      Version: "5.0"
