Core:
  Id: "CDISC-AD0398"
  Status: "Published"
  Version: "2"
Description: "Raise an error when ATOXGRHN is populated and ATOXGRH is not populated."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "BASIC DATA STRUCTURE"
Requirements:
  Variables:
    All:
    - "ATOXGRHN"
    - "ATOXGRH"
Check:
  expression: >-
    not empty(ATOXGRHN) and empty(ATOXGRH)
Outcome:
  Message: "ATOXGRHN is populated but ATOXGRH is not populated."
  Output_Variables:
  - "ATOXGRH"
  - "ATOXGRHN"
Source:
  Class: "BASIC DATA STRUCTURE; MEDICAL DEVICE BASIC DATA STRUCTURE"
  Variable_or_Item: "ATOXGRH"
  Natural_Language_Rule_Failure_Criteria: "On a given record, ATOXGRHN is populated\
    \ and ATOXGRH is not populated"
  Rule_Failure_Criteria: "ATOXGRH is not populated"
  Condition_Failure: "ATOXGRHN is populated"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.2"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR398"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.3"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR398"
        Version: "2"
      Version: "5.0"
