Core:
  Id: "CDISC-AD0320"
  Status: "Published"
  Version: "1"
Description: "Raise an error when a dataset is named ADSL and the dataset label is\
  \ not 'Subject-Level Analysis Dataset'."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "SUBJECT LEVEL ANALYSIS DATASET"
Check:
  expression: >-
    ds_label("DATA") != "Subject-Level Analysis Dataset"
Outcome:
  Message: "This dataset is named ADSL, but its label is not 'Subject-Level Analysis\
    \ Dataset'."
  Output_Variables:
  - "dataset_name"
  - "dataset_label"
Source:
  Class: "SUBJECT LEVEL ANALYSIS DATASET"
  Natural_Language_Rule_Failure_Criteria: "A dataset is named ADSL and the dataset\
    \ label is not \"Subject-Level Analysis Dataset\""
  Rule_Failure_Criteria: "Dataset label is not \"Subject-Level Analysis Dataset\""
  Condition_Failure: "Dataset is named ADSL"
