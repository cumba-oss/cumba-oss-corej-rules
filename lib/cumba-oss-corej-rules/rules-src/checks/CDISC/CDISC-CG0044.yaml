Core:
  Id: "CDISC-CG0044"
  Status: "Published"
  Version: "1"
Description: "Raise an error when AESTAT is present in the AE dataset."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "AE"
Check:
  expression: >-
    var_exists("AESTAT")
Outcome:
  Message: "AESTAT must not be present in the AE dataset."
  Output_Variables:
  - "AESTAT"
Source:
  Class: "EVT"
  Domain: "AE"
  Variable: "AESTAT"
  Rule: "AESTAT not present in dataset"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "SDTMIG"
    Version: "3.4"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0044"
        Version: "1"
      Version: "2.0"
  - Name: "SDTMIG"
    Version: "3.3"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0044"
        Version: "1"
      Version: "2.0"
