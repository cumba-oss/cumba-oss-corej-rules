Core:
  Id: "CDISC-CG0642"
  Status: "Published"
  Version: "1"
Description: "Raise an error when the SPECIES variable is present in the Demographics\
  \ (DM) dataset, since SPECIES is not used in human clinical trials."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "DM"
Check:
  expression: >-
    var_exists("SPECIES")
Outcome:
  Message: "SPECIES must not be present in the Demographics (DM) dataset because it\
    \ is not used in human clinical trials."
  Output_Variables:
  - "SPECIES"
Source:
  Class: "SPC"
  Domain: "DM"
  Variable: "SPECIES"
  Rule: "SPECIES not present in dataset"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "SDTMIG"
    Version: "3.4"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0642"
        Version: "1"
      Version: "2.0"
