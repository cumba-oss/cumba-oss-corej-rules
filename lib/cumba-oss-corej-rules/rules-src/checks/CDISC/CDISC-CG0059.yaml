Core:
  Id: "CDISC-CG0059"
  Status: "Published"
  Version: "1"
Description: "Raise an error when Start Reference Time Point (--STTPT) is populated\
  \ but Start Relative to Reference Time Point (--STRTPT) is not populated."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "ALL"
Requirements:
  Variables:
    All:
    - "--STRTPT"
    - "--STTPT"
Check:
  expression: >-
    not empty(--STTPT) and empty(--STRTPT)
Outcome:
  Message: "--STRTPT is empty when --STTPT is populated."
  Output_Variables:
  - "--STRTPT"
  - "--STTPT"
Source:
  Class: "ALL"
  Domain: "ALL"
  Variable: "--STRTPT"
  Condition: "--STTPT ^= null"
  Rule: "--STRTPT ^= null"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "SDTMIG"
    Version: "3.4"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0059"
        Version: "1"
      Version: "2.0"
  - Name: "SDTMIG"
    Version: "3.3"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0059"
        Version: "1"
      Version: "2.0"
  - Name: "SDTMIG"
    Version: "3.2"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0059"
        Version: "1"
      Version: "2.0"
