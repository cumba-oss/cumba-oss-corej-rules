Core:
  Id: "CDISC-AD0455"
  Status: "Published"
  Version: "2"
Description: "Raise an error when SHIFTyN is populated but SHIFTy is empty"
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "BASIC DATA STRUCTURE"
Check:
  expression: >-
    not empty(SHIFTyN) and empty(SHIFTy)
Outcome:
  Message: "SHIFTyN is populated, but SHIFTy is empty"
  Output_Variables:
  - "SHIFTy"
  - "SHIFTyN"
wildcards:
  "y":
    min: 1
    max: 99
Source:
  Class: "BASIC DATA STRUCTURE; MEDICAL DEVICE BASIC DATA STRUCTURE"
  Variable_or_Item: "SHIFTy where y is an integer [1-99, not zero-padded]"
  Natural_Language_Rule_Failure_Criteria: "On a given record, SHIFTyN is populated\
    \ and SHIFTy is not populated"
  Rule_Failure_Criteria: "SHIFTy is not populated"
  Condition_Failure: "SHIFTyN is populated"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.2"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR455"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.3"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR455"
        Version: "2"
      Version: "5.0"
