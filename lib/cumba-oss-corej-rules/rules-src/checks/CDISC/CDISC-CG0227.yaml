Core:
  Id: "CDISC-CG0227"
  Status: "Published"
  Version: "1"
Description: "Raise an error when End Relative to Reference Period (--ENRF) is populated\
  \ for a subject with an empty Reference End Date/Time (RFENDTC) in the DM dataset."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "ALL"
Requirements:
  Variables:
    All:
    - "--ENRF"
Match_Datasets:
- Keys:
  - "USUBJID"
  Name: "DM"
Check:
  expression: >-
    empty(DM.RFENDTC) and not empty(--ENRF)
Outcome:
  Message: "--ENRF is populated when RFENDTC in the DM dataset is empty."
  Output_Variables:
  - "--ENRF"
  - "DM.RFENDTC"
Source:
  Class: "ALL"
  Domain: "ALL"
  Variable: "--ENRF"
  Condition: "DM.RFENDTC = null"
  Rule: "--ENRF = null"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "SDTMIG"
    Version: "3.4"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0227"
        Version: "1"
      Version: "2.0"
  - Name: "SDTMIG"
    Version: "3.3"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0227"
        Version: "1"
      Version: "2.0"
  - Name: "SDTMIG"
    Version: "3.2"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0227"
        Version: "1"
      Version: "2.0"
