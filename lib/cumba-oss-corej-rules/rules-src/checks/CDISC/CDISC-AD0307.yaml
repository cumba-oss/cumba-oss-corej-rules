Core:
  Id: "CDISC-AD0307"
  Status: "Published"
  Version: "2"
Description: "Raise an error when SMQzzCD is populated and SMQzzSC is empty, where\
  \ zz is an integer [01-99, zero-padded]."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "OCCURRENCE DATA STRUCTURE"
    - "MEDICAL DEVICE OCCURRENCE DATA STRUCTURE"
Check:
  expression: >-
    not empty(SMQzzCD) and empty(SMQzzSC)
Outcome:
  Message: "SMQzzCD is populated and SMQzzSC is empty"
  Output_Variables:
  - "SMQzzCD"
  - "SMQzzSC"
wildcards:
  zz:
    min: 1
    max: 99
Source:
  Class: "OCCURRENCE DATA STRUCTURE; MEDICAL DEVICE OCCURRENCE DATA STRUCTURE"
  Variable_or_Item: "SMQzzSC where zz is an integer [01-99, zero-padded]"
  Natural_Language_Rule_Failure_Criteria: "SMQzzCD is populated and SMQzzSC is not\
    \ populated"
  Rule_Failure_Criteria: "SMQzzSC is not populated"
  Condition_Failure: "SMQzzCD is populated"
