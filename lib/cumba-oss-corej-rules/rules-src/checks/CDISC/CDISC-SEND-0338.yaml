Core:
  Id: "CDISC-SEND-0338"
  Status: "Published"
  Version: "1"
Description: "Raise an error when more than one Respiratory (RE) record exists for\
  \ the same combination of subject (USUBJID), test (RETESTCD), and observation time\
  \ or evaluation interval (REDTC, RENOMDY, RETPT, RETPTNUM, RESTINT, REENINT, REEVLINT);\
  \ the RE domain expects one record per test per observation time or evaluation interval\
  \ per subject."
Executability: "Partially Executable - Possible Underreporting"
Scope:
  Domains:
    Include:
    - "RE"
Check:
  expression: >-
    not is_unique_set([USUBJID, RETESTCD, REDTC, RENOMDY, RETPT, RETPTNUM, RESTINT, REENINT,
    REEVLINT])
Outcome:
  Message: "More than one RE record exists for the same test and observation time\
    \ or evaluation interval within a subject."
  Output_Variables:
  - "RETESTCD"
  - "REDTC"
  - "RENOMDY"
  - "RETPT"
  - "RETPTNUM"
  - "REEVLINT"
  - "RESTINT"
  - "REENINT"
Source:
  Class: "FND"
  Domain: "RE"
  Variable: "ALL"
  Plain_Text_Explanation: "re.xpt, Respiratory - Findings. One record per test per\
    \ observation time or evaluation interval per subject, Tabulation."
  Rule: "re.xpt, Respiratory - Findings. One record per test per observation time\
    \ or evaluation interval per subject, Tabulation."
