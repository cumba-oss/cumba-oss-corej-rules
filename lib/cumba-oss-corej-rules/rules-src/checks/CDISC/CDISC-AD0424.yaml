Core:
  Id: "CDISC-AD0424"
  Status: "Published"
  Version: "2"
Description: "Raise an error when TRTPGy is populated but TRTPGyN is missing"
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "BASIC DATA STRUCTURE"
    - "OCCURRENCE DATA STRUCTURE"
    - "MEDICAL DEVICE OCCURRENCE DATA STRUCTURE"
Requirements:
  Variables:
    All:
    - "TRTPGy"
    - "TRTPGyN"
Check:
  expression: >-
    not empty(TRTPGy) and empty(TRTPGyN)
Outcome:
  Message: "TRTPGy is populated, but TRTPGyN is missing"
  Output_Variables:
  - "TRTPGy"
  - "TRTPGyN"
wildcards:
  "y":
    min: 1
    max: 99
Source:
  Class: "BASIC DATA STRUCTURE; MEDICAL DEVICE BASIC DATA STRUCTURE; OCCURRENCE DATA\
    \ STRUCTURE; MEDICAL DEVICE OCCURRENCE DATA STRUCTURE"
  Variable_or_Item: "TRTPGyN where y is an integer [1-99, not zero-padded]"
  Natural_Language_Rule_Failure_Criteria: "On a given record, TRTPGy is populated\
    \ and TRTPGyN is not populated"
  Rule_Failure_Criteria: "TRTPGyN is not populated"
  Condition_Failure: "TRTPGy is populated"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.2"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR424"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.3"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR424"
        Version: "2"
      Version: "5.0"
