Core:
  Id: "CDISC-AD0789"
  Status: "Published"
  Version: "1"
Description: "Raise an error when BASETYPE is populated, BASE is populated, and BASE\
  \ does not equal the AVAL value recorded where ABLFL equals Y for the same subject,\
  \ PARAMCD, and BASETYPE"
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "BASIC DATA STRUCTURE"
Operations:
- id: "$baseline_aval"
  expression: "max(AVAL, group=[USUBJID, PARAMCD, BASETYPE], filter=filter(ABLFL=\"\
    Y\"))"
Check:
  expression: >-
    not empty(BASETYPE) and not empty(BASE) and BASE != $baseline_aval
Outcome:
  Message: "BASE does not equal the AVAL value recorded where ABLFL equals Y for this\
    \ subject, PARAMCD, and BASETYPE."
  Output_Variables:
  - "PARAMCD"
  - "BASE"
  - "BASETYPE"
  - "$baseline_aval"
Source:
  Class: "BASIC DATA STRUCTURE"
  Variable_or_Item: "BASE"
  Natural_Language_Rule_Failure_Criteria: "BASETYPE is populated, BASE is populated,\
    \ and BASE is not equal to AVAL where ABLFL is equal to Y for a given value of\
    \ PARAMCD and BASETYPE for a subject"
  Rule_Failure_Criteria: "BASE is not equal to AVAL where ABLFL is equal to Y for\
    \ a given value of PARAMCD and BASETYPE for a subject"
  Condition_Failure: "BASETYPE is populated and BASE is populated"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.3"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR789"
        Version: "1"
      Version: "5.0"
