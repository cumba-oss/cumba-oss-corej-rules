Core:
  Id: "CDISC-AD0296"
  Status: "Published"
  Version: "1"
Description: "Raise an error when there is more than one value of ATOXGRN for a given\
  \ value of ATOXGR."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "OCCURRENCE DATA STRUCTURE"
Check:
  expression: >-
    not empty(ATOXGRN) and not empty(ATOXGR) and has_multiple_values_for(ATOXGRN, ATOXGR)
Outcome:
  Message: "ATOXGRN has more than one value for the same value of ATOXGR."
  Output_Variables:
  - "ATOXGR"
  - "ATOXGRN"
Source:
  Class: "OCCURRENCE DATA STRUCTURE"
  Variable_or_Item: "ATOXGRN"
  Natural_Language_Rule_Failure_Criteria: "There is more than one value of ATOXGRN\
    \ for a given value of ATOXGR"
  Rule_Failure_Criteria: "There is more than one value of ATOXGRN for a given value\
    \ of ATOXGR"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.0"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR296"
        Version: "1"
      Version: "5.0"
