Core:
  Id: "CDISC-AD0013"
  Status: "Published"
  Version: "1"
Description: "Raise an error when the length of a variable name exceeds 8 characters"
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "ALL"
Check:
  expression: >-
    len(varname()) > 8
Outcome:
  Message: "The variable name is longer than 8 characters"
  Output_Variables:
  - "variable_name"
Source:
  Class: "ALL"
  Variable_or_Item: "ALL"
  Natural_Language_Rule_Failure_Criteria: "The length of a variable name exceeds 8\
    \ characters"
  Rule_Failure_Criteria: "The length of a variable name exceeds 8 characters"
