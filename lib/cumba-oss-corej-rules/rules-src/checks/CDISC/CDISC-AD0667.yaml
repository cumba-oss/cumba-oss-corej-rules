Core:
  Id: "CDISC-AD0667"
  Status: "Published"
  Version: "1"
Description: "Raise an error when DOSPCTDF is populated but TRTA is not populated."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "BASIC DATA STRUCTURE"
  Subclasses:
    Include:
    - "NON-COMPARTMENTAL ANALYSIS"
Check:
  expression: >-
    not empty(DOSPCTDF) and empty(TRTA)
Outcome:
  Message: "DOSPCTDF is populated for this record, but TRTA is not populated."
  Output_Variables:
  - "DOSPCTDF"
  - "TRTA"
Source:
  Class: "BASIC DATA STRUCTURE"
  Subclass: "NON-COMPARTMENTAL ANALYSIS"
  Variable_or_Item: "TRTA"
  Natural_Language_Rule_Failure_Criteria: "DOSPCTDF is populated and TRTA is not populated"
  Rule_Failure_Criteria: "TRTA is not populated"
  Condition_Failure: "DOSPCTDF is populated"
Standards:
- Organization: "CDISC"
  Standards:
