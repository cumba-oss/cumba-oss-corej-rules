Core:
  Id: "CDISC-AD0111"
  Status: "Published"
  Version: "2"
Description: "Raise an error when ARELTM is present and ARELTMU is not present."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "BASIC DATA STRUCTURE"
Check:
  expression: >-
    var_exists("ARELTM") and not var_exists("ARELTMU")
Outcome:
  Message: "ARELTM is present, but ARELTMU is not present."
  Output_Variables:
  - "ARELTM"
Source:
  Class: "BASIC DATA STRUCTURE; MEDICAL DEVICE BASIC DATA STRUCTURE"
  Natural_Language_Rule_Failure_Criteria: "ARELTM is present and ARELTMU is not present"
  Rule_Failure_Criteria: "ARELTMU is not present"
  Condition_Failure: "ARELTM is present"
