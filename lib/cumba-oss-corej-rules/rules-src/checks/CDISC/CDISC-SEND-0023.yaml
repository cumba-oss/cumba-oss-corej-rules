Core:
  Id: "CDISC-SEND-0023"
  Status: "Published"
  Version: "1"
Description: "Raise an error when Qualifier Variable Name (QNAM) contains a lowercase\
  \ letter; QNAM must be uppercase, matching the restrictions applied to --TESTCD."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "SUPP--"
    - "SQ--"
Requirements:
  Variables:
    All:
    - "QNAM"
Check:
  expression: >-
    not empty(QNAM) and QNAM =~ /.*[a-z]/
Outcome:
  Message: "QNAM contains a lowercase letter; QNAM must be uppercase."
  Output_Variables:
  - "QNAM"
Source:
  Class: "SPC"
  Domain: "SUPP--"
  Variable: "QNAM"
  Plain_Text_Explanation: "QNAM value must be uppercase because it is subject to the\
    \ same restrictions as --TESTCD which is required to be uppercase through Controlled\
    \ Terminology."
  Rule: "--QNAM value is uppercase"
