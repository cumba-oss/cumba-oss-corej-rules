Core:
  Id: "CDISC-AD0310"
  Status: "Published"
  Version: "1"
Description: "Raise an error when there is more than one value of SMQzzSC for a given\
  \ value of SMQzzSCN, where zz is an integer [01-99, zero-padded]."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "OCCURRENCE DATA STRUCTURE"
Check:
  expression: >-
    not empty(SMQzzSC) and not empty(SMQzzSCN) and has_multiple_values_for(SMQzzSC, SMQzzSCN)
Outcome:
  Message: "SMQzzSC has more than one value for the same value of SMQzzSCN, where\
    \ zz is an integer [01-99, zero-padded]."
  Output_Variables:
  - "SMQzzSC"
  - "SMQzzSCN"
wildcards:
  zz:
    min: 1
    max: 99
Source:
  Class: "OCCURRENCE DATA STRUCTURE"
  Variable_or_Item: "SMQzzSC where zz is an integer [01-99, zero-padded]"
  Natural_Language_Rule_Failure_Criteria: "There is more than one value of SMQzzSC\
    \ for a given value of SMQzzSCN"
  Rule_Failure_Criteria: "There is more than one value of SMQzzSC for a given value\
    \ of SMQzzSCN"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.0"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR310"
        Version: "1"
      Version: "5.0"
