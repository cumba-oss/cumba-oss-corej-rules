Core:
  Id: "CDISC-AD0499"
  Status: "Published"
  Version: "2"
Description: "Raise an error when ASPER is present and APERIOD is not present."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "BASIC DATA STRUCTURE"
    - "OCCURRENCE DATA STRUCTURE"
    - "MEDICAL DEVICE OCCURRENCE DATA STRUCTURE"
Check:
  expression: >-
    var_exists("ASPER") and not var_exists("APERIOD")
Outcome:
  Message: "ASPER is present, but APERIOD is not present."
  Output_Variables:
  - "ASPER"
Source:
  Class: "BASIC DATA STRUCTURE; MEDICAL DEVICE BASIC DATA STRUCTURE; OCCURRENCE DATA\
    \ STRUCTURE; MEDICAL DEVICE OCCURRENCE DATA STRUCTURE"
  Variable_or_Item: "ASPER"
  Natural_Language_Rule_Failure_Criteria: "ASPER is present and APERIOD is not present"
  Rule_Failure_Criteria: "APERIOD is not present"
  Condition_Failure: "ASPER is present"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.2"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR499"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.3"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR499"
        Version: "2"
      Version: "5.0"
