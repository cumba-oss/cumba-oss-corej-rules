Core:
  Id: "CDISC-CG0629"
  Status: "Published"
  Version: "1"
Description: "Raise an error when --REASEX is present in a Findings dataset, since\
  \ --REASEX is not permitted in human clinical trials."
Executability: "Fully Executable"
Scope:
  Classes:
    Include:
    - "FINDINGS"
Check:
  expression: >-
    var_exists("--REASEX")
Outcome:
  Message: "Variable --REASEX is present but is not permitted in human clinical trials."
  Output_Variables:
  - "--REASEX"
Source:
  Class: "FND"
  Variable: "--REASEX"
  Rule: "--REASEX not present in dataset"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "SDTMIG"
    Version: "3.4"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0629"
        Version: "1"
      Version: "2.0"
