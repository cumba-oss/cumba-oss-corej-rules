Core:
  Id: "CDISC-AD0788"
  Status: "Published"
  Version: "1"
Description: "Raise an error when there is more than one value of SMQzzSCN for a given\
  \ value of SMQzzSC, considering only rows on which both variables are populated"
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "OCCURRENCE DATA STRUCTURE"
    - "MEDICAL DEVICE OCCURRENCE DATA STRUCTURE"
Check:
  expression: >-
    not empty(SMQzzSCN) and not empty(SMQzzSC) and has_multiple_values_for(SMQzzSCN, SMQzzSC)
Outcome:
  Message: "SMQzzSCN takes more than one value for the same value of SMQzzSC, considering\
    \ only rows on which both variables are populated."
  Output_Variables:
  - "SMQzzSC"
  - "SMQzzSCN"
wildcards:
  zz:
    min: 1
    max: 99
Source:
  Class: "OCCURRENCE DATA STRUCTURE; MEDICAL DEVICE OCCURRENCE DATA STRUCTURE"
  Variable_or_Item: "SMQzzSCN where zz is an integer [01-99, zero-padded]"
  Natural_Language_Rule_Failure_Criteria: "There is more than one value of SMQzzSCN\
    \ for a given value of SMQzzSC, considering only those rows on which both variables\
    \ are populated"
  Rule_Failure_Criteria: "There is more than one value of SMQzzSCN for a given value\
    \ of SMQzzSC"
  Condition_Failure: "On rows where both SMQzzSCN and SMQzzSC are both populated."
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.1"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR788"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.2"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR788"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.3"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR788"
        Version: "1"
      Version: "5.0"
