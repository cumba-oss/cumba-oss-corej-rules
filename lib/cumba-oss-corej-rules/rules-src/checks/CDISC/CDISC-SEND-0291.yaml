Core:
  Id: "CDISC-SEND-0291"
  Status: "Published"
  Version: "1"
Description: "Raise an error when neither the start date/time (--STDTC) nor the start\
  \ study day (--STDY) is populated in a record; at least one of --STDTC or --STDY\
  \ must be populated."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "EX"
Check:
  expression: >-
    empty(--STDTC) and empty(--STDY)
Outcome:
  Message: "Neither --STDTC nor --STDY is populated; at least one start timing variable\
    \ is required."
  Output_Variables:
  - "--STDTC"
  - "--STDY"
Source:
  Class: "INT"
  Domain: "EX"
  Variable: "--STDTC, --STDY"
  Plain_Text_Explanation: "Either --STDTC or --STDY must be populated."
  Rule: "--STDTC ^=null OR --STDY ^=null"
