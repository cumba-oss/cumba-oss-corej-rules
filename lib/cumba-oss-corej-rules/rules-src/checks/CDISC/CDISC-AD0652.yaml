Core:
  Id: "CDISC-AD0652"
  Status: "Published"
  Version: "2"
Description: "Raise an error when ONTRTwFL is present but ONTRTFL is not present."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "OCCURRENCE DATA STRUCTURE"
    - "MEDICAL DEVICE OCCURRENCE DATA STRUCTURE"
Check:
  expression: >-
    var_exists("ONTRTwFL") and not var_exists("ONTRTFL")
Outcome:
  Message: "ONTRTwFL is present, but ONTRTFL is not present in the dataset."
  Output_Variables:
  - "ONTRTwFL"
wildcards:
  w:
    min: 1
    max: 9
Source:
  Class: "OCCURRENCE DATA STRUCTURE; MEDICAL DEVICE OCCURRENCE DATA STRUCTURE"
  Variable_or_Item: "ONTRTwFL where w is an integer [1-9, not zero-padded]"
  Natural_Language_Rule_Failure_Criteria: "ONTRTwFL is present but ONTRTFL is not\
    \ present"
  Rule_Failure_Criteria: "ONTRTFL is not present"
  Condition_Failure: "ONTRTwFL is present"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.0"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR652"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.1"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR652"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.2"
    References:
