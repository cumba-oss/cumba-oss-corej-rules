Core:
  Id: "CDISC-AD0826"
  Status: "Published"
  Version: "1"
Description: "Raise an error when FLGREASC is populated and FLGREAS is not populated."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "BASIC DATA STRUCTURE"
Check:
  expression: >-
    not empty(FLGREASC) and empty(FLGREAS)
Outcome:
  Message: "FLGREASC is populated, but FLGREAS is not populated."
  Output_Variables:
  - "FLGREAS"
  - "FLGREASC"
Source:
  Class: "BASIC DATA STRUCTURE"
  Subclass: "POPULATION PHARMACOKINETIC ANALYSIS"
  Variable_or_Item: "FLGREAS"
  Natural_Language_Rule_Failure_Criteria: "FLGREASC is populated and FLGREAS is not\
    \ populated"
  Rule_Failure_Criteria: "FLGREAS is not populated"
  Condition_Failure: "FLGREASC is populated"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.3"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR826"
        Version: "1"
      Version: "5.0"
