Core:
  Id: "CDISC-AD0550"
  Status: "Published"
  Version: "2"
Description: "Raise an error when BTOXGRLN is present and BTOXGRL is not present."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "BASIC DATA STRUCTURE"
Check:
  expression: >-
    var_exists("BTOXGRLN") and not var_exists("BTOXGRL")
Outcome:
  Message: "BTOXGRLN is present, but BTOXGRL is not present."
  Output_Variables:
  - "BTOXGRLN"
Source:
  Class: "BASIC DATA STRUCTURE; MEDICAL DEVICE BASIC DATA STRUCTURE"
  Variable_or_Item: "BTOXGRLN"
  Natural_Language_Rule_Failure_Criteria: "BTOXGRLN is present and BTOXGRL is not\
    \ present"
  Rule_Failure_Criteria: "BTOXGRL is not present"
  Condition_Failure: "BTOXGRLN is present"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.2"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR550"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.3"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR550"
        Version: "2"
      Version: "5.0"
