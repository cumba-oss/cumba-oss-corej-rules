Core:
  Id: "CDISC-AD0169"
  Status: "Published"
  Version: "2"
Description: "Raise an error when CNSR is populated and its value is not a positive\
  \ integer or 0"
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "BASIC DATA STRUCTURE"
    - "MEDICAL DEVICE BASIC DATA STRUCTURE"
Requirements:
  Variables:
    All:
    - "CNSR"
Check:
  expression: >-
    not empty(CNSR) and CNSR !~ /^\\d+$/
Outcome:
  Message: "CNSR is populated, but its value is not a positive integer or 0"
  Output_Variables:
  - "CNSR"
Source:
  Class: "BASIC DATA STRUCTURE; MEDICAL DEVICE BASIC DATA STRUCTURE"
  Variable_or_Item: "CNSR"
  Natural_Language_Rule_Failure_Criteria: "The value of CNSR is not a positive integer\
    \ or 0"
  Rule_Failure_Criteria: "The value of CNSR is not a positive integer or 0"
  Condition_Failure: "CNSR is populated"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.0"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
