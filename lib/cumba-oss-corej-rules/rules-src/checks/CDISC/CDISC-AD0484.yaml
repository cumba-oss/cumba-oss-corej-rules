Core:
  Id: "CDISC-AD0484"
  Status: "Published"
  Version: "2"
Description: "Raise an error when PBCHGCAy is populated and PBCHGCyN is missing on\
  \ the same record."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "BASIC DATA STRUCTURE"
Check:
  expression: >-
    not empty(PBCHGCAy) and empty(PBCHGCyN)
Outcome:
  Message: "PBCHGCAy is populated but PBCHGCyN is missing."
  Output_Variables:
  - "PBCHGCAy"
  - "PBCHGCyN"
wildcards:
  "y":
    min: 1
    max: 99
Source:
  Class: "BASIC DATA STRUCTURE; MEDICAL DEVICE BASIC DATA STRUCTURE"
  Variable_or_Item: "PBCHGCyN where y is an integer [1-9, not zero-padded]"
  Natural_Language_Rule_Failure_Criteria: "On a given record, PBCHGCAy is populated\
    \ and PBCHGCyN is not populated"
  Rule_Failure_Criteria: "PBCHGCyN is not populated"
  Condition_Failure: "PBCHGCAy is populated"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.2"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR484"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.3"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR484"
        Version: "2"
      Version: "5.0"
