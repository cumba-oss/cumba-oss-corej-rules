Core:
  Id: "CDISC-AD0764"
  Status: "Published"
  Version: "1"
Description: "Raise an error when TRTPGy and TRTA are both present but TRTAGy is not\
  \ present, where y is an integer [1-99, not zero-padded]"
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "BASIC DATA STRUCTURE"
Check:
  expression: >-
    var_exists("TRTPGy") and var_exists("TRTA") and not var_exists("TRTAGy")
Outcome:
  Message: "TRTPGy and TRTA are present, but TRTAGy is not present"
  Output_Variables:
  - "TRTA"
  - "TRTPGy"
wildcards:
  "y":
    min: 1
    max: 99
Source:
  Class: "BASIC DATA STRUCTURE; MEDICAL DEVICE BASIC DATA STRUCTURE"
  Variable_or_Item: "TRTPGy where y is an integer [1-99, not zero-padded]"
  Natural_Language_Rule_Failure_Criteria: "TRTPGy is present and TRTA is present but\
    \ TRTAGy is not present, where y is an integer [1-99, not zero-padded]"
  Rule_Failure_Criteria: "TRTAGy is not present"
  Condition_Failure: "TRTA is present"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.1"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR764"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.2"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR764"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.3"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR764"
        Version: "1"
      Version: "5.0"
