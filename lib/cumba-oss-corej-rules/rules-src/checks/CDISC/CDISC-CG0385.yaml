Core:
  Id: "CDISC-CG0385"
  Status: "Published"
  Version: "1"
Description: "Raise an error when a Body System or Organ Class (--BODSYS) value is\
  \ not a valid System Organ Class in the MedDRA dictionary."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "AE"
    - "CE"
    - "MH"
Requirements:
  Variables:
    All:
    - "--BODSYS"
Operations:
- id: "$bodsys_valid"
  expression: "valid_external_dictionary_value(--BODSYS, external_dictionary_type=\"\
    meddra\", dictionary_term_type=\"SOC\", case_sensitive=false)"
Check:
  expression: >-
    $bodsys_valid == false
Outcome:
  Message: "Body System or Organ Class (--BODSYS) is not a valid MedDRA System Organ\
    \ Class."
  Output_Variables:
  - "--BODSYS"
Source:
  Class: "EVT"
  Domain: "AE, MH, CE"
  Variable: "--BODSYS"
  Rule: "--BODSYS = MedDRA system organ class"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "SDTMIG"
    Version: "3.4"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0385"
        Version: "1"
      Version: "2.0"
  - Name: "SDTMIG"
    Version: "3.3"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0385"
        Version: "1"
      Version: "2.0"
  - Name: "SDTMIG"
    Version: "3.2"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0385"
        Version: "1"
      Version: "2.0"
