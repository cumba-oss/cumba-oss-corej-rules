Core:
  Id: "CDISC-SEND-0303"
  Status: "Published"
  Version: "1"
Description: "Raise an error when the Unscheduled Flag (--USCHFL) is populated with\
  \ a value other than \"Y\"; --USCHFL must be either \"Y\" or empty."
Executability: "Fully Executable"
Scope:
  Classes:
    Include:
    - "INTERVENTIONS"
    - "EVENTS"
    - "FINDINGS"
Requirements:
  Variables:
    All:
    - "--USCHFL"
Check:
  expression: >-
    not empty(--USCHFL) and --USCHFL != "Y"
Outcome:
  Message: "--USCHFL is populated with a value other than Y; the only valid populated\
    \ value is Y."
  Output_Variables:
  - "--USCHFL"
Source:
  Class: "INT, EVT, FND"
  Domain: "ALL"
  Variable: "--USCHFL"
  Plain_Text_Explanation: "--USCHFL value must either be \"Y\" or null"
  Condition: "--USCHFL ^= null"
  Rule: "--USCHFL = \"Y\""
Standards:
