Core:
  Id: "CDISC-AD0758"
  Status: "Published"
  Version: "1"
Description: "Raise an error when there is more than one value of TRxxPGyN for a given\
  \ value of TRxxPGy, where xx is an integer [01-99, zero-padded] and y is an integer\
  \ [1-99, not zero-padded], considering only those rows on which both TRxxPGyN and\
  \ TRxxPGy are populated."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "SUBJECT LEVEL ANALYSIS DATASET"
Check:
  expression: >-
    not empty(TRxxPGyN) and not empty(TRxxPGy) and has_multiple_values_for(TRxxPGyN, TRxxPGy)
Outcome:
  Message: "There is more than one value of TRxxPGyN for a given value of TRxxPGy,\
    \ on rows where TRxxPGyN and TRxxPGy are both populated"
  Output_Variables:
  - "TRxxPGy"
  - "TRxxPGyN"
wildcards:
  xx:
    min: 1
    max: 99
  "y":
    min: 1
    max: 99
Source:
  Class: "SUBJECT LEVEL ANALYSIS DATASET"
  Variable_or_Item: "TRxxPGyN where xx is an integer [01-99, zero-padded] and y is\
    \ an integer [1-9, not zero-padded]"
  Natural_Language_Rule_Failure_Criteria: "There is more than one value of TRxxPGyN\
    \ for a given value of TRxxPGy, where xx is an integer [01-99, zero-padded] and\
    \ y is a single-digit integer [1-9], considering only those rows on which both\
    \ variables are populated"
  Rule_Failure_Criteria: "There is more than one value of TRxxPGyN for a given value\
    \ of TRxxPGy"
  Condition_Failure: "On rows where TRxxPGyN and TRxxPGy are both populated"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.1"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
