Core:
  Id: "CDISC-CG0643"
  Status: "Published"
  Version: "1"
Description: "Raise an error when the STRAIN variable is present in the Demographics\
  \ (DM) dataset, since STRAIN is not used in human clinical trials."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "DM"
Check:
  expression: >-
    var_exists("STRAIN")
Outcome:
  Message: "STRAIN must not be present in the Demographics (DM) dataset because it\
    \ is not used in human clinical trials."
  Output_Variables:
  - "STRAIN"
Source:
  Class: "SPC"
  Domain: "DM"
  Variable: "STRAIN"
  Rule: "STRAIN not present in dataset"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "SDTMIG"
    Version: "3.4"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0643"
        Version: "1"
      Version: "2.0"
