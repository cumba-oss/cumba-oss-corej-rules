Core:
  Id: "CDISC-AD0365"
  Status: "Published"
  Version: "1"
Description: "Raise an error when SDTM.EX is present and neither TRTEDT nor TRTEDTM\
  \ is present"
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "SUBJECT LEVEL ANALYSIS DATASET"
Requirements:
  Datasets:
  - "EX"
Operations:
- id: "$TRTEDT_EXISTS"
  expression: "variable_exists(TRTEDT)"
- id: "$TRTEDTM_EXISTS"
  expression: "variable_exists(TRTEDTM)"
Check:
  expression: >-
    $TRTEDT_EXISTS == false and $TRTEDTM_EXISTS == false
Outcome:
  Message: "SDTM.EX is present, but neither TRTEDT nor TRTEDTM is present."
Source:
  Class: "SUBJECT LEVEL ANALYSIS DATASET"
  Natural_Language_Rule_Failure_Criteria: "SDTM.EX is present and neither TRTEDT or\
    \ TRTEDTM are present"
  Rule_Failure_Criteria: "TRTEDT or TRTEDTM is not present"
  Condition_Failure: "SDTM.EX is present"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.0"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR365"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.1"
    References:
