Core:
  Id: "FDA-SD2245"
  Status: "Published"
  Version: "1"
Description: "Raise an error when, for a record where TSPARMCD equals 'DCUTDTC' (Data\
  \ Cutoff Date), TSVAL is neither a valid ISO 8601 date/time nor an SDTM masked date,\
  \ in which an unknown component is written as a hyphen placeholder."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "TS"
Requirements:
  Variables:
    All:
    - "TSPARMCD"
Check:
  expression: >-
    TSPARMCD == "DCUTDTC" and invalid_date(TSVAL)
Outcome:
  Message: "Invalid TSVAL value for DCUTDTC: TSVAL must be a valid ISO 8601 date/time\
    \ or an SDTM masked date when TSPARMCD equals 'DCUTDTC' (Data Cutoff Date)."
  Output_Variables:
  - "TSPARMCD"
  - "TSVAL"
Source:
  FDA_Validator_Rule_Message: "Invalid TSVAL value for DCUTDTC"
  FDA_Validator_Rule_Description: "TSVAL variable value must be in ISO 8601 format,\
    \ when TSPARMCD='DCUTDTC'."
  Domains: "TS"
