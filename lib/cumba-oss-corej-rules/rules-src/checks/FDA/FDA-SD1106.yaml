Core:
  Id: "FDA-SD1106"
  Status: "Published"
  Version: "1"
Description: "Raise an error when the AE (Adverse Events) dataset is not present in\
  \ the study."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "ALL"
Check:
  expression: >-
    not ds_exists("AE")
Outcome:
  Message: "The AE (Adverse Events) dataset is not present in the study."
Source:
  FDA_Validator_Rule_Message: "Missing AE dataset"
  FDA_Validator_Rule_Description: "Adverse Events (AE) dataset should be included\
    \ in every submission."
  Domains: "AE"
