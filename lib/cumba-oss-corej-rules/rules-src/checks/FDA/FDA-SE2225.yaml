Core:
  Id: "FDA-SE2225"
  Status: "Published"
  Version: "1"
Description: "Raise an error when the Trial Summary (TS) dataset does not contain\
  \ a record where TSPARMCD equals 'TRMSAC' (Time to Terminal Sacrifice)."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "TS"
Operations:
- id: "$trmsac_count"
  expression: "record_count(filter=filter(TSPARMCD=\"TRMSAC\"))"
Check:
  expression: >-
    $trmsac_count == 0
Outcome:
  Message: "Missing TRMSAC Trial Summary Parameter: a 'Time to Terminal Sacrifice'\
    \ (TRMSAC) record must be present in the Trial Summary (TS) domain."
  Output_Variables:
  - "$trmsac_count"
Source:
  FDA_Validator_Rule_Message: "Missing TRMSAC Trial Summary Parameter"
  FDA_Validator_Rule_Description: "'Time to Terminal Sacrifice' (TRMSAC) record should\
    \ be populated in Trial Summary (TS) domain."
  Domains: "TS"
