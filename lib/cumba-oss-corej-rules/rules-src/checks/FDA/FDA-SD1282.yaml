Core:
  Id: "FDA-SD1282"
  Status: "Published"
  Version: "1"
Description: "Raise an error when --ELTM, --TPTNUM, and --TPT are not present in the\
  \ dataset but --TPTREF is present."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "ALL"
Check:
  expression: >-
    not var_exists("--ELTM") and not var_exists("--TPTNUM") and not var_exists("--TPT") and
    var_exists("--TPTREF")
Outcome:
  Message: "--TPTREF is present when --ELTM, --TPTNUM, and --TPT are not present."
  Output_Variables:
  - "--TPTREF"
Source:
  FDA_Validator_Rule_Message: "--TPTREF variable is present when --ELTM, --TPTNUM,\
    \ and --TPT are missing"
  FDA_Validator_Rule_Description: "Time Point Reference (--TPTREF) variable should\
    \ not be present in the domain, when the Planned Elapsed Time from Time Point\
    \ Ref (--ELTM) variable, Planned Time Point Number (--TPTNUM) variable, and Planned\
    \ Time Point (--TPT) variable are missing."
  Domains: "ALL"
