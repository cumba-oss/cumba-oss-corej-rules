Core:
  Id: "FDA-SE2217"
  Status: "Published"
  Version: "1"
Description: "Raise an error when the Trial Summary (TS) dataset does not contain\
  \ a record where TSPARMCD equals 'STRAIN' (Strain/Substrain)."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "TS"
Operations:
- id: "$strain_count"
  expression: "record_count(filter=filter(TSPARMCD=\"STRAIN\"))"
Check:
  expression: >-
    $strain_count == 0
Outcome:
  Message: "Missing STRAIN Trial Summary Parameter: a 'Strain/Substrain' (STRAIN)\
    \ record must be present in the Trial Summary (TS) domain."
  Output_Variables:
  - "$strain_count"
Source:
  FDA_Validator_Rule_Message: "Missing STRAIN Trial Summary Parameter"
  FDA_Validator_Rule_Description: "'Strain/Substrain' (STRAIN) record should be populated\
    \ in Trial Summary (TS) domain."
  Domains: "TS"
