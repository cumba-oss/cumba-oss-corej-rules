Core:
  Id: "FDA-SD1206"
  Status: "Published"
  Version: "1"
Description: "Raise an error when EXSTDTC is populated and is after DM.RFXENDTC (Date/Time\
  \ of Last Study Treatment)."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "EX"
Match_Datasets:
- Keys:
  - "USUBJID"
  Name: "DM"
Check:
  expression: >-
    not empty(EXSTDTC) and date(EXSTDTC) > DM.RFXENDTC
Outcome:
  Message: "EXSTDTC is after DM.RFXENDTC (Date/Time of Last Study Treatment)."
  Output_Variables:
  - "EXSTDTC"
  - "DM.RFXENDTC"
Source:
  FDA_Validator_Rule_Message: "EXSTDTC date is after RFXENDTC"
  FDA_Validator_Rule_Description: "Start Date/Time of Treatment (EXSTDTC) variable\
    \ value must be less than or equal to Date/Time of Last Study Treatment (RFXENDTC)."
  Domains: "EX"
