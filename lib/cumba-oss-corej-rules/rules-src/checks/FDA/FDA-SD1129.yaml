Core:
  Id: "FDA-SD1129"
  Status: "Published"
  Version: "1"
Description: "Raise an error when neither Age (AGE) nor Age Range (AGETXT) variable\
  \ is present in the DM dataset. At least one of AGE or AGETXT should be included\
  \ in DM."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "DM"
Check:
  expression: >-
    not var_exists("AGE") and not var_exists("AGETXT")
Outcome:
  Message: "Neither AGE nor AGETXT variable is present in the DM dataset."
Source:
  FDA_Validator_Rule_Message: "Neither AGE nor AGETXT variables are present"
  FDA_Validator_Rule_Description: "At least one of Age (AGE) or Age Text (AGETXT)\
    \ variables should be included into Demographics (DM) domain."
  Domains: "DM"
