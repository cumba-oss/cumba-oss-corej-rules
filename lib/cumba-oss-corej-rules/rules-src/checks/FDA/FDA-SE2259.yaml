Core:
  Id: "FDA-SE2259"
  Status: "Published"
  Version: "1"
Description: "Raise an error when RSTGCD (Repro Stage Code) is populated, is not 'UNPLAN'\
  \ (an unplanned Repro Stage), and the combination of RSTGCD and RSTAGE (Description\
  \ of Repro Stage) does not match a (RSTGCD, RSTAGE) row in the Trial Repro Stages\
  \ (TT) dataset."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "SJ"
    - "TP"
Requirements:
  Variables:
    All:
    - "RSTGCD"
Operations:
- id: "$tt_stage_keys"
  expression: "distinct([RSTGCD, RSTAGE], domain=\"TT\")"
Check:
  expression: >-
    not empty(RSTGCD) and RSTGCD != "UNPLAN" and tuple(RSTGCD, RSTAGE) not in $tt_stage_keys
Outcome:
  Message: "The (RSTGCD, RSTAGE) combination does not match an entry in the Trial\
    \ Repro Stages (TT) dataset."
  Output_Variables:
  - "RSTGCD"
  - "RSTAGE"
  - "$tt_stage_keys"
Source:
  FDA_Validator_Rule_Message: "Invalid RSTGCD/RSTAGE"
  FDA_Validator_Rule_Description: "The combination of Repro Stage Code (RSTGCD) and\
    \ Description of Repro Stage (RSTAGE) values should match entries in the Trial\
    \ Repro Stages (TT) dataset, except for an unplanned Repro Stage (RSTGCD = 'UNPLAN')."
  Domains: "SJ, TP"
Standards:
- Organization: "FDA"
  Standards:
  - Name: "SENDIG-DART"
    Version: "1.1"
    References:
    - Origin: "FDA Validator Rules"
      Rule_Identifier:
        Id: "SE2259"
        Version: "1"
      Version: "1.6"
