Core:
  Id: "FDA-SD2270"
  Status: "Published"
  Version: "1"
Description: "Raise an error when --DY is present in the dataset but --DTC is not\
  \ present."
Executability: "Fully Executable"
Scope:
  Classes:
    Include:
    - "INTERVENTIONS"
    - "EVENTS"
    - "FINDINGS"
    - "FINDINGS ABOUT"
    - "SPECIAL PURPOSE"
Check:
  expression: >-
    var_exists("--DY") and not var_exists("--DTC")
Outcome:
  Message: "--DY is present in the dataset but --DTC is not present."
  Output_Variables:
  - "--DY"
Source:
  FDA_Validator_Rule_Message: "Missing --DTC variable, when --DY variable is present"
  FDA_Validator_Rule_Description: "Collection Study Date/Time (--DTC) variable should\
    \ be included into dataset, when Collection Study Day (--DY) variable is present."
  Domains: "SPECIAL PURPOSE, INTERVENTIONS, EVENTS, FINDINGS, FINDINGS ABOUT"
