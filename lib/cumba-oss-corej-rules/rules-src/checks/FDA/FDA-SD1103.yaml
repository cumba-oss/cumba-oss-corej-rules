Core:
  Id: "FDA-SD1103"
  Status: "Published"
  Version: "1"
Description: "Raise an error when Start Relative to Reference Time Point (--STRTPT)\
  \ is present in the dataset but Start Reference Time Point (--STTPT) is not present\
  \ in the dataset."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "ALL"
Check:
  expression: >-
    var_exists("--STRTPT") and not var_exists("--STTPT")
Outcome:
  Message: "--STTPT variable is not present when --STRTPT variable is present."
  Output_Variables:
  - "--STRTPT"
Source:
  FDA_Validator_Rule_Message: "Missing --STTPT variable, when --STRTPT variable is\
    \ present"
  FDA_Validator_Rule_Description: "Start Reference Time Point (--STTPT) variable must\
    \ be included into the domain, when Start Relative to Reference Time Point (--STRTPT)\
    \ variable is present."
  Domains: "SE, SM, SV, INTERVENTIONS, EVENTS, FINDINGS, FINDINGS ABOUT"
