Core:
  Id: "FDA-SD1049"
  Status: "Published"
  Version: "1"
Description: "Raise an error when the Qualifier Variable Label (QLABEL) value is longer\
  \ than 40 characters."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "SUPP--"
    - "SQ--"
Check:
  expression: >-
    len(QLABEL) > 40
Outcome:
  Message: "QLABEL value length is greater than 40 characters."
  Output_Variables:
  - "IDVAR"
  - "IDVARVAL"
  - "QNAM"
  - "QLABEL"
Source:
  FDA_Validator_Rule_Message: "Invalid value for QLABEL"
  FDA_Validator_Rule_Description: "Qualifier Variable Label (QLABEL) value may have\
    \ up to 40 characters."
  Domains: "SUPPQUAL"
