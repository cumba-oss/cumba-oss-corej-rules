Core:
  Id: "FDA-SD1280"
  Status: "Published"
  Version: "1"
Description: "Raise an error when --TOXGR is not present in the dataset but --TOX\
  \ is present."
Executability: "Fully Executable"
Scope:
  Classes:
    Include:
    - "EVENTS"
    - "FINDINGS"
    - "FINDINGS ABOUT"
Check:
  expression: >-
    not var_exists("--TOXGR") and var_exists("--TOX")
Outcome:
  Message: "--TOX is present when --TOXGR is not present in the dataset."
  Output_Variables:
  - "--TOX"
Source:
  FDA_Validator_Rule_Message: "--TOX variable is present when --TOXGR variable is\
    \ missing"
  FDA_Validator_Rule_Description: "Toxicity (--TOX) variable should not be present\
    \ in the domain, when the Toxicity Grade (--TOXGR) variable is missing."
  Domains: "EVENTS, FINDINGS, FINDINGS ABOUT"
