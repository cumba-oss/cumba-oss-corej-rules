Core:
  Id: "FDA-SD1091"
  Status: "Published"
  Version: "1"
Description: "Raise an error when --ENDTC is present in a dataset, but --ENDY is not\
  \ present."
Executability: "Fully Executable"
Scope:
  Classes:
    Include:
    - "INTERVENTIONS"
    - "EVENTS"
    - "FINDINGS"
    - "FINDINGS ABOUT"
    - "SPECIAL PURPOSE"
  Domains:
    Exclude:
    - "CO"
    - "DM"
Check:
  expression: >-
    var_exists("--ENDTC") and not var_exists("--ENDY")
Outcome:
  Message: "--ENDY variable is not present when --ENDTC variable is present."
  Output_Variables:
  - "--ENDTC"
Source:
  FDA_Validator_Rule_Message: "Missing --ENDY variable, when --ENDTC variable is present"
  FDA_Validator_Rule_Description: "Study Day of End (--ENDY) variable should be included\
    \ into dataset, when End Study Date/Time (--ENDTC) variable is present."
  Domains: "SE, SM, SV, INTERVENTIONS, EVENTS, FINDINGS, FINDINGS ABOUT"
