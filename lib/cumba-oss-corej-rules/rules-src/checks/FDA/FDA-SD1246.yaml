Core:
  Id: "FDA-SD1246"
  Status: "Published"
  Version: "1"
Description: "Raise an error when the Time Point Reference (--TPTREF) variable is\
  \ not present in the dataset while the Planned Elapsed Time from Time Point Ref\
  \ (--ELTM) variable is present."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "ALL"
Check:
  expression: >-
    var_exists("--ELTM") and not var_exists("--TPTREF")
Outcome:
  Message: "--ELTM variable is present, but --TPTREF variable is not present."
  Output_Variables:
  - "--ELTM"
Source:
  FDA_Validator_Rule_Message: "Missing --TPTREF variable, when --ELTM variable is\
    \ present"
  FDA_Validator_Rule_Description: "Time Point Reference (--TPTREF) variable must be\
    \ included into the domain, when Planned Elapsed Time from Time Point Ref (--ELTM)\
    \ variable is present."
  Domains: "ALL"
