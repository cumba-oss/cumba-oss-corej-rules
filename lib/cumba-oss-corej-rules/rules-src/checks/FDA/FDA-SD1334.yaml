Core:
  Id: "FDA-SD1334"
  Status: "Published"
  Version: "1"
Description: "Raise an error when the Date/Time of Informed Consent (RFICDTC) is after\
  \ the Subject Reference Start Date/Time (RFSTDTC)."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "DM"
Requirements:
  Variables:
    All:
    - "RFSTDTC"
Check:
  expression: >-
    not empty(RFICDTC) and date(RFICDTC) > RFSTDTC
Outcome:
  Message: "RFICDTC is after RFSTDTC"
  Output_Variables:
  - "RFSTDTC"
  - "RFICDTC"
Source:
  FDA_Validator_Rule_Message: "RFICDTC is after RFSTDTC"
  FDA_Validator_Rule_Description: "Date/Time of Informed Consent (RFICDTC) should\
    \ not be after Subject Reference Start Date/Time (RFSTDTC)."
  Domains: "DM"
