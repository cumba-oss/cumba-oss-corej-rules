Core:
  Id: "FDA-SD1043"
  Status: "Published"
  Version: "1"
Description: "Raise an error when --TESTCD is present and --TEST is present and --TESTCD\
  \ does not have the same value across records with the same value of --TEST."
Executability: "Fully Executable"
Scope:
  Classes:
    Include:
    - "FINDINGS"
    - "FINDINGS ABOUT"
Requirements:
  Variables:
    All:
    - "--TESTCD"
Check:
  expression: >-
    var_exists("--TEST") and is_inconsistent_across_dataset(--TESTCD, keys=[--TEST])
Outcome:
  Message: "Inconsistent value for --TESTCD within --TEST"
  Output_Variables:
  - "--TESTCD"
  - "--TEST"
Source:
  FDA_Validator_Rule_Message: "Inconsistent value for --TESTCD within --TEST"
  FDA_Validator_Rule_Description: "All values of Short Name of Measurement, Test or\
    \ Examination (--TESTCD) should be the same for a given value of Name of Measurement,\
    \ Test or Examination (--TEST)."
  Domains: "FINDINGS, FINDINGS ABOUT"
