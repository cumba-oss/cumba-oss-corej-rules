Core:
  Id: "FDA-SD2285"
  Status: "Published"
  Version: "1"
Description: "Raise an error when a LOINC Code (--LOINC) value is not a valid code\
  \ in the LOINC dictionary."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "LB"
    - "MB"
    - "MS"
Requirements:
  Variables:
    All:
    - "--LOINC"
Operations:
- id: "$loinc_valid"
  expression: "valid_external_dictionary_code(--LOINC, external_dictionary_type=\"\
    loinc\", dictionary_term_type=\"LOINC\")"
Check:
  expression: >-
    $loinc_valid == false
Outcome:
  Message: "LOINC Code (--LOINC) is not a valid LOINC code."
  Output_Variables:
  - "--LOINC"
Source:
  FDA_Validator_Rule_Message: "Value for --LOINC not found in LOINC coding system"
  FDA_Validator_Rule_Description: "Value for the LOINC Code (--LOINC) variable must\
    \ be populated using a LOINC coding system version specified in the define.xml."
  Domains: "LB, MB, MS"
