Core:
  Id: "FDA-SE2353"
  Status: "Published"
  Version: "1"
Description: "Raise an error when EXDOSE is greater than zero (the treatment was administered)\
  \ but EXLOT is empty or not present."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "EX"
Requirements:
  Variables:
    All:
    - "EXDOSE"
Check:
  expression: >-
    EXDOSE > 0 and empty(EXLOT)
Outcome:
  Message: "EXLOT is empty when EXDOSE is greater than zero."
  Output_Variables:
  - "EXDOSE"
  - "EXLOT"
Source:
  FDA_Validator_Rule_Message: "EXLOT is null, when EXDOSE is provided"
  FDA_Validator_Rule_Description: "If Name of Actual Treatment (EXTRT) is administered,\
    \ (i.e., Dose per Administration (EXDOSE) is greater than zero), then Lot Number\
    \ (EXLOT) should also be provided."
  Domains: "INTERVENTIONS"
Standards:
- Organization: "FDA"
  Standards:
  - Name: "SENDIG"
    Version: "3.1.1"
    References:
    - Origin: "FDA Validator Rules"
      Rule_Identifier:
        Id: "SE2353"
        Version: "1"
      Version: "1.6"
