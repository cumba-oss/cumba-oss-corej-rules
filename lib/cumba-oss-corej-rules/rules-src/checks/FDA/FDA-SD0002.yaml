Core:
  Id: "FDA-SD0002"
  Status: "Published"
  Version: "1"
Description: "Raise an error when a variable whose Core attribute is 'Req' (Required)\
  \ is not populated in a record."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "ALL"
Operations:
- id: "$required_variables"
  expression: "required_variables()"
Check:
  expression: >-
    varname() in $required_variables and empty(value())
Outcome:
  Message: "A variable marked as Required (Core attribute 'Req') is not populated."
  Output_Variables:
  - "variable_name"
  - "variable_value"
Source:
  FDA_Validator_Rule_Message: "NULL value in variable marked as Required"
  FDA_Validator_Rule_Description: "Required variables (where Core attribute is 'Req')\
    \ cannot be NULL for any records."
  Domains: "ALL"
