Core:
  Id: "FDA-SD2024"
  Status: "Published"
  Version: "1"
Description: "Raise an error when both the Unique Subject Identifier (USUBJID) and\
  \ the Pool Identifier (POOLID) variables are populated on the same record."
Executability: "Fully Executable"
Scope:
  Domains:
    Exclude:
    - "POOLDEF"
Requirements:
  Variables:
    All:
    - "POOLID"
Check:
  expression: >-
    not empty(USUBJID) and not empty(POOLID)
Outcome:
  Message: "Redundant values for USUBJID and POOLID"
  Output_Variables:
  - "POOLID"
Source:
  FDA_Validator_Rule_Message: "Redundant values for USUBJID and POOLID"
  FDA_Validator_Rule_Description: "Only one of the Unique Subject Identifier (USUBJID)\
    \ or Pool Identifier (POOLID) variables values may be populated, not both."
  Domains: "CO, SV, INTERVENTIONS, EVENTS, FINDINGS, FINDINGS ABOUT, RELSUB, SUPPQUAL"
