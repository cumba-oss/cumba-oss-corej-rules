Core:
  Id: "FDA-SD1354"
  Status: "Published"
  Version: "1"
Description: "Raise an error when an ARMCD value defined in the Trial Arms (TA) dataset\
  \ is not assigned to at least one subject (USUBJID) in the Demographics (DM) dataset."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "TA"
Operations:
- id: "$dm_armcd"
  expression: "distinct(ARMCD, domain=\"DM\")"
Check:
  expression: >-
    not empty(ARMCD) and ARMCD not in $dm_armcd
Outcome:
  Message: "ARMCD value defined in TA is not present in the DM dataset."
  Output_Variables:
  - "ARMCD"
  - "$dm_armcd"
Source:
  FDA_Validator_Rule_Message: "ARMCD value not present in DM"
  FDA_Validator_Rule_Description: "Arm Code (ARMCD) values defined in Trial Arms (TA)\
    \ should be assigned to at least one subject (USUBJID) in Demographics (DM)."
  Domains: "TA"
