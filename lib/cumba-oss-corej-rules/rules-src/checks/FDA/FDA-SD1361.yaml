Core:
  Id: "FDA-SD1361"
  Status: "Published"
  Version: "1"
Description: "Raise an error when exactly one of Planned Arm Code (ARMCD) and Description\
  \ of Planned Arm (ARM) is populated while the other is empty; both must be populated\
  \ together."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "DM"
Check:
  expression: >-
    empty(ARMCD) and not empty(ARM) or not empty(ARMCD) and empty(ARM)
Outcome:
  Message: "ARM is populated but ARMCD is empty, or ARMCD is populated but ARM is\
    \ empty."
  Output_Variables:
  - "ARMCD"
  - "ARM"
Source:
  FDA_Validator_Rule_Message: "ARM is populated, but ARMCD is null, or vice versa"
  FDA_Validator_Rule_Description: "Description of Planned Arm (ARM) must be populated,\
    \ when Planned Arm Code (ARMCD) is populated, and vice versa."
  Domains: "DM"
Standards:
- Organization: "FDA"
  Standards:
  - Name: "SDTMIG"
    Version: "3.4"
    References:
    - Origin: "FDA Validator Rules"
      Rule_Identifier:
        Id: "SD1361"
        Version: "1"
      Version: "1.6"
  - Name: "SDTMIG"
    Version: "3.3"
    References:
    - Origin: "FDA Validator Rules"
      Rule_Identifier:
        Id: "SD1361"
        Version: "1"
      Version: "1.6"
