Core:
  Id: "FDA-SD1440"
  Status: "Published"
  Version: "1"
Description: "Raise an error when --TERM is present and --DECOD is present and --DECOD\
  \ does not have the same value across records with the same value of --TERM."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "AE"
    - "CE"
    - "MH"
Requirements:
  Variables:
    All:
    - "--DECOD"
Check:
  expression: >-
    var_exists("--TERM") and is_inconsistent_across_dataset(--DECOD, keys=[--TERM])
Outcome:
  Message: "Inconsistent value for --DECOD within --TERM"
  Output_Variables:
  - "--TERM"
  - "--DECOD"
Source:
  FDA_Validator_Rule_Message: "Inconsistent value for --DECOD within --TERM"
  FDA_Validator_Rule_Description: "MedDRA coding Preferred Term (--DECOD) should be\
    \ consistent for the same collected term (--TERM)"
  Domains: "AE, CE, MH"
Standards:
- Organization: "FDA"
