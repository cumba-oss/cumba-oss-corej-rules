Core:
  Id: "FDA-SD1124"
  Status: "Published"
  Version: "1"
Description: "Raise an error when --STAT equals 'NOT DONE' but the Reason Not Done\
  \ (--REASND) variable is empty or not present."
Executability: "Partially Executable - Possible Overreporting"
Scope:
  Classes:
    Include:
    - "INTERVENTIONS"
    - "EVENTS"
    - "FINDINGS"
    - "FINDINGS ABOUT"
Requirements:
  Variables:
    All:
    - "--STAT"
Check:
  expression: >-
    --STAT == "NOT DONE" and empty(--REASND)
Outcome:
  Message: "--REASND is empty or not present when --STAT equals 'NOT DONE'."
  Output_Variables:
  - "--STAT"
  - "!--REASND"
Source:
  FDA_Validator_Rule_Message: "Missing value for --REASND, when --STAT is 'NOT DONE'"
  FDA_Validator_Rule_Description: "Value of Reason Not Done (--REASND) variable should\
    \ be populated, when Status (--STAT) variable value is 'NOT DONE'."
  Domains: "INTERVENTIONS, EVENTS, FINDINGS, FINDINGS ABOUT"
