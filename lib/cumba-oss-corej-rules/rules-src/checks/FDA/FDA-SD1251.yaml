Core:
  Id: "FDA-SD1251"
  Status: "Published"
  Version: "1"
Description: "Raise an error when Treatment Vehicle (--TRTV) is empty but Treatment\
  \ Vehicle Amount Units (--VAMTU) is populated."
Executability: "Fully Executable"
Scope:
  Classes:
    Include:
    - "INTERVENTIONS"
Requirements:
  Variables:
    All:
    - "--TRTV"
    - "--VAMTU"
Check:
  expression: >-
    empty(--TRTV) and not empty(--VAMTU)
Outcome:
  Message: "--VAMTU is populated when --TRTV is empty."
  Output_Variables:
  - "--TRTV"
  - "--VAMTU"
Source:
  FDA_Validator_Rule_Message: "--VAMTU is not null when --TRTV is null"
  FDA_Validator_Rule_Description: "Treatment Vehicle Amount Units (--VAMTU) value\
    \ must be null when Treatment Vehicle Amount (--TRTV) value is null."
  Domains: "INTERVENTIONS"
