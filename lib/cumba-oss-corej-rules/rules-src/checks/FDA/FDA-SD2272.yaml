Core:
  Id: "FDA-SD2272"
  Status: "Published"
  Version: "1"
Description: "Raise an error when --ENDY is present in the dataset but --ENDTC is\
  \ not present."
Executability: "Fully Executable"
Scope:
  Classes:
    Include:
    - "INTERVENTIONS"
    - "SPECIAL PURPOSE"
    - "EVENTS"
    - "FINDINGS"
    - "FINDINGS ABOUT"
Check:
  expression: >-
    var_exists("--ENDY") and not var_exists("--ENDTC")
Outcome:
  Message: "--ENDY is present in the dataset but --ENDTC is not present."
  Output_Variables:
  - "--ENDY"
Source:
  FDA_Validator_Rule_Message: "Missing --ENDTC variable, when --ENDY variable is present"
  FDA_Validator_Rule_Description: "End Study Date/Time (--ENDTC) variable should be\
    \ included into dataset, when Study Day of End (--ENDY) variable is present."
  Domains: "CO, DM, DR, SE, SM, SV, EVENTS, FINDINGS, FINDINGS ABOUT"
