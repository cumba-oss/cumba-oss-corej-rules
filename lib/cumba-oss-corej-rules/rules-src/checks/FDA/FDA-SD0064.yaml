Core:
  Id: "FDA-SD0064"
  Status: "Published"
  Version: "1"
Description: "Raise an error when a Unique Subject Identifier (USUBJID) value is not\
  \ present in the Demographics (DM) dataset."
Executability: "Fully Executable"
Scope:
  Domains:
    Exclude:
    - "AP--"
    - "APRELSUB"
Grouping:
  Variables:
  - "USUBJID"
Operations:
- id: "$dm_usubjid"
  expression: "distinct(USUBJID, domain=\"DM\")"
Check:
  expression: >-
    not empty(USUBJID) and USUBJID not in $dm_usubjid
Outcome:
  Message: "USUBJID value is not present in the DM dataset."
  Output_Variables:
  - "$dm_usubjid"
Source:
  FDA_Validator_Rule_Message: "Subject is not present in DM domain"
  FDA_Validator_Rule_Description: "All Subjects (USUBJID) must be present in Demographics\
    \ (DM) domain."
  Domains: "ALL"
