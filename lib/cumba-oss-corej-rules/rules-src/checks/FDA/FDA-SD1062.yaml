Core:
  Id: "FDA-SD1062"
  Status: "Published"
  Version: "1"
Description: "Raise an error when AESOD is equal to 'Y' but AESER is not equal to\
  \ 'Y'."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "AE"
Requirements:
  Variables:
    All:
    - "AESOD"
    - "AESER"
Check:
  expression: >-
    AESOD == "Y" and AESER != "Y"
Outcome:
  Message: "AESER does not equal 'Y' when AESOD equals 'Y'."
  Output_Variables:
  - "AESER"
  - "AESOD"
Source:
  FDA_Validator_Rule_Message: "AESER is not 'Y', when AESOD equals 'Y'"
  FDA_Validator_Rule_Description: "Serious Event (AESER) variable value is expected\
    \ to be 'Y', when Occurred with Overdose (AESOD) variable value equals 'Y'."
  Domains: "AE"
