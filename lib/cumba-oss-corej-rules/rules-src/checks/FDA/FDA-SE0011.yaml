Core:
  Id: "FDA-SE0011"
  Status: "Published"
  Version: "1"
Description: "Raise an error when Date/Time of Reference Time Point (--RFTDTC) is\
  \ populated but Time Point Reference (--TPTREF) is not populated."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "ALL"
Requirements:
  Variables:
    All:
    - "--RFTDTC"
Check:
  expression: >-
    not empty(--RFTDTC) and empty(--TPTREF)
Outcome:
  Message: "--TPTREF is empty when --RFTDTC is populated."
  Output_Variables:
  - "--TPTREF"
  - "--RFTDTC"
Source:
  FDA_Validator_Rule_Message: "Missing value for --TPTREF, when --RFTDTC is provided"
  FDA_Validator_Rule_Description: "Time Point Reference (--TPTREF) variable values\
    \ should be provided, when Date/Time of Reference Time Point (--RFTDTC) variable\
    \ values are populated."
  Domains: "ALL"
