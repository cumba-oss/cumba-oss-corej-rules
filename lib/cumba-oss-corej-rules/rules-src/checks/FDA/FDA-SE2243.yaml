Core:
  Id: "FDA-SE2243"
  Status: "Published"
  Version: "1"
Description: "Raise an error when Macroscopic Examination Short Name (--TESTCD) equals\
  \ 'CLSFUP' but Specimen Material Type (--SPEC) is populated."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "MA"
Requirements:
  Variables:
    All:
    - "--TESTCD"
Check:
  expression: >-
    --TESTCD == "CLSFUP" and not empty(--SPEC)
Outcome:
  Message: "Specimen Material Type (--SPEC) is populated when --TESTCD equals 'CLSFUP'."
  Output_Variables:
  - "--TESTCD"
  - "--SPEC"
Source:
  FDA_Validator_Rule_Message: "--SPEC variable is populated, when --TESTCD equals\
    \ 'CLSFUP'"
  FDA_Validator_Rule_Description: "Specimen Material Type (MASPEC) should be null\
    \ when Macroscopic Examination Short Name (MATESTCD)/Macroscopic Examination Name\
    \ (MATEST) = 'CLSFUP'/'Clinical Signs Follow-up'."
  Domains: "MA"
Standards:
- Organization: "FDA"
  Standards:
  - Name: "SENDIG"
    Version: "3.1.1"
    References:
    - Origin: "FDA Validator Rules"
      Rule_Identifier:
        Id: "SE2243"
        Version: "1"
      Version: "1.6"
