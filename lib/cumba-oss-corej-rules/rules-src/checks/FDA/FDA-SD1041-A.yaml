Core:
  Id: "FDA-SD1041-A"
  Status: "Published"
  Version: "1"
Description: "Raise an error when IESCAT is populated and equal to IECAT in the Trial\
  \ Inclusion/Exclusion Criteria (TI) dataset."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "TI"
Requirements:
  Variables:
    All:
    - "IESCAT"
    - "IECAT"
Check:
  expression: >-
    not empty(IESCAT) and IESCAT == IECAT
Outcome:
  Message: "IECAT and IESCAT values are identical."
  Output_Variables:
  - "IECAT"
  - "IESCAT"
Source_Proposed:
  FDA_Validator_Rule_Message: "IECAT and IESCAT values are identical."
  FDA_Validator_Rule_Description: "IESCAT is populated and equal to IECAT in the Trial\
    \ Inclusion/Exclusion Criteria (TI) dataset."
  Domains: "TI"
Source:
  FDA_Validator_Rule_Message: "Values for --CAT and --SCAT are identical"
  FDA_Validator_Rule_Description: "Values of Category (--CAT) and Subcategory (--SCAT)\
    \ variables should not be identical."
  Domains: "INTERVENTIONS, EVENTS, FINDINGS, FINDINGS ABOUT, TI"
