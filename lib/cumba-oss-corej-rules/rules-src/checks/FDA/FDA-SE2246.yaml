Core:
  Id: "FDA-SE2246"
  Status: "Published"
  Version: "1"
Description: "Raise an error when the TT (Trial Repro Stages) dataset is not present\
  \ in the study."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "ALL"
Check:
  expression: >-
    not ds_exists("TT")
Outcome:
  Message: "The TT (Trial Repro Stages) dataset is not present in the study."
Source:
  FDA_Validator_Rule_Message: "Missing TT dataset"
  FDA_Validator_Rule_Description: "Trial Repro Stages (TT) dataset should be included\
    \ for nonclinical Developmental and Reproductive Toxicology (DART) studies."
  Domains: "TT"
Standards:
- Organization: "FDA"
  Standards:
  - Name: "SENDIG-DART"
    Version: "1.1"
    References:
    - Origin: "FDA Validator Rules"
      Rule_Identifier:
        Id: "SE2246"
        Version: "1"
      Version: "1.6"
    - Origin: "FDA Business Rules"
      Rule_Identifier:
        Id: "FDAB011"
        Version: "1"
      Version: "1.5"
