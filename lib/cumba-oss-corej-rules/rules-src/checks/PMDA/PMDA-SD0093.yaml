Core:
  Id: "PMDA-SD0093"
  Status: "Published"
  Version: "1"
Description: "Raise a warning when AGE is populated but AGEU is not present or empty."
Severity: "Warning"
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "DM"
Check:
  expression: >-
    not empty(AGE) and empty(AGEU)
Outcome:
  Message: "AGEU is empty when AGE is populated."
  Output_Variables:
  - "AGE"
  - "AGEU"
Source:
  Message: "Missing value for AGEU when AGE is provided"
  Description: "Age Units (AGEU) should be provided when Age (AGE) is populated."
  Domains: "DM"
  Severity: "Warning"
Standards:
- Organization: "PMDA"
  Standards:
  - Name: "SDTMIG"
    Version: "3.1.2"
    References:
    - Origin: "PMDA Validation Rules"
      Rule_Identifier:
        Id: "SD0093"
        Version: "1"
      Version: "6.0"
- Organization: "FDA"
  Standards:
  - Name: "SDTMIG"
    Version: "3.1.2"
    References:
    - Origin: "FDA Validator Rules"
      Rule_Identifier:
        Id: "SD0093"
        Version: "1"
      Version: "1.6"
