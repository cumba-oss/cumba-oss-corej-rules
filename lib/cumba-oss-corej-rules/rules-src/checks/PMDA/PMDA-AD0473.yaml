Core:
  Id: "PMDA-AD0473"
  Status: "Published"
  Version: "1"
Description: "Raise an error when, for a stratification factor index w, Strat Factor\
  \ w Value Used for Rand (STRATwR) is present and Strat Factor w Value Used for Rand\
  \ (N) (STRATwRN) is present and STRATwRN does not have a single value across records\
  \ sharing the same value of STRATwR, considering only the records on which both\
  \ variables are populated."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "SUBJECT LEVEL ANALYSIS DATASET"
    - "DEVICE LEVEL ANALYSIS DATASET"
Requirements:
  Variables:
    All:
    - "STRATwRN"
Check:
  expression: >-
    var_exists("STRATwR") and not empty(STRATwR) and not empty(STRATwRN) and
    is_inconsistent_across_dataset(STRATwRN, keys=[STRATwR])
Outcome:
  Message: "Inconsistent value for STRATwRN within STRATwR."
  Output_Variables:
  - "STRATwR"
  - "STRATwRN"
wildcards:
  w:
    min: 1
    max: 9
Source:
  Message: "Inconsistent value for STRATwRN"
  Description: "There should be only a single value of Strat Factor w Value Used for\
    \ Rand (N) (STRATwRN) variable for a given value of Strat Factor w Value Used\
    \ for Rand (STRATwR) variable, considering only those rows on which both variables\
    \ are populated."
  Domains: "ADSL, ADDL"
  Severity: "Error"
Standards:
- Organization: "PMDA"
  Standards:
  - Name: "ADaMIG"
    Version: "1.3"
    References:
    - Origin: "PMDA Validation Rules"
      Rule_Identifier:
        Id: "AD0473"
        Version: "1"
      Version: "6.0"
  - Name: "ADaMIG"
    Version: "1.2"
    References:
    - Origin: "PMDA Validation Rules"
      Rule_Identifier:
        Id: "AD0473"
        Version: "1"
      Version: "6.0"
