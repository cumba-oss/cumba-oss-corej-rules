Core:
  Id: "PMDA-SD0011"
  Status: "Published"
  Version: "1"
Description: "Raise an error when Description of Planned Arm (ARM) is not 'Screen\
  \ Failure' while Planned Arm Code (ARMCD) equals 'SCRNFAIL', or when ARMCD is not\
  \ 'SCRNFAIL' while ARM equals 'Screen Failure'."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "DM"
    - "TA"
Requirements:
  Variables:
    All:
    - "ARMCD"
    - "ARM"
Check:
  expression: >-
    ARMCD == "SCRNFAIL" and ARM != "Screen Failure" or ARM == "Screen Failure" and ARMCD !=
    "SCRNFAIL"
Outcome:
  Message: "ARM is not 'Screen Failure' when ARMCD equals 'SCRNFAIL', or ARMCD is\
    \ not 'SCRNFAIL' when ARM equals 'Screen Failure'."
  Output_Variables:
  - "ARMCD"
  - "ARM"
Source:
  Message: "ARM is not 'Screen Failure' when ARMCD equals 'SCRNFAIL', or vice versa"
  Description: "Description of Arm (ARM) must equal 'Screen Failure' when Arm Code\
    \ (ARMCD) is 'SCRNFAIL', and vice versa."
  Domains: "DM, TA"
  Severity: "Error"
