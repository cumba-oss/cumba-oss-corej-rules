Core:
  Id: "PMDA-AD0337"
  Status: "Published"
  Version: "1"
Description: "Raise an error when the Multi-Response Criterion y Evaluation (MCRITyML)\
  \ flag variable is present in the dataset but its corresponding Analysis Multi-Response\
  \ Criterion y (MCRITy) variable is not present."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "ALL"
Check:
  expression: >-
    var_exists("MCRITyML") and not var_exists("MCRITy")
Outcome:
  Message: "MCRITyML is present, but MCRITy is not present."
  Output_Variables:
  - "MCRITyML"
wildcards:
  "y":
    min: 1
    max: 99
Source:
  Message: "MCRITy variable is not present when MCRITyML is present"
  Description: "If Multi-Response Criterion y Evaluation (MCRITyML) flag variable\
    \ is present, there must also be a corresponding Analysis Multi-Response Criterion\
    \ y (MCRITy) variable."
  Domains: "BDS, ADNCA, MDBDS, ADAMOTHER"
  Severity: "Error"
Standards:
- Organization: "PMDA"
  Standards:
  - Name: "ADaMIG"
    Version: "1.3"
    References:
    - Origin: "PMDA Validation Rules"
      Rule_Identifier:
        Id: "AD0337"
        Version: "1"
      Version: "6.0"
  - Name: "ADaMIG"
    Version: "1.2"
    References:
    - Origin: "PMDA Validation Rules"
      Rule_Identifier:
        Id: "AD0337"
        Version: "1"
      Version: "6.0"
  - Name: "ADaMIG"
    Version: "1.1"
    References:
    - Origin: "PMDA Validation Rules"
      Rule_Identifier:
        Id: "AD0337"
        Version: "1"
      Version: "6.0"
