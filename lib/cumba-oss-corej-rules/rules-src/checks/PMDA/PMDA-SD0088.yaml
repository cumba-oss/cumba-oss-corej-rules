Core:
  Id: "PMDA-SD0088"
  Status: "Published"
  Version: "1"
Description: "Raise a warning when Subject Reference End Date/Time (RFENDTC) is empty\
  \ for a randomized subject, i.e. one whose Planned Arm Code (ARMCD) is populated\
  \ and not equal to 'SCRNFAIL' or 'NOTASSGN', unless the study is flagged as ongoing\
  \ by a Trial Summary (TS) record where TSPARMCD equals 'ONGOSIND' and TSVAL equals\
  \ 'Y'."
Severity: "Warning"
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "DM"
Requirements:
  Variables:
    All:
    - "ARMCD"
Operations:
- id: "$ongoing_study_count"
  expression: "record_count(domain=\"TS\", filter=filter(TSPARMCD=\"ONGOSIND\", TSVAL=\"\
    Y\"))"
Check:
  expression: >-
    not empty(ARMCD) and ARMCD not in ["SCRNFAIL", "NOTASSGN"] and empty(RFENDTC) and
    $ongoing_study_count == 0
Outcome:
  Message: "RFENDTC is not provided for a randomized subject and the study is not\
    \ flagged as ongoing in TS."
  Output_Variables:
  - "RFENDTC"
  - "ARMCD"
  - "$ongoing_study_count"
Source:
  Message: "RFENDTC is not provided for a randomized subject"
  Description: "Subject Reference End Date/Time (RFENDTC) should be populated for\
    \ all randomized subjects, those where Planned Arm Code (ARMCD) is not equal to\
    \ 'SCRNFAIL' or 'NOTASSGN' or null. If the study is ongoing, Parameter Value (TSVAL)\
    \ for the 'ONGOSIND/Ongoing Study Indicator' parameter should be set to 'Y' in\
    \ the Trial Summary (TS) domain."
  Domains: "DM"
  Severity: "Warning"
