Core:
  Id: "PMDA-AD0046"
  Status: "Published"
  Version: "1"
Description: "Raise an error when a relative-day variable whose name ends in 'DY'\
  \ has a value of zero. ADaM relative-day variables follow the SDTM convention that\
  \ there is no day 0; a study day that needs to include day 0 must not end in DY."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "SUBJECT LEVEL ANALYSIS DATASET"
    - "BASIC DATA STRUCTURE"
    - "OCCURRENCE DATA STRUCTURE"
    - "DEVICE LEVEL ANALYSIS DATASET"
    - "MEDICAL DEVICE BASIC DATA STRUCTURE"
    - "MEDICAL DEVICE OCCURRENCE DATA STRUCTURE"
Check:
  expression: >-
    ends_with(varname(), "DY") and value() == 0
Outcome:
  Message: "A relative-day (*DY) variable has a value of zero."
  Output_Variables:
  - "variable_name"
  - "variable_value"
Source:
  Message: "*DY = 0"
  Description: "A variable with a suffix of DY (day) must not equal zero. Variables\
    \ whose names end in DY are relative day variables. In ADaM as in the SDTM, there\
    \ is no day 0. If there is a need to create a relative day variable that includes\
    \ day 0, then its name must not end in DY."
  Domains: "ADSL, ADDL, BDS, ADNCA, MDBDS, OCCDS, ADAE, MDOCCDS, ADAMOTHER"
  Severity: "Error"
Standards:
- Organization: "PMDA"
  Standards:
