Core:
  Id: "PMDA-SD1237"
  Status: "Published"
  Version: "1"
Description: "Raise a warning when more than one record exists for the same combination\
  \ of Sponsor Device Identifier (SPDEVID) and Device Property Short Name (DOTESTCD)\
  \ in the Device Properties (DO) domain; there should be one record per device property."
Severity: "Warning"
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "DO"
Requirements:
  Variables:
    All:
    - "SPDEVID"
Check:
  expression: >-
    not empty(DOTESTCD) and not is_unique_set([SPDEVID, DOTESTCD])
Outcome:
  Message: "More than one record exists for the combination of SPDEVID and DOTESTCD\
    \ in the Device Properties (DO) domain."
  Output_Variables:
  - "SPDEVID"
  - "DOTESTCD"
Source:
  Message: "Duplicate records in Device Property"
  Description: "There should be one record per device property defined by SPDEVID\
    \ and DOTESTCD variables."
  Domains: "DO"
  Severity: "Warning"
