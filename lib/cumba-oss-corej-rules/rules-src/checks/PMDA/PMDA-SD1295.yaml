Core:
  Id: "PMDA-SD1295"
  Status: "Published"
  Version: "1"
Description: "Raise an error when the Added on to Existing Treatments parameter (TSPARMCD\
  \ equal to 'ADDON') has a Parameter Value (TSVAL) that is populated with a value\
  \ other than 'Y' or 'N'."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "TS"
Requirements:
  Variables:
    All:
    - "TSPARMCD"
    - "TSVAL"
Check:
  expression: >-
    TSPARMCD == "ADDON" and not empty(TSVAL) and TSVAL not in ["Y", "N"]
Outcome:
  Message: "TSVAL is not 'Y' or 'N' when TSPARMCD equals 'ADDON'."
  Output_Variables:
  - "TSPARMCD"
  - "TSVAL"
Source:
  Message: "Invalid TSVAL value for ADDON parameter"
  Description: "TSVAL for ADDON record must be 'Y' or 'N'."
  Domains: "TS"
  Severity: "Error"
