Core:
  Id: "PMDA-SD1133"
  Status: "Published"
  Version: "1"
Description: "Raise an error when ACTARM is present and ACTARMCD is present and ACTARM\
  \ does not have the same value across records with the same value of ACTARMCD."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "DM"
Requirements:
  Variables:
    All:
    - "ACTARM"
Check:
  expression: >-
    var_exists("ACTARMCD") and is_inconsistent_across_dataset(ACTARM, keys=[ACTARMCD])
Outcome:
  Message: "Inconsistent value for ACTARM within ACTARMCD"
  Output_Variables:
  - "ACTARMCD"
  - "ACTARM"
Source:
  Message: "Inconsistent value for ACTARM"
  Description: "A value for Description of Actual Arm (ACTARM) must have a unique\
    \ value for Actual Arm Code (ACTARMCD) with the domain."
  Domains: "DM"
  Severity: "Error"
