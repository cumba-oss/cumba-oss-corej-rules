Core:
  Id: "PMDA-AD0566"
  Status: "Published"
  Version: "1"
Description: "Raise an error when a Percent Change to Baseline Category y (N) (PBCHGCyN)\
  \ variable is present in a dataset but its corresponding Percent Change to Baseline\
  \ Category y (PBCHGCAy) variable is not present in that dataset. The numeric category\
  \ variable must always be accompanied by its character category counterpart."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "BASIC DATA STRUCTURE"
    - "MEDICAL DEVICE BASIC DATA STRUCTURE"
Check:
  expression: >-
    var_exists("PBCHGCyN") and not var_exists("PBCHGCAy")
Outcome:
  Message: "PBCHGCyN is present and PBCHGCAy is not present."
  Output_Variables:
  - "PBCHGCyN"
wildcards:
  "y":
    min: 1
    max: 99
Source:
  Message: "PBCHGCyN is present and PBCHGCAy is not present"
  Description: "If Percent Change to Baseline Category y (N) (PBCHGCyN) variable is\
    \ used in a dataset, Percent Change to Baseline Category y (PBCHGCAy) variable\
    \ must also be present in that dataset."
  Domains: "BDS, ADNCA, MDBDS, ADAMOTHER"
  Severity: "Error"
Standards:
- Organization: "PMDA"
  Standards:
  - Name: "ADaMIG"
    Version: "1.3"
    References:
    - Origin: "PMDA Validation Rules"
      Rule_Identifier:
        Id: "AD0566"
        Version: "1"
      Version: "6.0"
  - Name: "ADaMIG"
    Version: "1.2"
    References:
    - Origin: "PMDA Validation Rules"
      Rule_Identifier:
        Id: "AD0566"
        Version: "1"
      Version: "6.0"
