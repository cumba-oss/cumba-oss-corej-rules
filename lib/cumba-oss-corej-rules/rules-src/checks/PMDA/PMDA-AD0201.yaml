Core:
  Id: "PMDA-AD0201"
  Status: "Published"
  Version: "1"
Description: "Raise an error when the numeric Actual Pooled Treatment y (TRTAGyN)\
  \ variable is present in a dataset but its corresponding character Actual Pooled\
  \ Treatment y (TRTAGy) variable is not present. Every TRTAGyN must be accompanied\
  \ by its character counterpart TRTAGy."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "ALL"
Check:
  expression: >-
    var_exists("TRTAGyN") and not var_exists("TRTAGy")
Outcome:
  Message: "TRTAGyN is present, but TRTAGy is not present."
  Output_Variables:
  - "TRTAGyN"
wildcards:
  "y":
    min: 1
    max: 99
Source_Proposed:
  Sheet_Issue: "#73"
  Message: "TRTAGyN is present, but TRTAGy is not present"
  Description: "If Actual Pooled Treatment y (TRTAGyN) numeric variable is present,\
    \ there must be a corresponding Actual Pooled Treatment y (TRTAGy) character variable."
  Domains: "BDS, ADNCA, MDBDS, ADAMOTHER"
  Severity: "Error"
Source:
  Message: "TRTAGyN is present, but TRTAGy is not present"
  Description: "If Actual Pooled Treatment y (TRTAGyN) numeric variable is present,\
    \ there must be a corresponding Planned Pooled Treatment y (TRTPGy) character\
    \ variable."
  Domains: "BDS, ADNCA, MDBDS, ADAMOTHER"
  Severity: "Error"
