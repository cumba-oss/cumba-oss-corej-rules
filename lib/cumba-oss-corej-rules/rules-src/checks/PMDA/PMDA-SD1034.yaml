Core:
  Id: "PMDA-SD1034"
  Status: "Published"
  Version: "1"
Description: "Raise an error when ARM is present and ARMCD is present and ARMCD does\
  \ not have the same value across records with the same value of ARM."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "DM"
    - "TA"
    - "TV"
Requirements:
  Variables:
    All:
    - "ARM"
    - "ARMCD"
Check:
  expression: >-
    var_exists("ARM") and is_inconsistent_across_dataset(ARMCD, keys=[ARM])
Outcome:
  Message: "Inconsistent value for ARMCD within ARM"
  Output_Variables:
  - "ARMCD"
  - "ARM"
Source:
  Message: "Inconsistent value for ARMCD"
  Description: "A value for Planned Arm Code (ARMCD) must have a unique value for\
    \ Description of Planned Arm (ARM) with the domain."
  Domains: "DM, TA, TV"
  Severity: "Error"
