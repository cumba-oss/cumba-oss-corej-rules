Core:
  Id: "PMDA-SD1126"
  Status: "Published"
  Version: "1"
Description: "Raise a warning when --TPT, --TPTNUM, --TPTREF, and VISITNUM are present\
  \ and --TPT does not have the same value across records with the same combination\
  \ of --TPTNUM, --TPTREF, and VISITNUM."
Severity: "Warning"
Executability: "Fully Executable"
Scope:
  Classes:
    Include:
    - "INTERVENTIONS"
    - "EVENTS"
    - "FINDINGS"
    - "FINDINGS ABOUT"
    - "SPECIAL PURPOSE"
  Domains:
    Exclude:
    - "DM"
    - "DO"
    - "SE"
    - "SM"
    - "SV"
Requirements:
  Variables:
    All:
    - "--TPT"
Check:
  expression: >-
    var_exists("--TPTNUM") and var_exists("--TPTREF") and var_exists("VISITNUM") and
    is_inconsistent_across_dataset(--TPT, keys=[--TPTNUM, --TPTREF, VISITNUM])
Outcome:
  Message: "Inconsistent value for --TPT within --TPTNUM, --TPTREF, VISITNUM"
  Output_Variables:
  - "--TPT"
  - "--TPTNUM"
  - "--TPTREF"
  - "VISITNUM"
Source:
  Message: "Inconsistent value for --TPT within --TPTNUM, --TPTREF, VISITNUM"
  Description: "All values of Planned Time Point Name (--TPT) variable should be the\
    \ same for a given value of Planned Time Point Number (--TPTNUM) variable, Time\
    \ Point Reference (--TPTREF) variable, and Visit Number (VISITNUM) variable."
  Domains: "CO, INTERVENTIONS, FINDINGS (-DO), EVENTS, FINDINGS ABOUT"
  Severity: "Warning"
