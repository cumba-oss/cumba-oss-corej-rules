Core:
  Id: "PMDA-AD0095B"
  Status: "Published"
  Version: "1"
Description: "Raise an error when, considering only rows on which both variables are\
  \ populated, the numeric Actual Treatment (TRTAN) does not have a single consistent\
  \ value for each unique value of the character Actual Treatment (TRTA); within a\
  \ study each populated TRTA value must map to one TRTAN value."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "ALL"
Check:
  expression: >-
    not empty(TRTA) and not empty(TRTAN) and is_inconsistent_across_dataset(TRTAN, keys=[TRTA])
Outcome:
  Message: "TRTAN has inconsistent values for the same TRTA."
  Output_Variables:
  - "TRTA"
  - "TRTAN"
Source:
  Message: "Inconsistent value for TRTAN"
  Description: "Within a study, all TRTAN values must be the same for each unique\
    \ value of TRTA when the primary variable TRTA is populated. Considering only\
    \ those rows on which both variables are populated."
  Domains: "BDS, ADNCA, MDBDS, ADAMOTHER"
  Severity: "Error"
Standards:
- Organization: "PMDA"
  Standards:
  - Name: "ADaMIG"
    Version: "1.3"
    References:
    - Origin: "PMDA Validation Rules"
      Rule_Identifier:
