Core:
  Id: "PMDA-SD1250"
  Status: "Published"
  Version: "1"
Description: "Raise an error when the Planned Time Point Number (--TPTNUM) variable\
  \ is not present in the dataset while the Planned Time Point Name (--TPT) variable\
  \ is present."
Executability: "Fully Executable"
Scope:
  Classes:
    Include:
    - "SPECIAL PURPOSE"
    - "INTERVENTIONS"
    - "FINDINGS"
    - "EVENTS"
    - "FINDINGS ABOUT"
  Domains:
    Exclude:
    - "DM"
    - "SE"
    - "SV"
Check:
  expression: >-
    var_exists("--TPT") and not var_exists("--TPTNUM")
Outcome:
  Message: "--TPT variable is present, but --TPTNUM variable is not present."
  Output_Variables:
  - "--TPT"
Source:
  Message: "Missing --TPTNUM variable when --TPT variable is present"
  Description: "Planned Time Point Number (--TPTNUM) variable must be included into\
    \ the domain when Planned Time Point Name (--TPT) variable is present."
  Domains: "SPECIAL PURPOSE (-DM, -SE, -SV), INTERVENTIONS, FINDINGS (-DO), EVENTS,\
    \ FINDINGS ABOUT"
  Severity: "Error"
