Core:
  Id: "PMDA-SD0091"
  Status: "Published"
  Version: "1"
Description: "Raise an error when AESDTH is equal to 'Y' but AEOUT is not equal to\
  \ 'FATAL'."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "AE"
Requirements:
  Variables:
    All:
    - "AESDTH"
    - "AEOUT"
Check:
  expression: >-
    AESDTH == "Y" and AEOUT != "FATAL"
Outcome:
  Message: "AEOUT does not equal 'FATAL' when AESDTH equals 'Y'."
  Output_Variables:
  - "AEOUT"
  - "AESDTH"
Source:
  Message: "AEOUT is not 'FATAL' when AESDTH='Y'"
  Description: "Outcome of Adverse Event should equal 'FATAL' when Results in Death\
    \ (AESDTH) is 'Y'."
  Domains: "AE"
  Severity: "Error"
