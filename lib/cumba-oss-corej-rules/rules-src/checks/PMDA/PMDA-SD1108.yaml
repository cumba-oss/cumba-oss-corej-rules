Core:
  Id: "PMDA-SD1108"
  Status: "Published"
  Version: "1"
Description: "Raise a warning when the VS (Vital Signs) dataset is not present in\
  \ the study."
Severity: "Warning"
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "ALL"
Check:
  expression: >-
    not ds_exists("VS")
Outcome:
  Message: "The VS (Vital Signs) dataset is not present in the study."
Source:
  Message: "Missing VS dataset"
  Description: "Vital Signs (VS) dataset should be included in every submission."
  Domains: "VS"
  Severity: "Warning"
