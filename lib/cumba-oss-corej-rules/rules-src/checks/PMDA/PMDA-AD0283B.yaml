Core:
  Id: "PMDA-AD0283B"
  Status: "Published"
  Version: "1"
Description: "Raise an error when, considering only records on which both ASEV and\
  \ ASEVN are populated, the ASEV variable is not uniquely determined by ASEVN within\
  \ the dataset: a single value of ASEVN maps to more than one value of ASEV."
Executability: "Partially Executable"
ExecutabilityHint:
  Category: "partially executable"
  Detail: "The sheet's 'inconsistent across studies' intent is reinterpreted as a\
    \ within-dataset unique-relationship check between the char/numeric pair ASEV/ASEVN\
    \ (has_multiple_values_for); the cross-study scope is not evaluated."
Scope:
  Data_Structures:
    Include:
    - "BASIC DATA STRUCTURE"
    - "OCCURRENCE DATA STRUCTURE"
Check:
  expression: >-
    not empty(ASEV) and not empty(ASEVN) and has_multiple_values_for(ASEV, ASEVN)
Outcome:
  Message: "There is more than one value of ASEV for a given value of ASEVN (within\
    \ the dataset)."
  Output_Variables:
  - "ASEV"
  - "ASEVN"
Source:
  Message: "Inconsistent value for ASEV"
  Description: "Across studies, all Analysis Severity/Intensity (ASEV) variable values\
    \ must be the same for each unique value of Analysis Severity/Intensity (N) (ASEVN)\
    \ variable when both variables are populated."
  Domains: "OCCDS, ADAE, MDOCCDS, ADAMOTHER"
  Severity: "Error"
Standards:
- Organization: "PMDA"
  Standards:
  - Name: "ADaMIG"
    Version: "1.3"
    References:
