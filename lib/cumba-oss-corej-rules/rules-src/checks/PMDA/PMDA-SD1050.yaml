Core:
  Id: "PMDA-SD1050"
  Status: "Published"
  Version: "1"
Description: "Raise a warning when ETCD does not have a unique value for a given value\
  \ of ELEMENT within the dataset."
Severity: "Warning"
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "SE"
    - "TA"
Requirements:
  Variables:
    All:
    - "ETCD"
    - "ELEMENT"
Check:
  expression: >-
    not is_unique_relationship(ETCD, ELEMENT)
Outcome:
  Message: "Non-unique value for ETCD within ELEMENT"
  Output_Variables:
  - "ETCD"
  - "ELEMENT"
Source:
  Message: "Non-unique value for ETCD within ELEMENT"
  Description: "Element Code (ETCD) must have a unique value for a given value of\
    \ Description of Element (ELEMENT) within the domain."
  Domains: "SE, TA"
  Severity: "Warning"
