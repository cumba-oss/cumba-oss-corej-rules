Core:
  Id: "PMDA-SD1328"
  Status: "Published"
  Version: "1"
Description: "Raise an error when the Related Subject or Pool Identifier (RSUBJID)\
  \ is populated and equal to the Unique Subject Identifier (USUBJID)."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "RELSUB"
Requirements:
  Variables:
    All:
    - "RSUBJID"
    - "USUBJID"
Check:
  expression: >-
    not empty(RSUBJID) and RSUBJID == USUBJID
Outcome:
  Message: "RSUBJID is equal to USUBJID."
  Output_Variables:
  - "RSUBJID"
Source:
  Message: "RSUBJID is equal to USUBJID"
  Description: "The Related Subject or Pool Identifier (RSUBJID) value should not\
    \ be equal to USUBJID."
  Domains: "RELSPEC, RELSUB"
  Severity: "Error"
