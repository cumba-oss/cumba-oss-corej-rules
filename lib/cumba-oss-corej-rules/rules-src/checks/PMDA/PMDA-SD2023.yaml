Core:
  Id: "PMDA-SD2023"
  Status: "Published"
  Version: "1"
Description: "Raise a warning when Date/Time of Birth (BRTHDTC) is populated but Age\
  \ (AGE) is missing or not present in the dataset. AGE should be provided when BRTHDTC\
  \ is populated."
Severity: "Warning"
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "DM"
Requirements:
  Variables:
    All:
    - "BRTHDTC"
Check:
  expression: >-
    not empty(BRTHDTC) and empty(AGE)
Outcome:
  Message: "BRTHDTC is populated, but AGE is missing or not present in the dataset."
  Output_Variables:
  - "BRTHDTC"
  - "AGE"
Source:
  Message: "AGE is not provided"
  Description: "Age (AGE) variable values should be provided when Date/Time of Birth\
    \ (BRTHDTC) variable values are populated."
  Domains: "DM"
  Severity: "Warning"
