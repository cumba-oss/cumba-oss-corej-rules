Core:
  Id: "PMDA-SD1087"
  Status: "Published"
  Version: "1"
Description: "Raise a warning when --STDTC is present in the dataset but --STDY is\
  \ not present."
Severity: "Warning"
Executability: "Fully Executable"
Scope:
  Classes:
    Include:
    - "SPECIAL PURPOSE"
    - "INTERVENTIONS"
    - "FINDINGS"
    - "EVENTS"
    - "FINDINGS ABOUT"
  Domains:
    Exclude:
    - "CO"
    - "DM"
    - "DO"
    - "MH"
    - "SU"
Check:
  expression: >-
    var_exists("--STDTC") and not var_exists("--STDY")
Outcome:
  Message: "--STDY variable is not present in the dataset, but --STDTC variable is\
    \ present."
  Output_Variables:
  - "--STDTC"
Source:
  Message: "Missing --STDY variable when --STDTC variable is present"
  Description: "Study Day of Start (--STDY) variable should be included into dataset\
    \ when Start Study Date/Time (--STDTC) variable is present."
  Domains: "SPECIAL PURPOSE (-CO, -DM), INTERVENTIONS (-SU), FINDINGS (-DO), EVENTS\
    \ (-MH), FINDINGS ABOUT"
  Severity: "Warning"
