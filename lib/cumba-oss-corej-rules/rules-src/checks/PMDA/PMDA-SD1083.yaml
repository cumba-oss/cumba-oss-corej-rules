Core:
  Id: "PMDA-SD1083"
  Status: "Published"
  Version: "1"
Description: "Raise a warning when --DTC is present in the dataset but --DY is not\
  \ present."
Severity: "Warning"
Executability: "Fully Executable"
Scope:
  Classes:
    Include:
    - "SPECIAL PURPOSE"
    - "INTERVENTIONS"
    - "EVENTS"
    - "FINDINGS"
    - "FINDINGS ABOUT"
  Domains:
    Exclude:
    - "DO"
    - "BE"
Check:
  expression: >-
    var_exists("--DTC") and not var_exists("--DY")
Outcome:
  Message: "--DY variable is not present in the dataset, but --DTC variable is present."
  Output_Variables:
  - "--DTC"
Source:
  Message: "Missing --DY variable when --DTC variable is present"
  Description: "Collection Study Day (--DY) variable should be included into dataset\
    \ when Collection Study Date/Time (--DTC) variable is present."
  Domains: "SPECIAL PURPOSE, INTERVENTIONS, FINDINGS (-DO), EVENTS, FINDINGS ABOUT"
  Severity: "Warning"
