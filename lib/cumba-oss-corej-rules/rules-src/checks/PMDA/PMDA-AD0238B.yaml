Core:
  Id: "PMDA-AD0238B"
  Status: "Published"
  Version: "1"
Description: "Raise an error when, within a study, the Planned Pooled Treatment y\
  \ (N) (TRTPGyN) variable does not hold a single consistent value for each unique\
  \ value of the Planned Pooled Treatment y (TRTPGy) variable, evaluated over the\
  \ records where both variables are populated."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "ALL"
Requirements:
  Variables:
    All:
    - "TRTPGyN"
Check:
  expression: >-
    var_exists("TRTPGy") and not empty(TRTPGy) and not empty(TRTPGyN) and
    is_inconsistent_across_dataset(TRTPGyN, keys=[TRTPGy])
Outcome:
  Message: "Inconsistent value for TRTPGyN"
  Output_Variables:
  - "TRTPGy"
  - "TRTPGyN"
wildcards:
  "y":
    min: 1
    max: 99
Source:
  Message: "Inconsistent value for TRTPGyN"
  Description: "Within a study, all Planned Pooled Treatment y (N) (TRTPGyN) variable\
    \ values must be the same for each unique value of  Planned Pooled Treatment y\
    \ (TRTPGy) variable when both variables are populated. Analogous rule for AD0241."
  Domains: "BDS, ADNCA, MDBDS, ADAMOTHER"
  Severity: "Error"
Standards:
- Organization: "PMDA"
  Standards:
  - Name: "ADaMIG"
    Version: "1.3"
    References:
    - Origin: "PMDA Validation Rules"
      Rule_Identifier:
        Id: "AD0238B"
        Version: "1"
      Version: "6.0"
  - Name: "ADaMIG"
    Version: "1.2"
    References:
    - Origin: "PMDA Validation Rules"
      Rule_Identifier:
        Id: "AD0238B"
        Version: "1"
      Version: "6.0"
  - Name: "ADaMIG"
    Version: "1.1"
    References:
    - Origin: "PMDA Validation Rules"
      Rule_Identifier:
        Id: "AD0238B"
        Version: "1"
      Version: "6.0"
