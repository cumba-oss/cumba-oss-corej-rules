Core:
  Id: "PMDA-SD1335"
  Status: "Published"
  Version: "1"
Description: "Raise a warning when the Date/Time of Informed Consent (RFICDTC) is\
  \ after the Date/Time of First Study Treatment (RFXSTDTC)."
Severity: "Warning"
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "DM"
Requirements:
  Variables:
    All:
    - "RFXSTDTC"
Check:
  expression: >-
    not empty(RFICDTC) and date(RFICDTC) > RFXSTDTC
Outcome:
  Message: "RFICDTC is after RFXSTDTC"
  Output_Variables:
  - "RFXSTDTC"
  - "RFICDTC"
Source:
  Message: "RFICDTC is after RFXSTDTC"
  Description: "Date/Time of Informed Consent (RFICDTC) should not be after Date/Time\
    \ of First Study Treatment (RFXSTDTC)."
  Domains: "DM"
  Severity: "Warning"
