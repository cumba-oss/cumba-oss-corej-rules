Core:
  Id: "PMDA-SD0054"
  Status: "Published"
  Version: "1"
Description: "Raise an error when a variable declared in the Define-XML is not present\
  \ in the submitted dataset."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "ALL"
Operations:
- id: "$dataset_variables"
  expression: "get_column_order_from_dataset()"
- id: "$define_variables"
  expression: "define_variable_names()"
- id: "$missing_define_variables"
  expression: "minus($define_variables, subtract=$dataset_variables)"
Check:
  expression: >-
    not contains_all($dataset_variables, $define_variables)
Outcome:
  Message: "A variable declared in the Define-XML is not present in the dataset."
  Output_Variables:
  - "$missing_define_variables"
Source:
  Message: "Variable in define.xml is not present in the dataset"
  Description: "Variables listed in the data definition document (define.xml) should\
    \ be included in the dataset."
  Domains: "ALL"
  Severity: "Error"
