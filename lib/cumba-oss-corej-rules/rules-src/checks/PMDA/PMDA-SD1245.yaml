Core:
  Id: "PMDA-SD1245"
  Status: "Published"
  Version: "1"
Description: "Raise an error when the Time Point Reference (--TPTREF) variable is\
  \ not present in the dataset while the Date/Time of Reference Point (--RFTDTC) variable\
  \ is present."
Executability: "Fully Executable"
Scope:
  Classes:
    Include:
    - "SPECIAL PURPOSE"
    - "INTERVENTIONS"
    - "FINDINGS"
    - "EVENTS"
    - "FINDINGS ABOUT"
  Domains:
    Exclude:
    - "DM"
    - "SE"
    - "SV"
    - "DO"
Check:
  expression: >-
    var_exists("--RFTDTC") and not var_exists("--TPTREF")
Outcome:
  Message: "--RFTDTC variable is present, but --TPTREF variable is not present."
  Output_Variables:
  - "--RFTDTC"
Source:
  Message: "Missing --TPTREF variable when --RFTDTC variable is present"
  Description: "Time Point Reference (--TPTREF) variable must be included into the\
    \ domain when Date/Time of Reference Point (--RFTDTC) variable is present."
  Domains: "SPECIAL PURPOSE (-DM, -SE, -SV), INTERVENTIONS, FINDINGS (-DO), EVENTS,\
    \ FINDINGS ABOUT"
  Severity: "Error"
