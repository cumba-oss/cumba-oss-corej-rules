Core:
  Id: "PMDA-AD0681"
  Status: "Published"
  Version: "1"
Description: "Raise an error when a Pooled Device Model Group (MODELGy) and its numeric\
  \ counterpart (MODELGyN) are both present and MODELGy does not have the same value\
  \ across all records that share the same value of MODELGyN within the study, considering\
  \ only the records on which both variables are populated."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "DEVICE LEVEL ANALYSIS DATASET"
Requirements:
  Variables:
    All:
    - "MODELGy"
Check:
  expression: >-
    var_exists("MODELGyN") and not empty(MODELGy) and not empty(MODELGyN) and
    is_inconsistent_across_dataset(MODELGy, keys=[MODELGyN])
Outcome:
  Message: "MODELGy has inconsistent values for the same value of MODELGyN."
  Output_Variables:
  - "MODELGy"
  - "MODELGyN"
wildcards:
  "y":
    min: 1
    max: 99
Source:
  Message: "Inconsistent value for MODELGy"
  Description: "Within a study, All MODELGy values must be the same for each unique\
    \ value of MODELGyN, when both variables are populated. Analogous rule for AD0682."
  Domains: "ADDL"
  Severity: "Error"
Standards:
- Organization: "PMDA"
  Standards:
  - Name: "ADaMIG"
    Version: "1.3"
    References:
    - Origin: "PMDA Validation Rules"
      Rule_Identifier:
        Id: "AD0681"
        Version: "1"
      Version: "6.0"
