Core:
  Id: "PMDA-SD1373"
  Status: "Published"
  Version: "1"
Description: "Raise a warning when the Reason Arm and/or Actual Arm is Null (ARMNRS)\
  \ variable is populated and not equal to 'UNPLANNED TREATMENT' but Subject Reference\
  \ Start Date/Time (RFSTDTC) is populated; this assumes the study day milestone associated\
  \ with RFSTDTC is the start of study treatment."
Severity: "Warning"
Executability: "Partially Executable - Possible Overreporting"
Scope:
  Domains:
    Include:
    - "DM"
Requirements:
  Variables:
    All:
    - "ARMNRS"
Check:
  expression: >-
    not empty(ARMNRS) and ARMNRS != "UNPLANNED TREATMENT" and not empty(RFSTDTC)
Outcome:
  Message: "RFSTDTC is populated when ARMNRS is populated and not equal to 'UNPLANNED\
    \ TREATMENT'."
  Output_Variables:
  - "RFSTDTC"
  - "ARMNRS"
Source:
  Message: "RFSTDTC is populated for subject who did not receive treatment"
  Description: "RFSTDTC must be null when the Reason Arm and/or Actual Arm is Null\
    \ (ARMNRS) variable is populated (excluding values of UNPLANNED TREATMENT), which\
    \ indicates that the subject did not receive treatment."
  Domains: "DM"
  Severity: "Warning"
Standards:
