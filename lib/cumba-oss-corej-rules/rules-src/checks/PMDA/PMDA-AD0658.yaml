Core:
  Id: "PMDA-AD0658"
  Status: "Published"
  Version: "1"
Description: "Raise an error when NCAXFN (PK NCA Exclusion Flag (N)) is populated\
  \ with a numeric value other than 1; the only permitted populated value is 1 (exclusion),\
  \ with a missing value meaning inclusion."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "BASIC DATA STRUCTURE"
Requirements:
  Variables:
    All:
    - "NCAXFN"
Check:
  expression: >-
    not empty(NCAXFN) and NCAXFN != 1
Outcome:
  Message: "NCAXFN is populated with a value other than 1."
  Output_Variables:
  - "NCAXFN"
Source:
  Message: "NCAXFN value is not 1 or null"
  Description: "NCAXFN (PK NCA Exclusion Flag (N)) must be 1 or null.  It is a numeric\
    \ flag for exclusion of a record into a PK NCA calculation: 1 = exclusion, null\
    \ = inclusion."
  Domains: "ADNCA"
  Severity: "Error"
Standards:
- Organization: "PMDA"
  Standards:
  - Name: "ADaMIG"
    Version: "1.3"
    References:
    - Origin: "PMDA Validation Rules"
      Rule_Identifier:
        Id: "AD0658"
        Version: "1"
      Version: "6.0"
