Core:
  Id: "PMDA-AD0148"
  Status: "Published"
  Version: "1"
Description: "Raise an error when the Parameter (Number) (PARAMN) is populated with\
  \ a value that is not a numeric integer; PARAMN must be an integer."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "BASIC DATA STRUCTURE"
Requirements:
  Variables:
    All:
    - "PARAMN"
Check:
  expression: >-
    not empty(PARAMN) and not is_integer(PARAMN)
Outcome:
  Message: "PARAMN is not an integer"
  Output_Variables:
  - "PARAMN"
Source:
  Message: "PARAMN is not an integer"
  Description: "Numeric Value of Parameter name (PARAMN) must be an integer."
  Domains: "BDS"
  Severity: "Error"
Standards:
- Organization: "PMDA"
  Standards:
  - Name: "ADaMIG"
    Version: "1.0"
    References:
    - Origin: "PMDA Validation Rules"
      Rule_Identifier:
        Id: "AD0148"
        Version: "1"
      Version: "6.0"
