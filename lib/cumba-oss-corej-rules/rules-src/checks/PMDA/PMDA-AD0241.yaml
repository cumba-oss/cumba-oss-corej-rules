Core:
  Id: "PMDA-AD0241"
  Status: "Published"
  Version: "1"
Description: "Raise an error when, within a study, the Actual Pooled Treatment y (N)\
  \ (TRTAGyN) variable does not hold a single consistent value for each unique value\
  \ of the Actual Pooled Treatment y (TRTAGy) variable, evaluated over the records\
  \ where the primary variable TRTAGy is populated."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "ALL"
Requirements:
  Variables:
    All:
    - "TRTAGyN"
Check:
  expression: >-
    var_exists("TRTAGy") and not empty(TRTAGy) and is_inconsistent_across_dataset(TRTAGyN,
    keys=[TRTAGy])
Outcome:
  Message: "Inconsistent value for TRTAGyN"
  Output_Variables:
  - "TRTAGy"
  - "TRTAGyN"
wildcards:
  "y":
    min: 1
    max: 9
Source:
  Message: "Inconsistent value for TRTAGyN"
  Description: "Within a study, all Actual Pooled Treatment y (N) (TRTAGyN) variable\
    \ values must be the same for each unique value of Actual Pooled Treatment y (TRTAGy)\
    \ variable when the primary variable TRTAGy is populated. Analogous rule for AD0238."
  Domains: "BDS, ADAMOTHER"
  Severity: "Error"
Standards:
- Organization: "PMDA"
  Standards:
  - Name: "ADaMIG"
    Version: "1.0"
    References:
    - Origin: "PMDA Validation Rules"
      Rule_Identifier:
        Id: "AD0241"
        Version: "1"
      Version: "6.0"
