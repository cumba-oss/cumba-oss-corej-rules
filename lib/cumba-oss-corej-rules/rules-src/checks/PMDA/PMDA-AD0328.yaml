Core:
  Id: "PMDA-AD0328"
  Status: "Published"
  Version: "1"
Description: "Raise an error when, within a study and a parameter, the numeric Analysis\
  \ Value Category y (N) (AVALCAyN) variable does not hold a single consistent value\
  \ for each unique value of its character equivalent Analysis Value Category y (AVALCATy),\
  \ evaluated on rows where the primary variable AVALCATy is populated. AVALCATy is\
  \ a derived category variable (name ends in AVALCAT followed by y, y = 1-9) and\
  \ AVALCAyN is its numeric code (AVALCA followed by y then N). The mapping is evaluated\
  \ within each Parameter Code (PARAMCD)."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "BASIC DATA STRUCTURE"
    - "MEDICAL DEVICE BASIC DATA STRUCTURE"
Check:
  expression: >-
    not empty(PARAMCD) and not empty(AVALCATy) and is_inconsistent_across_dataset(AVALCAyN,
    keys=[PARAMCD, AVALCATy])
Outcome:
  Message: "Inconsistent value for AVALCAyN"
  Output_Variables:
  - "PARAMCD"
  - "AVALCATy"
  - "AVALCAyN"
wildcards:
  "y":
    min: 1
    max: 99
Source:
  Message: "Inconsistent value for AVALCAyN"
  Description: "Within a Study and a Parameter, all Analysis Value Category y (N)\
    \ (AVALCAyN) variable values must be the same for each unique value of Analysis\
    \ Value Category y (AVALCATy) variable when the primary variable AVALCATy is populated."
  Domains: "BDS, ADNCA, MDBDS"
  Severity: "Error"
Standards:
- Organization: "PMDA"
  Standards:
  - Name: "ADaMIG"
    Version: "1.3"
    References:
