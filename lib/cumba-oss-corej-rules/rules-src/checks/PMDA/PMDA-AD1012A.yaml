Core:
  Id: "PMDA-AD1012A"
  Status: "Published"
  Version: "1"
Description: "Raise an error when a CDISC-standard secondary variable (the N or C\
  \ suffixed counterpart) is present in the dataset but its corresponding primary\
  \ analysis variable is not present."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "ALL"
Check:
  expression: >-
    var_exists(*N) and not var_exists(*) or var_exists(*C) and not var_exists(*)
Outcome:
  Message: "A CDISC-standard secondary variable is present in the dataset, but its\
    \ corresponding primary analysis variable is not present."
  Output_Variables:
  - "*"
wildcardPairCatalogue: true
Source:
  Message: "Secondary variable is present, but its primary variable is not present"
  Description: "In a pair of corresponding character and numeric variables, the primary\
    \ or most commonly used variable must be present if its secondary version describing\
    \ it (*N or *C) is present. This is a rule designed to look explicitly at variable\
    \ pairs defined in the CDISC standard documents. A similar rule that checks custom\
    \ *N or *C variables (with a few exceptions) is AD1012. This rule is expected\
    \ to be added to CDISC ADaM Conformance Rules in the future."
  Domains: "ADSL, ADDL, BDS, ADNCA, MDBDS, OCCDS, ADAE, MDOCCDS, ADAMOTHER"
  Severity: "Error"
Standards:
- Organization: "PMDA"
  Standards:
