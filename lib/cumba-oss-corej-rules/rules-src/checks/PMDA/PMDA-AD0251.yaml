Core:
  Id: "PMDA-AD0251"
  Status: "Published"
  Version: "1"
Description: "Raise an error when the Censor Date Description (CNSDTDSC) variable\
  \ is present in a time-to-event dataset but the Censor (CNSR) variable is not present.\
  \ CNSDTDSC describes the circumstance represented by the censoring date when it\
  \ differs from the event date that warrants censoring; whenever CNSDTDSC is present,\
  \ CNSR must also be present."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "BASIC DATA STRUCTURE"
    - "MEDICAL DEVICE BASIC DATA STRUCTURE"
Check:
  expression: >-
    var_exists("CNSDTDSC") and not var_exists("CNSR")
Outcome:
  Message: "CNSDTDSC is present, but CNSR is not present."
  Output_Variables:
  - "CNSDTDSC"
Source:
  Message: "CNSDTDSC is present, but CNSR is not present"
  Description: "In Time to Event studies, Censor Date Description (CNSDTDSC) variable\
    \ describes the circumstance represented by the censoring date if different from\
    \ the event date that warrants censoring. If present, Censor (CNSR) variable must\
    \ be present. Note that adding CNSDTDSC provides additional information when there\
    \ is a difference between the event date that warrants censoring and the actual\
    \ date of censoring. If the event that warrants censoring is the same as the onset\
    \ date of the event that represents the censoring date, then the CNSDTDSC column\
    \ is not needed in the analysis dataset."
  Domains: "BDS, ADNCA, MDBDS"
  Severity: "Error"
