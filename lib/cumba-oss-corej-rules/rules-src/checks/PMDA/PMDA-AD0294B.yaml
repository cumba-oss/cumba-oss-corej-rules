Core:
  Id: "PMDA-AD0294B"
  Status: "Published"
  Version: "1"
Description: "Raise an error when the AETOXGRN variable is not uniquely determined\
  \ by AETOXGR within the dataset: a single value of AETOXGR maps to more than one\
  \ value of AETOXGRN, considering only the records on which both variables are populated.\
  \ The PMDA validation sheet's 'inconsistent value across studies' intent is reinterpreted\
  \ as a within-dataset unique (1-to-1) relationship check between the paired character/numeric\
  \ variables AETOXGRN and AETOXGR; the cross-study scope is not evaluated."
Executability: "Partially Executable"
ExecutabilityHint:
  Category: "partially executable"
  Detail: "The sheet's 'inconsistent across studies' intent is reinterpreted as a\
    \ within-dataset unique-relationship check between the char/numeric pair AETOXGRN/AETOXGR\
    \ (has_multiple_values_for); the cross-study scope is not evaluated."
Scope:
  Data_Structures:
    Include:
    - "OCCURRENCE DATA STRUCTURE"
  Subclasses:
    Include:
    - "ADVERSE EVENT"
Check:
  expression: >-
    not empty(AETOXGRN) and not empty(AETOXGR) and has_multiple_values_for(AETOXGRN, AETOXGR)
Outcome:
  Message: "There is more than one value of AETOXGRN for a given value of AETOXGR\
    \ (within the dataset)."
  Output_Variables:
  - "AETOXGR"
  - "AETOXGRN"
Source:
  Message: "Inconsistent value for AETOXGRN"
  Description: "Across studies, all Standard Toxicity Grade (N) (AETOXGRN) variable\
    \ values must be the same for each unique value of Standard Toxicity Grade (AETOXGR)\
    \ variable when both variables are populated."
  Domains: "OCCDS, ADAE, MDOCCDS"
  Severity: "Error"
