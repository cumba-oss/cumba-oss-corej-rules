Core:
  Id: "PMDA-AD0239A"
  Status: "Published"
  Version: "1"
Description: "Raise an error when, for a given period xx, both Actual Treatment for\
  \ Period xx (TRTxxA) and Planned Pooled Treatment y for Period xx (TRxxPGy) are\
  \ present but Actual Pooled Treatment y for Period xx (TRxxAGy) is not present;\
  \ when TRTxxA and TRxxPGy are present, the corresponding TRxxAGy must also be present."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "SUBJECT LEVEL ANALYSIS DATASET"
    - "DEVICE LEVEL ANALYSIS DATASET"
Check:
  expression: >-
    var_exists("TRTxxA") and var_exists("TRxxPGy") and not var_exists("TRxxAGy")
Outcome:
  Message: "TRxxPGy and TRTxxA are present, but TRxxAGy is not present."
  Output_Variables:
  - "TRTxxA"
  - "TRxxPGy"
wildcards:
  xx:
    min: 1
    max: 99
  "y":
    min: 1
    max: 99
Source:
  Message: "TRxxPGy and TRTxxA are present, but TRxxAGy is not present"
  Description: "For a given period xx, If both Actual Treatment for Period xx (TRTxxA)\
    \ and Planned Pooled Treatment y for Period xx (TRxxPGy) variables are present,\
    \ then Actual Pooled Treatment y for Period xx (TRxxAGy) variable must be present."
  Domains: "ADSL, ADDL"
  Severity: "Error"
Standards:
- Organization: "PMDA"
  Standards:
  - Name: "ADaMIG"
    Version: "1.3"
    References:
    - Origin: "PMDA Validation Rules"
      Rule_Identifier:
        Id: "AD0239A"
        Version: "1"
      Version: "6.0"
  - Name: "ADaMIG"
    Version: "1.2"
    References:
    - Origin: "PMDA Validation Rules"
      Rule_Identifier:
        Id: "AD0239A"
        Version: "1"
      Version: "6.0"
  - Name: "ADaMIG"
    Version: "1.1"
