Core:
  Id: "PMDA-SD0061"
  Status: "Published"
  Version: "1"
Description: "Raise an error when a domain declared in the Define-XML has no corresponding\
  \ dataset in the study."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "ALL"
Operations:
- id: "$study_datasets"
  expression: "dataset_names()"
- id: "$define_datasets"
  expression: "define_dataset_names()"
- id: "$missing_datasets"
  expression: "minus($define_datasets, subtract=$study_datasets)"
Check:
  expression: >-
    not contains_all($study_datasets, $define_datasets)
Outcome:
  Message: "A domain referenced in the Define-XML is not present in the study."
  Output_Variables:
  - "$missing_datasets"
Source:
  Message: "Domain referenced in define.xml, but dataset is missing"
  Description: "Domains referenced in data definition document (define.xml) should\
    \ be included in the submission."
  Domains: "ALL"
  Severity: "Error"
