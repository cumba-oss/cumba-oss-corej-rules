Core:
  Id: "PMDA-SD1020"
  Status: "Published"
  Version: "1"
Description: "Raise an error when the DM (Demographics) dataset is not present in\
  \ the study."
Severity: "Reject"
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "ALL"
Check:
  expression: >-
    not ds_exists("DM")
Outcome:
  Message: "The DM (Demographics) dataset is not present in the study."
Source:
  Message: "Missing DM dataset"
  Description: "Demographics (DM) dataset must be included in every submission."
  Domains: "DM"
  Severity: "Reject"
