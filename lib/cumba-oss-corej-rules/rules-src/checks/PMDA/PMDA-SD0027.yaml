Core:
  Id: "PMDA-SD0027"
  Status: "Published"
  Version: "1"
Description: "Raise a warning when Original Units (--ORRESU) is provided but the Result\
  \ or Finding in Original Units (--ORRES) is empty or not present."
Severity: "Warning"
Executability: "Fully Executable"
Scope:
  Classes:
    Include:
    - "FINDINGS"
    - "FINDINGS ABOUT"
Requirements:
  Variables:
    All:
    - "--ORRESU"
Check:
  expression: >-
    not empty(--ORRESU) and empty(--ORRES)
Outcome:
  Message: "--ORRES is empty when --ORRESU is provided."
  Output_Variables:
  - "--ORRES"
  - "--ORRESU"
Source:
  Message: "Missing value for --ORRES when --ORRESU is provided"
  Description: "Result or Finding in Original Units (--ORRES) should not be null when\
    \ Original Units (--ORRESU) is provided."
  Domains: "FINDINGS, FINDINGS ABOUT"
  Severity: "Warning"
