Core:
  Id: "PMDA-AD0127A"
  Status: "Published"
  Version: "1"
Description: "Raise an error when the Baseline Value (BASE) or Character Baseline\
  \ Value (BASEC) variable is present in the dataset but the Baseline Record Flag\
  \ (ABLFL) variable is not present. ABLFL is required whenever BASE or BASEC is present."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "BASIC DATA STRUCTURE"
    - "MEDICAL DEVICE BASIC DATA STRUCTURE"
Check:
  expression: >-
    (var_exists("BASE") or var_exists("BASEC")) and not var_exists("ABLFL")
Outcome:
  Message: "BASE or BASEC is present, but ABLFL is not present"
  Output_Variables:
  - "BASE"
  - "BASEC"
Source:
  Message: "BASE or BASEC is present, but ABLFL is not present"
  Description: "ABLFL is required if BASE or BASEC is present in the dataset."
  Domains: "BDS, ADNCA, MDBDS"
  Severity: "Error"
Standards:
- Organization: "PMDA"
