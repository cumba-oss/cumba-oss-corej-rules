Core:
  Id: "PMDA-AD0333"
  Status: "Published"
  Version: "1"
Description: "Raise an error when, within a study and a parameter, the Percent Chg\
  \ from Baseline Category y (PCHGCATy) variable does not have a single consistent\
  \ value across all records sharing the same combination of Parameter Code (PARAMCD)\
  \ and a populated Percent Chg from Baseline Category y (N) (PCHGCAyN) value."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "BASIC DATA STRUCTURE"
    - "MEDICAL DEVICE BASIC DATA STRUCTURE"
Check:
  expression: >-
    var_exists("PARAMCD") and not empty(PCHGCAyN) and not empty(PARAMCD) and
    is_inconsistent_across_dataset(PCHGCATy, keys=[PARAMCD, PCHGCAyN])
Outcome:
  Message: "Inconsistent value for PCHGCATy within a unique PCHGCAyN."
  Output_Variables:
  - "PARAMCD"
  - "PCHGCATy"
  - "PCHGCAyN"
wildcards:
  "y":
    min: 1
    max: 99
Source:
  Message: "Inconsistent value for PCHGCAT*"
  Description: "Within a Study and a Parameter, all Percent Chg from Baseline Category\
    \ y (PCHGCATy) variable values must be the same for each unique value of Percent\
    \ Chg from Baseline Category y (N) (PCHGCAyN) variable when variable PCHGCAyN\
    \ is populated."
  Domains: "BDS, ADNCA, MDBDS"
  Severity: "Error"
Standards:
- Organization: "PMDA"
  Standards:
  - Name: "ADaMIG"
    Version: "1.3"
    References:
    - Origin: "PMDA Validation Rules"
      Rule_Identifier:
        Id: "AD0333"
        Version: "1"
      Version: "6.0"
  - Name: "ADaMIG"
    Version: "1.2"
    References:
    - Origin: "PMDA Validation Rules"
      Rule_Identifier:
        Id: "AD0333"
        Version: "1"
      Version: "6.0"
  - Name: "ADaMIG"
    Version: "1.1"
    References:
    - Origin: "PMDA Validation Rules"
      Rule_Identifier:
        Id: "AD0333"
        Version: "1"
      Version: "6.0"
