Core:
  Id: "PMDA-SD2248-A"
  Status: "Published"
  Version: "1"
Description: "Raise an error when TSVAL does not contain at least a complete (full)\
  \ date in ISO 8601 format for a record where TSPARMCD equals 'SENDTC' (Study End\
  \ Date)."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "TS"
Requirements:
  Variables:
    All:
    - "TSPARMCD"
Check:
  expression: >-
    TSPARMCD == "SENDTC" and not is_complete_date_part(TSVAL)
Outcome:
  Message: "TSVAL is an incomplete date for TSPARMCD equal to 'SENDTC' (Study End\
    \ Date); it must be in ISO 8601 format and include at least the full date."
  Output_Variables:
  - "TSPARMCD"
  - "TSVAL"
Source_Proposed:
  Sheet_Issue: "#106"
  Message: "TSVAL is an incomplete date for TSPARMCD equal to 'SENDTC' (Study End\
    \ Date); it must be in ISO 8601 format and include at least the full date."
  Description: "TSVAL does not contain at least a complete (full) date in ISO 8601\
    \ format for a record where TSPARMCD equals 'SENDTC' (Study End Date)."
  Domains: "TS"
  Severity: "Error"
Source:
  Message: "Invalid TSVAL value for SENDTC"
  Description: "TSVAL variable value must be in ISO 8601 format when TSPARMCD='SENDTC'."
  Domains: "TS"
  Severity: "Error"
