Core:
  Id: "PMDA-SD1104"
  Status: "Published"
  Version: "1"
Description: "Raise a warning when Start Reference Time Point (--STTPT) is present\
  \ in the dataset but Start Relative to Reference Time Point (--STRTPT) is not present\
  \ in the dataset."
Severity: "Warning"
Executability: "Fully Executable"
Scope:
  Classes:
    Include:
    - "SPECIAL PURPOSE"
    - "INTERVENTIONS"
    - "FINDINGS"
    - "EVENTS"
    - "FINDINGS ABOUT"
  Domains:
    Exclude:
    - "CO"
    - "DM"
Check:
  expression: >-
    var_exists("--STTPT") and not var_exists("--STRTPT")
Outcome:
  Message: "--STRTPT variable is not present when --STTPT variable is present."
  Output_Variables:
  - "--STTPT"
Source:
  Message: "Missing --STRTPT variable when --STTPT variable is present"
  Description: "Start Relative to Reference Time Point (--STRTPT) variable must be\
    \ included into the domain when Start Relative Time Point (--STTPT) variable is\
    \ present."
  Domains: "SPECIAL PURPOSE (-CO, -DM), INTERVENTIONS, FINDINGS, EVENTS, FINDINGS\
    \ ABOUT"
  Severity: "Warning"
