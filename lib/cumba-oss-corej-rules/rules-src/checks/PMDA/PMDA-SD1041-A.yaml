Core:
  Id: "PMDA-SD1041-A"
  Status: "Published"
  Version: "1"
Description: "Raise a warning when IESCAT is populated and equal to IECAT in the Trial\
  \ Inclusion/Exclusion Criteria (TI) dataset."
Severity: "Warning"
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "TI"
Requirements:
  Variables:
    All:
    - "IESCAT"
    - "IECAT"
Check:
  expression: >-
    not empty(IESCAT) and IESCAT == IECAT
Outcome:
  Message: "IECAT and IESCAT values are identical."
  Output_Variables:
  - "IECAT"
  - "IESCAT"
Source_Proposed:
  Message: "IECAT and IESCAT values are identical."
  Description: "IESCAT is populated and equal to IECAT in the Trial Inclusion/Exclusion\
    \ Criteria (TI) dataset."
  Domains: "TI"
  Severity: "Warning"
Source:
  Message: "Values for --CAT and --SCAT are identical"
  Description: "Values of Category (--CAT) and Subcategory (--SCAT) variables should\
    \ not be identical."
  Domains: "INTERVENTIONS, FINDINGS, EVENTS, FINDINGS ABOUT, TI"
  Severity: "Warning"
