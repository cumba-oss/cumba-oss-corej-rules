# Enables ServiceLoader-registered JUnit 5 extensions for this module's tests.
#
# Registered here: CompiledProgramCacheIsolationExtension, which clears
# NativeExprEvaluator's static compiled-program cache before every test. Read that
# class's javadoc before changing this — without it, test outcomes in this module
# are order-dependent and mutation testing under-reports kills by a wide margin.
#
# ⚠ COPIED into this module on 2026-09-01. Until then it arrived implicitly, because
# this module depended on corej-cdisc-core's <type>test-jar</type> and a test-jar
# packages target/test-classes — RESOURCES as well as classes. Deleting that
# dependency (plans/done/PLAN-corej-restructure.md section 4) silently took this file, the
# services registration beside it and the extension class with it. Nothing failed:
# both the properties file and the services file went at once, so there was no
# ServiceConfigurationError to notice, and the cache is semantically transparent for
# correct code. What it costs is mutation attribution — measured at 370 -> 131
# survivors for ExprCompiler when the extension was first added.
junit.jupiter.extensions.autodetection.enabled=true
