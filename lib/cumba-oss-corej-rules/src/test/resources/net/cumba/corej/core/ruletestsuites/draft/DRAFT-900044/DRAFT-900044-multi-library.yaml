# A companion publishing TWO genuinely different labels for ONE variable name.
#
# This is the shape the INFO level exists for, and the shape NHOID really has in SDTMIG 3.4
# (measured: 4 domains, 3 distinct labels). The dataset matches one of them, so the ERROR lane
# must stay silent while INFO reports which one matched.
standard: adamig
version: "1-3"
domains:
  IS:
    variable-metadata:
      NHOID: { label: "Non-Host Organism Identifier", simpleDatatype: Char }
  GF:
    variable-metadata:
      NHOID: { label: "Non-Host Organism ID", simpleDatatype: Char }
