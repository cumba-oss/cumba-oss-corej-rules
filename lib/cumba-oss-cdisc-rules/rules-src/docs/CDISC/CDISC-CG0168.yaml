  CDISC|SDTMIG|3.4||CG0168|1:
  - Cited_Guidance: "Specification[Date/time of comment on dedicated comment form. Should be null if this is a child record of another domain or if comment date was not collected.]|Assumption 2c[Those related to a specific parent record or group of parent records, in which case the value of the variable RDOMAIN is set to the DOMAIN code of the parent record(s) and the variables IDVAR and IDVARVAL are populated with the key variable name and value of the parent record(s). Assumptions for populating IDVAR and IDVARVAL are further described in Section 8.5, Relating Comments to a Parent Domain. CODTC should be null because the timing of the parent record(s) is inherited by the comment record. See example, Rows 3-5.]"
    Document: "IG v3.4"
