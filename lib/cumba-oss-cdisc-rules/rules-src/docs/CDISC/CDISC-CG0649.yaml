Core: "CDISC-CG0649"
Citations:
  CDISC|SDTMIG|3.4||CG0649|1:
  - Cited_Guidance: "7.4.2[Assumption 11]Some codelists used for TSVAL include terms\
      \ which are also null flavors. For example, the Pharmaceutical Dosage Form codelist\
      \ includes the values \"UNKNOWN\" and \"NOT APPLICABLE.\" In such cases, TSVAL\
      \ should have the term from the codelist and TSVALNF should be null.]|7.4.2.1[While\
      \ it would be possible to allow a value such as NONE or UNBOUNDED to be entered\
      \ in TSVAL, validation programs would then have to recognize this special term\
      \ as an exception to the expected data format. Therefore, it was decided that\
      \ a separate null flavor variable that uses the ISO 21090 null flavor terminology\
      \ would be a better solution.]"
    Document: "IG v3.4"
    Item: "7.4.2[Assumption 11]"
    Section: "7.4.2|7.4.2.1"
