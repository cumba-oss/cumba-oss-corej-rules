Core: CDISC-CG0468
Citations:
  CDISC|SDTMIG|3.4||CG0468|1:
  - Cited_Guidance: When time points are represented in SDTMIG domains, both --TPT
      and --TPTNUM must be used. 
    Document: IG v3.3
    Section: 4.4.10
  CDISC|SDTMIG|3.3||CG0468|1:
  - Cited_Guidance: When time points are used, --TPTNUM is expected. Within the context
      that defines uniqueness for a time point, which may include domain, visit, and
      reference time point, there must be a one-to-relationship between values of
      --TPT and --TPTNUM. in other words, if domain, visit, and reference time point
      uniquely identify subject data, then if two subjects have records with the same
      values of DOMAIN, VISITNUM, --TPTREF, and --TPTNUM, then these records may not
      have different time point descriptions in --TPT.
    Document: IG v3.3
    Section: 4.4.10
  CDISC|SDTMIG|3.2||CG0468|1:
  - Cited_Guidance: When time points are used, --TPTNUM is expected. Within the context
      that defines uniqueness for a time point, which may include domain, visit, and
