  CDISC|ADaMIG|1.0||CR18|1:
  - Cited_Guidance: "ADaMIG v1.0, Section 3: In general, the variable labels specified\
      \ in the tables in Section 3 are required. There are only two exceptions to\
      \ this rule: (1) descriptive text is allowed at the end of the labels of variables\
      \ whose names contain indexes \"y\" or \"zz\"; and (2) asterisks (*) and ellipses\
      \ (...) in specified variable labels should be replaced by the sponsor with\
      \ appropriate text."
