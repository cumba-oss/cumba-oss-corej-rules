Core: "CDISC-SEND-0368"
Citations:
  CDISC|SENDIG-DART|1.2||SEND368|1:
  - Cited_Guidance: "When the Corpora Lutea Count is recorded separately for each ovary there should be a record for each location (PYRESLOC).\nIf PYRESLOC is null or not in the dataset, this is assumed to be a total count from both ovaries. This also applies to recording results separately for the left and right uterine horns vs. the total uterine count (e.g., Number of Implantations, Number of Resorptions, etc.)."
    Document: "SENDIG-DART v1.2"
    Item: "Assumption 7"
    Section: "5.2.2"
