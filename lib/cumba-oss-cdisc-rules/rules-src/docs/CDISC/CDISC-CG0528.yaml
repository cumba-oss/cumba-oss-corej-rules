Core: "CDISC-CG0528"
Citations:
  CDISC|SDTMIG|3.4||CG0528|1:
  - Cited_Guidance: "The standard Supplemental Qualifiers included in previous versions\
      \ of the SDTMIG (COMPLT, FULLSET, ITT, PPROT, and SAFETY) should not be used.\
      \ Note that the ADaM subject-level analysis dataset (ADSL) specifies standard\
      \ variable names for the most common populations and requires the inclusion of\
      \ these flags when necessary for analysis; consult the ADaM Implementation Guide\
      \ for more information about these variables."
