Core: "CDISC-SEND-0048"
Citations:
  CDISC|SENDIG-GENETOX|1.0||SEND48|1:
  - Cited_Guidance: "The order of variables in the data definition file should reflect the order of variables in the dataset. The order of variables in the SDTM domain models has been chosen to facilitate the review of the models and application of the models. Variables for the three general observation classes should be ordered with Identifiers first, followed by the Topic Qualifier, and Timing variables. Within each role, variables are ordered as shown in Tables 2.2.1-2.2.5 of the SDTM."
    Document: "SENDIG v3.1.1"
    Item: "Text"
