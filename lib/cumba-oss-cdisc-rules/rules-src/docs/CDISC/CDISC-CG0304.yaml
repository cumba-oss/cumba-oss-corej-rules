  - Cited_Guidance: "Additional Events Qualifiers:\nThe following Qualifiers would\
      \ not be used in AE: --OCCUR, --STAT, and--REASND. They are the only Qualifiers\
      \ from the SDTM Events Class not in the AE domain. They are not permitted because\
