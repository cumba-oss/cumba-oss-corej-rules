Core: "CDISC-AD0046"
Citations:
  CDISC|ADaMIG|1.0||CR46|1:
  - Cited_Guidance: "ADaMIG v1.0, Section 3, Item 8 (General Timing Variable Conventions):\
      \ Variables whose names end in DY are relative day variables. In ADaM as in\
      \ the SDTM, there is no day 0. If there is a need to create a relative day variable\
      \ that includes day 0, then its name must not end in DY. ADaM relative day variables\
      \ need not be anchored by SDTM RFSTDTC. When SDTM.RFSTDTC is not the anchor\
      \ date then the anchor date used must be stored in an ADaM dataset."
    Document: "ADaMIG v1.0"
    Section: "3"
    Item: "8 (General Timing Variable Conventions)"
