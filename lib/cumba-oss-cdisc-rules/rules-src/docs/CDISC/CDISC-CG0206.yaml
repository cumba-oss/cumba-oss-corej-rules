  CDISC|SDTMIG|3.4||CG0206|1:
  - Cited_Guidance: "TAETORD will not be populated for subject Elements that are not\
      \ planned for the Arm to which the subject was assigned. Thus, TAETORD will not\
      \ be populated for any Element with an ETCD value of “UNPLAN”."
    Document: "IG v3.4"
    Item: "Assumption 6"
    Section: "5.3"
  CDISC|SDTMIG|3.3||CG0206|1:
  - Cited_Guidance: "TAETORD will not be populated for subject Elements that are not\
      \ planned for the Arm to which the subject was assigned. Thus, TAETORD will not\
      \ be populated for any Element with an ETCD value of \"UNPLAN\". TAETORD will\
      \ also not be populated if a subject passed through an Element that, although\
      \ defined in the TE dataset, was out of place for the Arm to which the subject\
      \ was assigned. For example, if a subject in a parallel study of Drug A vs. Drug\
      \ B was assigned to receive Drug A, but received Drug B instead, then TAETORD\
      \ would be left blank for the SE record for their Drug B Element. If a subject\
      \ was assigned to receive the sequence of Elements A, B, C, D, and instead received\
      \ A, D, B, C, then the sponsor would have to decide for which of these subject\
      \ Element records TAETORD should be populated. The rationale for this decision\
      \ should be documented in the Comments column of the define.xml."
    Document: "IG v3.3"
    Item: "Assumption 6"
    Section: "5.3"
