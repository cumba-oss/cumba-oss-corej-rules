Core: "CDISC-SEND-0123.1"
Citations:
  CDISC|SENDIG-GENETOX|1.0||SEND123.1|1:
  - Cited_Guidance: "If the sponsor decides that the subject’s experience for a particular period of time cannot be represented with one of the planned Elements, then that period of time should be represented as an unplanned Element.For unplanned Elements, ETCD should be populated with “UNPLAN”, ELEMENT should be left blank, and SEUPDES should be populated with a description of the unplanned Element."
    Document: "SENDIG v3.1.1"
    Item: "Assumption 4 | Assumption 5"
    Section: "5.3.1.1"
