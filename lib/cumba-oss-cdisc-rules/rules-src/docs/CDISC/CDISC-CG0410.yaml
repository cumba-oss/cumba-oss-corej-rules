  CDISC|SDTMIG|3.4||CG0410|2:
  - Cited_Guidance: "IG v3.4[5.5 SV][One record per subject per actual visit.]\nIG\
      \ v3.4[7.3.1.1 TV][TV Issues 4][Some data collection is contingent on the occurrence\
      \ of a \"trigger\" event, or disease milestone (see the Trial Disease Milestones\
      \ (TM) dataset under Section 7.3, Schedule for Assessments (TV, TD, and TM)).\
      \ When such planned data collection involves an additional clinic visit, a \"\
      contingent\" Visit may be included in the trial visits table, with start a rule\
      \ that describes the circumstances under which it will take place. Since values\
      \ of VISITNUM must be assigned to all records in the Trial Visits dataset, a\
      \ contingent Visit included in the Trial Visits dataset must have a VISITNUM,\
      \ but the VISITNUM value may not be a \"chronological\" value, due to the uncertain\
      \ timing of a contingent Visit. If contingent visits are not included in the\
      \ TV dataset, then they would be treated as unplanned visits in the Subject Visits\
      \ (SV) domain.]"
    Document: "IG v3.4"
    Item: "[7.3.1.1 TV][TV Issues 4]"
    Section: "5.5|7.3.1.1"
