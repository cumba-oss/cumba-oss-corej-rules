Core: "CDISC-AD0038"
Citations:
  CDISC|ADaMIG|1.0||CR38|1:
  - Cited_Guidance: "ADaMIG v1.0, Section 3, Item 10 (General Variable Naming Conventions):\
      \ If any combining of the SDTM character categories is done, the name of the\
      \ derived ADaM character grouping variable should end in GRy and the name of\
      \ its numeric equivalent should end in GRyN where y is an integer from 1-9 representing\
      \ a grouping scheme. For example, if a character analysis variable is created\
      \ to contain values of Caucasian and Non-Caucasian from the SDTM RACE variable\
      \ that has 5 categories, then it should be named RACEGRy and its numeric equivalent\
      \ should be named RACEGRyN (e.g., RACEGR1, RACEGR1N). Trunca"
    Document: "ADaMIG v1.0"
    Section: "3"
    Item: "10 (General Variable Naming Conventions)"
