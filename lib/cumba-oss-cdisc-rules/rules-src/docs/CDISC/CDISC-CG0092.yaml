    Item: --TPTREF
    Section: Timing
  CDISC|SDTMIG|3.3||CG0092|1:
  - Cited_Guidance: 'Model v1.7[2.2.5 Timing Variables for All Classes][Table 2.2.5.1:
      --TPTREF]Description of the fixed reference point referred to by --ELTM, --TPTNUM,
      --TPT, --STINT, and --ENINT. Examples: "PREVIOUS DOSE", "PREVIOUS MEAL".]|IG
      v3.3[4.4.10 Representing Time Points][If the protocol describes the scheduling
      of a dose using a reference intervention or assessment, then --TPTREF should
      be populated, even if it does not contribute to uniqueness. The fact that time
      points are related to a reference time point, and what that reference time point
      is, are important for interpreting the data collected at the time point.]'
