Core: "CDISC-SEND-0091"
Citations:
  CDISC|SENDIG-GENETOX|1.0||SEND91|1:
  - Cited_Guidance: "Occasionally data that are intended to be numeric are collected with characters attached that cause the character-to numeric conversion to fail. For example, numeric cell counts in the source data may be specified with a greater than (>) or less than (<) sign attached (e.g., >10,000 or <1). These values should have a null result in the --STRESN column since only numeric values can be represented in the --STRESN field."
    Document: "SENDIG v3.1.1"
    Item: "Text"
    Section: "4.5.1.1"
