Core: "CDISC-AD0447"
Citations:
  CDISC|ADaMIG|1.2||CR447|1:
  - Cited_Guidance: "ADaMIG v1.2, Section 3.3.3, Table 3.3.3.1: There must be a one-to-one\
      \ relationship between AVISITN and AVISIT (i.e., AVISITN has the same value\
      \ for each distinct AVISIT) within a parameter. A best practice is to extend\
      \ the one-to-one relationship to within a study, but this is not an ADaM requirement.\
      \ In the event that a record does not fall within any predefined analysis timepoint\
      \ window, AVISITN can be populated in any way that the producer chooses to indicate\
      \ this fact (e.g., may be null). Va"
    Document: "ADaMIG v1.2"
    Section: "3.3.3"
    Item: "Table 3.3.3.1"
