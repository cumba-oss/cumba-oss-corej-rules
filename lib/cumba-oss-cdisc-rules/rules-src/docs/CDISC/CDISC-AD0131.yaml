Core: "CDISC-AD0131"
Citations:
  CDISC|ADaMIG|1.0||CR131|1:
  - Cited_Guidance: "ADaMIG v1.0, Section 3.2.4, Table 3.2.4.1: Required when there\
      \ are multiple ways that baseline is defined. If used for a given PARAM, should\
      \ be populated for all records of that PARAM."
    Document: "ADaMIG v1.0"
    Section: "3.2.4"
    Item: "Table 3.2.4.1"
  CDISC|ADaMIG|1.2||CR131|1:
  - Cited_Guidance: "ADaMIG v1.2, Section 3.3.4.1, Table 3.3.4.1.1: If used for any\
      \ PARAM within a dataset, should be non-null for all records of that dataset.\n\
      \nADaMIG v1.2, Section 4.2.1.6: Whenever there is more than one definition of\
      \ baseline, the BASETYPE column is required. BASETYPE identifies the definition\
      \ of baseline that corresponds to the value of BASE in each row."
    Document: "ADaMIG v1.2"
    Section: "3.3.4.1; 4.2.1.6"
    Item: "Table 3.3.4.1.1"
