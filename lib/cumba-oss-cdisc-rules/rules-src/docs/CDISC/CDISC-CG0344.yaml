Core: "CDISC-CG0344"
Citations:
  CDISC|SDTMIG|3.4||CG0344|1:
  - Cited_Guidance: "If multiple values are reported for an intervention or event topic\
      \ variable (e.g., --TRT in an Interventions general observation-class dataset\
      \ or --TERM in an Events general observation-class dataset), it is expected that\
      \ the sponsor will split the values into multiple records or otherwise resolve\
      \ the multiplicity per the sponsor's data management standard operating procedures."
    Document: "IG v3.4"
    Section: "4.2.8.1"
