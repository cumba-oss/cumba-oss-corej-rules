  CDISC|SDTMIG|3.2||CG0193|2:
  - Cited_Guidance: "MBRESCAT is expected in all records where a microorganism has\
      \ been identified to differentiate between colonizing organisms and the one(s)\
      \ that are causing the infection. It is not expected when there is “No growth”\
      \ or when the results are from a gram stain."
