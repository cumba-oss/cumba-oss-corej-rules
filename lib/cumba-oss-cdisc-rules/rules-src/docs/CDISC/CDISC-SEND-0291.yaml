Core: "CDISC-SEND-0291"
Citations:
  CDISC|SENDIG-GENETOX|1.0||SEND291|1:
  - Cited_Guidance: "In general, all domains based on the three general observation classes should have at least one Timing variable. In the Events or Interventions general observation class, this could be the start date of the event or intervention…This domain should contain one record per constant dosing interval per subject per administration site (as identified in FOCID). A constant dosing interval is sponsor defined and represents a specific period of time during which a subject was treated with a specific lot at a constant dose level."
    Document: "SENDIG v3.1.1"
    Item: "Text | Assumption 1.b"
    Section: "4.4 | 6.1.1.1"
