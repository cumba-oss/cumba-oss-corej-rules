  - Cited_Guidance: "Information about the time of collection for any observation is needed to identify the record. CLDTC is Expected, and the data will, in most cases, contain CLDTC, CLDY, or both. However, some studies (e.g., legacy studies) may not collect CLDTC or CLDY; in those cases, CLNOMDY must be populated."
