Core: "CDISC-CG0017"
Citations:
  CDISC|SDTMIG|3.4||CG0017|2:
  - Cited_Guidance: "4.1.7[For domains with two-letter domain codes (i.e., other than\
      \ SUPPxx and RELREC), split dataset names can be up to four characters in length...\
      \ The four-character dataset-name limitation allows the use of a Supplemental\
      \ Qualifier dataset associated with the split dataset]|2[AP domain codes are\
      \ therefore four characters long.]"
    Document: "IG v3.4|AP Guide v1.0"
    Item: "Item 6"
    Section: "4.1.7|2"
  CDISC|SDTMIG|3.3||CG0017|2:
  - Cited_Guidance: "4.1.7[Split dataset names can be up to four characters in length.\
      \ For example, if splitting by --CAT, then dataset names would be the domain\
      \ name plus up to two additional characters (e.g., QS36 for SF-36). If splitting\
      \ Findings About by parent domain, then the dataset name would be the domain\
      \ name plus the two-character domain code describing the parent domain code (e.g.,\
      \ FACM).]|2[AP domain codes are therefore four characters long.]"
    Document: "IG v3.3|AP Guide v1.0"
    Item: "Rule 6"
    Section: "4.1.7|2"
  CDISC|SDTMIG|3.2||CG0017|2:
