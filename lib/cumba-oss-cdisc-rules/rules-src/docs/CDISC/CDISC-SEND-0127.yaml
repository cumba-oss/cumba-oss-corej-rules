Core: "CDISC-SEND-0127"
Citations:
  CDISC|SENDIG|3.0||SEND127|1:
  - Cited_Guidance: "The Subject Elements domain allows the submission of data on the individual experience: the actual timing and sequence of Elements a subject experienced.  Please read Section 7.2 (Trial Elements) and Section 7.3 (Trial Arms), as these datasets define a study's planned Elements and describe the planned sequences of Elements for the Arms of the study. There are, by definition, no time gaps between Elements; therefore, the value of SEENDTC for one Element will always be the same as the value of SESTDTC for the next Element. Each Element continues until the time at which the next Element begins."
    Document: "SENDIG v3.0"
    Item: "Assumption 1"
    Section: "5.3.1.1"
