Core: "CDISC-CG0341"
Citations:
  CDISC|SDTMIG|3.4||CG0341|1:
  - Cited_Guidance: "Findings: \"Other, Specify\" for tests may be handled similarly\
      \ to Interventions. --TESTCD and --TEST should be populated with the code and\
      \ description of the test found in the specified text. If specific tests are\
      \ not prespecified on the CRF and the investigator has the option of writing\
      \ in tests, then the name of the test would have to be coded to ensure that all\
      \ --TESTCD and --TEST values are consistent with the test controlled terminology."
    Document: "IG v3.4"
    Section: "4.2.7.3"
