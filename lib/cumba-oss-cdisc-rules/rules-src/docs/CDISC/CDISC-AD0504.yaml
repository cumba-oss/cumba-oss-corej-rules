Core: "CDISC-AD0504"
Citations:
  CDISC|ADaMIG|1.1||CR504|1:
  - Cited_Guidance: "ADaMIG v1.1, Section 3.1.6, Item 2: Variable labels containing\
      \ a word or phrase in brackets, e.g. {Time}, should be replaced by the producer\
      \ with appropriate text that contains the bracketed word or phrase somewhere\
      \ in the text (e.g., the label for a *TM variable is indicated as {Time} in\
      \ this document) indicating any producer defined label is permitted as long\
      \ as the word Time is incorporated in it."
    Document: "ADaMIG v1.1"
    Section: "3.1.6"
    Item: "2"
  CDISC|ADaMIG|1.2||CR504|1:
  - Cited_Guidance: "ADaMIG v1.2, Section 3.1.6, Item 2: Variable labels containing\
      \ a word or phrase in curly brackets, e.g., {Time} (the label for *TM variables),\
      \ should be replaced by the producer with appropriate text. The label must contain\
      \ the bracketed word or phrase somewhere in the text"
    Document: "ADaMIG v1.2"
    Section: "3.1.6"
    Item: "2"
  CDISC|ADaMIG|1.3||CR504|1:
  - Cited_Guidance: "ADaMIG v1.3, Section 3.1.6, Item 2: Variable labels containing\
