  - Cited_Guidance: "ADaMIG v1.0, Section 2.3.1: ADSL contains one record per subject,\
      \ regardless of the type of clinical trial design. ADSL is used to provide the\
      \ variables that describe attributes of a subject. This allows simple combining\
      \ with any other dataset, including SDTM domains and analysis datasets. ADSL\
      \ is a source for subject-level variables used in other analysis datasets, such\
      \ as population flags and treatment variables. There is only one ADSL per study.\
