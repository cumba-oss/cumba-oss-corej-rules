Core: "CDISC-CG0397"
Citations:
  CDISC|SDTMIG|3.4||CG0397|1:
  - Cited_Guidance: "The standardized result of the measurement, test, or examination\
      \ in character format. --STRESC should store all results or findings in character\
      \ format; if results are numeric, they should also be stored in numeric format\
      \ in --STRESN. If various tests have results \"NONE\", \"NEG\", and \"NEGATIVE\"\
      \ in --ORRES and these results effectively have the same meaning, they could\
      \ be represented in standard format in --STRESC as \"NEGATIVE\"."
    Document: "Model v2.0"
    Section: "Findings"
  - Cited_Guidance: "Contains the result value for all findings, copied or derived\
      \ from LBORRES in a standard format or standard units."
    Document: "IG v3.4"
    Item: "Specification"
    Section: "6.3.5.3"
