Core: "CDISC-SEND-0095.1"
Citations:
  CDISC|SENDIG-GENETOX|1.0||SEND95.1|1:
  - Cited_Guidance: "The first 200 characters of text should be submitted in the standard domain variable, and each additional 200 characters of text should be represented as a record in the SUPP-- dataset (see Section 8). In this dataset, the value for QNAM should contain a sequential variable name, which is formed by appending a one-digit integer, beginning with 1, to the original standard domain variable name. When splitting a text string into several records, the text should be split between words to improve readability."
    Document: "SENDIG v3.1.1"
    Item: "Text"
    Section: "4.5.2.2"
