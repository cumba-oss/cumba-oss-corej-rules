  CDISC|ADaMIG|1.1||CR786|1:
  - Cited_Guidance: "ADaMIG v1.1, Section 3.1.1, Item 6: In a pair of corresponding\
      \ variables (e.g., TRTP and TRTPN), the primary or most commonly used variable\
      \ does not have the suffix or extension (e.g., N for Numeric or C for Character).\
      \ The relevant suffix is used only on the name of the secondary member of the\
      \ variable pair. For example, in the (TRTP, TRTPN) pair, the primary variable,\
      \ TRTP is character; but it is not named TRTPC. Similarly in the (APERIOD, APERIODC)\
      \ pair, the primary variable, APERIOD, is nume"
