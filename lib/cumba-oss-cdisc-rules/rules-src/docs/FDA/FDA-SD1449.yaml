Core: FDA-SD1449
Citations:
  FDA|SDTMIG|3.4||SD1449|1:
  - Cited_Guidance: 'Reported Term for the Adverse Event (AETERM) is expected to be coded using the Medical Dictionary for Regulatory Affairs (MedDRA). Sponsors should code each term to the MedDRA-specified hierarchy of terms. These terms/codes are represented in SDTM variables that are subject to MedDRA: AELLT, AELLTCD, AEDECOD, AEPTCD, AEHLT, AEHLTCD, AEHLGT, AEHLGTCD, AEBODSYS, AEBDSYCD, AESOC, AESOCCD.'
    Document: FDA Validator Rules v1.6
    Section: FDAB003, TCG 6.3.1.1
