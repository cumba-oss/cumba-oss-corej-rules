Core: FDA-SE2238
Citations:
  FDA|SENDIG|3.1.1||SE2238|1:
  - Cited_Guidance: Values from the No Yes Response (NY) codelist should not be populated in Parameter Value (TSVAL) when TSPARMCD = 'GLPTYP' (Good Laboratory Practice Type) in the Trial Summary (TS) domain.  The NY codelist should be used to populate TSVAL when TSPARMCD = 'GLPFL' (GLP Flag) and not when TSPARMCD = 'GLPTYP'.
    Document: FDA Validator Rules v1.6
    Section: FDAB011
