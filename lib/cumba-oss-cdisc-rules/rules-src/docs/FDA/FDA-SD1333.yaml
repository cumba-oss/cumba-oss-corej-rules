Core: FDA-SD1333
Citations:
  FDA|SDTMIG|3.4||SD1333|1:
  - Cited_Guidance: The Outcome of Adverse Event (AEOUT) variable is populated with the value RECOVERED/RESOLVED, however the End Date/Time of Adverse Event (AEENDTC) or Duration of Adverse Event (AEDUR) variables are null. If the adverse event has an outcome of RECOVERED/RESOLVED, it is expected that an end date or a collected duration be provided.
    Document: FDA Validator Rules v1.6
    Section: FDAB034
