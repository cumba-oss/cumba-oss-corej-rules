  FDA|SENDIG-AR|1.0||SD1386|1:
  - Cited_Guidance: 'End Day of Obs Rel to Challenge Agent (--CHENDY) variable value should be populated as defined by CDISC standards: --CHENDY = (date portion of --ENDTC) - (date portion of RFCSTDTC) +1 if --ENDTC is on or after RFCSTDTC; --CHENDY = (date portion of --ENDTC) - (date portion of RFCSTDTC) if --ENDTC precedes RFCSTDTC.'
