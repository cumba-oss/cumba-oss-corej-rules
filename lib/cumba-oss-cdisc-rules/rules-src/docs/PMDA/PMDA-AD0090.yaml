Core: PMDA-AD0090
Citations:
  PMDA|ADaMIG|1.0||AD0090|1:
  - Cited_Guidance: 'PMDA Severity: Error. At least 1 treatment variable is required in a BDS dataset. This requirement is satisfied by any of the subject-level (ARM, ACTARM, TRTxxP, TRTxxA, TRTSEQP, TRTSEQA, TRxxPGy, TRxxAGy, TSEQPGy, TSEQAGy) or record-level (TRTP, TRTA, TRTPGy, TRTAGy) treatment variables. One is allowed to use any treatment variable in analysis of BDS. Any subject-level treatment variable may be copied into the BDS dataset from ADSL.'
    Document: PMDA Validation Rules v6.0
    Section: AD0090
