Core: PMDA-AD0046
Citations:
  PMDA|ADaMIG|1.0||AD0046|1:
  - Cited_Guidance: 'PMDA Severity: Error. A variable with a suffix of DY (day) must not equal zero. Variables whose names end in DY are relative day variables. In ADaM as in the SDTM, there is no day 0. If there is a need to create a relative day variable that includes day 0, then its name must not end in DY.'
    Document: PMDA Validation Rules v6.0
    Section: AD0046
