Core: PMDA-SD1439
Citations:
  PMDA|SDTMIG|3.3||SD1439|1:
  - Cited_Guidance: "PMDA Severity: Warning. By its definition clinical baseline flags (e.g., last non-missing value prior to first dose) should have only a single record for the same test for subject. Therefore, each subject (USUBJID) should have no more than one record with Baseline Flag (--BLFL) equals 'Y' for the same assessment which is defined by Test (--TESTCD), Test Details (--TSTDTL), Category (--CAT), Subcategory (--SCAT), Method (--METHOD), Specimen (--SPEC), Location (--LOC), Laterality (--LAT), Directionality (--DIR), Position (--POS) and Object (--OBJ) variables."
    Document: "PMDA Validation Rules v6.0"
    Section: "SD1439"
