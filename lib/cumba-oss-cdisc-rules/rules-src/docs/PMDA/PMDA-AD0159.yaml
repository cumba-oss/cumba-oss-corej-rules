Core: PMDA-AD0159
Citations:
  PMDA|ADaMIG|1.0||AD0159|1:
  - Cited_Guidance: 'PMDA Severity: Error. If AWTDIFF (Analysis Window Diff from Target) is populated AWTARGET (Analysis Window Target) must be populated. AWTDIFF = Absolute value of (ADY or ARELTM) - AWTARGET. Note: A future rule should validate that the calculation is correct. Rule enhanced by Pinnacle 21 to include ADY and ARELTM. If only AWTDIFF is present and populated, this rule will fire even if some or all other variables are not present. This may fire simultaneously with AD0158.'
    Document: PMDA Validation Rules v6.0
    Section: AD0159
