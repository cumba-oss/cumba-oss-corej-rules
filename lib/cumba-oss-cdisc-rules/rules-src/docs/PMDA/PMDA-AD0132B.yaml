Core: PMDA-AD0132B
Citations:
  PMDA|ADaMIG|1.0||AD0132B|1:
  - Cited_Guidance: 'PMDA Severity: Error. If any of CHG (change), PCHG (percent change),
      or R2BASE (ratio of Analysis Value to Base) is populated, the values necessary
      for its calculation must both be present and populated. CHG = AVAL - BASE, PCHG
      = (AVAL - BASE)/BASE * 100, R2BASE = AVAL / BASE. Once this issue is resolved,
      there is greater potential for rules AD0132, AD0225, AD0223 to fire.'
    Document: PMDA Validation Rules v6.0
    Section: AD0132B
