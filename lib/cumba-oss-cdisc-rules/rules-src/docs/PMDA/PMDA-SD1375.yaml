  PMDA|SDTMIG|3.4||SD1375|1:
  - Cited_Guidance: "PMDA Severity: Warning. RFENDTC must be null when actual arm indicates that the subject is a screen failure ('Screen Failure'), was not assigned to an arm ('Not Assigned') or was not treated ('NOTTRT') (or null). This rule applies to studies where RFENDTC is associated with a treatment date."
