Core: PMDA-SD1332
Citations:
  PMDA|SDTMIG|3.3||SD1332|1:
  - Cited_Guidance: 'PMDA Severity: Warning. The Outcome of Adverse Event (AEOUT) variable is populated with the value NOT RECOVERED/NOT RESOLVED, however the End Date/Time of Adverse Event (AEENDTC) variable is populated with an end date for the adverse event. If the adverse event has an outcome of NOT RECOVERED/NOT RESOLVED, it is expected that no end date is available.'
