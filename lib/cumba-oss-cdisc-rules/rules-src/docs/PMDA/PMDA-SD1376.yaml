Core: PMDA-SD1376
Citations:
  PMDA|SDTMIG|3.4||SD1376|1:
  - Cited_Guidance: "PMDA Severity: Warning. Subject Reference End Date/Time (RFENDTC) should be populated for all treated subjects, those where Actual Arm Code (ACTARMCD) is not equal to 'SCRNFAIL', 'NOTASSGN' or 'NOTTRT' (or null). If the study is ongoing, Parameter Value (TSVAL) for the 'ONGOSIND/Ongoing Study Indicator' parameter should be set to 'Y' in the Trial Summary (TS) domain."
