Core: PMDA-SD1352
Citations:
  PMDA|SDTMIG|3.3||SD1352|1:
  - Cited_Guidance: 'PMDA Severity: Warning. The structure of Interventions class domains should be one record per Intervention Episode per subject. No Interventions with the same Treatment (--TRT), Decoded Term (--DECOD), Mood (--MOOD), Category (--CAT), Subcategory (--SCAT), Route (--ROUTE), Location (--LOC) and Treatment Vehicle (--TRTV) values for the same Subject (USUBJID) with the same Start Date (--STDTC), Planned Time Point Name (--TPT), and Planned Time Point Number (--TPTNUM) are expected.'
    Document: PMDA Validation Rules v6.0
    Section: SD1352
