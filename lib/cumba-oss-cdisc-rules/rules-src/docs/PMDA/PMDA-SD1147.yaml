Core: PMDA-SD1147
Citations:
  PMDA|SDTMIG|3.1.2||SD1147|1:
  - Cited_Guidance: "PMDA Severity: Error. Pre-specified (--PRESP) variable should be included into dataset when Occurrence (--OCCUR) variable is present. (--PRESP/Events) Used to indicate whether the event described by --TERM was pre-specified on a CRF. Value is Y for pre-specified events, null for spontaneously reported events. (--PRESP/Interventions) Used when a specific intervention is pre-specified on a CRF. Values should be 'Y' or null. (--OCCUR) Used to record whether a pre-specified event occurred when information about the occurrence of a specific event is solicited."
    Document: "PMDA Validation Rules v6.0"
    Section: "SD1147"
