  PMDA|SDTMIG|3.3||SD1333|1:
  - Cited_Guidance: 'PMDA Severity: Warning. The Outcome of Adverse Event (AEOUT) variable is populated with the value RECOVERED/RESOLVED, however the End Date/Time of Adverse Event (AEENDTC) or Duration of Adverse Event (AEDUR) variables are null. If the adverse event has an outcome of RECOVERED/RESOLVED, it is expected that an end date or a collected duration be provided.'
