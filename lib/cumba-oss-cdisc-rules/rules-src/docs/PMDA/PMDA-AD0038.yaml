  - Cited_Guidance: 'PMDA Severity: Error. Within a study, all *GRy values must be the same for each unique value of *GRyN when the primary variable *GRy is populated. ADaM IG v1.0 p.11 general variable naming conventions #10: If any combining of the SDTM character categories is done, the name of the derived ADaM character grouping variable should end in GRy and the name of its numeric equivalent should end in GRyN where y is an integer from 1-9 representing a grouping scheme.'
