Core: PMDA-AD0282A
Citations:
  PMDA|ADaMIG|1.0||AD0282A|1:
  - Cited_Guidance: 'PMDA Severity: Error. For Analysis Severity/Intensity (N) (ASEVN) variables, the CDISC ADaM Validation Checks v1.3 explicitly require values of 1, 2, 3 while forbidding null values for this permissible variable. In contrast, AESEVN can be 1, 2, 3, or null. Since ASEVN cannot be null, the value it qualifies ASEV cannot be null. ASEV, if present, should apply imputation rules for missing severity of adverse events as specified in the SAP or metadata.'
    Document: PMDA Validation Rules v6.0
    Section: AD0282A
