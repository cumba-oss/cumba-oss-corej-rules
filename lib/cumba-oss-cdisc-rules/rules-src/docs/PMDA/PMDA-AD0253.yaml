Core: PMDA-AD0253
Citations:
  PMDA|ADaMIG|1.0||AD0253|1:
  - Cited_Guidance: 'PMDA Severity: Error. Adverse Events specified in SDTM AE domain
      must be traceable to ADaM ADAE dataset based on Study Identifier (STUDYID), Unique
      Subject Identifier (USUBJID) and Sequence Number (AESEQ) variables. The ADAE
      structure for the standard adverse event safety dataset must have at least one
      record per each AE recorded in SDTM AE domain. However, subjects not analyzed
      (e.g., Screen Failures) who have AEs recorded in SDTM AE, but not in ADSL do
      not need to be included in ADAE. Currently, this check does not take into account
      the latter. Please check your ADSL file to see if these issues are for Screen
      Failures.'
    Document: PMDA Validation Rules v6.0
    Section: AD0253
