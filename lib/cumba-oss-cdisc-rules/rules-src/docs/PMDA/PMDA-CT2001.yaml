Core: PMDA-CT2001
Citations:
  PMDA|SDTMIG|3.1.2||CT2001|1:
  - Cited_Guidance: 'PMDA Severity: Reject. Variable must be populated with terms from its CDISC controlled terminology codelist. New terms cannot be added into non-extensible codelists. NOTE: Violation of CT2001 for the following variable/codelist pairs will be considered part of Rejection criteria. All others will be

      considered Errors.


      <Variable Name (Codelist Name)>

      AGEU (AGEU)

      COUNTRY (COUNTRY)

      IECAT (IECAT)

      RELTYPE (RELTYPE)

      SEX (SEX)

      --BLFL (NY)

      --DRVFL (NY)

      --FAST (NY)

      --OCCUR (NY)

      --PRESP (NY)

      AESER (NY)

      AESCONG (NY)

      AESDISAB (NY)

      AESDTH (NY)

      AESHOSP (NY)

      AESLIFE (NY)

      AECONTRT (NY)

      AESCAN (NY)

      AESMIE (NY)

      AESOD (NY)

      IEORRES (NY)

      IESTRESC (NY)

      --STAT (ND)'
    Document: PMDA Validation Rules v6.0
    Section: CT2001
