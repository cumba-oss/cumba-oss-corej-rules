Core:
  Id: "DRAFT-900002"
  Status: "Draft"
  Version: "1"
Description: "Raise an error when --LLT is not empty but --LLTCD is missing or not\
  \ present in dataset."
Executability: "Fully Executable"
Scope:
  Classes:
    Include:
    - "EVENTS"
  Use_Case: "INDH"
Requirements:
  Variables:
    All:
    - "--LLT"
Check:
  expression: >-
    not empty(--LLT) and empty(--LLTCD)
Outcome:
  Message: "--LLT is not empty but --LLTCD is missing or not present in dataset."
  Output_Variables:
  - "--LLT"
  - "--LLTCD"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "SDTMIG"
    Version: "3.4"
  - Name: "SDTMIG"
    Version: "3.3"
  - Name: "SDTMIG"
    Version: "3.2"
  - Name: "SENDIG"
    Version: "3.1.1"
  - Name: "TIG"
    Substandard: "SDTM"
    Version: "1.0"
