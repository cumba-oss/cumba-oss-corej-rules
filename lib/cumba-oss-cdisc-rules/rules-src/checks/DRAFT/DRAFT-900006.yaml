Core:
  Id: "DRAFT-900006"
  Status: "Draft"
  Version: "1"
Description: "Raise an error when TSVCDREF and TSVAL are populated (a controlled-terminology\
  \ value is referenced) but TSVALCD is empty or not present in dataset."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "TS"
Requirements:
  Variables:
    All:
    - "TSVCDREF"
    - "TSVAL"
Check:
  expression: >-
    not empty(TSVCDREF) and not empty(TSVAL) and empty(TSVALCD)
Outcome:
  Message: "TSVAL references controlled terminology (TSVCDREF is populated) but TSVALCD\
    \ is empty or not present in dataset."
  Output_Variables:
  - "TSVAL"
  - "TSVALCD"
  - "TSVCDREF"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "SDTMIG"
    Version: "3.4"
  - Name: "SDTMIG"
    Version: "3.3"
  - Name: "SDTMIG"
    Version: "3.2"
  - Name: "SENDIG"
    Version: "3.1.1"
  - Name: "TIG"
    Substandard: "SDTM"
    Version: "1.0"
