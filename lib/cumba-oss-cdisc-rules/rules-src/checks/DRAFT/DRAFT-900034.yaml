Core:
  Id: "DRAFT-900034"
  Status: "Draft"
  Version: "1"
Description: "Raise an error when the ADSL dataset's class is not 'SUBJECT LEVEL ANALYSIS\
  \ DATASET'."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "ALL"
Check:
  expression: >-
    ds_name("DATA") == "ADSL" and ds_class("DATA") != "SUBJECT LEVEL ANALYSIS DATASET"
Outcome:
  Message: "ADSL dataset class is not 'SUBJECT LEVEL ANALYSIS DATASET'."
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.3"
