Core:
  Id: "DRAFT-900005"
  Status: "Draft"
  Version: "1"
Description: "Raise an error when --DECOD is not empty but its companion --PTCD is\
  \ present in the dataset and missing."
Executability: "Fully Executable"
Scope:
  Classes:
    Include:
    - "EVENTS"
  Use_Case: "INDH"
Requirements:
  Variables:
    All:
    - "--DECOD"
    - "--PTCD"
Check:
  expression: >-
    not empty(--DECOD) and empty(--PTCD)
Outcome:
  Message: "--DECOD is not empty but --PTCD is missing."
  Output_Variables:
  - "--DECOD"
  - "--PTCD"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "SDTMIG"
    Version: "3.4"
  - Name: "SDTMIG"
    Version: "3.3"
  - Name: "SDTMIG"
    Version: "3.2"
  - Name: "SENDIG"
    Version: "3.1.1"
  - Name: "TIG"
    Substandard: "SDTM"
    Version: "1.0"
