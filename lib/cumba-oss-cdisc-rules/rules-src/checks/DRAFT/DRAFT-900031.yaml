Core:
  Id: "DRAFT-900031"
  Status: "Draft"
  Version: "1"
Description: "Raise an error when PCT (Percent Change from Baseline) is populated\
  \ on a baseline record (ABLFL = 'Y'); PCT should be null for baseline records."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "BASIC DATA STRUCTURE"
Requirements:
  Variables:
    All:
    - "ABLFL"
Check:
  expression: >-
    ABLFL == "Y" and not empty(PCT)
Outcome:
  Message: "PCT is populated on a baseline record (ABLFL = 'Y'). PCT should be null\
    \ for baseline records."
  Output_Variables:
  - "PCT"
  - "ABLFL"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.3"
