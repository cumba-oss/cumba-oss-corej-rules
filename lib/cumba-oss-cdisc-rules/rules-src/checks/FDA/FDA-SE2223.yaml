Core:
  Id: "FDA-SE2223"
  Status: "Published"
  Version: "1"
Description: "Raise an error when the Trial Summary (TS) dataset does not contain\
  \ a record where TSPARMCD equals 'TSTFLOC' (Test Facility Location)."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "TS"
Operations:
- id: "$tstfloc_count"
  expression: "record_count(filter=filter(TSPARMCD=\"TSTFLOC\"))"
Check:
  expression: >-
    $tstfloc_count == 0
Outcome:
  Message: "Missing TSTFLOC Trial Summary Parameter: a 'Test Facility Location' (TSTFLOC)\
    \ record must be present in the Trial Summary (TS) domain."
  Output_Variables:
  - "$tstfloc_count"
Source:
  FDA_Validator_Rule_Message: "Missing TSTFLOC Trial Summary Parameter"
  FDA_Validator_Rule_Description: "'Test Facility Location' (TSTFLOC) record should\
    \ be populated in Trial Summary (TS) domain."
  Domains: "TS"
