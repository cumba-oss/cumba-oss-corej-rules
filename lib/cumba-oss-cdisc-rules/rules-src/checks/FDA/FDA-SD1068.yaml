Core:
  Id: "FDA-SD1068"
  Status: "Published"
  Version: "1"
Description: "Raise an error when ELEMENT is not unique within the TE dataset."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "TE"
Requirements:
  Variables:
    All:
    - "ELEMENT"
Check:
  expression: >-
    not is_unique_set([ELEMENT])
Outcome:
  Message: "Duplicate ELEMENT value"
  Output_Variables:
  - "ELEMENT"
Source:
  FDA_Validator_Rule_Message: "Duplicate ELEMENT value"
  FDA_Validator_Rule_Description: "The value of Element (Description of Element) variable\
    \ must be unique within Trial Elements (TE) domain."
  Domains: "TE"
