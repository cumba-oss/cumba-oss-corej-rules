Core:
  Id: "FDA-SE2347"
  Status: "Published"
  Version: "1"
Description: "Raise an error when a Set Code (SETCD) value defined in the Trial Sets\
  \ (TX) domain is not assigned to any subject (USUBJID) in the Demographics (DM)\
  \ domain."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "TX"
Operations:
- id: "$dm_setcd"
  expression: "distinct(SETCD, domain=\"DM\")"
Check:
  expression: >-
    not empty(SETCD) and SETCD not in $dm_setcd
Outcome:
  Message: "SETCD value defined in the Trial Sets (TX) domain is not present in the\
    \ Demographics (DM) domain."
  Output_Variables:
  - "SETCD"
  - "$dm_setcd"
Source:
  FDA_Validator_Rule_Message: "SETCD value not present in DM"
  FDA_Validator_Rule_Description: "Set Code (SETCD) values defined in Trial Sets (TX)\
    \ should be assigned to at least one subject (USUBJID) in Demographics (DM)."
  Domains: "TX"
