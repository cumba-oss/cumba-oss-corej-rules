Core:
  Id: "FDA-SE2321"
  Status: "Published"
  Version: "1"
Description: "Raise an error when the Trial Summary (TS) dataset does not contain\
  \ a record where TSPARMCD equals 'SLENGTH' (Study Length)."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "TS"
Operations:
- id: "$slength_count"
  expression: "record_count(filter=filter(TSPARMCD=\"SLENGTH\"))"
Check:
  expression: >-
    $slength_count == 0
Outcome:
  Message: "Missing SLENGTH Trial Summary Parameter: a 'Study Length' (SLENGTH) record\
    \ must be present in the Trial Summary (TS) domain."
  Output_Variables:
  - "$slength_count"
Source:
  FDA_Validator_Rule_Message: "Missing SLENGTH Trial Summary Parameter"
  FDA_Validator_Rule_Description: "'Study Length' (SLENGTH) record should be populated\
    \ in Trial Summary (TS) domain. It is used for Janus Non Clinical data load blocking."
  Domains: "TS"
