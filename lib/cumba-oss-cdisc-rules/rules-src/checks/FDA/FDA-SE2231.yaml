Core:
  Id: "FDA-SE2231"
  Status: "Published"
  Version: "1"
Description: "Raise an error when SETCD (Set Code) has more than one value for a given\
  \ SET (Set Description); all SETCD values should be the same within a SET."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "TX"
Check:
  expression: >-
    not empty(SETCD) and not empty(SET) and has_multiple_values_for(SETCD, SET)
Outcome:
  Message: "SETCD has more than one value for a given SET; all SETCD values should\
    \ be the same within a SET."
  Output_Variables:
  - "SETCD"
  - "SET"
Source:
  FDA_Validator_Rule_Message: "Inconsistent value for SETCD within SET"
  FDA_Validator_Rule_Description: "All values of Set Code (SETCD) should be the same\
    \ for a given value of Set Description (SET)."
  Domains: "TX"
