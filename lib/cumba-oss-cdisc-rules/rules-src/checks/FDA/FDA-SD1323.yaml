Core:
  Id: "FDA-SD1323"
  Status: "Published"
  Version: "1"
Description: "Raise an error when TSVAL is populated with a value that is not a term\
  \ in the CDISC COUNTRY (ISO 3166-1 alpha-3) controlled terminology codelist for\
  \ a record where TSPARMCD equals 'FCNTRY' (Planned Country of Investigational Sites)."
Executability: "Partially Executable - Possible Overreporting"
Scope:
  Domains:
    Include:
    - "TS"
Requirements:
  Variables:
    All:
    - "TSPARMCD"
Operations:
- id: "$country_terms"
  expression: "codelist_terms(codelists=[COUNTRY], level=\"term\", returntype=\"value\"\
    )"
Check:
  expression: >-
    TSPARMCD == "FCNTRY" and not empty(TSVAL) and TSVAL not in $country_terms
Outcome:
  Message: "Invalid TSVAL value for FCNTRY: TSVAL must be a valid ISO 3166-1 alpha-3\
    \ term from the CDISC COUNTRY codelist when TSPARMCD equals 'FCNTRY' (Planned\
    \ Country of Investigational Sites)."
  Output_Variables:
  - "TSPARMCD"
  - "TSVAL"
Source:
  FDA_Validator_Rule_Message: "Invalid TSVAL value for FCNTRY"
  FDA_Validator_Rule_Description: "TSVAL for FCNTRY record must be a valid term from\
    \ ISO 3166."
  Domains: "TS"
