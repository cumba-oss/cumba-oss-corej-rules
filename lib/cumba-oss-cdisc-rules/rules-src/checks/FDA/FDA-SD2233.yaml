Core:
  Id: "FDA-SD2233"
  Status: "Published"
  Version: "1"
Description: "Raise an error when the Trial Summary (TS) dataset does not contain\
  \ a record where TSPARMCD equals 'SENDTC' (Study End Date)."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "TS"
Operations:
- id: "$sendtc_count"
  expression: "record_count(filter=filter(TSPARMCD=\"SENDTC\"))"
Check:
  expression: >-
    $sendtc_count == 0
Outcome:
  Message: "Missing SENDTC Trial Summary Parameter: a 'Study End Date' (SENDTC) record\
    \ must be present in the Trial Summary (TS) domain."
  Output_Variables:
  - "$sendtc_count"
Source:
  FDA_Validator_Rule_Message: "Missing SENDTC Trial Summary Parameter"
  FDA_Validator_Rule_Description: "'Study End Date' (SENDTC) record must be populated\
    \ in Trial Summary (TS) domain. It is expected for SDTM IG v3.1.2 data and required\
    \ for data in all more recent SDTM versions."
  Domains: "TS"
