Core:
  Id: "FDA-SD2211"
  Status: "Published"
  Version: "1"
Description: "Raise an error when the study population is unhealthy subjects (HLTSUBJI\
  \ is 'N') and the Trial Summary (TS) dataset does not contain a record where TSPARMCD\
  \ equals 'TDIGRP' (Diagnosis Group)."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "TS"
Operations:
- id: "$hltsubji_n_count"
  expression: "record_count(filter=filter(TSPARMCD=\"HLTSUBJI\", TSVAL=\"N\"))"
- id: "$tdigrp_count"
  expression: "record_count(filter=filter(TSPARMCD=\"TDIGRP\"))"
Check:
  expression: >-
    $hltsubji_n_count >= 1 and $tdigrp_count == 0
Outcome:
  Message: "Missing TDIGRP Trial Summary Parameter: a 'Diagnosis Group' (TDIGRP) record\
    \ must be present in the Trial Summary (TS) domain."
  Output_Variables:
  - "$tdigrp_count"
Source:
  FDA_Validator_Rule_Message: "Missing TDIGRP Trial Summary Parameter"
  FDA_Validator_Rule_Description: "'Diagnosis Group' (TDIGRP) record must be populated\
    \ in Trial Summary (TS) domain, when study population is unhealthy subjects (HLTSUBJI\
    \ = 'N'). It is expected for SDTM IG v3.1.2 data and required for data in all\
    \ more recent SDTM versions."
  Domains: "TS"
