Core:
  Id: "FDA-SD0004"
  Status: "Published"
  Version: "1"
Description: "Raise an error when the Domain Abbreviation (DOMAIN) value is not consistent\
  \ with the name of the dataset (the dataset name does not begin with the DOMAIN\
  \ value)."
Executability: "Fully Executable"
Scope:
  Domains:
    Exclude:
    - "SUPP--"
    - "SQ--"
    - "RELREC"
    - "RELREF"
    - "POOLDEF"
    - "RELSPEC"
    - "RELSUB"
    - "AP--"
    - "APRELSUB"
Requirements:
  Variables:
    All:
    - "DOMAIN"
Check:
  expression: >-
    prefix(dataset_name, 2) != DOMAIN
Outcome:
  Message: "Inconsistent value for DOMAIN"
  Output_Variables:
  - "dataset_name"
  - "DOMAIN"
Source:
  FDA_Validator_Rule_Message: "Inconsistent value for DOMAIN"
  FDA_Validator_Rule_Description: "Domain Abbreviation (DOMAIN) variable should be\
    \ consistent with the name of the dataset."
  Domains: "ALL"
