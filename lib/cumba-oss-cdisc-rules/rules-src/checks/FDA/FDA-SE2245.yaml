Core:
  Id: "FDA-SE2245"
  Status: "Published"
  Version: "1"
Description: "Raise an error when the Trial Summary (TS) dataset contains a record\
  \ where TSPARMCD equals 'TSCNTRY' (Test Site Country) and/or a record where TSPARMCD\
  \ equals 'TSLOC' (Test Site Location), but does not contain a record where TSPARMCD\
  \ equals 'TSNAM' (Test Site Name)."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "TS"
Operations:
- id: "$tscntry_count"
  expression: "record_count(filter=filter(TSPARMCD=\"TSCNTRY\"))"
- id: "$tsloc_count"
  expression: "record_count(filter=filter(TSPARMCD=\"TSLOC\"))"
- id: "$tsnam_count"
  expression: "record_count(filter=filter(TSPARMCD=\"TSNAM\"))"
Check:
  expression: >-
    ($tscntry_count >= 1 or $tsloc_count >= 1) and $tsnam_count == 0
Outcome:
  Message: "Missing TSNAM Trial Summary Parameter: a 'Test Site Name' (TSNAM) record\
    \ must be present in the Trial Summary (TS) domain when a 'Test Site Country'\
    \ (TSCNTRY) and/or 'Test Site Location' (TSLOC) record is present."
  Output_Variables:
  - "$tscntry_count"
  - "$tsloc_count"
  - "$tsnam_count"
Source:
  FDA_Validator_Rule_Message: "Missing TSNAM Trial Summary Parameter when TSCNTRY\
    \ and/or TSLOC Parameters are provided"
  FDA_Validator_Rule_Description: "'Test Site Name' (TSNAM) record should be provided\
    \ in the Trial Summary (TS) domain when records for 'Test Site Country' (TSCNTRY)\
    \ and/or 'Test Site Location' (TSLOC) are present."
  Domains: "TS"
Standards:
- Organization: "FDA"
  Standards:
