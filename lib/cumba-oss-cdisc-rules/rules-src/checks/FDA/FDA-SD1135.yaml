Core:
  Id: "FDA-SD1135"
  Status: "Published"
  Version: "1"
Description: "Raise an error when a Study Day variable (--STDY or --ENDY) has a negative\
  \ value in the EC or EX dataset."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "EC"
    - "EX"
Check:
  expression: >-
    not empty(--STDY) and var_exists("--STDY") and --STDY < 0 or not empty(--ENDY) and
    var_exists("--ENDY") and --ENDY < 0
Outcome:
  Message: "Negative value for Study Day variable (--STDY or --ENDY)."
  Output_Variables:
  - "--STDY"
  - "--ENDY"
Source:
  FDA_Validator_Rule_Message: "Negative value of Study Day variable"
  FDA_Validator_Rule_Description: "Study Day variables (*DY) value should not be negative\
    \ in Exposure (EX) datasets."
  Domains: "EC, EX"
