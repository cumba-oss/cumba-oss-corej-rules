Core:
  Id: "FDA-SE2301"
  Status: "Published"
  Version: "1"
Description: "Raise an error when no record with TXPARMCD equal to 'SPGRPCD' ('Sponsor-Defined\
  \ Group Code') is present for a SETCD in the Trial Sets (TX) domain."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "TX"
Grouping:
  Variables:
  - "SETCD"
Operations:
- id: "$spgrpcd_count"
  expression: "record_count(SETCD, domain=\"TX\", group=[SETCD], filter=filter(TXPARMCD=\"\
    SPGRPCD\"))"
Check:
  expression: >-
    $spgrpcd_count == 0
Outcome:
  Message: "Missing SPGRPCD Trial Set Parameter: no 'Sponsor-Defined Group Code' (SPGRPCD)\
    \ record is present for this SETCD in the Trial Sets (TX) domain."
  Output_Variables:
  - "$spgrpcd_count"
  - "SETCD"
Source:
  FDA_Validator_Rule_Message: "Missing SPGRPCD Trial Set Parameter within SETCD"
  FDA_Validator_Rule_Description: "'Sponsor-Defined Group Code' (SPGRPCD) records\
    \ should be populated for each SETCD in Trial Sets (TX) domain."
  Domains: "TX"
Standards:
- Organization: "FDA"
