Core:
  Id: "FDA-SD0062"
  Status: "Published"
  Version: "1"
Description: "Raise an error when a submitted dataset was loaded from a source format\
  \ other than SAS transport (XPORT) or text-delimited (CSV)."
Executability: "Partially Executable - Possible Underreporting"
ExecutabilityHint:
  Category: "partially executable"
  Detail: "Checks the authoritative 'file_format' metadata key the host loader stamps\
    \ from the provider that actually parsed the source; the sheet accepts SAS transport\
    \ (XPORT v5) OR text-delimited, so XPORT and CSV pass and any other loaded source\
    \ format fires. Residual underreporting: a file with an incompatible transport\
    \ generally fails to load and never reaches rule execution, and a host that does\
    \ not stamp the key is excluded by the non_empty guard rather than false-firing."
Scope:
  Domains:
    Include:
    - "ALL"
Operations:
- id: "$file_format"
  expression: "extract_metadata(\"file_format\")"
Check:
  expression: >-
    not empty($file_format) and $file_format not in ["XPORT", "CSV"]
Outcome:
  Message: "The submitted dataset was loaded from a source format other than SAS transport\
    \ (XPORT) or text-delimited (CSV)."
  Output_Variables:
  - "$file_format"
Source:
  FDA_Validator_Rule_Message: "Incompatible data source"
  FDA_Validator_Rule_Description: "Domain table must have a valid format (e.g., SAS\
    \ transport (XPORT) v.5 or text-delimited)."
  Domains: "ALL"
