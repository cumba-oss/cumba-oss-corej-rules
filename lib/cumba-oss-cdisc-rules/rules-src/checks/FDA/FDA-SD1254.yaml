Core:
  Id: "FDA-SD1254"
  Status: "Published"
  Version: "1"
Description: "Raise an error when AEOUT in the AE dataset equals 'FATAL' but DTHFL\
  \ in the DM dataset does not equal 'Y' for the corresponding subject."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "DM"
Requirements:
  Variables:
    All:
    - "DTHFL"
Match_Datasets:
- Keys:
  - "USUBJID"
  Name: "AE"
Check:
  expression: >-
    var_exists(AE.AEOUT) and AE.AEOUT == "FATAL" and DTHFL != "Y"
Outcome:
  Message: "DTHFL does not equal 'Y' when AEOUT in the AE dataset equals 'FATAL'."
  Output_Variables:
  - "DTHFL"
  - "AE.AEOUT"
Source:
  FDA_Validator_Rule_Message: "DTHFL does not equal 'Y' when AE.AEOUT = 'FATAL'"
  FDA_Validator_Rule_Description: "DTHFL must equal 'Y' when there is a record in\
    \ the Adverse Events (AE) domain with AEOUT = 'FATAL'."
  Domains: "AE"
Standards:
- Organization: "FDA"
  Standards:
  - Name: "SDTMIG"
    Version: "3.4"
    References:
    - Origin: "FDA Validator Rules"
      Rule_Identifier:
