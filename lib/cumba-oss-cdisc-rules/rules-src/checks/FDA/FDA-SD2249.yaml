Core:
  Id: "FDA-SD2249"
  Status: "Published"
  Version: "1"
Description: "Raise an error when TSVAL is not an integer for a record where TSPARMCD\
  \ equals 'ACTSUB' (Actual Number of Subjects)."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "TS"
Requirements:
  Variables:
    All:
    - "TSVAL"
    - "TSPARMCD"
Check:
  expression: >-
    var_exists("TSVAL") and TSPARMCD == "ACTSUB" and not is_integer(TSVAL)
Outcome:
  Message: "Invalid TSVAL value for ACTSUB: TSVAL must be a numeric integer when TSPARMCD\
    \ equals 'ACTSUB' (Actual Number of Subjects)."
  Output_Variables:
  - "TSPARMCD"
  - "TSVAL"
Source:
  FDA_Validator_Rule_Message: "Invalid TSVAL value for ACTSUB"
  FDA_Validator_Rule_Description: "TSVAL variable value must be numeric, when TSPARMCD='ACTSUB'."
  Domains: "TS"
