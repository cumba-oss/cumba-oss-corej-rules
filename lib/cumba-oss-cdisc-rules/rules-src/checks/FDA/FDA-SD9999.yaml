Core:
  Id: "FDA-SD9999"
  Status: "Published"
  Version: "1"
Description: "Raise an error when the class declared in the Define-XML for a custom\
  \ dataset is not based on one of the SDTM general observation classes (EVENTS, FINDINGS,\
  \ INTERVENTIONS)."
Executability: "Fully Executable"
Scope:
  Domains:
    Exclude:
    - "SUPP--"
    - "SQ--"
    - "AP--"
    - "APRELSUB"
Operations:
- id: "$domain_is_custom"
  expression: "domain_is_custom()"
Check:
  expression: >-
    $domain_is_custom == true and not empty(ds_class("DEFINE")) and upper(ds_class("DEFINE")) not in
    ["EVENTS", "FINDINGS", "INTERVENTIONS"]
Outcome:
  Message: "The class of a custom dataset is not one of the SDTM general observation\
    \ classes (EVENTS, FINDINGS, INTERVENTIONS)."
  Output_Variables:
  - "define_dataset_class"
Source:
  FDA_Validator_Rule_Message: "Dataset class not recognized"
  FDA_Validator_Rule_Description: "The structure for custom dataset should be based\
    \ on one of the general observation classes (EVENTS, FINDINGS, INTERVENTIONS)\
    \ defined by the SDTM model."
  Domains: "UNRECOGNIZED"
