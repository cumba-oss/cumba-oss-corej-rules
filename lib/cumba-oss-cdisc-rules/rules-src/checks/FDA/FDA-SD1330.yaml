Core:
  Id: "FDA-SD1330"
  Status: "Published"
  Version: "1"
Description: "Raise an error when Study Day of Observation (--DY) is greater than\
  \ Study Day of End of Observation (--ENDY)."
Executability: "Fully Executable"
Scope:
  Classes:
    Include:
    - "FINDINGS"
    - "FINDINGS ABOUT"
Requirements:
  Variables:
    All:
    - "--DY"
    - "--ENDY"
Check:
  expression: >-
    not empty(--DY) and not empty(--ENDY) and --DY > --ENDY
Outcome:
  Message: "--DY is after --ENDY"
  Output_Variables:
  - "--DY"
  - "--ENDY"
Source:
  FDA_Validator_Rule_Message: "--DY is after --ENDY"
  FDA_Validator_Rule_Description: "Study Day of Observation (--DY) must be less or\
    \ equal to Study Day of End of Observation (--ENDY)"
  Domains: "FINDINGS, FINDINGS ABOUT"
