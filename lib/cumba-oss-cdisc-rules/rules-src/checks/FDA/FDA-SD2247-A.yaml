Core:
  Id: "FDA-SD2247-A"
  Status: "Published"
  Version: "1"
Description: "Raise an error when TSVAL does not contain at least a complete (full)\
  \ date in ISO 8601 format for a record where TSPARMCD equals 'SSTDTC' (Study Start\
  \ Date)."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "TS"
Requirements:
  Variables:
    All:
    - "TSPARMCD"
Check:
  expression: >-
    TSPARMCD == "SSTDTC" and not is_complete_date_part(TSVAL)
Outcome:
  Message: "TSVAL is an incomplete date for TSPARMCD equal to 'SSTDTC' (Study Start\
    \ Date); it must be in ISO 8601 format and include at least the full date."
  Output_Variables:
  - "TSPARMCD"
  - "TSVAL"
Source_Proposed:
  Sheet_Issue: "#105"
  FDA_Validator_Rule_Message: "TSVAL is an incomplete date for TSPARMCD equal to 'SSTDTC'\
    \ (Study Start Date); it must be in ISO 8601 format and include at least the full\
    \ date."
  FDA_Validator_Rule_Description: "TSVAL does not contain at least a complete (full)\
    \ date in ISO 8601 format for a record where TSPARMCD equals 'SSTDTC' (Study Start\
    \ Date)."
  Domains: "TS"
Source:
  FDA_Validator_Rule_Message: "Invalid TSVAL value for SSTDTC"
  FDA_Validator_Rule_Description: "TSVAL variable value must be in ISO 8601 format,\
    \ when TSPARMCD='SSTDTC'."
  Domains: "TS"
