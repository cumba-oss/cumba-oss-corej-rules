Core:
  Id: "FDA-SD1102"
  Status: "Published"
  Version: "1"
Description: "Raise an error when End Reference Time Point (--ENTPT) is present in\
  \ the dataset but End Relative to Reference Time Point (--ENRTPT) is not present\
  \ in the dataset."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "ALL"
Check:
  expression: >-
    var_exists("--ENTPT") and not var_exists("--ENRTPT")
Outcome:
  Message: "--ENRTPT variable is not present when --ENTPT variable is present."
  Output_Variables:
  - "--ENTPT"
Source:
  FDA_Validator_Rule_Message: "Missing --ENRTPT variable, when --ENTPT variable is\
    \ present"
  FDA_Validator_Rule_Description: "End Relative to Reference Time Point (--ENRTPT)\
    \ variable must be included into the domain, when End Relative Time Point (--ENTPT)\
    \ variable is present."
  Domains: "SE, SM, SV, INTERVENTIONS, EVENTS, FINDINGS, FINDINGS ABOUT"
