Core:
  Id: "FDA-SD0013"
  Status: "Published"
  Version: "1"
Description: "Raise an error when Start Date/Time (--STDTC) is after End Date/Time\
  \ (--ENDTC)."
Executability: "Fully Executable"
Scope:
  Classes:
    Include:
    - "INTERVENTIONS"
    - "EVENTS"
    - "SPECIAL PURPOSE"
  Domains:
    Exclude:
    - "CO"
Requirements:
  Variables:
    All:
    - "--ENDTC"
    - "--STDTC"
Check:
  expression: >-
    not empty(--STDTC) and not empty(--ENDTC) and date(--STDTC) > --ENDTC
Outcome:
  Message: "--STDTC is after --ENDTC"
  Output_Variables:
  - "--STDTC"
  - "--ENDTC"
Source:
  FDA_Validator_Rule_Message: "--STDTC is after --ENDTC"
  FDA_Validator_Rule_Description: "Start Date/Time of Event, Exposure or Observation\
    \ (--STDTC) must be less or equal to End Date/Time of Event, Exposure or Observation\
    \ (--ENDTC)."
  Domains: "DM, SE, SM, SV, INTERVENTIONS, EVENTS"
