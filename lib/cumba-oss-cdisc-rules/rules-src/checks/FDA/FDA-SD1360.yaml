Core:
  Id: "FDA-SD1360"
  Status: "Published"
  Version: "1"
Description: "Raise an error when the Reason Arm and/or Actual Arm is Null (ARMNRS)\
  \ variable is populated while both Planned Arm Code (ARMCD) and Actual Arm Code\
  \ (ACTARMCD) are populated."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "DM"
Check:
  expression: >-
    not empty(ARMCD) and not empty(ACTARMCD) and not empty(ARMNRS)
Outcome:
  Message: "ARMNRS is populated when both ARMCD and ACTARMCD are populated."
  Output_Variables:
  - "ARMCD"
  - "ACTARMCD"
  - "ARMNRS"
Source:
  FDA_Validator_Rule_Message: "ARMNRS is populated but ARMCD and ACTARMCD are populated"
  FDA_Validator_Rule_Description: "The Reason Arm and/or Actual Arm is Null (ARMNRS)\
    \ variable should only be populated when Planned Arm Code (ARMCD) and Actual Arm\
    \ Code (ACTARMCD) are null."
  Domains: "DM"
Standards:
- Organization: "FDA"
  Standards:
  - Name: "SDTMIG"
    Version: "3.4"
    References:
    - Origin: "FDA Validator Rules"
      Rule_Identifier:
