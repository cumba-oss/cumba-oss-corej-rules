Core:
  Id: "FDA-SD0024"
  Status: "Published"
  Version: "1"
Description: "Raise an error when the End Date/Time of Observation (--ENDTC) is populated\
  \ but the Date/Time of Collection (--DTC) is empty or not present."
Executability: "Fully Executable"
Scope:
  Classes:
    Include:
    - "FINDINGS"
    - "FINDINGS ABOUT"
Requirements:
  Variables:
    All:
    - "--ENDTC"
Check:
  expression: >-
    not empty(--ENDTC) and empty(--DTC)
Outcome:
  Message: "--DTC is empty when --ENDTC is populated."
  Output_Variables:
  - "--DTC"
  - "--ENDTC"
Source:
  FDA_Validator_Rule_Message: "Missing value for --DTC, when --ENDTC is provided"
  FDA_Validator_Rule_Description: "Date/Time of Collection (--DTC) should not be NULL,\
    \ when End Date/Time of Observation (--ENDTC) is not NULL."
  Domains: "FINDINGS, FINDINGS ABOUT"
