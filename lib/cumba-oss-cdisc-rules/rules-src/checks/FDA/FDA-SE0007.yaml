Core:
  Id: "FDA-SE0007"
  Status: "Published"
  Version: "1"
Description: "Raise an error when the TX (Trial Sets) dataset is not present in the\
  \ study."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "ALL"
Check:
  expression: >-
    not ds_exists("TX")
Outcome:
  Message: "The TX (Trial Sets) dataset is not present in the study."
Source:
  FDA_Validator_Rule_Message: "Missing TX dataset"
  FDA_Validator_Rule_Description: "Trial Sets (TX) dataset should be included in every\
    \ submission."
  Domains: "TX"
