Core:
  Id: "FDA-SD2271"
  Status: "Published"
  Version: "1"
Description: "Raise an error when --STDY is present in the dataset but --STDTC is\
  \ not present."
Executability: "Fully Executable"
Scope:
  Classes:
    Include:
    - "INTERVENTIONS"
    - "SPECIAL PURPOSE"
    - "EVENTS"
    - "FINDINGS"
    - "FINDINGS ABOUT"
Check:
  expression: >-
    var_exists("--STDY") and not var_exists("--STDTC")
Outcome:
  Message: "--STDY is present in the dataset but --STDTC is not present."
  Output_Variables:
  - "--STDY"
Source:
  FDA_Validator_Rule_Message: "Missing --STDTC variable, when --STDY variable is present"
  FDA_Validator_Rule_Description: "Start Study Date/Time (--STDTC) variable should\
    \ be included into dataset, when Study Day of Start (--STDY) variable is present."
  Domains: "CO, DM, DR, SE, SM, SV, EVENTS, FINDINGS, FINDINGS ABOUT"
