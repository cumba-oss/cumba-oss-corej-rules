Core:
  Id: "FDA-SD1287"
  Status: "Published"
  Version: "1"
Description: "Raise an error when --DECOD does not have the same value across all\
  \ records that share the same value of --PTCD."
Executability: "Fully Executable"
Scope:
  Classes:
    Include:
    - "EVENTS"
Requirements:
  Variables:
    All:
    - "--DECOD"
Check:
  expression: >-
    var_exists("--PTCD") and not empty(--PTCD) and is_inconsistent_across_dataset(--DECOD,
    keys=[--PTCD])
Outcome:
  Message: "--DECOD is not consistent within a given --PTCD."
  Output_Variables:
  - "--DECOD"
  - "--PTCD"
Source:
  FDA_Validator_Rule_Message: "Inconsistent value for --DECOD within --PTCD"
  FDA_Validator_Rule_Description: "All values of Dictionary-Derived Term (--DECOD)\
    \ should be the same for a given value of Preferred Term Code (--PTCD)."
  Domains: "EVENTS"
