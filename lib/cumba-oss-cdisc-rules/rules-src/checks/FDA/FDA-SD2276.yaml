Core:
  Id: "FDA-SD2276"
  Status: "Published"
  Version: "1"
Description: "Raise an error when the Trial Summary (TS) dataset does not contain\
  \ a record where TSPARMCD equals 'PDPSTIND' (Pediatric Postmarket Study Indicator)."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "TS"
Operations:
- id: "$pdpstind_count"
  expression: "record_count(filter=filter(TSPARMCD=\"PDPSTIND\"))"
Check:
  expression: >-
    $pdpstind_count == 0
Outcome:
  Message: "Missing PDPSTIND Trial Summary Parameter: a 'Pediatric Postmarket Study\
    \ Indicator' (PDPSTIND) record must be present in the Trial Summary (TS) domain."
  Output_Variables:
  - "$pdpstind_count"
Source:
  FDA_Validator_Rule_Message: "Missing PDPSTIND Trial Summary Parameter"
  FDA_Validator_Rule_Description: "'Pediatric Postmarket Study Indicator' (PDPSTIND)\
    \ record must be populated in Trial Summary (TS) domain. It is an 'FDA Desired'\
    \ parameter listed in the Technical Conformance Guide (TCG)."
  Domains: "TS"
