Core:
  Id: "FDA-SE2208"
  Status: "Published"
  Version: "1"
Description: "Raise an error when the Trial Summary (TS) dataset does not contain\
  \ a record where TSPARMCD equals 'ROUTE' (Route of Administration)."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "TS"
Operations:
- id: "$route_count"
  expression: "record_count(filter=filter(TSPARMCD=\"ROUTE\"))"
Check:
  expression: >-
    $route_count == 0
Outcome:
  Message: "Missing ROUTE Trial Summary Parameter: a 'Route of Administration' (ROUTE)\
    \ record must be present in the Trial Summary (TS) domain."
  Output_Variables:
  - "$route_count"
Source:
  FDA_Validator_Rule_Message: "Missing ROUTE Trial Summary Parameter"
  FDA_Validator_Rule_Description: "'Route of Administration' (ROUTE) record should\
    \ be populated in Trial Summary (TS) domain."
  Domains: "TS"
