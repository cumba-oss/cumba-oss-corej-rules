Core:
  Id: "FDA-SD1436"
  Status: "Published"
  Version: "1"
Description: "Raise an error when the Challenge Agent Characterization (AC) dataset\
  \ contains a record where ACPARMCD equals 'CAGTCAT' and ACVAL equals 'RADIOLOGICAL/NUCLEAR',\
  \ but does not contain a record where ACPARMCD equals 'EORNINJR' (Exp Onset of Rad/Nuc\
  \ Targeted Injury)."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "AC"
Operations:
- id: "$cat_count"
  expression: "record_count(filter=filter(ACPARMCD=\"CAGTCAT\", ACVAL=\"RADIOLOGICAL/NUCLEAR\"\
    ))"
- id: "$parm_count"
  expression: "record_count(filter=filter(ACPARMCD=\"EORNINJR\"))"
Check:
  expression: >-
    $cat_count >= 1 and $parm_count < 1
Outcome:
  Message: "A 'Exp Onset of Rad/Nuc Targeted Injury' (EORNINJR) record is not present\
    \ in the AC domain when a record exists with ACPARMCD equal to 'CAGTCAT' and ACVAL\
    \ equal to 'RADIOLOGICAL/NUCLEAR'."
  Output_Variables:
  - "$cat_count"
  - "$parm_count"
Source:
  FDA_Validator_Rule_Message: "Missing EORNINJR Challenge Agent Parameter when ACPARMCD\
    \ = 'CAGTCAT' and ACVAL = 'RADIOLOGICAL/NUCLEAR'"
  FDA_Validator_Rule_Description: "'Exp Onset of Rad/Nuc Targeted Injury' (EORNINJR)\
    \ record is expected in the Challenge Agent Characterization (AC) domain when\
    \ the Parameter Value (ACVAL) for the 'Challenge Agent Category' (CAGTCAT) parameter\
    \ is 'RADIOLOGICAL/NUCLEAR'."
  Domains: "AC"
Standards:
- Organization: "FDA"
  Standards:
  - Name: "SENDIG-AR"
    Version: "1.0"
    References:
    - Origin: "FDA Validator Rules"
      Rule_Identifier:
        Id: "SD1436"
        Version: "1"
      Version: "1.6"
