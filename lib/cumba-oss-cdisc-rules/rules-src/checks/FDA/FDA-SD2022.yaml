Core:
  Id: "FDA-SD2022"
  Status: "Published"
  Version: "1"
Description: "Raise an error when Age Units (AGEU) is empty or not present while Age\
  \ (AGE) is populated or Age Range (AGETXT) is populated."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "DM"
Check:
  expression: >-
    (not empty(AGE) or not empty(AGETXT)) and empty(AGEU)
Outcome:
  Message: "AGEU is empty when AGE or AGETXT is populated."
  Output_Variables:
  - "AGE"
  - "AGETXT"
  - "AGEU"
Source:
  FDA_Validator_Rule_Message: "Missing value for AGEU, when AGE or AGETXT is populated"
  FDA_Validator_Rule_Description: "Age Units (AGEU) variable values should be provided,\
    \ when Age (AGE) or Age Range (AGETXT) variables values are populated."
  Domains: "DM"
