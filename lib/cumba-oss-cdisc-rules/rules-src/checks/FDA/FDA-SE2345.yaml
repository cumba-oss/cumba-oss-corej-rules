Core:
  Id: "FDA-SE2345"
  Status: "Published"
  Version: "1"
Description: "Raise an error when --VAL is populated with a value that is not a valid\
  \ ISO 8601 duration (time period, e.g. P80Y) for a record where --PARMCD equals\
  \ 'RECSAC' (Recovery Sacrifice Period). An empty --VAL is permitted. Applies to\
  \ the TS and TX domains (TSVAL/TSPARMCD and TXVAL/TXPARMCD)."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "TS"
    - "TX"
Requirements:
  Variables:
    All:
    - "--PARMCD"
Check:
  expression: >-
    --PARMCD == "RECSAC" and not empty(--VAL) and invalid_duration(--VAL, negative=false)
Outcome:
  Message: "Invalid --VAL value for RECSAC: --VAL must be in ISO 8601 duration format\
    \ (e.g., P80Y) or empty when --PARMCD equals 'RECSAC' (Recovery Sacrifice Period)."
  Output_Variables:
  - "--PARMCD"
  - "--VAL"
Source:
  FDA_Validator_Rule_Message: "Invalid --VAL value for RECSAC"
  FDA_Validator_Rule_Description: "TSVAL/TXVAL value must be either ISO 8601 format\
    \ for time period (e.g. P80Y) or null, when TSPARMCD/TXPARMCD='RECSAC'."
  Domains: "TS, TX"
