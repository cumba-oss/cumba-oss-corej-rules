Core:
  Id: "FDA-SD1111"
  Status: "Published"
  Version: "1"
Description: "Raise an error when the SE (Subject Elements) dataset is not present\
  \ in the study."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "ALL"
Check:
  expression: >-
    not ds_exists("SE")
Outcome:
  Message: "The SE (Subject Elements) dataset is not present in the study."
Source:
  FDA_Validator_Rule_Message: "Missing SE dataset"
  FDA_Validator_Rule_Description: "Subject Elements (SE) dataset should be included\
    \ in every submission."
  Domains: "SE"
