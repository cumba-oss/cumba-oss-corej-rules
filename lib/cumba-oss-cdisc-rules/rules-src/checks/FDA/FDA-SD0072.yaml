Core:
  Id: "FDA-SD0072"
  Status: "Published"
  Version: "1"
Description: "Raise an error when Related Domain Abbreviation (RDOMAIN) is populated\
  \ but does not represent a domain present in the study data."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "CO"
    - "RELREC"
    - "SUPP--"
    - "SQ--"
Operations:
- id: "$study_domains"
  expression: "study_domains()"
Check:
  expression: >-
    not empty(RDOMAIN) and RDOMAIN not in $study_domains
Outcome:
  Message: "RDOMAIN does not represent a domain present in the study."
  Output_Variables:
  - "RDOMAIN"
  - "$study_domains"
Source:
  FDA_Validator_Rule_Message: "Invalid RDOMAIN"
  FDA_Validator_Rule_Description: "Related Domain Abbreviation (RDOMAIN) must have\
    \ a valid value of Domains included in the study data."
  Domains: "CO, RELREC, SUPPQUAL"
