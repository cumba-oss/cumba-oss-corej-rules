Core:
  Id: "FDA-SD1107"
  Status: "Published"
  Version: "1"
Description: "Raise an error when the LB (Laboratory Test Results) dataset is not\
  \ present in the study."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "ALL"
Check:
  expression: >-
    not ds_exists("LB")
Outcome:
  Message: "The LB (Laboratory Test Results) dataset is not present in the study."
Source:
  FDA_Validator_Rule_Message: "Missing LB dataset"
  FDA_Validator_Rule_Description: "Lab Test Results (LB) dataset should be included\
    \ in every submission."
  Domains: "LB"
