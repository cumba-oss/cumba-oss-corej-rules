Core:
  Id: "FDA-SD1391"
  Status: "Published"
  Version: "1"
Description: "Raise an error when Start Day of Obs Rel to Challenge Agent (--CHSTDY)\
  \ is populated but the date portion of Start Date/Time of Observation (--STDTC)\
  \ or of Date/Time of First Challenge Agent Admin (RFCSTDTC) is not a complete date,\
  \ i.e. empty, invalid, or only partially specified, indicating the study day value\
  \ was imputed."
Executability: "Fully Executable"
Scope:
  Classes:
    Include:
    - "INTERVENTIONS"
    - "EVENTS"
    - "FINDINGS"
    - "FINDINGS ABOUT"
Requirements:
  Variables:
    All:
    - "--CHSTDY"
    - "--STDTC"
Match_Datasets:
- Keys:
  - "USUBJID"
  Name: "DM"
Check:
  expression: >-
    not empty(--CHSTDY) and (not is_complete_date_part(--STDTC) or not
    is_complete_date_part(DM.RFCSTDTC))
Outcome:
  Message: "Start Day of Obs Rel to Challenge Agent (--CHSTDY) is populated but --STDTC\
    \ and/or RFCSTDTC is empty or an incomplete date; the value appears imputed."
  Output_Variables:
  - "--STDTC"
  - "--CHSTDY"
  - "DM.RFCSTDTC"
Source:
  FDA_Validator_Rule_Message: "--CHSTDY variable value is imputed"
  FDA_Validator_Rule_Description: "Start Day of Obs Rel to Challenge Agent (--CHSTDY)\
    \ variable value should not be imputed. It may only be populated, when both Start\
    \ Date/Time of Observation (--STDTC) and Date/Time of First Challenge Agent Admin\
    \ (RFCSTDTC) variables values are provided and both of them include complete date\
    \ parts."
  Domains: "INTERVENTIONS, FINDINGS, EVENTS, FINDINGS ABOUT"
Standards:
- Organization: "FDA"
  Standards:
  - Name: "SENDIG-AR"
    Version: "1.0"
    References:
    - Origin: "FDA Validator Rules"
      Rule_Identifier:
        Id: "SD1391"
        Version: "1"
      Version: "1.6"
