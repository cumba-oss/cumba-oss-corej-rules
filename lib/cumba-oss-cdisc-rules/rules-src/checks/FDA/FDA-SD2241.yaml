Core:
  Id: "FDA-SD2241"
  Status: "Published"
  Version: "1"
Description: "Raise an error when TSVCDREF is not equal to 'UNII' for a record where\
  \ TSPARMCD equals 'CURTRT' (Current Treatment)."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "TS"
Requirements:
  Variables:
    All:
    - "TSPARMCD"
    - "TSVCDREF"
Check:
  expression: >-
    TSPARMCD == "CURTRT" and TSVCDREF != "UNII"
Outcome:
  Message: "Invalid TSVCDREF value for CURTRT: TSVCDREF must equal 'UNII' when TSPARMCD\
    \ equals 'CURTRT'."
  Output_Variables:
  - "TSPARMCD"
  - "TSVCDREF"
Source:
  FDA_Validator_Rule_Message: "Invalid TSVCDREF value for CURTRT"
  FDA_Validator_Rule_Description: "TSVCDREF variable value must be 'UNII', when TSPARMCD='CURTRT'."
  Domains: "TS"
