Core:
  Id: "FDA-SD0090"
  Status: "Published"
  Version: "1"
Description: "Raise an error when AEOUT is equal to 'FATAL' but AESDTH is not equal\
  \ to 'Y'."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "AE"
Requirements:
  Variables:
    All:
    - "AEOUT"
    - "AESDTH"
Check:
  expression: >-
    AEOUT == "FATAL" and AESDTH != "Y"
Outcome:
  Message: "AESDTH does not equal 'Y' when AEOUT equals 'FATAL'."
  Output_Variables:
  - "AEOUT"
  - "AESDTH"
Source:
  FDA_Validator_Rule_Message: "AESDTH is not 'Y', when AEOUT='FATAL'"
  FDA_Validator_Rule_Description: "Results in Death (AESDTH) should equal 'Y', when\
    \ Outcome of Adverse Event (AEOUT)  is 'FATAL'."
  Domains: "AE"
