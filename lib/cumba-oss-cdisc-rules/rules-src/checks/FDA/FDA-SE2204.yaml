Core:
  Id: "FDA-SE2204"
  Status: "Published"
  Version: "1"
Description: "Raise an error when the Trial Summary (TS) dataset does not contain\
  \ a record where TSPARMCD equals 'DOSDUR' (Dosing Duration)."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "TS"
Operations:
- id: "$dosdur_count"
  expression: "record_count(filter=filter(TSPARMCD=\"DOSDUR\"))"
Check:
  expression: >-
    $dosdur_count == 0
Outcome:
  Message: "Missing DOSDUR Trial Summary Parameter: a 'Dosing Duration' (DOSDUR) record\
    \ must be present in the Trial Summary (TS) domain."
  Output_Variables:
  - "$dosdur_count"
Source:
  FDA_Validator_Rule_Message: "Missing DOSDUR Trial Summary Parameter"
  FDA_Validator_Rule_Description: "'Dosing Duration' (DOSDUR) record should be populated\
    \ in Trial Summary (TS) domain."
  Domains: "TS"
Standards:
- Organization: "FDA"
  Standards:
