Core:
  Id: "FDA-SD1230"
  Status: "Published"
  Version: "1"
Description: "Raise an error when a populated value does not conform to the data type\
  \ declared for the applicable value-level condition (Define-XML ValueListDef / WhereClauseDef)."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "ALL"
Check:
  expression: >-
    not empty(value()) and vlm_type_conforms(variable_name) == false
Outcome:
  Message: "The value does not conform to the value-level data type declared in the\
    \ Define-XML."
  Output_Variables:
  - "variable_name"
  - "variable_value"
Source:
  FDA_Validator_Rule_Message: "Variable datatype is not %Variable.@Clause.DataType%\
    \ when value-level condition occurs"
  FDA_Validator_Rule_Description: "Value level datatype must match the datatype described\
    \ in define.xml."
  Domains: "ALL"
