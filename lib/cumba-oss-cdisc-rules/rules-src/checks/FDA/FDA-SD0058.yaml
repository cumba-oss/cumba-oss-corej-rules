Core:
  Id: "FDA-SD0058"
  Status: "Published"
  Version: "1"
Description: "Raise an error when a variable present in a dataset is not listed in\
  \ the SDTM model list of allowed variables for the observation class."
Executability: "Partially Executable - Possible Underreporting"
Scope:
  Domains:
    Include:
    - "ALL"
Operations:
- id: "$allowed_variables"
  expression: "get_model_column_order()"
Check:
  expression: >-
    varname() not in $allowed_variables
Outcome:
  Message: "Variable is present in the dataset but is not listed in the SDTM model\
    \ list of allowed variables for the observation class."
  Output_Variables:
  - "variable_name"
  - "$allowed_variables"
Source:
  FDA_Validator_Rule_Message: "Variable appears in dataset, but is not in SDTM model"
  FDA_Validator_Rule_Description: "Only variables listed in SDTM model should appear\
    \ in a dataset. New sponsor defined variables must not be added, and existing\
    \ variables must not be renamed or modified."
  Domains: "ALL"
