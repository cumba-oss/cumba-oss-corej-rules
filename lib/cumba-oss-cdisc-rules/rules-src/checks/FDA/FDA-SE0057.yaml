Core:
  Id: "FDA-SE0057"
  Status: "Published"
  Version: "1"
Description: "Raise an error when a variable described as Expected in the SEND IG\
  \ is not present in the dataset."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "ALL"
Operations:
- id: "$expected_variables"
  expression: "expected_variables()"
- id: "$dataset_variables"
  expression: "get_column_order_from_dataset()"
- id: "$missing_expected_variables"
  expression: "minus($expected_variables, subtract=$dataset_variables)"
Check:
  expression: >-
    not contains_all($dataset_variables, $expected_variables)
Outcome:
  Message: "Expected variable is not present in the dataset."
  Output_Variables:
  - "$missing_expected_variables"
Source:
  FDA_Validator_Rule_Message: "SEND Expected variable not found"
  FDA_Validator_Rule_Description: "Variables described in SEND IG as Expected should\
    \ be included in the dataset."
  Domains: "ALL"
Standards:
- Organization: "FDA"
  Standards:
  - Name: "SENDIG"
    Version: "3.1.1"
    References:
    - Origin: "FDA Validator Rules"
      Rule_Identifier:
        Id: "SE0057"
        Version: "1"
      Version: "1.6"
  - Name: "SENDIG"
    Version: "3.1"
    References:
    - Origin: "FDA Validator Rules"
      Rule_Identifier:
        Id: "SE0057"
        Version: "1"
      Version: "1.6"
  - Name: "SENDIG"
    Version: "3.0"
    References:
    - Origin: "FDA Validator Rules"
      Rule_Identifier:
        Id: "SE0057"
        Version: "1"
      Version: "1.6"
  - Name: "SENDIG-AR"
    Version: "1.0"
    References:
    - Origin: "FDA Validator Rules"
      Rule_Identifier:
        Id: "SE0057"
        Version: "1"
      Version: "1.6"
  - Name: "SENDIG-DART"
    Version: "1.1"
    References:
    - Origin: "FDA Validator Rules"
      Rule_Identifier:
        Id: "SE0057"
        Version: "1"
      Version: "1.6"
