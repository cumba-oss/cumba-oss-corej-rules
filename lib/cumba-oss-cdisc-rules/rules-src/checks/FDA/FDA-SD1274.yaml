Core:
  Id: "FDA-SD1274"
  Status: "Published"
  Version: "1"
Description: "Raise an error when --TERM is equal to 'OTHER'."
Executability: "Fully Executable"
Scope:
  Classes:
    Include:
    - "EVENTS"
Requirements:
  Variables:
    All:
    - "--TERM"
Check:
  expression: >-
    --TERM == "OTHER"
Outcome:
  Message: "--TERM is equal to 'OTHER'."
  Output_Variables:
  - "--TERM"
Source:
  FDA_Validator_Rule_Message: "--TERM equals 'OTHER'"
  FDA_Validator_Rule_Description: "Reported Term variables (--TERM) should not be\
    \ populated with values of 'OTHER'."
  Domains: "EVENTS"
