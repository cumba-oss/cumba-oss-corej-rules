Core:
  Id: "FDA-SE2317"
  Status: "Published"
  Version: "1"
Description: "Raise an error when TXPARMCD is not unique within a SETCD in the Trial\
  \ Sets (TX) domain."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "TX"
Check:
  expression: >-
    not empty(TXPARMCD) and not is_unique_set([TXPARMCD, SETCD])
Outcome:
  Message: "TXPARMCD is not unique within SETCD in the Trial Sets (TX) domain."
  Output_Variables:
  - "SETCD"
  - "TXPARMCD"
Source:
  FDA_Validator_Rule_Message: "Duplicate TXPARMCD within a SETCD"
  FDA_Validator_Rule_Description: "The value of Parameter Code (TXPARMCD) variable\
    \ must be unique for each Trial Set (SETCD) within the Trial Sets (TX) domain."
  Domains: "TX"
