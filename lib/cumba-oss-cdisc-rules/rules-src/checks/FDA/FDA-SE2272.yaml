Core:
  Id: "FDA-SE2272"
  Status: "Published"
  Version: "1"
Description: "Raise an error when the Trial Summary (TS) dataset contains more than\
  \ one record where TSPARMCD equals 'SDESIGN' (Study Design)."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "TS"
Operations:
- id: "$sdesign_count"
  expression: "record_count(filter=filter(TSPARMCD=\"SDESIGN\"))"
Check:
  expression: >-
    $sdesign_count > 1
Outcome:
  Message: "Multiple SDESIGN records: the Trial Summary (TS) domain must contain only\
    \ one record for the 'SDESIGN' (Study Design) parameter."
  Output_Variables:
  - "$sdesign_count"
Source:
  FDA_Validator_Rule_Message: "Multiple SDESIGN records"
  FDA_Validator_Rule_Description: "Trial Summary (TS) domain must contain only one\
    \ record for the 'SDESIGN' parameter."
  Domains: "TS"
