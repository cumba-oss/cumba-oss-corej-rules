Core:
  Id: "FDA-SD2237"
  Status: "Published"
  Version: "1"
Description: "Raise an error when both Description of Planned Arm (ARM) and Description\
  \ of Actual Arm (ACTARM) are populated but ACTARM does not equal ARM."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "DM"
Requirements:
  Variables:
    All:
    - "ACTARM"
    - "ARM"
Check:
  expression: >-
    not empty(ARM) and not empty(ACTARM) and ACTARM != ARM
Outcome:
  Message: "ACTARM does not equal ARM"
  Output_Variables:
  - "ARM"
  - "ACTARM"
Source:
  FDA_Validator_Rule_Message: "ACTARM does not equal ARM"
  FDA_Validator_Rule_Description: "A value for an Actual Arm (ACTARM) variable is\
    \ expected to be equal to a value of an Arm (ARM) variable."
  Domains: "DM"
