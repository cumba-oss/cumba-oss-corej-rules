Core:
  Id: "FDA-SE2348"
  Status: "Published"
  Version: "1"
Description: "Raise an error when TXSEQ is not unique within the Trial Sets (TX) dataset."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "TX"
Check:
  expression: >-
    not is_unique_set([TXSEQ, STUDYID])
Outcome:
  Message: "TXSEQ is not unique within the Trial Sets (TX) dataset."
  Output_Variables:
  - "STUDYID"
Source:
  FDA_Validator_Rule_Message: "Non-unique value for TXSEQ variable within TX domain"
  FDA_Validator_Rule_Description: "Sequence Number (TXSEQ) should be unique within\
    \ the entire Trial Sets (TX) dataset because there is no Unique Subject Identifier\
    \ (USUBJID) variable."
  Domains: "TX"
Standards:
- Organization: "FDA"
