Core:
  Id: "FDA-SD0084"
  Status: "Published"
  Version: "1"
Description: "Raise an error when the value of Age (AGE) is less than or equal to\
  \ 0."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "DM"
Requirements:
  Variables:
    All:
    - "AGE"
Check:
  expression: >-
    not empty(AGE) and AGE <= 0
Outcome:
  Message: "AGE has a negative or zero value."
  Output_Variables:
  - "AGE"
Source:
  FDA_Validator_Rule_Message: "Negative or zero value for AGE"
  FDA_Validator_Rule_Description: "The value of Age (AGE) cannot be less than or equal\
    \ to 0."
  Domains: "DM"
