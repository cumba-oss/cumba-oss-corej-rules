Core:
  Id: "FDA-SD1298"
  Status: "Published"
  Version: "1"
Description: "Raise an error when LBTOXGR is populated but does not contain only a\
  \ numeric (integer) value."
Executability: "Partially Executable - Possible Overreporting"
Scope:
  Domains:
    Include:
    - "LB"
Requirements:
  Variables:
    All:
    - "LBTOXGR"
Check:
  expression: >-
    not empty(LBTOXGR) and LBTOXGR !~ /^[0-9]+$/
Outcome:
  Message: "LBTOXGR is not a numeric value when a numeric scale is used."
  Output_Variables:
  - "LBTOXGR"
Source:
  FDA_Validator_Rule_Message: "LBTOXGR is not a numeric value when a numeric scale\
    \ is used."
  FDA_Validator_Rule_Description: "When a numeric scale is used (Grade 1, Grade 2,\
    \ etc.), LBTOXGR should only contain the number."
  Domains: "LB"
