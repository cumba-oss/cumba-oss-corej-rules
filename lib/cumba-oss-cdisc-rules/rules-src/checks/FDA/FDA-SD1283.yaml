Core:
  Id: "FDA-SD1283"
  Status: "Published"
  Version: "1"
Description: "Raise an error when --LOC is not present but --LAT is present."
Executability: "Fully Executable"
Scope:
  Classes:
    Include:
    - "EVENTS"
    - "INTERVENTIONS"
    - "FINDINGS"
    - "FINDINGS ABOUT"
Check:
  expression: >-
    not var_exists("--LOC") and var_exists("--LAT")
Outcome:
  Message: "--LAT is present when --LOC is not present."
  Output_Variables:
  - "--LAT"
Source:
  FDA_Validator_Rule_Message: "--LAT variable is present when --LOC variable is missing"
  FDA_Validator_Rule_Description: "Laterality (--LAT) variable should not be present\
    \ in the domain, when the Location (--LOC) variable is missing."
  Domains: "INTERVENTIONS, FINDINGS, FINDINGS ABOUT, EVENTS"
