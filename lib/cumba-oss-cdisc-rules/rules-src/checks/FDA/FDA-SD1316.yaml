Core:
  Id: "FDA-SD1316"
  Status: "Published"
  Version: "1"
Description: "Raise an error when a subject has a Death record (SSSTRESC equals 'DEAD')\
  \ in the Survival Status (SS) dataset but no Disposition (DS) record for that subject\
  \ has Standardized Disposition Term (DSDECOD) equal to 'DEATH'."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "SS"
Requirements:
  Variables:
    All:
    - "SSSTRESC"
Grouping:
  Variables:
  - "USUBJID"
Operations:
- id: "$ds_death_usubjid"
  expression: "distinct(USUBJID, domain=\"DS\", filter=filter(DSDECOD=\"DEATH\"))"
Check:
  expression: >-
    SSSTRESC == "DEAD" and USUBJID not in $ds_death_usubjid
Outcome:
  Message: "SSSTRESC equals 'DEAD' but no Disposition record has DSDECOD equal to\
    \ 'DEATH'."
  Output_Variables:
  - "SSSTRESC"
  - "$ds_death_usubjid"
Source:
  FDA_Validator_Rule_Message: "Missing 'DEATH' record for subject in DS domain"
  FDA_Validator_Rule_Description: "All subjects who have Death records (SSSTRESC =\
    \ 'DEAD') in Survival Status (SS) domain should also have death records (DSDECOD='DEATH')\
    \ in Disposition (DS) domain."
  Domains: "SS"
Standards:
- Organization: "FDA"
  Standards:
  - Name: "SDTMIG"
    Version: "3.4"
    References:
