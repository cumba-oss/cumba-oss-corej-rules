Core:
  Id: "FDA-SD1121-A"
  Status: "Published"
  Version: "1"
Description: "Raise an error when neither Age (AGE) nor Age Range (AGETXT) is provided:\
  \ AGE is missing and AGETXT is empty or not present in the dataset."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "DM"
Requirements:
  Variables:
    All:
    - "AGE"
Check:
  expression: >-
    empty(AGE) and empty(AGETXT)
Outcome:
  Message: "Neither AGE nor AGETXT is populated (AGE is missing and AGETXT is empty\
    \ or not present)."
  Output_Variables:
  - "AGE"
  - "AGETXT"
Source_Proposed:
  FDA_Validator_Rule_Message: "Neither AGE nor AGETXT is populated (AGE is missing\
    \ and AGETXT is empty or not present)."
  FDA_Validator_Rule_Description: "Neither Age (AGE) nor Age Range (AGETXT) is provided:\
    \ AGE is missing and AGETXT is empty or not present in the dataset."
  Domains: "DM"
Source:
  FDA_Validator_Rule_Message: "Neither AGE nor AGETXT values are populated"
  FDA_Validator_Rule_Description: "Value for Age (AGE) or Age Range (AGETXT) variables\
    \ should be populated for all subjects. The only exception for SDTM is for Screen\
    \ Failures (ARMCD=SCRNFAIL) and Not Assigned (ARMCD=NOTASSGN) subjects, or subjects\
    \ with ARMCD=null.  There are no exceptions for SEND."
  Domains: "DM"
