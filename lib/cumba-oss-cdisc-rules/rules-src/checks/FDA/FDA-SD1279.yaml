Core:
  Id: "FDA-SD1279"
  Status: "Published"
  Version: "1"
Description: "Raise an error when ECDOSE is missing, ECOCCUR is not equal to 'N',\
  \ ECSTAT is empty, and ECDOSTXT is empty or not present."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "EC"
Check:
  expression: >-
    empty(ECDOSE) and (not var_exists("ECOCCUR") or ECOCCUR != "N") and empty(ECSTAT) and
    empty(ECDOSTXT)
Outcome:
  Message: "ECDOSTXT is empty or not present when ECDOSE is missing, ECOCCUR does\
    \ not equal 'N' and ECSTAT is empty."
  Output_Variables:
  - "ECOCCUR"
  - "ECDOSE"
  - "ECDOSTXT"
  - "ECSTAT"
Source:
  FDA_Validator_Rule_Message: "ECDOSTXT is null when ECDOSE is null and ECOCCUR does\
    \ not equal 'N'"
  FDA_Validator_Rule_Description: "Dose Description (ECDOSTXT) should be populated\
    \ when Dose (ECDOSE) is null, ECOCCUR does not equal 'N', and ECSTAT does not\
    \ equal 'NOT DONE'."
  Domains: "EC"
