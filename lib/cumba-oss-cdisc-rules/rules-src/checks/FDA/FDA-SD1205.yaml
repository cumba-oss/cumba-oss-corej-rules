Core:
  Id: "FDA-SD1205"
  Status: "Published"
  Version: "1"
Description: "Raise an error when EXSTDTC is populated and is before DM.RFXSTDTC (Date/Time\
  \ of First Study Treatment)."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "EX"
Match_Datasets:
- Keys:
  - "USUBJID"
  Name: "DM"
Check:
  expression: >-
    not empty(EXSTDTC) and date(EXSTDTC) < DM.RFXSTDTC
Outcome:
  Message: "EXSTDTC is before DM.RFXSTDTC (Date/Time of First Study Treatment)."
  Output_Variables:
  - "EXSTDTC"
  - "DM.RFXSTDTC"
Source:
  FDA_Validator_Rule_Message: "EXSTDTC date is before RFXSTDTC"
  FDA_Validator_Rule_Description: "Start Date/Time of Treatment (EXSTDTC) variable\
    \ value must be greater than or equal to Date/Time of First Study Treatment (RFXSTDTC)."
  Domains: "EX"
