Core:
  Id: "FDA-SD1071"
  Status: "Published"
  Version: "1"
Description: "Raise an error when a dataset is greater than 5 gigabytes (GB) in size."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "ALL"
Operations:
- id: "$dataset_size"
  expression: "extract_metadata(\"dataset_size\")"
Check:
  expression: >-
    $dataset_size > 5368709120
Outcome:
  Message: "The dataset is greater than 5 GB in size."
  Output_Variables:
  - "$dataset_size"
Source:
  FDA_Validator_Rule_Message: "Dataset is greater than 5 GB in size"
  FDA_Validator_Rule_Description: "Datasets greater than 5 gigabytes (GB) in size\
    \ should be split into smaller datasets no larger than 5 GB."
  Domains: "ALL"
