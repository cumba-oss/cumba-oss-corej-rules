Core:
  Id: "FDA-SD1110"
  Status: "Published"
  Version: "1"
Description: "Raise an error when the DS (Disposition) dataset is not present in the\
  \ study."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "ALL"
Check:
  expression: >-
    not ds_exists("DS")
Outcome:
  Message: "The DS (Disposition) dataset is not present in the study."
Source:
  FDA_Validator_Rule_Message: "Missing DS dataset"
  FDA_Validator_Rule_Description: "Disposition (DS) dataset should be included in\
    \ every submission."
  Domains: "DS"
