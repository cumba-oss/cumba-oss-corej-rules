Core:
  Id: "FDA-SD1128"
  Status: "Published"
  Version: "1"
Description: "Raise an error when RELTYPE is populated in the RELREC dataset but is\
  \ not equal to 'ONE' or 'MANY'."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "RELREC"
Requirements:
  Variables:
    All:
    - "RELTYPE"
Check:
  expression: >-
    not empty(RELTYPE) and RELTYPE not in ["ONE", "MANY"]
Outcome:
  Message: "RELTYPE is not 'ONE' or 'MANY'."
  Output_Variables:
  - "RELTYPE"
Source:
  FDA_Validator_Rule_Message: "Invalid value for RELTYPE variable"
  FDA_Validator_Rule_Description: "Relationship Type (RELTYPE)  variable values should\
    \ be populated with terms 'ONE', 'MANY', when Related Records (RELREC) dataset\
    \ is used to identify relationships between datasets."
  Domains: "RELREC"
