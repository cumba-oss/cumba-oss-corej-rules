Core:
  Id: "FDA-SD1020"
  Status: "Published"
  Version: "1"
Description: "Raise an error when the DM (Demographics) dataset is not present in\
  \ the study."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "ALL"
Check:
  expression: >-
    not ds_exists("DM")
Outcome:
  Message: "The DM (Demographics) dataset is not present in the study."
Source:
  FDA_Validator_Rule_Message: "Missing DM dataset"
  FDA_Validator_Rule_Description: "Demographics (DM) dataset must be included in every\
    \ submission."
  Domains: "DM"
