Core:
  Id: "FDA-SD1345"
  Status: "Published"
  Version: "1"
Description: "Raise an error when a Medication Class (--CLAS) value is not a valid\
  \ ATC text term in the WHODrug dictionary."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "CM"
Requirements:
  Variables:
    All:
    - "--CLAS"
Operations:
- id: "$clas_valid"
  expression: "valid_external_dictionary_value(--CLAS, external_dictionary_type=\"\
    whodrug\", dictionary_term_type=\"ATC\")"
Check:
  expression: >-
    $clas_valid == false
Outcome:
  Message: "Medication Class (--CLAS) is not a valid ATC text term in the WHODrug\
    \ dictionary."
  Output_Variables:
  - "--CLAS"
Source:
  FDA_Validator_Rule_Message: "Value for --CLAS not found in WHODrug dictionary"
  FDA_Validator_Rule_Description: "Value for the Medication Class (--CLAS) variable\
    \ must be populated using ATC Text from the WHO Drug dictionary version specified\
    \ in the define.xml."
  Domains: "CM"
