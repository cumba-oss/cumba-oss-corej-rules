Core:
  Id: "FDA-SD2235"
  Status: "Published"
  Version: "1"
Description: "Raise an error when the Trial Summary (TS) dataset does not contain\
  \ a record where TSPARMCD equals 'HLTSUBJI' (Healthy Subject Indicator)."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "TS"
Operations:
- id: "$hltsubji_count"
  expression: "record_count(filter=filter(TSPARMCD=\"HLTSUBJI\"))"
Check:
  expression: >-
    $hltsubji_count == 0
Outcome:
  Message: "Missing HLTSUBJI Trial Summary Parameter: a 'Healthy Subject Indicator'\
    \ (HLTSUBJI) record must be present in the Trial Summary (TS) domain."
  Output_Variables:
  - "$hltsubji_count"
Source:
  FDA_Validator_Rule_Message: "Missing HLTSUBJI Trial Summary Parameter"
  FDA_Validator_Rule_Description: "'Healthy Subject Indicator' (HLTSUBJI) record must\
    \ be populated in Trial Summary (TS) domain. It is expected for SDTM IG v3.1.2\
    \ data and required for data in all more recent SDTM versions."
  Domains: "TS"
Standards:
