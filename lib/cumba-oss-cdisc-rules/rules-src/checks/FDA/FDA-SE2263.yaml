Core:
  Id: "FDA-SE2263"
  Status: "Published"
  Version: "1"
Description: "Raise an error when a TPSTGORD (Order of Repro Stage within Repro Path)\
  \ value is repeated for a given RPATHCD (Planned Repro Path Code) in the Trial Repro\
  \ Paths (TP) dataset; each TPSTGORD must be unique within a RPATHCD."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "TP"
Requirements:
  Variables:
    All:
    - "TPSTGORD"
Check:
  expression: >-
    not is_unique_set([TPSTGORD, RPATHCD])
Outcome:
  Message: "A TPSTGORD value is repeated (not unique) within a given RPATHCD; each\
    \ order must be unique within a RPATHCD."
  Output_Variables:
  - "RPATHCD"
  - "TPSTGORD"
Source:
  FDA_Validator_Rule_Message: "Non-unique value for TPSTGORD within RPATHCD"
  FDA_Validator_Rule_Description: "Order of Repro Stage within Repro Path (TPSTGORD)\
    \ must have a unique value for a given value of Planned Repro Path Code (RPATHCD)\
    \ within the Trial Repro Paths (TP) dataset."
  Domains: "TP"
Standards:
- Organization: "FDA"
  Standards:
  - Name: "SENDIG-DART"
    Version: "1.1"
    References:
    - Origin: "FDA Validator Rules"
      Rule_Identifier:
        Id: "SE2263"
        Version: "1"
      Version: "1.6"
