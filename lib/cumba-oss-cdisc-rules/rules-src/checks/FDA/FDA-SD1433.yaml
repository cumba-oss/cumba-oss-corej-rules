Core:
  Id: "FDA-SD1433"
  Status: "Published"
  Version: "1"
Description: "Raise an error when the Challenge Agent Characterization (AC) dataset\
  \ contains a record where ACPARMCD equals 'CAGTCAT' and ACVAL equals 'RADIOLOGICAL/NUCLEAR',\
  \ but does not contain a record where ACPARMCD equals 'BIRRMDL' (Body Irradiation\
  \ Model)."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "AC"
Operations:
- id: "$cat_count"
  expression: "record_count(filter=filter(ACPARMCD=\"CAGTCAT\", ACVAL=\"RADIOLOGICAL/NUCLEAR\"\
    ))"
- id: "$parm_count"
  expression: "record_count(filter=filter(ACPARMCD=\"BIRRMDL\"))"
Check:
  expression: >-
    $cat_count >= 1 and $parm_count < 1
Outcome:
  Message: "A 'Body Irradiation Model' (BIRRMDL) record is not present in the AC domain\
    \ when a record exists with ACPARMCD equal to 'CAGTCAT' and ACVAL equal to 'RADIOLOGICAL/NUCLEAR'."
  Output_Variables:
  - "$cat_count"
  - "$parm_count"
Source:
  FDA_Validator_Rule_Message: "Missing BIRRMDL Challenge Agent Parameter when ACPARMCD\
    \ = 'CAGTCAT' and ACVAL = 'RADIOLOGICAL/NUCLEAR'"
  FDA_Validator_Rule_Description: "'Body Irradiation Model' (BIRRMDL) record is expected\
    \ in the Challenge Agent Characterization (AC) domain when the Parameter Value\
    \ (ACVAL) for the 'Challenge Agent Category' (CAGTCAT) parameter is 'RADIOLOGICAL/NUCLEAR'."
  Domains: "AC"
Standards:
- Organization: "FDA"
  Standards:
  - Name: "SENDIG-AR"
    Version: "1.0"
    References:
    - Origin: "FDA Validator Rules"
      Rule_Identifier:
        Id: "SD1433"
        Version: "1"
      Version: "1.6"
