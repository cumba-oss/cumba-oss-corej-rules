Core:
  Id: "FDA-SD0023"
  Status: "Published"
  Version: "1"
Description: "Raise an error when Reason Not Done (--REASND) is populated but Completion\
  \ Status (--STAT) is not set to 'NOT DONE'."
Executability: "Fully Executable"
Scope:
  Classes:
    Include:
    - "INTERVENTIONS"
    - "FINDINGS"
    - "EVENTS"
    - "FINDINGS ABOUT"
Requirements:
  Variables:
    All:
    - "--REASND"
    - "--STAT"
Check:
  expression: >-
    not empty(--REASND) and --STAT != "NOT DONE"
Outcome:
  Message: "--STAT is not set to 'NOT DONE' when --REASND is provided."
  Output_Variables:
  - "--STAT"
  - "!--REASND"
Source:
  FDA_Validator_Rule_Message: "Missing value for --STAT, when --REASND is provided"
  FDA_Validator_Rule_Description: "Completion Status (--STAT) should be set to 'NOT\
    \ DONE', when Reason Not Done (--REASND) is populated."
  Domains: "INTERVENTIONS, EVENTS, FINDINGS, FINDINGS ABOUT"
