Core:
  Id: "FDA-SD1299"
  Status: "Published"
  Version: "1"
Description: "Raise an error when a dataset based on the Interventions, Events or\
  \ Findings general observation classes does not contain at least one Timing variable."
Executability: "Partially Executable - Possible Underreporting"
Scope:
  Classes:
    Include:
    - "INTERVENTIONS"
    - "EVENTS"
    - "FINDINGS"
    - "FINDINGS ABOUT"
  Domains:
    Exclude:
    - "IE"
    - "SC"
Operations:
- id: "$dataset_variables"
  expression: "get_column_order_from_dataset()"
- id: "$timing_variables"
  expression: "get_model_filtered_variables(key_name=\"role\", key_value=\"Timing\"\
    )"
Check:
  expression: >-
    not shares_elements_with($dataset_variables, $timing_variables)
Outcome:
  Message: "No timing variables are present in the dataset."
  Output_Variables:
  - "$dataset_variables"
  - "$timing_variables"
Source:
  FDA_Validator_Rule_Message: "No timing variables are present in dataset"
  FDA_Validator_Rule_Description: "All domains based on the general observation classes\
    \ (Interventions, Events, Findings) should have at least one Timing variable present."
  Domains: "INTERVENTIONS, EVENTS, FINDINGS, FINDINGS ABOUT, NOT(IE, SC)"
