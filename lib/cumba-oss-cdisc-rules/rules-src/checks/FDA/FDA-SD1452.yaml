Core:
  Id: "FDA-SD1452"
  Status: "Published"
  Version: "1"
Description: "Raise an error when a non-missing Treatment Vehicle Amount (--VAMT)\
  \ value is negative (less than 0)."
Executability: "Fully Executable"
Scope:
  Classes:
    Include:
    - "INTERVENTIONS"
Requirements:
  Variables:
    All:
    - "--VAMT"
Check:
  expression: >-
    not empty(--VAMT) and --VAMT < 0
Outcome:
  Message: "Negative value for --VAMT"
  Output_Variables:
  - "--VAMT"
Source:
  FDA_Validator_Rule_Message: "Negative value for --VAMT"
  FDA_Validator_Rule_Description: "Non-missing Treatment Vehicle Amount (--VAMT) value\
    \ must be greater than or equal to 0."
  Domains: "INTERVENTIONS"
