Core:
  Id: "FDA-SD0088"
  Status: "Published"
  Version: "1"
Description: "Raise an error when RFENDTC is empty for a randomized subject, i.e.\
  \ one whose Planned Arm Code (ARMCD) is populated and not equal to 'SCRNFAIL' or\
  \ 'NOTASSGN'."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "DM"
Requirements:
  Variables:
    All:
    - "ARMCD"
Check:
  expression: >-
    not empty(ARMCD) and ARMCD not in ["SCRNFAIL", "NOTASSGN"] and empty(RFENDTC)
Outcome:
  Message: "RFENDTC is empty for a randomized subject."
  Output_Variables:
  - "RFENDTC"
  - "ARMCD"
Source:
  FDA_Validator_Rule_Message: "RFENDTC is not provided for a randomized subject"
  FDA_Validator_Rule_Description: "Subject Reference End Date/Time (RFENDTC) should\
    \ be populated for all randomized subjects, those where Planned Arm Code (ARMCD)\
    \ is not equal to 'SCRNFAIL' or 'NOTASSGN' or null."
  Domains: "DM"
