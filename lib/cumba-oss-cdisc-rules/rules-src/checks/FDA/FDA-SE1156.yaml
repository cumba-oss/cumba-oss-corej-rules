Core:
  Id: "FDA-SE1156"
  Status: "Published"
  Version: "1"
Description: "Raise an error when the AC (Challenge Agent Characterization) dataset\
  \ is not present in the study."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "ALL"
Check:
  expression: >-
    not ds_exists("AC")
Outcome:
  Message: "The AC (Challenge Agent Characterization) dataset is not present in the\
    \ study."
Source:
  FDA_Validator_Rule_Message: "Missing AC dataset"
  FDA_Validator_Rule_Description: "Challenge Agent Characterization (AC) dataset should\
    \ be included in every Animal Rule study submission."
  Domains: "AC"
Standards:
- Organization: "FDA"
  Standards:
  - Name: "SENDIG-AR"
    Version: "1.0"
    References:
    - Origin: "FDA Validator Rules"
      Rule_Identifier:
        Id: "SE1156"
        Version: "1"
      Version: "1.6"
