Core:
  Id: "FDA-SD1083"
  Status: "Published"
  Version: "1"
Description: "Raise an error when --DTC is present in the dataset but --DY is not\
  \ present."
Executability: "Fully Executable"
Scope:
  Classes:
    Include:
    - "INTERVENTIONS"
    - "SPECIAL PURPOSE"
    - "EVENTS"
    - "FINDINGS"
    - "FINDINGS ABOUT"
Check:
  expression: >-
    var_exists("--DTC") and not var_exists("--DY")
Outcome:
  Message: "--DY variable is not present in the dataset, but --DTC variable is present."
  Output_Variables:
  - "--DTC"
Source:
  FDA_Validator_Rule_Message: "Missing --DY variable, when --DTC variable is present"
  FDA_Validator_Rule_Description: "Collection Study Day (--DY) variable should be\
    \ included into dataset, when Collection Study Date/Time (--DTC) variable is present."
  Domains: "CO, DI, DM, DR, SE, SM, SV, INTERVENTIONS, EVENTS, FINDINGS, FINDINGS\
    \ ABOUT"
