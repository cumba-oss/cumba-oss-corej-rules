Core:
  Id: "FDA-SD1215"
  Status: "Published"
  Version: "1"
Description: "Raise an error when TSPARMCD is equal to 'AGEMAX' but TSVAL is not empty\
  \ and TSVAL is not in ISO 8601 format for a time period (e.g. P80Y)."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "TS"
Requirements:
  Variables:
    All:
    - "TSPARMCD"
Check:
  expression: >-
    TSPARMCD == "AGEMAX" and not empty(TSVAL) and invalid_duration(TSVAL, negative=false)
Outcome:
  Message: "Invalid TSVAL value when TSPARMCD equals 'AGEMAX'; TSVAL must be in ISO\
    \ 8601 format for a time period (e.g. P80Y) or empty."
  Output_Variables:
  - "TSPARMCD"
  - "TSVAL"
Source:
  FDA_Validator_Rule_Message: "Invalid TSVAL value for AGEMAX"
  FDA_Validator_Rule_Description: "TSVAL value must be either ISO 8601 format for\
    \ time period (e.g. P80Y) or null, when TSPARMCD='AGEMAX'."
  Domains: "TS"
