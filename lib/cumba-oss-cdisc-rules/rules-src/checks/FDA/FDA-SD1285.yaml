Core:
  Id: "FDA-SD1285"
  Status: "Published"
  Version: "1"
Description: "Raise an error when --LOC is not present but --DIR is present."
Executability: "Fully Executable"
Scope:
  Classes:
    Include:
    - "INTERVENTIONS"
    - "FINDINGS"
    - "FINDINGS ABOUT"
Check:
  expression: >-
    not var_exists("--LOC") and var_exists("--DIR")
Outcome:
  Message: "--DIR is present when --LOC is not present."
  Output_Variables:
  - "--DIR"
Source:
  FDA_Validator_Rule_Message: "--DIR variable is present when --LOC variable is missing"
  FDA_Validator_Rule_Description: "Directionality (--DIR) variable should not be present\
    \ in the domain, when the Location (--LOC) variable is missing."
  Domains: "INTERVENTIONS, FINDINGS, FINDINGS ABOUT"
