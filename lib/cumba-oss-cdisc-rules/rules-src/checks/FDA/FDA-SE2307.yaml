Core:
  Id: "FDA-SE2307"
  Status: "Published"
  Version: "1"
Description: "Raise an error when --DY or --ENDY is missing or not present; both required\
  \ timing variables must be populated."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "BG"
    - "FW"
Check:
  expression: >-
    empty(--DY) or empty(--ENDY)
Outcome:
  Message: "--DY or --ENDY is missing or not present; both required timing variables\
    \ must be populated."
  Output_Variables:
  - "--DY"
  - "--ENDY"
Source:
  FDA_Validator_Rule_Message: "Missing values for all required timing variables: --DY\
    \ & --ENDY"
  FDA_Validator_Rule_Description: "These variables must be populated:  --DY and --ENDY.\
    \  These are the required timing variables for identification of the day on which\
    \ group summaries (Group Means and Incidences) are calculated for data associated\
    \ with a time interval."
  Domains: "BG, FW"
