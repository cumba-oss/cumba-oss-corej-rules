Core:
  Id: "FDA-SD1104"
  Status: "Published"
  Version: "1"
Description: "Raise an error when Start Reference Time Point (--STTPT) is present\
  \ in the dataset but Start Relative to Reference Time Point (--STRTPT) is not present\
  \ in the dataset."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "ALL"
Check:
  expression: >-
    var_exists("--STTPT") and not var_exists("--STRTPT")
Outcome:
  Message: "--STRTPT variable is not present when --STTPT variable is present."
  Output_Variables:
  - "--STTPT"
Source:
  FDA_Validator_Rule_Message: "Missing --STRTPT variable, when --STTPT variable is\
    \ present"
  FDA_Validator_Rule_Description: "Start Relative to Reference Time Point (--STRTPT)\
    \ variable must be included into the domain, when Start Relative Time Point (--STTPT)\
    \ variable is present."
  Domains: "SE, SM, SV, INTERVENTIONS, EVENTS, FINDINGS, FINDINGS ABOUT"
