Core:
  Id: "FDA-SD0080"
  Status: "Published"
  Version: "1"
Description: "Raise an error when the Adverse Event start date (AESTDTC) is after\
  \ the subject's latest Disposition start date (DSSTDTC) in the DS dataset."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "AE"
Operations:
- id: "$max_ds_dsstdtc"
  expression: "max_date(DSSTDTC, domain=\"DS\", group=[USUBJID])"
Check:
  expression: >-
    not empty(AESTDTC) and date(AESTDTC) > $max_ds_dsstdtc
Outcome:
  Message: "AESTDTC is after the latest Disposition (DS) start date (DSSTDTC) for\
    \ the subject."
  Output_Variables:
  - "AESTDTC"
  - "$max_ds_dsstdtc"
Source:
  FDA_Validator_Rule_Message: "AE start date is after the latest Disposition date"
  FDA_Validator_Rule_Description: "Start Date/Time of Adverse Event (AESTDTC) should\
    \ be less than or equal to the Start Date/Time of the latest Disposition Event\
    \ (DSSTDTC)."
  Domains: "AE"
