Core:
  Id: "FDA-SD1410"
  Status: "Published"
  Version: "1"
Description: "Raise an error when the Challenge Agent Characterization (AC) dataset\
  \ does not contain a record where ACPARMCD equals 'MCSCTIND' (Multiple Challenge\
  \ Agent Same Cat Ind)."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "AC"
Operations:
- id: "$parm_count"
  expression: "record_count(filter=filter(ACPARMCD=\"MCSCTIND\"))"
Check:
  expression: >-
    $parm_count < 1
Outcome:
  Message: "A 'Multiple Challenge Agent Same Cat Ind' (MCSCTIND) record is not present\
    \ in the AC domain."
  Output_Variables:
  - "$parm_count"
Source:
  FDA_Validator_Rule_Message: "Missing MCSCTIND Challenge Agent Parameter"
  FDA_Validator_Rule_Description: "'Multiple Challenge Agent Same Cat Ind' (MCSCTIND)\
    \ record must be populated in Challenge Agent Characterization (AC) domain."
  Domains: "AC"
Standards:
- Organization: "FDA"
  Standards:
  - Name: "SENDIG-AR"
    Version: "1.0"
    References:
    - Origin: "FDA Validator Rules"
      Rule_Identifier:
        Id: "SD1410"
        Version: "1"
      Version: "1.6"
