Core:
  Id: "FDA-SD1144"
  Status: "Published"
  Version: "1"
Description: "Raise an error when MHSTDTC is populated and is the same as or later\
  \ than RFSTDTC in the DM dataset. Medical history events should start before the\
  \ Subject Reference Start Date/Time (RFSTDTC)."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "MH"
Requirements:
  Variables:
    All:
    - "MHSTDTC"
Match_Datasets:
- Keys:
  - "USUBJID"
  Name: "DM"
Check:
  expression: >-
    not empty(MHSTDTC) and date(MHSTDTC) >= DM.RFSTDTC
Outcome:
  Message: "MHSTDTC is populated and is the same as or later than RFSTDTC in the DM\
    \ dataset."
  Output_Variables:
  - "MHSTDTC"
  - "DM.RFSTDTC"
Source:
  FDA_Validator_Rule_Message: "MHSTDTC date is after RFSTDTC"
  FDA_Validator_Rule_Description: "The medical history dataset includes the subject's\
    \ prior history at the start of the trial. Start Date/Time of Medical History\
    \ Event (MHSTDTC) should be before Subject Reference Start Date/Time (RFSTDTC)."
  Domains: "MH"
