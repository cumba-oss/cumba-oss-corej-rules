Core:
  Id: "FDA-SD1069"
  Status: "Published"
  Version: "1"
Description: "Raise an error when the value of --PARM is not the same across all records\
  \ that share the same value of --PARMCD."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "DI"
    - "TS"
    - "TX"
Requirements:
  Variables:
    All:
    - "--PARM"
Check:
  expression: >-
    var_exists("--PARMCD") and is_inconsistent_across_dataset(--PARM, keys=[--PARMCD])
Outcome:
  Message: "Value of --PARM is not consistent for a given value of --PARMCD."
  Output_Variables:
  - "--PARMCD"
  - "--PARM"
Source:
  FDA_Validator_Rule_Message: "Inconsistent value for --PARM within --PARMCD"
  FDA_Validator_Rule_Description: "All values of a Parameter (--PARM) variables should\
    \ be the same for a given value of a Parameter Short Name (--PARMCD) variables."
  Domains: "DI, TS, TX"
