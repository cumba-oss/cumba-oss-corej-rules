Core:
  Id: "FDA-SD1235"
  Status: "Published"
  Version: "1"
Description: "Raise an error when neither SPDEVID nor USUBJID is populated for a DU\
  \ record; at least one of SPDEVID or USUBJID must be populated for all DU records."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "DU"
Check:
  expression: >-
    empty(SPDEVID) and empty(USUBJID)
Outcome:
  Message: "Neither SPDEVID nor USUBJID is populated."
  Output_Variables:
  - "SPDEVID"
Source:
  FDA_Validator_Rule_Message: "Neither SPDEVID nor USUBJID values are populated"
  FDA_Validator_Rule_Description: "Value for Sponsor Device Identifier (SPDEVID) or\
    \ Unique Subject Identifier (USUBJID) variables should be populated for all records\
    \ in Divice In-Use (DU) domain"
  Domains: "DU"
