Core:
  Id: "FDA-SE2352"
  Status: "Published"
  Version: "1"
Description: "Raise an error when EXLOT is populated but EXDOSE is equal to zero or\
  \ is missing (the treatment was not administered)."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "EX"
Check:
  expression: >-
    (var_exists("EXDOSE") and EXDOSE == 0 or empty(EXDOSE)) and not empty(EXLOT)
Outcome:
  Message: "EXLOT is populated when EXDOSE is equal to zero or is missing."
  Output_Variables:
  - "EXDOSE"
  - "EXLOT"
Source:
  FDA_Validator_Rule_Message: "EXLOT is populated, when EXDOSE equals 0 or is NULL"
  FDA_Validator_Rule_Description: "If Name of Actual Treatment (EXTRT) is not administered,\
    \ (i.e., Dose per Administration (EXDOSE) is equal to zero or is not provided),\
    \ then Lot Number  (EXLOT) should be null."
  Domains: "INTERVENTIONS"
Standards:
- Organization: "FDA"
  Standards:
  - Name: "SENDIG"
    Version: "3.1.1"
    References:
    - Origin: "FDA Validator Rules"
      Rule_Identifier:
        Id: "SE2352"
        Version: "1"
      Version: "1.6"
