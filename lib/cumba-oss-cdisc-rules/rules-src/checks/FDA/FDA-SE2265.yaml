Core:
  Id: "FDA-SE2265"
  Status: "Published"
  Version: "1"
Description: "Raise an error when Date/Time of Collection (--DTC) is before the Start\
  \ Date/Time of the subject's latest Disposition (DSSTDTC). Applies to the post-mortem\
  \ Findings domains Death Diagnosis (DD) and Organ Measurements (OM), whose records\
  \ are collected post mortem and therefore on or after the disposition date."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "DD"
    - "OM"
Operations:
- id: "$max_ds_dsstdtc"
  expression: "max_date(DSSTDTC, domain=\"DS\", group=[USUBJID])"
Check:
  expression: >-
    not empty(--DTC) and date(--DTC) < $max_ds_dsstdtc
Outcome:
  Message: "--DTC is before the Start Date/Time of the subject's latest Disposition\
    \ (DSSTDTC)."
  Output_Variables:
  - "--DTC"
  - "$max_ds_dsstdtc"
Source:
  FDA_Validator_Rule_Message: "--DTC is before the latest Disposition date"
  FDA_Validator_Rule_Description: "Date/Time of Collection (--DTC) variable value\
    \ must be greater than or equal to Start Date/Time of latest Disposition (DSSTDTC)\
    \ for post-mortem Findings domains: Death Diagnosis and Details (DD), Macroscopic\
    \ Findings (MA), Microscopic Findings (MI), Organ Measurements (OM), Tumor Findings\
    \ (TF)."
  Domains: "DD, OM"
Standards:
- Organization: "FDA"
  Standards:
