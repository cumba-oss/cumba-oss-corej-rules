Core:
  Id: "FDA-SD2012C"
  Status: "Published"
  Version: "1"
Description: "Raise an error when a High Level Group Term (--HLGT) value does not\
  \ match the case of its MedDRA High Level Group Term."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "AE"
    - "CE"
    - "MH"
Requirements:
  Variables:
    All:
    - "--HLGT"
Operations:
- id: "$hlgt_case_valid"
  expression: "valid_external_dictionary_value(--HLGT, external_dictionary_type=\"\
    meddra\", dictionary_term_type=\"HLGT\", case_sensitive=true)"
Check:
  expression: >-
    $hlgt_case_valid == false
Outcome:
  Message: "High Level Group Term (--HLGT) does not match the MedDRA High Level Group\
    \ Term case."
  Output_Variables:
  - "--HLGT"
Source:
  FDA_Validator_Rule_Message: "Value for --HLGT is in incorrect case"
  FDA_Validator_Rule_Description: "Case for High Level Group Term (--HLGT) variable\
    \ must be sentence case using a High Level Group Term of the MedDRA dictionary\
    \ of a version specified in the define.xml (Case-sensitive)."
  Domains: "AE, CE, MH"
