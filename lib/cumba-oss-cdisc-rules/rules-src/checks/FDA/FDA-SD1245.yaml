Core:
  Id: "FDA-SD1245"
  Status: "Published"
  Version: "1"
Description: "Raise an error when the Time Point Reference (--TPTREF) variable is\
  \ not present in the dataset while the Date/Time of Reference Point (--RFTDTC) variable\
  \ is present."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "ALL"
Check:
  expression: >-
    var_exists("--RFTDTC") and not var_exists("--TPTREF")
Outcome:
  Message: "--RFTDTC variable is present, but --TPTREF variable is not present."
  Output_Variables:
  - "--RFTDTC"
Source:
  FDA_Validator_Rule_Message: "Missing --TPTREF variable, when --RFTDTC variable is\
    \ present"
  FDA_Validator_Rule_Description: "Time Point Reference (--TPTREF) variable must be\
    \ included into the domain, when Date/Time of Reference Point (--RFTDTC) variable\
    \ is present."
  Domains: "ALL"
