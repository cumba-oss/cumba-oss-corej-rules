Core:
  Id: "FDA-SE1155"
  Status: "Published"
  Version: "1"
Description: "Raise an error when the AG (Procedure Agents) dataset is not present\
  \ in the study."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "ALL"
Check:
  expression: >-
    not ds_exists("AG")
Outcome:
  Message: "The AG (Procedure Agents) dataset is not present in the study."
Source:
  FDA_Validator_Rule_Message: "Missing AG dataset"
  FDA_Validator_Rule_Description: "Procedure Agents (AG) dataset should be included\
    \ in every Animal Rule study submission."
  Domains: "AG"
Standards:
- Organization: "FDA"
  Standards:
  - Name: "SENDIG-AR"
    Version: "1.0"
    References:
    - Origin: "FDA Validator Rules"
      Rule_Identifier:
        Id: "SE1155"
        Version: "1"
      Version: "1.6"
