Core:
  Id: "FDA-SD9705"
  Status: "Published"
  Version: "1"
Description: "Raise an error when --TEST is not populated."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "BG"
    - "BS"
    - "BW"
    - "CL"
    - "CP"
    - "CV"
    - "DA"
    - "DD"
    - "EG"
    - "FA"
    - "FM"
