    - "SC"
    - "SR"
    - "SS"
    - "TF"
    - "TR"
    - "TU"
    - "UR"
    - "VS"
Requirements:
  Variables:
    All:
    - "--TEST"
Check:
  expression: >-
    empty(--TEST)
Outcome:
  Message: "--TEST is not populated."
  Output_Variables:
  - "--TEST"
Source_Proposed:
  FDA_Validator_Rule_Message: "Missing value for --TEST"
  FDA_Validator_Rule_Description: "--TEST should be populated."
  Domains: "BG, BS, BW, CL, CP, CV, DA, DD, EG, FA, FM, FT, FW, FX, GF, IC, IE, IS,\
    \ LB, MA, MB, MI, MK, MO, MS, NV, OE, OM, PC, PE, PM, PP, PY, QS, RE, RP, RS,\
    \ SC, SR, SS, TF, TR, TU, UR, VS"
Source:
  FDA_Validator_Rule_Message: "NULL value in variable marked as Required"
  FDA_Validator_Rule_Description: "Required variables (where Core attribute is 'Req')\
    \ cannot be NULL for any records."
  Domains: "ALL"
