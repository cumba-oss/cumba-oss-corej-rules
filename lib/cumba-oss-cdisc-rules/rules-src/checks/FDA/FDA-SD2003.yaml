Core:
  Id: "FDA-SD2003"
  Status: "Published"
  Version: "1"
Description: "Raise an error when Description of Actual Arm (ACTARM) is populated\
  \ and its value does not match an Arm (ARM) entry in the Trial Arms (TA) dataset.\
  \ Subjects who failed screening ('Screen Failure'), were not assigned to an Arm\
  \ ('Not Assigned'), were randomized but not treated ('Not Treated'), or received\
  \ non-planned treatment ('Unplanned Treatment') are expected exceptions and are\
  \ excluded from the check."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "DM"
Requirements:
  Variables:
    All:
    - "ACTARM"
Operations:
- id: "$ta_arm"
  expression: "distinct(ARM, domain=\"TA\")"
Check:
  expression: >-
    not empty(ACTARM) and ACTARM not in $ta_arm and ACTARM not in ["Screen Failure", "Not Assigned",
    "Not Treated", "Unplanned Treatment"]
Outcome:
  Message: "ACTARM is not among the values of ARM in the TA dataset."
  Output_Variables:
  - "ACTARM"
  - "$ta_arm"
Source:
  FDA_Validator_Rule_Message: "Invalid value for ACTARM"
  FDA_Validator_Rule_Description: "Description of Actual Arm (ACTARM) values should\
    \ match entries in the Trial Arms (TA) dataset, except for subjects who failed\
    \ screening ('Screen Failure'), or were not fully assigned to an Arm ('Not Assigned'),\
    \ or randomized, but not treated ('Not Treated') or received non-planned treatment\
    \ ('Unplanned Treatment')."
  Domains: "DM"
