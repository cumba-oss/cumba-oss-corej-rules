Core:
  Id: "FDA-SD1099"
  Status: "Published"
  Version: "1"
Description: "Raise an error when --SCAT is present in a dataset, but --CAT is not\
  \ present."
Executability: "Fully Executable"
Scope:
  Classes:
    Include:
    - "INTERVENTIONS"
    - "EVENTS"
    - "FINDINGS"
    - "FINDINGS ABOUT"
Check:
  expression: >-
    var_exists("--SCAT") and not var_exists("--CAT")
Outcome:
  Message: "--CAT variable is not present when --SCAT variable is present."
  Output_Variables:
  - "--SCAT"
Source:
  FDA_Validator_Rule_Message: "Missing --CAT variable, when --SCAT variable is present"
  FDA_Validator_Rule_Description: "Category (--CAT) variable should be included into\
    \ dataset, when Subcategory (--SCAT) variable is present."
  Domains: "INTERVENTIONS, EVENTS, FINDINGS, FINDINGS ABOUT"
