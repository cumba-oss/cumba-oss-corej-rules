Core:
  Id: "FDA-SD1060"
  Status: "Published"
  Version: "1"
Description: "Raise an error when the value of Visit Number (VISITNUM) is not unique\
  \ for a record within a subject."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "SV"
Check:
  expression: >-
    not is_unique_set([VISITNUM, USUBJID])
Outcome:
  Message: "VISITNUM is not unique within subject."
  Output_Variables:
  - "VISITNUM"
Source:
  FDA_Validator_Rule_Message: "Duplicate VISITNUM"
  FDA_Validator_Rule_Description: "The value of Visit Number (VISITNUM) variable should\
    \ be unique for each record within a subject."
  Domains: "SV"
