Core:
  Id: "FDA-SD1108"
  Status: "Published"
  Version: "1"
Description: "Raise an error when the VS (Vital Signs) dataset is not present in the\
  \ study."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "ALL"
Check:
  expression: >-
    not ds_exists("VS")
Outcome:
  Message: "The VS (Vital Signs) dataset is not present in the study."
Source:
  FDA_Validator_Rule_Message: "Missing VS dataset"
  FDA_Validator_Rule_Description: "Vital Signs (VS) dataset should be included in\
    \ every submission."
  Domains: "VS"
