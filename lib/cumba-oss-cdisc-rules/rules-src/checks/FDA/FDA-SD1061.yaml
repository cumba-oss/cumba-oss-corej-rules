Core:
  Id: "FDA-SD1061"
  Status: "Published"
  Version: "1"
Description: "Raise an error when a Microbiology Specimen (MB) dataset is not present\
  \ while a Microbiology Susceptibility Test (MS) dataset is present."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "MS"
Check:
  expression: >-
    ds_exists("MS") and not ds_exists("MB")
Outcome:
  Message: "The MB dataset is not present when the MS dataset is present."
Source:
  FDA_Validator_Rule_Message: "Missing MB dataset, when MS dataset is present"
  FDA_Validator_Rule_Description: "Microbiology Specimen (MB) dataset should be included,\
    \ when a Microbiology Susceptibility Test (MS) dataset is present."
  Domains: "MB"
