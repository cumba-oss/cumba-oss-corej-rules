Core:
  Id: "FDA-SD9703"
  Status: "Published"
  Version: "1"
Description: "Raise an error when --PARMCD is not populated."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "TS"
    - "TX"
Requirements:
  Variables:
    All:
    - "--PARMCD"
Check:
  expression: >-
    empty(--PARMCD)
Outcome:
  Message: "--PARMCD is not populated."
  Output_Variables:
  - "--PARMCD"
Source_Proposed:
  FDA_Validator_Rule_Message: "Missing value for --PARMCD"
  FDA_Validator_Rule_Description: "--PARMCD should be populated."
  Domains: "TS, TX"
Source:
  FDA_Validator_Rule_Message: "NULL value in variable marked as Required"
  FDA_Validator_Rule_Description: "Required variables (where Core attribute is 'Req')\
    \ cannot be NULL for any records."
  Domains: "ALL"
