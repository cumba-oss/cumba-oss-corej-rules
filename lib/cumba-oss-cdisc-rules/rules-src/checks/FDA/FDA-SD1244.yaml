Core:
  Id: "FDA-SD1244"
  Status: "Published"
  Version: "1"
Description: "Raise an error when the Planned Time Point Name (--TPT) variable is\
  \ not present in the dataset while the Planned Time Point Number (--TPTNUM) variable\
  \ is present."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "ALL"
Check:
  expression: >-
    var_exists("--TPTNUM") and not var_exists("--TPT")
Outcome:
  Message: "--TPT variable is not present when --TPTNUM variable is present."
  Output_Variables:
  - "--TPTNUM"
Source:
  FDA_Validator_Rule_Message: "Missing --TPT variable, when --TPTNUM variable is present"
  FDA_Validator_Rule_Description: "Planned Time Point Name (--TPT) variable must be\
    \ included into the domain, when Planned Time Point Number (--TPTNUM) variable\
    \ is present."
  Domains: "ALL"
