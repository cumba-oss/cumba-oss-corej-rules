Core:
  Id: "FDA-SD1078"
  Status: "Published"
  Version: "1"
Description: "Raise an error when a Permissible variable is present in the dataset\
  \ but empty for all records."
Executability: "Partially Executable - Possible Underreporting"
Scope:
  Domains:
    Include:
    - "ALL"
Operations:
- id: "$permissible_variables"
  expression: "get_dataset_filtered_variables(key_name=\"core\", key_value=\"Perm\"\
    )"
Check:
  expression: >-
    varname() in $permissible_variables and var_is_null(varname())
Outcome:
  Message: "A Permissible variable is present in the dataset but empty for all records."
  Output_Variables:
  - "variable_name"
Source:
  FDA_Validator_Rule_Message: "Permissible variable with missing value for all records"
  FDA_Validator_Rule_Description: "Permissible variable should not be present in domain,\
    \ when the variable has missing value for all records in the dataset."
  Domains: "ALL"
