Core:
  Id: "FDA-SD1293"
  Status: "Published"
  Version: "1"
Description: "Raise an error when --REASND is present but --PRESP is not present."
Executability: "Fully Executable"
Scope:
  Classes:
    Include:
    - "EVENTS"
    - "INTERVENTIONS"
  Domains:
    Exclude:
    - "DS"
    - "DV"
    - "EX"
Check:
  expression: >-
    not var_exists("--PRESP") and var_exists("--REASND")
Outcome:
  Message: "--REASND is present when --PRESP is not present."
  Output_Variables:
  - "--REASND"
Source:
  FDA_Validator_Rule_Message: "--REASND variable is present when --PRESP variable\
    \ is missing"
  FDA_Validator_Rule_Description: "Reason Not Done (--REASND) variable should not\
    \ be present in the domain, when the Pre-specified (--PRESP) variable is missing."
  Domains: "INTERVENTIONS, EVENTS, NOT(DS, DV, EX)"
