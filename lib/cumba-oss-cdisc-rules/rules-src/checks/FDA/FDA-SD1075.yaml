Core:
  Id: "FDA-SD1075"
  Status: "Published"
  Version: "1"
Description: "Raise an error when --STDTC is present in a Findings general observation\
  \ class dataset, where its use is not recommended."
Executability: "Fully Executable"
Scope:
  Classes:
    Include:
    - "FINDINGS"
Check:
  expression: >-
    var_exists("--STDTC")
Outcome:
  Message: "--STDTC is present in a Findings general observation class dataset, where\
    \ its use is not recommended."
  Output_Variables:
  - "--STDTC"
Source:
  FDA_Validator_Rule_Message: "Variable not recommended for use"
  FDA_Validator_Rule_Description: "Variables described in IG as not recommended for\
    \ usage should be not included in the dataset."
  Domains: "ALL"
