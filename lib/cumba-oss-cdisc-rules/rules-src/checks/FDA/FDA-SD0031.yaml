Core:
  Id: "FDA-SD0031"
  Status: "Published"
  Version: "1"
Description: "Raise an error when an end timepoint (--ENDTC, --ENRF or --ENRTPT) is\
  \ populated but none of the related start timepoints (--STDTC, --STRF or --STRTPT)\
  \ is populated."
Executability: "Fully Executable"
Scope:
  Classes:
    Include:
    - "INTERVENTIONS"
    - "EVENTS"
    - "SPECIAL PURPOSE"
  Domains:
    Exclude:
    - "CO"
    - "DM"
Check:
  expression: >-
    (var_exists("--ENDTC") and not empty(--ENDTC) or var_exists("--ENRF") and not empty(--ENRF) or
    var_exists("--ENRTPT") and not empty(--ENRTPT)) and empty(--STDTC) and empty(--STRF) and
    empty(--STRTPT)
Outcome:
  Message: "An end timepoint is populated but no start timepoint is populated."
  Output_Variables:
  - "--STDTC"
  - "--ENDTC"
  - "--STRF"
  - "--ENRF"
  - "--STRTPT"
  - "--ENRTPT"
Source:
  FDA_Validator_Rule_Message: "Missing values for --STDTC, --STRF and --STRTPT, when\
    \ --ENDTC, --ENRF or --ENRTPT is provided"
  FDA_Validator_Rule_Description: "Start Date/Time of Observation (--STDTC), Start\
    \ Relative to Reference Period (--STRF) or Start Relative to Reference Time Point\
    \ (--STRTPT) should not be NULL, when End Date/Time of Observation (--ENDTC),\
    \ End Relative to Reference Period (--ENRF) or End Relative to Reference Time\
    \ Period (--ENRTPT) is not NULL."
  Domains: "SE, SM, SV, INTERVENTIONS, EVENTS"
