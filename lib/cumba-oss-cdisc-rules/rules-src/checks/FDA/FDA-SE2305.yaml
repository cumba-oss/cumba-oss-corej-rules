Core:
  Id: "FDA-SE2305"
  Status: "Published"
  Version: "1"
Description: "Raise an error when none of the timing variables VISITDY, DSSTDY, or\
  \ DSNOMDY is present and populated for a record in the Disposition (DS) domain."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "DS"
Check:
  expression: >-
    empty(VISITDY) and empty(DSSTDY) and empty(DSNOMDY)
Outcome:
  Message: "None of VISITDY, DSSTDY, or DSNOMDY is populated; at least one of these\
    \ timing variables must be present and populated."
  Output_Variables:
  - "VISITDY"
  - "DSSTDY"
  - "DSNOMDY"
Source:
  FDA_Validator_Rule_Message: "Missing values for all required set(s) of timing variables:\
    \ VISITDY, --STDY, or --NOMDY"
  FDA_Validator_Rule_Description: "At least one of these variables or sets of variables\
    \ must be present and populated in DS: (VISITDY, DSSTDY, or DSNOMDY)  These are\
    \ the required timing variables for identification of the day on which group summaries\
    \ (Group Means and Incidences) are calculated for post mortem data."
  Domains: "DS"
