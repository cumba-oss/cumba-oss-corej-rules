Core:
  Id: "FDA-SD1450"
  Status: "Published"
  Version: "1"
Description: "Raise an error when the Planned Start of Assessment Interval (--STINT)\
  \ variable is present in the dataset but the Planned End of Assessment Interval\
  \ (--ENINT) variable is not present."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "CV"
    - "EG"
    - "PP"
    - "RE"
Check:
  expression: >-
    var_exists("--STINT") and not var_exists("--ENINT")
Outcome:
  Message: "--STINT variable is present, but --ENINT variable is not present."
  Output_Variables:
  - "--STINT"
Source:
  FDA_Validator_Rule_Message: "Missing --ENINT variable, when --STINT variable is\
    \ present"
  FDA_Validator_Rule_Description: "Planned End of Assessment Interval (--ENINT) variable\
    \ must be included in the domain, when Planned Start of Assessment Interval (--STINT)\
    \ variable is present."
  Domains: "CV, EG, PP, RE"
