Core:
  Id: "FDA-SD1150"
  Status: "Published"
  Version: "1"
Description: "Raise an error when IETEST is present and IETESTCD is present and IETEST\
  \ does not have the same value across records with the same value of IETESTCD."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "TI"
Requirements:
  Variables:
    All:
    - "IETEST"
Check:
  expression: >-
    var_exists("IETESTCD") and is_inconsistent_across_dataset(IETEST, keys=[IETESTCD])
Outcome:
  Message: "Inconsistent value for IETEST within IETESTCD"
  Output_Variables:
  - "IETESTCD"
  - "IETEST"
Source:
  FDA_Validator_Rule_Message: "Inconsistent value for IETEST within IETESTCD"
  FDA_Validator_Rule_Description: "All values of Inclusion/Exclusion Criterion (IETEST)\
    \ should be the same for a given value of Inclusion/Exclusion Criterion Short\
    \ Name (IETESTCD)."
  Domains: "TI"
