Core:
  Id: "FDA-SD2282"
  Status: "Published"
  Version: "1"
Description: "Raise an error when the Trial Summary (TS) dataset does not contain\
  \ a record where TSPARMCD equals 'THERAREA' (Therapeutic Area)."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "TS"
Operations:
- id: "$therarea_count"
  expression: "record_count(filter=filter(TSPARMCD=\"THERAREA\"))"
Check:
  expression: >-
    $therarea_count == 0
Outcome:
  Message: "Missing THERAREA Trial Summary Parameter: a 'Therapeutic Area' (THERAREA)\
    \ record must be present in the Trial Summary (TS) domain."
  Output_Variables:
  - "$therarea_count"
Source:
  FDA_Validator_Rule_Message: "Missing THERAREA Trial Summary Parameter"
  FDA_Validator_Rule_Description: "'Therapeutic Area' (THERAREA) record must be populated\
    \ in Trial Summary (TS) domain. It is an 'FDA Desired' parameter listed in the\
    \ Technical Conformance Guide (TCG)."
  Domains: "TS"
