Core:
  Id: "FDA-SD0041"
  Status: "Published"
  Version: "1"
Description: "Raise an error when --OCCUR is populated for an unsolicited record,\
  \ that is a record where --PRESP is not present or is not equal to 'Y'."
Executability: "Fully Executable"
Scope:
  Classes:
    Include:
    - "EVENTS"
    - "INTERVENTIONS"
Requirements:
  Variables:
    All:
    - "--OCCUR"
Check:
  expression: >-
    not empty(--OCCUR) and (not var_exists("--PRESP") or --PRESP != "Y")
Outcome:
  Message: "Value for --OCCUR is populated for unsolicited Intervention or Event"
  Output_Variables:
  - "--PRESP"
  - "--OCCUR"
Source:
  FDA_Validator_Rule_Message: "Value for --OCCUR is populated for unsolicited Intervention\
    \ or Event"
  FDA_Validator_Rule_Description: "Occurrence (--OCCUR) may only be populated, when\
    \ a given Intervention or Event has been pre-specified (--PRESP = 'Y')."
  Domains: "INTERVENTIONS, EVENTS"
