Core:
  Id: "PMDA-AD0096B"
  Status: "Published"
  Version: "1"
Description: "Raise an error when, considering only rows on which both variables are\
  \ populated, the character Actual Treatment (TRTA) does not have a single consistent\
  \ value for each unique value of the numeric Actual Treatment (TRTAN); within a\
  \ study each populated TRTAN value must map to one TRTA value."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "ALL"
Check:
  expression: >-
    not empty(TRTA) and not empty(TRTAN) and is_inconsistent_across_dataset(TRTA, keys=[TRTAN])
Outcome:
  Message: "TRTA has inconsistent values for the same TRTAN."
  Output_Variables:
  - "TRTA"
  - "TRTAN"
Source:
  Message: "Inconsistent value for TRTA"
  Description: "Within a study, all TRTA values must be the same for each unique value\
    \ of TRTAN when the primary variable TRTA is populated. Considering only those\
    \ rows on which both variables are populated."
  Domains: "BDS, ADNCA, MDBDS, ADAMOTHER"
  Severity: "Error"
Standards:
- Organization: "PMDA"
  Standards:
  - Name: "ADaMIG"
    Version: "1.3"
    References:
    - Origin: "PMDA Validation Rules"
      Rule_Identifier:
