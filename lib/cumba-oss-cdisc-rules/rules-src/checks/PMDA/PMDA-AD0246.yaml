Core:
  Id: "PMDA-AD0246"
  Status: "Published"
  Version: "1"
Description: "Raise an error when the Censor (CNSR) variable is present in a time-to-event\
  \ dataset but neither the Analysis Date (ADT) nor the Analysis Datetime (ADTM) variable\
  \ is present."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "BASIC DATA STRUCTURE"
    - "MEDICAL DEVICE BASIC DATA STRUCTURE"
Check:
  expression: >-
    var_exists("CNSR") and not var_exists("ADT") and not var_exists("ADTM")
Outcome:
  Message: "CNSR is present, but both ADT and ADTM are not present."
  Output_Variables:
  - "CNSR"
Source:
  Message: "CNSR is present, but both ADT and ADTM are not present"
  Description: "When Censor (CNSR) variable is present, the Time-to-Event Origin Date\
    \ for Subject (STARTDT) and one of Analysis Date (ADT) or Analysis Datetime (ADTM)\
    \ variables must be included in the dataset. In Time to Event studies, the basis\
    \ of analysis is the time from a defined starting point to the time of occurrence\
    \ of the event of interest."
  Domains: "BDS, ADNCA, MDBDS"
  Severity: "Error"
Standards:
- Organization: "PMDA"
  Standards:
