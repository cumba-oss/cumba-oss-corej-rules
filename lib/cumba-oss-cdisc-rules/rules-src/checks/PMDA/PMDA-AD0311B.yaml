Core:
  Id: "PMDA-AD0311B"
  Status: "Published"
  Version: "1"
Description: "Raise an error when the SMQzzSCN variable is not uniquely determined\
  \ by SMQzzSC within the dataset: a single value of SMQzzSC maps to more than one\
  \ value of SMQzzSCN, considering only the records on which both variables are populated.\
  \ The PMDA validation sheet's 'inconsistent value across studies' intent is reinterpreted\
  \ as a within-dataset unique (1-to-1) relationship check between the paired character/numeric\
  \ variables SMQzzSCN and SMQzzSC; the cross-study scope is not evaluated."
Executability: "Partially Executable"
ExecutabilityHint:
  Category: "partially executable"
  Detail: "The sheet's 'inconsistent across studies' intent is reinterpreted as a\
    \ within-dataset unique-relationship check between the char/numeric pair SMQzzSCN/SMQzzSC\
    \ (has_multiple_values_for); the cross-study scope is not evaluated."
Scope:
  Data_Structures:
    Include:
    - "OCCURRENCE DATA STRUCTURE"
  Subclasses:
    Include:
    - "ADVERSE EVENT"
Check:
  expression: >-
    not empty(SMQzzSCN) and not empty(SMQzzSC) and has_multiple_values_for(SMQzzSCN, SMQzzSC)
Outcome:
  Message: "There is more than one value of SMQzzSCN for a given value of SMQzzSC\
    \ (within the dataset)."
  Output_Variables:
  - "SMQzzSC"
  - "SMQzzSCN"
wildcards:
  zz:
    min: 1
    max: 99
Source:
  Message: "Inconsistent value for SMQzzSCN"
  Description: "Across studies, all SMQ Scope (N) (SMQzzSCN) variable values must\
    \ be the same for each unique value of SMQ Scope (SMQzzSC ) variable when both\
    \ variables are populated. The usual mapping is BROAD=1, NARROW=2."
  Domains: "OCCDS, ADAE, MDOCCDS"
  Severity: "Error"
