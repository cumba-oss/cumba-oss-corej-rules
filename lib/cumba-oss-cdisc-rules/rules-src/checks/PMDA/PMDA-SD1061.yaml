Core:
  Id: "PMDA-SD1061"
  Status: "Published"
  Version: "1"
Description: "Raise a warning when a Microbiology Specimen (MB) dataset is not present\
  \ while a Microbiology Susceptibility Test (MS) dataset is present."
Severity: "Warning"
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "MS"
Check:
  expression: >-
    ds_exists("MS") and not ds_exists("MB")
Outcome:
  Message: "The MB dataset is not present when the MS dataset is present."
Source:
  Message: "Missing MB dataset when MS dataset is present"
  Description: "Microbiology Specimen (MB) dataset should be included when a Microbiology\
    \ Susceptibility Test (MS) dataset is present."
  Domains: "MB"
  Severity: "Warning"
