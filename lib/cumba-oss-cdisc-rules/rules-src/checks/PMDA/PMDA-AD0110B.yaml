Core:
  Id: "PMDA-AD0110B"
  Status: "Published"
  Version: "1"
Description: "Raise an error when, within a study, the character Analysis Visit (AVISIT)\
  \ takes more than one value for the same combination of Parameter Code (PARAMCD)\
  \ and numeric Analysis Visit (AVISITN). Considering only those records on which\
  \ PARAMCD, AVISITN and the primary variable AVISIT are populated. Applies across\
  \ the basic-data-structure and medical-device basic-data-structure ADaM structures."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "BASIC DATA STRUCTURE"
    - "MEDICAL DEVICE BASIC DATA STRUCTURE"
Requirements:
  Variables:
    All:
    - "AVISIT"
Check:
  expression: >-
    var_exists("PARAMCD") and var_exists("AVISITN") and not empty(PARAMCD) and not empty(AVISITN)
    and not empty(AVISIT) and is_inconsistent_across_dataset(AVISIT, keys=[PARAMCD, AVISITN])
Outcome:
  Message: "Inconsistent value for AVISIT"
  Output_Variables:
  - "AVISIT"
  - "AVISITN"
  - "PARAMCD"
Source:
  Message: "Inconsistent value for AVISIT"
  Description: "Within a study, all AVISIT values must be the same for each unique\
    \ value group of [PARAMCD, AVISITN] when PARAMCD and primary variable AVISIT are\
    \ populated. Considering only those rows on which both variables are populated."
  Domains: "BDS, ADNCA, MDBDS, ADAMOTHER"
  Severity: "Error"
Standards:
- Organization: "PMDA"
  Standards:
  - Name: "ADaMIG"
    Version: "1.3"
    References:
    - Origin: "PMDA Validation Rules"
      Rule_Identifier:
        Id: "AD0110B"
        Version: "1"
      Version: "6.0"
  - Name: "ADaMIG"
    Version: "1.2"
    References:
    - Origin: "PMDA Validation Rules"
      Rule_Identifier:
        Id: "AD0110B"
        Version: "1"
      Version: "6.0"
  - Name: "ADaMIG"
    Version: "1.1"
    References:
