Core:
  Id: "PMDA-SD1282"
  Status: "Published"
  Version: "1"
Description: "Raise an error when --ELTM, --TPTNUM, and --TPT are not present in the\
  \ dataset but --TPTREF is present."
Executability: "Fully Executable"
Scope:
  Classes:
    Include:
    - "EVENTS"
    - "FINDINGS"
    - "FINDINGS ABOUT"
    - "INTERVENTIONS"
    - "SPECIAL PURPOSE"
  Domains:
    Exclude:
    - "DM"
    - "DO"
    - "SE"
    - "SV"
Check:
  expression: >-
    not var_exists("--ELTM") and not var_exists("--TPTNUM") and not var_exists("--TPT") and
    var_exists("--TPTREF")
Outcome:
  Message: "--TPTREF is present when --ELTM, --TPTNUM, and --TPT are not present."
  Output_Variables:
  - "--TPTREF"
Source:
  Message: "--TPTREF variable is present when --ELTM, --TPTNUM, and --TPT are missing"
  Description: "Time Point Reference (--TPTREF) variable should not be present in\
    \ the domain when the Planned Elapsed Time from Time Point Ref (--ELTM) variable,\
    \ Planned Time Point Number (--TPTNUM) variable, and Planned Time Point (--TPT)\
    \ variable are missing."
  Domains: "SPECIAL PURPOSE (-DM, -SE, -SV), INTERVENTIONS, FINDINGS (-DO), EVENTS,\
    \ FINDINGS ABOUT"
  Severity: "Error"
