Core:
  Id: "PMDA-AD0565"
  Status: "Published"
  Version: "1"
Description: "Raise an error when a Change to Baseline Category y (N) (BCHGCAyN) variable\
  \ is present in a dataset but its corresponding Change to Baseline Category y (BCHGCATy)\
  \ variable is not present in that dataset. The numeric category variable must always\
  \ be accompanied by its character category counterpart."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "BASIC DATA STRUCTURE"
    - "MEDICAL DEVICE BASIC DATA STRUCTURE"
Check:
  expression: >-
    var_exists("BCHGCAyN") and not var_exists("BCHGCATy")
Outcome:
  Message: "BCHGCAyN is present and BCHGCATy is not present."
  Output_Variables:
  - "BCHGCAyN"
wildcards:
  "y":
    min: 1
    max: 99
Source:
  Message: "BCHGCAyN is present and BCHGCATy is not present"
  Description: "If Change to Baseline Category y (N) (BCHGCAyN) variable is used in\
    \ a dataset, Change to Baseline Category y (BCHGCATy) variable must also be present\
    \ in that dataset."
  Domains: "BDS, ADNCA, MDBDS, ADAMOTHER"
  Severity: "Error"
Standards:
- Organization: "PMDA"
  Standards:
  - Name: "ADaMIG"
    Version: "1.3"
    References:
    - Origin: "PMDA Validation Rules"
      Rule_Identifier:
        Id: "AD0565"
        Version: "1"
      Version: "6.0"
  - Name: "ADaMIG"
    Version: "1.2"
    References:
    - Origin: "PMDA Validation Rules"
      Rule_Identifier:
        Id: "AD0565"
        Version: "1"
      Version: "6.0"
