Core:
  Id: "PMDA-SD1088"
  Status: "Published"
  Version: "1"
Description: "Raise a warning when the Study Day of Start of Observation (--STDY)\
  \ is missing even though the date portion of --STDTC is a complete date and the\
  \ date portion of DM.RFSTDTC is a complete date."
Severity: "Warning"
Executability: "Fully Executable"
Scope:
  Classes:
    Include:
    - "INTERVENTIONS"
    - "EVENTS"
    - "FINDINGS"
    - "FINDINGS ABOUT"
    - "SPECIAL PURPOSE"
  Domains:
    Exclude:
    - "CO"
    - "DM"
Requirements:
  Variables:
    All:
    - "--STDTC"
    - "--STDY"
Match_Datasets:
- Keys:
  - "USUBJID"
  Name: "DM"
Check:
  expression: >-
    is_complete_date(--STDTC) and is_complete_date(DM.RFSTDTC) and empty(--STDY)
Outcome:
  Message: "--STDY is missing when --STDTC and DM.RFSTDTC are both complete dates."
  Output_Variables:
  - "--STDTC"
  - "!--STDY"
  - "DM.RFSTDTC"
Source:
  Message: "--STDY variable value is not populated"
  Description: "Study Day of Start (--STDY) variable value should be populated when\
    \ Start Study Date (--STDTC) and Subject Reference Start Date/Time (RFSTDTC) variables\
    \ values are provided, and both include complete date part."
  Domains: "SPECIAL PURPOSE (-CO, -DM), INTERVENTIONS, FINDINGS, EVENTS, FINDINGS\
    \ ABOUT"
  Severity: "Warning"
