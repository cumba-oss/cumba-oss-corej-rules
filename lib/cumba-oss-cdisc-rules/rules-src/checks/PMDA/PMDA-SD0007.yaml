Core:
  Id: "PMDA-SD0007"
  Status: "Published"
  Version: "1"
Description: "Raise a warning when Standard Units (--STRESU) are inconsistent across\
  \ records that share the same --TESTCD, --OBJ, --TSTDTL, --CAT, --SPEC, --METHOD\
  \ and --MRKSTR values."
Severity: "Warning"
Executability: "Fully Executable"
Scope:
  Classes:
    Include:
    - "FINDINGS"
    - "FINDINGS ABOUT"
Requirements:
  Variables:
    All:
    - "--STRESU"
Check:
  expression: >-
    is_inconsistent_across_dataset(--STRESU, keys=[--TESTCD, --OBJ, --TSTDTL, --CAT, --SPEC,
    --METHOD, --MRKSTR])
Outcome:
  Message: "Standard Units (--STRESU) are inconsistent across records with the same\
    \ --TESTCD, --OBJ, --TSTDTL, --CAT, --SPEC, --METHOD and --MRKSTR."
  Output_Variables:
  - "--TESTCD"
  - "--OBJ"
  - "--MRKSTR"
  - "--TSTDTL"
  - "--CAT"
  - "--STRESU"
  - "--SPEC"
  - "--METHOD"
Source:
  Message: "Inconsistent value for Standard Units"
  Description: "Standard Units (--STRESU) must be consistent for all records with\
    \ the same Short Name of Measurement, Test or Examination (--TESTCD), Object of\
    \ the Observation (--OBJ), Measurement Test, or Examination Detail (--TSTDTL),\
    \ Category (--CAT), Specimen Type (--SPEC), Method of Test or Examination (--METHOD),\
    \ and Marker String (--MRKSTR)."
  Domains: "FINDINGS, FINDINGS ABOUT"
  Severity: "Warning"
