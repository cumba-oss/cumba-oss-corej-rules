Core:
  Id: "PMDA-SD1099"
  Status: "Published"
  Version: "1"
Description: "Raise a warning when --SCAT is present in a dataset, but --CAT is not\
  \ present."
Severity: "Warning"
Executability: "Fully Executable"
Scope:
  Classes:
    Include:
    - "INTERVENTIONS"
    - "FINDINGS"
    - "EVENTS"
    - "FINDINGS ABOUT"
Check:
  expression: >-
    var_exists("--SCAT") and not var_exists("--CAT")
Outcome:
  Message: "--CAT variable is not present when --SCAT variable is present."
  Output_Variables:
  - "--SCAT"
Source:
  Message: "Missing --CAT variable when --SCAT variable is present"
  Description: "Category (--CAT) variable should be included into dataset when Subcategory\
    \ (--SCAT) variable is present."
  Domains: "INTERVENTIONS, FINDINGS, EVENTS, FINDINGS ABOUT, TI"
  Severity: "Warning"
