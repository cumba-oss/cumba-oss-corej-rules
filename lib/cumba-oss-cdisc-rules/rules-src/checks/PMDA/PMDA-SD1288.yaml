Core:
  Id: "PMDA-SD1288"
  Status: "Published"
  Version: "1"
Description: "Raise an error when --PTCD does not have the same value across all records\
  \ that share the same value of --DECOD."
Executability: "Fully Executable"
Scope:
  Classes:
    Include:
    - "EVENTS"
Requirements:
  Variables:
    All:
    - "--PTCD"
Check:
  expression: >-
    var_exists("--DECOD") and is_inconsistent_across_dataset(--PTCD, keys=[--DECOD])
Outcome:
  Message: "--PTCD is not the same value across records with the same value of --DECOD."
  Output_Variables:
  - "--DECOD"
  - "--PTCD"
Source:
  Message: "Inconsistent value for --PTCD within --DECOD"
  Description: "All values of Preferred Term Code (--PTCD) should be the same for\
    \ a given value of Dictionary-Derived Term (--DECOD)."
  Domains: "EVENTS"
  Severity: "Error"
