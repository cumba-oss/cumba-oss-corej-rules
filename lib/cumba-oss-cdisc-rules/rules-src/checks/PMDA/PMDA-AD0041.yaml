Core:
  Id: "PMDA-AD0041"
  Status: "Published"
  Version: "1"
Description: "Raise an error when a variable whose name ends in 'DT' has a non-missing\
  \ SAS display format that is not one of the valid ADaM SAS date formats (e.g. DATE,\
  \ YYMMDD, E8601DA, IS8601DA and the other SAS date formats)."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "ALL"
Check:
  expression: >-
    ends_with(varname(), "DT") and not empty(var_format("DATA")) and var_format("DATA") !~
    /(?i)^(B8601DA|B8601DN|DATE|DAY|DDMMYY|DDMMYYB|DDMMYYC|DDMMYYD|DDMMYYN|DDMMYYP|DDMMYYS|DOWNAME|DTMONYY|E8601DA|JULDAY|JULIAN|MMDDYY|MMDDYYB|MMDDYYC|MMDDYYD|MMDDYYN|MMDDYYP|MMDDYYS|MMYY|MMYYB|MMYYC|MMYYD|MMYYN|MMYYP|MMYYS|MONNAME|MONTH|MONYY|PDJULG|PDJULI|QTR|QTRR|WEEKDATE|WEEKDATX|WEEKDAY|WEEKU|WEEKV|WEEKW|WORDDATE|WORDDATX|YEAR|YYMM|YYMMDD|YYMMDDB|YYMMDDC|YYMMDDD|YYMMDDN|YYMMDDP|YYMMDDS|YYMMB|YYMMC|YYMMD|YYMMN|YYMMP|YYMMS|YYMON|YYQ|YYQB|YYQC|YYQD|YYQN|YYQP|YYQS|YYQR|YYQRB|YYQRC|YYQRD|YYQRN|YYQRP|YYQRS|IS8601DA)\\d*\\.?\\d*$/
Outcome:
  Message: "A variable whose name ends in 'DT' does not have a valid ADaM SAS date\
    \ format."
  Output_Variables:
  - "variable_name"
  - "variable_format"
Source:
  Message: "*DT does not have the ADaM required SAS Date format"
  Description: "The SAS format listed in the dataset must be valid. Here is a list\
    \ of SAS Date formats utilized in the rule algorithm: B8601DA, B8601DN , DATE,\
    \ DAY, DDMMYY, DDMMYYB, DDMMYYC, DDMMYYD, DDMMYYN, DDMMYYP, DDMMYYS, DOWNAME,\
    \ DTMONYY, E8601DA, JULDAY, JULIAN, MMDDYY, MMDDYYB, MMDDYYC, MMDDYYD, MMDDYYN,\
    \ MMDDYYP, MMDDYYS, MMYY, MMYYB, MMYYC, MMYYD, MMYYN, MMYYP, MMYYS, MONNAME, MONTH,\
    \ MONYY, PDJULG, PDJULI, QTR, QTRR, WEEKDATE, WEEKDATX, WEEKDAY, WEEKU, WEEKV,\
    \ WEEKW, WORDDATE, WORDDATX, YEAR, YYMM, YYMMDD, YYMMDDB, YYMMDDC, YYMMDDD, YYMMDDN,\
    \ YYMMDDP, YYMMDDS, YYMMB, YYMMC, YYMMD, YYMMN, YYMMP, YYMMS, YYMON, YYQ, YYQB,\
    \ YYQC, YYQD, YYQN, YYQP, YYQS, YYQR, YYQRB, YYQRC, YYQRD, YYQRN, YYQRP, YYQRS,\
    \ IS8601DA."
  Domains: "ADSL, ADDL, BDS, ADNCA, MDBDS, OCCDS, ADAE, MDOCCDS, ADAMOTHER"
  Severity: "Error"
Standards:
- Organization: "PMDA"
  Standards:
  - Name: "ADaMIG"
    Version: "1.3"
    References:
    - Origin: "PMDA Validation Rules"
      Rule_Identifier:
        Id: "AD0041"
        Version: "1"
      Version: "6.0"
  - Name: "ADaMIG"
    Version: "1.2"
