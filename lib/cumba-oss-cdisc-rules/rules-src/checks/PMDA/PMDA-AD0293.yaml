Core:
  Id: "PMDA-AD0293"
  Status: "Published"
  Version: "1"
Description: "Raise an error when the AETOXGR variable is not uniquely determined\
  \ by AETOXGRN within the dataset: a single value of AETOXGRN maps to more than one\
  \ value of AETOXGR, considering only the records on which AETOXGR is populated.\
  \ The PMDA validation sheet's 'inconsistent value across studies' intent is reinterpreted\
  \ as a within-dataset unique (1-to-1) relationship check between the paired character/numeric\
  \ variables AETOXGR and AETOXGRN; the cross-study scope is not evaluated."
Executability: "Partially Executable"
ExecutabilityHint:
  Category: "partially executable"
  Detail: "The sheet's 'inconsistent across studies' intent is reinterpreted as a\
    \ within-dataset unique-relationship check between the char/numeric pair AETOXGR/AETOXGRN\
    \ (has_multiple_values_for); the cross-study scope is not evaluated."
Scope:
  Data_Structures:
    Include:
    - "OCCURRENCE DATA STRUCTURE"
  Subclasses:
    Include:
    - "ADVERSE EVENT"
Check:
  expression: >-
    not empty(AETOXGR) and has_multiple_values_for(AETOXGR, AETOXGRN)
Outcome:
  Message: "There is more than one value of AETOXGR for a given value of AETOXGRN\
    \ (within the dataset)."
  Output_Variables:
  - "AETOXGR"
  - "AETOXGRN"
Source:
  Message: "Inconsistent value for AETOXGR"
  Description: "Across studies, all Standard Toxicity Grade (AETOXGR) variable values\
    \ must be the same for each unique value of Standard Toxicity Grade (N) (AETOXGRN)\
    \ variable when the primary variable AETOXGR is populated."
  Domains: "ADAE"
  Severity: "Error"
Standards:
- Organization: "PMDA"
  Standards:
  - Name: "ADaMIG"
    Version: "1.0"
    References:
    - Origin: "PMDA Validation Rules"
      Rule_Identifier:
        Id: "AD0293"
        Version: "1"
      Version: "6.0"
