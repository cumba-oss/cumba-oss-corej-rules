Core:
  Id: "PMDA-AD0130"
  Status: "Published"
  Version: "1"
Description: "Raise a warning when, within a study, the Character Baseline Value (BASEC)\
  \ takes more than one value for the same combination of Parameter Code (PARAMCD)\
  \ and numeric Baseline Value (BASE). Only records on which PARAMCD, BASE and BASEC\
  \ are populated are considered; there must be a one-to-one map between BASE and\
  \ BASEC within a given parameter when both are populated."
Severity: "Warning"
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "BASIC DATA STRUCTURE"
Check:
  expression: >-
    not empty(BASEC) and not empty(BASE) and not empty(PARAMCD) and has_multiple_values_for(BASEC,
    BASE, within=PARAMCD)
Outcome:
  Message: "Inconsistent value for BASEC"
  Output_Variables:
  - "PARAMCD"
  - "BASE"
  - "BASEC"
Source:
  Message: "Inconsistent value for BASEC"
  Description: "Within a study, all BASEC values must be the same for each unique\
    \ value group of [PARAMCD, BASE] when PARAMCD, BASE and BASEC are populated. (ADaM\
    \ IG: There must be a one-to-one map between BASE and BASEC within a given PARAM\
    \ if BOTH are populated)."
  Domains: "BDS, ADNCA"
  Severity: "Warning"
