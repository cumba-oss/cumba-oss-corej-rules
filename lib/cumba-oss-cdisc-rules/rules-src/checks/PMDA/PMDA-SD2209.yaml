Core:
  Id: "PMDA-SD2209"
  Status: "Published"
  Version: "1"
Description: "Raise a warning when the Trial Summary (TS) dataset does not contain\
  \ a record where TSPARMCD equals 'TBLIND' (Trial Blinding Schema)."
Severity: "Warning"
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "TS"
Operations:
- id: "$tblind_count"
  expression: "record_count(filter=filter(TSPARMCD=\"TBLIND\"))"
Check:
  expression: >-
    $tblind_count == 0
Outcome:
  Message: "Missing TBLIND Trial Summary Parameter: a 'Trial Blinding Schema' (TBLIND)\
    \ record must be present in the Trial Summary (TS) domain."
  Output_Variables:
  - "$tblind_count"
Source:
  Message: "Missing TBLIND Trial Summary Parameter"
  Description: "'Trial Blinding Schema' (TBLIND) record must be populated in Trial\
    \ Summary (TS) domain. It is expected for SDTM IG v3.1.2 data and required for\
    \ data in all more recent SDTM versions."
  Domains: "TS"
  Severity: "Warning"
