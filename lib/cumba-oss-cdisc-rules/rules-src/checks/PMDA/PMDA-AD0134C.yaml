Core:
  Id: "PMDA-AD0134C"
  Status: "Published"
  Version: "1"
Description: "Raise an error when the Analysis Range y Upper Limit (AyHI) equals 0\
  \ but the Ratio to Analysis Range y Upper Limit (R2AyHI) is populated. Because R2AyHI\
  \ equals AVAL divided by AyHI, it cannot be derived when AyHI is 0 (division by\
  \ zero), so R2AyHI must be missing in that case."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "BASIC DATA STRUCTURE"
    - "MEDICAL DEVICE BASIC DATA STRUCTURE"
Check:
  expression: >-
    not empty(R2AyHI) and AyHI == 0
Outcome:
  Message: "AyHI equals 0 but R2AyHI is populated; R2AyHI cannot be derived because\
    \ it would require dividing by 0."
  Output_Variables:
  - "R2AyHI"
  - "AyHI"
wildcards:
  "y":
    min: 1
    max: 99
Source:
  Message: "Calculation issue: AyHI = 0, but R2AyHI is populated"
  Description: "When Analysis Range High (AyHI) = 0, the Ratio to Analysis Range High\
    \ (R2AyHI) should not be populated since you cannot divide by 0. AD0134 checks\
    \ the calculation is correct when AyLO != '0'."
  Domains: "BDS, ADNCA, MDBDS"
  Severity: "Error"
