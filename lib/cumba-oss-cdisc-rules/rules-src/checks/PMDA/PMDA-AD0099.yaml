Core:
  Id: "PMDA-AD0099"
  Status: "Published"
  Version: "1"
Description: "Raise an error when, on a record, a variable ending in STDY and the\
  \ corresponding variable with the same root ending in ENDY are both populated and\
  \ the STDY value is greater than the ENDY value."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "BASIC DATA STRUCTURE"
    - "OCCURRENCE DATA STRUCTURE"
Check:
  expression: >-
    not empty(*STDY) and not empty(*ENDY) and *STDY > *ENDY
Outcome:
  Message: "*STDY is greater than *ENDY on this record."
  Output_Variables:
  - "*STDY"
  - "*ENDY"
Source:
  Message: "*STDY is greater than *ENDY"
  Description: "Any variable ending in STDY (Start day) must have a value less than\
    \ or equal to its corresponding ENDY (end day) value."
  Domains: "BDS, ADNCA, MDBDS, OCCDS, ADAE, MDOCCDS, ADAMOTHER"
  Severity: "Error"
Standards:
- Organization: "PMDA"
  Standards:
  - Name: "ADaMIG"
    Version: "1.3"
    References:
    - Origin: "PMDA Validation Rules"
      Rule_Identifier:
