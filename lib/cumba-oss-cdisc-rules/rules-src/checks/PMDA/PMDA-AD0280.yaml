Core:
  Id: "PMDA-AD0280"
  Status: "Published"
  Version: "1"
Description: "Raise an error when, considering only records on which AESEV is populated,\
  \ the AESEV variable is not uniquely determined by AESEVN within the dataset: a\
  \ single value of AESEVN maps to more than one value of AESEV."
Executability: "Partially Executable"
ExecutabilityHint:
  Category: "partially executable"
  Detail: "The sheet's 'inconsistent across studies' intent is reinterpreted as a\
    \ within-dataset unique-relationship check between the char/numeric pair AESEV/AESEVN\
    \ (has_multiple_values_for); the cross-study scope is not evaluated."
Scope:
  Data_Structures:
    Include:
    - "OCCURRENCE DATA STRUCTURE"
  Subclasses:
    Include:
    - "ADVERSE EVENT"
Check:
  expression: >-
    not empty(AESEV) and has_multiple_values_for(AESEV, AESEVN)
Outcome:
  Message: "There is more than one value of AESEV for a given value of AESEVN (within\
    \ the dataset)."
  Output_Variables:
  - "AESEV"
  - "AESEVN"
Source:
  Message: "Inconsistent value for AESEV"
  Description: "Across studies, all Severity/Intensity (AESEV) variable values must\
    \ be the same for each unique value of Severity/Intensity (N) (AESEVN) variable\
    \ when the primary variable AESEV is populated."
  Domains: "ADAE"
  Severity: "Error"
Standards:
- Organization: "PMDA"
  Standards:
  - Name: "ADaMIG"
    Version: "1.0"
    References:
    - Origin: "PMDA Validation Rules"
      Rule_Identifier:
        Id: "AD0280"
        Version: "1"
      Version: "6.0"
