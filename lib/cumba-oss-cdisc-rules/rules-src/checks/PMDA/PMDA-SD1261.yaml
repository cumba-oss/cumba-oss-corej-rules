Core:
  Id: "PMDA-SD1261"
  Status: "Published"
  Version: "1"
Description: "Raise a warning when SSSTRESC is equal to 'DEAD' and SSDTC in the SS\
  \ dataset is less than DTHDTC in the DM dataset."
Severity: "Warning"
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "SS"
Requirements:
  Variables:
    All:
    - "SSSTRESC"
Match_Datasets:
- Keys:
  - "USUBJID"
  Name: "DM"
Check:
  expression: >-
    SSSTRESC == "DEAD" and date(SSDTC) < DM.DTHDTC
Outcome:
  Message: "SSDTC in the SS dataset is not greater than or equal to DTHDTC in the\
    \ DM dataset, when SSSTRESC is equal to 'DEAD'."
  Output_Variables:
  - "SSSTRESC"
  - "SSDTC"
  - "DM.DTHDTC"
Source:
  Message: "SSDTC is not greater than or equal to DTHDTC when SSSTRESC = 'DEAD'"
  Description: "Subject Status Date/Time of Assessment (SSDTC) must be greater than\
    \ or equal to Date/Time of Death (DTHDTC) when the subject's status is 'DEAD'."
  Domains: "SS"
  Severity: "Warning"
