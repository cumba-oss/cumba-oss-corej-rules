Core:
  Id: "PMDA-AD0198"
  Status: "Published"
  Version: "1"
Description: "Raise an error when a Basic Data Structure dataset contains neither\
  \ the numeric Analysis Value (AVAL) variable nor the character Analysis Value (AVALC)\
  \ variable. At least one of AVAL or AVALC must be present in every BDS dataset."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "BASIC DATA STRUCTURE"
    - "MEDICAL DEVICE BASIC DATA STRUCTURE"
Check:
  expression: >-
    not var_exists("AVAL") and not var_exists("AVALC")
Outcome:
  Message: "Neither AVAL nor AVALC are present in dataset."
Source:
  Message: "Neither AVAL nor AVALC are present in dataset"
  Description: "At least one Analysis Value (numeric or character) variable must be\
    \ present in BDS datasets."
  Domains: "BDS, ADNCA, MDBDS"
  Severity: "Error"
