Core:
  Id: "PMDA-AD0468"
  Status: "Published"
  Version: "1"
Description: "Raise an error when Strata Used for Randomization (N) (STRATARN) is\
  \ present and Strata Used for Randomization (STRATAR) is present and STRATAR does\
  \ not have a single value across records sharing the same value of STRATARN, considering\
  \ only the records on which both variables are populated."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "SUBJECT LEVEL ANALYSIS DATASET"
    - "DEVICE LEVEL ANALYSIS DATASET"
Requirements:
  Variables:
    All:
    - "STRATAR"
Check:
  expression: >-
    var_exists("STRATARN") and not empty(STRATARN) and not empty(STRATAR) and
    is_inconsistent_across_dataset(STRATAR, keys=[STRATARN])
Outcome:
  Message: "Inconsistent value for STRATAR within STRATARN."
  Output_Variables:
  - "STRATAR"
  - "STRATARN"
Source:
  Message: "Inconsistent value for STRATAR"
  Description: "There should be only a single value of Strata Used for Randomization\
    \ (STRATAR) variable for a given value of Strata Used for Randomization (N) (STRATARN)\
    \ variable, considering only those rows on which both variables are populated."
  Domains: "ADSL, ADDL"
  Severity: "Error"
Standards:
- Organization: "PMDA"
  Standards:
  - Name: "ADaMIG"
    Version: "1.3"
    References:
    - Origin: "PMDA Validation Rules"
      Rule_Identifier:
        Id: "AD0468"
        Version: "1"
      Version: "6.0"
  - Name: "ADaMIG"
    Version: "1.2"
    References:
    - Origin: "PMDA Validation Rules"
      Rule_Identifier:
        Id: "AD0468"
        Version: "1"
      Version: "6.0"
