Core:
  Id: "PMDA-SD1037"
  Status: "Published"
  Version: "1"
Description: "Raise a warning when a Toxicity Grade (--TOXGR) variable is populated\
  \ and greater than 0 but the corresponding Toxicity (--TOX) variable is empty or\
  \ not present."
Severity: "Warning"
Executability: "Partially Executable"
Scope:
  Domains:
    Include:
    - "CP"
    - "CV"
    - "EG"
    - "LB"
    - "MI"
    - "MO"
    - "PC"
    - "PP"
    - "RE"
    - "VS"
Requirements:
  Variables:
    All:
    - "--TOXGR"
Check:
  expression: >-
    not empty(--TOXGR) and --TOXGR > 0 and empty(--TOX)
Outcome:
  Message: "--TOX is empty when --TOXGR is populated and greater than 0."
  Output_Variables:
  - "!--TOX"
  - "--TOXGR"
Source:
  Message: "Missing value for --TOX when --TOXGR is populated"
  Description: "A value for a Toxicity (--TOX) variable should be provided when a\
    \ Toxicity Grade (--TOXGR) variable value is populated and greater than 0."
  Domains: "CP, CV, EG, LB, MI, MO, PC, PP, RE, VS"
  Severity: "Warning"
