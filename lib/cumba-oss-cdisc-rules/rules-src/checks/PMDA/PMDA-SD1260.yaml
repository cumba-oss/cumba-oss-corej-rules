Core:
  Id: "PMDA-SD1260"
  Status: "Published"
  Version: "1"
Description: "Raise a warning when the Reference Terminology (TSVCDREF) is populated\
  \ but the Version of the Reference Terminology (TSVCDVER) is empty."
Severity: "Warning"
Executability: "Partially Executable - Possible Overreporting"
Scope:
  Domains:
    Include:
    - "TS"
Check:
  expression: >-
    not empty(TSVCDREF) and empty(TSVCDVER)
Outcome:
  Message: "TSVCDVER is empty when Reference Terminology is versioned: TSVCDVER should\
    \ be populated when the Reference Terminology (TSVCDREF) is versioned."
  Output_Variables:
  - "TSPARMCD"
  - "TSVCDREF"
  - "TSVCDVER"
Source:
  Message: "TSVCDVER is null when Reference Terminology is versioned"
  Description: "The Version of the Reference Terminology variable (TSVCDVER) should\
    \ be populated with the version number of the Reference Terminology when that\
    \ Reference Terminology is versioned."
  Domains: "TS"
  Severity: "Warning"
