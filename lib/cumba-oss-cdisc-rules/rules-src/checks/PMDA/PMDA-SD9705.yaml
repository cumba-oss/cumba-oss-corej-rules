Core:
  Id: "PMDA-SD9705"
  Status: "Published"
  Version: "1"
Description: "Raise an error when --TEST is not populated."
Severity: "Reject"
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "BS"
    - "CP"
    - "CV"
    - "DA"
    - "DD"
    - "EG"
    - "FA"
    - "FT"
    - "GF"
    - "IE"
    - "IS"
    - "LB"
    - "MB"
    - "MI"
    - "MK"
    - "MO"
    - "MS"
    - "NV"
    - "OE"
    - "PC"
    - "PE"
    - "PP"
    - "QS"
    - "RE"
    - "RP"
    - "RS"
    - "SC"
    - "SR"
    - "SS"
    - "TR"
    - "TU"
    - "UR"
    - "VS"
Requirements:
  Variables:
    All:
    - "--TEST"
Check:
  expression: >-
    empty(--TEST)
Outcome:
  Message: "--TEST is empty."
  Output_Variables:
  - "--TEST"
Source_Proposed:
  Message: "Missing value for --TEST"
  Description: "--TEST should be populated."
  Domains: "BS, CP, CV, DA, DD, EG, FA, FT, GF, IE, IS, LB, MB, MI, MK, MO, MS, NV,\
    \ OE, PC, PE, PP, QS, RE, RP, RS, SC, SR, SS, TR, TU, UR, VS"
  Severity: "Reject"
Source:
  Message: "Null value in variable marked as Required"
  Description: "Required variables (where Core attribute is 'Req') cannot be null\
    \ for any records."
  Domains: "ALL"
  Severity: "Reject"
