Core:
  Id: "PMDA-AD0364"
  Status: "Published"
  Version: "1"
Description: "Raise an error when the Treatment Dose Units (DOSEU) variable is not\
  \ present in a dataset that includes either the Treatment Dose at Record Start (DOSEON)\
  \ or the Cumulative Actual Treatment Dose (DOSCUMA) variable. DOSEU is required\
  \ whenever DOSEON or DOSCUMA is present."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "OCCURRENCE DATA STRUCTURE"
    - "MEDICAL DEVICE OCCURRENCE DATA STRUCTURE"
Check:
  expression: >-
    (var_exists("DOSEON") or var_exists("DOSCUMA")) and not var_exists("DOSEU")
Outcome:
  Message: "DOSEU variable is not present when DOSEON or DOSCUMA is present."
  Output_Variables:
  - "DOSEON"
  - "DOSCUMA"
Source:
  Message: "DOSEU variable is not present when DOSEON or DOSCUMA is present"
  Description: "Treatment Dose Units (DOSEU) variable is required when either Treatment\
    \ Dose at Record Start (DOSEON) or Cumulative Actual Treatment Dose (DOSCUMA)\
    \ variable is present in the dataset."
  Domains: "OCCDS, ADAE, MDOCCDS"
  Severity: "Error"
Standards:
- Organization: "PMDA"
  Standards:
  - Name: "ADaMIG"
    Version: "1.3"
    References:
    - Origin: "PMDA Validation Rules"
      Rule_Identifier:
        Id: "AD0364"
        Version: "1"
      Version: "6.0"
  - Name: "ADaMIG"
