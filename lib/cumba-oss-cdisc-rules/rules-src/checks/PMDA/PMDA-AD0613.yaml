Core:
  Id: "PMDA-AD0613"
  Status: "Published"
  Version: "1"
Description: "Raise an error when, on a BDS or OCCDS record where APHASEN is populated,\
  \ PHETM does not equal the ADSL variable PHwETM for the same USUBJID (where w equals\
  \ the record's APHASEN value)."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "BASIC DATA STRUCTURE"
    - "OCCURRENCE DATA STRUCTURE"
Match_Datasets:
- Name: "ADSL"
  Keys:
  - "USUBJID"
Check:
  expression: >-
    not empty(APHASEN) and not empty(PHETM) and PHETM != ADSL.PH${APHASEN:%d}ETM
Outcome:
  Message: "On a given record, APHASEN is populated and the value of PHETM is not\
    \ equal to the value of variable PHwETM where w equals the value of APHASEN"
  Output_Variables:
  - "APHASEN"
  - "PHETM"
  - "ADSL.PH${*}ETM"
Source:
  Message: "APHASEN w has a PHETM != ADSL.PHwETM"
  Description: "When analysis Phase (APHASE) variable is defined, the Phase End Time\
    \ (PHETM) variable value must equal ADSL Phase w End Time (PHwETM) variable value\
    \ for that phase defined by the value in Phase (N) (APHASEN) variable. APHASEN\
    \ = w."
  Domains: "BDS, ADNCA, MDBDS, OCCDS, ADAE, MDOCCDS, ADAMOTHER"
  Severity: "Error"
Standards:
- Organization: "PMDA"
  Standards:
  - Name: "ADaMIG"
    Version: "1.2"
    References:
    - Origin: "PMDA Validation Rules"
      Rule_Identifier:
        Id: "AD0613"
        Version: "1"
      Version: "6.0"
  - Name: "ADaMIG"
    Version: "1.3"
    References:
    - Origin: "PMDA Validation Rules"
      Rule_Identifier:
        Id: "AD0613"
        Version: "1"
      Version: "6.0"
