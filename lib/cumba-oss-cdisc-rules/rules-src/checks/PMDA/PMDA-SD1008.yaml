Core:
  Id: "PMDA-SD1008"
  Status: "Published"
  Version: "1"
Description: "Raise a warning when Date/Time of Comment (CODTC) is populated for a\
  \ comment that is related to a specific parent record or group of parent records\
  \ (RDOMAIN, IDVAR and IDVARVAL are populated)."
Severity: "Warning"
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "CO"
Requirements:
  Variables:
    All:
    - "CODTC"
    - "IDVAR"
    - "IDVARVAL"
    - "RDOMAIN"
Check:
  expression: >-
    not empty(RDOMAIN) and not empty(IDVAR) and not empty(IDVARVAL) and not empty(CODTC)
Outcome:
  Message: "CODTC is populated when the comment is related to a parent record (RDOMAIN,\
    \ IDVAR and IDVARVAL are populated)."
  Output_Variables:
  - "RDOMAIN"
  - "IDVAR"
  - "IDVARVAL"
  - "CODTC"
Source:
  Message: "CODTC is populated when comment is a child record of another domain"
  Description: "The value of Date/Time of Comment (CODTC) should be null when comments\
    \ are related to a specific parent record or group of parent records in a domain\
    \ (RDOMAIN, IDVAR and IDVARVAL are populated)."
  Domains: "CO"
  Severity: "Warning"
