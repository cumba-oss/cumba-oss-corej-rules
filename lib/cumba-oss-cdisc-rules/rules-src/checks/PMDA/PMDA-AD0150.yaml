Core:
  Id: "PMDA-AD0150"
  Status: "Published"
  Version: "1"
Description: "Raise a warning when, for a given Parameter Code (PARAMCD), the Analysis\
  \ Value (AVAL) takes more than one value for the same Analysis Value (C) (AVALC)\
  \ on records where both AVAL and AVALC are populated; AVAL and AVALC must hold a\
  \ one-to-one mapping within a PARAMCD."
Severity: "Warning"
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "BASIC DATA STRUCTURE"
    - "MEDICAL DEVICE BASIC DATA STRUCTURE"
Requirements:
  Variables:
    All:
    - "AVAL"
    - "AVALC"
    - "PARAMCD"
Check:
  expression: >-
    not empty(PARAMCD) and not empty(AVAL) and not empty(AVALC) and
    is_inconsistent_across_dataset(AVAL, keys=[PARAMCD, AVALC])
Outcome:
  Message: "Inconsistent value for AVAL"
  Output_Variables:
  - "PARAMCD"
  - "AVAL"
  - "AVALC"
Source:
  Message: "Inconsistent value for AVAL"
  Description: "Within a study and a given value of PARAMCD when both AVAL and AVALC\
    \ are populated, then all AVAL values must be the same for each unique value of\
    \ AVALC creating a one-to-one mapping."
  Domains: "BDS, ADNCA, MDBDS"
  Severity: "Warning"
Standards:
- Organization: "PMDA"
  Standards:
