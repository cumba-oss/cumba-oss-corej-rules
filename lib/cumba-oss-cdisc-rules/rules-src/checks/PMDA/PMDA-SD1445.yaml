Core:
  Id: "PMDA-SD1445"
  Status: "Published"
  Version: "1"
Description: "Raise a warning when a subject (USUBJID) has more than one record with\
  \ Last Observation Before Exposure Flag (--LOBXFL) equal to 'Y' for the same assessment,\
  \ identified by the combination of --TESTCD, --TSTDTL, --CAT, --SCAT, --METHOD,\
  \ --SPEC, --LOC and --LAT."
Severity: "Warning"
Executability: "Fully Executable"
Scope:
  Classes:
    Include:
    - "FINDINGS"
    - "FINDINGS ABOUT"
Requirements:
  Variables:
    All:
    - "--LOBXFL"
Check:
  expression: >-
    --LOBXFL == "Y" and var_exists("--TESTCD") and not is_unique_set([--LOBXFL, USUBJID, --TESTCD,
    --TSTDTL, --CAT, --SCAT, --METHOD, --SPEC, --LOC, --LAT])
Outcome:
  Message: "Multiple --LOBXFL records for the same test"
  Output_Variables:
  - "--TESTCD"
  - "--LOBXFL"
Source:
  Message: "Multiple --LOBXFL records for the same test"
  Description: "By its definition Last Observation Before Exposure Flag (--LOBXFL)\
    \ should have only a single record for the same test for subject. Therefore, each\
    \ subject (USUBJID) should have no more than one record with Last Observation\
    \ Before Exposure Flag (--LOBXFL) equals 'Y' for the same assessment which is\
    \ defined by Test (--TESTCD), --TSTDTL (Measurement, Test or Examination Detail),\
    \ Category (--CAT), Subcategory (--SCAT), Method (--METHOD), Specimen (--SPEC),\
    \ Location (--LOC) and Laterality (--LAT)."
  Domains: "FINDINGS, FINDINGS ABOUT"
  Severity: "Warning"
