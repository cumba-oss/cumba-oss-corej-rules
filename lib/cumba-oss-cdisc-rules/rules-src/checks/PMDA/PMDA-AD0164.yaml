Core:
  Id: "PMDA-AD0164"
  Status: "Published"
  Version: "1"
Description: "Raise an error when the Baseline Toxicity Grade (BTOXGR) variable is\
  \ present in the dataset but the Baseline Record Flag (ABLFL) variable is not present;\
  \ when BTOXGR is used, the baseline record flag identifying the baseline record\
  \ must also be present."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "BASIC DATA STRUCTURE"
    - "MEDICAL DEVICE BASIC DATA STRUCTURE"
Check:
  expression: >-
    var_exists("BTOXGR") and not var_exists("ABLFL")
Outcome:
  Message: "BTOXGR is present, but ABLFL is not present."
  Output_Variables:
  - "BTOXGR"
Source:
  Message: "BTOXGR is present, but ABLFL is not present"
  Description: "If Baseline Toxicity Grade (BTOXGR) variable is present, then Analysis\
    \ Toxicity Grade (ATOXGR) and Baseline Record Flag (ABLFL) variables must be present."
  Domains: "BDS, ADNCA, MDBDS"
  Severity: "Error"
Standards:
- Organization: "PMDA"
  Standards:
  - Name: "ADaMIG"
    Version: "1.3"
    References:
