Core:
  Id: "PMDA-AD0351"
  Status: "Published"
  Version: "1"
Description: "Raise an error when, within a study, the character Analysis Range y\
  \ Upper Limit (C) (AyHIC) does not have a single consistent value for each unique\
  \ combination of Parameter Code (PARAMCD) and the numeric Analysis Range y Upper\
  \ Limit (AyHI), evaluated on rows where PARAMCD and AyHI are populated."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "BASIC DATA STRUCTURE"
    - "MEDICAL DEVICE BASIC DATA STRUCTURE"
Check:
  expression: >-
    not empty(PARAMCD) and not empty(AyHI) and is_inconsistent_across_dataset(AyHIC, keys=[PARAMCD,
    AyHI])
Outcome:
  Message: "Inconsistent value for AyHIC"
  Output_Variables:
  - "PARAMCD"
  - "AyHI"
  - "AyHIC"
wildcards:
  "y":
    min: 1
    max: 99
Source:
  Message: "Inconsistent value for AyHIC"
  Description: "Within a Study and a Parameter, all Analysis Range y Upper Limit (C)\
    \ (AyHIC) variable values must be the same for each unique value of Analysis Range\
    \ y Upper Limit (AyHI) variable when variable AyHI is populated."
  Domains: "BDS, ADNCA, MDBDS"
  Severity: "Error"
Standards:
- Organization: "PMDA"
  Standards:
  - Name: "ADaMIG"
    Version: "1.3"
    References:
    - Origin: "PMDA Validation Rules"
      Rule_Identifier:
        Id: "AD0351"
        Version: "1"
      Version: "6.0"
  - Name: "ADaMIG"
    Version: "1.2"
    References:
