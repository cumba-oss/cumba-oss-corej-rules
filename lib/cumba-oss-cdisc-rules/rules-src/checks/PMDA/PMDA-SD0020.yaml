Core:
  Id: "PMDA-SD0020"
  Status: "Published"
  Version: "1"
Description: "Raise an error when a Parameter Short Name (--PARMCD) value is more\
  \ than 8 characters in length."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "DI"
    - "TS"
Check:
  expression: >-
    len(--PARMCD) > 8
Outcome:
  Message: "--PARMCD value length is greater than 8 characters."
  Output_Variables:
  - "--PARMCD"
Source:
  Message: "Invalid value for --PARMCD variable"
  Description: "The value of Parameter Short Name (--PARMCD) variables should be no\
    \ more than 8 characters in length."
  Domains: "TS, STUDY REFERENCE"
  Severity: "Error"
