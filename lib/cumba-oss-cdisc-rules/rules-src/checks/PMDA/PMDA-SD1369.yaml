Core:
  Id: "PMDA-SD1369"
  Status: "Published"
  Version: "1"
Description: "Raise an error when --STREFC is empty while --ORREF is populated."
Executability: "Fully Executable"
Scope:
  Classes:
    Include:
    - "FINDINGS"
    - "FINDINGS ABOUT"
  Domains:
    Exclude:
    - "MK"
    - "OE"
Requirements:
  Variables:
    All:
    - "--STREFC"
    - "--ORREF"
Check:
  expression: >-
    not empty(--ORREF) and empty(--STREFC)
Outcome:
  Message: "--STREFC is empty when --ORREF is populated."
  Output_Variables:
  - "--ORREF"
  - "--STREFC"
Source:
  Message: "--STREFC is null when --ORREF is populated"
  Description: "Reference Result in Standard Format (--STREFC) should be populated\
    \ when Reference Result in Original Units (--ORREF) is populated."
  Domains: "FINDINGS (-MK, -OE), FINDINGS ABOUT"
  Severity: "Error"
Standards:
- Organization: "PMDA"
  Standards:
  - Name: "SDTMIG"
    Version: "3.3"
    References:
    - Origin: "PMDA Validation Rules"
      Rule_Identifier:
        Id: "SD1369"
        Version: "1"
      Version: "6.0"
  - Name: "SDTMIG"
    Version: "3.4"
    References:
    - Origin: "PMDA Validation Rules"
      Rule_Identifier:
        Id: "SD1369"
        Version: "1"
      Version: "6.0"
