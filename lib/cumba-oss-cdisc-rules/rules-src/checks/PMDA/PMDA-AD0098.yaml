Core:
  Id: "PMDA-AD0098"
  Status: "Published"
  Version: "1"
Description: "Raise an error when, on a record, a variable ending in SDY and the corresponding\
  \ variable with the same root ending in EDY are both populated and the SDY value\
  \ is greater than the EDY value."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "BASIC DATA STRUCTURE"
Check:
  expression: >-
    not empty(*SDY) and not empty(*EDY) and *SDY > *EDY
Outcome:
  Message: "*SDY is greater than *EDY on this record."
  Output_Variables:
  - "*SDY"
  - "*EDY"
Source:
  Message: "*SDY is greater than *EDY"
  Description: "Any variable ending in SDY (Start day) must have a value less than\
    \ or equal to its corresponding EDY (end day) value."
  Domains: "BDS, ADNCA, MDBDS, OCCDS, ADAE, MDOCCDS, ADAMOTHER"
  Severity: "Error"
Standards:
- Organization: "PMDA"
  Standards:
  - Name: "ADaMIG"
    Version: "1.3"
    References:
    - Origin: "PMDA Validation Rules"
      Rule_Identifier:
        Id: "AD0098"
        Version: "1"
      Version: "6.0"
