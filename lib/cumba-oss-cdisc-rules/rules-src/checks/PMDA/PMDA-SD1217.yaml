Core:
  Id: "PMDA-SD1217"
  Status: "Published"
  Version: "1"
Description: "Raise an error when TSVAL is populated with a value that is not a valid\
  \ ISO 8601 duration (time period) for a record where TSPARMCD equals 'AGEMIN' (Planned\
  \ Minimum Age of Subjects)."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "TS"
Requirements:
  Variables:
    All:
    - "TSPARMCD"
Check:
  expression: >-
    TSPARMCD == "AGEMIN" and not empty(TSVAL) and invalid_duration(TSVAL, negative=false)
Outcome:
  Message: "Invalid TSVAL value for AGEMIN: TSVAL must be in ISO 8601 duration format\
    \ (e.g., P18Y) when TSPARMCD equals 'AGEMIN' (Planned Minimum Age of Subjects)."
  Output_Variables:
  - "TSPARMCD"
  - "TSVAL"
Source:
  Message: "Invalid TSVAL value for AGEMIN"
  Description: "TSVAL value must be either ISO 8601 format for time period (e.g.,\
    \ P80Y) or null when TSPARMCD='AGEMIN'."
  Domains: "TS"
  Severity: "Error"
