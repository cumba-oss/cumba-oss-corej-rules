Core:
  Id: "PMDA-SD1064"
  Status: "Published"
  Version: "1"
Description: "Raise an error when ETCD is not unique within the TE dataset."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "TE"
Requirements:
  Variables:
    All:
    - "ETCD"
Check:
  expression: >-
    not is_unique_set([ETCD])
Outcome:
  Message: "Duplicate ETCD value"
  Output_Variables:
  - "ETCD"
Source:
  Message: "Duplicate ETCD value"
  Description: "The value of Element Code (ETCD) variable must be unique within Trial\
    \ Elements (TE) domain."
  Domains: "TE"
  Severity: "Error"
