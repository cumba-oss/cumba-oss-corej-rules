Core:
  Id: "PMDA-SD1001"
  Status: "Published"
  Version: "1"
Description: "Raise an error when SUBJID is not unique within the study (DM dataset)."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "DM"
Check:
  expression: >-
    not is_unique_set([SUBJID, STUDYID])
Outcome:
  Message: "SUBJID is not unique within the study."
  Output_Variables:
  - "STUDYID"
  - "SUBJID"
Source:
  Message: "SUBJID is not unique for each subject within study"
  Description: "The value of Subject Identifier for the Study (SUBJID) variable must\
    \ be unique for each subject within the study."
  Domains: "DM"
  Severity: "Error"
