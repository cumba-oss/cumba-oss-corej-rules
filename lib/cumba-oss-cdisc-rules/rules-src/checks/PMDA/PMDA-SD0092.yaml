Core:
  Id: "PMDA-SD0092"
  Status: "Published"
  Version: "1"
Description: "Raise a warning when ETCD is equal to 'UNPLAN' but SEUPDES is empty\
  \ or not present."
Severity: "Warning"
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "SE"
Requirements:
  Variables:
    All:
    - "ETCD"
Check:
  expression: >-
    ETCD == "UNPLAN" and empty(SEUPDES)
Outcome:
  Message: "SEUPDES is empty or not present when ETCD is equal to 'UNPLAN'."
  Output_Variables:
  - "ETCD"
  - "SEUPDES"
Source:
  Message: "Missing value for SEUPDES when ETCD='UNPLAN'"
  Description: "Description of Unplanned Element (SEUPDES) should be populated when\
    \ subject's experience for a particular period of time is represented as an unplanned\
    \ Element, where Element Code (ETCD) is equal to 'UNPLAN'."
  Domains: "SE"
  Severity: "Warning"
