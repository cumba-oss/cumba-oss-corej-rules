Core:
  Id: "PMDA-SD1242"
  Status: "Published"
  Version: "1"
Description: "Raise a warning when --BDSYCD and --BODSYS do not have a one-to-one\
  \ relationship."
Severity: "Warning"
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "AE"
    - "CE"
    - "MH"
Requirements:
  Variables:
    All:
    - "--BDSYCD"
    - "--BODSYS"
Check:
  expression: >-
    not is_unique_relationship(--BDSYCD, --BODSYS)
Outcome:
  Message: "--BDSYCD and --BODSYS do not have a one-to-one relationship."
  Output_Variables:
  - "--BODSYS"
  - "--BDSYCD"
Source:
  Message: "Inconsistent value for --BODSYS within --BDSYCD"
  Description: "All values of Body System or Organ Class (--BODSYS) should be the\
    \ same for a given value of Body System or Organ Class Code (--BDSYCD)."
  Domains: "AE, CE, MH"
  Severity: "Warning"
