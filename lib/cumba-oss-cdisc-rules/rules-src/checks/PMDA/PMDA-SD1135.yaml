Core:
  Id: "PMDA-SD1135"
  Status: "Published"
  Version: "1"
Description: "Raise a warning when a Study Day variable (--STDY or --ENDY) has a negative\
  \ value in the EC or EX dataset."
Severity: "Warning"
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "EC"
    - "EX"
Check:
  expression: >-
    not empty(--STDY) and var_exists("--STDY") and --STDY < 0 or not empty(--ENDY) and
    var_exists("--ENDY") and --ENDY < 0
Outcome:
  Message: "Negative value for Study Day variable (--STDY or --ENDY)."
  Output_Variables:
  - "--STDY"
  - "--ENDY"
Source:
  Message: "Negative value of Study Day variable"
  Description: "Study Day variables (*DY) value should not be negative in Exposure\
    \ (EX) and Exposure As Collected (EC) datasets."
  Domains: "EC, EX"
  Severity: "Warning"
