Core:
  Id: "PMDA-SD1450"
  Status: "Published"
  Version: "1"
Description: "Raise an error when the Planned Start of Assessment Interval (PPSTINT)\
  \ variable is present in the PP domain but the Planned End of Assessment Interval\
  \ (PPENINT) variable is not present."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "PP"
Check:
  expression: >-
    var_exists("PPSTINT") and not var_exists("PPENINT")
Outcome:
  Message: "--STINT variable is present, but --ENINT variable is not present."
  Output_Variables:
  - "PPSTINT"
Source:
  Message: "Missing --ENINT variable when --STINT variable is present"
  Description: "Planned End of Assessment Interval (--ENINT) variable must be included\
    \ in the domain when Planned Start of Assessment Interval (--STINT) variable is\
    \ present."
  Domains: "PP"
  Severity: "Error"
Standards:
- Organization: "PMDA"
  Standards:
  - Name: "SDTMIG"
    Version: "3.4"
    References:
    - Origin: "PMDA Validation Rules"
      Rule_Identifier:
        Id: "SD1450"
        Version: "1"
      Version: "6.0"
- Organization: "FDA"
  Standards:
  - Name: "SDTMIG"
    Version: "3.4"
    References:
    - Origin: "FDA Validator Rules"
      Rule_Identifier:
        Id: "SD1450"
        Version: "1"
      Version: "1.6"
