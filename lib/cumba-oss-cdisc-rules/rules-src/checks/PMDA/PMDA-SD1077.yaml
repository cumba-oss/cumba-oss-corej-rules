Core:
  Id: "PMDA-SD1077"
  Status: "Published"
  Version: "1"
Description: "Raise a warning when the expected variable EPOCH is not present in a\
  \ subject-level observation-class dataset."
Severity: "Warning"
Executability: "Partially Executable - Possible Underreporting"
Scope:
  Classes:
    Include:
    - "INTERVENTIONS"
    - "FINDINGS"
    - "EVENTS"
  Domains:
    Exclude:
    - "DD"
Check:
  expression: >-
    not var_exists("EPOCH")
Outcome:
  Message: "EPOCH is not present."
Source:
  Message: "Regulatory Expected variable not found"
  Description: "Variables requested by the relevant regulatory agency in policy documents\
    \ should be included in the dataset. E.g., EPOCH."
  Domains: "SPECIAL PURPOSE (-CO, -DM, -SV), INTERVENTIONS (-DX, -SU), FINDINGS (-DO,\
    \ -DU, -SC), EVENTS (-DE, -DT, -MH), FINDINGS ABOUT"
  Severity: "Warning"
