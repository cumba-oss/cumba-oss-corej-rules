Core:
  Id: "PMDA-AD0122"
  Status: "Published"
  Version: "1"
Description: "Raise an error when a variable whose name ends in SDTM (Start Date Time)\
  \ is populated together with its corresponding EDTM (End Date Time) variable and\
  \ the SDTM value is greater than the EDTM value (e.g. TRTSDTM/TRTEDTM, TR01SDTM/TR01EDTM,\
  \ AP01SDTM/AP01EDTM, APERSDTM/APEREDTM)."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "SUBJECT LEVEL ANALYSIS DATASET"
    - "DEVICE LEVEL ANALYSIS DATASET"
    - "BASIC DATA STRUCTURE"
    - "MEDICAL DEVICE BASIC DATA STRUCTURE"
    - "OCCURRENCE DATA STRUCTURE"
    - "MEDICAL DEVICE OCCURRENCE DATA STRUCTURE"
Check:
  expression: >-
    not empty(*SDTM) and not empty(*EDTM) and *SDTM > *EDTM
Outcome:
  Message: "A variable whose name ends in SDTM (Start Date Time) is greater than its\
    \ corresponding EDTM (End Date Time) variable."
  Output_Variables:
  - "*SDTM"
  - "*EDTM"
Source:
  Message: "*SDTM is greater than *EDTM"
  Description: "Any variable ending in SDTM (Start Date Time) must have a value less\
    \ than or equal to its corresponding EDTM (End Date Time) value (e.g., ADSL -\
    \ TRTSDTM, TR01SDTM, AP01SDTM; BDS - APERSDTM)."
  Domains: "ADSL, ADDL, BDS, ADNCA, MDBDS, OCCDS, ADAE, MDOCCDS, ADAMOTHER"
  Severity: "Error"
Standards:
- Organization: "PMDA"
  Standards:
