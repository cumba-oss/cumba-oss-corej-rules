Core:
  Id: "PMDA-AD0135B"
  Status: "Published"
  Version: "1"
Description: "Raise an error when the character Shift (SHIFTy) does not have a single\
  \ consistent value for each unique value of the numeric Shift (SHIFTyN), evaluated\
  \ on rows where Parameter Code (PARAMCD), SHIFTy and SHIFTyN are all populated;\
  \ within a study each SHIFTyN value must map to one SHIFTy value. Applies across\
  \ the basic-data-structure, non-compartmental-analysis and medical-device basic-data-structure\
  \ ADaM structures."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "BASIC DATA STRUCTURE"
    - "MEDICAL DEVICE BASIC DATA STRUCTURE"
Check:
  expression: >-
    not empty(PARAMCD) and not empty(SHIFTy) and not empty(SHIFTyN) and
    has_multiple_values_for(SHIFTy, SHIFTyN, within=PARAMCD)
Outcome:
  Message: "Inconsistent value for SHIFTy"
  Output_Variables:
  - "PARAMCD"
  - "SHIFTy"
  - "SHIFTyN"
wildcards:
  "y":
    min: 1
    max: 99
Source:
  Message: "Inconsistent value for SHIFTy"
  Description: "Within a study, all SHIFTy values must be the same for each unique\
    \ value of SHIFTyN when PARAMCD, SHIFTy, and SHIFTyN variables are populated."
  Domains: "BDS, ADNCA, MDBDS"
  Severity: "Error"
Standards:
- Organization: "PMDA"
  Standards:
  - Name: "ADaMIG"
    Version: "1.3"
    References:
    - Origin: "PMDA Validation Rules"
      Rule_Identifier:
        Id: "AD0135B"
        Version: "1"
      Version: "6.0"
  - Name: "ADaMIG"
    Version: "1.2"
