Core:
  Id: "PMDA-AD0589"
  Status: "Published"
  Version: "1"
Description: "Raise an error when, within a parameter, the Percent Change to Baseline\
  \ Category y (N) (PBCHGCyN) variable does not hold a single consistent value for\
  \ a given value of the Percent Change to Baseline Category y (PBCHGCAy) variable,\
  \ evaluated only over the records where both PBCHGCyN and PBCHGCAy are populated."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "BASIC DATA STRUCTURE"
    - "MEDICAL DEVICE BASIC DATA STRUCTURE"
Requirements:
  Variables:
    All:
    - "PBCHGCyN"
Check:
  expression: >-
    var_exists("PARAMCD") and var_exists("PBCHGCAy") and not empty(PBCHGCAy) and not empty(PBCHGCyN)
    and not empty(PARAMCD) and is_inconsistent_across_dataset(PBCHGCyN, keys=[PARAMCD, PBCHGCAy])
Outcome:
  Message: "Inconsistent value for PBCHGCyN within a unique PARAMCD."
  Output_Variables:
  - "PARAMCD"
  - "PBCHGCAy"
  - "PBCHGCyN"
wildcards:
  "y":
    min: 1
    max: 99
Source:
  Message: "Inconsistent value for PBCHGCyN within a unique PARAMCD"
  Description: "Within a parameter, there should be only a single value of Percent\
    \ Change to Baseline Category y (N) (PBCHGCyN) variable for a given value of Percent\
    \ Change to Baseline Category y (PBCHGCAy) variable, considering only those rows\
    \ on which both variables are populated."
  Domains: "BDS, ADNCA, MDBDS, ADAMOTHER"
  Severity: "Error"
Standards:
- Organization: "PMDA"
  Standards:
  - Name: "ADaMIG"
    Version: "1.3"
    References:
    - Origin: "PMDA Validation Rules"
      Rule_Identifier:
        Id: "AD0589"
        Version: "1"
      Version: "6.0"
  - Name: "ADaMIG"
    Version: "1.2"
    References:
    - Origin: "PMDA Validation Rules"
      Rule_Identifier:
        Id: "AD0589"
        Version: "1"
      Version: "6.0"
