Core:
  Id: "PMDA-AD0349"
  Status: "Published"
  Version: "1"
Description: "Raise an error when the Ratio to Analysis Range y Upper Limit (R2AyHI)\
  \ variable is present in a dataset but the corresponding Analysis Range y Upper\
  \ Limit (AyHI) variable is not present; whenever R2AyHI is included, its companion\
  \ AyHI variable (same range index y) must also be included."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "BASIC DATA STRUCTURE"
    - "MEDICAL DEVICE BASIC DATA STRUCTURE"
Check:
  expression: >-
    var_exists("R2AyHI") and not var_exists("AyHI")
Outcome:
  Message: "AyHI variable is not present when R2AyHI is present"
  Output_Variables:
  - "R2AyHI"
wildcards:
  "y":
    min: 1
    max: 99
Source:
  Message: "AyHI variable is not present when R2AyHI is present"
  Description: "If Ratio to Analysis Range y Upper Limit (R2AyHI) variable is present,\
    \ there must also be a corresponding Analysis Range y Upper Limit (AyHI) variable."
  Domains: "BDS, ADNCA, MDBDS"
  Severity: "Error"
Standards:
- Organization: "PMDA"
  Standards:
  - Name: "ADaMIG"
    Version: "1.3"
    References:
    - Origin: "PMDA Validation Rules"
      Rule_Identifier:
        Id: "AD0349"
        Version: "1"
      Version: "6.0"
  - Name: "ADaMIG"
    Version: "1.2"
    References:
    - Origin: "PMDA Validation Rules"
      Rule_Identifier:
        Id: "AD0349"
        Version: "1"
      Version: "6.0"
