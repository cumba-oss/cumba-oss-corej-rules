Core:
  Id: "PMDA-SD1115"
  Status: "Published"
  Version: "1"
Description: "Raise an error when the TS (Trial Summary) dataset is not present in\
  \ the study."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "ALL"
Check:
  expression: >-
    not ds_exists("TS")
Outcome:
  Message: "The TS (Trial Summary) dataset is not present in the study."
Source:
  Message: "Missing TS dataset"
  Description: "Trial Summary (TS) dataset must be included in every submission."
  Domains: "TS"
  Severity: "Error"
