Core:
  Id: "PMDA-AD0125B"
  Status: "Published"
  Version: "1"
Description: "Raise an error when, within a study, a Parameter Category (PARCATy)\
  \ takes more than one value for the same Parameter Category number (PARCATyN), considering\
  \ only rows on which both PARCATy and PARCATyN are populated."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "BASIC DATA STRUCTURE"
    - "MEDICAL DEVICE BASIC DATA STRUCTURE"
Requirements:
  Variables:
    All:
    - "PARCATy"
Check:
  expression: >-
    var_exists("PARCATyN") and not empty(PARCATyN) and not empty(PARCATy) and
    is_inconsistent_across_dataset(PARCATy, keys=[PARCATyN])
Outcome:
  Message: "Inconsistent value for PARCATy"
  Output_Variables:
  - "PARCATy"
  - "PARCATyN"
wildcards:
  "y":
    min: 1
    max: 99
Source:
  Message: "Inconsistent value for PARCATy"
  Description: "Within a study, all PARCATy values must be the same for each unique\
    \ value of PARCATyN when both variables are populated."
  Domains: "BDS, ADNCA, MDBDS"
  Severity: "Error"
Standards:
- Organization: "PMDA"
  Standards:
  - Name: "ADaMIG"
    Version: "1.3"
    References:
    - Origin: "PMDA Validation Rules"
      Rule_Identifier:
        Id: "AD0125B"
        Version: "1"
      Version: "6.0"
  - Name: "ADaMIG"
    Version: "1.2"
    References:
    - Origin: "PMDA Validation Rules"
      Rule_Identifier:
        Id: "AD0125B"
        Version: "1"
      Version: "6.0"
  - Name: "ADaMIG"
    Version: "1.1"
    References:
    - Origin: "PMDA Validation Rules"
      Rule_Identifier:
        Id: "AD0125B"
        Version: "1"
      Version: "6.0"
