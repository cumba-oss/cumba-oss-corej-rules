Core:
  Id: "PMDA-SD1334"
  Status: "Published"
  Version: "1"
Description: "Raise a warning when the Date/Time of Informed Consent (RFICDTC) is\
  \ after the Subject Reference Start Date/Time (RFSTDTC)."
Severity: "Warning"
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "DM"
Requirements:
  Variables:
    All:
    - "RFSTDTC"
Check:
  expression: >-
    not empty(RFICDTC) and date(RFICDTC) > RFSTDTC
Outcome:
  Message: "RFICDTC is after RFSTDTC"
  Output_Variables:
  - "RFSTDTC"
  - "RFICDTC"
Source:
  Message: "RFICDTC is after RFSTDTC"
  Description: "Date/Time of Informed Consent (RFICDTC) should not be after Subject\
    \ Reference Start Date/Time (RFSTDTC)."
  Domains: "DM"
  Severity: "Warning"
