Core:
  Id: "PMDA-SD1112"
  Status: "Published"
  Version: "1"
Description: "Raise an error when the TA (Trial Arms) dataset is not present in the\
  \ study."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "ALL"
Check:
  expression: >-
    not ds_exists("TA")
Outcome:
  Message: "The TA (Trial Arms) dataset is not present in the study."
Source:
  Message: "Missing TA dataset"
  Description: "Trial Arms (TA) dataset should be included in every submission."
  Domains: "TA"
  Severity: "Error"
