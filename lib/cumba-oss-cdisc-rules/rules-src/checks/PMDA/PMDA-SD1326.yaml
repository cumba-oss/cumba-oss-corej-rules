Core:
  Id: "PMDA-SD1326"
  Status: "Published"
  Version: "1"
Description: "Raise an error when Related Subject or Pool Identifier (RSUBJID) is\
  \ populated and Related Device Identifier (RDEVID) is also populated for the same\
  \ record."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "AP--"
    - "APRELSUB"
Check:
  expression: >-
    not empty(RSUBJID) and not empty(RDEVID)
Outcome:
  Message: "RDEVID is populated when RSUBJID is populated; RSUBJID and RDEVID must\
    \ not both be populated for the same record."
  Output_Variables:
  - "RSUBJID"
  - "RDEVID"
Source:
  Message: "RDEVID is not null when RSUBJID is populated"
  Description: "Related Device Identifier (RDEVID) and Related Subject or Pool Identifier\
    \ (RSUBJID) should not both be populated for the same record."
  Domains: "APDM, APAE, APMH, APRELSUB"
  Severity: "Error"
Standards:
- Organization: "PMDA"
  Standards:
  - Name: "SDTMIG"
    Version: "3.2"
    References:
    - Origin: "PMDA Validation Rules"
      Rule_Identifier:
        Id: "SD1326"
        Version: "1"
      Version: "6.0"
- Organization: "FDA"
  Standards:
  - Name: "SDTMIG"
    Version: "3.2"
    References:
    - Origin: "FDA Validator Rules"
      Rule_Identifier:
        Id: "SD1326"
