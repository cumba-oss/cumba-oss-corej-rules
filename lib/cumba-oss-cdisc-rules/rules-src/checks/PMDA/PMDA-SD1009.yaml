Core:
  Id: "PMDA-SD1009"
  Status: "Published"
  Version: "1"
Description: "Raise an error when the value of Element Code (ETCD) is longer than\
  \ 8 characters."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "SE"
    - "TA"
    - "TE"
Check:
  expression: >-
    len(ETCD) > 8
Outcome:
  Message: "ETCD value length is greater than 8 characters."
  Output_Variables:
  - "ETCD"
Source:
  Message: "Invalid value for ETCD"
  Description: "The value of Element Code (ETCD) should be no more than 8 characters\
    \ in length."
  Domains: "SE, TA, TE"
  Severity: "Error"
