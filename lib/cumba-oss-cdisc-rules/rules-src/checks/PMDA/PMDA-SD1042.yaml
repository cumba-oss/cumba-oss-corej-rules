Core:
  Id: "PMDA-SD1042"
  Status: "Published"
  Version: "1"
Description: "Raise a warning when --OCCUR is 'N' and --STRF or --ENRF is populated\
  \ for a non-occurred event or intervention."
Severity: "Warning"
Executability: "Fully Executable"
Scope:
  Classes:
    Include:
    - "INTERVENTIONS"
    - "EVENTS"
Requirements:
  Variables:
    All:
    - "--OCCUR"
Check:
  expression: >-
    --OCCUR == "N" and (not empty(--STRF) or not empty(--ENRF))
Outcome:
  Message: "--STRF or --ENRF is populated for a non-occurred event or intervention."
  Output_Variables:
  - "--OCCUR"
  - "--STRF"
  - "--ENRF"
Source:
  Message: "Time point for non-occurred event or intervention is provided"
  Description: "Value of Start Relative to Reference Period (--STRF) or End Relative\
    \ to Reference Period (--ENRF) should not be populated when an event or intervention\
    \ is marked as not occurred (--OCCUR='N')."
  Domains: "INTERVENTIONS, EVENTS"
  Severity: "Warning"
