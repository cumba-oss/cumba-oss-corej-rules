Core:
  Id: "PMDA-SD1097"
  Status: "Published"
  Version: "1"
Description: "Raise a warning when the SUPPAE dataset does not contain a treatment-emergent\
  \ flag (no record where QNAM is equal to 'AETRTEM'). The exact QNAM used for the\
  \ treatment-emergent flag is sponsor-defined, so a SUPPAE that carries the flag\
  \ under a different QNAM may be reported in error."
Severity: "Warning"
Executability: "Partially Executable - Possible Overreporting"
Scope:
  Domains:
    Include:
    - "AE"
Operations:
- id: "$aetrtem_count"
  expression: "record_count(QNAM, domain=\"SUPPAE\", filter=filter(QNAM=\"AETRTEM\"\
    ))"
Check:
  expression: >-
    $aetrtem_count < 1
Outcome:
  Message: "SUPPAE does not contain a treatment-emergent flag (no record with QNAM\
    \ equal to 'AETRTEM')."
  Output_Variables:
  - "$aetrtem_count"
Source:
  Message: "No Treatment Emergent info for Adverse Event"
  Description: "A treatment-emergent flag should be included in SUPPAE according to\
    \ the FDA business rule that states, 'A treatment-emergent flag should be submitted'."
  Domains: "AE"
  Severity: "Warning"
