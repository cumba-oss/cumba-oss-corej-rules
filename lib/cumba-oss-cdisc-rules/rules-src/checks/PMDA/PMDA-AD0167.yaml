Core:
  Id: "PMDA-AD0167"
  Status: "Published"
  Version: "1"
Description: "Raise an error when the Baseline Reference Range Indicator (BNRIND)\
  \ variable is present in the dataset but the Baseline Record Flag (ABLFL) variable\
  \ is not present; when BNRIND is used, the baseline record flag identifying the\
  \ baseline record must also be present."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "BASIC DATA STRUCTURE"
    - "MEDICAL DEVICE BASIC DATA STRUCTURE"
Check:
  expression: >-
    var_exists("BNRIND") and not var_exists("ABLFL")
Outcome:
  Message: "BNRIND is present, but ABLFL is not present."
  Output_Variables:
  - "BNRIND"
Source:
  Message: "BNRIND is present, but ABLFL is not present"
  Description: "If Baseline Reference Range Indicator (BNRIND) variable is present,\
    \ then Analysis Reference Range Indicator (ANRIND) and Baseline Record Flag (ABLFL)\
    \ variables must be present."
  Domains: "BDS, ADNCA, MDBDS"
  Severity: "Error"
Standards:
- Organization: "PMDA"
  Standards:
