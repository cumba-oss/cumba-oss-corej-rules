Core:
  Id: "PMDA-SD1151"
  Status: "Published"
  Version: "1"
Description: "Raise an error when IETESTCD is present and IETEST is present and IETESTCD\
  \ does not have the same value across records with the same value of IETEST and\
  \ TIVERS."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "TI"
Requirements:
  Variables:
    All:
    - "IETESTCD"
Check:
  expression: >-
    var_exists("IETEST") and is_inconsistent_across_dataset(IETESTCD, keys=[IETEST, TIVERS])
Outcome:
  Message: "Inconsistent value for IETESTCD within IETEST"
  Output_Variables:
  - "IETESTCD"
  - "IETEST"
  - "TIVERS"
Source:
  Message: "Inconsistent value for IETESTCD within IETEST"
  Description: "All values of Inclusion/Exclusion Criterion Short Name (IETESTCD)\
    \ should be the same for a given value of Inclusion/Exclusion Criterion (IETEST)\
    \ and Protocol Criteria Versions (TIVERS)."
  Domains: "TI"
  Severity: "Error"
Standards:
- Organization: "PMDA"
  Standards:
  - Name: "SDTMIG"
    Version: "3.3"
    References:
    - Origin: "PMDA Validation Rules"
      Rule_Identifier:
        Id: "SD1151"
        Version: "1"
      Version: "6.0"
  - Name: "SDTMIG"
    Version: "3.4"
    References:
    - Origin: "PMDA Validation Rules"
      Rule_Identifier:
        Id: "SD1151"
        Version: "1"
      Version: "6.0"
- Organization: "FDA"
  Standards:
  - Name: "SDTMIG"
    Version: "3.3"
    References:
    - Origin: "FDA Validator Rules"
      Rule_Identifier:
        Id: "SD1151"
        Version: "1"
      Version: "1.6"
  - Name: "SDTMIG"
    Version: "3.4"
