Core:
  Id: "PMDA-AD0586"
  Status: "Published"
  Version: "1"
Description: "Raise an error when, on a record where Percent Change to Baseline (PBCHG),\
  \ Baseline Value (BASE) and Analysis Value (AVAL) are all populated and AVAL is\
  \ non-zero, PBCHG does not equal (BASE minus AVAL) divided by AVAL, expressed as\
  \ a percentage. Records on which any value is missing, or where the divisor is zero,\
  \ are not evaluated."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "BASIC DATA STRUCTURE"
    - "MEDICAL DEVICE BASIC DATA STRUCTURE"
Check:
  expression: >-
    not empty(PBCHG) and PBCHG != (((BASE - AVAL) / AVAL) * 100)
Outcome:
  Message: "PBCHG does not equal (BASE minus AVAL) divided by AVAL, expressed as a\
    \ percentage."
  Output_Variables:
  - "AVAL"
  - "BASE"
  - "PBCHG"
Source:
  Message: "Calculation issue: PBCHG != (BASE - AVAL)/AVAL * 100"
  Description: "When all 3 variables are populated and base &lt;&gt; 0, Percent Change\
    \ to Baseline (PBCHG) must equal the difference of Baseline Value (BASE) minus\
    \ Analysis Value (AVAL) divided by the analysis value (AVAL), expressed as a percentage."
  Domains: "BDS, ADNCA, MDBDS, ADAMOTHER"
  Severity: "Error"
Standards:
- Organization: "PMDA"
  Standards:
  - Name: "ADaMIG"
    Version: "1.3"
    References:
    - Origin: "PMDA Validation Rules"
      Rule_Identifier:
        Id: "AD0586"
        Version: "1"
      Version: "6.0"
  - Name: "ADaMIG"
    Version: "1.2"
    References:
