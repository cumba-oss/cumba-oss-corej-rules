Core:
  Id: "PMDA-SD1280"
  Status: "Published"
  Version: "1"
Description: "Raise a warning when --TOXGR is not present in the dataset but --TOX\
  \ is present."
Severity: "Warning"
Executability: "Fully Executable"
Scope:
  Classes:
    Include:
    - "EVENTS"
    - "FINDINGS"
    - "FINDINGS ABOUT"
Check:
  expression: >-
    not var_exists("--TOXGR") and var_exists("--TOX")
Outcome:
  Message: "--TOX is present when --TOXGR is not present in the dataset."
  Output_Variables:
  - "--TOX"
Source:
  Message: "--TOX variable is present when --TOXGR variable is missing"
  Description: "Toxicity (--TOX) variable should not be present in the domain when\
    \ the Toxicity Grade (--TOXGR) variable is missing."
  Domains: "FINDINGS, EVENTS, FINDINGS ABOUT"
  Severity: "Warning"
