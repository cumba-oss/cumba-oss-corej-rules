Core:
  Id: "PMDA-SD1229"
  Status: "Published"
  Version: "1"
Description: "Raise a warning when a value is not populated for a record whose applicable\
  \ value-level condition (Define-XML VLM) declares the value-level metadata as mandatory."
Severity: "Warning"
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "ALL"
Check:
  expression: >-
    vlm_mandatory(variable_name) == "Yes" and empty(value())
Outcome:
  Message: "The value is not populated although the applicable value-level condition\
    \ in the Define-XML declares it mandatory."
  Output_Variables:
  - "variable_name"
  - "variable_value"
Source:
  Message: "Variable value is null when value-level condition occurs"
  Description: "Variable value must be populated when value level attribute Mandatory='Yes'\
    \ as specified in define.xml file."
  Domains: "ALL"
  Severity: "Warning"
