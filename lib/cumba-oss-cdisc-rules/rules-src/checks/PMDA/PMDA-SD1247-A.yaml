Core:
  Id: "PMDA-SD1247-A"
  Status: "Published"
  Version: "1"
Description: "Raise a warning when the EC dataset contains no dose information at\
  \ all: none of the ECDOSE, ECDOSTXT, ECSTAT, and ECOCCUR variables is present in\
  \ the dataset."
Severity: "Warning"
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "EC"
Check:
  expression: >-
    not var_exists("ECDOSE") and not var_exists("ECDOSTXT") and not var_exists("ECSTAT") and not
    var_exists("ECOCCUR")
Outcome:
  Message: "The EC dataset contains none of ECDOSE, ECDOSTXT, ECSTAT, and ECOCCUR:\
    \ no dose information is recorded anywhere in the dataset."
Source_Proposed:
  Message: "The EC dataset contains none of ECDOSE, ECDOSTXT, ECSTAT, and ECOCCUR:\
    \ no dose information is recorded anywhere in the dataset."
  Description: "The EC dataset contains no dose information at all: none of the ECDOSE,\
    \ ECDOSTXT, ECSTAT, and ECOCCUR variables is present in the dataset."
  Domains: "EC"
  Severity: "Warning"
Source:
  Message: "ECDOSE is not greater than 0 when ECOCCUR does not equal 'N' and ECDOSTXT\
    \ is null"
  Description: "ECDOSE must be greater than zero when ECOCCUR does not equal 'N',\
    \ ECSTAT does not equal 'NOT DONE', and ECDOSTXT is null. ECDOSE must not be set\
    \ to zero (0) as an alternative method for indicating doses not taken, not given,\
    \ or missed."
  Domains: "EC"
  Severity: "Warning"
