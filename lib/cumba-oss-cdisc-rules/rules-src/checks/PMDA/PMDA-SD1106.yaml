Core:
  Id: "PMDA-SD1106"
  Status: "Published"
  Version: "1"
Description: "Raise a warning when the AE (Adverse Events) dataset is not present\
  \ in the study."
Severity: "Warning"
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "ALL"
Check:
  expression: >-
    not ds_exists("AE")
Outcome:
  Message: "The AE (Adverse Events) dataset is not present in the study."
Source:
  Message: "Missing AE dataset"
  Description: "Adverse Events (AE) dataset should be included in every submission."
  Domains: "AE"
  Severity: "Warning"
