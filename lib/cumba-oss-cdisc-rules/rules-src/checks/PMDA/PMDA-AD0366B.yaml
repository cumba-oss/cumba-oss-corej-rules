Core:
  Id: "PMDA-AD0366B"
  Status: "Published"
  Version: "1"
Description: "Raise an error when Date of Randomization (RANDDT) is populated but\
  \ Randomized Population Flag (RANDFL) is not 'Y' on the same subject record."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "SUBJECT LEVEL ANALYSIS DATASET"
    - "DEVICE LEVEL ANALYSIS DATASET"
Requirements:
  Variables:
    All:
    - "RANDDT"
    - "RANDFL"
Check:
  expression: >-
    not empty(RANDDT) and RANDFL != "Y"
Outcome:
  Message: "RANDFL value is not Y when RANDDT is populated"
  Output_Variables:
  - "RANDFL"
  - "RANDDT"
Source:
  Message: "RANDFL value is not Y when RANDDT is populated"
  Description: "Randomized Population Flag (RANDFL) variable value should be 'Y' for\
    \ randomized subject (when Date of Randomization (RANDDT) variable value is populated)."
  Domains: "ADSL, ADDL"
  Severity: "Error"
Standards:
- Organization: "PMDA"
  Standards:
  - Name: "ADaMIG"
    Version: "1.3"
    References:
    - Origin: "PMDA Validation Rules"
      Rule_Identifier:
        Id: "AD0366B"
        Version: "1"
      Version: "6.0"
  - Name: "ADaMIG"
    Version: "1.2"
    References:
    - Origin: "PMDA Validation Rules"
      Rule_Identifier:
        Id: "AD0366B"
        Version: "1"
      Version: "6.0"
  - Name: "ADaMIG"
    Version: "1.1"
