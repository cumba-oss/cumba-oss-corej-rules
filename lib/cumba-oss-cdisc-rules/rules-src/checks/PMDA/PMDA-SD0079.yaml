Core:
  Id: "PMDA-SD0079"
  Status: "Published"
  Version: "1"
Description: "Raise a warning when an Exposure (EX) record, other than a run-in record\
  \ (EPOCH equals 'RUN-IN'), is present for a subject who is not assigned to an Arm\
  \ (ARMCD equals 'NOTASSGN' or 'SCRNFAIL', or ARM is empty)."
Severity: "Warning"
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "EX"
Match_Datasets:
- Keys:
  - "USUBJID"
  Name: "DM"
Check:
  expression: >-
    (not var_exists("EPOCH") or EPOCH != "RUN-IN") and (DM.ARMCD == "NOTASSGN" or DM.ARMCD ==
    "SCRNFAIL" or empty(DM.ARM))
Outcome:
  Message: "An Exposure (EX) record is present for a subject who is not assigned to\
    \ an Arm."
  Output_Variables:
  - "EPOCH"
  - "DM.ARMCD"
  - "!DM.ARM"
Source:
  Message: "EX record is present when subject is not assigned to an arm"
  Description: "Subjects that are not assigned to an Arm (ARMCD='NOTASSGN') or are\
    \ screen failures (ARMCD='SCRNFAIL'), or ARM=null, should not have any Exposure\
    \ records. Run-in records (EPOCH='RUN-IN') are excluded from firing for this validation\
    \ rule."
  Domains: "EX"
  Severity: "Warning"
