Core:
  Id: "PMDA-SD1246"
  Status: "Published"
  Version: "1"
Description: "Raise an error when the Time Point Reference (--TPTREF) variable is\
  \ not present in the dataset while the Planned Elapsed Time from Time Point Ref\
  \ (--ELTM) variable is present."
Executability: "Fully Executable"
Scope:
  Classes:
    Include:
    - "SPECIAL PURPOSE"
    - "INTERVENTIONS"
    - "FINDINGS"
    - "EVENTS"
    - "FINDINGS ABOUT"
  Domains:
    Exclude:
    - "DM"
    - "SE"
    - "SV"
    - "DO"
Check:
  expression: >-
    var_exists("--ELTM") and not var_exists("--TPTREF")
Outcome:
  Message: "--ELTM variable is present, but --TPTREF variable is not present."
  Output_Variables:
  - "--ELTM"
Source:
  Message: "Missing --TPTREF variable when --ELTM variable is present"
  Description: "Time Point Reference (--TPTREF) variable must be included into the\
    \ domain when Planned Elapsed Time from Time Point Ref (--ELTM) variable is present."
  Domains: "SPECIAL PURPOSE (-DM, -SE, -SV), INTERVENTIONS, FINDINGS (-DO), EVENTS,\
    \ FINDINGS ABOUT"
  Severity: "Error"
