Core:
  Id: "PMDA-AD0242B"
  Status: "Published"
  Version: "1"
Description: "Raise an error when Actual Treatment for Period xx (N) (TRTxxAN) does\
  \ not have the same value across records that share a value of Actual Treatment\
  \ for Period xx (TRTxxA); within a study, TRTxxAN must be consistent for each TRTxxA\
  \ value when both variables are populated."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "SUBJECT LEVEL ANALYSIS DATASET"
    - "DEVICE LEVEL ANALYSIS DATASET"
Requirements:
  Variables:
    All:
    - "TRTxxAN"
Check:
  expression: >-
    var_exists("TRTxxA") and not empty(TRTxxA) and not empty(TRTxxAN) and
    is_inconsistent_across_dataset(TRTxxAN, keys=[TRTxxA])
Outcome:
  Message: "Inconsistent value for TRTxxAN within TRTxxA."
  Output_Variables:
  - "TRTxxA"
  - "TRTxxAN"
wildcards:
  xx:
    min: 1
    max: 99
Source:
  Message: "Inconsistent value for TRTxxAN"
  Description: "Within a study, all Actual Treatment for Period xx (N) (TRTxxAN) variable\
    \ values must be the same for each unique value of Actual Treatment for Period\
    \ xx (TRTxxA) variable when both variables are populated."
  Domains: "ADSL, ADDL"
  Severity: "Error"
Standards:
- Organization: "PMDA"
  Standards:
  - Name: "ADaMIG"
    Version: "1.3"
    References:
    - Origin: "PMDA Validation Rules"
      Rule_Identifier:
        Id: "AD0242B"
        Version: "1"
      Version: "6.0"
  - Name: "ADaMIG"
    Version: "1.2"
    References:
    - Origin: "PMDA Validation Rules"
      Rule_Identifier:
        Id: "AD0242B"
        Version: "1"
      Version: "6.0"
