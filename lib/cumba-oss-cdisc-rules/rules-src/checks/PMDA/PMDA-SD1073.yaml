Core:
  Id: "PMDA-SD1073"
  Status: "Published"
  Version: "1"
Description: "Raise an error when any of the IG-prohibited qualifiers AEOCCUR, AESTAT\
  \ or AEREASND is present in the AE dataset."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "AE"
Check:
  expression: >-
    var_exists("AEOCCUR") or var_exists("AESTAT") or var_exists("AEREASND")
Outcome:
  Message: "An IG-prohibited variable (AEOCCUR, AESTAT or AEREASND) is present in\
    \ the AE dataset."
  Output_Variables:
  - "AEOCCUR"
  - "AESTAT"
  - "AEREASND"
Source:
  Message: "Variable prohibited for use in SDTM"
  Description: "Variables described in IG as inappropriate for usage must be not included\
    \ in the dataset."
  Domains: "ALL"
  Severity: "Error"
