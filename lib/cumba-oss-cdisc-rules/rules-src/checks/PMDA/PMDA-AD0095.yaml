Core:
  Id: "PMDA-AD0095"
  Status: "Published"
  Version: "1"
Description: "Raise an error when, within a study, the Actual Treatment (N) (TRTAN)\
  \ does not have a single consistent value for each unique value of Actual Treatment\
  \ (TRTA). All TRTAN values must be the same for each unique value of TRTA when the\
  \ primary variable TRTA is populated."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "ALL"
Requirements:
  Variables:
    All:
    - "TRTA"
    - "TRTAN"
Check:
  expression: >-
    not empty(TRTA) and is_inconsistent_across_dataset(TRTAN, keys=[TRTA])
Outcome:
  Message: "Inconsistent value for TRTAN: TRTAN is not the same value across records\
    \ with the same value of TRTA."
  Output_Variables:
  - "TRTA"
  - "TRTAN"
Source:
  Message: "Inconsistent value for TRTAN"
  Description: "Within a study, all TRTAN values must be the same for each unique\
    \ value of TRTA when the primary variable TRTA is populated."
  Domains: "BDS, ADAMOTHER"
  Severity: "Error"
Standards:
- Organization: "PMDA"
  Standards:
  - Name: "ADaMIG"
    Version: "1.0"
    References:
    - Origin: "PMDA Validation Rules"
      Rule_Identifier:
        Id: "AD0095"
        Version: "1"
      Version: "6.0"
