Core:
  Id: "PMDA-SD0022"
  Status: "Published"
  Version: "1"
Description: "Raise a warning when no Start Time-Point variable (--STDTC, --STRF,\
  \ or --STRTPT) is populated and the event/intervention is not excepted by --OCCUR\
  \ equals 'N' or a populated --STAT."
Severity: "Warning"
Executability: "Fully Executable"
Scope:
  Classes:
    Include:
    - "INTERVENTIONS"
    - "EVENTS"
Check:
  expression: >-
    empty(--STDTC) and empty(--STRF) and empty(--STRTPT) and (not var_exists("--OCCUR") or --OCCUR
    != "N") and empty(--STAT)
Outcome:
  Message: "No Start Time-Point variable (--STDTC, --STRF, or --STRTPT) is populated."
  Output_Variables:
  - "!--STDTC"
  - "!--STRF"
  - "!--STRTPT"
  - "--OCCUR"
  - "!--STAT"
Source:
  Message: "Missing Start Time-Point value"
  Description: "One Start Time-Point variable is expected to be populated when an\
    \ event or intervention occurred. (E.g., Start Date/Time of Event or Intervention\
    \ (--STDTC), or Start Relative to Reference Period (--STRF), or Start Relative\
    \ to Reference Period (--STRTPT) should not be missing, or Occurrence (--OCCUR)\
    \ = 'N' or Completion Status (--STAT) != '')."
  Domains: "INTERVENTIONS, EVENTS"
  Severity: "Warning"
