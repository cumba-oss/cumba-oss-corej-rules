Core:
  Id: "PMDA-SD1107"
  Status: "Published"
  Version: "1"
Description: "Raise a warning when the LB (Laboratory Test Results) dataset is not\
  \ present in the study."
Severity: "Warning"
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "ALL"
Check:
  expression: >-
    not ds_exists("LB")
Outcome:
  Message: "The LB (Laboratory Test Results) dataset is not present in the study."
Source:
  Message: "Missing LB dataset"
  Description: "Lab Test Results (LB) dataset should be included in every submission."
  Domains: "LB"
  Severity: "Warning"
