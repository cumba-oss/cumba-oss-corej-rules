Core:
  Id: "PMDA-SD2231"
  Status: "Published"
  Version: "1"
Description: "Raise a warning when the study type equals 'INTERVENTIONAL' and the\
  \ Trial Summary (TS) dataset does not contain a record where TSPARMCD equals 'INTTYPE'\
  \ (Intervention Type)."
Severity: "Warning"
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "TS"
Operations:
- id: "$STYPE_INTERVENTIONAL"
  expression: "record_count(filter=filter(TSPARMCD=\"STYPE\", TSVAL=\"INTERVENTIONAL\"\
    ))"
- id: "$inttype_count"
  expression: "record_count(filter=filter(TSPARMCD=\"INTTYPE\"))"
Check:
  expression: >-
    $STYPE_INTERVENTIONAL >= 1 and $inttype_count == 0
Outcome:
  Message: "Missing INTTYPE Trial Summary Parameter: a 'Intervention Type' (INTTYPE)\
    \ record must be present in the Trial Summary (TS) domain."
  Output_Variables:
  - "$STYPE_INTERVENTIONAL"
  - "$inttype_count"
Source:
  Message: "Missing INTTYPE Trial Summary Parameter"
  Description: "'Intervention Type' (INTTYPE) record must be populated in Trial Summary\
    \ (TS) domain when study type is 'INTERVENTIONAL'. It is expected for SDTM IG\
    \ v3.1.2 data and required for data in all more recent SDTM versions."
  Domains: "TS"
  Severity: "Warning"
