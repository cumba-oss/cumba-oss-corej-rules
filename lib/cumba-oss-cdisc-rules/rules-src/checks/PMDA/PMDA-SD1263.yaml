Core:
  Id: "PMDA-SD1263"
  Status: "Published"
  Version: "1"
Description: "Raise a warning when a microorganism has been identified (MBTESTCD equal\
  \ to 'ORGANISM') but the Result Category (MBRESCAT) is not populated, excluding\
  \ records where MBSTRESC equals 'NO GROWTH' or MBMETHOD equals 'GRAM STAIN'."
Severity: "Warning"
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "MB"
Requirements:
  Variables:
    All:
    - "MBRESCAT"
    - "MBTESTCD"
    - "MBMETHOD"
Check:
  expression: >-
    MBTESTCD == "ORGANISM" and not equalsIgnoreCase(MBSTRESC, "NO GROWTH") and MBMETHOD !=
    "GRAM STAIN" and empty(MBRESCAT)
Outcome:
  Message: "MBRESCAT is empty when MBTESTCD equals 'ORGANISM'."
  Output_Variables:
  - "MBTESTCD"
  - "MBSTRESC"
  - "MBRESCAT"
  - "MBMETHOD"
Source:
  Message: "MBRESCAT is null when MBTESTCD = 'ORGANISM'"
  Description: "MBRESCAT is expected to be populated in all records where a microorganism\
    \ has been identified (MBTESTCD = 'ORGANISM'), excluding records where MBSTRESC\
    \ equals 'NO GROWTH' or MBMETHOD equals 'GRAM STAIN'."
  Domains: "MB"
  Severity: "Warning"
