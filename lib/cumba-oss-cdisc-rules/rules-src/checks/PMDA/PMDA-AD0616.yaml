Core:
  Id: "PMDA-AD0616"
  Status: "Published"
  Version: "1"
Description: "Raise an error when the Treatment Compliance (%) Group y (TRCMPGy) variable\
  \ does not have a single value for a given value of its corresponding Treatment\
  \ Compliance (%) Group y (N) (TRCMPGyN) variable, evaluated over the records where\
  \ both variables are populated."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "SUBJECT LEVEL ANALYSIS DATASET"
    - "DEVICE LEVEL ANALYSIS DATASET"
Requirements:
  Variables:
    All:
    - "TRCMPGy"
Check:
  expression: >-
    var_exists("TRCMPGyN") and not empty(TRCMPGy) and not empty(TRCMPGyN) and
    is_inconsistent_across_dataset(TRCMPGy, keys=[TRCMPGyN])
Outcome:
  Message: "Inconsistent value for TRCMPGy"
  Output_Variables:
  - "TRCMPGy"
  - "TRCMPGyN"
wildcards:
  "y":
    min: 1
    max: 99
Source:
  Message: "Inconsistent value for TRCMPGy"
  Description: "There should be only a single value of Treatment Compliance (%) Group\
    \ y (TRCMPGy) variable for a given value of Treatment Compliance (%) Group y (N)\
    \ (TRCMPGyN) variable, considering only those rows on which both variables are\
    \ populated."
  Domains: "ADSL, ADDL"
  Severity: "Error"
Standards:
- Organization: "PMDA"
  Standards:
  - Name: "ADaMIG"
    Version: "1.3"
    References:
    - Origin: "PMDA Validation Rules"
      Rule_Identifier:
        Id: "AD0616"
        Version: "1"
      Version: "6.0"
  - Name: "ADaMIG"
    Version: "1.2"
    References:
    - Origin: "PMDA Validation Rules"
      Rule_Identifier:
        Id: "AD0616"
        Version: "1"
      Version: "6.0"
  - Name: "ADaMIG"
    Version: "1.1"
    References:
    - Origin: "PMDA Validation Rules"
      Rule_Identifier:
        Id: "AD0616"
        Version: "1"
      Version: "6.0"
