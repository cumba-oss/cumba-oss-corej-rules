Core:
  Id: "PMDA-SD2226"
  Status: "Published"
  Version: "1"
Description: "Raise a warning when the Trial Summary (TS) dataset does not contain\
  \ a record where TSPARMCD equals 'DCUTDTC' (Data Cutoff Date)."
Severity: "Warning"
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "TS"
Operations:
- id: "$dcutdtc_count"
  expression: "record_count(filter=filter(TSPARMCD=\"DCUTDTC\"))"
Check:
  expression: >-
    $dcutdtc_count == 0
Outcome:
  Message: "Missing DCUTDTC Trial Summary Parameter: a 'Data Cutoff Date' (DCUTDTC)\
    \ record must be present in the Trial Summary (TS) domain."
  Output_Variables:
  - "$dcutdtc_count"
Source:
  Message: "Missing DCUTDTC Trial Summary Parameter"
  Description: "'Data Cutoff Date' (DCUTDTC) record must be populated in Trial Summary\
    \ (TS) domain. It is expected for SDTM IG v3.1.2 data and required for data in\
    \ all more recent SDTM versions."
  Domains: "TS"
  Severity: "Warning"
