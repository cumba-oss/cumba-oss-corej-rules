Core:
  Id: "PMDA-AD0231"
  Status: "Published"
  Version: "1"
Description: "Raise an error when, within a study, the Planned Pooled Treatment y\
  \ for Period xx (TRxxPGy) variable does not hold a single consistent value for each\
  \ unique populated value of the Planned Treatment for Period xx (TRTxxP) variable."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "SUBJECT LEVEL ANALYSIS DATASET"
    - "DEVICE LEVEL ANALYSIS DATASET"
Requirements:
  Variables:
    All:
    - "TRxxPGy"
Check:
  expression: >-
    var_exists("TRTxxP") and not empty(TRTxxP) and is_inconsistent_across_dataset(TRxxPGy,
    keys=[TRTxxP])
Outcome:
  Message: "Inconsistent value for TRxxPGy within a unique TRTxxP"
  Output_Variables:
  - "TRTxxP"
  - "TRxxPGy"
wildcards:
  xx:
    min: 1
    max: 99
  "y":
    min: 1
    max: 99
Source:
  Message: "Inconsistent value for TRxxPGy within a unique TRTxxP"
  Description: "Within a study, all Planned Pooled Treatment y for Period xx (TRxxPGy)\
    \ variable values must be the same for each unique value of Planned Treatment\
    \ for Period xx (TRTxxP) variable when TRTxxP is populated. TRxxPGy is a more\
    \ general pooled treatment for TRTxxP, therefore it may be used for many TRTxxP."
  Domains: "ADSL, ADDL"
  Severity: "Error"
Standards:
- Organization: "PMDA"
  Standards:
  - Name: "ADaMIG"
    Version: "1.3"
    References:
    - Origin: "PMDA Validation Rules"
      Rule_Identifier:
        Id: "AD0231"
        Version: "1"
      Version: "6.0"
  - Name: "ADaMIG"
    Version: "1.2"
    References:
    - Origin: "PMDA Validation Rules"
      Rule_Identifier:
        Id: "AD0231"
        Version: "1"
      Version: "6.0"
  - Name: "ADaMIG"
    Version: "1.1"
    References:
    - Origin: "PMDA Validation Rules"
      Rule_Identifier:
        Id: "AD0231"
        Version: "1"
      Version: "6.0"
  - Name: "ADaMIG"
    Version: "1.0"
    References:
