Core:
  Id: "PMDA-AD0070"
  Status: "Published"
  Version: "1"
Description: "Raise an error when the numeric Actual Pooled Treatment y for Period\
  \ xx variable TRxxAGyN is present in the dataset but its corresponding character\
  \ variable TRxxAGy is not present."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "SUBJECT LEVEL ANALYSIS DATASET"
    - "DEVICE LEVEL ANALYSIS DATASET"
Check:
  expression: >-
    var_exists("TRxxAGyN") and not var_exists("TRxxAGy")
Outcome:
  Message: "TRxxAGyN is present, but TRxxAGy is not present."
  Output_Variables:
  - "TRxxAGyN"
wildcards:
  xx:
    min: 1
    max: 99
  "y":
    min: 1
    max: 99
Source:
  Message: "TRxxAGyN is present, but TRxxAGy is not present"
  Description: "If Actual Pooled Treatment y for Period xx (TRxxAGyN) numeric variable\
    \ is present, there must be a corresponding Actual Pooled Treatment y for Period\
    \ xx (TRxxAGy) character variable."
  Domains: "ADSL, ADDL"
  Severity: "Error"
Standards:
- Organization: "PMDA"
  Standards:
  - Name: "ADaMIG"
    Version: "1.3"
    References:
    - Origin: "PMDA Validation Rules"
      Rule_Identifier:
        Id: "AD0070"
        Version: "1"
      Version: "6.0"
  - Name: "ADaMIG"
    Version: "1.2"
    References:
    - Origin: "PMDA Validation Rules"
      Rule_Identifier:
        Id: "AD0070"
        Version: "1"
      Version: "6.0"
  - Name: "ADaMIG"
    Version: "1.1"
    References:
    - Origin: "PMDA Validation Rules"
      Rule_Identifier:
        Id: "AD0070"
        Version: "1"
      Version: "6.0"
  - Name: "ADaMIG"
    Version: "1.0"
    References:
    - Origin: "PMDA Validation Rules"
      Rule_Identifier:
        Id: "AD0070"
        Version: "1"
      Version: "6.0"
