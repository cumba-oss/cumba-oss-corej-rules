Core:
  Id: "PMDA-SD0034"
  Status: "Published"
  Version: "1"
Description: "Raise a warning when --ELTM (Planned Elapsed Time from Time Point Reference)\
  \ is populated but --TPTREF (Time Point Reference) is not present or is empty."
Severity: "Warning"
Executability: "Fully Executable"
Scope:
  Classes:
    Include:
    - "INTERVENTIONS"
    - "EVENTS"
    - "FINDINGS"
    - "FINDINGS ABOUT"
  Domains:
    Exclude:
    - "DS"
Requirements:
  Variables:
    All:
    - "--ELTM"
Check:
  expression: >-
    not empty(--ELTM) and empty(--TPTREF)
Outcome:
  Message: "--TPTREF is empty when --ELTM is populated."
  Output_Variables:
  - "--ELTM"
  - "--TPTREF"
Source:
  Message: "Missing value for --TPTREF when --ELTM is provided"
  Description: "Time Point Reference (--TPTREF) should not be null when Planned Elapsed\
    \ Time from Time Point Ref (--ELTM) is populated."
  Domains: "CO, INTERVENTIONS, FINDINGS, EVENTS (-DS), FINDINGS ABOUT"
  Severity: "Warning"
