Core:
  Id: "PMDA-AD0499"
  Status: "Published"
  Version: "1"
Description: "Raise an error when the Subperiod within Period (ASPER) variable is\
  \ present in a dataset but the Period (APERIOD) variable is not present. If ASPER\
  \ is used in a dataset, APERIOD must also be present in that dataset."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "ALL"
Check:
  expression: >-
    var_exists("ASPER") and not var_exists("APERIOD")
Outcome:
  Message: "ASPER is present and APERIOD is not present."
  Output_Variables:
  - "ASPER"
Source:
  Message: "ASPER is present and APERIOD is not present"
  Description: "If Subperiod within Period (ASPER) variable is used in a dataset,\
    \ Period (APERIOD) variable must also be present in that dataset."
  Domains: "BDS, ADNCA, MDBDS, OCCDS, ADAE, MDOCCDS, ADAMOTHER"
  Severity: "Error"
Standards:
- Organization: "PMDA"
  Standards:
  - Name: "ADaMIG"
    Version: "1.3"
    References:
    - Origin: "PMDA Validation Rules"
      Rule_Identifier:
        Id: "AD0499"
        Version: "1"
      Version: "6.0"
  - Name: "ADaMIG"
    Version: "1.2"
    References:
    - Origin: "PMDA Validation Rules"
      Rule_Identifier:
        Id: "AD0499"
        Version: "1"
      Version: "6.0"
