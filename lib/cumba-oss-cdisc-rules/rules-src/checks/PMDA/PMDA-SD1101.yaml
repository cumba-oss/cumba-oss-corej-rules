Core:
  Id: "PMDA-SD1101"
  Status: "Published"
  Version: "1"
Description: "Raise an error when End Relative to Reference Time Point (--ENRTPT)\
  \ is present in the dataset but End Reference Time Point (--ENTPT) is not present\
  \ in the dataset."
Executability: "Fully Executable"
Scope:
  Classes:
    Include:
    - "SPECIAL PURPOSE"
    - "INTERVENTIONS"
    - "FINDINGS"
    - "EVENTS"
    - "FINDINGS ABOUT"
  Domains:
    Exclude:
    - "CO"
    - "DM"
Check:
  expression: >-
    var_exists("--ENRTPT") and not var_exists("--ENTPT")
Outcome:
  Message: "--ENTPT variable is not present when --ENRTPT variable is present."
  Output_Variables:
  - "--ENRTPT"
Source:
  Message: "Missing --ENTPT variable when --ENRTPT variable is present"
  Description: "End Reference Time Point (--ENTPT) variable must be included into\
    \ the domain when End Relative to Reference Time Point (--ENRTPT) variable is\
    \ present."
  Domains: "SPECIAL PURPOSE (-CO, -DM), INTERVENTIONS, FINDINGS, EVENTS, FINDINGS\
    \ ABOUT"
  Severity: "Error"
