Core:
  Id: "PMDA-SD1073-A"
  Status: "Published"
  Version: "1"
Description: "Raise an error when any of the IG-prohibited qualifiers TRLOC, TRLAT,\
  \ TRDIR or TRPORTOT is present in the TR dataset."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "TR"
Check:
  expression: >-
    var_exists("TRLOC") or var_exists("TRLAT") or var_exists("TRDIR") or var_exists("TRPORTOT")
Outcome:
  Message: "An IG-prohibited variable (TRLOC, TRLAT, TRDIR or TRPORTOT) is present\
    \ in the TR dataset."
  Output_Variables:
  - "TRLOC"
  - "TRLAT"
  - "TRDIR"
  - "TRPORTOT"
Source_Proposed:
  Message: "An IG-prohibited variable (TRLOC, TRLAT, TRDIR or TRPORTOT) is present\
    \ in the TR dataset."
  Description: "Any of the IG-prohibited qualifiers TRLOC, TRLAT, TRDIR or TRPORTOT\
    \ is present in the TR dataset."
  Domains: "TR"
  Severity: "Error"
Source:
  Message: "Variable prohibited for use in SDTM"
  Description: "Variables described in IG as inappropriate for usage must be not included\
    \ in the dataset."
  Domains: "ALL"
  Severity: "Error"
