Core:
  Id: "PMDA-SD0050"
  Status: "Published"
  Version: "1"
Description: "Raise a warning when --ENRTPT (End Relative to Reference Time Point)\
  \ is populated but --ENTPT (End Reference Time Point) is not present or is empty."
Severity: "Warning"
Executability: "Fully Executable"
Scope:
  Classes:
    Include:
    - "SPECIAL PURPOSE"
    - "INTERVENTIONS"
    - "FINDINGS"
    - "EVENTS"
    - "FINDINGS ABOUT"
  Domains:
    Exclude:
    - "CO"
    - "DM"
Requirements:
  Variables:
    All:
    - "--ENRTPT"
Check:
  expression: >-
    not empty(--ENRTPT) and empty(--ENTPT)
Outcome:
  Message: "--ENTPT is empty or not present when --ENRTPT is populated."
  Output_Variables:
  - "--ENRTPT"
  - "--ENTPT"
Source:
  Message: "Missing value for --ENTPT when --ENRTPT is populated"
  Description: "End Reference Time Point (--ENTPT) must not be null when End Relative\
    \ to Reference Time Point (--ENRTPT) is provided."
  Domains: "SPECIAL PURPOSE (-CO, -DM), INTERVENTIONS, FINDINGS, EVENTS, FINDINGS\
    \ ABOUT"
  Severity: "Warning"
