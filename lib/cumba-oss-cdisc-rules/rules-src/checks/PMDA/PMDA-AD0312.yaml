Core:
  Id: "PMDA-AD0312"
  Status: "Published"
  Version: "1"
Description: "Raise an error when a populated SMQzzSC (Standardized MedDRA Query scope)\
  \ value is neither BROAD nor NARROW."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "OCCURRENCE DATA STRUCTURE"
  Subclasses:
    Include:
    - "ADVERSE EVENT"
Check:
  expression: >-
    varname() =~ /^SMQ(0[1-9]|[1-9][0-9])SC$/ and not empty(value()) and value() not in ["BROAD",
    "NARROW"]
Outcome:
  Message: "SMQzzSC value must be BROAD, NARROW or empty."
  Output_Variables:
  - "variable_name"
  - "variable_value"
Source:
  Message: "SMQzzSC value != BROAD, NARROW or null"
  Description: "Standardized MedDRA Query Scope (SMQzzSC) variable value must be BROAD,\
    \ NARROW, or NULL. The search strategy for SMQs can be narrow or broad. The preferred\
    \ terms that are narrow in scope have high specificity for identifying events\
    \ of interest while the broad terms have high sensitivity. By definition, all\
    \ narrow terms are also considered within the broad score. Therefore, to summarize\
    \ all broad terms, terms with either narrow OR broad would be considered. Will\
    \ be null for terms that do not meet the criteria. Conditional on whether SMQ\
    \ analysis is done."
  Domains: "OCCDS, ADAE, MDOCCDS"
  Severity: "Error"
