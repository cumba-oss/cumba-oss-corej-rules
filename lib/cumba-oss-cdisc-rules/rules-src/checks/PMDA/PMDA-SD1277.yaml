Core:
  Id: "PMDA-SD1277"
  Status: "Published"
  Version: "1"
Description: "Raise an error when --TERM is equal to 'MULTIPLE'."
Executability: "Fully Executable"
Scope:
  Classes:
    Include:
    - "EVENTS"
Requirements:
  Variables:
    All:
    - "--TERM"
Check:
  expression: >-
    --TERM == "MULTIPLE"
Outcome:
  Message: "--TERM is equal to 'MULTIPLE'."
  Output_Variables:
  - "--TERM"
Source:
  Message: "--TERM equals 'MULTIPLE'"
  Description: "Reported Term variables (--TERM) should not be populated with values\
    \ of 'MULTIPLE'."
  Domains: "EVENTS"
  Severity: "Error"
