Core:
  Id: "PMDA-SD1292"
  Status: "Published"
  Version: "1"
Description: "Raise a warning when Start Reference Time Point (--STTPT) is populated\
  \ but Start Relative to Reference Time Point (--STRTPT) is not populated."
Severity: "Warning"
Executability: "Fully Executable"
Scope:
  Classes:
    Include:
    - "SPECIAL PURPOSE"
    - "INTERVENTIONS"
    - "FINDINGS"
    - "EVENTS"
    - "FINDINGS ABOUT"
  Domains:
    Exclude:
    - "DM"
    - "SE"
    - "SV"
    - "DO"
Requirements:
  Variables:
    All:
    - "--STRTPT"
    - "--STTPT"
Check:
  expression: >-
    not empty(--STTPT) and empty(--STRTPT)
Outcome:
  Message: "--STRTPT is empty when --STTPT is populated."
  Output_Variables:
  - "--STRTPT"
  - "--STTPT"
Source:
  Message: "Missing value for --STRTPT when --STTPT is populated"
  Description: "Start Relative to Reference Time Point (--STRTPT) must be populated\
    \ when Start Reference Time Point (--STTPT) is populated."
  Domains: "SPECIAL PURPOSE (-DM, -SE, -SV), INTERVENTIONS, FINDINGS (-DO), EVENTS,\
    \ FINDINGS ABOUT"
  Severity: "Warning"
