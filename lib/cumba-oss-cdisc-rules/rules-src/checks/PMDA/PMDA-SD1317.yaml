Core:
  Id: "PMDA-SD1317"
  Status: "Published"
  Version: "1"
Description: "Raise an error when a Disposition (DS) record with Standardized Disposition\
  \ Term (DSDECOD) equal to 'DEATH' has a Start Date/Time of Event (DSSTDTC) that\
  \ is not equal to the subject's Date/Time of Death (DTHDTC) in the Demographics\
  \ (DM) dataset."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "DS"
Requirements:
  Variables:
    All:
    - "DSDECOD"
Match_Datasets:
- Keys:
  - "USUBJID"
  Name: "DM"
Check:
  expression: >-
    not empty(DSSTDTC) and DSDECOD == "DEATH" and not empty(DM.DTHDTC) and date(DSSTDTC) !=
    DM.DTHDTC
Outcome:
  Message: "DSDECOD equals 'DEATH' but DSSTDTC is not equal to DTHDTC in the DM dataset."
  Output_Variables:
  - "DSDECOD"
  - "DSSTDTC"
  - "DM.DTHDTC"
Source:
  Message: "DSSTDTC for DEATH record is not the same as DM.DTHDTC"
  Description: "DEATH records (DSDECOD='DEATH') in the Disposition (DS) domain should\
    \ have Start Date of Event (DSSTDTC) equal to subject's Date/Time of Death (DTHDTC)\
    \ populated in the Demographics (DM) domain. Subject's Date/Time of Death info\
    \ should be consistent across all domains."
  Domains: "DS"
  Severity: "Error"
