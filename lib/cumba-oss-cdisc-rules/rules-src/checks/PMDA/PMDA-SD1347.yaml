        Version: "1"
      Version: "6.0"
  - Name: "SDTMIG"
    Version: "3.4"
    References:
    - Origin: "PMDA Validation Rules"
      Rule_Identifier:
        Id: "SD1347"
        Version: "1"
      Version: "6.0"
- Organization: "FDA"
  Standards:
