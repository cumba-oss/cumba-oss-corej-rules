Core:
  Id: "PMDA-SD1293"
  Status: "Published"
  Version: "1"
Description: "Raise a warning when --REASND is present but --PRESP is not present."
Severity: "Warning"
Executability: "Fully Executable"
Scope:
  Classes:
    Include:
    - "EVENTS"
    - "INTERVENTIONS"
  Domains:
    Exclude:
    - "DS"
    - "DV"
    - "DX"
    - "EX"
Check:
  expression: >-
    not var_exists("--PRESP") and var_exists("--REASND")
Outcome:
  Message: "--REASND is present when --PRESP is not present."
  Output_Variables:
  - "--REASND"
Source:
  Message: "--REASND variable is present when --PRESP variable is missing"
  Description: "Reason Not Done (--REASND) variable should not be present in the domain\
    \ when the Pre-specified (--PRESP) variable is missing."
  Domains: "INTERVENTIONS (-DX, -EX), EVENTS (-DS, -DV)"
  Severity: "Warning"
