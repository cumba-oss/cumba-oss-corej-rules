Core:
  Id: "PMDA-SD0019"
  Status: "Published"
  Version: "1"
Description: "Raise an error when a Parameter (--PARM) value is more than 40 characters\
  \ in length."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "DI"
    - "TS"
Check:
  expression: >-
    len(--PARM) > 40
Outcome:
  Message: "--PARM value length is greater than 40 characters."
  Output_Variables:
  - "--PARMCD"
  - "--PARM"
Source:
  Message: "Invalid value for --PARM variable"
  Description: "The value of Parameter (--PARM) variable should be no more than 40\
    \ characters in length."
  Domains: "TS, STUDY REFERENCE"
  Severity: "Error"
