Core:
  Id: "PMDA-AD0481"
  Status: "Published"
  Version: "1"
Description: "Raise an error when the Stratification Factor w Value from Verification\
  \ Source (N) (STRATwVN) variable does not have a single value for a given value\
  \ of its corresponding Stratification Factor w Value from Verification Source (STRATwV)\
  \ variable, evaluated over the records where both variables are populated."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "SUBJECT LEVEL ANALYSIS DATASET"
    - "DEVICE LEVEL ANALYSIS DATASET"
Requirements:
  Variables:
    All:
    - "STRATwVN"
Check:
  expression: >-
    var_exists("STRATwV") and not empty(STRATwV) and not empty(STRATwVN) and
    is_inconsistent_across_dataset(STRATwVN, keys=[STRATwV])
Outcome:
  Message: "Inconsistent value for STRATwVN within STRATwV."
  Output_Variables:
  - "STRATwV"
  - "STRATwVN"
wildcards:
  w:
    min: 1
    max: 9
Source:
  Message: "Inconsistent value for STRATwVN"
  Description: "There should be only a single value of Strat Fact w Val from Verif\
    \ Source (N) (STRATwVN) variable for a given value of Strat Factor w Value from\
    \ Verif Source (STRATwV) variable, considering only those rows on which both variables\
    \ are populated."
  Domains: "ADSL, ADDL"
  Severity: "Error"
Standards:
- Organization: "PMDA"
  Standards:
  - Name: "ADaMIG"
    Version: "1.3"
    References:
    - Origin: "PMDA Validation Rules"
      Rule_Identifier:
        Id: "AD0481"
        Version: "1"
      Version: "6.0"
  - Name: "ADaMIG"
    Version: "1.2"
    References:
    - Origin: "PMDA Validation Rules"
      Rule_Identifier:
        Id: "AD0481"
        Version: "1"
      Version: "6.0"
