Core:
  Id: "PMDA-SD1091"
  Status: "Published"
  Version: "1"
Description: "Raise a warning when --ENDTC is present in a dataset, but --ENDY is\
  \ not present."
Severity: "Warning"
Executability: "Fully Executable"
Scope:
  Classes:
    Include:
    - "SPECIAL PURPOSE"
    - "INTERVENTIONS"
    - "FINDINGS"
    - "EVENTS"
    - "FINDINGS ABOUT"
  Domains:
    Exclude:
    - "CO"
    - "DM"
    - "DO"
    - "MH"
    - "SU"
Check:
  expression: >-
    var_exists("--ENDTC") and not var_exists("--ENDY")
Outcome:
  Message: "--ENDY variable is not present when --ENDTC variable is present."
  Output_Variables:
  - "--ENDTC"
Source:
  Message: "Missing --ENDY variable when --ENDTC variable is present"
  Description: "Study Day of End (--ENDY) variable should be included into dataset\
    \ when End Study Date/Time (--ENDTC) variable is present."
  Domains: "SPECIAL PURPOSE (-CO, -DM), INTERVENTIONS (-SU), FINDINGS (-DO), EVENTS\
    \ (-MH), FINDINGS ABOUT"
  Severity: "Warning"
