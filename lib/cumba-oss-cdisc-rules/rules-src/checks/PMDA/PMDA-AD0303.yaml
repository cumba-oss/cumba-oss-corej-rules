Core:
  Id: "PMDA-AD0303"
  Status: "Published"
  Version: "1"
Description: "Raise an error when a Customized Query name variable CQzzNAM carries\
  \ a two-digit zz index that is not in the range 01 to 99 (i.e. CQ00NAM)."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "OCCURRENCE DATA STRUCTURE"
  Subclasses:
    Include:
    - "ADVERSE EVENT"
Check:
  expression: >-
    varname() =~ /^CQ\\d\\dNAM$/ and varname() !~ /^CQ(0[1-9]|[1-9]\\d)NAM$/
Outcome:
  Message: "Illegal variable name: zz is not in [01-99] for CQzzNAM."
  Output_Variables:
  - "variable_name"
Source:
  Message: "Illegal variable name: zz is not in [01-99] for CQzzNAM"
  Description: "For Customized MedDRA Query Name (SMQzzNAM) variables , zz must be\
    \ the ordered CQ of interest (01 to 99). This ordering can be based on importance\
    \ or some other sponsor-defined criteria. It is recommended that the ordering\
    \ be consistent across studies within a development program."
  Domains: "OCCDS, ADAE, MDOCCDS"
  Severity: "Error"
Standards:
- Organization: "PMDA"
  Standards:
