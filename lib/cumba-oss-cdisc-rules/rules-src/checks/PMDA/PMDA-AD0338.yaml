Core:
  Id: "PMDA-AD0338"
  Status: "Published"
  Version: "1"
Description: "Raise an error when the Analysis Multi-Response Criterion y (MCRITy)\
  \ variable is present in the dataset but its corresponding Multi-Response Criterion\
  \ y Evaluation (MCRITyML) flag variable is not present."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "ALL"
Check:
  expression: >-
    var_exists("MCRITy") and not var_exists("MCRITyML")
Outcome:
  Message: "MCRITy is present, but MCRITyML is not present."
  Output_Variables:
  - "MCRITy"
wildcards:
  "y":
    min: 1
    max: 99
Source:
  Message: "MCRITyML is not present when MCRITy is present"
  Description: "If Analysis Multi-Response Criterion y (MCRITy) variable is present,\
    \ there must also be a corresponding Multi-Response Criterion y Evaluation (MCRITyML)\
    \ flag variable."
  Domains: "BDS, ADNCA, MDBDS, ADAMOTHER"
  Severity: "Error"
Standards:
- Organization: "PMDA"
  Standards:
  - Name: "ADaMIG"
    Version: "1.3"
    References:
    - Origin: "PMDA Validation Rules"
      Rule_Identifier:
        Id: "AD0338"
        Version: "1"
      Version: "6.0"
  - Name: "ADaMIG"
    Version: "1.2"
    References:
    - Origin: "PMDA Validation Rules"
      Rule_Identifier:
        Id: "AD0338"
        Version: "1"
      Version: "6.0"
  - Name: "ADaMIG"
    Version: "1.1"
    References:
    - Origin: "PMDA Validation Rules"
      Rule_Identifier:
        Id: "AD0338"
        Version: "1"
      Version: "6.0"
