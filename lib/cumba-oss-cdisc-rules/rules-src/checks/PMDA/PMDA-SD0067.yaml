Core:
  Id: "PMDA-SD0067"
  Status: "Published"
  Version: "1"
Description: "Raise an error when Element Code (ETCD) is not equal to 'UNPLAN' and\
  \ does not match a value of ETCD in the Trial Elements (TE) dataset."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "SE"
    - "TA"
Requirements:
  Variables:
    All:
    - "ETCD"
Operations:
- id: "$te_etcd"
  expression: "distinct(ETCD, domain=\"TE\")"
Check:
  expression: >-
    ETCD != "UNPLAN" and ETCD not in $te_etcd
Outcome:
  Message: "ETCD is not equal to 'UNPLAN' and does not match a value of ETCD in the\
    \ Trial Elements (TE) dataset."
  Output_Variables:
  - "ETCD"
  - "$te_etcd"
Source:
  Message: "Invalid ETCD"
  Description: "Element Code (ETCD) values should match entries in the Trial Elements\
    \ (TE) dataset, except for unplanned Element (ETCD = 'UNPLAN')."
  Domains: "SE, TA"
  Severity: "Error"
