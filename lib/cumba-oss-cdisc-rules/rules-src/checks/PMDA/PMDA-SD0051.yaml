Core:
  Id: "PMDA-SD0051"
  Status: "Published"
  Version: "1"
Description: "Raise a warning when VISIT does not have the same value across all records\
  \ that share the same value of VISITNUM."
Severity: "Warning"
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "ALL"
Requirements:
  Variables:
    All:
    - "VISIT"
Check:
  expression: >-
    var_exists("VISITNUM") and is_inconsistent_across_dataset(VISIT, keys=[VISITNUM])
Outcome:
  Message: "VISIT is not the same value across records with the same value of VISITNUM."
  Output_Variables:
  - "VISITNUM"
  - "VISIT"
Source:
  Message: "Inconsistent value for VISIT within VISITNUM"
  Description: "All values of Visit Name (VISIT) should be the same for a given value\
    \ of Visit Number (VISITNUM)."
  Domains: "SPECIAL PURPOSE, INTERVENTIONS, FINDINGS, EVENTS, FINDINGS ABOUT, TV"
  Severity: "Warning"
