Core:
  Id: "PMDA-AD0141"
  Status: "Published"
  Version: "1"
Description: "Raise an error when the Parameter (PARAM) does not have a single consistent\
  \ value for each unique value of the Parameter Code (PARAMCD), evaluated on rows\
  \ where both PARAMCD and PARAM are populated; within a study each PARAMCD value\
  \ must map to one PARAM value."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "BASIC DATA STRUCTURE"
    - "MEDICAL DEVICE BASIC DATA STRUCTURE"
Check:
  expression: >-
    not empty(PARAMCD) and not empty(PARAM) and is_inconsistent_across_dataset(PARAM,
    keys=[PARAMCD])
Outcome:
  Message: "Inconsistent value for PARAM within a unique PARAMCD"
  Output_Variables:
  - "PARAM"
  - "PARAMCD"
Source:
  Message: "Inconsistent value for PARAM within a unique PARAMCD"
  Description: "Within a study, All PARAM values must be the same for each unique\
    \ value of PARAMCD when both PARAMCD and PARAM are populated."
  Domains: "BDS, ADNCA, MDBDS"
  Severity: "Error"
Standards:
- Organization: "PMDA"
  Standards:
