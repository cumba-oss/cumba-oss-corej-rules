Core:
  Id: "PMDA-SD1294"
  Status: "Published"
  Version: "1"
Description: "Raise a warning when Pre-Specified (--PRESP) is not present in the dataset\
  \ but Completion Status (--STAT) is present in the dataset."
Severity: "Warning"
Executability: "Fully Executable"
Scope:
  Classes:
    Include:
    - "INTERVENTIONS"
    - "EVENTS"
  Domains:
    Exclude:
    - "DX"
    - "EX"
    - "DS"
    - "DV"
Check:
  expression: >-
    not var_exists("--PRESP") and var_exists("--STAT")
Outcome:
  Message: "--STAT is present when --PRESP is not present."
  Output_Variables:
  - "--STAT"
Source:
  Message: "--STAT variable is present when --PRESP variable is missing"
  Description: "Completion Status (--STAT) variable should not be present in the domain\
    \ when the Pre-specified (--PRESP) variable is missing."
  Domains: "INTERVENTIONS (-DX, -EX), EVENTS (-DS, -DV)"
  Severity: "Warning"
