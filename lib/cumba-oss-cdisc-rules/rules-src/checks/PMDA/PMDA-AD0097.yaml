Core:
  Id: "PMDA-AD0097"
  Status: "Published"
  Version: "1"
Description: "Raise an error when the numeric Planned Pooled Treatment y (TRTPGyN)\
  \ variable is present in the dataset but its corresponding character Planned Pooled\
  \ Treatment y (TRTPGy) variable is not present."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "ALL"
Check:
  expression: >-
    var_exists("TRTPGyN") and not var_exists("TRTPGy")
Outcome:
  Message: "TRTPGyN is present, but TRTPGy is not present."
  Output_Variables:
  - "TRTPGyN"
wildcards:
  "y":
    min: 1
    max: 99
Source:
  Message: "TRTPGyN is present, but TRTPGy is not present"
  Description: "If Planned Pooled Treatment y (TRTPGyN) numeric variable is present,\
    \ there must be a corresponding Planned Pooled Treatment y (TRTPGy) character\
    \ variable."
  Domains: "BDS, ADNCA, MDBDS, ADAMOTHER"
  Severity: "Error"
Standards:
- Organization: "PMDA"
  Standards:
  - Name: "ADaMIG"
    Version: "1.3"
    References:
    - Origin: "PMDA Validation Rules"
      Rule_Identifier:
        Id: "AD0097"
        Version: "1"
      Version: "6.0"
  - Name: "ADaMIG"
    Version: "1.2"
