Core:
  Id: "PMDA-SD1038"
  Status: "Published"
  Version: "1"
Description: "Raise an error when TSSEQ is not unique for a given value of TSPARMCD\
  \ within the TS dataset."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "TS"
Check:
  expression: >-
    var_exists("TSPARMCD") and not is_unique_set([TSSEQ, TSPARMCD])
Outcome:
  Message: "Non-unique value for TSSEQ within TSPARMCD"
  Output_Variables:
  - "TSPARMCD"
Source:
  Message: "Non-unique value for TSSEQ variable within TSPARMCD"
  Description: "Sequence Number (TSSEQ) must have a unique value for a given value\
    \ of Trial Summary Parameter Short Name (TSPARMCD) within the domain."
  Domains: "TS"
  Severity: "Error"
