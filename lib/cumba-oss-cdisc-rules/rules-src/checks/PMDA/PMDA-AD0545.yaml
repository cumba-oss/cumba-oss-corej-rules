Core:
  Id: "PMDA-AD0545"
  Status: "Published"
  Version: "1"
Description: "Raise an error when the Change from Baseline Category y (N) (CHGCATyN)\
  \ variable is present in a dataset but its corresponding Change from Baseline Category\
  \ y (CHGCATy) variable (sharing the same y index) is not present. CHGCATyN cannot\
  \ be present unless CHGCATy is also present."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "ALL"
Check:
  expression: >-
    var_exists("CHGCATyN") and not var_exists("CHGCATy")
Outcome:
  Message: "CHGCATyN is present and CHGCATy is not present."
  Output_Variables:
  - "CHGCATyN"
wildcards:
  "y":
    min: 1
    max: 99
Source:
  Message: "CHGCATyN is present and CHGCATy is not present"
  Description: "If Change from Baseline Category y (N) (CHGCATyN) variable is used\
    \ in a dataset, Change from Baseline Category y (CHGCATy) variable must also be\
    \ present in that dataset."
  Domains: "BDS, ADNCA, MDBDS, ADAMOTHER"
  Severity: "Error"
Standards:
- Organization: "PMDA"
  Standards:
  - Name: "ADaMIG"
    Version: "1.3"
    References:
    - Origin: "PMDA Validation Rules"
      Rule_Identifier:
        Id: "AD0545"
        Version: "1"
      Version: "6.0"
  - Name: "ADaMIG"
    Version: "1.2"
    References:
    - Origin: "PMDA Validation Rules"
      Rule_Identifier:
        Id: "AD0545"
        Version: "1"
      Version: "6.0"
  - Name: "ADaMIG"
    Version: "1.1"
    References:
