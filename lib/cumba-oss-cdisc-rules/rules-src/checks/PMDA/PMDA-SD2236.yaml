Core:
  Id: "PMDA-SD2236"
  Status: "Published"
  Version: "1"
Description: "Raise a warning when both Arm Code (ARMCD) and Actual Arm Code (ACTARMCD)\
  \ are populated but ACTARMCD does not equal ARMCD."
Severity: "Warning"
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "DM"
Requirements:
  Variables:
    All:
    - "ACTARMCD"
    - "ARMCD"
Check:
  expression: >-
    not empty(ARMCD) and not empty(ACTARMCD) and ACTARMCD != ARMCD
Outcome:
  Message: "ACTARMCD does not equal ARMCD"
  Output_Variables:
  - "ARMCD"
  - "ACTARMCD"
Source:
  Message: "ACTARMCD does not equal ARMCD"
  Description: "A value for an Actual Arm Code (ACTARMCD) variable is expected to\
    \ be equal to a value of an Arm Code (ARMCD) variable."
  Domains: "DM"
  Severity: "Warning"
