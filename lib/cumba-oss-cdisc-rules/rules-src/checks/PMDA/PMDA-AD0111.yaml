Core:
  Id: "PMDA-AD0111"
  Status: "Published"
  Version: "1"
Description: "Raise an error when the Analysis Relative Time (ARELTM) variable is\
  \ present in the dataset but its paired Analysis Relative Time unit (ARELTMU) variable\
  \ is not present."
Executability: "Partially Executable"
Scope:
  Data_Structures:
    Include:
    - "BASIC DATA STRUCTURE"
    - "MEDICAL DEVICE BASIC DATA STRUCTURE"
Check:
  expression: >-
    var_exists("ARELTM") and not var_exists("ARELTMU")
Outcome:
  Message: "ARELTM is present, but ARELTMU is not present"
  Output_Variables:
  - "ARELTM"
Source:
  Message: "ARELTM is present, but ARELTMU is not present"
  Description: "When ARELTM is present, the Anchor Time variable and ARELTMU (Analysis\
    \ Relative Time unit) must also be included in the dataset, and the anchor time\
    \ variable must be identified in the metadata for ARELTM."
  Domains: "BDS, ADNCA, MDBDS, ADAMOTHER"
  Severity: "Error"
Standards:
- Organization: "PMDA"
  Standards:
  - Name: "ADaMIG"
    Version: "1.3"
    References:
    - Origin: "PMDA Validation Rules"
      Rule_Identifier:
        Id: "AD0111"
        Version: "1"
      Version: "6.0"
  - Name: "ADaMIG"
    Version: "1.2"
    References:
    - Origin: "PMDA Validation Rules"
      Rule_Identifier:
        Id: "AD0111"
        Version: "1"
      Version: "6.0"
  - Name: "ADaMIG"
    Version: "1.1"
