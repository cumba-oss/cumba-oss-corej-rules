Core:
  Id: "PMDA-SD1096"
  Status: "Published"
  Version: "1"
Description: "Raise a warning when the length of a --TERM value is exactly 200 characters\
  \ (risk of truncation at the SAS v5 transport 200-character limit)."
Severity: "Warning"
Executability: "Partially Executable - Possible Overreporting"
Scope:
  Classes:
    Include:
    - "EVENTS"
Check:
  expression: >-
    len(--TERM) == 200
Outcome:
  Message: "--TERM value length is exactly 200 characters, indicating a high risk\
    \ of truncation."
  Output_Variables:
  - "--TERM"
Source:
  Message: "High risk of truncated value for --TERM variable"
  Description: "SAS v5 export format has a limitation on variables length up to 200\
    \ characters. If the collected value was more than 200 characters, then SUPPQUAL\
    \ dataset should be used to store additional 200+ characters. Variable QNAM should\
    \ have --TERM1, ---TERM2, etc. values for those records. Value splitting should\
    \ be performed between words or numbers. See SDTM IG #4.1.5.3.2 for details. This\
    \ risk-assessment check is triggered based on assumption that if original value\
    \ was truncated, then the actual data value length is exactly 200 characters."
  Domains: "EVENTS"
  Severity: "Warning"
