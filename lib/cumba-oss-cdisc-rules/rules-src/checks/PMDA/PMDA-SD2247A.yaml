Core:
  Id: "PMDA-SD2247A"
  Status: "Published"
  Version: "1"
Description: "Raise an error when TSVAL does not contain at least a complete (full)\
  \ date in ISO 8601 format for a record where TSPARMCD equals 'SSTDTC' (Study Start\
  \ Date)."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "TS"
Requirements:
  Variables:
    All:
    - "TSPARMCD"
Check:
  expression: >-
    TSPARMCD == "SSTDTC" and not is_complete_date_part(TSVAL)
Outcome:
  Message: "TSVAL is an incomplete date for TSPARMCD equal to 'SSTDTC' (Study Start\
    \ Date); it must be in ISO 8601 format and include at least the full date."
  Output_Variables:
  - "TSPARMCD"
  - "TSVAL"
Source:
  Message: "Incomplete date for study start date"
  Description: "TSVAL variable value must be in ISO 8601 format and include at least\
    \ full date, when TSPARMCD='SSTDTC'."
  Domains: "TS"
  Severity: "Error"
