Core:
  Id: "PMDA-SD0057"
  Status: "Published"
  Version: "1"
Description: "Raise a warning when a variable described as Expected in the SDTM IG\
  \ is not present in the dataset."
Severity: "Warning"
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "ALL"
Operations:
- id: "$expected_variables"
  expression: "expected_variables()"
- id: "$dataset_variables"
  expression: "get_column_order_from_dataset()"
- id: "$missing_expected_variables"
  expression: "minus($expected_variables, subtract=$dataset_variables)"
Check:
  expression: >-
    not contains_all($dataset_variables, $expected_variables)
Outcome:
  Message: "Expected variable is not present in the dataset."
  Output_Variables:
  - "$missing_expected_variables"
Source:
  Message: "SDTM Expected variable not found"
  Description: "Variables described in SDTM IG as Expected should be included in the\
    \ dataset."
  Domains: "ALL"
  Severity: "Warning"
