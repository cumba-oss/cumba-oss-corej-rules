Core:
  Id: "PMDA-AD0359"
  Status: "Published"
  Version: "1"
Description: "Raise an error when Cause of Death (DTHCAUS) does not have a single\
  \ consistent value for each unique populated value of Cause of Death (N) (DTHCAUSN)\
  \ within the study; DTHCAUS and DTHCAUSN must hold a one-to-one relationship."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "SUBJECT LEVEL ANALYSIS DATASET"
    - "DEVICE LEVEL ANALYSIS DATASET"
Check:
  expression: >-
    not empty(DTHCAUSN) and is_inconsistent_across_dataset(DTHCAUS, keys=[DTHCAUSN])
Outcome:
  Message: "Inconsistent value for DTHCAUS"
  Output_Variables:
  - "DTHCAUS"
  - "DTHCAUSN"
Source:
  Message: "Inconsistent value for DTHCAUS"
  Description: "Within a study, Cause of Death (DTHCAUS) variable values must be the\
    \ same for each unique value of Cause of Death(N) (DTHCAUSN) variable when variable\
    \ DTHCAUSN is populated."
  Domains: "ADSL, ADDL"
  Severity: "Error"
Standards:
- Organization: "PMDA"
  Standards:
  - Name: "ADaMIG"
    Version: "1.3"
    References:
    - Origin: "PMDA Validation Rules"
      Rule_Identifier:
        Id: "AD0359"
        Version: "1"
      Version: "6.0"
  - Name: "ADaMIG"
    Version: "1.2"
    References:
    - Origin: "PMDA Validation Rules"
      Rule_Identifier:
        Id: "AD0359"
        Version: "1"
      Version: "6.0"
  - Name: "ADaMIG"
    Version: "1.1"
    References:
    - Origin: "PMDA Validation Rules"
      Rule_Identifier:
        Id: "AD0359"
        Version: "1"
      Version: "6.0"
