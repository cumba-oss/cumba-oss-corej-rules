Core:
  Id: "PMDA-SD0060"
  Status: "Published"
  Version: "1"
Description: "Raise an error when a variable present in the submitted dataset is not\
  \ declared in the Define-XML."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "ALL"
Check:
  expression: >-
    not empty(varname()) and empty(var_name("DEFINE"))
Outcome:
  Message: "The variable is present in the dataset but is not described in the Define-XML."
  Output_Variables:
  - "variable_name"
  - "define_variable_name"
Source:
  Message: "Variable in dataset is not present in define.xml"
  Description: "Variables included in the dataset must be described in the data definition\
    \ document (define.xml)."
  Domains: "ALL"
  Severity: "Error"
