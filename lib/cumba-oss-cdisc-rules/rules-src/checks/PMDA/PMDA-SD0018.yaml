Core:
  Id: "PMDA-SD0018"
  Status: "Published"
  Version: "1"
Description: "Raise an error when a Short Name of Measurement, Test or Examination\
  \ (--TESTCD) value is longer than 8 characters, starts with a number, or contains\
  \ characters other than uppercase letters, numbers or underscores."
Executability: "Fully Executable"
Scope:
  Classes:
    Include:
    - "FINDINGS"
    - "FINDINGS ABOUT"
Check:
  expression: >-
    not empty(--TESTCD) and not is_valid_name(--TESTCD)
Outcome:
  Message: "--TESTCD is longer than 8 characters, starts with a number, or contains\
    \ characters other than uppercase letters, numbers, and underscores."
  Output_Variables:
  - "--TESTCD"
Source:
  Message: "Invalid value for --TESTCD variable"
  Description: "The value of a Short Name of Measurement, Test or Examination (--TESTCD)\
    \ variable should be limited to 8 characters, cannot start with a number, and\
    \ cannot contain characters other than letters in upper case, numbers, or underscores."
  Domains: "FINDINGS, FINDINGS ABOUT, TI"
  Severity: "Error"
