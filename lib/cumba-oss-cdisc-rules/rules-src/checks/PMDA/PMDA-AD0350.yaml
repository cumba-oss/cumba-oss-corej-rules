Core:
  Id: "PMDA-AD0350"
  Status: "Published"
  Version: "1"
Description: "Raise an error when, within a study, the numeric Analysis Range y Upper\
  \ Limit (AyHI) does not have a single consistent value for each unique combination\
  \ of Parameter Code (PARAMCD) and the character Analysis Range y Upper Limit (C)\
  \ (AyHIC), evaluated on rows where PARAMCD and AyHIC are populated."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "BASIC DATA STRUCTURE"
    - "MEDICAL DEVICE BASIC DATA STRUCTURE"
Check:
  expression: >-
    not empty(PARAMCD) and not empty(AyHIC) and is_inconsistent_across_dataset(AyHI, keys=[PARAMCD,
    AyHIC])
Outcome:
  Message: "Inconsistent value for AyHI"
  Output_Variables:
  - "PARAMCD"
  - "AyHI"
  - "AyHIC"
wildcards:
  "y":
    min: 1
    max: 99
Source:
  Message: "Inconsistent value for AyHI"
  Description: "Within a Study and a Parameter, all Analysis Range y Upper Limit (AyHI)\
    \ variable values must be the same for each unique value of Analysis Range y Upper\
    \ Limit (C) (AyHIC) variable when variable AyHIC is populated."
  Domains: "BDS, ADNCA, MDBDS"
  Severity: "Error"
Standards:
- Organization: "PMDA"
  Standards:
  - Name: "ADaMIG"
    Version: "1.3"
    References:
    - Origin: "PMDA Validation Rules"
      Rule_Identifier:
        Id: "AD0350"
        Version: "1"
      Version: "6.0"
  - Name: "ADaMIG"
    Version: "1.2"
    References:
