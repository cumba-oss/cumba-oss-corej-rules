Core:
  Id: "PMDA-AD0080"
  Status: "Published"
  Version: "1"
Description: "Raise an error when an Actual Treatment variable (TRTxxA) is present\
  \ in the dataset but its corresponding Planned Treatment variable (TRTxxP) is not\
  \ present."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "SUBJECT LEVEL ANALYSIS DATASET"
    - "DEVICE LEVEL ANALYSIS DATASET"
Check:
  expression: >-
    var_exists("TRTxxA") and not var_exists("TRTxxP")
Outcome:
  Message: "TRTxxA (Actual Treatment) is present in the dataset but its corresponding\
    \ TRTxxP (Planned Treatment) is not present."
  Output_Variables:
  - "TRTxxA"
wildcards:
  xx:
    min: 1
    max: 99
Source:
  Message: "TRTxxA is present, but TRTxxP is not present"
  Description: "If Actual Treatment (TRTxxA) is present, its corresponding Planned\
    \ Treatment (TRTxxP) must be present."
  Domains: "ADSL, ADDL"
  Severity: "Error"
Standards:
- Organization: "PMDA"
  Standards:
  - Name: "ADaMIG"
    Version: "1.3"
    References:
    - Origin: "PMDA Validation Rules"
      Rule_Identifier:
        Id: "AD0080"
        Version: "1"
      Version: "6.0"
  - Name: "ADaMIG"
    Version: "1.2"
    References:
    - Origin: "PMDA Validation Rules"
      Rule_Identifier:
        Id: "AD0080"
        Version: "1"
      Version: "6.0"
  - Name: "ADaMIG"
    Version: "1.1"
    References:
    - Origin: "PMDA Validation Rules"
      Rule_Identifier:
        Id: "AD0080"
        Version: "1"
      Version: "6.0"
