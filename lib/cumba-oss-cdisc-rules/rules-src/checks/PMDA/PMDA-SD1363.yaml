Core:
  Id: "PMDA-SD1363"
  Status: "Published"
  Version: "1"
Description: "Raise an error when a subject was not assigned to treatment (ARMNRS\
  \ indicates Screen Failure, Not Assigned or Screening Not Completed) yet has a populated\
  \ Planned Arm Code (ARMCD) or Description of Planned Arm (ARM); both must be empty\
  \ for such subjects, whose empty planned Arm is explained by ARMNRS."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "DM"
Requirements:
  Variables:
    All:
    - "ARMNRS"
Check:
  expression: >-
    ARMNRS in ["SCREEN FAILURE", "NOT ASSIGNED", "SCREENING NOT COMPLETED"] and (not empty(ARMCD) or
    not empty(ARM))
Outcome:
  Message: "ARMCD and/or ARM is populated for a subject not assigned to treatment\
    \ (ARMNRS indicates Screen Failure, Not Assigned or Screening Not Completed)."
  Output_Variables:
  - "ARMCD"
  - "ARM"
  - "ARMNRS"
Source:
  Message: "ARMCD/ARM is populated for a subject not assigned to treatment"
  Description: "Planned Arm Code (ARMCD) and Description of Planned Arm (ARM) must\
    \ be null for subjects who are not assigned to treatment. This includes Screen\
    \ Failure subjects and Not Assigned subjects."
  Domains: "DM"
  Severity: "Error"
