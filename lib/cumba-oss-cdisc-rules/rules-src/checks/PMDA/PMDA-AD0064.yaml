Core:
  Id: "PMDA-AD0064"
  Status: "Published"
  Version: "1"
Description: "Raise an error when the numeric Actual Treatment variable TRTxxAN is\
  \ present in the dataset but its corresponding character Actual Treatment variable\
  \ TRTxxA is not present."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "SUBJECT LEVEL ANALYSIS DATASET"
    - "DEVICE LEVEL ANALYSIS DATASET"
Check:
  expression: >-
    var_exists("TRTxxAN") and not var_exists("TRTxxA")
Outcome:
  Message: "TRTxxAN is present, but TRTxxA is not present."
  Output_Variables:
  - "TRTxxAN"
wildcards:
  xx:
    min: 1
    max: 99
Source:
  Message: "TRTxxAN is present, but TRTxxA is not present"
  Description: "If Actual Treatment (TRTxxAN) numeric variable is present, there must\
    \ be a corresponding Actual Treatment (TRTxxA) character variable."
  Domains: "ADSL, ADDL"
  Severity: "Error"
Standards:
- Organization: "PMDA"
  Standards:
  - Name: "ADaMIG"
    Version: "1.3"
    References:
    - Origin: "PMDA Validation Rules"
      Rule_Identifier:
        Id: "AD0064"
        Version: "1"
      Version: "6.0"
  - Name: "ADaMIG"
    Version: "1.2"
    References:
    - Origin: "PMDA Validation Rules"
      Rule_Identifier:
        Id: "AD0064"
        Version: "1"
      Version: "6.0"
