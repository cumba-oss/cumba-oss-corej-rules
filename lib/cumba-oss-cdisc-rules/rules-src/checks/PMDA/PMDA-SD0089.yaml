Core:
  Id: "PMDA-SD0089"
  Status: "Published"
  Version: "1"
Description: "Raise an error when both TEENRL and TEDUR are empty or not present."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "TE"
Requirements:
  Variables:
    Any:
    - "TEENRL"
    - "TEDUR"
Check:
  expression: >-
    empty(TEDUR) and empty(TEENRL)
Outcome:
  Message: "Both TEENRL and TEDUR are empty."
  Output_Variables:
  - "TEENRL"
  - "TEDUR"
Source:
  Message: "Missing values for TEENRL and TEDUR"
  Description: "At least one of Rule for End of Element (TEENRL) or Planned Duration\
    \ of Element (TEDUR) should be populated."
  Domains: "TE"
  Severity: "Error"
