Core:
  Id: "PMDA-AD0284B"
  Status: "Published"
  Version: "1"
Description: "Raise an error when, considering only records on which both ASEV and\
  \ ASEVN are populated, the ASEVN variable is not uniquely determined by ASEV within\
  \ the dataset: a single value of ASEV maps to more than one value of ASEVN."
Executability: "Partially Executable"
ExecutabilityHint:
  Category: "partially executable"
  Detail: "The sheet's 'inconsistent across studies' intent is reinterpreted as a\
    \ within-dataset unique-relationship check between the char/numeric pair ASEVN/ASEV\
    \ (has_multiple_values_for); the cross-study scope is not evaluated."
Scope:
  Data_Structures:
    Include:
    - "BASIC DATA STRUCTURE"
    - "OCCURRENCE DATA STRUCTURE"
Check:
  expression: >-
    not empty(ASEVN) and not empty(ASEV) and has_multiple_values_for(ASEVN, ASEV)
Outcome:
  Message: "There is more than one value of ASEVN for a given value of ASEV (within\
    \ the dataset)."
  Output_Variables:
  - "ASEV"
  - "ASEVN"
Source:
  Message: "Inconsistent value for ASEVN"
  Description: "Across studies, all Analysis Severity/Intensity (N) (ASEVN) variable\
    \ values must be the same for each unique value of Analysis Severity/Intensity\
    \ (ASEV) variable when both variables are populated."
  Domains: "OCCDS, ADAE, MDOCCDS, ADAMOTHER"
  Severity: "Error"
Standards:
- Organization: "PMDA"
  Standards:
  - Name: "ADaMIG"
    Version: "1.3"
    References:
