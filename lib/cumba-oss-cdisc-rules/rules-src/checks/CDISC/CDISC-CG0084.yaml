Core:
  Id: "CDISC-CG0084"
  Status: "Published"
  Version: "1"
Description: "Raise an error when --TOXGR is not present in the dataset but --TOX\
  \ is present."
Executability: "Fully Executable"
Scope:
  Classes:
    Include:
    - "EVENTS"
    - "FINDINGS"
Check:
  expression: >-
    not var_exists("--TOXGR") and var_exists("--TOX")
Outcome:
  Message: "--TOX is present when --TOXGR is not present in the dataset."
  Output_Variables:
  - "--TOX"
Source:
  Class: "EVT, FND"
  Domain: "ALL"
  Variable: "--TOX"
  Condition: "--TOXGR not present in dataset"
  Rule: "--TOX not present in dataset"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "SDTMIG"
    Version: "3.4"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0084"
        Version: "2"
      Version: "2.0"
  - Name: "SDTMIG"
    Version: "3.3"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0084"
        Version: "2"
      Version: "2.0"
  - Name: "SDTMIG"
    Version: "3.2"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0084"
        Version: "2"
      Version: "2.0"
