Core:
  Id: "CDISC-AD0137"
  Status: "Published"
  Version: "2"
Description: "Raise an error when CRITyFL is populated and CRITy is not populated."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "BASIC DATA STRUCTURE"
    - "MEDICAL DEVICE BASIC DATA STRUCTURE"
Requirements:
  Variables:
    All:
    - "CRITy"
    - "CRITyFL"
Check:
  expression: >-
    not empty(CRITyFL) and empty(CRITy)
Outcome:
  Message: "CRITyFL is populated, but CRITy is not populated."
  Output_Variables:
  - "CRITy"
  - "CRITyFL"
wildcards:
  "y":
    min: 1
    max: 99
Source:
  Class: "BASIC DATA STRUCTURE; MEDICAL DEVICE BASIC DATA STRUCTURE"
  Variable_or_Item: "CRITy where y is an integer [1-99, not zero-padded]"
  Natural_Language_Rule_Failure_Criteria: "CRITyFL is populated and CRITy is not populated"
  Rule_Failure_Criteria: "CRITy is not populated"
  Condition_Failure: "CRITyFL is populated"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.0"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR137"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.1"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR137"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.2"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR137"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.3"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR137"
        Version: "2"
      Version: "5.0"
