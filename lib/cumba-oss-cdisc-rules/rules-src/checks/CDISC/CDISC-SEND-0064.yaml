Core:
  Id: "CDISC-SEND-0064"
  Status: "Published"
  Version: "1"
Description: "Raise an error when a Test Name (--TEST) value is longer than 40 characters."
Executability: "Fully Executable"
Scope:
  Classes:
    Include:
    - "FINDINGS"
Requirements:
  Variables:
    All:
    - "--TEST"
Check:
  expression: >-
    len(--TEST) > 40
Outcome:
  Message: "--TEST value is longer than 40 characters."
  Output_Variables:
  - "--TEST"
Source:
  Class: "FND"
  Domain: "ALL"
  Variable: "--TEST"
  Plain_Text_Explanation: "--TEST values can not be longer than 40 characters"
  Rule: "--TEST value length <= 40 chars"
