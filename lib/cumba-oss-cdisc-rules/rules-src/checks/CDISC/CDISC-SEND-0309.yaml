Core:
  Id: "CDISC-SEND-0309"
  Status: "Published"
  Version: "1"
Description: "Raise an error when DM records that share the same value of SETCD do\
  \ not all have the same value of SPECIES; records with different SPECIES values\
  \ must have different SETCD values."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "DM"
Requirements:
  Variables:
    All:
    - "SPECIES"
Check:
  expression: >-
    var_exists("SETCD") and is_inconsistent_across_dataset(SPECIES, keys=[SETCD])
Outcome:
  Message: "SPECIES is not consistent across DM records that share the same SETCD\
    \ value."
  Output_Variables:
  - "SPECIES"
  - "SETCD"
Source:
  Class: "SPC"
  Domain: "DM"
  Variable: "SPECIES"
  Plain_Text_Explanation: "DM records with different values for SPECIES cannot have\
    \ the same SETCD value."
  Rule: "DM records with different values for DM.SPECIES must have different values\
    \ for DM.SETCD."
Standards:
- Organization: "CDISC"
  Standards:
