Core:
  Id: "CDISC-AD0532"
  Status: "Published"
  Version: "2"
Description: "Raise an error when AERELN is present but AEREL is not present."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "OCCURRENCE DATA STRUCTURE"
    - "MEDICAL DEVICE OCCURRENCE DATA STRUCTURE"
Check:
  expression: >-
    var_exists("AERELN") and not var_exists("AEREL")
Outcome:
  Message: "AERELN is present but AEREL is not present."
  Output_Variables:
  - "AERELN"
Source:
  Class: "OCCURRENCE DATA STRUCTURE; MEDICAL DEVICE OCCURRENCE DATA STRUCTURE"
  Variable_or_Item: "AERELN"
  Natural_Language_Rule_Failure_Criteria: "AERELN is present and AEREL is not present"
  Rule_Failure_Criteria: "AEREL is not present"
  Condition_Failure: "AERELN is present"
