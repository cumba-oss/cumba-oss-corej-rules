Core:
  Id: "CDISC-AD0423"
  Status: "Published"
  Version: "2"
Description: "Raise an error when TRTPGyN is populated but TRTPGy is empty"
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "BASIC DATA STRUCTURE"
    - "OCCURRENCE DATA STRUCTURE"
    - "MEDICAL DEVICE OCCURRENCE DATA STRUCTURE"
Requirements:
  Variables:
    All:
    - "TRTPGyN"
    - "TRTPGy"
Check:
  expression: >-
    not empty(TRTPGyN) and empty(TRTPGy)
Outcome:
  Message: "TRTPGyN is populated, but TRTPGy is empty"
  Output_Variables:
  - "TRTPGy"
  - "TRTPGyN"
wildcards:
  "y":
    min: 1
    max: 99
Source:
  Class: "BASIC DATA STRUCTURE; MEDICAL DEVICE BASIC DATA STRUCTURE; OCCURRENCE DATA\
    \ STRUCTURE; MEDICAL DEVICE OCCURRENCE DATA STRUCTURE"
  Variable_or_Item: "TRTPGy where y is an integer [1-99, not zero-padded]"
  Natural_Language_Rule_Failure_Criteria: "On a given record, TRTPGyN is populated\
    \ and TRTPGy is not populated"
  Rule_Failure_Criteria: "TRTPGy is not populated"
  Condition_Failure: "TRTPGyN is populated"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.2"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR423"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.3"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR423"
        Version: "2"
      Version: "5.0"
