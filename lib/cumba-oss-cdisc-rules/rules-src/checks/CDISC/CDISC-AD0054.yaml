Core:
  Id: "CDISC-AD0054"
  Status: "Published"
  Version: "1"
Description: "Raise an error when USUBJID is present but its value is not unique within\
  \ ADSL"
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "SUBJECT LEVEL ANALYSIS DATASET"
Requirements:
  Variables:
    All:
    - "USUBJID"
Check:
  expression: >-
    var_exists("USUBJID") and not is_unique_set([USUBJID])
Outcome:
  Message: "More than one record in ADSL shares the same USUBJID value"
  Output_Variables:
  - "USUBJID"
Source:
  Class: "SUBJECT LEVEL ANALYSIS DATASET"
  Variable_or_Item: "USUBJID"
  Natural_Language_Rule_Failure_Criteria: "Within ADSL there is more than one record\
    \ for a unique value of USUBJID"
  Rule_Failure_Criteria: "There is more than one record for a unique value of USUBJID"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.0"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR54"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.1"
    References:
