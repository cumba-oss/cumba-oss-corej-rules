Core:
  Id: "CDISC-AD0791"
  Status: "Published"
  Version: "1"
Description: "Raise an error when, within a given value of PARAMCD, there is more\
  \ than one value of ATPT for a given value of ATPTN, considering only those rows\
  \ on which both variables are populated."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "BASIC DATA STRUCTURE"
Check:
  expression: >-
    not empty(ATPT) and not empty(ATPTN) and has_multiple_values_for(ATPT, ATPTN, within=PARAMCD)
Outcome:
  Message: "Within a given value of PARAMCD, there is more than one value of ATPT\
    \ for a given value of ATPTN."
  Output_Variables:
  - "ATPT"
  - "ATPTN"
Source:
  Class: "BASIC DATA STRUCTURE"
  Variable_or_Item: "ATPT"
  Natural_Language_Rule_Failure_Criteria: "Within a given value of PARAMCD, there\
    \ is more than one value of ATPT for a given value of ATPTN, considering only\
    \ those rows on which both variables are populated"
  Rule_Failure_Criteria: "Within a given value of PARAMCD, there is more than one\
    \ value of ATPT for a given value of ATPTN"
  Condition_Failure: "On rows where ATPTN and ATPT are both populated"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.1"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR791"
        Version: "1"
      Version: "5.0"
