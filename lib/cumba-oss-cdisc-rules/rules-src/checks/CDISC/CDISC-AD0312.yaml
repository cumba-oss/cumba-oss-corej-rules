Core:
  Id: "CDISC-AD0312"
  Status: "Published"
  Version: "2"
Description: "Raise an error when SMQzzNAM is populated and SMQzzSC is populated but\
  \ not equal to BROAD or NARROW, where zz is a zero-padded two-digit integer [01-99]."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "OCCURRENCE DATA STRUCTURE"
    - "MEDICAL DEVICE OCCURRENCE DATA STRUCTURE"
Check:
  expression: >-
    not empty(SMQzzNAM) and not empty(SMQzzSC) and SMQzzSC not in ["BROAD", "NARROW"]
Outcome:
  Message: "SMQzzSC is not equal to BROAD or NARROW, where zz is a zero-padded two-digit\
    \ integer [01-99]"
  Output_Variables:
  - "SMQzzNAM"
  - "SMQzzSC"
wildcards:
  zz:
    min: 1
    max: 99
Source:
  Class: "OCCURRENCE DATA STRUCTURE; MEDICAL DEVICE OCCURRENCE DATA STRUCTURE"
  Variable_or_Item: "SMQzzSC where zz is an integer [01-99, zero-padded]"
  Natural_Language_Rule_Failure_Criteria: "SMQzzSC is not equal to BROAD or NARROW,\
    \ where zz is a zero-padded two-digit integer [01-99]"
  Rule_Failure_Criteria: "SMQzzSC is not equal to BROAD or NARROW"
  Condition_Failure: "SMQzzNAM is populated"
