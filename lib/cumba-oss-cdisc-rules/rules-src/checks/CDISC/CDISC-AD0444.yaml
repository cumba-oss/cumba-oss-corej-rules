Core:
  Id: "CDISC-AD0444"
  Status: "Published"
  Version: "2"
Description: "Raise an error when PCHGCAyN is populated but PCHGCATy is empty"
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "BASIC DATA STRUCTURE"
Requirements:
  Variables:
    All:
    - "PCHGCATy"
    - "PCHGCAyN"
Check:
  expression: >-
    not empty(PCHGCAyN) and empty(PCHGCATy)
Outcome:
  Message: "PCHGCAyN is populated, but PCHGCATy is empty"
  Output_Variables:
  - "PCHGCATy"
  - "PCHGCAyN"
wildcards:
  "y":
    min: 1
    max: 99
Source:
  Class: "BASIC DATA STRUCTURE; MEDICAL DEVICE BASIC DATA STRUCTURE"
  Variable_or_Item: "PCHGCATy where y is an integer [1-9, not zero-padded]"
  Natural_Language_Rule_Failure_Criteria: "On a given record, PCHGCAyN is populated\
    \ and PCHGCATy is not populated"
  Rule_Failure_Criteria: "PCHGCATy is not populated"
  Condition_Failure: "PCHGCAyN is populated"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.2"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR444"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.3"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR444"
        Version: "2"
      Version: "5.0"
