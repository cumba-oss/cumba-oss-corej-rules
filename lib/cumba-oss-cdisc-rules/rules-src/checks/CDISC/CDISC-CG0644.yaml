Core:
  Id: "CDISC-CG0644"
  Status: "Published"
  Version: "1"
Description: "Raise an error when the SBSTRAIN variable is present in the Demographics\
  \ (DM) dataset, since SBSTRAIN is not used in human clinical trials."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "DM"
Check:
  expression: >-
    var_exists("SBSTRAIN")
Outcome:
  Message: "SBSTRAIN must not be present in the Demographics (DM) dataset because\
    \ it is not used in human clinical trials."
  Output_Variables:
  - "SBSTRAIN"
Source:
  Class: "SPC"
  Domain: "DM"
  Variable: "SBSTRAIN"
  Rule: "SBSTRAIN not present in dataset"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "SDTMIG"
    Version: "3.4"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0644"
        Version: "1"
      Version: "2.0"
