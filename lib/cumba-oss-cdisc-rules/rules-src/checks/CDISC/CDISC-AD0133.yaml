Core:
  Id: "CDISC-AD0133"
  Status: "Published"
  Version: "2"
Description: "Raise an error when AVAL, AyLO, and R2AyLO are all populated, AyLO does\
  \ not equal 0, and R2AyLO does not equal AVAL divided by AyLO."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "BASIC DATA STRUCTURE"
    - "MEDICAL DEVICE BASIC DATA STRUCTURE"
Requirements:
  Variables:
    All:
    - "R2AyLO"
    - "AyLO"
    - "AVAL"
Check:
  expression: >-
    not empty(AVAL) and not empty(AyLO) and AyLO != 0 and not empty(R2AyLO) and R2AyLO != (AVAL /
    AyLO)
Outcome:
  Message: "R2AyLO does not equal AVAL divided by AyLO."
  Output_Variables:
  - "AVAL"
  - "R2AyLO"
  - "AyLO"
wildcards:
  "y":
    min: 1
    max: 99
Source:
  Class: "BASIC DATA STRUCTURE; MEDICAL DEVICE BASIC DATA STRUCTURE"
  Variable_or_Item: "R2AyLO where y is an integer [1-99, not zero-padded]"
  Natural_Language_Rule_Failure_Criteria: "R2AyLO is not equal to AVAL divided by\
    \ AyLO"
  Rule_Failure_Criteria: "R2AyLO is not equal to AVAL divided by AyLO"
  Condition_Failure: "AVAL and AyLO are populated"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.0"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
