Core:
  Id: "CDISC-SEND-0022"
  Status: "Published"
  Version: "1"
Description: "Raise an error when the Qualifier Variable Name (QNAM) contains a character\
  \ other than a letter, number, or underscore, or starts with a number."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "SUPP--"
    - "SQ--"
Requirements:
  Variables:
    All:
    - "QNAM"
Check:
  expression: >-
    not empty(QNAM) and QNAM !~ /^[A-Za-z_][A-Za-z0-9_]*$/
Outcome:
  Message: "QNAM contains a character other than a letter, number, or underscore,\
    \ or starts with a number."
  Output_Variables:
  - "QNAM"
Source:
  Class: "SPC"
  Domain: "SUPP--"
  Variable: "QNAM"
  Plain_Text_Explanation: "QNAM value cannot contain characters other than letters,\
    \ numbers, and underscores"
  Rule: "QNAM value contains only letters, numbers, and underscores and cannot start\
    \ with a number"
