Core:
  Id: "CDISC-AD0164"
  Status: "Published"
  Version: "2"
Description: "Raise an error when BTOXGR is present and ABLFL is not present"
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "BASIC DATA STRUCTURE"
Check:
  expression: >-
    var_exists("BTOXGR") and not var_exists("ABLFL")
Outcome:
  Message: "BTOXGR is present, but ABLFL is not present"
  Output_Variables:
  - "BTOXGR"
Source:
  Class: "BASIC DATA STRUCTURE; MEDICAL DEVICE BASIC DATA STRUCTURE"
  Variable_or_Item: "BTOXGR"
  Natural_Language_Rule_Failure_Criteria: "BTOXGR is present and ABLFL is not present"
  Rule_Failure_Criteria: "ABLFL is not present"
  Condition_Failure: "BTOXGR is present"
