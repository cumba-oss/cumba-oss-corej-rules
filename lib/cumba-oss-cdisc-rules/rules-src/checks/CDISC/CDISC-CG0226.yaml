Core:
  Id: "CDISC-CG0226"
  Status: "Published"
  Version: "1"
Description: "Raise an error when Start Relative to Reference Period (--STRF) is populated\
  \ for a subject with an empty Reference Start Date/Time (RFSTDTC) in the DM dataset."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "ALL"
Requirements:
  Variables:
    All:
    - "--STRF"
Match_Datasets:
- Keys:
  - "USUBJID"
  Name: "DM"
Check:
  expression: >-
    empty(DM.RFSTDTC) and not empty(--STRF)
Outcome:
  Message: "--STRF is populated when RFSTDTC in the DM dataset is empty."
  Output_Variables:
  - "--STRF"
  - "DM.RFSTDTC"
Source:
  Class: "ALL"
  Domain: "ALL"
  Variable: "--STRF"
  Condition: "DM.RFSTDTC = null"
  Rule: "--STRF = null"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "SDTMIG"
    Version: "3.4"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0226"
        Version: "1"
      Version: "2.0"
  - Name: "SDTMIG"
    Version: "3.3"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0226"
        Version: "1"
      Version: "2.0"
  - Name: "SDTMIG"
    Version: "3.2"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0226"
        Version: "1"
      Version: "2.0"
