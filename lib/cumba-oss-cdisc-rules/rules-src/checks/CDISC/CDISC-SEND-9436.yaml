Core:
  Id: "CDISC-SEND-9436"
  Status: "Published"
  Version: "1"
Description: "Raise an error when USUBJID is not populated"
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "SE"
    - "SJ"
Requirements:
  Variables:
    All:
    - "USUBJID"
Check:
  expression: >-
    empty(USUBJID)
Outcome:
  Message: "USUBJID is empty"
  Output_Variables:
  - "USUBJID"
Source_Proposed:
  Class: "ALL"
  Domain: "SE, SJ"
  Variable: "USUBJID"
  Plain_Text_Explanation: "USUBJID must be populated for every record."
  Condition: ""
  Rule: "USUBJID ^= null"
Source:
  Class: "ALL"
  Domain: "ALL"
  Variable: "GEN"
  Plain_Text_Explanation: "Required variables must always be included in the dataset\
    \ and cannot be null for any record."
  Condition: "Variable Core Status = Required"
  Rule: "Variable present in dataset and ^= null"
