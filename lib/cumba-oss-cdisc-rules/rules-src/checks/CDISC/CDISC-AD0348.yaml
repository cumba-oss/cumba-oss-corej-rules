Core:
  Id: "CDISC-AD0348"
  Status: "Published"
  Version: "2"
Description: "Raise an error when, within a parameter, AyLOC has more than one value\
  \ for a given value of AyLO"
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "BASIC DATA STRUCTURE"
    - "MEDICAL DEVICE BASIC DATA STRUCTURE"
Check:
  expression: >-
    has_multiple_values_for(AyLOC, AyLO, within=PARAMCD)
Outcome:
  Message: "Within this parameter, AyLOC has more than one value for the same value\
    \ of AyLO."
  Output_Variables:
  - "PARAMCD"
  - "AyLO"
  - "AyLOC"
wildcards:
  "y":
    min: 1
    max: 99
Source:
  Class: "BASIC DATA STRUCTURE; MEDICAL DEVICE BASIC DATA STRUCTURE"
  Variable_or_Item: "AyLOC where y is an integer [1-99, not zero-padded]"
  Natural_Language_Rule_Failure_Criteria: "Within a parameter, there is more than\
    \ one value of AyLOC for a given value of AyLO"
  Rule_Failure_Criteria: "Within a parameter, there is more than one value of AyLOC\
    \ for a given value of AyLO"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.1"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR348"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.2"
    References:
