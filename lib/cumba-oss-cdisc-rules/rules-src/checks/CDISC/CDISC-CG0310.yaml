Core:
  Id: "CDISC-CG0310"
  Status: "Published"
  Version: "1"
Description: "Raise an error when a variable name is longer than 8 characters."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "ALL"
Check:
  expression: >-
    len(varname()) > 8
Outcome:
  Message: "Variable name length is greater than 8 characters."
  Output_Variables:
  - "variable_name"
Source:
  Class: "ALL"
  Domain: "ALL"
  Variable: "GEN"
  Rule: "Variable name length <= 8"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "SDTMIG"
    Version: "3.4"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0310"
        Version: "1"
      Version: "2.0"
  - Name: "SDTMIG"
    Version: "3.3"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0310"
        Version: "1"
      Version: "2.0"
