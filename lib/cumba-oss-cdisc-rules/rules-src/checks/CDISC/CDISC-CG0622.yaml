Core:
  Id: "CDISC-CG0622"
  Status: "Published"
  Version: "1"
Description: "Raise an error when --USCHFL is present in a dataset, because this variable\
  \ is not permitted in human clinical trials."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "ALL"
Check:
  expression: >-
    var_exists("--USCHFL")
Outcome:
  Message: "--USCHFL is present but is not permitted in human clinical trials."
  Output_Variables:
  - "--USCHFL"
Source:
  Class: "ALL"
  Variable: "--USCHFL"
  Rule: "--USCHFL not present in dataset"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "SDTMIG"
    Version: "3.4"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0622"
        Version: "1"
      Version: "2.0"
