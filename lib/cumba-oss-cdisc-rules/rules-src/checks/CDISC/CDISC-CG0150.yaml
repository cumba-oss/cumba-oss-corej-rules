Core:
  Id: "CDISC-CG0150"
  Status: "Published"
  Version: "1"
Description: "Raise an error when SUBJID is not unique within the study (DM dataset)."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "DM"
Check:
  expression: >-
    not is_unique_set([SUBJID, STUDYID])
Outcome:
  Message: "SUBJID is not unique within the study."
  Output_Variables:
  - "STUDYID"
  - "SUBJID"
Source:
  Class: "SPC"
  Domain: "DM"
  Variable: "SUBJID"
  Rule: "SUBJID unique within a study"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "SDTMIG"
    Version: "3.4"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0150"
        Version: "1"
      Version: "2.0"
  - Name: "SDTMIG"
    Version: "3.3"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0150"
        Version: "1"
      Version: "2.0"
  - Name: "SDTMIG"
    Version: "3.2"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0150"
        Version: "1"
      Version: "2.0"
