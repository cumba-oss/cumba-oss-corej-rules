Core:
  Id: "CDISC-SEND-0276"
  Status: "Published"
  Version: "1"
Description: "Raise an error when the label of a variable defined in the SENDIG does\
  \ not match the variable label given in the SENDIG library metadata."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "ALL"
Check:
  expression: >-
    varname() == var_name("LIBRARY") and not empty(var_label("LIBRARY")) and var_label("DATA") !=
    var_label("LIBRARY")
Outcome:
  Message: "The variable label in the dataset does not match the variable label described\
    \ in the SENDIG."
  Output_Variables:
  - "variable_name"
  - "library_variable_label"
  - "variable_label"
Source:
  Class: "ALL"
  Domain: "ALL"
  Variable: "ALL"
  Plain_Text_Explanation: "The predefined SENDIG-standard labels must be used in all\
    \ standard domains."
  Condition: "Variable label is present in the SENDIG"
  Rule: "Variable label must match the variable label in the SENDIG"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "SENDIG-GENETOX"
    Version: "1.0"
    References:
    - Origin: "SEND Conformance Rules"
      Rule_Identifier:
        Id: "SEND276"
        Version: "1"
      Version: "5.0"
  - Name: "SENDIG-DART"
    Version: "1.2"
