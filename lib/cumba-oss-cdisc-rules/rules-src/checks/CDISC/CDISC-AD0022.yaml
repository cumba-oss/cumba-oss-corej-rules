Core:
  Id: "CDISC-AD0022"
  Status: "Published"
  Version: "1"
Description: "Raise an error when PPROTFL is populated with a value that is not Y\
  \ or N"
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "SUBJECT LEVEL ANALYSIS DATASET"
Requirements:
  Variables:
    All:
    - "PPROTFL"
Check:
  expression: >-
    not empty(PPROTFL) and PPROTFL not in ["Y", "N"]
Outcome:
  Message: "PPROTFL has a value other than Y or N"
  Output_Variables:
  - "PPROTFL"
Source:
  Class: "SUBJECT LEVEL ANALYSIS DATASET"
  Variable_or_Item: "PPROTFL"
  Natural_Language_Rule_Failure_Criteria: "PPROTFL is present and has a value that\
    \ is not Y or N"
  Rule_Failure_Criteria: "Value is not Y or N"
  Condition_Failure: "PPROTFL is present"
Standards:
- Organization: "CDISC"
  Standards:
