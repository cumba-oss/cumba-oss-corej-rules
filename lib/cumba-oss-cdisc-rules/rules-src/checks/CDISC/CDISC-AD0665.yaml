Core:
  Id: "CDISC-AD0665"
  Status: "Published"
  Version: "1"
Description: "Raise an error when COHORTN is present but COHORT is not present."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "BASIC DATA STRUCTURE"
Check:
  expression: >-
    var_exists("COHORTN") and not var_exists("COHORT")
Outcome:
  Message: "COHORTN is present, but COHORT is not present in the dataset."
  Output_Variables:
  - "COHORTN"
Source:
  Class: "BASIC DATA STRUCTURE"
  Subclass: "NON-COMPARTMENTAL ANALYSIS"
  Variable_or_Item: "COHORTN"
  Natural_Language_Rule_Failure_Criteria: "COHORTN is present and COHORT is not present"
  Rule_Failure_Criteria: "COHORT is not present"
  Condition_Failure: "COHORTN is present"
