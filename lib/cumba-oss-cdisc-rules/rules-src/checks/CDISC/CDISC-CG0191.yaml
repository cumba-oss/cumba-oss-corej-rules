Core:
  Id: "CDISC-CG0191"
  Status: "Published"
  Version: "1"
Description: "Raise an error when a Microbiology Specimen (MB) dataset is not present\
  \ while a Microbiology Susceptibility Test (MS) dataset is present."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "MS"
Check:
  expression: >-
    ds_exists("MS") and not ds_exists("MB")
Outcome:
  Message: "The MB dataset is not present when the MS dataset is present."
Source:
  Class: "FND"
  Domain: "MS"
  Variable: "GEN"
  Condition: "MS dataset present in study"
  Rule: "MB dataset present in study"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "SDTMIG"
    Version: "3.4"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0191"
        Version: "1"
      Version: "2.0"
  - Name: "SDTMIG"
    Version: "3.3"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0191"
        Version: "1"
      Version: "2.0"
  - Name: "SDTMIG"
    Version: "3.2"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0191"
        Version: "1"
      Version: "2.0"
