Core:
  Id: "CDISC-AD0402"
  Status: "Published"
  Version: "2"
Description: "Raise an error when ATOXDSCH is populated and AVAL or ATOXGRH is not\
  \ populated."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "BASIC DATA STRUCTURE"
Requirements:
  Variables:
    All:
    - "ATOXDSCH"
Check:
  expression: >-
    not empty(ATOXDSCH) and (empty(AVAL) or empty(ATOXGRH))
Outcome:
  Message: "ATOXDSCH is populated but AVAL or ATOXGRH is not populated."
  Output_Variables:
  - "AVAL"
  - "ATOXGRH"
  - "ATOXDSCH"
Source:
  Class: "BASIC DATA STRUCTURE; MEDICAL DEVICE BASIC DATA STRUCTURE"
  Variable_or_Item: "AVAL; ATOXGRH"
  Natural_Language_Rule_Failure_Criteria: "AVAL is not populated or ATOXGRH is not\
    \ populated, and ATOXDSCH is populated"
  Rule_Failure_Criteria: "AVAL is not populated or ATOXGRH is not populated"
  Condition_Failure: "ATOXDSCH is populated"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.2"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR402"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.3"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR402"
        Version: "2"
      Version: "5.0"
