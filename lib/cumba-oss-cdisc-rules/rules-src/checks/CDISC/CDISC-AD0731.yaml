Core:
  Id: "CDISC-AD0731"
  Status: "Published"
  Version: "1"
Description: "Raise an error when there is more than one value of PARCATyN for a given\
  \ value of PARCATy, considering only rows on which both variables are populated"
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "BASIC DATA STRUCTURE"
Check:
  expression: >-
    not empty(PARCATyN) and not empty(PARCATy) and has_multiple_values_for(PARCATyN, PARCATy)
Outcome:
  Message: "PARCATyN has more than one value for this PARCATy, among rows where both\
    \ are populated"
  Output_Variables:
  - "PARCATy"
  - "PARCATyN"
wildcards:
  "y":
    min: 1
    max: 99
Source:
  Class: "BASIC DATA STRUCTURE; MEDICAL DEVICE BASIC DATA STRUCTURE"
  Variable_or_Item: "PARCATyN where y is an integer [1-9, not zero-padded]"
  Natural_Language_Rule_Failure_Criteria: "There is more than one value of PARCATyN\
    \ for a given value of PARCATy, considering only those rows on which both variables\
    \ are populated"
  Rule_Failure_Criteria: "There is more than one value of PARCATyN for a given value\
    \ of PARCATy"
  Condition_Failure: "Considering only those rows on which both PARCATyN and PARCATy\
    \ are populated"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.1"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR731"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.2"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR731"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.3"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR731"
        Version: "1"
      Version: "5.0"
