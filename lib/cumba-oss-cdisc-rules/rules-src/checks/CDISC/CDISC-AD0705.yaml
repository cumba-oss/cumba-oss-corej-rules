Core:
  Id: "CDISC-AD0705"
  Status: "Published"
  Version: "1"
Description: "Raise an error when PBCHG is populated and does not equal the percent\
  \ change computed as BASE minus AVAL, divided by AVAL, times 100"
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "MEDICAL DEVICE BASIC DATA STRUCTURE"
Check:
  expression: >-
    not empty(PBCHG) and PBCHG != (((BASE - AVAL) / AVAL) * 100)
Outcome:
  Message: "PBCHG is populated but does not equal the percent change computed as BASE\
    \ minus AVAL, divided by AVAL, times 100"
  Output_Variables:
  - "PARAMCD"
  - "AVAL"
  - "BASE"
  - "PBCHG"
Source:
  Class: "MEDICAL DEVICE BASIC DATA STRUCTURE"
  Variable_or_Item: "PBCHG"
  Natural_Language_Rule_Failure_Criteria: "Within a given value of PARAMCD for a combination\
    \ of device and subject, PBCHG is populated and is not equal to ((BASE-AVAL)/AVAL)*100"
  Rule_Failure_Criteria: "Within a given value of PARAMCD for a combination of device\
    \ and subject, PBCHG is not equal to ((BASE-AVAL)/AVAL)*100"
  Condition_Failure: "USUBJID and SPDEVID are present and PBCHG is populated"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.3"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR705"
        Version: "1"
      Version: "5.0"
