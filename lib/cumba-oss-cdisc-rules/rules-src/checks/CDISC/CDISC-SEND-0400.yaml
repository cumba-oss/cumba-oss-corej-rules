Core:
  Id: "CDISC-SEND-0400"
  Status: "Published"
  Version: "1"
Description: "Raise an error when any of the Trial Repro Stages (TT), Trial Repro\
  \ Paths (TP), or Subject Reproductive Stages (SJ) datasets is not present in the\
  \ study; all three are required domains for a reproductive/developmental toxicology\
  \ (DART) submission."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "ALL"
Check:
  expression: >-
    not ds_exists("TT") or not ds_exists("TP") or not ds_exists("SJ")
Outcome:
  Message: "One or more of the required DART datasets (TT, TP, SJ) is not present\
    \ in the study."
Source:
  Class: "TDM, SPC"
  Domain: "TT, TP, SJ"
  Variable: "ALL"
  Plain_Text_Explanation: "TT, TP, and SJ domains must be present."
  Rule: "TT, TP, and SJ are present"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "SENDIG-DART"
    Version: "1.2"
    References:
    - Origin: "SEND Conformance Rules"
      Rule_Identifier:
        Id: "SEND400"
        Version: "1"
      Version: "5.0"
  - Name: "SENDIG-DART"
    Version: "1.1"
    References:
    - Origin: "SEND Conformance Rules"
      Rule_Identifier:
        Id: "SEND400"
        Version: "1"
      Version: "5.0"
