Core:
  Id: "CDISC-SEND-0019"
  Status: "Published"
  Version: "1"
Description: "Raise an error when a Test Short Name (--TESTCD) value contains a character\
  \ other than a letter, a number, or an underscore."
Executability: "Fully Executable"
Scope:
  Classes:
    Include:
    - "FINDINGS"
Requirements:
  Variables:
    All:
    - "--TESTCD"
Check:
  expression: >-
    --TESTCD =~ /.*[^A-Za-z0-9_]/
Outcome:
  Message: "--TESTCD value contains a character other than a letter, number, or underscore."
  Output_Variables:
  - "--TESTCD"
Source:
  Class: "FND"
  Domain: "ALL"
  Variable: "--TESTCD"
  Plain_Text_Explanation: "--TESTCD value cannot contain characters other than letters,\
    \ numbers or underscores"
  Rule: "--TESTCD value cannot contain characters other than letters, numbers or underscores"
