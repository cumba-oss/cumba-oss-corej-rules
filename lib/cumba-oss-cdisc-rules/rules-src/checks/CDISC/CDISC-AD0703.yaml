Core:
  Id: "CDISC-AD0703"
  Status: "Published"
  Version: "1"
Description: "Raise an error when BASETYPE is not present, ByIND is populated, and\
  \ ByIND does not equal AyIND from the record where ABLFL equals Y, for a given value\
  \ of PARAMCD, for a combination of device and subject"
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "MEDICAL DEVICE BASIC DATA STRUCTURE"
Operations:
- id: "$baseline_ayind"
  expression: "max(\"AyIND\", group=[USUBJID, PARAMCD, SPDEVID], filter=filter(ABLFL=\"\
    Y\"))"
Check:
  expression: >-
    not var_exists("BASETYPE") and not empty(ByIND) and ByIND != $baseline_ayind
Outcome:
  Message: "BASETYPE is not present and ByIND does not equal the baseline AyIND (from\
    \ the record where ABLFL equals Y) for this device, subject, and PARAMCD"
  Output_Variables:
  - "PARAMCD"
  - "BASETYPE"
  - "ByIND"
wildcards:
  "y":
    min: 1
    max: 99
Source:
  Class: "MEDICAL DEVICE BASIC DATA STRUCTURE"
  Variable_or_Item: "ByIND where y is an integer [1-99, not zero-padded]"
  Natural_Language_Rule_Failure_Criteria: "BASETYPE is not present, ByIND is populated,\
    \ and ByIND is not equal to AyIND where ABLFL is equal to Y for a given value\
    \ of PARAMCD for a combination of device and subject"
  Rule_Failure_Criteria: "ByIND is not equal to AyIND where ABLFL is equal to Y for\
    \ a given value of PARAMCD for a combination of device and subject"
  Condition_Failure: "USUBJID and SPDEVID are present, BASETYPE is not present, and\
    \ ByIND is populated"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.3"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR703"
        Version: "1"
      Version: "5.0"
