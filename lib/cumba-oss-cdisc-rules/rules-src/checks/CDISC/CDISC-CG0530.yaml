Core:
  Id: "CDISC-CG0530"
  Status: "Published"
  Version: "1"
Description: "Raise an error when a subject was not assigned to treatment (ARMNRS\
  \ indicates Screen Failure, Not Assigned or Screening Not Completed) but Subject\
  \ Reference End Date/Time (RFENDTC) is populated; RFENDTC must be empty for such\
  \ subjects."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "DM"
Requirements:
  Variables:
    All:
    - "ARMNRS"
Check:
  expression: >-
    ARMNRS in ["SCREEN FAILURE", "NOT ASSIGNED", "SCREENING NOT COMPLETED"] and not empty(RFENDTC)
Outcome:
  Message: "RFENDTC is populated for a subject who was not assigned to treatment (ARMNRS\
    \ indicates Screen Failure, Not Assigned or Screening Not Completed)."
  Output_Variables:
  - "RFENDTC"
  - "ARMNRS"
Source:
  Class: "SPC"
  Domain: "DM"
  Variable: "RFENDTC"
  Condition: "ARMNRS ^= null"
  Rule: "RFENDTC = null"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "SDTMIG"
    Version: "3.4"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0530"
        Version: "1"
      Version: "2.0"
  - Name: "SDTMIG"
    Version: "3.3"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0530"
        Version: "1"
      Version: "2.0"
