Core:
  Id: "CDISC-AD0126"
  Status: "Published"
  Version: "1"
Description: "Raise an error when there is more than one value of PARCATyN for a given\
  \ value of PARCATy."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "BASIC DATA STRUCTURE"
Check:
  expression: >-
    not empty(PARCATyN) and not empty(PARCATy) and has_multiple_values_for(PARCATyN, PARCATy)
Outcome:
  Message: "PARCATyN has more than one value for this PARCATy."
  Output_Variables:
  - "PARCATy"
  - "PARCATyN"
wildcards:
  "y":
    min: 1
    max: 9
Source:
  Class: "BASIC DATA STRUCTURE"
  Variable_or_Item: "PARCATyN where y is an integer [1-9, not zero-padded]"
  Natural_Language_Rule_Failure_Criteria: "There is more than one value of PARCATyN\
    \ for a given value of PARCATy"
  Rule_Failure_Criteria: "There is more than one value of PARCATyN for a given value\
    \ of PARCATy"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.0"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR126"
        Version: "1"
      Version: "5.0"
