Core:
  Id: "CDISC-AD0352"
  Status: "Published"
  Version: "2"
Description: "Raise an error when AyIND is present and AyLO, AyHI, AyLOC, and AyHIC\
  \ are all not present"
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "BASIC DATA STRUCTURE"
Check:
  expression: >-
    var_exists("AyIND") and not var_exists("AyLO") and not var_exists("AyHI") and not
    var_exists("AyLOC") and not var_exists("AyHIC")
Outcome:
  Message: "AyIND is present, but AyLO, AyHI, AyLOC, and AyHIC are all not present."
  Output_Variables:
  - "AyIND"
wildcards:
  "y":
    min: 1
    max: 99
Source:
  Class: "BASIC DATA STRUCTURE; MEDICAL DEVICE BASIC DATA STRUCTURE"
  Variable_or_Item: "AyIND where y is an integer [1-99, not zero-padded]"
  Natural_Language_Rule_Failure_Criteria: "AyIND is present and AyLO, AyHI, AyLOC,\
    \ and AyHIC are all not present"
  Rule_Failure_Criteria: "AyLO, AyHI, AyLOC, and AyHIC are not present"
  Condition_Failure: "AyIND is present"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.1"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR352"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.2"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR352"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.3"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR352"
        Version: "2"
      Version: "5.0"
