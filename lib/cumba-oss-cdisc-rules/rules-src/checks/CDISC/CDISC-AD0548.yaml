Core:
  Id: "CDISC-AD0548"
  Status: "Published"
  Version: "2"
Description: "Raise an error when AVISITN is present and AVISIT is not present."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "BASIC DATA STRUCTURE"
    - "OCCURRENCE DATA STRUCTURE"
    - "MEDICAL DEVICE OCCURRENCE DATA STRUCTURE"
Check:
  expression: >-
    var_exists("AVISITN") and not var_exists("AVISIT")
Outcome:
  Message: "AVISITN is present, but AVISIT is not present."
  Output_Variables:
  - "AVISITN"
Source:
  Class: "BASIC DATA STRUCTURE; MEDICAL DEVICE BASIC DATA STRUCTURE; OCCURRENCE DATA\
    \ STRUCTURE; MEDICAL DEVICE OCCURRENCE DATA STRUCTURE"
  Variable_or_Item: "AVISITN"
  Natural_Language_Rule_Failure_Criteria: "AVISITN is present and AVISIT is not present"
  Rule_Failure_Criteria: "AVISIT is not present"
  Condition_Failure: "AVISITN is present"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.1"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR548"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.2"
    References:
