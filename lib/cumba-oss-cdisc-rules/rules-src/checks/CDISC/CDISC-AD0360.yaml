Core:
  Id: "CDISC-AD0360"
  Status: "Published"
  Version: "1"
Description: "Raise an error when DTHCAUSN has more than one value for a given value\
  \ of DTHCAUS, considering only records where both variables are populated"
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "SUBJECT LEVEL ANALYSIS DATASET"
Check:
  expression: >-
    not empty(DTHCAUS) and not empty(DTHCAUSN) and has_multiple_values_for(DTHCAUSN, DTHCAUS)
Outcome:
  Message: "DTHCAUSN has more than one value for the same value of DTHCAUS, on the\
    \ records where both variables are populated."
  Output_Variables:
  - "DTHCAUS"
  - "DTHCAUSN"
Source:
  Class: "SUBJECT LEVEL ANALYSIS DATASET"
  Variable_or_Item: "DTHCAUSN"
  Natural_Language_Rule_Failure_Criteria: "There is more than one value of DTHCAUSN\
    \ for a given value of DTHCAUS, considering only those rows on which both variables\
    \ are populated"
  Rule_Failure_Criteria: "There is more than one value of DTHCAUSN for a given value\
    \ of DTHCAUS"
  Condition_Failure: "On rows where both DTHCAUSN and DTHCAUS are both populated."
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.1"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
