Core:
  Id: "CDISC-AD0409"
  Status: "Published"
  Version: "2"
Description: "Raise an error when there is more than one value of ABLFN for a given\
  \ value of ABLFL, considering only rows on which both variables are populated."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "BASIC DATA STRUCTURE"
Requirements:
  Variables:
    All:
    - "ABLFL"
    - "ABLFN"
Check:
  expression: >-
    not empty(ABLFL) and not empty(ABLFN) and has_multiple_values_for(ABLFN, ABLFL)
Outcome:
  Message: "There is more than one value of ABLFN for a given value of ABLFL, though\
    \ both variables are populated."
  Output_Variables:
  - "ABLFL"
  - "ABLFN"
Source:
  Class: "BASIC DATA STRUCTURE; MEDICAL DEVICE BASIC DATA STRUCTURE"
  Variable_or_Item: "ABLFN"
  Natural_Language_Rule_Failure_Criteria: "There is more than one value of ABLFN for\
    \ a given value of ABLFL, considering only those rows on which both variables\
    \ are populated"
  Rule_Failure_Criteria: "There is more than one value of ABLFN for a given value\
    \ of ABLFL"
  Condition_Failure: "On rows where both ABLFN and ABLFL are both populated."
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.2"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR409"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.3"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR409"
        Version: "2"
      Version: "5.0"
