Core:
  Id: "CDISC-SEND-0240.1"
  Status: "Published"
  Version: "1"
Description: "Raise an error when, for the planned test article dose level parameter\
  \ (TXPARMCD equals 'TRTDOS'), the value (TXVAL) is not a number, a semicolon-delimited\
  \ string of numbers without spaces, or 'SEE PROTOCOL'."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "TX"
Requirements:
  Variables:
    All:
    - "TXPARMCD"
    - "TXVAL"
Check:
  expression: >-
    TXPARMCD == "TRTDOS" and TXVAL !~ /^(SEE PROTOCOL|-?\\d+(\\.\\d+)?(;-?\\d+(\\.\\d+)?)*)$/
Outcome:
  Message: "TXVAL for TXPARMCD equal to 'TRTDOS' is not numeric, a semicolon-delimited\
    \ numeric string, or 'SEE PROTOCOL'."
  Output_Variables:
  - "TXPARMCD"
  - "TXVAL"
Source:
  Class: "TDM"
  Domain: "TX"
  Variable: "TXPARMCD"
  Plain_Text_Explanation: "The value of TRTDOS is either a number, a semicolon-delimited\
    \ string containing numbers without spaces, or \"SEE PROTOCOL\" for more complex\
    \ dosing regimens."
  Condition: "TXPARMCD = \"TRTDOS\""
  Rule: "TXVAL is numeric OR TXVAL is a semicolon delimited string containing numbers\
    \ without spaces OR TXVAL = \"SEE PROTOCOL\""
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "SENDIG-GENETOX"
    Version: "1.0"
    References:
