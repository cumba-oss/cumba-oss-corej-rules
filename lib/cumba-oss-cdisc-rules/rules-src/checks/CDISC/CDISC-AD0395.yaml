Core:
  Id: "CDISC-AD0395"
  Status: "Published"
  Version: "2"
Description: "Raise an error when there is more than one value of ATOXGRL for a given\
  \ value of ATOXGRLN within a parameter, considering only records where both variables\
  \ are populated"
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "BASIC DATA STRUCTURE"
Check:
  expression: >-
    not empty(ATOXGRL) and not empty(ATOXGRLN) and has_multiple_values_for(ATOXGRL, ATOXGRLN,
    within=PARAMCD)
Outcome:
  Message: "Within this parameter, more than one value of ATOXGRL is present for the\
    \ same populated value of ATOXGRLN"
  Output_Variables:
  - "PARAMCD"
  - "ATOXGRL"
  - "ATOXGRLN"
Source:
  Class: "BASIC DATA STRUCTURE; MEDICAL DEVICE BASIC DATA STRUCTURE"
  Variable_or_Item: "ATOXGRL"
  Natural_Language_Rule_Failure_Criteria: "Within a parameter, there is more than\
    \ one value of ATOXGRL for a given value of ATOXGRLN, considering only those rows\
    \ on which both variables are populated"
  Rule_Failure_Criteria: "Within a parameter, there is more than one value of ATOXGRL\
    \ for a given value of ATOXGRLN"
  Condition_Failure: "On rows where both ATOXGRL and ATOXGRLN are both populated"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.2"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR395"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.3"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR395"
        Version: "2"
      Version: "5.0"
