Core:
  Id: "CDISC-AD0525"
  Status: "Published"
  Version: "2"
Description: "Raise an error when ABLFN is present but ABLFL is not present."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "BASIC DATA STRUCTURE"
Check:
  expression: >-
    var_exists("ABLFN") and not var_exists("ABLFL")
Outcome:
  Message: "ABLFN is present but ABLFL is not present."
  Output_Variables:
  - "ABLFN"
Source:
  Class: "BASIC DATA STRUCTURE; MEDICAL DEVICE BASIC DATA STRUCTURE"
  Variable_or_Item: "ABLFN"
  Natural_Language_Rule_Failure_Criteria: "ABLFN is present and ABLFL is not present"
  Rule_Failure_Criteria: "ABLFL is not present"
  Condition_Failure: "ABLFN is present"
Standards:
- Organization: "CDISC"
  Standards:
