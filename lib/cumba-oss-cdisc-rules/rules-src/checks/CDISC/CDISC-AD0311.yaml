Core:
  Id: "CDISC-AD0311"
  Status: "Published"
  Version: "1"
Description: "Raise an error when there is more than one value of SMQzzSCN for a given\
  \ value of SMQzzSC, where zz is an integer [01-99, zero-padded]."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "OCCURRENCE DATA STRUCTURE"
Check:
  expression: >-
    not empty(SMQzzSCN) and not empty(SMQzzSC) and has_multiple_values_for(SMQzzSCN, SMQzzSC)
Outcome:
  Message: "SMQzzSCN has more than one value for the same value of SMQzzSC, where\
    \ zz is an integer [01-99, zero-padded]."
  Output_Variables:
  - "SMQzzSC"
  - "SMQzzSCN"
wildcards:
  zz:
    min: 1
    max: 99
Source:
  Class: "OCCURRENCE DATA STRUCTURE"
  Variable_or_Item: "SMQzzSCN where zz is an integer [01-99, zero-padded]"
  Natural_Language_Rule_Failure_Criteria: "There is more than one value of SMQzzSCN\
    \ for a given value of SMQzzSC"
  Rule_Failure_Criteria: "There is more than one value of SMQzzSCN for a given value\
    \ of SMQzzSC"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.0"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR311"
        Version: "1"
      Version: "5.0"
