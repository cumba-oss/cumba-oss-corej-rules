Core:
  Id: "CDISC-CG0567"
  Status: "Published"
  Version: "1"
Description: "Raise an error when --EVDTYP is present in an Events-class dataset whose\
  \ domain is not MH."
Executability: "Fully Executable"
Scope:
  Classes:
    Include:
    - "EVENTS"
  Domains:
    Exclude:
    - "MH"
Check:
  expression: >-
    var_exists("--EVDTYP")
Outcome:
  Message: "--EVDTYP is present in an Events dataset other than MH, but it is a domain-specific\
    \ variable permitted only in the MH domain."
  Output_Variables:
  - "--EVDTYP"
Source:
  Class: "EVT"
  Domain: "NOT(MH)"
  Variable: "--EVDTYP"
  Rule: "--EVDTYP not present in dataset"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "SDTMIG"
    Version: "3.4"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0567"
        Version: "1"
      Version: "2.0"
  - Name: "SDTMIG"
    Version: "3.3"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0567"
        Version: "1"
      Version: "2.0"
