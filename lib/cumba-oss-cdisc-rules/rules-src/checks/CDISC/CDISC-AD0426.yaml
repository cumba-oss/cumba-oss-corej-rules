Core:
  Id: "CDISC-AD0426"
  Status: "Published"
  Version: "2"
Description: "Raise an error when TRTAGyN is populated but TRTAGy is empty"
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "BASIC DATA STRUCTURE"
    - "OCCURRENCE DATA STRUCTURE"
    - "MEDICAL DEVICE OCCURRENCE DATA STRUCTURE"
Check:
  expression: >-
    not empty(TRTAGyN) and empty(TRTAGy)
Outcome:
  Message: "TRTAGyN is populated, but TRTAGy is empty"
  Output_Variables:
  - "TRTAGy"
  - "TRTAGyN"
wildcards:
  "y":
    min: 1
    max: 99
Source:
  Class: "BASIC DATA STRUCTURE; MEDICAL DEVICE BASIC DATA STRUCTURE; OCCURRENCE DATA\
    \ STRUCTURE; MEDICAL DEVICE OCCURRENCE DATA STRUCTURE"
  Variable_or_Item: "TRTAGy where y is an integer [1-99, not zero-padded]"
  Natural_Language_Rule_Failure_Criteria: "On a given record, TRTAGyN is populated\
    \ and TRTAGy is not populated"
  Rule_Failure_Criteria: "TRTAGy is not populated"
  Condition_Failure: "TRTAGyN is populated"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.2"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR426"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.3"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR426"
        Version: "2"
      Version: "5.0"
