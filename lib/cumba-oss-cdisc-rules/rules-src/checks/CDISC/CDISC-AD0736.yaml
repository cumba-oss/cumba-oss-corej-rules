Core:
  Id: "CDISC-AD0736"
  Status: "Published"
  Version: "1"
Description: "Raise an error when, within a given value of PARAMCD, there is more\
  \ than one value of SHIFTy for a given value of SHIFTyN, considering only rows on\
  \ which both variables are populated"
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "BASIC DATA STRUCTURE"
Check:
  expression: >-
    not empty(SHIFTy) and not empty(SHIFTyN) and has_multiple_values_for(SHIFTy, SHIFTyN,
    within=PARAMCD)
Outcome:
  Message: "SHIFTy has more than one value for this SHIFTyN within this PARAMCD, among\
    \ rows where both are populated"
  Output_Variables:
  - "PARAMCD"
  - "SHIFTy"
  - "SHIFTyN"
wildcards:
  "y":
    min: 1
    max: 99
Source:
  Class: "BASIC DATA STRUCTURE; MEDICAL DEVICE BASIC DATA STRUCTURE"
  Variable_or_Item: "SHIFTy where y is an integer [1-99, not zero-padded]"
  Natural_Language_Rule_Failure_Criteria: "Within a given value of PARAMCD, there\
    \ is more than one value of SHIFTy for a given value of SHIFTyN, considering only\
    \ those rows on which both variables are populated"
  Rule_Failure_Criteria: "Within a given value of PARAMCD, there is more than one\
    \ value of SHIFTy for a given value of SHIFTyN"
  Condition_Failure: "On rows where SHIFTy and SHIFTyN are both populated"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.1"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR736"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.2"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR736"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.3"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR736"
        Version: "1"
      Version: "5.0"
