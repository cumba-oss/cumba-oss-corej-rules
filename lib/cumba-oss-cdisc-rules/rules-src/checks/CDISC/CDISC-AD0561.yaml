Core:
  Id: "CDISC-AD0561"
  Status: "Published"
  Version: "1"
Description: "Raise an error when STRATwRN is present and STRATwR is not present for\
  \ the same value of 'w'."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "SUBJECT LEVEL ANALYSIS DATASET"
Check:
  expression: >-
    var_exists("STRATwRN") and not var_exists("STRATwR")
Outcome:
  Message: "STRATwRN is present, but STRATwR is not present."
  Output_Variables:
  - "STRATwRN"
wildcards:
  w:
    min: 1
    max: 9
Source:
  Class: "SUBJECT LEVEL ANALYSIS DATASET"
  Variable_or_Item: "STRATwRN where w is an integer [1-9, not zero-padded]"
  Natural_Language_Rule_Failure_Criteria: "STRATwRN is present and STRATwR is not\
    \ present for the same value of \"w\""
  Rule_Failure_Criteria: "STRATwR is not present"
  Condition_Failure: "STRATwRN is present"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.2"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR561"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.3"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR561"
        Version: "1"
      Version: "5.0"
