Core:
  Id: "CDISC-AD0646"
  Status: "Published"
  Version: "1"
Description: "Raise an error when AEACN is populated on at least one SDTM AE record\
  \ but AEACN is not present in the ADAE dataset."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "OCCURRENCE DATA STRUCTURE"
  Subclasses:
    Include:
    - "ADVERSE EVENT"
Operations:
- id: "$ae_aeacn_pop"
  expression: "record_count(AEACN, domain=\"AE\", filter=filter(AEACN=\"&\"))"
Check:
  expression: >-
    $ae_aeacn_pop > 0 and not var_exists("AEACN")
Outcome:
  Message: "AE.AEACN is present and populated on at least one record but AEACN is\
    \ not present"
  Output_Variables:
  - "$ae_aeacn_pop"
  - "AEACN"
Source:
  Class: "OCCURRENCE DATA STRUCTURE"
  Subclass: "ADVERSE EVENT"
  Variable_or_Item: "AE.AEACN"
  Natural_Language_Rule_Failure_Criteria: "AE.AEACN is present and populated on at\
    \ least one record but AEACN is not present"
  Rule_Failure_Criteria: "AEACN is not present"
  Condition_Failure: "AE.AEACN is present and populated on at least one record"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.0"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR646"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.1"
    References:
