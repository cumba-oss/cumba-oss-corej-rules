Core:
  Id: "CDISC-AD0839"
  Status: "Published"
  Version: "1"
Description: "Raise an error when BLQFN is present and BLQFL is not present."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "BASIC DATA STRUCTURE"
Check:
  expression: >-
    var_exists("BLQFN") and not var_exists("BLQFL")
Outcome:
  Message: "BLQFN is present, but BLQFL is not present."
  Output_Variables:
  - "BLQFN"
Source:
  Class: "BASIC DATA STRUCTURE"
  Subclass: "POPULATION PHARMACOKINETIC ANALYSIS"
  Variable_or_Item: "BLQFN"
  Natural_Language_Rule_Failure_Criteria: "BLQFN is present and BLQFL is not present"
  Rule_Failure_Criteria: "BLQFL is not present"
  Condition_Failure: "BLQFN is present"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.3"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR839"
        Version: "1"
      Version: "5.0"
