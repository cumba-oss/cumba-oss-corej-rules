Core:
  Id: "CDISC-AD0814"
  Status: "Published"
  Version: "1"
Description: "Raise an error when USUBJIDN is present and USUBJID is not present."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "BASIC DATA STRUCTURE"
Check:
  expression: >-
    var_exists("USUBJIDN") and not var_exists("USUBJID")
Outcome:
  Message: "USUBJIDN is present, but USUBJID is not present."
  Output_Variables:
  - "USUBJIDN"
Source:
  Class: "BASIC DATA STRUCTURE"
  Subclass: "POPULATION PHARMACOKINETIC ANALYSIS"
  Variable_or_Item: "USUBJIDN"
  Natural_Language_Rule_Failure_Criteria: "USUBJIDN is present and USUBJID is not\
    \ present"
  Rule_Failure_Criteria: "USUBJID is not present"
  Condition_Failure: "USUBJIDN is present"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.3"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR814"
        Version: "1"
      Version: "5.0"
