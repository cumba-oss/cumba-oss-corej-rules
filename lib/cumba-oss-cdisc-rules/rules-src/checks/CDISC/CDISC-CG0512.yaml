Core:
  Id: "CDISC-CG0512"
  Status: "Published"
  Version: "1"
Description: "Raise an error when, for a study that does not use multi-stage Arm assignments,\
  \ Actual Arm Code (ACTARMCD) is populated and its value is not an Arm Code (ARMCD)\
  \ in the Trial Arms (TA) dataset."
Executability: "Partially Executable - Possible Overreporting"
Scope:
  Domains:
    Include:
    - "DM"
Operations:
- id: "$ta_armcd"
  expression: "distinct(ARMCD, domain=\"TA\")"
Check:
  expression: >-
    not empty(ACTARMCD) and ACTARMCD not in $ta_armcd
Outcome:
  Message: "ACTARMCD is populated but is not a value of ARMCD in the TA dataset."
  Output_Variables:
  - "ACTARMCD"
  - "$ta_armcd"
Source:
  Class: "SPC"
  Domain: "DM"
  Variable: "ACTARMCD"
  Condition: "Study does not use multi-stage arm assignments and ACTARMCD ^= null"
  Rule: "ACTARMCD in TA.ARMCD"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "SDTMIG"
    Version: "3.4"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0512"
        Version: "1"
      Version: "2.0"
  - Name: "SDTMIG"
    Version: "3.3"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0512"
        Version: "1"
      Version: "2.0"
