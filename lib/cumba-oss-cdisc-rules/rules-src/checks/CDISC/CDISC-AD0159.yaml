Core:
  Id: "CDISC-AD0159"
  Status: "Published"
  Version: "2"
Description: "Raise an error when AWTDIFF is populated and AWTARGET is missing"
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "BASIC DATA STRUCTURE"
Requirements:
  Variables:
    All:
    - "AWTDIFF"
    - "AWTARGET"
Check:
  expression: >-
    not empty(AWTDIFF) and empty(AWTARGET)
Outcome:
  Message: "AWTDIFF is populated, but AWTARGET is missing"
  Output_Variables:
  - "AWTARGET"
  - "AWTDIFF"
Source:
  Class: "BASIC DATA STRUCTURE; MEDICAL DEVICE BASIC DATA STRUCTURE"
  Variable_or_Item: "AWTARGET"
  Natural_Language_Rule_Failure_Criteria: "AWTDIFF is populated and AWTARGET is not\
    \ populated"
  Rule_Failure_Criteria: "AWTARGET is not populated"
  Condition_Failure: "AWTDIFF is populated"
Standards:
- Organization: "CDISC"
  Standards:
