Core:
  Id: "CDISC-SEND-0236.1"
  Status: "Published"
  Version: "1"
Description: "Raise an error when the Trial Set Parameter Value (TXVAL) of a record\
  \ with TXPARMCD equal to 'ARMCD' does not match any Planned Arm Code (ARMCD) value\
  \ in the Trial Arms (TA) dataset."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "TX"
Requirements:
  Variables:
    All:
    - "TXPARMCD"
Operations:
- id: "$ta_armcd"
  expression: "distinct(ARMCD, domain=\"TA\")"
Check:
  expression: >-
    TXPARMCD == "ARMCD" and TXVAL not in $ta_armcd
Outcome:
  Message: "TXVAL for a record with TXPARMCD equal to 'ARMCD' does not match any ARMCD\
    \ value in the Trial Arms (TA) dataset."
  Output_Variables:
  - "TXPARMCD"
  - "TXVAL"
  - "$ta_armcd"
Source:
  Class: "TDM"
  Domain: "TX"
  Variable: "ARMCD"
  Plain_Text_Explanation: "The value of TXVAL for records with TXPARMCD = \"ARMCD\"\
    \ must be present in the TA.ARMCD"
  Condition: "TXPARMCD = \"ARMCD\""
  Rule: "TXVAL is present in the TA.ARMCD"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "SENDIG-GENETOX"
    Version: "1.0"
    References:
    - Origin: "SEND Conformance Rules"
      Rule_Identifier:
