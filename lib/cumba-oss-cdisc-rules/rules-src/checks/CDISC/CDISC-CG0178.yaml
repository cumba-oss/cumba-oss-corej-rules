Core:
  Id: "CDISC-CG0178"
  Status: "Published"
  Version: "1"
Description: "Raise an error when IETEST does not match any IETEST value in the TI\
  \ dataset."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "IE"
Operations:
- id: "$ti_ietest"
  expression: "distinct(IETEST, domain=\"TI\")"
Check:
  expression: >-
    IETEST not in $ti_ietest
Outcome:
  Message: "IETEST does not match any IETEST value in the TI dataset."
  Output_Variables:
  - "IETEST"
  - "$ti_ietest"
Source:
  Class: "FND"
  Domain: "IE"
  Variable: "IETEST"
  Rule: "IETEST in TI.IETEST"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "SDTMIG"
    Version: "3.4"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0178"
        Version: "1"
      Version: "2.0"
  - Name: "SDTMIG"
    Version: "3.3"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0178"
        Version: "1"
      Version: "2.0"
  - Name: "SDTMIG"
    Version: "3.2"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0178"
        Version: "1"
      Version: "2.0"
