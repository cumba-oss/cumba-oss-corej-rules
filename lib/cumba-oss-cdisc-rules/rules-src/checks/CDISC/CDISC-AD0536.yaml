Core:
  Id: "CDISC-AD0536"
  Status: "Published"
  Version: "2"
Description: "Raise an error when ATOXGRN is present but ATOXGR is not present."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "OCCURRENCE DATA STRUCTURE"
    - "MEDICAL DEVICE OCCURRENCE DATA STRUCTURE"
Check:
  expression: >-
    var_exists("ATOXGRN") and not var_exists("ATOXGR")
Outcome:
  Message: "ATOXGRN is present but ATOXGR is not present."
  Output_Variables:
  - "ATOXGRN"
Source:
  Class: "OCCURRENCE DATA STRUCTURE; MEDICAL DEVICE OCCURRENCE DATA STRUCTURE"
  Variable_or_Item: "ATOXGRN"
  Natural_Language_Rule_Failure_Criteria: "ATOXGRN is present and ATOXGR is not present"
  Rule_Failure_Criteria: "ATOXGR is not present"
  Condition_Failure: "ATOXGRN is present"
