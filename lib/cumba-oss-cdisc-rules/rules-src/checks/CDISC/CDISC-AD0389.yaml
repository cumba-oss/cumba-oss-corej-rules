Core:
  Id: "CDISC-AD0389"
  Status: "Published"
  Version: "2"
Description: "Raise an error when BTOXGRH is populated and BTOXGRHN is not populated."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "BASIC DATA STRUCTURE"
    - "MEDICAL DEVICE BASIC DATA STRUCTURE"
Requirements:
  Variables:
    All:
    - "BTOXGRH"
    - "BTOXGRHN"
Check:
  expression: >-
    not empty(BTOXGRH) and empty(BTOXGRHN)
Outcome:
  Message: "BTOXGRH is populated but BTOXGRHN is not populated."
  Output_Variables:
  - "BTOXGRH"
  - "BTOXGRHN"
Source:
  Class: "BASIC DATA STRUCTURE; MEDICAL DEVICE BASIC DATA STRUCTURE"
  Variable_or_Item: "BTOXGRHN"
  Natural_Language_Rule_Failure_Criteria: "On a given record, BTOXGRH is populated\
    \ and BTOXGRHN is not populated"
  Rule_Failure_Criteria: "BTOXGRHN is not populated"
  Condition_Failure: "BTOXGRH is populated"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.2"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR389"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.3"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR389"
        Version: "2"
      Version: "5.0"
