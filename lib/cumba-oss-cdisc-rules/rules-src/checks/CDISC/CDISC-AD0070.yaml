Core:
  Id: "CDISC-AD0070"
  Status: "Published"
  Version: "1"
Description: "Raise an error when TRxxAGyN is present and the corresponding TRxxAGy\
  \ is not present, where xx is an integer [01-99, zero-padded] and y is an integer\
  \ [1-99, not zero-padded]"
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "SUBJECT LEVEL ANALYSIS DATASET"
Check:
  expression: >-
    var_exists("TRxxAGyN") and not var_exists("TRxxAGy")
Outcome:
  Message: "TRxxAGyN is present but the corresponding TRxxAGy is not present"
  Output_Variables:
  - "TRxxAGyN"
wildcards:
  xx:
    min: 1
    max: 99
  "y":
    min: 1
    max: 99
Source:
  Class: "SUBJECT LEVEL ANALYSIS DATASET"
  Natural_Language_Rule_Failure_Criteria: "A variable with a prefix of TR, containing\
    \ AG with a suffix of N is present and a variable with the same root without a\
    \ suffix of N is not present"
  Rule_Failure_Criteria: "A  variable with the same root without a suffix of N is\
    \ not present"
  Condition_Failure: "A variable with a prefix of TR, containing AG and a suffix of\
    \ N is present"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.0"
    References:
