Core:
  Id: "CDISC-AD0622"
  Status: "Published"
  Version: "1"
Description: "Raise an error when AEOCCUR is present in an ADVERSE EVENT sub-class\
  \ OCCDS dataset (e.g., ADAE), since AEOCCUR is disallowed for the AE sub-class per\
  \ OCCDS v1.1."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "OCCURRENCE DATA STRUCTURE"
  Subclasses:
    Include:
    - "ADVERSE EVENT"
Check:
  expression: >-
    var_exists("AEOCCUR")
Outcome:
  Message: "AEOCCUR is present"
  Output_Variables:
  - "AEOCCUR"
Source:
  Class: "OCCURRENCE DATA STRUCTURE"
  Subclass: "ADVERSE EVENT"
  Variable_or_Item: "AEOCCUR"
  Natural_Language_Rule_Failure_Criteria: "AEOCCUR is present"
  Rule_Failure_Criteria: "AEOCCUR is present"
