Core:
  Id: "CDISC-AD0749"
  Status: "Published"
  Version: "1"
Description: "Raise an error when, within a given value of PARAMCD, there is more\
  \ than one value of BASECATy for a given value of BASE, where y is an integer [1-99,\
  \ not zero-padded], considering only rows on which both variables are populated"
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "BASIC DATA STRUCTURE"
Check:
  expression: >-
    not empty(BASECATy) and not empty(BASE) and has_multiple_values_for(BASECATy, BASE,
    within=PARAMCD)
Outcome:
  Message: "BASECATy has more than one value for this BASE within this PARAMCD, among\
    \ rows where both are populated"
  Output_Variables:
  - "PARAMCD"
  - "BASE"
  - "BASECATy"
wildcards:
  "y":
    min: 1
    max: 99
Source_Proposed:
  Sheet_Issue: "#65,#155"
  Class: "BASIC DATA STRUCTURE; MEDICAL DEVICE BASIC DATA STRUCTURE"
  Subclass: ""
  SEND_SDTM_Domain: ""
  Variable_or_Item: "BASECATy where y is an integer [1-99, not zero-padded]"
  Natural_Language_Rule_Failure_Criteria: "Within a given value of PARAMCD, there\
    \ is more than one value of BASECATy for a given value of BASE and y, where y\
    \ is a single-digit integer [1-9]"
  Rule_Failure_Criteria: "There is more than one value of BASECATy for a given value\
    \ of BASE"
  Condition_Failure: "Within a given value of PARAMCD"
Source:
  Class: "BASIC DATA STRUCTURE; MEDICAL DEVICE BASIC DATA STRUCTURE"
  Variable_or_Item: "BASECATy where y is an integer [1-9, not zero-padded]"
  Natural_Language_Rule_Failure_Criteria: "Within a given value of PARAMCD, there\
    \ is more than one value of BASECATy for a given value of BASE and y, where y\
    \ is a single-digit integer [1-9]"
  Rule_Failure_Criteria: "There is more than one value of BASECATy for a given value\
    \ of AVAL"
  Condition_Failure: "Within a given value of PARAMCD"
Standards:
