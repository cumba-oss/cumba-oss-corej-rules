Core:
  Id: "CDISC-SEND-0107"
  Status: "Published"
  Version: "1"
Description: "Raise an error when Planned Arm Code (ARMCD) is empty in DM; ARMCD should\
  \ be populated when planned Arms have been defined in the Trial Arms (TA) dataset."
Executability: "Partially Executable - Possible Overreporting"
Scope:
  Domains:
    Include:
    - "DM"
Check:
  expression: >-
    empty(ARMCD)
Outcome:
  Message: "ARMCD is not populated in DM."
  Output_Variables:
  - "ARMCD"
Source:
  Class: "SPC"
  Domain: "DM"
  Variable: "ARMCD"
  Plain_Text_Explanation: "If any arm is defined in TA, ARMCD must be populated in\
    \ DM"
  Condition: "TA exists"
  Rule: "DM.ARMCD ^= null"
