Core:
  Id: "CDISC-AD0201"
  Status: "Published"
  Version: "2"
Description: "Raise an error when TRTAGyN is present and TRTAGy is not present"
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "BASIC DATA STRUCTURE"
Check:
  expression: >-
    var_exists("TRTAGyN") and not var_exists("TRTAGy")
Outcome:
  Message: "TRTAGyN is present, but TRTAGy is not present"
  Output_Variables:
  - "TRTAGyN"
wildcards:
  "y":
    min: 1
    max: 99
Source:
  Class: "BASIC DATA STRUCTURE; MEDICAL DEVICE BASIC DATA STRUCTURE"
  Variable_or_Item: "TRTAGy where y is an integer [1-99, not zero-padded]"
  Natural_Language_Rule_Failure_Criteria: "TRTAGyN is present and TRTAGy is not present"
  Rule_Failure_Criteria: "TRTAGy is not present"
  Condition_Failure: "TRTAGyN is present"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.0"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR201"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.1"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR201"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.2"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR201"
        Version: "1"
      Version: "5.0"
