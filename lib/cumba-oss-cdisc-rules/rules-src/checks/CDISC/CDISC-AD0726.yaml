Core:
  Id: "CDISC-AD0726"
  Status: "Published"
  Version: "1"
Description: "Raise an error when there is more than one value of APERIOD for a given\
  \ value of APERIODC, considering only rows on which both variables are populated"
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "ALL"
Check:
  expression: >-
    not empty(APERIOD) and not empty(APERIODC) and has_multiple_values_for(APERIOD, APERIODC)
Outcome:
  Message: "APERIOD has more than one value for this APERIODC, among rows where both\
    \ are populated"
  Output_Variables:
  - "APERIOD"
  - "APERIODC"
Source:
  Class: "ALL"
  Variable_or_Item: "APERIOD"
  Natural_Language_Rule_Failure_Criteria: "There is more than one value of APERIOD\
    \ for a given value of APERIODC, considering only those rows on which both variables\
    \ are populated"
  Rule_Failure_Criteria: "There is more than one value of APERIOD for a given value\
    \ of APERIODC"
  Condition_Failure: "On rows where APERIOD and APERIODC are both populated"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.1"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR726"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.2"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR726"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.3"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR726"
        Version: "1"
      Version: "5.0"
