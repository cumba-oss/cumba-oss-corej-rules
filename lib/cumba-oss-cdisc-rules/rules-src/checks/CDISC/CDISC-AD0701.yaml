Core:
  Id: "CDISC-AD0701"
  Status: "Published"
  Version: "1"
Description: "Raise an error when PCHG is populated and does not equal AVAL minus\
  \ BASE, divided by BASE, times 100."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "MEDICAL DEVICE BASIC DATA STRUCTURE"
Check:
  expression: >-
    not empty(PCHG) and PCHG != (((AVAL - BASE) / BASE) * 100)
Outcome:
  Message: "PCHG is populated but does not equal ((AVAL minus BASE) divided by BASE)\
    \ times 100 for this record."
  Output_Variables:
  - "PARAMCD"
  - "AVAL"
  - "BASE"
  - "PCHG"
Source:
  Class: "MEDICAL DEVICE BASIC DATA STRUCTURE"
  Variable_or_Item: "PCHG"
  Natural_Language_Rule_Failure_Criteria: "Within a given value of PARAMCD for a combination\
    \ of device and subject, PCHG is populated and is not equal to ((AVAL - BASE)/BASE)*100"
  Rule_Failure_Criteria: "Within a given value of PARAMCD for a combination of device\
    \ and subject, PCHG is not equal to ((AVAL - BASE)/BASE)*100"
  Condition_Failure: "USUBJID and SPDEVID are present and PCHG is populated"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.3"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR701"
        Version: "1"
      Version: "5.0"
