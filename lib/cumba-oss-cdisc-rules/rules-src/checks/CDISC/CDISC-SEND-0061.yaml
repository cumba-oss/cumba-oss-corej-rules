Core:
  Id: "CDISC-SEND-0061"
  Status: "Published"
  Version: "1"
Description: "Raise an error when a duration variable (--EVLINT, --ELTM, or --DUR)\
  \ mixes a week (W) component with any other ISO 8601 date/time component (Y, M,\
  \ D, H, or S)."
Executability: "Fully Executable"
Scope:
  Classes:
    Include:
    - "INTERVENTIONS"
    - "EVENTS"
    - "FINDINGS"
Check:
  expression: >-
    var_exists("--EVLINT") and not empty(--EVLINT) and --EVLINT =~ /.*[0-9]W/ and --EVLINT =~
    /.*[0-9][DHMSY]/ or var_exists("--ELTM") and not empty(--ELTM) and --ELTM =~ /.*[0-9]W/ and
    --ELTM =~ /.*[0-9][DHMSY]/ or var_exists("--DUR") and not empty(--DUR) and --DUR =~ /.*[0-9]W/
    and --DUR =~ /.*[0-9][DHMSY]/
Outcome:
  Message: "--EVLINT, --ELTM, or --DUR mixes a week (W) component with another date/time\
    \ component, which is not permitted in an ISO 8601 duration."
  Output_Variables:
  - "--EVLINT"
  - "--ELTM"
  - "--DUR"
Source:
  Class: "INT, EVT, FND"
  Domain: "ALL"
  Variable: "--EVLINT, --ELTM, --DUR"
  Plain_Text_Explanation: "Weeks cannot be mixed with any other date/time components\
    \ such as days or months in duration expressions."
  Rule: "Weeks cannot be mixed with any other date/time components such as days or\
    \ months in duration expressions."
