Core:
  Id: "CDISC-AD0208"
  Status: "Published"
  Version: "1"
Description: "Raise an error when, for a subject, DM has a value for SUBJID and ADSL.SUBJID\
  \ does not equal that value"
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "SUBJECT LEVEL ANALYSIS DATASET"
Match_Datasets:
- Name: "DM"
  Keys:
  - "USUBJID"
Check:
  expression: >-
    var_exists(DM.SUBJID) and SUBJID != DM.SUBJID
Outcome:
  Message: "For this subject, ADSL.SUBJID does not equal DM.SUBJID"
  Output_Variables:
  - "SUBJID"
  - "DM.SUBJID"
Source:
  Class: "SUBJECT LEVEL ANALYSIS DATASET"
  Variable_or_Item: "SUBJID"
  Natural_Language_Rule_Failure_Criteria: "The value of ADSL.USUBJID is equal to the\
    \ value of DM.USUBJID and ADSL.SUBJID is not equal to DM.SUBJID"
  Rule_Failure_Criteria: "ADSL.SUBJID is not equal to DM.SUBJID"
  Condition_Failure: "The value of ADSL.USUBJID is equal to the value of DM.USUBJID"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.0"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR208"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.1"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR208"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.2"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR208"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.3"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR208"
        Version: "1"
      Version: "5.0"
