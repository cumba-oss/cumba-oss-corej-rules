Core:
  Id: "CDISC-AD0833"
  Status: "Published"
  Version: "1"
Description: "Raise an error when, within a dataset, there is more than one value\
  \ of DVID for a given value of DVIDN, considering only records where both variables\
  \ are populated"
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "BASIC DATA STRUCTURE"
Check:
  expression: >-
    not empty(DVID) and not empty(DVIDN) and has_multiple_values_for(DVID, DVIDN)
Outcome:
  Message: "Within this dataset, more than one value of DVID is present for the same\
    \ populated value of DVIDN"
  Output_Variables:
  - "DVID"
  - "DVIDN"
Source:
  Class: "BASIC DATA STRUCTURE"
  Subclass: "POPULATION PHARMACOKINETIC ANALYSIS"
  Variable_or_Item: "DVID"
  Natural_Language_Rule_Failure_Criteria: "Within a dataset, there is more than one\
    \ value of DVID for a given value of DVIDN, considering only those rows on which\
    \ both variables are populated"
  Rule_Failure_Criteria: "Within a dataset, there is more than one value of DVID for\
    \ a given value of DVIDN"
  Condition_Failure: "On rows where both DVID and DVIDN are both populated"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.3"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR833"
        Version: "1"
      Version: "5.0"
