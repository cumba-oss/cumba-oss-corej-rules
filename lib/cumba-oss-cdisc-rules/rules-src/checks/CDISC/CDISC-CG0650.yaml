Core:
  Id: "CDISC-CG0650"
  Status: "Published"
  Version: "1"
Description: "Raise an error when an Associated Persons non-supplemental qualifier\
  \ dataset associated with a split dataset has a dataset name length shorter than\
  \ or equal to 4 or greater than 6 characters."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "AP--"
    include_split_datasets: true
Check:
  expression: >-
    len(dataset_name) > 6 or len(dataset_name) <= 4
Outcome:
  Message: "Split dataset name length of an Associated Persons non-supplemental qualifier\
    \ dataset is shorter than or equal to 4 or greater than 6 characters."
  Output_Variables:
  - "dataset_name"
Source:
  Class: "AP"
  Domain: "ALL"
  Variable: "GEN"
  Condition: "Non-Supplemental Qualifier datasets"
  Rule: "Split dataset names length > 4 and <= 6"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "SDTMIG"
    Version: "3.4"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0650"
        Version: "1"
      Version: "2.0"
  - Name: "SDTMIG"
    Version: "3.3"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0650"
        Version: "1"
      Version: "2.0"
  - Name: "SDTMIG"
    Version: "3.2"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0650"
        Version: "1"
      Version: "2.0"
