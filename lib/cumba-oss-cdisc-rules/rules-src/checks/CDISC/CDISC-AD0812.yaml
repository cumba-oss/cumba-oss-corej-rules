Core:
  Id: "CDISC-AD0812"
  Status: "Published"
  Version: "1"
Description: "Raise an error when, within a dataset, there is more than one value\
  \ of USUBJIDN for a given value of USUBJID, considering only rows on which both\
  \ variables are populated"
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "BASIC DATA STRUCTURE"
Check:
  expression: >-
    not empty(USUBJID) and not empty(USUBJIDN) and has_multiple_values_for(USUBJIDN, USUBJID)
Outcome:
  Message: "USUBJIDN takes more than one value for the same value of USUBJID within\
    \ this dataset, considering only rows on which both variables are populated."
  Output_Variables:
  - "USUBJIDN"
Source:
  Class: "BASIC DATA STRUCTURE"
  Subclass: "POPULATION PHARMACOKINETIC ANALYSIS"
  Variable_or_Item: "USUBJIDN"
  Natural_Language_Rule_Failure_Criteria: "Within a dataset, there is more than one\
    \ value of USUBJIDN for a given value of USUBJID, considering only those rows\
    \ on which both variables are populated."
  Rule_Failure_Criteria: "Within a dataset, there is more than one value of USUBJIDN\
    \ for a given value of USUBJID"
  Condition_Failure: "On rows where both USUBJIDN and USUBJID are both populated"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.3"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR812"
        Version: "1"
      Version: "5.0"
