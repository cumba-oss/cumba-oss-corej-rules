Core:
  Id: "CDISC-AD0558"
  Status: "Published"
  Version: "1"
Description: "Raise an error when TSEQAGyN is present and TSEQAGy is not present,\
  \ where y is an integer [1-99, not zero-padded]."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "SUBJECT LEVEL ANALYSIS DATASET"
Check:
  expression: >-
    var_exists("TSEQAGyN") and not var_exists("TSEQAGy")
Outcome:
  Message: "TSEQAGyN is present, but TSEQAGy is not present."
  Output_Variables:
  - "TSEQAGyN"
wildcards:
  "y":
    min: 1
    max: 99
Source:
  Class: "SUBJECT LEVEL ANALYSIS DATASET"
  Variable_or_Item: "TSEQAGyN where y is an integer [1-9, not zero-padded]"
  Natural_Language_Rule_Failure_Criteria: "TSEQAGyN is present and TSEQAGy is not\
    \ present"
  Rule_Failure_Criteria: "TSEQAGy is not present"
  Condition_Failure: "TSEQAGyN is present"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.1"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR558"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.2"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR558"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.3"
    References:
