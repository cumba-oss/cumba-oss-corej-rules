Core:
  Id: "CDISC-AD0526"
  Status: "Published"
  Version: "2"
Description: "Raise an error when ANLzzFN is present but the corresponding ANLzzFL\
  \ is not present, where zz is an integer [01-99, zero-padded]."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "BASIC DATA STRUCTURE"
    - "OCCURRENCE DATA STRUCTURE"
    - "MEDICAL DEVICE OCCURRENCE DATA STRUCTURE"
Check:
  expression: >-
    var_exists("ANLzzFN") and not var_exists("ANLzzFL")
Outcome:
  Message: "ANLzzFN is present but the corresponding ANLzzFL is not present."
  Output_Variables:
  - "ANLzzFN"
wildcards:
  zz:
    min: 1
    max: 99
Source:
  Class: "BASIC DATA STRUCTURE; MEDICAL DEVICE BASIC DATA STRUCTURE; OCCURRENCE DATA\
    \ STRUCTURE; MEDICAL DEVICE OCCURRENCE DATA STRUCTURE"
  Variable_or_Item: "ANLzzFN where zz is an integer [01-99, zero-padded]"
  Natural_Language_Rule_Failure_Criteria: "ANLzzFN is present and ANLzzFL is not present"
  Rule_Failure_Criteria: "ANLzzFL is not present"
  Condition_Failure: "ANLzzFN is present"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.1"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR526"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.2"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR526"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.3"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR526"
        Version: "2"
      Version: "5.0"
