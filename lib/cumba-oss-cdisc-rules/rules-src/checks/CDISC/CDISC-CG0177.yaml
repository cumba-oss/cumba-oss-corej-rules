Core:
  Id: "CDISC-CG0177"
  Status: "Published"
  Version: "1"
Description: "Raise an error when IEORRES and IESTRESC do not have the same value."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "IE"
Requirements:
  Variables:
    All:
    - "IESTRESC"
    - "IEORRES"
Check:
  expression: >-
    IESTRESC != IEORRES
Outcome:
  Message: "Mismatch between IEORRES and IESTRESC values."
  Output_Variables:
  - "IEORRES"
  - "IESTRESC"
Source:
  Class: "FND"
  Domain: "IE"
  Variable: "IESTRESC"
  Rule: "IESTRESC = IEORRES"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "SDTMIG"
    Version: "3.4"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0177"
        Version: "1"
      Version: "2.0"
  - Name: "SDTMIG"
    Version: "3.3"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0177"
        Version: "1"
      Version: "2.0"
  - Name: "SDTMIG"
    Version: "3.2"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0177"
        Version: "1"
      Version: "2.0"
