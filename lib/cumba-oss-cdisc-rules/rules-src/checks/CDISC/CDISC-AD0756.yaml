Core:
  Id: "CDISC-AD0756"
  Status: "Published"
  Version: "1"
Description: "Raise an error when, within a given value of TRTxxP, there is more than\
  \ one value of TRxxPGy, where xx is an integer [01-99, zero-padded] and y is an\
  \ integer [1-99, not zero-padded]."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "SUBJECT LEVEL ANALYSIS DATASET"
Check:
  expression: >-
    not empty(TRxxPGy) and not empty(TRTxxP) and has_multiple_values_for(TRxxPGy, TRTxxP)
Outcome:
  Message: "Within a given value of TRTxxP, there is more than one value of TRxxPGy"
  Output_Variables:
  - "TRTxxP"
  - "TRxxPGy"
wildcards:
  xx:
    min: 1
    max: 99
  "y":
    min: 1
    max: 99
Source:
  Class: "SUBJECT LEVEL ANALYSIS DATASET"
  Variable_or_Item: "TRxxPGy where xx is an integer [01-99, zero-padded] and y is\
    \ an integer [1-99, not zero-padded]"
  Natural_Language_Rule_Failure_Criteria: "Within a given value of TRTxxP, there is\
    \ more than one value of TRxxPGy, where xx is an integer [01-99, zero-padded]\
    \ and y is an integer [1-99, not zero-padded]"
  Rule_Failure_Criteria: "Within a given value of TRTxxP, there is more than one value\
    \ of TRxxPGy"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.1"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR756"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.2"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR756"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.3"
    References:
