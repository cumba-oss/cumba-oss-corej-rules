Core:
  Id: "CDISC-AD0522"
  Status: "Published"
  Version: "2"
Description: "Raise an error when BTOXGRN is present but BTOXGR is not present."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "BASIC DATA STRUCTURE"
Check:
  expression: >-
    var_exists("BTOXGRN") and not var_exists("BTOXGR")
Outcome:
  Message: "BTOXGRN is present but BTOXGR is not present."
  Output_Variables:
  - "BTOXGRN"
Source:
  Class: "BASIC DATA STRUCTURE; MEDICAL DEVICE BASIC DATA STRUCTURE"
  Variable_or_Item: "BTOXGRN"
  Natural_Language_Rule_Failure_Criteria: "BTOXGRN is present and BTOXGR is not present"
  Rule_Failure_Criteria: "BTOXGR is not present"
  Condition_Failure: "BTOXGRN is present"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.1"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR522"
        Version: "1"
      Version: "5.0"
