Core:
  Id: "CDISC-AD0648"
  Status: "Published"
  Version: "2"
Description: "Raise an error when TRTEMwFL equals 'Y' but TRTEMFL does not equal 'Y'."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "OCCURRENCE DATA STRUCTURE"
    - "MEDICAL DEVICE OCCURRENCE DATA STRUCTURE"
Requirements:
  Variables:
    All:
    - "TRTEMFL"
Check:
  expression: >-
    varname() =~ /^TRTEM[1-9]FL$/ and value() == "Y" and TRTEMFL != "Y"
Outcome:
  Message: "TRTEMwFL is 'Y' although TRTEMFL is not 'Y'."
  Output_Variables:
  - "variable_name"
  - "variable_value"
  - "TRTEMFL"
Source:
  Class: "OCCURRENCE DATA STRUCTURE; MEDICAL DEVICE OCCURRENCE DATA STRUCTURE"
  Variable_or_Item: "TRTEMFL"
  Natural_Language_Rule_Failure_Criteria: "TRTEMwFL is Y but TRTEMFL is not Y"
  Rule_Failure_Criteria: "TRTEMFL is not equal to Y"
  Condition_Failure: "TRTEMwFL is equal to Y"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.0"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR648"
        Version: "1"
      Version: "5.0"
