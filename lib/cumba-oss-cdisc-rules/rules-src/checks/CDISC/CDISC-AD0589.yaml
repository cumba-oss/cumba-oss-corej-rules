Core:
  Id: "CDISC-AD0589"
  Status: "Published"
  Version: "2"
Description: "Raise an error when, within a parameter, there is more than one value\
  \ of PBCHGCyN for a given value of PBCHGCAy, considering only those rows on which\
  \ both variables are populated."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "BASIC DATA STRUCTURE"
Check:
  expression: >-
    not empty(PBCHGCyN) and not empty(PBCHGCAy) and has_multiple_values_for(PBCHGCyN, PBCHGCAy,
    within=PARAMCD)
Outcome:
  Message: "Within this parameter, PBCHGCyN has more than one value for a given value\
    \ of PBCHGCAy, considering only those rows on which both variables are populated."
  Output_Variables:
  - "PARAMCD"
  - "PBCHGCAy"
  - "PBCHGCyN"
wildcards:
  "y":
    min: 1
    max: 99
Source:
  Class: "BASIC DATA STRUCTURE; MEDICAL DEVICE BASIC DATA STRUCTURE"
  Variable_or_Item: "PBCHGCyN where y is an integer [1-9, not zero-padded]"
  Natural_Language_Rule_Failure_Criteria: "Within a parameter, there is more than\
    \ one value of PBCHGCyN for a given value of PBCHGCAy, considering only those\
    \ rows on which both variables are populated"
  Rule_Failure_Criteria: "Within a parameter, there is more than one value of PBCHGCyN\
    \ for a given value of PBCHGCAy"
  Condition_Failure: "On rows where both PBCHGCyN and PBCHGCAy are both populated"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.2"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR589"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.3"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR589"
        Version: "2"
      Version: "5.0"
