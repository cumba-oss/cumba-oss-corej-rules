Core:
  Id: "CDISC-SEND-0212"
  Status: "Published"
  Version: "1"
Description: "Raise an error when more than one Trial Elements (TE) record exists\
  \ for the same Element Code (ETCD) within a study; the TE domain expects one record\
  \ per planned Element."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "TE"
Check:
  expression: >-
    not is_unique_set([ETCD, STUDYID])
Outcome:
  Message: "More than one TE record exists for the same Element Code (ETCD)."
  Output_Variables:
  - "STUDYID"
  - "ETCD"
Source:
  Class: "TDM"
  Domain: "TE"
  Variable: "ALL"
  Plain_Text_Explanation: "One record per planned Element"
  Rule: "One record per planned Element"
