Core:
  Id: "CDISC-SEND-0206"
  Status: "Published"
  Version: "1"
Description: "Raise an error when more than one Vital Signs (VS) record exists for\
  \ the same combination of subject (USUBJID), measurement (VSTESTCD), and observation\
  \ time (VSDTC, VSTPT, VSTPTNUM, VSNOMDY); the VS domain expects one record per measurement\
  \ per observation time per subject."
Executability: "Partially Executable - Possible Overreporting"
Scope:
  Domains:
    Include:
    - "VS"
Check:
  expression: >-
    not is_unique_set([USUBJID, VSTESTCD, VSDTC, VSTPT, VSTPTNUM, VSNOMDY])
Outcome:
  Message: "More than one VS record exists for the same measurement and observation\
    \ time within a subject."
  Output_Variables:
  - "VSTESTCD"
  - "VSDTC"
  - "VSNOMDY"
  - "VSTPT"
  - "VSTPTNUM"
Source:
  Class: "FND"
  Domain: "VS"
  Variable: "ALL"
  Plain_Text_Explanation: "One record per measurement per observation time per subject"
  Rule: "One record per measurement per observation time per subject"
