Core:
  Id: "CDISC-AD0854"
  Status: "Published"
  Version: "1"
Description: "Raise an error when ROUTEN is present and ROUTE is not present."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "BASIC DATA STRUCTURE"
Check:
  expression: >-
    var_exists("ROUTEN") and not var_exists("ROUTE")
Outcome:
  Message: "ROUTEN is present, but ROUTE is not present."
  Output_Variables:
  - "ROUTEN"
Source:
  Class: "BASIC DATA STRUCTURE"
  Subclass: "POPULATION PHARMACOKINETIC ANALYSIS"
  Variable_or_Item: "ROUTEN"
  Natural_Language_Rule_Failure_Criteria: "ROUTEN is present and ROUTE is not present"
  Rule_Failure_Criteria: "ROUTE is not present"
  Condition_Failure: "ROUTEN is present"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.3"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR854"
        Version: "1"
      Version: "5.0"
