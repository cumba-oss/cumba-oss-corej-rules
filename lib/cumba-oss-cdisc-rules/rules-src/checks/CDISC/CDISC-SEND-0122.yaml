Core:
  Id: "CDISC-SEND-0122"
  Status: "Published"
  Version: "1"
Description: "Raise an error when more than one SE record exists for the same combination\
  \ of subject (USUBJID), Element Code (ETCD), and Start Date/Time of Element (SESTDTC);\
  \ the Subject Elements domain has one record per element experienced per subject."
Executability: "Partially Executable - Possible Underreporting"
Scope:
  Domains:
    Include:
    - "SE"
Check:
  expression: >-
    not is_unique_set([USUBJID, ETCD, SESTDTC])
Outcome:
  Message: "More than one SE record exists for the same subject, ETCD, and SESTDTC."
  Output_Variables:
  - "ETCD"
  - "SESTDTC"
Source:
  Class: "SPC"
  Domain: "SE"
  Variable: "NA"
  Plain_Text_Explanation: "A record for each occurrence of an element experienced\
    \ by a subject."
  Rule: "One record in SE per occurrence of an element experienced per subject"
