Core:
  Id: "CDISC-AD0097"
  Status: "Published"
  Version: "2"
Description: "Raise an error when TRTPGyN is present and TRTPGy is not present, where\
  \ y is an integer [1-99, not zero-padded]"
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "BASIC DATA STRUCTURE"
    - "MEDICAL DEVICE BASIC DATA STRUCTURE"
Check:
  expression: >-
    var_exists("TRTPGyN") and not var_exists("TRTPGy")
Outcome:
  Message: "TRTPGyN is present but the corresponding TRTPGy is not present"
  Output_Variables:
  - "TRTPGyN"
wildcards:
  "y":
    min: 1
    max: 99
Source:
  Class: "BASIC DATA STRUCTURE; MEDICAL DEVICE BASIC DATA STRUCTURE"
  Variable_or_Item: "TRTPGy where y is an integer [1-99, not zero-padded]"
  Natural_Language_Rule_Failure_Criteria: "TRTPGyN is present and TRTPGy is not present"
  Rule_Failure_Criteria: "TRTPGy is not present"
  Condition_Failure: "TRTPGyN is present"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.0"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR97"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.1"
    References:
