Core:
  Id: "CDISC-SEND-0251"
  Status: "Published"
  Version: "1"
Description: "Raise an error when a Trial Summary (TS) record has TSPARMCD equal to\
  \ 'SRANDOM' and a populated Parameter Value (TSVAL) that is not 'Y' or 'N'."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "TS"
Requirements:
  Variables:
    All:
    - "TSPARMCD"
    - "TSVAL"
Check:
  expression: >-
    TSPARMCD == "SRANDOM" and not empty(TSVAL) and TSVAL not in ["Y", "N"]
Outcome:
  Message: "TSVAL is not 'Y' or 'N' for a record where TSPARMCD is 'SRANDOM'."
  Output_Variables:
  - "TSPARMCD"
  - "TSVAL"
Source:
  Class: "TDM"
  Domain: "TS"
  Variable: "TSPARMCD"
  Plain_Text_Explanation: "SRANDOM: TSVAL value associated with this TSPARMCD should\
    \ be either \"Y\" or \"N\"."
  Rule: "When TSPARMCD = SRANDOM the TSVAL value is  \"Y\" OR \"N\""
