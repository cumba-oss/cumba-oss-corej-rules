Core:
  Id: "CDISC-SEND-0221"
  Status: "Published"
  Version: "1"
Description: "Raise an error when Planned Order of Element within Arm (TAETORD) is\
  \ populated with a value that is not an integer."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "TA"
Requirements:
  Variables:
    All:
    - "TAETORD"
Check:
  expression: >-
    not empty(TAETORD) and TAETORD !~ /^-?[0-9]+$/
Outcome:
  Message: "TAETORD is populated with a value that is not an integer."
  Output_Variables:
  - "TAETORD"
Source:
  Class: "TDM"
  Domain: "TA"
  Variable: "TAETORD"
  Plain_Text_Explanation: "TAETORD: This value should be an integer."
  Rule: "TAETORD: This value should be an integer."
