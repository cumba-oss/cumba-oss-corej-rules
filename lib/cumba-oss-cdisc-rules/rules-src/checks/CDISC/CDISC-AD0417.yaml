Core:
  Id: "CDISC-AD0417"
  Status: "Published"
  Version: "1"
Description: "Raise an error when TRTSEQAN is populated and TRTSEQA is not populated."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "SUBJECT LEVEL ANALYSIS DATASET"
Requirements:
  Variables:
    All:
    - "TRTSEQAN"
    - "TRTSEQA"
Check:
  expression: >-
    not empty(TRTSEQAN) and empty(TRTSEQA)
Outcome:
  Message: "TRTSEQAN is populated but TRTSEQA is not populated."
  Output_Variables:
  - "TRTSEQA"
  - "TRTSEQAN"
Source:
  Class: "SUBJECT LEVEL ANALYSIS DATASET"
  Variable_or_Item: "TRTSEQA"
  Natural_Language_Rule_Failure_Criteria: "On a given record, TRTSEQAN is populated\
    \ and TRTSEQA is not populated"
  Rule_Failure_Criteria: "TRTSEQA is not populated"
  Condition_Failure: "TRTSEQAN is populated"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.2"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR417"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.3"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR417"
        Version: "1"
      Version: "5.0"
