Core:
  Id: "CDISC-AD0479"
  Status: "Published"
  Version: "1"
Description: "Raise an error when STRATwVN is populated and STRATwV is empty on the\
  \ same record."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "SUBJECT LEVEL ANALYSIS DATASET"
Check:
  expression: >-
    not empty(STRATwVN) and empty(STRATwV)
Outcome:
  Message: "STRATwVN is populated but STRATwV is empty."
  Output_Variables:
  - "STRATwV"
  - "STRATwVN"
wildcards:
  w:
    min: 1
    max: 9
Source:
  Class: "SUBJECT LEVEL ANALYSIS DATASET"
  Variable_or_Item: "STRATwV where w is an integer [1-9, not zero-padded]"
  Natural_Language_Rule_Failure_Criteria: "On a given record, STRATwVN is populated\
    \ and STRATwV is not populated"
  Rule_Failure_Criteria: "STRATwV is not populated"
  Condition_Failure: "STRATwVN is populated"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.2"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR479"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.3"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR479"
        Version: "1"
      Version: "5.0"
