Core:
  Id: "CDISC-AD0292"
  Status: "Published"
  Version: "1"
Description: "Raise an error when there is more than one value of RELGRyN for a given\
  \ value of RELGRy, where y is an integer [1-9, not zero-padded]."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "OCCURRENCE DATA STRUCTURE"
Check:
  expression: >-
    not empty(RELGRyN) and not empty(RELGRy) and has_multiple_values_for(RELGRyN, RELGRy)
Outcome:
  Message: "RELGRyN has more than one value for the same value of RELGRy, where y\
    \ is an integer [1-9, not zero-padded]."
  Output_Variables:
  - "RELGRy"
  - "RELGRyN"
wildcards:
  "y":
    min: 1
    max: 9
Source:
  Class: "OCCURRENCE DATA STRUCTURE"
  Variable_or_Item: "RELGRyN where y is an integer [1-9, not zero-padded]"
  Natural_Language_Rule_Failure_Criteria: "There is more than one value of RELGRyN\
    \ for a given value of RELGRy"
  Rule_Failure_Criteria: "There is more than one value of RELGRyN for a given value\
    \ of RELGRy"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.0"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR292"
        Version: "1"
      Version: "5.0"
