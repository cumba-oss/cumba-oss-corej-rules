Core:
  Id: "CDISC-AD0529"
  Status: "Published"
  Version: "2"
Description: "Raise an error when AESEVN is present but AESEV is not present."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "OCCURRENCE DATA STRUCTURE"
    - "MEDICAL DEVICE OCCURRENCE DATA STRUCTURE"
Check:
  expression: >-
    var_exists("AESEVN") and not var_exists("AESEV")
Outcome:
  Message: "AESEVN is present but AESEV is not present."
  Output_Variables:
  - "AESEVN"
Source:
  Class: "OCCURRENCE DATA STRUCTURE; MEDICAL DEVICE OCCURRENCE DATA STRUCTURE"
  Variable_or_Item: "AESEVN"
  Natural_Language_Rule_Failure_Criteria: "AESEVN is present and AESEV is not present"
  Rule_Failure_Criteria: "AESEV is not present"
  Condition_Failure: "AESEVN is present"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.1"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR529"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.2"
    References:
