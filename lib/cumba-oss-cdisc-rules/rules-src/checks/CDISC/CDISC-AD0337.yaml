Core:
  Id: "CDISC-AD0337"
  Status: "Published"
  Version: "2"
Description: "Raise an error when MCRITyML is present and MCRITy is not present"
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "BASIC DATA STRUCTURE"
    - "MEDICAL DEVICE BASIC DATA STRUCTURE"
Check:
  expression: >-
    var_exists("MCRITyML") and not var_exists("MCRITy")
Outcome:
  Message: "MCRITyML is present, but MCRITy is not present."
  Output_Variables:
  - "MCRITyML"
wildcards:
  "y":
    min: 1
    max: 99
Source:
  Class: "BASIC DATA STRUCTURE; MEDICAL DEVICE BASIC DATA STRUCTURE"
  Variable_or_Item: "MCRITyML where y is an integer [1-9, not zero-padded]"
  Natural_Language_Rule_Failure_Criteria: "MCRITyML is present and MCRITy is not present"
  Rule_Failure_Criteria: "MCRITy is not present"
  Condition_Failure: "MCRITyML is present"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.1"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR337"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.2"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR337"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.3"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR337"
        Version: "2"
      Version: "5.0"
