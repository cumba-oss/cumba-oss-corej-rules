Core:
  Id: "CDISC-AD0792"
  Status: "Published"
  Version: "1"
Description: "Raise an error when, on a given record, a variable with a suffix of\
  \ SDT has a value greater than the value of the variable with the same root and\
  \ a suffix of EDT, and both variables are populated"
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "BASIC DATA STRUCTURE"
Check:
  expression: >-
    not empty(*SDT) and not empty(*EDT) and *SDT > *EDT
Outcome:
  Message: "A variable with a suffix of SDT has a greater value than the variable\
    \ with the same root and a suffix of EDT on this record."
  Output_Variables:
  - "*SDT"
  - "*EDT"
Source:
  Class: "BASIC DATA STRUCTURE"
  Variable_or_Item: "*SDT"
  Natural_Language_Rule_Failure_Criteria: "On a given record, a variable with a suffix\
    \ of SDT has a value greater than a value of a variable with the same root and\
    \ a suffix of EDT, and both variables are populated"
  Rule_Failure_Criteria: "A variable with a suffix of SDT has a value greater than\
    \ a value of a variable with the same root and a suffix of EDT"
  Condition_Failure: "On rows where *SDT and *EDT are both populated"
