Core:
  Id: "CDISC-AD0399"
  Status: "Published"
  Version: "2"
Description: "Raise an error when, within a parameter, there is more than one value\
  \ of ATOXGRH for a given value of ATOXGRHN, considering only rows on which both\
  \ variables are populated."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "BASIC DATA STRUCTURE"
Requirements:
  Variables:
    All:
    - "ATOXGRH"
    - "ATOXGRHN"
Check:
  expression: >-
    not empty(ATOXGRH) and not empty(ATOXGRHN) and has_multiple_values_for(ATOXGRH, ATOXGRHN,
    within=PARAMCD)
Outcome:
  Message: "Within a parameter, there is more than one value of ATOXGRH for a given\
    \ value of ATOXGRHN, considering only rows on which both variables are populated."
  Output_Variables:
  - "PARAMCD"
  - "ATOXGRH"
  - "ATOXGRHN"
Source:
  Class: "BASIC DATA STRUCTURE; MEDICAL DEVICE BASIC DATA STRUCTURE"
  Variable_or_Item: "ATOXGRH"
  Natural_Language_Rule_Failure_Criteria: "Within a parameter, there is more than\
    \ one value of ATOXGRH for a given value of ATOXGRHN, considering only those rows\
    \ on which both variables are populated"
  Rule_Failure_Criteria: "Within a parameter, there is more than one value of ATOXGRH\
    \ for a given value of ATOXGRHN"
  Condition_Failure: "On rows where both ATOXGRH and ATOXGRHN are both populated"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.2"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR399"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.3"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR399"
        Version: "2"
      Version: "5.0"
