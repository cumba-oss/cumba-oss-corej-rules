Core:
  Id: "CDISC-AD0031"
  Status: "Published"
  Version: "1"
Description: "Raise an error when RANDFN is populated with a value that is not 1 or\
  \ 0"
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "SUBJECT LEVEL ANALYSIS DATASET"
Requirements:
  Variables:
    All:
    - "RANDFN"
Check:
  expression: >-
    not empty(RANDFN) and RANDFN not in [0, 1]
Outcome:
  Message: "RANDFN has a value other than 1 or 0"
  Output_Variables:
  - "RANDFN"
Source:
  Class: "SUBJECT LEVEL ANALYSIS DATASET"
  Variable_or_Item: "RANDFN"
  Natural_Language_Rule_Failure_Criteria: "RANDFN is present and has a value that\
    \ is not 1 or 0"
  Rule_Failure_Criteria: "Value is not 1 or 0"
  Condition_Failure: "RANDFN is present"
Standards:
- Organization: "CDISC"
  Standards:
