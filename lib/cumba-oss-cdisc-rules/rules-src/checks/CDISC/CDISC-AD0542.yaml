Core:
  Id: "CDISC-AD0542"
  Status: "Published"
  Version: "2"
Description: "Raise an error when ATPTN is present but ATPT is not present."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "BASIC DATA STRUCTURE"
    - "OCCURRENCE DATA STRUCTURE"
    - "MEDICAL DEVICE OCCURRENCE DATA STRUCTURE"
Check:
  expression: >-
    var_exists("ATPTN") and not var_exists("ATPT")
Outcome:
  Message: "ATPTN is present but ATPT is not present."
  Output_Variables:
  - "ATPTN"
Source:
  Class: "BASIC DATA STRUCTURE; MEDICAL DEVICE BASIC DATA STRUCTURE; OCCURRENCE DATA\
    \ STRUCTURE; MEDICAL DEVICE OCCURRENCE DATA STRUCTURE"
  Variable_or_Item: "ATPTN"
  Natural_Language_Rule_Failure_Criteria: "ATPTN is present and ATPT is not present"
  Rule_Failure_Criteria: "ATPT is not present"
  Condition_Failure: "ATPTN is present"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.1"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR542"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.2"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
