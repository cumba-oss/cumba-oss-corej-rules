Core:
  Id: "CDISC-AD0361"
  Status: "Published"
  Version: "1"
Description: "Raise an error when the value of ASTDT is greater than the value of\
  \ AENDT"
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "ALL"
Requirements:
  Variables:
    All:
    - "ASTDT"
    - "AENDT"
Check:
  expression: >-
    ASTDT > AENDT
Outcome:
  Message: "ASTDT is greater than AENDT."
  Output_Variables:
  - "ASTDT"
  - "AENDT"
Source:
  Class: "ALL"
  Variable_or_Item: "ASTDT"
  Natural_Language_Rule_Failure_Criteria: "The value of ASTDT is greater than the\
    \ value of AENDT, considering only those rows on which both variables are populated"
  Rule_Failure_Criteria: "The value of ASTDT is greater than the value of AENDT"
  Condition_Failure: "Considering only those rows on which both ASTDT and AENDT are\
    \ populated"
