Core:
  Id: "CDISC-AD0515"
  Status: "Published"
  Version: "1"
Description: "Raise an error when a variable name ends in EDT but its label does not\
  \ contain 'End Date', unless the variable is one of the standard library variables."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "ALL"
Operations:
- id: "$library_variables"
  expression: "get_column_order_from_library()"
Check:
  expression: >-
    ends_with(varname(), "EDT") and not contains(var_label("DATA"), "End Date") and varname() not in
    $library_variables
Outcome:
  Message: "A variable ending in EDT does not contain 'End Date' in the label."
  Output_Variables:
  - "variable_name"
  - "variable_label"
Source:
  Class: "ALL"
  Variable_or_Item: "*EDT"
  Natural_Language_Rule_Failure_Criteria: "A variable ending in EDT must contain \"\
    End Date\" in the label"
  Rule_Failure_Criteria: "*EDT does not contain \"End Date\" in the label"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.1"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR515"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.2"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR515"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.3"
    References:
