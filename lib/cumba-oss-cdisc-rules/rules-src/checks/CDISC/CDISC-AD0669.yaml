Core:
  Id: "CDISC-AD0669"
  Status: "Published"
  Version: "1"
Description: "Raise an error when, on a given record, ACYCLEC is populated but ACYCLE\
  \ is not populated."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "BASIC DATA STRUCTURE"
Requirements:
  Variables:
    All:
    - "ACYCLE"
Check:
  expression: >-
    not empty(ACYCLEC) and empty(ACYCLE)
Outcome:
  Message: "ACYCLEC is populated but ACYCLE is not populated on this record."
  Output_Variables:
  - "ACYCLE"
  - "ACYCLEC"
Source:
  Class: "BASIC DATA STRUCTURE"
  Subclass: "NON-COMPARTMENTAL ANALYSIS"
  Variable_or_Item: "ACYCLE"
  Natural_Language_Rule_Failure_Criteria: "On a given record, ACYCLEC is populated\
    \ and ACYCLE is present and not populated"
  Rule_Failure_Criteria: "ACYCLE is present and not populated"
  Condition_Failure: "ACYCLEC is populated"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.0"
    References:
