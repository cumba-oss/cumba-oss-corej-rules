Core:
  Id: "CDISC-AD0727"
  Status: "Published"
  Version: "1"
Description: "Raise an error when, within a given value of PARAMCD, there is more\
  \ than one value of AVISITN for a given value of AVISIT, considering only records\
  \ where both variables are populated"
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "BASIC DATA STRUCTURE"
Check:
  expression: >-
    not empty(AVISIT) and not empty(AVISITN) and has_multiple_values_for(AVISITN, AVISIT,
    within=PARAMCD)
Outcome:
  Message: "Within this value of PARAMCD, more than one value of AVISITN is present\
    \ for the same populated value of AVISIT"
  Output_Variables:
  - "AVISIT"
  - "AVISITN"
  - "PARAMCD"
Source:
  Class: "BASIC DATA STRUCTURE; MEDICAL DEVICE BASIC DATA STRUCTURE"
  Variable_or_Item: "AVISITN"
  Natural_Language_Rule_Failure_Criteria: "Within a given value of PARAMCD, there\
    \ is more than one value of AVISITN for a given value of AVISIT, considering only\
    \ those rows on which both variables are populated"
  Rule_Failure_Criteria: "Within a given value of PARAMCD, there is more than one\
    \ value of AVISITN for a given value of AVISIT"
  Condition_Failure: "On rows where AVISITN and AVISIT are both populated"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.1"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR727"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.2"
