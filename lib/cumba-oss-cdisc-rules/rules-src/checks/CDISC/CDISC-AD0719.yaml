Core:
  Id: "CDISC-AD0719"
  Status: "Published"
  Version: "1"
Description: "Raise an error when a BDS dataset contains none of the subject-level\
  \ or record-level treatment variables defined in the IG."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "BASIC DATA STRUCTURE"
Check:
  expression: >-
    not var_exists("TRTP") and not var_exists("TRTA") and not var_exists("TRT01P") and not
    var_exists("TRT01PN") and not var_exists("TRT01A") and not var_exists("TRT01AN") and not
    var_exists("TRTPG1") and not var_exists("TRTAG1")
Outcome:
  Message: "None of the subject-level or record-level treatment variables defined\
    \ in the IG is present"
  Output_Variables: []
Source:
  Class: "ALL"
  Natural_Language_Rule_Failure_Criteria: "None of the subject-level or record-level\
    \ treatment variables defined in the IG is present"
  Rule_Failure_Criteria: "None of the subject-level or record-level treatment variables\
    \ defined in the IG is present"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.1"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR719"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.2"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
