Core:
  Id: "CDISC-CG0060"
  Status: "Published"
  Version: "1"
Description: "Raise an error when Start Reference Time Point (--STTPT) is present\
  \ in the dataset but Start Relative to Reference Time Point (--STRTPT) is not present\
  \ in the dataset."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "ALL"
Check:
  expression: >-
    var_exists("--STTPT") and not var_exists("--STRTPT")
Outcome:
  Message: "--STRTPT variable is not present when --STTPT variable is present."
  Output_Variables:
  - "--STTPT"
Source:
  Class: "ALL"
  Domain: "ALL"
  Variable: "--STRTPT"
  Condition: "--STTPT present in dataset"
  Rule: "--STRTPT present in dataset"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "SDTMIG"
    Version: "3.4"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0060"
        Version: "1"
      Version: "2.0"
  - Name: "SDTMIG"
    Version: "3.3"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0060"
        Version: "1"
      Version: "2.0"
  - Name: "SDTMIG"
    Version: "3.2"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0060"
        Version: "1"
      Version: "2.0"
