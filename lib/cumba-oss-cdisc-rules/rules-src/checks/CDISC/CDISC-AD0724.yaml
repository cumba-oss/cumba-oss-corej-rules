Core:
  Id: "CDISC-AD0724"
  Status: "Published"
  Version: "1"
Description: "Raise an error when there is more than one value of TRTA for a given\
  \ value of TRTAN, considering only records where both variables are populated"
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "BASIC DATA STRUCTURE"
Check:
  expression: >-
    not empty(TRTA) and not empty(TRTAN) and has_multiple_values_for(TRTA, TRTAN)
Outcome:
  Message: "More than one value of TRTA is present for the same populated value of\
    \ TRTAN"
  Output_Variables:
  - "TRTA"
  - "TRTAN"
Source:
  Class: "BASIC DATA STRUCTURE; MEDICAL DEVICE BASIC DATA STRUCTURE"
  Variable_or_Item: "TRTA"
  Natural_Language_Rule_Failure_Criteria: "There is more than one value of TRTA for\
    \ a given value of TRTAN, considering only those rows on which both variables\
    \ are populated"
  Rule_Failure_Criteria: "There is more than one value of TRTA for a given value of\
    \ TRTAN"
  Condition_Failure: "On rows where TRTA and TRTAN are both populated"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.1"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR724"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.2"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR724"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.3"
    References:
