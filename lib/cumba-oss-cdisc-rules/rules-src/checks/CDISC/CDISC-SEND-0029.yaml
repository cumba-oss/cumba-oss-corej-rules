Core:
  Id: "CDISC-SEND-0029"
  Status: "Published"
  Version: "1"
Description: "Raise an error when a variable label begins with a lowercase letter,\
  \ indicating it is not in title case (title case requires the first word, and therefore\
  \ the first character, to begin with an uppercase letter)."
Executability: "Partially Executable - Possible Underreporting"
Scope:
  Domains:
    Include:
    - "ALL"
Check:
  expression: >-
    var_label("DATA") =~ /^[a-z]/
Outcome:
  Message: "The variable label begins with a lowercase letter and is not in title\
    \ case."
  Output_Variables:
  - "variable_name"
  - "variable_label"
Source:
  Class: "ALL"
  Domain: "ALL"
  Variable: "GEN"
  Plain_Text_Explanation: "Variable descriptive names in title case"
  Rule: "Variable labels are in title case"
