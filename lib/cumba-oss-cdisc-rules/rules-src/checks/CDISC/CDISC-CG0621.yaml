Core:
  Id: "CDISC-CG0621"
  Status: "Published"
  Version: "1"
Description: "Raise an error when --METHOD is present in an Interventions class dataset,\
  \ because this variable is not permitted in human clinical trials."
Executability: "Fully Executable"
Scope:
  Classes:
    Include:
    - "INTERVENTIONS"
Check:
  expression: >-
    var_exists("--METHOD")
Outcome:
  Message: "--METHOD is present but is not permitted in human clinical trials."
  Output_Variables:
  - "--METHOD"
Source:
  Class: "INT"
  Variable: "--METHOD"
  Rule: "--METHOD not present in dataset"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "SDTMIG"
    Version: "3.4"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0621"
        Version: "1"
      Version: "2.0"
