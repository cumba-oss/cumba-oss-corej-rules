Core:
  Id: "CDISC-AD0541"
  Status: "Published"
  Version: "2"
Description: "Raise an error when ASPERC is present but ASPER is not present."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "BASIC DATA STRUCTURE"
    - "OCCURRENCE DATA STRUCTURE"
    - "MEDICAL DEVICE OCCURRENCE DATA STRUCTURE"
Check:
  expression: >-
    var_exists("ASPERC") and not var_exists("ASPER")
Outcome:
  Message: "ASPERC is present but ASPER is not present."
  Output_Variables:
  - "ASPERC"
Source:
  Class: "BASIC DATA STRUCTURE; MEDICAL DEVICE BASIC DATA STRUCTURE; OCCURRENCE DATA\
    \ STRUCTURE; MEDICAL DEVICE OCCURRENCE DATA STRUCTURE"
  Variable_or_Item: "ASPERC"
  Natural_Language_Rule_Failure_Criteria: "ASPERC is present and ASPER is not present"
  Rule_Failure_Criteria: "ASPER is not present"
  Condition_Failure: "ASPERC is present"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.2"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR541"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.3"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR541"
        Version: "2"
      Version: "5.0"
