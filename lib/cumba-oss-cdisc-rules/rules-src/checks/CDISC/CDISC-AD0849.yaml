Core:
  Id: "CDISC-AD0849"
  Status: "Published"
  Version: "1"
Description: "Raise an error when FORMN is present and FORM is not present."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "BASIC DATA STRUCTURE"
Check:
  expression: >-
    var_exists("FORMN") and not var_exists("FORM")
Outcome:
  Message: "FORMN is present, but FORM is not present."
  Output_Variables:
  - "FORMN"
Source:
  Class: "BASIC DATA STRUCTURE"
  Subclass: "POPULATION PHARMACOKINETIC ANALYSIS"
  Variable_or_Item: "FORMN"
  Natural_Language_Rule_Failure_Criteria: "FORMN is present and FORM is not present"
  Rule_Failure_Criteria: "FORM is not present"
  Condition_Failure: "FORMN is present"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.3"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR849"
        Version: "1"
      Version: "5.0"
