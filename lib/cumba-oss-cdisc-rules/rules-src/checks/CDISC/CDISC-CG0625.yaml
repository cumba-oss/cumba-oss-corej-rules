Core:
  Id: "CDISC-CG0625"
  Status: "Published"
  Version: "1"
Description: "Raise an error when --IMPLBL is present in a Findings class dataset,\
  \ because this variable is not permitted in human clinical trials."
Executability: "Fully Executable"
Scope:
  Classes:
    Include:
    - "FINDINGS"
Check:
  expression: >-
    var_exists("--IMPLBL")
Outcome:
  Message: "--IMPLBL is present but is not permitted in human clinical trials."
  Output_Variables:
  - "--IMPLBL"
Source_Proposed:
  Sheet_Issue: "#68"
  Class: "FND"
  Domain: ""
  Variable: "--IMPLBL"
  Condition: ""
  Rule: "--IMPLBL not present in dataset"
Source:
  Class: "FND"
  Variable: "--IMPBL"
  Rule: "--IMPBL not present in dataset"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "SDTMIG"
    Version: "3.4"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0625"
        Version: "1"
      Version: "2.0"
