Core:
  Id: "CDISC-AD0882"
  Status: "Published"
  Version: "1"
Description: "Raise an error when, considering only rows on which both COUNTRYL and\
  \ COUNTRY are populated, more than one value of COUNTRYL is present within the dataset\
  \ for a given value of COUNTRY."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "BASIC DATA STRUCTURE"
Requirements:
  Variables:
    All:
    - "COUNTRY"
    - "COUNTRYL"
Check:
  expression: >-
    not empty(COUNTRY) and not empty(COUNTRYL) and has_multiple_values_for(COUNTRYL, COUNTRY)
Outcome:
  Message: "More than one value of COUNTRYL is present for this value of COUNTRY within\
    \ the dataset."
  Output_Variables:
  - "COUNTRY"
  - "COUNTRYL"
Source:
  Class: "BASIC DATA STRUCTURE"
  Subclass: "POPULATION PHARMACOKINETIC ANALYSIS"
  Variable_or_Item: "COUNTRYL"
  Natural_Language_Rule_Failure_Criteria: "Within a dataset, there is more than one\
    \ value of COUNTRYL for a given value of COUNTRY, considering only those rows\
    \ on which both variables are populated."
  Rule_Failure_Criteria: "Within a dataset, there is more than one value of COUNTRYL\
    \ for a given value of COUNTRY"
  Condition_Failure: "On rows where both COUNTRYL and COUNTRY are both populated"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.3"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR882"
        Version: "1"
      Version: "5.0"
