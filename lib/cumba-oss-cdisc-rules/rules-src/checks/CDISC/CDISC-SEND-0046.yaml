Core:
  Id: "CDISC-SEND-0046"
  Status: "Published"
  Version: "1"
Description: "Raise an error when Category (--CAT) is populated and its value is identical\
  \ to the Domain Abbreviation (DOMAIN)."
Executability: "Fully Executable"
Scope:
  Classes:
    Include:
    - "EVENTS"
    - "INTERVENTIONS"
    - "FINDINGS"
Requirements:
  Variables:
    All:
    - "--CAT"
    - "DOMAIN"
Check:
  expression: >-
    not empty(--CAT) and --CAT == DOMAIN
Outcome:
  Message: "--CAT is redundant with the domain name (--CAT is equal to DOMAIN)."
  Output_Variables:
  - "DOMAIN"
  - "--CAT"
Source:
  Class: "ALL"
  Domain: "ALL"
  Variable: "--CAT"
  Plain_Text_Explanation: "--CAT should not be the same as the domain name"
  Condition: "--CAT ^= null"
  Rule: "--CAT ^= Domain Name"
