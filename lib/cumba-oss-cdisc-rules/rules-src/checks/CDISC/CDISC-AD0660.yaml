Core:
  Id: "CDISC-AD0660"
  Status: "Published"
  Version: "1"
Description: "Raise an error when METABFL is populated with a value other than Y in\
  \ an ADNCA v1.0 dataset."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "BASIC DATA STRUCTURE"
  Subclasses:
    Include:
    - "NON-COMPARTMENTAL ANALYSIS"
Requirements:
  Variables:
    All:
    - "METABFL"
Check:
  expression: >-
    not empty(METABFL) and METABFL not in ["Y"]
Outcome:
  Message: "METABFL is populated with a value other than Y."
  Output_Variables:
  - "METABFL"
Source:
  Class: "BASIC DATA STRUCTURE"
  Subclass: "NON-COMPARTMENTAL ANALYSIS"
  Variable_or_Item: "METABFL"
  Natural_Language_Rule_Failure_Criteria: "METABFL is present and has a value that\
    \ is not Y or null"
  Rule_Failure_Criteria: "Value is not Y or null"
  Condition_Failure: "METABFL is present"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.0"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
