Core:
  Id: "CDISC-AD0346"
  Status: "Published"
  Version: "2"
Description: "Raise an error when R2AyLO is present and AyLO is not present"
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "BASIC DATA STRUCTURE"
    - "MEDICAL DEVICE BASIC DATA STRUCTURE"
Check:
  expression: >-
    var_exists("R2AyLO") and not var_exists("AyLO")
Outcome:
  Message: "R2AyLO is present, but AyLO is not present."
  Output_Variables:
  - "R2AyLO"
wildcards:
  "y":
    min: 1
    max: 99
Source_Proposed:
  Sheet_Issue: "#56"
  Class: "BASIC DATA STRUCTURE; MEDICAL DEVICE BASIC DATA STRUCTURE"
  Subclass: ""
  SEND_SDTM_Domain: ""
  Variable_or_Item: "R2AyLO where y is an integer [1-99, not zero-padded]"
  Natural_Language_Rule_Failure_Criteria: "R2AyLO is present and AyLO is not present"
  Rule_Failure_Criteria: "R2AyLO is present and AyLO is not present"
  Condition_Failure: "R2AyLO is present"
Source:
  Class: "BASIC DATA STRUCTURE; MEDICAL DEVICE BASIC DATA STRUCTURE"
  Variable_or_Item: "R2AyLO where y is an integer [1-99, not zero-padded]"
  Natural_Language_Rule_Failure_Criteria: "R2AyLO is present and AyLO is not present"
  Rule_Failure_Criteria: "Within a parameter, there is more than one value of AyLO\
    \ for a given value of AyLOC"
  Condition_Failure: "R2AyLO is present"
