Core:
  Id: "CDISC-AD0209"
  Status: "Published"
  Version: "1"
Description: "Raise an error when, for a subject, DM has a value for SITEID and ADSL.SITEID\
  \ does not equal that value"
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "SUBJECT LEVEL ANALYSIS DATASET"
Match_Datasets:
- Name: "DM"
  Keys:
  - "USUBJID"
Check:
  expression: >-
    var_exists(DM.SITEID) and SITEID != DM.SITEID
Outcome:
  Message: "For this subject, ADSL.SITEID does not equal DM.SITEID"
  Output_Variables:
  - "SITEID"
  - "DM.SITEID"
Source:
  Class: "SUBJECT LEVEL ANALYSIS DATASET"
  Variable_or_Item: "SITEID"
  Natural_Language_Rule_Failure_Criteria: "The value of ADSL.USUBJID is equal to the\
    \ value of DM.USUBJID and ADSL.SITEID is not equal to DM.SITEID"
  Rule_Failure_Criteria: "ADSL.SITEID is not equal to DM.SITEID"
  Condition_Failure: "The value of ADSL.USUBJID is equal to the value of DM.USUBJID"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.0"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR209"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.1"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR209"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.2"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR209"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.3"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR209"
        Version: "1"
      Version: "5.0"
