Core:
  Id: "CDISC-AD0098"
  Status: "Published"
  Version: "2"
Description: "Raise an error when, on a given record, a variable with a suffix of\
  \ SDY and the variable with the same root and a suffix of EDY are both populated,\
  \ and the SDY variable's value is greater than the EDY variable's value"
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "BASIC DATA STRUCTURE"
    - "MEDICAL DEVICE BASIC DATA STRUCTURE"
Check:
  expression: >-
    not empty(*SDY) and not empty(*EDY) and *SDY > *EDY
Outcome:
  Message: "On this record, the value of the SDY variable is greater than the value\
    \ of the corresponding EDY variable"
  Output_Variables:
  - "*SDY"
  - "*EDY"
Source:
  Class: "BASIC DATA STRUCTURE; MEDICAL DEVICE BASIC DATA STRUCTURE"
  Variable_or_Item: "*SDY"
  Natural_Language_Rule_Failure_Criteria: "On a given record, a variable with a suffix\
    \ of SDY has a value greater than a value of a variable with the same root and\
    \ a suffix of EDY, and both variables are populated"
  Rule_Failure_Criteria: "A variable with a suffix of SDY has a value greater than\
    \ a value of a variable with the same root and a suffix of EDY"
  Condition_Failure: "On rows where *SDY and *EDY are both populated"
