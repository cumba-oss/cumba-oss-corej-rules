Core:
  Id: "CDISC-SEND-0043"
  Status: "Published"
  Version: "1"
Description: "Raise an error when Subcategory (--SCAT) is populated and its value\
  \ is identical to the Category (--CAT)."
Executability: "Fully Executable"
Scope:
  Classes:
    Include:
    - "EVENTS"
    - "INTERVENTIONS"
    - "FINDINGS"
Requirements:
  Variables:
    All:
    - "--SCAT"
    - "--CAT"
Check:
  expression: >-
    not empty(--SCAT) and --SCAT == --CAT
Outcome:
  Message: "--SCAT is redundant with --CAT (--SCAT is equal to --CAT)."
  Output_Variables:
  - "--CAT"
  - "--SCAT"
Source:
  Class: "ALL"
  Domain: "ALL"
  Variable: "--SCAT"
  Plain_Text_Explanation: "--SCAT should not be the same as --CAT"
  Condition: "--SCAT ^= null"
  Rule: "--SCAT ^= --CAT"
