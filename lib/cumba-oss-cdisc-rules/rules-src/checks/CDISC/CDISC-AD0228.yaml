Core:
  Id: "CDISC-AD0228"
  Status: "Published"
  Version: "1"
Description: "Raise an error when, in an ADSL dataset, there is more than one value\
  \ of TRTSEQPN for a given value of TRTSEQP."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "SUBJECT LEVEL ANALYSIS DATASET"
Check:
  expression: >-
    has_multiple_values_for(TRTSEQPN, TRTSEQP)
Outcome:
  Message: "There is more than one value of TRTSEQPN for a given value of TRTSEQP"
  Output_Variables:
  - "TRTSEQP"
  - "TRTSEQPN"
Source:
  Class: "SUBJECT LEVEL ANALYSIS DATASET"
  Variable_or_Item: "TRTSEQPN"
  Natural_Language_Rule_Failure_Criteria: "There is more than one value of TRTSEQPN\
    \ for a given value of TRTSEQP"
  Rule_Failure_Criteria: "There is more than one value of TRTSEQPN for a given value\
    \ of TRTSEQP"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.0"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR228"
        Version: "1"
      Version: "5.0"
