Core:
  Id: "CDISC-AD0596"
  Status: "Published"
  Version: "1"
Description: "Raise an error when, on a BDS or OCCDS record, APERETM does not equal\
  \ the ADSL variable APxxETM for the same USUBJID (where xx equals the record's APERIOD\
  \ value)."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "BASIC DATA STRUCTURE"
    - "OCCURRENCE DATA STRUCTURE"
Match_Datasets:
- Name: "ADSL"
  Keys:
  - "USUBJID"
Check:
  expression: >-
    not empty(APERETM) and not empty(ADSL.AP${APERIOD:%02d}ETM) and APERETM !=
    ADSL.AP${APERIOD:%02d}ETM
Outcome:
  Message: "On a given record, the value of APERETM is not equal to the value of variable\
    \ APxxETM where xx equals the value of APERIOD"
  Output_Variables:
  - "APERIOD"
  - "APERETM"
  - "ADSL.AP${*}ETM"
Source:
  Class: "ALL"
  Variable_or_Item: "APERETM"
  Natural_Language_Rule_Failure_Criteria: "On a given record, the value of APERETM\
    \ is not equal to the value of variable APxxETM where xx equals the value of APERIOD"
  Rule_Failure_Criteria: "On a given record, the value of APERETM is not equal to\
    \ the value of variable APxxETM where xx equals the value of APERIOD"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.2"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR596"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.3"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR596"
        Version: "1"
      Version: "5.0"
