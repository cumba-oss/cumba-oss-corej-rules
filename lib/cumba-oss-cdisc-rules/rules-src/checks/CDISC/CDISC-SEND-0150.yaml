Core:
  Id: "CDISC-SEND-0150"
  Status: "Published"
  Version: "1"
Description: "Raise an error when more than one Body Weight Gains (BG) record exists\
  \ for the same combination of Test Short Name (BGTESTCD), Unique Subject Identifier\
  \ (USUBJID), and measurement interval (BGDTC and BGENDTC); the domain should hold\
  \ one record per test per interval per subject."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "BG"
Check:
  expression: >-
    not is_unique_set([BGTESTCD, USUBJID, BGDTC, BGENDTC])
Outcome:
  Message: "More than one BG record exists for the same test (BGTESTCD), subject (USUBJID),\
    \ and interval (BGDTC/BGENDTC)."
  Output_Variables:
  - "BGTESTCD"
  - "BGDTC"
  - "BGENDTC"
Source:
  Class: "FND"
  Domain: "BG"
  Variable: "ALL"
  Plain_Text_Explanation: "One record per test per interval per subject"
  Rule: "One record per test per interval per subject"
