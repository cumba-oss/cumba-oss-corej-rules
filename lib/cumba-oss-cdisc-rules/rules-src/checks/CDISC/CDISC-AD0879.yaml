Core:
  Id: "CDISC-AD0879"
  Status: "Published"
  Version: "1"
Description: "Raise an error when COUNTRYN is present and COUNTRY is not present"
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "BASIC DATA STRUCTURE"
Check:
  expression: >-
    var_exists("COUNTRYN") and not var_exists("COUNTRY")
Outcome:
  Message: "COUNTRYN is present, but COUNTRY is not present"
  Output_Variables:
  - "COUNTRY"
  - "COUNTRYN"
Source:
  Class: "BASIC DATA STRUCTURE"
  Subclass: "POPULATION PHARMACOKINETIC ANALYSIS"
  Variable_or_Item: "COUNTRYN"
  Natural_Language_Rule_Failure_Criteria: "COUNTRYN is present and COUNTRY is not\
    \ present"
  Rule_Failure_Criteria: "COUNTRY is not present"
  Condition_Failure: "COUNTRYN is present"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.3"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR879"
        Version: "1"
      Version: "5.0"
