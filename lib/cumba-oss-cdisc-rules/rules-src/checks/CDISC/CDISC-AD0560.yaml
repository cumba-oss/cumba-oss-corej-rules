Core:
  Id: "CDISC-AD0560"
  Status: "Published"
  Version: "1"
Description: "Raise an error when STRATARN is present and STRATAR is not present."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "SUBJECT LEVEL ANALYSIS DATASET"
Check:
  expression: >-
    var_exists("STRATARN") and not var_exists("STRATAR")
Outcome:
  Message: "STRATARN is present, but STRATAR is not present."
  Output_Variables:
  - "STRATARN"
Source:
  Class: "SUBJECT LEVEL ANALYSIS DATASET"
  Variable_or_Item: "STRATARN"
  Natural_Language_Rule_Failure_Criteria: "STRATARN is present and STRATAR is not\
    \ present"
  Rule_Failure_Criteria: "STRATAR is not present"
  Condition_Failure: "STRATARN is present"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.2"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR560"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.3"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR560"
        Version: "1"
      Version: "5.0"
