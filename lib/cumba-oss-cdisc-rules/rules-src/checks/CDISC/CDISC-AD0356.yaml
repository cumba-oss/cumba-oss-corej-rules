Core:
  Id: "CDISC-AD0356"
  Status: "Published"
  Version: "1"
Description: "Raise an error when REGIONyN has more than one value for a given value\
  \ of REGIONy, considering only records where both variables are populated"
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "SUBJECT LEVEL ANALYSIS DATASET"
Check:
  expression: >-
    not empty(REGIONyN) and not empty(REGIONy) and has_multiple_values_for(REGIONyN, REGIONy)
Outcome:
  Message: "REGIONyN has more than one value for the same value of REGIONy, on the\
    \ records where both variables are populated."
  Output_Variables:
  - "REGIONy"
  - "REGIONyN"
wildcards:
  "y":
    min: 1
    max: 99
Source:
  Class: "SUBJECT LEVEL ANALYSIS DATASET"
  Variable_or_Item: "REGIONyN where y is an integer [1-9, not zero-padded]"
  Natural_Language_Rule_Failure_Criteria: "There is more than one value of REGIONyN\
    \ for a given value of REGIONy, considering only those rows on which both variables\
    \ are populated"
  Rule_Failure_Criteria: "There is more than one value of REGIONyN for a given value\
    \ of REGIONy"
  Condition_Failure: "On rows where both REGIONyN and REGIONy are both populated."
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.1"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR356"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.2"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR356"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.3"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR356"
        Version: "1"
      Version: "5.0"
