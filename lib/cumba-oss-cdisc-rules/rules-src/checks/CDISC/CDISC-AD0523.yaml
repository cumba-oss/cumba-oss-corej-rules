Core:
  Id: "CDISC-AD0523"
  Status: "Published"
  Version: "2"
Description: "Raise an error when ATOXGRLN is present but ATOXGRL is not present."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "BASIC DATA STRUCTURE"
Check:
  expression: >-
    var_exists("ATOXGRLN") and not var_exists("ATOXGRL")
Outcome:
  Message: "ATOXGRLN is present but ATOXGRL is not present."
  Output_Variables:
  - "ATOXGRLN"
Source:
  Class: "BASIC DATA STRUCTURE; MEDICAL DEVICE BASIC DATA STRUCTURE"
  Variable_or_Item: "ATOXGRLN"
  Natural_Language_Rule_Failure_Criteria: "ATOXGRLN is present and ATOXGRL is not\
    \ present"
  Rule_Failure_Criteria: "ATOXGRL is not present"
  Condition_Failure: "ATOXGRLN is present"
Standards:
- Organization: "CDISC"
  Standards:
