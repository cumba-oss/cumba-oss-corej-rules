Core:
  Id: "CDISC-AD0874"
  Status: "Published"
  Version: "1"
Description: "Raise an error when SEXN is present and SEX is not present."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "BASIC DATA STRUCTURE"
Check:
  expression: >-
    var_exists("SEXN") and not var_exists("SEX")
Outcome:
  Message: "SEXN is present, but SEX is not present."
  Output_Variables:
  - "SEX"
  - "SEXN"
Source:
  Class: "BASIC DATA STRUCTURE"
  Subclass: "POPULATION PHARMACOKINETIC ANALYSIS"
  Variable_or_Item: "SEXN"
  Natural_Language_Rule_Failure_Criteria: "SEXN is present and SEX is not present"
  Rule_Failure_Criteria: "SEX is not present"
  Condition_Failure: "SEXN is present"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.3"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR874"
        Version: "1"
      Version: "5.0"
