Core:
  Id: "CDISC-AD0064"
  Status: "Published"
  Version: "1"
Description: "Raise an error when TRTxxAN is present and TRTxxA is not present"
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "SUBJECT LEVEL ANALYSIS DATASET"
Check:
  expression: >-
    var_exists("TRTxxAN") and not var_exists("TRTxxA")
Outcome:
  Message: "TRTxxAN is present but its corresponding TRTxxA is not present"
  Output_Variables:
  - "TRTxxAN"
wildcards:
  xx:
    min: 1
    max: 99
Source:
  Class: "SUBJECT LEVEL ANALYSIS DATASET"
  Variable_or_Item: "TRTxxAN where xx is an integer [01-99, zero-padded]"
  Natural_Language_Rule_Failure_Criteria: "TRTxxAN is present and TRTxxA is not present"
  Rule_Failure_Criteria: "TRTxxA is not present"
  Condition_Failure: "TRTxxAN is present"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.0"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR64"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.1"
    References:
