Core:
  Id: "CDISC-CG0368"
  Status: "Published"
  Version: "1"
Description: "Raise an error when the DM (Demographics) dataset is not present in\
  \ the study."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "ALL"
Check:
  expression: >-
    not ds_exists("DM")
Outcome:
  Message: "The DM (Demographics) dataset is not present in the study."
Source:
  Class: "SPC"
  Domain: "DM"
  Variable: "GEN"
  Condition: "Study on human subjects"
  Rule: "DM dataset present in study"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "SDTMIG"
    Version: "3.4"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0368"
        Version: "1"
      Version: "2.0"
  - Name: "SDTMIG"
    Version: "3.3"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0368"
        Version: "1"
      Version: "2.0"
  - Name: "SDTMIG"
    Version: "3.2"
    References:
