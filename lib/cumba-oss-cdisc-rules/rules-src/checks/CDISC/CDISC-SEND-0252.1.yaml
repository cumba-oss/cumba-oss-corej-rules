Core:
  Id: "CDISC-SEND-0252.1"
  Status: "Published"
  Version: "1"
Description: "Raise an error when more than one RELREC record exists for the same\
  \ combination of related domain (RDOMAIN), subject or pool (USUBJID/POOLID), identifying\
  \ variable and value (IDVAR/IDVARVAL), and relationship identifier (RELID); RELREC\
  \ expects one record per related record, related group of records, or related dataset."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "RELREC"
Check:
  expression: >-
    not is_unique_set([RDOMAIN, USUBJID, POOLID, IDVAR, IDVARVAL, RELID])
Outcome:
  Message: "More than one RELREC record exists for the same related-record link (RDOMAIN,\
    \ USUBJID/POOLID, IDVAR, IDVARVAL, RELID)."
  Output_Variables:
  - "RDOMAIN"
  - "POOLID"
  - "IDVAR"
  - "IDVARVAL"
  - "RELID"
Source:
  Class: "REL"
  Domain: "RELREC"
  Variable: "ALL"
  Plain_Text_Explanation: "One record per related record, related group of records,\
    \ or related domain."
  Rule: "One record per related record, related group of records, or related domain"
