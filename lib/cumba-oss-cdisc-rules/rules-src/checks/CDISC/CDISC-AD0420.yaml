Core:
  Id: "CDISC-AD0420"
  Status: "Published"
  Version: "1"
Description: "Raise an error when TRxxPGy is populated and TRxxPGyN is not populated."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "SUBJECT LEVEL ANALYSIS DATASET"
Requirements:
  Variables:
    All:
    - "TRxxPGy"
    - "TRxxPGyN"
Check:
  expression: >-
    not empty(TRxxPGy) and empty(TRxxPGyN)
Outcome:
  Message: "TRxxPGy is populated but TRxxPGyN is not populated."
  Output_Variables:
  - "TRxxPGy"
  - "TRxxPGyN"
wildcards:
  xx:
    min: 1
    max: 99
  "y":
    min: 1
    max: 99
Source:
  Class: "SUBJECT LEVEL ANALYSIS DATASET"
  Variable_or_Item: "TRxxPGyN where xx is an integer [01-99, zero-padded] and y is\
    \ an integer [1-9, not zero-padded]"
  Natural_Language_Rule_Failure_Criteria: "On a given record, TRxxPGy is populated\
    \ and TRxxPGyN is not populated"
  Rule_Failure_Criteria: "TRxxPGyN is not populated"
  Condition_Failure: "TRxxPGy is populated"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.2"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR420"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.3"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR420"
        Version: "1"
      Version: "5.0"
