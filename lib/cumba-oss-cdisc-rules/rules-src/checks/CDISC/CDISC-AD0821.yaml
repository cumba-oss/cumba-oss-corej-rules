Core:
  Id: "CDISC-AD0821"
  Status: "Published"
  Version: "1"
Description: "Raise an error when SITEIDN is populated and SITEID is not populated."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "BASIC DATA STRUCTURE"
Check:
  expression: >-
    not empty(SITEIDN) and empty(SITEID)
Outcome:
  Message: "SITEIDN is populated, but SITEID is not populated."
  Output_Variables:
  - "SITEID"
  - "SITEIDN"
Source:
  Class: "BASIC DATA STRUCTURE"
  Subclass: "POPULATION PHARMACOKINETIC ANALYSIS"
  Variable_or_Item: "SITEID"
  Natural_Language_Rule_Failure_Criteria: "SITEIDN is populated and SITEID is not\
    \ populated"
  Rule_Failure_Criteria: "SITEID is not populated"
  Condition_Failure: "SITEIDN is populated"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.3"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR821"
        Version: "1"
      Version: "5.0"
