Core:
  Id: "CDISC-AD0331"
  Status: "Published"
  Version: "2"
Description: "Raise an error when, within a parameter, there is more than one value\
  \ of CHGCATy for a given value of CHGCATyN, considering only rows on which both\
  \ variables are populated, where y is an integer [1-99, not zero-padded]."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "BASIC DATA STRUCTURE"
    - "MEDICAL DEVICE BASIC DATA STRUCTURE"
Check:
  expression: >-
    not empty(CHGCATy) and not empty(CHGCATyN) and has_multiple_values_for(CHGCATy, CHGCATyN,
    within=PARAMCD)
Outcome:
  Message: "Within this parameter, CHGCATy has more than one value for the same value\
    \ of CHGCATyN, considering only rows on which both variables are populated, where\
    \ y is an integer [1-99, not zero-padded]."
  Output_Variables:
  - "PARAMCD"
  - "CHGCATy"
  - "CHGCATyN"
wildcards:
  "y":
    min: 1
    max: 99
Source:
  Class: "BASIC DATA STRUCTURE; MEDICAL DEVICE BASIC DATA STRUCTURE"
  Variable_or_Item: "CHGCATy where y is an integer [1-99, not zero-padded]"
  Natural_Language_Rule_Failure_Criteria: "Within a parameter, there is more than\
    \ one value of CHGCATy for a given value of CHGCATyN, considering only those rows\
    \ on which both variables are populated"
  Rule_Failure_Criteria: "Within a parameter, there is more than one value of CHGCATy\
    \ for a given value of CHGCATyN"
  Condition_Failure: "On rows where both CHGCATy and CHGCATyN are both populated"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.1"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR331"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.2"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR331"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.3"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR331"
        Version: "2"
      Version: "5.0"
