Core:
  Id: "CDISC-AD0113"
  Status: "Published"
  Version: "2"
Description: "Raise an error when ARELTMU is present and ARELTM is not present."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "BASIC DATA STRUCTURE"
Check:
  expression: >-
    var_exists("ARELTMU") and not var_exists("ARELTM")
Outcome:
  Message: "ARELTMU is present, but ARELTM is not present."
  Output_Variables:
  - "ARELTMU"
Source:
  Class: "BASIC DATA STRUCTURE; MEDICAL DEVICE BASIC DATA STRUCTURE"
  Natural_Language_Rule_Failure_Criteria: "ARELTMU is present and ARELTM is not present"
  Rule_Failure_Criteria: "ARELTM is not present"
  Condition_Failure: "ARELTMU is present"
