Core:
  Id: "CDISC-AD0007"
  Status: "Published"
  Version: "1"
Description: "Raise an error when a variable with a suffix of FN is present but a\
  \ variable with the same root and a suffix of FL is not present"
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "ALL"
Check:
  expression: >-
    var_exists(*FN) and not var_exists(*FL)
Outcome:
  Message: "A variable with a suffix of FL is not present, although the variable with\
    \ the same root and a suffix of FN is present"
  Output_Variables:
  - "*FN"
Source:
  Class: "ALL"
  Variable_or_Item: "*FL"
  Natural_Language_Rule_Failure_Criteria: "A variable with a suffix of FN is present\
    \ but a variable with the same root and a suffix of FL is not present"
  Rule_Failure_Criteria: "A variable is not present that has a suffix of FL and the\
    \ same root as a variable with a suffix of FN"
  Condition_Failure: "Variable with a suffix of FN is present"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.0"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR7"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.1"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR7"
        Version: "1"
      Version: "5.0"
