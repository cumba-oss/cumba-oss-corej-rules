Core:
  Id: "CDISC-AD0567"
  Status: "Published"
  Version: "2"
Description: "Raise an error when CRITyFN is present and CRITyFL is not present, where\
  \ y is an integer [1-99, not zero-padded]."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "BASIC DATA STRUCTURE"
    - "OCCURRENCE DATA STRUCTURE"
    - "MEDICAL DEVICE OCCURRENCE DATA STRUCTURE"
Check:
  expression: >-
    var_exists("CRITyFN") and not var_exists("CRITyFL")
Outcome:
  Message: "CRITyFN is present and CRITyFL is not present"
  Output_Variables:
  - "CRITyFN"
wildcards:
  "y":
    min: 1
    max: 99
Source_Proposed:
  Sheet_Issue: "#60"
  Class: "BASIC DATA STRUCTURE; MEDICAL DEVICE BASIC DATA STRUCTURE; OCCURRENCE DATA\
    \ STRUCTURE; MEDICAL DEVICE OCCURRENCE DATA STRUCTURE"
  Subclass: ""
  SEND_SDTM_Domain: ""
  Variable_or_Item: "CRITyFN where y is an integer [1-99, not zero-padded]"
  Natural_Language_Rule_Failure_Criteria: "CRITyFN is present and CRITyFL is not present"
  Rule_Failure_Criteria: "CRITyFL is not present"
  Condition_Failure: "CRITyFN is present"
Source:
  Class: "BASIC DATA STRUCTURE; MEDICAL DEVICE BASIC DATA STRUCTURE; OCCURRENCE DATA\
    \ STRUCTURE; MEDICAL DEVICE OCCURRENCE DATA STRUCTURE"
  Variable_or_Item: "CRITyFN where y is an integer [1-99, not zero-padded]"
  Natural_Language_Rule_Failure_Criteria: "CRITyFN is present and CRITyFL is not present"
  Rule_Failure_Criteria: "RITyFL is not present"
  Condition_Failure: "CRITyFN is present"
