Core:
  Id: "CDISC-CG0437"
  Status: "Published"
  Version: "1"
Description: "Raise an error when a System Organ Class Code (--SOCCD) value is not\
  \ a valid System Organ Class code in the MedDRA dictionary."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "AE"
    - "MH"
    - "CE"
Requirements:
  Variables:
    All:
    - "--SOCCD"
Operations:
- id: "$soccd_valid"
  expression: "valid_external_dictionary_code(--SOCCD, external_dictionary_type=\"\
    meddra\", dictionary_term_type=\"SOCCD\")"
Check:
  expression: >-
    $soccd_valid == false
Outcome:
  Message: "System Organ Class Code (--SOCCD) is not a valid MedDRA System Organ Class\
    \ code."
  Output_Variables:
  - "--SOCCD"
Source:
  Class: "EVT"
  Domain: "AE, MH, CE"
  Variable: "--SOCCD"
  Rule: "--SOCCD = MedDRA primary system organ class code"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "SDTMIG"
    Version: "3.4"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0437"
        Version: "1"
      Version: "2.0"
  - Name: "SDTMIG"
    Version: "3.3"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0437"
        Version: "1"
      Version: "2.0"
  - Name: "SDTMIG"
    Version: "3.2"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0437"
        Version: "1"
      Version: "2.0"
