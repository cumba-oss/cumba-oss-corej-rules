Core:
  Id: "CDISC-AD0211"
  Status: "Published"
  Version: "2"
Description: "Raise an error when ABLFN is populated and does not equal 1"
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "BASIC DATA STRUCTURE"
Requirements:
  Variables:
    All:
    - "ABLFN"
Check:
  expression: >-
    not empty(ABLFN) and ABLFN != 1
Outcome:
  Message: "ABLFN is populated, but does not equal 1"
  Output_Variables:
  - "ABLFN"
Source:
  Class: "BASIC DATA STRUCTURE; MEDICAL DEVICE BASIC DATA STRUCTURE"
  Variable_or_Item: "ABLFN"
  Natural_Language_Rule_Failure_Criteria: "ABLFN is not equal to 1 or null"
  Rule_Failure_Criteria: "ABLFN is not equal to 1 or null"
