Core:
  Id: "CDISC-AD0327"
  Status: "Published"
  Version: "2"
Description: "Raise an error when there is more than one value of AVALCATy for a given\
  \ value of AVALCAyN within a parameter, considering only records where both variables\
  \ are populated"
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "BASIC DATA STRUCTURE"
Check:
  expression: >-
    not empty(AVALCATy) and not empty(AVALCAyN) and has_multiple_values_for(AVALCATy, AVALCAyN,
    within=PARAMCD)
Outcome:
  Message: "Within this parameter, more than one value of AVALCATy is present for\
    \ the same populated value of AVALCAyN"
  Output_Variables:
  - "PARAMCD"
  - "AVALCATy"
  - "AVALCAyN"
wildcards:
  "y":
    min: 1
    max: 99
Source:
  Class: "BASIC DATA STRUCTURE; MEDICAL DEVICE BASIC DATA STRUCTURE"
  Variable_or_Item: "AVALCATy where y is an integer [1-9, not zero-padded]"
  Natural_Language_Rule_Failure_Criteria: "Within a parameter, there is more than\
    \ one value of AVALCATy for a given value of AVALCAyN, considering only those\
    \ rows on which both variables are populated"
  Rule_Failure_Criteria: "Within a parameter, there is more than one value of AVALCATy\
    \ for a given value of AVALCAyN"
  Condition_Failure: "On rows where both AVALCATy and AVALCAyN are both populated"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.1"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR327"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.2"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR327"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.3"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR327"
        Version: "2"
      Version: "5.0"
