Core:
  Id: "CDISC-SEND-0006"
  Status: "Published"
  Version: "1"
Description: "Raise an error when the variable label in the Define-XML document does\
  \ not match the variable label in the dataset."
Executability: "Partially Executable - Possible Underreporting"
Scope:
  Domains:
    Include:
    - "ALL"
Check:
  expression: >-
    not empty(var_name("DEFINE")) and var_label("DEFINE") != var_label("DATA")
Outcome:
  Message: "The variable label in the Define-XML document does not match the variable\
    \ label in the dataset."
  Output_Variables:
  - "variable_name"
  - "variable_label"
  - "define_variable_name"
  - "define_variable_label"
Source:
  Class: "ALL"
  Domain: "ALL"
  Variable: "GEN"
  Plain_Text_Explanation: "Metadata in Define-XML document should match both the SENDIG\
    \ label and the label in the .xpt datasets."
  Rule: "Metadata in Define-XML document should match both the SENDIG label and the\
    \ label in the .xpt datasets."
