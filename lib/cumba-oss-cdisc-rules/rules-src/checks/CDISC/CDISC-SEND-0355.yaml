Core:
  Id: "CDISC-SEND-0355"
  Status: "Published"
  Version: "1"
Description: "Raise an error when more than one Implantation Classification (IC) record\
  \ exists for the same combination of Implantation Site Label (ICIMPLBL), Fetus Identifier\
  \ (FETUSID), and Unique Subject Identifier (USUBJID); the domain should hold one\
  \ record per implantation site per fetus per subject."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "IC"
Check:
  expression: >-
    not is_unique_set([ICIMPLBL, USUBJID, FETUSID])
Outcome:
  Message: "More than one IC record exists for the same implantation site (ICIMPLBL),\
    \ fetus (FETUSID), and subject (USUBJID)."
  Output_Variables:
  - "FETUSID"
  - "ICIMPLBL"
Source:
  Class: "FND"
  Domain: "IC"
  Variable: "ALL"
  Plain_Text_Explanation: "One record per implantation site per fetus per subject."
  Rule: "One record per implantation site per fetus per subject, Tabulation."
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "SENDIG-DART"
    Version: "1.2"
    References:
    - Origin: "SEND Conformance Rules"
      Rule_Identifier:
        Id: "SEND355"
        Version: "1"
      Version: "5.0"
  - Name: "SENDIG-DART"
    Version: "1.1"
    References:
    - Origin: "SEND Conformance Rules"
      Rule_Identifier:
        Id: "SEND355"
        Version: "1"
      Version: "5.0"
