Core:
  Id: "CDISC-AD0553"
  Status: "Published"
  Version: "1"
Description: "Raise an error when REGIONyN is present and REGIONy is not present,\
  \ where y is an integer [1-99, not zero-padded]."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "SUBJECT LEVEL ANALYSIS DATASET"
Check:
  expression: >-
    var_exists("REGIONyN") and not var_exists("REGIONy")
Outcome:
  Message: "REGIONyN is present, but REGIONy is not present."
  Output_Variables:
  - "REGIONyN"
wildcards:
  "y":
    min: 1
    max: 99
Source:
  Class: "SUBJECT LEVEL ANALYSIS DATASET"
  Variable_or_Item: "REGIONyN where y is an integer [1-9, not zero-padded]"
  Natural_Language_Rule_Failure_Criteria: "REGIONyN is present and REGIONy is not\
    \ present"
  Rule_Failure_Criteria: "REGIONy is not present"
  Condition_Failure: "REGIONyN is present"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.1"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR553"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.2"
    References:
