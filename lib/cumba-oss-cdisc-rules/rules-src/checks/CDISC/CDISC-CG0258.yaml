Core:
  Id: "CDISC-CG0258"
  Status: "Published"
  Version: "1"
Description: "Raise an error when the value of Trial Summary Parameter (TSPARM) is\
  \ more than 40 characters in length."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "TS"
Check:
  expression: >-
    len(TSPARM) > 40
Outcome:
  Message: "TSPARM value is more than 40 characters in length."
  Output_Variables:
  - "TSPARM"
Source:
  Class: "TDM"
  Domain: "TS"
  Variable: "TSPARM"
  Rule: "TSPARM value length <= 40"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "SDTMIG"
    Version: "3.4"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0258"
        Version: "1"
      Version: "2.0"
  - Name: "SDTMIG"
    Version: "3.3"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0258"
        Version: "1"
      Version: "2.0"
  - Name: "SDTMIG"
    Version: "3.2"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0258"
        Version: "1"
      Version: "2.0"
