Core:
  Id: "CDISC-AD0659"
  Status: "Published"
  Version: "1"
Description: "Raise an error when PKSUMXFN is populated with a value other than 1\
  \ in an ADNCA v1.0 dataset."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "BASIC DATA STRUCTURE"
  Subclasses:
    Include:
    - "NON-COMPARTMENTAL ANALYSIS"
Check:
  expression: >-
    not empty(PKSUMXFN) and PKSUMXFN != 1
Outcome:
  Message: "PKSUMXFN is populated and has a value that is not 1"
  Output_Variables:
  - "PKSUMXFN"
Source:
  Class: "BASIC DATA STRUCTURE"
  Subclass: "NON-COMPARTMENTAL ANALYSIS"
  Variable_or_Item: "PKSUMXFN"
  Natural_Language_Rule_Failure_Criteria: "PKSUMXFN is present and has a value that\
    \ is not 1 or null"
  Rule_Failure_Criteria: "Value is not 1 or null"
  Condition_Failure: "PKSUMXFN is present"
Standards:
