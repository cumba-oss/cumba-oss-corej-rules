Core:
  Id: "CDISC-AD0730"
  Status: "Published"
  Version: "1"
Description: "Raise an error when there is more than one value of PARCATy for a given\
  \ value of PARCATyN, considering only rows on which both variables are populated"
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "BASIC DATA STRUCTURE"
Check:
  expression: >-
    not empty(PARCATy) and not empty(PARCATyN) and has_multiple_values_for(PARCATy, PARCATyN)
Outcome:
  Message: "PARCATy has more than one value for this PARCATyN, among rows where both\
    \ are populated"
  Output_Variables:
  - "PARCATy"
  - "PARCATyN"
wildcards:
  "y":
    min: 1
    max: 99
Source:
  Class: "BASIC DATA STRUCTURE; MEDICAL DEVICE BASIC DATA STRUCTURE"
  Variable_or_Item: "PARCATy where y is an integer [1-99, not zero-padded]"
  Natural_Language_Rule_Failure_Criteria: "There is more than one value of PARCATy\
    \ for a given value of PARCATyN, considering only those rows on which both variables\
    \ are populated"
  Rule_Failure_Criteria: "There is more than one value of PARCATy for a given value\
    \ of PARCATyN"
  Condition_Failure: "Considering only those rows on which both PARCATy and PARCATyN\
    \ are populated"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.1"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR730"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.2"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR730"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.3"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR730"
        Version: "1"
      Version: "5.0"
