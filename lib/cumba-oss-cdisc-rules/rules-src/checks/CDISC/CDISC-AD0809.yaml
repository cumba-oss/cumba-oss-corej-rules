Core:
  Id: "CDISC-AD0809"
  Status: "Published"
  Version: "1"
Description: "Raise an error when SUBJTYPC is present and SUBJTYP is not present"
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "BASIC DATA STRUCTURE"
Check:
  expression: >-
    var_exists("SUBJTYPC") and not var_exists("SUBJTYP")
Outcome:
  Message: "SUBJTYPC is present in the dataset, but SUBJTYP is not present."
  Output_Variables:
  - "SUBJTYPC"
Source:
  Class: "BASIC DATA STRUCTURE"
  Subclass: "POPULATION PHARMACOKINETIC ANALYSIS"
  Variable_or_Item: "SUBJTYPC"
  Natural_Language_Rule_Failure_Criteria: "SUBJTYPC is present and SUBJTYP is not\
    \ present"
  Rule_Failure_Criteria: "SUBJTYP is not present"
  Condition_Failure: "SUBJTYPC is present"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.3"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR809"
        Version: "1"
      Version: "5.0"
