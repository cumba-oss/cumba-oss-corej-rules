  Status: "Published"
  Version: "2"
Description: "Raise an error when AVAL is present or AVALC is present."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "OCCURRENCE DATA STRUCTURE"
    - "MEDICAL DEVICE OCCURRENCE DATA STRUCTURE"
