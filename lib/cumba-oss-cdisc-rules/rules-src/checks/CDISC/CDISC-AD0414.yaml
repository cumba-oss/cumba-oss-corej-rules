Core:
  Id: "CDISC-AD0414"
  Status: "Published"
  Version: "2"
Description: "Raise an error when there is more than one value of ANLzzFL for a given\
  \ value of ANLzzFN, considering only rows on which both variables are populated."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "BASIC DATA STRUCTURE"
Check:
  expression: >-
    not empty(ANLzzFL) and not empty(ANLzzFN) and has_multiple_values_for(ANLzzFL, ANLzzFN)
Outcome:
  Message: "There is more than one value of ANLzzFL for a given value of ANLzzFN,\
    \ considering only rows on which both variables are populated."
  Output_Variables:
  - "ANLzzFL"
  - "ANLzzFN"
wildcards:
  zz:
    min: 1
    max: 99
Source:
  Class: "BASIC DATA STRUCTURE; MEDICAL DEVICE BASIC DATA STRUCTURE"
  Variable_or_Item: "ANLzzFL where zz is an integer [01-99, zero-padded]"
  Natural_Language_Rule_Failure_Criteria: "There is more than one value of ANLzzFL\
    \ for a given value of ANLzzFN , considering only those rows on which both variables\
    \ are populated"
  Rule_Failure_Criteria: "There is more than one value of ANLzzFL for a given value\
    \ of ANLzzFN"
  Condition_Failure: "On rows where both ANLzzFL and ANLzzFN  are both populated."
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.2"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR414"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.3"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR414"
        Version: "2"
      Version: "5.0"
