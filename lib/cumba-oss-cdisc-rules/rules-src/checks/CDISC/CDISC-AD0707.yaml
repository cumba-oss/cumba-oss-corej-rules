Core:
  Id: "CDISC-AD0707"
  Status: "Published"
  Version: "1"
Description: "Raise an error when a BDS or OCCDS record has a populated ASPER value\
  \ but the ADSL dataset contains no PxxSw variable for that w=ASPER value (for any\
  \ xx)."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "BASIC DATA STRUCTURE"
    - "OCCURRENCE DATA STRUCTURE"
Match_Datasets:
- Name: "ADSL"
  Keys:
  - "USUBJID"
Check:
  expression: >-
    not empty(APERIOD) and not empty(ASPER) and not var_exists(ADSL.P${*}S${ASPER:%d})
Outcome:
  Message: "For every unique w value of ASPER in BDS or OCCDS datasets, there is not\
    \ a variable PxxSw"
  Output_Variables:
  - "APERIOD"
  - "ASPER"
Source:
  Class: "ALL"
  Variable_or_Item: "ASPER"
  Natural_Language_Rule_Failure_Criteria: "For every unique w value of ASPER in BDS\
    \ or OCCDS datasets, there is not a variable PxxSw"
  Rule_Failure_Criteria: "For every unique w value of ASPER in BDS or OCCDS datasets,\
    \ there is not a variable PxxSw"
  Condition_Failure: "APERIOD and ASPER are populated"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.2"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR707"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.3"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR707"
        Version: "1"
      Version: "5.0"
