Core:
  Id: "CDISC-SEND-0341"
  Status: "Published"
  Version: "1"
Description: "Raise an error when more than one record in the Trial Summary (TS) dataset\
  \ has TSPARMCD equal to 'SNDIGVER' (the SEND Implementation Guide Version)."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "TS"
Requirements:
  Variables:
    All:
    - "TSPARMCD"
Operations:
- id: "$sndigver_count"
  expression: "record_count(group=[STUDYID], filter=filter(TSPARMCD=\"SNDIGVER\"))"
Check:
  expression: >-
    TSPARMCD == "SNDIGVER" and $sndigver_count > 1
Outcome:
  Message: "More than one record with TSPARMCD equal to 'SNDIGVER' exists in the Trial\
    \ Summary (TS) dataset."
  Output_Variables:
  - "TSPARMCD"
  - "$sndigver_count"
Source:
  Class: "TDM"
  Domain: "TS"
  Variable: "TSPARMCD"
  Plain_Text_Explanation: "Only a single record for TSPARM SEND Implementation Guide\
    \ Version should exist."
  Rule: "Only one record with TSPARMCD = SNDIGVER exists"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "SENDIG-GENETOX"
    Version: "1.0"
    References:
    - Origin: "SEND Conformance Rules"
      Rule_Identifier:
        Id: "SEND341"
        Version: "1"
      Version: "5.0"
  - Name: "SENDIG-DART"
    Version: "1.2"
    References:
    - Origin: "SEND Conformance Rules"
      Rule_Identifier:
        Id: "SEND341"
        Version: "1"
      Version: "5.0"
  - Name: "SENDIG-DART"
    Version: "1.1"
    References:
    - Origin: "SEND Conformance Rules"
      Rule_Identifier:
        Id: "SEND341"
        Version: "1"
      Version: "5.0"
  - Name: "SENDIG"
    Version: "3.1.1"
    References:
    - Origin: "SEND Conformance Rules"
      Rule_Identifier:
        Id: "SEND341"
        Version: "1"
      Version: "5.0"
  - Name: "SENDIG"
    Version: "3.1"
    References:
    - Origin: "SEND Conformance Rules"
      Rule_Identifier:
        Id: "SEND341"
        Version: "1"
      Version: "5.0"
