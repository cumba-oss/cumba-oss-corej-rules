Core:
  Id: "CDISC-AD0595"
  Status: "Published"
  Version: "1"
Description: "Raise an error when, on a BDS or OCCDS record, APEREDT does not equal\
  \ the ADSL variable APxxEDT for the same USUBJID (where xx equals the record's APERIOD\
  \ value)."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "BASIC DATA STRUCTURE"
    - "OCCURRENCE DATA STRUCTURE"
Match_Datasets:
- Name: "ADSL"
  Keys:
  - "USUBJID"
Check:
  expression: >-
    not empty(APEREDT) and not empty(ADSL.AP${APERIOD:%02d}EDT) and APEREDT !=
    ADSL.AP${APERIOD:%02d}EDT
Outcome:
  Message: "On a given record, the value of APEREDT is not equal to the value of variable\
    \ APxxEDT where xx equals the value of APERIOD"
  Output_Variables:
  - "APERIOD"
  - "APEREDT"
  - "ADSL.AP${*}EDT"
Source:
  Class: "ALL"
  Variable_or_Item: "APEREDT"
  Natural_Language_Rule_Failure_Criteria: "On a given record, the value of APEREDT\
    \ is not equal to the value of variable APxxEDT where xx equals the value of APERIOD"
  Rule_Failure_Criteria: "On a given record, the value of APEREDT is not equal to\
    \ the value of variable APxxEDT where xx equals the value of APERIOD"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.2"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR595"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.3"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR595"
        Version: "1"
      Version: "5.0"
