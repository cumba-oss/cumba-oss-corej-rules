Core:
  Id: "CDISC-SEND-0009.1"
  Status: "Published"
  Version: "1"
Description: "Raise an error when the variable role declared in the Define-XML document\
  \ does not match the role the SENDIG assigns to the variable."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "ALL"
Variable_Universe: "Define"
Check:
  expression: >-
    not empty(var_name("DEFINE")) and not empty(var_role("DEFINE")) and not
    empty(var_role("LIBRARY")) and var_role("DEFINE") != var_role("LIBRARY")
Outcome:
  Message: "The variable role in the Define-XML document does not match the variable\
    \ role in the SENDIG."
  Output_Variables:
  - "define_variable_name"
  - "define_variable_role"
  - "library_variable_role"
Source:
  Class: "ALL"
  Domain: "ALL"
  Variable: "GEN"
  Plain_Text_Explanation: "Variable-level metadata in Define-XML document should include\
    \ the Role of each variable where a role is assigned by the standard."
  Condition: "Define-XML contains the Role attribute"
  Rule: "Variable-level metadata in Define-XML document matches the Role in the SENDIG"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "SENDIG-GENETOX"
    Version: "1.0"
    References:
