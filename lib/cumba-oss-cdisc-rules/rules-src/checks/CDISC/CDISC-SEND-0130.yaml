Core:
  Id: "CDISC-SEND-0130"
  Status: "Published"
  Version: "1"
Description: "Raise an error when SESEQ is not in chronological order (based on SESTDTC)\
  \ within USUBJID."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "SE"
Check:
  expression: >-
    not is_sorted_by(SESEQ, by=[asc("SESTDTC")], within=USUBJID)
Outcome:
  Message: "SESEQ is not in chronological order (based on SESTDTC) within USUBJID."
  Output_Variables:
  - "SESTDTC"
Source:
  Class: "SPC"
  Domain: "SE"
  Variable: "SESEQ"
  Plain_Text_Explanation: "SESEQ are assigned in chronological order within a subject.\
    \  SESTDTC values provide the chronological order of the actual subject elements."
  Rule: "SESEQ  are assigned in chronological order within a subject"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "SENDIG"
    Version: "3.0"
    References:
    - Origin: "SEND Conformance Rules"
      Rule_Identifier:
        Id: "SEND130"
        Version: "1"
      Version: "5.0"
