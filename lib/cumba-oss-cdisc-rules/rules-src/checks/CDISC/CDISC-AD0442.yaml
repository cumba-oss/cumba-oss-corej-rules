Core:
  Id: "CDISC-AD0442"
  Status: "Published"
  Version: "2"
Description: "Raise an error when CHGCATyN is populated but CHGCATy is empty"
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "BASIC DATA STRUCTURE"
Requirements:
  Variables:
    All:
    - "CHGCATy"
    - "CHGCATyN"
Check:
  expression: >-
    not empty(CHGCATyN) and empty(CHGCATy)
Outcome:
  Message: "CHGCATyN is populated, but CHGCATy is empty"
  Output_Variables:
  - "CHGCATy"
  - "CHGCATyN"
wildcards:
  "y":
    min: 1
    max: 99
Source:
  Class: "BASIC DATA STRUCTURE; MEDICAL DEVICE BASIC DATA STRUCTURE"
  Variable_or_Item: "CHGCATy where y is an integer [1-99, not zero-padded]"
  Natural_Language_Rule_Failure_Criteria: "On a given record, CHGCATyN is populated\
    \ and CHGCATy is not populated"
  Rule_Failure_Criteria: "CHGCATy is not populated"
  Condition_Failure: "CHGCATyN is populated"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.2"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR442"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.3"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR442"
        Version: "2"
      Version: "5.0"
