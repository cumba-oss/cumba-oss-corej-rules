Core:
  Id: "CDISC-AD0653"
  Status: "Published"
  Version: "1"
Description: "Raise an error when SRCDOM is present in an ADVERSE EVENT sub-class\
  \ OCCDS dataset (e.g., ADAE); SRCDOM must not be used for the AE sub-class (AESEQ\
  \ replaces SRCDOM+SRCSEQ per OCCDS v1.1)."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "OCCURRENCE DATA STRUCTURE"
  Subclasses:
    Include:
    - "ADVERSE EVENT"
Check:
  expression: >-
    var_exists("SRCDOM")
Outcome:
  Message: "SRCDOM is present"
  Output_Variables:
  - "SRCDOM"
Source:
  Class: "OCCURRENCE DATA STRUCTURE"
  Subclass: "ADVERSE EVENT"
  Variable_or_Item: "SRCDOM"
  Natural_Language_Rule_Failure_Criteria: "SRCDOM is present"
  Rule_Failure_Criteria: "SRCDOM is present"
