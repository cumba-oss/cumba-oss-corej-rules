Core:
  Id: "CDISC-AD0473"
  Status: "Published"
  Version: "1"
Description: "Raise an error when there is more than one value of STRATwRN for a given\
  \ value of STRATwR, considering only records where both variables are populated."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "SUBJECT LEVEL ANALYSIS DATASET"
Check:
  expression: >-
    not empty(STRATwRN) and not empty(STRATwR) and has_multiple_values_for(STRATwRN, STRATwR)
Outcome:
  Message: "More than one value of STRATwRN was found for the same value of STRATwR."
  Output_Variables:
  - "STRATwR"
  - "STRATwRN"
wildcards:
  w:
    min: 1
    max: 9
Source:
  Class: "SUBJECT LEVEL ANALYSIS DATASET"
  Variable_or_Item: "STRATwRN where w is an integer [1-9, not zero-padded]"
  Natural_Language_Rule_Failure_Criteria: "There is more than one value of STRATwRN\
    \ for a given value of STRATwR, considering only those rows on which both variables\
    \ are populated"
  Rule_Failure_Criteria: "There is more than one value of STRATwRN for a given value\
    \ of STRATwR"
  Condition_Failure: "On rows where both STRATwRN and STRATwR are both populated."
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.2"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR473"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.3"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR473"
        Version: "1"
      Version: "5.0"
