Core:
  Id: "CDISC-CG0057"
  Status: "Published"
  Version: "1"
Description: "Raise an error when End Reference Time Point (--ENTPT) is present in\
  \ the dataset but End Relative to Reference Time Point (--ENRTPT) is not present\
  \ in the dataset."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "ALL"
Check:
  expression: >-
    var_exists("--ENTPT") and not var_exists("--ENRTPT")
Outcome:
  Message: "--ENRTPT variable is not present when --ENTPT variable is present."
  Output_Variables:
  - "--ENTPT"
Source:
  Class: "ALL"
  Domain: "ALL"
  Variable: "--ENRTPT"
  Condition: "--ENTPT present in dataset"
  Rule: "--ENRTPT present in dataset"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "SDTMIG"
    Version: "3.4"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0057"
        Version: "1"
      Version: "2.0"
  - Name: "SDTMIG"
    Version: "3.3"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0057"
        Version: "1"
      Version: "2.0"
  - Name: "SDTMIG"
    Version: "3.2"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0057"
        Version: "1"
      Version: "2.0"
