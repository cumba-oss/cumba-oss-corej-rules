Core:
  Id: "CDISC-CG0564"
  Status: "Published"
  Version: "1"
Description: "Raise an error when --AGENT is present in a Findings-class dataset whose\
  \ domain is not MS."
Executability: "Fully Executable"
Scope:
  Classes:
    Include:
    - "FINDINGS"
  Domains:
    Exclude:
    - "MS"
Check:
  expression: >-
    var_exists("--AGENT")
Outcome:
  Message: "--AGENT is present in a Findings dataset other than MS, but it is a domain-specific\
    \ variable permitted only in the MS domain."
  Output_Variables:
  - "--AGENT"
Source:
  Class: "FND"
  Domain: "NOT(MS)"
  Variable: "--AGENT"
  Rule: "--AGENT not present in dataset"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "SDTMIG"
    Version: "3.4"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0564"
        Version: "1"
      Version: "2.0"
  - Name: "SDTMIG"
    Version: "3.3"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0564"
        Version: "1"
      Version: "2.0"
