Core:
  Id: "CDISC-AD0771"
  Status: "Published"
  Version: "1"
Description: "Raise an error when there is more than one value of ASEV for a given\
  \ value of ASEVN, considering only rows on which both variables are populated"
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "OCCURRENCE DATA STRUCTURE"
    - "MEDICAL DEVICE OCCURRENCE DATA STRUCTURE"
Check:
  expression: >-
    not empty(ASEV) and not empty(ASEVN) and has_multiple_values_for(ASEV, ASEVN)
Outcome:
  Message: "ASEV takes more than one value for the same value of ASEVN, considering\
    \ only rows on which both variables are populated."
  Output_Variables:
  - "ASEV"
  - "ASEVN"
Source:
  Class: "OCCURRENCE DATA STRUCTURE; MEDICAL DEVICE OCCURRENCE DATA STRUCTURE"
  Variable_or_Item: "ASEV"
  Natural_Language_Rule_Failure_Criteria: "There is more than one value of ASEV for\
    \ a given value of ASEVN, considering only those rows on which both variables\
    \ are populated"
  Rule_Failure_Criteria: "There is more than one value of ASEV for a given value of\
    \ ASEVN"
  Condition_Failure: "On rows where both ASEV and ASEVN are both populated."
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.1"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR771"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
