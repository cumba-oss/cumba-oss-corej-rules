Core:
  Id: "CDISC-AD0737"
  Status: "Published"
  Version: "1"
Description: "Raise an error when, within a given value of PARAMCD, there is more\
  \ than one value of SHIFTyN for a given value of SHIFTy, considering only rows on\
  \ which both variables are populated"
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "BASIC DATA STRUCTURE"
Check:
  expression: >-
    not empty(SHIFTyN) and not empty(SHIFTy) and has_multiple_values_for(SHIFTyN, SHIFTy,
    within=PARAMCD)
Outcome:
  Message: "SHIFTyN has more than one value for this SHIFTy within this PARAMCD, among\
    \ rows where both are populated"
  Output_Variables:
  - "PARAMCD"
  - "SHIFTy"
  - "SHIFTyN"
wildcards:
  "y":
    min: 1
    max: 99
Source:
  Class: "BASIC DATA STRUCTURE; MEDICAL DEVICE BASIC DATA STRUCTURE"
  Variable_or_Item: "SHIFTyN where y is an integer [1-99, not zero-padded]"
  Natural_Language_Rule_Failure_Criteria: "Within a given value of PARAMCD, there\
    \ is more than one value of SHIFTyN for a given value of SHIFTy, considering only\
    \ those rows on which both variables are populated"
  Rule_Failure_Criteria: "Within a given value of PARAMCD, there is more than one\
    \ value of SHIFTyN for a given value of SHIFTy"
  Condition_Failure: "On rows where SHIFTyN and SHIFTy are both populated"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.1"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR737"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.2"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR737"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.3"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR737"
        Version: "1"
      Version: "5.0"
