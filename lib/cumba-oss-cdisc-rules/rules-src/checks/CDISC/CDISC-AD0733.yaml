Core:
  Id: "CDISC-AD0733"
  Status: "Published"
  Version: "1"
Description: "Raise an error when, within a given value of PARAMCD for a subject,\
  \ there is more than one value of BASEC for a given value of BASE, considering only\
  \ rows on which both variables are populated"
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "BASIC DATA STRUCTURE"
Check:
  expression: >-
    not empty(BASE) and not empty(BASEC) and has_multiple_values_for(BASEC, BASE, within=[USUBJID,
    PARAMCD])
Outcome:
  Message: "BASEC has more than one value for this BASE within this PARAMCD for this\
    \ subject, among rows where both are populated"
  Output_Variables:
  - "BASE"
  - "BASEC"
Source:
  Class: "BASIC DATA STRUCTURE"
  Variable_or_Item: "BASEC"
  Natural_Language_Rule_Failure_Criteria: "Within a given value of PARAMCD for a subject,\
    \ there is more than one value of BASEC for a given value of BASE, considering\
    \ only those rows on which both variables are populated"
  Rule_Failure_Criteria: "Within a given value of PARAMCD for a subject, there is\
    \ more than one value of BASEC for a given value of BASE"
  Condition_Failure: "On rows where BASEC and BASE are both populated"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.1"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR733"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.2"
