Core:
  Id: "CDISC-CG0300"
  Status: "Published"
  Version: "1"
Description: "Raise an error when TRLAT is present in the TR dataset, because the\
  \ TR domain does not include anatomical location information on each measurement/assessment\
  \ record; that information is represented in the TU dataset."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "TR"
Check:
  expression: >-
    var_exists("TRLAT")
Outcome:
  Message: "TRLAT must not be present in the TR dataset."
  Output_Variables:
  - "TRLAT"
Source:
  Class: "FND"
  Domain: "TR"
  Variable: "TRLAT"
  Rule: "TRLAT not present in dataset"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "SDTMIG"
    Version: "3.4"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0300"
        Version: "1"
      Version: "2.0"
  - Name: "SDTMIG"
    Version: "3.3"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0300"
        Version: "1"
      Version: "2.0"
  - Name: "SDTMIG"
    Version: "3.2"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0300"
        Version: "1"
      Version: "2.0"
