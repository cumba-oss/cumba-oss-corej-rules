Core:
  Id: "CDISC-AD0149"
  Status: "Published"
  Version: "1"
Description: "Raise an error when, within a given value of PARAMCD, there is more\
  \ than one value of AVALC for a given value of AVAL."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "BASIC DATA STRUCTURE"
Check:
  expression: >-
    has_multiple_values_for(AVALC, AVAL, within=PARAMCD)
Outcome:
  Message: "AVALC has more than one value for this PARAMCD and AVAL."
  Output_Variables:
  - "PARAMCD"
  - "AVAL"
  - "AVALC"
Source:
  Class: "BASIC DATA STRUCTURE"
  Variable_or_Item: "AVALC"
  Natural_Language_Rule_Failure_Criteria: "Within a given value of PARAMCD, there\
    \ is more than one value of AVALC for a given value of AVAL"
  Rule_Failure_Criteria: "Within a given value of PARAMCD, there is more than one\
    \ value of AVALC for a given value of AVAL"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.0"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR149"
        Version: "1"
      Version: "5.0"
