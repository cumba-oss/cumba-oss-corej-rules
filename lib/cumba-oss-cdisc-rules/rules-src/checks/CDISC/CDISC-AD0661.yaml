Core:
  Id: "CDISC-AD0661"
  Status: "Published"
  Version: "1"
Description: "Raise an error when ADOSEDUR is present but NDOSEDUR or DOSEDURU is\
  \ not present in an ADNCA v1.0 dataset."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "BASIC DATA STRUCTURE"
  Subclasses:
    Include:
    - "NON-COMPARTMENTAL ANALYSIS"
Check:
  expression: >-
    var_exists("ADOSEDUR") and (not var_exists("NDOSEDUR") or not var_exists("DOSEDURU"))
Outcome:
  Message: "ADOSEDUR is present and NDOSEDUR or DOSEDURU is not present"
  Output_Variables:
  - "ADOSEDUR"
Source:
  Class: "BASIC DATA STRUCTURE"
  Subclass: "NON-COMPARTMENTAL ANALYSIS"
  Variable_or_Item: "ADOSEDUR"
  Natural_Language_Rule_Failure_Criteria: "ADOSEDUR is present and NDOSEDUR or DOSEDURU\
    \ is not present"
  Rule_Failure_Criteria: "NDOSEDUR or DOSEDURU is not present"
  Condition_Failure: "ADOSEDUR is present"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.0"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR661"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.1"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR661"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.2"
