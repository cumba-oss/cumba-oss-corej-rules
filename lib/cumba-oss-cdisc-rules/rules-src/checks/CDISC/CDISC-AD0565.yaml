Core:
  Id: "CDISC-AD0565"
  Status: "Published"
  Version: "2"
Description: "Raise an error when BCHGCAyN is present and BCHGCATy is not present."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "BASIC DATA STRUCTURE"
Check:
  expression: >-
    var_exists("BCHGCAyN") and not var_exists("BCHGCATy")
Outcome:
  Message: "BCHGCAyN is present, but BCHGCATy is not present."
  Output_Variables:
  - "BCHGCAyN"
wildcards:
  "y":
    min: 1
    max: 99
Source_Proposed:
  Sheet_Issue: "#58,#155"
  Class: "BASIC DATA STRUCTURE; MEDICAL DEVICE BASIC DATA STRUCTURE"
  Subclass: ""
  SEND_SDTM_Domain: ""
  Variable_or_Item: "BCHGCAyN where y is an integer [1-99, not zero-padded]"
  Natural_Language_Rule_Failure_Criteria: "BCHGCAyN is present and BCHGCATy is not\
    \ present"
  Rule_Failure_Criteria: "BCHGCATy is not present"
  Condition_Failure: "BCHGCAyN is present"
Source:
  Class: "BASIC DATA STRUCTURE; MEDICAL DEVICE BASIC DATA STRUCTURE"
  Variable_or_Item: "BCHGCAyN where y is an integer [1-9, not zero-padded]"
  Natural_Language_Rule_Failure_Criteria: "BCHGCAyN is present and BCHGCATy is not\
    \ present"
  Rule_Failure_Criteria: "CHGCATy is not present"
  Condition_Failure: "BCHGCAyN is present"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.2"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR565"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.3"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
