Core:
  Id: "CDISC-AD0679"
  Status: "Published"
  Version: "1"
Description: "Raise an error when, on a given record, DEVTYGy is populated but DEVTYGyN\
  \ is missing."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "DEVICE LEVEL ANALYSIS DATASET"
Check:
  expression: >-
    not empty(DEVTYGy) and empty(DEVTYGyN)
Outcome:
  Message: "DEVTYGy is populated but DEVTYGyN is missing on this record."
  Output_Variables:
  - "DEVTYGy"
  - "DEVTYGyN"
wildcards:
  "y":
    min: 1
    max: 99
Source:
  Class: "DEVICE LEVEL ANALYSIS DATASET"
  Variable_or_Item: "DEVTYGyN where y is an integer [1-9, not zero-padded]"
  Natural_Language_Rule_Failure_Criteria: "On a given record, DEVTYGy is populated\
    \ and DEVTYGyN is not populated"
  Rule_Failure_Criteria: "DEVTYGyN is not populated"
  Condition_Failure: "DEVTYGy is populated"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.3"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR679"
        Version: "1"
      Version: "5.0"
