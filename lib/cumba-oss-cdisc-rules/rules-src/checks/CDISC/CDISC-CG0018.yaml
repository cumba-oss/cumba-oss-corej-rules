Core:
  Id: "CDISC-CG0018"
  Status: "Published"
  Version: "1"
Description: "Raise an error when a Supplemental Qualifier dataset associated with\
  \ a split domain has a dataset name longer than 8 characters."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "SUPP--"
    - "SQ--"
    - "SUPPAPFA--"
    include_split_datasets: true
Check:
  expression: >-
    len(dataset_name) > 8
Outcome:
  Message: "The split Supplemental Qualifier dataset name is longer than 8 characters."
  Output_Variables:
  - "dataset_name"
Source:
  Class: "ALL"
  Domain: "ALL"
  Variable: "GEN"
  Condition: "Supplemental Qualifier datasets"
  Rule: "Split dataset names length <= 8"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "SDTMIG"
    Version: "3.4"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0018"
        Version: "1"
      Version: "2.0"
  - Name: "SDTMIG"
    Version: "3.3"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0018"
        Version: "1"
      Version: "2.0"
  - Name: "SDTMIG"
    Version: "3.2"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0018"
        Version: "1"
      Version: "2.0"
