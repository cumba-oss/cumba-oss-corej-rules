Core:
  Id: "CDISC-AD0207"
  Status: "Published"
  Version: "1"
Description: "Raise an error when, for a subject, DM has a value for RACE and ADSL.RACE\
  \ does not equal that value"
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "SUBJECT LEVEL ANALYSIS DATASET"
Match_Datasets:
- Name: "DM"
  Keys:
  - "USUBJID"
Check:
  expression: >-
    var_exists(DM.RACE) and RACE != DM.RACE
Outcome:
  Message: "For this subject, ADSL.RACE does not equal DM.RACE"
  Output_Variables:
  - "RACE"
  - "DM.RACE"
Source:
  Class: "SUBJECT LEVEL ANALYSIS DATASET"
  Variable_or_Item: "RACE"
  Natural_Language_Rule_Failure_Criteria: "The value of ADSL.USUBJID is equal to the\
    \ value of DM.USUBJID and ADSL.RACE is not equal to DM.RACE"
  Rule_Failure_Criteria: "ADSL.RACE is not equal to DM.RACE"
  Condition_Failure: "The value of ADSL.USUBJID is equal to the value of DM.USUBJID"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.0"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR207"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.1"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR207"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.2"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR207"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.3"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR207"
        Version: "1"
      Version: "5.0"
