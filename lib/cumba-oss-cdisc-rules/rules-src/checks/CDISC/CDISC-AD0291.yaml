Core:
  Id: "CDISC-AD0291"
  Status: "Published"
  Version: "1"
Description: "Raise an error when there is more than one value of RELGRy for a given\
  \ value of RELGRyN, where y is an integer [1-9, not zero-padded]."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "OCCURRENCE DATA STRUCTURE"
Check:
  expression: >-
    not empty(RELGRy) and not empty(RELGRyN) and has_multiple_values_for(RELGRy, RELGRyN)
Outcome:
  Message: "RELGRy has more than one value for the same value of RELGRyN, where y\
    \ is an integer [1-9, not zero-padded]."
  Output_Variables:
  - "RELGRy"
  - "RELGRyN"
wildcards:
  "y":
    min: 1
    max: 9
Source:
  Class: "OCCURRENCE DATA STRUCTURE"
  Variable_or_Item: "RELGRy where y is an integer [1-9, not zero-padded]"
  Natural_Language_Rule_Failure_Criteria: "There is more than one value of RELGRy\
    \ for a given value of RELGRyN"
  Rule_Failure_Criteria: "There is more than one value of RELGRy for a given value\
    \ of RELGRyN"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.0"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR291"
        Version: "1"
      Version: "5.0"
