Core:
  Id: "CDISC-CG0623"
  Status: "Published"
  Version: "1"
Description: "Raise an error when --RSTIND is present in an Interventions or Findings\
  \ class dataset, because this variable is not permitted in human clinical trials."
Executability: "Fully Executable"
Scope:
  Classes:
    Include:
    - "INTERVENTIONS"
    - "FINDINGS"
Check:
  expression: >-
    var_exists("--RSTIND")
Outcome:
  Message: "--RSTIND is present but is not permitted in human clinical trials."
  Output_Variables:
  - "--RSTIND"
Source:
  Class: "INT|FND"
  Variable: "--RSTIND"
  Rule: "--RSTIND not present in dataset"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "SDTMIG"
    Version: "3.4"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0623"
        Version: "1"
      Version: "2.0"
