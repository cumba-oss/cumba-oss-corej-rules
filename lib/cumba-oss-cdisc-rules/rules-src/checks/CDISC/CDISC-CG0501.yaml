Core:
  Id: "CDISC-CG0501"
  Status: "Published"
  Version: "1"
Description: "Raise an error when the Disease Milestone Instance Name (MIDS) variable\
  \ is present in a dataset but the Trial Disease Milestones (TM) dataset is not present\
  \ in the study."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "ALL"
Operations:
- id: "$MIDS_EXISTS"
  expression: "variable_exists(MIDS)"
Check:
  expression: >-
    $MIDS_EXISTS == true and not ds_exists("TM")
Outcome:
  Message: "TM dataset is not present in the study when the MIDS variable is present\
    \ in a dataset."
  Output_Variables:
  - "$MIDS_EXISTS"
Source:
  Class: "ALL"
  Domain: "ALL"
  Variable: "MIDS"
  Condition: "MIDS present in dataset"
  Rule: "TM dataset present in study"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "SDTMIG"
    Version: "3.4"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0501"
        Version: "2"
      Version: "2.0"
  - Name: "SDTMIG"
    Version: "3.3"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0501"
        Version: "2"
      Version: "2.0"
