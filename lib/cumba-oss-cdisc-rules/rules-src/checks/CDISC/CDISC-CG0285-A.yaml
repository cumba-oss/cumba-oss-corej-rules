Core:
  Id: "CDISC-CG0285-A"
  Status: "Published"
  Version: "1"
Description: "Raise an error when TSVAL does not contain at least a complete (full)\
  \ date in ISO 8601 format for a record where TSPARMCD equals 'SSTDTC' (Study Start\
  \ Date)."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "TS"
Requirements:
  Variables:
    All:
    - "TSPARMCD"
Check:
  expression: >-
    TSPARMCD == "SSTDTC" and not is_complete_date_part(TSVAL)
Outcome:
  Message: "TSVAL is an incomplete date for TSPARMCD equal to 'SSTDTC' (Study Start\
    \ Date); it must be in ISO 8601 format and include at least the full date."
  Output_Variables:
  - "TSPARMCD"
  - "TSVAL"
Source_Proposed:
  Sheet_Issue: "#105"
  Class: "TDM"
  Domain: "TS"
  Variable: "TSVAL"
  Condition: "TSPARMCD = SSTDTC"
  Rule: "TSVAL does not contain at least a complete (full) date in ISO 8601 format\
    \ for a record where TSPARMCD equals 'SSTDTC' (Study Start Date)"
Source:
  Class: "TDM"
  Domain: "TS"
  Variable: "TSVAL"
  Condition: "TSPARMCD = SSTDTC"
  Rule: "TSVAL conforms to ISO 8601 date"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "SDTMIG"
    Version: "3.3"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0285"
        Version: "1"
      Version: "2.0"
  - Name: "SDTMIG"
    Version: "3.2"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0285"
        Version: "1"
      Version: "2.0"
