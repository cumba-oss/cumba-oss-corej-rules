Core:
  Id: "CDISC-AD0335"
  Status: "Published"
  Version: "2"
Description: "Raise an error when CRITyFL is present and CRITy is not present"
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "BASIC DATA STRUCTURE"
    - "MEDICAL DEVICE BASIC DATA STRUCTURE"
Check:
  expression: >-
    var_exists("CRITyFL") and not var_exists("CRITy")
Outcome:
  Message: "CRITyFL is present, but CRITy is not present."
  Output_Variables:
  - "CRITyFL"
wildcards:
  "y":
    min: 1
    max: 99
Source:
  Class: "BASIC DATA STRUCTURE; MEDICAL DEVICE BASIC DATA STRUCTURE"
  Variable_or_Item: "CRITyFL where y is an integer [1-99, not zero-padded]"
  Natural_Language_Rule_Failure_Criteria: "CRITyFL is present and CRITy is not present"
  Rule_Failure_Criteria: "CRITy is not present"
  Condition_Failure: "CRITyFL is present"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.0"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR335"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.1"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
