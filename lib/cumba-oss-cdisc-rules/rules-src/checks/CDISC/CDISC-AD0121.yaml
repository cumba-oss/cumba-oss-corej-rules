Core:
  Id: "CDISC-AD0121"
  Status: "Published"
  Version: "1"
Description: "Raise an error when the value of a variable with a suffix of SDT is\
  \ greater than the value of a variable with the same root and a suffix of EDT, considering\
  \ only records on which both variables are populated."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "ALL"
Check:
  expression: >-
    not empty(*SDT) and not empty(*EDT) and *SDT > *EDT
Outcome:
  Message: "A variable with a suffix of SDT has a greater value than the variable\
    \ with the same root and a suffix of EDT."
  Output_Variables:
  - "*SDT"
  - "*EDT"
Source:
  Class: "ALL"
  Variable_or_Item: "*SDT"
  Natural_Language_Rule_Failure_Criteria: "The value of a variable with a suffix of\
    \ SDT is greater than the value of a variable with the same root and a suffix\
    \ of EDT, considering only rows on which both variables are populated"
  Rule_Failure_Criteria: "A variable with a suffix of SDT has a value greater than\
    \ a value of a variable with the same root and a suffix of EDT"
  Condition_Failure: "On rows where *SDT and *EDT are both populated"
