Core:
  Id: "CDISC-AD0742"
  Status: "Published"
  Version: "1"
Description: "Raise an error when, within a given value of PARAMCD, there is more\
  \ than one value of AVALC for a given value of AVAL, considering only rows on which\
  \ both variables are populated"
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "BASIC DATA STRUCTURE"
Check:
  expression: >-
    not empty(AVAL) and not empty(AVALC) and has_multiple_values_for(AVALC, AVAL, within=PARAMCD)
Outcome:
  Message: "AVALC has more than one value for this AVAL within this PARAMCD, among\
    \ rows where both are populated"
  Output_Variables:
  - "PARAMCD"
  - "AVAL"
  - "AVALC"
Source:
  Class: "BASIC DATA STRUCTURE; MEDICAL DEVICE BASIC DATA STRUCTURE"
  Variable_or_Item: "AVALC"
  Natural_Language_Rule_Failure_Criteria: "Within a given value of PARAMCD, there\
    \ is more than one value of AVALC for a given value of AVAL, considering only\
    \ those rows on which both variables are populated"
  Rule_Failure_Criteria: "Within a given value of PARAMCD, there is more than one\
    \ value of AVALC for a given value of AVAL"
  Condition_Failure: "On rows where AVALC and AVAL are both populated"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.1"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR742"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.2"
    References:
