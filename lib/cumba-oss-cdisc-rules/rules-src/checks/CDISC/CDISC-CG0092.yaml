Core:
  Id: "CDISC-CG0092"
  Status: "Published"
  Version: "1"
Description: "Raise an error when the Time Point Reference (--TPTREF) variable is\
  \ not present in the dataset while the Planned Elapsed Time from Time Point Ref\
  \ (--ELTM) variable is present."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "ALL"
Check:
  expression: >-
    var_exists("--ELTM") and not var_exists("--TPTREF")
Outcome:
  Message: "Missing --TPTREF variable when --ELTM variable is present."
  Output_Variables:
  - "--ELTM"
Source:
  Class: "ALL"
  Domain: "ALL"
  Variable: "--TPTREF"
  Condition: "--ELTM present in dataset"
  Rule: "--TPTREF present in dataset"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "SDTMIG"
    Version: "3.4"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0092"
        Version: "1"
      Version: "2.0"
  - Name: "SDTMIG"
    Version: "3.3"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0092"
        Version: "1"
      Version: "2.0"
  - Name: "SDTMIG"
    Version: "3.2"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0092"
        Version: "1"
      Version: "2.0"
