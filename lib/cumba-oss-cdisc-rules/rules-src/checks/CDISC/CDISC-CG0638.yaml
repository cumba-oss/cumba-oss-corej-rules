Core:
  Id: "CDISC-CG0638"
  Status: "Published"
  Version: "1"
Description: "Raise an error when --RPSTDY is present."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "ALL"
Check:
  expression: >-
    var_exists("--RPSTDY")
Outcome:
  Message: "--RPSTDY must not be present."
  Output_Variables:
  - "--RPSTDY"
Source:
  Class: "ALL"
  Variable: "--RPSTDY"
  Rule: "--RPSTDY not present in dataset"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "SDTMIG"
    Version: "3.4"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0638"
        Version: "1"
      Version: "2.0"
