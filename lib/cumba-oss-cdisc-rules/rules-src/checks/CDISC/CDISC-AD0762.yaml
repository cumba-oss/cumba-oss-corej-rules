Core:
  Id: "CDISC-AD0762"
  Status: "Published"
  Version: "1"
Description: "Raise an error when there is more than one value of TRTPGy for a given\
  \ value of TRTPGyN, where y is an integer [1-99, not zero-padded], considering only\
  \ rows on which both variables are populated"
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "BASIC DATA STRUCTURE"
Check:
  expression: >-
    not empty(TRTPGy) and not empty(TRTPGyN) and has_multiple_values_for(TRTPGy, TRTPGyN)
Outcome:
  Message: "TRTPGy has more than one value for this TRTPGyN, among rows where both\
    \ are populated"
  Output_Variables:
  - "TRTPGy"
  - "TRTPGyN"
wildcards:
  "y":
    min: 1
    max: 99
Source:
  Class: "BASIC DATA STRUCTURE; MEDICAL DEVICE BASIC DATA STRUCTURE"
  Variable_or_Item: "TRTPGy where y is an integer [1-99, not zero-padded]"
  Natural_Language_Rule_Failure_Criteria: "There is more than one value of TRTPGy\
    \ for a given value of TRTPGyN, where y is an integer [1-99, not zero-padded],\
    \ considering only those rows on which both variables are populated"
  Rule_Failure_Criteria: "There is more than one value of TRTPGy for a given value\
    \ of TRTPGyN"
  Condition_Failure: "On rows where TRTPGy and TRTPGyN are both populated"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.1"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR762"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.2"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR762"
        Version: "1"
      Version: "5.0"
