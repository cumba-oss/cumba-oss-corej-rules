Core:
  Id: "CDISC-AD0864"
  Status: "Published"
  Version: "1"
Description: "Raise an error when COHORTC is present and COHORT is not present."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "BASIC DATA STRUCTURE"
Check:
  expression: >-
    var_exists("COHORTC") and not var_exists("COHORT")
Outcome:
  Message: "COHORTC is present, but COHORT is not present."
  Output_Variables:
  - "COHORTC"
Source:
  Class: "BASIC DATA STRUCTURE"
  Subclass: "POPULATION PHARMACOKINETIC ANALYSIS"
  Variable_or_Item: "COHORTC"
  Natural_Language_Rule_Failure_Criteria: "COHORTC is present and COHORT is not present"
  Rule_Failure_Criteria: "COHORT is not present"
  Condition_Failure: "COHORTC is present"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.3"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR864"
        Version: "1"
      Version: "5.0"
