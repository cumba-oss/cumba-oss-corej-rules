Core:
  Id: "CDISC-SEND-0377"
  Status: "Published"
  Version: "1"
Description: "Raise an error when a Reproductive Stage Code (RSTGCD) value is longer\
  \ than 8 characters."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "TT"
Check:
  expression: >-
    len(RSTGCD) > 8
Outcome:
  Message: "RSTGCD is longer than 8 characters."
  Output_Variables:
  - "RSTGCD"
Source:
  Class: "TDM"
  Domain: "TT"
  Variable: "RSTGCD"
  Plain_Text_Explanation: "RSTGCD value is limited to 8 characters."
  Rule: "RSTGCD value length <= 8"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "SENDIG-DART"
    Version: "1.2"
    References:
    - Origin: "SEND Conformance Rules"
      Rule_Identifier:
        Id: "SEND377"
        Version: "1"
      Version: "5.0"
  - Name: "SENDIG-DART"
    Version: "1.1"
    References:
    - Origin: "SEND Conformance Rules"
      Rule_Identifier:
        Id: "SEND377"
        Version: "1"
      Version: "5.0"
