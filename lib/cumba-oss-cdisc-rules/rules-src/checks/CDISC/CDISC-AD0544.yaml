Core:
  Id: "CDISC-AD0544"
  Status: "Published"
  Version: "2"
Description: "Raise an error when BASECAyN is present but the corresponding BASECATy\
  \ is not present, where y is an integer [1-99, not zero-padded]."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "BASIC DATA STRUCTURE"
Check:
  expression: >-
    var_exists("BASECAyN") and not var_exists("BASECATy")
Outcome:
  Message: "BASECAyN is present but the corresponding BASECATy is not present."
  Output_Variables:
  - "BASECAyN"
wildcards:
  "y":
    min: 1
    max: 99
Source:
  Class: "BASIC DATA STRUCTURE; MEDICAL DEVICE BASIC DATA STRUCTURE"
  Variable_or_Item: "BASECAyN where y is an integer [1-9, not zero-padded]"
  Natural_Language_Rule_Failure_Criteria: "BASECAyN is present and BASECATy is not\
    \ present"
  Rule_Failure_Criteria: "BASECATy is not present"
  Condition_Failure: "BASECAyN is present"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.1"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR544"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.2"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR544"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.3"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR544"
        Version: "2"
      Version: "5.0"
