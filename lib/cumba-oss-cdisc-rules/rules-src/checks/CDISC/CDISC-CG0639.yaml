Core:
  Id: "CDISC-CG0639"
  Status: "Published"
  Version: "1"
Description: "Raise an error when --RPENDY is present."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "ALL"
Check:
  expression: >-
    var_exists("--RPENDY")
Outcome:
  Message: "--RPENDY must not be present."
  Output_Variables:
  - "--RPENDY"
Source:
  Class: "ALL"
  Variable: "--RPENDY"
  Rule: "--RPENDY not present in dataset"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "SDTMIG"
    Version: "3.4"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0639"
        Version: "1"
      Version: "2.0"
