Core:
  Id: "CDISC-AD0154"
  Status: "Published"
  Version: "1"
Description: "Raise an error when BASETYPE is present and, within a given PARAMCD\
  \ and BASETYPE for a subject, more than one record has ABLFL equal to Y."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "BASIC DATA STRUCTURE"
Grouping:
  Variables:
  - "USUBJID"
  - "PARAMCD"
  - "BASETYPE"
Operations:
- id: "$ablfl_y_count"
  expression: "record_count(ABLFL, group=[USUBJID, PARAMCD, BASETYPE], filter=filter(ABLFL=\"\
    Y\"))"
Check:
  expression: >-
    var_exists("BASETYPE") and $ablfl_y_count > 1
Outcome:
  Message: "More than one record has ABLFL equal to Y for this subject, PARAMCD, and\
    \ BASETYPE."
  Output_Variables:
  - "PARAMCD"
  - "BASETYPE"
  - "ABLFL"
  - "$ablfl_y_count"
Source:
  Class: "BASIC DATA STRUCTURE"
  Variable_or_Item: "ABLFL"
  Natural_Language_Rule_Failure_Criteria: "Within a given PARAMCD and BASETYPE for\
    \ a subject, more than one record has ABLFL equal to Y"
  Rule_Failure_Criteria: "Within a given PARAMCD and BASETYPE for a subject, more\
    \ than one record has ABLFL equal to Y"
  Condition_Failure: "BASETYPE is present"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.0"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR154"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.1"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR154"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.2"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR154"
        Version: "1"
      Version: "5.0"
