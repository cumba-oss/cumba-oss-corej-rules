Core:
  Id: "CDISC-SEND-0078"
  Status: "Published"
  Version: "1"
Description: "Raise an error when the Start Date/Time of Observation (--STDTC) variable\
  \ is present in a Findings-class dataset; in the Findings observation class --STDTC\
  \ is not used, because --DTC (in conjunction with --ENDTC) represents an interval\
  \ collection."
Executability: "Fully Executable"
Scope:
  Classes:
    Include:
    - "FINDINGS"
Check:
  expression: >-
    var_exists("--STDTC")
Outcome:
  Message: "--STDTC is present in a Findings-class dataset, where it is not used."
  Output_Variables:
  - "--STDTC"
Source:
  Class: "FND"
  Domain: "ALL"
  Variable: "--STDTC"
  Plain_Text_Explanation: "--STDTC is not used for data collection (--DTC is used\
    \ in conjunction with --ENDTC to represent an interval collection)"
  Rule: "--STDTC is not present"
