Core:
  Id: "CDISC-SEND-0199"
  Status: "Published"
  Version: "1"
Description: "Raise an error when more than one Subject Characteristics (SC) record\
  \ exists for the same combination of subject (USUBJID) and characteristic (SCTESTCD);\
  \ the SC domain expects one record per characteristic per subject."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "SC"
Check:
  expression: >-
    not is_unique_set([USUBJID, SCTESTCD])
Outcome:
  Message: "More than one SC record exists for the same characteristic within a subject."
  Output_Variables:
  - "SCTESTCD"
Source:
  Class: "FND"
  Domain: "SC"
  Variable: "ALL"
  Plain_Text_Explanation: "One record per characteristic per subject"
  Rule: "One record per characteristic per subject"
