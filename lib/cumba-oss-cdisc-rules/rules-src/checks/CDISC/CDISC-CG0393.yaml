Core:
  Id: "CDISC-CG0393"
  Status: "Published"
  Version: "1"
Description: "Raise an error when AESLIFE is populated and its value is not 'Y' or\
  \ 'N'."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "AE"
Requirements:
  Variables:
    All:
    - "AESLIFE"
Check:
  expression: >-
    not empty(AESLIFE) and AESLIFE not in ["Y", "N"]
Outcome:
  Message: "AESLIFE is populated, but its value is not 'Y' or 'N'."
  Output_Variables:
  - "AESLIFE"
Source:
  Class: "EVT"
  Domain: "AE"
  Variable: "--SLIFE"
  Condition: "--SLIFE ^= null"
  Rule: "--SLIFE in ('Y','N')"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "SDTMIG"
    Version: "3.4"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0393"
        Version: "1"
      Version: "2.0"
  - Name: "SDTMIG"
    Version: "3.3"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0393"
        Version: "1"
      Version: "2.0"
  - Name: "SDTMIG"
    Version: "3.2"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0393"
        Version: "1"
      Version: "2.0"
