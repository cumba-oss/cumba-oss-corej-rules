Core:
  Id: "CDISC-AD0545"
  Status: "Published"
  Version: "2"
Description: "Raise an error when CHGCATyN is present but the corresponding CHGCATy\
  \ is not present, where y is an integer [1-99, not zero-padded]."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "BASIC DATA STRUCTURE"
Check:
  expression: >-
    var_exists("CHGCATyN") and not var_exists("CHGCATy")
Outcome:
  Message: "CHGCATyN is present but the corresponding CHGCATy is not present."
  Output_Variables:
  - "CHGCATyN"
wildcards:
  "y":
    min: 1
    max: 99
Source:
  Class: "BASIC DATA STRUCTURE; MEDICAL DEVICE BASIC DATA STRUCTURE"
  Variable_or_Item: "CHGCATyN where y is an integer [1-9, not zero-padded]"
  Natural_Language_Rule_Failure_Criteria: "CHGCATyN is present and CHGCATy is not\
    \ present"
  Rule_Failure_Criteria: "CHGCATy is not present"
  Condition_Failure: "CHGCATyN is present"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.1"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR545"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.2"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR545"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.3"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR545"
        Version: "2"
      Version: "5.0"
