Core:
  Id: "CDISC-AD0859"
  Status: "Published"
  Version: "1"
Description: "Raise an error when ACYCLEC is present and ACYCLE is not present."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "BASIC DATA STRUCTURE"
Check:
  expression: >-
    var_exists("ACYCLEC") and not var_exists("ACYCLE")
Outcome:
  Message: "ACYCLEC is present, but ACYCLE is not present."
  Output_Variables:
  - "ACYCLEC"
Source:
  Class: "BASIC DATA STRUCTURE"
  Subclass: "POPULATION PHARMACOKINETIC ANALYSIS"
  Variable_or_Item: "ACYCLEC"
  Natural_Language_Rule_Failure_Criteria: "ACYCLEC is present and ACYCLE is not present"
  Rule_Failure_Criteria: "ACYCLE is not present"
  Condition_Failure: "ACYCLEC is present"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.3"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR859"
        Version: "1"
      Version: "5.0"
