Core:
  Id: "CDISC-AD0243"
  Status: "Published"
  Version: "1"
Description: "Raise an error when there is more than one value of TRTxxA for a given\
  \ value of TRTxxAN, where xx is an integer [01-99, zero-padded]."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "SUBJECT LEVEL ANALYSIS DATASET"
Check:
  expression: >-
    not empty(TRTxxA) and not empty(TRTxxAN) and has_multiple_values_for(TRTxxA, TRTxxAN)
Outcome:
  Message: "TRTxxA has more than one value for the same value of TRTxxAN, where xx\
    \ is an integer [01-99, zero-padded]."
  Output_Variables:
  - "TRTxxA"
  - "TRTxxAN"
wildcards:
  xx:
    min: 1
    max: 99
Source:
  Class: "SUBJECT LEVEL ANALYSIS DATASET"
  Variable_or_Item: "TRTxxA where xx is an integer [01-99, zero-padded]"
  Natural_Language_Rule_Failure_Criteria: "There is more than one value of TRTxxA\
    \ for a given value of TRTxxAN, where xx is an integer [01-99, zero-padded]"
  Rule_Failure_Criteria: "There is more than one value of TRTxxA for a given value\
    \ of TRTxxAN"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.0"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR243"
        Version: "1"
      Version: "5.0"
