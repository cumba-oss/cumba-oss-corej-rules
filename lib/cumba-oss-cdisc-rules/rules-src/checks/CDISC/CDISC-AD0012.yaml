Core:
  Id: "CDISC-AD0012"
  Status: "Published"
  Version: "1"
Description: "Raise an error when a variable with a suffix of FL is present but not\
  \ populated, and a variable with the same root and a suffix of FN is populated"
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "ALL"
Check:
  expression: >-
    var_exists(*FL) and empty(*FL) and not empty(*FN)
Outcome:
  Message: "A variable with a suffix of FN is populated, although the variable with\
    \ the same root and a suffix of FL is present but not populated"
  Output_Variables:
  - "*FL"
  - "*FN"
Source:
  Class: "ALL"
  Variable_or_Item: "*FN"
  Natural_Language_Rule_Failure_Criteria: "A variable with a suffix of FL is equal\
    \ to null and a variable with the same root and a suffix of FN is not equal to\
    \ null"
  Rule_Failure_Criteria: "A variable with a suffix of FN is not equal to null"
  Condition_Failure: "Variable with a suffix of FL is present and equal to null, and\
    \ a variable with the same root and a suffix of FN is present"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.0"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR12"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.1"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR12"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.2"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR12"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.3"
