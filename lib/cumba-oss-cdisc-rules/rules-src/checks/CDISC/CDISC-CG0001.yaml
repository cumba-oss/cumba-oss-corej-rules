Core:
  Id: "CDISC-CG0001"
  Status: "Published"
  Version: "1"
Description: "Raise an error when the DOMAIN value of a non-custom domain is not a\
  \ Domain Code published by CDISC in the \"SDTM Domain Abbreviations\" controlled\
  \ terminology codelist."
Sensitivity: "Dataset"
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "ALL"
Variable_Universe: "Define"
Operations:
- id: "$domain_is_custom"
  expression: "domain_is_custom()"
- id: "$domain_lib_ccode"
  expression: "codelist_terms(codelists=[DOMAIN], level=\"term\", returntype=\"code\"\
    )"
Check:
  expression: >-
    $domain_is_custom == false and var_ccode("DEFINE") == "C66734" and
    var_codelist_coded_codes("DEFINE") not in $domain_lib_ccode
Outcome:
  Message: "DOMAIN is not a valid Domain Code published by CDISC in the SDTM Domain\
    \ Abbreviations controlled terminology."
  Output_Variables:
  - "$domain_is_custom"
  - "define_variable_ccode"
  - "define_variable_codelist_coded_codes"
  - "$domain_lib_ccode"
Source:
  Class: "ALL"
  Domain: "ALL"
  Variable: "DOMAIN"
  Condition: "Not custom domain"
  Rule: "DOMAIN = valid Domain Code published by CDISC"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "SDTMIG"
    Version: "3.4"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0001"
        Version: "1"
      Version: "2.0"
  - Name: "SDTMIG"
    Version: "3.3"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0001"
        Version: "1"
      Version: "2.0"
  - Name: "SDTMIG"
    Version: "3.2"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0001"
        Version: "1"
      Version: "2.0"
