Core:
  Id: "CDISC-CG0554"
  Status: "Published"
  Version: "1"
Description: "Raise an error when one or more of the variables STUDYID, DOMAIN, or\
  \ --SEQ is not present, or when none of USUBJID, APID, SPDEVID, or POOLID is present,\
  \ in a domain based on one of the three SDTM general observation classes."
Executability: "Fully Executable"
Scope:
  Classes:
    Include:
    - "EVENTS"
    - "INTERVENTIONS"
    - "FINDINGS"
    - "FINDINGS ABOUT"
Check:
  expression: >-
    not var_exists("STUDYID") or not var_exists("DOMAIN") or not var_exists("--SEQ") or not
    var_exists("USUBJID") and not var_exists("APID") and not var_exists("SPDEVID") and not
    var_exists("POOLID")
Outcome:
  Message: "One or more of the variables STUDYID, DOMAIN, or --SEQ is not present,\
    \ or none of the subject identifiers USUBJID, APID, SPDEVID, or POOLID is present,\
    \ in the dataset."
Source:
  Class: "ALL"
  Domain: "ALL"
  Variable: "GEN"
  Rule: "STUDYID, DOMAIN, and --SEQ exist and at least one of USUBJID, APID, SPDEVID,\
    \ or POOLID"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "SDTMIG"
    Version: "3.4"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0554"
        Version: "1"
      Version: "2.0"
  - Name: "SDTMIG"
    Version: "3.3"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0554"
        Version: "1"
      Version: "2.0"
