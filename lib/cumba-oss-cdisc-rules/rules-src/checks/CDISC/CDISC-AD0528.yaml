Core:
  Id: "CDISC-AD0528"
  Status: "Published"
  Version: "1"
Description: "Raise an error when TRTSEQAN is present but TRTSEQA is not present."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "SUBJECT LEVEL ANALYSIS DATASET"
Check:
  expression: >-
    var_exists("TRTSEQAN") and not var_exists("TRTSEQA")
Outcome:
  Message: "TRTSEQAN is present but TRTSEQA is not present."
  Output_Variables:
  - "TRTSEQAN"
Source:
  Class: "SUBJECT LEVEL ANALYSIS DATASET"
  Variable_or_Item: "TRTSEQAN"
  Natural_Language_Rule_Failure_Criteria: "TRTSEQAN is present and TRTSEQA is not\
    \ present"
  Rule_Failure_Criteria: "TRTSEQA is not present"
  Condition_Failure: "TRTSEQAN is present"
