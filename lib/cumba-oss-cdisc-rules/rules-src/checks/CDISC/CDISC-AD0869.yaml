Core:
  Id: "CDISC-AD0869"
  Status: "Published"
  Version: "1"
Description: "Raise an error when RACEN is present and RACE is not present."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "BASIC DATA STRUCTURE"
Check:
  expression: >-
    var_exists("RACEN") and not var_exists("RACE")
Outcome:
  Message: "RACEN is present, but RACE is not present."
  Output_Variables:
  - "RACEN"
Source:
  Class: "BASIC DATA STRUCTURE"
  Subclass: "POPULATION PHARMACOKINETIC ANALYSIS"
  Variable_or_Item: "RACEN"
  Natural_Language_Rule_Failure_Criteria: "RACEN is present and RACE is not present"
  Rule_Failure_Criteria: "RACE is not present"
  Condition_Failure: "RACEN is present"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.3"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR869"
        Version: "1"
      Version: "5.0"
