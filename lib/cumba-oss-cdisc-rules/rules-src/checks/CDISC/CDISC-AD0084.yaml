      Rule_Identifier:
        Id: "CR84"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.2"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR84"
        Version: "1"
      Version: "5.0"
