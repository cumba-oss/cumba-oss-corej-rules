Core:
  Id: "CDISC-AD0084"
  Status: "Published"
  Version: "1"
Description: "Raise an error when TRTEDT and the maximum value across all TRxxEDT\
  \ variables are both populated and TRTEDT does not equal that maximum, where xx\
  \ is an integer [01-99, zero-padded]"
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "SUBJECT LEVEL ANALYSIS DATASET"
Operations:
- id: "$trxx_max"
  expression: "row_max(name_pattern=\"^TR(0[1-9]|[1-9][0-9])EDT$\")"
Check:
  expression: >-
    not empty(TRTEDT) and not empty($trxx_max) and TRTEDT != $trxx_max
Outcome:
  Message: "TRTEDT does not equal the maximum value among the TRxxEDT variables"
  Output_Variables:
  - "TRTEDT"
  - "$trxx_max"
Source:
  Class: "SUBJECT LEVEL ANALYSIS DATASET"
  Variable_or_Item: "TRTEDT"
  Natural_Language_Rule_Failure_Criteria: "TRTEDT is not equal to the maximum value\
    \ of all TRxxEDT variables"
  Rule_Failure_Criteria: "Variable is not equal to the maximum value of all TRxxEDT\
    \ variables"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.0"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR84"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.1"
    References:
