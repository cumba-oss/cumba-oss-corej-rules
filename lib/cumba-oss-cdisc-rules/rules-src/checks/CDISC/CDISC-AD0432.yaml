Core:
  Id: "CDISC-AD0432"
  Status: "Published"
  Version: "2"
Description: "Raise an error when APHASEN is populated but APHASE is empty"
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "BASIC DATA STRUCTURE"
    - "OCCURRENCE DATA STRUCTURE"
    - "MEDICAL DEVICE OCCURRENCE DATA STRUCTURE"
Check:
  expression: >-
    not empty(APHASEN) and empty(APHASE)
Outcome:
  Message: "APHASEN is populated, but APHASE is empty"
  Output_Variables:
  - "APHASE"
  - "APHASEN"
Source:
  Class: "BASIC DATA STRUCTURE; MEDICAL DEVICE BASIC DATA STRUCTURE; OCCURRENCE DATA\
    \ STRUCTURE; MEDICAL DEVICE OCCURRENCE DATA STRUCTURE"
  Variable_or_Item: "APHASE"
  Natural_Language_Rule_Failure_Criteria: "On a given record, APHASEN is populated\
    \ and APHASE is not populated"
  Rule_Failure_Criteria: "APHASE is not populated"
  Condition_Failure: "APHASEN is populated"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.2"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR432"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.3"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR432"
        Version: "2"
      Version: "5.0"
