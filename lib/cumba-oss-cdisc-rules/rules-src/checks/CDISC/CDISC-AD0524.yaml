Core:
  Id: "CDISC-AD0524"
  Status: "Published"
  Version: "2"
Description: "Raise an error when ATOXGRHN is present but ATOXGRH is not present."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "BASIC DATA STRUCTURE"
Check:
  expression: >-
    var_exists("ATOXGRHN") and not var_exists("ATOXGRH")
Outcome:
  Message: "ATOXGRHN is present but ATOXGRH is not present."
  Output_Variables:
  - "ATOXGRHN"
Source:
  Class: "BASIC DATA STRUCTURE; MEDICAL DEVICE BASIC DATA STRUCTURE"
  Variable_or_Item: "ATOXGRHN"
  Natural_Language_Rule_Failure_Criteria: "ATOXGRHN is present and ATOXGRH is not\
    \ present"
  Rule_Failure_Criteria: "ATOXGRH is not present"
  Condition_Failure: "ATOXGRHN is present"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.1"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR524"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.2"
    References:
