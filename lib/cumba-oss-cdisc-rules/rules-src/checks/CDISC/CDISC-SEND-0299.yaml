Core:
  Id: "CDISC-SEND-0299"
  Status: "Published"
  Version: "1"
Description: "Raise an error when a variable present in the RELREC, SUPP--, or POOLDEF\
  \ dataset is not defined for that domain in the SENDIG; additional variables may\
  \ not be added to these relationship datasets."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "RELREC"
    - "SUPP--"
    - "SQ--"
    - "POOLDEF"
Operations:
- id: "$library_variables"
  expression: "get_column_order_from_library()"
Check:
  expression: >-
    varname() not in $library_variables
Outcome:
  Message: "The variable is not defined for this domain in the SENDIG and may not\
    \ be added to RELREC, SUPP--, or POOLDEF."
  Output_Variables:
  - "variable_name"
  - "$library_variables"
Source:
  Class: "REL"
  Domain: "RELREC, SUPP--, POOLDEF"
  Variable: "ALL"
  Plain_Text_Explanation: "Additional variables not specified in the SENDIG description\
    \ of the domain (including both the domain table and assumptions) may not be added\
    \ to RELREC, SUPP--, and POOLDEF."
  Rule: "Additional variables not specified in the SENDIG description of the domain\
    \ (including both the domain table and assumptions) may not be added to RELREC,\
    \ SUPP--, and POOLDEF."
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "SENDIG-GENETOX"
    Version: "1.0"
    References:
    - Origin: "SEND Conformance Rules"
      Rule_Identifier:
