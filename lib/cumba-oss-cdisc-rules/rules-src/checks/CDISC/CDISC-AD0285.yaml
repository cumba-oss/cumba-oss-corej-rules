Core:
  Id: "CDISC-AD0285"
  Status: "Published"
  Version: "1"
Description: "Raise an error when there is more than one value of SEVGRy for a given\
  \ value of SEVGRyN, where y is an integer [1-9, not zero-padded]."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "OCCURRENCE DATA STRUCTURE"
Check:
  expression: >-
    not empty(SEVGRy) and not empty(SEVGRyN) and has_multiple_values_for(SEVGRy, SEVGRyN)
Outcome:
  Message: "SEVGRy has more than one value for the same value of SEVGRyN, where y\
    \ is an integer [1-9, not zero-padded]."
  Output_Variables:
  - "SEVGRy"
  - "SEVGRyN"
wildcards:
  "y":
    min: 1
    max: 9
Source:
  Class: "OCCURRENCE DATA STRUCTURE"
  Variable_or_Item: "SEVGRy where y is an integer [1-9, not zero-padded]"
  Natural_Language_Rule_Failure_Criteria: "There is more than one value of SEVGRy\
    \ for a given value of SEVGRyN"
  Rule_Failure_Criteria: "There is more than one value of SEVGRy for a given value\
    \ of SEVGRyN"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.0"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR285"
        Version: "1"
      Version: "5.0"
