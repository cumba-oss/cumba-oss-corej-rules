Core:
  Id: "CDISC-SEND-0314"
  Status: "Published"
  Version: "1"
Description: "Raise an error when Dose per Administration (EXDOSE) is populated for\
  \ a record whose Dose Description (EXDOSTXT) is also populated; when the dose is\
  \ described in EXDOSTXT, EXDOSE should be missing."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "EX"
Requirements:
  Variables:
    All:
    - "EXDOSTXT"
    - "EXDOSE"
Check:
  expression: >-
    not empty(EXDOSTXT) and not empty(EXDOSE)
Outcome:
  Message: "EXDOSE is populated when EXDOSTXT is provided; EXDOSE should be missing\
    \ when the dose amount is described in EXDOSTXT."
  Output_Variables:
  - "EXDOSE"
  - "EXDOSTXT"
Source:
  Class: "INT"
  Domain: "EX"
  Variable: "EXDOSTXT"
  Plain_Text_Explanation: "If EXDOSTXT is populated EXDOSE should not be populated."
  Condition: "EXDOSTXT ^= null"
  Rule: "EXDOSE = null"
Standards:
- Organization: "CDISC"
