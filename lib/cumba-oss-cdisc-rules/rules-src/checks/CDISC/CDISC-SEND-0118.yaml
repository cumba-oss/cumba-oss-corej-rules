Core:
  Id: "CDISC-SEND-0118"
  Status: "Published"
  Version: "1"
Description: "Raise an error when Value of Identifying Variable (IDVARVAL) is populated\
  \ but Identifying Variable (IDVAR) is empty."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "CO"
Requirements:
  Variables:
    All:
    - "IDVARVAL"
Check:
  expression: >-
    not empty(IDVARVAL) and empty(IDVAR)
Outcome:
  Message: "IDVARVAL is populated when IDVAR is empty."
  Output_Variables:
  - "IDVAR"
  - "IDVARVAL"
Source:
  Class: "SPC"
  Domain: "CO"
  Variable: "IDVARVAL"
  Plain_Text_Explanation: "IDVARVAL contains the value of the identifying record.\
    \  IDVARVAL should not be populated if IDVAR is blank."
  Condition: "IDVAR = null"
  Rule: "IDVARVAL = null"
