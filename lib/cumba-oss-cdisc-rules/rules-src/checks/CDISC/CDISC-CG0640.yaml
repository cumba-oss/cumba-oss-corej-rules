Core:
  Id: "CDISC-CG0640"
  Status: "Published"
  Version: "1"
Description: "Raise an error when --DETECT is present."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "ALL"
Check:
  expression: >-
    var_exists("--DETECT")
Outcome:
  Message: "--DETECT must not be present."
  Output_Variables:
  - "--DETECT"
Source:
  Class: "ALL"
  Variable: "--DETECT"
  Rule: "--DETECT not present in dataset"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "SDTMIG"
    Version: "3.4"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0640"
        Version: "1"
      Version: "2.0"
