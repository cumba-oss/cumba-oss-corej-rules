Core:
  Id: "CDISC-AD0817"
  Status: "Published"
  Version: "1"
Description: "Raise an error when, within a dataset, there is more than one value\
  \ of SUBJIDN for a given value of SUBJID, considering only those rows on which both\
  \ variables are populated."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "BASIC DATA STRUCTURE"
Check:
  expression: >-
    not empty(SUBJID) and not empty(SUBJIDN) and has_multiple_values_for(SUBJIDN, SUBJID)
Outcome:
  Message: "There is more than one value of SUBJIDN for a given value of SUBJID within\
    \ this dataset."
  Output_Variables:
  - "SUBJID"
  - "SUBJIDN"
Source:
  Class: "BASIC DATA STRUCTURE"
  Subclass: "POPULATION PHARMACOKINETIC ANALYSIS"
  Variable_or_Item: "SUBJIDN"
  Natural_Language_Rule_Failure_Criteria: "Within a dataset, there is more than one\
    \ value of SUBJIDN for a given value of SUBJID, considering only those rows on\
    \ which both variables are populated."
  Rule_Failure_Criteria: "Within a dataset, there is more than one value of SUBJIDN\
    \ for a given value of SUBJID"
  Condition_Failure: "On rows where both SUBJIDN and SUBJID are both populated"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.3"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR817"
        Version: "1"
      Version: "5.0"
