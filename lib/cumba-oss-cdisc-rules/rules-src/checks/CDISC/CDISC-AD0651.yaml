Core:
  Id: "CDISC-AD0651"
  Status: "Published"
  Version: "2"
Description: "Raise an error when ONTRxxFL is present but ONTRTFL is not present."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "OCCURRENCE DATA STRUCTURE"
    - "MEDICAL DEVICE OCCURRENCE DATA STRUCTURE"
Check:
  expression: >-
    var_exists("ONTRxxFL") and not var_exists("ONTRTFL")
Outcome:
  Message: "ONTRxxFL is present, but ONTRTFL is not present in the dataset."
  Output_Variables:
  - "ONTRxxFL"
wildcards:
  xx:
    min: 1
    max: 99
Source:
  Class: "OCCURRENCE DATA STRUCTURE; MEDICAL DEVICE OCCURRENCE DATA STRUCTURE"
  Variable_or_Item: "ONTRxxFL where xx is an integer [01-99, zero-padded]"
  Natural_Language_Rule_Failure_Criteria: "ONTRxxFL is present but ONTRTFL is not\
    \ present"
  Rule_Failure_Criteria: "ONTRTFL is not present"
  Condition_Failure: "ONTRxxFL is present"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.0"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR651"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.1"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR651"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.2"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR651"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.3"
    References:
