Core:
  Id: "CDISC-SEND-0279.1"
  Status: "Published"
  Version: "1"
Description: "Raise an error when the planned elapsed time (--ELTM) is populated but\
  \ the time point reference (--TPTREF) is not populated; --ELTM is expressed relative\
  \ to --TPTREF."
Executability: "Fully Executable"
Scope:
  Classes:
    Include:
    - "INTERVENTIONS"
    - "FINDINGS"
Requirements:
  Variables:
    All:
    - "--ELTM"
Check:
  expression: >-
    not empty(--ELTM) and empty(--TPTREF)
Outcome:
  Message: "--TPTREF is empty even though --ELTM is populated."
  Output_Variables:
  - "--ELTM"
  - "--TPTREF"
Source:
  Class: "INT, FND"
  Domain: "ALL"
  Variable: "--TPTREF"
  Plain_Text_Explanation: "--TPTREF must be populated when --ELTM is populated because\
    \ --ELTM is in relative to --TPTREF"
  Condition: "--ELTM ^= null"
  Rule: "--TPTREF ^= null"
Standards:
- Organization: "CDISC"
  Standards:
