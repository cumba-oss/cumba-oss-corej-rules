Core:
  Id: "CDISC-AD0555"
  Status: "Published"
  Version: "2"
Description: "Raise an error when TRTAN is present and TRTA is not present."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "BASIC DATA STRUCTURE"
    - "OCCURRENCE DATA STRUCTURE"
    - "MEDICAL DEVICE OCCURRENCE DATA STRUCTURE"
Check:
  expression: >-
    var_exists("TRTAN") and not var_exists("TRTA")
Outcome:
  Message: "TRTAN is present, but TRTA is not present."
  Output_Variables:
  - "TRTAN"
Source:
  Class: "BASIC DATA STRUCTURE; MEDICAL DEVICE BASIC DATA STRUCTURE; OCCURRENCE DATA\
    \ STRUCTURE; MEDICAL DEVICE OCCURRENCE DATA STRUCTURE"
  Variable_or_Item: "TRTAN"
  Natural_Language_Rule_Failure_Criteria: "TRTAN is present and TRTA is not present"
  Rule_Failure_Criteria: "TRTA is not present"
  Condition_Failure: "TRTAN is present"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.1"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR555"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.2"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR555"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.3"
