Core:
  Id: "CDISC-AD0075"
  Status: "Published"
  Version: "1"
Description: "Raise an error when TRTxxPN is present and TRTxxP is not present"
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "SUBJECT LEVEL ANALYSIS DATASET"
Check:
  expression: >-
    var_exists("TRTxxPN") and not var_exists("TRTxxP")
Outcome:
  Message: "TRTxxPN is present but its corresponding TRTxxP is not present"
  Output_Variables:
  - "TRTxxPN"
wildcards:
  xx:
    min: 1
    max: 99
Source:
  Class: "SUBJECT LEVEL ANALYSIS DATASET"
  Variable_or_Item: "TRTxxPN where xx is an integer [01-99, zero-padded]"
  Natural_Language_Rule_Failure_Criteria: "TRTxxPN is present and TRTxxP is not present"
  Rule_Failure_Criteria: "TRTxxP is not present"
  Condition_Failure: "TRTxxPN is present"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.0"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR75"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.1"
    References:
