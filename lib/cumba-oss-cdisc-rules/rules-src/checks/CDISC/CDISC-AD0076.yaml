Core:
  Id: "CDISC-AD0076"
  Status: "Published"
  Version: "1"
Description: "Raise an error when TRTxxPN and TRTxxP are both populated and there\
  \ is more than one value of TRTxxPN for a given value of TRTxxP"
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "SUBJECT LEVEL ANALYSIS DATASET"
Check:
  expression: >-
    not empty(TRTxxPN) and not empty(TRTxxP) and has_multiple_values_for(TRTxxPN, TRTxxP)
Outcome:
  Message: "More than one value of TRTxxPN was found for the same value of TRTxxP"
  Output_Variables:
  - "TRTxxP"
  - "TRTxxPN"
wildcards:
  xx:
    min: 1
    max: 99
Source:
  Class: "SUBJECT LEVEL ANALYSIS DATASET"
  Variable_or_Item: "TRTxxPN where xx is an integer [01-99, zero-padded]"
  Natural_Language_Rule_Failure_Criteria: "There is more than one value of TRTxxPN\
    \ for a given value of TRTxxP"
  Rule_Failure_Criteria: "There is more than one value of TRTxxPN for a given value\
    \ of TRTxxP"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.0"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR76"
        Version: "1"
      Version: "5.0"
