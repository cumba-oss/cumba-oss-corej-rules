Core:
  Id: "CDISC-AD0506"
  Status: "Published"
  Version: "1"
Description: "Raise an error when a variable's name ends in ADY but its label does\
  \ not contain 'Relative Day'."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "ALL"
Check:
  expression: >-
    ends_with(varname(), "ADY") and not contains(var_label("DATA"), "Relative Day")
Outcome:
  Message: "The variable's name ends in ADY, but its label does not contain 'Relative\
    \ Day'."
  Output_Variables:
  - "variable_name"
  - "variable_label"
skipIfLibraryDefined: true
Source:
  Class: "ALL"
  Variable_or_Item: "*ADY"
  Natural_Language_Rule_Failure_Criteria: "A variable ending in ADY must contain \"\
    Relative Day\" in the label"
  Rule_Failure_Criteria: "*ADY does not contain \"Relative Day\" in the label"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.1"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR506"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.2"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR506"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.3"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR506"
        Version: "1"
      Version: "5.0"
