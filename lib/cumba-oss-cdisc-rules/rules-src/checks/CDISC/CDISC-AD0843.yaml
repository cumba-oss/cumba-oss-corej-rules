Core:
  Id: "CDISC-AD0843"
  Status: "Published"
  Version: "1"
Description: "Raise an error when, considering only rows on which both ALQFL and ALQFN\
  \ are populated, more than one value of ALQFL is present within the dataset for\
  \ a given value of ALQFN."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "BASIC DATA STRUCTURE"
Check:
  expression: >-
    not empty(ALQFL) and not empty(ALQFN) and has_multiple_values_for(ALQFL, ALQFN)
Outcome:
  Message: "More than one value of ALQFL is present for this value of ALQFN within\
    \ the dataset."
  Output_Variables:
  - "ALQFL"
  - "ALQFN"
Source:
  Class: "BASIC DATA STRUCTURE"
  Subclass: "POPULATION PHARMACOKINETIC ANALYSIS"
  Variable_or_Item: "ALQFL"
  Natural_Language_Rule_Failure_Criteria: "Within a dataset, there is more than one\
    \ value of ALQFL for a given value of ALQFN, considering only those rows on which\
    \ both variables are populated"
  Rule_Failure_Criteria: "Within a dataset, there is more than one value of ALQFL\
    \ for a given value of ALQFN"
  Condition_Failure: "On rows where both ALQFL and ALQFN are both populated"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.3"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR843"
        Version: "1"
      Version: "5.0"
