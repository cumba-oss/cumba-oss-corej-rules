Core:
  Id: "CDISC-SEND-0141"
  Status: "Published"
  Version: "1"
Description: "Raise an error when Reported Term for the Disposition Event (DSTERM)\
  \ is populated but Standardized Disposition Term (DSDECOD) is empty; DSTERM must\
  \ be mapped to a controlled terminology value in DSDECOD."
Executability: "Partially Executable - Possible Underreporting"
Scope:
  Domains:
    Include:
    - "DS"
Check:
  expression: >-
    not empty(DSTERM) and empty(DSDECOD)
Outcome:
  Message: "DSDECOD is empty when DSTERM is populated; DSTERM must be mapped to a\
    \ value in DSDECOD."
  Output_Variables:
  - "DSTERM"
  - "DSDECOD"
Source:
  Class: "EVT"
  Domain: "DS"
  Variable: "DSTERM"
  Plain_Text_Explanation: "DSTERM values should be mapped to DSDECOD (i.e., translated\
    \ into Controlled Terminology)"
  Rule: "DSTERM is mapped to DSDECOD"
