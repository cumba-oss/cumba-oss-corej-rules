Core:
  Id: "CDISC-SEND-0021"
  Status: "Published"
  Version: "1"
Description: "Raise an error when the Qualifier Variable Name (QNAM) starts with a\
  \ number."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "SUPP--"
    - "SQ--"
Requirements:
  Variables:
    All:
    - "QNAM"
Check:
  expression: >-
    not empty(QNAM) and QNAM =~ /^[0-9]/
Outcome:
  Message: "QNAM starts with a number."
  Output_Variables:
  - "QNAM"
Source:
  Class: "SPC"
  Domain: "SUPP--"
  Variable: "QNAM"
  Plain_Text_Explanation: "QNAM value cannot start with a number"
  Rule: "QNAM value cannot start with a number"
