Core:
  Id: "CDISC-CG0467"
  Status: "Published"
  Version: "1"
Description: "Raise an error when --STDTC is present in a Findings general observation\
  \ class dataset, where its use is not recommended."
Executability: "Fully Executable"
Scope:
  Classes:
    Include:
    - "FINDINGS"
Check:
  expression: >-
    var_exists("--STDTC")
Outcome:
  Message: "--STDTC is present in a Findings general observation class dataset, where\
    \ its use is not recommended."
  Output_Variables:
  - "--STDTC"
Source:
  Class: "FND"
  Domain: "ALL"
  Variable: "--STDTC"
  Rule: "--STDTC not present"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "SDTMIG"
    Version: "3.4"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0467"
        Version: "1"
      Version: "2.0"
  - Name: "SDTMIG"
    Version: "3.3"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0467"
        Version: "1"
      Version: "2.0"
  - Name: "SDTMIG"
    Version: "3.2"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0467"
        Version: "1"
      Version: "2.0"
