Core:
  Id: "CDISC-AD0224"
  Status: "Published"
  Version: "1"
Description: "Raise an error when, within a given value of PARAMCD, CHGCATy is populated,\
  \ CHG is populated, and there is more than one value of CHGCATy for a given value\
  \ of CHG"
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "BASIC DATA STRUCTURE"
Check:
  expression: >-
    not empty(CHGCATy) and not empty(CHG) and has_multiple_values_for(CHGCATy, CHG, within=PARAMCD)
Outcome:
  Message: "Within this PARAMCD, more than one value of CHGCATy is recorded for the\
    \ same CHG"
  Output_Variables:
  - "PARAMCD"
  - "CHG"
  - "CHGCATy"
wildcards:
  "y":
    min: 1
    max: 9
Source:
  Class: "BASIC DATA STRUCTURE"
  Variable_or_Item: "CHGCATy where y is an integer [1-9, not zero-padded]"
  Natural_Language_Rule_Failure_Criteria: "Within a given value of PARAMCD, there\
    \ is more than one value of CHGCATy for a given value of CHG and y"
  Rule_Failure_Criteria: "There is more than one value of CHGCATy for a given value\
    \ of CHG"
  Condition_Failure: "Within a given value of PARAMCD"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.0"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR224"
        Version: "1"
      Version: "5.0"
