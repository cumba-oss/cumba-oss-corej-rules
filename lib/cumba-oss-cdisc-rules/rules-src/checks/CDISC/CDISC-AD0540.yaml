Core:
  Id: "CDISC-AD0540"
  Status: "Published"
  Version: "2"
Description: "Raise an error when APHASEN is present but APHASE is not present."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "BASIC DATA STRUCTURE"
    - "OCCURRENCE DATA STRUCTURE"
    - "MEDICAL DEVICE OCCURRENCE DATA STRUCTURE"
Check:
  expression: >-
    var_exists("APHASEN") and not var_exists("APHASE")
Outcome:
  Message: "APHASEN is present but APHASE is not present."
  Output_Variables:
  - "APHASEN"
Source:
  Class: "BASIC DATA STRUCTURE; MEDICAL DEVICE BASIC DATA STRUCTURE; OCCURRENCE DATA\
    \ STRUCTURE; MEDICAL DEVICE OCCURRENCE DATA STRUCTURE"
  Variable_or_Item: "APHASEN"
  Natural_Language_Rule_Failure_Criteria: "APHASEN is present and APHASE is not present"
  Rule_Failure_Criteria: "APHASE is not present"
  Condition_Failure: "APHASEN is present"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.1"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
