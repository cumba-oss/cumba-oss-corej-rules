Core:
  Id: "CDISC-AD0234"
  Status: "Published"
  Version: "1"
Description: "Raise an error when TRxxAGy is populated, TRTxxA is populated, and there\
  \ is more than one value of TRxxAGy for a given value of TRTxxA"
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "SUBJECT LEVEL ANALYSIS DATASET"
Check:
  expression: >-
    not empty(TRxxAGy) and not empty(TRTxxA) and has_multiple_values_for(TRxxAGy, TRTxxA)
Outcome:
  Message: "More than one value of TRxxAGy is recorded for the same value of TRTxxA"
  Output_Variables:
  - "TRTxxA"
  - "TRxxAGy"
wildcards:
  xx:
    min: 1
    max: 99
  "y":
    min: 1
    max: 9
Source:
  Class: "SUBJECT LEVEL ANALYSIS DATASET"
  Variable_or_Item: "TRxxAGy where xx is an integer [01-99, zero-padded] and y is\
    \ an integer [1-9, not zero-padded]"
  Natural_Language_Rule_Failure_Criteria: "Within a given value of TRTxxA, there is\
    \ more than one value of TRxxAGy, where xx is an integer [01-99, zero-padded]\
    \ and y is a single-digit integer [1-9]"
  Rule_Failure_Criteria: "Within a given value of TRTxxA, there is more than one value\
    \ of TRxxAGy"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.0"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR234"
        Version: "1"
      Version: "5.0"
