Core:
  Id: "CDISC-AD0298"
  Status: "Published"
  Version: "1"
Description: "Raise an error when there is more than one value of TOXGGRyN for a given\
  \ value of TOXGGRy, where y is an integer [1-9, not zero-padded]."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "OCCURRENCE DATA STRUCTURE"
Check:
  expression: >-
    not empty(TOXGGRyN) and not empty(TOXGGRy) and has_multiple_values_for(TOXGGRyN, TOXGGRy)
Outcome:
  Message: "TOXGGRyN has more than one value for the same value of TOXGGRy, where\
    \ y is an integer [1-9, not zero-padded]."
  Output_Variables:
  - "TOXGGRy"
  - "TOXGGRyN"
wildcards:
  "y":
    min: 1
    max: 9
Source:
  Class: "OCCURRENCE DATA STRUCTURE"
  Variable_or_Item: "TOXGGRyN where y is an integer [1-9, not zero-padded]"
  Natural_Language_Rule_Failure_Criteria: "There is more than one value of TOXGGRyN\
    \ for a given value of TOXGGRy"
  Rule_Failure_Criteria: "There is more than one value of TOXGGRyN for a given value\
    \ of TOXGGRy"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.0"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR298"
        Version: "1"
      Version: "5.0"
