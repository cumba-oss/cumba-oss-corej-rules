Core:
  Id: "CDISC-AD0021"
  Status: "Published"
  Version: "1"
Description: "Raise an error when ITTFL is populated with a value that is not Y or\
  \ N"
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "SUBJECT LEVEL ANALYSIS DATASET"
Requirements:
  Variables:
    All:
    - "ITTFL"
Check:
  expression: >-
    not empty(ITTFL) and ITTFL not in ["Y", "N"]
Outcome:
  Message: "ITTFL has a value other than Y or N"
  Output_Variables:
  - "ITTFL"
Source:
  Class: "SUBJECT LEVEL ANALYSIS DATASET"
  Variable_or_Item: "ITTFL"
  Natural_Language_Rule_Failure_Criteria: "ITTFL is present and has a value that is\
    \ not Y or N"
  Rule_Failure_Criteria: "Value is not Y or N"
  Condition_Failure: "ITTFL is present"
Standards:
- Organization: "CDISC"
  Standards:
