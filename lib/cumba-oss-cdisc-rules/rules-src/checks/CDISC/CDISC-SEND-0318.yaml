Core:
  Id: "CDISC-SEND-0318"
  Status: "Published"
  Version: "1"
Description: "Raise an error when a Nominal Study Day (--NOMDY) is populated with\
  \ a value that is not an integer."
Executability: "Fully Executable"
Scope:
  Classes:
    Include:
    - "EVENTS"
    - "FINDINGS"
Requirements:
  Variables:
    All:
    - "--NOMDY"
Check:
  expression: >-
    not empty(--NOMDY) and --NOMDY !~ /^-?[0-9]+$/
Outcome:
  Message: "--NOMDY is populated with a value that is not an integer."
  Output_Variables:
  - "--NOMDY"
Source:
  Class: "EVT, FND"
  Domain: "ALL"
  Variable: "--NOMDY"
  Plain_Text_Explanation: "--NOMDY should be populated with an integer"
  Rule: "NOMDY is an integer"
