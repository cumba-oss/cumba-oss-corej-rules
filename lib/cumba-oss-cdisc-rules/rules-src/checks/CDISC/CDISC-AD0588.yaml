Core:
  Id: "CDISC-AD0588"
  Status: "Published"
  Version: "2"
Description: "Raise an error when, within a parameter, there is more than one value\
  \ of PBCHGCAy for a given value of PBCHGCyN, considering only those rows on which\
  \ both variables are populated, where y is an integer [1-99, not zero-padded]."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "BASIC DATA STRUCTURE"
Check:
  expression: >-
    not empty(PBCHGCAy) and not empty(PBCHGCyN) and has_multiple_values_for(PBCHGCAy, PBCHGCyN,
    within=PARAMCD)
Outcome:
  Message: "Within a parameter, there is more than one value of PBCHGCAy for a given\
    \ value of PBCHGCyN, considering only those rows on which both variables are populated"
  Output_Variables:
  - "PARAMCD"
  - "PBCHGCAy"
  - "PBCHGCyN"
wildcards:
  "y":
    min: 1
    max: 99
Source:
  Class: "BASIC DATA STRUCTURE; MEDICAL DEVICE BASIC DATA STRUCTURE"
  Variable_or_Item: "PBCHGCAy where y is an integer [1-9, not zero-padded]"
  Natural_Language_Rule_Failure_Criteria: "Within a parameter, there is more than\
    \ one value of PBCHGCAy for a given value of PBCHGCyN, considering only those\
    \ rows on which both variables are populated"
  Rule_Failure_Criteria: "Within a parameter, there is more than one value of PBCHGCAy\
    \ for a given value of PBCHGCyN"
  Condition_Failure: "On rows where both PBCHGCAy and PBCHGCyN are both populated"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.2"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR588"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.3"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR588"
        Version: "2"
      Version: "5.0"
