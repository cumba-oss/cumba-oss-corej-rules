Core:
  Id: "CDISC-CG0636"
  Status: "Published"
  Version: "1"
Description: "Raise an error when --NOMLBL is present."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "ALL"
Check:
  expression: >-
    var_exists("--NOMLBL")
Outcome:
  Message: "--NOMLBL must not be present."
  Output_Variables:
  - "--NOMLBL"
Source:
  Class: "ALL"
  Variable: "--NOMLBL"
  Rule: "--NOMLBL not present in dataset"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "SDTMIG"
    Version: "3.4"
    References:
    - Origin: "SDTM and SDTMIG Conformance Rules"
      Rule_Identifier:
        Id: "CG0636"
        Version: "1"
      Version: "2.0"
