Core:
  Id: "CDISC-AD0785-A"
  Status: "Published"
  Version: "1"
Description: "Raise an error when there is more than one value of TOXGGRy for a given\
  \ value of TOXGGyN, considering only rows on which both variables are populated"
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "OCCURRENCE DATA STRUCTURE"
    - "MEDICAL DEVICE OCCURRENCE DATA STRUCTURE"
Check:
  expression: >-
    not empty(TOXGGRy) and not empty(TOXGGyN) and has_multiple_values_for(TOXGGRy, TOXGGyN)
Outcome:
  Message: "TOXGGRy takes more than one value for the same value of TOXGGyN, considering\
    \ only rows on which both variables are populated."
  Output_Variables:
  - "TOXGGRy"
  - "TOXGGyN"
wildcards:
  "y":
    min: 10
    max: 99
Source_Proposed:
  Sheet_Issue: "#155,#159"
  Class: "OCCURRENCE DATA STRUCTURE; MEDICAL DEVICE OCCURRENCE DATA STRUCTURE"
  Subclass: ""
  SEND_SDTM_Domain: ""
  Variable_or_Item: "TOXGGRy where y is an integer [1-99, not zero-padded]"
  Natural_Language_Rule_Failure_Criteria: "there is more than one value of TOXGGRy\
    \ for a given value of TOXGGyN, considering only rows on which both variables\
    \ are populated"
  Rule_Failure_Criteria: "There is more than one value of TOXGGRy for a given value\
    \ of TOXGGRyN"
  Condition_Failure: "On rows where both TOXGGRy and TOXGGRyN are both populated."
Source:
  Class: "OCCURRENCE DATA STRUCTURE; MEDICAL DEVICE OCCURRENCE DATA STRUCTURE"
  Variable_or_Item: "TOXGGRy where y is an integer [1-99, not zero-padded]"
  Natural_Language_Rule_Failure_Criteria: "There is more than one value of TOXGGRy\
    \ for a given value of TOXGGRyN, considering only those rows on which both variables\
    \ are populated"
  Rule_Failure_Criteria: "There is more than one value of TOXGGRy for a given value\
    \ of TOXGGRyN"
  Condition_Failure: "On rows where both TOXGGRy and TOXGGRyN are both populated."
