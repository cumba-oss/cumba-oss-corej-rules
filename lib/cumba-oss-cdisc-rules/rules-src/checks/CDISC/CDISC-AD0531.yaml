Core:
  Id: "CDISC-AD0531"
  Status: "Published"
  Version: "2"
Description: "Raise an error when SEVGRyN is present but the corresponding SEVGRy\
  \ is not present, where y is an integer [1-99, not zero-padded]."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "OCCURRENCE DATA STRUCTURE"
    - "MEDICAL DEVICE OCCURRENCE DATA STRUCTURE"
Check:
  expression: >-
    var_exists("SEVGRyN") and not var_exists("SEVGRy")
Outcome:
  Message: "SEVGRyN is present but the corresponding SEVGRy is not present."
  Output_Variables:
  - "SEVGRyN"
wildcards:
  "y":
    min: 1
    max: 99
Source:
  Class: "OCCURRENCE DATA STRUCTURE; MEDICAL DEVICE OCCURRENCE DATA STRUCTURE"
  Variable_or_Item: "SEVGRyN where y is an integer [1-99, not zero-padded]"
  Natural_Language_Rule_Failure_Criteria: "SEVGRyN is present and SEVGRy is not present"
  Rule_Failure_Criteria: "SEVGRy is not present"
  Condition_Failure: "SEVGRyN is present"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.1"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR531"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.2"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR531"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.3"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR531"
        Version: "2"
      Version: "5.0"
