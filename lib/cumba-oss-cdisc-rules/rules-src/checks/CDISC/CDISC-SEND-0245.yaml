Core:
  Id: "CDISC-SEND-0245"
  Status: "Published"
  Version: "1"
Description: "Raise an error when more than one Trial Summary (TS) record exists for\
  \ the same combination of Trial Summary Parameter Short Name (TSPARMCD) and Parameter\
  \ Value (TSVAL) within a study; the TS domain expects one record per Trial Summary\
  \ parameter value."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "TS"
Check:
  expression: >-
    not is_unique_set([TSVAL, STUDYID, TSPARMCD])
Outcome:
  Message: "More than one TS record exists for the same Trial Summary parameter value\
    \ (TSPARMCD and TSVAL)."
  Output_Variables:
  - "STUDYID"
  - "TSPARMCD"
  - "TSVAL"
Source:
  Class: "TDM"
  Domain: "TS"
  Variable: "ALL"
  Plain_Text_Explanation: "One record per Trial Summary parameter value"
  Rule: "One record per Trial Summary parameter value"
