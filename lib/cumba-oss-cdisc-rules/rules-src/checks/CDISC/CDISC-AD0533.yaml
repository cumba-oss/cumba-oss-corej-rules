Core:
  Id: "CDISC-AD0533"
  Status: "Published"
  Version: "2"
Description: "Raise an error when ARELN is present but AREL is not present."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "OCCURRENCE DATA STRUCTURE"
    - "MEDICAL DEVICE OCCURRENCE DATA STRUCTURE"
Check:
  expression: >-
    var_exists("ARELN") and not var_exists("AREL")
Outcome:
  Message: "ARELN is present but AREL is not present."
  Output_Variables:
  - "ARELN"
Source:
  Class: "OCCURRENCE DATA STRUCTURE; MEDICAL DEVICE OCCURRENCE DATA STRUCTURE"
  Variable_or_Item: "ARELN"
  Natural_Language_Rule_Failure_Criteria: "ARELN is present and AREL is not present"
  Rule_Failure_Criteria: "AREL is not present"
  Condition_Failure: "ARELN is present"
