Core:
  Id: "CDISC-SEND-0263"
  Status: "Published"
  Version: "1"
Description: "Raise an error when a POOLDEF record does not identify a subject (USUBJID\
  \ is empty); a pool must consist of at least one subject."
Executability: "Fully Executable"
Scope:
  Domains:
    Include:
    - "POOLDEF"
Requirements:
  Variables:
    All:
    - "USUBJID"
Check:
  expression: >-
    empty(USUBJID)
Outcome:
  Message: "A POOLDEF record does not identify a subject (USUBJID is empty); a pool\
    \ must consist of at least one subject."
  Output_Variables:
  - "USUBJID"
Source:
  Class: "REL"
  Domain: "POOLDEF"
  Variable: "POOLID"
  Plain_Text_Explanation: "A pool must consist of at least one subject."
  Rule: "A pool must consist of at least one subject."
