Core:
  Id: "CDISC-AD0391"
  Status: "Published"
  Version: "2"
Description: "Raise an error when ATOXGR is populated and ATOXGRN is not populated."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "BASIC DATA STRUCTURE"
    - "OCCURRENCE DATA STRUCTURE"
    - "MEDICAL DEVICE BASIC DATA STRUCTURE"
    - "MEDICAL DEVICE OCCURRENCE DATA STRUCTURE"
Requirements:
  Variables:
    All:
    - "ATOXGR"
    - "ATOXGRN"
Check:
  expression: >-
    not empty(ATOXGR) and empty(ATOXGRN)
Outcome:
  Message: "ATOXGR is populated but ATOXGRN is not populated."
  Output_Variables:
  - "ATOXGR"
  - "ATOXGRN"
Source:
  Class: "BASIC DATA STRUCTURE; MEDICAL DEVICE BASIC DATA STRUCTURE; OCCURRENCE DATA\
    \ STRUCTURE; MEDICAL DEVICE OCCURRENCE DATA STRUCTURE"
  Variable_or_Item: "ATOXGRN"
  Natural_Language_Rule_Failure_Criteria: "On a given record, ATOXGR is populated\
    \ and ATOXGRN is not populated"
  Rule_Failure_Criteria: "ATOXGRN is not populated"
  Condition_Failure: "ATOXGR is populated"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.2"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR391"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.3"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR391"
        Version: "2"
      Version: "5.0"
