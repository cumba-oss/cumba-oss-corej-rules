# Same companion declaration as DRAFT-900044-library.yaml, PLUS an ADSL definition of RFSTDTC.
#
# The ADSL entry is the point: a variable the run's own standard defines is not a carry-over, so
# the NAME-keyed companion lookup must never be consulted for it (RuleRunner.putCarryOverIfUndefined).
standard: adamig
version: "1-3"
domains:
  ADSL:
    variable-metadata:
      RFSTDTC: { label: "Reference Start Date", simpleDatatype: Char }
  DM:
    variable-metadata:
      RFSTDTC: { label: "Subject Reference Start Date/Time", simpleDatatype: Char }
