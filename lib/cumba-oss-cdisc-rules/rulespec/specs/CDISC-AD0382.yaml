name: CDISC-AD0382
kind: rule
description: |
  Wave B2 port — T1b PlainIntermediate.
  CDISC-AD0382: Within a parameter, there is more than one value of BTOXGRN for a given value of BTOXGR.
  Bare-leaf Check (`has_multiple_values_for` with `within: PARAMCD`) scoped to BASIC DATA STRUCTURE.
  Two rows share the same BTOXGR value but distinct BTOXGRN; both fire. A third row is unique and does not fire.
  Bare-leaf Check raises `KeyError: 'name'` on Python's business_rules library (Finding #26); Python lane baseline expected.
python_source: rules-adamig-1-3.json (CDISC-AD0382)
rule:
  coreId: CDISC-AD0382
datasets:
  ADLB:
    row_key: [STUDYID, USUBJID, PARAMCD, AVISITN]
    column_types:
      AVISITN: LONG
    rows:
      - {STUDYID: S1, USUBJID: '001', PARAMCD: HGB, AVISITN: 1, BTOXGRN: X, BTOXGR: A}         # bad
      - {STUDYID: S1, USUBJID: '002', PARAMCD: HGB, AVISITN: 1, BTOXGRN: Y, BTOXGR: A}         # bad (distinct BTOXGRN for same BTOXGR within PARAMCD)
      - {STUDYID: S1, USUBJID: '003', PARAMCD: HGB, AVISITN: 1, BTOXGRN: Z, BTOXGR: B}         # ok (unique BTOXGR)
config:
  standard: adamig
  standard_version: '1.3'
library_mocks:
  classes:
    basic data structure: [ADLB]
expected_violations:
  - rule_id: CDISC-AD0382
    dataset: ADLB
    row_key: {AVISITN: 1, PARAMCD: HGB, STUDYID: S1, USUBJID: '001'}
    status: SUCCESS
    output_variables:
      BTOXGR: A
      BTOXGRN: X
      PARAMCD: HGB
  - rule_id: CDISC-AD0382
    dataset: ADLB
    row_key: {AVISITN: 1, PARAMCD: HGB, STUDYID: S1, USUBJID: '002'}
    status: SUCCESS
    output_variables:
      BTOXGR: A
      BTOXGRN: Y
      PARAMCD: HGB
expected_errors: []
