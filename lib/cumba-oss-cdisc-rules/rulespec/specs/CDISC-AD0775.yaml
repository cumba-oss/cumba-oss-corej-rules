name: CDISC-AD0775
kind: rule
description: |
  Wave B5 port — T1b PlainIntermediate.
  CDISC-AD0775: more than one value of AEREL for a given value of AERELN.
  Bare-leaf Check scoped to OCCURRENCE DATA STRUCTURE (primary: ADAE).
  Uses has_multiple_values_for — Python gap (operator + bare-leaf), so
  this spec baselines on the Python lane; expected matches Java's output.
python_source: rules-adamig-1-3.json (CDISC-AD0775)
rule:
  coreId: CDISC-AD0775
datasets:
  ADAE:
    row_key: [STUDYID, USUBJID, AESEQ]
    column_types:
      AESEQ: LONG
    rows:
      # AERELN=1 mapped to two distinct AEREL (NOT RELATED, POSSIBLY RELATED) -> both fire
      - {STUDYID: S1, USUBJID: '001', AESEQ: 1, AEREL: 'NOT RELATED',      AERELN: '1'}
      - {STUDYID: S1, USUBJID: '002', AESEQ: 1, AEREL: 'POSSIBLY RELATED', AERELN: '1'}
      # AERELN=2 single-valued -> ok
      - {STUDYID: S1, USUBJID: '003', AESEQ: 1, AEREL: 'RELATED',          AERELN: '2'}
config:
  standard: adamig
  standard_version: '1.3'
library_mocks:
  classes:
    occurrence data structure: [ADAE]
expected_violations:
  - rule_id: CDISC-AD0775
    dataset: ADAE
    row_key: {STUDYID: S1, USUBJID: '001', AESEQ: 1}
    status: SUCCESS
    output_variables:
      AEREL: 'NOT RELATED'
      AERELN: '1'
  - rule_id: CDISC-AD0775
    dataset: ADAE
    row_key: {STUDYID: S1, USUBJID: '002', AESEQ: 1}
    status: SUCCESS
    output_variables:
      AEREL: 'POSSIBLY RELATED'
      AERELN: '1'
expected_errors: []
