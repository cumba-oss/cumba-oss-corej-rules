name: CDISC-AD0754
kind: rule
description: |
  Wave B5 port — T1b PlainIntermediate.
  CDISC-AD0754: more than one value of TRTSEQA for a given value of TRTSEQAN.
  Bare-leaf Check scoped to SUBJECT LEVEL ANALYSIS DATASET. Uses
  has_multiple_values_for — Python gap (operator + bare-leaf), so this
  spec baselines on the Python lane; expected matches Java's output.
python_source: rules-adamig-1-3.json (CDISC-AD0754)
rule:
  coreId: CDISC-AD0754
datasets:
  ADSL:
    row_key: [STUDYID, USUBJID]
    rows:
      # TRTSEQAN=1 has two distinct TRTSEQA values (A, B) -> both rows fire
      - {STUDYID: S1, USUBJID: '001', TRTSEQA: 'A', TRTSEQAN: '1'}
      - {STUDYID: S1, USUBJID: '002', TRTSEQA: 'B', TRTSEQAN: '1'}
      # TRTSEQAN=2 has only one distinct TRTSEQA -> ok
      - {STUDYID: S1, USUBJID: '003', TRTSEQA: 'C', TRTSEQAN: '2'}
config:
  standard: adamig
  standard_version: '1.3'
library_mocks:
  classes:
    subject level analysis dataset: [ADSL]
expected_violations:
  - rule_id: CDISC-AD0754
    dataset: ADSL
    row_key: {STUDYID: S1, USUBJID: '001'}
    status: SUCCESS
    output_variables:
      TRTSEQA: 'A'
      TRTSEQAN: '1'
  - rule_id: CDISC-AD0754
    dataset: ADSL
    row_key: {STUDYID: S1, USUBJID: '002'}
    status: SUCCESS
    output_variables:
      TRTSEQA: 'B'
      TRTSEQAN: '1'
expected_errors: []
