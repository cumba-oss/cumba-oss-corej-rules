name: CDISC-AD0395
kind: rule
description: |
  Wave B2 port — T1b PlainIntermediate.
  CDISC-AD0395: Within a parameter, there is more than one value of ATOXGRL for a given value of ATOXGRLN.
  Bare-leaf Check (`has_multiple_values_for` with `within: PARAMCD`) scoped to BASIC DATA STRUCTURE.
  Two rows share the same ATOXGRLN value but distinct ATOXGRL; both fire. A third row is unique and does not fire.
  Bare-leaf Check raises `KeyError: 'name'` on Python's business_rules library (Finding #26); Python lane baseline expected.
python_source: rules-adamig-1-3.json (CDISC-AD0395)
rule:
  coreId: CDISC-AD0395
datasets:
  ADLB:
    row_key: [STUDYID, USUBJID, PARAMCD, AVISITN]
    column_types:
      AVISITN: LONG
    rows:
      - {STUDYID: S1, USUBJID: '001', PARAMCD: 'HGB', AVISITN: 1, ATOXGRL: 'X', ATOXGRLN: 'A'}   # bad
      - {STUDYID: S1, USUBJID: '002', PARAMCD: 'HGB', AVISITN: 1, ATOXGRL: 'Y', ATOXGRLN: 'A'}   # bad (distinct ATOXGRL for same ATOXGRLN within PARAMCD)
      - {STUDYID: S1, USUBJID: '003', PARAMCD: 'HGB', AVISITN: 1, ATOXGRL: 'Z', ATOXGRLN: 'B'}   # ok (unique ATOXGRLN)
config:
  standard: adamig
  standard_version: '1.3'
library_mocks:
  classes:
    basic data structure: [ADLB]
expected_violations:
  - rule_id: CDISC-AD0395
    dataset: ADLB
    row_key: {STUDYID: S1, USUBJID: '001', PARAMCD: 'HGB', AVISITN: 1}
    status: SUCCESS
    output_variables:
      PARAMCD: 'HGB'
      ATOXGRL: 'X'
      ATOXGRLN: 'A'
  - rule_id: CDISC-AD0395
    dataset: ADLB
    row_key: {STUDYID: S1, USUBJID: '002', PARAMCD: 'HGB', AVISITN: 1}
    status: SUCCESS
    output_variables:
      PARAMCD: 'HGB'
      ATOXGRL: 'Y'
      ATOXGRLN: 'A'
expected_errors: []
