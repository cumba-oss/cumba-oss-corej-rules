name: CDISC-AD0364
kind: rule
description: |
  Wave D3 port - T3-VMC Variable Metadata Check with `exists`/`not_exists`
  leaves on ADaM column names. Baselined on Python lane under Finding #9
  (VMC dataset projection divergence).
python_notes: |
  Known divergence (Finding #9): Python swaps the dataset for a
  VariablesMetadataDatasetBuilder projection before evaluating the Check,
  so `exists(COLNAME)` checks meta-field column names instead of the
  actual dataset columns and yields 0 violations. Java evaluates the
  leaves against the original column metadata and fires correctly.
  expected_violations matches Java; Python XFAILs on the asymmetric-lane
  baseline.
python_source: rules-adamig-1-3.json (CDISC-AD0364)
rule:
  coreId: CDISC-AD0364
datasets:
  ADAE:
    row_key: [STUDYID, USUBJID, AESEQ]
    column_types:
      AESEQ: LONG
    rows:
      - {STUDYID: S1, USUBJID: '001', AESEQ: 1, AETERM: HEADACHE, AEDECOD: Headache, DOSEON: X, DOSCUMA: X}
config:
  standard: adamig
  standard_version: '1.3'
library_mocks:
  classes:
    occurrence data structure: [ADAE]
    medical device occurrence data structure: [ADAE]
expected_violations:
  - rule_id: CDISC-AD0364
    dataset: ADAE
    row_key: {STUDYID: S1, USUBJID: '001', AESEQ: 1}
    status: SUCCESS
    output_variables:
      DOSEON: X
      DOSCUMA: X
expected_errors: []
