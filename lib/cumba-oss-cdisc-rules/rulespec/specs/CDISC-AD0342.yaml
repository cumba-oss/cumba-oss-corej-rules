name: CDISC-AD0342
kind: rule
description: |
  Wave B1 port - T1b PlainIntermediate.
  CDISC-AD0342: Within a parameter, there is more than one value of ANRLO for a given value of ANRLOC.
  has_multiple_values_for with within=PARAMCD - ANRLOC must uniquely determine
  ANRLO per parameter. Bare-leaf Check at root - Python KeyError; baseline
  Python lane with Java expected.
python_source: rules-adamig-1-3.json (CDISC-AD0342)
rule:
  coreId: CDISC-AD0342
datasets:
  ADLB:
    row_key: [STUDYID, USUBJID, PARAMCD, AVISITN, ANRLO, ANRLOC]
    column_types:
      AVISITN: LONG
      ANRLO: DOUBLE
    rows:
      # PARAMCD=HGB: ANRLOC='12 g/dL' maps to two distinct ANRLO (12.0 vs 12.5) -> violation
      - {STUDYID: S1, USUBJID: '001', PARAMCD: HGB, AVISITN: 1, ANRLO: 12.0, ANRLOC: 12 g/dL}
      - {STUDYID: S1, USUBJID: '002', PARAMCD: HGB, AVISITN: 1, ANRLO: 12.5, ANRLOC: 12 g/dL}
      # PARAMCD=HGB: ANRLOC='11 g/dL' consistent
      - {STUDYID: S1, USUBJID: '003', PARAMCD: HGB, AVISITN: 1, ANRLO: 11.0, ANRLOC: 11 g/dL}
config:
  standard: adamig
  standard_version: '1.3'
library_mocks:
  classes:
    basic data structure: [ADLB]
expected_violations:
  - rule_id: CDISC-AD0342
    dataset: ADLB
    row_key: {ANRLO: 12.0, ANRLOC: 12 g/dL, AVISITN: 1, PARAMCD: HGB, STUDYID: S1, USUBJID: '001'}
    status: SUCCESS
    output_variables:
      ANRLO: '12'
      ANRLOC: 12 g/dL
      PARAMCD: HGB
  - rule_id: CDISC-AD0342
    dataset: ADLB
    row_key: {ANRLO: 12.5, ANRLOC: 12 g/dL, AVISITN: 1, PARAMCD: HGB, STUDYID: S1, USUBJID: '002'}
    status: SUCCESS
    output_variables:
      ANRLO: '12.5'
      ANRLOC: 12 g/dL
      PARAMCD: HGB
expected_errors: []
