name: CDISC-AD0670
kind: rule
description: |
  Wave D8 port - T3-VMC Variable Metadata Check. BDS/ADLB: ACYCLEC exists and
  ACYCLE not_exists. Baselined on Python lane under Finding #9 (VMC dataset
  projection divergence).
python_notes: |
  Known divergence (Finding #9): Python swaps the dataset for a
  VariablesMetadataDatasetBuilder projection before evaluating the Check,
  so `exists(ACYCLEC)` / `not_exists(ACYCLE)` resolve against meta-field
  columns and yield 0 violations. Java evaluates the leaves against the
  original column metadata and fires correctly.
python_source: rules-adamig-1-3.json (CDISC-AD0670)
rule:
  coreId: CDISC-AD0670
