name: CDISC-AD0019-absent
kind: rule
description: |
  R-4.11 migration proof (silencing-guard backlog, ADaM flag family): with the presence
  gate moved to Requirements.Variables.All, a dataset WITHOUT the flag yields ZERO findings
  on both engines. Pins the user-facing contract that the Check-level exists guard is no
  longer needed.

  The two lanes reach their verdict by DIFFERENT mechanisms. Java gates the rule out up
  front — Requirements.Variables.All names COMPLFL and the fixture has no such column, so
  Java reports SKIPPED. Python has no Requirements.Variables gate at all: it reaches the Check
  and reads an absent column there.

  That difference used to be invisible. Until EC-38 / Fix #128 the Python side aborted on
  the absent column (KeyError → COLUMN_NOT_FOUND_IN_DATA → SKIPPED), so both lanes
  happened to emit the same token and no baseline entry was needed — as measured
  2026-07-30 under PLAN-parity-expected-status P1. EC-38 makes the fork fold an absent
  Check column to no-value and EXECUTE to zero findings (coreJ's contract), which removes
  the coincidence: Java still SKIPPED, Python now EXECUTED. Violations still agree, so the
  divergence is status-only and carries a `lane: python`, `channels: ["status"]` entry
  whose fix_ref names the Requirements.Variables gap — NOT EC-38, which only exposed it.
python_source: rules-adamig-1-3.json (CDISC-AD0019)
rule:
  coreId: CDISC-AD0019
datasets:
  ADSL:
    row_key: [STUDYID, USUBJID]
    rows:
      - {STUDYID: S1, USUBJID: '001', AGE: 34}
      - {STUDYID: S1, USUBJID: '002', AGE: 41}
config:
  standard: adamig
  standard_version: '1.3'
library_mocks:
  classes:
    subject level analysis dataset: [ADSL]
# Java gates the rule out: Requirements.Variables.All COMPLFL is absent from the fixture
expected_status: SKIPPED
expected_violations: []
expected_errors: []
