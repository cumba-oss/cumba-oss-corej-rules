name: CDISC-AD0367
kind: rule
description: |
  Wave C2 port — T2-MD (Match_Datasets without Operations).
  CDISC-AD0367: ADSL.ACTARM must equal DM.ACTARM for the matching subject (USUBJID).
  Class-scoped rule (SUBJECT LEVEL ANALYSIS DATASET). Bare-leaf Check (no outer
  all/any wrapper) — Finding #26 quirk on Python's business_rules lane.
python_source: rules-adamig-1-3.json (CDISC-AD0367)
rule:
  coreId: CDISC-AD0367
datasets:
  ADSL:
    row_key: [STUDYID, USUBJID]
    rows:
      - {STUDYID: S1, USUBJID: '001', ACTARM: 'Treatment A'}  # ok — matches DM.ACTARM
      - {STUDYID: S1, USUBJID: '002', ACTARM: 'Treatment X'}  # bad — DM.ACTARM is Placebo
  DM:
    row_key: [STUDYID, USUBJID]
    rows:
      - {STUDYID: S1, DOMAIN: DM, USUBJID: '001', ACTARM: 'Treatment A'}
      - {STUDYID: S1, DOMAIN: DM, USUBJID: '002', ACTARM: 'Placebo'}
config:
  standard: adamig
  standard_version: '1.3'
library_mocks:
  classes:
    subject level analysis dataset: [ADSL]
    special-purpose: [DM]
expected_violations:
  - rule_id: CDISC-AD0367
    dataset: ADSL
    row_key: {STUDYID: S1, USUBJID: '002'}
    status: SUCCESS
    output_variables:
      ACTARM: 'Treatment X'
      DM.ACTARM: 'Placebo'
expected_errors: []
