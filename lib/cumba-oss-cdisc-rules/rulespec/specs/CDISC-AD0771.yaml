name: CDISC-AD0771
kind: rule
description: |
  Wave B5 port — T1b PlainIntermediate.
  CDISC-AD0771: more than one value of ASEV for a given value of ASEVN.
  Bare-leaf Check scoped to OCCURRENCE DATA STRUCTURE (primary: ADAE).
  Uses has_multiple_values_for — Python gap (operator + bare-leaf), so
  this spec baselines on the Python lane; expected matches Java's output.
python_source: rules-adamig-1-3.json (CDISC-AD0771)
rule:
  coreId: CDISC-AD0771
datasets:
  ADAE:
    row_key: [STUDYID, USUBJID, AESEQ]
    column_types:
      AESEQ: LONG
    rows:
      # ASEVN=1 mapped to two distinct ASEV (MILD, MODERATE) -> both rows fire
      - {STUDYID: S1, USUBJID: '001', AESEQ: 1, ASEV: 'MILD',     ASEVN: '1'}
      - {STUDYID: S1, USUBJID: '002', AESEQ: 1, ASEV: 'MODERATE', ASEVN: '1'}
      # ASEVN=2 single-valued -> ok
      - {STUDYID: S1, USUBJID: '003', AESEQ: 1, ASEV: 'SEVERE',   ASEVN: '2'}
config:
  standard: adamig
  standard_version: '1.3'
library_mocks:
  classes:
    occurrence data structure: [ADAE]
expected_violations:
  - rule_id: CDISC-AD0771
    dataset: ADAE
    row_key: {STUDYID: S1, USUBJID: '001', AESEQ: 1}
    status: SUCCESS
    output_variables:
      ASEV: 'MILD'
      ASEVN: '1'
  - rule_id: CDISC-AD0771
    dataset: ADAE
    row_key: {STUDYID: S1, USUBJID: '002', AESEQ: 1}
    status: SUCCESS
    output_variables:
      ASEV: 'MODERATE'
      ASEVN: '1'
expected_errors: []
