    rows:
      - {STUDYID: S1, USUBJID: '001', PARAMCD: 'HGB', AVISITN: 1, STUDYIDN: '1'}
      - {STUDYID: S2, USUBJID: '002', PARAMCD: 'HGB', AVISITN: 1, STUDYIDN: '1'}
      - {STUDYID: S3, USUBJID: '003', PARAMCD: 'HGB', AVISITN: 1, STUDYIDN: '2'}
config:
  standard: adamig
  standard_version: '1.3'
library_mocks:
