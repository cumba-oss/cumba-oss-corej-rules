name: CDISC-AD0698
kind: rule
description: |
  CDISC-AD0698: Medical Device BDS — when BASETYPE is not present, BASE
  must equal AVAL at the baseline record (ABLFL='Y') for each
  (USUBJID, PARAMCD, SPDEVID) group.
  Pins the filter-honouring `max` Operation (filter ABLFL='Y') with a
  three-group design: (a) discriminating group 001/D1 has a
  post-baseline AVAL strictly greater than the baseline AVAL and BASE
  equal to the baseline AVAL, so a filter-ignoring max would false-fire
  there; (b) subject 002 carries the same PARAMCD on two devices — D1
  clean, D2 violating — proving SPDEVID participates in the grouping;
  (c) groups with no ABLFL='Y' row yield a missing $-value: not_equal_to
  fires on populated-BASE rows (subject 003) and the non_empty guard
  keeps empty-BASE rows quiet (subject 004).
python_source: rules-adamig-1-3.json (CDISC-AD0698)
rule:
  coreId: CDISC-AD0698
datasets:
  ADLB:
    row_key: [STUDYID, USUBJID, SPDEVID, PARAMCD, AVISITN]
    column_types:
      AVISITN: LONG
    rows:
      # 001/D1/HGB — discriminating: post-baseline AVAL 17.0 > baseline 13.5, BASE = baseline AVAL → ok
      - {STUDYID: S1, USUBJID: '001', SPDEVID: D1, PARAMCD: HGB, AVISITN: 0, ABLFL: Y, AVAL: '13.5', BASE: '13.5'}
      - {STUDYID: S1, USUBJID: '001', SPDEVID: D1, PARAMCD: HGB, AVISITN: 1, ABLFL: '', AVAL: '17.0', BASE: '13.5'}
      # 002/HGB on two devices — D1 clean ...
      - {STUDYID: S1, USUBJID: '002', SPDEVID: D1, PARAMCD: HGB, AVISITN: 0, ABLFL: Y, AVAL: '14.0', BASE: '14.0'}
      - {STUDYID: S1, USUBJID: '002', SPDEVID: D1, PARAMCD: HGB, AVISITN: 1, ABLFL: '', AVAL: '12.0', BASE: '14.0'}
      # ... D2 violating: BASE 12.0 != baseline AVAL 15.0 → bad (SPDEVID is in the group key)
      - {STUDYID: S1, USUBJID: '002', SPDEVID: D2, PARAMCD: HGB, AVISITN: 0, ABLFL: Y, AVAL: '15.0', BASE: '15.0'}
      - {STUDYID: S1, USUBJID: '002', SPDEVID: D2, PARAMCD: HGB, AVISITN: 1, ABLFL: '', AVAL: '13.0', BASE: '12.0'}   # bad
      # 003/D1/HGB — no ABLFL='Y' row, BASE populated → missing $-value, not_equal_to fires
      - {STUDYID: S1, USUBJID: '003', SPDEVID: D1, PARAMCD: HGB, AVISITN: 1, ABLFL: '', AVAL: '11.0', BASE: '11.0'}   # bad
      # 004/D1/HGB — no ABLFL='Y' row, BASE empty → blocked by the non_empty guard → ok
      - {STUDYID: S1, USUBJID: '004', SPDEVID: D1, PARAMCD: HGB, AVISITN: 1, ABLFL: '', AVAL: '10.0', BASE: ''}
config:
  standard: adamig
  standard_version: '1.3'
library_mocks:
  classes:
    medical device basic data structure: [ADLB]
expected_violations:
  - rule_id: CDISC-AD0698
    dataset: ADLB
    row_key: {AVISITN: 1, PARAMCD: HGB, SPDEVID: D1, STUDYID: S1, USUBJID: '003'}
    status: SUCCESS
    output_variables:
      $baseline_aval:
      ABLFL:
      AVAL: '11.0'
      BASE: '11.0'
      PARAMCD: HGB
      SPDEVID: D1
  - rule_id: CDISC-AD0698
    dataset: ADLB
    row_key: {AVISITN: 1, PARAMCD: HGB, SPDEVID: D2, STUDYID: S1, USUBJID: '002'}
    status: SUCCESS
    output_variables:
      $baseline_aval: '15.0'
      ABLFL:
      AVAL: '13.0'
      BASE: '12.0'
      PARAMCD: HGB
      SPDEVID: D2
expected_errors: []
