name: CDISC-AD0620
kind: rule
description: |
  Wave D6 port - T3-VMC Variable Metadata Check (bare-leaf `not_exists`).
  OCCURRENCE DATA STRUCTURE: fires when AETERM is absent. Baselined on
  Python lane under Finding #9 (VMC dataset projection divergence).
python_notes: |
  Known divergence (Finding #9): Python swaps the dataset for a
  VariablesMetadataDatasetBuilder projection, so `not_exists(AETERM)`
  resolves against meta-field columns and yields 0 violations. Java fires
  correctly; expected matches Java's dataset-level violation. Bare-leaf
  Check may also hit the Python business_rules `KeyError: 'name'` quirk
  documented in plan §0b.4.
python_source: rules-adamig-1-3.json (CDISC-AD0620)
rule:
  coreId: CDISC-AD0620
datasets:
  ADAE:
