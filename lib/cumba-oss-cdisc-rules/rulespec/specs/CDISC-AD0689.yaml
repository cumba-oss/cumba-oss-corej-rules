name: CDISC-AD0689
kind: rule
description: |
  Wave D8 port - T3-VMC Variable Metadata Check. Scoped to MEDICAL DEVICE
  OCCURRENCE DATA STRUCTURE and MEDICAL DEVICE BASIC DATA STRUCTURE:
  SPDEVID not_exists. Baselined on Python lane under Finding #9 (VMC dataset
  projection divergence).
python_notes: |
  Known divergence (Finding #9): Python swaps the dataset for a
  VariablesMetadataDatasetBuilder projection, so `not_exists(SPDEVID)`
  resolves against meta-field columns and yields 0 violations. Java
  fires correctly; expected matches Java's dataset-level violation.
python_source: rules-adamig-1-3.json (CDISC-AD0689)
rule:
