name: CDISC-AD0657
kind: rule
description: |
  Wave D8 port - T3-VMC Variable Metadata Check. BDS/ADNCA: AVISIT not_exists.
  Baselined on Python lane under Finding #9 (VMC dataset projection divergence).
python_notes: |
