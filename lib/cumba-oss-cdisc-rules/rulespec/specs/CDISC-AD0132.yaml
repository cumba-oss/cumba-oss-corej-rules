name: CDISC-AD0132
kind: rule
description: |
  Wave C4 port — T2-CalcOps (baseline Python lane).
  CDISC-AD0132: R2BASE must equal AVAL / BASE on BDS / MDBDS.
  Check uses `not_equal_to_divide`. Java's OperatorRegistry implements
  NOT_EQUAL_TO_DIVIDE; Python's DataframeType does not implement
  `not_equal_to_divide` and raises AssertionError.
  Java fires on the row where R2BASE ≠ AVAL/BASE; Python errors.
python_source: rules-adamig-1-3.json (CDISC-AD0132)
rule:
  coreId: CDISC-AD0132
datasets:
  ADLB:
    row_key: [STUDYID, USUBJID, PARAMCD, AVISITN]
    column_types:
      AVISITN: LONG
      AVAL: DOUBLE
      BASE: DOUBLE
      R2BASE: DOUBLE
    rows:
      # ok — R2BASE=2.0 matches AVAL/BASE=10/5
      - {STUDYID: S1, USUBJID: '001', PARAMCD: 'HGB', AVISITN: 1, AVAL: 10.0, BASE: 5.0, R2BASE: 2.0}
      # bad — R2BASE=3.0 but AVAL/BASE=10/5=2.0
      - {STUDYID: S1, USUBJID: '002', PARAMCD: 'HGB', AVISITN: 1, AVAL: 10.0, BASE: 5.0, R2BASE: 3.0}
config:
  standard: adamig
  standard_version: '1.3'
library_mocks:
  classes:
    basic data structure: [ADLB]
expected_violations:
  - rule_id: CDISC-AD0132
    dataset: ADLB
    row_key: {STUDYID: S1, USUBJID: '002', PARAMCD: 'HGB', AVISITN: 1}
    status: SUCCESS
    output_variables:
      R2BASE: '3'
      PARAMCD: 'HGB'
      BASE: '5'
      AVAL: '10'
expected_errors: []
