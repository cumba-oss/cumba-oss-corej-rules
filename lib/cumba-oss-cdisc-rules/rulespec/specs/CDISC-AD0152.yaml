name: CDISC-AD0152
kind: rule
description: |
  Filter-on-max parity pin. CDISC-AD0152: when BASETYPE is present and
  BASE is populated, BASE must equal AVAL at the baseline record
  (ABLFL='Y') for each (USUBJID, PARAMCD, BASETYPE) group. Operation
  `max` on AVAL with filter ABLFL='Y'.

  Group design:
  - 001/HGB (discriminating): post-baseline AVAL 15.0 is strictly
    greater than the baseline AVAL 13.5; BASE=13.5 everywhere. A
    filter-ignoring engine computes $max=15.0 and false-fires; the
    fixed engine honours the filter ($=13.5) and stays quiet.
  - 002/HGB (violation): BASE=12.0 on the post-baseline row differs
    from the baseline AVAL 14.0 -> one violation on that row.
  - 003/HGB (no baseline): no ABLFL='Y' row, so the group's $-value is
    missing. Both engines treat populated-vs-missing as not-equal
    (Java ScalarSemantics ""-fold == Python truth table), so the row
    with populated BASE fires; the row with empty BASE is blocked by
    the non_empty guard and stays quiet.

  String-typed AVAL/BASE avoid numeric-to-string divergence in
  `output_variables` (Java emits strings, Python emits native numeric).
python_source: rules-adamig-1-3.json (CDISC-AD0152)
rule:
  coreId: CDISC-AD0152
datasets:
  ADLB:
    row_key: [STUDYID, USUBJID, PARAMCD, AVISITN]
    column_types:
      AVISITN: LONG
    rows:
      # 001/HGB — discriminating: post AVAL > baseline AVAL, BASE correct.
      - {STUDYID: S1, USUBJID: '001', PARAMCD: HGB, AVISITN: 0, BASETYPE: LAST, ABLFL: Y, AVAL: '13.5', BASE: '13.5'}
      - {STUDYID: S1, USUBJID: '001', PARAMCD: HGB, AVISITN: 1, BASETYPE: LAST, ABLFL: '', AVAL: '15.0', BASE: '13.5'}
      # 002/HGB — violation: BASE=12.0 on the post-baseline row ≠ baseline AVAL 14.0.
      - {STUDYID: S1, USUBJID: '002', PARAMCD: HGB, AVISITN: 0, BASETYPE: LAST, ABLFL: Y, AVAL: '14.0', BASE: '14.0'}
      - {STUDYID: S1, USUBJID: '002', PARAMCD: HGB, AVISITN: 1, BASETYPE: LAST, ABLFL: '', AVAL: '13.0', BASE: '12.0'}   # bad
      # 003/HGB — no ABLFL='Y' row; populated BASE vs missing $-value → fires.
      - {STUDYID: S1, USUBJID: '003', PARAMCD: HGB, AVISITN: 1, BASETYPE: LAST, ABLFL: '', AVAL: '11.0', BASE: '11.0'}   # bad (no baseline)
      # 003/HGB — empty BASE blocked by the non_empty guard → quiet.
      - {STUDYID: S1, USUBJID: '003', PARAMCD: HGB, AVISITN: 2, BASETYPE: LAST, ABLFL: '', AVAL: '10.0', BASE: ''}
config:
  standard: adamig
  standard_version: '1.3'
library_mocks:
  classes:
    basic data structure: [ADLB]
expected_violations:
  - rule_id: CDISC-AD0152
    dataset: ADLB
    row_key: {AVISITN: 1, PARAMCD: HGB, STUDYID: S1, USUBJID: '002'}
    status: SUCCESS
    output_variables:
      $baseline_aval: '14.0'
      ABLFL:
      AVAL: '13.0'
      BASE: '12.0'
      BASETYPE: LAST
      PARAMCD: HGB
  - rule_id: CDISC-AD0152
    dataset: ADLB
    row_key: {AVISITN: 1, PARAMCD: HGB, STUDYID: S1, USUBJID: '003'}
    status: SUCCESS
    output_variables:
      $baseline_aval:
      ABLFL:
      AVAL: '11.0'
      BASE: '11.0'
      BASETYPE: LAST
      PARAMCD: HGB
expected_errors: []
