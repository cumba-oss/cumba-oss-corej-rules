name: CDISC-AD0739
kind: rule
description: |
  Wave B4 port — T1b PlainIntermediate.
  CDISC-AD0739: more than one PARAMCD for a given PARAM.
  Record-data rule scoped to BASIC DATA STRUCTURE / MEDICAL DEVICE BDS.
  Bare-leaf Check + has_multiple_values_for — Python gaps (Finding #26 + #28).
  Baselines on Python lane; expected matches Java.
python_source: rules-adamig-1-3.json (CDISC-AD0739)
rule:
  coreId: CDISC-AD0739
datasets:
  ADLB:
    row_key: [STUDYID, USUBJID, PARAMCD, PARAM]
    rows:
      # PARAM='Hemoglobin' maps to two PARAMCD ('HGB' and 'HEMO') -> violation
      - {STUDYID: S1, USUBJID: '001', PARAMCD: 'HGB',  PARAM: 'Hemoglobin'}
      - {STUDYID: S1, USUBJID: '002', PARAMCD: 'HEMO', PARAM: 'Hemoglobin'}
      - {STUDYID: S1, USUBJID: '003', PARAMCD: 'GLUC', PARAM: 'Glucose'}
      - {STUDYID: S1, USUBJID: '004', PARAMCD: 'GLUC', PARAM: 'Glucose'}
config:
  standard: adamig
  standard_version: '1.3'
library_mocks:
  classes:
    basic data structure: [ADLB]
expected_violations:
  - rule_id: CDISC-AD0739
    dataset: ADLB
    row_key: {STUDYID: S1, USUBJID: '001', PARAMCD: 'HGB', PARAM: 'Hemoglobin'}
    status: SUCCESS
    output_variables:
      PARAM: 'Hemoglobin'
      PARAMCD: 'HGB'
  - rule_id: CDISC-AD0739
    dataset: ADLB
    row_key: {STUDYID: S1, USUBJID: '002', PARAMCD: 'HEMO', PARAM: 'Hemoglobin'}
    status: SUCCESS
    output_variables:
      PARAM: 'Hemoglobin'
      PARAMCD: 'HEMO'
expected_errors: []
