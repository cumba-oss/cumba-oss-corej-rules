name: CDISC-AD0806
kind: rule
description: |
  Wave A9 port — T1a PlainSimple.
  CDISC-AD0806: SUBJTYPC is populated and SUBJTYP is not populated.
  Record-data rule scoped to BASIC DATA STRUCTURE; non_empty + empty pair.
python_source: rules-adamig-1-3.json (CDISC-AD0806)
rule:
  coreId: CDISC-AD0806
datasets:
  ADLB:
    row_key: [STUDYID, USUBJID, PARAMCD]
    rows:
      - {STUDYID: S1, USUBJID: '001', PARAMCD: 'HGB', SUBJTYP: '', SUBJTYPC: ''}      # ok
      - {STUDYID: S1, USUBJID: '002', PARAMCD: 'HGB', SUBJTYP: '', SUBJTYPC: 'X'}     # bad
config:
  standard: adamig
  standard_version: '1.3'
library_mocks:
  classes:
    basic data structure: [ADLB]
expected_violations:
  - rule_id: CDISC-AD0806
    dataset: ADLB
    row_key: {PARAMCD: HGB, STUDYID: S1, USUBJID: '002'}
    status: SUCCESS
    output_variables:
      SUBJTYP: null
      SUBJTYPC: 'X'
expected_errors: []
