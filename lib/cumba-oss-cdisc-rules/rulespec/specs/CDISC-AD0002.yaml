name: CDISC-AD0002
kind: rule
description: |
  Wave D1 port - T3-VMC (Variable Metadata Check). Baselined on Python
  lane under Finding #9 (VMC dataset projection divergence).
python_notes: |
  Known divergence (Finding #9): Python swaps the dataset for a
  VariablesMetadataDatasetBuilder projection, so column-name
  `exists`/`not_exists` leaves resolve against meta-field columns
  (variable_name, variable_label, ...) rather than the original
  dataset columns and yield 0 violations. Java fires correctly on the
  column metadata; expected matches Java.
