name: CDISC-AD0726
kind: rule
description: |
  Wave B4 port — T1b PlainIntermediate.
  CDISC-AD0726: more than one APERIOD for a given APERIODC.
  Record-data rule scoped to ALL classes; fixture attaches ADLB to BDS class mock.
  Bare-leaf Check + has_multiple_values_for — Python gaps (Finding #26 + #28).
  Baselines on Python lane; expected matches Java.
python_source: rules-adamig-1-3.json (CDISC-AD0726)
rule:
