      - {STUDYID: S1, USUBJID: '003', PARAMCD: 'HGB', APERIOD: 3, APERIODC: 'Period3'}
      - {STUDYID: S1, USUBJID: '004', PARAMCD: 'HGB', APERIOD: 3, APERIODC: 'Period3'}
config:
  standard: adamig
  standard_version: '1.3'
library_mocks:
