name: CDISC-AD0326
kind: rule
description: |
  Wave B1 port - T1b PlainIntermediate.
  CDISC-AD0326: Within a value of APERIOD, there is more than one value of ASPERC for a given value of ASPER.
  Inverse of CDISC-AD0325 - ASPER must uniquely determine ASPERC within each
  period. Bare-leaf Check at root - Python KeyError; baseline Python lane.
python_source: rules-adamig-1-3.json (CDISC-AD0326)
rule:
  coreId: CDISC-AD0326
datasets:
  ADLB:
    row_key: [STUDYID, USUBJID, PARAMCD, APERIOD, ASPER, ASPERC]
    column_types:
      APERIOD: LONG
      ASPER: LONG
    rows:
      # APERIOD=1, ASPER=1 maps to two distinct ASPERC ('S1' vs 'S2') -> violation
      - {STUDYID: S1, USUBJID: '001', PARAMCD: HGB, APERIOD: 1, ASPER: 1, ASPERC: S1}
      - {STUDYID: S1, USUBJID: '002', PARAMCD: HGB, APERIOD: 1, ASPER: 1, ASPERC: S2}
      # APERIOD=1, ASPER=2 consistent
      - {STUDYID: S1, USUBJID: '003', PARAMCD: HGB, APERIOD: 1, ASPER: 2, ASPERC: S3}
config:
  standard: adamig
  standard_version: '1.3'
library_mocks:
  classes:
    basic data structure: [ADLB]
expected_violations:
  - rule_id: CDISC-AD0326
    dataset: ADLB
    row_key: {APERIOD: 1, ASPER: 1, ASPERC: S1, PARAMCD: HGB, STUDYID: S1, USUBJID: '001'}
    status: SUCCESS
    output_variables:
      APERIOD: '1'
      ASPER: '1'
      ASPERC: S1
  - rule_id: CDISC-AD0326
    dataset: ADLB
    row_key: {APERIOD: 1, ASPER: 1, ASPERC: S2, PARAMCD: HGB, STUDYID: S1, USUBJID: '002'}
    status: SUCCESS
    output_variables:
      APERIOD: '1'
      ASPER: '1'
      ASPERC: S2
expected_errors: []
