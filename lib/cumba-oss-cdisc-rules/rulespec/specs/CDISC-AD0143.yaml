name: CDISC-AD0143
kind: rule
description: |
  A2 port — T1a PlainSimple. BDS: PARAMCD length > 8. Bare-leaf Check → Python
  engine raises KeyError: 'name' (Finding #9 territory; §0b bullet 4).
  Expected: Java fires; Python baselined on Python lane.
python_source: rules-adamig-1-3.json (CDISC-AD0143)
rule:
  coreId: CDISC-AD0143
datasets:
  ADLB:
    row_key: [STUDYID, USUBJID, PARAMCD, AVISITN]
    column_types:
      AVISITN: LONG
    rows:
      - {STUDYID: S1, USUBJID: '001', PARAMCD: 'HGB', AVISITN: 1}           # ok (length 3)
      - {STUDYID: S1, USUBJID: '002', PARAMCD: 'ABCDEFGHI', AVISITN: 1}     # bad (length 9)
config:
  standard: adamig
  standard_version: '1.3'
library_mocks:
  classes:
    basic data structure: [ADLB]
expected_violations:
  - rule_id: CDISC-AD0143
    dataset: ADLB
    row_key: {STUDYID: S1, USUBJID: '002', PARAMCD: 'ABCDEFGHI', AVISITN: 1}
    status: SUCCESS
    output_variables:
      PARAMCD: 'ABCDEFGHI'
expected_errors: []
