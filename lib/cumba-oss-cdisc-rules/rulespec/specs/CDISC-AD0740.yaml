name: CDISC-AD0740
kind: rule
description: |
  Wave B4 port — T1b PlainIntermediate.
  CDISC-AD0740: more than one PARAM for a given PARAMN.
  Record-data rule scoped to BASIC DATA STRUCTURE / MEDICAL DEVICE BDS.
  Bare-leaf Check + has_multiple_values_for — Python gaps (Finding #26 + #28).
  Baselines on Python lane; expected matches Java.
python_source: rules-adamig-1-3.json (CDISC-AD0740)
rule:
  coreId: CDISC-AD0740
datasets:
  ADLB:
    row_key: [STUDYID, USUBJID, PARAMCD, PARAM]
    column_types:
      PARAMN: LONG
    rows:
      # PARAMN=1 maps to two PARAM ('Hemoglobin' and 'Haemoglobin') -> violation
      - {STUDYID: S1, USUBJID: '001', PARAMCD: 'HGB',  PARAM: 'Hemoglobin',  PARAMN: 1}
      - {STUDYID: S1, USUBJID: '002', PARAMCD: 'HGB2', PARAM: 'Haemoglobin', PARAMN: 1}
      - {STUDYID: S1, USUBJID: '003', PARAMCD: 'GLUC', PARAM: 'Glucose', PARAMN: 2}
      - {STUDYID: S1, USUBJID: '004', PARAMCD: 'GLUC', PARAM: 'Glucose', PARAMN: 2}
config:
  standard: adamig
  standard_version: '1.3'
library_mocks:
  classes:
    basic data structure: [ADLB]
expected_violations:
  - rule_id: CDISC-AD0740
    dataset: ADLB
    row_key: {STUDYID: S1, USUBJID: '001', PARAMCD: 'HGB', PARAM: 'Hemoglobin'}
    status: SUCCESS
    output_variables:
      PARAM: 'Hemoglobin'
      PARAMN: '1'
  - rule_id: CDISC-AD0740
    dataset: ADLB
    row_key: {STUDYID: S1, USUBJID: '002', PARAMCD: 'HGB2', PARAM: 'Haemoglobin'}
    status: SUCCESS
    output_variables:
      PARAM: 'Haemoglobin'
      PARAMN: '1'
expected_errors: []
