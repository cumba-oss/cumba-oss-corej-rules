name: CDISC-AD0457
kind: rule
description: |
  Wave A6 port — T1a PlainSimple.
  CDISC-AD0457: On a given record, TRTAN is populated and TRTA is not populated.
  Record-data rule scoped to BASIC DATA STRUCTURE, MEDICAL DEVICE BASIC DATA STRUCTURE, OCCURRENCE DATA STRUCTURE, MEDICAL DEVICE OCCURRENCE DATA STRUCTURE; non_empty + empty pair; literal column names per star-as-literal convention.
python_source: rules-adamig-1-3.json (CDISC-AD0457)
rule:
  coreId: CDISC-AD0457
datasets:
  ADLB:
    row_key: [STUDYID, USUBJID, PARAMCD]
    rows:
      - {STUDYID: S1, USUBJID: '001', PARAMCD: 'HGB', TRTAN: '', TRTA: ''}      # ok
      - {STUDYID: S1, USUBJID: '002', PARAMCD: 'HGB', TRTAN: 'X', TRTA: ''}      # bad
config:
  standard: adamig
  standard_version: '1.3'
library_mocks:
  classes:
    basic data structure: [ADLB]
expected_violations:
  - rule_id: CDISC-AD0457
    dataset: ADLB
    row_key: {PARAMCD: HGB, STUDYID: S1, USUBJID: '002'}
    status: SUCCESS
    output_variables:
      TRTA: null
      TRTAN: 'X'
expected_errors: []
