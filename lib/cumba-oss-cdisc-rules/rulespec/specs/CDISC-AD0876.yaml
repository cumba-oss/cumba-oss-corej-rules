name: CDISC-AD0876
kind: rule
description: |
  Wave A11 port - T1a PlainSimple.
  CDISC-AD0876: COUNTRYN is populated and COUNTRY is not populated.
  Record-data rule scoped to BASIC DATA STRUCTURE; non_empty + empty pair.
python_source: rules-adamig-1-3.json (CDISC-AD0876)
rule:
  coreId: CDISC-AD0876
datasets:
  ADLB:
    row_key: [STUDYID, USUBJID, PARAMCD]
    rows:
      - {STUDYID: S1, USUBJID: '001', PARAMCD: 'HGB', COUNTRYN: '', COUNTRY: ''}      # ok
      - {STUDYID: S1, USUBJID: '002', PARAMCD: 'HGB', COUNTRYN: '840', COUNTRY: ''}   # bad
config:
  standard: adamig
  standard_version: '1.3'
library_mocks:
  classes:
    basic data structure: [ADLB]
expected_violations:
  - rule_id: CDISC-AD0876
    dataset: ADLB
    row_key: {PARAMCD: HGB, STUDYID: S1, USUBJID: '002'}
    status: SUCCESS
    output_variables:
      COUNTRY: null
      COUNTRYN: '840'
expected_errors: []
