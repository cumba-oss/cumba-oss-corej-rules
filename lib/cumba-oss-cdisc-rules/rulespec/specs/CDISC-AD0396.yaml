name: CDISC-AD0396
kind: rule
description: |
  Wave B2 port — T1b PlainIntermediate.
  CDISC-AD0396: Within a parameter, there is more than one value of ATOXGRLN for a given value of ATOXGRL.
  Bare-leaf Check (`has_multiple_values_for` with `within: PARAMCD`) scoped to BASIC DATA STRUCTURE.
  Two rows share the same ATOXGRL value but distinct ATOXGRLN; both fire. A third row is unique and does not fire.
  Bare-leaf Check raises `KeyError: 'name'` on Python's business_rules library (Finding #26); Python lane baseline expected.
python_source: rules-adamig-1-3.json (CDISC-AD0396)
rule:
  coreId: CDISC-AD0396
datasets:
  ADLB:
    row_key: [STUDYID, USUBJID, PARAMCD, AVISITN]
    column_types:
      AVISITN: LONG
    rows:
      - {STUDYID: S1, USUBJID: '001', PARAMCD: 'HGB', AVISITN: 1, ATOXGRLN: 'X', ATOXGRL: 'A'}   # bad
      - {STUDYID: S1, USUBJID: '002', PARAMCD: 'HGB', AVISITN: 1, ATOXGRLN: 'Y', ATOXGRL: 'A'}   # bad (distinct ATOXGRLN for same ATOXGRL within PARAMCD)
      - {STUDYID: S1, USUBJID: '003', PARAMCD: 'HGB', AVISITN: 1, ATOXGRLN: 'Z', ATOXGRL: 'B'}   # ok (unique ATOXGRL)
config:
  standard: adamig
  standard_version: '1.3'
library_mocks:
  classes:
    basic data structure: [ADLB]
expected_violations:
  - rule_id: CDISC-AD0396
    dataset: ADLB
    row_key: {STUDYID: S1, USUBJID: '001', PARAMCD: 'HGB', AVISITN: 1}
    status: SUCCESS
    output_variables:
      PARAMCD: 'HGB'
      ATOXGRLN: 'X'
      ATOXGRL: 'A'
  - rule_id: CDISC-AD0396
    dataset: ADLB
    row_key: {STUDYID: S1, USUBJID: '002', PARAMCD: 'HGB', AVISITN: 1}
    status: SUCCESS
    output_variables:
      PARAMCD: 'HGB'
      ATOXGRLN: 'Y'
      ATOXGRL: 'A'
expected_errors: []
