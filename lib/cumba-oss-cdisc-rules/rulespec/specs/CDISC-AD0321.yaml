name: CDISC-AD0321
kind: rule
description: |
  Wave C3 port — T3-DatasetMetaCheck (Sensitivity=Dataset, Scope=SLAD).
  CDISC-AD0321: fire when a SLAD-class dataset is not named "ADSL".
  Check is a bare leaf
  `{name: dataset_name, operator: not_equal_to, value: "ADSL", value_is_literal: true}`.

  Rule-body quirk: bare-leaf Check → Python Finding #26. With the SLAD
  dataset correctly named ADSL, the Check returns false and neither
  engine fires → both lanes agree on 0 violations. Both-green baseline.
python_source: rules-adamig-1-3.json (CDISC-AD0321)
rule:
  coreId: CDISC-AD0321
datasets:
  ADSL:
    row_key: [STUDYID, USUBJID]
    rows:
      - {STUDYID: S1, USUBJID: '001'}
config:
  standard: adamig
  standard_version: '1.3'
library_mocks:
  classes:
    subject level analysis dataset: [ADSL]
expected_violations: []
expected_errors: []
