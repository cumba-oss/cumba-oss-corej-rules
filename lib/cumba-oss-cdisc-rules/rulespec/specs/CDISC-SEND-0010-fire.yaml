name: CDISC-SEND-0010-fire
kind: rule
description: |
  CDISC-SEND-0010 (T10 curated timing set): a timing variable must not be added to a
  SUPP-- or RELREC dataset. The SUPPAE dataset below carries VISITNUM, a timing variable,
  so the rule fires (variable_name = VISITNUM).
python_source: rules-sendig-3-1-1.json (CDISC-SEND-0010)
rule:
  coreId: CDISC-SEND-0010
datasets:
  SUPPAE:
    row_key: [STUDYID, USUBJID, IDVAR, IDVARVAL, QNAM]
    rows:
      - {STUDYID: S1, RDOMAIN: AE, USUBJID: '001', IDVAR: AESEQ, IDVARVAL: '1', QNAM: AEFOO, QLABEL: Foo, QVAL: X, VISITNUM: 1}
config:
  standard: sendig
  standard_version: 3.1.1
expected_violations:
  - rule_id: CDISC-SEND-0010
    dataset: SUPPAE
    row_key: {IDVAR: null, IDVARVAL: null, QNAM: null, STUDYID: null, USUBJID: null}
    status: SUCCESS
    output_variables:
      variable_name: VISITNUM
expected_errors: []
