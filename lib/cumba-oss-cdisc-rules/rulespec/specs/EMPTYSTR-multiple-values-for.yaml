name: EMPTYSTR-multiple-values-for
kind: check_operator
description: |
  Empty-string parity (EC-1, Category D.13). has_multiple_values_for EXCLUDES a
  row whose folded key OR folded dependent is empty. Here VSTESTCD is the KEY
  (the `value:` operand) and VSTEST the DEPENDENT (the `name:` operand):
  the populated key "K1" maps to two distinct dependents {D1,D2} → its two rows
  fire; the empty-key ("") rows are excluded and never fire, even though they
  would also map to {D1,D2}. Both engines now agree (Python gained the operator
  in submodule 387e1ea4), so this is a plain parity spec (no baseline entry).
python_notes: |
  Both lanes exclude empty key/dependent rows and flag the two populated-key
  rows. No divergence.
python_source: PLAN-rule-review-engine-changes.md §3 (EC-1)
check:
  name: VSTEST
  operator: has_multiple_values_for
  value: VSTESTCD
datasets:
  VS:
    row_key: [STUDYID, USUBJID, VSSEQ]
    rows:
    - {STUDYID: S1, USUBJID: '001', VSSEQ: 1, VSTESTCD: 'K1', VSTEST: 'D1'}    # K1 → {D1,D2} → fires
    - {STUDYID: S1, USUBJID: '001', VSSEQ: 2, VSTESTCD: 'K1', VSTEST: 'D2'}    # K1 multiple → fires
    - {STUDYID: S1, USUBJID: '002', VSSEQ: 1, VSTESTCD: '', VSTEST: 'D1'}      # ""-key → excluded (no fire)
    - {STUDYID: S1, USUBJID: '002', VSSEQ: 2, VSTESTCD: '', VSTEST: 'D2'}      # ""-key → excluded (no fire)
config:
  standard: sdtmig
  standard_version: '3.4'
expected_violations:
- rule_id: AUTO-EMPTYSTR-multiple-values-for
  dataset: VS
  row_key: {STUDYID: S1, USUBJID: '001', VSSEQ: 1}
  status: SUCCESS
  output_variables:
    STUDYID: S1
    USUBJID: '001'
    VSSEQ: '1'
    VSTEST: D1
    VSTESTCD: K1
- rule_id: AUTO-EMPTYSTR-multiple-values-for
  dataset: VS
  row_key: {STUDYID: S1, USUBJID: '001', VSSEQ: 2}
  status: SUCCESS
  output_variables:
    STUDYID: S1
    USUBJID: '001'
    VSSEQ: '2'
    VSTEST: D2
    VSTESTCD: K1
expected_errors: []
