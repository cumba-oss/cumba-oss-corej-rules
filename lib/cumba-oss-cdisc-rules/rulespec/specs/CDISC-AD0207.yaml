name: CDISC-AD0207
kind: rule
description: |
  Wave C2 port — T2-MD (Match_Datasets without Operations).
  CDISC-AD0207: ADSL.RACE must equal DM.RACE for the matching subject (USUBJID).
  Class-scoped rule (SUBJECT LEVEL ANALYSIS DATASET). Bare-leaf Check (no outer
  all/any wrapper) — Finding #26 quirk on Python's business_rules lane.
python_source: rules-adamig-1-3.json (CDISC-AD0207)
rule:
  coreId: CDISC-AD0207
datasets:
  ADSL:
    row_key: [STUDYID, USUBJID]
    rows:
      - {STUDYID: S1, USUBJID: '001', RACE: WHITE}           # ok — matches DM.RACE
      - {STUDYID: S1, USUBJID: '002', RACE: ASIAN}           # bad — DM.RACE is WHITE
  DM:
    row_key: [STUDYID, USUBJID]
    rows:
      - {STUDYID: S1, DOMAIN: DM, USUBJID: '001', RACE: WHITE}
      - {STUDYID: S1, DOMAIN: DM, USUBJID: '002', RACE: WHITE}
config:
  standard: adamig
  standard_version: '1.3'
library_mocks:
  classes:
    subject level analysis dataset: [ADSL]
    special-purpose: [DM]
expected_violations:
  - rule_id: CDISC-AD0207
    dataset: ADSL
    row_key: {STUDYID: S1, USUBJID: '002'}
    status: SUCCESS
    output_variables:
      RACE: ASIAN
      DM.RACE: WHITE
expected_errors: []
