name: CDISC-AD0489
kind: rule
description: |
  Wave A7 port — T1a PlainSimple.
  CDISC-AD0489: On a given record, ONTRTFN is populated and ONTRTFL is not populated.
  Record-data rule scoped to BDS/OCCDS; non_empty + empty pair.
python_source: rules-adamig-1-3.json (CDISC-AD0489)
rule:
  coreId: CDISC-AD0489
datasets:
  ADLB:
    row_key: [STUDYID, USUBJID, PARAMCD]
    column_types:
      ONTRTFN: LONG
    rows:
      - {STUDYID: S1, USUBJID: '001', PARAMCD: 'HGB', ONTRTFN: null, ONTRTFL: ''}    # ok
      - {STUDYID: S1, USUBJID: '002', PARAMCD: 'HGB', ONTRTFN: 1,    ONTRTFL: ''}    # bad
config:
  standard: adamig
  standard_version: '1.3'
library_mocks:
  classes:
    basic data structure: [ADLB]
expected_violations:
  - rule_id: CDISC-AD0489
    dataset: ADLB
    row_key: {PARAMCD: HGB, STUDYID: S1, USUBJID: '002'}
    status: SUCCESS
    output_variables:
      ONTRTFL: null
      ONTRTFN: '1'
expected_errors: []
