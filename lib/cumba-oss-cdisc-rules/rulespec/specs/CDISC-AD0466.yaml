name: CDISC-AD0466
kind: rule
description: |
  Wave A6 port — T1a PlainSimple.
  CDISC-AD0466: On a given record, STRATAR is populated and STRATARN is not populated.
  Record-data rule scoped to SUBJECT LEVEL ANALYSIS DATASET; non_empty + empty pair; literal column names per star-as-literal convention.
python_source: rules-adamig-1-3.json (CDISC-AD0466)
rule:
  coreId: CDISC-AD0466
datasets:
  ADSL:
    row_key: [STUDYID, USUBJID]
    rows:
      - {STUDYID: S1, USUBJID: '001', STRATAR: '', STRATARN: ''}      # ok
      - {STUDYID: S1, USUBJID: '002', STRATAR: 'X', STRATARN: ''}      # bad
config:
  standard: adamig
  standard_version: '1.3'
library_mocks:
  classes:
    subject level analysis dataset: [ADSL]
expected_violations:
  - rule_id: CDISC-AD0466
    dataset: ADSL
    row_key: {STUDYID: S1, USUBJID: '002'}
    status: SUCCESS
    output_variables:
      STRATAR: 'X'
      STRATARN: null
expected_errors: []
