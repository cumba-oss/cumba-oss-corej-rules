name: CDISC-AD0654
kind: rule
description: |
  Wave D8 port - T3-VMC Variable Metadata Check. OCCDS/ADAE: SRCSEQ exists.
  Baselined on Python lane under Finding #9 (VMC dataset projection divergence).
python_notes: |
  Known divergence (Finding #9): Python swaps the dataset for a
  VariablesMetadataDatasetBuilder projection, so `exists(SRCSEQ)` checks
  meta-field column names instead of the actual dataset columns and
  yields 0 violations. Java evaluates the leaf against the original
  column metadata and fires correctly. expected_violations matches Java;
  Python XFAILs on the asymmetric-lane baseline.
python_source: rules-adamig-1-3.json (CDISC-AD0654)
rule:
  coreId: CDISC-AD0654
datasets:
  ADAE:
    row_key: [STUDYID, USUBJID, AESEQ]
    column_types:
      AESEQ: LONG
      SRCSEQ: LONG
    rows:
      - {STUDYID: S1, USUBJID: '001', AESEQ: 1, SRCSEQ: 1, AETERM: HEADACHE, AEDECOD: Headache}
config:
  standard: adamig
  standard_version: '1.3'
library_mocks:
  classes:
    occurrence data structure: [ADAE]
expected_violations:
  - rule_id: CDISC-AD0654
    dataset: ADAE
    row_key: {STUDYID: S1, USUBJID: '001', AESEQ: 1}
    status: SUCCESS
    output_variables:
      SRCSEQ: '1'
expected_errors: []
