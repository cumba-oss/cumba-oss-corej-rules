name: CDISC-AD0894
kind: rule
description: |
  Wave B8 port - T1b PlainIntermediate (tail).
  CDISC-AD0894: more than one ACYCLE for a given ACYCLEC (ADNCA v1.0 dataset under BDS).
  Record-data rule scoped to BASIC DATA STRUCTURE.
  Bare-leaf Check (no all/any wrapper) + has_multiple_values_for - both Python
  gaps: business_rules KeyError: 'name' (Finding #26) and DataframeType lacks
  has_multiple_values_for (Finding #28). Baselines on Python lane; expected
  matches Java's per-row output.
python_source: rules-adamig-1-3.json (CDISC-AD0894)
rule:
  coreId: CDISC-AD0894
datasets:
  ADNCA:
    row_key: [STUDYID, USUBJID, PARAMCD]
    column_types:
      NFRLT: DOUBLE
      AFRLT: DOUBLE
    rows:
      - {STUDYID: S1, USUBJID: '001', PARAMCD: 'HGB', ACYCLE: '1', ACYCLEC: 'C1', NFRLT: 0.0, AFRLT: 0.0}
      - {STUDYID: S1, USUBJID: '002', PARAMCD: 'HGB', ACYCLE: '2', ACYCLEC: 'C1', NFRLT: 0.0, AFRLT: 0.0}
      - {STUDYID: S1, USUBJID: '003', PARAMCD: 'HGB', ACYCLE: '3', ACYCLEC: 'C3', NFRLT: 0.0, AFRLT: 0.0}
      - {STUDYID: S1, USUBJID: '004', PARAMCD: 'HGB', ACYCLE: '3', ACYCLEC: 'C3', NFRLT: 0.0, AFRLT: 0.0}
config:
  standard: adamig
  standard_version: '1.3'
library_mocks:
  classes:
    basic data structure: [ADNCA]
expected_violations:
  - rule_id: CDISC-AD0894
    dataset: ADNCA
    row_key: {STUDYID: S1, USUBJID: '001', PARAMCD: 'HGB'}
    status: SUCCESS
    output_variables:
      ACYCLE: '1'
      ACYCLEC: 'C1'
  - rule_id: CDISC-AD0894
    dataset: ADNCA
    row_key: {STUDYID: S1, USUBJID: '002', PARAMCD: 'HGB'}
    status: SUCCESS
    output_variables:
      ACYCLE: '2'
      ACYCLEC: 'C1'
expected_errors: []
