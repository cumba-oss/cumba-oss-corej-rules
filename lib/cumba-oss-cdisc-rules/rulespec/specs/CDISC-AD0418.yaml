name: CDISC-AD0418
kind: rule
description: |
  Wave A4 port — T1a PlainSimple.
  CDISC-AD0418: TRTSEQA is populated while TRTSEQAN is empty.
  Record-data rule scoped to SUBJECT LEVEL ANALYSIS DATASET; non_empty + empty pair.
python_source: rules-adamig-1-3.json (CDISC-AD0418)
rule:
  coreId: CDISC-AD0418
datasets:
  ADSL:
    row_key: [STUDYID, USUBJID]
    rows:
      - {STUDYID: S1, USUBJID: '001', TRTSEQA: '', TRTSEQAN: ''}      # ok
      - {STUDYID: S1, USUBJID: '002', TRTSEQA: 'A', TRTSEQAN: ''}     # bad
config:
  standard: adamig
  standard_version: '1.3'
library_mocks:
  classes:
    subject level analysis dataset: [ADSL]
expected_violations:
  - rule_id: CDISC-AD0418
    dataset: ADSL
    row_key: {STUDYID: S1, USUBJID: '002'}
    status: SUCCESS
    output_variables:
      TRTSEQA: 'A'
      TRTSEQAN: null
expected_errors: []
