name: CDISC-AD0145
kind: rule
description: |
  A2 port — T1a PlainSimple. BDS: PARAMCD has chars other than letters/digits/underscores.
python_source: rules-adamig-1-3.json (CDISC-AD0145)
rule:
  coreId: CDISC-AD0145
datasets:
  ADLB:
    row_key: [STUDYID, USUBJID, PARAMCD, AVISITN]
    column_types:
      AVISITN: LONG
    rows:
      - {STUDYID: S1, USUBJID: '001', PARAMCD: 'HGB', AVISITN: 1}      # ok
      - {STUDYID: S1, USUBJID: '002', PARAMCD: 'HGB-X', AVISITN: 1}    # bad (hyphen)
config:
  standard: adamig
  standard_version: '1.3'
library_mocks:
  classes:
    basic data structure: [ADLB]
expected_violations:
  - rule_id: CDISC-AD0145
    dataset: ADLB
    row_key: {STUDYID: S1, USUBJID: '002', PARAMCD: 'HGB-X', AVISITN: 1}
    status: SUCCESS
    output_variables:
      PARAMCD: 'HGB-X'
expected_errors: []
