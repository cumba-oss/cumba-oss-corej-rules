name: CDISC-AD0112
kind: rule
description: |
  A2 port — T1a PlainSimple. BDS rule: ARELTM populated but ARELTMU empty.
python_source: rules-adamig-1-3.json (CDISC-AD0112)
rule:
  coreId: CDISC-AD0112
datasets:
  ADLB:
    row_key: [STUDYID, USUBJID, PARAMCD, AVISITN]
    column_types:
      AVISITN: LONG
    rows:
      - {STUDYID: S1, USUBJID: '001', PARAMCD: 'HGB', AVISITN: 1, ARELTM: '10', ARELTMU: 'HOUR'}  # ok
      - {STUDYID: S1, USUBJID: '002', PARAMCD: 'HGB', AVISITN: 1, ARELTM: '10', ARELTMU: ''}      # bad
config:
  standard: adamig
  standard_version: '1.3'
library_mocks:
  classes:
    basic data structure: [ADLB]
expected_violations:
  - rule_id: CDISC-AD0112
    dataset: ADLB
    row_key: {STUDYID: S1, USUBJID: '002', PARAMCD: 'HGB', AVISITN: 1}
    status: SUCCESS
    output_variables:
      ARELTM: '10'
      ARELTMU: null
expected_errors: []
