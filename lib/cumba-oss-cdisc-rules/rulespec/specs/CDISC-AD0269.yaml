name: CDISC-AD0269
kind: rule
description: |
  A2 port — T1a PlainSimple. OCCDS (ADAE): TRTEMFL populated and not 'Y'.
python_source: rules-adamig-1-3.json (CDISC-AD0269)
rule:
  coreId: CDISC-AD0269
datasets:
  ADAE:
    row_key: [STUDYID, USUBJID, AESEQ]
    column_types:
      AESEQ: LONG
    rows:
      - {STUDYID: S1, USUBJID: '001', AESEQ: 1, TRTEMFL: 'Y'}   # ok
      - {STUDYID: S1, USUBJID: '002', AESEQ: 1, TRTEMFL: 'N'}   # bad
config:
  standard: adamig
  standard_version: '1.3'
library_mocks:
  classes:
    occurrence data structure: [ADAE]
expected_violations:
  - rule_id: CDISC-AD0269
    dataset: ADAE
    row_key: {STUDYID: S1, USUBJID: '002', AESEQ: 1}
    status: SUCCESS
    output_variables:
      TRTEMFL: 'N'
expected_errors: []
