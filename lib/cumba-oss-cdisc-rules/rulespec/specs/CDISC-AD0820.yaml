name: CDISC-AD0820
kind: rule
description: |
  Wave A10 port — T1a PlainSimple.
  CDISC-AD0820: SITEID is populated and SITEIDN is not populated.
  Record-data rule scoped to BASIC DATA STRUCTURE; non_empty + empty pair.
python_source: rules-adamig-1-3.json (CDISC-AD0820)
rule:
  coreId: CDISC-AD0820
datasets:
  ADLB:
    row_key: [STUDYID, USUBJID, PARAMCD]
    rows:
      - {STUDYID: S1, USUBJID: '001', PARAMCD: 'HGB', SITEID: '', SITEIDN: ''}      # ok
