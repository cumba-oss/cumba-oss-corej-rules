name: CDISC-AD0204
kind: rule
description: |
  Wave C2 port — T2-MD (Match_Datasets without Operations).
  CDISC-AD0204: ADSL.AGE must equal DM.AGE for the matching subject (USUBJID).
  Class-scoped rule (SUBJECT LEVEL ANALYSIS DATASET). Bare-leaf Check (no outer
  all/any wrapper) — Finding #26 quirk on Python's business_rules lane.
python_source: rules-adamig-1-3.json (CDISC-AD0204)
rule:
  coreId: CDISC-AD0204
datasets:
  ADSL:
    row_key: [STUDYID, USUBJID]
    column_types:
      AGE: LONG
    rows:
      - {STUDYID: S1, USUBJID: '001', AGE: 42}   # ok — matches DM.AGE
      - {STUDYID: S1, USUBJID: '002', AGE: 55}   # bad — DM.AGE is 65
  DM:
    row_key: [STUDYID, USUBJID]
    column_types:
      AGE: LONG
    rows:
      - {STUDYID: S1, DOMAIN: DM, USUBJID: '001', AGE: 42}
      - {STUDYID: S1, DOMAIN: DM, USUBJID: '002', AGE: 65}
config:
  standard: adamig
  standard_version: '1.3'
library_mocks:
  classes:
    subject level analysis dataset: [ADSL]
    special-purpose: [DM]
expected_violations:
  - rule_id: CDISC-AD0204
    dataset: ADSL
    row_key: {STUDYID: S1, USUBJID: '002'}
    status: SUCCESS
    output_variables:
      AGE: '55'
      DM.AGE: '65'
expected_errors: []
