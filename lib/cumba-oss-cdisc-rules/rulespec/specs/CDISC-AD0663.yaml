  CDISC-AD0663: COHORTN is populated and COHORT is not populated (ADNCA v1.0).
  Record-data rule scoped to BASIC DATA STRUCTURE; non_empty + empty.
python_source: rules-adamig-1-3.json (CDISC-AD0663)
rule:
  coreId: CDISC-AD0663
datasets:
