    column_types:
      AVISITN: LONG
      COHORTN: LONG
      NFRLT: DOUBLE
      AFRLT: DOUBLE
    rows:
      - {STUDYID: S1, USUBJID: '001', PARAMCD: HGB, AVISITN: 1, COHORTN: 1, COHORT: A, NFRLT: 0.0, AFRLT: 0.0}      # ok
