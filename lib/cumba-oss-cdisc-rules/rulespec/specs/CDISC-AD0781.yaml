      - {STUDYID: S1, USUBJID: '002', AESEQ: 1, AETOXGR: 'SEVERE', AETOXGRN: '1'}
      - {STUDYID: S1, USUBJID: '003', AESEQ: 1, AETOXGR: 'MILD', AETOXGRN: '2'}
config:
  standard: adamig
  standard_version: '1.3'
