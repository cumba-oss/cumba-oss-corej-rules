name: CDISC-AD0776
kind: rule
description: |
  Wave B5 port — T1b PlainIntermediate.
  CDISC-AD0776: more than one value of AERELN for a given value of AEREL.
  Bare-leaf Check scoped to OCCURRENCE DATA STRUCTURE (primary: ADAE).
  Uses has_multiple_values_for — Python gap (operator + bare-leaf), so
  this spec baselines on the Python lane; expected matches Java's output.
python_source: rules-adamig-1-3.json (CDISC-AD0776)
rule:
  coreId: CDISC-AD0776
datasets:
  ADAE:
    row_key: [STUDYID, USUBJID, AESEQ]
    column_types:
      AESEQ: LONG
    rows:
      # AEREL='NOT RELATED' mapped to two distinct AERELN (1, 2) -> both fire
      - {STUDYID: S1, USUBJID: '001', AESEQ: 1, AEREL: 'NOT RELATED', AERELN: '1'}
      - {STUDYID: S1, USUBJID: '002', AESEQ: 1, AEREL: 'NOT RELATED', AERELN: '2'}
      # AEREL='RELATED' single-valued -> ok
      - {STUDYID: S1, USUBJID: '003', AESEQ: 1, AEREL: 'RELATED',     AERELN: '3'}
config:
  standard: adamig
  standard_version: '1.3'
library_mocks:
  classes:
    occurrence data structure: [ADAE]
expected_violations:
  - rule_id: CDISC-AD0776
    dataset: ADAE
    row_key: {STUDYID: S1, USUBJID: '001', AESEQ: 1}
    status: SUCCESS
    output_variables:
      AEREL: 'NOT RELATED'
      AERELN: '1'
  - rule_id: CDISC-AD0776
    dataset: ADAE
    row_key: {STUDYID: S1, USUBJID: '002', AESEQ: 1}
    status: SUCCESS
    output_variables:
      AEREL: 'NOT RELATED'
      AERELN: '2'
expected_errors: []
