name: RELREC-AEFA-1TON
kind: rule
description: |
  RELREC ONE-TO-MANY row expansion on real CDISCPILOT01 data. Primary = AE; one AE record
  (AELNKID) relates to MANY FA findings-about records (FALNKGRP) — dataset-level relationship
  (blank IDVARVAL, RELTYPE=MANY). The forward-RELREC row-expansion engine produces one expanded
  evaluation row per (AE, FA) pair, so a single AE record can yield several violations (one per
  related FA), each carrying that FA's RELREC.FAOBJ.

  SYNTHETIC rule (there is no bundled AE-primary RELREC rule): flags each related FA whose FAOBJ
  differs from the AE's AETERM. Subject CDISC001: AE AELNKID=1 ("INJECTION SITE REACTION") links
  to 3 FA rows (ERYTHEMA, ERYTHEMA, PAIN); AE AELNKID=2 ("FATIGUE") links to no FA (inner-join
  exclusion). The two ERYTHEMA expanded rows share row_key + output, so the canonical set holds
  2 distinct violations (ERYTHEMA, PAIN) — exercising the dedup/canonical-set behaviour too.
  Data is a shortened slice of testdata/study3/sdtm (CDISCPILOT01, RELID AEFA).
python_source: synthetic AE-primary RELREC rule on CDISCPILOT01 RELREC AEFA
rule:
  Core: {Id: RELREC-AEFA-1TON, Status: Published, Version: '1'}
  Description: Synthetic — AE primary, one-to-many RELREC join to FA; AETERM vs RELREC.FAOBJ.
  Sensitivity: Record
  Executability: Fully Executable
  Scope:
    Classes: {Include: [EVENTS]}
    Domains: {Include: [AE]}
  Match_Datasets:
    - {Name: RELREC, Wildcard: FA}
  Check:
    all:
      - {name: AETERM, operator: not_equal_to, value: RELREC.FAOBJ}
  Outcome:
    Message: AE relates to FA finding(s) via RELREC; AETERM differs from the related FAOBJ.
    Output_Variables: [AETERM, RELREC.FAOBJ]
  id: synthetic-relrec-aefa-1ton
datasets:
  AE:
    row_key: [STUDYID, USUBJID, AESEQ]
    column_types:
      AESEQ: LONG
    rows:
      - {STUDYID: CDISCPILOT01, DOMAIN: AE, USUBJID: CDISC001, AESEQ: 1, AELNKID: '1', AETERM: INJECTION SITE REACTION, AEDECOD: ''}
      - {STUDYID: CDISCPILOT01, DOMAIN: AE, USUBJID: CDISC001, AESEQ: 2, AELNKID: '2', AETERM: FATIGUE, AEDECOD: ''}
  FA:
    row_key: [STUDYID, USUBJID, FASEQ]
    column_types:
      FASEQ: LONG
    rows:
      - {STUDYID: CDISCPILOT01, DOMAIN: FA, USUBJID: CDISC001, FASEQ: 1, FALNKGRP: '1', FATESTCD: OCCUR, FAOBJ: ERYTHEMA, FAORRES: Y}
      - {STUDYID: CDISCPILOT01, DOMAIN: FA, USUBJID: CDISC001, FASEQ: 2, FALNKGRP: '1', FATESTCD: SEV, FAOBJ: ERYTHEMA, FAORRES: MODERATE}
      - {STUDYID: CDISCPILOT01, DOMAIN: FA, USUBJID: CDISC001, FASEQ: 3, FALNKGRP: '1', FATESTCD: OCCUR, FAOBJ: PAIN, FAORRES: N}
  RELREC:
    row_key: [__row_number__]
    rows:
      - {STUDYID: CDISCPILOT01, RDOMAIN: AE, USUBJID: '', IDVAR: AELNKID, IDVARVAL: '', RELTYPE: ONE, RELID: AEFA}
      - {STUDYID: CDISCPILOT01, RDOMAIN: FA, USUBJID: '', IDVAR: FALNKGRP, IDVARVAL: '', RELTYPE: MANY, RELID: AEFA}
config:
  standard: sdtmig
  standard_version: '3.4'
library_mocks:
  classes:
    events: [AE]
    findings about: [FA]
    relationship: [RELREC]
expected_violations:
  - rule_id: RELREC-AEFA-1TON
    dataset: AE
    row_key: {AESEQ: 1, STUDYID: CDISCPILOT01, USUBJID: CDISC001}
    status: SUCCESS
    output_variables:
      AETERM: INJECTION SITE REACTION
      RELREC.FAOBJ: ERYTHEMA
  - rule_id: RELREC-AEFA-1TON
    dataset: AE
    row_key: {AESEQ: 1, STUDYID: CDISCPILOT01, USUBJID: CDISC001}
    status: SUCCESS
    output_variables:
      AETERM: INJECTION SITE REACTION
      RELREC.FAOBJ: ERYTHEMA
  - rule_id: RELREC-AEFA-1TON
    dataset: AE
    row_key: {AESEQ: 1, STUDYID: CDISCPILOT01, USUBJID: CDISC001}
    status: SUCCESS
    output_variables:
      AETERM: INJECTION SITE REACTION
      RELREC.FAOBJ: PAIN
expected_errors: []
