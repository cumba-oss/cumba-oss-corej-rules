name: CDISC-AD0770
kind: rule
description: |
  Wave B5 port — T1b PlainIntermediate.
  CDISC-AD0770: more than one value of AESEVN for a given value of AESEV.
  Bare-leaf Check scoped to OCCURRENCE DATA STRUCTURE (primary: ADAE).
  Uses has_multiple_values_for — Python gap (operator + bare-leaf), so
  this spec baselines on the Python lane; expected matches Java's output.
python_source: rules-adamig-1-3.json (CDISC-AD0770)
rule:
  coreId: CDISC-AD0770
datasets:
  ADAE:
    row_key: [STUDYID, USUBJID, AESEQ]
    column_types:
      AESEQ: LONG
    rows:
      # AESEV='MILD' mapped to two distinct AESEVN (1, 2) -> both rows fire
      - {STUDYID: S1, USUBJID: '001', AESEQ: 1, AESEV: 'MILD',   AESEVN: '1'}
      - {STUDYID: S1, USUBJID: '002', AESEQ: 1, AESEV: 'MILD',   AESEVN: '2'}
      # AESEV='SEVERE' single-valued -> ok
      - {STUDYID: S1, USUBJID: '003', AESEQ: 1, AESEV: 'SEVERE', AESEVN: '3'}
config:
  standard: adamig
  standard_version: '1.3'
library_mocks:
  classes:
    occurrence data structure: [ADAE]
expected_violations:
  - rule_id: CDISC-AD0770
    dataset: ADAE
    row_key: {STUDYID: S1, USUBJID: '001', AESEQ: 1}
    status: SUCCESS
    output_variables:
      AESEV: 'MILD'
      AESEVN: '1'
  - rule_id: CDISC-AD0770
    dataset: ADAE
    row_key: {STUDYID: S1, USUBJID: '002', AESEQ: 1}
    status: SUCCESS
    output_variables:
      AESEV: 'MILD'
      AESEVN: '2'
expected_errors: []
