name: CDISC-AD0562
kind: rule
description: |
  Wave D6 port - T3-VMC Variable Metadata Check with `exists`/`not_exists`
  leaves on literal ADaM column names. Baselined on Python lane under
  Finding #9 (VMC dataset projection divergence).
python_notes: |
  Known divergence (Finding #9): Python swaps the dataset for a
  VariablesMetadataDatasetBuilder projection, so `exists(STRATAVN)` checks
  meta-field column names instead of the original dataset columns and
  yields 0 violations. Java fires correctly on the column metadata;
  expected matches Java.
python_source: rules-adamig-1-3.json (CDISC-AD0562)
rule:
  coreId: CDISC-AD0562
datasets:
  ADSL:
    row_key: [STUDYID, USUBJID]
    rows:
      - {STUDYID: S1, USUBJID: '001', STRATAVN: 1}
config:
  standard: adamig
  standard_version: '1.3'
library_mocks:
  classes:
    subject level analysis dataset: [ADSL]
expected_violations:
  - rule_id: CDISC-AD0562
    dataset: ADSL
    row_key: {STUDYID: S1, USUBJID: '001'}
    status: SUCCESS
    output_variables:
      STRATAVN: '1'
expected_errors: []
