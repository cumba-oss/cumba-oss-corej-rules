name: PMDA-AD0168
kind: rule
description: |
  Filter-on-max parity fixture.
  PMDA-AD0168: BDS - when BASETYPE is present and BNRIND is populated,
  BNRIND must equal ANRIND at the baseline record (ABLFL='Y') for each
  (USUBJID, PARAMCD, BASETYPE) group. Uses Operation `max` on ANRIND
  with filter ABLFL='Y', grouped by (USUBJID, PARAMCD, BASETYPE).
  Output_Variables are ANRIND, BNRIND, ABLFL.

  The data exercises the filter discriminatingly (the Python engine
  honours `filter` on `max`, matching Java) via three group kinds:
  - Subject 001: post-baseline ANRIND ('NORMAL') is strictly greater
    (lexicographically) than the ABLFL='Y' row's ANRIND ('LOW') while
    BNRIND='LOW' everywhere -> no violation. An engine that maxes over
    ALL rows (ignoring the filter) would falsely fire here - this is
    the regression trap.
  - Subject 002: BNRIND ('LOW') differs from the baseline ANRIND
    ('NORMAL') on a post-baseline row -> genuine violation.
  - Subject 003: no ABLFL='Y' row -> the $-operation value is missing
    for the group and `not_equal_to` fires on every row whose BNRIND is
    populated (both engines agree: populated-vs-missing is unequal).
    The second row keeps BNRIND empty, so the non_empty guard keeps it
    quiet.
python_source: rules-adamig-1-3.json (PMDA-AD0168)
rule:
  coreId: PMDA-AD0168
datasets:
  ADLB:
    row_key: [STUDYID, USUBJID, PARAMCD, BASETYPE, AVISITN]
    column_types:
      AVISITN: LONG
    rows:
      # Subject 001 HGB PRE - DISCRIMINATING: post-baseline ANRIND='NORMAL'
      # exceeds the ABLFL=Y row's ANRIND='LOW'; BNRIND='LOW' everywhere ->
      # no violation (an unfiltered max would compute 'NORMAL' and fire falsely).
      - {STUDYID: S1, USUBJID: '001', PARAMCD: HGB, BASETYPE: PRE, AVISITN: 0, ABLFL: Y, ANRIND: LOW, BNRIND: LOW}
      - {STUDYID: S1, USUBJID: '001', PARAMCD: HGB, BASETYPE: PRE, AVISITN: 1, ABLFL: '', ANRIND: NORMAL, BNRIND: LOW}
      # Subject 002 HGB PRE - genuine violation: baseline ANRIND='NORMAL'
      # but BNRIND='LOW' on the post-baseline row.
      - {STUDYID: S1, USUBJID: '002', PARAMCD: HGB, BASETYPE: PRE, AVISITN: 0, ABLFL: Y, ANRIND: NORMAL, BNRIND: NORMAL}
      - {STUDYID: S1, USUBJID: '002', PARAMCD: HGB, BASETYPE: PRE, AVISITN: 1, ABLFL: '', ANRIND: LOW, BNRIND: LOW}          # bad
      # Subject 003 HGB PRE - no ABLFL=Y row: $baseline_anrind is missing for
      # the group, so the populated-BNRIND row fires; the empty-BNRIND row is
      # kept quiet by the non_empty guard.
      - {STUDYID: S1, USUBJID: '003', PARAMCD: HGB, BASETYPE: PRE, AVISITN: 1, ABLFL: '', ANRIND: HIGH, BNRIND: HIGH}         # bad (missing $-value)
      - {STUDYID: S1, USUBJID: '003', PARAMCD: HGB, BASETYPE: PRE, AVISITN: 2, ABLFL: '', ANRIND: LOW, BNRIND: ''}
config:
  standard: adamig
  standard_version: '1.3'
library_mocks:
  classes:
    basic data structure: [ADLB]
expected_violations:
  - rule_id: PMDA-AD0168
    dataset: ADLB
    row_key: {AVISITN: 1, BASETYPE: PRE, PARAMCD: HGB, STUDYID: S1, USUBJID: '002'}
    status: SUCCESS
    output_variables:
      $baseline_anrind: 'NORMAL'
      ABLFL:
      ANRIND: LOW
      BASETYPE: PRE
      BNRIND: LOW
      PARAMCD: HGB
  - rule_id: PMDA-AD0168
    dataset: ADLB
    row_key: {AVISITN: 1, BASETYPE: PRE, PARAMCD: HGB, STUDYID: S1, USUBJID: '003'}
    status: SUCCESS
    output_variables:
      $baseline_anrind:
      ABLFL:
      ANRIND: HIGH
      BASETYPE: PRE
      BNRIND: HIGH
      PARAMCD: HGB
expected_errors: []
