name: CDISC-AD0154
kind: rule
description: |
  Wave C3 port — T2-Grouping (Sensitivity=Group). BDS class scope.
  CDISC-AD0154: within (USUBJID, PARAMCD, BASETYPE), more than one
  record has ABLFL=Y. BASETYPE must exist (non-null) for the Check's
  first leaf to pass.
python_source: rules-adamig-1-3.json (CDISC-AD0154)
rule:
  coreId: CDISC-AD0154
datasets:
  ADLB:
    row_key: [STUDYID, USUBJID, PARAMCD, BASETYPE, AVISITN]
    column_types:
      AVISITN: LONG
    rows:
      # Group A: BASETYPE=LAST, exactly one ABLFL=Y → ok
      - {STUDYID: S1, USUBJID: '001', PARAMCD: HGB, BASETYPE: LAST, AVISITN: 0, ABLFL: Y}
      - {STUDYID: S1, USUBJID: '001', PARAMCD: HGB, BASETYPE: LAST, AVISITN: 1, ABLFL: ''}
      # Group B: BASETYPE=AVG, two ABLFL=Y → violation
      - {STUDYID: S1, USUBJID: '002', PARAMCD: HGB, BASETYPE: AVG, AVISITN: 0, ABLFL: Y}
      - {STUDYID: S1, USUBJID: '002', PARAMCD: HGB, BASETYPE: AVG, AVISITN: 1, ABLFL: Y}
config:
  standard: adamig
  standard_version: '1.3'
library_mocks:
  classes:
    basic data structure: [ADLB]
expected_violations:
  - rule_id: CDISC-AD0154
    dataset: ADLB
    row_key: {AVISITN: 0, BASETYPE: AVG, PARAMCD: HGB, STUDYID: S1, USUBJID: '002'}
    status: SUCCESS
    output_variables:
      $ablfl_y_count: '2'
      ABLFL: Y
      BASETYPE: AVG
      PARAMCD: HGB
expected_errors: []
