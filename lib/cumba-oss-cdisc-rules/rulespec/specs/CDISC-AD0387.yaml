name: CDISC-AD0387
kind: rule
description: |
  Wave B2 port — T1b PlainIntermediate.
  CDISC-AD0387: Within a parameter, there is more than one value of BTOXGRH for a given value of BTOXGRHN.
  Bare-leaf Check (`has_multiple_values_for` with `within: PARAMCD`) scoped to BASIC DATA STRUCTURE.
  Two rows share the same BTOXGRHN value but distinct BTOXGRH; both fire. A third row is unique and does not fire.
  Bare-leaf Check raises `KeyError: 'name'` on Python's business_rules library (Finding #26); Python lane baseline expected.
python_source: rules-adamig-1-3.json (CDISC-AD0387)
rule:
  coreId: CDISC-AD0387
datasets:
  ADLB:
    row_key: [STUDYID, USUBJID, PARAMCD, AVISITN]
    column_types:
      AVISITN: LONG
    rows:
      - {STUDYID: S1, USUBJID: '001', PARAMCD: HGB, AVISITN: 1, BTOXGRH: X, BTOXGRHN: A}         # bad
      - {STUDYID: S1, USUBJID: '002', PARAMCD: HGB, AVISITN: 1, BTOXGRH: Y, BTOXGRHN: A}         # bad (distinct BTOXGRH for same BTOXGRHN within PARAMCD)
      - {STUDYID: S1, USUBJID: '003', PARAMCD: HGB, AVISITN: 1, BTOXGRH: Z, BTOXGRHN: B}         # ok (unique BTOXGRHN)
config:
  standard: adamig
  standard_version: '1.3'
library_mocks:
  classes:
    basic data structure: [ADLB]
expected_violations:
  - rule_id: CDISC-AD0387
    dataset: ADLB
    row_key: {AVISITN: 1, PARAMCD: HGB, STUDYID: S1, USUBJID: '001'}
    status: SUCCESS
    output_variables:
      BTOXGRH: X
      BTOXGRHN: A
      PARAMCD: HGB
  - rule_id: CDISC-AD0387
    dataset: ADLB
    row_key: {AVISITN: 1, PARAMCD: HGB, STUDYID: S1, USUBJID: '002'}
    status: SUCCESS
    output_variables:
      BTOXGRH: Y
      BTOXGRHN: A
      PARAMCD: HGB
expected_errors: []
