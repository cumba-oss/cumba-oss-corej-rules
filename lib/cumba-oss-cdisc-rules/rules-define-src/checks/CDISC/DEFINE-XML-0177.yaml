Rule_Id: "DEFINE-XML-0177"
Sheet_Rule_Identifier: "177"
Rule_Set: "CDISC"
Element: "CodeList"
Attribute: "CommentOID"
Applicable_Versions: ["2.1"]
Source_Type: "Specification"
Plain_Text_Rule: "The def:CommentOID attribute on the CodeList element must reference an existing def:CommentDef element."
# Value check fires only on a present def:CommentOID.
Message: "There is no def:CommentDef with an OID attribute that matches the CodeList def:CommentOID value [${value}]."
Check:
  kind: "references"
  attribute: "CommentOID"
  targetElement: "CommentDef"
  targetKey: "OID"
