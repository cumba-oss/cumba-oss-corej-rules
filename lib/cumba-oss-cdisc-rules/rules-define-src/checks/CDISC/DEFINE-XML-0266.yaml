Rule_Id: "DEFINE-XML-0266"
Sheet_Rule_Identifier: "266"
Rule_Set: "CDISC"
Element: "ItemGroupDef/ItemRef"
Applicable_Versions: ["2.1"]
Source_Type: "Specification"
Requires: "library"
Plain_Text_Rule: "The value of an English variable's description must match the one specified in the CDISC standard for an ItemDef element that represents a dataset's variable defined as following an SDTMIG or SENDIG standard."
# CDISC twin of PMDA-DD0137, same kind: scoped to the ItemRef so the variable
# inherits its dataset (parent ItemGroupDef) and standard; the referenced
# ItemDef supplies the variable Name and English description. 2.1-only per the
# sheet.
Message: "The English variable's description does not follow the standard [${value}]."
Check:
  kind: "library_variable_label_matches"
