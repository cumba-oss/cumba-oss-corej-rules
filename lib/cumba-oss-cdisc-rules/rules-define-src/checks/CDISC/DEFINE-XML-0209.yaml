Rule_Id: "DEFINE-XML-0209"
Sheet_Rule_Identifier: "209"
Rule_Set: "CDISC"
Element: "MethodDef"
Attribute: "Type"
Applicable_Versions: ["2.0", "2.1"]
Source_Type: "Specification"
Plain_Text_Rule: "The value of the Type attribute must be one of \"Computation\", \"Imputation\"."
# Define-XML 2.1 spec section 5.3.14 confirms the closed set {Computation, Imputation}
# (Define-XML restricts ODM 1.3.2's four-value MethodType enumeration — Computation,
# Imputation, Transpose, Other — see the vendored ODM1-3-2-foundation.xsd). Detection
# of a MISSING Type is DEFINE-XML-0208; value-kinds fire only on present values.
Message: "The value of MethodDef Type [${value}] is not one of \"Computation\", \"Imputation\"."
Check:
  kind: "one_of"
  attribute: "Type"
  values: ["Computation", "Imputation"]
