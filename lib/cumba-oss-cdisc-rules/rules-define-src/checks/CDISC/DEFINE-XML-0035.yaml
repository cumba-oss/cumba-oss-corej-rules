Rule_Id: "DEFINE-XML-0035"
Sheet_Rule_Identifier: "35"
Rule_Set: "CDISC"
Element: "Standard"
Attribute: "PublishingSet"
Applicable_Versions: ["2.1"]
Source_Type: "Specification"
Plain_Text_Rule: "Attribute PublishingSet must be provided for the def:Standard element when Type is \"CT\"."
Message: "Attribute PublishingSet is missing for def:Standard with @Type='CT'."
Check:
  kind: "exists"
  target: "@PublishingSet"
  when:
    path: "@Type"
    equals: "CT"
