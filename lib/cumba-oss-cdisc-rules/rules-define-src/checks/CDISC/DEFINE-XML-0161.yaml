Rule_Id: "DEFINE-XML-0161"
Sheet_Rule_Identifier: "161"
Rule_Set: "CDISC"
Element: "ItemDef/Origin"
Attribute: "Source"
Applicable_Versions: ["2.1"]
Source_Type: "Schema"
Plain_Text_Rule: "The value of the Source attribute must be one of \"Investigator\", \"Sponsor\", \"Subject\", \"Vendor\"."
# Term set verified against spec 2.1 SS4.3.2 (Subject, Investigator, Vendor,
# Sponsor — non-extensible). Value check fires only on a present Source.
Message: "The value of Source [${value}] is not one of \"Investigator\", \"Sponsor\", \"Subject\", \"Vendor\" for the ItemDef def:Origin."
Check:
  kind: "one_of"
  attribute: "Source"
  values: ["Investigator", "Sponsor", "Subject", "Vendor"]
