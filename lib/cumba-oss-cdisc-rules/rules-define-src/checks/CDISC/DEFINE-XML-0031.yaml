Rule_Id: "DEFINE-XML-0031"
Sheet_Rule_Identifier: "31"
Rule_Set: "CDISC"
Element: "MetaDataVersion"
Attribute: null
Applicable_Versions: ["2.1"]
Source_Type: "Specification"
Plain_Text_Rule: "Child element def:Standards must be provided for the MetaDataVersion element in the context of a submission."
Message: "Child element def:Standards is missing for element MetaDataVersion when @def:Context='Submission'."
Check:
  kind: "exists"
  target: "Standards"
  when:
    path: "../../@Context"
    equals: "Submission"
