Rule_Id: "DEFINE-XML-0146"
Sheet_Rule_Identifier: "146"
Rule_Set: "CDISC"
Element: "ItemDef"
Attribute: "SignificantDigits"
Applicable_Versions: ["2.0", "2.1"]
Source_Type: "Schema"
Plain_Text_Rule: "The value of attribute SignificantDigits must be a non-negative integer number."
# Value check fires only on a present SignificantDigits (presence is sheet id 145).
Message: "The value of attribute SignificantDigits [${value}] is not a non-negative integer number for the ItemDef element."
Check:
  kind: "matches_regex"
  attribute: "SignificantDigits"
  format: "non-negative-integer"
