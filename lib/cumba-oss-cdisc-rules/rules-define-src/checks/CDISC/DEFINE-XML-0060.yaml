Rule_Id: "DEFINE-XML-0060"
Sheet_Rule_Identifier: "60"
Rule_Set: "CDISC"
Element: "Description"
Attribute: null
Applicable_Versions: ["2.0", "2.1"]
Source_Type: "Schema"
Plain_Text_Rule: "Child element TranslatedText must be provided for the Description element."
# The sheet's $ParentElement[@OID] message placeholder is carried by the finding's xpath
# instead (the message template only supports ${value}). Scoped to every Description
# element — the sheet's XPaths list is exactly the set of Description-bearing parents.
Message: "Child element TranslatedText is missing for element Description."
Check:
  kind: "exists"
  target: "TranslatedText"
