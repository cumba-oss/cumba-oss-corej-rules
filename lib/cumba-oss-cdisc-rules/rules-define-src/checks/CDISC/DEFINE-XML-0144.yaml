Rule_Id: "DEFINE-XML-0144"
Sheet_Rule_Identifier: "144"
Rule_Set: "CDISC"
Element: "ItemDef"
Attribute: "Length"
Applicable_Versions: ["2.0", "2.1"]
Source_Type: "Schema"
Plain_Text_Rule: "The value of attribute Length must be a positive integer number."
# Value check fires only on a present Length (presence is sheet id 141).
Message: "The value of attribute Length [${value}] is not a positive integer number for the ItemDef element."
Check:
  kind: "matches_regex"
  attribute: "Length"
  format: "positive-integer"
