Rule_Id: "DEFINE-XML-0193"
Sheet_Rule_Identifier: "193"
Rule_Set: "CDISC"
Element: "CodeListItem"
Attribute: "Rank"
Applicable_Versions: ["2.0", "2.1"]
Source_Type: "Schema"
Plain_Text_Rule: "The value of attribute Rank must be an integer number."
# Value check fires only on a present Rank (presence is sheet id 194).
Message: "The value of attribute Rank [${value}] is not an integer number for the CodeListItem element."
Check:
  kind: "matches_regex"
  attribute: "Rank"
  format: "integer"
