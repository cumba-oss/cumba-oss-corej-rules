Rule_Id: "DEFINE-XML-0068"
Sheet_Rule_Identifier: "68"
Rule_Set: "CDISC"
Element: "ItemRef"
Attribute: "Mandatory"
Applicable_Versions: ["2.0", "2.1"]
Source_Type: "Schema"
Plain_Text_Rule: "The value of the Mandatory attribute must be one of \"Yes\", \"No\"."
# Value check fires only on a present Mandatory (presence is sheet id 69). The
# ItemGroupDef/def:ValueListDef context is carried by the finding's xpath.
Message: "The value of Mandatory [${value}] is not one of \"Yes\", \"No\" for the ItemRef element."
Check:
  kind: "one_of"
  attribute: "Mandatory"
  values: ["Yes", "No"]
