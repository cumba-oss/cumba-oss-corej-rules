Rule_Id: "DEFINE-XML-0028"
Sheet_Rule_Identifier: "28"
Rule_Set: "CDISC"
Element: "MetaDataVersion"
Attribute: "DefineVersion"
Applicable_Versions: ["2.0", "2.1"]
Source_Type: "Schema"
Plain_Text_Rule: "The value of the def:DefineVersion attribute must be \"2.0.0\" or match \"2.1.<n>\" (e.g., \"2.1.0\")."
Message: "The value of MetaDataVersion def:DefineVersion[${value}] is neither \"2.0.0\" nor matches \"2.1.<n>\"."
Check:
  kind: "matches_regex"
  attribute: "DefineVersion"
  pattern: "2\\.0\\.0|2\\.1\\.\\d+"
