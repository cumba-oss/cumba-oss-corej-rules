Rule_Id: "DEFINE-XML-0077"
Sheet_Rule_Identifier: "77"
Rule_Set: "CDISC"
Element: "ItemRef"
Attribute: "HasNoData"
Applicable_Versions: ["2.1"]
Source_Type: "Schema"
Plain_Text_Rule: "The value of the def:HasNoData attribute must be \"Yes\"."
# Value check fires only on a present def:HasNoData ("Yes" is the schema's only
# allowed value; conditional presence is sheet id 76, deferred — needs dataset data).
Message: "The value of def:HasNoData [${value}] is not \"Yes\" for the ItemRef element."
Check:
  kind: "one_of"
  attribute: "HasNoData"
  values: ["Yes"]
