Rule_Id: "PMDA-DD0131"
Sheet_Rule_Identifier: "DD0131"
Rule_Set: "PMDA"
Element: "CodeList"
Attribute: "Name"
Applicable_Versions: ["2.1"]
Severity: "Error"
Plain_Text_Rule: "The Name attribute for CodeList (the CodeList Name) must be unique within Define.xml. Define-XML specification represents Codelists as CodeList elements within MetaDataVersion element."
# The PMDA sheet scopes this "within Define.xml" => document-wide. CDISC twin 172
# uses sibling scope from its "set of Codelist elements" wording - equivalent for
# single-MDV documents; each rule follows its own sheet.
Message: "Duplicate Codelist Name [${value}]"
Check:
  kind: "unique_in_document"
  attribute: "Name"
