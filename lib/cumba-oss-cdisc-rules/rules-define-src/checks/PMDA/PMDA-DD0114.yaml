Rule_Id: "PMDA-DD0114"
Sheet_Rule_Identifier: "DD0114"
Rule_Set: "PMDA"
Element: "ItemGroupDef"
Attribute: null
Applicable_Versions: ["2.0", "2.1"]
Severity: "Error"
Plain_Text_Rule: "Split datasets can only be used for general-observation-class datasets (Events, Findings, Findings About, Interventions)."
# Custom (budget 8/15): split detection needs document-wide Domain counting -
# semantics on the check class (class read version-organically from the 2.0
# def:Class attribute or the 2.1 def:Class child Name; case-insensitive
# against the row's four GO classes; class-less split parts out of reach,
# class presence being DD0054's beat). Fires once per offending split part.
# No CDISC twin (the CDISC sheet has no split-dataset rows).
Message: "Invalid usage of split datasets for non-general-observation-class datasets"
Check:
  kind: "custom"
  className: "net.cumba.cdisc.define.conformance.checks.SplitDatasetClassCheck"
