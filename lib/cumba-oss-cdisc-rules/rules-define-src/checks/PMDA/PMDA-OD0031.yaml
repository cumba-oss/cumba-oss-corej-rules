Rule_Id: "PMDA-OD0031"
Sheet_Rule_Identifier: "OD0031"
Rule_Set: "PMDA"
Element: "ItemDef"
Attribute: "OID"
Applicable_Versions: ["2.0", "2.1"]
Severity: "Error"
Plain_Text_Rule: "The OID attribute for ItemDef element must be unique within a single MetaDataVersion."
# ItemDef elements are direct MetaDataVersion children, so the per-parent sibling
# scope IS the sheet's per-MDV scope.
Message: "Duplicate ItemDef OID [${value}]"
Check:
  kind: "unique_among_siblings"
  attribute: "OID"
