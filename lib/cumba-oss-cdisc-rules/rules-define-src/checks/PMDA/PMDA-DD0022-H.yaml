Rule_Id: "PMDA-DD0022-H"
Sheet_Rule_Identifier: "DD0022"
Rule_Set: "PMDA"
Element: "MetaDataVersion"
Attribute: "StandardVersion"
Applicable_Versions: ["2.0"]
Severity: "Reject"
Plain_Text_Rule: "Standard Version must have a valid value for the given Standard Name. Allowed values are '3.1.2', '3.1.3', '3.2', '3.3', or '3.4' for SDTM-IG, '3.0', '3.1', or '3.1.1' for SEND-IG, '1.0' for SEND-IG-AR, '1.1' for SEND-IG-DART, '1.0' for SEND-IG-GENETOX, '1.0', '1.1', '1.2', or '1.3' for ADaM-IG, and '1.0' for BIMO. Define-XML specification represents Standard Version as def:StandardVersion attribute on MetaDataVersion element. Note: Refer to the data standards catalog by the relevant Regulatory Agency for acceptance of standards and their versions."
# Define-XML 2.0 leg of the PMDA-DD0022 family (see the base rule's comment):
# in 2.0 the standard binding is the MetaDataVersion's def:StandardName /
# def:StandardVersion attribute pair, exactly as the sheet is worded.
Message: "Invalid Standard Version value ${value} for ADaM-IG"
Check:
  kind: "one_of"
  attribute: "StandardVersion"
  values: ["1.0", "1.1", "1.2", "1.3"]
  when:
    path: "@StandardName"
    oneOf: ["ADaM-IG"]
