Rule_Id: "PMDA-DD0073-B"
Sheet_Rule_Identifier: "DD0073"
Rule_Set: "PMDA"
Element: "ItemDef/Origin"
Attribute: "Type"
Applicable_Versions: ["2.1"]
Severity: "Error"
Plain_Text_Rule: "For Define-XML v2.0, the Origin Type attribute must have a value of 'CRF', 'Derived', 'Assigned', 'Protocol', 'eDT', or 'Predecessor' for SDTM and ADaM data and 'COLLECTED', 'DERIVED', 'OTHER', or 'NOT AVAILABLE' for SEND data. For Define-XML v2.1, the Origin Type attribute must have a value of 'Collected', 'Derived', 'Assigned', 'Protocol', or 'Predecessor' for SDTM, 'Collected', 'Derived', 'Assigned', 'Protocol', 'Other', 'Predecessor', or 'Not Available' for SEND, and 'Derived', 'Assigned', or 'Predecessor' for ADaM."
# One sheet row, five standard-and-version legs (base/-B/-C: 2.1 SDTM / SEND /
# ADaM; -D/-E: 2.0 SDTM+ADaM / SEND). 2.1 SEND leg: the standard binding walks
# from the Origin's ItemDef through the (first, document-order) ItemRef
# referencing it to the enclosing ItemGroupDef and dereferences that dataset's
# def:StandardOID to the def:Standard Name (0142's reverse-join pattern;
# first-match deviation documented there). Value-level Origins (ItemRefs under
# def:ValueListDef, which has no def:StandardOID) fail the guard and are out
# of this row's 2.1 reach - documented deviation; DD0074 covers the
# variable/value-level Type consistency.
Message: "Invalid Origin Type value"
Check:
  kind: "one_of"
  attribute: "Type"
  values: ["Collected", "Derived", "Assigned", "Protocol", "Other", "Predecessor", "Not Available"]
  when:
    path: "../@OID->ItemRef@ItemOID/../@StandardOID->Standard@OID/@Name"
    matchesRegex: "SEND.*"
