Rule_Id: "PMDA-DD0091"
Sheet_Rule_Identifier: "DD0091"
Rule_Set: "PMDA"
Element: "AnalysisResult"
Attribute: "OID"
Applicable_Versions: ["2.0", "2.1"]
Severity: "Error"
Plain_Text_Rule: "The OID for an arm:AnalysisResult must be unique within a arm:ResultDisplay."
