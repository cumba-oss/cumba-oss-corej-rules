Rule_Id: "PMDA-DD0028-B"
Sheet_Rule_Identifier: "DD0028"
Rule_Set: "PMDA"
Element: "CodeListItem"
Attribute: "CodedValue"
Applicable_Versions: ["2.0", "2.1"]
Severity: "Warning"
Requires: "ct"
Plain_Text_Rule: "Codelist Term must match the value in CDISC Controlled Terminology for corresponding NCI Code. Define-XML specification represents Term as CodedValue attribute on either EnumeratedItem or CodeListItem elements within CodeList element. NCI Code is represented as Name attribute on Alias element when Context attribute is \"nci:ExtCodeID\"."
# CodeListItem leg of PMDA-DD0028 (see there).
Message: "Term/NCI Code mismatch in Codelist for Term ${value}"
Check:
  kind: "term_matches_nci_code"
