name: FDA-SD9744
kind: rule
description: |
  Wave 20 port — two record_count Operations with filters on TS. HLTSUBJI=Y
  but no INDIC with TSVALNF=NA.
python_source: rules-sdtmig-3-4.json (CORE-000742)
rule:
  coreId: FDA-SD9744
datasets:
  TS:
    row_key: [STUDYID, TSPARMCD]
    rows:
      - {STUDYID: S1, DOMAIN: TS, TSPARMCD: HLTSUBJI, TSVAL: Y, TSVALNF: ''}
      - {STUDYID: S1, DOMAIN: TS, TSPARMCD: INDIC, TSVAL: something, TSVALNF: ''}
config:
  standard: sdtmig
  standard_version: '3.4'
library_mocks:
  classes:
    trial design: [TS]
expected_violations:
  - rule_id: FDA-SD9744
    dataset: TS
    row_key: {STUDYID: S1, TSPARMCD: HLTSUBJI}
    status: SUCCESS
    output_variables:
      $HLTSUBJI: '1'
      $INDIC: '0'
      TSPARMCD: 'HLTSUBJI'
      TSVAL: 'Y'
      TSVALNF:
expected_errors: []
