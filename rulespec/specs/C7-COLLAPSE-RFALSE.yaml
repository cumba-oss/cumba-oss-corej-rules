name: C7-COLLAPSE-RFALSE
kind: rule
description: |
  D5, residual constant FALSE: AEBDSYCD is blank on every record (the empty leaf folds TRUE) but
  AEBODSYS is blank on every record too, so the residual `not empty(AEBODSYS)` holds nowhere —
  ZERO findings, never one. A collapse reports only when some row fires.
python_source: PLAN-present-empty-column-fold (2026-10-06), the sensitivity arm of phase 3 — an inline rule; no shipped rule opts in
rule:
  id: c7-collapse-residual-false
  Core: {Id: C7-COLLAPSE-RFALSE}
  Description: "A coded AEBODSYS needs its AEBDSYCD."
  Sensitivity: Record
  Executability: Fully Executable
  Scope:
    Domains: {Include: [AE]}
  Check:
    expression: 'not empty(AEBODSYS) and empty(AEBDSYCD)'
  Outcome:
    Message: AEBDSYCD is not populated (per record).
    Message_Folded: AEBDSYCD is not populated on any record of the dataset.
    Output_Variables: [AEBDSYCD]
datasets:
  AE:
    row_key: [STUDYID, USUBJID, AESEQ]
    rows:
      - {STUDYID: S1, DOMAIN: AE, USUBJID: '001', AESEQ: 1, AEBODSYS: '', AEBDSYCD: ''}
      - {STUDYID: S1, DOMAIN: AE, USUBJID: '002', AESEQ: 1, AEBODSYS: '', AEBDSYCD: ''}
config:
  standard: sdtmig
  standard_version: '3.4'
expected_status: EXECUTED
expected_violations: []
expected_errors: []
