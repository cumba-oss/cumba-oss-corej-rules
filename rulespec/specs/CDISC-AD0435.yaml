name: CDISC-AD0435
kind: rule
description: |
  Wave A5 port — T1a PlainSimple.
  CDISC-AD0435: On a given record, ATPT is populated and ATPTN is not populated.
  Record-data rule scoped to BASIC DATA STRUCTURE (+ MD variants) and
  OCCURRENCE DATA STRUCTURE (+ MD variants); simple non_empty + empty pair.
python_source: rules-adamig-1-3.json (CDISC-AD0435)
rule:
  coreId: CDISC-AD0435
datasets:
  ADLB:
    row_key: [STUDYID, USUBJID, PARAMCD, AVISITN]
    column_types:
      AVISITN: LONG
    rows:
      - {STUDYID: S1, USUBJID: '001', PARAMCD: 'HGB', AVISITN: 1, ATPT: 'PREDOSE', ATPTN: '1'}  # ok
      - {STUDYID: S1, USUBJID: '002', PARAMCD: 'HGB', AVISITN: 1, ATPT: 'PREDOSE', ATPTN: ''}   # bad — ATPT populated, ATPTN empty
config:
  standard: adamig
  standard_version: '1.3'
library_mocks:
  classes:
    basic data structure: [ADLB]
expected_violations:
  - rule_id: CDISC-AD0435
    dataset: ADLB
    row_key: {STUDYID: S1, USUBJID: '002', PARAMCD: 'HGB', AVISITN: 1}
    status: SUCCESS
    output_variables:
      ATPT: 'PREDOSE'
      ATPTN: null
expected_errors: []
