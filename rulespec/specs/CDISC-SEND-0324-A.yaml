name: CDISC-SEND-0324-A
kind: rule
description: |
  The above-limit half of SEND324, minted as the R-5.25 split sibling CDISC-SEND-0324-A
  (top-level-or board wave 1, 2026-09-12): PCORRES > PCULOQ with PCSTRESC not 'ALQ'. The
  model-permissible PCULOQ dependence is this half's own ExecutabilityHint, and its
  Output_Variables carry PCULOQ but not PCLLOQ — the union was the mis-attribution the
  split removes. Same datasets as the parent's spec, so the two specs together pin the
  discriminator. Rows: 001 below PCLLOQ, wrong token — the PARENT's state, must NOT fire
  here; 004 above PCULOQ with token 'BLQ' instead of 'ALQ' (fires); everything else silent.
python_source: rules-cdisc-sendig-3-1-1.json (CDISC-SEND-0324-A, minted 2026-09-12)
rule:
  coreId: CDISC-SEND-0324-A
datasets:
  PC:
    row_key: [STUDYID, USUBJID, PCSEQ]
    rows:
      - {STUDYID: S1, USUBJID: '001', PCSEQ: 1, PCORRES: '2.5', PCLLOQ: 5, PCULOQ: 100, PCSTRESC: '2.5'}
      - {STUDYID: S1, USUBJID: '002', PCSEQ: 1, PCORRES: '3.1', PCLLOQ: 5, PCULOQ: 100, PCSTRESC: 'BLQ'}
      - {STUDYID: S1, USUBJID: '003', PCSEQ: 1, PCORRES: 'BLQ', PCLLOQ: 5, PCULOQ: 100, PCSTRESC: 'BLQ'}
      - {STUDYID: S1, USUBJID: '004', PCSEQ: 1, PCORRES: '250', PCLLOQ: 5, PCULOQ: 100, PCSTRESC: 'BLQ'}
      - {STUDYID: S1, USUBJID: '005', PCSEQ: 1, PCORRES: '50', PCLLOQ: 5, PCULOQ: 100, PCSTRESC: '50'}
      - {STUDYID: S1, USUBJID: '006', PCSEQ: 1, PCORRES: '2.5', PCLLOQ: null, PCULOQ: null, PCSTRESC: '2.5'}
config:
  standard: sendig
  standard_version: '3.1.1'
expected_violations:
  - rule_id: CDISC-SEND-0324-A
    dataset: PC
    row_key: {STUDYID: S1, USUBJID: '004', PCSEQ: 1}
    status: SUCCESS
    output_variables:
      PCSTRESC: BLQ
      PCORRES: '250'
      PCULOQ: '100'
expected_errors: []
