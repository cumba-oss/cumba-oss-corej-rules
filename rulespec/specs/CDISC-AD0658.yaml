name: CDISC-AD0658
kind: rule
description: |
  Wave A8 port — T1a PlainSimple.
  CDISC-AD0658: NCAXFN is present with a value other than 1 or null (ADNCA v1.0).
  Record-data rule scoped to BASIC DATA STRUCTURE; non_empty + not_equal_to 1 (numeric).
python_source: rules-adamig-1-3.json (CDISC-AD0658)
rule:
  coreId: CDISC-AD0658
datasets:
  ADNCA:
    row_key: [STUDYID, USUBJID, PARAMCD, AVISITN]
    column_types:
      AVISITN: LONG
      NCAXFN: LONG
      NFRLT: DOUBLE
      AFRLT: DOUBLE
    rows:
      - {STUDYID: S1, USUBJID: '001', PARAMCD: HGB, AVISITN: 1, NCAXFN: 1, NFRLT: 0.0, AFRLT: 0.0}    # ok
      - {STUDYID: S1, USUBJID: '002', PARAMCD: HGB, AVISITN: 1, NCAXFN: 2, NFRLT: 0.0, AFRLT: 0.0}    # bad
config:
  standard: adamig
  standard_version: '1.3'
library_mocks:
  classes:
    basic data structure: [ADNCA]
expected_violations:
  - rule_id: CDISC-AD0658
    dataset: ADNCA
    row_key: {AVISITN: 1, PARAMCD: HGB, STUDYID: S1, USUBJID: '002'}
    status: SUCCESS
    output_variables:
      NCAXFN: '2'
expected_errors: []
