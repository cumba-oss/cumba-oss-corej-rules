name: CDISC-CG0235
kind: rule
description: |
  Wave 11 port - --ENTPT < --DTC but --ENRTPT not in [BEFORE,COINCIDENT,ONGOING,AFTER,UNKNOWN]. Covers harder plain bucket:
  complex operators (is_inconsistent_across_dataset, is_not_unique_set,
  target_is_not_sorted_by, inconsistent_enumerated_columns) or multi-leaf
  composite checks that Waves 8-10 did not reach.
python_source: rules-sdtmig-3-4.json (CORE-000572)
rule:
  coreId: CDISC-CG0235
datasets:
  LB:
    row_key: [STUDYID, USUBJID, LBSEQ]
    rows:
      - {STUDYID: S1, DOMAIN: LB, USUBJID: '001', LBSEQ: 1, LBENTPT: '2026-01-01', LBENRTPT: BEFORE, LBDTC: '2026-01-05'}
      - {STUDYID: S1, DOMAIN: LB, USUBJID: '002', LBSEQ: 2, LBENTPT: '2026-01-01', LBENRTPT: OTHER, LBDTC: '2026-01-05'}
config:
  standard: sdtmig
  standard_version: '3.4'
library_mocks:
  classes:
    findings: [LB]
expected_violations:
  - rule_id: CDISC-CG0235
    dataset: LB
    row_key: {LBSEQ: 2, STUDYID: S1, USUBJID: '002'}
    status: SUCCESS
    output_variables:
      LBDTC: '2026-01-05'
      LBENRTPT: OTHER
      LBENTPT: '2026-01-01'
expected_errors: []
