name: CDISC-AD0084
kind: rule
description: |
  EC-8 (P7) — CDISC-AD0084 authored with `row_max` (a registry function since wave 3 of the
  operation→function programme, PLAN-per-row-functions).
  TRTEDT must equal the maximum of all TRxxEDT (xx = 01-99) variables on the record.
  `row_max(name_pattern="^TR(0[1-9]|[1-9][0-9])EDT$")` reduces the matched TRxxEDT columns to
  the per-row maximum ($trxx_max), skipping blanks; the Check fires when TRTEDT is populated,
  $trxx_max is populated, and TRTEDT != $trxx_max. The values here are CHAR ISO dates, so they
  rank as text under the date rule (a value ranks by its own type; same precision, so the
  calendar and text orders agree).
    row 001  TRTEDT=2026-03-01, max(TRxxEDT)=2026-03-01  -> equal, no fire
    row 002  TRTEDT=2026-02-01, max(TRxxEDT)=2026-03-01  -> not equal, fires
    row 003  TRTEDT='' (guard), no fire
    row 004  no TRxxEDT populated -> $trxx_max empty (guard), no fire
python_source: rules-adamig-1-3.json (CDISC-AD0084)
rule:
  coreId: CDISC-AD0084
datasets:
  ADSL:
    row_key: [STUDYID, USUBJID]
    rows:
      - {STUDYID: S1, USUBJID: '001', TRTEDT: '2026-03-01', TR01EDT: '2026-01-15', TR02EDT: '2026-03-01', TR03EDT: '', TR04EDT: '', TR05EDT: ''}
      - {STUDYID: S1, USUBJID: '002', TRTEDT: '2026-02-01', TR01EDT: '2026-01-15', TR02EDT: '2026-03-01', TR03EDT: '', TR04EDT: '', TR05EDT: ''}
      - {STUDYID: S1, USUBJID: '003', TRTEDT: '', TR01EDT: '2026-01-15', TR02EDT: '2026-03-01', TR03EDT: '', TR04EDT: '', TR05EDT: ''}
      - {STUDYID: S1, USUBJID: '004', TRTEDT: '2026-02-01', TR01EDT: '', TR02EDT: '', TR03EDT: '', TR04EDT: '', TR05EDT: ''}
config:
  standard: adamig
  standard_version: '1.3'
library_mocks:
  classes:
    subject level analysis dataset: [ADSL]
expected_violations:
  - rule_id: CDISC-AD0084
    dataset: ADSL
    row_key: {STUDYID: S1, USUBJID: '002'}
    status: SUCCESS
    output_variables:
      $trxx_max: '2026-03-01'
      TRTEDT: '2026-02-01'
expected_errors: []
