name: CDISC-CG0421
kind: rule
description: |
  Wave 11 port - --OCCUR=N but --ENRF populated. Covers harder plain bucket:
  complex operators (is_inconsistent_across_dataset, is_not_unique_set,
  target_is_not_sorted_by, inconsistent_enumerated_columns) or multi-leaf
  composite checks that Waves 8-10 did not reach.
python_source: rules-sdtmig-3-4.json (CORE-000241)
rule:
  coreId: CDISC-CG0421
datasets:
  CM:
    row_key: [STUDYID, USUBJID, CMSEQ]
    rows:
      - {STUDYID: S1, DOMAIN: CM, USUBJID: '001', CMSEQ: 1, CMOCCUR: Y, CMENRF: AFTER}
      - {STUDYID: S1, DOMAIN: CM, USUBJID: '002', CMSEQ: 2, CMOCCUR: N, CMENRF: AFTER}
config:
  standard: sdtmig
  standard_version: '3.4'
library_mocks:
  classes:
    interventions: [CM]
expected_violations:
  - rule_id: CDISC-CG0421
    dataset: CM
    row_key: {CMSEQ: 2, STUDYID: S1, USUBJID: '002'}
    status: SUCCESS
    output_variables:
      CMENRF: AFTER
      CMOCCUR: N
expected_errors: []
