name: CDISC-CG0273
kind: rule
description: |
  Record half of the granularity split (PLAN-split-mixed-granularity-rules.md).
  CDISC-CG0273: when HLTSUBJI=N, the TDIGRP record's TSVAL must be populated.
  The TDIGRP row is present with an empty TSVAL, so the rule fires and pins
  that row -- the dataset-absence case belongs to CDISC-CG0273-A.
  Java-canonical output_variables: the Java lane resolves the shipped native rules/
  entry, whose inlined operation surfaces the group key (STUDYID) rather than the
  $-operation reference Python reports from rules-legacy. Rows and statuses agree.
  Pre-existing divergence -- see the baseline entry.
python_source: rules-cdisc-sdtmig-3-3.json (CDISC-CG0273)
rule:
  coreId: CDISC-CG0273
datasets:
  TS:
    row_key: [STUDYID, TSSEQ]
    rows:
      - {STUDYID: S1, DOMAIN: TS, TSSEQ: 1, TSPARMCD: HLTSUBJI, TSVAL: N}
      - {STUDYID: S1, DOMAIN: TS, TSSEQ: 2, TSPARMCD: TDIGRP, TSVAL: ''}
config:
  standard: sdtmig
  standard_version: '3.3'
library_mocks:
  classes:
    trial-design: [TS]
expected_violations:
  - rule_id: CDISC-CG0273
    dataset: TS
    row_key: {STUDYID: S1, TSSEQ: 2}
    status: SUCCESS
    output_variables:
      $HLTSUBJI_N: '1'
      TSPARMCD: TDIGRP
      TSVAL:
expected_errors: []
