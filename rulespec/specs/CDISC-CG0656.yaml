name: CDISC-CG0656
kind: rule
description: |
  Wave 19 port - `distinct` Operation. Primary SV checked
  against distinct(TV.VISITNUM).
python_source: rules-sdtmig-3-4.json (CORE-000040)
rule:
  coreId: CDISC-CG0656
datasets:
  SV:
    row_key: [STUDYID, USUBJID, VISITNUM]
    column_types:
      VISITNUM: LONG
    rows:
      - {STUDYID: S1, DOMAIN: SV, USUBJID: '001', VISITNUM: 1, SVPRESP: Y}
      - {STUDYID: S1, DOMAIN: SV, USUBJID: '002', VISITNUM: 1, SVPRESP: ''}
  TV:
    row_key: [STUDYID, VISITNUM]
    column_types:
      VISITNUM: LONG
    rows:
      - {STUDYID: S1, DOMAIN: TV, VISITNUM: 1, VISIT: Screening, ARMCD: TRT01}
config:
  standard: sdtmig
  standard_version: '3.4'
library_mocks:
  classes:
    special-purpose: [SV]
    trial design: [TV]
# PLAN-message-folded-corpus-alignment (2026-10-07): the trigger column is blank or absent on every
# fixture row, so the rule now reports ONE dataset-level finding (Outcome.Message_Folded, D5) where
# it reported per row; the per-row rows were replaced by the collapsed one (anchored at the first
# firing row, columns listed by name).
expected_violations:
- rule_id: CDISC-CG0656
  dataset: SV
  row_key: {STUDYID: S1, USUBJID: '002', VISITNUM: 1}
  status: SUCCESS
  output_variables: {$tv_visitnum: '[1]'}
  name_only: [VISITNUM]
expected_errors: []
