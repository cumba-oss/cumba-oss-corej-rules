name: CDISC-CG0392
kind: rule
description: |
  Wave 6 port — AESHOSP must be Y or N when populated.
python_source: rules-sdtmig-3-4.json (CORE-000127)
rule:
  coreId: CDISC-CG0392
datasets:
  AE:
    row_key: [STUDYID, USUBJID, AESEQ]
    rows:
      - {STUDYID: S1, DOMAIN: AE, USUBJID: '001', AESEQ: 1, AESHOSP: Y}          # ok
      - {STUDYID: S1, DOMAIN: AE, USUBJID: '002', AESEQ: 1, AESHOSP: N}          # ok
      - {STUDYID: S1, DOMAIN: AE, USUBJID: '003', AESEQ: 1, AESHOSP: ''}         # empty → not flagged
      - {STUDYID: S1, DOMAIN: AE, USUBJID: '004', AESEQ: 1, AESHOSP: Z}          # bad (not Y/N)
config:
  standard: sdtmig
  standard_version: '3.4'
library_mocks:
  classes:
    events: [AE]
expected_violations:
  - rule_id: CDISC-CG0392
    dataset: AE
    row_key: {AESEQ: 1, STUDYID: S1, USUBJID: '004'}
    status: SUCCESS
    output_variables:
      AESHOSP: Z
expected_errors: []
