name: CDISC-CG0368
kind: rule
description: |
  Side-batch port (Fix #15 bucket) - DM dataset missing (engine inventory has TS only). Domain
  Presence Check rule with no Outcome.Output_Variables; Fix #15 infers
  the Check leaf names but extractOutputValues drops dataset-name leaves
  (no matching column), so the canonical violation has empty
  output_variables - which the paragraph below shows this spec did not actually assert until
  2026-08-12. (The "matching Python's behaviour after the adapter strips 'Not in dataset'
  sentinels, Finding #10" clause is the part that was wrong: the expectation carried
  source_dataset_name.)

  EC-55 (2026-08-12): re-baselined JAVA-CANONICAL. The expectation used to carry Python's
  synthetic `source_dataset_name: TS`, which is not part of the Check and does not identify
  anything the `dataset` field does not - the entry's own 2026-06-23 note said so. coreJ emits
  an empty map, measured from a run, and that is now what this spec asserts. Detection is
  unchanged (same dataset, same row_key, same status); no engine change.
python_source: rules-sdtmig-3-4.json (CORE-000581)
rule:
  coreId: CDISC-CG0368
datasets:
  TS:
    row_key: [STUDYID]
    rows:
      - {STUDYID: S1, DOMAIN: TS}
config:
  standard: sdtmig
  standard_version: '3.4'
library_mocks:
  classes:
    trial design: [TS]
expected_violations:
  - rule_id: CDISC-CG0368
    dataset: TS
    row_key: {STUDYID: S1}
    status: SUCCESS
    output_variables: {}
expected_errors: []
