name: CDISC-CG0193
kind: rule
description: |
  Record-Data. CDISC-CG0193: MB record with MBTESTCD=ORGANISM, MBSTRESC not 'NO GROWTH',
  MBMETHOD not 'GRAM STAIN', and MBRESCAT empty. The row below satisfies every leaf
  (MBRESCAT blank), so the rule fires.
python_source: rules-sdtmig-3-2.json (CORE-000332)
rule:
  coreId: CDISC-CG0193
datasets:
  MB:
    row_key: [STUDYID, USUBJID, MBSEQ]
    rows:
      - {STUDYID: S1, DOMAIN: MB, USUBJID: '001', MBSEQ: 1, MBTESTCD: ORGANISM, MBSTRESC: E. COLI, MBMETHOD: CULTURE, MBRESCAT: ''}
config:
  standard: sdtmig
  standard_version: '3.2'
library_mocks:
  classes:
    findings: [MB]
# PLAN-message-folded-corpus-alignment (2026-10-07): the trigger column is blank or absent on every
# fixture row, so the rule now reports ONE dataset-level finding (Outcome.Message_Folded, D5) where
# it reported per row; the per-row rows were replaced by the collapsed one (anchored at the first
# firing row, columns listed by name).
expected_violations:
- rule_id: CDISC-CG0193
  dataset: MB
  row_key: {MBSEQ: 1, STUDYID: S1, USUBJID: '001'}
  status: SUCCESS
  output_variables: {}
  name_only: [MBMETHOD, MBRESCAT, MBSTRESC, MBTESTCD]
expected_errors: []
