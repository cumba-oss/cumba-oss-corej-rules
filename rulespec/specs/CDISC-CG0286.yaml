name: CDISC-CG0286
kind: rule
description: |
  Record-Data `invalid_date`. TSVAL for TSPARMCD=SENDTC must be a valid
  ISO-8601 date. The SENDTC row carries an invalid date, so the rule fires.
python_source: rules-sdtmig-3-3.json (CORE-000506)
rule:
  coreId: CDISC-CG0286
datasets:
  TS:
    row_key: [STUDYID, TSPARMCD]
    rows:
      - {STUDYID: S1, DOMAIN: TS, TSPARMCD: SSTDTC, TSVAL: '2026-01-01'}      # ok (not SENDTC)
      - {STUDYID: S1, DOMAIN: TS, TSPARMCD: SENDTC, TSVAL: not-a-date}        # bad
config:
  standard: sdtmig
  standard_version: '3.3'
library_mocks:
  classes:
    trial design: [TS]
expected_violations:
  - rule_id: CDISC-CG0286
    dataset: TS
    row_key: {STUDYID: S1, TSPARMCD: SENDTC}
    status: SUCCESS
    output_variables:
      TSPARMCD: SENDTC
      TSVAL: not-a-date
expected_errors: []
