name: CDISC-CG0035
kind: rule
description: |
  Wave 19 port - `distinct` Operation. Primary SV checked
  against distinct(TV.VISITNUM).
python_source: rules-sdtmig-3-4.json (CORE-000361)
rule:
  coreId: CDISC-CG0035
datasets:
  SV:
    row_key: [STUDYID, USUBJID, VISITNUM]
    column_types:
      VISITNUM: LONG
    rows:
      - {STUDYID: S1, DOMAIN: SV, USUBJID: '001', VISITNUM: 1, VISIT: Screening}
      - {STUDYID: S1, DOMAIN: SV, USUBJID: '002', VISITNUM: 1, VISIT: Baseline}
      - {STUDYID: S1, DOMAIN: SV, USUBJID: '003', VISITNUM: 2, VISIT: Week 1}
  TV:
    row_key: [STUDYID, VISITNUM]
    column_types:
      VISITNUM: LONG
    rows:
      - {STUDYID: S1, DOMAIN: TV, VISITNUM: 1, VISIT: Screening, ARMCD: TRT01}
      - {STUDYID: S1, DOMAIN: TV, VISITNUM: 2, VISIT: Week 1, ARMCD: TRT01}
config:
  standard: sdtmig
  standard_version: '3.4'
library_mocks:
  classes:
    special-purpose: [SV]
    trial design: [TV]
expected_violations:
  - rule_id: CDISC-CG0035
    dataset: SV
    row_key: {STUDYID: S1, USUBJID: '001', VISITNUM: 1}
    status: SUCCESS
    output_variables:
      $tv_visitnum: '[1, 2]'
      VISIT: Screening
      VISITNUM: '1'
  - rule_id: CDISC-CG0035
    dataset: SV
    row_key: {STUDYID: S1, USUBJID: '002', VISITNUM: 1}
    status: SUCCESS
    output_variables:
      $tv_visitnum: '[1, 2]'
      VISIT: Baseline
      VISITNUM: '1'
expected_errors: []
