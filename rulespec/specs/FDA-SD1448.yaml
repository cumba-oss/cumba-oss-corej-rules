name: FDA-SD1448
kind: rule
description: |
  Wave 11 port - --STRESC non-numeric but --STRESN non-empty. Covers harder plain bucket:
  complex operators (is_inconsistent_across_dataset, is_not_unique_set,
  target_is_not_sorted_by, inconsistent_enumerated_columns) or multi-leaf
  composite checks that Waves 8-10 did not reach.
python_source: rules-sdtmig-3-4.json (CORE-000732)
rule:
  coreId: FDA-SD1448
datasets:
  LB:
    row_key: [STUDYID, USUBJID, LBSEQ]
    rows:
      - {STUDYID: S1, DOMAIN: LB, USUBJID: '001', LBSEQ: 1, LBSTRESC: '5.0', LBSTRESN: '5.0'}
      - {STUDYID: S1, DOMAIN: LB, USUBJID: '002', LBSEQ: 2, LBSTRESC: ABOVE, LBSTRESN: '5.0'}
config:
  standard: sdtmig
  standard_version: '3.4'
library_mocks:
  classes:
    findings: [LB]
expected_violations:
  - rule_id: FDA-SD1448
    dataset: LB
    row_key: {LBSEQ: 2, STUDYID: S1, USUBJID: '002'}
    status: SUCCESS
    output_variables:
      LBSTRESC: ABOVE
      LBSTRESN: '5.0'
expected_errors: []
