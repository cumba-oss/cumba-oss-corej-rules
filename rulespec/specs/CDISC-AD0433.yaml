name: CDISC-AD0433
kind: rule
description: |
  Wave A5 port — T1a PlainSimple.
  CDISC-AD0433: On a given record, ASPER is populated and ASPERC is not populated.
  Record-data rule scoped to BASIC DATA STRUCTURE (+ MD variants) and
  OCCURRENCE DATA STRUCTURE (+ MD variants); simple non_empty + empty pair.
python_source: rules-adamig-1-3.json (CDISC-AD0433)
rule:
  coreId: CDISC-AD0433
datasets:
  ADLB:
    row_key: [STUDYID, USUBJID, PARAMCD, AVISITN]
    column_types:
      AVISITN: LONG
    rows:
      - {STUDYID: S1, USUBJID: '001', PARAMCD: 'HGB', AVISITN: 1, ASPER: '1', ASPERC: 'SUBPER1'}  # ok
      - {STUDYID: S1, USUBJID: '002', PARAMCD: 'HGB', AVISITN: 1, ASPER: '1', ASPERC: ''}         # bad — ASPER populated, ASPERC empty
config:
  standard: adamig
  standard_version: '1.3'
library_mocks:
  classes:
    basic data structure: [ADLB]
expected_violations:
  - rule_id: CDISC-AD0433
    dataset: ADLB
    row_key: {STUDYID: S1, USUBJID: '002', PARAMCD: 'HGB', AVISITN: 1}
    status: SUCCESS
    output_variables:
      ASPER: '1'
      ASPERC: null
expected_errors: []
