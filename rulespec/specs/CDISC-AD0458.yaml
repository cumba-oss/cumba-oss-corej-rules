name: CDISC-AD0458
kind: rule
description: |
  Wave A6 port — T1a PlainSimple.
  CDISC-AD0458: On a given record, TRTP is populated and TRTPN is not populated.
  Record-data rule scoped to BASIC DATA STRUCTURE, MEDICAL DEVICE BASIC DATA STRUCTURE, OCCURRENCE DATA STRUCTURE, MEDICAL DEVICE OCCURRENCE DATA STRUCTURE; non_empty + empty pair; literal column names per star-as-literal convention.
python_source: rules-adamig-1-3.json (CDISC-AD0458)
rule:
  coreId: CDISC-AD0458
datasets:
  ADLB:
    row_key: [STUDYID, USUBJID, PARAMCD]
    rows:
      - {STUDYID: S1, USUBJID: '001', PARAMCD: 'HGB', TRTP: '', TRTPN: ''}      # ok
      - {STUDYID: S1, USUBJID: '002', PARAMCD: 'HGB', TRTP: 'X', TRTPN: ''}      # bad
config:
  standard: adamig
  standard_version: '1.3'
library_mocks:
  classes:
    basic data structure: [ADLB]
expected_violations:
  - rule_id: CDISC-AD0458
    dataset: ADLB
    row_key: {PARAMCD: HGB, STUDYID: S1, USUBJID: '002'}
    status: SUCCESS
    output_variables:
      TRTP: 'X'
      TRTPN: null
expected_errors: []
