name: CDISC-CG0140
kind: rule
description: |
  Record-Data + Match_Datasets port. CORE-000337: when multiple races are populated in
  SUPPDM (QNAM starts with RACE, suffix-1 alnum, suffix-3 not OTH) the matching DM.RACE
  must equal MULTIPLE. SUPPDM joins DM on USUBJID; DM.RACE=ASIAN (not MULTIPLE) and
  QNAM=RACE1 satisfies all leaves, so the rule fires.
python_source: rules-sdtmig-3-4.json (CORE-000337)
rule:
  coreId: CDISC-CG0140
datasets:
  DM:
    row_key: [STUDYID, USUBJID]
    rows:
      - {STUDYID: S1, DOMAIN: DM, USUBJID: '001', RACE: ASIAN}
  SUPPDM:
    row_key: [STUDYID, USUBJID, IDVAR, IDVARVAL, QNAM]
    rows:
      - {STUDYID: S1, RDOMAIN: DM, USUBJID: '001', IDVAR: '', IDVARVAL: '', QNAM: RACE1, QLABEL: Race 1, QVAL: WHITE}
config:
  standard: sdtmig
  standard_version: '3.4'
library_mocks:
  classes:
    special-purpose: [DM]
    relationship: [SUPPDM]
expected_violations:
  - rule_id: CDISC-CG0140
    dataset: SUPPDM
    row_key: {IDVAR: '', IDVARVAL: '', QNAM: RACE1, STUDYID: S1, USUBJID: '001'}
    status: SUCCESS
    output_variables:
      DM.RACE: ASIAN
      QNAM: RACE1
expected_errors: []
