name: CDISC-CG0536
kind: rule
description: |
  Wave 15 port - non-wildcard plain Record-Data rule. (CORE-000213)
  Sensitivity is Group over [USUBJID, DSSCAT, EPOCH]: the offence is "more than one
  DISPOSITION EVENT record per subject per DSSCAT per EPOCH", so a group of N duplicate
  records yields ONE finding, keyed on the group's first row — not N. Subject 001
  contributes a RANDOMIZATION/SCREENING group and subject 002 a FOLLOW-UP/TREATMENT group,
  so two distinct groups fire and the per-group collapse is observable rather than assumed.
  Expected is Java-canonical: Python additionally decorates output_variables with the
  grouping variables (see parity-diff-baseline.json, same family as CORE-000251).
python_source: rules-sdtmig-3-4.json (CORE-000213)
rule:
  coreId: CDISC-CG0536
datasets:
  DS:
    row_key: [STUDYID, USUBJID, DSSEQ]
    rows:
      - {STUDYID: S1, DOMAIN: DS, USUBJID: '001', DSSEQ: 1, DSCAT: DISPOSITION EVENT, DSSCAT: RANDOMIZATION, EPOCH: SCREENING}
      - {STUDYID: S1, DOMAIN: DS, USUBJID: '001', DSSEQ: 2, DSCAT: DISPOSITION EVENT, DSSCAT: RANDOMIZATION, EPOCH: SCREENING}
      # Subject 002 — a second, independent duplicate group → a second group finding
      - {STUDYID: S1, DOMAIN: DS, USUBJID: '002', DSSEQ: 1, DSCAT: DISPOSITION EVENT, DSSCAT: FOLLOW-UP, EPOCH: TREATMENT}
      - {STUDYID: S1, DOMAIN: DS, USUBJID: '002', DSSEQ: 2, DSCAT: DISPOSITION EVENT, DSSCAT: FOLLOW-UP, EPOCH: TREATMENT}
config:
  standard: sdtmig
  standard_version: '3.4'
library_mocks:
  classes:
    events: [DS]
expected_violations:
  - rule_id: CDISC-CG0536
    dataset: DS
    row_key: {DSSEQ: 1, STUDYID: S1, USUBJID: '001'}
    status: SUCCESS
    output_variables:
      DSCAT: DISPOSITION EVENT
      DSSCAT: RANDOMIZATION
      EPOCH: SCREENING
  - rule_id: CDISC-CG0536
    dataset: DS
    row_key: {DSSEQ: 1, STUDYID: S1, USUBJID: '002'}
    status: SUCCESS
    output_variables:
      DSCAT: DISPOSITION EVENT
      DSSCAT: FOLLOW-UP
      EPOCH: TREATMENT
expected_errors: []
