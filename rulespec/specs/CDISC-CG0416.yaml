name: CDISC-CG0416
kind: rule
description: |
  Record-Data. CDISC-CG0416: QLABEL length greater than 40 chars in a SUPP-- dataset.
  Resolve SUPP-- to SUPPDM; the QLABEL value below is 45 characters long so the
  longer_than 40 leaf holds and the rule fires.
python_source: rules-sdtmig-3-4.json (CORE-000222)
rule:
  coreId: CDISC-CG0416
datasets:
  SUPPDM:
    row_key: [STUDYID, USUBJID, IDVAR, IDVARVAL, QNAM]
    rows:
      - {STUDYID: S1, RDOMAIN: DM, USUBJID: '001', IDVAR: '', IDVARVAL: '', QNAM: RACEOTH, QLABEL: This label is intentionally longer than forty, QVAL: OTHER}
config:
  standard: sdtmig
  standard_version: '3.4'
library_mocks:
  classes:
    relationship: [SUPPDM]
expected_violations:
  - rule_id: CDISC-CG0416
    dataset: SUPPDM
    row_key: {IDVAR: '', IDVARVAL: '', QNAM: RACEOTH, STUDYID: S1, USUBJID: '001'}
    status: SUCCESS
    output_variables:
      IDVAR:
      IDVARVAL:
      QLABEL: This label is intentionally longer than forty
      QNAM: RACEOTH
expected_errors: []
