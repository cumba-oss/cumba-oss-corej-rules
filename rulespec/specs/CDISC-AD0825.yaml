name: CDISC-AD0825
kind: rule
description: |
  Wave A10 port — T1a PlainSimple.
  CDISC-AD0825: FLGREAS is populated and FLGREASC is not populated.
  Record-data rule scoped to BASIC DATA STRUCTURE; non_empty + empty pair.
python_source: rules-adamig-1-3.json (CDISC-AD0825)
rule:
  coreId: CDISC-AD0825
datasets:
  ADLB:
    row_key: [STUDYID, USUBJID, PARAMCD]
    rows:
      - {STUDYID: S1, USUBJID: '001', PARAMCD: 'HGB', FLGREAS: '', FLGREASC: ''}      # ok
      - {STUDYID: S1, USUBJID: '002', PARAMCD: 'HGB', FLGREAS: 'X', FLGREASC: ''}     # bad
config:
  standard: adamig
  standard_version: '1.3'
library_mocks:
  classes:
    basic data structure: [ADLB]
expected_violations:
  - rule_id: CDISC-AD0825
    dataset: ADLB
    row_key: {PARAMCD: HGB, STUDYID: S1, USUBJID: '002'}
    status: SUCCESS
    output_variables:
      FLGREAS: 'X'
      FLGREASC: null
expected_errors: []
