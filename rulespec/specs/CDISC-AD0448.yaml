name: CDISC-AD0448
kind: rule
description: |
  Wave A5 port — T1a PlainSimple.
  CDISC-AD0448: On a given record, DTHCAUS is populated and DTHCAUSN is not populated.
  Record-data rule scoped to SUBJECT LEVEL ANALYSIS DATASET (ADSL);
  simple non_empty + empty pair.
python_source: rules-adamig-1-3.json (CDISC-AD0448)
rule:
  coreId: CDISC-AD0448
datasets:
  ADSL:
    row_key: [STUDYID, USUBJID]
    rows:
      - {STUDYID: S1, USUBJID: '001', DTHCAUS: 'CARDIAC', DTHCAUSN: '1'}  # ok
      - {STUDYID: S1, USUBJID: '002', DTHCAUS: 'CARDIAC', DTHCAUSN: ''}   # bad — DTHCAUS populated, DTHCAUSN empty
config:
  standard: adamig
  standard_version: '1.3'
library_mocks:
  classes:
    subject level analysis dataset: [ADSL]
expected_violations:
  - rule_id: CDISC-AD0448
    dataset: ADSL
    row_key: {STUDYID: S1, USUBJID: '002'}
    status: SUCCESS
    output_variables:
      DTHCAUS: 'CARDIAC'
      DTHCAUSN: null
expected_errors: []
