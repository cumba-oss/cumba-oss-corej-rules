name: CDISC-AD0699
kind: rule
description: |
  CDISC-AD0699: Medical Device BDS — when BASETYPE is not present,
  BNRIND must equal ANRIND at the baseline record (ABLFL='Y') for each
  (USUBJID, PARAMCD, SPDEVID) group.
  Pins the filter-honouring `max` Operation (filter ABLFL='Y') with a
  three-group design: (a) discriminating group 001/D1 has a
  post-baseline ANRIND lexicographically greater than the baseline
  ANRIND ('NORMAL' > 'LOW') and BNRIND equal to the baseline ANRIND, so
  a filter-ignoring max would false-fire there; (b) subject 002 carries
  the same PARAMCD on two devices — D1 clean, D2 violating — proving
  SPDEVID participates in the grouping; (c) groups with no ABLFL='Y'
  row yield a missing $-value: not_equal_to fires on populated-BNRIND
  rows (subject 003) and the non_empty guard keeps empty-BNRIND rows
  quiet (subject 004).
python_source: rules-adamig-1-3.json (CDISC-AD0699)
rule:
  coreId: CDISC-AD0699
datasets:
  ADLB:
    row_key: [STUDYID, USUBJID, SPDEVID, PARAMCD, AVISITN]
    column_types:
      AVISITN: LONG
    rows:
      # 001/D1/HGB — discriminating: post-baseline ANRIND NORMAL > baseline LOW, BNRIND = baseline ANRIND → ok
      - {STUDYID: S1, USUBJID: '001', SPDEVID: D1, PARAMCD: HGB, AVISITN: 0, ABLFL: Y, ANRIND: LOW, BNRIND: LOW}
      - {STUDYID: S1, USUBJID: '001', SPDEVID: D1, PARAMCD: HGB, AVISITN: 1, ABLFL: '', ANRIND: NORMAL, BNRIND: LOW}
      # 002/HGB on two devices — D1 clean ...
      - {STUDYID: S1, USUBJID: '002', SPDEVID: D1, PARAMCD: HGB, AVISITN: 0, ABLFL: Y, ANRIND: HIGH, BNRIND: HIGH}
      - {STUDYID: S1, USUBJID: '002', SPDEVID: D1, PARAMCD: HGB, AVISITN: 1, ABLFL: '', ANRIND: NORMAL, BNRIND: HIGH}
      # ... D2 violating: BNRIND LOW != baseline ANRIND NORMAL → bad (SPDEVID is in the group key)
      - {STUDYID: S1, USUBJID: '002', SPDEVID: D2, PARAMCD: HGB, AVISITN: 0, ABLFL: Y, ANRIND: NORMAL, BNRIND: NORMAL}
      - {STUDYID: S1, USUBJID: '002', SPDEVID: D2, PARAMCD: HGB, AVISITN: 1, ABLFL: '', ANRIND: LOW, BNRIND: LOW}          # bad
      # 003/D1/HGB — no ABLFL='Y' row, BNRIND populated → missing $-value, not_equal_to fires
      - {STUDYID: S1, USUBJID: '003', SPDEVID: D1, PARAMCD: HGB, AVISITN: 1, ABLFL: '', ANRIND: LOW, BNRIND: LOW}          # bad
      # 004/D1/HGB — no ABLFL='Y' row, BNRIND empty → blocked by the non_empty guard → ok
      - {STUDYID: S1, USUBJID: '004', SPDEVID: D1, PARAMCD: HGB, AVISITN: 1, ABLFL: '', ANRIND: LOW, BNRIND: ''}
config:
  standard: adamig
  standard_version: '1.3'
library_mocks:
  classes:
    medical device basic data structure: [ADLB]
expected_violations:
  - rule_id: CDISC-AD0699
    dataset: ADLB
    row_key: {AVISITN: 1, PARAMCD: HGB, SPDEVID: D1, STUDYID: S1, USUBJID: '003'}
    status: SUCCESS
    output_variables:
      $baseline_anrind: '.'
      ANRIND: LOW
      BNRIND: LOW
      PARAMCD: HGB
  - rule_id: CDISC-AD0699
    dataset: ADLB
    row_key: {AVISITN: 1, PARAMCD: HGB, SPDEVID: D2, STUDYID: S1, USUBJID: '002'}
    status: SUCCESS
    output_variables:
      $baseline_anrind: 'NORMAL'
      ANRIND: LOW
      BNRIND: LOW
      PARAMCD: HGB
expected_errors: []
