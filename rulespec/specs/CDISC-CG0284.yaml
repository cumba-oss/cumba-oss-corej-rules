name: CDISC-CG0284
kind: rule
description: |
  Record-Data. CORE-000587: in TS, when TSPARMCD='NARMS' the TSVAL must be an integer > 0.
  The TS row sets TSPARMCD=NARMS and TSVAL=0 so the less_than_or_equal_to 0 leaf fires.
python_source: rules-sdtmig-3-3.json (CORE-000587)
rule:
  coreId: CDISC-CG0284
datasets:
  TS:
    row_key: [STUDYID, TSPARMCD, TSSEQ]
    rows:
      - {STUDYID: S1, DOMAIN: TS, TSSEQ: 1, TSPARMCD: NARMS, TSVAL: 0}
config:
  standard: sdtmig
  standard_version: '3.3'
library_mocks:
  classes:
    trial-design: [TS]
expected_violations:
  - rule_id: CDISC-CG0284
    dataset: TS
    row_key: {STUDYID: S1, TSPARMCD: NARMS, TSSEQ: 1}
    status: SUCCESS
    output_variables:
      TSPARMCD: NARMS
      TSVAL: '0'
expected_errors: []
