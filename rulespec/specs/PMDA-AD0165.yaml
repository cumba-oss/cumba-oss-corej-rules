name: PMDA-AD0165
kind: rule
description: |
  Filter-on-max parity fixture.
  PMDA-AD0165: BDS - when BASETYPE is present and BTOXGR is populated,
  BTOXGR must equal ATOXGR at the baseline record (ABLFL='Y') for each
  (USUBJID, PARAMCD, BASETYPE) group. Uses Operation `max` on ATOXGR
  with filter ABLFL='Y', grouped by (USUBJID, PARAMCD, BASETYPE).
  Output_Variables are ATOXGR, BTOXGR, ABLFL.

  The data exercises the filter discriminatingly (the Python engine
  honours `filter` on `max`, matching Java) via three group kinds:
  - Subject 001: post-baseline ATOXGR ('GRADE 3') is strictly greater
    (lexicographically) than the ABLFL='Y' row's ATOXGR ('GRADE 2')
    while BTOXGR='GRADE 2' everywhere -> no violation. An engine that
    maxes over ALL rows (ignoring the filter) would falsely fire here -
    this is the regression trap.
  - Subject 002: BTOXGR ('GRADE 1') differs from the baseline ATOXGR
    ('GRADE 3') on a post-baseline row -> genuine violation.
  - Subject 003: no ABLFL='Y' row -> the $-operation value is missing
    for the group and `not_equal_to` fires on every row whose BTOXGR is
    populated (both engines agree: populated-vs-missing is unequal).
    The second row keeps BTOXGR empty, so the non_empty guard keeps it
    quiet.
python_source: rules-adamig-1-3.json (PMDA-AD0165)
rule:
  coreId: PMDA-AD0165
datasets:
  ADLB:
    row_key: [STUDYID, USUBJID, PARAMCD, BASETYPE, AVISITN]
    column_types:
      AVISITN: LONG
    rows:
      # Subject 001 HGB PRE - DISCRIMINATING: post-baseline ATOXGR='GRADE 3'
      # exceeds the ABLFL=Y row's ATOXGR='GRADE 2'; BTOXGR='GRADE 2'
      # everywhere -> no violation (an unfiltered max would compute
      # 'GRADE 3' and fire falsely).
      - {STUDYID: S1, USUBJID: '001', PARAMCD: HGB, BASETYPE: PRE, AVISITN: 0, ABLFL: Y, ATOXGR: GRADE 2, BTOXGR: GRADE 2}
      - {STUDYID: S1, USUBJID: '001', PARAMCD: HGB, BASETYPE: PRE, AVISITN: 1, ABLFL: '', ATOXGR: GRADE 3, BTOXGR: GRADE 2}
      # Subject 002 HGB PRE - genuine violation: baseline ATOXGR='GRADE 3'
      # but BTOXGR='GRADE 1' on the post-baseline row.
      - {STUDYID: S1, USUBJID: '002', PARAMCD: HGB, BASETYPE: PRE, AVISITN: 0, ABLFL: Y, ATOXGR: GRADE 3, BTOXGR: GRADE 3}
      - {STUDYID: S1, USUBJID: '002', PARAMCD: HGB, BASETYPE: PRE, AVISITN: 1, ABLFL: '', ATOXGR: GRADE 2, BTOXGR: GRADE 1}       # bad
      # Subject 003 HGB PRE - no ABLFL=Y row: $baseline_atoxgr is missing for
      # the group, so the populated-BTOXGR row fires; the empty-BTOXGR row is
      # kept quiet by the non_empty guard.
      - {STUDYID: S1, USUBJID: '003', PARAMCD: HGB, BASETYPE: PRE, AVISITN: 1, ABLFL: '', ATOXGR: GRADE 4, BTOXGR: GRADE 0}       # bad (missing $-value)
      - {STUDYID: S1, USUBJID: '003', PARAMCD: HGB, BASETYPE: PRE, AVISITN: 2, ABLFL: '', ATOXGR: GRADE 1, BTOXGR: ''}
config:
  standard: adamig
  standard_version: '1.3'
library_mocks:
  classes:
    basic data structure: [ADLB]
expected_violations:
  - rule_id: PMDA-AD0165
    dataset: ADLB
    row_key: {AVISITN: 1, BASETYPE: PRE, PARAMCD: HGB, STUDYID: S1, USUBJID: '002'}
    status: SUCCESS
    output_variables:
      $baseline_atoxgr: 'GRADE 3'
      ABLFL:
      ATOXGR: GRADE 2
      BTOXGR: GRADE 1
  - rule_id: PMDA-AD0165
    dataset: ADLB
    row_key: {AVISITN: 1, BASETYPE: PRE, PARAMCD: HGB, STUDYID: S1, USUBJID: '003'}
    status: SUCCESS
    output_variables:
      $baseline_atoxgr: '.'
      ABLFL:
      ATOXGR: GRADE 4
      BTOXGR: GRADE 0
expected_errors: []
