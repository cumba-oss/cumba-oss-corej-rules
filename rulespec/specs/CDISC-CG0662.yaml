name: CDISC-CG0662
kind: rule
description: |
  Wave 11 port - --SEQ not sorted by --STDTC ascending within USUBJID. Covers harder plain bucket:
  complex operators (is_inconsistent_across_dataset, is_not_unique_set,
  target_is_not_sorted_by, inconsistent_enumerated_columns) or multi-leaf
  composite checks that Waves 8-10 did not reach.
python_source: rules-sdtmig-3-4.json (CORE-000535)
rule:
  coreId: CDISC-CG0662
datasets:
  SE:
    row_key: [STUDYID, USUBJID, SESEQ]
    column_types:
      SESEQ: LONG
    rows:
      - {STUDYID: S1, DOMAIN: SE, USUBJID: '001', SESEQ: 1, SESTDTC: '2026-01-01'}
      - {STUDYID: S1, DOMAIN: SE, USUBJID: '001', SESEQ: 2, SESTDTC: '2025-12-01'}
config:
  standard: sdtmig
  standard_version: '3.2'
library_mocks:
  classes:
    special-purpose: [SE]
expected_violations:
  - rule_id: CDISC-CG0662
    dataset: SE
    row_key: {SESEQ: 1, STUDYID: S1, USUBJID: '001'}
    status: SUCCESS
    output_variables:
      SESTDTC: '2026-01-01'
  - rule_id: CDISC-CG0662
    dataset: SE
    row_key: {SESEQ: 2, STUDYID: S1, USUBJID: '001'}
    status: SUCCESS
    output_variables:
      SESTDTC: '2025-12-01'
expected_errors: []
