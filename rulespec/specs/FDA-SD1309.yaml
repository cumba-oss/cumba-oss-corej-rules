name: FDA-SD1309
kind: rule
description: |
  Record-Data + Operation (ungrouped `record_count`). The op counts
  rows where TSPARMCD=STYPE and TSVAL=INTERVENTIONAL. The check fires on the
  TRT row where that count >= 1 and TSVAL is empty.
  D15 / Fix #158 (2026-08-05) removed the `group: [TSGRPID]` block from this rule: the key
  related the wrong things (the operation counts one TS parameter while the Check fires on a
  different one), and with TSGRPID populated the target row's group held no trigger record, so
  the count was 0 and the rule was SILENTLY DEAD. The count is now dataset-wide. This spec's
  rows carry a CONSTANT TSGRPID, so the verdict is unchanged either way -- a constant group
  column and no group column are the same computation. What DID change is the reporting
  surface: TSGRPID was a derived Output_Variable only because it was a group key, so it no
  longer decorates the finding. That closed the EC-37 / Fix #127 Java-over-derivation gap for
  this spec, and its parity-diff-baseline.json entry was retired as HEALED.
python_source: rules-sdtmig-3-3.json (CORE-000468)
rule:
  coreId: FDA-SD1309
datasets:
  TS:
    row_key: [STUDYID, TSGRPID, TSPARMCD]
    rows:
      - {STUDYID: S1, DOMAIN: TS, TSGRPID: '1', TSPARMCD: STYPE, TSVAL: INTERVENTIONAL}
      - {STUDYID: S1, DOMAIN: TS, TSGRPID: '1', TSPARMCD: TRT, TSVAL: ''}
config:
  standard: sdtmig
  standard_version: '3.3'
library_mocks:
  classes:
    trial design: [TS]
expected_violations:
  - rule_id: FDA-SD1309
    dataset: TS
    row_key: {STUDYID: S1, TSGRPID: '1', TSPARMCD: TRT}
    status: SUCCESS
    output_variables:
      $STYPE_INTERVENTIONAL: '1'
      STUDYID: S1
      TSPARMCD: TRT
      TSVAL:
expected_errors: []
