name: CDISC-AD0702
kind: rule
description: |
  CDISC-AD0702: Medical Device BDS — when BASETYPE is present, ByIND
  must equal AyIND at the baseline record (ABLFL='Y') for each
  (USUBJID, PARAMCD, BASETYPE, SPDEVID) group.
  The rule's ADaM `y` wildcard (`wildcards` y: 1..99) is pinned to
  y=1 by embedding the full rule inline: Check/Operations/Output_Variables use
  the literal columns B1IND / A1IND and the residual `wildcards`
  key is clamped to 1..1 (inert: neither spec-runner lane expands
  `wildcards`; the clamp only documents the pin).
  Pins the filter-honouring `max` Operation (filter ABLFL='Y') with a
  three-group design: (a) discriminating group 001/D1/PRE has a
  post-baseline A1IND lexicographically greater than the baseline
  A1IND ('NORMAL' > 'LOW') and B1IND equal to the baseline A1IND, so a
  filter-ignoring max would false-fire there; 001/D1 also carries a
  second BASETYPE (LAST) whose clean rows would false-fire if BASETYPE
  were not in the group key; (b) subject 002 carries the same
  PARAMCD/BASETYPE on two devices — D1 clean, D2 violating — proving
  SPDEVID participates in the grouping; (c) groups with no ABLFL='Y'
  row yield a missing $-value: not_equal_to fires on populated-B1IND
  rows (subject 003) and the non_empty guard keeps empty-B1IND rows
  quiet (subject 004).
  Fully inline pin (D1/D4, PLAN-parity-java-lane-native-corpus): no
  coreId resolution - the `rule:` block below is the complete pinned
  body, derived from the rules-src entry (expression form since the
  wave-43 flip) plus the historical y=1 override.
  PinnedSpecSyncGuardTest fingerprints the source rule
  (`pinned_from.rules_src_sha256`); when the source changes, re-derive
  this block and update the fingerprint.
python_source: rules-adamig-1-3.json (CDISC-AD0702)
pinned_from:
  core_id: CDISC-AD0702
  rules_src_sha256: 94826abfb244c295f5c3111842ac0ea2bb518636d83a2b84ea961b98f59889ee
rule:
  Core:
    Id: CDISC-AD0702
    Status: Published
    Version: '1'
  Description: "Raise an error when BASETYPE is present, ByIND is populated, and ByIND does not equal the AyIND value from the record where ABLFL equals 'Y', for a given value of PARAMCD and BASETYPE within a device and subject combination."
  Sensitivity: Record
  Executability: Fully Executable
  Scope:
    Data_Structures:
      Include:
      - MEDICAL DEVICE BASIC DATA STRUCTURE
  Bindings:
  - name: $baseline_a1ind
    expression: 'max("A1IND", group=[USUBJID, PARAMCD, BASETYPE, SPDEVID], filter=filter(ABLFL="Y"))'
  Check:
    expression: 'var_exists("BASETYPE") and not empty(B1IND) and B1IND != $baseline_a1ind'
  Outcome:
    Message: "ByIND does not equal the AyIND value recorded where ABLFL equals 'Y' for this PARAMCD, BASETYPE, device, and subject combination."
    Output_Variables:
    - PARAMCD
    - BASETYPE
    - B1IND
  wildcards:
    y:
      min: 1
      max: 1
datasets:
  ADXD:
    row_key: [STUDYID, USUBJID, SPDEVID, PARAMCD, BASETYPE, AVISITN]
    column_types:
      AVISITN: LONG
    rows:
      # 001/D1/HGB/PRE — discriminating: post-baseline A1IND NORMAL > baseline LOW, B1IND = baseline A1IND → ok
    - {STUDYID: S1, USUBJID: '001', SPDEVID: D1, PARAMCD: HGB, BASETYPE: PRE, AVISITN: 0, ABLFL: 'Y', A1IND: 'LOW', B1IND: 'LOW'}
    - {STUDYID: S1, USUBJID: '001', SPDEVID: D1, PARAMCD: HGB, BASETYPE: PRE, AVISITN: 1, ABLFL: '', A1IND: 'NORMAL', B1IND: 'LOW'}
      # 001/D1/HGB/LAST — second basetype, clean (BASETYPE is in the group key)
    - {STUDYID: S1, USUBJID: '001', SPDEVID: D1, PARAMCD: HGB, BASETYPE: LAST, AVISITN: 0, ABLFL: 'Y', A1IND: 'HIGH', B1IND: 'HIGH'}
    - {STUDYID: S1, USUBJID: '001', SPDEVID: D1, PARAMCD: HGB, BASETYPE: LAST, AVISITN: 1, ABLFL: '', A1IND: 'LOW', B1IND: 'HIGH'}
      # 002/HGB/PRE on two devices — D1 clean ...
    - {STUDYID: S1, USUBJID: '002', SPDEVID: D1, PARAMCD: HGB, BASETYPE: PRE, AVISITN: 0, ABLFL: 'Y', A1IND: 'HIGH', B1IND: 'HIGH'}
    - {STUDYID: S1, USUBJID: '002', SPDEVID: D1, PARAMCD: HGB, BASETYPE: PRE, AVISITN: 1, ABLFL: '', A1IND: 'NORMAL', B1IND: 'HIGH'}
      # ... D2 violating: B1IND LOW != baseline A1IND NORMAL → bad (SPDEVID is in the group key)
    - {STUDYID: S1, USUBJID: '002', SPDEVID: D2, PARAMCD: HGB, BASETYPE: PRE, AVISITN: 0, ABLFL: 'Y', A1IND: 'NORMAL', B1IND: 'NORMAL'}
    - {STUDYID: S1, USUBJID: '002', SPDEVID: D2, PARAMCD: HGB, BASETYPE: PRE, AVISITN: 1, ABLFL: '', A1IND: 'LOW', B1IND: 'LOW'}         # bad
      # 003/D1/HGB/PRE — no ABLFL='Y' row, B1IND populated → missing $-value, not_equal_to fires
    - {STUDYID: S1, USUBJID: '003', SPDEVID: D1, PARAMCD: HGB, BASETYPE: PRE, AVISITN: 1, ABLFL: '', A1IND: 'LOW', B1IND: 'LOW'}         # bad
      # 004/D1/HGB/PRE — no ABLFL='Y' row, B1IND empty → blocked by the non_empty guard → ok
    - {STUDYID: S1, USUBJID: '004', SPDEVID: D1, PARAMCD: HGB, BASETYPE: PRE, AVISITN: 1, ABLFL: '', A1IND: 'LOW', B1IND: ''}
config:
  standard: adamig
  standard_version: '1.3'
library_mocks:
  classes:
    medical device basic data structure: [ADXD]
