name: CDISC-AD0692
kind: rule
description: |
  Wave C3 port — T2-Grouping (Sensitivity=Group). MDBDS class scope.
  CDISC-AD0692: within (USUBJID, PARAMCD, SPDEVID), BASEC populated and
  no ABLFL=Y → fire. Output_Variables: BASEC, ABLFL.
python_source: rules-adamig-1-3.json (CDISC-AD0692)
rule:
  coreId: CDISC-AD0692
datasets:
  ADLB:
    row_key: [STUDYID, USUBJID, SPDEVID, PARAMCD, AVISITN]
    column_types:
      AVISITN: LONG
    rows:
      - {STUDYID: S1, USUBJID: '001', SPDEVID: D1, PARAMCD: HGB, AVISITN: 0, ABLFL: Y, BASEC: NORMAL}
      - {STUDYID: S1, USUBJID: '001', SPDEVID: D1, PARAMCD: HGB, AVISITN: 1, ABLFL: '', BASEC: NORMAL}
      - {STUDYID: S1, USUBJID: '002', SPDEVID: D2, PARAMCD: HGB, AVISITN: 0, ABLFL: '', BASEC: HIGH}
      - {STUDYID: S1, USUBJID: '002', SPDEVID: D2, PARAMCD: HGB, AVISITN: 1, ABLFL: '', BASEC: HIGH}
config:
  standard: adamig
  standard_version: '1.3'
library_mocks:
  classes:
    medical device basic data structure: [ADLB]
expected_violations:
  - rule_id: CDISC-AD0692
    dataset: ADLB
    row_key: {AVISITN: 0, PARAMCD: HGB, SPDEVID: D2, STUDYID: S1, USUBJID: '002'}
    status: SUCCESS
    output_variables:
      $ablfl_y_count: '0'
      ABLFL:
      BASEC: HIGH
      PARAMCD: HGB
expected_errors: []
