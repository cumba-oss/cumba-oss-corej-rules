name: CDISC-CG0314
kind: rule
description: |
  Record-Data + Operation port. CDISC-CG0314: a SUPP-- QNAM must not equal a variable
  name defined in the parent domain's SDTM model. The registry function
  `get_parent_model_column_order(RDOMAIN)` (a function since wave 4 of the
  operation→function programme, PLAN-list-functions; the column is its argument) resolves
  the parent (RDOMAIN=AE) model column order into $model_variables; the record check fires
  when QNAM is_contained_by that list. Since wave 4 the finding carries RDOMAIN as an
  output variable — the binding reads that column explicitly now.
  The SUPPAE row below sets RDOMAIN=AE and QNAM=USUBJID (a real model variable), so it
  fires.
  2026-10-03 store format 5: the SDTM 2.0 model walk honours usageRestrictions, so eight
  names left the AE model list: AEBEATNO (EG only), AEEVDTYP (MH only), AEOCCUR, AEREASOC,
  AESTAT, AEREASND (not in AE) and AEPTFL, AEPDUR (specimen-based Findings domains only).
python_source: rules-sdtmig-3-4.json (CORE-000783)
rule:
  coreId: CDISC-CG0314
datasets:
  SUPPAE:
    row_key: [STUDYID, USUBJID, QNAM]
    rows:
      - {STUDYID: S1, RDOMAIN: AE, USUBJID: '001', IDVAR: AESEQ, IDVARVAL: '1', QNAM: USUBJID, QLABEL: Subject, QVAL: '001'}
  AE:
    row_key: [STUDYID, USUBJID, AESEQ]
    rows:
      - {STUDYID: S1, DOMAIN: AE, USUBJID: '001', AESEQ: 1, AETERM: Headache}
config:
  standard: sdtmig
  standard_version: '3.4'
library_mocks:
  classes:
    events: [AE]
    relationship: [SUPPAE]
expected_violations:
  - rule_id: CDISC-CG0314
    dataset: SUPPAE
    row_key: {QNAM: USUBJID, STUDYID: S1, USUBJID: '001'}
    status: SUCCESS
    output_variables:
      RDOMAIN: AE
      $model_variables: '[AEACN, AEACNDEV, AEACNOTH, AEBDSYCD, AEBODSYS, AECAT, AECHDY, AECHENDY, AECHSTDY, AECNTMOD, AECONTRT, AEDECOD, AEDETECT, AEDIR, AEDTC, AEDUR, AEDY, AEELTM, AEENDTC, AEENDY,
        AEENINT, AEENRF, AEENRTPT, AEENTPT, AEEPCHGI, AEEVINTX, AEEVLINT, AEGRPID, AEHLGT, AEHLGTCD, AEHLT, AEHLTCD, AELAT, AELLT, AELLTCD, AELNKGRP, AELNKID, AELOC, AEMODIFY,
        AENOMDY, AENOMLBL, AEOUT, AEPARTY, AEPATT, AEPORTOT, AEPRESP, AEPRTYID, AEPTCD, AERECID, AEREFID, AEREL, AERELNST, AERFTDTC, AERLDEV, AERLPRC, AERLPRT, AERPDY, AERPENDY,
        AERPSTDY, AESCAN, AESCAT, AESCONG, AESDISAB, AESDTH, AESEQ, AESER, AESEV, AESHOSP, AESINTV, AESLIFE, AESMIE, AESOC, AESOCCD, AESOD, AESPID, AESTDTC, AESTDY, AESTINT, AESTRF,
        AESTRTPT, AESTTPT, AETERM, AETOX, AETOXGR, AETPT, AETPTNUM, AETPTREF, AEUNANT, AEUSCHFL, AEXDY, AEXENDY, AEXSTDY, DOMAIN, EPOCH, FETUSID, FOCID, MIDS, MIDSDTC, NHOID, POOLID,
        RELMIDS, RPHASE, RPPLDY, RPPLENDY, RPPLSTDY, SPDEVID, STUDYID, TAETORD, USUBJID, VISIT, VISITDY, VISITNUM]'
      QNAM: USUBJID
expected_errors: []
