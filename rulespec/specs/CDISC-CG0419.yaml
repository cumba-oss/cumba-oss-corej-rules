name: CDISC-CG0419
kind: rule
description: |
  Wave 14 port — `suffix_matches_regex` with `suffix: 3`. When IDVAR's last 3
  characters match the regex "SEQ", RELTYPE must be null.
python_source: rules-sdtmig-3-4.json (CORE-000202)
rule:
  coreId: CDISC-CG0419
datasets:
  RELREC:
    row_key: [STUDYID, USUBJID, IDVAR, IDVARVAL]
    rows:
      # IDVAR="AESEQ" → last 3 chars "SEQ" matches, RELTYPE empty → ok
      - {STUDYID: S1, DOMAIN: RELREC, USUBJID: '001', IDVAR: AESEQ, IDVARVAL: '1', RELTYPE: '', RELID: R1}
      # IDVAR="AESEQ" + RELTYPE populated → bad
      - {STUDYID: S1, DOMAIN: RELREC, USUBJID: '002', IDVAR: AESEQ, IDVARVAL: '1', RELTYPE: ONE, RELID: R2}
      # IDVAR="USUBJID" (suffix "JID") + RELTYPE populated → ok
      - {STUDYID: S1, DOMAIN: RELREC, USUBJID: '003', IDVAR: USUBJID, IDVARVAL: '003', RELTYPE: ONE, RELID: R3}
config:
  standard: sdtmig
  standard_version: '3.4'
library_mocks:
  classes:
    relationship: [RELREC]
expected_violations:
  - rule_id: CDISC-CG0419
    dataset: RELREC
    row_key: {IDVAR: AESEQ, IDVARVAL: '1', STUDYID: S1, USUBJID: '002'}
    status: SUCCESS
    output_variables:
      IDVAR: AESEQ
      RELTYPE: ONE
expected_errors: []
