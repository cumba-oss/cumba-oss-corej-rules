name: CDISC-CG0016
kind: rule
description: |
  Wave 22 port — expected_variables Operation. Fires when the dataset is
  missing any variable marked Expected in the CDISC library.
python_source: rules-sdtmig-3-4.json (CORE-000334)
rule:
  coreId: CDISC-CG0016
datasets:
  AE:
    row_key: [STUDYID, USUBJID, AESEQ]
    rows:
      - {STUDYID: S1, DOMAIN: AE, USUBJID: '001', AESEQ: 1, AETERM: Headache}
config:
  standard: sdtmig
  standard_version: '3.4'
library_mocks:
  classes:
    events: [AE]
  expected_variables:
    AE: [AESTDTC, AESEV]    # Not in fixture → triggers not_contains_all
expected_violations:
  - rule_id: CDISC-CG0016
    dataset: AE
    row_key: {AESEQ: 1, STUDYID: S1, USUBJID: '001'}
    status: SUCCESS
    output_variables:
      $missing_expected_variables: '[AESEV, AESTDTC]'
expected_errors: []
