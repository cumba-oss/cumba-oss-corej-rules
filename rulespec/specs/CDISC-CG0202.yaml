name: CDISC-CG0202
kind: rule
description: |
  Record-Data. When QORIG equals 'ASSIGNED' (case-insensitive literal),
  QEVAL must be populated. The SUPPAE row sets QORIG=ASSIGNED with an empty
  QEVAL, so the rule fires.
python_source: rules-sdtmig-3-3.json (CORE-000375)
rule:
  coreId: CDISC-CG0202
datasets:
  SUPPAE:
    row_key: [STUDYID, USUBJID, QNAM]
    rows:
      - {STUDYID: S1, RDOMAIN: AE, USUBJID: '001', IDVAR: AESEQ, IDVARVAL: '1', QNAM: AESEV1, QLABEL: Severity 1, QVAL: MILD, QORIG: ASSIGNED, QEVAL: ''}
config:
  standard: sdtmig
  standard_version: '3.3'
library_mocks:
  classes:
    relationship: [SUPPAE]
# PLAN-message-folded-corpus-alignment (2026-10-07): the trigger column is blank or absent on every
# fixture row, so the rule now reports ONE dataset-level finding (Outcome.Message_Folded, D5) where
# it reported per row; the per-row rows were replaced by the collapsed one (anchored at the first
# firing row, columns listed by name).
expected_violations:
- rule_id: CDISC-CG0202
  dataset: SUPPAE
  row_key: {QNAM: AESEV1, STUDYID: S1, USUBJID: '001'}
  status: SUCCESS
  output_variables: {}
  name_only: [QEVAL, QNAM, QORIG]
expected_errors: []
