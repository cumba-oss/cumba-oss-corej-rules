name: CDISC-CG0131
kind: rule
description: |
  Wave 13 port - DTHFL populated with a value other than "Y". Non-wildcard Record-Data rule with
  explicit Output_Variables (no Fix #17 wildcard resolution involved).
python_source: rules-sdtmig-3-4.json (CORE-000006)
rule:
  coreId: CDISC-CG0131
datasets:
  DM:
    row_key: [STUDYID, USUBJID]
    rows:
      - {STUDYID: S1, DOMAIN: DM, USUBJID: '001', DTHFL: Y}
      - {STUDYID: S1, DOMAIN: DM, USUBJID: '002', DTHFL: N}
config:
  standard: sdtmig
  standard_version: '3.4'
library_mocks:
  classes:
    special-purpose: [DM]
expected_violations:
  - rule_id: CDISC-CG0131
    dataset: DM
    row_key: {STUDYID: S1, USUBJID: '002'}
    status: SUCCESS
    output_variables:
      DTHFL: N
expected_errors: []
