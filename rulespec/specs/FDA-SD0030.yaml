name: FDA-SD0030
kind: rule
description: |
  Wave 8 port — --STRESU populated but --STRESC empty. Fix #17 resolves `--`-prefixed
  Output_Variables against the primary domain prefix.
python_source: rules-sdtmig-3-4.json (CORE-000133)
rule:
  coreId: FDA-SD0030
datasets:
  LB:
    row_key: [STUDYID, USUBJID, LBSEQ]
    rows:
      - {STUDYID: S1, DOMAIN: LB, USUBJID: '001', LBSEQ: 1, LBSTRESU: mg/dL, LBSTRESC: '10'}
      - {STUDYID: S1, DOMAIN: LB, USUBJID: '002', LBSEQ: 1, LBSTRESU: mg/dL, LBSTRESC: ''}
config:
  standard: sdtmig
  standard_version: '3.4'
library_mocks:
  classes:
    findings: [LB]
expected_violations:
  - rule_id: FDA-SD0030
    dataset: LB
    row_key: {LBSEQ: 1, STUDYID: S1, USUBJID: '002'}
    status: SUCCESS
    output_variables:
      LBSTRESC:
      LBSTRESU: mg/dL
expected_errors: []
