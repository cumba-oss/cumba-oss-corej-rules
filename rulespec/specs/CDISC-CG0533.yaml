name: CDISC-CG0533
kind: rule
description: |
  Record-Data. CDISC-CG0533: raise an error when RPATHCD is present in the DM dataset.
  The single DM row populates RPATHCD so the exists leaf fires.
python_source: rules-sdtmig-3-4.json (CORE-000073)
rule:
  coreId: CDISC-CG0533
datasets:
  DM:
    row_key: [STUDYID, USUBJID]
    rows:
      - {STUDYID: S1, DOMAIN: DM, USUBJID: '001', RPATHCD: ABC}
config:
  standard: sdtmig
  standard_version: '3.4'
library_mocks:
  classes:
    special-purpose: [DM]
expected_violations:
  - rule_id: CDISC-CG0533
    dataset: DM
    row_key: {STUDYID: S1, USUBJID: '001'}
    status: SUCCESS
    output_variables:
      RPATHCD: ABC
expected_errors: []
