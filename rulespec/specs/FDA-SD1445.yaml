name: FDA-SD1445
kind: rule
description: |
  Wave 11 port - --LOBXFL=Y not unique within (TESTCD,CAT,SCAT,SPEC,METHOD,USUBJID). Covers harder plain bucket:
  complex operators (is_inconsistent_across_dataset, is_not_unique_set,
  target_is_not_sorted_by, inconsistent_enumerated_columns) or multi-leaf
  composite checks that Waves 8-10 did not reach.
python_source: rules-sdtmig-3-4.json (CORE-000915)
rule:
  coreId: FDA-SD1445
datasets:
  LB:
    row_key: [STUDYID, USUBJID, LBSEQ]
    rows:
      - {STUDYID: S1, DOMAIN: LB, USUBJID: '001', LBSEQ: 1, LBTESTCD: HGB, LBCAT: HEM, LBSCAT: X, LBSPEC: BLOOD, LBMETHOD: AUTO, LBLOBXFL: Y, LBSTRESC: '10'}
      - {STUDYID: S1, DOMAIN: LB, USUBJID: '001', LBSEQ: 2, LBTESTCD: HGB, LBCAT: HEM, LBSCAT: X, LBSPEC: BLOOD, LBMETHOD: AUTO, LBLOBXFL: Y, LBSTRESC: '12'}
config:
  standard: sdtmig
  standard_version: '3.4'
library_mocks:
  classes:
    findings: [LB]
expected_violations:
  - rule_id: FDA-SD1445
    dataset: LB
    row_key: {LBSEQ: 1, STUDYID: S1, USUBJID: '001'}
    status: SUCCESS
    output_variables:
      LBCAT: HEM
      LBLOBXFL: Y
      LBMETHOD: AUTO
      LBSCAT: X
      LBSPEC: BLOOD
      LBTESTCD: HGB
  - rule_id: FDA-SD1445
    dataset: LB
    row_key: {LBSEQ: 2, STUDYID: S1, USUBJID: '001'}
    status: SUCCESS
    output_variables:
      LBCAT: HEM
      LBLOBXFL: Y
      LBMETHOD: AUTO
      LBSCAT: X
      LBSPEC: BLOOD
      LBTESTCD: HGB
expected_errors: []
