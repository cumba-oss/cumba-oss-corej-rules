name: CDISC-AD0800
kind: rule
description: |
  Wave A9 port — T1a PlainSimple.
  CDISC-AD0800: STUDYID is populated and STUDYIDN is not populated.
  Record-data rule scoped to BASIC DATA STRUCTURE; non_empty + empty pair.
python_source: rules-adamig-1-3.json (CDISC-AD0800)
rule:
  coreId: CDISC-AD0800
datasets:
  ADLB:
    row_key: [STUDYID, USUBJID, PARAMCD]
    rows:
      - {STUDYID: '',  USUBJID: '001', PARAMCD: 'HGB', STUDYIDN: ''}     # ok (STUDYID empty)
      - {STUDYID: S1, USUBJID: '002', PARAMCD: 'HGB', STUDYIDN: ''}      # bad (STUDYID populated, STUDYIDN empty)
config:
  standard: adamig
  standard_version: '1.3'
library_mocks:
  classes:
    basic data structure: [ADLB]
# PLAN-message-folded-corpus-alignment (2026-10-07): the trigger column is blank or absent on every
# fixture row, so the rule now reports ONE dataset-level finding (Outcome.Message_Folded, D5) where
# it reported per row; the per-row rows were replaced by the collapsed one (anchored at the first
# firing row, columns listed by name).
expected_violations:
- rule_id: CDISC-AD0800
  dataset: ADLB
  row_key: {PARAMCD: HGB, STUDYID: S1, USUBJID: '002'}
  status: SUCCESS
  output_variables: {}
  name_only: [STUDYID, STUDYIDN]
expected_errors: []
