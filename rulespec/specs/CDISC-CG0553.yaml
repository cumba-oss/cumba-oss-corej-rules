name: CDISC-CG0553
kind: rule
description: |
  Wave 10 port - --ORRES empty when --LOBXFL=Y and --DRVFL is missing or != Y. Exercises the broader Fix #17
  bucket: Check leaves with column-as-reference values, exists/not_exists
  column-presence safeguards, or Domains.Exclude scope shapes not covered
  by Waves 8-9.
python_source: rules-sdtmig-3-4.json (CORE-000083)
rule:
  coreId: CDISC-CG0553
datasets:
  LB:
    row_key: [STUDYID, USUBJID, LBSEQ]
    rows:
      - {STUDYID: S1, DOMAIN: LB, USUBJID: '001', LBSEQ: 1, LBORRES: '', LBLOBXFL: Y, LBDRVFL: Y}
      - {STUDYID: S1, DOMAIN: LB, USUBJID: '002', LBSEQ: 1, LBORRES: '', LBLOBXFL: Y, LBDRVFL: N}
config:
  standard: sdtmig
  standard_version: '3.4'
library_mocks:
  classes:
    findings: [LB]
expected_violations:
  - rule_id: CDISC-CG0553
    dataset: LB
    row_key: {LBSEQ: 1, STUDYID: S1, USUBJID: '002'}
    status: SUCCESS
    output_variables:
      LBDRVFL: N
      LBLOBXFL: Y
expected_errors: []
