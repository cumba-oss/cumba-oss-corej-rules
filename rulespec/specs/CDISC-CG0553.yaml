name: CDISC-CG0553
kind: rule
description: |
  Wave 10 port - --ORRES empty when --LOBXFL=Y and --DRVFL is null (rule round 2026-10-12: was != Y, so 'N' fired). Exercises the broader Fix #17
  bucket: Check leaves with column-as-reference values, exists/not_exists
  column-presence safeguards, or Domains.Exclude scope shapes not covered
  by Waves 8-9.
python_source: rules-sdtmig-3-4.json (CORE-000083)
rule:
  coreId: CDISC-CG0553
datasets:
  LB:
    row_key: [STUDYID, USUBJID, LBSEQ]
    rows:
      - {STUDYID: S1, DOMAIN: LB, USUBJID: '001', LBSEQ: 1, LBORRES: '', LBLOBXFL: Y, LBDRVFL: Y}
      - {STUDYID: S1, DOMAIN: LB, USUBJID: '002', LBSEQ: 1, LBORRES: '', LBLOBXFL: Y, LBDRVFL: ''}
      - {STUDYID: S1, DOMAIN: LB, USUBJID: '003', LBSEQ: 1, LBORRES: '', LBLOBXFL: Y, LBDRVFL: N}
config:
  standard: sdtmig
  standard_version: '3.4'
library_mocks:
  classes:
    findings: [LB]
# Rule round 2026-10-12 (review M1, owner): the rule never folds (Keep_Row_Findings [--ORRES,
# --DRVFL], no Message_Folded), so the all-blank LBORRES no longer collapses to one dataset-level
# finding (2026-10-07, PLAN-message-folded-corpus-alignment): the one firing record (002, LBDRVFL
# null) is reported per record, with its values. 001 is derived (Y), 003 has LBDRVFL = N (not null).
expected_violations:
- rule_id: CDISC-CG0553
  dataset: LB
  row_key: {LBSEQ: 1, STUDYID: S1, USUBJID: '002'}
  status: SUCCESS
  output_variables: {LBDRVFL: null, LBLOBXFL: Y}
expected_errors: []
