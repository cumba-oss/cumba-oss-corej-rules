name: rule_with_operation_record_count
kind: rule
description: |
  M2 pilot: full rule that runs an Operation before evaluating its Check.
  Synthetic rule fires once at the dataset level when AE has more than 5 rows.
  Demonstrates the Operations dispatch path producing a scalar $variable consumed by the Check.
rule:
  id: pilot-record-count
  Core: {Id: PILOT-AE-RECORD-COUNT}
  Description: AE must contain no more than 5 records.
  Sensitivity: Dataset
  Executability: Fully Executable
  Scope:
    Domains: {Include: [AE]}
  Bindings:
  - name: "$ae_record_count"
    expression: 'record_count(domain="AE")'
  Check:
    expression: '$ae_record_count > 5'
  Outcome:
    Message: AE has more than 5 records.
    Output_Variables: [STUDYID, USUBJID, AESEQ]
datasets:
  AE:
    row_key: [STUDYID, USUBJID, AESEQ]
    rows:
    - {STUDYID: "S1", USUBJID: "001", AESEQ: 1}
    - {STUDYID: "S1", USUBJID: "001", AESEQ: 2}
    - {STUDYID: "S1", USUBJID: "002", AESEQ: 1}
    - {STUDYID: "S1", USUBJID: "002", AESEQ: 2}
    - {STUDYID: "S1", USUBJID: "002", AESEQ: 3}
    - {STUDYID: "S1", USUBJID: "003", AESEQ: 1}
config:
  standard: sdtmig
  standard_version: "3.4"
expected_violations:
- rule_id: PILOT-AE-RECORD-COUNT
  dataset: AE
  row_key: {STUDYID: "S1", USUBJID: "001", AESEQ: 1}
  status: SUCCESS
  output_variables:
    $ae_record_count: '6'
    AESEQ: '1'
    STUDYID: S1
    USUBJID: '001'
expected_errors: []
