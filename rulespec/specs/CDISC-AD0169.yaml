name: CDISC-AD0169
kind: rule
description: |
  A2 port — T1a PlainSimple. BDS: CNSR is not a non-negative integer.
python_source: rules-adamig-1-3.json (CDISC-AD0169)
rule:
  coreId: CDISC-AD0169
datasets:
  ADLB:
    row_key: [STUDYID, USUBJID, PARAMCD, AVISITN]
    column_types:
      AVISITN: LONG
      CNSR: LONG
    rows:
      # CNSR is Num in every ADaMIG; PLAN-column-type-conformance (R5) corrected the fixture,
      # which had shipped it as Char and relied on the retired Char->Num parse fallback.
      - {STUDYID: S1, USUBJID: '001', PARAMCD: 'HGB', AVISITN: 1, CNSR: 0}   # ok
      - {STUDYID: S1, USUBJID: '002', PARAMCD: 'HGB', AVISITN: 1, CNSR: -1}  # bad
config:
  standard: adamig
  standard_version: '1.3'
library_mocks:
  classes:
    basic data structure: [ADLB]
expected_violations:
  - rule_id: CDISC-AD0169
    dataset: ADLB
    row_key: {STUDYID: S1, USUBJID: '002', PARAMCD: 'HGB', AVISITN: 1}
    status: SUCCESS
    output_variables:
      CNSR: '-1'
expected_errors: []
