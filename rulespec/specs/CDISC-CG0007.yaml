name: CDISC-CG0007
kind: rule
description: |
  Wave 9 port - --DY populated while --DTC or DM.RFSTDTC is incomplete. Match_Datasets joins primary AE
  to DM on USUBJID; DM.RFSTDTC / RFENDTC / RFPENDTC are emitted with the
  DM.* prefix preserved in the canonical output_variables.
python_source: rules-sdtmig-3-4.json (CORE-000354)
rule:
  coreId: CDISC-CG0007
datasets:
  AE:
    row_key: [STUDYID, USUBJID, AESEQ]
    rows:
      - {STUDYID: S1, DOMAIN: AE, USUBJID: '001', AESEQ: 1, AEDTC: '2026-01-05', AEDY: 5}
      - {STUDYID: S1, DOMAIN: AE, USUBJID: '002', AESEQ: 2, AEDTC: '2026', AEDY: 5}
      - {STUDYID: S1, DOMAIN: AE, USUBJID: '003', AESEQ: 3, AEDTC: '2026-01-05', AEDY: 5}
  DM:
    rows:
      - {STUDYID: S1, DOMAIN: DM, USUBJID: '001', RFSTDTC: '2026-01-01'}
      - {STUDYID: S1, DOMAIN: DM, USUBJID: '002', RFSTDTC: '2026-01-01'}
      - {STUDYID: S1, DOMAIN: DM, USUBJID: '003', RFSTDTC: '2026'}
config:
  standard: sdtmig
  standard_version: '3.4'
library_mocks:
  classes:
    events: [AE]
    special-purpose: [DM]
expected_violations:
  - rule_id: CDISC-CG0007
    dataset: AE
    row_key: {AESEQ: 2, STUDYID: S1, USUBJID: '002'}
    status: SUCCESS
    output_variables:
      AEDTC: '2026'
      AEDY: '5'
      DM.RFSTDTC: '2026-01-01'
  - rule_id: CDISC-CG0007
    dataset: AE
    row_key: {AESEQ: 3, STUDYID: S1, USUBJID: '003'}
    status: SUCCESS
    output_variables:
      AEDTC: '2026-01-05'
      AEDY: '5'
      DM.RFSTDTC: '2026'
expected_errors: []
