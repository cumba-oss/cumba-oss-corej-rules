name: CDISC-CG0110
kind: rule
description: |
  Wave 8 port — Both --DOSE and --DOSTXT populated. Fix #17 resolves `--`-prefixed
  Output_Variables against the primary domain prefix.
python_source: rules-sdtmig-3-4.json (CORE-000092)
rule:
  coreId: CDISC-CG0110
datasets:
  EX:
    row_key: [STUDYID, USUBJID, EXSEQ]
    rows:
      - {STUDYID: S1, DOMAIN: EX, USUBJID: '001', EXSEQ: 1, EXDOSE: '10', EXDOSTXT: ''}
      - {STUDYID: S1, DOMAIN: EX, USUBJID: '002', EXSEQ: 1, EXDOSE: '10', EXDOSTXT: 10 mg}
config:
  standard: sdtmig
  standard_version: '3.4'
library_mocks:
  classes:
    interventions: [EX]
expected_violations:
  - rule_id: CDISC-CG0110
    dataset: EX
    row_key: {EXSEQ: 1, STUDYID: S1, USUBJID: '002'}
    status: SUCCESS
    output_variables:
      EXDOSE: '10'
      EXDOSTXT: 10 mg
expected_errors: []
