name: CDISC-AD0475
kind: rule
description: |
  Wave A6 port — T1a PlainSimple.
  CDISC-AD0475: On a given record, STRATAVN is populated and STRATAV is not populated.
  Record-data rule scoped to SUBJECT LEVEL ANALYSIS DATASET; non_empty + empty pair; literal column names per star-as-literal convention.
python_source: rules-adamig-1-3.json (CDISC-AD0475)
rule:
  coreId: CDISC-AD0475
datasets:
  ADSL:
    row_key: [STUDYID, USUBJID]
    rows:
      - {STUDYID: S1, USUBJID: '001', STRATAVN: '', STRATAV: ''}      # ok
      - {STUDYID: S1, USUBJID: '002', STRATAVN: 'X', STRATAV: ''}      # bad
config:
  standard: adamig
  standard_version: '1.3'
library_mocks:
  classes:
    subject level analysis dataset: [ADSL]
expected_violations:
  - rule_id: CDISC-AD0475
    dataset: ADSL
    row_key: {STUDYID: S1, USUBJID: '002'}
    status: SUCCESS
    output_variables:
      STRATAV: null
      STRATAVN: 'X'
expected_errors: []
