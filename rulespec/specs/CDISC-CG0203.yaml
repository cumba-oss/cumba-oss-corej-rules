name: CDISC-CG0203
kind: rule
description: |
  Record-Data. CDISC-CG0203: in a SUPP-- dataset, RDOMAIN != 'DM' but IDVAR is empty.
  The SUPPAE row sets RDOMAIN=AE and leaves IDVAR empty so both leaves fire.
python_source: rules-sdtmig-3-4.json (CORE-000134)
rule:
  coreId: CDISC-CG0203
datasets:
  SUPPAE:
    row_key: [STUDYID, USUBJID, IDVAR, IDVARVAL, QNAM]
    rows:
      - {STUDYID: S1, RDOMAIN: AE, USUBJID: '001', IDVAR: '', IDVARVAL: '', QNAM: AESEV1, QLABEL: Sev, QVAL: Y}
config:
  standard: sdtmig
  standard_version: '3.4'
library_mocks:
  classes:
    relationship: [SUPPAE]
# PLAN-message-folded-corpus-alignment (2026-10-07): the trigger column is blank or absent on every
# fixture row, so the rule now reports ONE dataset-level finding (Outcome.Message_Folded, D5) where
# it reported per row; the per-row rows were replaced by the collapsed one (anchored at the first
# firing row, columns listed by name).
expected_violations:
- rule_id: CDISC-CG0203
  dataset: SUPPAE
  row_key: {IDVAR: '', IDVARVAL: '', QNAM: AESEV1, STUDYID: S1, USUBJID: '001'}
  status: SUCCESS
  output_variables: {}
  name_only: [IDVAR, RDOMAIN]
expected_errors: []
