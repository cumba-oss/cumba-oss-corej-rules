name: CDISC-AD0144
kind: rule
description: |
  A2 port — T1a PlainSimple. BDS: PARAMCD starts with non-letter.
python_source: rules-adamig-1-3.json (CDISC-AD0144)
rule:
  coreId: CDISC-AD0144
datasets:
  ADLB:
    row_key: [STUDYID, USUBJID, PARAMCD, AVISITN]
    column_types:
      AVISITN: LONG
    rows:
      - {STUDYID: S1, USUBJID: '001', PARAMCD: 'HGB', AVISITN: 1}     # ok (starts with letter)
      - {STUDYID: S1, USUBJID: '002', PARAMCD: '1HGB', AVISITN: 1}    # bad (starts with digit)
config:
  standard: adamig
  standard_version: '1.3'
library_mocks:
  classes:
    basic data structure: [ADLB]
expected_violations:
  - rule_id: CDISC-AD0144
    dataset: ADLB
    row_key: {STUDYID: S1, USUBJID: '002', PARAMCD: '1HGB', AVISITN: 1}
    status: SUCCESS
    output_variables:
      PARAMCD: '1HGB'
expected_errors: []
