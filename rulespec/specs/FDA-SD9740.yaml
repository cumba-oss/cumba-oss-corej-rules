name: FDA-SD9740
kind: rule
description: |
  Wave 11 port - --ENINT populated but --TPTREF empty. Covers harder plain bucket:
  complex operators (is_inconsistent_across_dataset, is_not_unique_set,
  target_is_not_sorted_by, inconsistent_enumerated_columns) or multi-leaf
  composite checks that Waves 8-10 did not reach.
python_source: rules-sdtmig-3-4.json (CORE-000642)
rule:
  coreId: FDA-SD9740
datasets:
  EX:
    row_key: [STUDYID, USUBJID, EXSEQ]
    rows:
      - {STUDYID: S1, DOMAIN: EX, USUBJID: '001', EXSEQ: 1, EXTPTREF: SCREENING, EXENINT: PT2H}
      - {STUDYID: S1, DOMAIN: EX, USUBJID: '002', EXSEQ: 2, EXTPTREF: '', EXENINT: PT2H}
config:
  standard: sdtmig
  standard_version: '3.4'
library_mocks:
  classes:
    interventions: [EX]
expected_violations:
  - rule_id: FDA-SD9740
    dataset: EX
    row_key: {EXSEQ: 2, STUDYID: S1, USUBJID: '002'}
    status: SUCCESS
    output_variables:
      EXENINT: PT2H
      EXTPTREF:
expected_errors: []
