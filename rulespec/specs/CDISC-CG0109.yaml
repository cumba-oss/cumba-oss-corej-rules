name: CDISC-CG0109
kind: rule
description: |
  Record-Data + Operation. CDISC-CG0109: DM subject with ACTARMCD not in the reserved
  set (SCRNFAIL/NOTASSGN/NOTTRT) but with no record in EX. Operation `distinct USUBJID`
  over EX builds $usubjids_in_ex = [002]; DM subject 001 has ACTARMCD=ARM1 and is absent
  from EX, so both leaves hold and the rule fires.
python_source: rules-sdtmig-3-2.json (CORE-000366)
rule:
  coreId: CDISC-CG0109
datasets:
  DM:
    row_key: [STUDYID, USUBJID]
    rows:
      - {STUDYID: S1, DOMAIN: DM, USUBJID: '001', ARMCD: ARM1, ACTARMCD: ARM1}
  EX:
    row_key: [STUDYID, USUBJID, EXSEQ]
    rows:
      - {STUDYID: S1, DOMAIN: EX, USUBJID: '002', EXSEQ: 1, EXTRT: DRUG}
config:
  standard: sdtmig
  standard_version: '3.2'
library_mocks:
  classes:
    special-purpose: [DM]
    interventions: [EX]
expected_violations:
  - rule_id: CDISC-CG0109
    dataset: DM
    row_key: {STUDYID: S1, USUBJID: '001'}
    status: SUCCESS
    output_variables:
      $usubjids_in_ex: '[002]'
      ACTARMCD: ARM1
expected_errors: []
