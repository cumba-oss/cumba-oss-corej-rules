name: CDISC-AD0078
kind: rule
description: |
  Wave D2 port — T3-VMC. ADSL: TRTxxP (literal) exists and TRxxSDT not_exists.
  Baselined on Python lane under Finding #9 (VMC dataset projection divergence).
python_notes: |
  Known divergence (Finding #9): Python swaps the dataset for a
  VariablesMetadataDatasetBuilder projection, so `exists(TRTxxP)` checks
  meta-field column names instead of dataset columns and yields 0
  violations. Java fires correctly; expected matches Java's 1 dataset-level
  violation.
python_source: rules-adamig-1-3.json (CDISC-AD0078)
rule:
