name: CDISC-CG0339
kind: rule
description: |
  Wave 11 port - --CAT equals --BODSYS (case-insensitive). Covers harder plain bucket:
  complex operators (is_inconsistent_across_dataset, is_not_unique_set,
  target_is_not_sorted_by, inconsistent_enumerated_columns) or multi-leaf
  composite checks that Waves 8-10 did not reach.
python_source: rules-sdtmig-3-4.json (CORE-000197)
rule:
  coreId: CDISC-CG0339
datasets:
  AE:
    row_key: [STUDYID, USUBJID, AESEQ]
    rows:
      - {STUDYID: S1, DOMAIN: AE, USUBJID: '001', AESEQ: 1, AECAT: SEVERE, AEBODSYS: HEPATIC, AETERM: HEADACHE}
      - {STUDYID: S1, DOMAIN: AE, USUBJID: '002', AESEQ: 2, AECAT: hepatic, AEBODSYS: HEPATIC, AETERM: HEADACHE}
config:
  standard: sdtmig
  standard_version: '3.4'
library_mocks:
  classes:
    events: [AE]
expected_violations:
  - rule_id: CDISC-CG0339
    dataset: AE
    row_key: {AESEQ: 2, STUDYID: S1, USUBJID: '002'}
    status: SUCCESS
    output_variables:
      AEBODSYS: HEPATIC
      AECAT: hepatic
expected_errors: []
