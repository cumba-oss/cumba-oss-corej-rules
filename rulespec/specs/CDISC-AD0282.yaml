name: CDISC-AD0282
kind: rule
description: |
  A2 port — T1a PlainSimple. OCCDS (ADAE): ASEVN must be 1/2/3 or null.
  Bare-leaf Check → Python raises KeyError: 'name' (§0b bullet 4); baseline Python.
python_source: rules-adamig-1-3.json (CDISC-AD0282)
rule:
  coreId: CDISC-AD0282
datasets:
  ADAE:
    row_key: [STUDYID, USUBJID, AESEQ]
    column_types:
      AESEQ: LONG
      ASEVN: LONG
    rows:
      - {STUDYID: S1, USUBJID: '001', AESEQ: 1, ASEVN: 2}   # ok
      - {STUDYID: S1, USUBJID: '002', AESEQ: 1, ASEVN: 7}   # bad
config:
  standard: adamig
  standard_version: '1.3'
library_mocks:
  classes:
    occurrence data structure: [ADAE]
expected_violations:
  - rule_id: CDISC-AD0282
    dataset: ADAE
    row_key: {STUDYID: S1, USUBJID: '002', AESEQ: 1}
    status: SUCCESS
    output_variables:
      ASEVN: '7'
expected_errors: []
