name: CDISC-CG0287
kind: rule
description: |
  Record-Data port. CDISC-CG0287: the TS dataset's TSPARMCD column must contain all the
  required parameter codes. Single leaf: TSPARMCD not_contains_all <list>. The TS row only
  carries TITLE, so the required set is not fully present and the rule fires.
python_source: rules-sdtmig-3-3.json (CORE-000740)
rule:
  coreId: CDISC-CG0287
datasets:
  TS:
    row_key: [STUDYID, TSPARMCD, TSSEQ]
    rows:
      - {STUDYID: S1, DOMAIN: TS, TSSEQ: 1, TSPARMCD: TITLE, TSVAL: A Study}
config:
  standard: sdtmig
  standard_version: '3.3'
library_mocks:
  classes:
    trial-design: [TS]
expected_violations:
  - rule_id: CDISC-CG0287
    dataset: TS
    row_key: {STUDYID: S1, TSPARMCD: TITLE, TSSEQ: 1}
    status: SUCCESS
    output_variables:
      TSPARMCD: TITLE
expected_errors: []
