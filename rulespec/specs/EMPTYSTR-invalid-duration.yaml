name: EMPTYSTR-invalid-duration
kind: check_operator
description: |
  Empty-string parity (PLAN-empty-string-membership-parity, Category A.4).
  invalid_duration fires on an empty cell — "" is not a valid ISO 8601 duration.
  Aligned: both engines flag the empty row. No baseline entry.
python_source: PLAN-empty-string-membership-parity.md (A.4)
check:
  expression: 'invalid_duration(AEDUR)'
datasets:
  AE:
    row_key: [STUDYID, USUBJID, AESEQ]
    rows:
    - {STUDYID: S1, USUBJID: '001', AESEQ: 1, AEDUR: 'P1D'}    # valid → no fire
    - {STUDYID: S1, USUBJID: '002', AESEQ: 1, AEDUR: ''}       # empty → fires
config:
  standard: sdtmig
  standard_version: '3.4'
expected_violations:
- rule_id: AUTO-EMPTYSTR-invalid-duration
  dataset: AE
  row_key: {STUDYID: S1, USUBJID: '002', AESEQ: 1}
  status: SUCCESS
  output_variables:
    AEDUR:
    AESEQ: '1'
    STUDYID: S1
    USUBJID: '002'
expected_errors: []
