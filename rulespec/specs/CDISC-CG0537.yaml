name: CDISC-CG0537
kind: rule
description: |
  Wave 3 port — literal-equality + exists combo.
  CDISC-CG0537: For DS disposition-event records without DSSCAT, no more than one record
  per subject per EPOCH is allowed. Sensitivity is Group over [USUBJID, EPOCH]: the
  offence is the (subject, epoch) group, so a group of N duplicate records yields ONE
  finding, keyed on the group's first row — not N. Subject 002 contributes a 2-row
  TREATMENT group; subject 003 a separate 2-row FOLLOW-UP group, so two distinct groups
  fire and the per-group collapse is observable rather than assumed.
python_source: rules-sdtmig-3-4.json (CORE-000374)
rule:
  coreId: CDISC-CG0537
datasets:
  DS:
    row_key: [STUDYID, USUBJID, DSSEQ]
    # DSSCAT intentionally omitted from the column set — rule's `DSSCAT not_exists`
    # leaf fires only when the variable is absent from the dataset altogether.
    rows:
      - {STUDYID: S1, DOMAIN: DS, USUBJID: '001', DSSEQ: 1, DSCAT: DISPOSITION EVENT, EPOCH: SCREENING, DSDECOD: COMPLETED}
      # Subject 002 — two rows with identical (USUBJID, EPOCH) tuple → ONE group finding
      - {STUDYID: S1, DOMAIN: DS, USUBJID: '002', DSSEQ: 1, DSCAT: DISPOSITION EVENT, EPOCH: TREATMENT, DSDECOD: ONGOING}
      - {STUDYID: S1, DOMAIN: DS, USUBJID: '002', DSSEQ: 2, DSCAT: DISPOSITION EVENT, EPOCH: TREATMENT, DSDECOD: COMPLETED}
      # Subject 003 — a second, independent duplicate group → a second group finding
      - {STUDYID: S1, DOMAIN: DS, USUBJID: '003', DSSEQ: 1, DSCAT: DISPOSITION EVENT, EPOCH: FOLLOW-UP, DSDECOD: ONGOING}
      - {STUDYID: S1, DOMAIN: DS, USUBJID: '003', DSSEQ: 2, DSCAT: DISPOSITION EVENT, EPOCH: FOLLOW-UP, DSDECOD: COMPLETED}
config:
  standard: sdtmig
  standard_version: '3.4'
library_mocks:
  classes:
    events: [DS]
expected_violations:
  - rule_id: CDISC-CG0537
    dataset: DS
    row_key: {DSSEQ: 1, STUDYID: S1, USUBJID: '002'}
    status: SUCCESS
    output_variables:
      DSCAT: DISPOSITION EVENT
      EPOCH: TREATMENT
  - rule_id: CDISC-CG0537
    dataset: DS
    row_key: {DSSEQ: 1, STUDYID: S1, USUBJID: '003'}
    status: SUCCESS
    output_variables:
      DSCAT: DISPOSITION EVENT
      EPOCH: FOLLOW-UP
expected_errors: []
