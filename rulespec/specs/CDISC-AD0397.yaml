name: CDISC-AD0397
kind: rule
description: |
  Wave A4 port — T1a PlainSimple.
  CDISC-AD0397: ATOXGRH is populated while ATOXGRHN is empty.
  Record-data rule scoped to BASIC DATA STRUCTURE; non_empty + empty pair.
python_source: rules-adamig-1-3.json (CDISC-AD0397)
rule:
  coreId: CDISC-AD0397
datasets:
  ADLB:
    row_key: [STUDYID, USUBJID, PARAMCD]
    rows:
      - {STUDYID: S1, USUBJID: '001', PARAMCD: 'HGB', ATOXGRH: '', ATOXGRHN: ''}       # ok
      - {STUDYID: S1, USUBJID: '002', PARAMCD: 'HGB', ATOXGRH: 'HIGH', ATOXGRHN: ''}   # bad
config:
  standard: adamig
  standard_version: '1.3'
library_mocks:
  classes:
    basic data structure: [ADLB]
expected_violations:
  - rule_id: CDISC-AD0397
    dataset: ADLB
    row_key: {PARAMCD: HGB, STUDYID: S1, USUBJID: '002'}
    status: SUCCESS
    output_variables:
      ATOXGRH: 'HIGH'
      ATOXGRHN: null
expected_errors: []
