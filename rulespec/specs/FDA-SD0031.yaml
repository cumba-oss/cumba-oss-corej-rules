name: FDA-SD0031
kind: rule
description: |
  Wave 16 port - Fix17 leftover edge case. --ENDTC populated but no start-time marker (--STDTC/--STRF/--STRTPT all empty).
python_source: rules-sdtmig-3-4.json (CORE-000892)
rule:
  coreId: FDA-SD0031
datasets:
  AE:
    row_key: [STUDYID, USUBJID, AESEQ]
    rows:
      - {STUDYID: S1, DOMAIN: AE, USUBJID: '001', AESEQ: 1, AEENDTC: '2026-01-10', AESTDTC: '2026-01-01', AESTRF: '', AESTRTPT: ''}
      - {STUDYID: S1, DOMAIN: AE, USUBJID: '002', AESEQ: 1, AEENDTC: '2026-01-10', AESTDTC: '', AESTRF: '', AESTRTPT: ''}
config:
  standard: sdtmig
  standard_version: '3.4'
library_mocks:
  classes:
    events: [AE]
# PLAN-message-folded-corpus-alignment (2026-10-07): the trigger column is blank or absent on every
# fixture row, so the rule now reports ONE dataset-level finding (Outcome.Message_Folded, D5) where
# it reported per row; the per-row rows were replaced by the collapsed one (anchored at the first
# firing row, columns listed by name).
expected_violations:
- rule_id: FDA-SD0031
  dataset: AE
  row_key: {AESEQ: 1, STUDYID: S1, USUBJID: '002'}
  status: SUCCESS
  output_variables: {}
  name_only: [AEENDTC, AESTDTC, AESTRF, AESTRTPT]
expected_errors: []
