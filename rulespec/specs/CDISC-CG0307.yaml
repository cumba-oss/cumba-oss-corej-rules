name: CDISC-CG0307
kind: rule
description: |
  Wave 15 port - non-wildcard plain Record-Data rule. (CORE-000179)
python_source: rules-sdtmig-3-4.json (CORE-000179)
rule:
  coreId: CDISC-CG0307
datasets:
  TS:
    row_key: [STUDYID, TSPARMCD, TSSEQ]
    column_types:
      TSSEQ: LONG
    rows:
      - {STUDYID: S1, DOMAIN: TS, TSPARMCD: DOSE, TSSEQ: 1, TSPARM: Dose}
      - {STUDYID: S1, DOMAIN: TS, TSPARMCD: ROUTE, TSSEQ: 1, TSPARM: Route}
      - {STUDYID: S1, DOMAIN: TS, TSPARMCD: AGEMAX, TSSEQ: 1, TSPARM: Route}
config:
  standard: sdtmig
  standard_version: '3.4'
library_mocks:
  classes:
    trial design: [TS]
expected_violations:
  - rule_id: CDISC-CG0307
    dataset: TS
    row_key: {STUDYID: S1, TSPARMCD: AGEMAX, TSSEQ: 1}
    status: SUCCESS
    output_variables:
      TSPARM: Route
      TSPARMCD: AGEMAX
  - rule_id: CDISC-CG0307
    dataset: TS
    row_key: {STUDYID: S1, TSPARMCD: ROUTE, TSSEQ: 1}
    status: SUCCESS
    output_variables:
      TSPARM: Route
      TSPARMCD: ROUTE
expected_errors: []
