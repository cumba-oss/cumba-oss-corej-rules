name: CDISC-CG0079
kind: rule
description: |
  Wave 2 port — cross-dataset shape.
  CORE-000236: MH.MHSTDTC should not be later than DM.RFSTDTC. Two-leaf check
  (non_empty + date comparison).
python_source: rules-sdtmig-3-4.json (CORE-000236)
rule:
  coreId: CDISC-CG0079
datasets:
  MH:
    row_key: [STUDYID, USUBJID, MHSEQ]
    rows:
      - {STUDYID: S1, DOMAIN: MH, USUBJID: '001', MHSEQ: 1, MHSTDTC: '2023-01-01'}        # ok (before RFSTDTC)
      - {STUDYID: S1, DOMAIN: MH, USUBJID: '002', MHSEQ: 1, MHSTDTC: '2023-03-01'}        # bad (after RFSTDTC)
      - {STUDYID: S1, DOMAIN: MH, USUBJID: '003', MHSEQ: 1, MHSTDTC: ''}                  # empty → not flagged
  DM:
    rows:
      - {STUDYID: S1, DOMAIN: DM, USUBJID: '001', RFSTDTC: '2023-02-01'}
      - {STUDYID: S1, DOMAIN: DM, USUBJID: '002', RFSTDTC: '2023-02-01'}
      - {STUDYID: S1, DOMAIN: DM, USUBJID: '003', RFSTDTC: '2023-02-01'}
config:
  standard: sdtmig
  standard_version: '3.4'
library_mocks:
  classes:
    events: [MH]
    special-purpose: [DM]
expected_violations:
  - rule_id: CDISC-CG0079
    dataset: MH
    row_key: {MHSEQ: 1, STUDYID: S1, USUBJID: '002'}
    status: SUCCESS
    output_variables:
      DM.RFSTDTC: '2023-02-01'
      MHSTDTC: '2023-03-01'
expected_errors: []
