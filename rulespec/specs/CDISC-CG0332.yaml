name: CDISC-CG0332
kind: rule
description: |
  Dataset Metadata Check (Dataset sensitivity). A split dataset whose
  two-character name prefix is no domain present in the study. Binding
  $study_domains yields the study's DOMAIN values (not its member names, so a
  domain submitted only as splits, e.g. LBHE with DOMAIN LB, still counts as
  present). XYHE carries DOMAIN LB; its prefix XY is not in [LB], the name
  matches the split regex, and the prefix is not AP/FA, so the rule fires.
python_source: rules-sdtmig-3-4.json (CORE-000539)
rule:
  coreId: CDISC-CG0332
datasets:
  XYHE:
    row_key: [STUDYID, USUBJID]
    rows:
      - {STUDYID: S1, DOMAIN: LB, USUBJID: '001'}
config:
  standard: sdtmig
  standard_version: '3.4'
library_mocks:
  classes:
    findings: [XYHE]
expected_violations:
  - rule_id: CDISC-CG0332
    dataset: XYHE
    row_key: {STUDYID: S1, USUBJID: '001'}
    status: SUCCESS
    output_variables:
      $study_domains: '[LB]'
      dataset_name: XYHE
expected_errors: []
