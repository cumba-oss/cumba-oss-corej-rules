name: CDISC-AD0205
kind: rule
description: |
  Wave C2 port — T2-MD (Match_Datasets without Operations).
  CDISC-AD0205: ADSL.AGEU must equal DM.AGEU for the matching subject (USUBJID).
  Class-scoped rule (SUBJECT LEVEL ANALYSIS DATASET). Bare-leaf Check (no outer
  all/any wrapper) — Finding #26 quirk on Python's business_rules lane.
python_source: rules-adamig-1-3.json (CDISC-AD0205)
rule:
  coreId: CDISC-AD0205
datasets:
  ADSL:
    row_key: [STUDYID, USUBJID]
    rows:
      - {STUDYID: S1, USUBJID: '001', AGEU: YEARS}        # ok — matches DM.AGEU
      - {STUDYID: S1, USUBJID: '002', AGEU: MONTHS}       # bad — DM.AGEU is YEARS
  DM:
    row_key: [STUDYID, USUBJID]
    rows:
      - {STUDYID: S1, DOMAIN: DM, USUBJID: '001', AGEU: YEARS}
      - {STUDYID: S1, DOMAIN: DM, USUBJID: '002', AGEU: YEARS}
config:
  standard: adamig
  standard_version: '1.3'
library_mocks:
  classes:
    subject level analysis dataset: [ADSL]
    special-purpose: [DM]
expected_violations:
  - rule_id: CDISC-AD0205
    dataset: ADSL
    row_key: {STUDYID: S1, USUBJID: '002'}
    status: SUCCESS
    output_variables:
      AGEU: MONTHS
      DM.AGEU: YEARS
expected_errors: []
