name: CDISC-CG0219
kind: rule
description: |
  Variable-Metadata + Operation port. CDISC-CG0219: a domain based on a general
  observation class must contain at least one Timing variable. Operation
  `get_model_filtered_variables` (role == Timing) builds $timing_variables and
  `get_column_order_from_dataset` builds $dataset_variables; the check fires when
  the dataset shares_no_elements_with the timing list. The AE dataset below has no
  Timing variable (no AESTDTC etc.), so it fires.
python_source: rules-sdtmig-3-4.json (CORE-000575)
rule:
  coreId: CDISC-CG0219
datasets:
  AE:
    row_key: [STUDYID, USUBJID, AESEQ]
    rows:
      - {STUDYID: S1, DOMAIN: AE, USUBJID: '001', AESEQ: 1, AETERM: Headache}
config:
  standard: sdtmig
  standard_version: '3.4'
library_mocks:
  classes:
    events: [AE]
expected_violations:
  - rule_id: CDISC-CG0219
    dataset: AE
    row_key: {AESEQ: 1, STUDYID: S1, USUBJID: '001'}
    status: SUCCESS
    output_variables:
      $dataset_variables: '[AESEQ, AETERM, DOMAIN, STUDYID, USUBJID]'
      $timing_variables: '[AECHDY, AECHENDY, AECHSTDY, AEDETECT, AEDTC, AEDUR, AEDY, AEELTM, AEENDTC, AEENDY, AEENINT, AEENRF, AEENRTPT, AEENTPT, AEEVINTX, AEEVLINT, AENOMDY, AENOMLBL, AEPDUR, AEPTFL, AERFTDTC,
        AERPDY, AERPENDY, AERPSTDY, AESTDTC, AESTDY, AESTINT, AESTRF, AESTRTPT, AESTTPT, AETPT, AETPTNUM, AETPTREF, AEXDY, AEXENDY, AEXSTDY, EPOCH, MIDS, MIDSDTC, RELMIDS, RPHASE, RPPLDY, RPPLENDY, RPPLSTDY,
        TAETORD, VISIT, VISITDY, VISITNUM]'
expected_errors: []
