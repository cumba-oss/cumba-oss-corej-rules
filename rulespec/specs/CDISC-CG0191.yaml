name: CDISC-CG0191
kind: rule
description: |
  Side-batch port (Fix #15 bucket) - MS present, MB absent. Domain
  Presence Check rule with no Outcome.Output_Variables; Fix #15 infers
  the Check leaf names but extractOutputValues drops dataset-name leaves
  (no matching column), so the canonical violation has empty
  output_variables - matching Python's behaviour after the adapter strips
  "Not in dataset" sentinels (Finding #10).
python_source: rules-sdtmig-3-4.json (CORE-000188)
rule:
  coreId: CDISC-CG0191
datasets:
  MS:
    row_key: [STUDYID]
    rows:
      - {STUDYID: S1, DOMAIN: MS}
config:
  standard: sdtmig
  standard_version: '3.4'
library_mocks:
  classes:
    findings: [MS]
expected_violations:
  - rule_id: CDISC-CG0191
    dataset: MS
    row_key: {STUDYID: S1}
    status: SUCCESS
    output_variables: {}
expected_errors: []
