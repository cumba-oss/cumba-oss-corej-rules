name: CDISC-AD0206
kind: rule
description: |
  Wave C2 port — T2-MD (Match_Datasets without Operations).
  CDISC-AD0206: ADSL.SEX must equal DM.SEX for the matching subject (USUBJID).
  Class-scoped rule (SUBJECT LEVEL ANALYSIS DATASET). Bare-leaf Check (no outer
  all/any wrapper) — Finding #26 quirk on Python's business_rules lane.
python_source: rules-adamig-1-3.json (CDISC-AD0206)
rule:
  coreId: CDISC-AD0206
datasets:
  ADSL:
    row_key: [STUDYID, USUBJID]
    rows:
      - {STUDYID: S1, USUBJID: '001', SEX: F}    # ok — matches DM.SEX
      - {STUDYID: S1, USUBJID: '002', SEX: M}    # bad — DM.SEX is F
  DM:
    row_key: [STUDYID, USUBJID]
    rows:
      - {STUDYID: S1, DOMAIN: DM, USUBJID: '001', SEX: F}
      - {STUDYID: S1, DOMAIN: DM, USUBJID: '002', SEX: F}
config:
  standard: adamig
  standard_version: '1.3'
library_mocks:
  classes:
    subject level analysis dataset: [ADSL]
    special-purpose: [DM]
expected_violations:
  - rule_id: CDISC-AD0206
    dataset: ADSL
    row_key: {STUDYID: S1, USUBJID: '002'}
    status: SUCCESS
    output_variables:
      SEX: M
      DM.SEX: F
expected_errors: []
