name: CDISC-AD0816
kind: rule
description: |
  Wave A10 port — T1a PlainSimple.
  CDISC-AD0816: SUBJIDN is populated and SUBJID is not populated.
  Record-data rule scoped to BASIC DATA STRUCTURE; non_empty + empty pair.
python_source: rules-adamig-1-3.json (CDISC-AD0816)
rule:
  coreId: CDISC-AD0816
datasets:
  ADLB:
    row_key: [STUDYID, USUBJID, PARAMCD]
    rows:
      - {STUDYID: S1, USUBJID: '001', PARAMCD: 'HGB', SUBJIDN: '', SUBJID: ''}      # ok
      - {STUDYID: S1, USUBJID: '002', PARAMCD: 'HGB', SUBJIDN: 'X', SUBJID: ''}     # bad
config:
  standard: adamig
  standard_version: '1.3'
library_mocks:
  classes:
    basic data structure: [ADLB]
expected_violations:
  - rule_id: CDISC-AD0816
    dataset: ADLB
    row_key: {PARAMCD: HGB, STUDYID: S1, USUBJID: '002'}
    status: SUCCESS
    output_variables:
      SUBJID: null
      SUBJIDN: 'X'
expected_errors: []
