name: CDISC-CG0391
kind: rule
description: |
  Wave 13 port - AESDTH populated with value other than Y/N. Non-wildcard Record-Data rule with
  explicit Output_Variables (no Fix #17 wildcard resolution involved).
python_source: rules-sdtmig-3-4.json (CORE-000126)
rule:
  coreId: CDISC-CG0391
datasets:
  AE:
    row_key: [STUDYID, USUBJID, AESEQ]
    rows:
      - {STUDYID: S1, DOMAIN: AE, USUBJID: '001', AESEQ: 1, AESDTH: N}
      - {STUDYID: S1, DOMAIN: AE, USUBJID: '002', AESEQ: 1, AESDTH: U}
config:
  standard: sdtmig
  standard_version: '3.4'
library_mocks:
  classes:
    events: [AE]
expected_violations:
  - rule_id: CDISC-CG0391
    dataset: AE
    row_key: {AESEQ: 1, STUDYID: S1, USUBJID: '002'}
    status: SUCCESS
    output_variables:
      AESDTH: U
expected_errors: []
