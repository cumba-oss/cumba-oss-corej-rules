name: CDISC-AD0417
kind: rule
description: |
  Wave A4 port — T1a PlainSimple.
  CDISC-AD0417: TRTSEQAN is populated while TRTSEQA is empty.
  Record-data rule scoped to SUBJECT LEVEL ANALYSIS DATASET; non_empty + empty pair.
python_source: rules-adamig-1-3.json (CDISC-AD0417)
rule:
  coreId: CDISC-AD0417
datasets:
  ADSL:
    row_key: [STUDYID, USUBJID]
    rows:
      - {STUDYID: S1, USUBJID: '001', TRTSEQAN: '', TRTSEQA: ''}      # ok
      - {STUDYID: S1, USUBJID: '002', TRTSEQAN: '1', TRTSEQA: ''}     # bad
config:
  standard: adamig
  standard_version: '1.3'
library_mocks:
  classes:
    subject level analysis dataset: [ADSL]
# PLAN-message-folded-corpus-alignment (2026-10-07): the trigger column is blank or absent on every
# fixture row, so the rule now reports ONE dataset-level finding (Outcome.Message_Folded, D5) where
# it reported per row; the per-row rows were replaced by the collapsed one (anchored at the first
# firing row, columns listed by name).
expected_violations:
- rule_id: CDISC-AD0417
  dataset: ADSL
  row_key: {STUDYID: S1, USUBJID: '002'}
  status: SUCCESS
  output_variables: {}
  name_only: [TRTSEQA, TRTSEQAN]
expected_errors: []
