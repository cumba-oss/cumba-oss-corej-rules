name: CDISC-AD0380
kind: rule
description: |
  Wave A3 port — T1a PlainSimple.
  CDISC-AD0380: BTOXGR populated while BTOXGRN is empty.
  Record-data rule scoped to BASIC DATA STRUCTURE; non_empty + empty pair.
python_source: rules-adamig-1-3.json (CDISC-AD0380)
rule:
  coreId: CDISC-AD0380
datasets:
  ADLB:
    row_key: [STUDYID, USUBJID, PARAMCD]
    rows:
      - {STUDYID: S1, USUBJID: '001', PARAMCD: 'HGB', BTOXGR: '', BTOXGRN: ''}        # ok
      - {STUDYID: S1, USUBJID: '002', PARAMCD: 'HGB', BTOXGR: 'HIGH', BTOXGRN: ''}    # bad
config:
  standard: adamig
  standard_version: '1.3'
library_mocks:
  classes:
    basic data structure: [ADLB]
# PLAN-message-folded-corpus-alignment (2026-10-07): the trigger column is blank or absent on every
# fixture row, so the rule now reports ONE dataset-level finding (Outcome.Message_Folded, D5) where
# it reported per row; the per-row rows were replaced by the collapsed one (anchored at the first
# firing row, columns listed by name).
expected_violations:
- rule_id: CDISC-AD0380
  dataset: ADLB
  row_key: {PARAMCD: HGB, STUDYID: S1, USUBJID: '002'}
  status: SUCCESS
  output_variables: {}
  name_only: [BTOXGR, BTOXGRN]
expected_errors: []
