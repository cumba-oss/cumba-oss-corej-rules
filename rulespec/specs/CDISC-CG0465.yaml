name: CDISC-CG0465
kind: rule
description: |
  Record-Data. IDVAR/IDVARVAL both exist; IDVAR is empty but IDVARVAL is
  populated. The SUPPDM row sets IDVAR='' and IDVARVAL='001', so the rule
  fires.
python_source: rules-sdtmig-3-4.json (CORE-000218)
rule:
  coreId: CDISC-CG0465
datasets:
  SUPPDM:
    row_key: [STUDYID, USUBJID, QNAM]
    rows:
      - {STUDYID: S1, RDOMAIN: DM, USUBJID: '001', IDVAR: '', IDVARVAL: '001', QNAM: RACE1, QLABEL: Race 1, QVAL: WHITE}
config:
  standard: sdtmig
  standard_version: '3.4'
library_mocks:
  classes:
    relationship: [SUPPDM]
    special-purpose: [SUPPDM]
# PLAN-message-folded-corpus-alignment (2026-10-07): the trigger column is blank or absent on every
# fixture row, so the rule now reports ONE dataset-level finding (Outcome.Message_Folded, D5) where
# it reported per row; the per-row rows were replaced by the collapsed one (anchored at the first
# firing row, columns listed by name).
expected_violations:
- rule_id: CDISC-CG0465
  dataset: SUPPDM
  row_key: {QNAM: RACE1, STUDYID: S1, USUBJID: '001'}
  status: SUCCESS
  output_variables: {}
  name_only: [IDVAR, IDVARVAL]
expected_errors: []
