name: FDA-SD1016
kind: rule
description: |
  EC-32(a) / Fix #126 pin — absent Match_Dataset half. FDA-SD1016: every IE
  record's (IETESTCD, IETEST, IECAT) must match a TI entry; the Check is
  `TI.IETESTCD empty` over a left join. The TI dataset is GENUINELY ABSENT from
  this study: the fork used to KeyError on the first `TI.IETESTCD` read and skip
  the rule; it now materialises the referenced column as null
  (coreJ registers no lookup — RuleRunner.buildJoinedDatasets — and `empty`
  fires on an absent column, ExprCompiler.FIRES_ON_ABSENT_COLUMN), so BOTH IE
  rows fire. FDA-SD0071 shares this shape and rides on it.

  ⭐ SUPERSEDED 2026-09-25 (PLAN-join-key-authoring-gate, owner ruling Q2 amended — the
  pairing gate): every key column now carries a Requirements.Variables.All_Or_None group
  [KEY, TI.KEY], and the first key IETESTCD is also required in All (Q9). With TI absent,
  [IETESTCD, TI.IETESTCD] is only partly present and the rule SKIPS instead of reporting every
  IE row against a trial-inclusion table that does not exist — a non-executable rule is a skip,
  not a finding. The dataset setup is kept unchanged, so this spec now pins the skip.
python_source: rules-sdtmig-3-4.json (FDA-SD1016)
rule:
  coreId: FDA-SD1016
datasets:
  IE:
    row_key: [STUDYID, USUBJID, IESEQ]
    rows:
      - {STUDYID: S1, DOMAIN: IE, USUBJID: '001', IESEQ: 1, IETESTCD: INCL01, IETEST: Age >= 18, IECAT: INCLUSION}
      - {STUDYID: S1, DOMAIN: IE, USUBJID: '002', IESEQ: 1, IETESTCD: EXCL05, IETEST: Pregnant, IECAT: EXCLUSION}
config:
  standard: sdtmig
  standard_version: '3.4'
library_mocks:
  classes:
    findings: [IE]
# PLAN-join-key-authoring-gate: the join key's All_Or_None pairing group is only partly present,
# so the rule SKIPS (the description's last paragraph).
expected_status: SKIPPED
expected_violations: []
expected_errors: []
