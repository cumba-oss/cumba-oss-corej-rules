name: CDISC-CG0458
kind: rule
description: |
  Record-Data port. CORE-000564: TS records with TSPARMCD INDIC or TDIGRP must
  use TSVCDREF = SNOMED. Two Check leaves: TSPARMCD in [INDIC, TDIGRP] AND
  TSVCDREF != SNOMED. The TS row sets TSPARMCD=INDIC and TSVCDREF=MEDDRA, so the
  rule fires.
python_source: rules-sdtmig-3-3.json (CORE-000564)
rule:
  coreId: CDISC-CG0458
datasets:
  TS:
    row_key: [STUDYID, TSPARMCD, TSSEQ]
    rows:
      - {STUDYID: S1, DOMAIN: TS, TSPARMCD: INDIC, TSSEQ: 1, TSVAL: Asthma, TSVCDREF: MEDDRA}
config:
  standard: sdtmig
  standard_version: '3.3'
library_mocks:
  classes:
    trial-design: [TS]
expected_violations:
  - rule_id: CDISC-CG0458
    dataset: TS
    row_key: {STUDYID: S1, TSPARMCD: INDIC, TSSEQ: 1}
    status: SUCCESS
    output_variables:
      TSPARMCD: INDIC
      TSVCDREF: MEDDRA
expected_errors: []
