name: CDISC-CG0094
kind: rule
description: |
  Wave 10 port - --REASND populated but --STAT is not "NOT DONE". Exercises the broader Fix #17
  bucket: Check leaves with column-as-reference values, exists/not_exists
  column-presence safeguards, or Domains.Exclude scope shapes not covered
  by Waves 8-9.
python_source: rules-sdtmig-3-4.json (CORE-000225)
rule:
  coreId: CDISC-CG0094
datasets:
  LB:
    row_key: [STUDYID, USUBJID, LBSEQ]
    rows:
      - {STUDYID: S1, DOMAIN: LB, USUBJID: '001', LBSEQ: 1, LBREASND: ILL, LBSTAT: NOT DONE}
      - {STUDYID: S1, DOMAIN: LB, USUBJID: '002', LBSEQ: 1, LBREASND: ILL, LBSTAT: DONE}
config:
  standard: sdtmig
  standard_version: '3.4'
library_mocks:
  classes:
    findings: [LB]
expected_violations:
  - rule_id: CDISC-CG0094
    dataset: LB
    row_key: {LBSEQ: 1, STUDYID: S1, USUBJID: '002'}
    status: SUCCESS
    output_variables:
      LBSTAT: DONE
expected_errors: []
