name: CDISC-AD0789
kind: rule
description: |
  Wave C1 port — T2-Op (Operations without Match_Datasets).
  CDISC-AD0789: BDS — when BASETYPE is populated and BASE is populated,
  BASE must equal AVAL at the baseline record (ABLFL='Y') for each
  (USUBJID, PARAMCD, BASETYPE) group.
  Uses Operation `max` on AVAL with filter ABLFL='Y', grouped by
  (USUBJID, PARAMCD, BASETYPE).

  The data now exercises the filter discriminatingly (the Python engine
  honours `filter` on `max`, matching Java) via four group kinds:
  - Subject 001: post-baseline AVAL (14.5) is strictly greater than the
    ABLFL='Y' row's AVAL (13.5) while BASE=13.5 everywhere → no
    violation. An engine that maxes over ALL rows (ignoring the filter)
    would falsely fire here — this is the regression trap.
  - Subject 002: BASE (12.0) differs from the baseline AVAL (14.0) on a
    post-baseline row → genuine violation.
  - Subject 003: no ABLFL='Y' row at all but BASE populated → the
    $-operation value is MISSING for the group, and `not_equal_to`
    against a missing value FIRES on every row whose BASE is populated
    (Python: populated-vs-null is True; Java folds the null target to
    "") → violations on both rows. Semantically right: a populated
    BASE with no baseline record to derive it from is a violation.
  - Subject 004: no ABLFL='Y' row and BASE empty → the `non_empty`
    guard blocks the check → no violation.

  String-typed AVAL/BASE avoid numeric-to-string divergence in
  `output_variables` (Java emits strings, Python emits native numeric).
python_source: rules-adamig-1-3.json (CDISC-AD0789)
rule:
  coreId: CDISC-AD0789
datasets:
  ADLB:
    row_key: [STUDYID, USUBJID, PARAMCD, BASETYPE, AVISITN]
    column_types:
      AVISITN: LONG
    rows:
      # Subject 001 HGB PRE — DISCRIMINATING: post-baseline AVAL=14.5 exceeds
      # the ABLFL=Y row's AVAL=13.5; BASE=13.5 everywhere → no violation (an
      # unfiltered max would compute 14.5 and fire falsely).
      - {STUDYID: S1, USUBJID: '001', PARAMCD: HGB, BASETYPE: PRE, AVISITN: 0, ABLFL: Y, AVAL: '13.5', BASE: '13.5'}
      - {STUDYID: S1, USUBJID: '001', PARAMCD: HGB, BASETYPE: PRE, AVISITN: 1, ABLFL: '', AVAL: '14.5', BASE: '13.5'}
      # Subject 002 HGB PRE — genuine violation: baseline AVAL=14.0 but
      # BASE=12.0 on the post-baseline row.
      - {STUDYID: S1, USUBJID: '002', PARAMCD: HGB, BASETYPE: PRE, AVISITN: 0, ABLFL: Y, AVAL: '14.0', BASE: '14.0'}
      - {STUDYID: S1, USUBJID: '002', PARAMCD: HGB, BASETYPE: PRE, AVISITN: 1, ABLFL: '', AVAL: '13.0', BASE: '12.0'}   # bad
      # Subject 003 HGB PRE — no ABLFL=Y row but BASE populated.
      # $baseline_aval is missing for the group → not_equal_to fires on
      # BOTH rows.
      - {STUDYID: S1, USUBJID: '003', PARAMCD: HGB, BASETYPE: PRE, AVISITN: 1, ABLFL: '', AVAL: '15.0', BASE: '10.0'}   # bad
      - {STUDYID: S1, USUBJID: '003', PARAMCD: HGB, BASETYPE: PRE, AVISITN: 2, ABLFL: '', AVAL: '11.0', BASE: '10.0'}   # bad
      # Subject 004 HGB PRE — no ABLFL=Y row and BASE empty → non_empty guard
      # blocks the check → quiet.
      - {STUDYID: S1, USUBJID: '004', PARAMCD: HGB, BASETYPE: PRE, AVISITN: 1, ABLFL: '', AVAL: '12.5', BASE: ''}
config:
  standard: adamig
  standard_version: '1.3'
library_mocks:
  classes:
    basic data structure: [ADLB]
expected_violations:
  - rule_id: CDISC-AD0789
    dataset: ADLB
    row_key: {AVISITN: 1, BASETYPE: PRE, PARAMCD: HGB, STUDYID: S1, USUBJID: '002'}
    status: SUCCESS
    output_variables:
      $baseline_aval: '14.0'
      AVAL: '13.0'
      BASE: '12.0'
      BASETYPE: PRE
      PARAMCD: HGB
  - rule_id: CDISC-AD0789
    dataset: ADLB
    row_key: {AVISITN: 1, BASETYPE: PRE, PARAMCD: HGB, STUDYID: S1, USUBJID: '003'}
    status: SUCCESS
    output_variables:
      $baseline_aval: '.'
      AVAL: '15.0'
      BASE: '10.0'
      BASETYPE: PRE
      PARAMCD: HGB
  - rule_id: CDISC-AD0789
    dataset: ADLB
    row_key: {AVISITN: 2, BASETYPE: PRE, PARAMCD: HGB, STUDYID: S1, USUBJID: '003'}
    status: SUCCESS
    output_variables:
      $baseline_aval: '.'
      AVAL: '11.0'
      BASE: '10.0'
      BASETYPE: PRE
      PARAMCD: HGB
expected_errors: []
