name: FDA-SD1012
kind: rule
description: |
  EC-32(a) / Fix #126 pin — absent JOIN-KEY half. FDA-SD1012: every SE record's
  (ETCD, ELEMENT) must match a TE entry; the Check is `TE.ETCD empty` over a
  left join keyed on [ETCD, ELEMENT]. TE is PRESENT but the Permissible ELEMENT
  column is absent from SE (the LEFT side), so the merge itself KeyErrors: the
  fork used to re-raise ("COLUMN_NOT_FOUND_IN_DATA") and skip the rule; it now
  keeps the SE dataset and materialises TE.ETCD as null. coreJ REGISTERS the
  lookup for a left-side-missing key (only a right-side-missing key or an
  absent dataset fails DatasetLookup.build): every row's key resolves null,
  TE.ETCD renders "" -> canonical null, and the non-UNPLAN row fires even
  though TE carries a matching ETCD — identical verdict AND rendering in both
  lanes.

  ⭐ SUPERSEDED 2026-09-25 (PLAN-join-key-authoring-gate, owner ruling Q2 amended — the
  pairing gate): every key column now carries a Requirements.Variables.All_Or_None group
  [KEY, TE.KEY]. Here ELEMENT is absent from SE and present in TE, so the group
  [ELEMENT, TE.ELEMENT] is only partly present and the rule SKIPS. The row the text above
  pins as firing was a FLOOD — TE carries the matching ETCD, and the finding came only from
  the one-sided key — and that flood is exactly what the gate exists to remove (§6 Q2 table:
  "SE/TA without ELEMENT (Perm; TE Req) — the ETCD check goes with it"). The dataset setup is
  kept unchanged, so this spec now pins the skip.
python_source: rules-sdtmig-3-4.json (FDA-SD1012)
rule:
  coreId: FDA-SD1012
datasets:
  SE:
    row_key: [STUDYID, USUBJID, SESEQ]
    rows:
      - {STUDYID: S1, DOMAIN: SE, USUBJID: '001', SESEQ: 1, ETCD: SCRN}
      - {STUDYID: S1, DOMAIN: SE, USUBJID: '001', SESEQ: 2, ETCD: UNPLAN}
  TE:
    row_key: [STUDYID, ETCD]
    rows:
      - {STUDYID: S1, DOMAIN: TE, ETCD: SCRN, ELEMENT: Screening, TEDUR: P7D}
config:
  standard: sdtmig
  standard_version: '3.4'
library_mocks:
  classes:
    events: [SE]
# PLAN-join-key-authoring-gate: the join key's All_Or_None pairing group is only partly present,
# so the rule SKIPS (the description's last paragraph).
expected_status: SKIPPED
expected_violations: []
expected_errors: []
