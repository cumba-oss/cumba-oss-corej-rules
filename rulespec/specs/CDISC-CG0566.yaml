name: CDISC-CG0566
kind: rule
description: |
  Record-Data plain. CDISC-CG0566: --CONCU must only be used in MS. Single
  leaf --CONCU exists, scoped to FINDINGS excluding MS. The LB row below
  includes LBCONCU, so the rule fires.
python_source: rules-sdtmig-3-4.json (CORE-000113)
rule:
  coreId: CDISC-CG0566
datasets:
  LB:
    row_key: [STUDYID, USUBJID, LBSEQ]
    rows:
      - {STUDYID: S1, DOMAIN: LB, USUBJID: '001', LBSEQ: 1, LBCONCU: '%'}
config:
  standard: sdtmig
  standard_version: '3.4'
library_mocks:
  classes:
    findings: [LB]
expected_violations:
  - rule_id: CDISC-CG0566
    dataset: LB
    row_key: {LBSEQ: 1, STUDYID: S1, USUBJID: '001'}
    status: SUCCESS
    output_variables: {}
    name_only: [LBCONCU]
expected_errors: []
