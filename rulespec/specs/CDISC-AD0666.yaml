name: CDISC-AD0666
kind: rule
description: |
  Wave A8 port — T1a PlainSimple.
  CDISC-AD0666: DOSPCTDF is populated but DOSEP and DOSEA are not populated (ADNCA v1.0).
  Record-data rule scoped to BASIC DATA STRUCTURE; non_empty + empty + empty.
python_source: rules-adamig-1-3.json (CDISC-AD0666)
rule:
  coreId: CDISC-AD0666
datasets:
  ADNCA:
    row_key: [STUDYID, USUBJID, PARAMCD, AVISITN]
    column_types:
      AVISITN: LONG
      NFRLT: DOUBLE
      AFRLT: DOUBLE
    rows:
      - {STUDYID: S1, USUBJID: '001', PARAMCD: HGB, AVISITN: 1, DOSPCTDF: '', DOSEP: '', DOSEA: '', NFRLT: 0.0, AFRLT: 0.0}      # ok
      - {STUDYID: S1, USUBJID: '002', PARAMCD: HGB, AVISITN: 1, DOSPCTDF: Y, DOSEP: '', DOSEA: '', NFRLT: 0.0, AFRLT: 0.0}       # bad
config:
  standard: adamig
  standard_version: '1.3'
library_mocks:
  classes:
    basic data structure: [ADNCA]
# PLAN-message-folded-corpus-alignment (2026-10-07): the trigger column is blank or absent on every
# fixture row, so the rule now reports ONE dataset-level finding (Outcome.Message_Folded, D5) where
# it reported per row; the per-row rows were replaced by the collapsed one (anchored at the first
# firing row, columns listed by name).
expected_violations:
- rule_id: CDISC-AD0666
  dataset: ADNCA
  row_key: {AVISITN: 1, PARAMCD: HGB, STUDYID: S1, USUBJID: '002'}
  status: SUCCESS
  output_variables: {}
  name_only: [DOSEA, DOSEP, DOSPCTDF]
expected_errors: []
