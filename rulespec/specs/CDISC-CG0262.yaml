name: CDISC-CG0262
kind: rule
description: |
  Wave 11 port - --VAL enumerated columns have a gap (TSVAL(n+1) populated while TSVAL(n) empty). Covers harder plain bucket:
  complex operators (is_inconsistent_across_dataset, is_not_unique_set,
  target_is_not_sorted_by, inconsistent_enumerated_columns) or multi-leaf
  composite checks that Waves 8-10 did not reach.
python_source: rules-sdtmig-3-4.json (CORE-000582)
rule:
  coreId: CDISC-CG0262
datasets:
  TS:
    row_key: [STUDYID, USUBJID, TSPARMCD]
    rows:
      - {STUDYID: S1, DOMAIN: TS, USUBJID: '001', TSPARMCD: PARAM1, TSVAL: A, TSVAL1: B, TSVAL2: C}
      - {STUDYID: S1, DOMAIN: TS, USUBJID: '002', TSPARMCD: PARAM2, TSVAL: A, TSVAL1: '', TSVAL2: C}
config:
  standard: sdtmig
  standard_version: '3.4'
library_mocks:
  classes:
    trial design: [TS]
expected_violations:
  - rule_id: CDISC-CG0262
    dataset: TS
    row_key: {STUDYID: S1, TSPARMCD: PARAM2, USUBJID: '002'}
    status: SUCCESS
    output_variables:
      TSVAL: A
expected_errors: []
