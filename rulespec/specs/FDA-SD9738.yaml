name: FDA-SD9738
kind: rule
description: |
  Wave 8 port — Negative --DOSTOT value. Fix #17 resolves `--`-prefixed
  Output_Variables against the primary domain prefix.
python_source: rules-sdtmig-3-4.json (CORE-000517)
rule:
  coreId: FDA-SD9738
datasets:
  EX:
    row_key: [STUDYID, USUBJID, EXSEQ]
    column_types:
      EXDOSTOT: LONG
    rows:
      - {STUDYID: S1, DOMAIN: EX, USUBJID: '001', EXSEQ: 1, EXDOSTOT: 100}
      - {STUDYID: S1, DOMAIN: EX, USUBJID: '002', EXSEQ: 1, EXDOSTOT: -5}
config:
  standard: sdtmig
  standard_version: '3.4'
library_mocks:
  classes:
    interventions: [EX]
expected_violations:
  - rule_id: FDA-SD9738
    dataset: EX
    row_key: {EXSEQ: 1, STUDYID: S1, USUBJID: '002'}
    status: SUCCESS
    output_variables:
      EXDOSTOT: '-5'
expected_errors: []
