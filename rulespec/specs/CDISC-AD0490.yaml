name: CDISC-AD0490
kind: rule
description: |
  Wave A7 port — T1a PlainSimple.
  CDISC-AD0490: On a given record, LVOTFL is populated and LVOTFN is not populated.
  Record-data rule scoped to BDS/OCCDS; non_empty + empty pair.
python_source: rules-adamig-1-3.json (CDISC-AD0490)
rule:
  coreId: CDISC-AD0490
datasets:
  ADLB:
    row_key: [STUDYID, USUBJID, PARAMCD]
    rows:
      - {STUDYID: S1, USUBJID: '001', PARAMCD: 'HGB', LVOTFL: '',  LVOTFN: ''}   # ok
      - {STUDYID: S1, USUBJID: '002', PARAMCD: 'HGB', LVOTFL: 'Y', LVOTFN: ''}   # bad
config:
  standard: adamig
  standard_version: '1.3'
library_mocks:
  classes:
    basic data structure: [ADLB]
# PLAN-message-folded-corpus-alignment (2026-10-07): the trigger column is blank or absent on every
# fixture row, so the rule now reports ONE dataset-level finding (Outcome.Message_Folded, D5) where
# it reported per row; the per-row rows were replaced by the collapsed one (anchored at the first
# firing row, columns listed by name).
expected_violations:
- rule_id: CDISC-AD0490
  dataset: ADLB
  row_key: {PARAMCD: HGB, STUDYID: S1, USUBJID: '002'}
  status: SUCCESS
  output_variables: {}
  name_only: [LVOTFL, LVOTFN]
expected_errors: []
