name: CDISC-AD0490
kind: rule
description: |
  Wave A7 port — T1a PlainSimple.
  CDISC-AD0490: On a given record, LVOTFL is populated and LVOTFN is not populated.
  Record-data rule scoped to BDS/OCCDS; non_empty + empty pair.
python_source: rules-adamig-1-3.json (CDISC-AD0490)
rule:
  coreId: CDISC-AD0490
datasets:
  ADLB:
    row_key: [STUDYID, USUBJID, PARAMCD]
    rows:
      - {STUDYID: S1, USUBJID: '001', PARAMCD: 'HGB', LVOTFL: '',  LVOTFN: ''}   # ok
      - {STUDYID: S1, USUBJID: '002', PARAMCD: 'HGB', LVOTFL: 'Y', LVOTFN: ''}   # bad
config:
  standard: adamig
  standard_version: '1.3'
library_mocks:
  classes:
    basic data structure: [ADLB]
expected_violations:
  - rule_id: CDISC-AD0490
    dataset: ADLB
    row_key: {PARAMCD: HGB, STUDYID: S1, USUBJID: '002'}
    status: SUCCESS
    output_variables:
      LVOTFL: 'Y'
      LVOTFN: null
expected_errors: []
