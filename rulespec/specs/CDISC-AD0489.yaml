name: CDISC-AD0489
kind: rule
description: |
  Wave A7 port — T1a PlainSimple.
  CDISC-AD0489: On a given record, ONTRTFN is populated and ONTRTFL is not populated.
  Record-data rule scoped to BDS/OCCDS; non_empty + empty pair.
python_source: rules-adamig-1-3.json (CDISC-AD0489)
rule:
  coreId: CDISC-AD0489
datasets:
  ADLB:
    row_key: [STUDYID, USUBJID, PARAMCD]
    column_types:
      ONTRTFN: LONG
    rows:
      - {STUDYID: S1, USUBJID: '001', PARAMCD: 'HGB', ONTRTFN: null, ONTRTFL: ''}    # ok
      - {STUDYID: S1, USUBJID: '002', PARAMCD: 'HGB', ONTRTFN: 1,    ONTRTFL: ''}    # bad
config:
  standard: adamig
  standard_version: '1.3'
library_mocks:
  classes:
    basic data structure: [ADLB]
# PLAN-message-folded-corpus-alignment (2026-10-07): the trigger column is blank or absent on every
# fixture row, so the rule now reports ONE dataset-level finding (Outcome.Message_Folded, D5) where
# it reported per row; the per-row rows were replaced by the collapsed one (anchored at the first
# firing row, columns listed by name).
expected_violations:
- rule_id: CDISC-AD0489
  dataset: ADLB
  row_key: {PARAMCD: HGB, STUDYID: S1, USUBJID: '002'}
  status: SUCCESS
  output_variables: {}
  name_only: [ONTRTFL, ONTRTFN]
expected_errors: []
