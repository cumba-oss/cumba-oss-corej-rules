name: CDISC-AD0353
kind: rule
description: |
  Filter-on-max parity fixture.
  CDISC-AD0353: When BASETYPE is present and ByIND is populated, ByIND
  must equal AyIND at the baseline record (ABLFL='Y') for each
  (USUBJID, PARAMCD, BASETYPE) group. Uses Operation `max` on AyIND
  with filter ABLFL='Y', grouped by (USUBJID, PARAMCD, BASETYPE).

  The rule carries the ADaM `y` wildcard (AyIND/ByIND). Neither engine
  expands variable-name wildcards at runtime, so the spec pins y=1 with
  a fully inline rule (Check/Operations/Output_Variables use A1IND/B1IND)
  and the data provides the matching A1IND/B1IND columns.

  The data exercises the filter discriminatingly (the Python engine
  honours `filter` on `max`, matching Java) via three group kinds:
  - Subject 001: post-baseline A1IND ('NORMAL') is strictly greater
    (lexicographically) than the ABLFL='Y' row's A1IND ('LOW') while
    B1IND='LOW' everywhere -> no violation. An engine that maxes over
    ALL rows (ignoring the filter) would falsely fire here - this is
    the regression trap.
  - Subject 002: B1IND ('LOW') differs from the baseline A1IND
    ('NORMAL') on a post-baseline row -> genuine violation.
  - Subject 003: no ABLFL='Y' row -> the $-operation value is missing
    for the group and `not_equal_to` fires on every row whose B1IND is
    populated (both engines agree: populated-vs-missing is unequal).
    The second row keeps B1IND empty, so the non_empty guard keeps it
    quiet.
  Fully inline pin (D1/D4, PLAN-parity-java-lane-native-corpus): no
  coreId resolution - the `rule:` block below is the complete pinned
  body, derived from the rules-src entry (expression form since the
  wave-43 flip) plus the historical y=1 override.
  PinnedSpecSyncGuardTest fingerprints the source rule
  (`pinned_from.rules_src_sha256`); when the source changes, re-derive
  this block and update the fingerprint.
python_source: rules-adamig-1-1.json (CDISC-AD0353)
pinned_from:
  core_id: CDISC-AD0353
  rules_src_sha256: 91a6baf218872ca620b41216a8d8fb96bb9f01c388080f353263069962e052c0
rule:
  Core:
    Id: CDISC-AD0353
    Status: Published
    Version: '1'
  Description: "Raise an error when BASETYPE is present, ByIND is populated, and ByIND does not equal the AyIND value where ABLFL equals Y, for the same subject, parameter, and BASETYPE"
  Sensitivity: Record
  Executability: Fully Executable
  Scope:
    Data_Structures:
      Include:
      - BASIC DATA STRUCTURE
  Bindings:
  - name: $baseline_ayind
    expression: 'max("A1IND", group=[USUBJID, PARAMCD, BASETYPE], filter=filter(ABLFL="Y"))'
  Check:
    expression: 'var_exists("BASETYPE") and not empty(B1IND) and B1IND != $baseline_ayind'
  Outcome:
    Message: "BASETYPE is present and ByIND is populated, but ByIND does not equal the AyIND value where ABLFL equals Y, for this subject, parameter, and BASETYPE."
    Output_Variables:
    - PARAMCD
    - BASETYPE
    - B1IND
  wildcards:
    y:
      min: 1
      max: 99
datasets:
  ADLB:
    row_key: [STUDYID, USUBJID, PARAMCD, BASETYPE, AVISITN]
    column_types:
      AVISITN: LONG
    rows:
      # Subject 001 HGB PRE - DISCRIMINATING: post-baseline A1IND='NORMAL'
      # exceeds the ABLFL=Y row's A1IND='LOW'; B1IND='LOW' everywhere ->
      # no violation (an unfiltered max would compute 'NORMAL' and fire falsely).
    - {STUDYID: S1, USUBJID: '001', PARAMCD: HGB, BASETYPE: PRE, AVISITN: 0, ABLFL: 'Y', A1IND: 'LOW', B1IND: 'LOW'}
    - {STUDYID: S1, USUBJID: '001', PARAMCD: HGB, BASETYPE: PRE, AVISITN: 1, ABLFL: '', A1IND: 'NORMAL', B1IND: 'LOW'}
      # Subject 002 HGB PRE - genuine violation: baseline A1IND='NORMAL'
      # but B1IND='LOW' on the post-baseline row.
    - {STUDYID: S1, USUBJID: '002', PARAMCD: HGB, BASETYPE: PRE, AVISITN: 0, ABLFL: 'Y', A1IND: 'NORMAL', B1IND: 'NORMAL'}
    - {STUDYID: S1, USUBJID: '002', PARAMCD: HGB, BASETYPE: PRE, AVISITN: 1, ABLFL: '', A1IND: 'LOW', B1IND: 'LOW'}        # bad
      # Subject 003 HGB PRE - no ABLFL=Y row: $baseline_ayind is missing for
      # the group, so the populated-B1IND row fires; the empty-B1IND row is
      # kept quiet by the non_empty guard.
    - {STUDYID: S1, USUBJID: '003', PARAMCD: HGB, BASETYPE: PRE, AVISITN: 1, ABLFL: '', A1IND: 'HIGH', B1IND: 'HIGH'}       # bad (missing $-value)
    - {STUDYID: S1, USUBJID: '003', PARAMCD: HGB, BASETYPE: PRE, AVISITN: 2, ABLFL: '', A1IND: 'LOW', B1IND: ''}
config:
  standard: adamig
  standard_version: '1.3'
library_mocks:
  classes:
    basic data structure: [ADLB]
expected_violations:
- rule_id: CDISC-AD0353
  dataset: ADLB
  row_key: {STUDYID: S1, USUBJID: '002', PARAMCD: HGB, BASETYPE: PRE, AVISITN: 1}
  status: SUCCESS
  output_variables:
    $baseline_ayind: NORMAL
    A1IND: LOW
    ABLFL:
    B1IND: LOW
    BASETYPE: PRE
    PARAMCD: HGB
- rule_id: CDISC-AD0353
  dataset: ADLB
  row_key: {STUDYID: S1, USUBJID: '003', PARAMCD: HGB, BASETYPE: PRE, AVISITN: 1}
  status: SUCCESS
  output_variables:
    $baseline_ayind:
    A1IND: HIGH
    ABLFL:
    B1IND: HIGH
    BASETYPE: PRE
    PARAMCD: HGB
expected_errors: []
