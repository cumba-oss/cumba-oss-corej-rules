name: FDA-SD1452
kind: rule
description: |
  Wave 8 port — Negative --VAMT value. Fix #17 resolves `--`-prefixed
  Output_Variables against the primary domain prefix.
python_source: rules-sdtmig-3-4.json (CORE-000518)
rule:
  coreId: FDA-SD1452
datasets:
  EX:
    row_key: [STUDYID, USUBJID, EXSEQ]
    column_types:
      EXVAMT: LONG
    rows:
      - {STUDYID: S1, DOMAIN: EX, USUBJID: '001', EXSEQ: 1, EXVAMT: 5}
      - {STUDYID: S1, DOMAIN: EX, USUBJID: '002', EXSEQ: 1, EXVAMT: -1}
config:
  standard: sdtmig
  standard_version: '3.4'
library_mocks:
  classes:
    interventions: [EX]
expected_violations:
  - rule_id: FDA-SD1452
    dataset: EX
    row_key: {EXSEQ: 1, STUDYID: S1, USUBJID: '002'}
    status: SUCCESS
    output_variables:
      EXVAMT: '-1'
expected_errors: []
