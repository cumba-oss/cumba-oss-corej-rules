    interventions: [CM]
expected_violations:
  - rule_id: CDISC-CG0089
    dataset: CM
    row_key: {CMSEQ: 1, STUDYID: S1, USUBJID: '002'}
    status: SUCCESS
    output_variables:
      CMOCCUR: Y
      CMPRESP: N
