    rows:
      - {STUDYID: S1, DOMAIN: CM, USUBJID: '001', CMSEQ: 1, CMPRESP: Y, CMOCCUR: Y}
      - {STUDYID: S1, DOMAIN: CM, USUBJID: '002', CMSEQ: 1, CMPRESP: N, CMOCCUR: Y}
config:
  standard: sdtmig
  standard_version: '3.4'
library_mocks:
