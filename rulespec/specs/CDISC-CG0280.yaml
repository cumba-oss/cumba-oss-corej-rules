name: CDISC-CG0280
kind: rule
description: |
  Record Data. CDISC-CG0280: when TSPARMCD == RANDQT, TSVAL must be a number between
  0 and 1. Check is all[ TSPARMCD == RANDQT, TSVAL non_empty, TSVAL not_matches
  ^(0.[0-9]+?)$, TSVAL not_matches ^[1]$ ]. The TS row sets TSVAL=5 which is not in
  range, so all leaves are satisfied and it fires.
python_source: rules-sdtmig-3-3.json (CORE-000335)
rule:
  coreId: CDISC-CG0280
datasets:
  TS:
    row_key: [STUDYID, TSSEQ]
    rows:
      - {STUDYID: S1, DOMAIN: TS, TSSEQ: 1, TSPARMCD: RANDQT, TSPARM: Randomization Quotient, TSVAL: '5'}
config:
  standard: sdtmig
  standard_version: '3.3'
library_mocks:
  classes:
    trial-design: [TS]
expected_violations:
  - rule_id: CDISC-CG0280
    dataset: TS
    row_key: {STUDYID: S1, TSSEQ: 1}
    status: SUCCESS
    output_variables:
      TSPARMCD: RANDQT
      TSVAL: '5'
expected_errors: []
