name: CDISC-CG0066
kind: rule
description: |
  Record-Data plain. CDISC-CG0066: when DSCAT = 'PROTOCOL MILESTONE', DSTERM
  must equal DSDECOD. Two leaves: DSCAT == 'PROTOCOL MILESTONE' (literal) AND
  DSTERM != DSDECOD (column ref). The DS row has matching DSCAT and DSTERM
  differing from DSDECOD, so the rule fires.
python_source: rules-sdtmig-3-2.json (CORE-000322)
rule:
  coreId: CDISC-CG0066
datasets:
  DS:
    row_key: [STUDYID, USUBJID, DSSEQ]
    rows:
      - {STUDYID: S1, DOMAIN: DS, USUBJID: '001', DSSEQ: 1, DSCAT: PROTOCOL MILESTONE, DSTERM: Informed Consent Obtained, DSDECOD: INFORMED CONSENT OBTAINED}
config:
  standard: sdtmig
  standard_version: '3.2'
library_mocks:
  classes:
    events: [DS]
expected_violations:
  - rule_id: CDISC-CG0066
    dataset: DS
    row_key: {DSSEQ: 1, STUDYID: S1, USUBJID: '001'}
    status: SUCCESS
    output_variables:
      DSCAT: PROTOCOL MILESTONE
      DSDECOD: INFORMED CONSENT OBTAINED
      DSTERM: Informed Consent Obtained
expected_errors: []
