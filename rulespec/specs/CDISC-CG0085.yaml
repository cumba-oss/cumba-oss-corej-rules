name: CDISC-CG0085
kind: rule
description: |
  Wave 10 port - --PRESP populated with a value other than "Y". Exercises the broader Fix #17
  bucket: Check leaves with column-as-reference values, exists/not_exists
  column-presence safeguards, or Domains.Exclude scope shapes not covered
  by Waves 8-9.
python_source: rules-sdtmig-3-4.json (CORE-000260)
rule:
  coreId: CDISC-CG0085
datasets:
  AE:
    row_key: [STUDYID, USUBJID, AESEQ]
    rows:
      - {STUDYID: S1, DOMAIN: AE, USUBJID: '001', AESEQ: 1, AEPRESP: Y}
      - {STUDYID: S1, DOMAIN: AE, USUBJID: '002', AESEQ: 1, AEPRESP: N}
config:
  standard: sdtmig
  standard_version: '3.4'
library_mocks:
  classes:
    events: [AE]
expected_violations:
  - rule_id: CDISC-CG0085
    dataset: AE
    row_key: {AESEQ: 1, STUDYID: S1, USUBJID: '002'}
    status: SUCCESS
    output_variables:
      AEPRESP: N
expected_errors: []
