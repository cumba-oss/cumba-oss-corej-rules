name: rule_simple_dm_age_below_18
kind: rule
description: |
  Hand-authored Milestone-1 pilot spec for the kind=rule path.
  Synthetic rule — fires for every DM row where AGE < 18.
  Mirrors a typical "Record Data" rule: explicit Scope, single check leaf,
  Output_Variables matching the row_key.
rule:
  id: pilot-rule-1
  Core: {Id: PILOT-AGE-LT-18}
  Description: AGE must be 18 or older.
  Sensitivity: Record
  Executability: Fully Executable
  Scope:
    Domains: {Include: [DM]}
  Check:
    expression: 'AGE < 18'
  Outcome:
    Message: AGE is below 18.
    Output_Variables: [STUDYID, USUBJID, AGE]
datasets:
  DM:
    rows:
      - {STUDYID: "S1", USUBJID: "001", AGE: 25}
      - {STUDYID: "S1", USUBJID: "002", AGE: 17}
      - {STUDYID: "S1", USUBJID: "003", AGE: 16}
      - {STUDYID: "S1", USUBJID: "004", AGE: 18}
config:
  standard: sdtmig
  standard_version: "3.4"
expected_violations:
  - rule_id: PILOT-AGE-LT-18
    dataset: DM
    row_key: {STUDYID: "S1", USUBJID: "002"}
    status: SUCCESS
    output_variables: {STUDYID: "S1", USUBJID: "002", AGE: "17"}
  - rule_id: PILOT-AGE-LT-18
    dataset: DM
    row_key: {STUDYID: "S1", USUBJID: "003"}
    status: SUCCESS
    output_variables: {STUDYID: "S1", USUBJID: "003", AGE: "16"}
expected_errors: []
