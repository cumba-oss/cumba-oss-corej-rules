name: CDISC-CG0441
kind: rule
description: |
  Record-Data plain. CDISC-CG0441: TSPARMCD='STOPRULE' but TSVAL empty. TS row
  sets TSPARMCD=STOPRULE with empty TSVAL so both leaves fire.
python_source: rules-sdtmig-3-3.json (CORE-000467)
rule:
  coreId: CDISC-CG0441
datasets:
  TS:
    row_key: [STUDYID, TSPARMCD, TSSEQ]
    rows:
      - {STUDYID: S1, DOMAIN: TS, TSSEQ: 1, TSPARMCD: STOPRULE, TSVAL: ''}
config:
  standard: sdtmig
  standard_version: '3.3'
library_mocks:
  classes:
    trial design: [TS]
# PLAN-message-folded-corpus-alignment (2026-10-07): the trigger column is blank or absent on every
# fixture row, so the rule now reports ONE dataset-level finding (Outcome.Message_Folded, D5) where
# it reported per row; the per-row rows were replaced by the collapsed one (anchored at the first
# firing row, columns listed by name).
expected_violations:
- rule_id: CDISC-CG0441
  dataset: TS
  row_key: {STUDYID: S1, TSPARMCD: STOPRULE, TSSEQ: 1}
  status: SUCCESS
  output_variables: {}
  name_only: [TSPARMCD, TSVAL]
expected_errors: []
