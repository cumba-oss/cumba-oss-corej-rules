name: CDISC-CG0441
kind: rule
description: |
  Record-Data plain. CORE-000467: TSPARMCD='STOPRULE' but TSVAL empty. TS row
  sets TSPARMCD=STOPRULE with empty TSVAL so both leaves fire.
python_source: rules-sdtmig-3-3.json (CORE-000467)
rule:
  coreId: CDISC-CG0441
datasets:
  TS:
    row_key: [STUDYID, TSPARMCD, TSSEQ]
    rows:
      - {STUDYID: S1, DOMAIN: TS, TSSEQ: 1, TSPARMCD: STOPRULE, TSVAL: ''}
config:
  standard: sdtmig
  standard_version: '3.3'
library_mocks:
  classes:
    trial design: [TS]
expected_violations:
  - rule_id: CDISC-CG0441
    dataset: TS
    row_key: {STUDYID: S1, TSPARMCD: STOPRULE, TSSEQ: 1}
    status: SUCCESS
    output_variables:
      TSPARMCD: STOPRULE
      TSVAL:
expected_errors: []
