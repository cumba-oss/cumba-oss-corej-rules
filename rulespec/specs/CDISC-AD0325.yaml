name: CDISC-AD0325
kind: rule
description: |
  Wave B1 port - T1b PlainIntermediate.
  CDISC-AD0325: Within a value of APERIOD, there is more than one value of ASPER for a given value of ASPERC.
  has_multiple_values_for with within=APERIOD - ASPERC must uniquely determine
  ASPER within each period. Bare-leaf Check at root - Python KeyError; baseline
  Python lane with Java expected.
python_source: rules-adamig-1-3.json (CDISC-AD0325)
rule:
  coreId: CDISC-AD0325
datasets:
  ADLB:
    row_key: [STUDYID, USUBJID, PARAMCD, APERIOD, ASPER, ASPERC]
    column_types:
      APERIOD: LONG
      ASPER: LONG
    rows:
      # APERIOD=1, ASPERC='S1' maps to two distinct ASPER (1 vs 2) -> violation
      - {STUDYID: S1, USUBJID: '001', PARAMCD: HGB, APERIOD: 1, ASPER: 1, ASPERC: S1}
      - {STUDYID: S1, USUBJID: '002', PARAMCD: HGB, APERIOD: 1, ASPER: 2, ASPERC: S1}
      # APERIOD=1, ASPERC='S2' consistent
      - {STUDYID: S1, USUBJID: '003', PARAMCD: HGB, APERIOD: 1, ASPER: 3, ASPERC: S2}
      # APERIOD=2 - different period scope, clean
      - {STUDYID: S1, USUBJID: '004', PARAMCD: HGB, APERIOD: 2, ASPER: 1, ASPERC: S1}
config:
  standard: adamig
  standard_version: '1.3'
library_mocks:
  classes:
    basic data structure: [ADLB]
expected_violations:
  - rule_id: CDISC-AD0325
    dataset: ADLB
    row_key: {APERIOD: 1, ASPER: 1, ASPERC: S1, PARAMCD: HGB, STUDYID: S1, USUBJID: '001'}
    status: SUCCESS
    output_variables:
      APERIOD: '1'
      ASPER: '1'
      ASPERC: S1
  - rule_id: CDISC-AD0325
    dataset: ADLB
    row_key: {APERIOD: 1, ASPER: 2, ASPERC: S1, PARAMCD: HGB, STUDYID: S1, USUBJID: '002'}
    status: SUCCESS
    output_variables:
      APERIOD: '1'
      ASPER: '2'
      ASPERC: S1
expected_errors: []
