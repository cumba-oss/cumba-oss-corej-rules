name: CDISC-CG0031
kind: rule
description: |
  ⭐ 2026-09-22 (review round 2): AE and SV gained VISITNUM. CDISC-CG0031's join was rekeyed from
  USUBJID+VISIT to USUBJID+VISITNUM (VISIT is Perm in SV, and a key component present on one side
  and absent on the other makes the row unequal unconditionally), and the rule now DECLARES
  VISITNUM — so this spec, whose AE carried VISIT alone, began SKIPPING. That skip is correct
  behaviour for a dataset with no VISITNUM; giving the fixture the column keeps it exercising the
  rule's logic instead of its requirements gate. The verdicts are unchanged.
  Wave 22 port — AE primary + SV match (USUBJID,VISIT) + TV distinct VISIT.
python_source: rules-sdtmig-3-4.json (CORE-000269)
rule:
  coreId: CDISC-CG0031
datasets:
  AE:
    row_key: [STUDYID, USUBJID, AESEQ]
    column_types:
      VISITNUM: LONG
    rows:
      - {STUDYID: S1, DOMAIN: AE, USUBJID: '001', AESEQ: 1, VISIT: Screening, VISITNUM: 1}     # ok
      - {STUDYID: S1, DOMAIN: AE, USUBJID: '001', AESEQ: 2, VISIT: Unscheduled, VISITNUM: 99}  # bad
  SV:
    row_key: [STUDYID, USUBJID, VISIT]
    column_types:
      VISITNUM: LONG
    rows:
      - {STUDYID: S1, DOMAIN: SV, USUBJID: '001', VISIT: Screening, VISITNUM: 1, SVPRESP: Y, SVSTDTC: '2026-01-01'}
      - {STUDYID: S1, DOMAIN: SV, USUBJID: '001', VISIT: Unscheduled, VISITNUM: 99, SVPRESP: Y, SVSTDTC: '2026-01-99'}
  TV:
    row_key: [STUDYID, VISITNUM]
    column_types:
      VISITNUM: LONG
    rows:
      - {STUDYID: S1, DOMAIN: TV, VISITNUM: 1, VISIT: Screening, ARMCD: TRT01}
config:
  standard: sdtmig
  standard_version: '3.4'
library_mocks:
  classes:
    events: [AE]
    special-purpose: [SV]
    trial design: [TV]
expected_violations:
  - rule_id: CDISC-CG0031
    dataset: AE
    row_key: {AESEQ: 2, STUDYID: S1, USUBJID: '001'}
    status: SUCCESS
    output_variables:
      $tv_visit: '[Screening]'
      SV.SVPRESP: Y
      VISIT: Unscheduled
      VISITNUM: '99'
expected_errors: []
