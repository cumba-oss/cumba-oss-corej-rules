name: CDISC-CG0031
kind: rule
description: |
  Wave 22 port — AE primary + SV match (USUBJID,VISIT) + TV distinct VISIT.
python_source: rules-sdtmig-3-4.json (CORE-000269)
rule:
  coreId: CDISC-CG0031
datasets:
  AE:
    row_key: [STUDYID, USUBJID, AESEQ]
    rows:
      - {STUDYID: S1, DOMAIN: AE, USUBJID: '001', AESEQ: 1, VISIT: Screening}      # ok
      - {STUDYID: S1, DOMAIN: AE, USUBJID: '001', AESEQ: 2, VISIT: Unscheduled}    # bad
  SV:
    row_key: [STUDYID, USUBJID, VISIT]
    rows:
      - {STUDYID: S1, DOMAIN: SV, USUBJID: '001', VISIT: Screening, SVPRESP: Y, SVSTDTC: '2026-01-01'}
      - {STUDYID: S1, DOMAIN: SV, USUBJID: '001', VISIT: Unscheduled, SVPRESP: Y, SVSTDTC: '2026-01-99'}
  TV:
    row_key: [STUDYID, VISITNUM]
    column_types:
      VISITNUM: LONG
    rows:
      - {STUDYID: S1, DOMAIN: TV, VISITNUM: 1, VISIT: Screening, ARMCD: TRT01}
config:
  standard: sdtmig
  standard_version: '3.4'
library_mocks:
  classes:
    events: [AE]
    special-purpose: [SV]
    trial design: [TV]
expected_violations:
  - rule_id: CDISC-CG0031
    dataset: AE
    row_key: {AESEQ: 2, STUDYID: S1, USUBJID: '001'}
    status: SUCCESS
    output_variables:
      $tv_visit: '[Screening]'
      SV.SVPRESP: Y
      VISIT: Unscheduled
expected_errors: []
