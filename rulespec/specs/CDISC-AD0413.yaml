name: CDISC-AD0413
kind: check_operator
description: |
  EC-1 (has_multiple_values_for excludes empty key/dependent), modelled on
  CDISC-AD0413 (more than one ANLzzFN for a given ANLzzFL, considering only rows
  where both are populated). Concrete instance ANL01FN/ANL01FL. KEY = ANL01FL
  (the `value:` operand), DEPENDENT = ANL01FN (the `name:` operand). ANL01FL='Y'
  maps to two distinct ANL01FN {1,2} → both rows fire. ANL01FL='N' would look
  multi-valued only via a blank-ANL01FN row — post-EC-1 that row is excluded, so
  the populated 'N' row does NOT fire. The blank-key row is excluded too. Both
  engines agree (parity spec, no baseline entry). Rendered as a check_operator
  spec because the Python lane does not expand the ANLzz wildcard in the full rule.
python_notes: |
  Both lanes exclude empty key/dependent rows and flag the two ANL01FL='Y' rows.
python_source: rules-adamig-1-3.json (CDISC-AD0413), EC-1
check:
  name: ANL01FN
  operator: has_multiple_values_for
  value: ANL01FL
datasets:
  ADLB:
    row_key: [STUDYID, USUBJID, ANLSEQ]
    rows:
    - {STUDYID: S1, USUBJID: '001', ANLSEQ: 1, ANL01FL: Y, ANL01FN: '1'}      # key Y -> {1,2} fires
    - {STUDYID: S1, USUBJID: '001', ANLSEQ: 2, ANL01FL: Y, ANL01FN: '2'}      # key Y multiple fires
    - {STUDYID: S1, USUBJID: '001', ANLSEQ: 3, ANL01FL: N, ANL01FN: '3'}      # key N single, no fire
    - {STUDYID: S1, USUBJID: '001', ANLSEQ: 4, ANL01FL: N, ANL01FN: ''}       # blank dependent excluded
    - {STUDYID: S1, USUBJID: '001', ANLSEQ: 5, ANL01FL: '', ANL01FN: '4'}     # blank key excluded
config:
  standard: sdtmig
  standard_version: '3.4'
expected_violations:
- rule_id: AUTO-CDISC-AD0413
  dataset: ADLB
  row_key: {ANLSEQ: 1, STUDYID: S1, USUBJID: '001'}
  status: SUCCESS
  output_variables:
    ANL01FL: Y
    ANL01FN: '1'
    ANLSEQ: '1'
    STUDYID: S1
    USUBJID: '001'
- rule_id: AUTO-CDISC-AD0413
  dataset: ADLB
  row_key: {ANLSEQ: 2, STUDYID: S1, USUBJID: '001'}
  status: SUCCESS
  output_variables:
    ANL01FL: Y
    ANL01FN: '2'
    ANLSEQ: '2'
    STUDYID: S1
    USUBJID: '001'
expected_errors: []
