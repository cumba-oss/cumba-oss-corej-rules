name: C7-COLLAPSE-KEEP
kind: rule
description: |
  D9 (Type 1 opt-out, "Keep_Row_Findings"): the rule declares Message_Folded but keeps the
  per-row findings on --BDSYCD, so the all-blank column does NOT collapse — three row findings.
  The entry is a `--` template, resolved like any variable reference (AE → AEBDSYCD).
python_source: PLAN-present-empty-column-fold (2026-10-06), the sensitivity arm of phase 3 — an inline rule; no shipped rule opts in
rule:
  id: c7-collapse-keep-row-findings
  Core: {Id: C7-COLLAPSE-KEEP}
  Description: "AEBDSYCD must be populated — a Type 1 rule that wants every record reported."
  Sensitivity: Record
  Executability: Fully Executable
  Scope:
    Domains: {Include: [AE]}
  Check:
    expression: 'empty(--BDSYCD)'
  Outcome:
    Message: AEBDSYCD is not populated (per record).
    Message_Folded: AEBDSYCD is not populated on any record of the dataset.
    Keep_Row_Findings: [--BDSYCD]
    Output_Variables: [AEBDSYCD]
datasets:
  AE:
    row_key: [STUDYID, USUBJID, AESEQ]
    rows:
      - {STUDYID: S1, DOMAIN: AE, USUBJID: '001', AESEQ: 1, AEBODSYS: 'Cardiac', AEBDSYCD: ''}
      - {STUDYID: S1, DOMAIN: AE, USUBJID: '002', AESEQ: 1, AEBODSYS: 'Renal', AEBDSYCD: ''}
      - {STUDYID: S1, DOMAIN: AE, USUBJID: '003', AESEQ: 1, AEBODSYS: 'Hepatic', AEBDSYCD: ''}
config:
  standard: sdtmig
  standard_version: '3.4'
expected_status: EXECUTED
expected_violations:
  - rule_id: C7-COLLAPSE-KEEP
    dataset: AE
    row_key: {STUDYID: S1, USUBJID: '001', AESEQ: 1}
    status: SUCCESS
    output_variables: {AEBDSYCD: null}
  - rule_id: C7-COLLAPSE-KEEP
    dataset: AE
    row_key: {STUDYID: S1, USUBJID: '002', AESEQ: 1}
    status: SUCCESS
    output_variables: {AEBDSYCD: null}
  - rule_id: C7-COLLAPSE-KEEP
    dataset: AE
    row_key: {STUDYID: S1, USUBJID: '003', AESEQ: 1}
    status: SUCCESS
    output_variables: {AEBDSYCD: null}
expected_errors: []
