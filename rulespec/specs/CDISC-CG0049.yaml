name: CDISC-CG0049
kind: rule
description: |
  Wave 10 port - --PTCD has multiple distinct --DECOD values (1-to-many mapping). Exercises the broader Fix #17
  bucket: Check leaves with column-as-reference values, exists/not_exists
  column-presence safeguards, or Domains.Exclude scope shapes not covered
  by Waves 8-9.
python_source: rules-sdtmig-3-4.json (CORE-000268)
rule:
  coreId: CDISC-CG0049
datasets:
  AE:
    row_key: [STUDYID, USUBJID, AESEQ]
    rows:
      - {STUDYID: S1, DOMAIN: AE, USUBJID: '001', AESEQ: 1, AEPTCD: '10001', AEDECOD: HEADACHE}
      - {STUDYID: S1, DOMAIN: AE, USUBJID: '002', AESEQ: 1, AEPTCD: '10002', AEDECOD: NAUSEA}
      - {STUDYID: S1, DOMAIN: AE, USUBJID: '003', AESEQ: 1, AEPTCD: '10002', AEDECOD: MIGRAINE}
config:
  standard: sdtmig
  standard_version: '3.4'
library_mocks:
  classes:
    events: [AE]
expected_violations:
  - rule_id: CDISC-CG0049
    dataset: AE
    row_key: {AESEQ: 1, STUDYID: S1, USUBJID: '002'}
    status: SUCCESS
    output_variables:
      AEDECOD: NAUSEA
      AEPTCD: '10002'
  - rule_id: CDISC-CG0049
    dataset: AE
    row_key: {AESEQ: 1, STUDYID: S1, USUBJID: '003'}
    status: SUCCESS
    output_variables:
      AEDECOD: MIGRAINE
      AEPTCD: '10002'
expected_errors: []
