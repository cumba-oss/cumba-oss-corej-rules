name: FDA-SD0015
kind: rule
description: |
  Wave 10 port - --DUR contains a negative sign (ISO 8601 negative duration). Exercises the broader Fix #17
  bucket: Check leaves with column-as-reference values, exists/not_exists
  column-presence safeguards, or Domains.Exclude scope shapes not covered
  by Waves 8-9.
python_source: rules-sdtmig-3-4.json (CORE-000305)
rule:
  coreId: FDA-SD0015
datasets:
  AE:
    row_key: [STUDYID, USUBJID, AESEQ]
    rows:
      - {STUDYID: S1, DOMAIN: AE, USUBJID: '001', AESEQ: 1, AEDUR: PT5H}
      - {STUDYID: S1, DOMAIN: AE, USUBJID: '002', AESEQ: 1, AEDUR: -PT5H}
config:
  standard: sdtmig
  standard_version: '3.4'
library_mocks:
  classes:
    events: [AE]
expected_violations:
  - rule_id: FDA-SD0015
    dataset: AE
    row_key: {AESEQ: 1, STUDYID: S1, USUBJID: '002'}
    status: SUCCESS
    output_variables:
      AEDUR: -PT5H
