name: CDISC-CG0034
kind: rule
description: |
  Wave 22 port — AE primary (non-SV/TV) + SV distinct(VISITNUM) per USUBJID.
  Fires when AE.VISITNUM isn't in SV.VISITNUM for that subject.
python_source: rules-sdtmig-3-4.json (CORE-000168)
rule:
  coreId: CDISC-CG0034
datasets:
  AE:
    row_key: [STUDYID, USUBJID, AESEQ]
    column_types:
      VISITNUM: LONG
    rows:
      - {STUDYID: S1, DOMAIN: AE, USUBJID: '001', AESEQ: 1, VISITNUM: 1}   # ok
      - {STUDYID: S1, DOMAIN: AE, USUBJID: '001', AESEQ: 2, VISITNUM: 99}  # bad
  SV:
    row_key: [STUDYID, USUBJID, VISITNUM]
    column_types:
      VISITNUM: LONG
    rows:
      - {STUDYID: S1, DOMAIN: SV, USUBJID: '001', VISITNUM: 1, SVSTDTC: '2026-01-01'}
      - {STUDYID: S1, DOMAIN: SV, USUBJID: '001', VISITNUM: 2, SVSTDTC: '2026-01-08'}
config:
  standard: sdtmig
  standard_version: '3.4'
library_mocks:
  classes:
    events: [AE]
    special-purpose: [SV]
expected_violations:
  - rule_id: CDISC-CG0034
    dataset: AE
    row_key: {AESEQ: 2, STUDYID: S1, USUBJID: '001'}
    status: SUCCESS
    output_variables:
      $sv_visitnum: '[1, 2]'
      VISITNUM: '99'
expected_errors: []
