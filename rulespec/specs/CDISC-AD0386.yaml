name: CDISC-AD0386
kind: rule
description: |
  Wave A3 port — T1a PlainSimple.
  CDISC-AD0386: BTOXGRLN populated while BTOXGRL is empty.
  Record-data rule scoped to BASIC DATA STRUCTURE; non_empty + empty pair.
python_source: rules-adamig-1-3.json (CDISC-AD0386)
rule:
  coreId: CDISC-AD0386
datasets:
  ADLB:
    row_key: [STUDYID, USUBJID, PARAMCD]
    rows:
      - {STUDYID: S1, USUBJID: '001', PARAMCD: 'HGB', BTOXGRLN: '', BTOXGRL: ''}      # ok
      - {STUDYID: S1, USUBJID: '002', PARAMCD: 'HGB', BTOXGRLN: '1', BTOXGRL: ''}     # bad
config:
  standard: adamig
  standard_version: '1.3'
library_mocks:
  classes:
    basic data structure: [ADLB]
expected_violations:
  - rule_id: CDISC-AD0386
    dataset: ADLB
    row_key: {PARAMCD: HGB, STUDYID: S1, USUBJID: '002'}
    status: SUCCESS
    output_variables:
      BTOXGRL: null
      BTOXGRLN: '1'
expected_errors: []
