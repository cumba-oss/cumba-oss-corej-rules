name: CDISC-CG0373
kind: rule
description: |
  Wave 22 port — SUPP--.RDOMAIN must be a real study domain. Fires when
  RDOMAIN references a dataset not in the study inventory. Since J7,
  study_domains() yields the data-driven DOMAINS (cdiscDomainOf), not the member
  names: AE → "AE"; SUPPAE (a SUPP, no DOMAIN) contributes the empty domain "",
  so the set is "[, AE]". RDOMAIN="ZZ" is absent → fires.
python_source: rules-sdtmig-3-4.json (CORE-000457); PLAN-java-parity-defect-fixes.md (J7)
rule:
  coreId: CDISC-CG0373
datasets:
  SUPPAE:
    row_key: [STUDYID, USUBJID, IDVAR, IDVARVAL, QNAM]
    rows:
      - {STUDYID: S1, DOMAIN: SUPPAE, RDOMAIN: AE, USUBJID: '001', IDVAR: AESEQ, IDVARVAL: '1', QNAM: AESOSP, QLABEL: X, QVAL: x}         # ok
      - {STUDYID: S1, DOMAIN: SUPPAE, RDOMAIN: ZZ, USUBJID: '001', IDVAR: AESEQ, IDVARVAL: '1', QNAM: AESOSP, QLABEL: X, QVAL: x}         # bad
  AE:
    row_key: [STUDYID, USUBJID, AESEQ]
    rows:
      - {STUDYID: S1, DOMAIN: AE, USUBJID: '001', AESEQ: 1, AETERM: Headache}
config:
  standard: sdtmig
  standard_version: '3.4'
library_mocks:
  classes:
    relationship: [SUPPAE]
    events: [AE]
expected_violations:
  - rule_id: CDISC-CG0373
    dataset: SUPPAE
    row_key: {IDVAR: AESEQ, IDVARVAL: '1', QNAM: AESOSP, STUDYID: S1, USUBJID: '001'}
    status: SUCCESS
    output_variables:
      $study_domains: '[, AE]'
      RDOMAIN: ZZ
expected_errors: []
