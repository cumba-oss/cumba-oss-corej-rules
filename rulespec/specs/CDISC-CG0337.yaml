name: CDISC-CG0337
kind: rule
description: |
  Wave 11 port - --CAT equals --DECOD (case-insensitive). Covers harder plain bucket:
  complex operators (is_inconsistent_across_dataset, is_not_unique_set,
  target_is_not_sorted_by, inconsistent_enumerated_columns) or multi-leaf
  composite checks that Waves 8-10 did not reach.
python_source: rules-sdtmig-3-4.json (CORE-000196)
rule:
  coreId: CDISC-CG0337
datasets:
  AE:
    row_key: [STUDYID, USUBJID, AESEQ]
    rows:
      - {STUDYID: S1, DOMAIN: AE, USUBJID: '001', AESEQ: 1, AECAT: SEVERE, AEDECOD: HEADACHE}
      - {STUDYID: S1, DOMAIN: AE, USUBJID: '002', AESEQ: 2, AECAT: headache, AEDECOD: HEADACHE}
config:
  standard: sdtmig
  standard_version: '3.4'
library_mocks:
  classes:
    events: [AE]
expected_violations:
  - rule_id: CDISC-CG0337
    dataset: AE
    row_key: {AESEQ: 2, STUDYID: S1, USUBJID: '002'}
    status: SUCCESS
    output_variables:
      AECAT: headache
      AEDECOD: HEADACHE
expected_errors: []
