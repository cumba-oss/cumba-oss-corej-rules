name: FDA-SD0028
kind: rule
description: |
  Wave 11 port - Normal range upper (--STNRHI) not greater than lower (--STNRLO). Covers harder plain bucket:
  complex operators (is_inconsistent_across_dataset, is_not_unique_set,
  target_is_not_sorted_by, inconsistent_enumerated_columns) or multi-leaf
  composite checks that Waves 8-10 did not reach.
python_source: rules-sdtmig-3-4.json (CORE-000672)
rule:
  coreId: FDA-SD0028
datasets:
  LB:
    row_key: [STUDYID, USUBJID, LBSEQ]
    column_types:
      LBSTNRHI: DOUBLE
      LBSTNRLO: DOUBLE
    rows:
      - {STUDYID: S1, DOMAIN: LB, USUBJID: '001', LBSEQ: 1, LBTESTCD: HGB, LBSTNRLO: 10.0, LBSTNRHI: 15.0}
      - {STUDYID: S1, DOMAIN: LB, USUBJID: '002', LBSEQ: 2, LBTESTCD: GLUC, LBSTNRLO: 15.0, LBSTNRHI: 10.0}
config:
  standard: sdtmig
  standard_version: '3.4'
library_mocks:
  classes:
    findings: [LB]
expected_violations:
  - rule_id: FDA-SD0028
    dataset: LB
    row_key: {LBSEQ: 2, STUDYID: S1, USUBJID: '002'}
    status: SUCCESS
    output_variables:
      LBSTNRHI: '10'
      LBSTNRLO: '15'
      LBTESTCD: GLUC
expected_errors: []
