name: CDISC-CG0270
kind: rule
description: |
  Wave 14 port — `invalid_duration` with `negative: false`. TSVAL for
  TSPARMCD=AGEMAX must be a valid ISO-8601 duration (P1Y, P18Y, PT24H etc.).
  The `negative: false` flag disallows leading-minus durations.
python_source: rules-sdtmig-3-4.json (CORE-000294)
rule:
  coreId: CDISC-CG0270
datasets:
  TS:
    row_key: [STUDYID, TSPARMCD]
    rows:
      - {STUDYID: S1, DOMAIN: TS, TSPARMCD: AGEMAX, TSVAL: P85Y}          # ok (valid)
      - {STUDYID: S1, DOMAIN: TS, TSPARMCD: SSTDTC, TSVAL: garbage}       # ok (not AGEMAX)
      - {STUDYID: S1, DOMAIN: TS, TSPARMCD: AGEMAX, TSVAL: not-a-duration}     # bad
config:
  standard: sdtmig
  standard_version: '3.4'
library_mocks:
  classes:
    trial design: [TS]
expected_violations:
  - rule_id: CDISC-CG0270
    dataset: TS
    row_key: {STUDYID: S1, TSPARMCD: AGEMAX}
    status: SUCCESS
    output_variables:
      TSPARMCD: AGEMAX
      TSVAL: not-a-duration
expected_errors: []
