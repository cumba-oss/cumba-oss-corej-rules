name: CDISC-CG0138
kind: rule
description: |
  Record-Data plain. CDISC-CG0138: a SUPP-- dataset other than SUPPDM must not
  use a QNAM reserved for subject-level population flags. Single leaf QNAM
  is_contained_by_case_insensitive ['COMPLT','FULLSET','ITT','PPROT','SAFETY'].
  The SUPPLB row sets QNAM = ITT, so the rule fires.
python_source: rules-sdtmig-3-2.json (CORE-000533)
rule:
  coreId: CDISC-CG0138
datasets:
  SUPPLB:
    row_key: [STUDYID, USUBJID, IDVAR, IDVARVAL, QNAM]
    rows:
      - {STUDYID: S1, RDOMAIN: LB, USUBJID: '001', IDVAR: '', IDVARVAL: '', QNAM: ITT, QLABEL: Intent-to-Treat Population Flag, QVAL: Y}
config:
  standard: sdtmig
  standard_version: '3.2'
library_mocks:
  classes:
    relationship: [SUPPLB]
expected_violations:
  - rule_id: CDISC-CG0138
    dataset: SUPPLB
    row_key: {IDVAR: '', IDVARVAL: '', QNAM: ITT, STUDYID: S1, USUBJID: '001'}
    status: SUCCESS
    output_variables:
      QNAM: ITT
expected_errors: []
