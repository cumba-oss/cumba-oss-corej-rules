name: CDISC-CG0302
kind: rule
description: |
  Record-Data plain `exists`. TRPORTOT must not be present in the TR dataset.
  The TR row carries a TRPORTOT column, so the rule fires.
python_source: rules-sdtmig-3-4.json (CORE-000076)
rule:
  coreId: CDISC-CG0302
datasets:
  TR:
    row_key: [STUDYID, USUBJID, TRSEQ]
    rows:
      - {STUDYID: S1, DOMAIN: TR, USUBJID: '001', TRSEQ: 1, TRPORTOT: '50'}
config:
  standard: sdtmig
  standard_version: '3.4'
library_mocks:
  classes:
    findings: [TR]
expected_violations:
  - rule_id: CDISC-CG0302
    dataset: TR
    row_key: {STUDYID: S1, TRSEQ: 1, USUBJID: '001'}
    status: SUCCESS
    output_variables:
      TRPORTOT: '50'
expected_errors: []
