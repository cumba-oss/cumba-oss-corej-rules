name: CDISC-AD0688
kind: rule
description: |
  Wave B3 port — T1b PlainIntermediate.
  CDISC-AD0688: Within ADDL there is more than one record for unique values of USUBJID and SPDEVID.
  Record-data rule scoped to DEVICE LEVEL ANALYSIS DATASET with bare-leaf Check.
  Python gap: bare-leaf raises KeyError: 'name' (Finding #26). Baselines on Python lane;
  expected matches Java's is_not_unique_set output.
python_source: rules-adamig-1-3.json (CDISC-AD0688)
rule:
  coreId: CDISC-AD0688
datasets:
  ADDL:
    row_key: [STUDYID, USUBJID, SPDEVID, ASEQ]
    column_types:
      ASEQ: LONG
    rows:
      - {STUDYID: S1, USUBJID: '001', SPDEVID: 'D1', ASEQ: 1}    # bad — duplicate (001, D1)
      - {STUDYID: S1, USUBJID: '001', SPDEVID: 'D1', ASEQ: 2}    # bad — duplicate
      - {STUDYID: S1, USUBJID: '002', SPDEVID: 'D2', ASEQ: 1}    # ok — unique
config:
  standard: adamig
  standard_version: '1.3'
library_mocks:
  classes:
    device level analysis dataset: [ADDL]
expected_violations:
  - rule_id: CDISC-AD0688
    dataset: ADDL
    row_key: {STUDYID: S1, USUBJID: '001', SPDEVID: 'D1', ASEQ: 1}
    status: SUCCESS
    output_variables:
      SPDEVID: 'D1'
  - rule_id: CDISC-AD0688
    dataset: ADDL
    row_key: {STUDYID: S1, USUBJID: '001', SPDEVID: 'D1', ASEQ: 2}
    status: SUCCESS
    output_variables:
      SPDEVID: 'D1'
expected_errors: []
