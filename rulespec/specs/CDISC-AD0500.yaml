name: CDISC-AD0500
kind: rule
description: |
  CDISC-AD0500: the value of APHASE (if populated) must be one of the values in the ADSL
  APHASEw variables. Aligned to rules-legacy: Match_Datasets [ADSL on USUBJID] + Check
  `APHASE non_empty AND APHASE is_not_contained_by ADSL.APHASE${*}`. Java resolves the ${*}
  wildcard column-set against the joined ADSL and fires on USUBJID 002 (APHASE=SCREENING not in
  ADSL {TREATMENT, FOLLOWUP}). Baselined lane=python: the Python harness cannot expand a ${*}
  column-set (is_contained_by raises "only list-like objects … isin()"). Expected = Java output.
python_source: rules-adamig-1-3.json (CDISC-AD0500)
rule:
  coreId: CDISC-AD0500
datasets:
  ADLB:
    row_key: [STUDYID, USUBJID, PARAMCD]
    rows:
      - {STUDYID: S1, USUBJID: '001', PARAMCD: 'HGB', APHASE: ''}           # ok
      - {STUDYID: S1, USUBJID: '002', PARAMCD: 'HGB', APHASE: 'SCREENING'}  # bad — Java fires on non_empty
  ADSL:
    row_key: [STUDYID, USUBJID]
    rows:
      - {STUDYID: S1, USUBJID: '001', APHASE1: 'SCREENING', APHASE2: 'TREATMENT'}
      - {STUDYID: S1, USUBJID: '002', APHASE1: 'TREATMENT', APHASE2: 'FOLLOWUP'}
config:
  standard: adamig
  standard_version: '1.3'
library_mocks:
  classes:
    basic data structure: [ADLB]
expected_violations:
  - rule_id: CDISC-AD0500
    dataset: ADLB
    row_key: {PARAMCD: HGB, STUDYID: S1, USUBJID: '002'}
    status: SUCCESS
    output_variables:
      APHASE: 'SCREENING'
expected_errors: []
