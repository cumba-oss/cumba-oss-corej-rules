name: CDISC-SEND-0059.1
kind: rule
description: |
  EC-22 regression (both lanes), narrowed to the --EVLINT half by the R-5.25 split
  (top-level-or board wave 2, 2026-09-12): CDISC-SEND-0059.1 now flags only --EVLINT values
  that are not a valid ISO 8601 duration; the --ELTM and --DUR halves are the split siblings
  CDISC-SEND-0059.1-A/-B (the -A spec pins the sibling on these same datasets). The check
  pins negative: true, so the signed (leading-minus) interval grammar is accepted. On PC
  (FINDINGS class) the columns resolve to PCEVLINT/PCELTM/PCDUR; the in-Check var_exists
  guard is hoisted to Requirements.Variables.All [--EVLINT], and PCEVLINT is present here so
  the rule executes. Row 1: all valid (PCELTM "-P1D" signed -> valid under negative: true)
  -> no fire. Before EC-22 the native lane dropped the negative= kwarg and over-fired on the
  signed value. Row 2: PCEVLINT malformed -> fires, and the finding names PCEVLINT alone -
  the pre-split union [PCEVLINT, PCELTM, PCDUR] was the mis-attribution the split removes.
  Row 2's PCELTM stays valid so the sibling is silent here.
python_source: rules-sendig-3-1-1.json (CDISC-SEND-0059.1)
rule:
  coreId: CDISC-SEND-0059.1
datasets:
  PC:
    row_key: [STUDYID, USUBJID, PCSEQ]
    rows:
      - {STUDYID: S1, DOMAIN: PC, USUBJID: '001', PCSEQ: 1, PCEVLINT: 'P1D', PCELTM: '-P1D', PCDUR: 'P2D'}
      - {STUDYID: S1, DOMAIN: PC, USUBJID: '002', PCSEQ: 2, PCEVLINT: 'not-a-dur', PCELTM: '-P1D', PCDUR: 'P2D'}
config:
  standard: sendig
  standard_version: '3.1.1'
library_mocks:
  classes:
    findings: [PC]
expected_violations:
  - rule_id: CDISC-SEND-0059.1
    dataset: PC
    row_key: {STUDYID: S1, USUBJID: '002', PCSEQ: 2}
    status: SUCCESS
    output_variables:
      PCEVLINT: not-a-dur
expected_errors: []
