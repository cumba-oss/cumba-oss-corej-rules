name: CDISC-CG0358
kind: rule
description: |
  Record-Data port. CDISC-CG0358: SBSTRAIN must not be present in the DM dataset.
  Single Check leaf: SBSTRAIN exists. The DM row carries a SBSTRAIN column, so the
  rule fires.
python_source: rules-sdtmig-3-4.json (CORE-000176)
rule:
  coreId: CDISC-CG0358
datasets:
  DM:
    row_key: [STUDYID, USUBJID]
    rows:
      - {STUDYID: S1, DOMAIN: DM, USUBJID: '001', SBSTRAIN: STRAIN1}
config:
  standard: sdtmig
  standard_version: '3.4'
library_mocks:
  classes:
    special-purpose: [DM]
expected_violations:
  - rule_id: CDISC-CG0358
    dataset: DM
    row_key: {STUDYID: S1, USUBJID: '001'}
    status: SUCCESS
    output_variables:
      SBSTRAIN: STRAIN1
expected_errors: []
