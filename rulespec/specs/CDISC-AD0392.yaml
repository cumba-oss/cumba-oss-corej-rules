name: CDISC-AD0392
kind: rule
description: |
  Wave A4 port — T1a PlainSimple.
  CDISC-AD0392: ATOXGRN is populated while ATOXGR is empty.
  Record-data rule scoped to BDS/OCCDS; non_empty + empty pair.
python_source: rules-adamig-1-3.json (CDISC-AD0392)
rule:
  coreId: CDISC-AD0392
datasets:
  ADLB:
    row_key: [STUDYID, USUBJID, PARAMCD]
    rows:
      - {STUDYID: S1, USUBJID: '001', PARAMCD: 'HGB', ATOXGRN: '', ATOXGR: ''}      # ok
      - {STUDYID: S1, USUBJID: '002', PARAMCD: 'HGB', ATOXGRN: '1', ATOXGR: ''}     # bad
config:
  standard: adamig
  standard_version: '1.3'
library_mocks:
  classes:
    basic data structure: [ADLB]
expected_violations:
  - rule_id: CDISC-AD0392
    dataset: ADLB
    row_key: {PARAMCD: HGB, STUDYID: S1, USUBJID: '002'}
    status: SUCCESS
    output_variables:
      ATOXGR: null
      ATOXGRN: '1'
expected_errors: []
