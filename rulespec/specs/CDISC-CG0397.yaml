name: CDISC-CG0397
kind: rule
description: |
  Wave 8 port — --STRESC empty when --ORRES populated or --DRVFL = Y. Fix #17 resolves `--`-prefixed
  Output_Variables against the primary domain prefix.
python_source: rules-sdtmig-3-4.json (CORE-000021)
rule:
  coreId: CDISC-CG0397
datasets:
  LB:
    row_key: [STUDYID, USUBJID, LBSEQ]
    rows:
      - {STUDYID: S1, DOMAIN: LB, USUBJID: '001', LBSEQ: 1, LBORRES: '5', LBDRVFL: '', LBSTRESC: '5.0'}
      - {STUDYID: S1, DOMAIN: LB, USUBJID: '002', LBSEQ: 1, LBORRES: '5', LBDRVFL: '', LBSTRESC: ''}
config:
  standard: sdtmig
  standard_version: '3.4'
library_mocks:
  classes:
    findings: [LB]
expected_violations:
  - rule_id: CDISC-CG0397
    dataset: LB
    row_key: {LBSEQ: 1, STUDYID: S1, USUBJID: '002'}
    status: SUCCESS
    output_variables:
      LBDRVFL:
      LBORRES: '5'
expected_errors: []
