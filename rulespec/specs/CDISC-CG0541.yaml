name: CDISC-CG0541
kind: rule
description: |
  Wave 8 port — --LOBXFL must be Y or empty (4 output variables). Fix #17 resolves `--`-prefixed
  Output_Variables against the primary domain prefix.
python_source: rules-sdtmig-3-4.json (CORE-000170)
rule:
  coreId: CDISC-CG0541
datasets:
  LB:
    row_key: [STUDYID, USUBJID, LBSEQ]
    rows:
      - {STUDYID: S1, DOMAIN: LB, USUBJID: '001', LBSEQ: 1, LBCAT: HEMATOLOGY, LBTEST: Hemoglobin, LBTESTCD: HGB, LBLOBXFL: Y}
      - {STUDYID: S1, DOMAIN: LB, USUBJID: '002', LBSEQ: 1, LBCAT: HEMATOLOGY, LBTEST: Hemoglobin, LBTESTCD: HGB, LBLOBXFL: N}
config:
  standard: sdtmig
  standard_version: '3.4'
library_mocks:
  classes:
    findings: [LB]
expected_violations:
  - rule_id: CDISC-CG0541
    dataset: LB
    row_key: {LBSEQ: 1, STUDYID: S1, USUBJID: '002'}
    status: SUCCESS
    output_variables:
      LBLOBXFL: N
expected_errors: []
