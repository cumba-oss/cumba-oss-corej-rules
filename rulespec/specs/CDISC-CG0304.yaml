name: CDISC-CG0304
kind: rule
description: |
  Record-Data plain. CDISC-CG0304: AEREASND must not be present. Single leaf
  AEREASND exists. Scope AE; row sets AEREASND so the column exists and fires.
python_source: rules-sdtmig-3-4.json (CORE-000075)
rule:
  coreId: CDISC-CG0304
datasets:
  AE:
    row_key: [STUDYID, USUBJID, __row_number__]
    rows:
      - {STUDYID: S1, DOMAIN: AE, USUBJID: '001', AEREASND: Some reason}
config:
  standard: sdtmig
  standard_version: '3.4'
library_mocks:
  classes:
    events: [AE]
expected_violations:
  - rule_id: CDISC-CG0304
    dataset: AE
    row_key: {STUDYID: S1, USUBJID: '001', __row_number__: 0}
    status: SUCCESS
    output_variables:
      AEREASND: Some reason
expected_errors: []
