name: CDISC-CG0114
kind: rule
description: |
  Wave 11 port - --DOSU empty when --DOSE/--DOSTXT/--DOSTOT is populated. Covers harder plain bucket:
  complex operators (is_inconsistent_across_dataset, is_not_unique_set,
  target_is_not_sorted_by, inconsistent_enumerated_columns) or multi-leaf
  composite checks that Waves 8-10 did not reach.
python_source: rules-sdtmig-3-4.json (CORE-000093)
rule:
  coreId: CDISC-CG0114
datasets:
  EX:
    row_key: [STUDYID, USUBJID, EXSEQ]
    rows:
      - {STUDYID: S1, DOMAIN: EX, USUBJID: '001', EXSEQ: 1, EXDOSE: '10', EXDOSTXT: '', EXDOSTOT: '', EXDOSU: mg}
      - {STUDYID: S1, DOMAIN: EX, USUBJID: '002', EXSEQ: 2, EXDOSE: '10', EXDOSTXT: '', EXDOSTOT: '', EXDOSU: ''}
config:
  standard: sdtmig
  standard_version: '3.4'
library_mocks:
  classes:
    interventions: [EX]
expected_violations:
  - rule_id: CDISC-CG0114
    dataset: EX
    row_key: {EXSEQ: 2, STUDYID: S1, USUBJID: '002'}
    status: SUCCESS
    output_variables:
      EXDOSE: '10'
      EXDOSTOT:
      EXDOSTXT:
      EXDOSU:
expected_errors: []
