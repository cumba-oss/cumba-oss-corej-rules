name: CDISC-CG0069-guarded
kind: rule
description: |
  Guarded counterpart to CORE-000034-empty — proves the date_not_equal_to empty-target
  divergence disappears once non_empty(DSSTDTC) is prepended to Check.all.

  Same data as CORE-000034-empty. With the guard, the empty-DSSTDTC rows (L1, B1) fail
  non_empty before the date comparison, so coreJ no longer fires them — matching Python.
  The comparator-empty row (R1) was already agreement (both no-fire). The populated
  control (V1) still fires on both engines. Result: zero divergence, NOT baselined,
  passes both lanes.
python_notes: |
  With non_empty(DSSTDTC) both engines emit exactly one violation (V1).
python_source: rules-sdtmig-3-4.json (CORE-000034) + PLAN-empty-string-membership-parity.md
rule:
  coreId: CDISC-CG0069
datasets:
  DS:
    row_key: [STUDYID, USUBJID, DSSEQ]
    rows:
      - {STUDYID: S1, DOMAIN: DS, USUBJID: 'L1', DSSEQ: 1, DSDECOD: DEATH, DSSTDTC: ''}            # guarded out
      - {STUDYID: S1, DOMAIN: DS, USUBJID: 'B1', DSSEQ: 1, DSDECOD: DEATH, DSSTDTC: ''}            # guarded out
      - {STUDYID: S1, DOMAIN: DS, USUBJID: 'R1', DSSEQ: 1, DSDECOD: DEATH, DSSTDTC: '2026-01-01'}  # comparator empty → no fire (both)
      - {STUDYID: S1, DOMAIN: DS, USUBJID: 'V1', DSSEQ: 1, DSDECOD: DEATH, DSSTDTC: '2026-01-01'}  # real violation → fires (both)
  DM:
    row_key: [STUDYID, USUBJID]
    rows:
      - {STUDYID: S1, DOMAIN: DM, USUBJID: 'L1', DTHDTC: '2026-01-01'}
      - {STUDYID: S1, DOMAIN: DM, USUBJID: 'B1', DTHDTC: ''}
      - {STUDYID: S1, DOMAIN: DM, USUBJID: 'R1', DTHDTC: ''}
      - {STUDYID: S1, DOMAIN: DM, USUBJID: 'V1', DTHDTC: '2026-01-02'}
config:
  standard: sdtmig
  standard_version: '3.4'
library_mocks:
  classes:
    events: [DS]
    special-purpose: [DM]
expected_violations:
  - rule_id: CDISC-CG0069
    dataset: DS
    row_key: {STUDYID: S1, USUBJID: 'V1', DSSEQ: 1}
    status: SUCCESS
    output_variables:
      DM.DTHDTC: '2026-01-02'
      DSDECOD: DEATH
      DSSTDTC: '2026-01-01'
expected_errors: []
