name: EMPTYSTR-regex-empty
kind: check_operator
description: |
  Empty-string parity (PLAN-empty-string-membership-parity, Category A.3).
  matches_regex "^$" fires on an empty cell — the pattern is evaluated against ""
  literally. Aligned: both engines flag the empty row. No baseline entry.
python_source: PLAN-empty-string-membership-parity.md (A.3)
check:
  expression: 'AESER =~ /^$/'
datasets:
  AE:
    row_key: [STUDYID, USUBJID, AESEQ]
    rows:
    - {STUDYID: S1, USUBJID: '001', AESEQ: 1, AESER: 'AB'}    # non-empty → no match
    - {STUDYID: S1, USUBJID: '002', AESEQ: 1, AESER: ''}      # empty → matches "^$"
config:
  standard: sdtmig
  standard_version: '3.4'
expected_violations:
- rule_id: AUTO-EMPTYSTR-regex-empty
  dataset: AE
  row_key: {STUDYID: S1, USUBJID: '002', AESEQ: 1}
  status: SUCCESS
  output_variables:
    AESEQ: '1'
    AESER:
    STUDYID: S1
    USUBJID: '002'
expected_errors: []
