name: CDISC-CG0423
kind: rule
description: |
  Wave 8 port — --VAMT populated but --TRTV empty. Fix #17 resolves `--`-prefixed
  Output_Variables against the primary domain prefix.
python_source: rules-sdtmig-3-4.json (CORE-000100)
rule:
  coreId: CDISC-CG0423
datasets:
  EX:
    row_key: [STUDYID, USUBJID, EXSEQ]
    rows:
      - {STUDYID: S1, DOMAIN: EX, USUBJID: '001', EXSEQ: 1, EXVAMT: '', EXTRTV: SALINE}
      - {STUDYID: S1, DOMAIN: EX, USUBJID: '002', EXSEQ: 1, EXVAMT: '5', EXTRTV: ''}
config:
  standard: sdtmig
  standard_version: '3.4'
library_mocks:
  classes:
    interventions: [EX]
expected_violations:
  - rule_id: CDISC-CG0423
    dataset: EX
    row_key: {EXSEQ: 1, STUDYID: S1, USUBJID: '002'}
    status: SUCCESS
    output_variables:
      EXTRTV:
      EXVAMT: '5'
expected_errors: []
