name: CDISC-CG0234-empty
kind: rule
description: |
  Empty-string parity demo for CDISC-CG0234's date_equal_to leaf
  (PLAN-empty-string-membership-parity, date-operator family). Domain AE (the --
  wildcard resolves to AE: --ENTPT→AEENTPT, --ENRTPT→AEENRTPT, --DTC→AEDTC).

  Check leaf `--ENTPT date_equal_to --DTC`. The divergence here is on the COMPARATOR
  (--DTC), the mirror of the date_not_equal_to case: when --DTC is empty and --ENTPT is
  a complete date, the honest coreJ engine fires (compareIso(date,'')==0 → date_equal_to
  true); Python's compare_dates returns False for the non-comparable operand and does not.

  The rule already guards the TARGET --ENTPT (non_empty + is_complete_date), so the
  target-empty corner can't arise; only the unguarded comparator --DTC diverges. Closing
  guard: non_empty(--DTC) (see CDISC-CG0234-guarded).
python_notes: |
  Captured-from-Java (lane: python). coreJ fires D1 (empty --DTC comparator) + the
  populated control C1; Python fires only C1.
python_source: rules-sdtmig-3-4.json (CORE-000324) + PLAN-empty-string-membership-parity.md
rule:
  coreId: CDISC-CG0234
datasets:
  AE:
    row_key: [STUDYID, USUBJID, AESEQ]
    rows:
      # D1 — --ENTPT complete date, --DTC (comparator) empty, --ENRTPT not in allowed list.
      #      coreJ fires (date_equal_to empty comparator), Python does not. DIVERGENCE.
      - {STUDYID: S1, DOMAIN: AE, USUBJID: D1, AESEQ: 1, AEENTPT: '2026-01-01', AEDTC: '', AEENRTPT: AFTER}
      # C1 — --ENTPT == --DTC (equal complete dates), --ENRTPT not in allowed list → both fire. CONTROL.
      - {STUDYID: S1, DOMAIN: AE, USUBJID: C1, AESEQ: 1, AEENTPT: '2026-01-01', AEDTC: '2026-01-01', AEENRTPT: AFTER}
      # N1 — equal dates but --ENRTPT in allowed list → is_not_contained_by false → no fire (both). CONTROL.
      - {STUDYID: S1, DOMAIN: AE, USUBJID: N1, AESEQ: 1, AEENTPT: '2026-01-01', AEDTC: '2026-01-01', AEENRTPT: BEFORE}
config:
  standard: sdtmig
  standard_version: '3.4'
expected_violations:
  # D1 — --DTC (date_equal_to comparator) empty. coreJ fires; Python does not.
  - rule_id: CDISC-CG0234
    dataset: AE
    row_key: {AESEQ: 1, STUDYID: S1, USUBJID: C1}
    status: SUCCESS
    output_variables:
      AEDTC: '2026-01-01'
      AEENRTPT: AFTER
      AEENTPT: '2026-01-01'
expected_errors: []
