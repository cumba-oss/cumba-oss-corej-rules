name: CDISC-CG0313
kind: rule
description: |
  Record-Data port. CDISC-CG0313: STUDYID must be present in interventions/events/findings
  datasets. The AE row omits STUDYID so the rule fires. Narrowed to the STUDYID half by the
  R-5.25 wave-3 split (--SEQ, DOMAIN and the USUBJID/POOLID group are CDISC-CG0313-A/-B/-C).

  EC-55 (2026-08-12): re-baselined JAVA-CANONICAL. The rule ships no authored Output_Variables,
  so coreJ emits the check-referenced variables that are present - and after the wave-3 split the
  narrowed Check references only STUDYID, the absent column under test, so the emitted set is
  empty (re-measured from a run 2026-09-12). Detection is unchanged; no engine change.
python_source: rules-sdtmig-3-2.json (CORE-000585)
rule:
  coreId: CDISC-CG0313
datasets:
  AE:
    row_key: [USUBJID, AESEQ, __row_number__]
    rows:
      - {DOMAIN: AE, USUBJID: '001', AESEQ: 1, AETERM: HEADACHE}
config:
  standard: sdtmig
  standard_version: '3.2'
library_mocks:
  classes:
    events: [AE]
expected_violations:
  - rule_id: CDISC-CG0313
    dataset: AE
    row_key: {AESEQ: 1, USUBJID: '001', __row_number__: 0}
    status: SUCCESS
    output_variables: {}
expected_errors: []
