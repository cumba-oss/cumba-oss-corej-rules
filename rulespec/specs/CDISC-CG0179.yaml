name: CDISC-CG0179
kind: rule
description: |
  Wave 2 port — operation shape (cleaner than CORE-000846).
  CDISC-CG0179: IE.IETESTCD must appear in TI.IETESTCD. Operation `distinct` collects all
  IETESTCD values from TI; check fires when an IE row's IETESTCD isn't in that set.
python_source: rules-sdtmig-3-4.json (CORE-000228)
rule:
  coreId: CDISC-CG0179
datasets:
  IE:
    row_key: [STUDYID, USUBJID, IESEQ]
    rows:
      - {STUDYID: S1, DOMAIN: IE, USUBJID: '001', IESEQ: 1, IETESTCD: INCL01}        # ok (in TI)
      - {STUDYID: S1, DOMAIN: IE, USUBJID: '002', IESEQ: 1, IETESTCD: EXCL01}        # ok (in TI)
      - {STUDYID: S1, DOMAIN: IE, USUBJID: '003', IESEQ: 1, IETESTCD: INCL99}        # bad (not in TI)
  TI:
    row_key: [STUDYID, IETESTCD]
    rows:
      - {STUDYID: S1, DOMAIN: TI, IETESTCD: INCL01, IETEST: Adult subject}
      - {STUDYID: S1, DOMAIN: TI, IETESTCD: EXCL01, IETEST: Pregnant}
config:
  standard: sdtmig
  standard_version: '3.4'
library_mocks:
  classes:
    findings: [IE]
    trial design: [TI]
expected_violations:
  - rule_id: CDISC-CG0179
    dataset: IE
    row_key: {IESEQ: 1, STUDYID: S1, USUBJID: '003'}
    status: SUCCESS
    output_variables:
      $ti_ietestcd: '[EXCL01, INCL01]'
      IETESTCD: INCL99
expected_errors: []
