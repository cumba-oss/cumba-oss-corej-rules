  AE:
    row_key: [STUDYID, USUBJID, AESEQ]
    rows:
      - {STUDYID: S1, DOMAIN: AE, USUBJID: '001', AESEQ: 1, AESCONG: Y}
      - {STUDYID: S1, DOMAIN: AE, USUBJID: '002', AESEQ: 1, AESCONG: MAYBE}
config:
  standard: sdtmig
  standard_version: '3.4'
library_mocks:
