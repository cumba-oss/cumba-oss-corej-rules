name: CDISC-AD0362
kind: rule
description: |
  Wave A3 port — T1a PlainSimple. Re-authored 2026-09-17 (terminal review H2 of
  PLAN-typed-expression-engine): CDISC-AD0362: ASTDTM must not be greater than AENDTM.
  Record-data rule scoped to ALL classes; single bare-leaf Check (no outer all/any wrapper).
  History: until 2026-09-17 this fixture shipped ASTDTM/AENDTM as Char ISO datetime strings to
  document the legacy bare-leaf 'greater_than on datetime strings' quirk (both engines emitted
  zero violations; later a catalogued STATUS+ERRORS divergence when the column-type gate made
  the Char/numeric mismatch an ERROR). That record could not discriminate the rule at all —
  inverting the comparison left it green. Production types ASTDTM/AENDTM as Num in every
  ADaMIG, so the fixture now ships numeric datetime values and the bad row FIRES, per the
  divergence entry's own resolution note.
python_source: rules-adamig-1-3.json (CDISC-AD0362)
rule:
  coreId: CDISC-AD0362
datasets:
  ADLB:
    row_key: [STUDYID, USUBJID, PARAMCD]
    rows:
      - {STUDYID: S1, USUBJID: '001', PARAMCD: 'HGB', ASTDTM: 1893484800, AENDTM: 1893492000}   # ok
      - {STUDYID: S1, USUBJID: '002', PARAMCD: 'HGB', ASTDTM: 1896256800, AENDTM: 1896249600}   # bad: start after end
config:
  standard: adamig
  standard_version: '1.3'
library_mocks:
  classes:
    basic data structure: [ADLB]
expected_violations:
  - rule_id: CDISC-AD0362
    dataset: ADLB
    row_key: {STUDYID: S1, USUBJID: '002', PARAMCD: 'HGB'}
    status: SUCCESS
    output_variables:
      ASTDTM: '1896256800'
      AENDTM: '1896249600'
expected_errors: []
