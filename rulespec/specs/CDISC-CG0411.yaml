name: CDISC-CG0411
kind: rule
description: |
  Record-Data. CORE-000203: in a SUPP-- dataset, when RDOMAIN='DM' the (USUBJID,QNAM)
  combination must be unique. Two SUPPDM rows share USUBJID=001 and QNAM=SAFFL so the
  is_not_unique_set leaf fires for both rows. Narrowed to the DM half by the R-5.25
  wave-3 split (the non-DM half is CORE-000203-A); Output_Variables no longer carries
  IDVAR/IDVARVAL, which play no part on a DM record - fixing that mis-attribution is
  the point of the split.
python_source: rules-sdtmig-3-4.json (CORE-000203)
rule:
  coreId: CDISC-CG0411
datasets:
  SUPPDM:
    row_key: [STUDYID, USUBJID, IDVAR, IDVARVAL, QNAM, __row_number__]
    rows:
      - {STUDYID: S1, RDOMAIN: DM, USUBJID: '001', IDVAR: '', IDVARVAL: '', QNAM: SAFFL, QLABEL: Safety, QVAL: Y}
      - {STUDYID: S1, RDOMAIN: DM, USUBJID: '001', IDVAR: '', IDVARVAL: '', QNAM: SAFFL, QLABEL: Safety, QVAL: N}
config:
  standard: sdtmig
  standard_version: '3.4'
library_mocks:
  classes:
    relationship: [SUPPDM]
expected_violations:
  - rule_id: CDISC-CG0411
    dataset: SUPPDM
    row_key: {IDVAR: '', IDVARVAL: '', QNAM: SAFFL, STUDYID: S1, USUBJID: '001', __row_number__: 0}
    status: SUCCESS
    output_variables:
      QNAM: SAFFL
      RDOMAIN: DM
  - rule_id: CDISC-CG0411
    dataset: SUPPDM
    row_key: {IDVAR: '', IDVARVAL: '', QNAM: SAFFL, STUDYID: S1, USUBJID: '001', __row_number__: 1}
    status: SUCCESS
    output_variables:
      QNAM: SAFFL
      RDOMAIN: DM
expected_errors: []
