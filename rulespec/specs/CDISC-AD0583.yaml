name: CDISC-AD0583
kind: rule
description: |
  Wave B3 port — T1b PlainIntermediate.
  CDISC-AD0583: more than one BCHGCATy for a given BCHG within PARAMCD
  Record-data rule scoped to BASIC DATA STRUCTURE + MEDICAL DEVICE BASIC DATA STRUCTURE.
  Uses has_multiple_values_for (within PARAMCD) — Python's DataframeType lacks this operator
  (Python engine gap), so this spec baselines on the Python lane; expected matches Java.
python_source: rules-adamig-1-3.json (CDISC-AD0583)
rule:
  coreId: CDISC-AD0583
datasets:
  ADLB:
    row_key: [STUDYID, USUBJID, PARAMCD, AVISITN]
    column_types:
      AVISITN: LONG
    rows:
      - {STUDYID: S1, USUBJID: '001', PARAMCD: 'HGB', AVISITN: 1, BCHGCATy: 'A', BCHG: '1'}
      - {STUDYID: S1, USUBJID: '001', PARAMCD: 'HGB', AVISITN: 2, BCHGCATy: 'B', BCHG: '1'}
      - {STUDYID: S1, USUBJID: '002', PARAMCD: 'HGB', AVISITN: 1, BCHGCATy: 'C', BCHG: '2'}
config:
  standard: adamig
  standard_version: '1.3'
library_mocks:
  classes:
    basic data structure: [ADLB]
expected_violations:
  - rule_id: CDISC-AD0583
    dataset: ADLB
    row_key: {STUDYID: S1, USUBJID: '001', PARAMCD: 'HGB', AVISITN: 1}
    status: SUCCESS
    output_variables:
      BCHGCATy: 'A'
      BCHG: '1'
      PARAMCD: 'HGB'
  - rule_id: CDISC-AD0583
    dataset: ADLB
    row_key: {STUDYID: S1, USUBJID: '001', PARAMCD: 'HGB', AVISITN: 2}
    status: SUCCESS
    output_variables:
      BCHGCATy: 'B'
      BCHG: '1'
      PARAMCD: 'HGB'
expected_errors: []
