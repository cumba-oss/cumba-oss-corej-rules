name: CDISC-CG0530
kind: rule
description: |
  Wave 7 port — DM: ARMNRS populated ⇒ RFENDTC shouldn't be (unscreened subjects
  shouldn't have a last study date). Simple two-leaf non_empty intersection.
python_source: rules-sdtmig-3-4.json (CORE-000192)
rule:
  coreId: CDISC-CG0530
datasets:
  DM:
    rows:
      - {STUDYID: S1, DOMAIN: DM, USUBJID: '001', ARMNRS: '', RFENDTC: '2023-06-30'}                   # ok
      - {STUDYID: S1, DOMAIN: DM, USUBJID: '002', ARMNRS: NOT ASSIGNED, RFENDTC: ''}                   # ok
      - {STUDYID: S1, DOMAIN: DM, USUBJID: '003', ARMNRS: NOT ASSIGNED, RFENDTC: '2023-06-30'}         # bad
config:
  standard: sdtmig
  standard_version: '3.4'
library_mocks:
  classes:
    special-purpose: [DM]
expected_violations:
  - rule_id: CDISC-CG0530
    dataset: DM
    row_key: {STUDYID: S1, USUBJID: '003'}
    status: SUCCESS
    output_variables:
      ARMNRS: NOT ASSIGNED
      RFENDTC: '2023-06-30'
expected_errors: []
