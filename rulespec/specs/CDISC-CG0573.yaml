name: CDISC-CG0573
kind: rule
description: |
  Wave 16 port - Fix17 leftover edge case. --TPT inconsistent across same (VISITNUM, --TPTREF, --TPTNUM).
python_source: rules-sdtmig-3-4.json (CORE-000689)
rule:
  coreId: CDISC-CG0573
datasets:
  AE:
    row_key: [STUDYID, USUBJID, AESEQ]
    column_types:
      VISITNUM: LONG
      AETPTNUM: LONG
    rows:
      - {STUDYID: S1, DOMAIN: AE, USUBJID: '001', AESEQ: 1, VISITNUM: 1, AETPTREF: SCREENING, AETPTNUM: 1, AETPT: HOUR 1}
      - {STUDYID: S1, DOMAIN: AE, USUBJID: '002', AESEQ: 1, VISITNUM: 1, AETPTREF: SCREENING, AETPTNUM: 1, AETPT: HOUR 2}
config:
  standard: sdtmig
  standard_version: '3.3'
library_mocks:
  classes:
    events: [AE]
expected_violations:
  - rule_id: CDISC-CG0573
    dataset: AE
    row_key: {AESEQ: 1, STUDYID: S1, USUBJID: '001'}
    status: SUCCESS
    output_variables:
      AETPT: HOUR 1
      AETPTNUM: '1'
      AETPTREF: SCREENING
      VISITNUM: '1'
  - rule_id: CDISC-CG0573
    dataset: AE
    row_key: {AESEQ: 1, STUDYID: S1, USUBJID: '002'}
    status: SUCCESS
    output_variables:
      AETPT: HOUR 2
      AETPTNUM: '1'
      AETPTREF: SCREENING
      VISITNUM: '1'
expected_errors: []
