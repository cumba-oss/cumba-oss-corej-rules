name: CDISC-AD0804
kind: rule
description: |
  Wave D8 port - T3-VMC Variable Metadata Check. BDS/ADLB: STUDYIDN exists
  and STUDYID not_exists. Baselined on Python lane under Finding #9 (VMC
  dataset projection divergence).
python_notes: |
  Known divergence (Finding #9): Python swaps the dataset for a
  VariablesMetadataDatasetBuilder projection before evaluating the Check,
  so `exists(STUDYIDN)` / `not_exists(STUDYID)` resolve against meta-field
  columns and yield 0 violations. Java evaluates the leaves against the
  original column metadata and fires correctly.
python_source: rules-adamig-1-3.json (CDISC-AD0804)
rule:
  coreId: CDISC-AD0804
datasets:
  ADLB:
    row_key: [USUBJID, PARAMCD, AVISITN]
    column_types:
      AVISITN: LONG
      STUDYIDN: LONG
    rows:
      - {USUBJID: '001', PARAMCD: HGB, AVISITN: 1, STUDYIDN: 1}
config:
  standard: adamig
  standard_version: '1.3'
library_mocks:
  classes:
    basic data structure: [ADLB]
expected_violations:
  - rule_id: CDISC-AD0804
    dataset: ADLB
    row_key: {USUBJID: '001', PARAMCD: HGB, AVISITN: 1}
    status: SUCCESS
    output_variables: {}
    name_only: [STUDYIDN]
expected_errors: []
