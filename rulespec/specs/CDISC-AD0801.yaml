name: CDISC-AD0801
kind: rule
description: |
  Wave A9 port — T1a PlainSimple.
  CDISC-AD0801: STUDYIDN is populated and STUDYID is not populated.
  Record-data rule scoped to BASIC DATA STRUCTURE; non_empty + empty pair.
python_source: rules-adamig-1-3.json (CDISC-AD0801)
rule:
  coreId: CDISC-AD0801
datasets:
  ADLB:
    row_key: [STUDYID, USUBJID, PARAMCD]
    rows:
      - {STUDYID: '',  USUBJID: '001', PARAMCD: 'HGB', STUDYIDN: ''}      # ok (STUDYIDN empty)
      - {STUDYID: '',  USUBJID: '002', PARAMCD: 'HGB', STUDYIDN: '1'}     # bad (STUDYIDN populated, STUDYID empty)
config:
  standard: adamig
  standard_version: '1.3'
library_mocks:
  classes:
    basic data structure: [ADLB]
expected_violations:
  - rule_id: CDISC-AD0801
    dataset: ADLB
    row_key: {PARAMCD: HGB, STUDYID: '', USUBJID: '002'}
    status: SUCCESS
    output_variables:
      STUDYID: null
      STUDYIDN: '1'
expected_errors: []
