name: CDISC-CG0240
kind: rule
description: |
  Wave 11 port - --TPT/--TPTNUM inconsistent when VISITNUM and --TPTREF are absent. Covers harder plain bucket:
  complex operators (is_inconsistent_across_dataset, is_not_unique_set,
  target_is_not_sorted_by, inconsistent_enumerated_columns) or multi-leaf
  composite checks that Waves 8-10 did not reach.
python_source: rules-sdtmig-3-4.json (CORE-000141)
rule:
  coreId: CDISC-CG0240
datasets:
  AE:
    row_key: [STUDYID, USUBJID, AESEQ]
    rows:
      - {STUDYID: S1, DOMAIN: AE, USUBJID: '001', AESEQ: 1, AETPT: HOUR 1, AETPTNUM: 1}
      - {STUDYID: S1, DOMAIN: AE, USUBJID: '002', AESEQ: 2, AETPT: HOUR 2, AETPTNUM: 2}
      - {STUDYID: S1, DOMAIN: AE, USUBJID: '003', AESEQ: 3, AETPT: HOUR 2, AETPTNUM: 99}
config:
  standard: sdtmig
  standard_version: '3.4'
library_mocks:
  classes:
    events: [AE]
expected_violations:
  - rule_id: CDISC-CG0240
    dataset: AE
    row_key: {AESEQ: 2, STUDYID: S1, USUBJID: '002'}
    status: SUCCESS
    output_variables:
      AETPT: HOUR 2
      AETPTNUM: '2'
  - rule_id: CDISC-CG0240
    dataset: AE
    row_key: {AESEQ: 3, STUDYID: S1, USUBJID: '003'}
    status: SUCCESS
    output_variables:
      AETPT: HOUR 2
      AETPTNUM: '99'
expected_errors: []
