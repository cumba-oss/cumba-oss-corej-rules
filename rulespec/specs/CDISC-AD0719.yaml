name: CDISC-AD0719
kind: rule
description: |
  Wave D8 port - T3-VMC Variable Metadata Check requiring that at least one
  of the subject-level or record-level treatment variables defined in the
  IG (ADaMIG Tables 3.2.4 / 3.3.2.1; since 2026-09-28 the sixteen indexed
  families are Requirements.Variables.None templates and the ten un-indexed
  variables are Check literals) appear in a BDS dataset.
  Baselined on Python lane under Finding #9 (VMC dataset projection
  divergence).
python_notes: |
  Known divergence (Finding #9): Python swaps the dataset for a
  VariablesMetadataDatasetBuilder projection, so the `not_exists` leaves
  resolve against meta-field columns and yield 0 violations. Java fires
  correctly; expected matches Java's dataset-level violation.
python_source: rules-adamig-1-3.json (CDISC-AD0719)
rule:
  coreId: CDISC-AD0719
datasets:
  ADLB:
    row_key: [STUDYID, USUBJID, PARAMCD, AVISITN]
    column_types:
      AVISITN: LONG
    rows:
      - {STUDYID: S1, USUBJID: '001', PARAMCD: HGB, AVISITN: 1}
config:
  standard: adamig
  standard_version: '1.3'
library_mocks:
  classes:
    basic data structure: [ADLB]
    medical device basic data structure: [ADLB]
expected_violations:
  - rule_id: CDISC-AD0719
    dataset: ADLB
    row_key: {STUDYID: S1, USUBJID: '001', PARAMCD: HGB, AVISITN: 1}
    status: SUCCESS
    output_variables: {}
expected_errors: []
