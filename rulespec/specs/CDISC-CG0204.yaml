name: CDISC-CG0204
kind: rule
description: |
  Record-Data plain (RELATIONSHIP class). CDISC-CG0204: IDVAR populated but
  IDVARVAL empty. Scope SUPP-- -> SUPPDM. Row sets IDVAR=AESEQ with empty
  IDVARVAL so both leaves are satisfied and the rule fires.
python_source: rules-sdtmig-3-4.json (CORE-000135)
rule:
  coreId: CDISC-CG0204
datasets:
  SUPPDM:
    row_key: [STUDYID, USUBJID, IDVAR, QNAM]
    rows:
      - {STUDYID: S1, RDOMAIN: DM, USUBJID: '001', IDVAR: AESEQ, IDVARVAL: '', QNAM: RACE1, QVAL: X}
config:
  standard: sdtmig
  standard_version: '3.4'
library_mocks:
  classes:
    relationship: [SUPPDM]
# PLAN-message-folded-corpus-alignment (2026-10-07): the trigger column is blank or absent on every
# fixture row, so the rule now reports ONE dataset-level finding (Outcome.Message_Folded, D5) where
# it reported per row; the per-row rows were replaced by the collapsed one (anchored at the first
# firing row, columns listed by name).
expected_violations:
- rule_id: CDISC-CG0204
  dataset: SUPPDM
  row_key: {IDVAR: AESEQ, QNAM: RACE1, STUDYID: S1, USUBJID: '001'}
  status: SUCCESS
  output_variables: {}
  name_only: [IDVAR, IDVARVAL]
expected_errors: []
