name: EC43-not-equal-absent-operator
kind: check_operator
description: |
  EC-43's OPERATOR claim, pinned alone: an ABSENT column folds to all-missing, so an intrinsically
  negative comparison against a populated literal is TRUE — the leaf fires. That claim is
  unchanged. ⚠⚠ WHAT CHANGED 2026-09-17 (D111, PLAN-typed-expression-engine.md phase 7): the
  REPORT is now ONE dataset-level finding, no longer one per row. An absent-column-only check is
  dataset-decidable at bind time (D39a: an absent column is a dataset-level constant, D34 #3/#4),
  so `BroadcastFold` evaluates the leaf once and `RuleRunner` emits a single dataset-level
  violation (rendered with row 0's key, like every dataset-level finding). The two-row expectation
  this spec carried from 2026-08-07 until then is retired WITH the ruling, not lost: the
  present-but-all-blank twin `EC43-absent-equals-blank-control` still expects both rows, and the
  deliberate difference between the two files is D111's content.

  ⚠ This makes the spec a filed TWO-LANE DIVERGENCE (`java-only-accepted`): the Python fork folds
  the absent target to all-missing per row (EC-38 / Fix #128) and fires EVERY row, so the lanes
  now differ on report granularity — detection agrees — on every firing absent-column execution.
  See the `EC43-not-equal-absent-operator` entry in `documentation/parity-diff-baseline.json`
  (surfaced through PARITY-DEBT.md).

  ⚑ ADDED 2026-08-07 (wave 13 lane F) in the same change that re-authored `EC43-not-equal-absent`
  from `kind: check_operator` to `kind: rule` to retire EC-63; it kept the operator contract
  pinned when that conversion moved EC-43's claim to the RULE layer.

  ⚠ WHY `not_equal_to_case_insensitive` AND NOT `not_equal_to` — historical: when this spec was
  authored, `NonEmptyGuardInliner` guarded every column-vs-literal negative at load, and only the
  `Expr.Not(equalsIgnoreCase(...))` raise escaped it, keeping the verdict observable. The inliner
  has since been retired (the X1 guard-injection era ended with the expression engine), so the
  spelling is no longer load-bearing — it is kept because rewriting the fixture would re-pin the
  same claim under a different surface for no gain. Case folding is irrelevant to the claim: the
  target is MISSING, not mis-cased. coreJ still routes the shape through
  `ExprCompiler.compileCaseInsensitiveEquality(negate=true)`; the fold now decides it at dataset
  level before any row is read.

  ⚠⚠ WHAT CHANGED 2026-10-07 (Q6, PLAN-message-folded-corpus-alignment): the absent-column fold is
  OPT-IN through `Outcome.Message_Folded`. This fixture rule declares no key, so the fold is
  absent-blind, the leaf is evaluated per row (TSVAL reads as the type default "" on both rows,
  `not equalsIgnoreCase("", "PLANNED")` fires on each), and the report is TWO row findings again —
  the 2026-08-07 shape, now by ruling rather than by the pre-D111 engine. The one-finding report
  is the opted-in rule's (`MessageFoldedLoadGateTest` / `AbsentFoldOptInRunnerTest` in the engine,
  the 666 corpus rules carrying the key); the blank twin `EC43-absent-equals-blank-control` is
  unchanged.
python_notes: |
  `not_equal_to_case_insensitive` is not in the fork's `ABSENT_TARGET_AWARE_OPERATORS`, so EC-38 /
  `Fix #128`'s `_absent_target_as_missing` materialises TSVAL as "" and `_check_inequality` returns
  True on both rows (`both_null` is false because the comparator is a populated literal; "" is
  falsy, so the case-folded target becomes None and `None != "planned"`). The fork therefore
  reports TWO row findings where coreJ reports ONE dataset-level finding since D111 — the filed
  granularity divergence described above.
python_source: EC-43 (PLAN-negative-leaf-absent-column.md Phase 2); split out of EC43-not-equal-absent 2026-08-07
check:
  expression: 'not equalsIgnoreCase(TSVAL, "PLANNED")'
datasets:
  TS:
    row_key: [STUDYID, TSPARMCD, TSSEQ]
    rows:
    # TSVAL is declared nowhere: the column is absent from the dataset entirely.
    - {STUDYID: S1, TSPARMCD: PLANSUB, TSSEQ: 1}
    - {STUDYID: S1, TSPARMCD: ACTSUB, TSSEQ: 2}
config:
  standard: sdtmig
  standard_version: '3.4'
expected_status: EXECUTED
expected_violations:
# TWO row findings (Q6, 2026-10-07): the rule declares no Message_Folded, so the absent column is
# read per row as "" and the negative comparison fires on every record. (One dataset-level finding,
# D111, from 2026-09-17 to 2026-10-07 — the opted-in shape now.)
- rule_id: AUTO-EC43-not-equal-absent-operator
  dataset: TS
  row_key: {STUDYID: S1, TSPARMCD: PLANSUB, TSSEQ: 1}
  status: SUCCESS
  output_variables: {STUDYID: S1, TSPARMCD: PLANSUB, TSSEQ: '1'}
- rule_id: AUTO-EC43-not-equal-absent-operator
  dataset: TS
  row_key: {STUDYID: S1, TSPARMCD: ACTSUB, TSSEQ: 2}
  status: SUCCESS
  output_variables: {STUDYID: S1, TSPARMCD: ACTSUB, TSSEQ: '2'}
expected_errors: []
