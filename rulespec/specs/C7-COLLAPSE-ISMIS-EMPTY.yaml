name: C7-COLLAPSE-ISMIS-EMPTY
kind: rule
description: |
  The is_missing control (register D50: is_missing is strictly MissingValue; "" is not missing):
  over a column that is "" on every record (EMPTY + SINGLE_VALUE) the leaf folds to constant FALSE
  — ZERO findings. The sibling C7-COLLAPSE-ISMIS-MISSING reports ONE over all-missing.
python_source: PLAN-present-empty-column-fold (2026-10-06), the sensitivity arm of phase 3 — an inline rule; no shipped rule opts in
rule:
  id: c7-collapse-is-missing-all-empty-string
  Core: {Id: C7-COLLAPSE-ISMIS-EMPTY}
  Description: "AEBDSYCD must not be a missing value."
  Sensitivity: Record
  Executability: Fully Executable
  Scope:
    Domains: {Include: [AE]}
  Check:
    expression: 'is_missing(AEBDSYCD)'
  Outcome:
    Message: AEBDSYCD is not populated (per record).
    Message_Folded: AEBDSYCD is not populated on any record of the dataset.
    Output_Variables: [AEBDSYCD]
datasets:
  AE:
    row_key: [STUDYID, USUBJID, AESEQ]
    rows:
      - {STUDYID: S1, DOMAIN: AE, USUBJID: '001', AESEQ: 1, AEBODSYS: 'Cardiac', AEBDSYCD: ''}
      - {STUDYID: S1, DOMAIN: AE, USUBJID: '002', AESEQ: 1, AEBODSYS: 'Renal', AEBDSYCD: ''}
config:
  standard: sdtmig
  standard_version: '3.4'
expected_status: EXECUTED
expected_violations: []
expected_errors: []
