name: CDISC-AD0467
kind: rule
description: |
  Wave A6 port — T1a PlainSimple.
  CDISC-AD0467: On a given record, STRATARN is populated and STRATAR is not populated.
  Record-data rule scoped to SUBJECT LEVEL ANALYSIS DATASET; non_empty + empty pair; literal column names per star-as-literal convention.
python_source: rules-adamig-1-3.json (CDISC-AD0467)
rule:
  coreId: CDISC-AD0467
datasets:
  ADSL:
    row_key: [STUDYID, USUBJID]
    rows:
      - {STUDYID: S1, USUBJID: '001', STRATARN: '', STRATAR: ''}      # ok
      - {STUDYID: S1, USUBJID: '002', STRATARN: 'X', STRATAR: ''}      # bad
config:
  standard: adamig
  standard_version: '1.3'
library_mocks:
  classes:
    subject level analysis dataset: [ADSL]
# PLAN-message-folded-corpus-alignment (2026-10-07): the trigger column is blank or absent on every
# fixture row, so the rule now reports ONE dataset-level finding (Outcome.Message_Folded, D5) where
# it reported per row; the per-row rows were replaced by the collapsed one (anchored at the first
# firing row, columns listed by name).
expected_violations:
- rule_id: CDISC-AD0467
  dataset: ADSL
  row_key: {STUDYID: S1, USUBJID: '002'}
  status: SUCCESS
  output_variables: {}
  name_only: [STRATAR, STRATARN]
expected_errors: []
