name: CDISC-CG0028
kind: rule
description: |
  Wave 16 port - Fix17 leftover edge case. --SEQ not unique within (DOMAIN, USUBJID).
python_source: rules-sdtmig-3-4.json (CORE-000544)
rule:
  coreId: CDISC-CG0028
datasets:
  AE:
    row_key: [STUDYID, USUBJID, __row_number__]
    column_types:
      AESEQ: LONG
    rows:
      - {STUDYID: S1, DOMAIN: AE, USUBJID: '001', AESEQ: 1, AETERM: HEADACHE}
      - {STUDYID: S1, DOMAIN: AE, USUBJID: '001', AESEQ: 1, AETERM: MIGRAINE}
config:
  standard: sdtmig
  standard_version: '3.4'
library_mocks:
  classes:
    events: [AE]
# PLAN-message-folded-corpus-alignment (2026-10-07): the trigger column is blank or absent on every
# fixture row, so the rule now reports ONE dataset-level finding (Outcome.Message_Folded, D5) where
# it reported per row; the per-row rows were replaced by the collapsed one (anchored at the first
# firing row, columns listed by name).
expected_violations:
- rule_id: CDISC-CG0028
  dataset: AE
  row_key: {STUDYID: S1, USUBJID: '001', __row_number__: 0}
  status: SUCCESS
  output_variables: {}
  name_only: [DOMAIN]
expected_errors: []
