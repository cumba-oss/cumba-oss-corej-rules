name: CDISC-CG0028
kind: rule
description: |
  Wave 16 port - Fix17 leftover edge case. --SEQ not unique within (DOMAIN, USUBJID).
python_source: rules-sdtmig-3-4.json (CORE-000544)
rule:
  coreId: CDISC-CG0028
datasets:
  AE:
    row_key: [STUDYID, USUBJID, __row_number__]
    column_types:
      AESEQ: LONG
    rows:
      - {STUDYID: S1, DOMAIN: AE, USUBJID: '001', AESEQ: 1, AETERM: HEADACHE}
      - {STUDYID: S1, DOMAIN: AE, USUBJID: '001', AESEQ: 1, AETERM: MIGRAINE}
config:
  standard: sdtmig
  standard_version: '3.4'
library_mocks:
  classes:
    events: [AE]
expected_violations:
  - rule_id: CDISC-CG0028
    dataset: AE
    row_key: {STUDYID: S1, USUBJID: '001', __row_number__: 0}
    status: SUCCESS
    output_variables:
      DOMAIN: AE
  - rule_id: CDISC-CG0028
    dataset: AE
    row_key: {STUDYID: S1, USUBJID: '001', __row_number__: 1}
    status: SUCCESS
    output_variables:
      DOMAIN: AE
