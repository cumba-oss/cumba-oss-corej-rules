name: CDISC-CG0201
kind: rule
description: |
  Wave 13 port - USUBJID/IDVARVAL empty while IDVAR ends with SEQ. Non-wildcard Record-Data rule with
  explicit Output_Variables (no Fix #17 wildcard resolution involved).
python_source: rules-sdtmig-3-4.json (CORE-000136)
rule:
  coreId: CDISC-CG0201
datasets:
  RELREC:
    row_key: [STUDYID, USUBJID, IDVAR, IDVARVAL]
    rows:
      - {STUDYID: S1, DOMAIN: RELREC, USUBJID: '001', IDVAR: AESEQ, IDVARVAL: '1'}
      - {STUDYID: S1, DOMAIN: RELREC, USUBJID: '', IDVAR: AESEQ, IDVARVAL: ''}
config:
  standard: sdtmig
  standard_version: '3.4'
library_mocks:
  classes:
    relationship: [RELREC]
expected_violations:
  - rule_id: CDISC-CG0201
    dataset: RELREC
    row_key: {IDVAR: AESEQ, IDVARVAL: '', STUDYID: S1, USUBJID: ''}
    status: SUCCESS
    output_variables:
      IDVAR: AESEQ
      IDVARVAL:
expected_errors: []
