name: CDISC-AD0581
kind: rule
description: |
  Wave D6 port - T3-VMC Variable Metadata Check requiring that none of
  14 treatment/arm variables appear in the BDS dataset. Baselined on
  Python lane under Finding #9 (VMC dataset projection divergence).
python_notes: |
  Known divergence (Finding #9): Python swaps the dataset for a
  VariablesMetadataDatasetBuilder projection, so the `not_exists` leaves
  resolve against meta-field columns and yield 0 violations. Java fires
  correctly; expected matches Java's dataset-level violation.
python_source: rules-adamig-1-3.json (CDISC-AD0581)
rule:
  coreId: CDISC-AD0581
datasets:
  ADLB:
    row_key: [STUDYID, USUBJID, PARAMCD, AVISITN]
    column_types:
      AVISITN: LONG
    rows:
      - {STUDYID: S1, USUBJID: '001', PARAMCD: HGB, AVISITN: 1}
config:
  standard: adamig
  standard_version: '1.3'
library_mocks:
  classes:
    basic data structure: [ADLB]
    medical device basic data structure: [ADLB]
expected_violations:
  - rule_id: CDISC-AD0581
    dataset: ADLB
    row_key: {STUDYID: S1, USUBJID: '001', PARAMCD: HGB, AVISITN: 1}
    status: SUCCESS
    output_variables: {}
expected_errors: []
