name: CDISC-CG0455
kind: rule
description: |
  Record-Data port. CDISC-CG0455: when TSPARMCD=PCLAS the TSVCDREF must equal MED-RT.
  TS row sets TSPARMCD=PCLAS and TSVCDREF=OTHER (not MED-RT), satisfying both leaves so
  the rule fires.
python_source: rules-sdtmig-3-3.json (CORE-000483)
rule:
  coreId: CDISC-CG0455
datasets:
  TS:
    row_key: [STUDYID, TSPARMCD, TSSEQ]
    rows:
      - {STUDYID: S1, DOMAIN: TS, TSSEQ: 1, TSPARMCD: PCLAS, TSVAL: X, TSVCDREF: OTHER}
config:
  standard: sdtmig
  standard_version: '3.3'
library_mocks:
  classes:
    trial design: [TS]
expected_violations:
  - rule_id: CDISC-CG0455
    dataset: TS
    row_key: {STUDYID: S1, TSPARMCD: PCLAS, TSSEQ: 1}
    status: SUCCESS
    output_variables:
      TSPARMCD: PCLAS
      TSVCDREF: OTHER
expected_errors: []
